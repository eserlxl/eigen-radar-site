(()=>{let t='dark';try{t=localStorage.getItem('theme')==='light'?'light':'dark'}catch{}
document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;
document.querySelector('meta[name="theme-color"]').content=t==='light'?'#c7d2e0':'#040711'})();
</script>

<style>
  :root{
    --bg:#040711;--bg-soft:#090f1c;--card:#0b111f;--card-hover:#101827;--line:#4b659f;
    --text:#d9e9fb;--muted:#b4aca0;--accent:#5ee3d7;--accent-soft:rgba(94,227,215,.08);
    --amber:#d6c08c;--scheme:dark;--focus:#fff;--on-accent:#040711;
    --drawer-shadow:rgba(0,0,0,.35);--up:#5ee3d7;--down:#f07178;--band:rgba(94,227,215,.16);
    --desk-ai:#2aa79e;--desk-ai-hi:#5ee3d7;--desk-geo:#4b659f;--desk-geo-hi:#8aa0d4;
    --desk-eco:#b8954a;--desk-eco-hi:#d6c08c;--desk-sci:#5b5fd6;--desk-sci-hi:#a5b4fc;
    --page-max:70rem;--radius:14px;
  }
  :root[data-theme="light"]{
    --bg:#c7d2e0;--bg-soft:#d8e2ed;--card:#dde6ef;--card-hover:#d1dce8;--line:#71859d;
    --text:#111827;--muted:#405269;--accent:#005f5a;--accent-soft:rgba(0,95,90,.12);
    --amber:#854100;--scheme:light;--focus:#0f172a;--on-accent:#fff;
    --drawer-shadow:rgba(15,23,42,.22);--up:#005f5a;--down:#b42318;--band:rgba(0,95,90,.14);
    --desk-ai:#005f5a;--desk-ai-hi:#0f766e;--desk-geo:#3f56ad;--desk-geo-hi:#4f6cc4;
    --desk-eco:#854100;--desk-eco-hi:#a35200;--desk-sci:#4338ca;--desk-sci-hi:#4f46e5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme)}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  button,input{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip{position:fixed;left:12px;top:-80px;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;z-index:2;font-weight:800}
  .skip:focus{top:12px}
  .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
  header{border-bottom:1px solid var(--line);background:var(--bg)}
  .header-inner{max-width:var(--page-max);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .logo-mark{width:34px;height:34px;border-radius:9px;display:block;object-fit:contain;flex:0 0 auto}
  .header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
  .header-links{display:flex;align-items:center;gap:10px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 0;border:0;background:transparent;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover,.archive-link:focus-visible{color:var(--text)}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;color:var(--muted);font-size:.78rem;line-height:1;padding:4px 7px;border-radius:99px;opacity:.7;border:0;background:transparent;cursor:pointer;font-family:inherit}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .theme-switch{appearance:none;position:relative;display:block;width:44px;height:24px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
  .theme-switch-thumb{position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;border:1.5px solid var(--accent);border-radius:999px;background:transparent;box-shadow:0 1px 4px var(--drawer-shadow);transition:transform .18s ease}
  :root[data-theme="light"] .theme-switch-thumb{transform:translateX(20px)}
  .theme-switch-icon{grid-area:1/1;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease}
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}
  .wrap{max-width:var(--page-max);margin:0 auto;padding:16px 20px 48px;min-width:0}
  .strip{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .strip-name{font-weight:700;letter-spacing:-.02em}
  .strip-price{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem}
  .strip-change{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem}
  .up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 17.5rem;gap:16px;align-items:stretch;min-height:28.5rem;margin-top:14px}
  .chart-col{min-width:0;display:flex;flex-direction:column;min-height:28.5rem}
  .ranges{display:flex;gap:6px;margin-bottom:8px}
  .range-btn{min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer}
  .range-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);font-weight:700}
  .range-btn:disabled{opacity:.45;cursor:not-allowed}
  .chart-frame{position:relative;flex:1 1 auto;min-height:24rem;height:24rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
  #chart{position:absolute;inset:0}
  .skel{position:absolute;inset:12px;border-radius:10px;background:linear-gradient(90deg,var(--bg-soft),var(--card-hover),var(--bg-soft));background-size:200% 100%;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%{background-position:0 50%}100%{background-position:100% 50%}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
  .error-panel{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:var(--card);z-index:2}
  .error-panel.is-on{display:grid}
  .error-panel p{margin-bottom:12px;color:var(--muted)}
  .retry{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-weight:700}
  .panel{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);display:flex;flex-direction:column;min-height:28.5rem;max-height:28.5rem}
  .panel-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .filter{margin-left:auto;width:8.6rem;min-width:0;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg-soft);color:var(--text)}
  .filter::placeholder{color:var(--muted)}
  .panel-body{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .panel-list{
    flex:1 1 auto;min-height:0;overflow:auto;padding:6px 8px 10px 6px;
    scrollbar-width:auto;scrollbar-color:var(--line) var(--bg-soft);
  }
  .panel-fade{
    position:absolute;left:0;right:0;height:2.6rem;pointer-events:none;opacity:0;z-index:1;
  }
  .panel-fade-above{
    top:0;background:linear-gradient(to bottom,var(--card),transparent);
  }
  .panel-fade-below{
    bottom:0;background:linear-gradient(to top,var(--card) 35%,transparent);
  }
  .panel.has-more-above .panel-fade-above,
  .panel.has-more-below .panel-fade-below{opacity:1}
  .panel-more{
    position:absolute;left:50%;bottom:7px;width:9px;height:9px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:translateX(-50%) rotate(45deg);
  }
  .panel-list::-webkit-scrollbar{width:14px}
  .panel-list::-webkit-scrollbar-track{
    background:var(--bg-soft);border-radius:99px;margin:4px 0;
  }
  .panel-list::-webkit-scrollbar-thumb{
    background:var(--line);border-radius:99px;border:3px solid var(--bg-soft);
  }
  .group-label{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
  .row{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 8px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:pointer}
  .row:hover{background:var(--card-hover)}
  .row.is-on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .row-name{flex:1 1 auto;min-width:0;font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-px{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
  .badge{flex:0 0 auto;display:block}
  .bottom{margin-top:18px;display:grid;gap:8px}
  .blurb{color:var(--text);max-width:62ch}
  .meta{color:var(--muted);font-size:.86rem}
  .model-note{color:var(--muted);font-size:.75rem}
  .legal{margin-top:16px;padding:12px 16px;background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;font-size:.8rem;color:var(--muted)}
  @media(min-width:1440px){html{font-size:106.25%}}
  @media(min-width:1920px){html{font-size:112.5%}}
  @media(min-width:2560px){html{font-size:125%}}
  @media(max-width:900px){
    .stage{grid-template-columns:1fr}
    .panel{max-height:none;min-height:0}
    .panel-body,.panel-list{max-height:18rem}
  }
  @media(max-width:640px){
    .header-inner,.wrap{padding-left:12px;padding-right:12px}
    .header-inner{gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}
    .header-right{gap:7px}
    .header-links{gap:4px}
    .archive-link{min-height:36px;padding:4px 2px}
    .archive-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .strip-price{font-size:1.05rem}
    .chart-frame{min-height:18rem;height:18rem}
    .chart-col,.stage{min-height:0}
    .filter{width:7.4rem}
  }
  @media(max-width:360px){
    .header-inner{padding-inline:8px;gap:4px}
    .header-right{gap:3px}
    .lang-switch{gap:2px;padding:2px}
    .lang-btn{min-width:28px;min-height:34px;padding:3px 4px}
    .theme-switch{width:38px}
    :root[data-theme="light"] .theme-switch-thumb{transform:translateX(14px)}
  }
  @media(max-width:340px){.wrap{padding-inline:10px}.filter{width:6.4rem}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

  .topic-switch{display:flex;align-items:start;gap:6px;margin:0 auto;padding:0;border:0;background:transparent}
  .topic-btn,.markets-nav{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:4px;min-height:44px;min-width:0;padding:6px 10px 8px;border-radius:0;
    color:var(--muted);background:transparent;box-shadow:none;opacity:1;
    position:relative;text-decoration:none;transition:.15s;font-family:inherit;
  }
  .topic-btn svg,.markets-nav svg{
    width:30px;height:30px;display:block;flex:0 0 auto;opacity:.88;
    filter:drop-shadow(0 1px 1.5px var(--drawer-shadow));
  }
  .topic-label{
    font-size:.72rem;font-weight:700;white-space:nowrap;line-height:1;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .topic-btn:hover svg,.topic-btn.active svg,.markets-nav:hover svg,.markets-nav.active svg{opacity:1}
  .topic-btn.active,.markets-nav.active{color:var(--text)}
  .topic-btn.active::after,.markets-nav.active::after,.markets-nav:hover::after{
    content:"";position:absolute;left:22%;right:22%;bottom:2px;height:2px;
    border-radius:1px;background:var(--desk,var(--accent));
  }
  .topic-btn[data-topic="ai"]{--desk:var(--desk-ai-hi)}
  .topic-btn[data-topic="geopolitics"]{--desk:var(--desk-geo-hi)}
  .topic-btn[data-topic="economics-markets"]{--desk:var(--desk-eco-hi)}
  .topic-btn[data-topic="science"]{--desk:var(--desk-sci-hi)}
  .markets-nav{--desk:var(--desk-eco-hi);color:var(--desk-eco-hi);margin-left:0}
  @media(max-width:900px){
    .header-inner { flex-wrap: wrap; }
    .topic-switch { order: 3; width: 100%; justify-content: center; }
  }
  @media(max-width:640px){
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;align-items:start;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:2px;padding:0;border:0;background:transparent;
    }
    .topic-btn,.markets-nav{
      min-width:0;min-height:0;justify-content:flex-start;
      gap:3px;padding:4px 2px 6px;box-shadow:none;margin:0;border:0;
    }
    .topic-btn svg,.markets-nav svg{
      width:clamp(22px,6.8vw,26px);height:clamp(22px,6.8vw,26px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
  }


  .forecast-bg {
    position: absolute; display: none;
    background: var(--accent-soft);
    pointer-events: none; z-index: 1;
    border-left: 1px dashed var(--accent);
  }
  .forecast-label {
    position: absolute; top: -14px; left: 8px;
    font-size: 11px; color: var(--accent);
    font-weight: 700; white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .forecast-future {
    position: absolute; right: 10px; bottom: 22px;
    font-size: .82rem; font-weight: 800; line-height: 1;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 1px 10px var(--card);
  }

</style>
<script src="/assets/theme.js" defer></script>

  function formatPrice(n) {
    if (!Number.isFinite(n)) return '—';
    const abs = Math.abs(n);
    let digits = 2;
    if (abs < 1) digits = 5;
    else if (abs < 10) digits = 4;
    else if (abs < 100) digits = 3;
    return new Intl.NumberFormat(locale(), {
      minimumFractionDigits: Math.min(2, digits),
      maximumFractionDigits: digits
    }).format(n);
  }

  function formatPct(n) {
    if (!Number.isFinite(n)) return '—';
    const sign = n > 0 ? '+' : '';
    return sign + new Intl.NumberFormat(locale(), {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(n) + '%';
  }

  function formatNum(n, digits) {
    if (!Number.isFinite(n)) return '—';
    return new Intl.NumberFormat(locale(), {
      minimumFractionDigits: 0,
      maximumFractionDigits: digits
    }).format(n);
  }

  function lastAndChange(history, windowMs) {
    if (!Array.isArray(history) || history.length === 0) return { last: NaN, change: NaN };
    const lastPair = history[history.length - 1];
    const last = Number(lastPair[1]);
    const lastMs = Number(lastPair[0]);
    if (!Number.isFinite(windowMs) || windowMs <= 0) return { last, change: NaN };
    const target = lastMs - windowMs;
    let prev = history[0];
    let best = Math.abs(Number(history[0][0]) - target);
    for (let i = 1; i < history.length; i += 1) {
      const d = Math.abs(Number(history[i][0]) - target);
      if (d < best) {
        best = d;
        prev = history[i];
      }
    }
    const base = Number(prev[1]);
    const change = Number.isFinite(base) && base !== 0 ? ((last - base) / base) * 100 : NaN;
    return { last, change };
  }

    const s = t();
    const map = bySymbol();
    
    const dynamicGroups = { commodities: [], crypto: [], other: [] };
    
    if (payload && Array.isArray(payload.symbols)) {
      payload.symbols.forEach(item => {
        if (!item || typeof item.symbol !== 'string') return;
        const symbol = item.symbol;
        if (!matchesFilter(symbol)) return;
        
        if (COMMODITIES.includes(symbol)) {
          dynamicGroups.commodities.push(symbol);
        } else if (CRYPTO.includes(symbol)) {
          dynamicGroups.crypto.push(symbol);
        } else {
          dynamicGroups.other.push(symbol);
        }
      });
    }

    const chunks = [];
    const groupKeys = [
      ['commodities', s.commodities],
      ['crypto', s.crypto],
      ['other', lang === 'tr' ? 'Diğer' : 'Other']
    ];
    
    groupKeys.forEach(([key, label]) => {
      const rows = dynamicGroups[key];
      if (!rows.length) return;
      chunks.push(`<div class="group-label">${escapeHTML(label)}</div>`);
      
      rows.forEach(symbol => {
        const item = map.get(symbol);
        const history = item && Array.isArray(item.history) ? item.history : [];
        const last = history.length ? Number(history[history.length - 1][1]) : NaN;
        const name = (s.names && s.names[symbol]) ? s.names[symbol] : symbol;
        chunks.push(
          `<button class="row${symbol === selected ? ' is-on' : ''}" type="button" data-symbol="${escapeHTML(symbol)}" aria-pressed="${symbol === selected}">` +
          `${badgeSVG(symbol)}<span class="row-name">${escapeHTML(name)}</span>` +
          `<span class="row-px">${escapeHTML(formatPrice(last))}</span></button>`
        );
      });
    });
    $('panelList').innerHTML = chunks.join('');
    requestAnimationFrame(syncPanelOverflow);
  }

  function syncPanelOverflow() {
    const list = $('panelList');
    const panel = $('panel');
    if (!list || !panel) return;
    const overflow = list.scrollHeight - list.clientHeight;
    panel.classList.toggle('has-more-below', overflow > 4 && list.scrollTop < overflow - 4);
    panel.classList.toggle('has-more-above', list.scrollTop > 4);
  }

  function renderBottom() {
    const s = t();
    const item = bySymbol().get(selected);
    let blurb = s.blurb[selected];
    if (!blurb) {
       const code = selected.replace(/USDT$/, '');
       blurb = lang === 'tr' 
           ? `${code} USDT karşılığı sürekli endeks fiyatı.`
           : `${code} perpetual index price in USDT.`;
    }
    $('blurb').textContent = blurb;
    let updated = '';
    if (payload && payload.generated_utc) {
      const when = new Date(payload.generated_utc);
      if (!Number.isNaN(when.getTime())) {
        const stamp = new Intl.DateTimeFormat(locale(), {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: lang === 'tr' ? 'Europe/Istanbul' : undefined
        }).format(when);
        updated = `${s.updated}: ${stamp}`;
      }
    }
    $('updated').textContent = updated;
    const fc = item && item.forecast ? item.forecast : {};
    const bt = fc.backtest || {};
    const horizon = Number(fc.horizon_hours) || 24;
    const rmse = Number(bt.rmse);
    const mape = Number(bt.mape);
    const hold = Number(bt.holdout_hours) || horizon;
    
    const trNote = 'Kesikli çizgi 24 saatlik model projeksiyonudur.';
    const enNote = 'The dashed line is the 24-hour model projection.';
    const extraNote = lang === 'tr' ? trNote : enNote;

    $('modelNote').textContent = `${s.model}. ${s.backtest} (${hold} ${s.hours}): RMSE ${formatNum(rmse, 4)} · MAPE ${formatPct(mape)}. ${extraNote}`;
  }

  function applyRangeButtons() {
    const s = t();
    const btn24 = $('range24h');
    const btnWeek = $('range1h');
    if (btn24) {
      btn24.textContent = s.range24;
      btn24.title = s.range24Hint;
      btn24.setAttribute('aria-pressed', String(rangeKey === '24h'));
    }
    if (btnWeek) {
      btnWeek.textContent = s.rangeWeek;
      btnWeek.title = s.weekHint;
      btnWeek.setAttribute('aria-pressed', String(rangeKey === '1w'));
    }
  }

  function setRange(next) {
    if (next !== '24h' && next !== '1w') return;
    if (rangeKey === next) return;
    rangeKey = next;
    applyRangeButtons();
    renderStrip();
    drawChart();
  }

  function sliceHistory(history, rangeMs) {
    if (!Array.isArray(history) || history.length === 0) return [];
    const copy = history.slice();
    if (!rangeMs) return copy;
    const lastPair = copy[copy.length - 1];
    const lastMs = Number(lastPair[0]);
    if (!Number.isFinite(lastMs)) return copy;
    const start = lastMs - rangeMs;
    let first = 0;
    for (let i = 0; i < copy.length; i += 1) {
      if (Number(copy[i][0]) >= start) {
        first = i > 0 ? i - 1 : 0;
        break;
      }
    }
    return copy.slice(first);
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function priceWindow(history, forecast) {
    let lo = Infinity;
    let hi = -Infinity;
    function include(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return;
      if (n < lo) lo = n;
      if (n > hi) hi = n;
    }
    history.forEach(pair => include(pair[1]));
    if (Array.isArray(forecast)) {
      forecast.forEach(point => include(point[1]));
    }
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) return null;
    if (hi <= lo) {
      const pad = Math.max(Math.abs(lo) * 0.01, 1e-8);
      return { min: lo - pad, max: lo + pad };
    }
    const pad = (hi - lo) * 0.1;
    return { min: lo - pad, max: hi + pad };
  }

  function drawChart() {
    const frame = document.querySelector('.chart-frame');
    const host = $('chart');
    if (!chartReady || !window.google || !google.visualization || !host) return;
    const overlay = $('forecastBg');
    if (overlay) overlay.style.display = 'none';
    const item = bySymbol().get(selected);
    const rawHistory = item && Array.isArray(item.history) ? item.history : [];
    const history = sliceHistory(rawHistory, RANGE_MS[rangeKey]);
    const forecast = item && item.forecast && Array.isArray(item.forecast.points) ? item.forecast.points : [];
    if (!history.length) return;
    try {
      const data = new google.visualization.DataTable();
      data.addColumn('datetime', 't');
      data.addColumn('number', t().heading);
      data.addColumn('number', t().forecast);
      data.addColumn({ type: 'number', role: 'interval' });
      data.addColumn({ type: 'number', role: 'interval' });
      data.addColumn({ type: 'string', role: 'annotation' });
      history.forEach((pair, index) => {
        const ms = Number(pair[0]);
        const price = Number(pair[1]);
        const last = index === history.length - 1;
        data.addRow([
          new Date(ms),
          price,
          last ? price : null,
          null,
          null,
          last ? t().forecast : null
        ]);
      });
      forecast.forEach(point => {
        data.addRow([
          new Date(Number(point[0])),
          null,
          Number(point[1]),
          null,
          null,
          null
        ]);
      });
      const windowY = priceWindow(history, forecast);
      if (!windowY) return;
      const accent = cssVar('--accent') || '#5ee3d7';
      const muted = cssVar('--muted') || '#b4aca0';
      const line = cssVar('--line') || '#4b659f';
      const text = cssVar('--text') || '#d9e9fb';
      const width = Math.max(120, host.clientWidth || frame.clientWidth);
      const height = Math.max(160, host.clientHeight || frame.clientHeight);
      const options = {
        backgroundColor: 'transparent',
        width,
        height,
        chartArea: { left: 56, top: 18, width: '86%', height: '76%' },
        legend: { position: 'none' },
        interpolateNulls: false,
        series: {
          0: { lineWidth: 2.2, color: accent },
          1: { lineWidth: 2, color: accent, lineDashStyle: [7, 5] }
        },
        intervals: { style: 'area', color: accent },
        interval: {
          i0: { style: 'area', color: accent, fillOpacity: 0.25 },
          i1: { style: 'area', color: accent, fillOpacity: 0.25 }
        },
        annotations: {
          style: 'line',
          stem: { color: 'transparent', length: 0 },
          textStyle: { color: 'transparent', fontSize: 0, auraColor: 'none' },
          boxStyle: null
        },
        hAxis: {
          textStyle: { color: muted, fontSize: 11 },
          gridlines: { color: 'transparent' },
          minorGridlines: { color: 'transparent' },
          baselineColor: line,
          format: rangeKey === '24h'
            ? 'HH:mm'
            : (lang === 'tr' ? 'd MMM HH:mm' : 'MMM d HH:mm')
        },
        vAxis: {
          textStyle: { color: muted, fontSize: 11 },
          gridlines: { color: line, count: 5 },
          minorGridlines: { color: 'transparent' },
          baselineColor: line,
          format: 'short',
          viewWindowMode: 'explicit',
          viewWindow: { min: windowY.min, max: windowY.max }
        },
        tooltip: { textStyle: { color: text, fontSize: 12 } },
        crosshair: { trigger: 'both', orientation: 'vertical', color: muted }
      };
      if (!chart) chart = new google.visualization.LineChart(host);
      google.visualization.events.removeAllListeners(chart);
      google.visualization.events.addListener(chart, 'ready', () => {
        try {
          const cli = chart.getChartLayoutInterface();
          const bbox = cli.getChartAreaBoundingBox();
          if (forecast && forecast.length > 0 && history && history.length > 0) {
            const startMs = Number(history[history.length - 1][0]);
            const endMs = Number(forecast[forecast.length - 1][0]);
            const startX = cli.getXLocation(new Date(startMs));
            let endX = cli.getXLocation(new Date(endMs));
            // Ensure endX does not exceed chart area width
            if (endX > bbox.left + bbox.width) endX = bbox.left + bbox.width;
            
            const bg = document.getElementById('forecastBg');
            const lbl = document.getElementById('forecastLabel');
            const future = document.getElementById('forecastFuture');
            if (bg && lbl && future) {
              bg.style.display = 'block';
              bg.style.left = startX + 'px';
              bg.style.width = Math.max(0, endX - startX) + 'px';
              bg.style.top = bbox.top + 'px';
              bg.style.height = bbox.height + 'px';
              lbl.textContent = t().forecastZone;
              future.textContent = t().future;
            }
          }
        } catch (e) {}
      });
      chart.draw(data, options);
    } catch (err) {
      chart = null;
    }
  }

  function showError(on) {
    $('errorPanel').classList.toggle('is-on', on);
    $('chartSkel').style.display = on ? 'none' : (payload ? 'none' : 'block');
  }

  function renderAll() {
    applyChrome();
    if (!payload) {
      showError(true);
      $('blurb').textContent = '';
      $('updated').textContent = '';
      $('modelNote').textContent = '';
      return;
    }
    showError(false);
    $('chartSkel').style.display = 'none';
    renderStrip();
    renderPanel();
    renderBottom();
    drawChart();
  }

  function renderLive() {
    if (!payload) {
      renderAll();
      return;
    }
    showError(false);
    $('chartSkel').style.display = 'none';
    renderStrip();
    renderPanel();
    renderBottom();
    drawChart();
  }

  function selectSymbol(symbol) {
    if (!bySymbol().has(symbol) && !ORDER.includes(symbol)) return;
    selected = symbol;
    try {
      history.replaceState(null, '', '#' + symbol);
    } catch {}
    renderAll();
  }

  function dataUrl() {
    return DATA_URL + '?t=' + Math.floor(Date.now() / REFRESH_MS);
  }

  async function loadData() {
    try {
      const res = await fetch(dataUrl(), { cache: 'no-store', credentials: 'omit' });
      if (!res.ok) return null;
      const json = await res.json();
      if (!json || !Array.isArray(json.symbols)) return null;
      lastFetchMs = Date.now();
      return json;
    } catch (err) {
      return null;
    }
  }

  function waitForCharts() {
    return new Promise(resolve => {
      const started = Date.now();
      const tick = () => {
        if (window.google && google.charts) {
          try {
            google.charts.load('current', { packages: ['corechart'] });
            google.charts.setOnLoadCallback(() => resolve(true));
            return;
          } catch (err) {
            resolve(false);
            return;
          }
        }
        if (Date.now() - started > 8000) {
          resolve(false);
          return;
        }
        setTimeout(tick, 50);
      };
      tick();
    });
  }

  function isLoopbackHost() {
    const host = location.hostname;
    return host === '127.0.0.1' || host === 'localhost' || host === '[::1]';
  }

  async function refreshData() {
    if (isLoopbackHost()) return;
    if (document.visibilityState === 'hidden') return;
    const data = await loadData();
    if (!data) return;
    if (payload && payload.generated_utc === data.generated_utc) return;
    payload = data;
    renderLive();
  }

  function armRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = 0;
    if (isLoopbackHost()) return;
    const now = Date.now();
    const nextSlot = Math.floor(now / REFRESH_MS) * REFRESH_MS + REFRESH_MS;
    const delay = Math.max(4000, nextSlot + REFRESH_LAG_MS - now);
    refreshTimer = setTimeout(async () => {
      await refreshData();
      armRefresh();
    }, delay);
  }

  async function boot() {
    const fromHash = (location.hash || '').replace(/^#/, '').toUpperCase();
    if (ORDER.includes(fromHash)) selected = fromHash; // we'll re-check after payload loads
    applyChrome();
    // Loopback has no CORS grant on the media host; skip the request so a local
    // audit does not log a blocked fetch. Production origins still load the feed.
    const dataPromise = isLoopbackHost() ? Promise.resolve(null) : loadData();
    const [data, ready] = await Promise.all([dataPromise, waitForCharts()]);
    payload = data;
    chartReady = ready === true;
    if (payload && !bySymbol().has(selected)) {
      selected = ORDER.find(id => bySymbol().has(id)) || selected;
    } else if (payload && location.hash) {
      const fromHash = location.hash.replace(/^#/, '').toUpperCase();
      if (bySymbol().has(fromHash)) selected = fromHash;
    }
    renderAll();
    armRefresh();
  }

  $('btnTr').addEventListener('click', () => {
    if (lang === 'tr') return;
    lang = 'tr';
    try { localStorage.setItem('lang', 'tr'); } catch {}
    renderAll();
  });
  $('btnEn').addEventListener('click', () => {
    if (lang === 'en') return;
    lang = 'en';
    try { localStorage.setItem('lang', 'en'); } catch {}
    renderAll();
  });
  $('range24h').addEventListener('click', () => setRange('24h'));
  $('range1h').addEventListener('click', () => setRange('1w'));
  $('filter').addEventListener('input', event => {
    filterQuery = event.target.value || '';
    renderPanel();
  });
  $('panelList').addEventListener('scroll', syncPanelOverflow, { passive: true });
  $('panelList').addEventListener('click', event => {
    const row = event.target.closest('[data-symbol]');
    if (!row) return;
    selectSymbol(row.getAttribute('data-symbol'));
  });
  $('retryBtn').addEventListener('click', () => {
    showError(false);
    $('chartSkel').style.display = 'block';
    boot();
  });
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      drawChart();
      syncPanelOverflow();
    }, 80);
  });
  addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (isLoopbackHost()) return;
    if (Date.now() - lastFetchMs >= REFRESH_MS - 5000) refreshData();
  });
  addEventListener('hashchange', () => {
    const next = (location.hash || '').replace(/^#/, '').toUpperCase();
    if ((bySymbol().has(next) || ORDER.includes(next)) && next !== selected) selectSymbol(next);
  });
  new MutationObserver(() => {
    if (payload) drawChart();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  boot();
})();
</script>
</body>
</html>
