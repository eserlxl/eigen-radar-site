sume it are opened together.", "refs": ["fed-rego", "fed-mutual"]}, {"tr": "Dayanıklılık savı da ciddiye alınmalı, çünkü güçlü. 1979 tarihli bir dolar eşiğini ekonomik büyümeye endekslemek, gerçek anlamda bir gevşetmeden çok aradan geçen kırk yedi yılın aritmetiğini tamamlar; yatırım fonlarındaki edilgen paylara uygulamayı kaldırmak bir sınırı değil evrak yükünü azaltır; ve kurul, kayırmalı kredilendirmeye karşı korumaların yerinde kaldığını açıkça söylüyor. Karşılıklı banka tarafında da hangi aracın sermaye sayılacağını netleştirmek, tanımı belirsiz bırakmaktan daha güvenli olabilir. Bu yüzden asıl sınav önerilerin kendisi değil, nihai metin. İki öneride de görüş süresi Federal Register'da yayımdan sonra 60 gün; izlenecek şey, endekslenmiş eşiğin hangi rakamda karara bağlandığı ve kayırmalı koşul yasağının nihai kuralda aynen kalıp kalmadığı.", "en": "The resilience case deserves a serious hearing, because it is strong. Indexing to economic growth a dollar threshold that has stood since 1979 completes the arithmetic of forty-seven intervening years rather than loosening anything in real terms; removing application to passive interests in investment funds cuts paperwork rather than a limit; and the Board states plainly that the safeguards against preferential lending remain. On the mutual side, clarifying which instruments count as capital may be safer than leaving the definition unsettled. The real test is therefore not the proposals but the final text. Comments on both are due 60 days after publication in the Federal Register; what to watch is the figure the indexed threshold settles at, and whether the prohibition on preferential terms survives unchanged into the final rule.", "refs": ["fed-rego", "fed-mutual"]}]}], "sources": [{"key": "fed-rego", "kind": "news", "name": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731b.htm", "title": {"tr": "Fed, banka yöneticilerine kredi açılmasını düzenleyen kuralı yenilemeyi önerdi", "en": "The Fed proposed to modernise its rule on lending to bank insiders"}, "publishedDate": "2026-07-31"}, {"key": "fed-mutual", "kind": "news", "name": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731a.htm", "title": {"tr": "Fed, karşılıklı bankalara ilişkin 1993 tarihli kuralları güncellemeyi önerdi", "en": "The Fed proposed updating its 1993 rules for mutual banking organisations"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-01", "title": {"tr": "Temmuzda yüzde 67 eriyen portföyü tek bir alıcı devraldı", "en": "A single buyer took over a portfolio that lost 67 percent in July"}, "excerpt": {"tr": "Aynı mektupta iki rakam duruyor: aylık yüzde 67 kayıp ve yılbaşından bu yana yüzde 80 kazanç. İkisi arasındaki mesafe, temmuzda fiyatı kimin belirlediğini anlatıyor.", "en": "One letter carries two numbers: a 67 percent monthly loss and an 80 percent gain since January. The distance between them says who was setting the price in July."}, "sections": [{"h": {"tr": "Aynı mektuptaki iki rakam", "en": "Two numbers in one letter"}, "ps": [{"tr": "Leopold Aschenbrenner'in fonu Situational Awareness, yatırımcılarına gönderdiği mektupta portföyünün temmuzda yüzde 67 gerilediğini bildirdi. Aynı mektupta fonun 2026 başından bu yana hâlâ yüzde 80 kazançta olduğu yazıyor. Fon, hisse portföyünün büyük bölümünü bu hafta Citadel'e sattı ve kaldıracı tamamen kaldırdı. Tek bir ay, bir yılın kazancının büyük kısmını götürmüş; kalan pozisyon ise ödünç parayla değil, yalnızca öz sermayeyle taşınıyor.", "en": "Leopold Aschenbrenner's fund, Situational Awareness, told investors in a letter that its portfolio fell 67 percent in July. The same letter says the fund is still up 80 percent since the start of 2026. It sold the bulk of its stock portfolio to Citadel this week and removed leverage entirely. One month took most of a year's gain, and what remains is carried on equity rather than on borrowed money.", "refs": ["sa-letter"]}, {"tr": "Mektubun ikinci yarısı daha ayırt edici. Aschenbrenner \"Bu ay sizi hayal kırıklığına uğrattık\" diye yazdı ve fonun sermayesinin zarar görmesine tehlikeli ölçüde yaklaştığını belirtti. Reuters'ın aktardığı anlatımda kayıp, yapay zekâ hisselerindeki sert düşüş ile piyasa likiditesinin kurumasının aynı anda gelmesine bağlanıyor. 2024'te kurulan fon için bu cümle, fiyatın nereye gittiğinden çok çıkışın ne kadar dar olduğunu anlatıyor.", "en": "The second half of the letter is the more distinctive part. Aschenbrenner wrote that \"we let you down this month\" and that the fund came dangerously close to impairing its capital. In the account reported by Reuters, the loss is attributed to a steep decline in AI stocks arriving at the same time as market liquidity dried up. For a fund founded in 2024, that is less a statement about where prices went than about how narrow the exit was.", "refs": ["sa-letter"]}]}, {"h": {"tr": "Satan taraf fiyatı belirlediğinde", "en": "When the seller sets the price"}, "ps": [{"tr": "Bir aylık yüzde 67'lik düşüşün yanında yılbaşından beri korunan yüzde 80'lik kazanç, iki farklı hikâyeye işaret ediyor ve aralarındaki fark önemli. Kaldıracın tamamen kaldırılması ve portföyün büyük bölümünün tek seferde tek bir kuruma geçmesi, görüş değiştiren bir yatırımcının kademeli satışına değil, finansmanın dayattığı bir çözülmeye benziyor. Karşıt açıklama da elde: elindeki hisseler gerçekten yeniden fiyatlanmış olabilir ve satış, fazla yoğunlaşmış bir portföyü küçültmek için verilmiş bilinçli bir karar olabilir. Mektup bu ikisini kesin biçimde ayırmıyor; ayıracak olan, aynı hisselere kimin ne zaman alıcı geldiği.", "en": "A 67 percent monthly fall sitting next to a preserved 80 percent gain for the year points to two different stories, and the difference matters. Removing leverage entirely and moving the bulk of the portfolio to a single institution at once looks less like an investor changing their mind and selling down in stages than like an unwind imposed by financing. The competing explanation is available too: the holdings may genuinely have been repriced, and the sale may have been a deliberate decision to shrink a concentrated book. The letter does not settle the question; what will settle it is who comes in to buy the same shares, and when.", "refs": ["sa-letter"]}, {"tr": "Ayrımı gözlemlenebilir kılan bir ölçüt var. Eğer temmuz kaybı ağırlıkla bir finansman olayıysa, kaldıraçsız kalan portföyün getirisi bundan sonra aynı hisselerin seyriyle birlikte hareket eder ve aradaki uçurum kapanır; eğer varlıkların kendisi yeniden fiyatlandıysa kapanmaz. Bunu izlemenin yolu fonun sonraki aylık mektuplarındaki getiri rakamı ile Citadel'e devredilen portföyün açıklanacak büyüklüğü. Ekim sonuna kadar bu iki veri, temmuzdaki hareketin bir kaldıraç kazası mı yoksa bir değer kararı mı olduğunu gösterecek.", "en": "There is a way to make the distinction observable. If July's loss was mainly a financing event, the return on the now-unlevered portfolio should track the same shares from here and the gap should close; if the assets themselves were repriced, it will not. The way to watch that is the return figure in the fund's subsequent monthly letters together with the disclosed size of the portfolio transferred to Citadel. By the end of October those two pieces of data should show whether July was a leverage accident or a judgment about value.", "refs": ["sa-letter"]}]}], "sources": [{"key": "sa-letter", "kind": "news", "name": "KFGO", "url": "https://kfgo.com/2026/07/31/situational-awareness-portfolio-sinks-67-in-july-on-ai-stock-rout-letter-shows/", "title": {"tr": "Situational Awareness'ın portföyü temmuzda yüzde 67 eridi", "en": "Situational Awareness' portfolio sank 67 percent in July"}, "publishedDate": "2026-07-31"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-02", "title": {"tr": "Bu paranın kur riski kimin bilançosunda duruyor?", "en": "Whose balance sheet is carrying the currency risk on this money?"}, "excerpt": {"tr": "Toplanan tutarın yaklaşık yüzde 90'ı tek bir kalemden geliyor: bankaların yurt dışından topladığı döviz mevduatı. O mevduatın kur riski bankada kalmıyor.", "en": "About 90 percent of the total comes from a single line: foreign-currency deposits banks raised abroad. The currency risk on those deposits does not stay with the banks."}, "sections": [{"h": {"tr": "Kalemler ve oranlar", "en": "The lines and the proportions"}, "ps": [{"tr": "Hindistan Merkez Bankası, 5 Haziran'da duyurup 8 Haziran'da işleme açtığı takas imkânı kapsamında 31 Temmuz itibarıyla 40.816 milyon dolar toplandığını bildirdi. Bu tutarın 36.725 milyon dolar tutarındaki bölümü yurt dışında yerleşiklerin açtığı FCNR(B) döviz mevduatlarından geldi. Yurt dışı döviz borçlanmaları 2.575 milyon dolar, dış ticari borçlanmalar 1.516 milyon dolar düzeyinde kaldı. Üç bacaklı bir düzenekte ağırlığın neredeyse tamamı tek bacakta toplanmış durumda.", "en": "The Reserve Bank of India reported $40,816 million mobilised through 31 July under the swap facility it announced on 5 June and opened on 8 June. Of that, $36,725 million came through FCNR(B) foreign-currency deposits opened by non-residents. Overseas foreign currency borrowings reached $2,575 million and external commercial borrowings $1,516 million. In a three-legged arrangement, almost all of the weight has landed on one leg.", "refs": ["rbi-swap"]}, {"tr": "Devrenin nasıl kapandığına bakmak gerekiyor. Yetkili satıcı banka yurt dışında yerleşik birinden döviz mevduatı alıyor; mevduat bankanın yükümlülüğü olarak duruyor. Banka bu dövizi merkez bankasıyla takas ettiğinde kur pozisyonu kendi bilançosundan çıkıp merkez bankasının bilançosuna geçiyor, karşılığında yurt içinde rupi likiditesi doğuyor. İmkân FCNR(B) mevduatları için 30 Eylül'e, diğer iki bacak için 31 Aralık'a kadar açık. Yani rakam bir sermaye girişini ölçtüğü kadar, kamu kesiminin üstlendiği bir döviz taahhüdünü de ölçüyor.", "en": "It is worth following how the circuit closes. An authorised dealer bank takes a foreign-currency deposit from a non-resident, and the deposit sits as the bank's liability. When the bank swaps that currency with the central bank, the exchange-rate position leaves its own balance sheet for the central bank's, and rupee liquidity appears domestically in return. The facility stays open until 30 September for FCNR(B) deposits and until 31 December for the other two legs. The figure therefore measures a public-sector currency commitment as much as it measures a capital inflow.", "refs": ["rbi-swap"]}]}, {"h": {"tr": "Hangi bacak doldu", "en": "Which leg filled"}, "ps": [{"tr": "Bacaklar arasındaki oran tesadüf değil. Mevduat bacağı 36.725 milyon dolar taşırken iki borçlanma bacağı 2.575 milyon dolar ve 1.516 milyon dolar düzeyinde kaldı. Bunun bir okuması şu: merkez bankasının koruma maliyetini üstlendiği yerde hacim oluşuyor, üstlenmediği yerde oluşmuyor. Fiyat sinyaline verilen bir yanıt bu, tasarruf sahibinin Hindistan'a bakışında kalıcı bir değişiklik değil. Karşıt açıklamayı da hesaba katmak gerekiyor: dış ticari borçlanma talebi, takas koşullarıyla hiç ilgisi olmayan nedenlerle — yatırım programlarının seyri, küresel borçlanma maliyetleri — zayıf olabilir. Bu durumda oran, imkânın tasarımından çok reel yatırımın durgunluğunu gösterir.", "en": "The proportion between the legs is not an accident. The deposit leg carries $36,725 million while the two borrowing legs stop at $2,575 million and $1,516 million. One reading is that volume appears where the central bank absorbs the hedging cost and does not appear where it does not. That is a response to a price signal, not a durable change in how savers view India. The competing account deserves weight too: demand for external commercial borrowing may be weak for reasons unrelated to the swap terms — the state of investment programmes, global borrowing costs. On that reading the ratio reflects sluggish real investment rather than the design of the facility.", "refs": ["rbi-swap"]}, {"tr": "İki okumayı ayıracak bir tarih var: 30 Eylül. Mevduat bacağının açık kaldığı süre o gün doluyor. Eğer bu para düşük maliyetli korumaya verilmiş bir yanıtsa, tarih geçtikten sonra FCNR(B) girişinin belirgin biçimde yavaşlaması, eğer yurt dışında yerleşiklerin tercihinde gerçek bir değişimse yavaşlamaması beklenir. Gözlenecek veri merkez bankasının aynı başlıkta yayımlayacağı sonraki raporlar; ölçüt de eylül sonrası aylık artışın haziran-temmuz temposuna oranı.", "en": "One date separates the two readings: 30 September, when the window on the deposit leg closes. If this money is a response to cheap hedging, the FCNR(B) inflow should slow markedly once the date passes; if it reflects a real shift in non-resident preference, it should not. The data to watch are the central bank's subsequent reports under the same heading, and the test is the monthly increase after September measured against the June-July pace.", "refs": ["rbi-swap"]}]}], "sources": [{"key": "rbi-swap", "kind": "news", "name": "Reserve Bank of India", "url": "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63274", "title": {"tr": "Hindistan'ın takas imkânı haziran ayından bu yana 40,8 milyar dolar topladı", "en": "India's swap facility has drawn $40.8 billion since June"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-03", "title": {"tr": "Teklif imzalanmadan hisse yüzde 20 primlendi", "en": "The shares gained more than 20 percent before any offer was signed"}, "excerpt": {"tr": "Integer'ın satılık olduğu nisandan beri biliniyordu. Cuma günü fiyatlanan yeni bilgi şirketin el değiştireceği değil, hangi rakamdan el değiştirebileceğiydi.", "en": "That Integer was for sale had been known since April. What the market priced on Friday was not that the company would change hands but at what number it might."}, "sections": [{"h": {"tr": "Bilinen satış, yeni rakam", "en": "A known sale, a new number"}, "ps": [{"tr": "Wall Street Journal, konuya vâkıf kaynaklara dayanarak KKR'nin Integer Holdings için hisse başına 127 dolar tutarında bir teklife yaklaştığını, teklifin önümüzdeki hafta gelebileceğini bildirdi. Bu rakam şirkete yaklaşık 4,3 milyar dolar değer biçiyor. Hisse cuma günü yüzde 20'nin üzerinde primle kapandı. Oysa şirketin satış süreci yeni değil: Integer, alıcı ilgisi gelmesinin ardından nisan ayında stratejik bir inceleme başlatmıştı. Piyasanın cuma günü öğrendiği şey şirketin elden çıkabileceği değil, seviyeydi.", "en": "The Wall Street Journal, citing people familiar with the matter, reported that KKR is nearing an offer of $127 a share for Integer Holdings and that it could come next week. That number values the company at about $4.3 billion. The shares closed more than 20 percent higher on Friday. The sale process, however, is not new: Integer opened a strategic review in April after receiving buyer interest. What the market learned on Friday was the level, not that the company might change hands.", "refs": ["integer-kkr"]}, {"tr": "Rakamın yanında ne olmadığına bakmak da öğretici. Haberde hisse başına bir fiyat var; finansmanın nasıl kurulacağı, işlemin hangi koşullara bağlanacağı, cayma bedelinin bulunup bulunmayacağı yok. Bunlar teklifin ekonomik içeriğini belirleyen kalemler ve hiçbiri henüz kamuya açık değil. Karşılaştırma kümesi de tek bir çarpanı desteklemiyor: aynı haberde anılan işlemlerden American Industrial Partners'ın Avanos Medical alımı 1,27 milyar dolar, Blackstone ile TPG'nin Hologic anlaşması 18 milyar dolar seviyesini aşıyor. Sağlık üretiminde el değiştiren varlıklar iki büyüklük mertebesi arasına yayılıyor.", "en": "It is just as instructive to look at what does not sit beside the number. The report gives a price per share; it does not give the financing structure, the conditions the transaction would carry, or whether there is a break fee. Those are the items that determine an offer's economic content, and none of them is public yet. The comparison set does not support a single multiple either: of the deals cited in the same report, American Industrial Partners' purchase of Avanos Medical was $1.27 billion while Blackstone and TPG's Hologic agreement was over $18 billion. Healthcare manufacturing assets are changing hands across two orders of magnitude.", "refs": ["integer-kkr"]}]}, {"h": {"tr": "Rakamın taşımadığı bilgi", "en": "What the number does not carry"}, "ps": [{"tr": "Satış süreci nisanda kamuya açıldığına göre, cuma günkü hareketin ölçtüğü şey niyetin keşfi olamaz; ölçtüğü şey beklenen bedelin ve işlemin sonuçlanma ihtimalinin yukarı revize edilmesi. Bu ayrım önemli, çünkü ilkinde hisse yeni bir olasılığı, ikincisinde ise zaten bilinen bir olasılığın fiyatını içeriyor. Alternatif bir okuma da savunulabilir: nisandaki inceleme duyurusu, somut bir teklif üretme ihtimali düşük görülerek karşılanmış olabilir; o hâlde cuma günkü primin bir bölümü, rakamın revizyonundan değil inandırıcı bir alıcının ortaya çıkmasından gelir. İkisini ayırmak için nisan ile temmuz sonu arasındaki fiyat seyri gerekir ve o veri bu haberde yok.", "en": "Because the sale process became public in April, what Friday's move measured cannot be the discovery of intent; it is an upward revision to the expected consideration and to the odds of completion. The distinction matters, because in the first case the share price contains a new possibility and in the second it contains the price of a possibility already known. An alternative reading is defensible: April's review announcement may have been received as unlikely to produce a concrete bid, in which case part of Friday's premium comes from a credible buyer appearing rather than from a revision to the number. Separating the two would require the price path between April and the end of July, and that data is not in this report.", "refs": ["integer-kkr"]}, {"tr": "Bu yüzden ilk bağlayıcı sınav, teklifin gelip gelmediği değil geldiğinde neyi açıkladığı olacak. Bir anlaşma duyurulursa metin hisse başına ödenecek bedeli, bedelin nakit mi hisse mi olduğunu, finansman taahhütlerini ve kapanış koşullarını yazar. Hisse başına 127 dolar rakamının gerçekte ne anlama geldiğini belirleyecek girdiler bunlar; eylül sonuna kadar açıklanacak bir anlaşma metni, cuma günkü fiyatın neyi doğru neyi eksik fiyatladığını gösterecek.", "en": "The first binding test will therefore not be whether the offer arrives but what it discloses when it does. If an agreement is announced, the document will state the consideration per share, whether it is cash or stock, the financing commitments and the closing conditions. Those are the inputs that decide what $127 actually means; an agreement published by the end of September would show what Friday's price had right and what it left out.", "refs": ["integer-kkr"]}]}], "sources": [{"key": "integer-kkr", "kind": "news", "name": "AOL", "url": "https://www.aol.com/articles/kkr-nearing-deal-acquire-integer-192029000.html", "title": {"tr": "KKR'nin Integer Holdings için hisse başına 127 dolar tutarında teklife yaklaştığı bildirildi", "en": "KKR is reported to be nearing a $127-a-share offer for Integer Holdings"}, "publishedDate": "2026-07-31"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-04", "title": {"tr": "Hürmüz'ü atlayan hat bir yıl daha açık kalıyor", "en": "The line that bypasses Hormuz stays open for another year"}, "excerpt": {"tr": "Anlaşmanın süresi kapasitesinden daha çok şey anlatıyor. Günde 750.000 varillik bir güzergâh için taraflar yalnızca on iki ay taahhüt verebildi.", "en": "The term of the deal says more than its capacity. For a 750,000-barrel-a-day route, the parties could commit to only twelve months."}, "sections": [{"h": {"tr": "Güzergâh, süre ve imza", "en": "Route, term and signature"}, "ps": [{"tr": "Kerkük-Ceyhan hattını düzenleyen önceki anlaşma pazartesi günü sona erdi. Irak Petrol Bakanı Bessem Hudayr cumartesi günü Türkiye'ye giderek bir yıllık uzatmayı imzalıyor. Bakanlık sözcüsü Salim el-Rikabi metnin üç taraflı olduğunu, Irak tarafında devlet petrol pazarlama şirketi SOMO ile Kuzey Petrol Şirketi'nin, Türkiye tarafında BOTAŞ'ın yer aldığını söyledi. Hattın kapasitesi günde 750.000 varil ve güzergâh, Irak ham petrolüne Hürmüz Boğazı'ndan geçmeyen bir çıkış sunuyor.", "en": "The previous agreement governing the Kirkuk-Ceyhan line expired on Monday. Iraq's oil minister, Bassem Khudair, travels to Turkey on Saturday to sign a one-year extension. Ministry spokesman Salim Al Rikabi said the text is tripartite, with the state marketing company SOMO and the North Oil Company on the Iraqi side and BOTAS on the Turkish side. The line's capacity is 750,000 barrels a day, and the route gives Iraqi crude an exit that does not pass through the Strait of Hormuz.", "refs": ["kirkuk-ceyhan"]}, {"tr": "Bu rakamı doğru okumak gerekiyor. Günde 750.000 varil, hattın alabileceği miktar; taşıdığı miktar değil. Duyurulan metinde bir hacim taahhüdü yer almıyor, yalnızca hattın işler kalacağı süre var. Bir güzergâhın değeri de zaten kendi kapasitesiyle değil, taşıdığı ham petrolün başka hangi çıkışlara sahip olduğuyla ölçülür. kuzeydeki sahalardan çıkan varil için diğer seçenek güneye inip körfezden yüklenmek, yani boğazdan geçmek anlamına geliyor.", "en": "That number needs to be read correctly. The 750,000 barrels a day is what the line can take, not what it moves. The announced text carries no volume commitment, only the period for which the line stays operational. In any case a route's worth is measured not by its own capacity but by what other exits exist for the crude it carries. for a barrel from the northern fields, the other option means going south and loading in the gulf, which means passing through the strait.", "refs": ["kirkuk-ceyhan"]}]}, {"h": {"tr": "On iki ayın söylediği", "en": "What twelve months says"}, "ps": [{"tr": "Sözcünün kendi çerçevesi ipucu veriyor: bir yıllık metin, Basra-Haditha-Kerkük-Ceyhan hattı tamamlandıktan sonra ihracat kapasitesini günlük 1 milyon varilin üzerine çıkarmayı amaçlayan kapsamlı anlaşmanın hazırlığı olarak tanımlanıyor. Bu tarif, kısıtın kuzeydeki mevcut hatta değil henüz bitmemiş Basra-Haditha-Kerkük-Ceyhan bağlantısında olduğunu ima ediyor; çünkü milyon varillik hedef, inşaat tamamlanmadan sınanamaz. Başka bir açıklama da mümkün: kısa süre, Bağdat ile Ankara arasında çözülmemiş ticari ve hukuki konuların ürünü olabilir ve inşaat projesi geleceğe dönük bir gerekçe olarak öne çıkarılmış olabilir. Duyuruda bu iki ihtimali ayıracak bir madde yok.", "en": "The spokesman's own framing offers a clue: the one-year text is described as a prelude to a comprehensive agreement meant to lift export capacity above 1 million barrels a day once the Basra-Haditha-Kirkuk-Ceyhan pipeline is finished. That description implies the constraint sits not in the existing northern line but in the unfinished Basra-Haditha-Kirkuk-Ceyhan link, because the million-barrel target cannot be tested before construction is complete. Another explanation is available: the short term may be a product of unresolved commercial and legal questions between Baghdad and Ankara, with the construction project brought forward as a forward-looking justification. The announcement contains no provision that would separate the two.", "refs": ["kirkuk-ceyhan"]}, {"tr": "Sınavın takvimi anlaşmanın kendi süresinde yazılı. On iki ay içinde Basra-Haditha-Kerkük-Ceyhan bağlantısı devreye alınmazsa, kapsamlı anlaşmanın dayandırıldığı kapasite artışı sınanamaz ve taraflar aynı yenileme sorusunun başına döner. İzlenecek iki gösterge var: bu bağlantının devreye alma aşamaları ve gelecek yaz imzalanacak yenileme metninin süresi. Yenilemenin yine bir yıllık çıkması, kısıtın inşaatta değil masada olduğuna dair daha güçlü bir işaret olur.", "en": "The timetable for the test is written into the agreement's own term. If the Basra-Haditha-Kirkuk-Ceyhan link is not commissioned within twelve months, the capacity increase on which the comprehensive agreement rests cannot be tested and the parties return to the same renewal question. Two indicators are worth following: the commissioning stages of that link, and the term of whatever renewal arrives next summer. A renewal that again runs for one year would be a stronger sign that the constraint sits at the table rather than in the construction.", "refs": ["kirkuk-ceyhan"]}]}], "sources": [{"key": "kirkuk-ceyhan", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/01/iraq-to-sign-extension-of-pipeline-deal-with-turkey/", "title": {"tr": "Irak, Türkiye ile boru hattı anlaşmasını bir yıl uzatmak için imzaya gidiyor", "en": "Iraq is signing a one-year extension of its pipeline deal with Turkey"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-05", "title": {"tr": "Peşinatı olan hane ile kredi çekecek hane aynı fiyatı ödemiyor", "en": "A household with a deposit and one that must borrow are not paying the same price"}, "excerpt": {"tr": "Değerler gerilerken alıcının eli güçleniyor deniyor. Ama pazarlık gücü ile satın alma gücü aynı şey değil; ikisini ayıran şey borcun aylık maliyeti.", "en": "As values slide, buyers are said to have the upper hand. Bargaining power and purchasing power are not the same thing, and what separates them is the monthly cost of debt."}, "sections": [{"h": {"tr": "Endeksin gösterdiği", "en": "What the index shows"}, "ps": [{"tr": "Cotality'nin konut değer endeksine göre Yeni Zelanda'da medyan değer temmuzda 804.303 Yeni Zelanda doları oldu. Aylık düşüş yüzde 0,3, üç aylık düşüş yüzde 1,0, yıllık düşüş yüzde 0,7. Kuruluşun iktisatçısı Kelvin Davidson, satış hacimlerinin yıl boyunca hafifçe gerilediğini ama hâlâ görece normal düzeyde olduğunu, buna karşılık satılık konut stokunun yüksek kalmasının fiyat pazarlığında dengeyi alıcı tarafına geçirdiğini söylüyor.", "en": "Cotality's home value index put New Zealand's median value at 804,303 New Zealand dollars in July. Values were down 0.3 percent on the month, 1.0 percent over three months and 0.7 percent on the year. Kelvin Davidson, an economist at the firm, says sales volumes have edged lower through the year but remain at a relatively normal level, while an elevated stock of listings has shifted the balance of power on pricing toward buyers.", "refs": ["cotality-nz"]}, {"tr": "Aynı değerlendirmenin ikinci yarısı daha az alıntılanıyor. Davidson değerlerin genel olarak durgun seyrettiğini, 2022-2023 düşüşünden bu yana tabloda belirgin bir toparlanma işareti görünmediğini belirtiyor ve kısa vadede konut kredisi faizlerinde artış bekliyor. Tek bir kaynaktan çıkan iki cümle bunlar ve kredi kullanacak bir hane için ters yönlere çekiyor: biri satıcı karşısındaki konumu iyileştiriyor, diğeri satın alınacak şeyin taksitini ağırlaştırıyor.", "en": "The second half of the same assessment is quoted less often. Davidson describes values as generally sluggish, sees little sign of a meaningful upturn since the 2022-2023 downturn, and expects mortgage rate increases in the short term. These are two statements from a single source, and for a household that needs credit they pull in opposite directions: one improves its position opposite the seller, the other makes the instalment on what it buys heavier.", "refs": ["cotality-nz"]}]}, {"h": {"tr": "Aynı fiyat, iki farklı hane", "en": "One price, two households"}, "ps": [{"tr": "Düşen bir medyan, kısıtı satın alma fiyatı olan haneyle kısıtı aylık borç servisi olan haneye aynı şeyi vermiyor. Birikmiş peşinatı olan bir hane için 804.303 Yeni Zelanda doları düzeyindeki medyan doğrudan daha düşük bir giriş bedeli demek. Kredi çekmek zorunda olan hane içinse ödenecek toplam, fiyat kadar faize de bağlı; yıllık yüzde 0,7'lik bir değer düşüşünün sağladığı avantajı, konut kredisi faizindeki bir artış kolayca aşabilir. Bu okumaya göre endeksin tarif ettiği üstünlük gelire göre değil, peşinatın büyüklüğüne göre dağılıyor. Karşıt ihtimal de açık: faizler Davidson'ın beklediği gibi artmazsa, değerlerdeki sürekli gerileme giriş maliyetini geniş bir kesim için düşürür ve peşinat ayrımı bu kadar belirleyici olmaz.", "en": "A falling median does not give the same thing to a household whose constraint is the purchase price and one whose constraint is monthly debt service. For a household with savings already set aside, a median of 804,303 New Zealand dollars simply means a lower entry cost. For a household that has to borrow, the total paid depends on the interest rate as much as on the price, and an increase in mortgage rates can easily outweigh the advantage of a 0.7 percent annual fall in values. On this reading, the advantage the index describes is distributed by the size of the deposit rather than by income. The competing possibility is plain: if rates do not rise as Davidson expects, a continued decline in values lowers the entry cost broadly and the deposit distinction matters much less.", "refs": ["cotality-nz"]}, {"tr": "Bu iki okuma tartışmayla değil, tek bir seriyle ayrılır: aylık satışlar içinde ilk kez konut alanların payı. Alıcı üstünlüğü genel bir üstünlükse, değerler gerilemeye devam ederken bu payın yükselmesi gerekir. Faizler artarken pay yatay kalır ya da gerilerse, düşen endeksin kimin lehine çalıştığı sorusunun cevabı da netleşir. Yıl sonuna kadar bu seri, pazarlık gücünün gerçekten satın alma gücüne dönüşüp dönüşmediğini gösterecek.", "en": "These two readings are separated not by argument but by a single series: the share of first-home buyers in monthly sales. If the buyer advantage is a general one, that share should rise while values keep sliding. If it stays flat or falls while rates increase, the question of whom a falling index actually works for becomes easier to answer. By the end of the year that series should show whether bargaining power has in fact turned into purchasing power.", "refs": ["cotality-nz"]}]}], "sources": [{"key": "cotality-nz", "kind": "news", "name": "interest.co.nz", "url": "https://www.interest.co.nz/property/139613/house-buyers-hold-balance-power-when-it-comes-pricing-cotality-says", "title": {"tr": "Yeni Zelanda'da konut değerleri temmuzda yüzde 0,3 geriledi", "en": "New Zealand house values fell 0.3 percent in July"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-06", "title": {"tr": "Son yatırım basamağında kalmak koalisyon aritmetiğine bağlandı", "en": "Staying on the last investment-grade rung now turns on coalition arithmetic"}, "excerpt": {"tr": "Fitch notu teyit etti, görünümü negatif bıraktı. Gerekçede mali patikayı taşıyan değişken olarak dağılmış bir koalisyonun bütçe geçirebilme ihtimali öne çıkıyor.", "en": "Fitch affirmed the rating and left the outlook negative. In its reasoning, the variable carrying the fiscal path is whether a collapsed coalition can pass a budget."}, "sections": [{"h": {"tr": "Teyit ile şerh arasında", "en": "Between the affirmation and the caveat"}, "ps": [{"tr": "Fitch, Romanya'nın BBB- notunu teyit etti ve görünümü negatif bıraktı. Fitch'in projeksiyonlarında genel devlet açığı 2026 için gayrisafi yurt içi hasılanın yüzde 5,9'u, kamu borcu ise 2028'e kadar yüzde 64,5 düzeyinde görünüyor. Kararın gerekçesinde hükümet koalisyonunun dağılmasıyla mali programın uygulanmasındaki güçlük doğrudan ilişkilendiriliyor; değerlendirmede siyasi istikrar, kredi değerliliği bakımından mali disiplin kadar belirleyici bir unsur olarak ele alınıyor.", "en": "Fitch affirmed Romania's BBB- rating and left the outlook negative. Its projections put the general government deficit at 5.9 percent of gross domestic product for 2026 and public debt at 64.5 percent of GDP by 2028. The reasoning links the collapse of the governing coalition directly to the difficulty of implementing the fiscal strategy, and the assessment treats political stability as weighing on creditworthiness as heavily as fiscal discipline.", "refs": ["fitch-romania"]}, {"tr": "Negatif görünümlü bir teyidin ne olduğunu açıkça söylemek gerekiyor. Not, yatırım yapılabilir seviyenin en alt basamağında tutuluyor ve kuruluş yönü belirtiyor. Buradaki tampon zamandır: BBB- altında yatırım yapılabilir başka bir kademe bulunmuyor. Karar, bir mühlet tanıyor.", "en": "It is worth saying plainly what an affirmation with a negative outlook is. The rating is being held on the lowest rung of investment grade while the agency states a direction of travel. The buffer here is time: there is no further investment-grade step below BBB-. What the decision provides is a period of grace.", "refs": ["fitch-romania"]}]}, {"h": {"tr": "Zincir hangi halkadan kopar", "en": "Where the chain would break"}, "ps": [{"tr": "Fitch'in kendi gerekçesi, kırılganlığın nerede durduğunu gösteriyor. Kuruluş koalisyonun dağılmasını, mali stratejinin uygulanmasını zorlaştıran kanal olarak adlandırdığında, notu bağlayan kısıtı aritmetikten parlamentoya taşımış oluyor; çünkü yüzde 5,9'luk açık projeksiyonu, alınacağı varsayılan tedbirlerin çıktısıdır ve o tedbirler bir çoğunluk gerektirir. Çoğunluk yoksa tedbir gecikir, açık projeksiyonun üzerinde kalır ve 2028 için verilen yüzde 64,5'lik borç patikası dikleşir. Karşı okuma da ciddiye alınmalı: negatif görünüm doğrudan açığın düzeyini yansıtıyor olabilir ve siyasi yorum çevredeki bağlamı tarif ediyor olabilir. Bu durumda açığın kendi düzeyi belirleyici olur.", "en": "Fitch's own reasoning shows where the fragility sits. When the agency names the coalition's collapse as the channel making the fiscal strategy harder to implement, it moves the binding constraint on the rating from arithmetic to parliament, because the 5.9 percent deficit projection is an output of measures assumed to be taken, and those measures require a majority. Without a majority the measures slip, the deficit stays above the projection, and the 64.5 percent debt path given for 2028 steepens. The counter-reading deserves to be taken seriously: the negative outlook may reflect the level of the deficit directly, with the political commentary describing the surrounding context. On that account the deficit's own level is what decides.", "refs": ["fitch-romania"]}, {"tr": "Bu ikisini ayıracak eşik gözlemlenebilir. Yüzde 5,9'luk projeksiyonun dayandığı konsolidasyon tedbirleri, kuruluşun bir sonraki planlı gözden geçirmesinden önce yasalaşmazsa, negatif görünümün olumluya değil aşağı yöne çözülmesi daha olası hâle gelir. İzlenecek iki şey var: söz konusu tedbirleri taşıyan bir bütçenin kabul edilip edilmediği ve Fitch'in bir sonraki gözden geçirmesinde bu konuya ayırdığı ifade. Şubat sonuna kadar bu iki gösterge, notu bugün taşıyanın mali plan mı yoksa o planı geçirebilecek bir çoğunluk beklentisi mi olduğunu ortaya koyacak.", "en": "The threshold that separates the two is observable. If the consolidation measures behind the 5.9 percent projection are not legislated before the agency's next scheduled review, the negative outlook becomes more likely to resolve downward than to return to stable. Two things are worth watching: whether a budget carrying those measures is adopted, and the wording Fitch devotes to the question at its next review. By the end of February those two indicators should show whether what holds the rating today is the fiscal plan or the expectation of a majority able to pass it.", "refs": ["fitch-romania"]}]}], "sources": [{"key": "fitch-romania", "kind": "news", "name": "Independent Balkan News Agency", "url": "https://www.ibnaeu.com/en/2026/08/01/fitch-romania-bbb-political-stability-credit-rating/", "title": {"tr": "Fitch, Romanya'nın notunu yatırım yapılabilir seviyenin son basamağında tuttu", "en": "Fitch kept Romania on the lowest rung of investment grade"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-01", "title": {"tr": "Brüt marjın iki puanı gümrük vergisi iadesinden geldi", "en": "Two points of the gross margin came from a tariff refund"}, "excerpt": {"tr": "Apple'ın haziran çeyreği geliri 109,4 milyar dolar, brüt kâr marjı yüzde 50,1. Şirketin kendi açıklamasına göre bu marjın yaklaşık 2 puanı ve seyreltilmiş hisse başına kâra eklenen 0,11 dolar gümrük vergisi iadelerinden geliyor. Farkı geri alınan vergi doğuruyor; satılan ürün bu tutarı taşımıyor.", "en": "Apple's June quarter brought in $109.4 billion of revenue at a gross margin of 50.1 percent. By the company's own account, approximately 2 percentage points of that margin and $0.11 of diluted earnings per share came from tariff refunds. Customs returned that difference; the customer did not pay it."}, "sections": [{"h": {"tr": "İki farklı kâr kaynağı", "en": "Two different sources of profit"}, "ps": [{"tr": "Apple, 27 Haziran 2026'da sona eren çeyrekte gelirini yıllık yüzde 16 artışla 109,4 milyar dolar, seyreltilmiş hisse başına kârını yıllık yüzde 29 artışla 2,02 dolar olarak bildirdi. Brüt kâr marjı yüzde 50,1 oldu; şirket bu rakamın gümrük vergisi iadelerinden gelen yaklaşık 2 puanlık olumlu etkiyi içerdiğini ve aynı iadelerin hisse başına kâra 0,11 dolar eklediğini açıkladı.", "en": "Apple reported quarterly revenue of $109.4 billion in the quarter ended June 27, 2026, up 16 percent year over year, and diluted earnings per share of $2.02, up 29 percent year over year. Gross margin was 50.1 percent; the company said the figure includes a favorable impact of approximately 2 percentage points from tariff refunds, and that the same refunds added $0.11 to earnings per share.", "refs": ["apple-q3"]}, {"tr": "Bu iki kalem aynı satırda toplanıyor ama farklı şeyleri ölçüyor. Gümrük vergisi iadesi, geçmişte ödenmiş bir vergiyi geri getirir ve ürün karışımına, hizmet gelirinin payına veya girdi giderine değil gümrük kararlarına bağlıdır. Apple'ın brüt kâr marjı bir puanın onda birleri düzeyinde okunurken, o marjın 2 puanının nereden geldiğini bilmek, marjın gelecek çeyrekte tekrar edip etmeyeceğine dair en somut bilgi.", "en": "The two items land on the same line while measuring different things. A tariff refund returns duty that was already paid, and it moves with customs decisions instead of with product mix, the services share of revenue or the cost of an input. When Apple's gross margin is read to a tenth of a point, knowing where 2 percentage points of it came from is the most concrete information available about whether the margin repeats.", "refs": ["apple-q3"]}]}, {"h": {"tr": "Geriye kalan iş nasıl duruyor", "en": "What the underlying business still shows"}, "ps": [{"tr": "Gümrük vergisi iadelerini bir kenara koyduğunuzda çeyrek kendi başına ayakta duruyor. Apple'a göre iPhone, Mac ve Hizmetler geliri haziran çeyreği için yeni rekor kırdı ve her coğrafi bölümde büyüme görüldü. Yüzde 16'lık gelir artışı iade kalemiyle açıklanamaz; iade brüt kâr marjına ve hisse başına kâra giriyor, gelirin kendisi ise bu tutardan etkilenmiyor.", "en": "Set the tariff refunds aside and the quarter still stands on its own. Apple said iPhone, Mac and Services revenue set new June quarter records and there was growth in every geographic segment. The 16 percent increase in revenue cannot be explained by the refund line; a refund reaches gross margin and earnings per share, while revenue itself stays untouched.", "refs": ["apple-q3"]}, {"tr": "Ayrımın önem kazandığı yer bir sonraki çeyreğin başlangıç noktası. Apple'ın yüzde 50,1'lik brüt kâr marjı taban alınırsa, aynı iadeler tekrar gelmediği sürece karşılaştırma yanlış kurulmuş olur. Karşı okuma da elde tutulmalı: gümrük vergisi iadeleri sürerse yeni tutarlar gelebilir, ya da hizmet gelirinin payı artmayı sürdürerek 2 puanlık boşluğu kendi başına kapatabilir. O halde marjın bileşimi değişir, düzeyi yerinde kalır.", "en": "Where the distinction starts to matter is the baseline for the next quarter. Treat Apple's 50.1 percent gross margin as a floor and the comparison is built wrong unless the same refunds arrive again. The counter-reading has to stay on the table: further tariff refunds could return more money, or a rising services share of revenue could close the 2 point gap on its own. In that case the composition of the margin changes while its level holds.", "refs": ["apple-q3"]}]}], "sources": [{"key": "apple-q3", "kind": "news", "name": "Apple", "url": "https://www.apple.com/newsroom/2026/07/apple-reports-third-quarter-results/", "title": {"tr": "Apple'ın haziran çeyreği geliri 109,4 milyar dolara çıktı, brüt marj yüzde 50,1 oldu", "en": "Apple's June quarter revenue reached $109.4 billion with a 50.1 percent gross margin"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-02", "title": {"tr": "Hazineye açılan kredi kapanınca fatura tahvil piyasasına geçer", "en": "Close the treasury's credit line and the bill moves to the bond market"}, "excerpt": {"tr": "Milei'nin merkez bankası tasarısı, kurumun devlete doğrudan ve dolaylı finansman sağlamasını yasaklıyor. Yasak bir yaratma kanalını kapatıyor; harcama ile gelir arasındaki farkı yerinde bırakıyor. Arjantin'de asıl soru şu hale geliyor: bu kez hangi bilanço taşıyacak?", "en": "Milei's central bank bill bans the institution from financing the state directly and indirectly. The ban closes one channel of money creation while leaving the gap between spending and revenue where it stands. In Argentina the operative question becomes which balance sheet carries it this time."}, "sections": [{"h": {"tr": "Yasağın kapattığı kanal", "en": "The channel the ban closes"}, "ps": [{"tr": "Tasarı, kurumun devlete doğrudan ve dolaylı finansman sağlamasını yasaklıyor, geçici Hazine avanslarını kaldırıyor, birincil piyasada devlet kâğıdı alımını sınırlıyor ve devredilemez senetleri sonlandırıyor. Muhasebe kârının aktarımına tavan geliyor, kurumun amaçlarına istihdam ve kalkınmayı ekleyen 2012 düzenlemesi geri alınıyor, banka başkanının ve yönetim kurulunun görevden alınması iki mecliste üçte iki çoğunluğa bağlanıyor. Metni Luis Caputo, Santiago Bausili ve Federico Sturzenegger hazırladı.", "en": "The bill bans direct and indirect state financing by the institution, eliminates temporary Treasury advances, restricts purchases of government paper in the primary market and eliminates non-transferable notes. It caps transfers of accounting profit, reverses the 2012 reform that broadened the institution's objectives to include employment and development, and requires two-thirds votes in both chambers to remove the bank's president and board. The text was drafted by Luis Caputo, Santiago Bausili and Federico Sturzenegger.", "refs": ["milei-bcra"]}, {"tr": "Bu maddelerin her biri, devletin harcaması ile merkez bankasının bilançosu arasındaki doğrudan bağı kesiyor. Ortodoks çerçevede bu bağ enflasyonun kaynağıdır: kurum devlete kaynak yaratır, para genişler, fiyatlar yükselir. Çerçevenin en güçlü hali savunulabilir bir hal — Arjantin'de bu kanal onlarca yıl gerçekten işledi ve devlet borcu ile harcama, yaratılan parayla karşılandı.", "en": "Each of these provisions severs a direct link between government spending and the central bank's balance sheet. In the orthodox frame that link is the source of inflation: the institution creates resources for the state, money expands and prices rise. Stated at its strongest the frame is defensible — in Argentina this channel genuinely operated for decades, and government debt and spending were met with created money.", "refs": ["milei-bcra"]}]}, {"h": {"tr": "Kapanmayan taraf", "en": "The side that does not close"}, "ps": [{"tr": "Eksik halka şurada: bir finansman kanalını yasaklamak, o kanalın finanse ettiği harcama ile gelir arasındaki farkı ortadan kaldırmıyor. Fark sürdüğü sürece bir yerden karşılanmak zorunda — yurt içi tahvil piyasasından, dış alacaklılardan ya da harcamanın kesilmesinden. Tasarı, farkı taşıyacak bilançoyu değiştiriyor ve farkın kendisi yerinde kalıyor. Ticari bankalar devlet kâğıdını aldığında kredi ve mevduat yine genişliyor; yaratanın kim olduğu ve devlet borcunun fiyatı değişiyor.", "en": "The missing link is this: prohibiting a financing channel does not remove the gap between spending and revenue that the channel financed. While the gap persists it must be met somewhere — in the domestic bond market, from external creditors, or by cutting the spending. The bill changes which balance sheet carries the gap, and the gap itself stays in place. When commercial banks buy the government paper, credit and deposits still expand; who does the creating and what government debt costs both change.", "refs": ["milei-bcra"]}, {"tr": "Karşı okuma ciddiye alınmalı. Hükümetin fiili duruşu birincil fazla üretmekse kısıt hiç bağlamayabilir ve tasarı, geçmiş uygulamanın tekrarını engelleyen bir çıpa olarak kalır. Görevden alma için iki mecliste üçte iki çoğunluk aranması bu çıpanın en somut parçası; madde, para politikasını gevşetmek amacıyla yönetim değiştirme yolunu kapatmayı hedefliyor. Ama bu bir kurumsal düzenleme sorusu; enflasyon sonucunu doğrudan vermiyor ve ikisini tek cümlede birleştirmek tasarıyı olduğundan güçlü gösterir.", "en": "The counter-reading deserves weight. If the government's actual stance produces a primary surplus, the constraint may never bind, and the bill stands as an anchor against a repeat of past practice. Requiring two-thirds votes in both chambers for removals is the most concrete part of that anchor; the clause is designed to close the route of replacing the leadership in order to loosen policy. But that is a question of institutional design; it does not deliver an inflation outcome directly, and folding the two into one sentence makes the bill look stronger than it is.", "refs": ["milei-bcra"]}]}], "sources": [{"key": "milei-bcra", "kind": "news", "name": "MercoPress", "url": "https://en.mercopress.com/2026/07/30/from-closing-the-central-bank-to-reforming-it-milei-s-shift-on-monetary-authority", "title": {"tr": "Milei, merkez bankasının devlete finansman sağlamasını yasaklayan tasarıyı açıkladı", "en": "Milei unveils a bill barring the central bank from financing the state"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-03", "title": {"tr": "AWS faaliyet kârı 16,6 milyar dolar, sermaye harcaması 173,0 milyar dolar", "en": "AWS operating income of $16.6 billion, capital spending of $173.0 billion"}, "excerpt": {"tr": "Amazon net kârını 62,6 milyar dolar olarak bildirdi ve bu tutarın 53,4 milyar dolar kadarı faaliyet dışı bir kalemden geliyor. Aynı çeyrekte sermaye harcaması 54,2 milyar dolar, son on iki aylık toplam 173,0 milyar dolar. Modelde tek soru var: bu sermayeyi hangi kâr kalemi geri ödeyecek?", "en": "Amazon reported net income of $62.6 billion, of which $53.4 billion came from a non-operating line. In the same quarter capital spending was $54.2 billion, and $173.0 billion over the trailing twelve months. The model has one question: which profit line pays that capital back?"}, "sections": [{"h": {"tr": "Net kârın nereden geldiği", "en": "Where the net income came from"}, "ps": [{"tr": "Amazon ikinci çeyrekte net satışların yüzde 20 artışla 200,6 milyar dolar, faaliyet kârının 27,5 milyar dolar olduğunu bildirdi. Net kâr ise 62,6 milyar dolar, seyreltilmiş hisse başına kâr 5,75 dolar. Aradaki farkın büyük bölümü, şirketin başlıca Anthropic yatırımlarından kaynaklandığını belirttiği 53,4 milyar dolar tutarında faaliyet dışı vergi öncesi diğer gelirden geliyor.", "en": "Amazon reported second quarter net sales up 20 percent to $200.6 billion and operating income of $27.5 billion. Net income, however, was $62.6 billion, or $5.75 per diluted share. Most of the difference comes from $53.4 billion of non-operating pre-tax other income that the company said came primarily from investments in Anthropic.", "refs": ["amazon-q2"]}, {"tr": "Bu kalem bir değerleme kalemi; elden çıkarılmamış bir hissedarlığın taşınan değerindeki değişimi yansıtıyor ve nakit üretmiyor. Sermaye harcamasını finanse etmiyor, borç ödemiyor, kapasite kurmuyor. Değerleme açısından sonuç açık: Amazon için 62,6 milyar dolar üzerinden kurulan her çarpan, işletmenin ürettiği kârdan çok bir yatırımın yeniden fiyatlanmasını çarpıyor.", "en": "That line is a valuation item; it reflects a change in the carrying value of a holding that has not been sold, and it produces no cash. It does not finance capital spending, retire debt or build capacity. For valuation the consequence is plain: any multiple built on $62.6 billion for Amazon multiplies the repricing of an investment more than the profit the business generated.", "refs": ["amazon-q2"]}]}, {"h": {"tr": "Nakde giden köprü", "en": "The bridge to cash"}, "ps": [{"tr": "Nakit tarafında tablo daha açık. Amazon için çeyrek sermaye harcaması 54,2 milyar dolar, son on iki aylık toplam yüzde 64 artışla 173,0 milyar dolar. Aynı dönemde faaliyet nakit akışı yüzde 33 artışla 161,4 milyar dolar olmasına karşın serbest nakit akışı, bir yıl önceki 18,2 milyar dolar tutarındaki girişten 7,6 milyar dolar tutarında çıkışa döndü; şirket bunun başlıca nedeni olarak maddi duran varlık alımlarındaki 66,1 milyar dolar tutarında yıllık artışı gösterdi.", "en": "On the cash side the picture is clearer. For Amazon, capital spending was $54.2 billion in the quarter and $173.0 billion over the trailing twelve months, up 64 percent. Over the same period operating cash flow rose 33 percent to $161.4 billion, yet free cash flow moved from an inflow of $18.2 billion a year earlier to an outflow of $7.6 billion, which the company attributed primarily to a year-over-year increase of $66.1 billion in purchases of property and equipment.", "refs": ["amazon-q2"]}, {"tr": "Bu harcamanın karşılığını üretmesi beklenen kalem AWS ve orada büyüme gerçek: satışlar yüzde 37 artışla 42,2 milyar dolar, faaliyet kârı yüzde 64 artışla 16,6 milyar dolar oldu. Çeyreklik 16,6 milyar dolar, yıllık ölçeğe taşındığında son on iki aylık 173,0 milyar dolar tutarındaki sermaye harcamasının yaklaşık üçte birine denk gelir. Duyarlılık tek bir varsayımda toplanıyor: AWS faaliyet kârı, kurulan kapasitenin amortismanı gider tarafına girdikçe bu hızda büyümeyi sürdürebilir mi? Alternatif okuma da mümkün — kapasite doldukça AWS marjı yükselebilir ve serbest nakit akışındaki açık harcama yavaşlamadan kapanabilir.", "en": "The line expected to earn that spending back is AWS, and the growth there is real: sales rose 37 percent to $42.2 billion and operating income rose 64 percent to $16.6 billion. Scaled to a year, $16.6 billion a quarter is roughly a third of the $173.0 billion of capital spending over the trailing twelve months. The sensitivity collapses into a single assumption: can AWS operating income keep compounding at that rate as depreciation on the new capacity enters costs? The alternative reading is available too — as the capacity fills, the AWS margin could rise and the free cash flow gap could close without the spending slowing.", "refs": ["amazon-q2"]}]}], "sources": [{"key": "amazon-q2", "kind": "news", "name": "Amazon", "url": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Second-Quarter-Results/", "title": {"tr": "Amazon'un çeyrek geliri 200,6 milyar dolara çıkarken sermaye harcaması 54,2 milyar dolar oldu", "en": "Amazon's quarterly sales reached $200.6 billion as capital spending hit $54.2 billion"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-04", "title": {"tr": "Resmi alıcı yavaşladı, ons yerinde durdu", "en": "The official buyer slowed while the ounce held its ground"}, "excerpt": {"tr": "Dünya Altın Konseyi'ne göre merkez bankalarının net altın alımı yılın ilk yarısında 345,4 ton oldu; bunun 288,9 tonu tek başına ikinci çeyrekten geliyor. Aynı çeyrekte toplam talep 1.268,9 ton ile yatay seyretti, LBMA ortalama fiyatı ise bir yıl öncesinin yüzde 37 üzerindeydi.", "en": "The World Gold Council puts central bank net gold purchases at 345.4 tonnes for the first half of the year, 288.9 tonnes of it in the second quarter alone. Total demand in that quarter held flat at 1,268.9 tonnes, while the average LBMA price ran 37 percent above a year earlier."}, "sections": [{"h": {"tr": "Tonaj ile fiyatın ayrıştığı yer", "en": "Where the tonnage and the price part company"}, "ps": [{"tr": "Dünya Altın Konseyi'nin ikinci çeyrek Altın Talep Eğilimleri raporuna göre merkez bankalarının net alımı çeyrekte 288,9 ton, ilk çeyrekte 56,5 ton ve ilk yarıda 345,4 ton oldu. Üç rakam yan yana konduğunda ilk çeyreğin ne kadar zayıf geçtiği görülüyor. Toplam altın talebi ikinci çeyrekte 1.268,9 ton ile bir yıl öncesine göre yatay kaldı; ilk yarı toplamı yüzde 2 artışla 2.522 tona çıktı.", "en": "The World Gold Council's Gold Demand Trends report for the second quarter puts central bank net purchases at 288.9 tonnes for the quarter, 56.5 tonnes for the first quarter and 345.4 tonnes across the first half. Set the three figures side by side and the weakness of the first quarter shows through. Total gold demand in the second quarter held flat at 1,268.9 tonnes year over year, and first half demand reached 2,522 tonnes, a 2 percent increase.", "refs": ["wgc-q2"]}, {"tr": "Değer tarafında tablo bambaşka görünüyor. İlk yarı talebi 380 milyar dolar ile rekor kırdı ve LBMA öğleden sonra fiyatı ikinci çeyrekte ons başına ortalama 4.506,29 dolar oldu — yıllık yüzde 37 yukarıda, ilk çeyreğin rekor düzeyine göre yüzde 8 aşağıda. Değer rakamını taşıyan şey tonajın çarpıldığı fiyat; tonajın kendisi neredeyse yerinde kaldı.", "en": "By value the picture looks entirely different. First half demand reached a record $380 billion, and the LBMA (PM) gold price averaged $4,506.29 an ounce in the second quarter — 37 percent above a year earlier and 8 percent below the first quarter's record high. The value figure follows the price the tonnage was multiplied by; the tonnage itself barely moved.", "refs": ["wgc-q2"]}]}, {"h": {"tr": "Kimin sattığı, kimin aldığı", "en": "Who sold and who bought"}, "ps": [{"tr": "Fiziksel talebin bileşimi çeyrek içinde belirgin biçimde değişti. Borsa yatırım fonlarında 45 tonluk çıkış görüldü ve toplam yatırım talebi yıllık yüzde 46 düşüşle 262,2 tona indi; külçe ve sikke yatırımı 307 ton ile yatay kaldı. Geri çekilen taraf, tahsisini bir talimatla azaltabilen fon yatırımcısı; metali fiziksel olarak elinde tutan alıcı yerinde durdu. Rapor, ılımlı çıkışların zayıflayan altın fiyatlarına ve özellikle Kuzey Amerika'da enflasyon ile faiz beklentilerinin yukarı yönlü güncellenmesine ve güçlenen ABD dolarına tepki olduğunu belirtti.", "en": "The composition of physical demand shifted noticeably within the quarter. Exchange-traded funds saw outflows of 45 tonnes and total investment demand fell 46 percent year on year to 262.2 tonnes, while bar and coin investment remained steady at 307 tonnes. The side that pulled back was the fund investor who can trim an allocation with one instruction; the buyer holding the metal itself stayed put. The report said moderate outflows were in response to weaker gold prices and, particularly in North America, upward adjustments to both inflation and interest rate expectations alongside a strengthening US dollar.", "refs": ["wgc-q2"]}, {"tr": "Buradan çıkan çıkarım şu: ikinci çeyrekte tonajı merkez bankalarının net alımı ayakta tuttu, yatırım talebi ise geri çekildi. Karşı okuma da elde tutulmalı — resmi sektör verileri sonradan düzeltilebiliyor ve ilk yarı rakamı yukarı çekilirse ilk çeyreğin zayıflığı bugünkü kadar keskin görünmez. Yine de izlenecek işaret açık: borsa yatırım fonlarındaki çıkışlar sürerken merkez bankalarının alımı ilk çeyreğin hızına yakın seyrederse, üçüncü çeyrek toplam talebi 1.268,9 tonun altında kalır.", "en": "The inference is that central bank net purchases held the tonnage up in the second quarter, while investment demand retreated. The counter-reading has to stay on the table — official sector data are subject to later revision, and if the first half figure is pulled up the first quarter's weakness will look less stark than it does now. The signal to watch is still clear: if exchange-traded fund outflows continue while central bank purchases run near the first quarter's pace, third quarter total demand lands below 1,268.9 tonnes.", "refs": ["wgc-q2"]}]}], "sources": [{"key": "wgc-q2", "kind": "news", "name": "World Gold Council", "url": "https://www.gold.org/goldhub/research/gold-demand-trends/gold-demand-trends-q2-2026", "title": {"tr": "Merkez bankalarının altın alımı ilk yarıda 345,4 tonda kaldı", "en": "Central bank gold buying came to 345.4 tonnes in the first half"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-05", "title": {"tr": "Tasarruf oranı yüzde 2,7 iken harcama gelirin önüne geçti", "en": "Spending outran income with the saving rate at 2.7 percent"}, "excerpt": {"tr": "Haziranda fiyat etkisinden arındırılmış harcanabilir kişisel gelir yüzde 0,3, reel kişisel tüketim harcamaları yüzde 0,4 arttı. Aradaki fark küçük görünüyor ama aynı ay kişisel tasarruf oranı yüzde 2,7 oldu. Artan harcamayı gelir artışı tek başına açıklamıyor.", "en": "Real disposable personal income rose 0.3 percent in June and real personal consumption expenditures rose 0.4 percent. The gap looks small, but in the same month the personal saving rate was 2.7 percent. Income growth alone does not account for the extra spending."}, "sections": [{"h": {"tr": "Gelen ile giden", "en": "What came in and what went out"}, "ps": [{"tr": "Ekonomik Analiz Bürosu'nun haziran açıklamasına göre kişisel gelir 54,9 milyar dolar, harcanabilir kişisel gelir 48,3 milyar dolar arttı; her ikisi de yüzde 0,2 artışa karşılık geliyor. Fiyat etkisinden arındırılmış harcanabilir kişisel gelirdeki artış yüzde 0,3 oldu. Kişisel tüketim harcamaları 65,2 milyar dolar, yani yüzde 0,3 yükseldi ve fiyat etkisinden arındırılmış olarak yüzde 0,4 arttı. Kişisel tasarruf 646,1 milyar dolar, kişisel tasarruf oranı yüzde 2,7 oldu.", "en": "The Bureau of Economic Analysis reported that in June personal income increased $54.9 billion and disposable personal income $48.3 billion, each an increase of 0.2 percent. Real disposable personal income increased 0.3 percent. Personal consumption expenditures increased $65.2 billion, or 0.3 percent, and real personal consumption expenditures increased 0.4 percent. Personal saving was $646.1 billion and the personal saving rate was 2.7 percent.", "refs": ["bea-june"]}, {"tr": "Aynı açıklamada fiyat tarafı iyi haber gibi duruyor: kişisel tüketim harcamaları fiyat endeksi aylık yüzde 0,1 geriledi. Ama yıllık artış yüzde 3,7'de, gıda ile enerji dışı çekirdek endeks yüzde 3,3'te kaldı. Bir ayın geri gidişi, on iki ayda biriken fiyat düzeyini geri almıyor; hane halkı o düzeyle karşılaşıyor ve bir aylık geri gidiş bu düzeyi zor etkiliyor.", "en": "In the same release the price side reads like good news: the personal consumption expenditures price index decreased 0.1 percent on the month. But its increase from a year earlier held at 3.7 percent, and the core index excluding food and energy at 3.3 percent. One month of decline does not undo the price level built up over twelve; a household meets that level, and one month of decline barely touches it.", "refs": ["bea-june"]}]}, {"h": {"tr": "Yüzde 2,7'nin gizlediği", "en": "What 2.7 percent conceals"}, "ps": [{"tr": "Harcamadaki artışın nereye gittiği de dikkate değer: 65,2 milyar dolar tutarındaki artışın 58,2 milyar dolar kadarı hizmet harcamalarından, yalnızca 7,0 milyar dolar kadarı mal harcamalarından geldi. Hizmet kalemleri — barınma, sağlık, ulaşım, sigorta — çoğunlukla ertelenmesi güç olanlar. Mal alımını bir ay öteleyebilen bir bütçe, kira ödemesini öteleyemiyor. Bu bileşim, artışı tercihten çok zorunluluğun sürüklüyor olabileceğine dair bir işaret veriyor.", "en": "Where the increase in spending went is also worth noting: of the $65.2 billion, $58.2 billion came from services spending and only $7.0 billion from goods spending. Services items — housing, health care, transport, insurance — are largely the ones that are hard to postpone. A budget that can defer a purchase for a month cannot defer the rent. That composition is a signal that necessity may be driving the increase more than choice.", "refs": ["bea-june"]}, {"tr": "Kişisel tasarruf oranının en önemli özelliği ise ülke çapında tek bir sayı olması. Bu seride hangi hanelerin tasarruf ettiği, hangilerinin birikimini tükettiği görünmüyor; varlıklardan elde edilen kişisel gelir toplama giriyor ama o gelirin dağılımı aynı açıklamada yer almıyor. Verinin taşıyabildiği sonuç bu yüzden sınırlı ve yine de sağlam: ülke genelinde reel kişisel tüketim harcamaları, fiyat etkisinden arındırılmış harcanabilir kişisel gelirin önünde ve fark bir yerden karşılanıyor. Karşı okuma, bu serilerin sonraki yayınlarda düzeltilebilmesi — mayısta harcanabilir kişisel gelir cari fiyatlarla yüzde 0,7 artmıştı ve sonraki veriler farkı kapatabilir. Ayırt edecek işaret, reel harcamanın reel gelirin üzerinde seyretmeyi sürdürüp sürdürmediği.", "en": "The most important property of the personal saving rate is that it is a single national number. The series does not show which households are saving and which are drawing down what they have; personal income receipts on assets enter the total, but the distribution of that income does not appear in the same release. What the data can support is therefore limited and still solid: nationally, real personal consumption expenditures are running ahead of real disposable personal income, and the difference is being met from somewhere. The counter-reading is that these series are subject to revision in later releases — in May, current-dollar disposable personal income rose 0.7 percent, and later data could close the gap. The signal that separates the two is whether real spending keeps running above real income.", "refs": ["bea-june"]}]}], "sources": [{"key": "bea-june", "kind": "news", "name": "U.S. Bureau of Economic Analysis", "url": "https://www.bea.gov/news/2026/personal-income-and-outlays-june-2026", "title": {"tr": "ABD'de haziranda çekirdek PCE enflasyonu yıllık yüzde 3,3, tasarruf oranı yüzde 2,7 oldu", "en": "US core PCE inflation ran at 3.3 percent in June and the saving rate fell to 2.7 percent"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-06", "title": {"tr": "Dolaşımdaki USDC'nin yaklaşık üçte biri tek bir borsada duruyor", "en": "About a third of circulating USDC sits at a single venue"}, "excerpt": {"tr": "Coinbase geliri yıllık yüzde 19 daraldı ve şirket 359,5 milyon dolar net zarar açıkladı. Aynı çeyrekte ürünlerinde tutulan ortalama USDC bakiyesi 20 milyar dolar oldu — şirketin kendi ifadesiyle dolaşımdaki toplam USDC'nin yaklaşık yüzde 30'u. Kırılganlığın adresi, zarar kaleminden çok bu oran.", "en": "Coinbase's revenue shrank 19 percent year over year and the company reported a net loss of $359.5 million. In the same quarter, average USDC held in its products reached $20 billion — by the company's own account, approximately 30 percent of total USDC in circulation. The share, more than the loss line, is where the fragility sits."}, "sections": [{"h": {"tr": "Daralan gelir, büyüyen pay", "en": "Shrinking revenue, growing share"}, "ps": [{"tr": "Coinbase ikinci çeyrek toplam gelirinin yıllık yüzde 19 düşüşle 1,22 milyar dolar olduğunu ve 359,5 milyon dolar net zarar bildirdiğini açıkladı; bir yıl önceki ikinci çeyrekte 1,43 milyar dolar net kâr açıklanmıştı. İşlem geliri çeyreklik yüzde 21 düşüşle 599 milyon dolar oldu. Buna karşın küresel kripto işlem hacmindeki payı ilk çeyrekteki yüzde 9,1'den yüzde 10,3'e çıktı ve düzeltilmiş FAVÖK 208 milyon dolar oldu.", "en": "Coinbase reported second quarter total revenue of $1.22 billion, down 19 percent year over year, and a net loss of $359.5 million, compared with net income of $1.43 billion in the second quarter a year earlier. Transaction revenue fell 21 percent quarter over quarter to $599 million. Its crypto trading volume market share nonetheless rose from 9.1 percent in the first quarter to 10.3 percent, and adjusted EBITDA was $208 million.", "refs": ["coinbase-q2"]}, {"tr": "Daralan bir pazarda pay kazanmak tek başına bir hüküm taşımıyor. Anlamı, aynı işlem hacminin daha az sayıda yerde toplanması. Türev tarafında Coinbase son on iki aylık hacmin 4,2 trilyon dolar ile yatay kaldığını, aynı dönemde pazarın yüzde 12 daraldığını bildirdi. Yoğunlaşma, ancak yoğunlaşan şeye göre bir arıza sayılır.", "en": "Gaining share in a shrinking market carries no verdict on its own. It means the same trading volume is collecting in fewer places. On the derivatives side Coinbase reported trailing twelve month volume flat at $4.2 trillion while the market declined 12 percent over the same period. Concentration counts as a fault only in relation to what is concentrating.", "refs": ["coinbase-q2"]}]}, {"h": {"tr": "Yoğunlaşan şey nedir", "en": "What is actually concentrating"}, "ps": [{"tr": "Asıl rakam gelir tablosunun dışında duruyor. Coinbase, ürünlerinde tutulan ortalama USDC bakiyesinin 20 milyar dolar ile en yüksek düzeyine ulaştığını ve bunun dolaşımdaki toplam USDC'nin yaklaşık yüzde 30'una karşılık geldiğini bildirdi; ortalama USDC piyasa değeri 77 milyar dolar düzeyinde. Dolara sabitlenmiş bir kripto paranın dolaşımdaki miktarının yaklaşık üçte birinin tek bir yerde tutulması, o yerin kendi bilançosundan çok bir eşzamanlılık sorusu doğuruyor: aynı anda çıkmak isteyen bakiyelerin tamamı aynı kapıdan geçer.", "en": "The number that matters sits outside the income statement. Coinbase reported that average USDC held in its products reached an all-time high of $20 billion, representing approximately 30 percent of total USDC in circulation, against an average USDC market capitalisation of $77 billion. Holding roughly a third of a dollar-pegged token's circulating supply in one place raises a question of simultaneity, well before any question about that venue's own balance sheet. Balances that want out at the same moment all go through the same door.", "refs": ["coinbase-q2"]}, {"tr": "Bu zincirin karşı argümanı güçlü ve açıkça belirtilmeli: USDC'yi ihraç eden ve geri alan taraf Circle, rezervler Coinbase bilançosunda tutulmuyor ve sabitleme mekanizması bu yere bağlı değil. Yoğunlaşma saklama tarafında; ihraç Circle'da kalıyor. Yine de saklama tarafındaki tıkanma gerçek bir kanal: geri alım talebi tek bir arayüzden geçmek zorunda kaldığında gecikme, sabitlemenin bozulmasından bağımsız olarak fiyat farkı üretebilir. Kaldıraç ya da vade uyumsuzluğu gösteren bir açıklama yok; bilinen şey oranın kendisi ve Coinbase gelirinin işlem tarafından abonelik ve hizmet tarafına kaymakta olduğu.", "en": "The counter-argument to that chain is strong and should be stated plainly: USDC is issued and redeemed by Circle, the reserves are not held on the Coinbase balance sheet, and the peg does not depend on this venue. The concentration sits on the custody side, while issuance stays with Circle. Even so, congestion on the custody side is a real channel: when redemption requests have to pass through a single interface, delay can produce a price gap independently of any break in the peg. There is no disclosure indicating leverage or maturity mismatch; what is known is the share itself, and that Coinbase revenue is shifting from the transaction side to the subscription and services side.", "refs": ["coinbase-q2"]}]}], "sources": [{"key": "coinbase-q2", "kind": "news", "name": "Coinbase", "url": "https://www.sec.gov/Archives/edgar/data/1679788/000167978826000087/q226earningsdeck_sec.htm", "title": {"tr": "Coinbase ikinci çeyrekte 359,5 milyon dolar zarar açıkladı, geliri yüzde 19 daraldı", "en": "Coinbase reported a $359.5 million loss as revenue shrank 19 percent"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-01", "title": {"tr": "Kısa uç geriledi, 30 yıllık 11 baz puan yükseldi", "en": "The short end fell, the 30-year rose 11 basis points"}, "excerpt": {"tr": "Fed hedef aralığı değiştirmedi; getiri eğrisinin kısa ve uzun ucu aynı gün ters yönlere gitti. Aradaki fark, uzun vadeli tahvili elinde tutanın üstünde kaldı.", "en": "The Fed left the target range alone; the short and long ends of the curve went opposite ways on the same day. The difference stayed with whoever holds long-dated paper."}, "sections": [{"h": {"tr": "Aynı günün iki fiyatı", "en": "Two prices from the same day"}, "ps": [{"tr": "Hazine Bakanlığı'nın resmî günlük getiri eğrisi serisi 29 Temmuz için tek bir yön göstermiyor. 30 yıllık getiri bir önceki günün yüzde 5,09 düzeyinden yüzde 5,20'ye, 10 yıllık getiri yüzde 4,61'den yüzde 4,67'ye çıktı. Aynı seansta 2 yıllık getiri yüzde 4,26'dan yüzde 4,22'ye, 3 aylık getiri yüzde 3,90'dan yüzde 3,83'e indi. Eğrinin kısa ucunda getiri düştü, uzun ucunda yükseldi.", "en": "The Treasury's official daily par yield curve series does not point one way for 29 July. The 30-year yield rose to 5.20 percent from 5.09 percent the day before and the 10-year to 4.67 percent from 4.61 percent. In the same session the 2-year fell to 4.22 percent from 4.26 percent and the 3-month to 3.83 percent from 3.90 percent. Yields fell at the short end of the curve and rose at the long end.", "refs": ["treasury"]}, {"tr": "O öğleden sonra Federal Açık Piyasa Komitesi hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında bıraktı. Karar 9'a 3 alındı; Beth M. Hammack, Neel Kashkari ve Lorie K. Logan çeyrek puanlık bir artıştan yana oy kullandı. Metin, enflasyonun yüzde 2 hedefine göre yüksek kaldığını ve bunun bir bölümünün enerji ile diğer sektörlerdeki arz şoklarını yansıttığını yazdı.", "en": "That afternoon the Federal Open Market Committee left the target range at 3.50 percent to 3.75 percent. The vote was 9 to 3, with Beth M. Hammack, Neel Kashkari and Lorie K. Logan voting for a quarter-point increase. The statement said inflation remains elevated relative to the 2 percent goal and that part of it reflects supply shocks in energy and other sectors.", "refs": ["fomc"]}]}, {"h": {"tr": "Hareketin adı", "en": "What the move is"}, "ps": [{"tr": "İki veriyi üst üste koyunca hareketin adı belli oluyor: piyasa yakın vadede daha az sıkılaştırma, uzak vadede daha fazla enflasyon telafisi fiyatladı. Üç karşı oy, kısa vadeli faiz beklentisini yukarı çekmedi — çekseydi 2 yıllık getiri düşmezdi. Tepkiyi uzun uç verdi. Tek bir seansın verisiyle bunu kanıtlamak da mümkün değil: uzun uçtaki yükseliş tahvil arz takvimiyle ya da yatırımcının başka ülkelerdeki uzun vadeli tahvillerden istediği primle de ilgili olabilir ve bir günlük seri bu iki açıklamayı ayırmaya yetmez.", "en": "Put the two series side by side and the move has a name: the market priced less tightening in the near term and more inflation compensation further out. The three dissents did not lift near-term rate expectations — had they done so, the 2-year would not have fallen. The reaction came from the long end. A single session cannot prove that reading either: the rise at the long end may owe something to the issuance calendar, or to the premium investors demand on long-dated government paper elsewhere, and one day of data cannot separate the two.", "refs": ["treasury", "fomc"]}, {"tr": "Ölçek küçük değil. 2 yıllık ile 30 yıllık arasındaki aralık bir günde 83 baz puandan 98 baz puana genişledi. Yüzde 5,20, Hazine'nin 2026 için yayımladığı 144 işlem gününün en yüksek 30 yıllık kapanışı; önceki en yüksek düzey 19 Mayıs'taki yüzde 5,18'di. ABD'de yılın en yüksek uzun vadeli getirisi, politika faizinin hiç değişmediği bir günde geldi.", "en": "The scale is not small. The gap between the 2-year and the 30-year widened from 83 basis points to 98 in one day. The 5.20 percent close is the highest 30-year reading in the 144 business days the Treasury has published for 2026; the previous high was 5.18 percent on 19 May. In the US the year's highest long-dated yield arrived on a day when the policy rate did not move at all.", "refs": ["treasury"]}]}, {"h": {"tr": "Farkın kimde kaldığı", "en": "Where the difference lands"}, "ps": [{"tr": "Ayrışmanın kalıcı olup olmadığı ölçülebilir bir eşikle izlenebilir. Hedef aralığı Fed bir sonraki toplantısında da değiştirmezse, 2 yıllık ile 30 yıllık arasındaki aralığın 31 Ekim'e kadar 98 baz puanın üzerinde kalmasını bekliyorum. Aralık bunun altına inerse okuma yanlıştı ve hareket bir günün gürültüsüydü.", "en": "Whether the split lasts can be watched against a measurable threshold. If the Fed again leaves the target range unchanged at its next meeting, I expect the gap between the 2-year and the 30-year to stay above 98 basis points through 31 October. If the gap falls below that, the reading was wrong and the move was one day's noise.", "refs": ["treasury"]}, {"tr": "28 Temmuz'da yazdığımda piyasanın bir artış olasılığını üçte bir dolayında fiyatladığını okumuştum. Karar artış getirmedi, ama üç karşı oyla geldi ve eğri bu bileşimi kısa uçtan değil, uzun uçtan yanıtladı. Faturayı da elinde uzun vadeli tahvil tutan taşıyor: getirisi 11 baz puan artan 30 yıllık bir tahvilin fiyatı o gün düşmüştür ve bu, kararın adının 'değişiklik yok' olmasını değiştirmez. ABD'de emeklilik fonu ile sigortacı gibi vadesi uzun yükümlülük taşıyanlar için gün, faiz kararının kendisinden daha hareketliydi.", "en": "When I wrote on 28 July, I read the market as pricing something like a one-in-three chance of an increase. The decision brought no increase, but it came with three dissents, and the curve answered that combination at the long end rather than the short one. The bill sits with holders of long-dated paper: a 30-year whose yield rose 11 basis points fell in price that day, and that does not change the fact that the decision was labelled no change. For US pension funds and insurers carrying long-dated liabilities, the day moved more than the rate decision did.", "refs": ["treasury", "history-hike-odds"]}]}], "sources": [{"key": "treasury", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\u0026field_tdr_date_value_month=202607", "title": {"tr": "Otuz yıllık tahvil getirisi yüzde 5,20 ile yılın en yüksek düzeyine çıktı", "en": "The thirty-year Treasury yield rose to 5.20 percent, its highest of the year"}, "publishedDate": "2026-07-29"}, {"key": "fomc", "kind": "news", "name": "Federal Reserve", "url": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm", "title": {"tr": "Fed politika faizini sabit tuttu, üç üye çeyrek puanlık artıştan yana oy verdi", "en": "The Fed held its policy rate and three officials voted for a quarter-point increase"}, "publishedDate": "2026-07-29"}, {"key": "history-hike-odds", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-07-28/", "title": {"tr": "İndirim çağrısına karşılık üçte birlik bir zam ihtimali", "en": "A one-in-three chance of a hike answers the call for cuts"}, "publishedDate": "2026-07-28"}], "date": "2026-07-30"}, {"writer": "eco-02", "title": {"tr": "Karar metni enflasyonun bir bölümünü arz şokuna bağlıyor", "en": "The statement ties part of the inflation to a supply shock"}, "excerpt": {"tr": "Fed faizi sabit tuttu ve gerekçesinde enerji kaynaklı arz şoklarını andı. Fiyat düzeyinin bir bölümü politika faizinin doğrudan ulaşamadığı yerdeyse, üç karşı oy güvenilirlikle ilgilidir, aktarım mekanizmasıyla değil.", "en": "The Fed held its rate and cited supply shocks in energy. If part of the price level sits where a policy rate cannot directly reach, the three dissents are about credibility, not about transmission."}, "sections": [{"h": {"tr": "Kendi gerekçesini okumak", "en": "Reading the statement's own reasoning"}, "ps": [{"tr": "Komite 29 Temmuz'da hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında bıraktı. Metinde ekonomik etkinliğin yüksek belirsizliğe karşın sağlam bir hızda büyüdüğü, istihdam artışının işgücüne ayak uydurduğu ve işsizlik oranının pek değişmediği yazılı. Enflasyon için de yüzde 2 hedefinin üzerinde kaldığı, bunun bir bölümünün enerji ile diğer sektörlerdeki arz şoklarını yansıttığı belirtiliyor. Karar 9'a 3 alındı; Hammack, Kashkari ve Logan çeyrek puanlık artışı tercih etti.", "en": "On 29 July the Committee left the target range at 3.50 percent to 3.75 percent. The statement records that activity is expanding at a solid pace despite elevated uncertainty, that job gains have kept pace with the workforce and that the unemployment rate has changed little. On inflation it says the rate remains above the 2 percent goal and that part of it reflects supply shocks in energy and other sectors. The vote was 9 to 3, with Hammack, Kashkari and Logan preferring a quarter-point increase.", "refs": ["fomc"]}, {"tr": "Bir merkez bankası, arzdan gelen bir fiyat artışına ancak dolaylı bir yerden dokunabilir: talebi kısarak. Kanal kredinin fiyatından geçer — banka kredisinin faizi, şirket tahvilinin getirisi, hanenin taksiti — ve etkisi aylar değil çeyrekler içinde belirir. Metnin kendi gerekçesi bu yüzden bir sınır da çiziyor: çeyrek puanlık bir artış, enerji kaynaklı bileşeni doğrudan hedefleyemez. Karşı tarafın en güçlü hâlini de söylemek gerekir: bir artış, arz şokunun ikinci tur etkilerini beklentiler üzerinden kesebilir; o zaman soru fiyatın kendisinden artışın sepette yayılıp yayılmadığına kayar.", "en": "A central bank can touch a price increase that comes from supply only indirectly, by compressing demand. The channel runs through the price of credit — the rate on a bank loan, the yield on a corporate bond, the household instalment — and it shows up over quarters, not months. The statement's own reasoning therefore draws a boundary: a quarter-point increase cannot target the energy-driven component directly. The other side deserves its strongest form: an increase can cut the second-round effects of a supply shock through expectations, and then the question shifts from the price itself to whether the increase spreads across the basket.", "refs": ["fomc"]}]}, {"h": {"tr": "Uzun paranın fiyatını kim koyuyor?", "en": "Who sets the price of long money?"}, "ps": [{"tr": "Aynı gün Hazine'nin resmî serisinde 3 aylık getiri yüzde 3,90'dan yüzde 3,83'e, 2 yıllık yüzde 4,26'dan yüzde 4,22'ye indi. 30 yıllık ise yüzde 5,09'dan yüzde 5,20'ye çıktı ve 2 yıllık ile arasındaki aralık 83 baz puandan 98 baz puana genişledi. Kısa vadeli borçlanmanın fiyatı düştü, uzun vadeli borçlanmanın fiyatı yükseldi.", "en": "In the Treasury's official series the same day, the 3-month yield fell to 3.83 percent from 3.90 percent and the 2-year to 4.22 percent from 4.26 percent. The 30-year, by contrast, rose to 5.20 percent from 5.09 percent, and its gap to the 2-year widened from 83 basis points to 98. The cost of borrowing short fell; the cost of borrowing long rose.", "refs": ["treasury"]}, {"tr": "Rezervlerin fiyatını, yani eğrinin en kısa ucunu yalnızca Fed belirler. Şirketin yatırım kararını, hazinenin faiz yükünü ve uzun vadeli konut kredisini bağlayan uç ise 30 yıllık taraftır ve o uç, kararın açıklandığı gün ters yöne gitti. Aktarımın bu bölümü kararın imzasında değil, alıcının teklifinde oluşuyor: bir banka kredi açtığında mevduatı da o kredi yaratır, ama kredinin fiyatını uzun uçta ne bulacağını Fed yazmıyor.", "en": "Only the Fed sets the price of reserves, that is, the shortest end of the curve. The end that binds a company's investment decision, the Treasury's interest burden and a long-dated mortgage is the 30-year, and it went the other way on the day the decision was announced. This part of the transmission is settled in the buyer's bid rather than in the signature on the decision: when a bank extends credit the deposit is cre
