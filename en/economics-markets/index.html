<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: full width, no scroll box, shareable via #hash. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }

      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }

    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{

    }

    #briefsSection .section-title .date-select{

    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without

  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){

    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}

    }

    }

function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}

}, true);

ties"}, "crypto": {"tr": "Kripto", "en": "Crypto"}}}, "latestNews": [{"featured": true, "topic": "economics-markets", "tag": "macro", "src": "Australian Bureau of Statistics", "url": "https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Avustralya'da yıllık enflasyon haziranda yüzde 3,8'e indi, budanmış ortalama yerinde kaldı", "en": "Australian annual inflation eased to 3.8 percent in June while the trimmed mean held"}, "summary": {"tr": "Avustralya İstatistik Bürosu'nun aylık tüketici fiyatları göstergesine göre haziranda yıllık artış yüzde 3,8 oldu; mayısta yüzde 4,0 ölçülmüştü. Budanmış ortalama ise yüzde 3,6 düzeyinde kaldı. Aylık değişim hem ham hem de mevsimsellikten arındırılmış seride yüzde 0,1 azalış olarak açıklandı.", "en": "The Australian Bureau of Statistics monthly consumer price indicator rose 3.8 percent over the year to June, down from 4.0 percent in May, while the trimmed mean was unchanged at 3.6 percent. The monthly movement was a fall of 0.1 percent in both original and seasonally adjusted terms."}, "detail": {"tr": "Yıllık artışa en büyük katkıyı yüzde 6,8 ile konut grubu yaptı; bu oran mayısta yüzde 6,5 idi. Grup içinde konut elektriği yüzde 22,4, yeni konutlar yüzde 5,8, kiralar yüzde 3,6 yükseldi. Gıda ve alkolsüz içecekler ile eğlence ve kültür gruplarında yıllık artış yüzde 3,3 oldu. Hizmet fiyatları yıllık yüzde 4,0, mal fiyatları yüzde 3,5 arttı. Büro veri setini 29 Temmuz saat 11.30'da (AEST) yayımladı.", "en": "Housing was the largest contributor to the annual figure at 6.8 percent, up from 6.5 percent in May. Within that group, residential electricity rose 22.4 percent, new dwellings 5.8 percent and rents 3.6 percent. Food and non-alcoholic beverages and recreation and culture each rose 3.3 percent. Services prices rose 4.0 percent over the year against 3.5 percent for goods. The bureau published the data at 11.30am AEST on 29 July."}, "editionDate": "2026-07-29"}, {"featured": true, "topic": "economics-markets", "tag": "companies", "src": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "summary": {"tr": "Güney Koreli bellek üreticisi ikinci çeyrekte 79.318,7 milyar won gelir ve 60.542,6 milyar won faaliyet kârı bildirdi. Faaliyet marjı yüzde 76 oldu. Net kâr 93.922,6 milyar won olarak açıklandı ve net marj yüzde 118 olarak raporlandı.", "en": "The South Korean memory maker reported second-quarter revenue of 79,318.7 billion won and operating profit of 60,542.6 billion won, an operating margin of 76 percent. Net income came in at 93,922.6 billion won, a reported net margin of 118 percent."}, "detail": {"tr": "Gelir bir yıl önceki 22.232 milyar won düzeyine göre yüzde 257, faaliyet kârı 9.212,9 milyar won düzeyine göre yüzde 557 arttı. Önceki çeyrekle karşılaştırıldığında gelir 52.576,3 milyar won düzeyinden yüzde 51, faaliyet kârı 37.610,3 milyar won düzeyinden yüzde 61 yükseldi. Şirket çeyrek sonunda nakit ve nakit benzerlerinin 88 trilyon won düzeyine çıktığını, toplam borcun 18,6 trilyon won düzeyine gerilediğini ve net nakit pozisyonunun 69,4 trilyon won olduğunu bildirdi. Açıklamada HBM4 ürününde seri sevkiyatın başladığı, yaklaşık 10 müşteriyle uzun vadeli anlaşma yapıldığı ve yatırım harcamalarında disiplinin korunduğu belirtildi.", "en": "Revenue rose 257 percent from 22,232 billion won a year earlier and operating profit 557 percent from 9,212.9 billion won. Against the prior quarter, revenue rose 51 percent from 52,576.3 billion won and operating profit 61 percent from 37,610.3 billion won. The company said cash and equivalents reached 88 trillion won at the end of the quarter, total debt fell to 18.6 trillion won and the net cash position stood at 69.4 trillion won. It also said mass shipments of HBM4 had begun, that it had long-term agreements with around 10 customers, and that it was maintaining capital-expenditure discipline."}, "editionDate": "2026-07-29"}, {"featured": true, "topic": "economics-markets", "tag": "markets", "src": "Fortune", "url": "https://fortune.com/2026/07/28/why-are-stocks-down-chips-panic-semiconductors/", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Çip endeksi dördüncü seansını da kaybetti, Nasdaq-100 zirvesinin yüzde 9,7 altına indi", "en": "The chip index lost a fourth straight session as the Nasdaq-100 fell 9.7 percent below its record"}, "summary": {"tr": "Amerikan yarı iletken endeksi SOX salı günü yüzde 6'ya varan düşüşle üst üste dördüncü seansını kaybetti. Nasdaq-100 rekor seviyesinin yüzde 9,7 altına gerileyerek düzeltme eşiğinin hemen altında kapandı. Güney Kore'de Kospi endeksi yüzde 11'e yakın düşüşle kapanırken 2026 yılının sekizinci devre kesicisini gördü.", "en": "The American semiconductor index SOX fell as much as 6 percent on Tuesday, a fourth straight losing session, and the Nasdaq-100 ended 9.7 percent below its record high, just short of a correction. South Korea's Kospi closed down nearly 11 percent, triggering its eighth circuit breaker of 2026."}, "detail": {"tr": "Fiyat hareketiyle aynı hafta açıklanan tedarik verileri ters yöne işaret ediyor: haber, üçüncü çeyrek DRAM sözleşmelerinin bu ay yüzde 20 ile yüzde 30 arasında daha yüksek fiyatlardan bağlandığını aktarıyor. Alphabet bu yıla ilişkin yatırım harcaması öngörüsünü 205 milyar dolar düzeyine yükseltti; 2025 yılında bu tutar 91 milyar dolar idi. Moody's, en büyük altı bulut altyapı şirketinin bu yıl yaklaşık 785 milyar dolar, 2027 yılında ise 1 trilyon dolar düzeyine yakın harcama yapmasını bekliyor. D.A. Davidson teknoloji analisti Gil Luria, yapay zekâ yatırımı etrafında yoğun bir panik bulunduğunu söyledi.", "en": "Supply data published in the same week point the other way: the report says third-quarter contracts for DRAM are settling 20 percent to 30 percent higher this month. Alphabet raised its capital-expenditure guidance for this year to 205 billion dollars, against 91 billion dollars in 2025. Moody's expects the six largest cloud-infrastructure companies to spend roughly 785 billion dollars this year and close to 1 trillion dollars in 2027. Gil Luria, a technology analyst at D.A. Davidson, said there was a great deal of panic around the artificial-intelligence investment."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Ford Motor Company", "url": "https://www.sec.gov/Archives/edgar/data/37996/000003799626000155/exhibit99tojuly282026for.htm", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Ford ikinci çeyrekte zarar açıkladı, yıl sonu faaliyet kârı öngörüsünü yukarı çekti", "en": "Ford posts a second-quarter loss and raises its full-year operating profit guidance"}, "summary": {"tr": "Şirketin ikinci çeyrek geliri 48,3 milyar dolar oldu ve bir yıl öncesine göre 1,9 milyar dolar geriledi. Net zarar 1,3 milyar dolar olarak açıklandı; bu sonucun içinde 4,2 milyar dolar tutarında vergi öncesi özel kalem gideri yer alıyor. Düzeltilmiş EBIT ise 0,4 milyar dolar artarak 2,5 milyar dolar oldu.", "en": "Second-quarter revenue was 48.3 billion dollars, down 1.9 billion dollars from a year earlier. The company reported a net loss of 1.3 billion dollars, a figure that includes 4.2 billion dollars of pre-tax special item charges. Adjusted EBIT rose 0.4 billion dollars to 2.5 billion dollars."}, "detail": {"tr": "Özel kalemlerin büyük bölümü BlueOval SK ortak girişiminin elden çıkarılmasına bağlı 3,6 milyar dolar tutarında ve ağırlıklı olarak nakit çıkışı gerektirmeyen bir gider ile aralık 2025'te duyurulan elektrikli araç program dirdi; artış nominal yüzde 14, sabit kur bazında yüzde 13 oldu. Genel kabul görmüş muhasebe ilkelerine göre net kâr 5,6 milyar dolar ve seyreltilmiş hisse başına kâr 2,97 dolar olarak açıklandı.", "en": "The payments company reported net revenue of 11.6 billion dollars in its fiscal third quarter, up 14 percent nominally and 13 percent on a constant-dollar basis. Net income under generally accepted accounting principles was 5.6 billion dollars and diluted earnings per share 2.97 dollars."}, "detail": {"tr": "Şirketin düzeltilmiş net kârı 6,3 milyar dolar, düzeltilmiş seyreltilmiş hisse başına kârı 3,32 dolar oldu; iki kalemdeki artış sırasıyla yüzde 10 ve yüzde 11 olarak bildirildi. Ödeme hacmi sabit kur bazında yüzde 10 büyüdü. Sınır ötesi hacim toplamda yüzde 13, Avrupa içi işlemler hariç tutulduğunda yüzde 12 arttı. İşlenen işlem sayısı 71,7 milyara ulaştı ve yüzde 10 yükseldi. Müşteri teşvikleri yüzde 18 artışla 4,7 milyar dolar oldu. Şirket çeyrek boyunca ortalama 330,71 dolar fiyattan 14,5 milyon hisse geri aldı.", "en": "Adjusted net income was 6.3 billion dollars and adjusted diluted earnings per share 3.32 dollars, with growth of 10 percent and 11 percent respectively. Payments volume grew 10 percent on a constant-dollar basis. Cross-border volume rose 13 percent in total and 12 percent excluding intra-Europe transactions. Processed transactions reached 71.7 billion, up 10 percent. Client incentives rose 18 percent to 4.7 billion dollars. The company repurchased 14.5 million shares during the quarter at an average price of 330.71 dollars."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Seagate Technology", "url": "https://investors.seagate.com/news/news-details/2026/Seagate-Technology-Reports-Fiscal-Fourth-Quarter-and-Fiscal-Year-2026-Financial-Results/default.aspx", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Seagate mali yılı 12,2 milyar dolar gelir ve 3,1 milyar dolar serbest nakit akışıyla kapattı", "en": "Seagate closed its fiscal year with 12.2 billion dollars of revenue and 3.1 billion dollars of free cash flow"}, "summary": {"tr": "Depolama üreticisi 3 Temmuz 2026'da sona eren mali dördüncü çeyrekte 3,6 milyar dolar gelir bildirdi. Çeyrek brüt marjı genel kabul görmüş ilkelere göre yüzde 52,3, düzeltilmiş bazda yüzde 52,7 oldu. Seyreltilmiş hisse başına kâr sırasıyla 5,58 dolar ve 5,71 dolar olarak açıklandı.", "en": "The storage manufacturer reported 3.6 billion dollars of revenue in the fiscal fourth quarter ended 3 July 2026. Gross margin was 52.3 percent under generally accepted accounting principles and 52.7 percent on an adjusted basis. Diluted earnings per share were 5.58 dollars and 5.71 dollars respectively."}, "detail": {"tr": "Mali yılın tamamında gelir 12,2 milyar dolar oldu ve bir önceki yıla göre yüzde 34 arttı. Yıllık brüt marj yüzde 45,6, düzeltilmiş brüt marj yüzde 46,1 oldu; seyreltilmiş hisse başına kâr 13,90 dolar ve düzeltilmiş bazda 15,58 dolar olarak bildirildi. Faaliyetlerden gelen nakit 3,7 milyar dolar, serbest nakit akışı 3,1 milyar dolar oldu. Şirket yıl boyunca 1,4 milyar dolar tutarında borç kapattı ve hissedarlarına 810 milyon dolar aktardı. Eylülde biten çeyrek için 100 milyon dolar sapma payıyla 4,1 milyar dolar gelir ve 0,20 dolar sapma payıyla 7,30 dolar düzeltilmiş hisse başına kâr öngörüsü verdi.", "en": "Full-year revenue was 12.2 billion dollars, 34 percent higher than the prior year. Annual gross margin was 45.6 percent and adjusted gross margin 46.1 percent, with diluted earnings per share of 13.90 dollars and 15.58 dollars on an adjusted basis. Cash from operations was 3.7 billion dollars and free cash flow 3.1 billion dollars. The company retired 1.4 billion dollars of debt over the year and returned 810 million dollars to shareholders. For the quarter ending in September it guided to 4.1 billion dollars of revenue plus or minus 100 million dollars, and adjusted diluted earnings per share of 7.30 dollars plus or minus 0.20 dollars."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "KLA Corporation", "url": "https://www.sec.gov/Archives/edgar/data/319201/000031920126000024/exhibit991earningsrelease7.htm", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "KLA mali dördüncü çeyrekte 3,658 milyar dolar gelir bildirdi", "en": "KLA reported 3.658 billion dollars of revenue in its fiscal fourth quarter"}, "summary": {"tr": "Yarı iletken ölçüm ve denetim ekipmanı üreticisi 30 Haziran 2026'da sona eren çeyrekte 3,658 milyar dolar gelir açıkladı. Seyreltilmiş hisse başına kâr genel kabul görmüş ilkelere göre 1,04 dolar, düzeltilmiş bazda 1,05 dolar oldu.", "en": "The semiconductor metrology and inspection equipment maker reported 3.658 billion dollars of revenue for the quarter ended 30 June 2026. Diluted earnings per share were 1.04 dollars under generally accepted accounting principles and 1.05 dollars on an adjusted basis."}, "detail": {"tr": "Mali yılın tamamında gelir 13,579 milyar dolar oldu ve bir önceki yılın 12,156 milyar dolar düzeyine göre yüzde 11,6 arttı. Yıllık net kâr 4,831 milyar dolar oldu. Şirket yıl boyunca hissedarlarına toplam 3,348 milyar dolar aktardı; bunun 1,058 milyar dolar tutarındaki kısmı temettü, 2,290 milyar dolar tutarındaki kısmı hisse geri alımıydı. Eylülde biten çeyrek için 200 milyon dolar sapma payıyla 4,0 milyar dolar gelir ve 0,10 dolar sapma payıyla 1,16 dolar düzeltilmiş hisse başına kâr öngörüsü verildi. Aynı dönem için düzeltilmiş brüt marj öngörüsü yüzde 62,5 olarak açıklandı.", "en": "Full-year revenue was 13.579 billion dollars, 11.6 percent above the prior year's 12.156 billion dollars. Annual net income was 4.831 billion dollars. The company returned 3.348 billion dollars to shareholders over the year, of which 1.058 billion dollars was dividends and 2.290 billion dollars share repurchases. For the quarter ending in September it guided to 4.0 billion dollars of revenue plus or minus 200 million dollars and adjusted diluted earnings per share of 1.16 dollars plus or minus 0.10 dollars. Adjusted gross margin guidance for the same period was 62.5 percent."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "NXP Semiconductors", "url": "https://www.sec.gov/Archives/edgar/data/1413447/000141344726000044/nxp2q26exhibit991.htm", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "NXP'nin ikinci çeyrek geliri yüzde 19 artarken büyümeyi sanayi ve iletişim taşıdı", "en": "NXP revenue rose 19 percent in the second quarter, carried by industrial and communications demand"}, "summary": {"tr": "Hollanda merkezli yonga üreticisi ikinci çeyrekte 3,5 milyar dolar gelir bildirdi; artış yıllık yüzde 19, çeyreklik yüzde 10 oldu. Düzeltilmiş brüt marj yüzde 58,0, düzeltilmiş faaliyet marjı yüzde 35,1 olarak açıklandı.", "en": "The Dutch chipmaker reported second-quarter revenue of 3.5 billion dollars, up 19 percent year on year and 10 percent sequentially. Adjusted gross margin was 58.0 percent and adjusted operating margin 35.1 percent."}, "detail": {"tr": "Uç pazarlar arasında otomotiv 1.938 milyon dolar ile en büyük kalem oldu ve yıllık yüzde 12 büyüdü. Sanayi ve nesnelerin interneti 755 milyon dolar düzeyine yükselerek yüzde 38, iletişim altyapısı ve diğer 452 milyon dolar düzeyine çıkarak yüzde 41 arttı. Mobil 351 milyon dolar ile yüzde 6 büyüdü. Faaliyetlerden gelen nakit 860 milyon dolar, serbest nakit akışı 791 milyon dolar oldu ve gelirin yüzde 22,6 kadarına denk geldi. Şirket üçüncü çeyrek için 3.650-3.850 milyon dolar gelir öngördü.", "en": "Among end markets, automotive was the largest at 1,938 million dollars, growing 12 percent year on year. Industrial and internet of things rose 38 percent to 755 million dollars and communications infrastructure and other rose 41 percent to 452 million dollars. Mobile grew 6 percent to 351 million dollars. Cash from operations was 860 million dollars and free cash flow 791 million dollars, equal to 22.6 percent of revenue. The company guided to third-quarter revenue of 3,650 to 3,850 million dollars."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "The Conference Board", "url": "https://www.conference-board.org/topics/consumer-confidence/press/CCI-July-2026", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "ABD'de tüketici güveni temmuzda 90,8'e geriledi, mevcut durum üçüncü ayında düştü", "en": "US consumer confidence slipped to 90.8 in July as the present situation reading fell for a third month"}, "summary": {"tr": "The Conference Board'un tüketici güven endeksi temmuzda 1,4 puan azalarak 90,8 düzeyine indi; haziranda 92,2 ölçülmüştü. Mevcut Durum Endeksi 3,6 puan düşüşle 114,9 düzeyine geriledi ve üst üste üçüncü kez azaldı. Beklentiler Endeksi 74,7 düzeyinde değişmedi.", "en": "The Conference Board consumer confidence index fell 1.4 points to 90.8 in July, from 92.2 in June. The Present Situation Index dropped 3.6 points to 114.9, its third consecutive monthly decline. The Expectations Index was unchanged at 74.7."}, "detail": {"tr": "İş bulma koşullarına ilişkin fark 0,7 puan azalarak yüzde 3,1 oldu; bu ölçüt işin bol olduğunu söyleyenlerin oranından işin zor bulunduğunu söyleyenlerin oranı çıkarılarak hesaplanıyor. Ankete katılanların yüzde 24,6 işin bol olduğunu, yüzde 21,5 işin zor bulunduğunu belirtti. Anket 1-22 Temmuz arasında yapıldı. Kurumun baş ekonomisti Dana M. Peterson, güvenin temmuzda hafif gerilediğini ve 2021 yılı sonundan bu yana genel olarak aşağı eğimli bir seyir izlediğini, mevcut durum ölçütünün üçüncü ay üst üste zayıfladığını ve beklentiler ölçütünün olumsuz bölgede kaldığını belirtti.", "en": "The labour differential, calculated as the share of respondents saying jobs are plentiful minus the share saying jobs are hard to get, narrowed 0.7 percentage points to 3.1 percent. Among respondents, 24.6 percent said jobs are plentiful and 21.5 percent said jobs are hard to get. The survey ran from 1 to 22 July. Dana M. Peterson, the organisation's chief economist, said confidence moderated slightly in July and had followed a generally downward trajectory since late 2021, that the present situation measure was less positive for a third consecutive month, and that the expectations measure remained in negative territory."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "S\u0026P Dow Jones Indices", "url": "https://press.spglobal.com/2026-07-28-S-P-Cotality-Case-Shiller-Index-Reports-Annual-Gain-in-May-2026", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "ABD konut fiyatları mayısta yıllık yüzde 1,1 arttı, reel bazda on ikinci ayında geriledi", "en": "US home prices rose 1.1 percent over the year to May and fell in real terms for a twelfth month"}, "summary": {"tr": "S\u0026P Cotality Case-Shiller ulusal konut fiyat endeksi mayısta yıllık yüzde 1,1 arttı; nisandaki artış yüzde 0,9 idi. On şehirlik bileşik endeks yüzde 2,4, yirmi şehirlik bileşik endeks yüzde 1,6 yükseldi. Yayında, mayıs enflasyonunun yüzde 4,2 olması nedeniyle konut değerlerinin üst üste on ikinci ay reel olarak gerilediği belirtildi.", "en": "The S\u0026P Cotality Case-Shiller national home price index rose 1.1 percent over the year to May, against 0.9 percent in April. The ten-city composite rose 2.4 percent and the twenty-city composite 1.6 percent. The release noted that home values fell in real terms for a twelfth consecutive month, as May inflation of 4.2 percent ran above the nominal gain."}, "detail": {"tr": "Aylık bazda mevsimsellikten arındırılmamış seride ulusal endeks yüzde 0,6, on ve yirmi şehirlik bileşikler yüzde 0,9 arttı. Mevsimsellikten arındırılmış seride ulusal endeks yüzde 0,05 geriledi; on şehirlik bileşik yüzde 0,3, yirmi şehirlik bileşik yüzde 0,15 yükseldi. Şehirler arasındaki fark açık: Chicago yıllık yüzde 6,9 ile en güçlü, Las Vegas eksi yüzde 1,9 ile en zayıf pazar oldu. Yayında konut kredisi faizlerinin yüzde 6,5 düzeyinde kalmasının satın alınabilirlik üzerinde baskı yarattığı ifade edildi.", "en": "In not seasonally adjusted terms the national index rose 0.6 percent on the month and both composites rose 0.9 percent. Seasonally adjusted, the national index slipped 0.05 percent while the ten-city composite rose 0.3 percent and the twenty-city composite 0.15 percent. The spread across cities was wide: Chicago was the strongest market at 6.9 percent year on year and Las Vegas the weakest at minus 1.9 percent. The release said mortgage rates at 6.5 percent continued to weigh on affordability."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "The Coca-Cola Company", "url": "https://investors.coca-colacompany.com/news-events/press-releases/detail/1168/coca-cola-reports-second-quarter-2026-results-and-raises-full-year-guidance", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Coca-Cola ikinci çeyrekte yüzde 7 gelir artışı bildirdi ve yıl sonu öngörüsünü yükseltti", "en": "Coca-Cola reported 7 percent revenue growth in the second quarter and raised its full-year guidance"}, "summary": {"tr": "Şirketin net geliri ikinci çeyrekte yüzde 7 artarak 13,4 milyar dolar oldu; organik gelir artışı yüzde 6 olarak açıklandı. Bu artışın 4 puanı konsantre satışlarından, 2 puanı fiyat ve ürün karmasından geldi. Hisse başına kâr yüzde 16 artışla 1,03 dolar, karşılaştırmalı hisse başına kâr yüzde 11 artışla 0,97 dolar oldu.", "en": "Net revenues rose 7 percent to 13.4 billion dollars in the second quarter, with organic revenue up 6 percent. Four points of that came from concentrate sales and two points from price and mix. Earnings per share rose 16 percent to 1.03 dollars and comparable earnings per share 11 percent to 0.97 dollars."}, "detail": {"tr": "Faaliyet marjı bir yıl önceki yüzde 34,1 düzeyinden yüzde 34,9 düzeyine, karşılaştırmalı faaliyet marjı yüzde 34,7 düzeyinden yüzde 35,6 düzeyine çıktı. Küresel kutu hacmi yüzde 5 büyüdü; Asya-Pasifik yüzde 8, Avrupa-Orta Doğu-Afrika yüzde 4, Latin Amerika ve Kuzey Amerika yüzde 3 arttı. Şirket, 2026 FIFA Dünya Kupası kampanyasının Trademark Coca-Cola markasındaki yüzde 5 ve Powerade markasındaki yüzde 8 hacim büyümesine katkı verdiğini bildirdi. Yıl sonu organik gelir artışı öngörüsü yüzde 4-5 aralığından yaklaşık yüzde 5 düzeyine, karşılaştırmalı hisse başına kâr artışı öngörüsü yüzde 8-9 aralığından yüzde 9-10 aralığına çekildi; serbest nakit akışı beklentisi 12,2 milyar dolar düzeyinden yaklaşık 12,4 milyar dolar düzeyine yükseltildi.", "en": "Operating margin rose to 34.9 percent from 34.1 percent a year earlier and comparable operating margin to 35.6 percent from 34.7 percent. Global unit case volume grew 5 percent, with Asia Pacific up 8 percent, Europe, Middle East and Africa up 4 percent, and Latin America and North America each up 3 percent. The company said its 2026 FIFA World Cup campaign contributed to 5 percent volume growth for Trademark Coca-Cola and 8 percent for Powerade. Full-year organic revenue growth guidance was raised from a range of 4 to 5 percent to approximately 5 percent, and comparable earnings per share growth from a range of 8 to 9 percent to a range of 9 to 10 percent, while the free cash flow expectation was raised from 12.2 billion dollars to approximately 12.4 billion dollars."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "UPS", "url": "https://about.ups.com/us/en/newsroom/press-releases/financials/ups-releases-2q-2026-earnings.html", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "UPS ikinci çeyrekte 891 milyon dolar dönüşüm gideri yazdı, yıl sonu öngörüsünü yükseltti", "en": "UPS booked 891 million dollars of transformation charges in the second quarter and raised its full-year outlook"}, "summary": {"tr": "Kargo şirketi ikinci çeyrekte 22,8 milyar dolar konsolide gelir ve 930 milyon dolar faaliyet kârı bildirdi. Düzeltilmiş faaliyet kârı 2,1 milyar dolar oldu. Seyreltilmiş hisse başına kâr 0,71 dolar, düzeltilmiş bazda 1,76 dolar olarak açıklandı.", "en": "The delivery company reported consolidated revenue of 22.8 billion dollars and operating profit of 930 million dollars in the second quarter. Adjusted operating profit was 2.1 billion dollars. Diluted earnings per share were 0.71 dollars and 1.76 dollars on an adjusted basis."}, "detail": {"tr": "İki rakam arasındaki farkı büyük ölçüde vergi sonrası 891 milyon dolar tutarındaki dönüşüm gideri açıklıyor; bu tutar hisse başına 1,05 dolar düzeyine denk geliyor ve ağırlıklı olarak tamamlanan Driver Choice programı kapsamındaki iş gücü azaltımına bağlı ayrılma maliyetlerinden oluşuyor. Söz konusu programın maliyeti 1,1 milyar dolar olarak bildirildi ve yıl sonu için öngörülen 1,3-1,5 milyar dolar aralığının içinde yer alıyor. Yurt içi ABD segmenti 14,930 milyar dolar gelir ile yüzde 6 büyürken faaliyet marjı yüzde 0,1 düzeyinde kaldı; düzeltilmiş marj yüzde 8,0 oldu. Uluslararası segment yüzde 12,5 artışla 5,044 milyar dolar, tedarik zinciri çözümleri yüzde 7,8 artışla 2,860 milyar dolar oldu. Şirket yıl sonu gelir beklentisini yaklaşık 91,2 milyar dolar, düzeltilmiş faaliyet kârını yaklaşık 8,65 milyar dolar ve düzeltilmiş hisse başına kârı yaklaşık 7,22 dolar düzeyine yükseltti.", "en": "The gap between the two figures is largely explained by 891 million dollars of after-tax transformation charges, equal to 1.05 dollars per share, consisting mainly of separation costs from the workforce reduction under the completed Driver Choice Program. The company put that programme's cost at 1.1 billion dollars, within a full-year range of 1.3 to 1.5 billion dollars. The US domestic segment grew 6 percent to 14.930 billion dollars but held an operating margin of 0.1 percent, or 8.0 percent adjusted. International revenue rose 12.5 percent to 5.044 billion dollars and supply chain solutions 7.8 percent to 2.860 billion dollars. The company raised full-year guidance to approximately 91.2 billion dollars of revenue, approximately 8.65 billion dollars of adjusted operating profit and approximately 7.22 dollars of adjusted diluted earnings per share."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Boeing", "url": "https://boeing.mediaroom.com/2026-07-28-Boeing-Reports-Second-Quarter-Results", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Boeing ikinci çeyrekte zarar bildirdi, sipariş defteri 715 milyar dolar düzeyine çıktı", "en": "Boeing reported a second-quarter loss as its backlog rose to 715 billion dollars"}, "summary": {"tr": "Uçak üreticisi ikinci çeyrekte 24,6 milyar dolar gelir bildirdi. Genel kabul görmüş ilkelere göre hisse başına zarar 0,67 dolar, çekirdek hisse başına zarar 0,76 dolar oldu. Faaliyetlerden gelen nakit 1,4 milyar dolar, serbest nakit akışı 0,6 milyar dolar olarak açıklandı.", "en": "The aircraft maker reported second-quarter revenue of 24.6 billion dollars. Loss per share was 0.67 dollars under generally accepted accounting principles and 0.76 dollars on a core basis. Operating cash flow was 1.4 billion dollars and free cash flow 0.6 billion dollars."}, "detail": {"tr": "Ticari Uçaklar bölümü 11,8 milyar dolar gelir ile eksi yüzde 2,7 faaliyet marjı bildirdi ve çeyrekte 171 uçak teslim etti; bunların 129 adedi 737, 25 adedi 787 idi. Savunma, Uzay ve Güvenlik 7,5 milyar dolar gelir ile eksi yüzde 0,2 marj açıkladı ve VC-25B programında 280 milyon dolar tutarında gider yazdı. Küresel Hizmetler 5,3 milyar dolar gelir ile yüzde 18,1 marj bildirdi. Şirketin toplam sipariş defteri 715 milyar dolar düzeyine ulaştı; bunun 597 milyar dolar tutarındaki bölümü Ticari Uçaklar'a ait ve 6.200'den fazla uçağı kapsıyor. 737 programı çeyrek içinde ayda 47 adetlik üretim hızına geçiş başlattı.", "en": "Commercial Airplanes reported an operating margin of minus 2.7 percent on 11.8 billion dollars of revenue and delivered 171 aircraft in the quarter, of which 129 were 737s and 25 were 787s. Defense, Space and Security reported a margin of minus 0.2 percent on 7.5 billion dollars of revenue and recorded a charge of 280 million dollars on the VC-25B programme. Global Services reported an 18.1 percent margin on 5.3 billion dollars of revenue. Total company backlog reached 715 billion dollars, of which 597 billion dollars belongs to Commercial Airplanes and covers more than 6,200 aircraft. The 737 programme began transitioning to a rate of 47 per month during the quarter."}, "editionDate": "2026-07-29"}, {"featured": false, "topic": "economics-markets", "tag": "crypto", "src": "CoinDesk", "url": "https://www.coindesk.com/markets/2026/07/28/bitcoin-slides-2-after-u-s-close-while-korea-s-kospi-plunges-10", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Bitcoin ABD kapanışının ardından yüzde 2,7 geriledi, ether ve XRP yükseldi", "en": "Bitcoin fell 2.7 percent after the US close while ether and XRP rose"}, "summary": {"tr": "Bitcoin yaklaşık 65.000 dolar düzeyinden 63.200 dolar düzeyine inerek yüzde 2,7 değer kaybetti. Aynı gün ether yüzde 1,52 artışla 1.902,76 dolar, XRP yüzde 1,24 artışla 1,07 dolar oldu; solana yüzde 0,27 azalarak 73,10 dolar düzeyine indi. CoinDesk 20 endeksi yüzde 1,04 artışla 1.734,58 düzeyine çıktı.", "en": "Bitcoin fell about 2.7 percent from nearly 65,000 dollars to roughly 63,200 dollars. On the same day ether rose 1.52 percent to 1,902.76 dollars and XRP rose 1.24 percent to 1.07 dollars, while solana fell 0.27 percent to 73.10 dollars. The CoinDesk 20 index rose 1.04 energy pressure and a cool, closed institutional structure"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}, {"id": "eco-earnings-capacity-cash-divide", "topic": "economics-markets", "title": {"tr": "Büyüme manşetlerinin altında kapasite, nakit ve ürün karması ayrışıyor", "en": "Below the growth headlines, capacity, cash and product mix diverge"}, "summary": {"tr": "Alphabet, Tesla ve IBM sonuçları, gelir büyümesinin yatırım ihtiyacı, nakit dönüşümü ve ürün döngüsü hesaba katılmadan tek başına okunamayacağını gösteriyor.", "en": "Results from Alphabet, Tesla and IBM show why revenue growth cannot be read alone without considering investment needs, cash conversion and product cycles."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-23/eco-earnings-capacity-cash-divide-1280.8f24a35bde5a.webp", "variants": [{"src": "/assets/briefs/2026-07-23/eco-earnings-capacity-cash-divide-640.8e19e55d875f.webp", "width": 640}, {"src": "/assets/briefs/2026-07-23/eco-earnings-capacity-cash-divide-1280.8f24a35bde5a.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Kapasite blokları, nakit kanalları ve eski-yeni teknoloji katmanları arasında ayrışan soyut kurumsal büyüme ağı", "en": "An abstract corporate growth network diverging among capacity blocks, cash channels and legacy-to-modern technology layers"}, "generatedAt": "2026-07-23"}, "editionDate": "2026-07-23", "hasAnalysis": true}, {"id": "eco-energy-risk-three-horizons", "topic": "economics-markets", "title": {"tr": "Enerji riski spot fiyattan depoya ve şirket yönlendirmesine üç ufukta ilerliyor", "en": "Energy risk moves across three horizons: spot prices, storage and guidance"}, "summary": {"tr": "Petrol, Avrupa gazı ve Southwest kayıtları, enerji baskısının jeopolitik olay, fiziksel arz dengesi ve işletme maliyeti üzerinden farklı zamanlarda görünür olduğunu ortaya koyuyor.", "en": "Records on oil, European gas and Southwest show energy pressure becoming visible at different times through geopolitical events, physical supply balances and operating costs."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-23/eco-energy-risk-three-horizons-1280.087f14a61a5b.webp", "variants": [{"src": "/assets/briefs/2026-07-23/eco-energy-risk-three-horizons-640.f33b00713dc0.webp", "width": 640}, {"src": "/assets/briefs/2026-07-23/eco-energy-risk-three-horizons-1280.087f14a61a5b.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Deniz geçidi, gaz depoları ve havayolu maliyet katmanını üç zaman ufkunda birleştiren soyut enerji ağı", "en": "An abstract energy network connecting a sea passage, gas storage and an airline cost layer across three time horizons"}, "generatedAt": "2026-07-23"}, "editionDate": "2026-07-23", "hasAnalysis": true}, {"id": "eco-market-access-rulebook-fractures", "topic": "economics-markets", "title": {"tr": "Pazara erişim tek kapıdan değil, sahiplik, rekabet ve yatırımcı kurallarından geçiyor", "en": "Market access runs through ownership, competition and investor rules"}, "summary": {"tr": "Otomobil satışı, medya birleşmesi ve Çinli bir çip şirketine yatırım erişimi, farklı hukuk ve piyasa eşiklerinin şirketler ile yatırımcılar için ayrı kapılar kurduğunu gösteriyor.", "en": "Auto sales, a media merger and investment access to a Chinese chipmaker show different legal and market thresholds creating separate gates for companies and investors."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-23/eco-market-access-rulebook-fractures-1280.b15e5f6c710d.webp", "variants": [{"src": "/assets/briefs/2026-07-23/eco-market-access-rulebook-fractures-640.9851703cd503.webp", "width": 640}, {"src": "/assets/briefs/2026-07-23/eco-market-access-rulebook-fractures-1280.b15e5f6c710d.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Araç, medya birleşmesi ve çip yatırımı yollarını farklı eşiklerden yatlardan bağlanıyor. Alphabet bu yılın yatırım harcaması öngörüsünü 205 milyar dolar düzeyine yükseltti; 2025 yılında bu kalem 91 milyar dolar idi. Moody's, en büyük altı bulut altyapı şirketinin bu yıl yaklaşık 785 milyar dolar harcamasını bekliyor.", "en": "Two supply-side series published in the same week look the other way. Third-quarter DRAM contracts are settling 20 percent to 30 percent higher this month. Alphabet raised its capital-expenditure guidance for this year to 205 billion dollars, from 91 billion dollars in 2025. Moody's expects the six largest cloud-infrastructure companies to spend roughly 785 billion dollars this year.", "refs": ["fortune-selloff"]}]}, {"h": {"tr": "Faaliyet rakamı ne söylüyor", "en": "What the operating number says"}, "ps": [{"tr": "Ertesi gün gelen tek büyük faaliyet verisi de aynı yöne işaret etti. SK hynix ikinci çeyrekte 79.318,7 milyar won gelir ve 60.542,6 milyar won faaliyet kârı bildirdi; faaliyet marjı yüzde 76 oldu ve bir önceki çeyreğe göre gelir yüzde 51, faaliyet kârı yüzde 61 arttı. Şirket ayrıca HBM4 ürününde seri sevkiyatın başladığını ve yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını bildirdi.", "en": "The one large operating release that followed pointed the same way. SK hynix reported second-quarter revenue of 79,318.7 billion won and operating profit of 60,542.6 billion won, an operating margin of 76 percent, with revenue up 51 percent and operating profit up 61 percent on the prior quarter. The company also said mass shipments of HBM4 had begun and that it had signed long-term agreements with around 10 customers.", "refs": ["skhynix-q2"]}, {"tr": "Sözleşme fiyatı, yatırım harcaması öngörüsü ve çeyreklik faaliyet marjı; üçü de yakın vadeli nakit girdilerinin bozulduğunu göstermiyor. Bu durumda dört seanslık kaybı, talep beklentisindeki bir revizyondan çok aynı yöne yığılmış pozisyonların çözülmesiyle açıklamak daha tutarlı görünüyor. Aynı verilerle uyumlu ikinci bir okuma da var: piyasa 2027 yılında bir sindirme dönemini şimdiden iskonto ediyor olabilir ve böyle bir beklenti cari sözleşmelerde henüz görünmez.", "en": "Contract pricing, capital-expenditure guidance and the quarterly operating margin all fail to show near-term cash inputs deteriorating. On that reading, four sessions of losses fit an unwind of crowded positioning better than a revision to expected demand. A second reading is equally consistent with the same data: the market may already be discounting a digestion phase in 2027, and such an expectation would not yet appear in current contracts.", "refs": ["fortune-selloff", "skhynix-q2"]}]}, {"h": {"tr": "İki okumayı ayıracak gözlem", "en": "The observation that separates them"}, "ps": [{"tr": "D.A. Davidson teknoloji analisti Gil Luria, yapay zekâ yatırımı etrafında yoğun bir panik bulunduğunu ve bu paniğin ayrım gözetmez göründüğünü söyledi. Bu bir yorumdur ve yönü sınanabilir bir iddia taşır: ayrım gözetmeyen bir satış, girdi ekonomisi iyileşen isimleri de kötüleşenlerle birlikte aşağı taşır.", "en": "Gil Luria, a technology analyst at D.A. Davidson, said there was a great deal of panic around the artificial-intelligence investment and that the panic appeared indiscriminate. That is interpretation, and it carries a testable direction: an indiscriminate selloff carries names whose input economics are improving down alongside those whose are not.", "refs": ["fortune-selloff"]}, {"tr": "Ayırt edici gözlem sözleşme masasındadır. Dördüncü çeyrek DRAM sözleşmeleri yatay ya da daha düşük fiyatlardan bağlanır ve bulut altyapı şirketleri bir sonraki bilanço turunda yatırım harcaması öngörüsünü aşağı çekerse, düşüş gözden geçirilmiş bir temel görünümü fiyatlıyor demektir. Bu iki koşul kasım sonuna kadar gerçekleşmez ve harcama planı korunursa, dört seanslık kayıp bir konumlanma hareketi olarak kalır.", "en": "The distinguishing observation sits at the contract table. If fourth-quarter DRAM contracts settle flat or lower and the cloud-infrastructure companies trim capital-expenditure guidance at the next reporting round, the decline is pricing a revised set of fundamentals. If neither condition arrives by the end of November and the spending plans hold, four sessions of losses remain a positioning move.", "refs": ["fortune-selloff"]}]}], "sources": [{"key": "fortune-selloff", "kind": "news", "name": "Fortune", "url": "https://fortune.com/2026/07/28/why-are-stocks-down-chips-panic-semiconductors/", "title": {"tr": "Çip endeksi dördüncü seansını da kaybetti, Nasdaq-100 zirvesinin yüzde 9,7 altına indi", "en": "The chip index lost a fourth straight session as the Nasdaq-100 fell 9.7 percent below its record"}, "publishedDate": "2026-07-28"}, {"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-02", "title": {"tr": "Manşet 3,8'e inerken elektrik yüzde 22,4 arttı", "en": "The headline fell to 3.8 while electricity rose 22.4 percent"}, "excerpt": {"tr": "Avustralya'nın haziran verisinde manşet gerilerken budanmış ortalama kıpırdamadı. Bileşim, fiyat artışının hangi bilançoda oturduğunu manşetten daha iyi anlatıyor.", "en": "In Australia's June reading the headline eased while the trimmed mean did not move. The composition says more than the headline about which balance sheet the price increase is sitting on."}, "sections": [{"h": {"tr": "İki seri, iki ayrı hikâye", "en": "Two series, two different stories"}, "ps": [{"tr": "Avustralya İstatistik Bürosu'nun aylık göstergesine göre haziranda tüm gruplar tüketici fiyat artışı yıllık yüzde 3,8 düzeyine indi; mayısta yüzde 4,0 ölçülmüştü. Aylık değişim hem ham hem mevsimsellikten arındırılmış seride yüzde 0,1 azalış oldu. Budanmış ortalama ise yüzde 3,6 düzeyinde kaldı ve hiç kıpırdamadı.", "en": "On the Australian Bureau of Statistics monthly indicator, all-groups consumer price growth eased to 3.8 percent over the year to June, from 4.0 percent in May. The monthly movement was a fall of 0.1 percent in both original and seasonally adjusted terms. The trimmed mean stayed at 3.6 percent and did not move at all.", "refs": ["abs-cpi"]}, {"tr": "Bu iki serinin ayrışması tesadüf değildir. Budanmış ortalama, dağılımın iki ucundaki en oynak kalemleri kesip atarak hesaplanır. Manşeti aşağı çeken kalemler tam da budanan uçlarda yer alıyorsa, manşetteki düşüş sürecin kendisi hakkında budanmış ortalamanın söylediğinden fazlasını söylemez. Haziran verisinde durum budur.", "en": "The divergence between these two series is not accidental. The trimmed mean is calculated by cutting away the most volatile items at either tail of the distribution. If the items dragging the headline down sit precisely in those trimmed tails, the fall in the headline says no more about the underlying process than the trimmed mean does. That is the situation in the June data.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Faturayı kim taşıyor", "en": "Who is carrying the bill"}, "ps": [{"tr": "Yıllık artışa en büyük katkı yüzde 6,8 ile konut grubundan geldi ve bu oran mayıstaki yüzde 6,5 düzeyinin üzerinde. Grubun içinde konut elektriği yıllık yüzde 22,4 arttı; yeni konutlar yüzde 5,8, kiralar yüzde 3,6 yükseldi. Gıda ve alkolsüz içecekler yüzde 3,3 düzeyinde kaldı. Hizmet fiyatları yüzde 4,0, mal fiyatları yüzde 3,5 arttı.", "en": "Housing was the largest contributor to the annual figure at 6.8 percent, above May's 6.5 percent. Within the group, residential electricity rose 22.4 percent over the year, new dwellings 5.8 percent and rents 3.6 percent. Food and non-alcoholic beverages held at 3.3 percent. Services prices rose 4.0 percent and goods prices 3.5 percent.", "refs": ["abs-cpi"]}, {"tr": "Elektrik, kira ve konut inşa maliyeti hane bütçesinde ikame edilmesi en zor kalemlerdir. Bu üçünün hızlandığı bir bileşimde artış, harcamayı erteleyerek değil, başka kalemleri kısarak ya da borçlanarak karşılanır. Politika faizinin çalıştığı kanal ise talebi erteletmek üzerine kuruludur. Yani bu bileşimdeki bir fiyat artışı, faizin en zayıf tuttuğu yerden geçer.", "en": "Electricity, rent and the cost of building a dwelling are the hardest items in a household budget to substitute away from. In a composition where all three are accelerating, the increase is absorbed by cutting other spending or by borrowing, not by deferring the purchase. The channel a policy rate works through is built on deferral. A price increase with this composition therefore passes through the point where the rate has least grip.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Rakip açıklama ve sınanabilir eşik", "en": "The rival explanation and a testable threshold"}, "ps": [{"tr": "Bu okumanın rakibi var ve zayıf da değil. Hizmetlerdeki yüzde 4,0 artış, mal fiyatlarındaki yüzde 3,5 artışın üstünde. Hizmet fiyatları ücret maliyetine mal fiyatlarından daha duyarlıdır ve bu fark, maliyet şokunun ücret üzerinden bir sürece dönüşmeye başladığı okumasıyla da uyumludur. Tek bir aylık yayın, idari fiyat kanalı ile ücret kanalını birbirinden ayıramaz; bunun için ücret ve birim işgücü maliyeti serilerine bakmak gerekir.", "en": "This reading has a rival, and not a weak one. Services at 4.0 percent sit above goods at 3.5 percent. Services prices are more sensitive to wage costs than goods prices are, and that gap is also consistent with a cost shock beginning to turn into a wage process. A single monthly release cannot separate the administered-price channel from the wage channel; that requires the wage and unit labour cost series.", "refs": ["abs-cpi"]}, {"tr": "Eşik şöyle konabilir. Eylül ayı yayınına kadar budanmış ortalama yüzde 3,5 ve üzerinde kalır ve konut grubu yüzde 6 düzeyinin üzerinde seyrederse, manşetteki gerileme bileşim etkisidir ve altta yatan süreçte bir değişikli
