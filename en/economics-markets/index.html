ığı varsayım", "en": "The assumption the margin is carrying"}, "ps": [{"tr": "Bu farkı anlamlı kılan sayı düzeltilmiş faaliyet marjı: yüzde 8,2. Bu seviyede her ek gelir dolarının yaklaşık sekiz senti düzeltilmiş faaliyet kârına dönüşüyor. Yüzde 62 bir büyüme oranı ile yüzde 8,2 bir marj yan yana konduğunda ortaya çıkan tablo, kıt olan girdinin teknoloji olmadığı, hacim ve tedarik tahsisi olduğu bir iş modeline işaret ediyor. Donanım platformu satışlarının yüzde 58 artışla yaklaşık 1,9 milyar dolar seviyesine ulaşması da bu okumayı destekliyor.", "en": "The figure that makes that difference meaningful is the adjusted operating margin: 8.2 percent. At that level roughly eight cents of every incremental revenue dollar becomes adjusted operating profit. Put a 62 percent growth rate next to an 8.2 percent margin and the picture points to a business whose scarce input is volume and supply allocation rather than technology. Hardware platform sales rising 58 percent to about $1.9 billion supports the same reading.", "refs": ["celestica"]}, {"tr": "Kârın gelirden hızlı yükseltilmesi, ek gelirin mevcut yüzde 8,2 seviyesinin üzerinde bir marjla geleceği varsayımını taşıyor. Bu varsayım savunulabilir: hacim arttıkça sabit maliyetler dağılır ve donanım platformu satışlarının payı yükselir. Ancak aynı sonucu üretecek başka bir yol daha var — hisse başına kâr, faaliyet marjı hiç değişmeden de faiz gideri, vergi oranı ya da hisse sayısındaki bir değişiklikle yükselebilir. Açıklanan veriler bu iki yolu birbirinden ayırmıyor.", "en": "Lifting earnings faster than revenue carries the assumption that the incremental revenue arrives at a margin above the current 8.2 percent. That assumption is defensible: fixed costs spread as volume rises and the hardware platform share increases. There is another route to the same result, though — earnings per share can rise with no change in operating margin, through interest expense, the tax rate or the share count. The disclosed figures do not separate those two routes.", "refs": ["celestica"]}]}, {"h": {"tr": "Bir çeyrek sonra ayrışacak", "en": "One quarter will separate them"}, "ps": [{"tr": "Ayrım için beklenmesi gereken süre kısa. Celestica üçüncü çeyrek için 5,25 milyar dolar ile 5,55 milyar dolar arasında gelir ve 2,88 dolar ile 3,08 dolar arasında düzeltilmiş hisse başına kâr öngörüyor. Üçüncü çeyrek düzeltilmiş faaliyet marjı yüzde 8,2 seviyesinin üzerinde açıklanırsa, yükseltmeyi taşıyan varsayımın faaliyet tarafında olduğu görülür. Marj yerinde sayar ve kâr yine de aralığın üst ucunda çıkarsa, farkı üreten kalem faaliyet satırının altındadır.", "en": "The wait for that separation is short. Celestica guides to third-quarter revenue between $5.25 billion and $5.55 billion and adjusted earnings per share between $2.88 and $3.08. If the third-quarter adjusted operating margin prints above 8.2 percent, the assumption behind the raise sits on the operating side. If the margin holds flat and earnings still come in at the top of the range, the line producing the difference is below the operating line.", "refs": ["celestica"]}]}], "sources": [{"key": "celestica", "kind": "news", "name": "Celestica", "url": "https://www.globenewswire.com/news-release/2026/07/27/3333904/0/en/Celestica-Announces-Second-Quarter-2026-Financial-Results.html", "title": {"tr": "Celestica geliri yüzde 62 arttı, yıl beklentisini yükseltti", "en": "Celestica revenue rises 62 percent and the company lifts its full-year outlook"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-04", "title": {"tr": "Brent ateşkesi fiyatladı, yük hâlâ uzun yoldan gidiyor", "en": "Brent priced the ceasefire; the cargo still takes the long way"}, "excerpt": {"tr": "Brent bir seansta dokuz puan geri verdi. Aynı gün Suudi ham petrolünün Babülmendep çıkışı durdu ve Süveyş Kanalı üzerinden taşınan miktar ikiye katlandı. Fiyat ile rota ters yöne gidiyor.", "en": "Brent gave back nine points in a session. The same day Saudi crude stopped leaving through Bab al-Mandeb and volumes through the Suez Canal doubled. Price and route are moving in opposite directions."}, "sections": [{"h": {"tr": "Ekranda dokuz puan", "en": "Nine points on the screen"}, "ps": [{"tr": "Brent pazartesi günü yüzde 9,13 gerileyerek varil başına 87,94 dolar, WTI yüzde 7,94 düşüşle 82,22 dolar seviyesine indi. Bir hafta önce fiyat 102 dolar seviyesine yaklaşmıştı. Hareketin gerekçesi askeri: ABD, İran hedeflerine yönelik 13 gece süren saldırılarını durdurdu ve Washington bunun için resmi bir açıklama yapmadı. Bir seansta fiyatlanan şey teslim edilmiş bir varil değil; saldırıların durmuş olması.", "en": "Brent fell 9.13 percent on Monday to $87.94 a barrel and WTI 7.94 percent to $82.22. A week earlier prices had approached $102. The reason given is military: the United States halted 13 consecutive nights of strikes on Iranian targets, and Washington issued no official explanation. What a single session priced was not a delivered barrel; it was the halt in strikes.", "refs": ["oil"]}]}, {"h": {"tr": "Rota ne yaptı", "en": "What the route did"}, "ps": [{"tr": "Fiziki tarafta gün ters yönde geçti. İran destekli Husiler Suudi limanlarına deniz ablukası ilan etti ve Kızıldeniz ile Babülmendep Boğazı'nda gemilere saldırdı. Sonucu iki sayı özetliyor: Suudi ham petrolünün Babülmendep üzerinden ihracatı durdu ve Süveyş Kanalı üzerinden taşınan miktar iki katına çıkarak günde 1,06 milyon varile ulaştı. Bir çıkış kapandığında hacim yok olmaz, yer değiştirir; kuzeye kayan bu 1,06 milyon varil, güney çıkışının fiilen kapandığının ölçüsü.", "en": "On the physical side the day went the other way. Iran-backed Houthis declared a maritime embargo on Saudi ports and attacked vessels in the Red Sea and the Bab al-Mandeb strait. Two numbers summarise the result: Saudi crude exports through Bab al-Mandeb stopped, and volumes carried through the Suez Canal doubled to 1.06 million barrels a day. When one exit closes the volume does not vanish, it relocates; those 1.06 million barrels moving north are the measure of how firmly the southern exit has shut.", "refs": ["oil"]}, {"tr": "İki gün önceki yazımda Kızıldeniz'de yükselen savaş riski sigortası ile düşen vadeli fiyat arasındaki ayrışmayı işlemiş ve vadeli fiyatın fiziki riski küçümsediğini savunmuştum. O yazıda eksik olan, rota değişikliğinin büyüklüğüydü; primler ve dışlama koşulları görünüyordu, taşınan hacim görünmüyordu. Süveyş Kanalı rakamı o boşluğu dolduruyor ve tezi aynı yönde güçlendiriyor.", "en": "In my column two days ago I examined the divergence between rising war-risk insurance in the Red Sea and a falling futures price, and argued that the futures price understated the physical risk. What that piece lacked was the size of the rerouting; the premiums and exclusion terms were visible, the volume moved was not. The Suez Canal figure fills that gap and strengthens the argument in the same direction.", "refs": ["oil", "history-redsea"]}]}, {"h": {"tr": "Eşik", "en": "The threshold"}, "ps": [{"tr": "Buradaki çıkarımın zayıf noktası açık: Süveyş Kanalı üzerindeki artış ablukadan değil, mevsimsel ya da sözleşmeye bağlı bir yönlendirmeden de kaynaklanmış olabilir ve tek bir günün rakamı bunu ayırmaya yetmez. Ayrım için beklenecek şey belli. Abluka yerinde kalırsa, Süveyş Kanalı üzerinden taşınan ham petrol miktarı günde bir milyon varilin üzerinde tutunur; abluka gevşerse aynı hacim güney rotasına döner ve Brent'in pazartesi günü fiyatladığı gevşeme, geç de olsa fiziki tarafta karşılığını bulur. Ümit Burnu üzerinden sapmalar ise her iki durumda da rotanın en pahalı ucunu gösterir.", "en": "The weak point in the inference is plain: the increase through the Suez Canal could reflect seasonal or contractual routing rather than the embargo, and a single day's figure cannot separate the two. What to wait for is equally plain. If the embargo holds, crude volumes through the Suez Canal stay above one million barrels a day; if it loosens, the same volume returns to the southern route and the easing Brent priced on Monday finds its physical counterpart, late. Diversions round the Cape of Good Hope, in either case, mark the most expensive end of the route.", "refs": ["oil"]}]}], "sources": [{"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}, {"key": "history-redsea", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-25/", "title": {"tr": "Kızıldeniz'de sigorta duvarı ve düşen vadeli petrol fiyatı", "en": "A Red Sea insurance wall and a falling oil futures price"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "eco-05", "title": {"tr": "Girdi 41,3, satış 25,6 — aradaki farkı kim taşıyor?", "en": "Inputs at 41.3, output at 25.6 — who carries the difference?"}, "excerpt": {"tr": "Teksas imalatçıları Dallas Fed anketinde hammadde fiyatlarının satış fiyatlarından hızlı arttığını bildiriyor. Üretim hızlanırken istihdam endeksinin gerilemesi, farkın nereye yazıldığına dair bir ipucu veriyor.", "en": "In the Dallas Fed survey Texas manufacturers report input prices rising faster than the prices they charge. Production accelerating while the employment index eases is a clue about where that difference is being booked."}, "sections": [{"h": {"tr": "İki endeks arasındaki fark", "en": "The gap between two indexes"}, "ps": [{"tr": "Dallas Fed'in 27 Temmuz'da yayımladığı temmuz imalat anketinde hammadde fiyatları endeksi 42,4 seviyesinden 41,3 seviyesine, mamul fiyatları endeksi 28,6 seviyesinden 25,6 seviyesine geriledi. İkisi de düştü, ama aradaki fark yerinde duruyor: firmalar ödedikleri fiyatların arttığını, satabildikleri fiyatların ise belirgin biçimde daha az arttığını bildiriyor. Ankete katılan bir matbaa üreticisi, gümrük vergilerinin ve savaşın belirsizlik yaratmayı ve marjları daraltmayı sürdürdüğünü aktardı.", "en": "In the July manufacturing survey published by the Dallas Fed on July 27, the raw materials prices index eased to 41.3 from 42.4 and the finished goods prices index to 25.6 from 28.6. Both fell, but the gap between them held: firms report that the prices they pay are rising and the prices they can charge are rising markedly less. A printing manufacturer responding to the survey said tariffs and the war continue to create uncertainty and compress margins.", "refs": ["dallasfed"]}, {"tr": "Aynı ankette faaliyet tarafı güçlendi. Üretim endeksi 4,1 seviyesinden 10,1 seviyesine, yeni siparişler endeksi 2,3 seviyesinden 6,4 seviyesine, genel iş etkinliği endeksi 0,0 seviyesinden 1,3 seviyesine çıktı ve şirketlerin kendi görünümüne ilişkin endeks 11,1 puan artarak 13,4 seviyesine ulaştı. Bu tablonun içinde ters yönde hareket eden tek başlık istihdam: endeks 13,9 seviyesinden 12,2 seviyesine indi.", "en": "In the same survey the activity side strengthened. The production index rose to 10.1 from 4.1, new orders to 6.4 from 2.3 and general business activity to 1.3 from 0.0, while the index of companies' own outlook gained 11.1 points to 13.4. Within that picture one heading moved the other way: employment, where the index fell to 12.2 from 13.9.", "refs": ["dallasfed"]}]}, {"h": {"tr": "Farkı kim taşıyor", "en": "Who carries the difference"}, "ps": [{"tr": "Satış fiyatına geçmeyen bir maliyet artışı üç yere gidebilir: kâra, çalışma saatine ya da kadroya. Üretimin hızlanıp istihdam endeksinin gerilemesi, ilk ikisinin şu an daha çok kullanıldığını düşündürüyor — aynı ya da daha yüksek çıktı, daha az yeni işe alımla üretiliyor. İmalatçıların kendi ifadesi de bunu destekliyor: daralan şey marj. Ancak istihdam endeksi 12,2 ile hâlâ belirgin biçimde pozitif; bu gerileme aydan aya olağan bir dalgalanma da olabilir ve tek bir ayın hareketinden bir istihdam yavaşlaması çıkarmak fazla ileri gitmek olur.", "en": "A cost increase that does not pass into selling prices can go to three places: profit, hours or headcount. Production accelerating while the employment index eases suggests the first two are currently doing more of the work — the same or higher output produced with less new hiring. The manufacturers' own words point the same way: what is compressing is margin. Yet the employment index remains clearly positive at 12.2; that decline may equally be ordinary month-to-month movement, and reading a hiring slowdown out of a single month's change would be going too far.", "refs": ["dallasfed"]}, {"tr": "Girdi tarafı için önümüzdeki aylarda bir rahatlama görünüyor. Ham petrol pazartesi günü sert geriledi: Brent yüzde 9,13 düşüşle varil başına 87,94 dolar seviyesine indi. Enerji, imalatın hem doğrudan girdisi hem de nakliye maliyeti; bu düşüş sürerse hammadde fiyatları endeksinin ağustos anketinde daha da gerilemesi beklenebilir. Mamul fiyatları endeksinin aynı hızla düşmemesi ise beklenen sonuç, çünkü fiyat indirimi maliyet indiriminden sonra gelir.", "en": "For the input side, relief appears to be coming in the months ahead. Crude fell sharply on Monday: Brent dropped 9.13 percent to $87.94 a barrel. Energy is both a direct input to manufacturing and a transport cost; if that decline persists, the raw materials prices index may ease further in the August survey. That the finished goods index would not fall as fast is the expected outcome, because price cuts follow cost cuts.", "refs": ["dallasfed", "oil"]}]}, {"h": {"tr": "Bu veri neyi göstermiyor", "en": "What this data does not show"}, "ps": [{"tr": "Dikkatli olunması gereken nokta ölçünün kendisi. Bu bir yayılma endeksi: kaç firmanın artış, kaç firmanın azalış bildirdiğini ölçer, artışın ya da azalışın büyüklüğünü değil. Dolayısıyla marjın ne kadar daraldığını, hangi ücret diliminde çalışanın kaç saat kaybettiğini ya da bir hanenin gelirine ne olduğunu bu veriden çıkarmak mümkün olmuyor. Anket firmayı sayıyor, haneyi saymıyor; sıkışmanın kime yazıldığı sorusunun yanıtı ücret ve hane verisinde duruyor.", "en": "The point to be careful about is the measure itself. This is a diffusion index: it counts how many firms report an increase and how many a decrease, not the size of either. It is therefore not possible to derive from it how far margins compressed, which pay band lost how many hours, or what happened to a household's income. The survey counts firms and does not count households; the answer to who the squeeze is booked against sits in wage and household data.", "refs": ["dallasfed"]}]}], "sources": [{"key": "dallasfed", "kind": "news", "name": "Federal Reserve Bank of Dallas", "url": "https://www.dallasfed.org/research/surveys/tmos/2026/2607", "title": {"tr": "Teksas imalat anketinde üretim hızlandı, istihdam endeksi geriledi", "en": "Production accelerated in the Texas factory survey while the employment index eased"}, "publishedDate": "2026-07-27"}, {"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-06", "title": {"tr": "On beş yıllık kiraya karşılık bu yılın 249,2 milyon dolar zararı", "en": "Fifteen-year rent against this year's $249.2 million loss"}, "excerpt": {"tr": "Applied Digital 15 yıllık üç kira sözleşmesi duyurdu ve aynı mali yılda 249,2 milyon dolar zarar yazdı. Kırılganlık sözleşmede değil; sermayenin çıktığı an ile kiranın geldiği an arasındaki mesafede duruyor.", "en": "Applied Digital announced three 15-year leases and booked a $249.2 million loss in the same fiscal year. The fragility sits not in the contract; it sits in the distance between when the capital goes out and when the rent comes in."}, "sections": [{"h": {"tr": "Sözleşmenin uzunluğu", "en": "The length of the contract"}, "ps": [{"tr": "Şirket 15 yıllık üç kira sözleşmesi duyurdu: 300 megavatlık Delta Forge 1 için yaklaşık 7,5 milyar dolar, 300 megavatlık Polaris Forge 3 için yaklaşık 7,5 milyar dolar ve çeyrek sonrası imzalanan 210 megavatlık Delta Forge 2 için yaklaşık 5,2 milyar dolar sözleşmeli gelir. Applied Digital'in duyurduğu bu üç sözleşme, on beş yıla yayılmış bir gelir taahhüdü anlamına geliyor.", "en": "The company announced three 15-year leases: about $7.5 billion of contracted revenue for the 300-megawatt Delta Forge 1, about $7.5 billion for the 300-megawatt Polaris Forge 3 and about $5.2 billion for the 210-megawatt Delta Forge 2 signed after the quarter. Those three contracts announced by Applied Digital amount to a revenue commitment spread over fifteen years.", "refs": ["apld"]}, {"tr": "Bu taahhüdün karşısında duran sayılar aynı açıklamada yer alıyor. Mali yılın tamamında gelir yüzde 167 artışla 611,3 milyon dolar seviyesine çıktı, düzeltilmiş faiz, vergi ve amortisman öncesi kâr 107,2 milyon dolar oldu ve net zarar 249,2 milyon dolar seviyesine ulaştı. Dördüncü çeyrekte veri merkezi kira geliri 44,1 milyon dolar taban kira ile 6,5 milyon dolar kiracı geri ödemesinden oluştu; aynı çeyrekteki net zarar 110,6 milyon dolar.", "en": "The numbers standing against that commitment sit in the same release. For the full fiscal year revenue rose 167 percent to $611.3 million, adjusted EBITDA was $107.2 million and the net loss reached $249.2 million. In the fourth quarter, data centre rental revenue consisted of $44.1 million of base rent and $6.5 million of tenant recoveries; the net loss in that same quarter was $110.6 million.", "refs": ["apld"]}]}, {"h": {"tr": "Zaman uyuşmazlığı", "en": "The timing mismatch"}, "ps": [{"tr": "Bu iki sayı kümesi arasındaki ilişki, kredi riskinin nerede oturduğunu gösteriyor. Sözleşmeli gelir ileriye dönük bir vaattir; inşaat ise bugünkü nakittir. Düzeltilmiş kârın 107,2 milyon dolar ile pozitif, net zararın 249,2 milyon dolar ile büyük olması, aradaki farkın amortisman ve finansman giderlerinde toplandığını söylüyor; yani düzeltmenin dışarıda bıraktığı kalemler, tam da varlığın nasıl finanse edildiğini anlatan kalemler. İki gün önceki yazımda yapay zekâ harcamasının borçla finansmanında riskin en ağır bilançolu isimlerde yoğunlaştığını savunmuştum; buradaki yapı o tezin bir sonraki halkası, çünkü teminat bir kredi notu yerine henüz başlamamış bir kira akışı. Karşı argüman da güçlü: on beş yıllık, sözleşmeye bağlanmış kira, proje finansmanının üzerine kurulduğu teminat türüdür ve kiracılar yeterince güçlüyse bu yapı bir altyapı varlığına yaklaşır.", "en": "The relationship between those two sets of numbers shows where the credit risk sits. Contracted revenue is a forward promise; construction is present-tense cash. Adjusted EBITDA positive at $107.2 million against a net loss of $249.2 million says the difference gathers in depreciation and financing costs; the items the adjustment leaves out are precisely the items describing how the asset is funded. In my column two days ago I argued that in the debt financing of AI spending the risk concentrates in the most asset-heavy names; the structure here is the next link in that argument, because the collateral is a rent stream that has not yet begun rather than a credit rating. The counter-case is strong too: a fifteen-year contracted lease is the collateral project finance is built on, and if the tenants are strong enough this structure moves closer to an infrastructure asset.", "refs": ["apld", "history-aidebt"]}, {"tr": "Aynı açıklamadaki ikinci hareket de bu çerçeveye giriyor. Bulut hizmetleri işi 5 Mayıs 2026'da ayrıldı ve Ekso Bionics ile birleşti; ortaya çıkan ChronoScale Holdings Nasdaq'ta CHRN koduyla işlem görüyor. Ancak Applied Digital bu şirketin yaklaşık yüzde 96 payını elinde tutuyor. Ayrılan şey borsa kotasyonu oldu; ekonomik maruziyetin neredeyse tamamı yerinde duruyor.", "en": "A second move in the same release belongs to the same frame. The cloud services business was separated on May 5, 2026 and merged with Ekso Bionics; the resulting ChronoScale Holdings trades on Nasdaq under CHRN. Applied Digital, however, retains roughly 96 percent of that company. What was separated was the listing; almost all of the economic exposure stays where it was.", "refs": ["apld"]}]}, {"h": {"tr": "Bunun kırılmaması için neyin doğru kalması gerekiyor", "en": "What has to stay true for this not to break"}, "ps": [{"tr": "Buradan bir çöküş takvimi çıkmaz; çıkan şey izlenebilir bir eşik. Kira akışı inşaat harcamasının önüne geçene kadar aradaki fark dış finansmanla kapanır ve o finansmanın koşulları, bugünkü zararın büyüklüğünden daha belirleyici olur. Yapı sağlamsa, taban kira kaleminin çeyreklik net zarardan daha hızlı büyümesi beklenir; dördüncü çeyrekteki 44,1 milyon dolar taban kira ile 110,6 milyon dolar net zarar arasındaki aralık daralmalıdır. Bu aralık daralmaz ya da açılırsa, sözleşmelerin uzunluğu değil, o uzunluğa ulaşmak için gereken köprü tartışılır hale gelir.", "en": "None of this yields a timetable for collapse; what it yields is a threshold that can be watched. Until the rent stream runs ahead of construction spending, the difference is closed with outside funding, and the terms of that funding matter more than the size of today's loss. If the structure is sound, base rent should grow faster than the quarterly net loss; the distance between $44.1 million of base rent and a $110.6 million net loss in the fourth quarter should narrow. If it does not narrow, or widens, what comes into question is the bridge needed to reach that length rather than the length of the contracts.", "refs": ["apld"]}]}], "sources": [{"key": "apld", "kind": "news", "name": "Applied Digital", "url": "https://ir.applieddigital.com/news-events/press-releases/detail/159/applied-digital-reports-fiscal-fourth-quarter-and-full-year", "title": {"tr": "Applied Digital yıllık geliri 611,3 milyon dolar seviyesine çıkardı, zarar sürdü", "en": "Applied Digital lifts annual revenue to $611.3 million while losses continue"}, "publishedDate": "2026-07-27"}, {"key": "history-aidebt", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-06/2026-07-25/", "title": {"tr": "460 milyar dolar yapay zekâ borcu ve onu fark eden bir kredi notu", "en": "460 billion dollars of AI debt, and a credit rating that notices"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "eco-01", "title": {"tr": "Yüzde 500'ü aşan açılışı iki parçaya ayırmak", "en": "Split a 500%-plus debut in two"}, "excerpt": {"tr": "CXMT'nin açılışında fiyat güçlü bir oy verdi. Kâr ve pazar payı temeli gösteriyor; serbest dolaşım ise oyun neden bu kadar yüksek sesle çıktığını açıklıyor.", "en": "Price cast a loud vote in CXMT's debut. Profit and market share show the fundamental; free float helps explain why the vote came out at such volume."}, "sections": [{"h": {"tr": "Hareket ile şirkete giren para", "en": "The move and the money raised"}, "ps": [{"tr": "CXMT halka arzını hisse başına 8,66 yuandan fiyatladı ve 57,92 milyar yuan topladı. Hisse, Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi; son bildirilen 52 yuanlık fiyat şirketin piyasa değerini yaklaşık 3,5 trilyon yuana taşıdı. Tape güçlü, fakat iki para akışını karıştırmamak gerekir: şirkete giren tutarı arz fiyatı belirledi, sonraki fiyat farkı ise ikincil piyasadaki pay sahipleri arasında oluştu. İlk gün fiyatı talebin şiddetini gösteriyor; tek başına şirketin kasasına yeni para eklemiyor.", "en": "CXMT priced its offering at 8.66 yuan a share and raised 57.92 billion yuan. The stock rose more than 500% on its first day in Shanghai; the last reported price of 52 yuan put the company's market value at roughly 3.5 trillion yuan. The tape is loud, but two cash flows should not be confused: the offer price set what reached the company, while the later gap formed among holders in the secondary market. A first-day price shows the force of demand; by itself it adds no new cash to the company.", "refs": ["cxmt-debut"]}, {"tr": "Temel tarafı boş değil. CNBC'ye göre CXMT, 2025'in son çeyreğinde küresel DRAM pazarının yüzde 7,67'sine sahipti. Şirket bu yılın ilk çeyreğinde 35,43 milyar yuan faaliyet kârı açıkladı; bir yıl önce 2,83 milyar yuan faaliyet zararı vardı. Bu dönüş, hissenin yalnızca bir hikâyeye dayanmadığını gösterir. Yine de faaliyet kârındaki sıçrama, 8,66 yuan ile 52 yuan arasındaki farkı mekanik olarak açıklamaz. Arz fiyatı, şirket verisi ve serbest piyasa fiyatı aynı tartının üç farklı kefesidir.", "en": "The fundamental side is not empty. CNBC said CXMT held 7.67% of the global DRAM market in the fourth quarter of 2025. The company reported first-quarter operating profit of 35.43 billion yuan this year, against a 2.83 billion yuan operating loss a year earlier. That turn shows the stock is not resting on a story alone. It still does not mechanically explain the gap between 8.66 yuan and 52 yuan. The offer price, company performance and the free-market price sit on three different pans of the scale.", "refs": ["cxmt-debut"]}]}, {"h": {"tr": "Serbest dolaşımın sesi", "en": "The sound of free float"}, "ps": [{"tr": "Haberde görüşüne yer verilen Theodore Shou, STAR pazarında ilk gün sıçramalarının olağandışı olmadığını, bu hareketin büyüklüğünde ise sınırlı serbest dolaşım ile birikmiş yatırımcı ilgisinin etkili olduğunu söyledi. Bu, fiyat ile temel arasına piyasa yapısını koyan makul mekanizmadır: alım talebi küçük bir işlem gören pay havuzuna yöneldiğinde marjinal fiyat hızla yukarı taşınabilir. Ancak bu bir analist açıklamasıdır, emir defterinin kanıtı değildir. Alternatif açıklama, DRAM kârlılığına ilişkin beklentilerin arz fiyatından sonra gerçekten yukarı değişmiş olmasıdır.", "en": "Theodore Shou, an analyst cited in the report, said large first-day jumps are not unusual on the STAR board and attributed the scale of this one to limited free float and built-up investor interest. That supplies a plausible market-structure bridge between price and fundamentals: when buying demand meets a small pool of tradable shares, the marginal price can move quickly. It remains an analyst's explanation, not proof from the order book. The alternative is that expectations for DRAM profitability genuinely rose after the offer was priced.", "refs": ["cxmt-debut"]}, {"tr": "Bu nedenle yüzde 500'ü aşan açılış tek bir hüküm vermiyor; iki ayrı sınama kuruyor. Piyasa yapısı sınaması, daha derin ve olağan işlem koşullarında fiyatın nasıl oluştuğudur. Temel sınaması ise ilk çeyrekteki faaliyet kârı dönüşünün sonraki dönemlerde sürüp nakde dönüşüp dönüşmediğidir. İlki zayıflar, ikincisi sürerse açılışın büyük kısmı kıt dolaşımın oyu olarak kalır. İkisi birlikte dayanırsa yeniden fiyatlama daha fazla ekonomik ağırlık kazanır. Piyasa anlatıyı değil akışı fiyatladı; şimdi temeli tartması gerekiyor.", "en": "A 500%-plus debut therefore delivers no single verdict; it creates two separate tests. The market-structure test is how price forms under deeper, more ordinary trading conditions. The fundamental test is whether the first-quarter operating-profit turn persists and converts into cash in later periods. If the first fades while the second holds, much of the debut remains a scarcity vote. If both endure, the repricing carries more economic weight. The market priced the flow rather than the narrative; it still has to weigh the fundamental.", "refs": ["cxmt-debut"]}]}], "sources": [{"key": "cxmt-debut", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/cxmt-china-market-debut-chipmaker-ipo.html", "title": {"tr": "Çinli bellek üreticisi CXMT Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi", "en": "Chinese memory maker CXMT rises more than 500% on its Shanghai debut"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-02", "title": {"tr": "Maliyet şoku nereye düşer: fiyatlara mı, kâra mı?", "en": "Where a cost shock lands: prices or profit"}, "excerpt": {"tr": "Enerji riski merkez bankalarının araçlarına, tarife değişikliği ise önce bir perakendecinin gelir tablosuna girdi. Aynı \"maliyet şoku\" etiketi, kaybı kimin taşıdığını söylemeye yetmiyor.", "en": "Energy risk entered central-bank instruments, while a tariff change first appeared in a retailer's income statement. The label \"cost shock\" alone does not say who bears the loss."}, "sections": [{"h": {"tr": "Fiyat baskısının üç kanalı", "en": "Three channels of price pressure"}, "ps": [{"tr": "MAS para politikasını üst üste ikinci kez sıkılaştırdı. Singapur dolarının ticaret ağırlıklı kur bandının değer kazanma eğimi az miktarda artırılırken bandın genişliği ve merkezi değiştirilmedi; karar, enerji fiyatlarının enflasyon riskini yeniden canlandırdığı bir dönemde alındı.", "en": "MAS tightened policy for a second consecutive step. It slightly raised the appreciation slope of the Singapore dollar's trade-weighted band while leaving the band's width and centre unchanged, acting as energy prices revived inflation risk.", "refs": ["mas-tightening"]}, {"tr": "ABD'de tahvil piyasası Federal Rezerv'in çarşamba günkü toplantısında faiz artırma olasılığını yaklaşık üçte bir olarak fiyatladı. Bloomberg'in haberi bu yeniden fiyatlamayı, Orta Doğu geriliminin petrol ve Hazine getirilerinde yarattığı oynaklık ile yeniden yükselen fiyat baskılarıyla ilişkilendirdi.", "en": "In the US, the bond market priced roughly a one-in-three chance that the Federal Reserve would raise rates at Wednesday's meeting. Bloomberg linked the repricing to volatility in oil and Treasury yields during Middle East tensions and to renewed price pressure.", "refs": ["fed-odds"]}, {"tr": "Shein'in taslak Hong Kong izahnamesi başka bir bilanço etkisi gösterdi: şirket 2026'nın ilk çeyreğinde 99 milyon dolar zarar etti; bir yıl önce 395 milyon dolar kâr etmişti. ABD geliri yüzde 14,3 düşerken faaliyet marjı yüzde 3,9'dan yüzde 2,9'a indi. Zarar, ABD'nin küçük paket muafiyetini kaldırmasının satış ve maliyet etkisinin yanı sıra 328 milyon dolar tutarında gerçeğe uygun değer giderini de içeriyordu.", "en": "Shein's draft Hong Kong prospectus showed a different balance-sheet effect: a loss of 99 million dollars in the first quarter of 2026, against 395 million dollars of profit a year earlier. US revenue fell 14.3% and the operating margin narrowed from 3.9% to 2.9%. The loss combined the sales-and-cost effect of the US removal of the small-parcel exemption with a fair-value charge of 328 million dollars.", "refs": ["shein-loss"]}]}, {"h": {"tr": "Politikadan önce yükün adresi", "en": "Incidence comes before policy"}, "ps": [{"tr": "Enerji fiyatındaki bir artış çok sayıda ithalatçının maliyetine aynı anda girdiğinde kur, enflasyon beklentisi ve politika faizi kanalında görünür. Tek bir gümrük muafiyetinin kaldırılması ise önce etkilenen iş modelinde paylaşılır: satıcı maliyeti marjında tutabilir, fiyatlara aktarabilir ya da hacim kaybedebilir. Shein verisinde daha düşük ABD satışı ile daha dar faaliyet marjının birlikte görülmesi, yükün en azından o çeyrekte tek bir kanala gitmediğine işaret ediyor.", "en": "When higher energy prices enter many importers' costs at once, they appear through the exchange rate, inflation expectations and the policy-rate channel. Removing one customs exemption is allocated first inside the exposed business model: the seller can absorb it in margin, pass it into prices or lose volume. Shein's lower US sales and narrower operating margin suggest the burden did not travel through only one channel that quarter.", "refs": ["mas-tightening", "fed-odds", "shein-loss"]}, {"tr": "Bu karşılaştırma Shein'in 99 milyon dolar tutarındaki zararını tarifelerin doğrudan ölçüsü yapmaz. 328 milyon dolar tutarındaki muhasebe gideri çeyrek sonucunu tek başına değiştirebilecek büyüklükte; ayrıca merkez bankası fiyatlaması da enerji dışındaki verileri içeriyor. Ayrımı sınamanın yolu, Shein'in fiyat ve sipariş hacmini tarife giderleriyle; genel enflasyon verisini ise ithalat fiyatlarıyla birlikte izlemektir. Şirket zararı, tek başına ekonominin geneline yayılan enflasyonu kanıtlamaz.", "en": "This comparison does not turn Shein's loss of 99 million dollars into a direct measure of tariffs. The accounting charge of 328 million dollars was large enough to change the quarterly result on its own, while central-bank pricing also reflects information beyond energy. The distinction requires Shein's prices and order volumes to be read with tariff expense, and inflation data with import prices. A company loss alone does not establish economy-wide inflation.", "refs": ["shein-loss", "mas-tightening", "fed-odds"]}]}], "sources": [{"key": "mas-tightening", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/singapore-mas-july-monetary-policy-middle-east-oil-prices-inflation-.html", "title": {"tr": "Singapur Merkez Bankası para politikasını üst üste ikinci kez sıkılaştırdı", "en": "Singapore's central bank tightens policy for a second meeting running"}, "publishedDate": "2026-07-27"}, {"key": "fed-odds", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/bond-traders-on-edge-as-risks-of-fed-rate-hike-this-week-mount", "title": {"tr": "Tahvil piyasası çarşamba günkü Fed kararında faiz artırımı olasılığını üçte bir dolayında fiyatlıyor", "en": "The bond market prices roughly a one-in-three chance of a Fed rate rise on Wednesday"}, "publishedDate": "2026-07-26"}, {"key": "shein-loss", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/9ed6a6f4-c6a6-4027-9c54-19bffcd88913", "title": {"tr": "Shein, Hong Kong'daki planlanan kotasyon öncesinde ilk çeyrekte zarara döndü", "en": "Shein swings to a first-quarter loss ahead of its planned Hong Kong listing"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-03", "title": {"tr": "Yüzde 2'lik zammı bir başka satışın tamamlanması taşıyor", "en": "A 2% sweetener rests on another sale closing"}, "excerpt": {"tr": "EQT'nin Perpetual için teklifi 22,07'den 22,50 Avustralya dolarına çıktı. Manşet fiyat değişti; teklifin ekonomisini belirleyen şey ise ona bağlanan koşullar.", "en": "EQT's offer for Perpetual moved from A$22.07 to A$22.50. The headline price changed; what determines the proposal's economics is the set of conditions attached to it."}, "sections": [{"h": {"tr": "Zam küçük, koşul listesi uzun", "en": "A small raise, a long list of conditions"}, "ps": [{"tr": "Teklif yaklaşık 2,6 milyar Avustralya dolarına (1,8 milyar dolar) yükseltildi. Avustralya basınındaki haberlere göre Perpetual, 27 Temmuz'da borsaya yaptığı açıklamada EQT ile ilişkilendirilen Windflower Pte'den nakit teklifin hisse başına 22,07 Avustralya dolarından 22,50 Avustralya dolarına çıkarıldığını duyurdu. Artış yüzde 2.", "en": "The offer was lifted to about A$2.6 billion ($1.8 billion). Australian press reports say Perpetual told the exchange on 27 July that Windflower Pte, an entity linked to EQT, had raised its cash offer from A$22.07 to A$22.50 a share. That is a 2% increase.", "refs": ["eqt-perpetual"]}, {"tr": "Aynı haberlere göre teklif bağlayıcı değil ve gösterge niteliğinde; inceleme sürecinin tamamlanması, sözleşmelerin imzalanması, düzenleyici onaylar ve Perpetual'in servet yönetimi biriminin Bain Capital'a satışının tamamlanması koşullarına bağlı. Bu yapıda masaya konan şey bir opsiyondur: alıcı fiyatı yükseltirken yükümlülüğünü olduğu yerde tutuyor.", "en": "According to the same reports the proposal is non-binding and indicative, conditional on completion of due diligence, execution of binding documents, regulatory approvals and completion of the sale of Perpetual's wealth management business to Bain Capital. Under that structure what is on the table is an option: the buyer raises the price while leaving its obligation where it was.", "refs": ["eqt-perpetual"]}]}, {"h": {"tr": "Adımların büyüklüğü ne söylüyor", "en": "What the size of the steps says"}, "ps": [{"tr": "Sıraya bakmak faydalı: temmuz başındaki 21,64 Avustralya doları reddedildi, ardından 22,07, şimdi 22,50 geldi. İlk adım yaklaşık yüzde 2, ikinci adım da yüzde 2. Bu ölçekteki artışlar, görüşmeye devam etme ve inceleme erişimi kazanma bedeli gibi duruyor; hedefin değerlemesine ilişkin yeni bir bilgi taşıdıklarına dair bir veri yok.", "en": "The sequence is instructive: A$21.64 at the start of July was rejected, then came A$22.07, and now A$22.50. The first step was about 2%, and the second about 2% as well. Increments of that size look like the price of staying in the conversation and gaining due-diligence access; nothing in the reporting shows they carry new information about the target's valuation.", "refs": ["eqt-perpetual"]}, {"tr": "Karşı okuma da mümkün: küçük ve tekrarlanan artışlar rakip bir talibin varlığında da görülür ve hedefin kurulu her adımda daha yüksek bir taban elde eder. Bu ikisini ayıracak gözlem, kurulun inceleme erişimi verip vermediği ve Bain Capital işleminin takvimde nerede durduğudur. Servet yönetimi satışı gecikirse, 22,50 rakamı bu dosyada anlamlı sayı olmaktan çıkar.", "en": "A competing reading is available: small repeated increases also appear when a rival suitor is present, and the target's board wins a higher floor at every step. What would separate the two is whether the board grants due-diligence access and where the Bain Capital transaction sits in the timetable. If the wealth management sale slips, A$22.50 stops being the meaningful number in this file.", "refs": ["eqt-perpetual"]}]}], "sources": [{"key": "eqt-perpetual", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/eqt-raises-takeover-offer-for-australia-wealth-manager-perpetual", "title": {"tr": "EQT, Perpetual için teklifini yaklaşık 2,6 milyar Avustralya dolarına yükseltti", "en": "EQT raises its takeover offer for Perpetual to about A$2.6 billion"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "eco-04", "title": {"tr": "Kar, kesilen elektrik ve duran bakır", "en": "Snow, cut power and stalled copper"}, "excerpt": {"tr": "Şili'de üretimi durduran şey yol erişimi ve elektrik. Etkilenen kapasitenin günlük karşılığı ise kesintinin gün mü hafta mı sürdüğü bilinmeden okunamaz.", "en": "Road access and power are what stopped production in Chile. The daily equivalent of the affected capacity cannot be read without knowing whether the outage runs in days or in weeks."}, "sections": [{"h": {"tr": "Hangi ocak, hangi kısıt", "en": "Which mine, which constraint"}, "ps": [{"tr": "Yayımlanan haberlere göre Codelco, Andina'daki yüzey işlemlerini ve El Teniente açık ocağından cevher sevkiyatını durdurdu. Anglo American Los Bronces'ta riskleri değerlendirdi, Antofagasta Los Pelambres'te zorunlu olmayan işleri azalttı, Lundin Mining'in Caserones tesisi ise kar yağışı elektriği kestikten sonra üretime ara verdi.", "en": "Published reports say Codelco halted surface operations at Andina and ore shipments from the El Teniente open pit. Anglo American assessed hazards at Los Bronces, Antofagasta scaled back non-essential work at Los Pelambres, and Lundin Mining's Caserones stopped after snowfall cut power.", "refs": ["chile-copper"]}, {"tr": "Listedeki ortak nokta yükseklik: bunlar yüksek rakımlı işletmeler ve bağlayıcı kısıt yola erişim ile elektrik; cevher yerinde duruyor. Financial Times'ın işaret ettiği gibi metal talebindeki artış, tam da hava koşullarına açık ve tenörü düşen bu tür madenlere dayanıyor. Bu ayrım önemli: durdurulan kapasite, ancak kesinti süresiyle orantılı bir tonaj kaybına dönüşür.", "en": "The common feature on that list is altitude: these are high-altitude operations, and the binding constraint is road access and electricity, while the deposit stays where it is. As the Financial Times notes, the rise in metal demand rests precisely on mines of this kind — weather-exposed, with declining grades. The distinction matters: suspended capacity converts into lost tonnage only in proportion to the length of the outage.", "refs": ["chile-copper"]}]}, {"h": {"tr": "Günlük karşılığı hesaplamak", "en": "Working out the daily equivalent"}, "ps": [{"tr": "Aynı haberlerde etkilenen tesislerin toplam yıllık kapasitesi yaklaşık 1,6 milyon ton olarak veriliyor. Bunu takvime bölmek işi somutlaştırır: günde kabaca 4.400 ton. Üç günlük bir duraklama yaklaşık 13.000 tona denk gelir, bir haftalık duraklama 30.000 tonun biraz üzerine çıkar. Yıllık kapasite başlığı büyük görünür; kesintinin süresi bilinmeden bu başlık bir arz kaybı ölçüsü değildir.", "en": "The same reports put the combined annual capacity of the affected operations at about 1.6 million tonnes. Dividing that by the calendar makes it concrete: roughly 4,400 tonnes a day. A three-day halt is about 13,000 tonnes; a week is a little over 30,000. The annual-capacity headline looks large, but without the duration of the outage it is not a measure of lost supply.", "refs": ["chile-copper"]}, {"tr": "Haberlerde durdurmaların çoğunun doğrulanmış hasardan çok önlem amaçlı olduğu belirtiliyor; bu, işletmelerin hava düzeldiğinde hızla dönmesini bekleten bir tespit. Karşı ihtimal de açık: elektrik altyapısında veya erişim yollarında onarım gerektiren bir hasar çıkarsa, duraklama önlem süresini aşar. Ayırt edici gözlem, şirketlerin işletme bazında yayımlayacağı yeniden başlatma duyuruları ve çeyrek üretim rakamlarının revize edilip edilmediğidir.", "en": "The reports describe most of the halts as precautionary rather than a response to confirmed damage, which points to a quick return once the weather clears. The other possibility is open: if repairs are needed to power infrastructure or access roads, the stoppage will outlast the precaution. The distinguishing observation is the restart notices companies publish operation by operation, and whether quarterly production figures are revised.", "refs": ["chile-copper"]}]}], "sources": [{"key": "chile-copper", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/cd0b6148-a9a7-4763-b6d3-bb33e10b9899", "title": {"tr": "Şili'deki fırtına bakır madenlerinde üretimi kesintiye uğrattı", "en": "A storm in Chile disrupts output at copper mines"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "eco-05", "title": {"tr": "Kâr yüzde 18,7 arttı, ücret bu veride görünmüyor", "en": "Profits rose 18.7% and the data never shows wages"}, "excerpt": {"tr": "Çin'in sanayi kârı verisi işletmeleri ölçüyor, haneleri değil. İçindeki tek kişi başına rakam ise ücrete değil, çalışan sayısına işaret ediyor.", "en": "China's industrial profit release measures firms, not households. Its single per-head figure points not to pay but to headcount."}, "sections": [{"h": {"tr": "Kâr, ciroyu üç katı hızla geçti", "en": "Profit outran revenue threefold"}, "ps": [{"tr": "Ulusal İstatistik Bürosu'na göre ocak-haziran döneminde belirli ölçeğin üzerindeki sanayi işletmelerinin kârı yüzde 18,7 artarak 3,95 trilyon yuana çıktı. Aynı dönemde ciro yüzde 6,5 artışla 69,26 trilyon yuan oldu ve ciro kârlılığı 0,59 puan yükselerek yüzde 5,70'e ulaştı.", "en": "According to the National Bureau of Statistics, profits at industrial firms above a designated size rose 18.7% to 3.95 trillion yuan from January to June. Over the same period revenue rose 6.5% to 69.26 trillion yuan, and the return on revenue rose 0.59 percentage points to 5.70%.", "refs": ["china-profits"]}, {"tr": "Bu üç sayı birlikte ilginç bir aritmetik veriyor. 69,26 trilyon yuanlık ciro üzerinde 0,59 puanlık marj kazancı, kabaca 400 milyar yuana denk düşüyor. Kâr artışının önemli bir bölümü, satılan her yüz yuandan elde tutulan payın büyümesinden geliyor; hacim artışı bu kalemin gerisinde kalıyor. Verinin kendi ifadesiyle yüz yuan cironun maliyeti bir önceki yıla göre 0,55 yuan azalarak 84,89 yuana indi.", "en": "Those three numbers produce an interesting piece of arithmetic. A gain of 0.59 percentage points of margin on 69.26 trillion yuan of revenue is worth roughly 400 billion yuan. A substantial part of the profit increase comes from a larger share retained on every hundred yuan sold, with volume growth trailing behind. In the release's own terms, the cost embedded in a hundred yuan of revenue fell 0.55 yuan from a year earlier, to 84.89 yuan.", "refs": ["china-profits"]}]}, {"h": {"tr": "Bu veri kimi ölçüyor, kimi ölçmüyor", "en": "Whom the data counts, and whom it leaves out"}, "ps": [{"tr": "Açıklamada ücret serisi yok. Emeğe en yakın duran rakam, kişi başına ciro: haziran sonunda 1,91 milyon yuan olarak verilmiş ve bir önceki yıla göre 0,13 milyon yuan artmış. Bu yaklaşık yüzde 7,1'lik bir artış demek. Ciro ise yüzde 6,5 artmış. İki oran arasındaki fark, kapsanan işletmelerde çalışan sayısının bir miktar gerilediğine işaret ediyor.", "en": "The release contains no wage series. The figure that sits closest to labour is revenue per person: 1.91 million yuan at the end of June, up 0.13 million yuan from a year earlier. That is a rise of about 7.1%, against revenue growth of 6.5%. The gap between the two rates points to a modest fall in headcount at the firms covered.", "refs": ["china-profits"]}, {"tr": "Bu çıkarımı yumuşatan bir alternatif var: kapsam her yıl belirli ölçeğin üzerindeki işletmelere göre yeniden belirleniyor, dolayısıyla oranlardaki fark istihdam değişiminden çok örneklem bileşimindeki kaymadan da doğabilir. Bu yüzden veriden ulusal bir istihdam sonucu çıkarmak doğru olmaz; verinin ücret sorusuna yanıt vermediği ise açıktır.", "en": "One alternative softens that inference: the coverage is redefined each year around firms above a designated size, so the difference between the two rates could reflect a shift in sample composition rather than a change in employment. It would therefore be wrong to draw a national employment conclusion from this, and the release plainly does not answer a question about pay.", "refs": ["china-profits"]}]}, {"h": {"tr": "Kâr nerede arttı, kim orada çalışıyor", "en": "Where profit grew, and who works there"}, "ps": [{"tr": "Sektör ayrımı bu boşluğu daha da anlamlı kılıyor. Demir dışı metal işlemede kâr yüzde 99,4, bilgisayar ile iletişim ve diğer elektronik cihaz üretiminde yüzde 96,9 arttı. Buna karşılık otomotivde yüzde 19,5, demir-çelikte yüzde 25,0, metalik olmayan mineral ürünlerde yüzde 47,8 düşüş var. Toplamı yukarı taşıyan kalemler ile daralan kalemler aynı ölçekte iş gücü barındırmıyor; bu nedenle güçlü bir toplam ile zorlanan bir istihdam tablosu aynı anda var olabilir.", "en": "The sector split makes that gap more consequential. Profits rose 99.4% in non-ferrous metal smelting and rolling and 96.9% in computer, communications and other electronic equipment manufacturing. Against that, motor vehicle manufacturing fell 19.5%, ferrous metal smelting and rolling 25.0%, and non-metallic mineral products 47.8%. The lines carrying the total upward and the lines contracting do not employ people on the same scale, which is why a strong aggregate and a strained employment picture can coexist.", "refs": ["china-profits"]}, {"tr": "Bunun hane bütçesine ne yaptığını söylemek için gereken veri başka yerde: ücret ve istihdam istatistikleri. Sonbaharda yayımlanacak kentli ücret ve istihdam serileri, daralan sektörlerdeki kayıpların kârı büyüten sektörlerdeki kazançlarla telafi edilip edilmediğini gösterecek. O seriler gelene kadar, kâr artışını hane geliriyle eşitleyen her cümle veriden fazlasını söylemiş olur.", "en": "Saying what this does to a household budget requires data held elsewhere: wage and employment statistics. The urban pay and employment series due in the autumn will show whether losses in the contracting sectors are offset by gains in the ones expanding profit. Until they arrive, any sentence equating profit growth with household income claims more than the data supports.", "refs": ["china-profits"]}]}], "sources": [{"key": "china-profits", "kind": "news", "name": "National Bureau of Statistics of China", "url": "https://www.stats.gov.cn/sj/zxfb/202607/t20260727_1964194.html", "title": {"tr": "Çin'de sanayi kârı yılın ilk yarısında yüzde 18,7 arttı", "en": "China's industrial profits rose 18.7% in the first half"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-06", "title": {"tr": "Dayanak fiyatlandı, kaldıraç kaybolmadı", "en": "The underlying got a price; the leverage did not disappear"}, "excerpt": {"tr": "CXMT'nin borsaya gelişi türev platformlarına dışarıdan bir fiyat sağlıyor. Vadesiz sözleşmenin teminat, tasfiye ve teslimatsızlık yapısı ise aynı yerde duruyor.", "en": "CXMT's listing gives derivatives venues an external price. The perpetual contract's collateral, liquidation and no-delivery structure remains exactly where it was."}, "sections": [{"h": {"tr": "Erişim bir sözleşmeye taşındı", "en": "Access moved into a contract"}, "ps": [{"tr": "Financial Times, yatırımcıların Çin'in yapay zekâ ile ilişkilendirilen hisselerine kripto borsalarında işlem gören süresiz vadeli sözleşmeler üzerinden pozisyon aldığını bildiriyor. Bu araçların vade sonu yok; teminat çoğunlukla sabit değerli kripto varlıklarla veriliyor ve sözleşme, dayanak hissenin fiyatına bağlı bir ödeme yükümlülüğü taşıyor. Yabancıların Çin hisse piyasasına doğrudan erişim kısıtını dolaşan yatırımcı, hissenin kendisini ya da onun sağladığı ortaklık hakkını almıyor. Elindeki şey bir platformun teminat ve tasfiye kurallarına bağlı sentetik pozisyon.", "en": "The Financial Times reports that investors are taking exposure to Chinese AI-linked shares through perpetual futures traded on crypto exchanges. The instruments have no expiry; collateral is usually posted in stablecoins and the contract carries a payment obligation linked to the underlying share price. An investor working around restrictions on direct foreign access to Chinese equities does not receive the share or its ownership rights. What remains is a synthetic position governed by a venue's margin and liquidation rules.", "refs": ["crypto-china-ai"]}, {"tr": "Bu yapının dayanaklarından CXMT artık halka açık bir fiyata sahip. Şirket halka arzını 8,66 yuandan yaptı, 57,92 milyar yuan topladı ve hisse Şanghay'daki ilk gününde yüzde 500'den fazla yükselerek son olarak 52 yuandan işlem gördü. Financial Times'ın aktardığına göre şirketin fiyatına bağlı bir sözleşme, halka arzdan önce merkeziyetsiz bir türev platformunda işlem görüyordu. Halka arz, platformun kendi iç fiyatının yanına gözlemlenebilir bir borsa fiyatı koydu; sözleşmeyi hisseye dönüştürmedi.", "en": "One of those underlyings, CXMT, now has a public price. The company offered shares at 8.66 yuan, raised 57.92 billion yuan and rose more than 500% on its first day in Shanghai, last trading at 52 yuan. According to the Financial Times, a contract tied to the company's price traded on a decentralised derivatives platform before the offering. The listing placed an observable exchange price beside the venue's internal market; it did not turn the contract into a share.", "refs": ["cxmt-debut", "crypto-china-ai"]}]}, {"h": {"tr": "Referans dışarıda, tasfiye içeride", "en": "The reference is outside; liquidation stays inside"}, "ps": [{"tr": "Dışarıdan gelen fiyat önemli bir tampon: platformun referansı artık yalnızca kendi kullanıcılarının işlemlerine dayanmak zorunda değil. Fakat yüzde 500'ü aşan bir borsa hareketi, referansın kamuya açık olmasının onu yumuşak yapmadığını da gösteriyor. Süresiz sözleşmede teslimat bulunmadığından kayıp ve kazanç hâlâ platformun kullandığı fiyat, teminat koşulları ve tasfiye motoru üzerinden dağıtılır. Halka arz referans belirsizliğini azaltabilir; kaldıraç ile zorunlu tasfiye kanalını ortadan kaldırmaz. Karşı sav güçlüdür: şeffaf bir borsa fiyatı, platform içi fiyat döngüsünü sınırlayıp sözleşmeyi sıradan bir fark ürününe yaklaştırabilir.", "en": "An external price is a meaningful buffer: the venue's reference need no longer depend only on trades among its own users. A listed move of more than 500% also shows that a public reference is not necessarily a gentle one. With no delivery in a perpetual, gains and losses are still distributed through the venue's chosen price, collateral terms and liquidation engine. The listing can reduce reference ambiguity; it does not remove leverage or forced liquidation. The counter-case is strong: a transparent exchange price can constrain an internal price loop and make the contract behave more like an ordinary synthetic product.", "refs": ["crypto-china-ai", "cxmt-debut"]}, {"tr": "Buradan sistemik çöküş sonucu çıkmaz. Eldeki haberler bu platformların teminat havuzlarını, pozisyon limitlerini, tasfiye sırasını ya da birbirlerine olan yükümlülüklerini göstermiyor; aktarım zinciri kurulmadan fiyat sıçraması yalnızca sert bir şoktur. Belgelenebilen kırılganlık daha dardır: yatırımcı erişim kısıtını aşarken hisse sahipliği yerine tek bir platformun sözleşme kurallarına maruz kalıyor. Dayanıklılığı ayıracak bilgi, kullanılan referans fiyatın, teminat iskonto oranlarının ve tasfiye mekanizmasının açıklanmasıdır. Dayanak artık görünür; riskin nerede emileceği hâlâ sözleşmenin içinde.", "en": "None of this establishes a systemic collapse. The reporting at hand does not show these venues' collateral pools, position limits, liquidation sequence or obligations to one another; without a transmission chain, a price jump is only a severe shock. The documented fragility is narrower: in working around an access restriction, an investor replaces share ownership with exposure to one venue's contract rules. The information that separates resilience from fragility is disclosure of the reference price, collateral haircuts and liquidation mechanism. The underlying is now visible; where the risk is absorbed still sits inside the contract.", "refs": ["crypto-china-ai", "cxmt-debut"]}]}], "sources": [{"key": "crypto-china-ai", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/af333b9c-d59d-4e7c-b814-12cef578895d", "title": {"tr": "Yatırımcılar Çin yapay zekâ hisselerine kripto borsaları üzerinden pozisyon alıyor", "en": "Investors are taking positions in Chinese AI stocks through crypto exchanges"}, "publishedDate": "2026-07-26"}, {"key": "cxmt-debut", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/cxmt-china-market-debut-chipmaker-ipo.html", "title": {"tr": "Çinli bellek üreticisi CXMT Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi", "en": "Chinese memory maker CXMT rises more than 500% on its Shanghai debut"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-01", "title": {"tr": "Cuma yeşildi, hafta kırmızı", "en": "Friday closed green, the week closed red"}, "excerpt": {"tr": "Üç endeksin cuma kapanışı haftanın yönünü değiştirmedi. Fiyatın neyi tarttığını anlamak için tek güne değil, harcamaya bakmak gerekiyor.", "en": "Friday's closes did not change the week's direction. To see what price is weighing, look at spending rather than at a single session."}, "sections": [{"h": {"tr": "Tek gün ile hafta arasındaki açı", "en": "The angle between one day and one week"}, "ps": [{"tr": "24 Temmuz Cuma kapanışında S\u0026P 500 yüzde 0,05 artışla 7.411,98, Dow Jones Sanayi Endeksi yüzde 0,46 yükselişle 51.947,25 seviyesindeydi; Nasdaq Composite ise yüzde 0,64 düşüşle 24.975,82'ye indi. Aynı hafta S\u0026P 500 ve Nasdaq üst üste ikinci, Dow üçüncü haftalık kaybını yazdı. Günlük kapanış ile haftalık yön arasındaki bu açı, tek seansın yatırımcıya çok az şey anlattığı durumlardan biri.", "en": "At Friday's close on 24 July the S\u0026P 500 stood at 7,411.98, up 0.05%, and the Dow Jones Industrial Average at 51,947.25, up 0.46%, while the Nasdaq Composite fell 0.64% to 24,975.82. Over the same week the S\u0026P 500 and the Nasdaq posted a second consecutive weekly loss and the Dow a third. That angle between the daily close and the weekly direction is one of the cases where a single session tells an investor very little.", "refs": ["week"]}, {"tr": "S\u0026P 500 ve Nasdaq için üst üste ikinci, Dow için üçüncü haftalık kaybın, iki endeksin yükseldiği bir cuma gününe rağmen yazılması, satışın seans içinde değil önceki günlerde gerçekleştiğini gösteriyor. Bu tabloyu okumanın iki yolu var: ya hafta boyunca beklenti aşağı çekildi, ya da haftanın son günü zayıf hacimli bir toparlanmaydı. Kapanış verileri tek başına ikisini ayırmaya yetmiyor.", "en": "A second consecutive weekly loss for the S\u0026P 500 and the Nasdaq, and a third for the Dow, landing despite a Friday on which two indexes rose, says the selling happened earlier in the week rather than in Friday's session. There are two ways to read that: either expectations were marked down across the week, or the final day was a thin recovery. Closing data alone do not separate the two.", "refs": ["week"]}]}, {"h": {"tr": "Bilanço iyi geldi, hisse geriledi", "en": "The results beat, the shares fell"}, "ps": [{"tr": "Intel gelir ve kâr öngörüsünü beklentilerin üzerinde açıkladı, hissesi yine de yüzde 3,8 geriledi. Alphabet ve Tesla bilançoları ise yapay zekâ yatırım harcamasına dair endişeleri artırdı. Rakamın iyi, tepkinin kötü olduğu bu örüntü, piyasanın çeyreklik sonucu değil o sonucu üretmek için taahhüt edilen sermayeyi fiyatladığı yorumunu güçlendiriyor.", "en": "Intel guided revenue and profit above estimates and its shares still fell 3.8%, while results from Alphabet and Tesla sharpened concern about artificial-intelligence capital spending. That pattern of a good number and a poor reaction strengthens the reading that the market is pricing the capital committed to produce the result rather than the quarter itself.", "refs": ["week"]}, {"tr": "Bununla birlikte alternatif bir açıklama duruyor: aynı hafta Brent yüzde 12'nin üzerinde değer kazandı ve enerji maliyetindeki bu artış sektör ayrımı gözetmeden çarpanları aşağı çekmiş olabilir. Bu durumda tepki şirkete özgü bir harcama endişesi değil, iskonto oranının yeniden fiyatlanması olur. İki açıklama aynı fiyat hareketiyle uyumlu.", "en": "An alternative explanation stands alongside it, however: Brent gained more than 12% over the same week, and that rise in energy costs could have compressed multiples without regard to sector. In that case the reaction is a repricing of the discount rate rather than a company-specific worry about spending. Both explanations fit the same price move.", "refs": ["week"]}]}, {"h": {"tr": "Ayrımı hangi veri yapar?", "en": "Which data would separate them"}, "ps": [{"tr": "Ayrımı yapacak gözlem basit. Önümüzdeki haftalarda enerji fiyatı gerilerken sermaye harcamasını artıran şirketlerin hisseleri geride kalmaya devam ederse, harcama endişesi açıklaması güçlenir. Petrol gerilediğinde harcama yapan ve yapmayan şirketler birlikte toparlanırsa, hareketin iskonto oranından geldiği görüşü ağır basar. Her iki durumda da tek bir kapanış bunu doğrulamaya yetmez.", "en": "The observation that would separate them is simple. If shares of companies raising capital spending keep lagging in the coming weeks while energy prices ease, the spending-worry explanation gains ground. If heavy spenders and light spenders recover together once oil retreats, the discount-rate reading carries more weight. Either way a single close cannot confirm it.", "refs": ["week"]}]}], "sources": [{"key": "week", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/here-are-4-forces-that-drove-a-tough-week-for-stocks.html", "title": {"tr": "CNBC hisse senetleri için zorlu geçen haftanın dört itici gücünü sıralıyor", "en": "CNBC lists the four forces behind a tough week for stocks"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-02", "title": {"tr": "Meksika'da pompadaki farkı kim karşılıyor?", "en": "Who covers the difference at a Mexican pump"}, "excerpt": {"tr": "Meksika'da akaryakıt tavanı bir fiyat kararı değil, bir maliye kararı. Yükü hangi bilançonun taşıdığı sorusu burada başlıyor.", "en": "Mexico's fuel cap is a fiscal decision rather than a price decision. The question of which balance sheet carries the burden starts there."}, "sections": [{"h": {"tr": "Tavanın dayandığı iki kaldıraç", "en": "The two levers under the cap"}, "ps": [{"tr": "Bir akaryakıt tavanını ayakta tutan şey pompadaki etiket değil, arkasındaki iki kaldıraçtır: akaryakıt istasyonlarının yüzde 96'sını temsil eden şirketlerin katıldığı gönüllü bir anlaşma ve hükûmetin akaryakıt üzerindeki IEPS özel tüketim vergisini geçici olarak azaltma yetkisi. Meksika'da bu düzenek Magna benzinin litre fiyatını 24 pesonun altında, motorini 27 pesoda tutuyor. Enerji Bakanı Luz Elena González Escobar ikinci kaldıracı daha önce dile getirmişti.", "en": "What holds a fuel cap in place is the pair of levers behind it rather than the label at the pump: a voluntary agreement joined by companies representing 96% of service stations, and the government's power to reduce the IEPS excise tax on fuel temporarily. In Mexico that arrangement keeps Magna petrol below 24 pesos a litre and diesel at 27 pesos. Energy Minister Luz Elena González Escobar has raised the second lever before.", "refs": ["mexico"]}, {"tr": "Bir yönetilen fiyat, ortodoks anlatının önerdiği gibi talebi bastırarak değil, akaryakıt ile hazine arasındaki gelir akışını yeniden yönlendirerek çalışır. Litre başına ödenmeyen vergi, hanenin ödemediği farkın karşılığıdır. Bu bir sübvansiyon tartışması olmadan önce bir muhasebe özdeşliği: bir tarafın gideri, diğer tarafın vazgeçtiği gelirdir.", "en": "An administered price works not by suppressing demand, as the orthodox account suggests, but by redirecting the flow of revenue between the fuel chain and the treasury. The tax not collected per litre is the counterpart of the difference the household does not pay. Before it is a subsidy argument it is an accounting identity: one side's expense is the other side's forgone revenue.", "refs": ["mexico"]}]}, {"h": {"tr": "Yük hangi bilançoda birikiyor?", "en": "Which balance sheet accumulates the burden"}, "ps": [{"tr": "Uluslararası fiyat yükseldikçe vazgeçilen verginin büyüklüğü de artar; yani tavanın maliyeti sabit değil, ham petrol fiyatına bağlı bir değişkendir. Cumhurbaşkanı Claudia Sheinbaum, dünyada akaryakıt fiyatları artarken Meksika'da hane bütçelerinin korunduğunu savunuyor. Bu savunma doğru olsa bile, korumanın nerede biriktiği ayrı bir sorudur.", "en": "As the international price rises, so does the size of the forgone tax; the cost of the cap is therefore not fixed but a variable tied to the crude price. President Claudia Sheinbaum argues that household budgets are being protected in Mexico while fuel prices rise elsewhere. Even if that defence holds, where the protection accumulates is a separate question.", "refs": ["mexico"]}, {"tr": "Alternatif bir okuma da mümkün: Meksika bir petrol üreticisi olduğu için yüksek ham petrol fiyatı kamu gelirini başka kanaldan besleyebilir ve vazgeçilen vergiyi kısmen telafi edebilir. Bu durumda tavanın net maliyeti göründüğünden küçük olur. Açıklanan veriler hangi kanalın baskın olduğunu belirlemeye yetmiyor. Buradaki bilinmezlik hesaplanabilir bir riskten çok, olasılığını kimsenin elinde tutmadığı köklü bir belirsizliktir.", "en": "An alternative reading is available: because Mexico is an oil producer, a high crude price can feed public revenue through another channel and partly offset the forgone tax. In that case the net cost of the cap is smaller than it appears. The information at hand does not establish which channel dominates. Nobody holds the odds here; the question sits in the territory of fundamental uncertainty rather than of calculable risk.", "refs": ["mexico"]}]}, {"h": {"tr": "Aynı yardımın iki biçimi", "en": "Two forms of the same support"}, "ps": [{"tr": "Aynı kaynak doğrudan bir gelir desteği olarak da dağıtılabilirdi. İki biçim arasındaki fark muhasebede değil, kimin ne kadar aldığındadır: vazgeçilen IEPS özel tüketim vergisi tahsilatı, akaryakıtı çok tüketen haneye çok, az tüketene az gider. Ham petrol fiyatı yüksek kalırken tahsilat gerilemeye devam ederse, bu eşitsiz dağıtımın büyüklüğü de artar. Yönetilen fiyatın cazibesi burada: maliyeti tüketici enflasyonunda görünmez, mali hesapların içinde durur.", "en": "The same resources could have been distributed as a direct income supplement. The difference between the two forms lies in who receives how much rather than in the accounting: forgone IEPS excise tax collection goes largely to households that consume a lot of fuel and only slightly to those that consume little. If collection keeps falling while the crude price stays high, the scale of that uneven distribution grows with it. That is where the appeal of an administered price lies: its cost stays out of consumer inflation and sits inside the fiscal accounts.", "refs": ["mexico"]}]}], "sources": [{"key": "mexico", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/e548b330-6621-4fc6-b72a-c6dcd50a785b", "title": {"tr": "Sheinbaum akaryakıt fiyat tavanını enflasyona karşı ana araç sayıyor", "en": "Sheinbaum treats the fuel price cap as her main tool against inflation"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-03", "title": {"tr": "500 milyar dolar tutarında bir niyet mektubu neyi bağlıyor?", "en": "What a $500 billion letter of intent actually binds"}, "excerpt": {"tr": "Nvidia ile SK Group'un açıkladığı girişimde rakam büyük, bağlayıcılık ise açıklanmamış. Modeli kurmak için eksik olan üç girdiyi sıralamak gerekiyor.", "en": "The initiative announced by Nvidia and SK Group carries a large number and undisclosed obligations. Three missing inputs are worth listing before anyone builds the model."}, "sections": [{"h": {"tr": "Açıklanan ile taahhüt edilen", "en": "What was announced and what was committed"}, "ps": [{"tr": "Nvidia'nın bülteninde girişim 500 milyar dolar ve üzeri olarak tanımlanıyor ve tarafların niyet mektupları imzaladığı belirtiliyor. Fiziksel içerik somut: SK Telecom, Nvidia Vera Rubin donanımı ve SK hynix HBM4 belleğiyle çalışacak 2 gigavat ölçeğinde bir yapay zekâ tesisi kuracak ve ilk tesisin 2027'de devreye alınması planlanıyor.", "en": "Nvidia's release describes the initiative as worth more than $500 billion and says the parties signed letters of intent. The physical content is concrete: SK Telecom will build a 2-gigawatt artificial-intelligence facility running Nvidia Vera Rubin hardware with SK hynix HBM4 memory, and the first facility is planned for 2027.", "refs": ["skhynix"]}, {"tr": "Bültenin açıklamadığı üç girdi var: ödeme takvimi, hacim taahhüdü ve birim fiyat. Bu üçü olmadan 500 milyar dolar rakamı bir gelir tahmini yerine bir üst sınır ifadesi olur. İmzalanan belge tarafları müzakereye bağlar, teslimata bağlamaz.", "en": "Three inputs the release does not disclose are the payment schedule, the volume commitment and the unit price. Without those three, $500 billion is a statement of an upper bound, not a revenue estimate. The signed document binds the parties to negotiate and does not bind them to deliver.", "refs": ["skhynix"]}]}, {"h": {"tr": "Hangi varsayım fiyatı taşıyor?", "en": "Which assumption carries the price"}, "ps": [{"tr": "Bu yapıda kıt girdi sermaye değil, HBM4 üretim kapasitesi. Nvidia'nın SK hynix ile birlikte geliştirme ortaklığı kurması, belleği açık piyasadan almak yerine kapasiteye erken erişim satın aldığı yorumunu güçlendiriyor. Böyle bir düzenlemenin ekonomik değeri, ödenen primin sağladığı teslimat önceliğine bağlıdır.", "en": "The scarce input in this structure is HBM4 manufacturing capacity rather than capital. Nvidia forming a codevelopment partnership with SK hynix strengthens the reading that it is buying early access to capacity rather than purchasing memory on the open market. The economic value of such an arrangement depends on the delivery priority the premium buys.", "refs": ["skhynix"]}, {"tr": "Bununla birlikte başka bir açıklama da tutarlı: iki şirket zaten büyük bir tedarik ilişkisi içindeyse, niyet mektubu yeni bir ekonomik hak yaratmadan mevcut ilişkiyi kamuya duyurmuş olabilir. Bu okumada rakam bir taahhüdü değil, bir ölçek beyanını temsil eder. Açıklanan belgeler iki yorumu ayırmaya yetmiyor.", "en": "Another explanation is equally consistent, however: if the two companies were already in a large supply relationship, the letters of intent may have publicised an existing arrangement without creating a new economic right. On that reading the figure represents a statement of scale rather than an obligation. The disclosed documents do not separate the two interpretations.", "refs": ["skhynix"]}]}, {"h": {"tr": "Belgenin verdiği hak", "en": "The right the document grants"}, "ps": [{"tr": "Bir niyet mektubunun verdiği hak dardır: taraflar müzakereye oturur, teslimat yükümlülüğü doğmaz. Bu yüzden 500 milyar dolar rakamı, bağlayıcı bir tedarik sözleşmesi imzalanana ve SK hynix kapasite yatırımını finansal tablolarında ayrıştırana kadar bir modelin girdisi sayılamaz. 2027 hedefi de tesis devreye alınana kadar aynı statüde, yani bir plan olarak durur.", "en": "The right a letter of intent grants is narrow: the parties sit down to negotiate, and no delivery obligation arises. That is why the $500 billion figure cannot count as a model input until a binding supply contract is signed and SK hynix breaks out the capacity investment in its financial statements. The 2027 target holds the same status until the facility is commissioned, which is to say it stands as a plan.", "refs": ["skhynix"]}]}], "sources": [{"key": "skhynix", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/nvidia-locks-down-memory-from-sk-hynix-as-part-of-500-billion-ai-deal.html", "title": {"tr": "Nvidia, SK Group ile 500 milyar dolar ölçeğindeki girişimde bellek tedarikini bağlıyor", "en": "Nvidia ties up memory supply in a $500 billion initiative with SK Group"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-04", "title": {"tr": "Dokuz günlük yastık", "en": "A nine-day cushion"}, "excerpt": {"tr": "Hindistan'ın stratejik petrol rezervi net talebinin yaklaşık dokuz gününü karşılıyor. Yeni tesis duyuruları bu sayıyı bugün değiştirmiyor.", "en": "India's strategic petroleum reserve covers roughly nine days of net demand. Announcements of new facilities do not change that number today."}, "sections": [{"h": {"tr": "Varili gün cinsinden saymak", "en": "Counting the barrels in days"}, "ps": [{"tr": "Hindistan'ın mevcut stratejik rezervi 5,33 milyon ton ve bu miktar net petrol talebinin yaklaşık 8 ila 9 gününü karşılıyor. Uluslararası Enerji Ajansı'nın üye ülkeler için ölçütü 90 günlük acil durum stoku. Aradaki fark bir yüzde meselesi değil, büyüklük mertebesi meselesi; ONGC'nin Mangalore'da planladığı 1,75 milyon tonluk tesis bu farkın küçük bir kısmını kapatıyor.", "en": "India's existing strategic reserve holds 5.33 million tonnes, enough to cover roughly 8 to 9 days of net oil demand. The International Energy Agency's benchmark for member countries is 90 days of emergency stocks. The gap is a question of order of magnitude rather than of percentages, and the 1.75 million tonne facility ONGC plans at Mangalore closes only a small part of it.", "refs": ["reserves"]}, {"tr": "Güney Afrika'nın tablosu benzer. Ülkenin hâlihazırdaki ham petrol rezervi 8 milyon varil; taslak politika ise South African National Petroleum Company yönetiminde 60 günlük ve yaklaşık 36 milyon varillik bir devlet rezervi öngörüyor. Aynı taslak lisanslı dağıtıcılara 14 ila 21 günlük ticari stok zorunluluğu getiriyor.", "en": "South Africa's picture is similar. The country's crude reserves currently stand at 8 million barrels, while a draft policy envisages a 60-day state reserve of about 36 million barrels under the South African National Petroleum Company. The same draft would require licensed distributors to hold 14 to 21 days of commercial stocks.", "refs": ["reserves"]}]}, {"h": {"tr": "Duyurulan kapasite depolanan varil değildir", "en": "Announced capacity is not stored barrels"}, "ps": [{"tr": "Bir depolama tesisinin duyurulması ile o depoya varil konulması arasında iki ayrı gecikme var: inşaat süresi ve dolum için gereken satın alma. İkincisi fiyatın yüksek olduğu bir dönemde daha pahalıdır, çünkü stok kurmak isteyen alıcı zaten sıkışık olan piyasaya ek talep getirir. Stok inşası bu nedenle fiyatı düşürmez; kısa vadede yukarı iter.", "en": "Between announcing a storage facility and putting barrels into it lie two separate delays: construction time and the purchases needed to fill it. The second is more expensive when prices are high, because a buyer building stocks adds demand to an already tight market. Building reserves therefore does not lower the price; in the short run it pushes it up.", "refs": ["reserves"]}, {"tr": "Bir alternatif açıklama, iki ülkenin de duyuruyu fiziksel stok yerine mesaj vermek amacıyla yaptığı olabilir; taslak politika ve tesis planı bağlayıcı bir satın alma programı içermiyor. Bu okumada varil sayısı yıllarca değişmeden kalır. Yayımlanan metinler dolum takvimini göstermediği için iki ihtimal de açık duruyor.", "en": "An alternative explanation is that both countries made the announcement for effect rather than for physical stock; neither the draft policy nor the facility plan contains a binding purchase programme. On that reading the barrel count stays unchanged for years. The documents at hand do not show a filling schedule, so both possibilities remain open.", "refs": ["reserves"]}]}, {"h": {"tr": "Hangi sayı doğrular?", "en": "Which number would confirm it"}, "ps": [{"tr": "İzlenecek büyüklük tesis sayısı değil, gün cinsinden kapsama. Hindistan'ın 8 ila 9 günlük kapsaması yukarı hareket etmeye başlarsa program fiziksel olarak işliyor demektir. Güney Afrika'nın 8 milyon varillik rezervi 36 milyon varile doğru yol almadığı sürece, 60 günlük hedef bir politika metni olarak kalır.", "en": "The magnitude to watch is coverage in days, not the number of facilities. If India's 8 to 9 days of cover starts to move up, the programme is working physically. Unless South Africa's 8 million barrels moves toward 36 million barrels, the 60-day target remains a policy document.", "refs": ["reserves"]}]}], "sources": [{"key": "reserves", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/42847a3b-f4b6-4a16-88e0-f06fdfabbdc6", "title": {"tr": "Hindistan ve Güney Afrika acil durum yakıt stoklarını büyütme yarışında", "en": "India and South Africa are racing to enlarge emergency fuel stocks"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-05", "title": {"tr": "Yirmi buçuk yıllık tarife, peşin 7,85 milyar dolar", "en": "Twenty and a half years of tariff, $7.85 billion up front"}, "excerpt": {"tr": "Kuveyt boru hattı anlaşmasında para bugün geliyor, ödeme yirmi yıl sürüyor. Bu bir mülkiyet haberi değil, bir gelir zamanlaması haberi.", "en": "In Kuwait's pipeline agreement the money arrives today and the payment lasts two decades. This is a story about the timing of income, not about ownership."}, "sections": [{"h": {"tr": "Anlaşmanın dağıttığı şey", "en": "What the agreement distributes"}, "ps": [{"tr": "Kuwait Petroleum Corporation'a bağlı Kuwait Oil Company, 13 ham petrol boru hattını kapsayan ortak girişimin yüzde 51'ini elinde tutuyor; Blackstone, Brookfield ve KKR'den oluşan konsorsiyum yüzde 49'unu alıyor. İşlemin toplam büyüklüğü 16 milyar dolar, Kuveyt tarafına peşin gelir 7,85 milyar dolar ve süre 20,5 yıl. Hatların işletme ve bakım hakları Kuwait Oil Company'de kalıyor.", "en": "Kuwait Oil Company, a subsidiary of Kuwait Petroleum Corporation, retains 51% of a joint venture covering 13 crude oil pipelines, while a consortium of Blackstone, Brookfield and KKR takes 49%. The transaction is worth $16 billion in total, brings $7.85 billion in upfront proceeds to Kuwait and runs for 20.5 years. Operating and maintenance rights over the lines stay with Kuwait Oil Company.", "refs": ["kuwait"]}, {"tr": "Bu yapının dağıtım açısından belirleyici tarafı mülkiyet değil, takvim. Devlet şirketi bugün 7,85 milyar dolar alıyor ve karşılığında hacme bağlı bir tarifeyi yirmi yılı aşkın süre boyunca ödüyor. Yani bugünkü kamu bütçesine giren gelirin karşılığı, gelecek yirmi yılın vergi mükellefine düşen bir gider kalemi.", "en": "What matters here for distribution is the calendar rather than the ownership. The state company receives $7.85 billion today and pays a volume-based tariff in return for more than twenty years. The income entering the public budget now is matched by an expense falling on the taxpayer of the next two decades.", "refs": ["kuwait"]}]}, {"h": {"tr": "Kim kazanır, kim öder?", "en": "Who gains and who pays"}, "ps": [{"tr": "Karşılaştırma yapılacak ölçüt, borçlanma. Devlet aynı parayı tahvil ihraç ederek de toplayabilirdi; o durumda ödeme faiz adını alır ve bütçede görünür. Bu yapıda ise ödeme tarife adını alır, işletme giderine yazılır ve kamu borcu istatistiğine girmez. Aynı nakit akışı, farklı bir muhasebe adresine yönelir.", "en": "The baseline for comparison is borrowing. The state could have raised the same money by issuing bonds; the payment would then be called interest and would appear in the budget. Under this structure the payment is called a tariff, is booked as an operating cost and does not enter the public debt statistics. The same cash flow is routed to a different accounting address.", "refs": ["kuwait"]}, {"tr": "Bununla birlikte alternatif bir okuma var: hacme bağlı tarife, üretim düştüğünde ödemeyi de düşürdüğü için riski kısmen yatırımcıya aktarabilir ve bu, sabit kuponlu borçtan daha korunaklı olabilir. Hangi okumanın geçerli olduğu tarifenin taban tutarına bağlı; açıklanan bilgi bu tabanı göstermiyor.", "en": "An alternative reading is available, however: because the tariff is volume-based, it falls when production falls and so may transfer part of the risk to the investor, which could be more protective than fixed-coupon debt. Which reading holds depends on any floor under the tariff, and the disclosed information does not show that floor.", "refs": ["kuwait"]}]}, {"h": {"tr": "Alacaklı kim, borçlu kim?", "en": "Who holds the claim and who owes it"}, "ps": [{"tr": "Bu yapıda alacaklı belli: yirmi yılı aşkın tarifeyi tahsil edecek olan konsorsiyum. Borçlu ise bugün masada olmayan taraf, yani ödemeyi üstlenecek gelecekteki vergi mükellefi. Kuveyt'in bütçe hesaplarında sermaye harcaması kalemi yükselirse bu mükellefin elinde bir varlık olur; 7,85 milyar dolar cari harcamaya giderse eline yalnızca yirmi yıllık bir gider kalır. Anlaşmanın hane tarafındaki asıl bölüşüm sorusu budur.", "en": "In this structure the creditor is identified: the consortium that will collect a tariff for more than twenty years. The debtor is the party not at the table today, the future taxpayer who takes on the payment. If the capital expenditure line in Kuwait's budget accounts rises, that taxpayer ends up holding an asset; if the $7.85 billion goes to current spending, all that is left is a two-decade expense. That is the real distributive question on the household side of this agreement.", "refs": ["kuwait"]}]}], "sources": [{"key": "kuwait", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/780bc4bb-1916-4fe2-ad2b-22663c66f16e", "title": {"tr": "Blackstone, KKR ve Brookfield Kuveyt boru hatlarında 16 milyar dolar değerinde paya giriyor", "en": "Blackstone, KKR and Brookfield take a $16 billion stake in Kuwait's pipelines"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-06", "title": {"tr": "Petrol 100 dolar sınırına yaklaşırken faiz indirimi kim için fiyatlanıyor?", "en": "Who is
