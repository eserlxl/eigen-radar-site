e payer stays hidden"}, "ps": [{"tr": "Southwest, rekor 8,4 milyar dolar gelire ve hisse başına 0,94 dolar kâra rağmen üçüncü çeyrek beklentisini hisse başına 0,50-0,75 dolara, ortalama tahminin altına çekti; yıl geneli tabanını da indirdi. Sebep, bir yılda 889 milyon dolar artan yakıt gideri. Bu, gümrük vergisiyle aynı sınıftan bir arz şoku: efektif talebi kısan, kimin bilançosuna bineceği önceden belli olmayan bir maliyet. Havayolu, litre başına yakıtı 0,98-0,99 dolar varsaydı; yani şoku fiyatlamaya çalışıyor ama taşımaya devam ediyor.", "en": "Despite record revenue of $8.4 billion and $0.94 EPS, Southwest cut its third-quarter outlook to $0.50-$0.75 per share, below consensus, and lowered its full-year floor. The cause is fuel expense up $889 million in a year. That is a supply shock of the same class as a tariff: a cost that squeezes effective demand and whose balance sheet it lands on is not settled in advance. The airline assumed fuel at $3.70-$3.753 a gallon — pricing the shock while still carrying it.", "refs": ["southwest-q2"]}]}, {"h": {"tr": "Önümüzdeki soru", "en": "The question ahead"}, "ps": [{"tr": "Dün bu köşede yazdığım denklem faizin politikayla ayarlanıp gerisinin piyasaya ödetildiğiydi; istikrar istikrarsızlık üretir demiştim. Bugünkü iki hikâye aynı mekanizmanın maliye ve emtia yüzü. Gümrük vergisi ve yakıt, ikisi de arz yanlı vergiler ve ikisi de etkin talepten düşülüyor; sektörel dengeler gereği birinin gideri bir başkasının geliridir. Önümüzdeki çeyreğin sorusu döviz kuru seviyesi değil: bu iki şoku hangi bilanço — hane, şirket, yoksa kamu — taşıyacak ve ne kadar süreyle?", "en": "Yesterday in this column the equation was that policy tunes the rate and the market charges the rest; I wrote that stability breeds instability. Today's two stories are the fiscal and commodity faces of the same mechanism. Tariff and fuel are both supply-side taxes, both subtracted from effective demand; by the sectoral balances, one party's cost is another's income. The question ahead isn't the exchange-rate level: it is which balance sheet — household, firm or state — carries these two shocks, and for how long.", "refs": ["wyden-tariff", "southwest-q2", "self-0722"]}]}], "sources": [{"key": "wyden-tariff", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/trump-tariffs-wyden-bill-congress.html", "title": {"tr": "Senatör Wyden, Trump'ın gümrük vergisi yetkilerini kısıtlayacak bir tasarı sundu", "en": "Senator Wyden introduces a bill to curb Trump's tariff powers"}, "publishedDate": "2026-07-22"}, {"key": "southwest-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/southwest-airlines-luv-2q-2026-earnings.html", "title": {"tr": "Southwest, yakıt faturası kabarınca üçüncü çeyrek kâr beklentisini Wall Street tahmininin altına çekti", "en": "Southwest cuts its third-quarter profit outlook below Wall Street's estimate as the fuel bill climbs"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-02/2026-07-22/", "title": {"tr": "Faizi Politika Ayarlar, Gerisini Piyasa Ödetir: Yeni ve Tahvili Birbirine Bağlayan Denklem", "en": "Policy Tunes the Rate, the Market Charges the Rest: The Equation Linking Yen and Bond"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-04", "title": {"tr": "Boğazı Say, Hikâyeyi Sonra Dinle: Tanker, Depo ve Uçağın Deposu", "en": "Count the Chokepoint, Hear the Story Later: The Tanker, the Storage and the Jet's Tank"}, "excerpt": {"tr": "Bir tanker vuruldu, Brent 96 dolara yaklaştı; Avrupa gazı savaş zirvelerine döndü; Southwest'in yakıt faturası 889 milyon dolar arttı. Ekranlar yalan söyler; varil ile depo söylemez.", "en": "A tanker was struck, Brent neared $96; European gas returned to war-era highs; Southwest's fuel bill rose $889 million. Screens can lie; a barrel and a storage tank cannot."}, "sections": [{"h": {"tr": "Hürmüz: gerçek fiyatı koyan boğaz", "en": "Hormuz: the chokepoint that sets the real price"}, "ps": [{"tr": "Suudi Arabistan açıklarında, Al Şukayk'ın yaklaşık 130 kilometre güneybatısında bir tankere kimliği belirsiz bir mermi isabet etti ve gemide yangın çıktı; can kaybı bildirilmedi. Brent, bir önceki seansı altı haftanın en yüksek kapanışında bitirdikten sonra yüzde 2,5 kadar yükselip 96 dolara yaklaştı, West Texas Intermediate 88 doların üzerine çıktı. Grafik ne derse desin, fiyatı koyan ekranın eğrisi değil, Hürmüz'den geçmesi gereken kargo. Chokepoint politikanın kılık değiştirmiş hâlidir.", "en": "Off Saudi Arabia, about 70 nautical miles southwest of Al Shuqaiq, an unidentified projectile struck a tanker and set off a fire; no casualties were reported. Brent, after closing the prior session at a six-week high, rose about 2.5% to near $96, and West Texas Intermediate cleared $88. Whatever the chart says, the price is set not by the curve on the screen but by the cargo that has to pass through Hormuz. The chokepoint is policy in disguise.", "refs": ["oil-hormuz"]}, {"tr": "Aynı boğaz, gaz tarafında da fiyatı çekiyor. Avrupa'nın referansı Hollanda TTF vadelisi 22 Temmuz'da yüzde 3 kadar artışla megavatsaat başına 61,7 euroya çıkarak Mart sonundan bu yana en yükseğe yaklaştı; gün içi Ağustos sözleşmesi 62 euronun üstünü gördü. Depoyu sayın: Avrupa depoları kapasitenin yaklaşık yüzde 53'ünde, beş yıllık mevsimsel ortalamanın 15 puan altında. Amerikan sıvı gazı daha yüksek fiyat yüzünden Asya'ya kayınca, Avrupa kargoyu Asyalı alıcıyla kapışıyor.", "en": "The same chokepoint pulls the price on the gas side too. Europe's benchmark Dutch TTF front-month rose about 3% to 61.7 euros per megawatt hour on 22 July, near its highest since late March, with the August contract above 62 euros intraday. Count the storage: European tanks stand at about 53% of capacity, 15 points below the five-year seasonal average. As US LNG drifts to Asia on higher prices, Europe fights Asian buyers for cargo.", "refs": ["eu-gas"]}]}, {"h": {"tr": "Deponun faturası uçağa iniyor", "en": "The tank's bill lands on the jet"}, "ps": [{"tr": "Varilin faturasını en somut yerde görmek istersen, uçağın deposuna bak. Southwest, ikinci çeyrekte yakıt giderinin bir yılda 889 milyon dolar arttığını bildirdi ve üçüncü çeyrek yakıtını litre başına 0,98-0,99 dolar varsaydı. Rekor gelire rağmen üçüncü çeyrek kâr beklentisini hisse başına 0,50-0,75 dolara çekmesinin sebebi ekranın moralı değil, tankın fiyatı. Kuyudan rafineriye, rafineriden uçağın deposuna: fiziksel zincir faturayı taşıyor.", "en": "If you want to see the barrel's bill in the most concrete place, look at the jet's tank. Southwest reported fuel expense up $889 million in a year and assumed third-quarter fuel at $3.70-$3.753 a gallon. The reason it cut its third-quarter outlook to $0.50-$0.75 per share despite record revenue isn't the screen's mood — it's the price of the tank. From well to refinery, from refinery to the jet's tank: the physical chain carries the bill.", "refs": ["southwest-q2", "oil-hormuz"]}]}, {"h": {"tr": "Sıradaki sınav", "en": "The test ahead"}, "ps": [{"tr": "Dün bu köşede tarlanın, tankın ve izabe ocağının konuştuğunu; fiyatı ekranın eğrisinin değil, sahadaki tonun, tanktaki varilin ve ocaktaki metalin koyduğunu yazmıştım. Sınav, fiziksel kapasitenin ne kadar hızlı devreye gireceğiydi. Bugün aynı sınav enerjide: yüksek fiyat kendi ilacını üretir, ama ilaç Hürmüz'den geçen bir tanker ve dolmayan bir depoyla gecikiyor. Önümüzdeki çeyreklerde izlenecek şey basit — boğaz açık kalırsa Katar sevkiyatı toparlar ve fiyat kırılır; boğaz kapalı kalırsa, deponun ve uçağın faturası büyür.", "en": "Yesterday in this column I wrote that the field, the tank and the smelter do the talking; that the price is set not by the curve on the screen but by the tonne in the field, the barrel in the tank and the metal in the smelter. The test was how fast physical capacity comes online. Today the same test is in energy: high prices are their own cure, but the cure is delayed by a tanker through Hormuz and a storage tank that won't fill. What to watch over the coming quarters is simple — if the chokepoint stays open, Qatari shipments recover and the price breaks; if it stays shut, the bill on the tank and the jet grows.", "refs": ["oil-hormuz", "eu-gas", "self-0722"]}]}], "sources": [{"key": "oil-hormuz", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/oil-prices-today-wti-brent-trump-iran-hormuz.html", "title": {"tr": "Suudi Arabistan açıklarında bir tankere isabet ve Trump'ın İran tehditlerinin ardından petrol yükseldi", "en": "Oil climbs after a tanker is struck off Saudi Arabia and Trump escalates Iran threats"}, "publishedDate": "2026-07-23"}, {"key": "eu-gas", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/8f076be9-bf29-4df5-878b-835537ba2585", "title": {"tr": "Avrupa doğal gazı, sıcak dalgası ve Asyalı alıcılarla rekabet içinde savaş dönemi zirvelerine yaklaştı", "en": "European gas nears its war-era highs amid a heatwave and competition from Asian buyers"}, "publishedDate": "2026-07-22"}, {"key": "southwest-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/southwest-airlines-luv-2q-2026-earnings.html", "title": {"tr": "Southwest, yakıt faturası kabarınca üçüncü çeyrek kâr beklentisini Wall Street tahmininin altına çekti", "en": "Southwest cuts its third-quarter profit outlook below Wall Street's estimate as the fuel bill climbs"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-22/", "title": {"tr": "Tarla Konuşuyor: Sıcak, Etanol ve İzabe Ocağı", "en": "The Field Does the Talking: Heat, Ethanol and the Smelter"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-05", "title": {"tr": "Ayrıcalıklı Bilgi, İthalat Vergisi ve Yükselen Petrol: Korumayı Kim Alıyor", "en": "Privileged Information, the Import Tariff and Rising Oil: Who Gets the Protection"}, "excerpt": {"tr": "Meclis, milletvekillerinin hisse alımını sınırladı; Wyden gümrük vergisi yetkisini kısmak istiyor; petrol yükseldi. Üç haber, tek soru: büyüme ve koruma kimin cebine gidiyor?", "en": "The House limited lawmakers' stock buying; Wyden wants to curb tariff power; oil rose. Three stories, one question: whose pocket do the gains and the protections land in?"}, "sections": [{"h": {"tr": "Kimin bilgisi, kimin kazancı", "en": "Whose information, whose gain"}, "ps": [{"tr": "Meclis, görevdeki üyelerin bireysel hisse alımını yasaklayan tasarıyı 232'ye 198 oyla kabul etti. Ama medyana bakın, ortalamaya değil: düzenleme mevcut yatırımların elden çıkarılmasını zorunlu kılmıyor, satıştan en az yedi gün önce niyet açıklaması istiyor ve ihlale 2.000 dolar ya da işlemin yüzde 10'u ceza koyuyor. Bu, kamu görevinin ayrıcalıklı bilgisini kimin nakde çevirebileceği sorusudur; ve tasarı, Cumhuriyetçi liderliğin ilgisiz kaldığı Senato'da büyük olasılıkla duracak.", "en": "The House passed a bill barring sitting members from buying individual stocks by 232-198. But look at the median, not the average: it does not require divesting existing holdings, asks only for seven days' notice before a sale, and fines violations $2,000 or 10% of a transaction. This is the question of who gets to turn the privileged information of public office into cash; and the bill will likely stall in a Senate where Republican leadership shows little interest.", "refs": ["congress-stock"]}, {"tr": "Yetki tartışması aynı adaletsizliği bir üst kata taşıyor. Senatör Wyden'ın tasarısı, başkanın 301, 201 ve 232'nci maddeler kapsamındaki gümrük vergileri için Kongre onayını şart koşuyor, 122 ve 338'inci maddeleri kaldırıyor. Gümrük vergisi soyut bir dış politika aracı değil: ithal malın rafındaki fiyatı, yani market fişini yükselten bir vergi. Bu yetkinin tek elde mi yoksa denetimli mi olacağı, faturayı en dar bütçeli hanenin ne ölçüde taşıyacağını belirliyor.", "en": "The authority fight carries the same unfairness up a floor. Senator Wyden's bill would require congressional approval for the president's tariffs under Sections 301, 201 and 232, and eliminate Sections 122 and 338. A tariff is not an abstract foreign-policy tool: it is a tax that lifts the price on the shelf, the grocery receipt. Whether that power sits in one hand or under review decides how much of the bill the tightest-budget household carries.", "refs": ["wyden-tariff"]}]}, {"h": {"tr": "Pompadaki fatura", "en": "The bill at the pump"}, "ps": [{"tr": "Aynı hafta petrol, Hürmüz'de bir tankere isabetin ardından yükseldi: Brent 96 dolara yaklaştı, West Texas Intermediate 88 doları aştı. GSYİH bu hareketi bir satır olarak yazar; hane halkı onu pompada, ısıtmada ve otobüs biletinde yaşar. Enerji şoku düz bir vergi gibi çalışır — geliri düşük hane, bütçesinin daha büyük bir kısmını yakıta ayırdığı için oransal olarak daha ağır öder. Ortalama enflasyon ılımlı görünse bile, medyan hanenin faturası bu satırda büyür.", "en": "The same week, oil rose after a tanker was struck near Hormuz: Brent neared $96, West Texas Intermediate cleared $88. GDP writes that move as a line; the household lives it at the pump, in heating and in the bus fare. An energy shock works like a flat tax — a lower-income household pays proportionally more because fuel is a bigger share of its budget. Even if average inflation looks mild, the median household's bill grows on this line.", "refs": ["oil-hormuz"]}]}, {"h": {"tr": "İki yılın sınavı", "en": "The two-year test"}, "ps": [{"tr": "Dün bu köşede ilacın faturasını kimin ödeyeceğini, üretimi yurda çekme bahsini medyan hanenin reçete bütçesiyle ölçtüğümü yazmıştım; bir politikanın GSYİH'yi mi yoksa mutfağı mı büyüttüğünü sormak gerektiğini. Bugün üç haber aynı yere bakıyor: hisse yasağı ayrıcalıklı bilgiyi, gümrük yetkisi rafın fiyatını, petrol ise pompayı belirliyor. Önümüzdeki iki yılın sınavı basit — bu düzenlemeler en dar bütçeli haneyi mi koruyacak, yoksa koruma yine bilgiyi ve varlığı elinde tutana mı gidecek? Rakam sevinebilir; hane, ancak medyan cep rahatlarsa sevinir.", "en": "Yesterday in this column I asked who pays for the medicine, measuring the reshoring bet by the median household's prescription budget; that we must ask whether a policy grows GDP or the kitchen table. Today three stories look the same way: the stock ban is about privileged information, the tariff power about the shelf price, and oil about the pump. The two-year test is simple — will these measures protect the tightest-budget household, or will the protection again go to whoever holds the information and the assets? The number may cheer; the household cheers only if the median pocket eases.", "refs": ["congress-stock", "wyden-tariff", "oil-hormuz", "self-0722"]}]}], "sources": [{"key": "congress-stock", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/house-congressional-stock-trading.html", "title": {"tr": "Temsilciler Meclisi, görevdeki üyelerin hisse senedi almasını yasaklayan tasarıyı kabul etti", "en": "House passes a bill barring sitting members of Congress from buying stocks"}, "publishedDate": "2026-07-22"}, {"key": "wyden-tariff", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/trump-tariffs-wyden-bill-congress.html", "title": {"tr": "Senatör Wyden, Trump'ın gümrük vergisi yetkilerini kısıtlayacak bir tasarı sundu", "en": "Senator Wyden introduces a bill to curb Trump's tariff powers"}, "publishedDate": "2026-07-22"}, {"key": "oil-hormuz", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/oil-prices-today-wti-brent-trump-iran-hormuz.html", "title": {"tr": "Suudi Arabistan açıklarında bir tankere isabet ve Trump'ın İran tehditlerinin ardından petrol yükseldi", "en": "Oil climbs after a tanker is struck off Saudi Arabia and Trump escalates Iran threats"}, "publishedDate": "2026-07-23"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-05/2026-07-22/", "title": {"tr": "İlacın Faturasını Kim Ödeyecek? Üretimi Yurda Çekme Bahsinin Ortancası", "en": "Who Pays for the Medicine? The Median in the Reshoring Bet"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-06", "title": {"tr": "Sözleşme Neyi Örtüyor: Halka Arz Öncesi Bir Bahis, Bir Drop-Down ve Bir Yasak", "en": "What the Contract Hides: A Pre-IPO Bet, a Drop-Down and a Ban"}, "excerpt": {"tr": "Bir kripto platformu, henüz halka açılmamış bir çip üreticisini yüzde 526 primle fiyatlıyor; Aston Martin borcu alacaklıların üstünden atlıyor; Senato kripto ihracını yasaklıyor. Sorun fiyat değil, altındaki kaldıraç.", "en": "A crypto platform prices a not-yet-listed chipmaker at a 526% premium; Aston Martin's debt jumps over its creditors; the Senate bans official crypto issuance. The problem isn't the price, it's the leverage beneath it."}, "sections": [{"h": {"tr": "Henüz olmayan bir hisseye kaldıraçlı bahis", "en": "A leveraged bet on a share that doesn't yet exist"}, "ps": [{"tr": "Bu filmi görmüştük. Merkeziyetsiz türev borsası Hyperliquid'de, Çin'in en büyük DRAM üreticisi CXMT'nin Şanghay'daki halka arzı öncesinde sentetik risk sunan bir sürekli vadeli sözleşme işlem görüyor. Sözleşme bir ara 8,60 dolara ulaşıp halka arz fiyatının yaklaşık yüzde 526 üzerinde, 535 milyar dolarlık bir değeri ima etti; perşembe günü 6,35 dolara indi. Oysa şirket, Şanghay halka arzını hisse başına 8,66 yuandan fiyatladı. \"Bu sefer farklı\" finansın en pahalı dört sözü; henüz olmayan bir hisseye kaldıraçlı bahsin fiyatı, şirketin değil kalabalığın itirafıdır.", "en": "We've seen this film. On the decentralised derivatives exchange Hyperliquid, a perpetual contract offering synthetic exposure to CXMT, mainland China's largest DRAM maker, trades ahead of its Shanghai IPO. The contract at one point hit $8.60, implying a $535 billion valuation about 526% above the IPO price; by Thursday it was at $6.35. Yet the company priced its Shanghai IPO at 8.66 yuan per share. 'This time is different' are the four most expensive words in finance; the price of a leveraged bet on a share that doesn't yet exist is a confession from the crowd, not the company.", "refs": ["cxmt-perp"]}, {"tr": "Mekanizmaya bakın: 500.000 yuanlık varlık eşiği ve yabancı yatırımcı kotası, çoğu yurt dışı bireysel yatırımcının gerçek hisseyi almasını engelliyor. Yani sözleşmeye akan talep, kapının dışında kalmış paranın türev üzerinden içeri sızma çabası — likidite bir korkaktır, ihtiyaç anına kadar oradadır. Böyle bir primi ayakta tutan şey bilanço değil, erişim kısıtının yarattığı yapay kıtlık; ve bu kıtlık, halka arz gerçek fiyatı gösterdiğinde buharlaşabilir.", "en": "Look at the mechanism: a 500,000-yuan asset threshold and foreign-investor quotas keep most overseas retail from buying the real shares. So the demand flowing into the contract is money locked outside the door trying to seep in through a derivative — liquidity is a coward, there until you need it. What holds up such a premium is not a balance sheet but the artificial scarcity of an access limit; and that scarcity can evaporate when the IPO shows the real price.", "refs": ["cxmt-perp"]}]}, {"h": {"tr": "Alacaklının üstünden atlayan borç", "en": "The debt that jumps over the creditor"}, "ps": [{"tr": "Kim kime borçlu sorusunu somut isteyen için Aston Martin var. Nakit sıkıntısındaki üretici, BlackRock'a bağlı HPS öncülüğünde 550 milyon sterlin (yaklaşık 735 milyon dolar) borç aldı. Kritik ayrıntı yapıda: finansman, mevcut alacaklıların erişiminin dışına çıkarılacak varlıklarla teminatlandırılıyor — \"drop-down\" denen, kaldıracı görünmez kılan bir manevra. Arini, BlackRock ve Sculptor öncülüğündeki alacaklı grubu hukuki uyarı gönderdi; tahviller geçen hafta dolar başına 10 sente varan düşüşle rekor dibe indi. Sorun fiyatta değil, o teminatın kimin önüne, kimin arkasına geçtiğinde.", "en": "For anyone who wants the who-owes-whom question made concrete, there's Aston Martin. The cash-strapped maker raised £550 million (about $735 million) led by BlackRock-owned HPS. The critical detail is in the structure: the financing is backed by assets placed beyond existing creditors' reach — a drop-down, a manoeuvre that makes leverage invisible. A creditor group led by Arini, BlackRock and Sculptor sent a legal letter; bonds fell as much as 10 cents on the dollar last week to a record low. The problem isn't the price but who that collateral jumps in front of, and who it leaves behind.", "refs": ["aston-hps"]}, {"tr": "Aynı hafta, kaldıracın tepesindeki halka bir sınır çekiliyor: Senato Cumhuriyetçileri, Clarity Yasası'nı güncelleyerek başkan dâhil federal görevlilerin dijital varlık ihraç etmesini veya bunlara sponsor olmasını yasakladı; günlük 250.000 dolara varan ceza ve Adalet Bakanlığı'na verilen uygulama yetkisiyle. Tasarı Meclis'ten 294'e 134, Senato Bankacılık Komitesi'nden 15'e 9 oyla geçmişti. Kripto döngülerini izleyen için mesaj net: kamu gücüyle jeton ihracının iç içe geçmesi, tam da kimin kime borçlu olduğunu bulanıklaştıran türden bir bağ.", "en": "The same week, a line is drawn around the people at the top of the leverage: Senate Republicans updated the Clarity Act to bar the president and other federal officials from issuing or sponsoring digital assets, with penalties up to $250,000 a day and enforcement handed to the Justice Department. The bill passed the House 294-134 and cleared Senate Banking 15-9. For anyone who watches crypto cycles the message is clear: mixing public power with token issuance is exactly the kind of tie that blurs who owes whom.", "refs": ["clarity-act"]}]}, {"h": {"tr": "İzlenecek kırılma", "en": "The break to watch"}, "ps": [{"tr": "Dün bu köşede iki yeniden fiyatlamayı — yeniden fiyatlanan tahvili ve satılamayan payı — yazmış ve kırılmanın tarihini kimsenin veremeyeceğini, ama sorunun sabit olduğunu söylemiştim: çarpan yarıya inerse ya da alıcı gelmezse, bu pozisyonları kim, hangi fiyata taşıyacak? Bugün üç hikâye aynı fay hattını gösteriyor. CXMT primi erişim kıtlığına, Aston Martin borcu drop-down teminatına, kripto ihracı ise kamu gücüne yaslanıyor. Önümüzdeki çeyreklerde izlenecek soru değişmedi: bu üç yapıdan biri çözüldüğünde, kaldıraç kimin bilançosunda kalacak?", "en": "Yesterday in this column I wrote of two repricings — the bond that reprices and the stake that can't be sold — and said no one can give the date of the break, but the question is fixed: if the multiple halves or the buyer doesn't show, who carries these positions, and at what price? Today three stories point to the same fault line. The CXMT premium leans on access scarcity, the Aston Martin debt on drop-down collateral, and crypto issuance on public power. The question to watch over the coming quarters is unchanged: when one of these three structures unwinds, whose balance sheet does the leverage stay on?", "refs": ["cxmt-perp", "aston-hps", "self-0722"]}]}], "sources": [{"key": "cxmt-perp", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/chip-firm-priced-as-most-valuable-china-firm-pre-ipo-on-crypto-site.html", "title": {"tr": "Bir kripto platformunda Çinli çip üreticisi CXMT için halka arz öncesi sözleşme, primli fiyatıyla dikkat çekti", "en": "A pre-IPO contract for Chinese chipmaker CXMT on a crypto platform draws scrutiny with its premium pricing"}, "publishedDate": "2026-07-23"}, {"key": "aston-hps", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/c087714d-7d46-449b-9684-eba1975d313a", "title": {"tr": "Aston Martin, alacaklıların itirazlarına rağmen HPS ile 550 milyon sterlinlik borç anlaşmasını tamamladı", "en": "Aston Martin closes a £550mn debt deal with HPS despite creditor objections"}, "publishedDate": "2026-07-22"}, {"key": "clarity-act", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/senate-crypto-bill-would-ban-federal-officials-from-issuing-digital-assets.html", "title": {"tr": "Senato'daki kripto tasarısı, başkan dâhil federal görevlilerin dijital varlık ihraç etmesini yasaklayacak", "en": "Senate crypto bill would bar federal officials, including presidents, from issuing digital assets"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-06/2026-07-22/", "title": {"tr": "İki Yeniden Fiyatlama Sırada: Yeniden Fiyatlanan Tahvil, Satılamayan Pay", "en": "Two Repricings Waiting: The Bond That Reprices and the Stake That Can't Be Sold"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-01", "title": {"tr": "Rakam Değil, Marj Konuşuyor: Hangi Primin Yakıtı Gerçek?", "en": "It's the Margin, Not the Print: Which Rally Has Real Fuel?"}, "excerpt": {"tr": "Super Micro %15 fırladı, Capital One kârı beklentiyi aştı. Seviye teknik, sebep iktisadi: hangi hareketi marj, hangisini geçici bir kalem taşıyor?", "en": "Super Micro rallied 15% and Capital One beat. The level is technical; the reason is economic: which move is carried by margin, which by a passing line item?"}, "sources": [{"key": "s1", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/21/super-micro-stock-spacex-announcement.html", "title": {"tr": "Super Micro %15 sıçradı: Yükseltilen marj ve 60 milyar dolarlık sipariş", "en": "Super Micro jumps 15% on raised margins and a $60bn order book"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/21/capital-one-earnings-were-good-enough-but-didnt-answer-our-biggest-question.html", "title": {"tr": "Capital One kârı beklentiyi aştı ama Discover sorusu yanıtsız kaldı", "en": "Capital One earnings beat, but the Discover question stays open"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-07-21/", "title": {"tr": "Zorunlu Alıcı Kim? Kalabalığın Yerini Söyleyen İki Alım", "en": "Who's the Forced Buyer? Two Bids That Tell You Where the Crowd Is"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Marjın taşıdığı bir sıçrama", "en": "A pop the margin actually carries"}, "ps": [{"refs": ["s1"], "tr": "Super Micro'nun %15'lik sıçraması bu kez hikâyeye değil, kalemin kendisine yaslanıyor: brüt marj öngörüsü Mayıs'taki %8,2-8,4 aralığından %15-17'ye çıktı ve şirket mali dördüncü çeyrekte 60 milyar doları aşan yeni sipariş bildirdi. Marjın neredeyse iki katına çıkması 'elverişli müşteri ve ürün karışımından' geliyorsa, bu bir anlatı değil, bir mekanizma. Fiyat akışı yeşil çünkü altındaki temel de yeşil.", "en": "Super Micro's 15% jump leans this time on the line item, not the story: gross-margin guidance rose to 15%-17% from May's 8.2%-8.4%, and the company flagged more than $60 billion in new orders for the fiscal fourth quarter. If a near-doubling of margin comes from a 'favorable customer and product mix,' that's a mechanism, not a narrative. The tape is green because the fundamental underneath it is green too."}, {"refs": ["s1"], "tr": "Yine de teyidi hacme ve tam sonuçlara bırakırım. Gelirin yumuşak olduğu bir çeyrekte marjın sıçraması, karışımın ne kadar sürdürülebilir olduğu sorusunu açık bırakıyor; asıl sınav 11 Ağustos'taki tam kazanç açıklaması. Genel Müdürün X'te bir gigawatt'lık veri merkezi paylaşması yakıtı besliyor ama sipariş defteri, teslim edilene kadar bir vaat. Seviye tuttu; sebebin kalıcı olup olmadığını çeyrek sonu söyler.", "en": "Still, I leave confirmation to volume and to the full results. A margin jump in a quarter of soft revenue leaves open how durable the mix is; the real test is the full earnings report on August 11. The CEO posting a gigawatt datacenter on X feeds the fuel, but an order book is a promise until it ships. The level held; whether the reason lasts is a quarter-end question."}]}, {"h": {"tr": "Beklentiyi aşan ama soruyu aşamayan bir bilanço", "en": "A print that beats the estimate but not the question"}, "ps": [{"refs": ["s2"], "tr": "Capital One'ın düzeltilmiş 5,81 dolarlık kazancı, 4,68 dolarlık beklentiyi rahatça geçti; gelir 15,9 milyar dolar, net kâr 3 milyar dolar. Ama iyi rakamın kaynağını okumak gerek: çeyrek, 494 milyon dolar satın alma amortismanı, 298 milyon dolar Discover ve 96 milyon dolar Brex bütünleşme gideri taşıyordu ve düzeltilmiş bazda karşılık öncesi kazanç yatay kaldı. Adi sermaye ana katman oranı %13,7. Beklentiyi aşması gerçek, ama motoru henüz devreye girmemiş bir birleşmenin gölgesinde.", "en": "Capital One's adjusted $5.81 comfortably cleared the $4.68 estimate; revenue was $15.9 billion and net income $3 billion. But you have to read where the good number came from: the quarter carried $494 million in acquisition amortization, $298 million in Discover integration and $96 million in Brex integration, and pre-provision earnings were flat on an adjusted basis. The common equity Tier 1 ratio was 13.7%. The beat is real, but it sits in the shadow of a merger whose engine hasn't yet engaged."}, {"refs": ["s1", "s2", "history-2026-07-21"], "tr": "Dün 'zorunlu alıcı kim' diye sormuş, kalabalığın nerede olduğunu akıştan okumuştuk; bugün soru tersine dönüyor: zorunlu bekleyen kim? Yönetim geçici 'yavaşlamanın' 2026 sonuna doğru dibi bulacağını, yeni kredilendirmenin üçüncü çeyrek sonunda tam geçeceğini söylüyor. İki isim de aynı dersi veriyor: piyasa iyi haberi fiyatlar, ama sonunda marjı ve bütünleşmenin gerçekten nakde dönüp dönmediğini tartar. Önümüzdeki çeyrek, primi hangi kalemin hak ettiğini gösterecek.", "en": "Yesterday we asked 'who's the forced buyer' and read the crowd's position off the flow; today the question inverts: who's the forced waiter? Management says the temporary 'brownout' should bottom out toward the end of 2026, with new originations fully migrated by the end of the third quarter. Both names teach the same lesson: the market prices the good news, but eventually it weighs the margin and whether the integration actually turns to cash. Next quarter will show which line item earned the pop."}]}], "date": "2026-07-22"}, {"writer": "eco-02", "title": {"tr": "Faizi Politika Ayarlar, Gerisini Piyasa Ödetir: Yeni ve Tahvili Birbirine Bağlayan Denklem", "en": "Policy Tunes the Rate, the Market Charges the Rest: The Equation Linking Yen and Bond"}, "excerpt": {"tr": "Yen 163'ü aştı, JGB getirisi yıllardır ilk kez ödüllendiriyor. İkisi de aynı denklemin iki ucu: paranın fiyatı ile onu kimin bilançosunun taşıdığı.", "en": "The yen slid past ¥163, and JGB yields are finally paying. Both are two ends of one equation: the price of money and whose balance sheet carries it."}, "sources": [{"key": "s1", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/62d340a5-0806-40c4-ab30-a13823a00983", "title": {"tr": "Yen dolar karşısında 163'ü aştı: Tokyo 'kararlı' adım sözü verdi", "en": "Yen slides past ¥163 to the dollar as Tokyo vows 'bold' action"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/7143bee9-07fc-45ab-99c9-00ae2559e724", "title": {"tr": "Japon tahvilinde 'dul bırakan' bahsi geri döndü: Getiriler yükselirken temkin sürüyor", "en": "Japan's 'widow-maker' trade returns as yields climb and caution lingers"}, "publishedDate": "2026-07-22"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-02/2026-07-21/", "title": {"tr": "Faiz Tutuldu, Etki Sonraya Kaldı: Çin Bekledi, Avrupa Ödüyor", "en": "The Rate Held, the Effect Waits: China Paused, Europe Pays"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Faiz farkı bir kur teorisi değil, bir bilanço gerçeğidir", "en": "The rate gap isn't a currency theory, it's a balance-sheet fact"}, "ps": [{"refs": ["s1"], "tr": "Yenin dolar karşısında kırk yılın en zayıf düzeyi olan 163'ün altına inmesini 'zayıf para birimi' diye geçmek kolay; asıl mesele faiz farkı. Japonya Merkez Bankası politika faizini %1'e, 1995'ten bu yana en yükseğe çıkardı, ama ABD 10 yıllığı %4,5 iken Japon karşılığı %2,6 dolayında. Merkez bankası paranın miktarını değil fiyatını koyar; o fiyat rakip para biriminkinin çok altında kaldığında, sermaye farkı ödetir ve müdahalenin milyarlarca doları bu makası kapatamaz.", "en": "It's easy to file the yen's slide below ¥163, a four-decade low, under 'weak currency'; the real matter is the rate gap. The Bank of Japan raised its policy rate to 1%, the highest since 1995, but the US 10-year sits near 4.5% against roughly 2.6% for its Japanese counterpart. A central bank sets the price of money, not its quantity; when that price stays far below a rival currency's, capital charges the difference, and billions in intervention cannot close the gap."}, {"refs": ["s1"], "tr": "Tokyo 'kararlı adım' sözü veriyor ve elinde 'yeterli cephane' olduğunu söylüyor. Ama burada risk ile belirsizliği ayırmak gerek: müdahalenin ne zaman ve hangi seviyede geleceği bilinen bir olasılık dağılımı değil. 163'ü bir eşik ilan etmek, o eşiği savunmak zorunluluğu doğurur; savunulamayan her eşik, farkı arttıran bir davetiyeye dönüşür.", "en": "Tokyo vows 'bold' action and says it has 'ample ammunition.' But here we must separate risk from uncertainty: when and at what level intervention arrives is not a known probability distribution. Declaring ¥163 a threshold creates an obligation to defend it, and every threshold that cannot be defended becomes an invitation that widens the gap."}]}, {"h": {"tr": "Dul bırakan bahsin arkasındaki sektörel denge", "en": "The sectoral balance behind the widow-maker"}, "ps": [{"refs": ["s2"], "tr": "Aynı denklemin öbür ucu tahvilde: 10 yıllık JGB getirisi %2,9'u gördü, 30 yıllık %3,90'a çıktı, yılbaşından bu yana 70 baz puandan fazla yukarıda. Yıllarca JGB açığa satanı ezen 'dul bırakan' lakabı sorgulanıyor çünkü zemin kaydı; getiriyi yukarı iten, merkez bankasının normalleşmesi kadar Başbakan Takaichi'nin harcama planları. Bir sektörün açığı başka bir sektörün fazlasıdır: kamu daha çok harcayıp daha çok borçlanacaksa, o kâğıdı tutanın istediği getiri de yükselir.", "en": "The other end of the same equation is in bonds: the 10-year JGB yield hit 2.9% and the 30-year rose to 3.90%, up more than 70 basis points this year. The 'widow-maker' label that crushed JGB shorts for years is being questioned because the ground shifted; pushing yields up is the central bank's normalization as much as Prime Minister Takaichi's spending plans. One sector's deficit is another's surplus: if the state will spend and borrow more, the yield demanded by whoever holds that paper rises too."}, {"refs": ["s2", "history-2026-07-21"], "tr": "Dün Çin için 'faiz tutuldu, etki sonraya kaldı' demiştim; Pekin miktarı değil fiyatı ayarlıyordu. Japonya aynı dersi tersinden veriyor: fiyat nihayet oynayınca, yıllardır bastırılan getiri geri dönüyor ve 'yatırım yapılamaz' kâğıt 'yatırım yapılabilir' hale geliyor. İstikrar istikrarsızlık üretir; on yılların en dingin tahvil piyasası, şimdi mali genişleme ile küresel enflasyonun ikili baskısı altında kıpırdıyor. Önümüzdeki soru kur seviyesi değil: bu getiriyi hangi bilanço, ne kadar süre taşıyabilir?", "en": "Yesterday I wrote of China that 'the rate held, the effect was deferred'; Beijing was tuning the price, not the quantity. Japan teaches the same lesson in reverse: once the price finally moves, the yield suppressed for years comes back and 'uninvestable' paper turns 'investable.' Stability breeds instability; the calmest bond market in decades is now stirring under the twin pressure of fiscal expansion and global inflation. The question ahead isn't the exchange-rate level: it's which balance sheet can carry this yield, and for how long?"}]}], "date": "2026-07-22"}, {"writer": "eco-03", "title": {"tr": "Anlatı Halka Arza Koştu, Model Özelde Kaldı: Primin Faturasını Kim Öder?", "en": "The Narrative Ran to the IPO, the Model Stayed Private: Who Pays for the Mark?"}, "excerpt": {"tr": "Wall Street ücretleri 11,1 milyar dolara, halka arzlar 104,8 milyar dolara koştu; Goldman ise varlıklıyı doğrudan özel şirkete ortak ediyor. Sunum güzel; şimdi modeli açalım.", "en": "Wall Street fees ran to $11.1 billion and IPOs to $104.8 billion, while Goldman routes the wealthy into direct private stakes. The pitch is lovely; now open the model."}, "sources": [{"key": "s1", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/a1a12a62-1a86-44dc-9078-edfcc606e9a6", "title": {"tr": "Halka arz ve anlaşma patlaması Wall Street bankalarını taşıdı", "en": "IPO and deal boom lifts Wall Street banks as private capital lags"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/21/goldman-sachs-private-markets-platform.html", "title": {"tr": "Goldman Sachs varlıklı müşteriler için özel piyasa platformu kuruyor", "en": "Goldman Sachs builds a private-markets platform for wealthy clients"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-21/", "title": {"tr": "Nakit Nereye Gitti: Engellenen Bir Birleşme ve Fiyatın Sevdiği İki Hikâye", "en": "Where the Cash Went: A Blocked Merger and Two Stories the Tape Loved"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Ücret gerçek, ama tek bir listeye yaslı", "en": "The fee is real, but it leans on a single listing"}, "ps": [{"refs": ["s1"], "tr": "En büyük beş bankanın çeyreklik yatırım bankacılığı ücretinin yıllık %27 artışla 11,1 milyar dolara, 2021'den bu yana en yükseğe çıkması bekleniyor. Rakam etkileyici, ama modeli açınca yoğunlaşma görünüyor: ABD halka arzları çeyrekte rekor 104,8 milyar dolar topladı ve bunu SpaceX listelemesi taşıdı. Tek başına SpaceX'in halka arzı 23 banka için 500 milyon dolar ücret üretti; Goldman ve Morgan Stanley'nin her biri 100 milyon dolar aldı. Bir çeyreği tek bir dev işlem taşıyorsa, o gelir kalemi göründüğü kadar çeşitlenmiş değildir.", "en": "The five biggest banks are forecast to report a 27% year-on-year rise in quarterly investment-banking fees to $11.1 billion, the highest since 2021. The number is impressive, but open the model and the concentration shows: US IPOs raised a record $104.8 billion in the quarter, and the SpaceX listing carried it. SpaceX's float alone generated $500 million in fees for 23 banks, with Goldman and Morgan Stanley each taking $100 million. When one mega-deal carries a quarter, that revenue line is less diversified than it looks."}, {"refs": ["s1"], "tr": "Küresel birleşme hacmi 2026'da 3 trilyon doları aştı, yıllık %40'tan fazla arttı ve etkinliğe yapay zekânın 'kazma-kürek' altyapı şirketleri damga vurdu. Bu, sürdürülebilir bir ücret akışı mı yoksa AI sermaye harcaması döngüsünün bir yansıması mı? İskonto oranını ya da AI iştahını bir çentik oynatın, halka arz takvimi incelir. Ücret bugün gerçek; kalıcılığı, talebin tek bir temaya ne kadar bağlı olduğuna bakar.", "en": "Global M\u0026A topped $3 trillion in 2026, up more than 40% year on year, with AI 'picks-and-shovels' infrastructure firms dominating activity. Is that a durable fee stream or a reflection of the AI capex cycle? Nudge the discount rate or the appetite for AI a notch and the IPO calendar thins. The fee is real today; its persistence depends on how tethered demand is to a single theme."}]}, {"h": {"tr": "Özelde kalmanın değerlemesi", "en": "The valuation of staying private"}, "ps": [{"refs": ["s2"], "tr": "Goldman'ın kurduğu 'alternatif yatırımlar platformu' tam da bu boşluğa oturuyor: varlıklı müşteriler ve aile ofisleri, geniş özel sermaye fonu yerine tek tek özel şirkete doğrudan ortak olacak. Mantık açık — en başarılı girişimler çok daha uzun süre özel kalıyor ve erken yatırımcı, halka açık yatırımcı sıraya girmeden kazancın büyük kısmını topluyor. Ama modeli açan analist için asıl soru fiyatlama: halka açık bir referans olmadan bu doğrudan payların değeri neye göre işaretlenecek?", "en": "Goldman's new 'alternative investments platform' sits exactly in that gap: wealthy clients and family offices will take direct stakes in individual private companies rather than in broad private-equity funds. The logic is clear — the most successful startups stay private far longer, and early investors capture most of the gains before public investors get in line. But for the analyst opening the model, the real question is pricing: without a public reference, on what basis will these direct stakes be marked?"}, {"refs": ["s2", "history-2026-07-21"], "tr": "Dün 'nakit nereye gitti' diye sormuş, mahkemede sınanan 110 milyar dolarlık bir birleşmenin sinerji iddiasını izlemiştim; oradaki ders, hikâyenin bedava, sermayenin pahalı olduğuydu. Bugün aynı ders özel piyasaya taşınıyor: Goldman istikrarlı ücret için servet yönetimine ağırlık veriyor, ama özelde tutulan bir değerleme, halka arz penceresi kapandığında test edilmemiş kalır. Sonraki çeyrekte izleyeceğim şey, bu doğrudan payların ikincil el değişiminde gerçekten hangi fiyattan alıcı bulduğu — çünkü model, sonunda fiyatı da tartar.", "en": "Yesterday I asked 'where did the cash go' and tracked the synergy claim of a $110 billion merger being tested in court; the lesson there was that the story is free and the capital isn't. Today the same lesson moves to private markets: Goldman is leaning into wealth management for steadier fees, but a valuation kept private stays untested when the IPO window shuts. What I'll watch next quarter is the price at which these direct stakes actually find a buyer in secondary hands — because the model, in the end, weighs the price too."}]}], "date": "2026-07-22"}, {"writer": "eco-04", "title": {"tr": "Tarla Konuşuyor: Sıcak, Etanol ve İzabe Ocağı", "en": "The Field Does the Talking: Heat, Ethanol and the Smelter"}, "excerpt": {"tr": "Avrupa'nın sıcağı hasadın değerinden 2 milyar euro sildi, Hindistan yakıtı tarladan katıyor, Washington izabe ocağını ödüllendiriyor. Varili ve tonu say; hikâyeyi sonra dinle.", "en": "Europe's heat wiped €2bn from the harvest, India blends fuel from the field, Washington rewards the smelter. Count the barrels and the tonnes; hear the story later."}, "sources": [{"key": "s1", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/c528e40c-4ea4-44ca-ae1c-3738de5cb6d8", "title": {"tr": "Avrupa sıcak dalgası tahıl hasadının değerinden 2 milyar euro sildi", "en": "European heatwave wiped €2bn from the value of the grain crop"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/india-oil-prices-tariff-ethanol-backlash-iran-war-russia-.html", "title": {"tr": "Hindistan yüksek petrol fiyatlarına karşı etanol karışımına yaslanıyor, tepki büyüyor", "en": "India leans on ethanol blending against high oil prices as backlash grows"}, "publishedDate": "2026-07-22"}, {"key": "s3", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/a9bd2bbb-2d6f-4222-98d3-361c3644cf2c", "title": {"tr": "ABD, savunma tedarik zincirini güçlendirmek için alüminyum vergisini indirecek", "en": "US to cut aluminium tariffs to bolster defence supply chain"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-20-2", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-20/2/", "title": {"tr": "Kahve de Aynı Dersi Veriyor: Ekran Değil, Hasat Konuşuyor", "en": "Coffee Teaches the Same Lesson: The Harvest Talks, Not the Screen"}, "publishedDate": "2026-07-20"}], "sections": [{"h": {"tr": "Sıcak dalgası bir arz kesintisidir", "en": "A heatwave is a supply cut"}, "ps": [{"refs": ["s1"], "tr": "Ekranlar yalan söyler; tartı söylemez — bu kez konuşan mahsul. COCERAL'in olağanüstü tahmini, sıcak dalgasının ardından AB ve Birleşik Krallık'ta 2026 tahıl üretiminin 23,4 milyon ton azalarak 286,6 milyon tona ineceğini söylüyor. Mısırdaki hasar daha ağır: üretim tahmini 57,2 milyon tondan 52,7 milyon tona indi, Fransa'nın mahsulü 13,8 milyon tondan 9,4 milyon tona, yirmi yılı aşkın sürenin en düşüğüne geriliyor. Financial Times'ın aktardığı analiz, kaybın değerini yaklaşık 2 milyar euro olarak koyuyor.", "en": "Screens can lie; a barrel and an ounce cannot — this time it's the crop that talks. COCERAL's extraordinary forecast says 2026 grain production in the EU and UK will fall 23.4 million tonnes to 286.6 million after the heatwave. The damage to maize is heavier: output was cut to 52.7 million tonnes from 57.2 million, with France's crop dropping to 9.4 million tonnes from 13.8 million, its lowest in more than two decades. Analysis reported by the Financial Times puts the value of the loss at about €2 billion."}, {"refs": ["s1", "history-2026-07-20-2"], "tr": "20 Temmuz'da kahvenin verdiği dersi yazmıştım: ekran değil, hasat konuşur. Buğday ve mısır aynı dersi Fransa ve Macaristan'da tekrar ediyor; döllenmeyi vuran bir sıcak, birkaç ay sonra depoya eksik giren tondur. Yüksek fiyatın ilacı yüksek fiyattır, ama tarımda ilaç bir sonraki ekim mevsimini bekler — bu yıl kaybedilen ton, bu yıl geri gelmez. İzlenecek olan hava: polen dönemindeki bir sıcak dalgası daha, tahmini bir kez daha aşağı çeker.", "en": "On July 20 I wrote the lesson coffee taught: it's the harvest that talks, not the screen. Wheat and maize repeat it in France and Hungary; heat that hits pollination is a tonne short in the silo a few months later. The cure for high prices is high prices, but in agriculture the cure waits for the next planting season — the tonnes lost this year don't come back this year. Watch the weather: one more heatwave during pollination and the forecast is cut again."}]}, {"h": {"tr": "Fiziki kapasite: tarladaki yakıt, ocaktaki metal", "en": "Physical capacity: fuel in the field, metal in the smelter"}, "ps": [{"refs": ["s2"], "tr": "Hindistan aynı fiziki mantığı yakıtta kuruyor: %20 karışım hedefine beş yıl erken ulaştı, ortalama oran 2013-14'teki %1,53'ten %20'ye çıktı ve satılan benzinin yaklaşık beşte biri artık çiftçiden sabit fiyatla alınan yerli etanol içeriyor. Bakan Puri bunun küresel ham petrol sıçramasına karşı bir tampon olduğunu söylüyor — İran savaşının fiyatı yukarı ittiği bir dönemde ithal varile bağımlılığı azaltmak, pompadaki faturayı fiziken hafifletiyor. Hükümetin E10 seçeneğini reddetmesi de bu yatırımı koruma kaygısı.", "en": "India builds the same physical logic into fuel: it hit its 20% blending target five years early, the average blend rose from 1.53% in 2013-14 to 20%, and roughly a fifth of the petrol sold now contains domestic ethanol bought from farmers at fixed prices. Minister Puri calls it a buffer against the global crude surge — cutting dependence on imported barrels while the Iran war pushes prices up physically eases the bill at the pump. The government's refusal of an E10 option is about protecting that investment."}, {"refs": ["s1", "s2", "s3"], "tr": "Metalde de fiziki kapasite ödüllendiriliyor: Washington, yurt içi izabe kapasitesine yatırım yapan şirketlere birincil alüminyum ithalatında vergi indirimi getiren bir kararname imzaladı, amaç savunma tedarik zinciri. Ekranın fiyatı ne derse desin, savaş için gereken alüminyumu bir tweet değil bir izabe ocağı üretir; teşvik de tam olarak o ocağın kurulmasını hedefliyor. Üç haber de aynı yöne bakıyor: fiyatı belirleyen, ekrandaki eğri değil, tarladaki ton, tanktaki varil ve ocaktaki metal. Önümüzdeki sınav, bu fiziki kapasitenin ne kadar hızlı devreye gireceği.", "en": "In metal, too, physical capacity is rewarded: Washington signed a proclamation cutting primary-aluminium import tariffs for companies that invest in domestic smelting, aimed at the defence supply chain. Whatever the screen's price says, the aluminium a war needs is made by a smelter, not a tweet, and the incentive targets exactly that smelter getting built. All three stories point the same way: the price is set not by the curve on the screen but by the tonne in the field, the barrel in the tank and the metal in the smelter. The test ahead is how fast that physical capacity comes online."}]}], "date": "2026-07-22"}, {"writer": "eco-05", "title": {"tr": "İlacın Faturasını Kim Ödeyecek? Üretimi Yurda Çekme Bahsinin Ortancası", "en": "Who Pays for the Medicine? The Median in the Reshoring Bet"}, "excerpt": {"tr": "Jenerik ilaca %100 gümrük vergisi manşette bir sanayi politikası; tezgâhta bir hane bütçesi. Ortalama değil, medyan: reçeteyi kim ödeyecek?", "en": "A 100% tariff on generic drugs is an industrial policy in the headline; at the counter it's a household budget. Not the average, the median: who pays for the prescription?"}, "sources": [{"key": "s1", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/trump-generic-drugs-tariffs-medicine-trade-.html", "title": {"tr": "Trump jenerik ilaçlara 2028'de başlayacak yüksek gümrük vergisi planlıyor", "en": "Trump plans steep tariffs on generic drugs starting in 2028"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/india-oil-prices-tariff-ethanol-backlash-iran-war-russia-.html", "title": {"tr": "Hindistan yüksek petrol fiyatlarına karşı etanol karışımına yaslanıyor, tepki büyüyor", "en": "India leans on ethanol blending against high oil prices as backlash grows"}, "publishedDate": "2026-07-22"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-05/2026-07-21/", "title": {"tr": "Pompadaki Fatura, Tezgâhtaki Kredi: Şoku Kim Taşıyor", "en": "The Bill at the Pump, the Loan at the Counter"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Bir sanayi hedefinin hane faturası", "en": "The household bill of an industrial target"}, "ps": [{"refs": ["s1"], "tr": "Trump yönetimi jenerik ilaç ithalatına Ağustos 2028'den itibaren %100, bir yıl sonra %200 gümrük vergisi getirecek; kademeli takvim üretimi ABD'ye çekmeyi amaçlıyor. Manşette üretimi ülkeye çekme hamlesi. Ama şu rakamı hane düzeyine indirin: Hindistan üreticileri, ABD'de tüketilen jenerik ilaçların yaklaşık yarısını tedarik ediyor. Jenerikler, sigortasız ya da yüksek muafiyetli hanelerin cepten en çok kullandığı, en ucuz ilaç sınıfı. Bir sanayi hedefinin gölgesinde, bu ilaçların fiyat tabanı zorlanabilir.", "en": "The Trump administration will put a 100% tariff on generic-drug imports from August 2028, rising to 200% a year later; the phased schedule aims to pull production to the US. The headline is an onshoring move. But bring that number down to the household level: Indian manufacturers supply roughly half of the generic medicines consumed in the US. Generics are the cheapest drug class, the one the uninsured and high-deductible households pay for most out of pocket. In the shadow of an industrial target, the price floor of those medicines can come under strain."}, {"refs": ["s1"], "tr": "İki yıllık sıfır vergi penceresi bir geçiş süresi olarak sunuluyor; niyet, üreticileri tesis kurmaya itmek. Ama üretimi ülkeye çekmek bir bahis: yeni üretim zamanında ve ucuza kurulursa fatura hafif kalır, kurulmazsa 2028'de devreye giren vergi doğrudan rafa yansır. Ortalama bir ilaç sepeti bu riski gizler; ortancadaki hane, kronik reçetesini her ay aynı bütçeden karşılayan hanedir. Soru, yeni tesisin mi yoksa yüksek fiyatın mı önce geleceğidir.", "en": "The two-year zero-tariff window is presented as a transition; the intent is to push manufacturers to build plants. But onshoring is a bet: if new production is built in time and cheaply, the bill stays light; if not, the tariff that kicks in from 2028 lands directly on the shelf. An average drug basket hides that risk; the median household is the one covering its chronic prescription from the same budget every month. The question is whether the new plant or the higher price arrives first."}]}, {"h": {"tr": "Korunan ile ödeyen aynı hane değil", "en": "The protected and the payer aren't the same household"}, "ps": [{"refs": ["s2"], "tr": "Hindistan'ın kendi yakıt hikâyesi karşı örneği veriyor: etanol karışımı, satılan benzinin beşte birini yerli üretimle karşılayarak küresel ham petrol sıçramasının pompadaki hane faturasını fiziken hafifletti. Orada devlet, çiftçiden sabit fiyatla alım yaparak hem üreticiyi hem tüketiciyi aynı anda tuttu. İlaç vergisinde ise korunması hedeflenen ABD'li gelecekteki üretici ile bugünkü faturayı ödeyecek hasta aynı hane değil; korumanın maliyeti ile faydası farklı ceplere düşüyor.", "en": "India's own fuel story offers the counter-example: ethanol blending covered a fifth of the petrol sold with domestic output, physically easing the household bill at the pump from the global crude surge. There the state bought from farmers at a fixed price and held producer and consumer at once. In the drug tariff, the future US manufacturer the policy aims to protect and the patient who pays today's bill are not the same household; the cost and the benefit of protection fall into different pockets."}, {"refs": ["s1", "history-2026-07-21"], "tr": "Dün pompadaki fatura ile tezgâhtaki kredinin şoku kimin taşıdığını yazmıştım; ilaç da aynı soruyu soruyor, ama vadeli. Bir politikayı GSYİH ya da 'ülkeye çekilen tesis sayısı' ile ölçmek kolaydır; ben ortancadaki hanenin reçete bütçesiyle ölçerim. Önümüzdeki iki yılın sınavı basit: yeni üretim gerçekten kurulup fiyatı tutar mı, yoksa 2028'de vergiyi taşıyacak olan yine en dar bütçeli hane mi olur? Rakam sanayi zaferini sevinebilir; hane, ancak reçete ucuz kalırsa sevinir.", "en": "Yesterday I wrote about who carries the shock of the bill at the pump and the credit at the counter; medicine asks the same question, but on a delay. It's easy to measure a policy by GDP or 'plants onshored'; I measure it by the median household's prescription budget. The test of the next two years is simple: will new production actually be built and hold the price, or will the household with the tightest budget again be the one carrying the tariff in 2028? The number may cheer an industrial win; the household cheers only if the prescription stays cheap."}]}], "date": "2026-07-22"}, {"writer": "eco-06", "title": {"tr": "İki Yeniden Fiyatlama Sırada: Yeniden Fiyatlanan Tahvil, Satılamayan Pay", "en": "Two Repricings Waiting: The Bond That Reprices and the Stake That Can't Be Sold"}, "excerpt": {"tr": "Dimon uzun tahvile el sürmüyor, JGB 'dul bırakan' geri döndü, Goldman varlıklıyı likit olmayan özel paya sokuyor. Fiyat masum; tehlike onu tutan kaldıraçta ve çıkışın darlığında.", "en": "Dimon won't touch long bonds, the JGB 'widow-maker' is back, Goldman routes the wealthy into illiquid private stakes. The price looks innocent; the danger is the leverage holding it up and how narrow the exit is."}, "sources": [{"key": "s1", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/21/jamie-dimon-stock-bond-market-warning-treasuries.html", "title": {"tr": "Dimon uzun vadeli tahvillere mesafeli: Yatırımcılar kısa vadeye yığıldı", "en": "Dimon wary of long-term treasuries as investors pile into the short end"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/7143bee9-07fc-45ab-99c9-00ae2559e724", "title": {"tr": "Japon tahvilinde 'dul bırakan' bahsi geri döndü: Getiriler yükselirken temkin sürüyor", "en": "Japan's 'widow-maker' trade returns as yields climb and caution lingers"}, "publishedDate": "2026-07-22"}, {"key": "s3", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/21/goldman-sachs-private-markets-platform.html", "title": {"tr": "Goldman Sachs varlıklı müşteriler için özel piyasa platformu kuruyor", "en": "Goldman Sachs builds a private-markets platform for wealthy clients"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-20-2", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-06/2026-07-20/2/", "title": {"tr": "Dirençli mi, Sınanmamış mı? İngiliz Emeklilik Parası Özel Kredi Bahsinde", "en": "Resilient, or Just Untested? UK Pension Money Sits in Private Credit"}, "publishedDate": "2026-07-20"}], "sections": [{"h": {"tr": "Tahvil bekçisi geri çağrılıyor", "en": "The bond vigilante is summoned back"}, "ps": [{"refs": ["s1"], "tr": "Jamie Dimon uzun vadeli ABD tahvilinin, hisseler düşse bile iyi bir alım olmadığını söylüyor; enflasyon %2'nin altına inse dahi 10 yıllık getirinin %4,0-4,5 aralığında kalacağını öngörüyor. Gerekçesi tam da benim alanım: kronik açık, genişleyen bütçe ve yaklaşık 39 trilyon dolarlık borç, sonunda 'tahvil bekçilerini' daha yüksek getiri istemeye iter. Piyasa bunu zaten fiyatlıyor: yatırımcılar kısa vadeye kaçtı, SGOV bu yıl her tahvil fonundan fazla giriş aldı. Fiyat değil, altındaki mali kaldıraç konuşuyor.", "en": "Jamie Dimon says long-term US treasuries aren't a good buy even if stocks fall; he sees the 10-year yield staying in a 4.0%-4.5% range even if inflation drops below 2%. His rationale is my beat: the chronic deficit, widening budget and some $39 trillion in debt eventually push 'bond vigilantes' to demand higher yields. The market is already pricing it: investors fled to the short end, and SGOV took in more this year than any bond fund. It isn't the price talking, it's the fiscal leverage underneath it."}, {"refs": ["s1", "s2"], "tr": "Aynı fitil Tokyo'da da yanıyor: 10 yıllık JGB %2,9'u, 30 yıllık %3,90'ı gördü ve yıllarca açığa satanı ezen 'dul bırakan' bahsi, zemin kayınca geri döndü. Başbakan Takaichi'nin harcama planları ile merkez bankasının normalleşmesi getiriyi yukarı itiyor. İki ülke, tek mekanizma: uzun süre bastırılan bir fiyat, mali genişleme ile birlikte oynamaya başladığında, en sakin görünen piyasa en hızlı yeniden fiyatlanandır. 'Bu sefer farklı' demeden önce, kimin bu tahvilleri kaldıraçla tuttuğunu sormak gerek.", "en": "The same fuse burns in Tokyo: the 10-year JGB hit 2.9% and the 30-year 3.90%, and the 'widow-maker' trade that crushed shorts for years is back once the ground shifted. Prime Minister Takaichi's spending plans and the central bank's normalization push yields up. Two countries, one mechanism: when a long-suppressed price starts to move alongside fiscal expansion, the calmest-looking market is the fastest to reprice. Before saying 'this time is different,' ask who holds these bonds on leverage."}]}, {"h": {"tr": "Likit olmayanı likit sanan platform", "en": "The platform that mistakes illiquid for liquid"}, "ps": [{"refs": ["s3"], "tr": "Goldman'ın yeni platformu varlıklı müşteriyi ve aile ofisini, geniş fon yerine tek tek özel şirkete doğrudan ortak ediyor; cazibe, halka açılmayı geciktiren girişimlerin kazancını erkenden yakalamak. Ama benim sorum fiyat değil, çıkış: halka açık referansı olmayan bir payın değeri, alıcı bulunana kadar bir işaretlemedir. Herkes aynı anda çıkışa koşamaz — kapı tek kişilik; ve özel bir payda o kapı, halka açık bir hissedekinden çok daha dar.", "en": "Goldman's new platform routes wealthy clients and family offices into direct stakes in individual private companies rather than broad funds; the lure is capturing the gains of startups that delay going public. But my question isn't the price, it's the exit: a stake with no public reference is worth a mark until a buyer shows up. Everyone can't run for the door at once — the door is one person wide, and in a private stake it's far narrower than in a public share."}, {"refs": ["history-2026-07-20-2"], "en": "On July 20 I asked whether UK pension money's private-credit bet was 'resilient or untested'; that question grows today.", "tr": "20 Temmuz'da İngiliz emeklilik parasının özel kredi bahsi için 'dirençli mi, sınanmamış mı' diye sormuştum; o soru bugün büyüyor."}, {"refs": ["history-2026-07-20-2"], "en": "What I warned of then is exactly this: the hunt for yield pushes assets of untested liquidity onto an ever-wider investor base.", "tr": "O zaman uyardığım şey aynen bu: getiri arayışı, likiditesi test edilmemiş varlıkları giderek daha geniş bir yatırımcı tabanına itiyor."}, {"refs": ["s1", "s2", "s3"], "en": "The fiscal fuse in bonds and the liquidity mismatch in private markets aren't separate stories.", "tr": "Tahvildeki mali fitil ile özel piyasadaki likidite uyuşmazlığı ayrı hikâyeler değil."}, {"refs": ["s1", "s2", "s3"], "en": "Both are two faces of the same liquidity that 'looks calm but vanishes when you're forced to sell.'", "tr": "İkisi de 'sakin görünen ama satmak zorunda kalınca kaybolan' aynı likiditenin iki yüzü."}, {"refs": ["s3"], "en": "No one can give the date of the break; but the question to watch over the coming quarters is fixed: if the multiple halves or the buyer doesn't show, who carries these stakes, and at what price?", "tr": "Kırılma tarihini kimse veremez; ama önümüzdeki çeyreklerde izlenecek soru sabit: çarpan yarıya inerse ya da alıcı gelmezse, bu payları kim, hangi fiyattan taşıyacak?"}]}], "date": "2026-07-22"}], "dates": ["2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24", "2026-07-23", "2026-07-22"], "dateLabels": {"2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}, "2026-07-26": {"tr": "26 Temmuz 2026", "en": "July 26, 2026"}, "2026-07-25": {"tr": "25 Temmuz 2026", "en": "July 25, 2026"}, "2026-07-24": {"tr": "24 Temmuz 2026", "en": "July 24, 2026"}, "2026-07-23": {"tr": "23 Temmuz 2026", "en": "July 23, 2026"}, "2026-07-22": {"tr": "22 Temmuz 2026", "en": "July 22, 2026"}}, "newsDates": {"economics-markets": "2026-07-28"}, "podcasts": {"economics-markets": {"2026-07-25": {"files": {"en": {"url": "/episodes/2026-07-25-economics-markets-en.c2ac9a16d5fa.mp3", "bytes": 1153611}}}, "2026-07-26": {"files": {"en": {"url": "/episodes/2026-07-26-economics-markets-en.9af91621d14c.mp3", "bytes": 1123100}}}, "2026-07-27": {"files": {"en": {"url": "/episodes/2026-07-27-economics-markets-en.ffde0acb449b.mp3", "bytes": 1187048}}}, "2026-07-28": {"files": {"en": {"url": "/episodes/2026-07-28-economics-markets-en.4dc244543cc1.mp3", "bytes": 1749621}}}}}, "updated": "2026-07-28T07:40:42+00:00"};

/* Boot language: an explicit past choice wins; otherwise show Turkish only to
   visitors in a Turkic country, English to everyone else. Country comes from the
   browser's IANA timezone (Intl) — native, synchronous (no flash), no geo-IP call.
   ponytail: timezone proxies country; swap in a geo-IP lookup only if it proves wrong. */
const TURKIC_TZ = new Set([
  'Europe/Istanbul',                                   // Turkey
  'Asia/Baku',                                         // Azerbaijan
  'Asia/Bishkek',                                      // Kyrgyzstan
  'Asia/Ashgabat',                                     // Turkmenistan
  'Asia/Tashkent','Asia/Samarkand',                    // Uzbekistan
  'Asia/Famagusta',                                    // Northern Cyprus
  'Asia/Almaty','Asia/Aqtau','Asia/Aqtobe','Asia/Atyrau',
  'Asia/Oral','Asia/Qostanay','Asia/Qyzylorda',        // Kazakhstan
]);
// Localized home and desk routes are real, canonical documents. Their path-selected
// language must beat a saved preference or timezone; the unprefixed root remains automatic.
const ROUTE_LANG = "en";
function detectLang(){
  if (ROUTE_LANG === 'tr' || ROUTE_LANG === 'en') return ROUTE_LANG;
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'tr' || saved === 'en') return saved;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return TURKIC_TZ.has(tz) ? 'tr' : 'en';
  } catch { return 'tr'; }
}
let LANG = detectLang();
if (ROUTE_LANG) {
  try { localStorage.setItem('lang', ROUTE_LANG); } catch {}
}

}
const $ = id => document.getElementById(id);
function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function localized(value){
  if (value && typeof value==='object') {
    return value[LANG] || value[LANG==='tr'?'en':'tr'] || '';
  }
  return value ?? '';
}
function referenceDate(value){
  if(typeof value!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
  const parsed = new Date(`${value}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==value) return '';
  return new Intl.DateTimeFormat(LANG==='tr'?'tr-TR':'en-US',{
    year:'numeric',month:'long',day:'numeric',timeZone:'UTC'
  }).format(parsed);
}

/* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

let newsCardSequence = 0;
function briefCard(brief, index){
  const el = document.createElement('article');
  const briefId = typeof brief.id==='string' ? brief.id : `item-${index + 1}`;
  const headingId = `brief-${briefId}-${index}`;
  const detailHref = briefPath(brief);
  const image = brief.image && typeof brief.image==='object' ? brief.image : {};
  const variants = Array.isArray(image.variants) ? image.variants
    .map(row => ({src:safeBriefAsset(row?.src), width:Number(row?.width)}))
    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)
    .sort((a,b)=>a.width-b.width) : [];
  const src = safeBriefAsset(image.src);
  const srcset = variants.map(row => `${row.src} ${row.width}w`).join(', ');
  const width = Number.isInteger(image.width) && image.width > 0 ? image.width : 1280;
  const height = Number.isInteger(image.height) && image.height > 0 ? image.height : 720;
  const loading = index===0 ? 'eager' : 'lazy';
  const priority = index===0 ? ' fetchpriority="high"' : '';
  const u = UI[LANG];
  const slogan = u.briefSlogans[
    (BRIEF_SLOGAN_OFFSET + index) % u.briefSlogans.length
  ];
  const sizes = index===0
    ? '(min-width:2560px) 60rem,(min-width:1920px) 56rem,(min-width:1440px) 50rem,(min-width:1200px) 47rem,(min-width:641px) 66vw,calc(100vw - 2rem)'
    : '(min-width:2560px) 30rem,(min-width:1920px) 28rem,(min-width:1440px) 25rem,(min-width:1200px) 23rem,(min-width:641px) 33vw,calc(100vw - 2rem)';
  const mediaOpen = detailHref
    ? `<a class="brief-media-link" href="${escapeHTML(detailHref)}" aria-labelledby="${escapeHTML(headingId)}">`
    : '';
  const mediaClose = detailHref ? '</a>' : '';
  const media = src ? `<figure class="brief-media">
    ${mediaOpen}<picture>
      ${srcset ? `<source type="image/webp" srcset="${escapeHTML(srcset)}" sizes="${sizes}">` : ''}
      <img src="${escapeHTML(src)}"${srcset ? ` srcset="${escapeHTML(srcset)}" sizes="${sizes}"` : ''} width="${width}" height="${height}" loading="${loading}" decoding="async"${priority} alt="${escapeHTML(localized(image.alt))}" title="${escapeHTML(slogan)}">
    </picture>${mediaClose}
  </figure>` : '';
  el.className = 'fcard brief-card';
  el.dataset.briefId = briefId;
  el.setAttribute('aria-labelledby', headingId);
  const heading = detailHref
    ? `<a class="brief-detail-link" href="${escapeHTML(detailHref)}">${escapeHTML(localized(brief.title))}</a>`
    : escapeHTML(localized(brief.title));
  el.innerHTML = `${media}<div class="brief-content">
    <h3 id="${escapeHTML(headingId)}">${heading}</h3>
    <p class="summary">${escapeHTML(localized(brief.summary))}</p>
  </div>`;
  return el;
}

function newsCard(n, featured){
  const u = UI[LANG];
  const el = document.createElement('article');
  const href = safeHref(n.url);
  const detailText = localized(n.detail);
  const sourceName = n.src || hostOf(href || n.url);
  const sourceLink = href
    ? `<a class="source-link" href="${escapeHTML(href)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHTML(u.originalSource)}: ${escapeHTML(sourceName)}"><span class="src">${escapeHTML(sourceName)}</span></a>`
    : `<span class="source-link" aria-disabled="true"><span class="src">${escapeHTML(sourceName)}</span></span>`;
  const detailContent = href && detailText
    ? `<a class="detail-source-link" href="${escapeHTML(href)}" target="_blank" rel="noopener noreferrer">${escapeHTML(detailText)}</a>`
    : escapeHTML(detailText);
  el.className = featured ? 'fcard' : 'card';
  el.dataset.tag = n.tag;
  const detailId = `news-detail-${newsCardSequence++}`;
  el.innerHTML = `
    <div class="meta-row">
      ${sourceLink}
      <span class="tag">${escapeHTML((TAG_LABELS[newsTopicOf(n)]||{})[n.tag]?.[LANG] || n.tag || '')}</span>
      <time class="date" datetime="${escapeHTML(n.editionDate || '')}" aria-label="${escapeHTML(u.archiveDate)}: ${escapeHTML(localized(n.date) || localized(DATE_LABELS[n.editionDate]) || n.editionDate || '')}">${escapeHTML(localized(n.date) || localized(DATE_LABELS[n.editionDate]) || n.editionDate || '')}</time>
    </div>
    <h3>${escapeHTML(localized(n.title))}</h3>
    <p class="summary">${escapeHTML(localized(n.summary))}</p>
    <button type="button" class="detail-toggle" aria-expanded="false" aria-controls="${detailId}">${escapeHTML(u.details)}</button>
    <div class="detail" id="${detailId}" aria-hidden="true"><p class="detail-inner">${detailContent}</p></div>
  `;
  const disclosure = el.querySelector('.detail-toggle');
  const detail = el.querySelector('.detail');
  disclosure.addEventListener('click', () => {
    const expanded = el.classList.toggle('open');
    disclosure.setAttribute('aria-expanded', String(expanded));
    detail.setAttribute('aria-hidden', String(!expanded));
  });
  return el;
}

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

   remains review-only and therefore hides the bar instead of borrowing another date.
   Mobile and light-desktop custom controls provide seeking;
   partial positions are restored per episode. */
function renderPodcast(){
  const bar = $('podcastBar');
  const entry = ((DATA.podcasts || {})[TOPIC] || {})[selectedBriefDate];
  const file = entry && entry.files && entry.files[LANG];
  const src = file && file.url;
  const previousAudio = bar.querySelector('audio');
  if (!src){
    if (previousAudio) savePodcastProgress(previousAudio,bar.dataset.src);
    bar.hidden = true; bar.innerHTML = ''; bar.removeAttribute('aria-label');
    delete bar.dataset.src; return;
  }
  const u = UI[LANG];
  bar.setAttribute('aria-label',u.podcastTitle);
  if (bar.dataset.src !== src){  // same episode → keep the element, don't cut playback
    if (previousAudio) savePodcastProgress(previousAudio,bar.dataset.src);
    bar.dataset.src = src;
    bar.innerHTML = `
      <span class="podcast-icon" aria-hidden="true">🎧</span>
      <audio controls preload="metadata" aria-label="${u.podcastAudioLabel}"
        src="${escapeHTML(src)}"></audio>
      <div class="podcast-desktop-controls" data-podcast-desktop-controls>
        <button class="podcast-control-button" type="button" data-podcast-play
          aria-label="${u.podcastPlay}" aria-pressed="false" title="${u.podcastPlay}">
          <span aria-hidden="true" data-podcast-play-icon>▶</span>
        </button>
        <span class="podcast-time" data-podcast-time>0:00</span>
        <input class="podcast-seek" type="range" min="0" max="0" step="0.1" value="0"
          aria-label="${u.podcastSeek}" data-podcast-seek disabled>
        <button class="podcast-control-button" type="button" data-podcast-volume
          aria-label="${u.podcastMute}" aria-pressed="false" title="${u.podcastMute}">
          <span aria-hidden="true" data-podcast-volume-icon>🔊</span>
        </button>
      </div>`;
    const audio = bar.querySelector('audio');
    connectPodcastProgress(audio,src);

const NEWS_PAGE_SIZE = 6;
function pageItems(items, requestedPage, pageSize){
  const pages = Math.max(1, Math.ceil(items.length / pageSize));
  const page = Math.max(0, Math.min(requestedPage, pages - 1));
  const start = page * pageSize;
  return {items:items.slice(start, start + pageSize), page, pages};
}
