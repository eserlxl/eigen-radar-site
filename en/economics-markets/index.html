urdu; bunun 36.725 milyon dolar tutarındaki bölümü FCNR(B) mevduatlarından geldi.", "en": "The Reserve Bank of India reported $40,816 million mobilised through 31 July under the concessional swap facility it opened on 8 June, of which $36,725 million came through FCNR(B) deposits."}, "detail": {"tr": "Yurt dışı döviz borçlanmaları 2.575 milyon dolar, dış ticari borçlanmalar 1.516 milyon dolar olarak bildirildi. İmkân 5 Haziran'da duyurulmuş, üç gün sonra işleme açılmıştı. FCNR(B) mevduatları için 30 Eylül'e, yurt dışı ve dış ticari borçlanmalar için 31 Aralık'a kadar açık kalıyor. Kaynağı yetkili satıcı bankalar topluyor ve merkez bankasıyla takas ediyor.", "en": "Overseas foreign currency borrowings accounted for $2,575 million and external commercial borrowings for $1,516 million. The facility was announced on 5 June and became operational three days later. It stays open until 30 September for FCNR(B) deposits and until 31 December for overseas and external commercial borrowings. Authorised dealer banks raise the funds and swap them with the central bank."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "93.3 The Drive", "url": "https://www.933thedrive.com/2026/07/31/treasury-selloff-signals-need-to-bolster-feds-inflation-credibility-musalem-tells-ft/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Musalem, tahvil satışının Fed'in enflasyon inandırıcılığına dair bir uyarı olduğunu söyledi", "en": "Musalem says the bond selloff is a warning about the Fed's inflation credibility"}, "summary": {"tr": "St. Louis Fed Başkanı Alberto Musalem, Financial Times'a verdiği söyleşide bu haftaki toplantıda çeyrek puanlık faiz artışını tercih ettiğini belirtti; Reuters söyleşiyi aktardı.", "en": "St. Louis Fed President Alberto Musalem told the Financial Times he had preferred a quarter-percentage-point rate increase at this week's meeting; Reuters carried the interview."}, "detail": {"tr": "Musalem, \"Bu noktada daha erken, kademeli ve küçük adımlarla faiz hamlesi; sonradan gelebilecek daha büyük ve ani hamlelerden daha az maliyetli ve daha az sarsıcıdır\" dedi. Söyleşinin aktarıldığı haberde, 30 yıllık ABD tahvil getirisinin yüzde 5,2'nin üzerine çıkarak 19 yılın en yükseğine ulaştığı ve Fed Başkanı Kevin Warsh'ın enflasyon hedefine ilişkin sözlerinin bu harekete katkıda bulunduğu belirtildi.", "en": "Musalem said that \"at this juncture, earlier, incremental, gradual interest-rate action is preferable, less costly and less disruptive than potentially later, larger and abrupt actions.\" The report on the interview noted that the 30-year US Treasury yield had risen above 5.2 percent, a 19-year high, and that remarks by Fed Chair Kevin Warsh about the inflation target had contributed to the move."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Gestión", "url": "https://gestion.pe/economia/inei-precios-siguen-al-alza-inflacion-anual-aumento-407-en-julio-el-detalle-noticia/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Peru'da yıllık enflasyon temmuzda yüzde 4,07'ye yükseldi", "en": "Peru's annual inflation rose to 4.07 percent in July"}, "summary": {"tr": "İstatistik kurumu INEI'ye göre Lima Metropolitana'da tüketici fiyatları temmuzda aylık yüzde 0,29 arttı; on iki aylık artış yüzde 4,07, yılbaşından bu yana birikimli artış yüzde 4,09 oldu.", "en": "Consumer prices in Lima Metropolitana rose 0.29 percent in July, taking the twelve-month increase to 4.07 percent and the year-to-date accumulation to 4.09 percent, according to the statistics agency INEI."}, "detail": {"tr": "Gıda ve enerji dışı çekirdek ölçüt aylık yüzde 0,28 arttı. Ulusal düzeyde aylık artış yüzde 0,30, yıllık artış yüzde 3,70 olarak açıklandı. Fiyat artışını taşıyan başlıklar arasında kümes hayvanları — bütün tavukta yüzde 13,3, kanatta yüzde 8,5, göğüste yüzde 7,9 — ile ulaştırma yer aldı; şehirlerarası otobüs biletleri yüzde 18,7, iç hat uçak biletleri yüzde 15,5 pahalandı. Balık ve deniz ürünleri yüzde 2,6, meyve yüzde 2,1 ucuzladı.", "en": "The core measure excluding food and energy rose 0.28 percent on the month. Nationally, prices rose 0.30 percent on the month and 3.70 percent on the year. Poultry led the increases — whole chicken up 13.3 percent, wings 8.5 percent and breasts 7.9 percent — alongside transport, with intercity bus fares up 18.7 percent and domestic airfares up 15.5 percent. Fish and seafood fell 2.6 percent and fruit 2.1 percent."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Independent Balkan News Agency", "url": "https://www.ibnaeu.com/en/2026/08/01/fitch-romania-bbb-political-stability-credit-rating/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Fitch, Romanya'nın notunu yatırım yapılabilir seviyenin son basamağında tuttu", "en": "Fitch kept Romania on the lowest rung of investment grade"}, "summary": {"tr": "Derecelendirme kuruluşu Romanya'nın BBB- notunu teyit etti ve görünümü negatif bıraktı; kararda hükümet koalisyonunun dağılmasının mali programın uygulanmasını zorlaştırdığına yer verildi.", "en": "The rating agency affirmed Romania's BBB- rating and left the outlook negative, linking the collapse of the governing coalition to the growing difficulty of implementing the country's fiscal strategy."}, "detail": {"tr": "Fitch'in projeksiyonlarında genel devlet açığı 2026 için gayrisafi yurt içi hasılanın yüzde 5,9'u, kamu borcu ise 2028'e kadar yüzde 64,5 düzeyinde görünüyor. Kuruluşun değerlendirmesinde siyasi istikrar, kredi değerliliği açısından mali disiplin kadar belirleyici bir unsur olarak ele alındı.", "en": "Fitch's projections put the general government deficit at 5.9 percent of gross domestic product for 2026 and public debt at 64.5 percent of GDP by 2028. The assessment treats political stability as a factor weighing on creditworthiness as heavily as fiscal discipline."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/01/iraq-to-sign-extension-of-pipeline-deal-with-turkey/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Irak, Türkiye ile boru hattı anlaşmasını bir yıl uzatmak için imzaya gidiyor", "en": "Iraq is signing a one-year extension of its pipeline deal with Turkey"}, "summary": {"tr": "Petrol Bakanı Bessem Hudayr'ın cumartesi günü Türkiye'ye giderek imzalayacağı anlaşma, günde 750.000 varil kapasiteli Kerkük-Ceyhan hattını bir yıl daha işler tutacak. Önceki anlaşma pazartesi günü sona ermişti.", "en": "Oil Minister Bassem Khudair travels to Turkey on Saturday to sign an agreement that keeps the 750,000 barrel-a-day Kirkuk-Ceyhan line running for another year. The previous deal expired on Monday."}, "detail": {"tr": "Bakanlık sözcüsü Salim el-Rikabi anlaşmanın üç taraflı olduğunu, Irak tarafında devlet petrol pazarlama şirketi SOMO ile Kuzey Petrol Şirketi'nin, Türkiye tarafında ise BOTAŞ'ın yer aldığını söyledi. Rikabi'ye göre bir yıllık metin, Basra-Haditha-Kerkük-Ceyhan hattı tamamlandıktan sonra ihracat kapasitesini günlük 1 milyon varilin üzerine çıkarmayı amaçlayan kapsamlı bir anlaşmanın hazırlığı niteliğinde. Hat, Hürmüz Boğazı'nı devre dışı bırakan bir ihracat güzergâhı sunuyor.", "en": "Ministry spokesman Salim Al Rikabi said the agreement is tripartite, with the state marketing company SOMO and the North Oil Company on the Iraqi side and BOTAS on the Turkish side. Al Rikabi described the one-year text as a prelude to a comprehensive agreement intended to lift export capacity above 1 million barrels a day once the Basra-Haditha-Kirkuk-Ceyhan pipeline is finished. The route gives Iraqi crude an export path that bypasses the Strait of Hormuz."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "interest.co.nz", "url": "https://www.interest.co.nz/property/139613/house-buyers-hold-balance-power-when-it-comes-pricing-cotality-says", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Yeni Zelanda'da konut değerleri temmuzda yüzde 0,3 geriledi", "en": "New Zealand house values fell 0.3 percent in July"}, "summary": {"tr": "Cotality'nin konut değer endeksine göre ülke genelinde medyan değer 804.303 Yeni Zelanda dolarına indi; üç aylık düşüş yüzde 1,0, yıllık düşüş yüzde 0,7 oldu.", "en": "Cotality's home value index put the national median at 804,303 New Zealand dollars, with values down 1.0 percent over three months and 0.7 percent lower than a year earlier."}, "detail": {"tr": "Kuruluşun iktisatçısı Kelvin Davidson, satış hacimlerinin yıl boyunca hafifçe gerilediğini ancak hâlâ görece normal düzeyde olduğunu, buna karşılık satılık konut stokunun yüksek kalmasının fiyat pazarlığında dengeyi alıcı tarafına geçirdiğini söyledi. Davidson değerlerin genel olarak durgun seyrettiğini, 2022-2023 düşüşünden bu yana tabloda belirgin bir toparlanma işareti bulunmadığını belirtti ve kısa vadede konut kredisi faizlerinde artış beklediğini ekledi.", "en": "Kelvin Davidson, an economist at the firm, said sales volumes have edged lower through the year but remain at a relatively normal level, while an elevated stock of listings has handed buyers the balance of power on pricing. Davidson described values as generally sluggish, with little sign of a meaningful upturn since the 2022-2023 downturn, and said he expects mortgage rate increases in the short term."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "KFGO", "url": "https://kfgo.com/2026/07/31/situational-awareness-portfolio-sinks-67-in-july-on-ai-stock-rout-letter-shows/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Situational Awareness'ın portföyü temmuzda yüzde 67 eridi", "en": "Situational Awareness' portfolio sank 67 percent in July"}, "summary": {"tr": "Leopold Aschenbrenner'in yapay zekâ odaklı serbest yatırım fonu, yatırımcılarına gönderdiği mektupta temmuz kaybını açıkladı; fon hisse portföyünün büyük bölümünü bu hafta Citadel'e sattı ve kaldıracı tamamen kaldırdı.", "en": "Leopold Aschenbrenner's AI-focused hedge fund disclosed the July loss in a letter to investors; it sold the bulk of its stock portfolio to Citadel this week and removed leverage entirely."}, "detail": {"tr": "Reuters'ın aktardığı mektupta fonun 2026 başından bu yana hâlâ yüzde 80 kazançta olduğu belirtildi. Aschenbrenner mektupta \"Bu ay sizi hayal kırıklığına uğrattık\" ifadesini kullandı ve fonun sermayesinin zarar görmesine tehlikeli ölçüde yaklaştığını yazdı. Eski bir OpenAI araştırmacısı olan Aschenbrenner fonu 2024'te kurmuştu; kayıplar, yapay zekâ hisselerindeki sert düşüş ile piyasa likiditesinin kuruması sırasında kaldıraçlı pozisyonların hızla aleyhe dönmesinden kaynaklandı.", "en": "The letter, reported by Reuters, said the fund is still up 80 percent since the start of 2026. Aschenbrenner wrote that \"we let you down this month\" and that the fund came dangerously close to impairing its capital. A former OpenAI researcher, Aschenbrenner founded the fund in 2024; the losses came as a steep decline in AI stocks and drying market liquidity turned leveraged positions against it quickly."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Fortune", "url": "https://fortune.com/2026/07/31/kevin-warsh-reducing-fed-meetings-fomc-inflation-rates/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Warsh, Fed'in yılda sekiz olan toplantı sayısını azaltmayı gündeme getirdi", "en": "Warsh has raised cutting the Fed's eight-meeting-a-year calendar"}, "summary": {"tr": "New York Times'ın haberine göre Fed Başkanı Kevin Warsh, para politikası toplantılarının sıklığını azaltma önerisini 29 Temmuz'daki Federal Açık Piyasa Komitesi toplantısında dile getirdi.", "en": "Fed Chair Kevin Warsh raised a proposal to reduce the frequency of monetary policy meetings at the Federal Open Market Committee's 29 July gathering, the New York Times reported."}, "detail": {"tr": "Komite hâlen yılda sekiz kez iki günlük toplantılar yapıyor ve her toplantının ardından kararını açıklıyor. Yasa asgari dört toplantı öngörüyor; Warsh nisandaki Senato onay oturumunda \"dört yeterli değil\" demişti. Öneri, komitenin faizi sabit tutma yönündeki 9'a 3'lük kararının ardından Warsh'ın kararı gerekçelendirmekten ve enflasyon sürerse faiz artıracağına dair taahhüt vermekten kaçınmasının yatırımcı eleştirisi çektiği bir dönemde geldi. Fed sözcüsü öneri hakkında yorum yapmadı.", "en": "The committee currently holds eight two-day meetings a year and announces its decision after each one. Statute requires a minimum of four; at his Senate confirmation hearing in April, Warsh said \"four is not enough.\" The proposal comes after the committee voted 9-3 to hold rates steady and Warsh declined to explain the decision or commit to raising rates if inflation persists, drawing investor criticism. A Fed spokesperson declined to comment on the proposal."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "AOL", "url": "https://www.aol.com/articles/kkr-nearing-deal-acquire-integer-192029000.html", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "KKR'nin Integer Holdings için hisse başına 127 dolar tutarında teklife yaklaştığı bildirildi", "en": "KKR is reported to be nearing a $127-a-share offer for Integer Holdings"}, "summary": {"tr": "Wall Street Journal'ın konuya vâkıf kaynaklara dayandırdığı habere göre teklif tıbbi cihaz üreticisine yaklaşık 4,3 milyar dolar değer biçiyor ve önümüzdeki hafta gelebilir. Integer hissesi cuma günü yüzde 20'nin üzerinde primle kapandı.", "en": "The offer would value the medical device maker at about $4.3 billion and could come next week, according to a Wall Street Journal report citing people familiar with the matter. Integer shares closed more than 20 percent higher on Friday."}, "detail": {"tr": "Teksas'ın Plano kentinde bulunan Integer Holdings, tıbbi teknoloji şirketleri için sözleşmeli cihaz ve bileşen geliştirip üretiyor. Şirket, alıcı ilgisi gelmesinin ardından nisan ayında stratejik bir inceleme başlatmıştı. Reuters'ın aktardığı haberde sağlık sektöründeki benzer işlemler arasında American Industrial Partners'ın Avanos Medical için 1,27 milyar dolar ödediği alım ile Blackstone ve TPG'nin Hologic için 18 milyar dolar seviyesini aşan anlaşması sayıldı.", "en": "Integer Holdings, based in Plano, Texas, is a contract developer and manufacturer of medical devices and components for medical technology companies. It launched a strategic review in April after receiving buyer interest. The Reuters report on the story listed comparable healthcare transactions including American Industrial Partners' $1.27 billion purchase of Avanos Medical and the agreement by Blackstone and TPG to acquire Hologic for more than $18 billion."}, "radarPublishedAt": "2026-08-01T15:19:31+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "The Korea Herald", "url": "https://www.koreaherald.com/article/10827325", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Kospi tek seansta yüzde 17,91 yükselerek endeks tarihinin rekorunu kırdı", "en": "The Kospi rose 17.91 percent in a single session, the largest gain in its history"}, "summary": {"tr": "Seul borsasının ana endeksi 31 Temmuz'da 1.001,89 puan artışla 6.595,45'e çıkarak 6.500 puan seviyesini geri aldı. Yüzde 17,91'lik günlük kazanç hem oran hem puan olarak endeksin en büyüğü oldu; önceki oran rekoru 30 Ekim 2008'de görülen yüzde 11,95'ti. Endeks önceki üç seansta yüzde 17'den fazla gerilemişti.", "en": "South Korea's benchmark index closed at 6,595.45 on July 31, a gain of 1,001.89 points that took it back above the 6,500 level. The 17.91 percent advance was the largest in the index's history in both percentage and point terms; the previous percentage record was 11.95 percent, set on Oct. 30, 2008. The index had shed more than 17 percent over the preceding three sessions."}, "detail": {"tr": "Samsung Electronics yüzde 26,81 artışla 262.500 wona, SK Hynix günlük tavan olan yüzde 29,95 ile 1,72 milyon wona çıktı; Hanmi Semiconductor yüzde 27,98 kazandı. İşlem hacmi 430,2 milyon pay ve 48,9 trilyon won oldu. Yabancı yatırımcılar net 7,22 trilyon won, kurumlar 1,15 trilyon won alırken bireysel yatırımcılar 8,26 trilyon won sattı. Won dolar karşısında 13,4 won değer kazanarak 1.424 seviyesine geldi. Korea Herald'ın aktardığına göre analistler yükselişi, Microsoft'un beklentinin üzerinde gelen ikinci çeyrek sonuçlarının yapay zekâ harcamasına ilişkin kaygıyı hafifletmesine bağladı.", "en": "Samsung Electronics rose 26.81 percent to 262,500 won and SK Hynix gained the daily limit of 29.95 percent to 1.72 million won; Hanmi Semiconductor added 27.98 percent. Volume reached 430.2 million shares worth 48.9 trillion won. Foreign investors bought a net 7.22 trillion won and institutions 1.15 trillion won, while retail investors sold 8.26 trillion won. The won firmed 13.4 won to 1,424 against the dollar. Analysts quoted by The Korea Herald attributed the rally to Microsoft's better-than-expected second-quarter results easing concern about artificial-intelligence spending."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Taipei Times", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861730", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Japonya Merkez Bankası politika faizini yüzde 1'de tuttu, bir üye karşı oy kullandı", "en": "The Bank of Japan held its policy rate at 1 percent, with one dissent"}, "summary": {"tr": "31 Temmuz'da sona eren iki günlük toplantıda kısa vadeli politika faizi yüzde 1'de bırakıldı. Kurul üyesi Hajime Takata, dış talep kaynaklı enflasyon riskine karşı faizin yüzde 1,25'e çıkarılmasını önererek karara tek başına karşı çıktı.", "en": "The two-day meeting that ended on July 31 left the short-term policy rate at 1 percent. Board member Hajime Takata was the sole dissenter, proposing a rise to 1.25 percent to answer inflation risks arising from external demand."}, "detail": {"tr": "Başkan Kazuo Ueda, ücret ve fiyatlama davranışı sertleştikçe temel enflasyonun yüzde 2 hedefinin üzerine sapma riski taşıdığını söyledi ve kurulun bir sonraki toplantıdan itibaren politikayı tartışacağını belirtti. Karar metninin şahin tonu iki yıllık Japon devlet tahvili getirisini yükseltti; yen ise hükümetin son müdahalesine karşın dolar başına 160,760 dolayında seyretmeyi sürdürdü.", "en": "Governor Kazuo Ueda said underlying inflation risked deviating above the 2 percent target as wage and price-setting behaviour turned more assertive, and said the board would debate policy from its next meeting onward. The hawkish tone of the statement lifted the two-year Japanese government bond yield, while the yen stayed around 160.760 to the dollar despite the government's recent intervention."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Eurostat", "url": "https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-31072026-ap", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Euro Bölgesi'nde yıllık enflasyon temmuzda yüzde 2,9'a çıktı", "en": "Euro area annual inflation rose to 2.9 percent in July"}, "summary": {"tr": "Eurostat'ın hızlı tahminine göre Euro Bölgesi'nde yıllık enflasyon temmuzda yüzde 2,9 oldu; haziranda yüzde 2,8 ölçülmüştü. Temmuz ayının tam verisi 19 Ağustos'ta açıklanacak.", "en": "Euro area annual inflation was 2.9 percent in July according to Eurostat's flash estimate, up from 2.8 percent in June. The full July data are due on Aug. 19."}, "detail": {"tr": "Ana bileşenler içinde en yüksek yıllık oran enerjide görüldü: haziranda yüzde 8,5 olan oran temmuzda yüzde 10,0'a çıktı. Hizmetler yüzde 3,2'den yüzde 3,3'e, enerji dışı sanayi malları yüzde 0,7'den yüzde 0,9'a yükselirken gıda, alkol ve tütün yüzde 1,5'ten yüzde 1,2'ye indi. Ülke bazında en yüksek oranlar Litvanya'da yüzde 5,6, Kıbrıs'ta yüzde 4,0, Hırvatistan'da yüzde 3,6 ve Belçika'da yüzde 3,5 olarak ölçüldü; Almanya yüzde 2,8, Finlandiya yüzde 2,6, Fransa yüzde 2,4 ve Estonya yüzde 2,0 ile daha düşük kaldı.", "en": "Energy carried the highest annual rate among the main components, rising to 10.0 percent in July from 8.5 percent in June. Services moved from 3.2 percent to 3.3 percent and non-energy industrial goods from 0.7 percent to 0.9 percent, while food, alcohol and tobacco fell from 1.5 percent to 1.2 percent. By country, the highest rates were 5.6 percent in Lithuania, 4.0 percent in Cyprus, 3.6 percent in Croatia and 3.5 percent in Belgium, while Germany recorded 2.8 percent, Finland 2.6 percent, France 2.4 percent and Estonia 2.0 percent."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "ExxonMobil", "url": "https://investor.exxonmobil.com/company-information/press-releases/detail/1208/exxonmobil-announces-second-quarter-2026-results", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "ExxonMobil ikinci çeyrekte 14,5 milyar dolar net kâr açıkladı", "en": "ExxonMobil reported second-quarter earnings of $14.5 billion"}, "summary": {"tr": "Şirket ikinci çeyrekte 14,5 milyar dolar, hisse başına 3,48 dolar kâr bildirdi; düzeltilmiş kâr 14,7 milyar dolar ve hisse başına 3,52 dolar oldu. Faaliyetlerden nakit akışı 23,6 milyar dolar, serbest nakit akışı 17,2 milyar dolar olarak açıklandı.", "en": "The company reported second-quarter earnings of $14.5 billion, or $3.48 a share, with adjusted earnings of $14.7 billion, or $3.52 a share. Cash flow from operating activities was $23.6 billion and free cash flow $17.2 billion."}, "detail": {"tr": "Hissedarlara yapılan dağıtım 9,4 milyar dolara ulaştı; bunun 4,3 milyar doları temettü, 5,1 milyar doları pay geri alımıydı. Üçüncü çeyrek için hisse başına 1,03 dolar temettü ilan edildi. ExxonMobil, üretimin yirmi yılı aşkın süredir en yüksek düzeye çıktığını, Permiyen havzasında günlük 1,8 milyon varil eşdeğeriyle rekor kırdığını ve Guyana'daki beşinci yüzer üretim biriminin dördüncü çeyrekte günde 250 bin varillik kapasiteyle devreye girmesinin beklendiğini bildirdi. Yapısal gider tasarrufunun birikimli tutarı 16,3 milyar dolara ulaştı. Yönetim kurulu başkanı Darren Woods, piyasa koşullarının destekleyici olduğunu, ancak sonucun uzun yıllarda kurulan portföyü ve işletme modelini yansıttığını söyledi.", "en": "Shareholder distributions reached $9.4 billion, of which $4.3 billion was dividends and $5.1 billion share repurchases. A third-quarter dividend of $1.03 a share was declared. ExxonMobil said production reached its highest level in more than two decades, with a record 1.8 million barrels of oil equivalent a day in the Permian, and that a fifth floating production unit in Guyana is expected to start up in the fourth quarter with capacity of 250 thousand barrels a day. Cumulative structural cost savings reached $16.3 billion. Chairman Darren Woods said markets were supportive but the result reflected the portfolio and operating model built over many years."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Chevron", "url": "https://chevroncorp.gcs-web.com/news-releases/news-release-details/chevron-reports-second-quarter-2026-results", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Chevron 12,1 milyar dolar kâr ve 8,4 milyar dolar borç kapatması bildirdi", "en": "Chevron reported $12.1 billion of earnings and an $8.4 billion debt paydown"}, "summary": {"tr": "Chevron ikinci çeyrekte 12,1 milyar dolar, seyreltilmiş hisse başına 6,11 dolar kâr açıkladı; düzeltilmiş kâr 12,0 milyar dolar ve hisse başına 6,06 dolar oldu. Gelir 70,1 milyar dolar, kullanılan sermayenin getirisi yüzde 21 olarak bildirildi.", "en": "Chevron reported second-quarter earnings of $12.1 billion, or $6.11 a diluted share, with adjusted earnings of $12.0 billion, or $6.06 a share. Revenue was $70.1 billion and return on capital employed 21 percent."}, "detail": {"tr": "Dünya genelinde üretim yıllık yüzde 20 artışla günde 4.070 bin varil eşdeğerine çıktı; ABD rafinerilerinde ham petrol işleme günde 1,07 milyon varille rekor kırdı ve kapasite kullanımı yüzde 97 oldu. Faaliyetlerden nakit akışı 22,6 milyar dolar, serbest nakit akışı 18,1 milyar dolar, sermaye harcaması 4,5 milyar dolardı. Şirket çeyrek boyunca rekor düzeyde 8,4 milyar dolar borç kapattı, 3,1 milyar dolar tutarında pay geri alımı yaptı ve hisse başına 1,78 dolar temettü ödedi. Chevron ayrıca Batı Teksas'taki bir veri merkezi için Microsoft ile 20 yıllık ve 2,67 gigavatlık elektrik anlaşması imzaladığını, Hess satın alımından bir yıl içinde 1,5 milyar dolar sinerji ve 3 milyar dolar yapısal gider azalması sağladığını bildirdi.", "en": "Worldwide production rose 20 percent from a year earlier to 4,070 thousand barrels of oil equivalent a day, and U.S. refineries set a crude throughput record of 1.07 million barrels a day at 97 percent utilisation. Cash flow from operations was $22.6 billion, free cash flow $18.1 billion and capital spending $4.5 billion. The company paid down a record $8.4 billion of debt during the quarter, repurchased $3.1 billion of shares and paid a dividend of $1.78 a share. Chevron also said it had signed a 20-year, 2.67-gigawatt power agreement with Microsoft for a West Texas data centre, and had achieved $1.5 billion of Hess acquisition synergies within a year alongside $3 billion of structural cost reductions."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "ADNOC", "url": "https://www.adnoc.ae/en/news-and-media/press-releases/2026/adnoc-announces-update-to-its-crude-pricing-methodology", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "ADNOC ham petrol fiyatlamasını 1 Kasım'dan itibaren Platts Dubai'ye bağlıyor", "en": "ADNOC will price its crude off Platts Dubai from Nov. 1"}, "summary": {"tr": "ADNOC, Abu Dabi ham petrol türlerinin resmi satış fiyatı yöntemini değiştirdiğini duyurdu. Yükleme tarihinden iki ay önce ICE Futures Abu Dhabi üzerinden belirlenen fiyat yerine, yükleme ayına yakın bir dönemde Platts Dubai göstergesine dayanan bir yöntem kullanılacak. Değişiklik 1 Kasım 2026'da yürürlüğe girecek.", "en": "ADNOC announced a change to the official selling price methodology for its Abu Dhabi crude grades. In place of pricing set two months ahead of loading off ICE Futures Abu Dhabi, the company will use a prompt-month method based on the Platts Dubai benchmark. The change takes effect on Nov. 1, 2026."}, "detail": {"tr": "Yeni yöntem Murban, Das, Umm Lulu ve Upper Zakum türlerini kapsıyor. Fiyat, Platts Dubai değerlemesi (PCAAT00) ile ADNOC'un ilan edeceği bir farktan oluşacak; bu fark, hedef teslim ayından bir önceki ay açıklanacak. Şirket adımın rutin bir ticari gözden geçirmenin sonucu olduğunu, müşteri ve yatırımcı tabanına yönelik fiyat şeffaflığını güçlendirdiğini belirtti. ADNOC ayrıca değişikliğin, ADNOC Murban'ın küresel orta vadeli tahvil ve sukuk programları da dâhil olmak üzere borsada işlem gören araçları üzerinde önemli bir etki yaratmasının beklenmediğini açıkladı.", "en": "The new method covers the Murban, Das, Umm Lulu and Upper Zakum grades. The price will be the Platts Dubai assessment (PCAAT00) plus a differential announced by ADNOC in the month preceding the target delivery month. The company said the step followed a routine commercial review and reinforced price transparency for its customer and investor base. ADNOC also said the change was not expected to have a material impact on its listed instruments, including issuances under ADNOC Murban's global medium-term note and sukuk programmes."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "RTÉ", "url": "https://www.rte.ie/news/business/2026/0731/1585940-bp-puts-uk-north-sea-assets-up-for-sale/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "BP altmış yılın ardından Kuzey Denizi işini satışa çıkardı", "en": "BP put its North Sea business up for sale after sixty years"}, "summary": {"tr": "BP, Birleşik Krallık tarafındaki Kuzey Denizi petrol ve gaz işini satmak için süreç başlattığını duyurdu. Beş büyük üretim merkezini kapsayan iş, 2025'te günde yaklaşık 117 bin varil eşdeğeri üretti ve bu, şirketin toplam üretiminin yaklaşık yüzde 5'ine karşılık geliyor.", "en": "BP said it had begun a process to sell its oil and gas business on the UK side of the North Sea. The business, which spans five major production hubs, produced about 117 thousand barrels of oil equivalent a day in 2025, roughly 5 percent of the company's total output."}, "detail": {"tr": "Satışa çıkarılan işte yaklaşık 1.100 kişi çalışıyor ve Birleşik Krallık kıta sahanlığının en büyük sahası olan Clair da kapsam içinde. BP daha önce Culzean sahasındaki payını satmayı kabul etmişti; bu işlem ülkedeki üretimi günde yaklaşık 25 bin varil eşdeğeri azaltacak. Şirket havacılık yakıtı dağıtımını, akaryakıt istasyonlarını, ticaret masasını ve Londra merkezini elinde tutacak. Genel müdür Meg O'Neill, Kuzey Denizi'nin Birleşik Krallık enerji sistemi için önemini koruduğunu, ancak portföyün odaklanması ve sermayenin en yüksek değerli fırsatlara yönlendirilmesi sürecinde işin başka bir şirketin bünyesinde daha iyi konumlanacağını söyledi.", "en": "The business being marketed employs about 1,100 people and includes Clair, the largest field on the UK continental shelf. BP had already agreed to sell its stake in the Culzean field, a transaction that will cut UK output by roughly 25,000 barrels of oil equivalent a day. The company will keep its aviation fuel distribution business, its retail sites, its trading desk and its London headquarters. Chief executive Meg O'Neill said the North Sea remained integral to the UK's energy system, but that as the company focused its portfolio and directed capital to its highest-value opportunities it believed the business would be better positioned as part of another company."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "Financial Conduct Authority", "url": "https://www.fca.org.uk/news/press-releases/fca-advances-package-equity-market-transparency-reforms", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "FCA hisse senedi piyasasında birleşik veri akışı için takvim açıkladı", "en": "The FCA set out a timetable for a consolidated equity tape"}, "summary": {"tr": "Birleşik Krallık düzenleyicisi, hisse senedi piyasasının şeffaflığına ilişkin bir paket duyurdu. Paket, gelecekteki birleşik veri akışının tasarım sorularını çözen bir çerçeveyi, piyasa yapısına dair hedefli reform istişaresini ve günlük işlem hacimlerini gösteren geçici bir raporlama aracını kapsıyor.", "en": "The UK regulator announced a package on equity market transparency. It covers a framework settling the design questions for a future consolidated tape, a consultation on targeted market structure reforms, and an interim reporting tool showing daily trading volumes."}, "detail": {"tr": "İstişareler 31 Temmuz'da açıldı ve görüşler 16 Ekim 2026'ya kadar alınacak; hisse senedi birleşik veri akışının istişarenin kapanmasından sonraki 18 ay içinde devreye girmesi öngörülüyor. Belgeler CP26/30 ve CP26/31 numaralarını taşıyor. FCA, rekabetin likit piyasalar yarattığını, ancak işlem etkinliğinin bütününü görmenin karmaşık ve pahalı olduğunu, bu yüzden piyasa geneli verisinin çoğu zaman yeterince kullanılmadığını belirtti. Haziran 2026'da devreye alınan tahvil birleşik veri akışı için 1,6 milyon lisans aboneliği kaydedildi. Kurumun piyasalardan sorumlu yöneticisi Simon Walls, birleşik veri akışının yatırımcıların piyasanın tamamını görmesini kolaylaştıracağını söyledi.", "en": "The consultations opened on July 31 with responses due by Oct. 16, 2026, and the equity consolidated tape is expected within 18 months of the consultation closing. The documents are numbered CP26/30 and CP26/31. The FCA said competition had created liquid markets but that obtaining a complete picture of trading activity was complicated and expensive, so market-wide data was often under-used. The bond consolidated tape launched in June 2026 has drawn 1.6 million licence subscriptions. Simon Walls, the FCA's executive director of markets, said a consolidated tape would make it simpler and easier for investors to see the whole market picture."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Cameco", "url": "https://www.cameco.com/media/news/cameco-announces-westinghouses-confidential-submission-of-draft-registration-statement", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Westinghouse halka arz için taslak kayıt belgesini gizli olarak sundu", "en": "Westinghouse filed a draft registration statement confidentially for an IPO"}, "summary": {"tr": "Cameco, ortağı olduğu Westinghouse Electric Company'nin adi paylarının halka arzına ilişkin taslak kayıt belgesini ABD Menkul Kıymetler ve Borsa Komisyonu'na gizli olarak sunduğunu duyurdu. Şirket Cameco ile Brookfield Renewable Partners'ın ortak mülkiyetinde bulunuyor.", "en": "Cameco said Westinghouse Electric Company, which it co-owns, had confidentially submitted a draft registration statement to the U.S. Securities and Exchange Commission for a proposed initial public offering of its common stock. The company is owned jointly by Cameco and Brookfield Renewable Partners."}, "detail": {"tr": "Duyuruya göre arz edilecek pay sayısı ve fiyat aralığı henüz belirlenmedi; işlem piyasa koşullarına ve diğer koşullara bağlı olacak. Cameco, açıklamanın Menkul Kıymetler Yasası'nın 135. kuralı kapsamında yapıldığını ve herhangi bir menkul kıymetin satışına yönelik bir teklif ya da teklif çağrısı oluşturmadığını belirtti.", "en": "The announcement said the number of shares to be offered and the price range had not yet been determined, and that the offering would be subject to market and other conditions. Cameco said the release was made under Rule 135 of the Securities Act and did not constitute an offer to sell or a solicitation of an offer to buy any securities."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "El Universal", "url": "https://www.eluniversal.com.co/economica/2026/07/31/banco-de-la-republica-mantiene-en-12-la-tasa-de-interes-este-es-el-motivo/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Kolombiya Merkez Bankası politika faizini yüzde 12'de bıraktı", "en": "Colombia's central bank left its policy rate at 12 percent"}, "summary": {"tr": "Banco de la República'nın yönetim kurulu 31 Temmuz'da politika faizini yüzde 12'de tutma kararı aldı. Yedi üyeden dördü faizin sabit kalmasından, üçü 50 baz puanlık artıştan yana oy kullandı.", "en": "The board of Banco de la República voted on July 31 to hold the policy rate at 12 percent. Four of the seven members backed no change and three favoured a 50 basis point increase."}, "detail": {"tr": "Haziranda toplam enflasyon yükselmeyi sürdürerek yüzde 6,1'e, gıda enflasyonu yüzde 6,8'e çıktı; hedef yüzde 3. Ekonomistler yıl sonu enflasyonunu yüzde 6,6, 2027 aralık beklentisini yüzde 5 olarak öngörüyor. Bankanın kendi duyurusuna göre kurul aynı toplantıda kademeli olarak 4 milyar dolara kadar uluslararası rezerv biriktirme programı başlattı. Görevi bırakan Maliye Bakanı Germán Ávila, hükümetin faiz artışlarından doğan ekonomik daralmanın durdurulmasının önemini uzun süredir vurguladığını söyledi. Bir sonraki faiz toplantısı 30 Eylül 2026'da yapılacak.", "en": "Headline inflation kept rising in June to 6.1 percent and food inflation to 6.8 percent, against a 3 percent target. Economists project inflation of 6.6 percent at year-end and 5 percent by December 2027. According to the bank's own announcement, the board also launched a programme at the same meeting to accumulate up to $4 billion of international reserves gradually. The outgoing finance minister, Germán Ávila, said the government had long stressed the importance of halting the economic contraction caused by the rate increases. The next rate meeting is set for Sept. 30, 2026."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731b.htm", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Fed, banka yöneticilerine kredi açılmasını düzenleyen kuralı yenilemeyi önerdi", "en": "The Fed proposed to modernise its rule on lending to bank insiders"}, "summary": {"tr": "Federal Rezerv Kurulu, bankaların yöneticilerine, yönetim kurulu üyelerine ve büyük ortaklarına kredi açılmasını düzenleyen O Düzenlemesi'ni yenileme önerisini görüşe açtı. Kural 1979'dan bu yana büyük ölçüde değişmeden kaldı.", "en": "The Federal Reserve Board invited comment on a proposal to modernise Regulation O, which governs loans to a bank's executives, directors and principal shareholders. The rule has remained largely unchanged since 1979."}, "detail": {"tr": "Öneri, dolar cinsinden eşikleri güncelleyerek ekonomik büyümeye endeksliyor, yatırım fonlarındaki edilgen paylara gereksiz yere uygulanmasını gideriyor, yasal gereklilikleri ve yerleşik yorumları metne yazıyor ve kuralın uygulanmasını basitleştiriyor. Kurul, kayırmalı kredilendirmeye karşı korumaların yerinde kaldığını belirtti. Başkan yardımcısı Michelle W. Bowman, küçük bölge bankalarının yönetim kuruluna deneyimli iş insanlarını kazandırmakta zorlandığını söyledi. Görüşler, önerinin Federal Register'da yayımlanmasından sonraki 60 gün içinde alınacak.", "en": "The proposal updates dollar thresholds and indexes them to economic growth, removes unnecessary application to passive interests in investment funds, writes statutory requirements and long-standing interpretations into the text, and simplifies how the rule applies. The Board said safeguards against preferential lending remain in place. Vice Chair Michelle W. Bowman said community banks often face difficulty recruiting experienced business leaders to their boards. Comments are due 60 days after publication of the proposal in the Federal Register."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731a.htm", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Fed, karşılıklı bankalara ilişkin 1993 tarihli kuralları güncellemeyi önerdi", "en": "The Fed proposed updating its 1993 rules for mutual banking organisations"}, "summary": {"tr": "Federal Rezerv Kurulu, hissedar yerine mevduat sahiplerinin mülkiyetinde olan karşılıklı bankaları düzenleyen kuralların güncellenmesini görüşe açtı. Kurul bu kuruluşların denetimini 2011'de üstlenmişti, ancak yürürlükteki kurallar 1993'ten kalma.", "en": "The Federal Reserve Board invited comment on updating the rules for mutual banking organisations, which are owned by their depositors rather than by shareholders. The Board took supervisory authority over these institutions in 2011, but the governing rules date from 1993."}, "detail": {"tr": "Öneri, hangi araçların yasal sermaye sayılacağını açıklığa kavuşturuyor, usul yükünü azaltıyor ve bazı karşılıklı bankalar için sermaye artırımında esneklik sağlıyor. Kurulun aktardığına göre bu kuruluşların yüzde 90'ından fazlasının aktif büyüklüğü 3 milyar dolar ve altında. Başkan yardımcısı Michelle W. Bowman, önerinin karşılıklı bankaların büyümesini ve ülke genelinde topluluklara daha etkili hizmet vermesini sağlayacağını söyledi. Kurul, düzenlemenin yaklaşık otuz yıldır ilk kapsamlı güncellemesi olduğunu belirtti; görüşler Federal Register'da yayımdan sonraki 60 gün içinde alınacak.", "en": "The proposal clarifies which instruments qualify as regulatory capital, reduces procedural burdens and gives some mutual banks more flexibility in raising capital. The Board said more than 90 percent of these institutions hold assets below $3 billion. Vice Chair Michelle W. Bowman said the proposal would allow mutual banks to keep growing and serve communities across the country more effectively. The Board described the update as the first comprehensive one in about thirty years; comments are due 60 days after publication in the Federal Register."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "The Korea Times", "url": "https://www.koreatimes.co.kr/foreignaffairs/northkorea/20260731/n-korean-economy-grows-over-3-for-3rd-consecutive-year-in-2025-bok", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Kore Merkez Bankası, Kuzey Kore ekonomisinin 2025'te yüzde 3,5 büyüdüğünü tahmin etti", "en": "The Bank of Korea estimated North Korea's economy grew 3.5 percent in 2025"}, "summary": {"tr": "Güney Kore merkez bankasının tahminine göre Kuzey Kore'nin gayrisafi yurt içi hasılası 2025'te yüzde 3,5 büyüdü. 2024'te yüzde 3,7, 2023'te yüzde 3,1 büyüme kaydedilmişti; böylece üç yıl üst üste yüzde 3'ün üzerinde artış oldu.", "en": "South Korea's central bank estimated that North Korea's gross domestic product grew 3.5 percent in 2025, after 3.7 percent in 2024 and 3.1 percent in 2023 — a third consecutive year above 3 percent."}, "detail": {"tr": "Kurumun aktardığına göre büyümeyi Rusya ile genişleyen ekonomik iş birliği, Çin'le artan ticaret ve ulusal politika projeleri destekledi. Madencilik ve imalat yüzde 4,9, inşaat yüzde 6,3, hizmetler yüzde 1,8 ve tarım yüzde 3,6 büyüdü. Nominal gayrisafi millî gelir 48,5 trilyon won (33,79 milyar dolar) olarak tahmin edildi; bu tutar Güney Kore'nin 2.717,1 trilyon wonluk gelirinin küçük bir bölümüne karşılık geliyor. Kişi başına gelir 1,87 milyon won ile Güney Kore'deki 52,57 milyon wonun yüzde 3,6'sı düzeyinde kaldı.", "en": "The bank said growth was supported by expanded economic cooperation with Russia, increased trade with China and national policy projects. Mining and manufacturing grew 4.9 percent, construction 6.3 percent, services 1.8 percent and agriculture 3.6 percent. Nominal gross national income was estimated at 48.5 trillion won ($33.79 billion), a small fraction of South Korea's 2,717.1 trillion won. Per capita income of 1.87 million won was 3.6 percent of the South Korean level of 52.57 million won."}, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "editionDate": "2026-08-01"}], "visualBriefs": [{"id": "eco-energy-capital-reallocation", "topic": "economics-markets", "title": {"tr": "Enerji sermayesi satış, dağıtım ve halka arz arasında yer değiştiriyor", "en": "Energy capital is moving among sales, distributions and a listing"}, "summary": {"tr": "BP'nin Kuzey Denizi satışı, ExxonMobil'in yüksek kârı ve Westinghouse'un gizli halka arz başvurusu; olgun enerji varlıklarının farklı sahiplik ve nakit kanallarına taşındığını gösteriyor.", "en": "BP's North Sea sale, ExxonMobil's high earnings and Westinghouse's confidential IPO filing show mature energy assets moving through different ownership and cash channels."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-1280.b549709fba18.webp", "variants": [{"src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-640.84ef6ca4bce5.webp", "width": 640}, {"src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-1280.b549709fba18.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Enerji varlığını satış, borç azaltımı ve halka açılma yönlerine dağıtan döner platform", "en": "Turntable reallocating an energy asset toward sale, debt reduction and a public listing"}, "generatedAt": "2026-08-01"}, "editionDate": "2026-08-01", "n": 1, "hasAnalysis": true}, {"id": "eco-market-rulebook-rewrites", "topic": "economics-markets", "title": {"tr": "Piyasa kural kitabı fiyat, referans ve erişim katmanlarında değişiyor", "en": "Ma sed the July 31 session at 6,595.45, up 1,001.89 points. The 17.91 percent gain was the largest single-day advance in the index's history; the largest previous percentage gain was 11.95 percent, on Oct. 30, 2008. Volume reached 430.2 million shares worth 48.9 trillion won.", "refs": ["kospi"]}, {"tr": "Rakamın altındaki akış tek yönlü değil. Yabancı yatırımcılar 7,22 trilyon won, kurumlar 1,15 trilyon won net alım yaptı; bireysel yatırımcılar aynı gün 8,26 trilyon won net sattı. Yani endeksi yukarı taşıyan alım, büyük ölçüde yurt içindeki bireysel portföylerden çıkan payla karşılandı. Wonun dolar karşısında 13,4 won değer kazanarak 1.424'e gelmesi bu yönle uyumlu, ama tek başına yabancı girişinin kanıtı değil: kur aynı gün başka etkenlerle de hareket edebilir.", "en": "The flow underneath the number was not one-sided. Foreign investors bought a net 7.22 trillion won and institutions 1.15 trillion won, while retail investors sold a net 8.26 trillion won the same day. The buying that carried the index up was largely met by stock leaving domestic retail portfolios. The won firming 13.4 won to 1,424 against the dollar is consistent with that direction, but on its own it does not prove foreign inflow: the exchange rate can move on other things the same day.", "refs": ["kospi"]}]}, {"h": {"tr": "Fiyat neyi öğrendi?", "en": "What did the price learn?"}, "ps": [{"tr": "Tetikleyici yurt dışından geldi. Korea Herald'ın aktardığı analist değerlendirmesine göre yükselişi başlatan, Microsoft'un beklentinin üzerinde gelen ikinci çeyrek sonuçlarının yapay zekâ harcamasına ilişkin kaygıyı hafifletmesiydi. Endeks önceki üç seansta aynı kaygıyla yüzde 17'den fazla gerilemişti. Samsung Electronics yüzde 26,81, SK Hynix günlük tavan olan yüzde 29,95, Hanmi Semiconductor yüzde 27,98 kazandı. Bu haliyle seans, üç günde kurulan bir pozisyonun geri alınmasına benziyor; Kore şirketlerinin kendi kazançlarına dair yeni bir veri devreye girmiş değil. Karşı okuma da mümkün: bellek talebine ilişkin beklenti gerçekten yukarı güncellendiyse, hareketin bir bölümü kalıcı bir yeniden fiyatlama olur.", "en": "The trigger came from outside Korea. In the analyst assessment carried by The Korea Herald, what started the advance was Microsoft's better-than-expected second-quarter results easing concern about artificial-intelligence spending. The index had lost more than 17 percent over the previous three sessions on that same concern. Samsung Electronics gained 26.81 percent, SK Hynix the daily limit of 29.95 percent and Hanmi Semiconductor 27.98 percent. Read that way, the session looks like the unwinding of a position built over three days, with no new data about Korean earnings entering the picture. The opposite reading is available: if expectations for memory demand were genuinely revised upward, part of the move is a durable repricing.", "refs": ["kospi"]}, {"tr": "İki okumayı ayıracak gözlem, fiyatın kendisinde değil akışın devamında. Yabancı ve kurumsal net alım önümüzdeki haftalarda sürer ve endeks ağustos sonuna kadar 6.500'ün üzerinde kapanmayı korursa, beklentinin yukarı güncellendiği yorumu güçlenir. Net alım tersine döner ve endeks aynı dönemde 6.500'ün altına geri dönerse, geriye üç günlük düşüşün bir günde kapatılması kalır. Hacim de burada bir ölçüt: 48,9 trilyon wonluk işlem tutarı olağanüstü ve olağan günlere dönüşte hangi seviyenin tutunduğu, tek seansın kendisinden daha çok şey söyler.", "en": "What separates the two readings is whether the flow persists, rather than the price itself. If foreign and institutional net buying continues over the coming weeks and the index holds closes above 6,500 through the end of August, the case for a revised expectation strengthens. If net buying reverses and the index falls back below 6,500 in the same period, what remains is a three-day decline closed in a single day. Volume is a second gauge: 48.9 trillion won of turnover is exceptional, and which level holds once activity returns to normal says more than the one session does.", "refs": ["kospi"]}]}], "sources": [{"key": "kospi", "kind": "news", "name": "The Korea Herald", "url": "https://www.koreaherald.com/article/10827325", "title": {"tr": "Kospi tek seansta yüzde 17,91 yükselerek endeks tarihinin rekorunu kırdı", "en": "The Kospi rose 17.91 percent in a single session, the largest gain in its history"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-02", "title": {"tr": "İki farklı bilanço, tek bir kur sorunu", "en": "Two different balance sheets, one currency problem"}, "excerpt": {"tr": "Japonya Merkez Bankası politika faizini yüzde 1'de bıraktı ve metnin tonu iki yıllık devlet tahvili getirisini yukarı taşıdı. Yen ise hükümetin son müdahalesine karşın dolar başına 160,760 dolayında kaldı. Kararın fiyatladığı yer ile döviz işleminin tuttuğu yer aynı bilanço değil.", "en": "The Bank of Japan left its policy rate at 1 percent and the tone of the statement pushed the two-year government bond yield higher. The yen, despite the government's recent intervention, stayed around 160.760 to the dollar. What the decision prices and what the currency operation absorbs do not sit on the same balance sheet."}, "sections": [{"h": {"tr": "Karar, karşı oy ve eğrinin kısa ucu", "en": "The decision, the dissent and the short end"}, "ps": [{"tr": "31 Temmuz'da sona eren toplantıda kısa vadeli politika faizi yüzde 1'de bırakıldı. Kurul üyesi Hajime Takata, dış talep kaynaklı enflasyon riskine karşı faizin yüzde 1,25'e çıkarılmasını önererek tek başına karşı oy kullandı. Başkan Kazuo Ueda, ücret ve fiyatlama davranışı sertleştikçe temel enflasyonun yüzde 2 hedefinin üzerine sapma riski taşıdığını söyledi ve kurulun bir sonraki toplantıdan itibaren politikayı tartışacağını belirtti.", "en": "The meeting that ended on July 31 left the short-term policy rate at 1 percent. Board member Hajime Takata dissented alone, proposing a rise to 1.25 percent against inflation risk arising from external demand. Governor Kazuo Ueda said underlying inflation risked deviating above the 2 percent target as wage and price-setting behaviour turned more assertive, and said the board would debate policy from its next meeting onward.", "refs": ["boj"]}, {"tr": "Bu ifadeyi ilk fiyatlayan yer eğrinin kısa ucu oldu: metnin şahin tonu iki yıllık devlet tahvili getirisini yükseltti. Bunda şaşırtıcı bir yan yok, çünkü merkez bankasının elindeki araç rezervlerin fiyatıdır ve yönlendirme önce o fiyatın beklenen patikasını değiştirir. Kurun aynı ölçüde tepki vermemesi de aynı mekanizmanın diğer yüzü: döviz piyasası, tartışma niyetini değil gerçekleşen faiz farkını taşır.", "en": "The first place that priced the language was the short end of the curve: the hawkish tone of the statement lifted the two-year government bond yield. That is not surprising, because the instrument the central bank holds is the price of reserves, and guidance changes the expected path of that price first. The currency's smaller response is the other side of the same mechanism: the foreign exchange market carries the differential that is actually realised, not a stated willingness to debate.", "refs": ["boj"]}]}, {"h": {"tr": "Müdahale hangi kalemi değiştirir?", "en": "Which item does the intervention change?"}, "ps": [{"tr": "Döviz müdahalesi devletin bilançosunda bir takastır: dış varlık satılır, yen alınır. Belirli bir anda gelen akışı emer, ama o akışı üreten fonlama maliyeti farkını yerinde bırakır. Kanıt fiyatın kendisinde: son müdahaleye karşın yen dolar başına 160,760 dolayında tutundu. Yani şu an kurun istikrarı ile enflasyonun seyri devletin iki ayrı koluna dağılmış durumda ve farka dokunan araç yalnızca birinde. Karşı okumayı da elde tutmak gerekir: yenin düzeyini faiz farkından çok maliye politikasına ilişkin beklentiler belirliyorsa, ne yönlendirme ne de bir faiz artışı kuru kalıcı biçimde taşır.", "en": "A currency intervention is a swap on the state's balance sheet: foreign assets are sold and yen bought. It absorbs the flow arriving at a given moment while leaving in place the funding-cost differential that produces that flow. The evidence is in the price itself: despite the recent intervention the yen held around 160.760 to the dollar. Currency stability and the path of inflation therefore sit with two separate arms of the state, and only one of them holds the instrument that touches the differential. The counter-reading has to stay on the table: if the yen's level is set by expectations about fiscal policy rather than by the rate gap, neither the guidance nor a rate rise moves it durably.", "refs": ["boj"]}, {"tr": "Ueda'nın kendi çerçevesi kuru maliye bakanlığının konusu olmaktan çıkarıp yetki alanına geri getiriyor: hedefin üzerine sapma riskini ücret ve fiyatlama davranışına bağlıyor, ve bu davranışın yakıtı ithal maliyetten geçer. Buradan çıkan gözlem şu: eğer temel enflasyon tahminleri yüzde 2'nin üzerinde kalır ve ücret pazarlığı bu tonu sürdürürse, ekimin sonuna kadar ya politika faizi yüzde 1'in üzerine çıkar ya da karşı oy tek kişiden fazlasına yayılır. Tersi olursa, yani faiz de yenin seviyesi de yerinde kalırsa, kur sorununun faiz farkından bağımsız bir kaynağı olduğu görüşü güçlenir. Metin bir tarih vermiyor; belirsizlik burada hesaplanabilir bir risk değil.", "en": "Ueda's own framing pulls the currency back from being a finance ministry matter into the mandate: he ties the risk of an overshoot to wage and price-setting behaviour, and the fuel for that behaviour runs through imported costs. The observation that follows is this: if underlying inflation forecasts stay above 2 percent and wage bargaining keeps its current tone, then by the end of October either the policy rate moves above 1 percent or the dissent spreads beyond a single member. If neither happens — the rate unchanged and the yen still near its present level — the case strengthens that the currency problem has a source independent of the rate gap. The statement gave no date; the uncertainty here is not a calculable risk.", "refs": ["boj"]}]}], "sources": [{"key": "boj", "kind": "news", "name": "Taipei Times", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861730", "title": {"tr": "Japonya Merkez Bankası politika faizini yüzde 1'de tuttu, bir üye karşı oy kullandı", "en": "The Bank of Japan held its policy rate at 1 percent, with one dissent"}, "publishedDate": "2026-08-01"}], "date": "2026-08-01"}, {"writer": "eco-03", "title": {"tr": "Chevron borcunu kapattı, ExxonMobil hissedarına ödedi", "en": "Chevron paid down debt, ExxonMobil paid its shareholders"}, "excerpt": {"tr": "Aynı çeyrekte iki büyük petrol şirketi neredeyse aynı serbest nakit akışını açıkladı: Chevron 18,1 milyar dolar, ExxonMobil 17,2 milyar dolar. Chevron bu nakdin rekor düzeydeki bölümünü, 8,4 milyar dolar tutarında borç kapatmaya ayırdı; ExxonMobil 9,4 milyar dolar tutarında temettü ve pay geri alımı dağıttı. Fiyat ortamı ortak, sermaye tercihi değil.", "en": "In the same quarter two oil majors reported almost the same free cash flow: $18.1 billion at Chevron and $17.2 billion at ExxonMobil. Chevron put a record $8.4 billion of it into paying down debt; ExxonMobil distributed $9.4 billion as dividends and buybacks. The price environment was shared; the capital choice was not."}, "sections": [{"h": {"tr": "Çeyreğin rakamları", "en": "The quarter's figures"}, "ps": [{"tr": "Chevron ikinci çeyrekte 12,1 milyar dolar, seyreltilmiş hisse başına 6,11 dolar kâr; düzeltilmiş tarafta 12,0 milyar dolar ve 6,06 dolar bildirdi. Gelir 70,1 milyar dolar, kullanılan sermayenin getirisi yüzde 21 oldu. Faaliyetlerden nakit akışı 22,6 milyar dolar, sermaye harcaması 4,5 milyar dolar; aradaki 18,1 milyar dolar serbest nakit akışı olarak kaldı. Üretim yıllık yüzde 20 artışla günde 4.070 bin varil eşdeğerine çıktı ve ABD rafinerileri yüzde 97 kapasite kullanımıyla günde 1,07 milyon varillik rekor işleme yaptı.", "en": "Chevron reported second-quarter earnings of $12.1 billion, or $6.11 a diluted share, and $12.0 billion or $6.06 on the adjusted line. Revenue was $70.1 billion and return on capital employed 21 percent. Cash flow from operations was $22.6 billion against capital spending of $4.5 billion, leaving $18.1 billion of free cash flow. Production rose 20 percent from a year earlier to 4,070 thousand barrels of oil equivalent a day, and U.S. refineries set a throughput record of 1.07 million barrels a day at 97 percent utilisation.", "refs": ["chevron"]}, {"tr": "ExxonMobil aynı çeyrekte 14,5 milyar dolar, hisse başına 3,48 dolar kâr; düzeltilmiş tarafta 14,7 milyar dolar ve 3,52 dolar açıkladı. Faaliyetlerden nakit akışı 23,6 milyar dolar, serbest nakit akışı 17,2 milyar dolar oldu. Üretim yirmi yılı aşkın sürenin en yüksek düzeyine çıktı; Permiyen havzasında günlük 1,8 milyon varil eşdeğeriyle rekor kırıldı. İki şirketin serbest nakit akışı arasındaki fark 0,9 milyar dolar; yani üretilen nakit bakımından çeyrek ikisi için de aynı yere yakın çıktı.", "en": "ExxonMobil reported $14.5 billion, or $3.48 a share, and $14.7 billion or $3.52 adjusted for the same quarter. Cash flow from operating activities was $23.6 billion and free cash flow $17.2 billion. Production reached its highest level in more than two decades, with a record 1.8 million barrels of oil equivalent a day in the Permian. The gap between the two companies' free cash flow is $0.9 billion; in terms of cash generated, the quarter landed in nearly the same place for both.", "refs": ["exxon"]}]}, {"h": {"tr": "Nakit nereye gitti?", "en": "Where did the cash go?"}, "ps": [{"tr": "Chevron'da çeyreğin en büyük tek kalemi borç oldu: şirket rekor düzeyde 8,4 milyar dolar borç kapattı, 3,1 milyar dolar tutarında pay geri alımı yaptı ve hisse başına 1,78 dolar temettü ödedi. Yani 18,1 milyar dolar serbest nakdin yaklaşık yarısı bilançoya, geri kalanı hissedara gitti.", "en": "At Chevron the largest single use of the quarter was debt: the company paid down a record $8.4 billion, repurchased $3.1 billion of shares and paid a dividend of $1.78 a share. Close to half of the $18.1 billion of free cash flow went to the balance sheet and the rest to shareholders.", "refs": ["chevron"]}, {"tr": "ExxonMobil'de dağıtım 9,4 milyar dolar oldu: 4,3 milyar dolar temettü, 5,1 milyar dolar pay geri alımı; üçüncü çeyrek için hisse başına 1,03 dolar temettü ilan edildi. Neredeyse aynı nakit iki farklı adrese gidiyor ve bu, en azından bu çeyrekte, sermaye tercihinin fiyat ortamından bağımsız olduğunu gösteriyor. Alternatif açıklamayı da elde tutmak gerekir: Chevron'un borç kapatması Hess satın alımından kalan bir vade takviminin sonucu olabilir ve ExxonMobil'in dağıtım düzeyi bu çeyreğe verilmiş bir yanıttan çok yerleşik bir politika olabilir. İki durumda da rakamlar aynı, ama tercih olarak okunacak bir yan kalmaz.", "en": "At ExxonMobil distributions came to $9.4 billion: $4.3 billion of dividends and $5.1 billion of buybacks, with a third-quarter dividend of $1.03 a share declared. Nearly identical cash went to two different addresses, which suggests that in this quarter at least the capital choice was independent of the price environment. The alternative has to stay on the table: Chevron's debt reduction may follow a maturity schedule left by the Hess acquisition, and ExxonMobil's distribution level may be standing policy rather than an answer to this quarter. Either way the figures are the same, but nothing remains to read as a choice.", "refs": ["chevron", "exxon"]}]}, {"h": {"tr": "Fiyattan bağımsız olan satırlar", "en": "The lines that do not depend on price"}, "ps": [{"tr": "Çeyreğin tamamı, iki şirketin de belirlemediği bir fiyat düzeyine yaslanıyor; bu yüzden asıl soru, o düzey değiştiğinde hangi kalemin ayakta kaldığı. Chevron tarafında bu soruya en açık yanıt Batı Teksas'taki bir veri merkezi için Microsoft ile imzalanan 20 yıllık ve 2,67 gigavatlık elektrik anlaşması; gideri düşüren kalemler ise Hess satın alımından bir yılda sağlanan 1,5 milyar dolar sinerji ve 3 milyar dolar yapısal gider azalması. ExxonMobil'de karşılığı hacim ve gider: birikimli yapısal tasarruf 16,3 milyar dolar olurken Guyana'daki beşinci yüzer üretim biriminin dördüncü çeyrekte günde 250 bin varillik kapasiteyle devreye girmesi bekleniyor. İzlenecek gözlem, Chevron'un borç azaltmayı pay geri alımının üzerinde tutup tutmadığı: fiyat ortamı zayıfladığında bu sıralama korunursa bilanço tercihi gerçekten tercihtir, bozulursa bu çeyreğin dağılımı yalnızca vade takvimiydi.", "en": "The whole quarter leans on a price level neither company set, so the real question is which line survives when that level changes. On Chevron's side the clearest answer is the 20-year, 2.67-gigawatt power agreement signed with Microsoft for a West Texas data centre; the cost-side answers are $1.5 billion of Hess synergies achieved within a year and $3 billion of structural cost reductions. At ExxonMobil the equivalents are volume and cost: cumulative structural savings reached $16.3 billion, and a fifth floating production unit in Guyana is expected to start up in the fourth quarter with capacity of 250 thousand barrels a day. The observation to watch is whether Chevron keeps debt reduction above the buyback line: if the ordering holds as the price environment weakens, the balance-sheet preference is a real choice; if it breaks, this quarter's split was only a maturity schedule.", "refs": ["chevron", "exxon"]}]}], "sources": [{"key": "chevron", "kind": "news", "name": "Chevron", "url": "https://chevroncorp.gcs-web.com/news-releases/news-release-details/chevron-reports-second-quarter-2026-results", "title": {"tr": "Chevron 12,1 milyar dolar kâr ve 8,4 milyar dolar borç kapatması bildirdi", "en": "Chevron reported $12.1 billion of earnings and an $8.4 billion debt paydown"}, "publishedDate": "2026-07-31"}, {"key": "exxon", "kind": "news", "name": "ExxonMobil", "url": "https://investor.exxonmobil.com/company-information/press-releases/detail/1208/exxonmobil-announces-second-quarter-2026-results", "title": {"tr": "ExxonMobil ikinci çeyrekte 14,5 milyar dolar net kâr açıkladı", "en": "ExxonMobil reported second-quarter earnings of $14.5 billion"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-04", "title": {"tr": "Varilin fiyatı artık yükleme ayına bir ay kala belirlenecek", "en": "The barrel's price will now be set one month before loading"}, "excerpt": {"tr": "ADNOC, 1 Kasım'dan itibaren Murban, Das, Umm Lulu ve Upper Zakum türlerinin resmi satış fiyatını Platts Dubai değerlemesine bağlayacak. Fark, hedef teslim ayından iki ay değil bir ay önce açıklanacak. Değişen şey gösterge kadar, fiyat riskinin kimde ve ne kadar süre kaldığı.", "en": "From Nov. 1 ADNOC will set the official selling price of its Murban, Das, Umm Lulu and Upper Zakum grades off the Platts Dubai assessment. The differential will be announced one month, not two, before the target delivery month. What changes is the benchmark — and with it, who carries the price risk and for how long."}, "sections": [{"h": {"tr": "Değişen mekanizma", "en": "The mechanism that changed"}, "ps": [{"tr": "ADNOC dört Abu Dabi ham petrol türünün resmi satış fiyatı yöntemini değiştirdiğini duyurdu. Murban, Das, Umm Lulu ve Upper Zakum, 1 Kasım 2026'dan itibaren Platts Dubai değerlemesine (PCAAT00) ve buna eklenecek bir ADNOC farkına göre fiyatlanacak. Fark, hedef teslim ayından bir önceki ay açıklanacak.", "en": "ADNOC announced a change to the official selling price methodology for four Abu Dhabi crude grades. From Nov. 1, 2026, Murban, Das, Umm Lulu and Upper Zakum will be priced off the Platts Dubai assessment (PCAAT00) plus a differential set by ADNOC. That differential will be announced in the month preceding the target delivery month.", "refs": ["adnoc"]}, {"tr": "Bunun yerini aldığı yöntem, fiyatı yükleme tarihinden iki ay önce ICE Futures Abu Dhabi üzerinden belirliyordu. Şirket adımı rutin bir ticari gözden geçirmenin sonucu olarak tanımlıyor ve müşteri ile yatırımcı tabanına yönelik fiyat şeffaflığını güçlendirdiğini söylüyor. Bu çerçeve önemli, çünkü değişikliği bir strateji dönüşü olarak değil, fiyatın fiziksel piyasada zaten oluştuğu yere yaklaştırılması olarak sunuyor.", "en": "The method it replaces set the price two months ahead of loading, off ICE Futures Abu Dhabi. The company describes the step as the outcome of a routine commercial review and says it reinforces price transparency for its customer and investor base. That framing matters, because it presents the change not as a turn in strategy but as moving the price closer to where the physical market already forms it.", "refs": ["adnoc"]}]}, {"h": {"tr": "Bir ay kısalan pencere kime ne yapar?", "en": "What does a window shortened by a month do, and to whom?"}, "ps": [{"tr": "Fiyatın sabitlendiği an ile varilin yüklendiği an arasındaki boşluk, birinin taşımak zorunda olduğu bir risk penceresidir. İki ay önceden fiyatlanan bir kargoda alıcı, sabitleme ile teslim arasındaki iki aylık hareketi ya korumaya alır ya da üstlenir. Pencerenin bir aya inmesi bu süreyi yarıya indirir. Referansın Platts Dubai'ye taşınması ise ayrı bir etki yaratır: aynı rafineri programı için yarışan Körfez kargolarının çoğu zaten bu değerlemeye göre fiyatlandığından, ADNOC'un ilan edeceği fark doğrudan karşılaştırılabilir bir sayıya dönüşür. Karşı okuma da mümkün: şirketin kendi tanımıyla bu rutin bir ticari gözden geçirme ise, yöntem değişikliği riski yeniden dağıtmaktan çok mevcut fiyatlama alışkanlığını kayda geçiriyor olabilir.", "en": "The gap between the moment a price is fixed and the moment the barrel loads is a risk window somebody has to carry. On a cargo priced two months ahead, the buyer either hedges or absorbs two months of movement between the fixing and delivery. Cutting the window to one month halves that. Moving the reference to Platts Dubai does something separate: since most Gulf cargoes competing for the same refinery slot already price off that assessment, the differential ADNOC announces becomes a directly comparable number. The counter-reading is available: if this is a routine commercial review as the company describes it, the change may be recording existing pricing practice rather than redistributing risk.", "refs": ["adnoc"]}, {"tr": "Duyurunun en somut ayrıntısı finansman tarafında: ADNOC, değişikliğin ADNOC Murban'ın küresel orta vadeli tahvil ve sukuk programları dâhil borsada işlem gören araçlarında önemli bir etki yaratmasının beklenmediğini belirtiyor. Yani Murban adı borçlanma yapısında yerinde kalırken, onu taşıyan vadeli işlem sözleşmesi ham petrolün fiyatını belirleme işinden çekiliyor. İzlenecek gözlem burada net: kasım yüklemeleri için ekimde açıklanacak ilk fark, ve izleyen aylarda ilan edilen farkların aydan aya değişim aralığı. Pencere kısaldığı için bu aralığın daralması beklenir; daralmazsa, fiyatlama riskinin yerinde durduğu sonucuna varılır.", "en": "The most concrete detail in the announcement is on the financing side: ADNOC says the change is not expected to have a material impact on its listed instruments, including issuances under ADNOC Murban's global medium-term note and sukuk programmes. The Murban name stays in the borrowing structure while the futures contract that carried it steps back from setting the price of the crude. The observation to watch is clear enough: the first differential, announced in October for November loadings, and the month-to-month range of the differentials announced after it. A shorter window should narrow that range; if it does not, the pricing risk has not moved.", "refs": ["adnoc"]}]}], "sources": [{"key": "adnoc", "kind": "news", "name": "ADNOC", "url": "https://www.adnoc.ae/en/news-and-media/press-releases/2026/adnoc-announces-update-to-its-crude-pricing-methodology", "title": {"tr": "ADNOC ham petrol fiyatlamasını 1 Kasım'dan itibaren Platts Dubai'ye bağlıyor", "en": "ADNOC will price its crude off Platts Dubai from Nov. 1"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-05", "title": {"tr": "Yüzde 2,9'luk oran hangi hanenin faturası?", "en": "Whose bill is the 2.9 percent rate?"}, "excerpt": {"tr": "Euro Bölgesi'nde temmuz enflasyonu yüzde 2,8'den yüzde 2,9'a çıktı. Manşetteki 0,1 puanlık artışın altında iki karşıt hareket var: enerji yüzde 8,5'ten yüzde 10,0'a yükselirken gıda, alkol ve tütün yüzde 1,5'ten yüzde 1,2'ye indi. Ülkeler arasındaki fark ise 3,6 puan.", "en": "Euro area inflation went from 2.8 percent to 2.9 percent in July. Under that 0.1 point lie two opposite moves: energy climbed from 8.5 percent to 10.0 percent while food, alcohol and tobacco fell from 1.5 percent to 1.2 percent. Across countries, the spread is 3.6 points."}, "sections": [{"h": {"tr": "Manşetin altındaki iki yön", "en": "Two directions under the headline"}, "ps": [{"tr": "Eurostat'ın hızlı tahminine göre temmuzda yıllık enflasyon yüzde 2,9 oldu; haziranda yüzde 2,8'di. Bileşenler ise aynı yöne gitmedi. Enerjide yıllık oran yüzde 8,5'ten yüzde 10,0'a çıktı; hizmetler yüzde 3,2'den yüzde 3,3'e, enerji dışı sanayi malları yüzde 0,7'den yüzde 0,9'a yükseldi. Gıda, alkol ve tütün ise yüzde 1,5'ten yüzde 1,2'ye indi.", "en": "Eurostat's flash estimate put annual inflation at 2.9 percent in July, against 2.8 percent in June. The components did not move together. Energy rose from 8.5 percent to 10.0 percent a year; services went from 3.2 percent to 3.3 percent and non-energy industrial goods from 0.7 percent to 0.9 percent. Food, alcohol and tobacco fell from 1.5 percent to 1.2 percent.", "refs": ["eurostat"]}, {"tr": "Yüzde 2,9, tek bir sepetin ağırlıklı ortalamasıdır. Enerjideki yüzde 10,0 ile gıdadaki yüzde 1,2 zıt yönlere gittiğine göre, bir hanenin gerçekte karşılaştığı oran, bu iki kalemin kendi bütçesindeki payına bağlıdır: ısınma ve ulaşım faturası bütçesinde ağır basan bir hane yüzde 10,0'a yakın bir dünyada yaşar, gıdanın payı daha yüksek olan bir hane bu ay lehine çalışan bir kalemle karşılaşır. Hızlı tahmin bu dağılımı vermiyor; verdiği tek şey ortalama. Bu yüzden yüzde 2,9, kimsenin faturası olmayan bir sayı olarak okunmalı.", "en": "The 2.9 percent is the weighted average of one basket. Since the 10.0 percent on energy and the 1.2 percent on food moved in opposite directions, the rate a household actually meets depends on the share those two items hold in its own budget: a household whose heating and transport bill dominates lives closer to 10.0 percent, while one where food weighs more meets an item that worked in its favour this month. The flash estimate does not give that distribution; all it gives is the average. So 2.9 percent should be read as a number that is nobody's bill.", "refs": ["eurostat"]}]}, {"h": {"tr": "Aynı para birimi, farklı oranlar", "en": "One currency, different rates"}, "ps": [{"tr": "Ülke düzeyinde aralık daha da açılıyor. Litvanya yüzde 5,6 ile en yüksek oranı kaydetti; Kıbrıs yüzde 4,0, Hırvatistan yüzde 3,6, Belçika yüzde 3,5 ile onu izledi. Diğer uçta Estonya yüzde 2,0, Fransa yüzde 2,4, Finlandiya yüzde 2,6 ve Almanya yüzde 2,8 yer aldı. Uçlar arasındaki fark 3,6 puan ve bu, tek bir para biriminin içinde ölçülüyor.", "en": "At country level the range widens further. Lithuania recorded the highest rate at 5.6 percent, followed by Cyprus at 4.0 percent, Croatia at 3.6 percent and Belgium at 3.5 percent. At the other end were Estonia at 2.0 percent, France at 2.4 percent, Finland at 2.6 percent and Germany at 2.8 percent. The distance between the ends is 3.6 points, and it is measured inside a single currency.", "refs": ["eurostat"]}, {"tr": "Bu farkın kaynağı doğrudan okunamaz. Enerjinin ülke sepetlerindeki ağırlığı, ısınma kaynakları, vergi bileşimi ve ulusal fiyat düzenlemeleri hep aynı sayıya karışır; hızlı tahmin bunların hiçbirini ayırmıyor. Bir de ölçmenin sınırı var: ulusal bir tavan fiyat ya da fatura desteği haneyi korurken uyumlaştırılmış endekse ucuzlama olarak yansımayabilir, yani korunan bir hane yüksek görünen bir oranın içinde de bulunabilir. Ayrımı yapacak veri 19 Ağustos'ta geliyor: temmuzun tam verisi bileşenleri ve ülkeleri ayrıntılandıracak. O tarihe kadar elimizdeki tek doğru cümle şu — enerji yüzde 10,0'a çıktı, gıda yüzde 1,2'ye indi ve hangi hanenin hangisini taşıdığını bu tahmin söylemiyor.", "en": "The source of that gap cannot be read off directly. The weight of energy in national baskets, heating sources, the tax mix and national price regulation all feed into the same figure, and the flash estimate separates none of them. There is also a limit to what is being measured: a national price cap or bill support can shield a household without showing up in the harmonised index as a fall in price, so a protected household can sit inside a rate that looks high. The data that would separate these arrives on Aug. 19, when the full July figures break out components and countries. Until then the one accurate sentence available is this — energy rose to 10.0 percent, food fell to 1.2 percent, and this estimate does not say which household carries which.", "refs": ["eurostat"]}]}], "sources": [{"key": "eurostat", "kind": "news", "name": "Eurostat", "url": "https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-31072026-ap", "title": {"tr": "Euro Bölgesi'nde yıllık enflasyon temmuzda yüzde 2,9'a çıktı", "en": "Euro area annual inflation rose to 2.9 percent in July"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-06", "title": {"tr": "1979'dan beri durmuş bir kural ile 1993'ten kalma bir başkası", "en": "One rule untouched since 1979 and another left over from 1993"}, "excerpt": {"tr": "Federal Rezerv Kurulu aynı gün iki öneriyi görüşe açtı: banka yöneticilerine kredi açılmasını düzenleyen ve 1979'dan bu yana büyük ölçüde değişmeyen O Düzenlemesi ile karşılıklı bankalara ilişkin 1993 tarihli kurallar. İkisi de zararın nerede karşılanacağını belirleyen kenarlara dokunuyor ve ikisi de küçük kuruluşlarda.", "en": "The Federal Reserve Board put two proposals out for comment on the same day: Regulation O, which governs credit to bank insiders and has been largely unchanged since 1979, and the 1993 rules for mutual banking organisations. Both touch the edges that decide where a loss is absorbed, and both sit at small institutions."}, "sections": [{"h": {"tr": "Aynı gün, iki eski kural", "en": "One day, two old rules"}, "ps": [{"tr": "İlk öneri O Düzenlemesi'ni yeniliyor. Bu kural bankaların üst yöneticilerine, yönetim kurulu üyelerine ve büyük ortaklarına kredi açılmasını düzenliyor ve 1979'dan bu yana büyük ölçüde değişmeden kaldı. Öneri, dolar cinsinden eşikleri güncelleyip ekonomik büyümeye endeksliyor, yatırım fonlarındaki edilgen paylara gereksiz uygulamayı gideriyor, yasal gereklilikleri ve yerleşik yorumları metne yazıyor. Kurul kayırmalı kredilendirmeye karşı korumaların yerinde kaldığını belirtiyor; başkan yardımcısı Michelle W. Bowman ise küçük bölge bankalarının yönetim kuruluna deneyimli iş insanlarını kazandırmakta zorlandığını söylüyor.", "en": "The first proposal modernises Regulation O. The rule governs loans to a bank's senior executives, directors and principal shareholders, and has been largely unchanged since 1979. The proposal updates dollar thresholds and indexes them to economic growth, removes unnecessary application to passive interests in investment funds, and writes statutory requirements and long-standing interpretations into the text. The Board says safeguards against preferential lending remain in place; Vice Chair Michelle W. Bowman says community banks often struggle to recruit experienced business leaders to their boards.", "refs": ["fed-rego"]}, {"tr": "İkinci öneri karşılıklı bankaları ele alıyor: hissedar yerine mevduat sahiplerinin mülkiyetindeki kuruluşlar. Kurul bunların denetimini 2011'de üstlendi, ama yürürlükteki kurallar 1993'ten kalma. Öneri hangi araçların yasal sermaye sayılacağını açıklığa kavuşturuyor, usul yükünü azaltıyor ve bazı karşılıklı bankalar için sermaye artırımında esneklik sağlıyor. Kurulun aktardığına göre bu kuruluşların yüzde 90'ından fazlasının aktif büyüklüğü 3 milyar dolar ve altında ve düzenleme yaklaşık otuz yıldır ilk kapsamlı güncellemesini görüyor.", "en": "The second proposal covers mutual banking organisations: institutions owned by their depositors rather than by shareholders. The Board took supervisory authority over them in 2011, but the governing rules date from 1993. The proposal clarifies which instruments qualify as regulatory capital, reduces procedural burdens and gives some mutual banks more flexibility in raising capital. The Board says more than 90 percent of these institutions hold assets below $3 billion, and describes the update as the first comprehensive one in about thirty years.", "refs": ["fed-mutual"]}]}, {"h": {"tr": "Hangi tampon inceliyor?", "en": "Which buffer thins?"}, "ps": [{"tr": "İki öneri farklı konuları düzenliyor gibi görünse de aynı sorunun iki ucunda duruyor: zararı kim, hangi koşulla karşılar? O Düzenlemesi, kuruluşu yöneten kişinin aynı kuruluştan hangi koşulla borçlanabileceğini sınırlar; karşılıklı banka kuralları ise zararı emecek sermayenin tanımını yapar. İkisi de küçük kuruluşlarda uygulanıyor ve karşılıklı bankaların özelliği burada belirleyici: hissedarı olmayan bir banka, sıkışınca piyasaya adi pay ihraç edemez. Yani aynı gün, zarar emme kapasitesinin tanımı ile o kapasiteyi tüketebilecek kredinin sınırı birlikte açılıyor.", "en": "The two proposals look like separate subjects but stand at two ends of the same question: who absorbs a loss, and on what terms? Regulation O bounds the terms on which the people running an institution may borrow from it; the mutual bank rules define the capital that absorbs a loss. Both apply at small institutions, and the nature of a mutual matters here: a bank with no shareholders cannot issue common equity to a market when it is squeezed. So on one day the definition of loss-absorbing capacity and the limit on the lending that could con
