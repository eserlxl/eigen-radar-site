<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: full width, no scroll box, shareable via #hash. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }

      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }

    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{

    }

    #briefsSection .section-title .date-select{

    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without

  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){

    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}

    }

    }

function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}
document.addEventListener('error', event=>{

  if(image instanceof HTMLImageElement && image.closest('.brief-media')){
    const picture = image.closest('picture');
    if(picture) picture.remove();
  }
}, true);

 meets on July 28 and 29. Futures pricing showed roughly 68.5 percent of traders expecting no change and about one in three pricing a quarter-point increase. June consumer prices fell 0.4 percent on the month while the annual rate eased to 3.5 percent from 4.2 percent in May; core inflation was 2.6 percent and fuel costs were up 15.7 percent from a year earlier."}, "editionDate": "2026-07-28"}, {"featured": true, "topic": "economics-markets", "tag": "companies", "src": "Celestica", "url": "https://www.globenewswire.com/news-release/2026/07/27/3333904/0/en/Celestica-Announces-Second-Quarter-2026-Financial-Results.html", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Celestica geliri yüzde 62 arttı, yıl beklentisini yükseltti", "en": "Celestica revenue rises 62 percent and the company lifts its full-year outlook"}, "summary": {"tr": "Celestica ikinci çeyrek geliri 4,70 milyar dolar, düzeltilmiş hisse başına kâr 2,54 dolar oldu. Şirket 2026 gelir beklentisini 20,5 milyar dolar seviyesine yükseltti.", "en": "Celestica second-quarter revenue reached $4.70 billion and adjusted earnings per share $2.54. The company raised its 2026 revenue outlook to $20.5 billion."}, "detail": {"tr": "Gelir bir yıl önceki 2,89 milyar dolar seviyesinden 4,70 milyar dolar seviyesine çıktı ve şirketin kendi beklenti aralığının üst sınırını aştı. Bağlantı ve Bulut Çözümleri bölümü yüzde 84 büyümeyle 3,81 milyar dolar, İleri Teknoloji Çözümleri bölümü yüzde 8 artışla 0,89 milyar dolar oldu; donanım platformu satışları yüzde 58 artarak yaklaşık 1,9 milyar dolar seviyesine ulaştı. Düzeltilmiş faaliyet marjı yüzde 8,2 olarak açıklandı. Celestica 2026 gelir beklentisini 19,0 milyar dolar seviyesinden 20,5 milyar dolar seviyesine, düzeltilmiş hisse başına kâr beklentisini 10,15 dolar seviyesinden 11,30 dolar seviyesine yükseltti. Üçüncü çeyrek için 5,25 milyar dolar ile 5,55 milyar dolar arasında gelir ve 2,88 dolar ile 3,08 dolar arasında düzeltilmiş hisse başına kâr öngörüyor.", "en": "Revenue rose to $4.70 billion from $2.89 billion a year earlier, above the top of the company's own guidance range. The Connectivity and Cloud Solutions segment grew 84 percent to $3.81 billion and Advanced Technology Solutions 8 percent to $0.89 billion; hardware platform sales rose 58 percent to about $1.9 billion. Adjusted operating margin was reported at 8.2 percent. Celestica raised its 2026 revenue outlook to $20.5 billion from $19.0 billion and its adjusted earnings per share outlook to $11.30 from $10.15. For the third quarter it guided to revenue between $5.25 billion and $5.55 billion and adjusted earnings per share between $2.88 and $3.08."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "U.S. Census Bureau", "url": "https://www.census.gov/manufacturing/m3/adv/pdf/durgd.pdf", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "ABD'de dayanıklı mal siparişleri haziranda yüzde 0,3 arttı", "en": "US durable goods orders rose 0.3 percent in June"}, "summary": {"tr": "Yeni siparişler 1,1 milyar dolar artarak 334,8 milyar dolar seviyesine çıktı. Mayısta yüzde 4,0 düşüş yaşanmıştı.", "en": "New orders increased $1.1 billion to $334.8 billion. May had recorded a 4.0 percent decline."}, "detail": {"tr": "Census Bureau'nun 27 Temmuz sabahı yayımladığı haziran öncü verisine göre dayanıklı mal siparişleri son dört ayın üçünde arttı. Ulaştırma hariç siparişler yüzde 0,6, savunma hariç yüzde 0,3 yükseldi. Artışa son on ayın dokuzunda yükselen bilgisayar ve elektronik ürünler öncülük etti: 0,9 milyar dolar ya da yüzde 3,1 artışla 31,1 milyar dolar. Sevkiyatlar yüzde 0,7 artarak 330,7 milyar dolar, bekleyen siparişler yüzde 0,6 artışla 1.590,1 milyar dolar, stoklar yüzde 0,3 artışla 602,0 milyar dolar seviyesine ulaştı. Savunma dışı sermaye malı siparişleri yüzde 1,2 artarak 97,8 milyar dolar oldu. Veriler mevsimsellikten arındırılmış, fiyat değişimlerine göre düzeltilmemiştir; yeni ve bekleyen sipariş rakamları yarı iletken üretimini kapsamıyor.", "en": "In the June advance estimate published by the Census Bureau on the morning of July 27, durable goods orders were up in three of the last four months. Orders excluding transportation rose 0.6 percent and excluding defense 0.3 percent. Computers and electronic products, up in nine of the last ten months, led the increase with a gain of $0.9 billion, or 3.1 percent, to $31.1 billion. Shipments rose 0.7 percent to $330.7 billion, unfilled orders 0.6 percent to $1,590.1 billion and inventories 0.3 percent to $602.0 billion. Nondefense capital goods orders increased 1.2 percent to $97.8 billion. The figures are adjusted for seasonality but not for price changes, and new and unfilled orders exclude semiconductor manufacturing."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "State Bank of Pakistan", "url": "https://www.sbp.org.pk/assets/document/publications/MPS-July-2026-Eng.pdf", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Pakistan Merkez Bankası politika faizini yüzde 11,5 seviyesinde tuttu", "en": "Pakistan's central bank keeps its policy rate at 11.5 percent"}, "summary": {"tr": "Para Politikası Komitesi oybirliğiyle faizi sabit bıraktı. Haziranda manşet enflasyon yüzde 11,1 seviyesine geriledi.", "en": "The Monetary Policy Committee held the rate unchanged unanimously. Headline inflation eased to 11.1 percent in June."}, "detail": {"tr": "Komite, orta vadede enflasyonu yüzde 5-7 hedef aralığına yöneltmek için mevcut duruşun uygun olduğunu değerlendirdi. Manşet enflasyon haziranda bir önceki ayın yüzde 11,7 seviyesinden yüzde 11,1 seviyesine indi; çekirdek enflasyon yüzde 8,4 ile yüksek kalmayı sürdürdü. Komite, Ortadoğu'daki çatışmanın yeniden alevlenmesini görünümün başlıca riski olarak gösterdi. Pakistan Merkez Bankası haziran sonu için 18 milyar dolar rezerv hedefini aştı; ancak son haftalardaki borç geri ödemelerinin ardından rezervler 17 Temmuz itibarıyla yaklaşık 17,3 milyar dolar seviyesine geriledi. FY26 döneminde cari işlemler açığı 139 milyon dolar seviyesinde kaldı. Geniş para arzı büyümesi yıllık yüzde 15,2 seviyesinden yüzde 13,2 seviyesine yavaşlarken özel sektör kredisi yüzde 14,9 seviyesine hızlandı. Komite FY27 için yüzde 3,5-4,5 büyüme öngörüyor.", "en": "The committee judged that the current stance remains appropriate to guide inflation toward the 5-7 percent medium-term target range. Headline inflation eased to 11.1 percent in June from 11.7 percent the previous month, while core inflation stayed elevated at 8.4 percent. The committee named the resurgence of conflict in the Middle East as the main risk to the outlook. Pakistan's central bank surpassed its end-June reserve target of $18 billion, but after substantial debt repayments in recent weeks reserves declined to around $17.3 billion as of July 17. The current account deficit was $139 million in FY26. Broad money growth slowed to 13.2 percent year on year from 15.2 percent, while private sector credit accelerated to 14.9 percent. The committee expects growth of 3.5-4.5 percent in FY27."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Global Banking \u0026 Finance Review", "url": "https://www.globalbankingandfinance.com/german-business-sentiment-rises-expected-july-ifo-survey/", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Almanya'da ifo iş iklimi temmuzda beklentinin üzerinde yükseldi", "en": "Germany's ifo business climate index rose above forecast in July"}, "summary": {"tr": "Endeks haziranda 85,7 iken temmuzda 86,6 seviyesine çıktı. Reuters anketindeki beklenti 86,0 idi.", "en": "The index rose to 86.6 in July from 85.7 in June. The Reuters poll had expected 86.0."}, "detail": {"tr": "Yükselişin kaynağı beklentiler tarafı oldu: ekonomik beklentiler alt endeksi haziranda 84,3 iken temmuzda 86,7 seviyesine çıktı. Mevcut durum değerlendirmesi ise 87,0 seviyesinden 86,5 seviyesine geriledi; şirketler bugünkü işlerinden bir önceki aya göre daha az memnun. ifo Başkanı Clemens Fuest, Basra Körfezi'ndeki belirsiz duruma rağmen Alman ekonomisinin daha az karamsar bir görüntü verdiğini söyledi. ING'den Carsten Brzeski art arda gelen artışın dayanıklılığı gösterdiğini, ancak yakın vadeli bir büyüme hızlanmasına işaret etmediğini belirtti. Pantheon Macroeconomics'ten Claus Vistesen iyileşmeyi kamu reformlarına, altyapı teşvikine ve jeopolitik gerilimin gevşemesine bağladı. Deutsche Bank'tan Marc Schattenberg ise Körfez'deki tırmanmanın ve enerji fiyatlarındaki artışın risk oluşturmayı sürdürdüğünü söyledi.", "en": "The gain came from the expectations side: the economic expectations sub-index rose to 86.7 in July from 84.3 in June. The assessment of the current situation slipped to 86.5 from 87.0, with companies somewhat less satisfied with business today than a month earlier. ifo President Clemens Fuest said that despite the uncertain situation in the Persian Gulf the German economy is showing less pessimism. Carsten Brzeski of ING said the consecutive increases demonstrate resilience but do not point to an imminent acceleration in growth. Claus Vistesen of Pantheon Macroeconomics attributed the improvement to government reforms, infrastructure stimulus and easing geopolitical tension. Marc Schattenberg of Deutsche Bank said escalation in the Gulf and rising energy prices continue to pose risks."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "ANTARA News", "url": "https://en.antaranews.com/news/424103/bank-indonesia-governor-perry-warjiyo-resigns", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Endonezya Merkez Bankası Başkanı Warjiyo görevinden ayrıldı", "en": "Bank Indonesia Governor Perry Warjiyo steps down"}, "summary": {"tr": "İstifa 27 Temmuz sabahı Devlet Sekreterliği Bakanı Prasetyo Hadi tarafından duyuruldu. Warjiyo'nun görev süresi 2028'de bitecekti.", "en": "The resignation was announced on the morning of July 27 by Minister of State Secretariat Prasetyo Hadi. Warjiyo's term was due to run until 2028."}, "detail": {"tr": "Duyuru merkez bankasının genel merkezinde yapıldı. Habere göre Warjiyo istifasını bir gün önce, 26 Temmuz'da sundu ve gerekçe olarak kişisel nedenler gösterildi. 2018'den bu yana iki dönem görev yapan Warjiyo'nun ikinci dönemi 2023-2028 yıllarını kapsıyordu. Kıdemli Başkan Yardımcısı Destry Damayanti, yeni başkan seçilene kadar vekâleten göreve getirildi. Prasetyo Hadi, yürürlükteki mekanizmalar ve yasalar, özellikle Bank Indonesia Kanunu uyarınca Cumhurbaşkanı'nın istifayı kabul ettiğini ve Warjiyo'nun yedi yıllık özverisi için şükranlarını ilettiğini belirtti.", "en": "The announcement was made at the central bank's headquarters. According to the report, Warjiyo submitted his resignation the previous day, on July 26, with personal reasons given as the cause. He had served two terms since 2018, the second covering 2023 to 2028. Senior Deputy Governor Destry Damayanti was named acting governor until a new governor is chosen. Prasetyo Hadi said that in accordance with applicable mechanisms and laws, particularly the Bank Indonesia Law, the President had accepted the resignation and expressed gratitude for Warjiyo's seven years of dedication."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Cadence Design Systems", "url": "https://www.sec.gov/Archives/edgar/data/0000813672/000081367226000089/cdns07272026ex9901.htm", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Cadence ikinci çeyrek gelirini 1,584 milyar dolar seviyesine taşıdı", "en": "Cadence lifts second-quarter revenue to $1.584 billion"}, "summary": {"tr": "Gelir bir yıl önceki 1,275 milyar dolar seviyesinden 1,584 milyar dolar seviyesine çıktı. Cadence 2026 beklentisini yükseltti.", "en": "Revenue rose to $1.584 billion from $1.275 billion a year earlier. Cadence raised its 2026 outlook."}, "detail": {"tr": "Menkul kıymetler düzenleyicisine sunulan gelir açıklamasına göre genel kabul görmüş muhasebe ilkelerine dayalı hisse başına kâr 0,59 dolar seviyesinden 1,33 dolar seviyesine, düzeltilmiş hisse başına kâr 1,65 dolar seviyesinden 2,11 dolar seviyesine yükseldi. Aynı ilkelere göre faaliyet marjı yüzde 19,0 seviyesinden yüzde 28,4 seviyesine, düzeltilmiş faaliyet marjı yüzde 42,8 seviyesinden yüzde 45,5 seviyesine çıktı. Çeyrek sonu bekleyen iş hacmi 8,1 milyar dolar, önümüzdeki on iki ayda gelir yazılması beklenen tutar 4,2 milyar dolar olarak açıklandı. Cadence 2026 gelir beklentisini 6,26 milyar dolar ile 6,34 milyar dolar arasına, düzeltilmiş hisse başına kâr beklentisini 8,05 dolar ile 8,15 dolar arasına yükseltti; üçüncü çeyrek için 2,01 dolar ile 2,07 dolar arasında düzeltilmiş hisse başına kâr öngörüyor.", "en": "According to the earnings release filed with the securities regulator, earnings per share under generally accepted accounting principles rose to $1.33 from $0.59, and adjusted earnings per share to $2.11 from $1.65. Operating margin on the same basis rose to 28.4 percent from 19.0 percent, and adjusted operating margin to 45.5 percent from 42.8 percent. End-of-quarter backlog was $8.1 billion, with $4.2 billion expected to be recognised as revenue over the next twelve months. Cadence raised its 2026 revenue outlook to between $6.26 billion and $6.34 billion and adjusted earnings per share to between $8.05 and $8.15, and guided to adjusted earnings per share between $2.01 and $2.07 for the third quarter."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Amkor Technology", "url": "https://www.businesswire.com/news/home/20260727961778/en/Amkor-Technology-Reports-Financial-Results-for-the-Second-Quarter-2026", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Amkor ikinci çeyrekte 1,90 milyar dolar ile rekor satış açıkladı", "en": "Amkor reports record second-quarter sales of $1.90 billion"}, "summary": {"tr": "Net satışlar yıllık yüzde 26, çeyreklik yüzde 12,6 arttı. Brüt marj yüzde 16,8 oldu.", "en": "Net sales rose 26 percent from a year earlier and 12.6 percent from the previous quarter. Gross margin was 16.8 percent."}, "detail": {"tr": "Yarı iletken paketleme ve test şirketi Amkor'un satışları bir önceki çeyrekteki 1,685 milyar dolar seviyesinden 1,90 milyar dolar seviyesine çıktı. Net kâr 174 milyon dolar, seyreltilmiş hisse başına kâr 0,70 dolar olarak açıklandı. Şirket üçüncü çeyrek için 1,95 milyar dolar ile 2,05 milyar dolar arasında net satış, yüzde 18,5-19,5 brüt marj, 180 milyon dolar ile 205 milyon dolar arasında net kâr ve 0,72 dolar ile 0,82 dolar arasında hisse başına kâr öngörüyor. 2026 yatırım harcaması beklentisi 2,5 milyar dolar ile 3,0 milyar dolar arasında korundu. Başkan ve Genel Müdür Kevin Engel, şirketin rekor ikinci çeyrek geliri ve güçlü kârlılık açıkladığını, bilgi işlem ile otomotiv ve sanayi son kullanım pazarlarında rekor gelire ulaşıldığını belirtti.", "en": "Sales at Amkor, a semiconductor packaging and test company, rose to $1.90 billion from $1.685 billion in the previous quarter. Net income was $174 million and diluted earnings per share $0.70. For the third quarter the company guided to net sales between $1.95 billion and $2.05 billion, gross margin of 18.5-19.5 percent, net income between $180 million and $205 million and earnings per share between $0.72 and $0.82. The 2026 capital expenditure outlook was maintained between $2.5 billion and $3.0 billion. President and Chief Executive Kevin Engel said the company delivered record second quarter revenue and strong profitability, with record revenue in its computing and automotive and industrial end markets."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Philips", "url": "https://www.philips.com/a-w/about/news/archive/corpcomms/news/press/2026/philips-second-quarter-results-2026.html", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Philips'in çeyrek marjını bir gümrük vergisi iadesi yukarı çekti", "en": "A tariff refund lifted Philips's quarterly margin"}, "summary": {"tr": "Satışlar 4,4 milyar avro, karşılaştırılabilir büyüme yüzde 4 oldu. Philips'in aldığı 186 milyon avro ABD gümrük vergisi iadesi marja yaklaşık 4,2 puan ekledi.", "en": "Sales were €4.4 billion with comparable growth of 4 percent. The €186 million US tariff refund Philips received added about 4.2 percentage points to the margin."}, "detail": {"tr": "Faaliyet kârı 609 milyon avro, düzeltilmiş faiz, vergi ve amortisman öncesi marj yüzde 16,4 olarak açıklandı; bu marjın yaklaşık 4,2 puanı ABD gümrük vergisi iadesinden geliyor. Karşılaştırılabilir sipariş girişi yüzde 1 geriledi. Philips serbest nakit akışı beklentisini 1,3 milyar avro ile 1,5 milyar avro arasından 1,5 milyar avro ile 1,7 milyar avro arasına yükseltti. 2026 için karşılaştırılabilir satış büyümesi beklentisi yüzde 3-4,5; düzeltilmiş marj beklentisi ise yüzde 12,5-13,0 seviyesinden yüzde 13,5-14,0 seviyesine çıkarıldı ve bu aralık yaklaşık 1 puanlık ABD gümrük vergisi katkısını içeriyor. Genel Müdür, çeyreğin tüm iş bölümlerinin katkısıyla yüzde 4 karşılaştırılabilir satış büyümesi getirdiğini söyledi.", "en": "Income from operations was €609 million and the adjusted EBITA margin 16.4 percent, of which about 4.2 percentage points came from the US tariff refund. Comparable order intake declined 1 percent. Philips raised its free cash flow outlook to between €1.5 billion and €1.7 billion from between €1.3 billion and €1.5 billion. For 2026 it guides to comparable sales growth of 3-4.5 percent, and it lifted its adjusted EBITA margin guidance to 13.5-14.0 percent from 12.5-13.0 percent, a range that includes roughly 1 percentage point of US tariff benefit. The chief executive said the quarter delivered comparable sales growth of 4 percent driven by all business segments."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Applied Digital", "url": "https://ir.applieddigital.com/news-events/press-releases/detail/159/applied-digital-reports-fiscal-fourth-quarter-and-full-year", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Applied Digital yıllık geliri 611,3 milyon dolar seviyesine çıkardı, zarar sürdü", "en": "Applied Digital lifts annual revenue to $611.3 million while losses continue"}, "summary": {"tr": "Mali dördüncü çeyrek geliri 258,7 milyon dolar oldu. Applied Digital'in yıllık net zararı 249,2 milyon dolar seviyesine ulaştı.", "en": "Fiscal fourth-quarter revenue was $258.7 million. Applied Digital's net loss for the year reached $249.2 million."}, "detail": {"tr": "Veri merkezi şirketinin dördüncü çeyrek geliri yıllık yüzde 407 arttı; adi hisse sahiplerine düşen net zarar 110,6 milyon dolar, düzeltilmiş faiz, vergi ve amortisman öncesi kâr 42,4 milyon dolar oldu. Çeyrekte veri merkezi kira geliri 44,1 milyon dolar taban kira ve 6,5 milyon dolar kiracı geri ödemesinden oluştu. Tüm mali yılda gelir yüzde 167 artışla 611,3 milyon dolar, düzeltilmiş kâr 107,2 milyon dolar seviyesine ulaştı. Applied Digital bulut hizmetleri işini 5 Mayıs 2026'da ayırarak Ekso Bionics ile birleştirdi; ortaya çıkan ChronoScale Holdings Nasdaq'ta CHRN koduyla işlem görüyor ve şirket yaklaşık yüzde 96 payı elinde tutuyor. Şirket ayrıca 15 yıllık üç kira sözleşmesi duyurdu: 300 megavatlık Delta Forge 1 ve 300 megavatlık Polaris Forge 3 için yaklaşık 7,5 milyar dolar, çeyrek sonrası imzalanan 210 megavatlık Delta Forge 2 için yaklaşık 5,2 milyar dolar sözleşmeli gelir.", "en": "Fourth-quarter revenue at the data centre company rose 407 percent year on year; the net loss attributable to common stockholders was $110.6 million and adjusted EBITDA $42.4 million. Data centre rental revenue in the quarter consisted of $44.1 million of base rent and $6.5 million of tenant recoveries. For the full fiscal year, revenue rose 167 percent to $611.3 million and adjusted EBITDA reached $107.2 million. Applied Digital separated its cloud services business on May 5, 2026, merging it with Ekso Bionics; the resulting ChronoScale Holdings trades on Nasdaq under CHRN and the company retains roughly 96 percent of it. It also announced three 15-year leases: about $7.5 billion of contracted revenue each for the 300-megawatt Delta Forge 1 and the 300-megawatt Polaris Forge 3, and about $5.2 billion for the 210-megawatt Delta Forge 2 signed after the quarter."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Rambus", "url": "https://www.sec.gov/Archives/edgar/data/0000917273/000119312526318063/rmbs-ex99_1.htm", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Rambus çeyrek gelirini ilk kez 200 milyon dolar seviyesinin üzerine taşıdı", "en": "Rambus takes quarterly revenue above $200 million for the first time"}, "summary": {"tr": "İkinci çeyrek geliri 207,4 milyon dolar oldu. Rambus'un faaliyetlerden nakit akışı 61,2 milyon dolar seviyesine ulaştı.", "en": "Second-quarter revenue was $207.4 million. Cash flow from operations at Rambus reached $61.2 million."}, "detail": {"tr": "Menkul kıymetler düzenleyicisine sunulan açıklamaya göre gelirin 99,2 milyon dolar tutarı ürün, 84,2 milyon dolar tutarı telif, 24,0 milyon dolar tutarı sözleşme ve diğer kalemlerden geldi. Genel kabul görmüş muhasebe ilkelerine göre seyreltilmiş hisse başına kâr 0,61 dolar, düzeltilmiş hisse başına kâr 0,77 dolar olarak açıklandı. Rambus üçüncü çeyrek için 210 milyon dolar ile 216 milyon dolar arasında toplam gelir öngörüyor; bu aralığın 110 milyon dolar ile 116 milyon dolar arası ürün, 69 milyon dolar ile 75 milyon dolar arası telif, 25 milyon dolar ile 31 milyon dolar arası sözleşme ve diğer gelirlerden bekleniyor. Üçüncü çeyrek düzeltilmiş hisse başına kâr beklentisi 0,75 dolar ile 0,82 dolar arasında. Başkan ve Genel Müdür Luc Seraphin, çeyreğin gelirde ve düzeltilmiş kârda şirketin gördüğü en yüksek seviyeyi getirdiğini, ürün gelirinin yıllık yüzde 20 seviyesinin üzerinde büyüdüğünü belirtti.", "en": "According to the release filed with the securities regulator, $99.2 million of revenue came from products, $84.2 million from royalties and $24.0 million from contract and other items. Diluted earnings per share under generally accepted accounting principles were $0.61 and adjusted earnings per share $0.77. For the third quarter Rambus guided to total revenue between $210 million and $216 million, of which between $110 million and $116 million is expected from products, between $69 million and $75 million from royalties and between $25 million and $31 million from contract and other revenue. Adjusted earnings per share are guided between $0.75 and $0.82. President and Chief Executive Luc Seraphin said the quarter delivered the company's highest revenue and adjusted earnings to date, with product revenue growing more than 20 percent year on year."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Federal Reserve Bank of Dallas", "url": "https://www.dallasfed.org/research/surveys/tmos/2026/2607", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Teksas imalat anketinde üretim hızlandı, istihdam endeksi geriledi", "en": "Production accelerated in the Texas factory survey while the employment index eased"}, "summary": {"tr": "Üretim endeksi haziranda 4,1 iken temmuzda 10,1 seviyesine çıktı. Dallas Fed anketinde istihdam endeksi 13,9 seviyesinden 12,2 seviyesine indi.", "en": "The production index rose to 10.1 in July from 4.1 in June. In the Dallas Fed survey the employment index fell to 12.2 from 13.9."}, "detail": {"tr": "Dallas Fed'in 27 Temmuz'da yayımladığı temmuz anketinde genel iş etkinliği endeksi 0,0 seviyesinden 1,3 seviyesine, yeni siparişler endeksi 2,3 seviyesinden 6,4 seviyesine yükseldi. Şirketlerin kendi görünümüne ilişkin endeks 11,1 puan artarak 13,4 seviyesine çıktı. Fiyat tarafında ayrışma sürüyor: hammadde fiyatları endeksi 42,4 seviyesinden 41,3 seviyesine, mamul fiyatları endeksi 28,6 seviyesinden 25,6 seviyesine geriledi; iki endeks arasındaki fark korunuyor. Ankete katılan bir matbaa üreticisi, gümrük vergilerinin ve savaşın belirsizlik yaratmayı ve marjları daraltmayı sürdürdüğünü bildirdi. Bir makine üreticisi ise petrole dayalı ekonominin uzun yıllar güçlü kalacağını, bir diğeri müşteri yoğunlaşmasının petrol ve gaz sektöründe alıcı pazarlık gücünü artırdığını belirtti.", "en": "In the July survey published by the Dallas Fed on July 27, the general business activity index rose to 1.3 from 0.0 and the new orders index to 6.4 from 2.3. The index of companies' own outlook gained 11.1 points to 13.4. On the price side the divergence persists: the raw materials prices index eased to 41.3 from 42.4 and the finished goods prices index to 25.6 from 28.6, leaving the gap between them intact. A printing manufacturer responding to the survey reported that tariffs and the war continue to create uncertainty and compress margins. A machinery manufacturer said the oil-based economy would stay strong for many years, while another noted that customer concentration is increasing buyers' bargaining power in the oil and gas sector."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "economics-markets", "tag": "crypto", "src": "Bitcoin.com News", "url": "https://news.bitcoin.com/ether-etfs-add-104-million-as-weekly-flows-triple-bitcoins-total/", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Ether fonlarına haftalık giriş bitcoin fonlarının üç katına çıktı", "en": "Weekly inflows into ether funds ran at three times those of bitcoin funds"}, "summary": {"tr": "20-24 Temmuz haftasında ether borsa yatırım fonlarına 103,90 milyon dolar, bitcoin fonlarına 33,79 milyon dolar girdi.", "en": "In the week of July 20-24, ether exchange-traded funds took in $103.90 million and bitcoin funds $33.79 million."}, "detail": {"tr": "Aynı haftada XRP fonlarına 8,15 milyon dolar, Solana fonlarına 7,2 milyon dolar giriş oldu; HYPE fonlarından 8,61 milyon dolar çıktı. Bitcoin tarafında toplam giriş, fonlar arasındaki büyük ayrışmayı gizliyor: ARK 21Shares ARKB fonuna 78,1 milyon dolar, Grayscale Bitcoin Mini fonuna 85,8 milyon dolar, Fidelity FBTC fonuna 35,2 milyon dolar girerken BlackRock IBIT fonundan 95,5 milyon dolar, Grayscale GBTC fonundan 83,7 milyon dolar çıktı. Bitcoin fonlarının toplam net varlıkları 77,82 milyar dolar olarak bildirildi. Habere göre kurumsal talep ether tarafına ağırlık veriyor ve bu ilgi yalnızca fiyatla sınırlı kalmıyor; sabit değerli kripto paralar, merkeziyetsiz finans, blok zinciri mutabakatı ve şirket hazine stratejilerindeki kullanıma da uzanıyor.", "en": "In the same week XRP funds took in $8.15 million and Solana funds $7.2 million, while HYPE funds saw $8.61 million of outflows. On the bitcoin side the net total conceals a wide split between funds: ARK 21Shares ARKB drew $78.1 million, Grayscale Bitcoin Mini $85.8 million and Fidelity FBTC $35.2 million, while BlackRock IBIT lost $95.5 million and Grayscale GBTC $83.7 million. Total net assets of bitcoin funds were reported at $77.82 billion. According to the report, institutional demand is tilted toward ether, and that interest is not limited to price alone; it extends to activity in stablecoins, decentralised finance, blockchain settlement and corporate treasury strategies."}, "editionDate": "2026-07-28"}], "visualBriefs": [{"id": "factory-demand-three-signals", "topic": "economics-market  {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-22/eco-capital-channels-rewired-1280.b032a238aa66.webp", "variants": [{"src": "/assets/briefs/2026-07-22/eco-capital-channels-rewired-640.033c97904ff3.webp", "width": 640}, {"src": "/assets/briefs/2026-07-22/eco-capital-channels-rewired-1280.b032a238aa66.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Kamu piyasası kemerleri, özel şirket koridoru, veri merkezleri ve bütünleşme çarkına ayrılan soyut sermaye yolları", "en": "Abstract capital routes branching toward public-market arches, a private-company corridor, data centers and an integration wheel"}, "generatedAt": "2026-07-22"}, "editionDate": "2026-07-22", "hasAnalysis": true}], "articles": [{"writer": "eco-01", "title": {"tr": "İndirim çağrısına karşılık üçte birlik bir zam ihtimali", "en": "A one-in-three chance of a hike answers the call for cuts"}, "excerpt": {"tr": "Faizlerin düşürülmesi isteniyor; vadeli piyasa ise Fed toplantısı için indirimi değil çeyrek puanlık bir artışı fiyatlıyor. Bu farkı kapatacak kalem akaryakıtta duruyor.", "en": "The call is for lower rates; ahead of the Fed meeting the futures market prices a quarter-point increase rather than a cut. The line that closes that gap sits in fuel."}, "sections": [{"h": {"tr": "Aynı toplantı, iki ayrı okuma", "en": "One meeting, two readings"}, "ps": [{"tr": "Faiz kararına iki gün kala kamuoyuna yönelen çağrı ile piyasanın fiyatladığı senaryo birbirinin tersi yönde duruyor. Başkan pazartesi günü faizlerin düşürülmesi gerektiğini söyledi; Fed Başkanı Kevin Warsh için övgü dolu bir ifade kullanırken indirime karşı çıkan bazı yetkilileri çok siyasi davranmakla suçladı. Aynı gün vadeli fiyatlamada işlemcilerin yaklaşık yüzde 68,5'i faizin yüzde 3,50-3,75 aralığında sabit kalmasını, kabaca üçte biri ise çeyrek puanlık bir artışı bekliyordu. Piyasanın fiyatladığı risk yukarı yönlü.", "en": "Two days before the decision, the public appeal and the scenario the market prices point in opposite directions. On Monday the president said rates should be lowered; he praised Fed Chair Kevin Warsh while accusing some officials who oppose cuts of acting very politically. On the same day futures pricing showed roughly 68.5 percent of traders expecting the rate to stay in its 3.50-3.75 percent range and about one in three expecting a quarter-point increase. The risk the market prices runs upward.", "refs": ["fed"]}, {"tr": "Bu dağılımın kendisi bir bilgi taşıyor. Sabit kalma senaryosunun üçte iki ağırlıkta olması, 28-29 Temmuz toplantısından çıkacak kararın büyük ölçüde beklendiğini gösteriyor; asıl bilgi kalan üçte birde. Tek bir toplantı için çeyrek puanlık artışa verilen bu ağırlık, katılımcıların enflasyonun yönüne dair ortak bir görüşe varmadığını söylüyor.", "en": "The distribution itself carries information. A two-thirds weight on no change says the outcome of the July 28-29 meeting is largely anticipated; the information sits in the remaining third. That much weight on a quarter-point increase at a single meeting says participants have not converged on a view about where inflation is heading.", "refs": ["fed"]}]}, {"h": {"tr": "Fiyatlamayı hangi kalem hareket ettiriyor", "en": "Which line actually moves the pricing"}, "ps": [{"tr": "Haziran verisine bakıldığında dağılımın nereden geldiği görünür hale geliyor. Tüketici fiyatları aylık bazda yüzde 0,4 geriledi, yıllık oran mayıstaki yüzde 4,2 seviyesinden yüzde 3,5 seviyesine indi ve çekirdek oran yüzde 2,6 seviyesine kadar düştü. Manşetle çekirdek arasındaki 0,9 puanlık aralığı taşıyan kalem belli: akaryakıt maliyetleri yıllık yüzde 15,7 arttı.", "en": "The June data show where that distribution comes from. Consumer prices fell 0.4 percent on the month, the annual rate eased to 3.5 percent from 4.2 percent in May, and core inflation came down to 2.6 percent. The line carrying the 0.9-point gap between headline and core is identifiable: fuel costs were up 15.7 percent from a year earlier.", "refs": ["fed"]}, {"tr": "O kalemin kaynağı pazartesi günü ucuzladı. Brent yüzde 9,13 düşüşle varil başına 87,94 dolar, WTI yüzde 7,94 düşüşle 82,22 dolar seviyesine indi; bir hafta önce fiyat 102 dolar seviyesine yaklaşmıştı. Ham petroldeki bu gerilemenin pompa fiyatına ve oradan tüketici sepetine geçmesi haftalar alır, dolayısıyla çarşamba günkü karara yetişmez. Buradan çıkan çıkarım şu: çeyrek puanlık artış ihtimalini ayakta tutan, manşet enflasyonun akaryakıta bağlı kısmı ve bu kalemdeki gerileme henüz veriye girmedi. Alternatif bir okuma da mümkün — yeni başkanın ileriye dönük yönlendirmeyi daraltması, katılımcıların beklenti dağılımını herhangi bir veri kaleminden bağımsız olarak genişletmiş olabilir.", "en": "The source of that line got cheaper on Monday. Brent fell 9.13 percent to $87.94 a barrel and WTI 7.94 percent to $82.22, and a week earlier prices had approached $102. A decline in crude takes weeks to reach the pump and from there the consumer basket, so it will not arrive in time for Wednesday's decision. The inference: what sustains the quarter-point increase probability is the fuel-driven part of headline inflation, and the decline in that line has not yet entered the data. An alternative reading is available — the new chair's narrowing of forward guidance may have widened the distribution of participants' expectations independently of any single data line.", "refs": ["fed", "oil"]}]}, {"h": {"tr": "Sonraki iki veri", "en": "The next two prints"}, "ps": [{"tr": "Buradan bir yön çağrısı çıkmaz, ama izlenebilir bir eşik çıkar. Ham petrol temmuz sonundaki seviyelerine yakın kalırsa, akaryakıtın yıllık enflasyona katkısının temmuz ve ağustos verilerinde daralması beklenir. Daralmazsa, manşetle çekirdek arasındaki aralığı taşıyan başka bir kalem var demektir ve bu da dağılımın neden kapanmadığını açıklar.", "en": "None of this yields a directional call, but it does yield a threshold worth watching. If crude holds near its late-July levels, fuel's contribution to annual inflation should narrow in the July and August prints. If it does not narrow, another line is carrying the gap between headline and core, and that would explain why the distribution has not closed.", "refs": ["fed", "oil"]}]}], "sources": [{"key": "fed", "kind": "news", "name": "Mortgage Professional America", "url": "https://www.mpamag.com/us/mortgage-industry/industry-trends/trump-renews-rate-pressure-on-fed-as-july-fomc-meeting-opens/583870", "title": {"tr": "Trump, Fed toplantısı açılırken faiz baskısını yeniledi", "en": "Trump renews rate pressure on the Fed as its July meeting opens"}, "publishedDate": "2026-07-27"}, {"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-02", "title": {"tr": "Yüzde 11,5 neyi savunuyor: fiyat düzeyini mi, rezervi mi?", "en": "What is 11.5 percent defending — the price level or the reserves?"}, "excerpt": {"tr": "Pakistan'da enflasyon hedefin çok üzerinde, ama cari açık neredeyse kapanmış durumda. Faizi sabit tutan komitenin kendi verisi, kredi yaratımının hangi tarafa kaydığını gösteriyor.", "en": "In Pakistan inflation is far above target, yet the current account has nearly closed. The committee's own data show which side credit creation has moved to."}, "sections": [{"h": {"tr": "Komitenin kendi gerekçesi", "en": "The committee's own reasoning"}, "ps": [{"tr": "Karar 27 Temmuz'da açıklandı: Pakistan Merkez Bankası'nın komitesi politika faizini oybirliğiyle yüzde 11,5 seviyesinde bıraktı ve mevcut duruşun enflasyonu orta vadede yüzde 5-7 hedef aralığına yöneltmek için uygun olduğunu değerlendirdi. Rakamlar bu değerlendirmeyi kolay kılmıyor: manşet enflasyon haziranda yüzde 11,7 seviyesinden yüzde 11,1 seviyesine indi, çekirdek enflasyon yüzde 8,4 ile yüksek kaldı. Politika faizi, hedefin yaklaşık iki katı bir manşet oranın karşısında duruyor.", "en": "The decision was announced on July 27: the committee of Pakistan's central bank unanimously left the policy rate at 11.5 percent, judging the current stance appropriate to guide inflation toward the 5-7 percent medium-term target range. The figures do not make that judgement easy: headline inflation eased to 11.1 percent in June from 11.7 percent, and core inflation stayed elevated at 8.4 percent. The policy rate sits against a headline rate roughly twice the target.", "refs": ["sbp"]}, {"tr": "Komitenin değişmiş saydığı şeyler ise fiyat düzeyinde değil, dış hesapta yer alıyor. Pakistan Merkez Bankası haziran sonu için konan 18 milyar dolar rezerv hedefini aştı; son haftalardaki borç geri ödemelerinin ardından rezervler 17 Temmuz itibarıyla yaklaşık 17,3 milyar dolar seviyesine geriledi ve aralık sonu için 20,20 milyar dolar hedefleniyor. FY26 döneminde cari işlemler açığı 139 milyon dolar seviyesinde kaldı; bir yıllık dış açık olarak bu, pratikte kapanmış bir hesap anlamına geliyor.", "en": "What the committee counts as changed sits in the external account rather than the price level. Pakistan's central bank surpassed its end-June reserve target of $18 billion; after recent debt repayments, reserves declined to about $17.3 billion as of July 17, with $20.20 billion targeted for end-December. The current account deficit was $139 million in FY26; as a year's external gap, that amounts to an account which has in practice closed.", "refs": ["sbp"]}]}, {"h": {"tr": "Kredi hangi taraftan geliyor", "en": "Which side the credit is coming from"}, "ps": [{"tr": "Asıl bilgi para ve kredi başlığında bulunuyor. Geniş para arzı büyümesi bir önceki toplantıdaki yüzde 15,2 seviyesinden yüzde 13,2 seviyesine yavaşladı. Aynı dönemde özel sektör kredisi yüzde 14,9 seviyesine hızlandı ve komiteye göre bu artış işletme sermayesi, sabit yatırım ile tüketici finansmanına yayılmış durumda. Net bütçe borçlanmasındaki büyüme ise yavaşladı.", "en": "The substance sits in the money and credit section. Broad money growth slowed to 13.2 percent from 15.2 percent at the previous meeting. Over the same period private sector credit accelerated to 14.9 percent, and the committee describes that increase as spread across working capital, fixed investment and consumer financing. Growth in net budgetary borrowing, meanwhile, slowed.", "refs": ["sbp"]}, {"tr": "İki serinin ters yönde hareket etmesi, toplam bir büyüklüğün yavaşlamasından fazlasını anlatıyor. Krediyi ticari banka açar, mevduat o kredinin gölgesi olarak doğar; dolayısıyla geniş para arzı yavaşlarken özel kredinin hızlanması, yaratımın durduğunu göstermez, el değiştirdiğini gösterir. Kamu tarafı çekilirken özel taraf devreye giriyor. Buradan çıkan çıkarım şu: yüzde 11,5, iç talebi bastırmaktan çok dış tamponu koruyan bir reel faiz düzeyi olarak tutuluyor. Daha sade bir alternatif de mümkün — manşet enflasyon hâlâ hedef bandının çok üzerinde olduğu için komite indirimi erken buluyor olabilir ve bu okuma dış hesaba dair ek bir anlatı gerektirmez.", "en": "The two series moving in opposite directions say more than a slowdown in one aggregate. The commercial bank makes the loan, and the deposit is born as that loan's shadow; so private credit accelerating while broad money slows does not show creation stopping, it shows creation changing hands. As the public side steps back, the private side steps in. The inference: 11.5 percent is being held as a real rate that protects the external cushion more than it suppresses domestic demand. A plainer alternative is available — with headline inflation still far above the target band, the committee may consider a cut premature, and that reading requires no additional story about the external account.", "refs": ["sbp"]}]}, {"h": {"tr": "Açık kalan soru", "en": "The question that stays open"}, "ps": [{"tr": "Bu okuma doğruysa, uyum yükü faizden çok rezerv birikimine biner ve bunun kendi takvimi var. Komite FY27 döneminde cari açığın milli gelirin yüzde 0 ile yüzde 1 arasında kalmasını, büyümenin ise yüzde 3,5-4,5 aralığında gerçekleşmesini bekliyor. Özel sektör kredisi geniş para arzının üzerinde büyümeyi sürdürürse ithalatı besleyen iç talep de artabilir; o durumda aralık sonu için konan 20,20 milyar dolar rezerv hedefi, faiz kararlarından daha çok şey söyleyen sayı haline gelir.", "en": "If that reading holds, the burden of adjustment falls on reserve accumulation more than on the rate, and that has its own timetable. The committee expects the current account deficit to stay between 0 percent and 1 percent of GDP in FY27, with growth of 3.5-4.5 percent. If private sector credit keeps growing faster than broad money, the domestic demand that feeds imports may rise with it; in that case the $20.20 billion end-December reserve target becomes the number that says more than the rate decisions do.", "refs": ["sbp"]}]}], "sources": [{"key": "sbp", "kind": "news", "name": "State Bank of Pakistan", "url": "https://www.sbp.org.pk/assets/document/publications/MPS-July-2026-Eng.pdf", "title": {"tr": "Pakistan Merkez Bankası politika faizini yüzde 11,5 seviyesinde tuttu", "en": "Pakistan's central bank keeps its policy rate at 11.5 percent"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-03", "title": {"tr": "Celestica'da yüzde 62 büyüme, yüzde 8,2 marjla geliyor", "en": "At Celestica 62 percent growth arrives on an 8.2 percent margin"}, "excerpt": {"tr": "Celestica geliri bir yılda neredeyse iki katına çıkardı ve yıl beklentisini yükseltti. Yükseltmenin içindeki asıl varsayım gelirde değil, kârın gelirden daha hızlı artırılmasında saklı.", "en": "Celestica nearly doubled revenue in a year and raised its full-year outlook. The assumption inside that raise sits not in revenue but in earnings being lifted faster than sales."}, "sections": [{"h": {"tr": "Yükseltmenin aritmetiği", "en": "The arithmetic of the raise"}, "ps": [{"tr": "İkinci çeyrek geliri Celestica'da bir yıl önceki 2,89 milyar dolar seviyesinden 4,70 milyar dolar seviyesine, düzeltilmiş hisse başına kâr 1,39 dolar seviyesinden 2,54 dolar seviyesine çıktı ve her ikisi de şirketin kendi beklenti aralığının üst sınırını aştı. Büyümenin kaynağı tek bir bölüm: Bağlantı ve Bulut Çözümleri yüzde 84 artışla 3,81 milyar dolar seviyesine ulaşırken İleri Teknoloji Çözümleri yüzde 8 artışla 0,89 milyar dolar seviyesinde kaldı. Donanım platformu satışları yüzde 58 artışla yaklaşık 1,9 milyar dolar oldu.", "en": "Second-quarter revenue at Celestica rose to $4.70 billion from $2.89 billion a year earlier and adjusted earnings per share to $2.54 from $1.39, both above the top of the company's own guidance range. The growth comes from one segment: Connectivity and Cloud Solutions rose 84 percent to $3.81 billion while Advanced Technology Solutions rose 8 percent to $0.89 billion. Hardware platform sales grew 58 percent to about $1.9 billion.", "refs": ["celestica"]}, {"tr": "Yıl beklentisindeki değişiklik iki ayrı hareket içeriyor ve ikisinin oranı aynı değil. Gelir beklentisi 19,0 milyar dolar seviyesinden 20,5 milyar dolar seviyesine çıkarıldı; bu yaklaşık yüzde 8 bir artışa denk geliyor. Düzeltilmiş hisse başına kâr beklentisi ise 10,15 dolar seviyesinden 11,30 dolar seviyesine yükseltildi; bu da yaklaşık yüzde 11. Celestica, gelire eklediğinden oransal olarak fazlasını kâra ekliyor.", "en": "The change in the full-year outlook contains two separate moves, and their proportions differ. The revenue outlook was raised to $20.5 billion from $19.0 billion, which works out at about 8 percent. The adjusted earnings per share outlook was raised to $11.30 from $10.15, about 11 percent. Celestica is adding proportionally more to earnings than it is adding to revenue.", "refs": ["celestica"]}]}, {"h": {"tr": "Marjın taşıd
