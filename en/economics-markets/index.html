e 2. Bu ölçekteki artışlar, görüşmeye devam etme ve inceleme erişimi kazanma bedeli gibi duruyor; hedefin değerlemesine ilişkin yeni bir bilgi taşıdıklarına dair bir veri yok.", "en": "The sequence is instructive: A$21.64 at the start of July was rejected, then came A$22.07, and now A$22.50. The first step was about 2%, and the second about 2% as well. Increments of that size look like the price of staying in the conversation and gaining due-diligence access; nothing in the reporting shows they carry new information about the target's valuation.", "refs": ["eqt-perpetual"]}, {"tr": "Karşı okuma da mümkün: küçük ve tekrarlanan artışlar rakip bir talibin varlığında da görülür ve hedefin kurulu her adımda daha yüksek bir taban elde eder. Bu ikisini ayıracak gözlem, kurulun inceleme erişimi verip vermediği ve Bain Capital işleminin takvimde nerede durduğudur. Servet yönetimi satışı gecikirse, 22,50 rakamı bu dosyada anlamlı sayı olmaktan çıkar.", "en": "A competing reading is available: small repeated increases also appear when a rival suitor is present, and the target's board wins a higher floor at every step. What would separate the two is whether the board grants due-diligence access and where the Bain Capital transaction sits in the timetable. If the wealth management sale slips, A$22.50 stops being the meaningful number in this file.", "refs": ["eqt-perpetual"]}]}], "sources": [{"key": "eqt-perpetual", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/eqt-raises-takeover-offer-for-australia-wealth-manager-perpetual", "title": {"tr": "EQT, Perpetual için teklifini yaklaşık 2,6 milyar Avustralya dolarına yükseltti", "en": "EQT raises its takeover offer for Perpetual to about A$2.6 billion"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "eco-04", "title": {"tr": "Kar, kesilen elektrik ve duran bakır", "en": "Snow, cut power and stalled copper"}, "excerpt": {"tr": "Şili'de üretimi durduran şey yol erişimi ve elektrik. Etkilenen kapasitenin günlük karşılığı ise kesintinin gün mü hafta mı sürdüğü bilinmeden okunamaz.", "en": "Road access and power are what stopped production in Chile. The daily equivalent of the affected capacity cannot be read without knowing whether the outage runs in days or in weeks."}, "sections": [{"h": {"tr": "Hangi ocak, hangi kısıt", "en": "Which mine, which constraint"}, "ps": [{"tr": "Yayımlanan haberlere göre Codelco, Andina'daki yüzey işlemlerini ve El Teniente açık ocağından cevher sevkiyatını durdurdu. Anglo American Los Bronces'ta riskleri değerlendirdi, Antofagasta Los Pelambres'te zorunlu olmayan işleri azalttı, Lundin Mining'in Caserones tesisi ise kar yağışı elektriği kestikten sonra üretime ara verdi.", "en": "Published reports say Codelco halted surface operations at Andina and ore shipments from the El Teniente open pit. Anglo American assessed hazards at Los Bronces, Antofagasta scaled back non-essential work at Los Pelambres, and Lundin Mining's Caserones stopped after snowfall cut power.", "refs": ["chile-copper"]}, {"tr": "Listedeki ortak nokta yükseklik: bunlar yüksek rakımlı işletmeler ve bağlayıcı kısıt yola erişim ile elektrik; cevher yerinde duruyor. Financial Times'ın işaret ettiği gibi metal talebindeki artış, tam da hava koşullarına açık ve tenörü düşen bu tür madenlere dayanıyor. Bu ayrım önemli: durdurulan kapasite, ancak kesinti süresiyle orantılı bir tonaj kaybına dönüşür.", "en": "The common feature on that list is altitude: these are high-altitude operations, and the binding constraint is road access and electricity, while the deposit stays where it is. As the Financial Times notes, the rise in metal demand rests precisely on mines of this kind — weather-exposed, with declining grades. The distinction matters: suspended capacity converts into lost tonnage only in proportion to the length of the outage.", "refs": ["chile-copper"]}]}, {"h": {"tr": "Günlük karşılığı hesaplamak", "en": "Working out the daily equivalent"}, "ps": [{"tr": "Aynı haberlerde etkilenen tesislerin toplam yıllık kapasitesi yaklaşık 1,6 milyon ton olarak veriliyor. Bunu takvime bölmek işi somutlaştırır: günde kabaca 4.400 ton. Üç günlük bir duraklama yaklaşık 13.000 tona denk gelir, bir haftalık duraklama 30.000 tonun biraz üzerine çıkar. Yıllık kapasite başlığı büyük görünür; kesintinin süresi bilinmeden bu başlık bir arz kaybı ölçüsü değildir.", "en": "The same reports put the combined annual capacity of the affected operations at about 1.6 million tonnes. Dividing that by the calendar makes it concrete: roughly 4,400 tonnes a day. A three-day halt is about 13,000 tonnes; a week is a little over 30,000. The annual-capacity headline looks large, but without the duration of the outage it is not a measure of lost supply.", "refs": ["chile-copper"]}, {"tr": "Haberlerde durdurmaların çoğunun doğrulanmış hasardan çok önlem amaçlı olduğu belirtiliyor; bu, işletmelerin hava düzeldiğinde hızla dönmesini bekleten bir tespit. Karşı ihtimal de açık: elektrik altyapısında veya erişim yollarında onarım gerektiren bir hasar çıkarsa, duraklama önlem süresini aşar. Ayırt edici gözlem, şirketlerin işletme bazında yayımlayacağı yeniden başlatma duyuruları ve çeyrek üretim rakamlarının revize edilip edilmediğidir.", "en": "The reports describe most of the halts as precautionary rather than a response to confirmed damage, which points to a quick return once the weather clears. The other possibility is open: if repairs are needed to power infrastructure or access roads, the stoppage will outlast the precaution. The distinguishing observation is the restart notices companies publish operation by operation, and whether quarterly production figures are revised.", "refs": ["chile-copper"]}]}], "sources": [{"key": "chile-copper", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/cd0b6148-a9a7-4763-b6d3-bb33e10b9899", "title": {"tr": "Şili'deki fırtına bakır madenlerinde üretimi kesintiye uğrattı", "en": "A storm in Chile disrupts output at copper mines"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "eco-05", "title": {"tr": "Kâr yüzde 18,7 arttı, ücret bu veride görünmüyor", "en": "Profits rose 18.7% and the data never shows wages"}, "excerpt": {"tr": "Çin'in sanayi kârı verisi işletmeleri ölçüyor, haneleri değil. İçindeki tek kişi başına rakam ise ücrete değil, çalışan sayısına işaret ediyor.", "en": "China's industrial profit release measures firms, not households. Its single per-head figure points not to pay but to headcount."}, "sections": [{"h": {"tr": "Kâr, ciroyu üç katı hızla geçti", "en": "Profit outran revenue threefold"}, "ps": [{"tr": "Ulusal İstatistik Bürosu'na göre ocak-haziran döneminde belirli ölçeğin üzerindeki sanayi işletmelerinin kârı yüzde 18,7 artarak 3,95 trilyon yuana çıktı. Aynı dönemde ciro yüzde 6,5 artışla 69,26 trilyon yuan oldu ve ciro kârlılığı 0,59 puan yükselerek yüzde 5,70'e ulaştı.", "en": "According to the National Bureau of Statistics, profits at industrial firms above a designated size rose 18.7% to 3.95 trillion yuan from January to June. Over the same period revenue rose 6.5% to 69.26 trillion yuan, and the return on revenue rose 0.59 percentage points to 5.70%.", "refs": ["china-profits"]}, {"tr": "Bu üç sayı birlikte ilginç bir aritmetik veriyor. 69,26 trilyon yuanlık ciro üzerinde 0,59 puanlık marj kazancı, kabaca 400 milyar yuana denk düşüyor. Kâr artışının önemli bir bölümü, satılan her yüz yuandan elde tutulan payın büyümesinden geliyor; hacim artışı bu kalemin gerisinde kalıyor. Verinin kendi ifadesiyle yüz yuan cironun maliyeti bir önceki yıla göre 0,55 yuan azalarak 84,89 yuana indi.", "en": "Those three numbers produce an interesting piece of arithmetic. A gain of 0.59 percentage points of margin on 69.26 trillion yuan of revenue is worth roughly 400 billion yuan. A substantial part of the profit increase comes from a larger share retained on every hundred yuan sold, with volume growth trailing behind. In the release's own terms, the cost embedded in a hundred yuan of revenue fell 0.55 yuan from a year earlier, to 84.89 yuan.", "refs": ["china-profits"]}]}, {"h": {"tr": "Bu veri kimi ölçüyor, kimi ölçmüyor", "en": "Whom the data counts, and whom it leaves out"}, "ps": [{"tr": "Açıklamada ücret serisi yok. Emeğe en yakın duran rakam, kişi başına ciro: haziran sonunda 1,91 milyon yuan olarak verilmiş ve bir önceki yıla göre 0,13 milyon yuan artmış. Bu yaklaşık yüzde 7,1'lik bir artış demek. Ciro ise yüzde 6,5 artmış. İki oran arasındaki fark, kapsanan işletmelerde çalışan sayısının bir miktar gerilediğine işaret ediyor.", "en": "The release contains no wage series. The figure that sits closest to labour is revenue per person: 1.91 million yuan at the end of June, up 0.13 million yuan from a year earlier. That is a rise of about 7.1%, against revenue growth of 6.5%. The gap between the two rates points to a modest fall in headcount at the firms covered.", "refs": ["china-profits"]}, {"tr": "Bu çıkarımı yumuşatan bir alternatif var: kapsam her yıl belirli ölçeğin üzerindeki işletmelere göre yeniden belirleniyor, dolayısıyla oranlardaki fark istihdam değişiminden çok örneklem bileşimindeki kaymadan da doğabilir. Bu yüzden veriden ulusal bir istihdam sonucu çıkarmak doğru olmaz; verinin ücret sorusuna yanıt vermediği ise açıktır.", "en": "One alternative softens that inference: the coverage is redefined each year around firms above a designated size, so the difference between the two rates could reflect a shift in sample composition rather than a change in employment. It would therefore be wrong to draw a national employment conclusion from this, and the release plainly does not answer a question about pay.", "refs": ["china-profits"]}]}, {"h": {"tr": "Kâr nerede arttı, kim orada çalışıyor", "en": "Where profit grew, and who works there"}, "ps": [{"tr": "Sektör ayrımı bu boşluğu daha da anlamlı kılıyor. Demir dışı metal işlemede kâr yüzde 99,4, bilgisayar ile iletişim ve diğer elektronik cihaz üretiminde yüzde 96,9 arttı. Buna karşılık otomotivde yüzde 19,5, demir-çelikte yüzde 25,0, metalik olmayan mineral ürünlerde yüzde 47,8 düşüş var. Toplamı yukarı taşıyan kalemler ile daralan kalemler aynı ölçekte iş gücü barındırmıyor; bu nedenle güçlü bir toplam ile zorlanan bir istihdam tablosu aynı anda var olabilir.", "en": "The sector split makes that gap more consequential. Profits rose 99.4% in non-ferrous metal smelting and rolling and 96.9% in computer, communications and other electronic equipment manufacturing. Against that, motor vehicle manufacturing fell 19.5%, ferrous metal smelting and rolling 25.0%, and non-metallic mineral products 47.8%. The lines carrying the total upward and the lines contracting do not employ people on the same scale, which is why a strong aggregate and a strained employment picture can coexist.", "refs": ["china-profits"]}, {"tr": "Bunun hane bütçesine ne yaptığını söylemek için gereken veri başka yerde: ücret ve istihdam istatistikleri. Sonbaharda yayımlanacak kentli ücret ve istihdam serileri, daralan sektörlerdeki kayıpların kârı büyüten sektörlerdeki kazançlarla telafi edilip edilmediğini gösterecek. O seriler gelene kadar, kâr artışını hane geliriyle eşitleyen her cümle veriden fazlasını söylemiş olur.", "en": "Saying what this does to a household budget requires data held elsewhere: wage and employment statistics. The urban pay and employment series due in the autumn will show whether losses in the contracting sectors are offset by gains in the ones expanding profit. Until they arrive, any sentence equating profit growth with household income claims more than the data supports.", "refs": ["china-profits"]}]}], "sources": [{"key": "china-profits", "kind": "news", "name": "National Bureau of Statistics of China", "url": "https://www.stats.gov.cn/sj/zxfb/202607/t20260727_1964194.html", "title": {"tr": "Çin'de sanayi kârı yılın ilk yarısında yüzde 18,7 arttı", "en": "China's industrial profits rose 18.7% in the first half"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-06", "title": {"tr": "Dayanak fiyatlandı, kaldıraç kaybolmadı", "en": "The underlying got a price; the leverage did not disappear"}, "excerpt": {"tr": "CXMT'nin borsaya gelişi türev platformlarına dışarıdan bir fiyat sağlıyor. Vadesiz sözleşmenin teminat, tasfiye ve teslimatsızlık yapısı ise aynı yerde duruyor.", "en": "CXMT's listing gives derivatives venues an external price. The perpetual contract's collateral, liquidation and no-delivery structure remains exactly where it was."}, "sections": [{"h": {"tr": "Erişim bir sözleşmeye taşındı", "en": "Access moved into a contract"}, "ps": [{"tr": "Financial Times, yatırımcıların Çin'in yapay zekâ ile ilişkilendirilen hisselerine kripto borsalarında işlem gören süresiz vadeli sözleşmeler üzerinden pozisyon aldığını bildiriyor. Bu araçların vade sonu yok; teminat çoğunlukla sabit değerli kripto varlıklarla veriliyor ve sözleşme, dayanak hissenin fiyatına bağlı bir ödeme yükümlülüğü taşıyor. Yabancıların Çin hisse piyasasına doğrudan erişim kısıtını dolaşan yatırımcı, hissenin kendisini ya da onun sağladığı ortaklık hakkını almıyor. Elindeki şey bir platformun teminat ve tasfiye kurallarına bağlı sentetik pozisyon.", "en": "The Financial Times reports that investors are taking exposure to Chinese AI-linked shares through perpetual futures traded on crypto exchanges. The instruments have no expiry; collateral is usually posted in stablecoins and the contract carries a payment obligation linked to the underlying share price. An investor working around restrictions on direct foreign access to Chinese equities does not receive the share or its ownership rights. What remains is a synthetic position governed by a venue's margin and liquidation rules.", "refs": ["crypto-china-ai"]}, {"tr": "Bu yapının dayanaklarından CXMT artık halka açık bir fiyata sahip. Şirket halka arzını 8,66 yuandan yaptı, 57,92 milyar yuan topladı ve hisse Şanghay'daki ilk gününde yüzde 500'den fazla yükselerek son olarak 52 yuandan işlem gördü. Financial Times'ın aktardığına göre şirketin fiyatına bağlı bir sözleşme, halka arzdan önce merkeziyetsiz bir türev platformunda işlem görüyordu. Halka arz, platformun kendi iç fiyatının yanına gözlemlenebilir bir borsa fiyatı koydu; sözleşmeyi hisseye dönüştürmedi.", "en": "One of those underlyings, CXMT, now has a public price. The company offered shares at 8.66 yuan, raised 57.92 billion yuan and rose more than 500% on its first day in Shanghai, last trading at 52 yuan. According to the Financial Times, a contract tied to the company's price traded on a decentralised derivatives platform before the offering. The listing placed an observable exchange price beside the venue's internal market; it did not turn the contract into a share.", "refs": ["cxmt-debut", "crypto-china-ai"]}]}, {"h": {"tr": "Referans dışarıda, tasfiye içeride", "en": "The reference is outside; liquidation stays inside"}, "ps": [{"tr": "Dışarıdan gelen fiyat önemli bir tampon: platformun referansı artık yalnızca kendi kullanıcılarının işlemlerine dayanmak zorunda değil. Fakat yüzde 500'ü aşan bir borsa hareketi, referansın kamuya açık olmasının onu yumuşak yapmadığını da gösteriyor. Süresiz sözleşmede teslimat bulunmadığından kayıp ve kazanç hâlâ platformun kullandığı fiyat, teminat koşulları ve tasfiye motoru üzerinden dağıtılır. Halka arz referans belirsizliğini azaltabilir; kaldıraç ile zorunlu tasfiye kanalını ortadan kaldırmaz. Karşı sav güçlüdür: şeffaf bir borsa fiyatı, platform içi fiyat döngüsünü sınırlayıp sözleşmeyi sıradan bir fark ürününe yaklaştırabilir.", "en": "An external price is a meaningful buffer: the venue's reference need no longer depend only on trades among its own users. A listed move of more than 500% also shows that a public reference is not necessarily a gentle one. With no delivery in a perpetual, gains and losses are still distributed through the venue's chosen price, collateral terms and liquidation engine. The listing can reduce reference ambiguity; it does not remove leverage or forced liquidation. The counter-case is strong: a transparent exchange price can constrain an internal price loop and make the contract behave more like an ordinary synthetic product.", "refs": ["crypto-china-ai", "cxmt-debut"]}, {"tr": "Buradan sistemik çöküş sonucu çıkmaz. Eldeki haberler bu platformların teminat havuzlarını, pozisyon limitlerini, tasfiye sırasını ya da birbirlerine olan yükümlülüklerini göstermiyor; aktarım zinciri kurulmadan fiyat sıçraması yalnızca sert bir şoktur. Belgelenebilen kırılganlık daha dardır: yatırımcı erişim kısıtını aşarken hisse sahipliği yerine tek bir platformun sözleşme kurallarına maruz kalıyor. Dayanıklılığı ayıracak bilgi, kullanılan referans fiyatın, teminat iskonto oranlarının ve tasfiye mekanizmasının açıklanmasıdır. Dayanak artık görünür; riskin nerede emileceği hâlâ sözleşmenin içinde.", "en": "None of this establishes a systemic collapse. The reporting at hand does not show these venues' collateral pools, position limits, liquidation sequence or obligations to one another; without a transmission chain, a price jump is only a severe shock. The documented fragility is narrower: in working around an access restriction, an investor replaces share ownership with exposure to one venue's contract rules. The information that separates resilience from fragility is disclosure of the reference price, collateral haircuts and liquidation mechanism. The underlying is now visible; where the risk is absorbed still sits inside the contract.", "refs": ["crypto-china-ai", "cxmt-debut"]}]}], "sources": [{"key": "crypto-china-ai", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/af333b9c-d59d-4e7c-b814-12cef578895d", "title": {"tr": "Yatırımcılar Çin yapay zekâ hisselerine kripto borsaları üzerinden pozisyon alıyor", "en": "Investors are taking positions in Chinese AI stocks through crypto exchanges"}, "publishedDate": "2026-07-26"}, {"key": "cxmt-debut", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/cxmt-china-market-debut-chipmaker-ipo.html", "title": {"tr": "Çinli bellek üreticisi CXMT Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi", "en": "Chinese memory maker CXMT rises more than 500% on its Shanghai debut"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-01", "title": {"tr": "Cuma yeşildi, hafta kırmızı", "en": "Friday closed green, the week closed red"}, "excerpt": {"tr": "Üç endeksin cuma kapanışı haftanın yönünü değiştirmedi. Fiyatın neyi tarttığını anlamak için tek güne değil, harcamaya bakmak gerekiyor.", "en": "Friday's closes did not change the week's direction. To see what price is weighing, look at spending rather than at a single session."}, "sections": [{"h": {"tr": "Tek gün ile hafta arasındaki açı", "en": "The angle between one day and one week"}, "ps": [{"tr": "24 Temmuz Cuma kapanışında S\u0026P 500 yüzde 0,05 artışla 7.411,98, Dow Jones Sanayi Endeksi yüzde 0,46 yükselişle 51.947,25 seviyesindeydi; Nasdaq Composite ise yüzde 0,64 düşüşle 24.975,82'ye indi. Aynı hafta S\u0026P 500 ve Nasdaq üst üste ikinci, Dow üçüncü haftalık kaybını yazdı. Günlük kapanış ile haftalık yön arasındaki bu açı, tek seansın yatırımcıya çok az şey anlattığı durumlardan biri.", "en": "At Friday's close on 24 July the S\u0026P 500 stood at 7,411.98, up 0.05%, and the Dow Jones Industrial Average at 51,947.25, up 0.46%, while the Nasdaq Composite fell 0.64% to 24,975.82. Over the same week the S\u0026P 500 and the Nasdaq posted a second consecutive weekly loss and the Dow a third. That angle between the daily close and the weekly direction is one of the cases where a single session tells an investor very little.", "refs": ["week"]}, {"tr": "S\u0026P 500 ve Nasdaq için üst üste ikinci, Dow için üçüncü haftalık kaybın, iki endeksin yükseldiği bir cuma gününe rağmen yazılması, satışın seans içinde değil önceki günlerde gerçekleştiğini gösteriyor. Bu tabloyu okumanın iki yolu var: ya hafta boyunca beklenti aşağı çekildi, ya da haftanın son günü zayıf hacimli bir toparlanmaydı. Kapanış verileri tek başına ikisini ayırmaya yetmiyor.", "en": "A second consecutive weekly loss for the S\u0026P 500 and the Nasdaq, and a third for the Dow, landing despite a Friday on which two indexes rose, says the selling happened earlier in the week rather than in Friday's session. There are two ways to read that: either expectations were marked down across the week, or the final day was a thin recovery. Closing data alone do not separate the two.", "refs": ["week"]}]}, {"h": {"tr": "Bilanço iyi geldi, hisse geriledi", "en": "The results beat, the shares fell"}, "ps": [{"tr": "Intel gelir ve kâr öngörüsünü beklentilerin üzerinde açıkladı, hissesi yine de yüzde 3,8 geriledi. Alphabet ve Tesla bilançoları ise yapay zekâ yatırım harcamasına dair endişeleri artırdı. Rakamın iyi, tepkinin kötü olduğu bu örüntü, piyasanın çeyreklik sonucu değil o sonucu üretmek için taahhüt edilen sermayeyi fiyatladığı yorumunu güçlendiriyor.", "en": "Intel guided revenue and profit above estimates and its shares still fell 3.8%, while results from Alphabet and Tesla sharpened concern about artificial-intelligence capital spending. That pattern of a good number and a poor reaction strengthens the reading that the market is pricing the capital committed to produce the result rather than the quarter itself.", "refs": ["week"]}, {"tr": "Bununla birlikte alternatif bir açıklama duruyor: aynı hafta Brent yüzde 12'nin üzerinde değer kazandı ve enerji maliyetindeki bu artış sektör ayrımı gözetmeden çarpanları aşağı çekmiş olabilir. Bu durumda tepki şirkete özgü bir harcama endişesi değil, iskonto oranının yeniden fiyatlanması olur. İki açıklama aynı fiyat hareketiyle uyumlu.", "en": "An alternative explanation stands alongside it, however: Brent gained more than 12% over the same week, and that rise in energy costs could have compressed multiples without regard to sector. In that case the reaction is a repricing of the discount rate rather than a company-specific worry about spending. Both explanations fit the same price move.", "refs": ["week"]}]}, {"h": {"tr": "Ayrımı hangi veri yapar?", "en": "Which data would separate them"}, "ps": [{"tr": "Ayrımı yapacak gözlem basit. Önümüzdeki haftalarda enerji fiyatı gerilerken sermaye harcamasını artıran şirketlerin hisseleri geride kalmaya devam ederse, harcama endişesi açıklaması güçlenir. Petrol gerilediğinde harcama yapan ve yapmayan şirketler birlikte toparlanırsa, hareketin iskonto oranından geldiği görüşü ağır basar. Her iki durumda da tek bir kapanış bunu doğrulamaya yetmez.", "en": "The observation that would separate them is simple. If shares of companies raising capital spending keep lagging in the coming weeks while energy prices ease, the spending-worry explanation gains ground. If heavy spenders and light spenders recover together once oil retreats, the discount-rate reading carries more weight. Either way a single close cannot confirm it.", "refs": ["week"]}]}], "sources": [{"key": "week", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/here-are-4-forces-that-drove-a-tough-week-for-stocks.html", "title": {"tr": "CNBC hisse senetleri için zorlu geçen haftanın dört itici gücünü sıralıyor", "en": "CNBC lists the four forces behind a tough week for stocks"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-02", "title": {"tr": "Meksika'da pompadaki farkı kim karşılıyor?", "en": "Who covers the difference at a Mexican pump"}, "excerpt": {"tr": "Meksika'da akaryakıt tavanı bir fiyat kararı değil, bir maliye kararı. Yükü hangi bilançonun taşıdığı sorusu burada başlıyor.", "en": "Mexico's fuel cap is a fiscal decision rather than a price decision. The question of which balance sheet carries the burden starts there."}, "sections": [{"h": {"tr": "Tavanın dayandığı iki kaldıraç", "en": "The two levers under the cap"}, "ps": [{"tr": "Bir akaryakıt tavanını ayakta tutan şey pompadaki etiket değil, arkasındaki iki kaldıraçtır: akaryakıt istasyonlarının yüzde 96'sını temsil eden şirketlerin katıldığı gönüllü bir anlaşma ve hükûmetin akaryakıt üzerindeki IEPS özel tüketim vergisini geçici olarak azaltma yetkisi. Meksika'da bu düzenek Magna benzinin litre fiyatını 24 pesonun altında, motorini 27 pesoda tutuyor. Enerji Bakanı Luz Elena González Escobar ikinci kaldıracı daha önce dile getirmişti.", "en": "What holds a fuel cap in place is the pair of levers behind it rather than the label at the pump: a voluntary agreement joined by companies representing 96% of service stations, and the government's power to reduce the IEPS excise tax on fuel temporarily. In Mexico that arrangement keeps Magna petrol below 24 pesos a litre and diesel at 27 pesos. Energy Minister Luz Elena González Escobar has raised the second lever before.", "refs": ["mexico"]}, {"tr": "Bir yönetilen fiyat, ortodoks anlatının önerdiği gibi talebi bastırarak değil, akaryakıt ile hazine arasındaki gelir akışını yeniden yönlendirerek çalışır. Litre başına ödenmeyen vergi, hanenin ödemediği farkın karşılığıdır. Bu bir sübvansiyon tartışması olmadan önce bir muhasebe özdeşliği: bir tarafın gideri, diğer tarafın vazgeçtiği gelirdir.", "en": "An administered price works not by suppressing demand, as the orthodox account suggests, but by redirecting the flow of revenue between the fuel chain and the treasury. The tax not collected per litre is the counterpart of the difference the household does not pay. Before it is a subsidy argument it is an accounting identity: one side's expense is the other side's forgone revenue.", "refs": ["mexico"]}]}, {"h": {"tr": "Yük hangi bilançoda birikiyor?", "en": "Which balance sheet accumulates the burden"}, "ps": [{"tr": "Uluslararası fiyat yükseldikçe vazgeçilen verginin büyüklüğü de artar; yani tavanın maliyeti sabit değil, ham petrol fiyatına bağlı bir değişkendir. Cumhurbaşkanı Claudia Sheinbaum, dünyada akaryakıt fiyatları artarken Meksika'da hane bütçelerinin korunduğunu savunuyor. Bu savunma doğru olsa bile, korumanın nerede biriktiği ayrı bir sorudur.", "en": "As the international price rises, so does the size of the forgone tax; the cost of the cap is therefore not fixed but a variable tied to the crude price. President Claudia Sheinbaum argues that household budgets are being protected in Mexico while fuel prices rise elsewhere. Even if that defence holds, where the protection accumulates is a separate question.", "refs": ["mexico"]}, {"tr": "Alternatif bir okuma da mümkün: Meksika bir petrol üreticisi olduğu için yüksek ham petrol fiyatı kamu gelirini başka kanaldan besleyebilir ve vazgeçilen vergiyi kısmen telafi edebilir. Bu durumda tavanın net maliyeti göründüğünden küçük olur. Açıklanan veriler hangi kanalın baskın olduğunu belirlemeye yetmiyor. Buradaki bilinmezlik hesaplanabilir bir riskten çok, olasılığını kimsenin elinde tutmadığı köklü bir belirsizliktir.", "en": "An alternative reading is available: because Mexico is an oil producer, a high crude price can feed public revenue through another channel and partly offset the forgone tax. In that case the net cost of the cap is smaller than it appears. The information at hand does not establish which channel dominates. Nobody holds the odds here; the question sits in the territory of fundamental uncertainty rather than of calculable risk.", "refs": ["mexico"]}]}, {"h": {"tr": "Aynı yardımın iki biçimi", "en": "Two forms of the same support"}, "ps": [{"tr": "Aynı kaynak doğrudan bir gelir desteği olarak da dağıtılabilirdi. İki biçim arasındaki fark muhasebede değil, kimin ne kadar aldığındadır: vazgeçilen IEPS özel tüketim vergisi tahsilatı, akaryakıtı çok tüketen haneye çok, az tüketene az gider. Ham petrol fiyatı yüksek kalırken tahsilat gerilemeye devam ederse, bu eşitsiz dağıtımın büyüklüğü de artar. Yönetilen fiyatın cazibesi burada: maliyeti tüketici enflasyonunda görünmez, mali hesapların içinde durur.", "en": "The same resources could have been distributed as a direct income supplement. The difference between the two forms lies in who receives how much rather than in the accounting: forgone IEPS excise tax collection goes largely to households that consume a lot of fuel and only slightly to those that consume little. If collection keeps falling while the crude price stays high, the scale of that uneven distribution grows with it. That is where the appeal of an administered price lies: its cost stays out of consumer inflation and sits inside the fiscal accounts.", "refs": ["mexico"]}]}], "sources": [{"key": "mexico", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/e548b330-6621-4fc6-b72a-c6dcd50a785b", "title": {"tr": "Sheinbaum akaryakıt fiyat tavanını enflasyona karşı ana araç sayıyor", "en": "Sheinbaum treats the fuel price cap as her main tool against inflation"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-03", "title": {"tr": "500 milyar dolar tutarında bir niyet mektubu neyi bağlıyor?", "en": "What a $500 billion letter of intent actually binds"}, "excerpt": {"tr": "Nvidia ile SK Group'un açıkladığı girişimde rakam büyük, bağlayıcılık ise açıklanmamış. Modeli kurmak için eksik olan üç girdiyi sıralamak gerekiyor.", "en": "The initiative announced by Nvidia and SK Group carries a large number and undisclosed obligations. Three missing inputs are worth listing before anyone builds the model."}, "sections": [{"h": {"tr": "Açıklanan ile taahhüt edilen", "en": "What was announced and what was committed"}, "ps": [{"tr": "Nvidia'nın bülteninde girişim 500 milyar dolar ve üzeri olarak tanımlanıyor ve tarafların niyet mektupları imzaladığı belirtiliyor. Fiziksel içerik somut: SK Telecom, Nvidia Vera Rubin donanımı ve SK hynix HBM4 belleğiyle çalışacak 2 gigavat ölçeğinde bir yapay zekâ tesisi kuracak ve ilk tesisin 2027'de devreye alınması planlanıyor.", "en": "Nvidia's release describes the initiative as worth more than $500 billion and says the parties signed letters of intent. The physical content is concrete: SK Telecom will build a 2-gigawatt artificial-intelligence facility running Nvidia Vera Rubin hardware with SK hynix HBM4 memory, and the first facility is planned for 2027.", "refs": ["skhynix"]}, {"tr": "Bültenin açıklamadığı üç girdi var: ödeme takvimi, hacim taahhüdü ve birim fiyat. Bu üçü olmadan 500 milyar dolar rakamı bir gelir tahmini yerine bir üst sınır ifadesi olur. İmzalanan belge tarafları müzakereye bağlar, teslimata bağlamaz.", "en": "Three inputs the release does not disclose are the payment schedule, the volume commitment and the unit price. Without those three, $500 billion is a statement of an upper bound, not a revenue estimate. The signed document binds the parties to negotiate and does not bind them to deliver.", "refs": ["skhynix"]}]}, {"h": {"tr": "Hangi varsayım fiyatı taşıyor?", "en": "Which assumption carries the price"}, "ps": [{"tr": "Bu yapıda kıt girdi sermaye değil, HBM4 üretim kapasitesi. Nvidia'nın SK hynix ile birlikte geliştirme ortaklığı kurması, belleği açık piyasadan almak yerine kapasiteye erken erişim satın aldığı yorumunu güçlendiriyor. Böyle bir düzenlemenin ekonomik değeri, ödenen primin sağladığı teslimat önceliğine bağlıdır.", "en": "The scarce input in this structure is HBM4 manufacturing capacity rather than capital. Nvidia forming a codevelopment partnership with SK hynix strengthens the reading that it is buying early access to capacity rather than purchasing memory on the open market. The economic value of such an arrangement depends on the delivery priority the premium buys.", "refs": ["skhynix"]}, {"tr": "Bununla birlikte başka bir açıklama da tutarlı: iki şirket zaten büyük bir tedarik ilişkisi içindeyse, niyet mektubu yeni bir ekonomik hak yaratmadan mevcut ilişkiyi kamuya duyurmuş olabilir. Bu okumada rakam bir taahhüdü değil, bir ölçek beyanını temsil eder. Açıklanan belgeler iki yorumu ayırmaya yetmiyor.", "en": "Another explanation is equally consistent, however: if the two companies were already in a large supply relationship, the letters of intent may have publicised an existing arrangement without creating a new economic right. On that reading the figure represents a statement of scale rather than an obligation. The disclosed documents do not separate the two interpretations.", "refs": ["skhynix"]}]}, {"h": {"tr": "Belgenin verdiği hak", "en": "The right the document grants"}, "ps": [{"tr": "Bir niyet mektubunun verdiği hak dardır: taraflar müzakereye oturur, teslimat yükümlülüğü doğmaz. Bu yüzden 500 milyar dolar rakamı, bağlayıcı bir tedarik sözleşmesi imzalanana ve SK hynix kapasite yatırımını finansal tablolarında ayrıştırana kadar bir modelin girdisi sayılamaz. 2027 hedefi de tesis devreye alınana kadar aynı statüde, yani bir plan olarak durur.", "en": "The right a letter of intent grants is narrow: the parties sit down to negotiate, and no delivery obligation arises. That is why the $500 billion figure cannot count as a model input until a binding supply contract is signed and SK hynix breaks out the capacity investment in its financial statements. The 2027 target holds the same status until the facility is commissioned, which is to say it stands as a plan.", "refs": ["skhynix"]}]}], "sources": [{"key": "skhynix", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/nvidia-locks-down-memory-from-sk-hynix-as-part-of-500-billion-ai-deal.html", "title": {"tr": "Nvidia, SK Group ile 500 milyar dolar ölçeğindeki girişimde bellek tedarikini bağlıyor", "en": "Nvidia ties up memory supply in a $500 billion initiative with SK Group"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-04", "title": {"tr": "Dokuz günlük yastık", "en": "A nine-day cushion"}, "excerpt": {"tr": "Hindistan'ın stratejik petrol rezervi net talebinin yaklaşık dokuz gününü karşılıyor. Yeni tesis duyuruları bu sayıyı bugün değiştirmiyor.", "en": "India's strategic petroleum reserve covers roughly nine days of net demand. Announcements of new facilities do not change that number today."}, "sections": [{"h": {"tr": "Varili gün cinsinden saymak", "en": "Counting the barrels in days"}, "ps": [{"tr": "Hindistan'ın mevcut stratejik rezervi 5,33 milyon ton ve bu miktar net petrol talebinin yaklaşık 8 ila 9 gününü karşılıyor. Uluslararası Enerji Ajansı'nın üye ülkeler için ölçütü 90 günlük acil durum stoku. Aradaki fark bir yüzde meselesi değil, büyüklük mertebesi meselesi; ONGC'nin Mangalore'da planladığı 1,75 milyon tonluk tesis bu farkın küçük bir kısmını kapatıyor.", "en": "India's existing strategic reserve holds 5.33 million tonnes, enough to cover roughly 8 to 9 days of net oil demand. The International Energy Agency's benchmark for member countries is 90 days of emergency stocks. The gap is a question of order of magnitude rather than of percentages, and the 1.75 million tonne facility ONGC plans at Mangalore closes only a small part of it.", "refs": ["reserves"]}, {"tr": "Güney Afrika'nın tablosu benzer. Ülkenin hâlihazırdaki ham petrol rezervi 8 milyon varil; taslak politika ise South African National Petroleum Company yönetiminde 60 günlük ve yaklaşık 36 milyon varillik bir devlet rezervi öngörüyor. Aynı taslak lisanslı dağıtıcılara 14 ila 21 günlük ticari stok zorunluluğu getiriyor.", "en": "South Africa's picture is similar. The country's crude reserves currently stand at 8 million barrels, while a draft policy envisages a 60-day state reserve of about 36 million barrels under the South African National Petroleum Company. The same draft would require licensed distributors to hold 14 to 21 days of commercial stocks.", "refs": ["reserves"]}]}, {"h": {"tr": "Duyurulan kapasite depolanan varil değildir", "en": "Announced capacity is not stored barrels"}, "ps": [{"tr": "Bir depolama tesisinin duyurulması ile o depoya varil konulması arasında iki ayrı gecikme var: inşaat süresi ve dolum için gereken satın alma. İkincisi fiyatın yüksek olduğu bir dönemde daha pahalıdır, çünkü stok kurmak isteyen alıcı zaten sıkışık olan piyasaya ek talep getirir. Stok inşası bu nedenle fiyatı düşürmez; kısa vadede yukarı iter.", "en": "Between announcing a storage facility and putting barrels into it lie two separate delays: construction time and the purchases needed to fill it. The second is more expensive when prices are high, because a buyer building stocks adds demand to an already tight market. Building reserves therefore does not lower the price; in the short run it pushes it up.", "refs": ["reserves"]}, {"tr": "Bir alternatif açıklama, iki ülkenin de duyuruyu fiziksel stok yerine mesaj vermek amacıyla yaptığı olabilir; taslak politika ve tesis planı bağlayıcı bir satın alma programı içermiyor. Bu okumada varil sayısı yıllarca değişmeden kalır. Yayımlanan metinler dolum takvimini göstermediği için iki ihtimal de açık duruyor.", "en": "An alternative explanation is that both countries made the announcement for effect rather than for physical stock; neither the draft policy nor the facility plan contains a binding purchase programme. On that reading the barrel count stays unchanged for years. The documents at hand do not show a filling schedule, so both possibilities remain open.", "refs": ["reserves"]}]}, {"h": {"tr": "Hangi sayı doğrular?", "en": "Which number would confirm it"}, "ps": [{"tr": "İzlenecek büyüklük tesis sayısı değil, gün cinsinden kapsama. Hindistan'ın 8 ila 9 günlük kapsaması yukarı hareket etmeye başlarsa program fiziksel olarak işliyor demektir. Güney Afrika'nın 8 milyon varillik rezervi 36 milyon varile doğru yol almadığı sürece, 60 günlük hedef bir politika metni olarak kalır.", "en": "The magnitude to watch is coverage in days, not the number of facilities. If India's 8 to 9 days of cover starts to move up, the programme is working physically. Unless South Africa's 8 million barrels moves toward 36 million barrels, the 60-day target remains a policy document.", "refs": ["reserves"]}]}], "sources": [{"key": "reserves", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/42847a3b-f4b6-4a16-88e0-f06fdfabbdc6", "title": {"tr": "Hindistan ve Güney Afrika acil durum yakıt stoklarını büyütme yarışında", "en": "India and South Africa are racing to enlarge emergency fuel stocks"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-05", "title": {"tr": "Yirmi buçuk yıllık tarife, peşin 7,85 milyar dolar", "en": "Twenty and a half years of tariff, $7.85 billion up front"}, "excerpt": {"tr": "Kuveyt boru hattı anlaşmasında para bugün geliyor, ödeme yirmi yıl sürüyor. Bu bir mülkiyet haberi değil, bir gelir zamanlaması haberi.", "en": "In Kuwait's pipeline agreement the money arrives today and the payment lasts two decades. This is a story about the timing of income, not about ownership."}, "sections": [{"h": {"tr": "Anlaşmanın dağıttığı şey", "en": "What the agreement distributes"}, "ps": [{"tr": "Kuwait Petroleum Corporation'a bağlı Kuwait Oil Company, 13 ham petrol boru hattını kapsayan ortak girişimin yüzde 51'ini elinde tutuyor; Blackstone, Brookfield ve KKR'den oluşan konsorsiyum yüzde 49'unu alıyor. İşlemin toplam büyüklüğü 16 milyar dolar, Kuveyt tarafına peşin gelir 7,85 milyar dolar ve süre 20,5 yıl. Hatların işletme ve bakım hakları Kuwait Oil Company'de kalıyor.", "en": "Kuwait Oil Company, a subsidiary of Kuwait Petroleum Corporation, retains 51% of a joint venture covering 13 crude oil pipelines, while a consortium of Blackstone, Brookfield and KKR takes 49%. The transaction is worth $16 billion in total, brings $7.85 billion in upfront proceeds to Kuwait and runs for 20.5 years. Operating and maintenance rights over the lines stay with Kuwait Oil Company.", "refs": ["kuwait"]}, {"tr": "Bu yapının dağıtım açısından belirleyici tarafı mülkiyet değil, takvim. Devlet şirketi bugün 7,85 milyar dolar alıyor ve karşılığında hacme bağlı bir tarifeyi yirmi yılı aşkın süre boyunca ödüyor. Yani bugünkü kamu bütçesine giren gelirin karşılığı, gelecek yirmi yılın vergi mükellefine düşen bir gider kalemi.", "en": "What matters here for distribution is the calendar rather than the ownership. The state company receives $7.85 billion today and pays a volume-based tariff in return for more than twenty years. The income entering the public budget now is matched by an expense falling on the taxpayer of the next two decades.", "refs": ["kuwait"]}]}, {"h": {"tr": "Kim kazanır, kim öder?", "en": "Who gains and who pays"}, "ps": [{"tr": "Karşılaştırma yapılacak ölçüt, borçlanma. Devlet aynı parayı tahvil ihraç ederek de toplayabilirdi; o durumda ödeme faiz adını alır ve bütçede görünür. Bu yapıda ise ödeme tarife adını alır, işletme giderine yazılır ve kamu borcu istatistiğine girmez. Aynı nakit akışı, farklı bir muhasebe adresine yönelir.", "en": "The baseline for comparison is borrowing. The state could have raised the same money by issuing bonds; the payment would then be called interest and would appear in the budget. Under this structure the payment is called a tariff, is booked as an operating cost and does not enter the public debt statistics. The same cash flow is routed to a different accounting address.", "refs": ["kuwait"]}, {"tr": "Bununla birlikte alternatif bir okuma var: hacme bağlı tarife, üretim düştüğünde ödemeyi de düşürdüğü için riski kısmen yatırımcıya aktarabilir ve bu, sabit kuponlu borçtan daha korunaklı olabilir. Hangi okumanın geçerli olduğu tarifenin taban tutarına bağlı; açıklanan bilgi bu tabanı göstermiyor.", "en": "An alternative reading is available, however: because the tariff is volume-based, it falls when production falls and so may transfer part of the risk to the investor, which could be more protective than fixed-coupon debt. Which reading holds depends on any floor under the tariff, and the disclosed information does not show that floor.", "refs": ["kuwait"]}]}, {"h": {"tr": "Alacaklı kim, borçlu kim?", "en": "Who holds the claim and who owes it"}, "ps": [{"tr": "Bu yapıda alacaklı belli: yirmi yılı aşkın tarifeyi tahsil edecek olan konsorsiyum. Borçlu ise bugün masada olmayan taraf, yani ödemeyi üstlenecek gelecekteki vergi mükellefi. Kuveyt'in bütçe hesaplarında sermaye harcaması kalemi yükselirse bu mükellefin elinde bir varlık olur; 7,85 milyar dolar cari harcamaya giderse eline yalnızca yirmi yıllık bir gider kalır. Anlaşmanın hane tarafındaki asıl bölüşüm sorusu budur.", "en": "In this structure the creditor is identified: the consortium that will collect a tariff for more than twenty years. The debtor is the party not at the table today, the future taxpayer who takes on the payment. If the capital expenditure line in Kuwait's budget accounts rises, that taxpayer ends up holding an asset; if the $7.85 billion goes to current spending, all that is left is a two-decade expense. That is the real distributive question on the household side of this agreement.", "refs": ["kuwait"]}]}], "sources": [{"key": "kuwait", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/780bc4bb-1916-4fe2-ad2b-22663c66f16e", "title": {"tr": "Blackstone, KKR ve Brookfield Kuveyt boru hatlarında 16 milyar dolar değerinde paya giriyor", "en": "Blackstone, KKR and Brookfield take a $16 billion stake in Kuwait's pipelines"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-06", "title": {"tr": "Petrol 100 dolar sınırına yaklaşırken faiz indirimi kim için fiyatlanıyor?", "en": "Who is a rate cut priced for while oil approaches $100"}, "excerpt": {"tr": "Arz kaynaklı bir fiyat artışı, talep kaynaklı bir enflasyonla aynı politika cevabını hak etmiyor. Kırılganlık tam bu ayrımın yanlış yapıldığı yerde birikiyor.", "en": "A supply-driven price rise does not deserve the same policy answer as demand-driven inflation. Fragility accumulates exactly where that distinction is drawn wrongly."}, "sections": [{"h": {"tr": "Maliyet şoku ile talep şokunun farkı", "en": "The difference between a cost shock and a demand shock"}, "ps": [{"tr": "Bir maliyet şokuna verilecek politika cevabı, bir talep şokuna verilecek cevapla aynı olmak zorunda değildir; ayrımı yapmak için önce iki sayıya bakmak gerekir. Brent 24 Temmuz Cuma günü yüzde 3,88 geriledi ve kapanış fiyatı 96,78 dolar oldu; buna rağmen haftayı yüzde 12'nin üzerinde artıda tamamladı. Fed'in politika faizi hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında, İngiltere Merkez Bankası'nın politika faizi yüzde 3,75 düzeyinde. Haftalık yükseliş, günlük gerilemenin gizlediği yönü veriyor.", "en": "The policy answer to a cost shock need not match the answer to a demand shock, and telling them apart starts with two numbers. Brent settled on Friday 24 July at $96.78, down 3.88%, yet finished the week more than 12% higher. The Fed's policy target range stands between 3.50% and 3.75%, and the Bank of England's policy rate at 3.75%. The weekly gain gives the direction that the daily decline conceals.", "refs": ["oiltest"]}, {"tr": "Bu yükselişin arkasında Hürmüz ve Bab-ül Mendep hatlarındaki sevkiyat aksamaları var. Arz tarafından gelen bir fiyat artışı, faiz artırımıyla geri alınamayan bir maliyet şokudur; sıkılaşma arzı çoğaltmaz, yalnızca talebi keser. Sorun fiyatın kendisi değil, o fiyata verilecek politika cevabının hangi bilançoyu vuracağı.", "en": "Behind that rise lies shipping disruption on the Hormuz and Bab el-Mandeb routes. A price increase arriving from the supply side is a cost shock that no rate rise can undo; tightening does not multiply supply, it only cuts demand. The problem lies in which balance sheet the policy answer to that price lands on, rather than in the price itself.", "refs": ["oiltest"]}]}, {"h": {"tr": "Zincirin zayıf halkası", "en": "The weak link in the chain"}, "ps": [{"tr": "Aktarım yolu kısa. Enerji kaynaklı enflasyon merkez bankalarını beklenenden uzun süre yüksek faizde tutarsa, yeniden finansman maliyeti yüksek kaldıraçlı borçlularda önce hisseye değil nakit akışına vurur. Yatırımcı açısından kritik soru, bu borçluların vade duvarının nereye düştüğü. Tampon da mevcut: uzun vadeye bağlanmış borç ve nakit rezervi bu kanalı kesebilir.", "en": "The transmission path is short. If energy-driven inflation keeps central banks at high rates for longer than expected, the refinancing cost hits cash flow before equity at highly leveraged borrowers. For an investor the critical question is where those borrowers' maturity wall falls. A buffer exists too: debt termed out to long maturities and cash reserves can break that channel.", "refs": ["oiltest"]}, {"tr": "Bir başka açıklama da mümkün: sevkiyat aksaması geçici olabilir ve rota normale döndüğünde fiyat kendiliğinden gerileyebilir; bu durumda politika faizinin uzun süre yüksek kalması gerekmez ve zincir hiç kurulmaz. Hangi ihtimalin geçerli olduğunu bugünkü kapanış fiyatı göstermiyor.", "en": "Another explanation is available: the shipping disruption may be temporary and the price could ease on its own once routes normalise, in which case policy rates need not stay high for long and the chain is never built. Today's closing price does not establish which possibility holds.", "refs": ["oiltest"]}]}, {"h": {"tr": "Yanlışlanabilir eşik", "en": "The falsifiable threshold"}, "ps": [{"tr": "Bu tezin yanlışlanma koşulu açık. Brent haftalık bazda 96,78 dolar düzeyinin altına inip orada kalırsa ve merkez bankaları politika faizini yüzde 3,75'in altına çekerse, maliyet şokunun kalıcı olduğu görüşü zayıflar. Fiyat yüksek kalırken faiz de yüzde 3,75'te tutulursa, kaldıraçlı borçlunun nakit akışı üzerindeki baskı ölçülebilir hâle gelir.", "en": "The condition that would falsify this thesis is explicit. If Brent falls below $96.78 on a weekly basis and stays there while central banks bring policy rates below 3.75%, the view that the cost shock is durable weakens. If the price stays high while rates are held at 3.75%, the pressure on leveraged borrowers' cash flow becomes measurable.", "refs": ["oiltest"]}]}], "sources": [{"key": "oiltest", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-25/fed-bank-of-england-bank-of-japan-face-100-oil-inflation-test", "title": {"tr": "Fed ile İngiltere ve Japonya merkez bankaları 100 dolar sınırına yaklaşan petrolle sınanıyor", "en": "Fed, Bank of England and Bank of Japan are tested by oil near $100"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-01", "title": {"tr": "Neste rekor bir çeyrek açıkladı, hisse yine de düştü", "en": "Neste posted record results, and the stock still fell"}, "excerpt": {"tr": "Neste'nin karşılaştırılabilir EBITDA'sı rekora ulaştı, ama hisse yaklaşık yüzde 10 geriledi. Asıl soru marjın kaynağında: İran savaşına bağlı bir kıtlık primi mi, yoksa tekrarlanabilir bir kazanç mı?", "en": "Neste's comparable EBITDA reached a record high, yet the shares fell about 10%. The real question is where the margin came from: an Iran-war scarcity premium, or a repeatable gain?"}, "sections": [{"h": {"tr": "Rekor rakam, düşen fiyat", "en": "A record number, a falling price"}, "ps": [{"tr": "Neste ikinci çeyrekte 1.203 milyon avro rekor karşılaştırılabilir EBITDA bildirdi; yenilenebilir ürün marjı ton başına 1.223 dolar olarak 1.059 dolar olan beklentiyi aştı. Buna karşın Neste hissesi yaklaşık yüzde 10 düşerek 17,06 dolar seviyesine indi. Tahtanın oyu açık: rakam iyiydi, hisse düştü — çünkü sonuç neye göre iyiydi ve bu kazanç kalıcı nakde dönüyor mu, piyasa henüz görmüş değil.", "en": "Neste reported comparable EBITDA of a record 1,203 million euros in the second quarter; its renewable-products margin of 1,223 dollars a ton beat a forecast of 1,059 dollars. Even so, Neste shares fell about 10% to 17.06 dollars. The tape's vote is plain: the number was good and the stock dropped, because what the beat was measured against, and whether it converts into durable cash, the market has not yet settled.", "refs": ["neste"]}, {"tr": "Baskı beklentiden değil kaynaktan geliyor. Marj, İran'daki savaşın yenilenebilir yakıt talebini artırması ve Hürmüz belirsizliğinin fiyatları oynak tutmasıyla şişti. Ortadoğu kaynaklı bu marj yapısal bir marjın güvencesini taşımıyor ve Neste'nin önünde bakım duruşları var. Kısacası iyi haberin kendisi burada yeni bir soru doğuruyor.", "en": "The pressure comes from the source, not the print. The margin swelled because the war in Iran lifted demand for renewable fuel and Hormuz uncertainty kept prices volatile. This Middle East-driven margin lacks the assurance of a structural one, and Neste faces maintenance turnarounds ahead. In short, the good news itself raises a fresh question here.", "refs": ["neste"]}]}, {"h": {"tr": "Marjın kaynağı ve teyit çizgisi", "en": "The source of the margin, and the confirmation line"}, "ps": [{"tr": "Ayrımı yapmak gerekiyor: bir defalık kıtlık primi mi, yoksa biyoyakıt düzenlemelerinin kalıcı olarak yükselttiği bir taban mı? İkisi aynı çeyrekte birlikte çalışıyor olabilir; ama Hürmüz riski gevşerse primin bir kısmı geri verilir, düzenleyici talep ise yerinde kalır. Rekor bir çeyrek, Neste açısından gelecek çeyreğin garantisi değildir.", "en": "The distinction has to be drawn: a one-off scarcity premium, or a floor that biofuel regulation has structurally raised? Both may be working together in a single quarter, but if Hormuz risk eases part of the premium is handed back, while regulatory demand stays in place. For Neste, record results are no guarantee of the next quarter.", "refs": ["neste"]}, {"tr": "İzlenecek gözlem şu: akut bir arz şoku olmadan gelecek çeyrekte Neste'nin yenilenebilir marjı nerede oturuyor ve bakım duruşu hacimleri ne kadar sıkıştırıyor? Marj beklenti aralığına doğru gerilerse kazancın büyük ölçüde konjonktürel olduğu, orada tutunursa yapısal bir bileşenin bulunduğu anlaşılır. Bunu gözlemlenebilir bir sınav olarak sunuyorum; yatırım önerisi içermiyor.", "en": "The signal to watch is this: absent an acute supply shock, where does Neste's renewable margin settle next quarter, and how much do maintenance turnarounds compress volumes? If the margin drifts back toward the forecast range, the gain was largely cyclical; if it holds, a structural component is present. I offer this as an observable test; it carries no investment advice.", "refs": ["neste"]}]}], "sources": [{"key": "neste", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/718ec1f0-5e05-48b7-9c99-ab28b6f9b055", "title": {"tr": "Neste rekor bir çeyrek açıkladı, hisse yine de geriledi", "en": "Neste reports record results, and its stock still falls"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-02", "title": {"tr": "İklim riski, teminatın fiyatına giriyor", "en": "Climate risk enters the price of collateral"}, "excerpt": {"tr": "ECB, iklim faktörlerini şirket kredi alacaklarına genişletiyor. Azami yüzde 5 ıskonto, merkez bankası likiditesinin fiyatını sessizce yeniden ayarlayan bir kaldıraçtır; soru, para arzından çok kimin bilançosunun bu maliyeti taşıyacağıdır.", "en": "The ECB is extending climate factors to corporate credit claims. A maximum 5% haircut is a lever that quietly recalibrates the price of central-bank liquidity; the question is less the money supply than whose balance sheet carries the cost."}, "sections": [{"h": {"tr": "Teminat çerçevesi bir politika aracıdır", "en": "The collateral framework is a policy instrument"}, "ps": [{"tr": "ECB Yönetim Konseyi, iklim faktörlerini borçlusu finans dışı şirket olan kredi alacaklarına genişletti; bu, 2025 Temmuz'unda pazarlanabilir varlıklar için alınan kararın üzerine kuruluyor. Faktör, teminat değerinde azami yüzde 5 indirim uygulayabiliyor ve üç bileşenden oluşuyor: sektör düzeyinde stres unsuru, borçlunun geçiş belirsizliğine maruziyeti ve alacağın kalan vadesi. Merkez bankası burada likiditenin fiyatını ayarlıyor.", "en": "The ECB Governing Council extended climate factors to credit claims whose debtor is a non-financial corporation, building on a July 2025 decision for marketable assets. The factor can apply a maximum 5% reduction in collateral value and has three components: a sector-level stress element, the debtor's exposure to transition uncertainty, and the claim's residual maturity. The central bank here is setting the price of liquidity.", "refs": ["ecb-collateral"]}, {"tr": "Mekanizma bir bilanço zinciri: daha yüksek ıskonto, iklime maruz teminatı merkez bankası likiditesi için rehin vermenin maliyetini yükseltir. Bu maliyeti önce bu alacakları rehin veren bankalar, ardından arkalarındaki finans dışı borçlular taşır. Bu, paranın mimarisine ait bir adım; devlet, para sisteminin kurucu unsurlarından biridir.", "en": "The mechanism is a balance-sheet chain: a higher haircut raises the cost of pledging climate-exposed collateral for central-bank liquidity. That cost is borne first by the banks pledging those claims, then by the non-financial borrowers behind them. This is a step in the architecture of money; the state is one of the constituents of the monetary system.", "refs": ["ecb-collateral"]}]}, {"h": {"tr": "Ölçek, hız ve sınırlar", "en": "Scale, speed, and limits"}, "ps": [{"tr": "Karşı argümanı ciddiye almak gerek. Faktör azami yüzde 5 ile sınırlı, uygulama en erken 2027 sonunda ve tekil faktörler açıklanmıyor. Bu, ihtiyatlı bir risk yönetimi ayarı olarak tasarlanmış; etkisi sınırlı ve yavaş olabilir. Bir muhasebe kimliği bir hikâyeyi çerçeveler, ama tek başına davranışı açıklamaz.", "en": "The counterargument deserves weight. The factor is capped at 5%, implementation is at the earliest by the end of 2027, and individual factors are undisclosed. This is designed as a prudential risk-management adjustment; its effect may be bounded and slow. An accounting identity frames a story but does not by itself explain behaviour.", "refs": ["ecb-collateral"]}, {"tr": "İzlenecek işaret, 2027 uygulamasının tam yüzde 5 ıskontoyu gerçekten uygulayıp uygulamadığı ve iklime maruz alacakların rehin verilen hacimlerinin değişip değişmediğidir. Bu, ECB teminat sisteminin geçiş riskini fiyatlamaya nasıl başladığının gözlemlenebilir bir sınavıdır.", "en": "The sign to watch is whether the 2027 implementation actually applies the full 5% haircut and whether the pledged volumes of climate-exposed claims shift. This is an observable test of how the ECB collateral system begins to price transition risk.", "refs": ["ecb-collateral"]}]}], "sources": [{"key": "ecb-collateral", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr260724_4~f082ce289d.en.html", "title": {"tr": "ECB, iklim faktörlerini şirket kredi alacaklarına genişletiyor", "en": "The ECB extends climate factors to corporate credit claims"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-03", "title": {"tr": "Meta borcu bilançodan çıkarıyor, karşılığında daha fazla faiz ödüyor", "en": "Meta moves the debt off its balance sheet and pays more for it"}, "excerpt": {"tr": "Meta'nın El Paso veri merkezi, BlackRock'ın taşıdığı bir yapıyla finanse ediliyor. Borç bilançoda görünmese de 20 yıllık kira taahhüdü ve yüzde 7'nin üzerindeki getiri, sermaye maliyetini yok etmenin değil ertelemenin bedelini gösteriyor.", "en": "Meta's El Paso data centre is financed through a BlackRock-held vehicle. The debt stays off the balance sheet, but a 20-year rent commitment and yields above 7% show the cost of deferring, not removing, the capital bill."}, "sections": [{"h": {"tr": "Yapının ekonomisi", "en": "The economics of the structure"}, "ps": [{"tr": "Modeli açalım. BlackRock'a bağlı araç yaklaşık 1 gigavat El Paso projesinin yüzde 80'ini, Meta yüzde 20'sini tutuyor; 2048 vadeli tahviller 2028'de başlayacak 20 yıllık Meta kira ödemeleriyle teminatlandırılıyor. Borç Meta'nın bilançosunda durmuyor; kira yükümlülüğü ise gelecekteki nakit üzerinde sabit bir talep. Kapasite kiralanıyor.", "en": "Open the model. A BlackRock-linked vehicle holds 80% of the roughly 1-gigawatt El Paso project and Meta 20%; the 2048 bonds are secured by 20 years of Meta rent beginning in 2028. The debt does not sit on Meta's balance sheet; the rent obligation is a fixed claim on future cash. The capacity is rented.", "refs": ["meta"]}, {"tr": "Fiyat tarafı önemli: ilk getiriler yüzde 7'nin üzerinde, Meta'nın ekimde 27 milyar dolar rekor tahvil satışıyla finanse ettiği Hyperion projesine kıyasla yaklaşık 0,4 puan daha yüksek. 12 milyar dolar tutarında bir işlemde puanın onda biri bile yıllık faizde milyonlarca dolar demek. Piyasa yapay zekâ altyapısı riskini yeniden fiyatlıyor; harcamanın maliyeti, yapı kaldıracı gizlese de yükseliyor.", "en": "The pricing matters: early yields are above 7%, about 0.4 percentage points higher than on Meta's Hyperion project, funded by a bond sale of a record 27 billion dollars in October. On a deal of 12 billion dollars, even a tenth of a point means millions in annual interest. The market is repricing AI infrastructure risk; the cost of the spend is rising even as the structure hides the leverage.", "refs": ["meta"]}]}, {"h": {"tr": "Sermaye tahsisi karakterdir", "en": "Capital allocation is character"}, "ps": [{"tr": "Duyarlılık tek bir varsayımda toplanıyor: kiralanan kapasite Meta'da kalıcı ek nakde dönüşürse işlem sermaye maliyetini karşılar; yapay zekâ gelirlenmesi gecikirse 20 yıllık kira, belirsiz getiriye karşı sabit bir maliyet olabilir. Karşı argümanı da tartmak gerek: gerçek opsiyon değeri ve bilanço dışı yapı, Meta'nın raporlanan kaldıracını düşük tutabilir. Hikâye ucuz; sermayenin maliyeti gerçek.", "en": "The sensitivity concentrates in a single assumption: if the rented capacity converts into durable incremental cash at Meta, the deal earns its cost of capital; if AI monetization lags, the 20-year rent could be a fixed cost against uncertain returns. The counterargument deserves weight too: real option value and the off-balance-sheet structure can keep Meta's reported leverage low. The story is cheap; the cost of capital is real.", "refs": ["meta"]}, {"tr": "İzlenecek gözlem, El Paso tahvillerinin sonunda hangi kuponla kapandığı ve sonraki yapay zekâ finansmanlarının Hyperion'a kıyasla daha da açılıp açılmadığıdır. Bu, finansman maliyetinin gözlemlenebilir bir sınavı; puan farkı genişlerse harcamanın faturası ağırlaşır.", "en": "The signal to watch is the coupon the El Paso bonds ultimately clear at, and whether subsequent AI financings widen further against Hyperion. This is an observable test of financing cost; if the spread widens, the bill for the spend gets heavier.", "refs": ["meta"]}]}], "sources": [{"key": "meta", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/822628c5-4f9c-47db-bd27-f3ad7f841700", "title": {"tr": "Meta'nın 12 milyar dolarlık veri merkezi finansmanı daha yüksek faizle geldi", "en": "Meta's 12-billion-dollar data-centre financing comes at higher borrowing costs"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-04", "title": {"tr": "Kızıldeniz'de sigorta duvarı ve düşen vadeli petrol fiyatı", "en": "A Red Sea insurance wall and a falling oil futures price"}, "excerpt": {"tr": "Ekran petrolü ucuzlatıyor, kargo pahalılaşıyor. Savaş riski sigortası Suudi yüklerini Kızıldeniz'den çıkarıyor, tankerler Ümit Burnu'na yöneliyor; fiyat ile fiziksel risk aynı yöne bakmıyor.", "en": "The screen cheapens oil while the cargo turns dearer. War-risk cover is pushing Saudi loads out of the Red Sea and tankers toward the Cape; price and physical risk are not looking the same way."}, "sections": [{"h": {"tr": "Ekran: diplomasi umuduyla düşen fiyat", "en": "The screen: price falling on hopes of diplomacy"}, "ps": [{"tr": "Brent yaklaşık yüzde 4 düşüşle 96,78 dolar, WTI yüzde 3 düşüşle 89,31 dolar olarak kapandı; 10 yıllık tahvil getirisi yüzde 4,681'e geriledi. Hareket, Pakistan'ın Çin desteğiyle ABD-İran görüşmelerini yeniden başlatmaya çalıştığı haberinin ardından geldi. Yatırımcılar diplomasi umudunu fiyatladı; teyit edilmiş bir arz değişikliği yok.", "en": "Brent closed down about 4% at 96.78 dollars and WTI 3% at 89.31 dollars; the 10-year Treasury yield eased to 4.681%. The move followed a report that Pakistan, with China's backing, is trying to restart U.S.-Iran talks. Investors priced hopes of diplomacy; there is no confirmed change in supply.", "refs": ["oil-yields"]}, {"tr": "Vadeli işlemlerdeki düşüş bir olasılığı — görüşmeleri — fiyatlıyor, teslim edilmiş bir varili değil. Ekranlar duyguyla hareket edebilir; depoyu ve rotayı ise kargo belirler.", "en": "The dip in futures prices a probability — the talks — not a delivered barrel. Screens can move on sentiment; the tank and the route are set by cargo.", "refs": ["oil-yields"]}]}, {"h": {"tr": "Kargo: navlun ve sigortanın söylediği", "en": "The cargo: what freight and insurance say"}, "ps": [{"tr": "Aynı sırada fiziksel zincir sıkılaştı. Lloyd's sigortacıları 'Suudi teması' olan gemileri savaş riski teminatının dışında tutuyor; Ascot ve Navium poliçeleri geri çekmeye hazırlanıyor. Güney Kızıldeniz primleri geçen haftaki yaklaşık yüzde 0,3'ten gemi değerinin yüzde 1'inin üzerine, Suudi bağlantılı gemiler için yüzde 3'e çıktı. Bazı yükler geri dönüp Ümit Burnu'na yöneldi. Daha yüksek navlun ve rota değişikliği, vadeli düşüşün küçümsediği fiziksel bir maliyet.", "en": "At the same time the physical chain tightened. Lloyd's insurers are excluding vessels with 'Saudi touchpoints' from war-risk cover; Ascot and Navium are preparing to withdraw policies. Southern Red Sea premiums rose from about 0.3% last week to more than 1% of a ship's value, and up to 3% for Saudi-linked ships. Some cargoes turned back toward the Cape. Higher freight and rerouting are a physical cost the futures dip understates.", "refs": ["insurers"]}, {"tr": "İkisini uzlaştıralım: tehdit altındaki varil ile teslim edilen varil farklı şeyler — piyasadan çıkan doğrulanmış bir hacim henüz yok, ama sigorta ve rota şimdiden yeniden fiyatlanıyor. İzlenecek gözlem, Ümit Burnu sapmalarının sürüp sürmediği ve primlerin yüzde 1'in üzerinde kalıp kalmadığıdır; kalırsa, ekranın henüz göstermediği fiziksel bir sıkılaşma doğrulanır.", "en": "Reconcile the two: a threatened barrel and a delivered one are different things — no confirmed volume is off the market yet, but insurance and routing are already repricing. The signal to watch is whether the Cape diversions persist and premiums hold above 1%; if they do, they confirm a physical tightening the screen has not yet shown.", "refs": ["insurers", "oil-yields"]}]}], "sources": [{"key": "insurers", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/52aa89e9-f014-498e-8415-2c435a1c858d", "title": {"tr": "Sigortacılar Kızıldeniz'de Suudi yükleri için savaş teminatını kısıtlıyor", "en": "Insurers restrict war cover for Saudi cargoes in the Red Sea"}, "publishedDate": "2026-07-24"}, {"key": "oil-yields", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/treasury-yields-bonds-us-debt.html", "title": {"tr": "Tahvil getirileri, petrol fiyatı gerilerken düştü", "en": "Treasury yields slide as oil prices fall"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-05", "title": {"tr": "Yeni tarifelerin faturasını hangi hane ödüyor?", "en": "Which household pays the bill for the new tariffs?"}, "excerpt": {"tr": "Yeni gümrük vergileri yürürlüğe girdi, hukuki itiraz sürüyor. Ama tarife bir tüketim vergisidir ve tüketim vergileri düşük gelirli haneleri orantısız yükler — çünkü onlar bütçelerinin daha büyük payını ticarete konu mallara harcar.", "en": "The new duties took effect, and a legal challenge is underway. But a tariff is a consumption tax, and consumption taxes fall hardest on lower-income households — because they spend a larger share of their budget on tradable goods."}, "sections": [{"h": {"tr": "Kim koyar, kim öder", "en": "Who sets it, who pays"}, "ps": [{"tr": "Yürürlüğe gireni sıralayalım: 301. maddeye dayanan yüzde 10-12,5 vergiler yaklaşık 60 ekonomiye, Brezilya'ya ek yüzde 25, bazı Kanada mallarına 1930 tarihli bir hükümle yüzde 50 uygulanıyor. Saatler sonra Liberty Justice Center, Yüksek Mahkeme'nin daha önce IEEPA tarifelerini iptal etmesine dayanarak dava açtı. Vergiyi devlet koyuyor; ama faturayı ödeyen kim?", "en": "Set out what took effect: Section 301 duties of 10-12.5% on roughly 60 economies, an additional 25% on Brazil, and 50% on some Canadian goods under a 1930 provision. Hours later the Liberty Justice Center filed suit, leaning on the Supreme Court's earlier invalidation of the IEEPA tariffs. The state sets the duty; but who pays the bill?", "refs": ["tariffs"]}, {"tr": "Yansıma mekanizması nettir: ithalatçılar vergiyi raf fiyatına aktarır ve yük, sepet üzerinden tüketiciye biner. Ticarete konu mallar düşük gelirli hanelerin bütçesinde daha büyük bir pay tutar; bu yüzden bir tüketim vergisi orantısız yüklenir. Ortalama tarife geliri, medyan hanenin ne ödediğine dair hiçbir şey söylemez.", "en": "The pass-through mechanism is clear: importers pass the duty into shelf prices, and the burden lands on the consumer through the basket. Tradable goods take a larger share of a lower-income household's budget, so a consumption tax weighs disproportionately. Average tariff revenue says nothing about what the median household pays.", "refs": ["tariffs"]}]}, {"h": {"tr": "Karşı argüman ve gözlem", "en": "The counterargument, and what to watch"}, "ps": [{"tr": "Karşı tarafı da adilce kurmak gerek: korunan sektörlerdeki bazı işçiler ücret veya istihdam desteği görebilir; tarife geliri ilkesel olarak transferleri fonlayabilir; yansıma her zaman tam olmayabilir. Bunları savunmak için etkilenen grubu, temel çizgiyi ve dengeleyici kanalı adıyla göstermek gerekir; genel bir koruma söylemi yetmez.", "en": "The other side must be built fairly: some workers in protected sectors may see wage or job support; tariff revenue could in principle fund transfers; pass-through can be incomplete. To argue these, one must name the affected group, the baseline, and the offsetting channel; a general appeal to protection falls short.", "refs": ["tariffs"]}, {"tr": "İzlenecek gözlem, önümüzdeki aylarda tarifeye tabi ithalat kategorilerinin fiyatlarının genel sepetten daha hızlı artıp artmadığı ve herhangi bir gelirin dengeleyici transferlere yönlendirilip yönlendirilmediğidir. Sonucu ancak hane bütçesindeki değişim gösterir; bu, gözlemlenebilir bir sınav.", "en": "The signal to watch is whether, in the coming months, the prices of tariffed import categories rise faster than the overall basket, and whether any revenue is directed toward offsetting transfers. Only the change in the household budget will show the result; this is an observable test.", "refs": ["tariffs"]}]}], "sources": [{"key": "tariffs", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/trump-tariffs-lawsuit-301-ieepa.html", "title": {"tr": "Yeni tarifeler yürürlüğe girdi, saatler içinde dava açıldı", "en": "New tariffs take effect, and a lawsuit is filed within hours"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-06", "title": {"tr": "460 milyar dolar yapay zekâ borcu ve onu fark eden bir kredi notu", "en": "460 billion dollars of AI debt, and a credit rating that notices"}, "excerpt": {"tr": "Moody's, altı büyük yapay zekâ harcamacısının kredi kalitesini uyardı. Kırılganlık, harcamayı finanse eden borçta, en zayıf halkalarda ve kimin kime borçlu olduğu sorusunda yoğunlaşıyor.", "en": "Moody's flagged the credit quality of the six biggest AI spenders. The fragility concentrates in the debt funding the spend, in the weakest links, and in the question of who owes whom."}, "sections": [{"h": {"tr": "Bilanço hafiften ağıra geçiyor", "en": "From asset-light to asset-heavy"}, "ps": [{"tr": "Moody's, benzeri görülmemiş yapay zekâ harcamasının altı şirkette — Microsoft, Amazon, Alphabet, Meta, Oracle ve CoreWeave — kredi kalitesini tehdit ettiğini söyledi. Sermaye harcamasının 2026'da 785 milyar dolar, gelecek yıl yaklaşık 1 trilyon dolar olacağı öngörülüyor; altı şirketin doğrudan borcu yaklaşık 460 milyar dolar. Finansman borç, hisse satışı ve bilanço dışı yapılarla sağlanıyor. Mekanizma, hafif bilançodan ağır bilançoya geçiştir.", "en": "Moody's said unprecedented AI spending threatens credit quality across six firms — Microsoft, Amazon, Alphabet, Meta, Oracle and CoreWeave. Capital expenditure is projected at 785 billion dollars in 2026 and about 1 trillion dollars next year; the six firms' direct debt is around 460 billion dollars. Funding comes through debt, share sales and off-balance-sheet structures. The mechanism is the shift from an asset-light to an asset-heavy balance sheet.", "refs": ["moodys"]}, {"tr": "Kırılma zinciri her yerde aynı değil. En güçlü bilançolar — Microsoft, Alphabet, Amazon, Meta — yatırım yapılabilir notların yakın vadede düşmesini olası kılmıyor; baskı en zayıf halkalarda, negatif görünümlü Baa2 notuyla Oracle'da ve CoreWeave'de yoğunlaşıyor. Önce kimin sıkışacağı, hikâyenin gerisini yazar.", "en": "The failure chain is not uniform. The strongest balance sheets — Microsoft, Alphabet, Amazon, Meta — make an imminent slip in investment-grade ratings unlikely; the pressure concentrates on the weakest links, Oracle at a Baa2 rating with a negative outlook, and CoreWeave. Who gets squeezed first writes the rest of the story.", "refs": ["moodys"]}]}, {"h": {"tr": "Kırılganlık ve tamponlar", "en": "Fragility and buffers"}, "ps": [{"tr": "Riski izleyelim: yapay zekâ nakit getirisi gecikirken borç ve bilanço dışı taahhütler büyürse, yeniden finansman maliyeti önce düşük notlu isimlerde artar; yatırım yapılabilir eşiğin altına bir not indirimi bazı sahipleri satışa zorlar. Tamponlar da gerçek: nakit zengini dev şirketler, vadesi uzatılmış borç ve hisseyle finansman. Kaldıraç ve kimin kime borçlu olduğu, fiyatın altındaki asıl kısıttır.", "en": "Trace the risk: if AI cash returns lag while debt and off-balance-sheet commitments grow, refinancing cost rises first for the lower-rated names; a downgrade below the investment-grade threshold would force some holders to sell. The buffers are real too: cash-rich megacaps, termed-out debt and equity funding. Leverage and who owes whom are the real constraint beneath the price.", "refs": ["moodys"]}, {"tr": "İzlenecek gözlem, Oracle'ın görünümünün bir not indirimine doğru kayıp kaymadığı ya da devlere kıyasla kredi farkının açılıp açılmadığıdır; bu, kırılganlığın uyarıdan fiyata geçtiğini gösterir. Eşik yanlışlanabilir ve bir çöküş tarihi içermez.", "en": "The signal to watch is whether Oracle's outlook moves toward a downgrade or its credit spread widens relative to the megacaps; that would show the fragility passing from warning into price. The threshold is falsifiable and names no crash date.", "refs": ["moodys"]}]}], "sources": [{"key": "moodys", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/moodys-ai-spending-credit-quality-amazon-meta-alphabet.html", "title": {"tr": "Moody's: 'benzeri görülmemiş' yapay zekâ harcaması kredi kalitesini tehdit ediyor", "en": "Moody's: 'unprecedented' AI spending threatens credit quality"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-01", "title": {"tr": "Intel'de Teslimat Sınavı: CPU Kıtlığı ve Büyüyen Fabrika Bütçesi", "en": "Intel's Delivery Test: CPU Scarcity and a Larger Factory Budget"}, "excerpt": {"tr": "Gelir ve veri merkezi satışları beklentiyi aştı; yönetim siparişlerin üretimi geçtiğini söylüyor. Fiyat tepkisinden daha kalıcı soru, Intel'in kapasiteyi marjı ve bilançoyu bozmadan gelire çevirip çeviremeyeceği.", "en": "Revenue and data-center sales beat expectations, and management says orders exceed production. The more durable question than the share-price reaction is whether Intel can turn constrained capacity into revenue without sacrificing margins or balance-sheet discipline."}, "sections": [{"h": {"tr": "Sipariş görünür, teslimat henüz değil", "en": "Orders are visible; delivery is not yet"}, "ps": [{"tr": "Intel ikinci çeyrekte 16,13 milyar dolar gelir açıkladı; yıllık artış yüzde 25,4'e ulaşırken sonuç 14,42 milyar dolarlık piyasa beklentisini aştı. Veri Merkezi ve Yapay Zekâ biriminin geliri 6,26 milyar dolar oldu. Hisse seans sonrası işlemlerde yükseldi, ancak hareketin büyüklüğü işlem boyunca değişti. Tahtanın ilk oyu olumluydu; kalıcı ağırlığı ise bu büyümenin teslimata ve marja dönüşmesi belirleyecek.", "en": "Intel reported second-quarter revenue of $16.13 billion, up 25.4% from a year earlier and above the $14.42 billion consensus estimate. Data Center and AI revenue reached $6.26 billion. The shares rose in extended trading, although the size of the move shifted during the session. The tape cast an initially positive vote; the durable weight will depend on whether that growth converts into deliveries and margin.", "refs": ["intel-q2"]}, {"tr": "Asıl kıtlık talepte değil üretimde. Yönetim, veri merkezi CPU siparişlerinin şirketin üretebildiği miktarı aştığını ve bazıları fiyat ile hacim taahhüdü içeren üç ila beş yıllık müşteri anlaşmaları imzaladığını söyledi. Bu, talebi daha görünür kılıyor; teslimat kapasitesini veya kârlılığı tek başına garanti etmiyor.", "en": "The immediate constraint is production rather than demand. Management said data-center CPU orders exceed what Intel can manufacture and described three-to-five-year customer agreements, some containing price and volume commitments. That improves demand visibility, but it does not by itself guarantee delivery capacity or profitability.", "refs": ["intel-q2"]}]}, {"h": {"tr": "Talep başlığı ile finansman gerçeğini ayırmak", "en": "Separating the demand headline from financing"}, "ps": [{"tr": "Intel aynı zamanda 2026 sermaye harcaması öngörüsünü 18 milyar dolardan 20 milyar dolara çıkardı ve gelecek yıl harcamanın anlamlı biçimde artacağını belirtti. İkinci çeyrekte 7 milyar dolar faaliyet nakdi üretse de GAAP sonuç zarar gösterdi. Bu nedenle \"talep güçlü\" ile \"dönüşüm finanse edildi\" aynı sonuç değildir.", "en": "Intel also raised its 2026 capital-spending forecast from $18 billion to $20 billion and indicated that spending would rise materially next year. It generated $7 billion of operating cash in the quarter, while its GAAP result remained a loss. \"Demand is strong\" and \"the transformation is financed\" are therefore different conclusions.", "refs": ["intel-q2", "intel-release"]}, {"tr": "Teyit çizgisi üç parçalı: kısıtlı siparişler teslim edilmiş gelire dönüşüyor mu, brüt marj bunu koruyor mu ve dökümhane harcaması dış müşteri kazanımlarıyla karşılanıyor mu? Üçü birlikte ilerlerse yükselişin temeli güçlenir; yalnız sipariş başlığı ilerlerse fiyat kapasitenin önüne geçmiş olur.", "en": "The confirmation test has three parts: whether constrained orders become delivered revenue, whether gross margin holds during that conversion, and whether foundry spending is matched by external customer wins. Progress on all three would strengthen the case; progress only in the order headline would leave valuation ahead of capacity.", "refs": ["intel-q2", "intel-release"]}]}], "sources": [{"key": "intel-q2", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/intel-sales-profit-forecast-beat-estimates-boosts-spending-plans-on-ai-boom-4809863", "title": {"tr": "Intel satış ve kâr tahminlerini aştı, YZ talebiyle harcama planını yükseltti", "en": "Intel sales and profit forecasts beat estimates as AI demand lifts spending plans"}, "publishedDate": "2026-07-23"}, {"key": "intel-release", "kind": "news", "name": "Intel", "url": "https://www.publicnow.com/view/DFD786CAC6455060E4C33C013A3EE7AB4AB38AF6", "title": {"tr": "Intel 2026 ikinci çeyrek sonuçlarını açıkladı", "en": "Intel reports second-quarter 2026 financial results"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-02", "title": {"tr": "Petrol Şoku Tepki Fonksiyonlarını Sınıyor", "en": "The Oil Shock Tests Policy Reaction Functions"}, "excerpt": {"tr": "ECB faizleri tuttu, ABD getirileri daha sıkı bir patikayı yansıttı, Japonya'nın fiyat göstergeleri ise ayrıştı. Bunlar tek bir ortak karar değil; aynı enerji şokuna ilişkin üç farklı ve hâlâ değişen sinyal.", "en": "The ECB held rates, U.S. yields reflected a tighter path, and Japan's price gauges diverged. These are not one shared policy decision, but three distinct and still-evolving signals around the same energy shock."}, "sections": [{"h": {"tr": "Karar, fiyatlama ve veri aynı şey değil", "en": "A decision, market pricing and data are not the same"}, "ps": [{"tr": "ECB 23 Temmuz'da üç temel faizini sabit tuttu. Banka, enerji görünümünün oynak olduğunu, fiyatların haziran projeksiyonundaki varsayımların ve çatışma öncesi düzeylerin üzerinde kaldığını, tam enflasyon etkisinin ise henüz ortaya çıkmadığını söyledi. Karar veri bağımlı ve toplantı bazında; banka gelecekteki bir faiz patikasına önceden bağlanmadı.", "en": "The ECB left its three key rates unchanged on July 23. It said the energy outlook remained volatile, with prices above both the assumptions in its June projections and pre-conflict levels, while the full inflation effect had yet to emerge. Decisions remain data-dependent and meeting-by-meeting, with no precommitment to a future rate path.", "refs": ["ecb-hold"]}, {"tr": "ABD'de Brent'in 100 doların üzerine çıktığı gün on yıllık tahvil getirisi yaklaşık yüzde 4,69'a yükselirken ilk işsizlik başvuruları 187 bine geriledi. Getiri hareketi, aynı anda gelen enerji ve işgücü verilerinin piyasa fiyatlamasını gösterir; petrolün tek başına belirli bir Fed kararına neden olduğunu kanıtlamaz.", "en": "In the United States, the 10-year Treasury yield moved to roughly 4.69% on the same day that Brent crossed $100 and initial jo
