a rate cut priced for while oil approaches $100"}, "excerpt": {"tr": "Arz kaynaklı bir fiyat artışı, talep kaynaklı bir enflasyonla aynı politika cevabını hak etmiyor. Kırılganlık tam bu ayrımın yanlış yapıldığı yerde birikiyor.", "en": "A supply-driven price rise does not deserve the same policy answer as demand-driven inflation. Fragility accumulates exactly where that distinction is drawn wrongly."}, "sections": [{"h": {"tr": "Maliyet şoku ile talep şokunun farkı", "en": "The difference between a cost shock and a demand shock"}, "ps": [{"tr": "Bir maliyet şokuna verilecek politika cevabı, bir talep şokuna verilecek cevapla aynı olmak zorunda değildir; ayrımı yapmak için önce iki sayıya bakmak gerekir. Brent 24 Temmuz Cuma günü yüzde 3,88 geriledi ve kapanış fiyatı 96,78 dolar oldu; buna rağmen haftayı yüzde 12'nin üzerinde artıda tamamladı. Fed'in politika faizi hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında, İngiltere Merkez Bankası'nın politika faizi yüzde 3,75 düzeyinde. Haftalık yükseliş, günlük gerilemenin gizlediği yönü veriyor.", "en": "The policy answer to a cost shock need not match the answer to a demand shock, and telling them apart starts with two numbers. Brent settled on Friday 24 July at $96.78, down 3.88%, yet finished the week more than 12% higher. The Fed's policy target range stands between 3.50% and 3.75%, and the Bank of England's policy rate at 3.75%. The weekly gain gives the direction that the daily decline conceals.", "refs": ["oiltest"]}, {"tr": "Bu yükselişin arkasında Hürmüz ve Bab-ül Mendep hatlarındaki sevkiyat aksamaları var. Arz tarafından gelen bir fiyat artışı, faiz artırımıyla geri alınamayan bir maliyet şokudur; sıkılaşma arzı çoğaltmaz, yalnızca talebi keser. Sorun fiyatın kendisi değil, o fiyata verilecek politika cevabının hangi bilançoyu vuracağı.", "en": "Behind that rise lies shipping disruption on the Hormuz and Bab el-Mandeb routes. A price increase arriving from the supply side is a cost shock that no rate rise can undo; tightening does not multiply supply, it only cuts demand. The problem lies in which balance sheet the policy answer to that price lands on, rather than in the price itself.", "refs": ["oiltest"]}]}, {"h": {"tr": "Zincirin zayıf halkası", "en": "The weak link in the chain"}, "ps": [{"tr": "Aktarım yolu kısa. Enerji kaynaklı enflasyon merkez bankalarını beklenenden uzun süre yüksek faizde tutarsa, yeniden finansman maliyeti yüksek kaldıraçlı borçlularda önce hisseye değil nakit akışına vurur. Yatırımcı açısından kritik soru, bu borçluların vade duvarının nereye düştüğü. Tampon da mevcut: uzun vadeye bağlanmış borç ve nakit rezervi bu kanalı kesebilir.", "en": "The transmission path is short. If energy-driven inflation keeps central banks at high rates for longer than expected, the refinancing cost hits cash flow before equity at highly leveraged borrowers. For an investor the critical question is where those borrowers' maturity wall falls. A buffer exists too: debt termed out to long maturities and cash reserves can break that channel.", "refs": ["oiltest"]}, {"tr": "Bir başka açıklama da mümkün: sevkiyat aksaması geçici olabilir ve rota normale döndüğünde fiyat kendiliğinden gerileyebilir; bu durumda politika faizinin uzun süre yüksek kalması gerekmez ve zincir hiç kurulmaz. Hangi ihtimalin geçerli olduğunu bugünkü kapanış fiyatı göstermiyor.", "en": "Another explanation is available: the shipping disruption may be temporary and the price could ease on its own once routes normalise, in which case policy rates need not stay high for long and the chain is never built. Today's closing price does not establish which possibility holds.", "refs": ["oiltest"]}]}, {"h": {"tr": "Yanlışlanabilir eşik", "en": "The falsifiable threshold"}, "ps": [{"tr": "Bu tezin yanlışlanma koşulu açık. Brent haftalık bazda 96,78 dolar düzeyinin altına inip orada kalırsa ve merkez bankaları politika faizini yüzde 3,75'in altına çekerse, maliyet şokunun kalıcı olduğu görüşü zayıflar. Fiyat yüksek kalırken faiz de yüzde 3,75'te tutulursa, kaldıraçlı borçlunun nakit akışı üzerindeki baskı ölçülebilir hâle gelir.", "en": "The condition that would falsify this thesis is explicit. If Brent falls below $96.78 on a weekly basis and stays there while central banks bring policy rates below 3.75%, the view that the cost shock is durable weakens. If the price stays high while rates are held at 3.75%, the pressure on leveraged borrowers' cash flow becomes measurable.", "refs": ["oiltest"]}]}], "sources": [{"key": "oiltest", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-25/fed-bank-of-england-bank-of-japan-face-100-oil-inflation-test", "title": {"tr": "Fed ile İngiltere ve Japonya merkez bankaları 100 dolar sınırına yaklaşan petrolle sınanıyor", "en": "Fed, Bank of England and Bank of Japan are tested by oil near $100"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "eco-01", "title": {"tr": "Neste rekor bir çeyrek açıkladı, hisse yine de düştü", "en": "Neste posted record results, and the stock still fell"}, "excerpt": {"tr": "Neste'nin karşılaştırılabilir EBITDA'sı rekora ulaştı, ama hisse yaklaşık yüzde 10 geriledi. Asıl soru marjın kaynağında: İran savaşına bağlı bir kıtlık primi mi, yoksa tekrarlanabilir bir kazanç mı?", "en": "Neste's comparable EBITDA reached a record high, yet the shares fell about 10%. The real question is where the margin came from: an Iran-war scarcity premium, or a repeatable gain?"}, "sections": [{"h": {"tr": "Rekor rakam, düşen fiyat", "en": "A record number, a falling price"}, "ps": [{"tr": "Neste ikinci çeyrekte 1.203 milyon avro rekor karşılaştırılabilir EBITDA bildirdi; yenilenebilir ürün marjı ton başına 1.223 dolar olarak 1.059 dolar olan beklentiyi aştı. Buna karşın Neste hissesi yaklaşık yüzde 10 düşerek 17,06 dolar seviyesine indi. Tahtanın oyu açık: rakam iyiydi, hisse düştü — çünkü sonuç neye göre iyiydi ve bu kazanç kalıcı nakde dönüyor mu, piyasa henüz görmüş değil.", "en": "Neste reported comparable EBITDA of a record 1,203 million euros in the second quarter; its renewable-products margin of 1,223 dollars a ton beat a forecast of 1,059 dollars. Even so, Neste shares fell about 10% to 17.06 dollars. The tape's vote is plain: the number was good and the stock dropped, because what the beat was measured against, and whether it converts into durable cash, the market has not yet settled.", "refs": ["neste"]}, {"tr": "Baskı beklentiden değil kaynaktan geliyor. Marj, İran'daki savaşın yenilenebilir yakıt talebini artırması ve Hürmüz belirsizliğinin fiyatları oynak tutmasıyla şişti. Ortadoğu kaynaklı bu marj yapısal bir marjın güvencesini taşımıyor ve Neste'nin önünde bakım duruşları var. Kısacası iyi haberin kendisi burada yeni bir soru doğuruyor.", "en": "The pressure comes from the source, not the print. The margin swelled because the war in Iran lifted demand for renewable fuel and Hormuz uncertainty kept prices volatile. This Middle East-driven margin lacks the assurance of a structural one, and Neste faces maintenance turnarounds ahead. In short, the good news itself raises a fresh question here.", "refs": ["neste"]}]}, {"h": {"tr": "Marjın kaynağı ve teyit çizgisi", "en": "The source of the margin, and the confirmation line"}, "ps": [{"tr": "Ayrımı yapmak gerekiyor: bir defalık kıtlık primi mi, yoksa biyoyakıt düzenlemelerinin kalıcı olarak yükselttiği bir taban mı? İkisi aynı çeyrekte birlikte çalışıyor olabilir; ama Hürmüz riski gevşerse primin bir kısmı geri verilir, düzenleyici talep ise yerinde kalır. Rekor bir çeyrek, Neste açısından gelecek çeyreğin garantisi değildir.", "en": "The distinction has to be drawn: a one-off scarcity premium, or a floor that biofuel regulation has structurally raised? Both may be working together in a single quarter, but if Hormuz risk eases part of the premium is handed back, while regulatory demand stays in place. For Neste, record results are no guarantee of the next quarter.", "refs": ["neste"]}, {"tr": "İzlenecek gözlem şu: akut bir arz şoku olmadan gelecek çeyrekte Neste'nin yenilenebilir marjı nerede oturuyor ve bakım duruşu hacimleri ne kadar sıkıştırıyor? Marj beklenti aralığına doğru gerilerse kazancın büyük ölçüde konjonktürel olduğu, orada tutunursa yapısal bir bileşenin bulunduğu anlaşılır. Bunu gözlemlenebilir bir sınav olarak sunuyorum; yatırım önerisi içermiyor.", "en": "The signal to watch is this: absent an acute supply shock, where does Neste's renewable margin settle next quarter, and how much do maintenance turnarounds compress volumes? If the margin drifts back toward the forecast range, the gain was largely cyclical; if it holds, a structural component is present. I offer this as an observable test; it carries no investment advice.", "refs": ["neste"]}]}], "sources": [{"key": "neste", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/718ec1f0-5e05-48b7-9c99-ab28b6f9b055", "title": {"tr": "Neste rekor bir çeyrek açıkladı, hisse yine de geriledi", "en": "Neste reports record results, and its stock still falls"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-02", "title": {"tr": "İklim riski, teminatın fiyatına giriyor", "en": "Climate risk enters the price of collateral"}, "excerpt": {"tr": "ECB, iklim faktörlerini şirket kredi alacaklarına genişletiyor. Azami yüzde 5 ıskonto, merkez bankası likiditesinin fiyatını sessizce yeniden ayarlayan bir kaldıraçtır; soru, para arzından çok kimin bilançosunun bu maliyeti taşıyacağıdır.", "en": "The ECB is extending climate factors to corporate credit claims. A maximum 5% haircut is a lever that quietly recalibrates the price of central-bank liquidity; the question is less the money supply than whose balance sheet carries the cost."}, "sections": [{"h": {"tr": "Teminat çerçevesi bir politika aracıdır", "en": "The collateral framework is a policy instrument"}, "ps": [{"tr": "ECB Yönetim Konseyi, iklim faktörlerini borçlusu finans dışı şirket olan kredi alacaklarına genişletti; bu, 2025 Temmuz'unda pazarlanabilir varlıklar için alınan kararın üzerine kuruluyor. Faktör, teminat değerinde azami yüzde 5 indirim uygulayabiliyor ve üç bileşenden oluşuyor: sektör düzeyinde stres unsuru, borçlunun geçiş belirsizliğine maruziyeti ve alacağın kalan vadesi. Merkez bankası burada likiditenin fiyatını ayarlıyor.", "en": "The ECB Governing Council extended climate factors to credit claims whose debtor is a non-financial corporation, building on a July 2025 decision for marketable assets. The factor can apply a maximum 5% reduction in collateral value and has three components: a sector-level stress element, the debtor's exposure to transition uncertainty, and the claim's residual maturity. The central bank here is setting the price of liquidity.", "refs": ["ecb-collateral"]}, {"tr": "Mekanizma bir bilanço zinciri: daha yüksek ıskonto, iklime maruz teminatı merkez bankası likiditesi için rehin vermenin maliyetini yükseltir. Bu maliyeti önce bu alacakları rehin veren bankalar, ardından arkalarındaki finans dışı borçlular taşır. Bu, paranın mimarisine ait bir adım; devlet, para sisteminin kurucu unsurlarından biridir.", "en": "The mechanism is a balance-sheet chain: a higher haircut raises the cost of pledging climate-exposed collateral for central-bank liquidity. That cost is borne first by the banks pledging those claims, then by the non-financial borrowers behind them. This is a step in the architecture of money; the state is one of the constituents of the monetary system.", "refs": ["ecb-collateral"]}]}, {"h": {"tr": "Ölçek, hız ve sınırlar", "en": "Scale, speed, and limits"}, "ps": [{"tr": "Karşı argümanı ciddiye almak gerek. Faktör azami yüzde 5 ile sınırlı, uygulama en erken 2027 sonunda ve tekil faktörler açıklanmıyor. Bu, ihtiyatlı bir risk yönetimi ayarı olarak tasarlanmış; etkisi sınırlı ve yavaş olabilir. Bir muhasebe kimliği bir hikâyeyi çerçeveler, ama tek başına davranışı açıklamaz.", "en": "The counterargument deserves weight. The factor is capped at 5%, implementation is at the earliest by the end of 2027, and individual factors are undisclosed. This is designed as a prudential risk-management adjustment; its effect may be bounded and slow. An accounting identity frames a story but does not by itself explain behaviour.", "refs": ["ecb-collateral"]}, {"tr": "İzlenecek işaret, 2027 uygulamasının tam yüzde 5 ıskontoyu gerçekten uygulayıp uygulamadığı ve iklime maruz alacakların rehin verilen hacimlerinin değişip değişmediğidir. Bu, ECB teminat sisteminin geçiş riskini fiyatlamaya nasıl başladığının gözlemlenebilir bir sınavıdır.", "en": "The sign to watch is whether the 2027 implementation actually applies the full 5% haircut and whether the pledged volumes of climate-exposed claims shift. This is an observable test of how the ECB collateral system begins to price transition risk.", "refs": ["ecb-collateral"]}]}], "sources": [{"key": "ecb-collateral", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr260724_4~f082ce289d.en.html", "title": {"tr": "ECB, iklim faktörlerini şirket kredi alacaklarına genişletiyor", "en": "The ECB extends climate factors to corporate credit claims"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-03", "title": {"tr": "Meta borcu bilançodan çıkarıyor, karşılığında daha fazla faiz ödüyor", "en": "Meta moves the debt off its balance sheet and pays more for it"}, "excerpt": {"tr": "Meta'nın El Paso veri merkezi, BlackRock'ın taşıdığı bir yapıyla finanse ediliyor. Borç bilançoda görünmese de 20 yıllık kira taahhüdü ve yüzde 7'nin üzerindeki getiri, sermaye maliyetini yok etmenin değil ertelemenin bedelini gösteriyor.", "en": "Meta's El Paso data centre is financed through a BlackRock-held vehicle. The debt stays off the balance sheet, but a 20-year rent commitment and yields above 7% show the cost of deferring, not removing, the capital bill."}, "sections": [{"h": {"tr": "Yapının ekonomisi", "en": "The economics of the structure"}, "ps": [{"tr": "Modeli açalım. BlackRock'a bağlı araç yaklaşık 1 gigavat El Paso projesinin yüzde 80'ini, Meta yüzde 20'sini tutuyor; 2048 vadeli tahviller 2028'de başlayacak 20 yıllık Meta kira ödemeleriyle teminatlandırılıyor. Borç Meta'nın bilançosunda durmuyor; kira yükümlülüğü ise gelecekteki nakit üzerinde sabit bir talep. Kapasite kiralanıyor.", "en": "Open the model. A BlackRock-linked vehicle holds 80% of the roughly 1-gigawatt El Paso project and Meta 20%; the 2048 bonds are secured by 20 years of Meta rent beginning in 2028. The debt does not sit on Meta's balance sheet; the rent obligation is a fixed claim on future cash. The capacity is rented.", "refs": ["meta"]}, {"tr": "Fiyat tarafı önemli: ilk getiriler yüzde 7'nin üzerinde, Meta'nın ekimde 27 milyar dolar rekor tahvil satışıyla finanse ettiği Hyperion projesine kıyasla yaklaşık 0,4 puan daha yüksek. 12 milyar dolar tutarında bir işlemde puanın onda biri bile yıllık faizde milyonlarca dolar demek. Piyasa yapay zekâ altyapısı riskini yeniden fiyatlıyor; harcamanın maliyeti, yapı kaldıracı gizlese de yükseliyor.", "en": "The pricing matters: early yields are above 7%, about 0.4 percentage points higher than on Meta's Hyperion project, funded by a bond sale of a record 27 billion dollars in October. On a deal of 12 billion dollars, even a tenth of a point means millions in annual interest. The market is repricing AI infrastructure risk; the cost of the spend is rising even as the structure hides the leverage.", "refs": ["meta"]}]}, {"h": {"tr": "Sermaye tahsisi karakterdir", "en": "Capital allocation is character"}, "ps": [{"tr": "Duyarlılık tek bir varsayımda toplanıyor: kiralanan kapasite Meta'da kalıcı ek nakde dönüşürse işlem sermaye maliyetini karşılar; yapay zekâ gelirlenmesi gecikirse 20 yıllık kira, belirsiz getiriye karşı sabit bir maliyet olabilir. Karşı argümanı da tartmak gerek: gerçek opsiyon değeri ve bilanço dışı yapı, Meta'nın raporlanan kaldıracını düşük tutabilir. Hikâye ucuz; sermayenin maliyeti gerçek.", "en": "The sensitivity concentrates in a single assumption: if the rented capacity converts into durable incremental cash at Meta, the deal earns its cost of capital; if AI monetization lags, the 20-year rent could be a fixed cost against uncertain returns. The counterargument deserves weight too: real option value and the off-balance-sheet structure can keep Meta's reported leverage low. The story is cheap; the cost of capital is real.", "refs": ["meta"]}, {"tr": "İzlenecek gözlem, El Paso tahvillerinin sonunda hangi kuponla kapandığı ve sonraki yapay zekâ finansmanlarının Hyperion'a kıyasla daha da açılıp açılmadığıdır. Bu, finansman maliyetinin gözlemlenebilir bir sınavı; puan farkı genişlerse harcamanın faturası ağırlaşır.", "en": "The signal to watch is the coupon the El Paso bonds ultimately clear at, and whether subsequent AI financings widen further against Hyperion. This is an observable test of financing cost; if the spread widens, the bill for the spend gets heavier.", "refs": ["meta"]}]}], "sources": [{"key": "meta", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/822628c5-4f9c-47db-bd27-f3ad7f841700", "title": {"tr": "Meta'nın 12 milyar dolarlık veri merkezi finansmanı daha yüksek faizle geldi", "en": "Meta's 12-billion-dollar data-centre financing comes at higher borrowing costs"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-04", "title": {"tr": "Kızıldeniz'de sigorta duvarı ve düşen vadeli petrol fiyatı", "en": "A Red Sea insurance wall and a falling oil futures price"}, "excerpt": {"tr": "Ekran petrolü ucuzlatıyor, kargo pahalılaşıyor. Savaş riski sigortası Suudi yüklerini Kızıldeniz'den çıkarıyor, tankerler Ümit Burnu'na yöneliyor; fiyat ile fiziksel risk aynı yöne bakmıyor.", "en": "The screen cheapens oil while the cargo turns dearer. War-risk cover is pushing Saudi loads out of the Red Sea and tankers toward the Cape; price and physical risk are not looking the same way."}, "sections": [{"h": {"tr": "Ekran: diplomasi umuduyla düşen fiyat", "en": "The screen: price falling on hopes of diplomacy"}, "ps": [{"tr": "Brent yaklaşık yüzde 4 düşüşle 96,78 dolar, WTI yüzde 3 düşüşle 89,31 dolar olarak kapandı; 10 yıllık tahvil getirisi yüzde 4,681'e geriledi. Hareket, Pakistan'ın Çin desteğiyle ABD-İran görüşmelerini yeniden başlatmaya çalıştığı haberinin ardından geldi. Yatırımcılar diplomasi umudunu fiyatladı; teyit edilmiş bir arz değişikliği yok.", "en": "Brent closed down about 4% at 96.78 dollars and WTI 3% at 89.31 dollars; the 10-year Treasury yield eased to 4.681%. The move followed a report that Pakistan, with China's backing, is trying to restart U.S.-Iran talks. Investors priced hopes of diplomacy; there is no confirmed change in supply.", "refs": ["oil-yields"]}, {"tr": "Vadeli işlemlerdeki düşüş bir olasılığı — görüşmeleri — fiyatlıyor, teslim edilmiş bir varili değil. Ekranlar duyguyla hareket edebilir; depoyu ve rotayı ise kargo belirler.", "en": "The dip in futures prices a probability — the talks — not a delivered barrel. Screens can move on sentiment; the tank and the route are set by cargo.", "refs": ["oil-yields"]}]}, {"h": {"tr": "Kargo: navlun ve sigortanın söylediği", "en": "The cargo: what freight and insurance say"}, "ps": [{"tr": "Aynı sırada fiziksel zincir sıkılaştı. Lloyd's sigortacıları 'Suudi teması' olan gemileri savaş riski teminatının dışında tutuyor; Ascot ve Navium poliçeleri geri çekmeye hazırlanıyor. Güney Kızıldeniz primleri geçen haftaki yaklaşık yüzde 0,3'ten gemi değerinin yüzde 1'inin üzerine, Suudi bağlantılı gemiler için yüzde 3'e çıktı. Bazı yükler geri dönüp Ümit Burnu'na yöneldi. Daha yüksek navlun ve rota değişikliği, vadeli düşüşün küçümsediği fiziksel bir maliyet.", "en": "At the same time the physical chain tightened. Lloyd's insurers are excluding vessels with 'Saudi touchpoints' from war-risk cover; Ascot and Navium are preparing to withdraw policies. Southern Red Sea premiums rose from about 0.3% last week to more than 1% of a ship's value, and up to 3% for Saudi-linked ships. Some cargoes turned back toward the Cape. Higher freight and rerouting are a physical cost the futures dip understates.", "refs": ["insurers"]}, {"tr": "İkisini uzlaştıralım: tehdit altındaki varil ile teslim edilen varil farklı şeyler — piyasadan çıkan doğrulanmış bir hacim henüz yok, ama sigorta ve rota şimdiden yeniden fiyatlanıyor. İzlenecek gözlem, Ümit Burnu sapmalarının sürüp sürmediği ve primlerin yüzde 1'in üzerinde kalıp kalmadığıdır; kalırsa, ekranın henüz göstermediği fiziksel bir sıkılaşma doğrulanır.", "en": "Reconcile the two: a threatened barrel and a delivered one are different things — no confirmed volume is off the market yet, but insurance and routing are already repricing. The signal to watch is whether the Cape diversions persist and premiums hold above 1%; if they do, they confirm a physical tightening the screen has not yet shown.", "refs": ["insurers", "oil-yields"]}]}], "sources": [{"key": "insurers", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/52aa89e9-f014-498e-8415-2c435a1c858d", "title": {"tr": "Sigortacılar Kızıldeniz'de Suudi yükleri için savaş teminatını kısıtlıyor", "en": "Insurers restrict war cover for Saudi cargoes in the Red Sea"}, "publishedDate": "2026-07-24"}, {"key": "oil-yields", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/treasury-yields-bonds-us-debt.html", "title": {"tr": "Tahvil getirileri, petrol fiyatı gerilerken düştü", "en": "Treasury yields slide as oil prices fall"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-05", "title": {"tr": "Yeni tarifelerin faturasını hangi hane ödüyor?", "en": "Which household pays the bill for the new tariffs?"}, "excerpt": {"tr": "Yeni gümrük vergileri yürürlüğe girdi, hukuki itiraz sürüyor. Ama tarife bir tüketim vergisidir ve tüketim vergileri düşük gelirli haneleri orantısız yükler — çünkü onlar bütçelerinin daha büyük payını ticarete konu mallara harcar.", "en": "The new duties took effect, and a legal challenge is underway. But a tariff is a consumption tax, and consumption taxes fall hardest on lower-income households — because they spend a larger share of their budget on tradable goods."}, "sections": [{"h": {"tr": "Kim koyar, kim öder", "en": "Who sets it, who pays"}, "ps": [{"tr": "Yürürlüğe gireni sıralayalım: 301. maddeye dayanan yüzde 10-12,5 vergiler yaklaşık 60 ekonomiye, Brezilya'ya ek yüzde 25, bazı Kanada mallarına 1930 tarihli bir hükümle yüzde 50 uygulanıyor. Saatler sonra Liberty Justice Center, Yüksek Mahkeme'nin daha önce IEEPA tarifelerini iptal etmesine dayanarak dava açtı. Vergiyi devlet koyuyor; ama faturayı ödeyen kim?", "en": "Set out what took effect: Section 301 duties of 10-12.5% on roughly 60 economies, an additional 25% on Brazil, and 50% on some Canadian goods under a 1930 provision. Hours later the Liberty Justice Center filed suit, leaning on the Supreme Court's earlier invalidation of the IEEPA tariffs. The state sets the duty; but who pays the bill?", "refs": ["tariffs"]}, {"tr": "Yansıma mekanizması nettir: ithalatçılar vergiyi raf fiyatına aktarır ve yük, sepet üzerinden tüketiciye biner. Ticarete konu mallar düşük gelirli hanelerin bütçesinde daha büyük bir pay tutar; bu yüzden bir tüketim vergisi orantısız yüklenir. Ortalama tarife geliri, medyan hanenin ne ödediğine dair hiçbir şey söylemez.", "en": "The pass-through mechanism is clear: importers pass the duty into shelf prices, and the burden lands on the consumer through the basket. Tradable goods take a larger share of a lower-income household's budget, so a consumption tax weighs disproportionately. Average tariff revenue says nothing about what the median household pays.", "refs": ["tariffs"]}]}, {"h": {"tr": "Karşı argüman ve gözlem", "en": "The counterargument, and what to watch"}, "ps": [{"tr": "Karşı tarafı da adilce kurmak gerek: korunan sektörlerdeki bazı işçiler ücret veya istihdam desteği görebilir; tarife geliri ilkesel olarak transferleri fonlayabilir; yansıma her zaman tam olmayabilir. Bunları savunmak için etkilenen grubu, temel çizgiyi ve dengeleyici kanalı adıyla göstermek gerekir; genel bir koruma söylemi yetmez.", "en": "The other side must be built fairly: some workers in protected sectors may see wage or job support; tariff revenue could in principle fund transfers; pass-through can be incomplete. To argue these, one must name the affected group, the baseline, and the offsetting channel; a general appeal to protection falls short.", "refs": ["tariffs"]}, {"tr": "İzlenecek gözlem, önümüzdeki aylarda tarifeye tabi ithalat kategorilerinin fiyatlarının genel sepetten daha hızlı artıp artmadığı ve herhangi bir gelirin dengeleyici transferlere yönlendirilip yönlendirilmediğidir. Sonucu ancak hane bütçesindeki değişim gösterir; bu, gözlemlenebilir bir sınav.", "en": "The signal to watch is whether, in the coming months, the prices of tariffed import categories rise faster than the overall basket, and whether any revenue is directed toward offsetting transfers. Only the change in the household budget will show the result; this is an observable test.", "refs": ["tariffs"]}]}], "sources": [{"key": "tariffs", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/trump-tariffs-lawsuit-301-ieepa.html", "title": {"tr": "Yeni tarifeler yürürlüğe girdi, saatler içinde dava açıldı", "en": "New tariffs take effect, and a lawsuit is filed within hours"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-06", "title": {"tr": "460 milyar dolar yapay zekâ borcu ve onu fark eden bir kredi notu", "en": "460 billion dollars of AI debt, and a credit rating that notices"}, "excerpt": {"tr": "Moody's, altı büyük yapay zekâ harcamacısının kredi kalitesini uyardı. Kırılganlık, harcamayı finanse eden borçta, en zayıf halkalarda ve kimin kime borçlu olduğu sorusunda yoğunlaşıyor.", "en": "Moody's flagged the credit quality of the six biggest AI spenders. The fragility concentrates in the debt funding the spend, in the weakest links, and in the question of who owes whom."}, "sections": [{"h": {"tr": "Bilanço hafiften ağıra geçiyor", "en": "From asset-light to asset-heavy"}, "ps": [{"tr": "Moody's, benzeri görülmemiş yapay zekâ harcamasının altı şirkette — Microsoft, Amazon, Alphabet, Meta, Oracle ve CoreWeave — kredi kalitesini tehdit ettiğini söyledi. Sermaye harcamasının 2026'da 785 milyar dolar, gelecek yıl yaklaşık 1 trilyon dolar olacağı öngörülüyor; altı şirketin doğrudan borcu yaklaşık 460 milyar dolar. Finansman borç, hisse satışı ve bilanço dışı yapılarla sağlanıyor. Mekanizma, hafif bilançodan ağır bilançoya geçiştir.", "en": "Moody's said unprecedented AI spending threatens credit quality across six firms — Microsoft, Amazon, Alphabet, Meta, Oracle and CoreWeave. Capital expenditure is projected at 785 billion dollars in 2026 and about 1 trillion dollars next year; the six firms' direct debt is around 460 billion dollars. Funding comes through debt, share sales and off-balance-sheet structures. The mechanism is the shift from an asset-light to an asset-heavy balance sheet.", "refs": ["moodys"]}, {"tr": "Kırılma zinciri her yerde aynı değil. En güçlü bilançolar — Microsoft, Alphabet, Amazon, Meta — yatırım yapılabilir notların yakın vadede düşmesini olası kılmıyor; baskı en zayıf halkalarda, negatif görünümlü Baa2 notuyla Oracle'da ve CoreWeave'de yoğunlaşıyor. Önce kimin sıkışacağı, hikâyenin gerisini yazar.", "en": "The failure chain is not uniform. The strongest balance sheets — Microsoft, Alphabet, Amazon, Meta — make an imminent slip in investment-grade ratings unlikely; the pressure concentrates on the weakest links, Oracle at a Baa2 rating with a negative outlook, and CoreWeave. Who gets squeezed first writes the rest of the story.", "refs": ["moodys"]}]}, {"h": {"tr": "Kırılganlık ve tamponlar", "en": "Fragility and buffers"}, "ps": [{"tr": "Riski izleyelim: yapay zekâ nakit getirisi gecikirken borç ve bilanço dışı taahhütler büyürse, yeniden finansman maliyeti önce düşük notlu isimlerde artar; yatırım yapılabilir eşiğin altına bir not indirimi bazı sahipleri satışa zorlar. Tamponlar da gerçek: nakit zengini dev şirketler, vadesi uzatılmış borç ve hisseyle finansman. Kaldıraç ve kimin kime borçlu olduğu, fiyatın altındaki asıl kısıttır.", "en": "Trace the risk: if AI cash returns lag while debt and off-balance-sheet commitments grow, refinancing cost rises first for the lower-rated names; a downgrade below the investment-grade threshold would force some holders to sell. The buffers are real too: cash-rich megacaps, termed-out debt and equity funding. Leverage and who owes whom are the real constraint beneath the price.", "refs": ["moodys"]}, {"tr": "İzlenecek gözlem, Oracle'ın görünümünün bir not indirimine doğru kayıp kaymadığı ya da devlere kıyasla kredi farkının açılıp açılmadığıdır; bu, kırılganlığın uyarıdan fiyata geçtiğini gösterir. Eşik yanlışlanabilir ve bir çöküş tarihi içermez.", "en": "The signal to watch is whether Oracle's outlook moves toward a downgrade or its credit spread widens relative to the megacaps; that would show the fragility passing from warning into price. The threshold is falsifiable and names no crash date.", "refs": ["moodys"]}]}], "sources": [{"key": "moodys", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/moodys-ai-spending-credit-quality-amazon-meta-alphabet.html", "title": {"tr": "Moody's: 'benzeri görülmemiş' yapay zekâ harcaması kredi kalitesini tehdit ediyor", "en": "Moody's: 'unprecedented' AI spending threatens credit quality"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "eco-01", "title": {"tr": "Intel'de Teslimat Sınavı: CPU Kıtlığı ve Büyüyen Fabrika Bütçesi", "en": "Intel's Delivery Test: CPU Scarcity and a Larger Factory Budget"}, "excerpt": {"tr": "Gelir ve veri merkezi satışları beklentiyi aştı; yönetim siparişlerin üretimi geçtiğini söylüyor. Fiyat tepkisinden daha kalıcı soru, Intel'in kapasiteyi marjı ve bilançoyu bozmadan gelire çevirip çeviremeyeceği.", "en": "Revenue and data-center sales beat expectations, and management says orders exceed production. The more durable question than the share-price reaction is whether Intel can turn constrained capacity into revenue without sacrificing margins or balance-sheet discipline."}, "sections": [{"h": {"tr": "Sipariş görünür, teslimat henüz değil", "en": "Orders are visible; delivery is not yet"}, "ps": [{"tr": "Intel ikinci çeyrekte 16,13 milyar dolar gelir açıkladı; yıllık artış yüzde 25,4'e ulaşırken sonuç 14,42 milyar dolarlık piyasa beklentisini aştı. Veri Merkezi ve Yapay Zekâ biriminin geliri 6,26 milyar dolar oldu. Hisse seans sonrası işlemlerde yükseldi, ancak hareketin büyüklüğü işlem boyunca değişti. Tahtanın ilk oyu olumluydu; kalıcı ağırlığı ise bu büyümenin teslimata ve marja dönüşmesi belirleyecek.", "en": "Intel reported second-quarter revenue of $16.13 billion, up 25.4% from a year earlier and above the $14.42 billion consensus estimate. Data Center and AI revenue reached $6.26 billion. The shares rose in extended trading, although the size of the move shifted during the session. The tape cast an initially positive vote; the durable weight will depend on whether that growth converts into deliveries and margin.", "refs": ["intel-q2"]}, {"tr": "Asıl kıtlık talepte değil üretimde. Yönetim, veri merkezi CPU siparişlerinin şirketin üretebildiği miktarı aştığını ve bazıları fiyat ile hacim taahhüdü içeren üç ila beş yıllık müşteri anlaşmaları imzaladığını söyledi. Bu, talebi daha görünür kılıyor; teslimat kapasitesini veya kârlılığı tek başına garanti etmiyor.", "en": "The immediate constraint is production rather than demand. Management said data-center CPU orders exceed what Intel can manufacture and described three-to-five-year customer agreements, some containing price and volume commitments. That improves demand visibility, but it does not by itself guarantee delivery capacity or profitability.", "refs": ["intel-q2"]}]}, {"h": {"tr": "Talep başlığı ile finansman gerçeğini ayırmak", "en": "Separating the demand headline from financing"}, "ps": [{"tr": "Intel aynı zamanda 2026 sermaye harcaması öngörüsünü 18 milyar dolardan 20 milyar dolara çıkardı ve gelecek yıl harcamanın anlamlı biçimde artacağını belirtti. İkinci çeyrekte 7 milyar dolar faaliyet nakdi üretse de GAAP sonuç zarar gösterdi. Bu nedenle \"talep güçlü\" ile \"dönüşüm finanse edildi\" aynı sonuç değildir.", "en": "Intel also raised its 2026 capital-spending forecast from $18 billion to $20 billion and indicated that spending would rise materially next year. It generated $7 billion of operating cash in the quarter, while its GAAP result remained a loss. \"Demand is strong\" and \"the transformation is financed\" are therefore different conclusions.", "refs": ["intel-q2", "intel-release"]}, {"tr": "Teyit çizgisi üç parçalı: kısıtlı siparişler teslim edilmiş gelire dönüşüyor mu, brüt marj bunu koruyor mu ve dökümhane harcaması dış müşteri kazanımlarıyla karşılanıyor mu? Üçü birlikte ilerlerse yükselişin temeli güçlenir; yalnız sipariş başlığı ilerlerse fiyat kapasitenin önüne geçmiş olur.", "en": "The confirmation test has three parts: whether constrained orders become delivered revenue, whether gross margin holds during that conversion, and whether foundry spending is matched by external customer wins. Progress on all three would strengthen the case; progress only in the order headline would leave valuation ahead of capacity.", "refs": ["intel-q2", "intel-release"]}]}], "sources": [{"key": "intel-q2", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/intel-sales-profit-forecast-beat-estimates-boosts-spending-plans-on-ai-boom-4809863", "title": {"tr": "Intel satış ve kâr tahminlerini aştı, YZ talebiyle harcama planını yükseltti", "en": "Intel sales and profit forecasts beat estimates as AI demand lifts spending plans"}, "publishedDate": "2026-07-23"}, {"key": "intel-release", "kind": "news", "name": "Intel", "url": "https://www.publicnow.com/view/DFD786CAC6455060E4C33C013A3EE7AB4AB38AF6", "title": {"tr": "Intel 2026 ikinci çeyrek sonuçlarını açıkladı", "en": "Intel reports second-quarter 2026 financial results"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-02", "title": {"tr": "Petrol Şoku Tepki Fonksiyonlarını Sınıyor", "en": "The Oil Shock Tests Policy Reaction Functions"}, "excerpt": {"tr": "ECB faizleri tuttu, ABD getirileri daha sıkı bir patikayı yansıttı, Japonya'nın fiyat göstergeleri ise ayrıştı. Bunlar tek bir ortak karar değil; aynı enerji şokuna ilişkin üç farklı ve hâlâ değişen sinyal.", "en": "The ECB held rates, U.S. yields reflected a tighter path, and Japan's price gauges diverged. These are not one shared policy decision, but three distinct and still-evolving signals around the same energy shock."}, "sections": [{"h": {"tr": "Karar, fiyatlama ve veri aynı şey değil", "en": "A decision, market pricing and data are not the same"}, "ps": [{"tr": "ECB 23 Temmuz'da üç temel faizini sabit tuttu. Banka, enerji görünümünün oynak olduğunu, fiyatların haziran projeksiyonundaki varsayımların ve çatışma öncesi düzeylerin üzerinde kaldığını, tam enflasyon etkisinin ise henüz ortaya çıkmadığını söyledi. Karar veri bağımlı ve toplantı bazında; banka gelecekteki bir faiz patikasına önceden bağlanmadı.", "en": "The ECB left its three key rates unchanged on July 23. It said the energy outlook remained volatile, with prices above both the assumptions in its June projections and pre-conflict levels, while the full inflation effect had yet to emerge. Decisions remain data-dependent and meeting-by-meeting, with no precommitment to a future rate path.", "refs": ["ecb-hold"]}, {"tr": "ABD'de Brent'in 100 doların üzerine çıktığı gün on yıllık tahvil getirisi yaklaşık yüzde 4,69'a yükselirken ilk işsizlik başvuruları 187 bine geriledi. Getiri hareketi, aynı anda gelen enerji ve işgücü verilerinin piyasa fiyatlamasını gösterir; petrolün tek başına belirli bir Fed kararına neden olduğunu kanıtlamaz.", "en": "In the United States, the 10-year Treasury yield moved to roughly 4.69% on the same day that Brent crossed $100 and initial jobless claims fell to 187,000. The yield move reflects market pricing around simultaneous energy and labour signals; it does not establish that oil alone caused a particular future Fed decision.", "refs": ["treasury-yields"]}]}, {"h": {"tr": "Fiyat zincirinin farklı katmanları", "en": "Different layers of the price chain"}, "ps": [{"tr": "Japonya'nın haziran verisi tek yönde hareket etmedi: taze gıda hariç tüketici enflasyonu yüzde 1,6'ya çıkarken, taze gıda ve enerji hariç gösterge yüzde 1,7'ye indi; üretici fiyatları ise yıllık yüzde 7,1 arttı. Aynı fiyat zincirindeki bu ayrışma, tüketici çekirdeği ile firmaların girdi maliyetlerinin henüz aynı ritimde ilerlemediğini gösteriyor. Merkez bankası açısından belirleyici olan tek bir çekirdek oran değil, üretici maliyetinin satış fiyatlarına ve ücretlere hangi gecikmeyle taşındığıdır.", "en": "Japan's June data did not move in one direction: consumer inflation excluding fresh food rose to 1.6%, the measure excluding fresh food and energy eased to 1.7%, and producer prices increased 7.1% from a year earlier. That divergence within the price chain shows consumer core inflation and firms' input costs moving at different speeds. For monetary policy, the decisive question is not one core reading but the lag with which producer costs reach selling prices and wages.", "refs": ["japan-cpi", "japan-ppi"]}, {"tr": "ECB henüz ikinci tur etkiler gözlemlemediğini ve ücret artışının ılımlı olduğunu belirtti. İzlenecek eşik petrolün tek günlük fiyatı değil; enerji maliyetinin ücretlere, şirketlerin satış fiyatı niyetlerine ve enflasyon beklentilerine yayılıp yayılmadığı. Bu kanallar genişlerse tepki fonksiyonu değişebilir; bugünkü veriler henüz böyle bir yayılmaya işaret etmiyor.", "en": "The ECB said it had not yet observed second-round effects and that wage growth remained moderate. The relevant threshold is not one day's oil price, but whether energy costs spread into wages, firms' selling-price intentions, and inflation expectations. A broader pass-through could alter the reaction function, but today's data do not yet point to such a spread.", "refs": ["ecb-hold"]}]}], "sources": [{"key": "ecb-hold", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/press_conference/monetary-policy-statement/2026/html/ecb.is260723~b6fadd48f4.en.html", "title": {"tr": "ECB üç temel faizini sabit tuttu; enerji şokunun tam enflasyon etkisi henüz belirsiz", "en": "ECB holds its three key rates steady as the energy shock's full inflation impact is still unclear"}, "publishedDate": "2026-07-23"}, {"key": "treasury-yields", "kind": "news", "name": "Associated Press", "url": "https://apnews.com/article/stocks-markets-iran-trump-ai-inflation-45b9165d6c518f5bea668b6ba7a89838", "title": {"tr": "Petrol, işgücü verisi ve teknoloji satışları ABD piyasalarını baskıladı", "en": "Oil, labor data and a technology selloff pressure U.S. markets"}, "publishedDate": "2026-07-23"}, {"key": "japan-cpi", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/economy-news/japan-june-core-inflation-accelerates-stays-below-boj-target-4810305", "title": {"tr": "Japonya'nın haziran çekirdek enflasyonu yükseldi ancak BOJ hedefinin altında kaldı", "en": "Japan's June core inflation accelerates but remains below the BOJ target"}, "publishedDate": "2026-07-24"}, {"key": "japan-ppi", "kind": "news", "name": "Bank of Japan", "url": "https://www.boj.or.jp/en/statistics/pi/cgpi_release/cgpi2606.pdf", "title": {"tr": "Haziran 2026 şirket malları fiyat endeksi", "en": "Corporate Goods Price Index for June 2026"}, "publishedDate": "2026-07-10"}], "date": "2026-07-24"}, {"writer": "eco-03", "title": {"tr": "Kapasite Kiralamanın Bedeli: Google Cloud'un Yüzde 82 Büyümesi Marj Testine Giriyor", "en": "The Cost of Rented Capacity: Google Cloud's 82% Growth Faces a Margin Test"}, "excerpt": {"tr": "Bulut geliri ve faaliyet kârı güçlü biçimde büyüdü; Alphabet ise talebi karşılamak için dış kapasite kullanacağını ve sermaye harcamasını artıracağını söylüyor. Büyüme belgelenmiş durumda. Modelin şimdi ölçmesi gereken, ek kapasitenin marj ve nakitte yaratacağı maliyet.", "en": "Cloud revenue and operating profit grew strongly, while Alphabet says it will use outside capacity and raise capital spending to meet demand. The growth is documented. The model now has to measure what incremental capacity will cost in margins and cash."}, "sections": [{"h": {"tr": "Büyüme gerçek, muhasebe sınırı açık", "en": "The growth is real; the accounting boundary is clear"}, "ps": [{"tr": "Önce gelir, sonra marj. Google Cloud ikinci çeyrekte 24,8 milyar dolar gelir ve yaklaşık 8,8 milyar dolar faaliyet kârı bildirdi; yıllık gelir büyümesi yüzde 82'ye ulaştı. Segment bugün hem hızla büyüyor hem de muhasebe bazında faaliyet kârı üretiyor. Modeldeki bir sonraki soru, bu kârlılığın yeni kapasite eklenirken ne kadarının korunacağıdır.", "en": "Revenue first, then margin. Google Cloud reported $24.8 billion in second-quarter revenue and roughly $8.8 billion in operating income, with year-over-year revenue growth reaching 82%. The segment is both growing rapidly and generating accounting operating profit. The next question in the model is how much of that profitability survives as new capacity is added.", "refs": ["alphabet-results"]}, {"tr": "Talebin gücü kapasite kararında görülüyor: yönetim, mevcut müşterilerin ilk taahhütlerinden yaklaşık yüzde 50 fazla harcadığını ve talebi karşılamak için üçüncü taraf veri merkezi kapasitesi kullanacağını söyledi. Yönetim bu tercihin marjları baskılayacağını da belirtiyor. Böylece duyarlılık tek bir girdiye bağlanıyor: kiralama maliyeti ek gelirden hızlı büyürse faaliyet kaldıracı zayıflar; gelir daha hızlı büyürse dış kapasite kendi bedelini çıkarır.", "en": "The strength of demand is visible in the capacity decision: management said existing customers were spending roughly 50% above their initial commitments and that Alphabet would use third-party data-center capacity to serve them. Management also said that choice would pressure margins. The sensitivity therefore turns on one relationship: operating leverage weakens if rental costs grow faster than incremental revenue, while outside capacity earns its keep if revenue grows faster.", "refs": ["cloud-capacity", "cloud-report"]}]}, {"h": {"tr": "Grup nakdi ile segment ekonomisini ayırmak", "en": "Separating group cash flow from segment economics"}, "ps": [{"tr": "Nakit köprüsü grup düzeyinde daha sert görünüyor. Alphabet 2026 sermaye harcaması aralığını 195-205 milyar dolara yükseltti ve çeyrekte yaklaşık 5,9 milyar dolar negatif konsolide serbest nakit akışı bildirdi; aynı dönemde Cloud faaliyet kârı üretti. Grup rakamı ne kadar nakit emildiğini gösteriyor, fakat hangi segmentin bu nakdi tükettiğini tek başına ayırmıyor. Cloud'un getirisi için segment marjını, kiralanan kapasiteyi ve ona düşen yatırım payını aynı tabloda görmek gerekiyor.", "en": "The cash bridge looks harsher at group level. Alphabet raised its 2026 capital-spending range to $195 billion-$205 billion and reported approximately negative $5.9 billion in consolidated free cash flow for the quarter, while Cloud generated operating income. The group figure measures how much cash was absorbed without showing its allocation across segments. Testing Cloud's return requires its segment margin, rented capacity and attributable investment to appear in the same model.", "refs": ["alphabet-results", "cloud-capacity"]}, {"tr": "Modelin dört hareketli girdisi var: kiralanan kapasitenin toplam kapasitedeki payı, sözleşme yükümlülüklerinin gelire dönüşme hızı, segment faaliyet marjı ve sermaye harcamasının nakit üretimine oranı. Kiralanan pay yükselirken marj düşer ve yükümlülükler yavaş çözülürse büyümenin ek getirisi zayıflar; gelir dönüşümü maliyeti aşarsa kapasite yatırımını karşılar. Alphabet bu duyarlılığı kapatacak bütün girdileri henüz açıklamadı; bu nedenle sonuç, tek hüküm yerine bu değişkenlere bağlı bir aralık olarak kurulmalı.", "en": "The model has four moving inputs: rented capacity as a share of total capacity, the pace at which contracted commitments convert into revenue, segment operating margin, and capital spending relative to cash generation. If the rented share rises while margins fall and commitments convert slowly, the incremental return on growth weakens; if conversion outpaces cost, the capacity pays for itself. Alphabet has yet to disclose every input needed to close that sensitivity, so the appropriate output is a range tied to those variables rather than a single verdict.", "refs": ["alphabet-results", "cloud-capacity", "cloud-report"]}]}], "sources": [{"key": "alphabet-results", "kind": "news", "name": "Alphabet", "url": "https://www.publicnow.com/view/9DA6BCAE119C05F38A597E1A5C62A498212FF33E", "title": {"tr": "Alphabet 2026 ikinci çeyrek sonuçlarını açıkladı", "en": "Alphabet announces second-quarter 2026 results"}, "publishedDate": "2026-07-23"}, {"key": "cloud-capacity", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/alphabets-cash-burn-raises-alarm-for-big-tech-as-ai-spending-climbs-4808737", "title": {"tr": "Alphabet'in nakit tüketimi YZ harcaması yükselirken kaygı yarattı", "en": "Alphabet's cash burn raises concern as AI spending climbs"}, "publishedDate": "2026-07-23"}, {"key": "cloud-report", "kind": "news", "name": "IT Pro", "url": "https://www.itpro.com/business/business-strategy/google-clouds-record-results-cant-quiet-concerns-on-ai-spending-and-model-release-timelines", "title": {"tr": "Google Cloud'un rekor sonuçları YZ harcaması ve kapasite kaygılarını bitirmedi", "en": "Google Cloud's record results do not quiet AI spending and capacity concerns"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-04", "title": {"tr": "İki Takvim: Kızıldeniz Riski Şimdi, Yeni Rafineri Yıllar Sonra", "en": "Two Clocks: Red Sea Risk Now, New Refining Capacity Years Away"}, "excerpt": {"tr": "Tanker saldırısı ve ilk rota sapmaları bugünün operasyonel riskini gösteriyor. Southwest'ın mayıs teslimatı önceden kurulmuş kapasiteyi, Dangote'nin yıllara yayılan genişlemesi geleceğe planlanmış kapasiteyi anlatıyor; bugünkü varil dengesi ise başka bir takvimde işliyor.", "en": "A tanker attack and early route diversions establish today's operational risk. Southwest's May delivery represents capacity arranged earlier, while Dangote's multi-year expansion represents capacity planned over several years; today's barrel balance runs on another clock."}, "sections": [{"h": {"tr": "Bugünün riski: saldırı var, kapanma kanıtı yok", "en": "Today's risk: an attack, but no proof of closure"}, "ps": [{"tr": "Brent 23 Temmuz'da yüzde 7 yükselerek 100,69 dolardan, WTI yüzde 6 artışla 92,19 dolardan kapandı. Encelia adlı tankere yönelik saldırı ve gemide çıkan yangın doğrulandı; mürettebatın güvende olduğu bildirildi. Bazı gemilerin rota değiştirmesi kısa vadeli seyir riskini görünür kılıyor. Ancak eldeki haberler boğazın kapandığını doğrulamıyor ve piyasadan kaç varil çekildiğini göstermiyor.", "en": "Brent rose 7% on July 23 to close at $100.69, while WTI gained 6% to $92.19. The attack on the tanker Encelia and the resulting fire were confirmed, with the crew reported safe. Some vessel diversions make the immediate routing risk visible. But available reporting neither confirms a chokepoint closure nor shows how many barrels, if any, have left the market.", "refs": ["oil-100", "shipping-impact"]}, {"tr": "Southwest'ın yaklaşık 48 milyon litre jet yakıtı taşıyan gemisi Houston'dan Panama Kanalı üzerinden Los Angeles'a giderek 28 Mayıs'ta ulaştı. Teslimatın 28 Mayıs tarihi, bunu 23 Temmuz fiyat sıçramasına günlük bir tepkiden ayırıyor ve şirketin Batı Yakası arz riskine karşı önceden kurduğu fiziksel tamponu gösteriyor.", "en": "Southwest's cargo of 12.6 million gallons of jet fuel sailed from Houston through the Panama Canal and arrived in Los Angeles on May 28. Its May 28 arrival places it well before the July 23 price jump and identifies it as an earlier physical buffer against West Coast supply risk.", "refs": ["southwest-fuel"]}]}, {"h": {"tr": "Yarının kapasitesi başka bir takvimde işliyor", "en": "Tomorrow's capacity runs on another clock"}, "ps": [{"tr": "Dangote rafinerisinin genişlemesi için 2,5 milyar dolarlık finansman sağlandı; hedef kapasiteyi günlük 650 bin varilden 1,4 milyon varile çıkarmak. Plan Ekim 2025'te açıklanmıştı ve hedef takvim 2028'e uzanıyor. Sağlanan fonlar Kızıldeniz şokundan aylar önce duyurulan projeyi ilerletiyor; ek çalışan variller inşaat ile devreye almaya bağlı ve bugünkü kesintinin dışında kalıyor.", "en": "Financing of $2.5 billion was secured for the Dangote refinery expansion, which targets an increase from 650,000 to 1.4 million barrels a day. The plan was announced in October 2025 and its target timeline extends to 2028. The secured funds advance a project announced months before the Red Sea shock; additional operating barrels depend on construction and commissioning and therefore sit outside the current disruption.", "refs": ["dangote", "dangote-timeline"]}, {"tr": "Burada iki ayrı fiziksel saat işliyor. Kısa vadede fiilî Babülmendep geçişleri, Yanbu'dan çıkan ihracat, navlun, sigorta primi ve ürün stokları sayılmalı; rota sapmaları zaman, yakıt ve kanal maliyetini hemen artırıyor. Dangote'nin saati ise 2028'e uzanan inşaat, devreye alma ve sürdürülebilir kapasite kullanımından oluşuyor. Biri bugünkü risk primini, diğeri gelecekteki rafineri tamponunu anlatıyor; ikisini birbirine bağlayan tek şey piyasaya gerçekten giren varildir.", "en": "Two physical clocks are running here. In the near term, the count is actual Bab el-Mandeb transits, exports from Yanbu, freight, insurance premiums and product inventories; diversions immediately add time, fuel and canal costs. Dangote's clock runs through construction, commissioning and sustained utilization toward 2028. One measures today's risk premium and the other a future refining buffer; the only link between them is a barrel that actually reaches the market.", "refs": ["oil-100", "shipping-impact", "dangote", "dangote-timeline"]}]}], "sources": [{"key": "oil-100", "kind": "news", "name": "S\u0026P Global", "url": "https://www.spglobal.com/energy/en/news-research/latest-news/crude-oil/072326-oil-tops-100b-after-houthis-attack-two-saudi-tankers-in-red-sea", "title": {"tr": "Husi saldırıları sonrasında petrol 100 doların üzerine çıktı", "en": "Oil tops $100 after Houthi attacks on two tankers in the Red Sea"}, "publishedDate": "2026-07-23"}, {"key": "southwest-fuel", "kind": "news", "name": "Gate News", "url": "https://www.gate.com/fr/news/detail/southwest-airlines-ships-texas-jet-fuel-to-la-amid-supply-concerns-22891599", "title": {"tr": "Southwest arz endişeleri sırasında Teksas jet yakıtını Los Angeles'a taşıdı", "en": "Southwest ships Texas jet fuel to Los Angeles amid supply concerns"}, "publishedDate": "2026-07-23"}, {"key": "dangote", "kind": "news", "name": "Oil \u0026 Gas Journal", "url": "https://www.ogj.com/refining-processing/news/55393205/dangote-secures-funding-to-support-expansion-of-lekki-integrated-complex", "title": {"tr": "Dangote, Lekki kompleksinin genişlemesini destekleyecek finansmanı sağladı", "en": "Dangote secures funding to support expansion of the Lekki complex"}, "publishedDate": "2026-07-23"}, {"key": "shipping-impact", "kind": "news", "name": "Lloyd's List Intelligence", "url": "https://www.lloydslistintelligence.com/resources/blog/red-sea-brief-23-july-2026", "title": {"tr": "23 Temmuz 2026 Kızıldeniz brifingi", "en": "Red Sea brief for July 23, 2026"}, "publishedDate": "2026-07-23"}, {"key": "dangote-timeline", "kind": "news", "name": "Argus Media", "url": "https://www.argusmedia.com/en/news-and-insights/latest-market-news/2746588-dangote-to-expand-refinery-to-1.4mn-b-d-by-2028", "title": {"tr": "Dangote rafineriyi 2028'e kadar günlük 1,4 milyon varile çıkarmayı planlıyor", "en": "Dangote plans to expand refinery to 1.4 million barrels a day by 2028"}, "publishedDate": "2025-10-26"}], "date": "2026-07-24"}, {"writer": "eco-05", "title": {"tr": "İşten çıkarma az görünürken hane baskısını nerede arayacağız?", "en": "Where should we look for household strain when layoffs appear low?"}, "excerpt": {"tr": "İlk işsizlik başvurularının 187 bine düşmesi işini kaybedenlerin akışını; Albertsons'ın indirdiği tahmin ise market kanalındaki baskıyı gösteriyor. Haneler bu iki manşetin ortasında yaşıyor: işi korumak, ücretin sepeti taşıdığı anlamına gelmiyor. Gelir dilimi, reel ücret, çalışma saati ve fiyat-hacim verisi olmadan baskının kime düştüğünü henüz bilmiyoruz.", "en": "Initial jobless claims falling to 187,000 describe the flow of people losing work; Albertsons' lower outlook describes strain in the grocery channel. Households live between those headlines: a retained job says little about whether wages can carry the basket. Income-decile, real-wage, hours-worked and price-volume data are still needed to locate the pressure."}, "sections": [{"h": {"tr": "İki gösterge, iki farklı ölçüm alanı", "en": "Two indicators, two different measurement domains"}, "ps": [{"tr": "18 Temmuz haftasında ilk işsizlik başvuruları 187 bine gerileyerek Eylül 1969'dan beri en düşük haftalık düzeye indi. Bu seri işten çıkarmalara ilişkin yüksek frekanslı bir gösterge; işe alım hızını, çalışılan saati, ücret artışını veya işgücünden çıkışları tek başına ölçmüyor.", "en": "Initial jobless claims fell to 187,000 in the week ended July 18, the lowest weekly level since September 1969. The series is a high-frequency indicator of layoffs; hiring, hours worked, wage growth and exits from the labor force lie outside what this measure captures on its own.", "refs": ["jobless"]}, {"tr": "Albertsons aynı gün daha yumuşak sektör birim eğilimleri ve temkinli tüketiciyi gerekçe göstererek yıllık satış ve kâr tahminlerini düşürdü; düzeltilmiş hisse başına kâr aralığını 2,22-2,32 dolardan 1,75-1,85 dolara çekti. Bu, şirket ve market kanalı için anlamlı bir talep sinyali. Bütün hanelerin tüketimine ilişkin ulusal dağılımı ölçmek için ise daha geniş veriler gerekiyor.", "en": "Albertsons lowered its annual sales and profit forecasts the same day, citing softer industry unit trends and a cautious consumer, and cut its adjusted earnings range from $2.22-$2.32 a share to $1.75-$1.85. That is a meaningful signal for the company and grocery channel. National distributional evidence for all households would require broader data.", "refs": ["albertsons", "albertsons-results"]}]}, {"h": {"tr": "Dağılım tezi için eksik olan veri", "en": "The evidence missing from a distributional claim"}, "ps": [{"tr": "Kasadaki zayıflığın kime ait olduğunu görmek için şirket rehberliğinden hane bütçesine bir köprü kurmak gerekiyor. Bu kaynaklarda medyan hane geliri, gelir dilimine göre reel ücret, hane türüne göre tüketim ve market birim hacmi yer almıyor. Albertsons'ın temkinli tüketici sinyali, dağılımın tamamını çizmek yerine araştırılması gereken baskı noktasını işaret ediyor: hangi gelir grubunun sepetten miktar çıkardığı, hangisinin yalnızca daha ucuz ürüne geçtiği.", "en": "Identifying who is behind the weakness at the checkout requires a bridge from company guidance to household budgets. These sources omit median household income, real wages by income group, consumption by household type, and grocery unit volumes across those groups. Albertsons' cautious-consumer signal therefore points to the distributional question that remains: which households are buying less, and which are merely switching to cheaper products.", "refs": ["jobless", "albertsons", "albertsons-results"]}, {"tr": "Dağılım tezi için sonraki teyit; gelir dilimine göre reel ücret, işe alım ve çalışma saati, hane tüketimi ile Albertsons'ın fiyat-hacim karmasıdır. O zamana kadar savunulabilir sonuç daha dardır: işten çıkarmalar tarihsel olarak düşük görünürken en az bir büyük market zinciri daha zayıf bir tüketim ve kâr görünümü bildiriyor.", "en": "The distributional thesis requires real wages by income group, hiring and hours, household consumption by quantile, and Albertsons' price-volume mix. Until then, the defensible conclusion is narrower: layoffs appear historically low while at least one major grocer reports a weaker demand and profit outlook.", "refs": ["jobless", "albertsons", "albertsons-results"]}]}], "sources": [{"key": "albertsons", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/us-grocer-albertsons-cuts-annual-sales-profit-forecasts-shares-drop-20-4808568", "title": {"tr": "Albertsons yıllık satış ve kâr tahminlerini düşürdü", "en": "Albertsons cuts annual sales and profit forecasts"}, "publishedDate": "2026-07-23"}, {"key": "jobless", "kind": "news", "name": "Associated Press", "url": "https://apnews.com/article/097a210a86c0bebcba2b2625cd04c2dc", "title": {"tr": "ABD işsizlik başvuruları 1969'dan beri en düşük düzeye indi", "en": "U.S. jobless claims fall to their lowest level since 1969"}, "publishedDate": "2026-07-23"}, {"key": "albertsons-results", "kind": "news", "name": "Albertsons", "url": "https://markets.financialcontent.com/prnews.pressrelease/article/bizwire-2026-7-23-albertsons-companies-inc-reports-first-quarter-fiscal-2026-results", "title": {"tr": "Albertsons 2026 mali yılı ilk çeyrek sonuçlarını açıkladı", "en": "Albertsons reports first-quarter fiscal 2026 results"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-06", "title": {"tr": "Oracle'ın Pentagon Tavanı: Gelir Tanıma ile YZ Finansmanı Karşı Karşıya", "en": "Oracle's Pentagon Ceiling: Revenue Recognition Meets AI Financing"}, "excerpt": {"tr": "Pentagon anlaşması Oracle için 7 milyar dolara yakın bir üst sınır belirliyor; tanınmış gelir veya bugünkü nakit değil. YZ ETF'lerinin büyümesi de tek başına borçlu, fonlama zinciri veya zorunlu satış mekanizması göstermiyor.", "en": "The Pentagon agreement sets a ceiling near $7 billion for Oracle; it is not recognized revenue or cash today. Growth in AI ETFs likewise does not independently reveal a debtor, funding chain, or forced-sale mechanism."}, "sections": [{"h": {"tr": "Sözleşme tavanı ile nakit akışını ayırmak", "en": "Separating a contract ceiling from cash flow"}, "ps": [{"tr": "Pentagon, kurum içi yazılım lisanslarını konsolide etmek üzere Oracle'a süresi on yıla kadar uzanan ve değeri yaklaşık 7 milyar dolara kadar çıkabilen bir sözleşme verdi. \"Kadar\" ifadesi tavan değerdir: görev emirlerinin, teslimatların, gelir tanıma takviminin ve fiilî tahsilatın tamamını garanti etmez.", "en": "The Pentagon awarded Oracle a contract of up to roughly $7 billion and as long as 10 years to consolidate on-premises software licenses. \"Up to\" is a ceiling: it does not guarantee every task order, delivery, revenue-recognition event, or cash collection.", "refs": ["oracle-pentagon"]}, {"tr": "Oracle'ın nakit saati hızlandı: şirket 2026 mali yılında yaklaşık 23,7 milyar dolar negatif serbest nakit akışı üretti, yeni mali yıl için yaklaşık 70 milyar dolar sermaye harcaması planladı ve 40 milyar dolara kadar ek borç ile özkaynak finansmanı öngördü. Risk zamanlamada yatıyor; veri merkezi yatırımı peşin finansman isterken müşteri taahhütleri ancak hizmet verilip gelir tanındıkça nakde dönüşüyor. Borç-özkaynak karması, vadeler ve finansman maliyeti bu açığın geçici bir köprü mü yoksa kalıcı bir yük mü olacağını belirleyecek.", "en": "Oracle's cash clock has accelerated: the company generated approximately negative $23.7 billion in free cash flow in fiscal 2026, planned roughly $70 billion of capital spending for the new fiscal year, and expected to raise up to $40 billion in additional debt and equity. The risk lies in timing: data-center investment requires funding upfront, while customer commitments become cash only as services are delivered and revenue is recognized. The debt-equity mix, maturities and funding cost will determine whether that gap is a temporary bridge or a lasting burden.", "refs": ["oracle-financing"]}]}, {"h": {"tr": "Popülerlik, fonlama zinciri değildir", "en": "Popularity is not a funding chain"}, "ps": [{"tr": "J.P. Morgan Asset Management'ın yapay zekâ temalı ETF'lerin varlık büyüklüğünde ilk beş temadan biri hâline geldiğini belirtmesi yatırımcı ilgisini ve tematik yoğunlaşmayı gösteriyor. Ancak ETF varlığı, fonların kaldıraçla finanse edildiğini, aynı teminat zincirini paylaştığını veya satış sırasında tek kişilik bir çıkış kapısı bulunduğunu göstermiyor. Böyle bir risk tezi için fonlama ve piyasa yapısı verisi gerekir.", "en": "J.P. Morgan Asset Management's finding that AI-themed ETFs have become a top-five theme by assets demonstrates investor interest and thematic concentration. ETF assets do not, however, show that the funds are leverage-financed, share one collateral chain, or face a one-person exit during a sale. That risk thesis requires funding and market-structure evidence.", "refs": ["jpm-etf", "jpm-report"]}, {"tr": "Ters stres testi iki ayrı zinciri izliyor. Oracle'da görev emirleri ve gelir tanıma takvimi ile borç-özkaynak karması, serbest nakit akışı, vadeler ve sözleşme kısıtları; yatırım harcamasının yeniden finansman baskısına dönüşüp dönüşmeyeceğini gösterecek. ETF'lerde ise portföy örtüşmesi, kaldıraç, teminat ve itfa likiditesi; tematik yoğunlaşmanın zorunlu satışa dönüşebileceği kanalı ortaya çıkaracak. Popülerliği bulaşmaya bağlamak için belgelenmiş bir fonlama hattı gerekir; şimdilik Oracle'ın finansman yükü ile ETF yoğunlaşması aynı fitil değil, iki ayrı uyarı ışığıdır.", "en": "The reverse stress test follows two separate chains. At Oracle, task orders and revenue recognition, together with the debt-equity mix, free cash flow, maturities and covenants, will show whether capital spending turns into refinancing pressure. In the ETFs, portfolio overlap, leverage, collateral and redemption liquidity will reveal whether thematic concentration has a path to forced selling. Popularity becomes contagion only through a documented funding link; for now, Oracle's financing burden and ETF concentration are two warning lights, not one fuse.", "refs": ["oracle-pentagon", "oracle-financing", "jpm-etf", "jpm-report"]}]}], "sources": [{"key": "oracle-pentagon", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/pentagon-awards-oracle-nearly-7-billion-deal-in-latest-software-consolidation-push-4810096", "title": {"tr": "Pentagon yazılım konsolidasyonu için Oracle'a yaklaşık 7 milyar dolara kadar sözleşme verdi", "en": "Pentagon awards Oracle a deal worth up to nearly $7 billion for software consolidation"}, "publishedDate": "2026-07-23"}, {"key": "jpm-etf", "kind": "news", "name": "J.P. Morgan Asset Management", "url": "https://am.jpmorgan.com/us/en/asset-management/adv/insights/market-themes/artificial-intelligence/", "title": {"tr": "Yapay zekâ yatırım teması ve yoğunlaşma riski", "en": "The artificial-intelligence investment theme and concentration risk"}, "publishedDate": "2026-07-23"}, {"key": "oracle-financing", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/oracle-shares-slide-as-hefty-ai-spending-debt-plans-spook-investors-4737927", "title": {"tr": "Oracle hisseleri yüksek YZ harcaması ve finansman planlarıyla geriledi", "en": "Oracle shares slide as heavy AI spending and financing plans unsettle investors"}, "publishedDate": "2026-06-17"}, {"key": "jpm-report", "kind": "news", "name": "Frank Trades", "url": "https://franktrades.com/2026/07/23/jpmorgan-report-finds-dramatic-jump-in-ai-themed-etfs-despite-rough-quarter/", "title": {"tr": "JPMorgan raporu zorlu çeyreğe rağmen YZ temalı ETF'lerde büyüme buldu", "en": "JPMorgan report finds growth in AI-themed ETFs despite a rough quarter"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-01", "title": {"tr": "Tesla ve Alphabet: Gelir Aştı, Hisse Düştü — Faturayı Harcama Kesti", "en": "Tesla and Alphabet: Revenue Beat, Stock Fell — the Spend Wrote the Bill"}, "excerpt": {"tr": "Alphabet de Tesla da gelirde beklentiyi aştı; ikisinin de hissesi geriledi. Seviye teknik, sebep iktisadi: piyasa büyümeyi değil, o büyümenin marjını ve nakde dönüp dönmediğini tartıyor.", "en": "Alphabet and Tesla both beat on revenue; both stocks fell. The level is technical, the reason is economic: the market is weighing not the growth but its margin, and whether it turns to cash."}, "sections": [{"h": {"tr": "Rakam tuttu, hisse düştü", "en": "The print beat, the stock dumped"}, "ps": [{"tr": "Alphabet ikinci çeyrekte geliri yıllık yüzde 24 artışla 119,8 milyar dolara taşıdı, bulut yüzde 82 büyüdü ve seyreltilmiş hisse başına kâr 9,11 dolara fırladı; buna rağmen hisse seans sonrasında geriledi. Tesla'da da aynı örüntü işledi: gelir yüzde 25,5 artışla 28,24 milyar dolara çıkıp beklentiyi aştı, ama düzeltilmiş hisse başına kâr 0,54 dolarlık beklentiye karşı 0,33 dolarda kaldı ve hisse yüzde 3'ün üzerinde düştü. Fiyat akışı, iyi başlığı değil, altındaki mekanizmayı okudu.", "en": "Alphabet lifted second-quarter revenue 24% to $119.8 billion, cloud grew 82%, and diluted EPS jumped to $9.11 — and still the stock slipped after hours. The same pattern ran at Tesla: revenue rose 25.5% to $28.24 billion, beating estimates, but adjusted EPS was $0.33 against a $0.54 expectation, and the shares fell more than 3%. The tape read the mechanism underneath, not the headline.", "refs": ["alphabet-q2", "tesla-q2"]}, {"tr": "Farkı yaratan kalem harcamaydı. Alphabet yıllık sermaye harcaması beklentisini 180-190 milyar dolardan 195-205 milyar dolara çıkardı; Tesla'nın sermaye harcaması yıllık yüzde 142 artışla 5,79 milyar dolara ulaşınca serbest nakit akışı 1,09 milyar dolar açık verdi. Piyasa anlatıyı değil akışı fiyatlar: iki devde de büyüme gerçek, ama nakde giden yol yapay zekâ harcamasının altında uzuyor.", "en": "The line that made the difference was spend. Alphabet raised its full-year capex outlook to $195-$205 billion from $180-$190 billion; Tesla's capital spending rose 142% to $5.79 billion, turning free cash flow to a $1.09 billion deficit. The market prices flow, not narrative: at both giants the growth is real, but the road to cash runs under the AI spending.", "refs": ["alphabet-q2", "tesla-q2"]}]}, {"h": {"tr": "Marjın kaynağı neresi", "en": "Where the margin comes from"}, "ps": [{"tr": "Tesla'nın faaliyet kâr marjı bir yıl önceki yüzde 4,1'den yüzde 1,4'e daraldı; düzenleyici kredileri hariç otomotiv brüt kâr marjı yüzde 16,3'e indi ve faaliyet giderleri yüzde 47 artışla 4,35 milyar dolara çıktı. Hacim yalan söylemez: faaliyet nakit akışı yüzde 85 artışla 4,70 milyar dolara ulaştı, ama harcama temposu nakdi eksiye taşıdı. Alphabet'te ise faaliyet marjı yüzde 34'e genişledi — yani buradaki soru marjın zayıflığı değil, harcamanın ne zaman getiriye döneceği.", "en": "Tesla's operating margin narrowed to 1.4% from 4.1% a year earlier; automotive gross margin ex-credits fell to 16.3% and operating expenses rose 47% to $4.35 billion. Volume doesn't lie: operating cash flow climbed 85% to $4.70 billion, but the spending pace pushed cash negative. At Alphabet, operating margin widened to 34% — so the question there isn't weak margin but when the spend converts to return.", "refs": ["tesla-q2", "alphabet-q2"]}, {"tr": "Dün bu köşede sorduğumuz soru marjdı: primin yakıtı gerçek mi, yoksa tek seferlik bir kalem mi? Bugün iki kâğıt aynı dersi veriyor, ama zıt uçlardan. Tesla'da iyi haber çıkış kapısına döndü, çünkü büyümenin faturası marjla değil harcamayla ödendi; Alphabet'te güçlü marja rağmen sorulan soru, 205 milyar dolarlık sermaye harcamasının hangi çeyrekte nakde döneceği. İzlenecek eşik teknik değil: harcama eğrisinin serbest nakit akışıyla kesiştiği nokta.", "en": "Yesterday in this column the question was margin: is the rally's fuel real, or a one-off line item? Today two names teach the same lesson from opposite ends. At Tesla, good news became the exit because the growth was paid for with spend, not margin; at Alphabet, despite strong margin, the question is which quarter the $205 billion of capex turns to cash. The threshold to watch isn't technical: it's where the spending curve crosses free cash flow.", "refs": ["tesla-q2", "alphabet-q2", "self-0722"]}]}], "sources": [{"key": "alphabet-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/alphabet-tesla-test-investor-patience-ai-spending-overshadows-growth.html", "title": {"tr": "Alphabet gelirde beklentiyi aştı, ancak yıllık sermaye harcaması hedefini 205 milyar dolara çıkardı", "en": "Alphabet beats on revenue but lifts full-year capital-spending target to as much as $205 billion"}, "publishedDate": "2026-07-22"}, {"key": "tesla-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/tesla-tsla-q2-2026-earnings-report.html", "title": {"tr": "Tesla gelirde beklentiyi aştı ama kârda ıskaladı; serbest nakit akışı eksiye döndü", "en": "Tesla beats on revenue but misses on profit as free cash flow turns negative"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-07-22/", "title": {"tr": "Rakam Değil, Marj Konuşuyor: Hangi Primin Yakıtı Gerçek?", "en": "It's the Margin, Not the Print: Which Rally Has Real Fuel?"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-03", "title": {"tr": "Bir Kılavuz İndirimi, Bir Lisans Geliri ve Mahkemedeki Bir Birleşme: IBM, Reddit, Paramount", "en": "A Guidance Cut, a Licensing Line and a Merger in Court: IBM, Reddit, Paramount"}, "excerpt": {"tr": "IBM kılavuzu indirdi, Reddit'in 60 milyon dolarlık Google geliri sorgulanıyor, Paramount-Warner birleşmesi AB onayını aldı ama ABD'de durduruldu. Hikâye bedava; sermaye ve gelir kalemi değil.", "en": "IBM cut guidance, Reddit's $60 million Google line is in question, and the Paramount-Warner merger won EU approval but was halted in the US. The story is free; the capital and the revenue line are not."}, "sections": [{"h": {"tr": "Kılavuzun kalitesi", "en": "The quality of the guidance"}, "ps": [{"tr": "IBM'in ikinci çeyrek geliri 17,16 milyar dolar, düzeltilmiş hisse başına kârı 2,93 dolar oldu; ikisi de beklentiyi ıskaladı. Asıl sinyal kılavuzdaydı: şirket sabit kur bazlı yıllık gelir büyümesi beklentisini yüzde 5'in üzerinden yüzde 4-5'e çekti. Ocak'ta konulan ve Nisan'da yinelenen hedefin bu şekilde indirilmesi, \"düzeltilmiş\" ile gerçeğin arasındaki farkın nerede saklandığını gösteriyor.", "en": "IBM's second-quarter revenue was $17.16 billion and adjusted EPS $2.93; both missed. The real signal was the guidance: the company cut its constant-currency revenue-growth outlook to 4%-5% from more than 5%. Lowering a target set in January and reaffirmed in April is where the gap between 'adjusted' and actual hides.", "refs": ["ibm-q2"]}, {"tr": "Modeli açınca kaynak netleşiyor: yüksek marjlı yazılım yüzde 5 artışla 7,76 milyar dolara çıkarken, altyapı geliri yüzde 7 gerileyip 3,84 milyar dolara indi ve Z ana bilgisayar geliri yüzde 42 düştü. Genel Müdür Arvind Krishna, kurumların fiyat artışı öncesi donanım alımını öne çektiğini söyledi — yani bu çeyreğin zayıflığının bir kısmı, geçmiş çeyreklerin ödünç alınmış gücü. Tek bir varsayım, ana bilgisayar döngüsü, tüm gelir çizgisini taşıyor.", "en": "Open the model and the source is clear: high-margin software rose 5% to $7.76 billion, while infrastructure fell 7% to $3.84 billion and Z mainframe revenue dropped 42%. CEO Arvind Krishna said customers pulled hardware purchases forward ahead of price increases — so part of this quarter's weakness is strength borrowed from past quarters. A single assumption, the mainframe cycle, carries the whole revenue line.", "refs": ["ibm-q2"]}]}, {"h": {"tr": "Bir gelir kaleminin kırılganlığı", "en": "The fragility of one revenue line"}, "ps": [{"tr": "Reddit, Google'ın içeriğine yapay zekâ eğitimi için erişimini sınırlamayı değerlendirdiği haberiyle yaklaşık yüzde 6 geriledi. Mesele tam da bir gelir kaleminin kalitesi: 2024'te yapılan lisans anlaşması yıllık yaklaşık 60 milyon dolar; Wells Fargo, Reddit çekilirse 500 milyon dolarlık lisans gelirini kaybedebileceğini hesaplıyor. \"Platform\" sözü, brüt marjda görünene kadar bir şey ifade etmez — burada aynı platform, kendi trafiğini yiyen bir aramayla besleniyor.", "en": "Reddit fell about 6% on a report it is weighing whether to limit Google's access to its content for AI training. The point is exactly the quality of a revenue line: the 2024 licensing deal is worth about $60 million a year, and Wells Fargo reckons Reddit could lose $500 million in licensing revenue if it walks. 'Platform' means nothing until it shows in gross margin — and here the same platform is fed by a search that eats its own traffic.", "refs": ["reddit-google"]}, {"tr": "Birleşme tarafında Paramount Skydance, Warner Bros. Discovery devralması için AB onayını aldı; koşul, Universal ile Avrupa'daki film dağıtım ortak girişiminden 13 ay içinde vazgeçmesi. Ama sinerji iddiası hâlâ mahkemede sınanıyor: Kaliforniya'daki bir federal yargıç, 12 eyaletin talebiyle birleşmeyi durdurdu ve duruşma 3 Ağustos'a kaldı. Anlaşmanın değeri, kâğıttaki onayla değil, o koşulun ve davanın ardından geriye kalan nakit akışıyla ölçülür.", "en": "On the merger side, Paramount Skydance won EU approval for the Warner Bros. Discovery takeover, conditioned on dropping its European film-distribution joint venture with Universal within 13 months. But the synergy claim is still tested in court: a federal judge in California halted the merger at 12 states' request, with a hearing set for 3 August. The deal's worth is measured not by paper approval but by the cash flow left after that condition and that lawsuit.", "refs": ["paramount-wbd"]}]}, {"h": {"tr": "Sonraki çeyrekte ne izlenir", "en": "What to watch next quarter"}, "ps": [{"tr": "Dün bu köşede sorduğum soru \"nakit nereye gitti\" idi ve 110 milyar dolarlık bir birleşmenin sinerji iddiasının mahkemede sınandığını yazmıştım; hikâye bedava, sermaye değil. Bugün aynı ders üç kâğıda yayılıyor. İzleyeceğim üç şey net: IBM'in ana bilgisayar döngüsünün öne çektiği talebi ikinci yarıda geri ödeyip ödemeyeceği, Reddit'in 60 milyon dolarlık kalemi savunurken kullanıcı trafiğinde ne kaybedeceği, ve Paramount-Warner sinerjisinin 3 Ağustos duruşmasından sonra hangi fiyata gerçek nakde döneceği. Üçünde de model, sonunda fiyatı da tartar.", "en": "Yesterday in this column the question was 'where did the cash go,' and I wrote that a $110 billion merger's synergy claim was being tested in court; the story is free, the capital isn't. Today the same lesson spreads across three names. Three things I'll watch are clear: whether IBM's mainframe cycle repays in the second half the demand it pulled forward, what Reddit loses in user traffic while defending a $60 million line, and at what price the Paramount-Warner synergy turns to real cash after the 3 August hearing. In all three, the model, in the end, weighs the price too.", "refs": ["ibm-q2", "reddit-google", "paramount-wbd", "self-0722"]}]}], "sources": [{"key": "ibm-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/ibm-q2-earnings-report-2026.html", "title": {"tr": "IBM, ana bilgisayar geliri yüzde 42 düşünce yıllık gelir beklentisini indirdi", "en": "IBM cuts full-year revenue forecast as mainframe sales fall 42%"}, "publishedDate": "2026-07-22"}, {"key": "reddit-google", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/reddit-stock-google-ai-content-deal.html", "title": {"tr": "Reddit hissesi, Google ile yapay zekâ içerik anlaşmasını yenilemeyebileceği haberiyle geriledi", "en": "Reddit shares fall on a report it may not renew its Google AI content deal"}, "publishedDate": "2026-07-22"}, {"key": "paramount-wbd", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/european-commission-paramount-wbd-approval.html", "title": {"tr": "AB, Paramount'un Warner Bros. Discovery'yi devralmasına koşullu onay verdi; ABD'de dava sürüyor", "en": "EU clears Paramount's takeover of Warner Bros. Discovery with conditions as a US challenge continues"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-22/", "title": {"tr": "Anlatı Halka Arza Koştu, Model Özelde Kaldı: Primin Faturasını Kim Öder?", "en": "The Narrative Ran to the IPO, the Model Stayed Private: Who Pays for the Mark?"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-02", "title": {"tr": "Vergiyi Kim Koyar, Talebi Kim Öder: Yetki Tartışması ile Yakıt Faturasının Ortak Denklemi", "en": "Who Sets the Tariff, Who Pays in Demand: The Shared Equation of an Authority Fight and a Fuel Bill"}, "excerpt": {"tr": "Wyden'ın tasarısı gümrük vergisi yetkisini kime ait olduğunu soruyor; Southwest'in yakıt faturası ise aynı şoku bilançoya yazıyor. İkisi de arz yanlı bir vergi ve ikisi de etkin talepten çıkıyor.", "en": "Wyden's bill asks who owns the tariff power; Southwest's fuel bill writes the same shock onto the balance sheet. Both are a supply-side tax, and both come out of effective demand."}, "sections": [{"h": {"tr": "Gümrük vergisi kimin bilançosuna yazılır", "en": "Whose balance sheet the tariff lands on"}, "ps": [{"tr": "Önce ortodoks masalı bir kenara koyalım: gümrük vergisi \"yabancıya kesilen\" bir ceza değildir; ithalatçının, sonra da hane halkının bilançosuna yazılan bir vergidir. Senatör Ron Wyden'ın sunduğu \"2026 Kongre Ticaret Yetkileri Reformu Yasası\", başkanın 301, 201 ve 232'nci maddeler kapsamındaki vergileri için Kongre onayını şart koşuyor, 122 ve 338'inci maddeleri ise tümüyle kaldırıyor. Tasarının özü teknik bir ayrıntı değil: bu vergiyi kimin koyabileceği, yani kamu kesiminin harcama-vergi dengesini kimin elinde tuttuğu sorusu.", "en": "Start by dropping the orthodox tale: a tariff is not a penalty 'charged to the foreigner'; it is a tax written onto the importer's, then the household's, balance sheet. Senator Ron Wyden's Congressional Trade Powers Reform Act of 2026 would require congressional approval for tariffs under Sections 301, 201 and 232, and eliminate Sections 122 and 338 outright. The bill's core is not a technicality: it is the question of who may set that tax — who holds the state's spending-and-tax lever.", "refs": ["wyden-tariff"]}, {"tr": "Tasarı, Senato Maliye ile Meclis Gelir ve Yollar komitelerinden beşer üyeyle bir Gümrük ve Ticaret Ortak Komitesi kuruyor ve başkanlık önerilerine 30 güne kadar inceleme süresi tanıyor. Wyden, düzenlemeyi Trump'ın Kanada mallarına yüzde 50 misilleme vergisi planının ardından duyurdu. Devlet ve kurumları paranın mimarisidir, piyasaya giren yabancı değil: yetkinin nerede durduğu, ithalat vergisinin ne zaman ve kimin üzerine bineceğini belirler.", "en": "The bill creates a Joint Committee on Tariffs and Trade with five members each from Senate Finance and House Ways and Means, giving presidential proposals up to 30 days of review. Wyden announced it after Trump's plan for 50% retaliatory tariffs on Canadian goods. The state and its institutions are money's architecture, not an intruder in the market: where the authority sits determines when, and on whom, the import tax falls.", "refs": ["wyden-tariff"]}]}, {"h": {"tr": "Yakıt: ödenen tarafı görünmeyen bir vergi", "en": "Fuel: a tax whos
