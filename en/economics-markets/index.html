ği göstermez. Budanmış ortalama aynı dönemde yüzde 3,5 altına inerse, bu okuma zayıflar ve düşüşün budanan uçlarla sınırlı kalmadığı kabul edilmelidir.", "en": "The threshold can be set as follows. If the trimmed mean stays at or above 3.5 percent through the September release while the housing group runs above 6 percent, the fall in the headline is a composition effect and shows no change in the underlying process. If the trimmed mean instead drops below 3.5 percent over the same period, this reading weakens and the decline must be accepted as extending beyond the trimmed tails.", "refs": ["abs-cpi"]}]}], "sources": [{"key": "abs-cpi", "kind": "news", "name": "Australian Bureau of Statistics", "url": "https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release", "title": {"tr": "Avustralya'da yıllık enflasyon haziranda yüzde 3,8'e indi, budanmış ortalama yerinde kaldı", "en": "Australian annual inflation eased to 3.8 percent in June while the trimmed mean held"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-03", "title": {"tr": "Net kâr, faaliyet kârını 33,4 trilyon won aştığında", "en": "When net profit runs 33.4 trillion won above operating profit"}, "excerpt": {"tr": "SK hynix'in net marjı yüzde 118 olarak raporlandı. Bu oran bellek işinin kazanma gücünü ölçmüyor; iki satır arasındaki farkı açıklayan kalem yayında adlandırılmıyor.", "en": "SK hynix reported a net margin of 118 percent. That ratio does not measure the memory business's earning power, and the release does not name the line explaining the gap between the two."}, "sections": [{"h": {"tr": "İki satır, iki farklı büyüklük", "en": "Two lines, two different magnitudes"}, "ps": [{"tr": "SK hynix ikinci çeyrekte 79.318,7 milyar won gelir, 60.542,6 milyar won faaliyet kârı ve 93.922,6 milyar won net kâr bildirdi. Faaliyet marjı yüzde 76, net marj yüzde 118 olarak raporlandı. Bir şirketin net kârı gelirini aştığında, aradaki fark tanım gereği faaliyet dışı bir kalemden gelir; burada söz konusu fark yaklaşık 33,4 trilyon won.", "en": "SK hynix reported second-quarter revenue of 79,318.7 billion won, operating profit of 60,542.6 billion won and net income of 93,922.6 billion won. The operating margin was reported at 76 percent and the net margin at 118 percent. When a company's net income exceeds its revenue, the difference comes by definition from a non-operating line; here that difference is about 33.4 trillion won.", "refs": ["skhynix-q2"]}, {"tr": "Yayın bu kalemi adlandırmıyor. Ne olabileceğine dair birkaç aday var: elde tutulan paylardaki değerleme kazançları, özkaynak yöntemiyle konsolide edilen iştirak gelirleri, kur farkı ya da ertelenmiş vergi varlığının kayda alınması. Hangisi olduğu bilinmeden yüzde 118 net marjı bir dönemden diğerine taşımak mümkün değildir.", "en": "The release does not name that line. There are several candidates: valuation gains on holdings, income from equity-accounted affiliates, foreign-exchange effects or the recognition of a deferred tax asset. Without knowing which, a 118 percent net margin cannot be carried from one period into the next.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "İncelenebilir olan satır", "en": "The line that can be inspected"}, "ps": [{"tr": "Faaliyet satırı ise açıklanmış ve karşılaştırılabilir. Gelir bir yıl önceki 22.232 milyar won düzeyine göre yüzde 257, faaliyet kârı 9.212,9 milyar won düzeyine göre yüzde 557 arttı. Çeyreklik karşılaştırmada gelir 52.576,3 milyar won düzeyinden yüzde 51, faaliyet kârı 37.610,3 milyar won düzeyinden yüzde 61 yükseldi. Faaliyet kârının gelirden hızlı artması, artışın hacimden çok fiyat ve ürün karmasından geldiğine işaret eder.", "en": "The operating line, by contrast, is disclosed and comparable. Revenue rose 257 percent from 22,232 billion won a year earlier and operating profit 557 percent from 9,212.9 billion won. Sequentially, revenue rose 51 percent from 52,576.3 billion won and operating profit 61 percent from 37,610.3 billion won. Operating profit growing faster than revenue indicates that the gain came from price and product mix rather than from volume.", "refs": ["skhynix-q2"]}, {"tr": "Nakit tarafında da yayının verdiği kadarını söylemek gerekir. Nakit ve nakit benzerleri çeyrek boyunca 33,6 trilyon won artarak 88 trilyon won düzeyine, net nakit pozisyonu 69,4 trilyon won düzeyine çıktı; toplam borç 0,7 trilyon won azalarak 18,6 trilyon won oldu. Faaliyet kârı 60.542,6 milyar won iken nakit bakiyesinin bunun yarısı kadar artması olağandır; aradaki farkın ne kadarının yatırım harcamasına gittiğini söylemek için nakit akış tablosu gerekir ve bu yayında yer almıyor.", "en": "On the cash side, only what the release provides can be said. Cash and equivalents rose 33.6 trillion won over the quarter to 88 trillion won and the net cash position to 69.4 trillion won, while total debt fell 0.7 trillion won to 18.6 trillion won. With operating profit at 60,542.6 billion won, a cash balance rising by about half that amount is unremarkable; saying how much of the difference went into capital expenditure requires the cash flow statement, which this release does not carry.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "Bir sonraki dosyada aranacak kalem", "en": "The line to look for in the next filing"}, "ps": [{"tr": "Şirket ayrıca yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını, HBM4 ürününde seri sevkiyatın başladığını ve 321 katmanlı NAND ürünlerinin yıl sonuna kadar yurt içi kapasitenin yaklaşık yüzde 50 düzeyine çıkarılmasının hedeflendiğini bildirdi. Bunlar kapasite ve müşteri bağlılığına dair somut ifadelerdir; ancak hiçbiri sözleşme hacmi, birim fiyat ya da ödeme takvimi içermiyor, dolayısıyla gelir modeline girdi olarak konulamaz.", "en": "The company also said it had signed long-term agreements with around 10 customers, that mass shipments of HBM4 had begun, and that it aims to bring 321-layer NAND products to about 50 percent of domestic capacity by year end. These are concrete statements about capacity and customer commitment, yet none of them contains contract volume, unit price or a payment schedule, so none can be entered into a revenue model.", "refs": ["skhynix-q2"]}, {"tr": "Üç gün önce bu köşede, Nvidia ile SK Group arasındaki 500 milyar dolar tutarındaki girişimin bir model girdisi sayılamayacağını, bunun için bağlayıcı bir tedarik sözleşmesinin imzalanması ve kapasite yatırımının finansal tablolarda ayrıştırılması gerektiğini yazmıştım. Bu çeyrek yayını ikisini de getirmiyor; uzun vadeli anlaşmalardan söz ediyor, hacim ve fiyat vermiyor. Aranacak kalem üçüncü çeyrek finansal raporundaki faaliyet dışı gelir satırıdır: 33,4 trilyon won tutarındaki farkın tekrarlamayan bir değerleme kazancında yoğunlaştığı görülürse, yüzde 118 net marj bir sonraki çeyreğe taşınmaz.", "en": "Three days ago in this column I wrote that the 500 billion dollar initiative between Nvidia and SK Group could not count as a model input until a binding supply contract was signed and the capacity investment was broken out in the financial statements. This quarterly release delivers neither: it speaks of long-term agreements while giving no volume and no price. The line to look for is non-operating income in the third-quarter financial report. If the difference of about 33.4 trillion won turns out to be concentrated in a non-recurring valuation gain, the 118 percent net margin will not carry into the next quarter.", "refs": ["skhynix-q2", "history-loi"]}]}], "sources": [{"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}, {"key": "history-loi", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-26/", "title": {"tr": "500 milyar dolar tutarında bir niyet mektubu neyi bağlıyor?", "en": "What a $500 billion letter of intent actually binds"}, "publishedDate": "2026-07-26"}], "date": "2026-07-29"}, {"writer": "eco-04", "title": {"tr": "Bir alüminyum darboğazı Ford Pro segmentinden 0,6 milyar dolar götürdü", "en": "An aluminium bottleneck took 0.6 billion dollars out of the Ford Pro segment"}, "excerpt": {"tr": "Ford yıl sonu öngörüsünü yükseltti ve iyileşmenin yaklaşık 1 milyar dolar kadarını bir metalin geri gelmesine bağladı. Bu bir tedarik hikâyesidir ve talep tarafında başlamıyor.", "en": "Ford raised its full-year guidance and attributed about 1 billion dollars of the improvement to a metal coming back. This is a supply story, and it does not begin on the demand side."}, "sections": [{"h": {"tr": "Metal, segmentin rakamını yazdı", "en": "The metal wrote the segment's number"}, "ps": [{"tr": "Ford şirketinin ikinci çeyrek yayınında Ford Pro segmenti 17,8 milyar dolar gelir üzerinden 1,7 milyar dolar EBIT ve yüzde 9,7 marj bildirdi. EBIT bir yıl öncesine göre 0,6 milyar dolar geriledi ve şirket bunun nedenini doğrudan yazıyor: geçici Novelis kaynaklı alüminyum tedarik kısıtından toparlanma sürüyor. Aynı yayın, alüminyum tedarik kısıtının çeyrekteki toptan satış hacimlerini etkilediğini de belirtiyor.", "en": "In the second-quarter release from Ford, the Ford Pro segment reported 1.7 billion dollars of EBIT on 17.8 billion dollars of revenue, a 9.7 percent margin. EBIT fell 0.6 billion dollars from a year earlier, and the company writes the cause directly: it continues to recover from temporary Novelis-related aluminium supply constraints. The same release states that aluminium supply constraints affected wholesale volumes in the quarter.", "refs": ["ford-q2"]}, {"tr": "Bir metalin bir kamyon gövdesine dönmesi ile o kamyonun bayiye faturalanması arasındaki zincir kısadır ve ikame edilmesi zordur. Alüminyum levha, gövde presine belirli bir alaşım ve kalınlıkta girer; başka bir tedarikçiden aynı özellikte levha almak sertifikasyon ve kalıp uyumu gerektirir. Bu yüzden tek bir tedarikçideki kesinti hacme birebir geçer ve hacim düştüğünde sabit maliyetler aynı kalır. Segmentin marjı buradan eksilir.", "en": "The chain from a metal becoming a truck body to that truck being invoiced to a dealer is short and hard to substitute. Aluminium sheet enters the body press at a specified alloy and gauge; sourcing sheet of the same specification from another supplier requires certification and tooling compatibility. An interruption at a single supplier therefore passes straight into volume, and when volume falls, fixed costs do not. The segment's margin is reduced from there.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yükseltilen öngörünün içindeki kalem", "en": "The item inside the raised guidance"}, "ps": [{"tr": "Ford yıl sonu düzeltilmiş EBIT öngörüsünü 8,5-10,5 milyar dolar aralığından 10-11 milyar dolar aralığına, düzeltilmiş serbest nakit akışı öngörüsünü 5-6 milyar dolar aralığından 6-7 milyar dolar aralığına çıkardı. Yayın, Novelis kaynaklı yıllık etkiyi yaklaşık 1 milyar dolar olarak veriyor ve bunun yılın ikinci yarısına ağırlıklı, net bir EBIT lehine katkı olduğunu belirtiyor. Yükseltmenin alt sınırındaki iyileşmenin büyük bölümü, tanımı gereği bu kalemle aynı büyüklüktedir.", "en": "Ford raised full-year adjusted EBIT guidance from a range of 8.5 to 10.5 billion dollars to a range of 10 to 11 billion dollars, and adjusted free cash flow guidance from a range of 5 to 6 billion dollars to a range of 6 to 7 billion dollars. The release puts the Novelis-related year-over-year impact at about 1 billion dollars and describes it as a net EBIT tailwind heavily weighted to the second half of the year. Most of the improvement at the lower bound of the raise is, by construction, the same size as that item.", "refs": ["ford-q2"]}, {"tr": "Karşı okuma da yayının içinde duruyor ve göz ardı edilmemeli. Ford Blue 26,1 milyar dolar gelir üzerinden 1,1 milyar dolar EBIT bildirdi ve bu kalem 0,5 milyar dolar arttı; şirket bunu kamyonlar, arazi araçları ve hibrit modellerdeki fiyatlama gücüne bağlıyor. Yani çeyreğin toplam 2,5 milyar dolar düzeyindeki düzeltilmiş EBIT rakamında metalden bağımsız bir iyileşme de var. Yayın yaklaşık 1 milyar dolar tutarındaki etkiyi Novelis kaynağına atfediyor, geri kalanını kalem kalem ayrıştırmıyor.", "en": "The counter-reading is also inside the release and should not be set aside. Ford Blue reported 1.1 billion dollars of EBIT on 26.1 billion dollars of revenue, up 0.5 billion dollars, which the company attributes to pricing power in trucks, off-roaders and hybrid models. So within the quarter's total adjusted EBIT of 2.5 billion dollars there is an improvement independent of the metal. The release attributes an impact of about 1 billion dollars to the Novelis constraint and does not decompose the remainder line by line.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yayının vermediği ve ölçülebilecek olan", "en": "What the release withholds and what can be measured"}, "ps": [{"tr": "Fiziksel zincirin ölçüsü eksiktir. Yayın tedarikçinin adını ve kısıtın niteliğini veriyor; hangi tesis, hangi alaşım, kaç ton ve kaç haftalık kesinti olduğunu vermiyor. Bu ayrıntılar olmadan kısıtın büyüklüğü ile 0,6 milyar dolar tutarındaki EBIT kaybı arasındaki oran bağımsız olarak doğrulanamaz; elde yalnızca şirketin kendi atfı kalır.", "en": "The measure of the physical chain is missing. The release gives the supplier's name and the nature of the constraint; it does not give the plant, the alloy, the tonnage or the number of weeks lost. Without those details the ratio between the size of the constraint and the EBIT shortfall of 0.6 billion dollars cannot be independently verified, and only the company's own attribution remains.", "refs": ["ford-q2"]}, {"tr": "Ölçülebilecek olan ise segment marjıdır. Şirket katkının ikinci yarıya ağırlıklı olduğunu söylediğine göre, kısıt bağlayıcı neden ise Ford Pro segmentinin EBIT marjı üçüncü ve dördüncü çeyrekte yüzde 9,7 düzeyinin belirgin şekilde üzerine çıkmalıdır. Segmentin yıl sonu EBIT öngörüsü 6,5-7,5 milyar dolar aralığından 7,0-7,5 milyar dolar aralığına çekildi; bu aralığın tutturulması ve marjın toparlanmaması aynı anda gerçekleşirse, açıklamayı metalin dışında aramak gerekir.", "en": "What can be measured is the segment margin. Since the company says the contribution is weighted to the second half, if the constraint is the binding cause then the Ford Pro segment's EBIT margin should rise appreciably above 9.7 percent in the third and fourth quarters. The segment's full-year EBIT guidance was narrowed from a range of 6.5 to 7.5 billion dollars to a range of 7.0 to 7.5 billion dollars. If that range is met while the margin does not recover, the explanation must be sought outside the metal.", "refs": ["ford-q2"]}]}], "sources": [{"key": "ford-q2", "kind": "news", "name": "Ford Motor Company", "url": "https://www.sec.gov/Archives/edgar/data/37996/000003799626000155/exhibit99tojuly282026for.htm", "title": {"tr": "Ford ikinci çeyrekte zarar açıkladı, yıl sonu faaliyet kârı öngörüsünü yukarı çekti", "en": "Ford posts a second-quarter loss and raises its full-year operating profit guidance"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-05", "title": {"tr": "Yüzde 1,1 artış, yüzde 4,2 enflasyonun altında kaldı", "en": "A 1.1 percent gain landed under 4.2 percent inflation"}, "excerpt": {"tr": "ABD konut fiyatları on ikinci ay üst üste reel olarak geriledi. Ulusal ortalama iki uç şehrin arasında bir yerde duruyor ve ikisini de anlatmıyor.", "en": "US home prices fell in real terms for a twelfth consecutive month. The national average sits somewhere between two extreme cities and describes neither of them."}, "sections": [{"h": {"tr": "Nominal artış, reel kayıp", "en": "A nominal gain, a real loss"}, "ps": [{"tr": "S\u0026P Cotality Case-Shiller ulusal konut fiyat endeksi mayısta yıllık yüzde 1,1 arttı; nisandaki artış yüzde 0,9 idi. On şehirlik bileşik yüzde 2,4, yirmi şehirlik bileşik yüzde 1,6 yükseldi. Yayının kendisi bunun ne anlama geldiğini söylüyor: mayıs enflasyonu yüzde 4,2 olduğu için konut değerleri üst üste on ikinci ay reel olarak geriledi.", "en": "The S\u0026P Cotality Case-Shiller national home price index rose 1.1 percent over the year in May, against 0.9 percent in April. The ten-city composite rose 2.4 percent and the twenty-city composite 1.6 percent. The release itself says what that means: with May inflation at 4.2 percent, home values fell in real terms for a twelfth consecutive month.", "refs": ["case-shiller"]}, {"tr": "Bir ev, sahibi için satılana kadar nakde dönmeyen bir varlıktır; ama borç ona göre alınır ve harcama kararları ona bakılarak verilir. Bir yıl boyunca nominal olarak yüzde 1,1 değerlenip yüzde 4,2 enflasyonla karşılaşan bir hane, kâğıt üzerinde kazanç görür ve alım gücü olarak kaybeder. Bu kaybın manşette görünmemesinin nedeni, endeksin nominal yayımlanmasıdır.", "en": "A house is an asset that does not turn into cash for its owner until it is sold, yet debt is taken against it and spending decisions are made by looking at it. A household whose home appreciates 1.1 percent in nominal terms over a year while inflation runs at 4.2 percent sees a gain on paper and a loss in purchasing power. The reason that loss does not appear in the headline is that the index is published in nominal terms.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Ortalamanın altındaki dağılım", "en": "The distribution under the average"}, "ps": [{"tr": "Yayındaki şehir verileri, ulusal rakamın kimseyi tarif etmediğini gösteriyor. Chicago yıllık yüzde 6,9 ile en güçlü, Las Vegas eksi yüzde 1,9 ile en zayıf pazar. Aradaki fark 8,8 puan. Chicago şehrinde ev sahibi olan bir hane hem nominal hem reel kazandı; Las Vegas şehrinde olan hem nominal hem reel kaybetti. Ulusal yüzde 1,1 ikisinin arasında durur ve ikisini de anlatmaz.", "en": "The city figures in the release show that the national number describes nobody. Chicago is the strongest market at 6.9 percent year on year and Las Vegas the weakest at minus 1.9 percent, a gap of 8.8 percentage points. A household that owns in Chicago gained both nominally and in real terms, while one that owns in Las Vegas lost on both counts. The national 1.1 percent sits between them and describes neither.", "refs": ["case-shiller"]}, {"tr": "Bu dağılımın hanelere göre değil, konuma göre işlemesi önemlidir. Aynı gelir, aynı meslek, aynı borç yükü; farklı şehir. Bu farkın kaynağı hane davranışı değil, yerel arz ve yerel talep koşullarıdır. Aynı verilerle uyumlu ikinci bir açıklama da mümkündür: şehirler arası fark, hane koşullarından çok yeni konut arzındaki farklardan doğuyor olabilir ve endeks tek başına bu ikisini ayıramaz.", "en": "What matters is that this distribution runs by location rather than by household. Same income, same occupation, same debt burden, different city. The source of the difference is local supply and local demand conditions rather than household behaviour. A second explanation fits the same data: the gap between cities may arise from differences in new housing supply rather than in household circumstances, and the index alone cannot separate the two.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Satın almak isteyen taraf", "en": "The side that wants to buy"}, "ps": [{"tr": "Satmak istemeyen ev sahibi için bu kayıp kâğıt üstünde kalır. Satın almak isteyen için tablo başkadır: yayın konut kredisi faizlerinin yüzde 6,5 düzeyinde kalmasının satın alınabilirlik üzerinde baskı yarattığını belirtiyor. Fiyatın reel olarak gerilemesi aylık taksiti düşürmez; faiz aynı kalırken nominal fiyat neredeyse yatay seyrettiğinde giriş maliyeti de yatay kalır.", "en": "For an owner who does not want to sell, this loss stays on paper. For someone who wants to buy, the picture is different: the release says mortgage rates at 6.5 percent continue to weigh on affordability. A price falling in real terms does not lower the monthly payment; when the rate holds and the nominal price is close to flat, the cost of entry stays flat too.", "refs": ["case-shiller"]}, {"tr": "Aynı gün açıklanan tüketici güveni verisi, aynı hanelerin mevcut durumu nasıl değerlendirdiğini gösteriyor. The Conference Board kurumunun Mevcut Durum Endeksi 3,6 puan düşüşle 114,9 düzeyine indi ve üst üste üçüncü kez geriledi; genel endeks 90,8 oldu. İş bulma koşullarına ilişkin fark 0,7 puan azalarak yüzde 3,1 düzeyine indi. İzlenecek eşik açıktır: yıllık enflasyon ağustos ve eylül yayınlarında da ulusal endeksin yıllık artışının üzerinde kalırsa, reel gerileme on dördüncü aya uzar.", "en": "The consumer confidence data released the same day show how the same households assess their current position. The Present Situation Index from The Conference Board fell 3.6 points to 114.9, its third consecutive decline, and the headline index stood at 90.8. The labour differential narrowed 0.7 percentage points to 3.1 percent. The threshold to watch is clear: if annual inflation stays above the national index's annual gain through the August and September releases, the real decline will extend to a fourteenth month.", "refs": ["case-shiller", "conf-board"]}]}], "sources": [{"key": "case-shiller", "kind": "news", "name": "S\u0026P Dow Jones Indices", "url": "https://press.spglobal.com/2026-07-28-S-P-Cotality-Case-Shiller-Index-Reports-Annual-Gain-in-May-2026", "title": {"tr": "ABD konut fiyatları mayısta yıllık yüzde 1,1 arttı, reel bazda on ikinci ayında geriledi", "en": "US home prices rose 1.1 percent over the year to May and fell in real terms for a twelfth month"}, "publishedDate": "2026-07-28"}, {"key": "conf-board", "kind": "news", "name": "The Conference Board", "url": "https://www.conference-board.org/topics/consumer-confidence/press/CCI-July-2026", "title": {"tr": "ABD'de tüketici güveni temmuzda 90,8'e geriledi, mevcut durum üçüncü ayında düştü", "en": "US consumer confidence slipped to 90.8 in July as the present situation reading fell for a third month"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-06", "title": {"tr": "Tek bir satış gününde dört ayrı yön", "en": "Four different directions inside one selloff"}, "excerpt": {"tr": "Bitcoin geriledi, ether ve XRP yükseldi, endeks arttı. Ortak bir zorunlu satış kanalı bu tabloyu üretmez; günün belgelenebilir yapısal gelişmesi ise yasama tarafında yaşandı.", "en": "Bitcoin fell, ether and XRP rose, the index gained. A common forced-selling channel does not produce that picture, and the day's documentable structural development came from the legislative side."}, "sections": [{"h": {"tr": "Aynı gün, dört ayrı yön", "en": "One day, four directions"}, "ps": [{"tr": "Salı günü bitcoin yaklaşık 65.000 dolar düzeyinden 63.200 dolar düzeyine inerek yüzde 2,7 değer kaybetti. Aynı gün ether yüzde 1,52 artışla 1.902,76 dolar, XRP yüzde 1,24 artışla 1,07 dolar oldu; solana yüzde 0,27 azalarak 73,10 dolar düzeyine indi. CoinDesk 20 endeksi yüzde 1,04 artışla 1.734,58 düzeyine çıktı.", "en": "On Tuesday bitcoin fell 2.7 percent from nearly 65,000 dollars to roughly 63,200 dollars. On the same day ether rose 1.52 percent to 1,902.76 dollars and XRP rose 1.24 percent to 1.07 dollars, while solana fell 0.27 percent to 73.10 dollars. The CoinDesk 20 index rose 1.04 percent to 1,734.58.", "refs": ["coindesk-btc"]}, {"tr": "Arka planda hisse tarafında sert bir hareket vardı: Güney Kore'de Kospi endeksi yüzde 10 azalarak nisan ortasından bu yana en düşük seviyeye indi ve haziran ortasındaki zirvesinin yüzde 25 altına geriledi. Kayıpların başında Samsung ile SK hynix geldi; yani şok yarı iletken sektörüne özgüydü.", "en": "In the background there was a sharp move on the equity side: South Korea's Kospi index fell 10 percent to its lowest level since mid-April and dropped 25 percent below its mid-June peak. Samsung and SK hynix were among the notable losers, which makes the shock specific to the semiconductor sector.", "refs": ["coindesk-btc"]}]}, {"h": {"tr": "Sınanan iddia", "en": "The claim under test"}, "ps": [{"tr": "Bitfinex analistleri günün çerçevesini şöyle kurdu: bitcoin, baskı makro ve faiz kaynaklı olduğunda hisse senetleriyle birlikte hareket eder, baskı hisse piyasasına özgü olduğunda ise ayrışır. Bu sınanabilir bir iddiadır ve salı günü tam da onu sınayan bir gündü, çünkü şok hisse piyasasının tek bir sektörüne özgüydü.", "en": "Bitfinex analysts set the day's frame this way: \"BTC trades with equities when the stress is macro and [interest] rates-driven, and decouples when the stress is idiosyncratic to the equity market.\" That is a testable claim, and Tuesday was precisely the day that tested it, because the shock was specific to one sector of the equity market.", "refs": ["coindesk-btc"]}, {"tr": "Sonuç iki tarafı da tam doğrulamıyor. Bitcoin, iddianın öngördüğü ayrışmayı göstermedi ve hisse tarafıyla aynı yöne gitti. Buna karşılık ether, XRP ve endeks yükseldi. Ortak bir teminat çağrısı ya da zorunlu satış kanalı devrede olsaydı, dört büyük varlığın aynı gün ters yönlere ayrılması beklenmezdi; likidasyon, teminata konu olabilen her şeyi birlikte aşağı çeker. Daha derin bir türev tabanına sahip olan bitcoinin önce fiyatlanması ve diğerlerinin bir seans gecikmesi de aynı verilerle uyumludur; bu durumda ayrışma yapısal olmaktan çok zamanlamaya ait olur.", "en": "The outcome fully vindicates neither side. Bitcoin did not show the decoupling the claim predicts and moved with the equity side. Against that, ether, XRP and the index rose. Had a common margin call or forced-selling channel been running, four large assets would not be expected to split in opposite directions on the same day, because a liquidation drags everything usable as collateral down together. Bitcoin's deeper derivatives base could also mean it repriced first while the others lag by a session, which fits the same data; on that reading the divergence is a matter of timing more than of structure.", "refs": ["coindesk-btc"]}]}, {"h": {"tr": "Fiyat dışındaki kırılganlık", "en": "The fragility outside the price"}, "ps": [{"tr": "Günün belgelenebilir tek yapısal gelişmesi fiyat tarafında yaşanmadı. ABD Senatosu, Rusya yaptırımları tasarısına öncelik vermek için kripto piyasa yapısını düzenleyen CLARITY tasarısını rafa kaldırdı ve oylamanın gelecek haftadan önce yapılması beklenmiyor. Piyasa yapısı yasası, hangi varlığın hangi düzenleyicinin yetkisinde olduğunu ve saklama ile ayrıştırma yükümlülüklerinin ne olduğunu belirler.", "en": "The one documentable structural development of the day did not happen on the price side. The Senate shelved the CLARITY Act, which covers crypto market structure, to prioritize a Russia sanctions bill, and a vote is not expected before next week. A market structure statute determines which asset falls under which regulator and what the custody and segregation obligations are.", "refs": ["coindesk-btc"]}, {"tr": "Bu belirsizlik bir fiyat hareketi üretmez; şok anında kimin neye başvuracağını belirsiz bırakır. Sınanabilir eşik ise kısa vadelidir: çarşamba günkü faiz kararı bitcoin, ether, XRP ve CoinDesk 20 endeksini aynı yönde yüzde birden fazla hareket ettirirse, işleyen kanal makro ve faiz kanalıdır ve salı günkü ayrışma sektöre özgü bir gürültüdür. Dördü yine ayrışırsa, ortak bir likidite kanalı varsayımı bu hafta için elenir.", "en": "That uncertainty produces no price move; it leaves open who would turn to whom in a shock. The testable threshold is short-dated: if Wednesday's rate decision moves bitcoin, ether, XRP and the CoinDesk 20 index in the same direction by more than one percent, the operative channel is macro and rates, and Tuesday's divergence was sector-specific noise. If the four split again, the assumption of a common liquidity channel is eliminated for this week.", "refs": ["coindesk-btc"]}]}], "sources": [{"key": "coindesk-btc", "kind": "news", "name": "CoinDesk", "url": "https://www.coindesk.com/markets/2026/07/28/bitcoin-slides-2-after-u-s-close-while-korea-s-kospi-plunges-10", "title": {"tr": "Bitcoin ABD kapanışının ardından yüzde 2,7 geriledi, ether ve XRP yükseldi", "en": "Bitcoin fell 2.7 percent after the US close while ether and XRP rose"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-01", "title": {"tr": "İndirim çağrısına karşılık üçte birlik bir zam ihtimali", "en": "A one-in-three chance of a hike answers the call for cuts"}, "excerpt": {"tr": "Faizlerin düşürülmesi isteniyor; vadeli piyasa ise Fed toplantısı için indirimi değil çeyrek puanlık bir artışı fiyatlıyor. Bu farkı kapatacak kalem akaryakıtta duruyor.", "en": "The call is for lower rates; ahead of the Fed meeting the futures market prices a quarter-point increase rather than a cut. The line that closes that gap sits in fuel."}, "sections": [{"h": {"tr": "Aynı toplantı, iki ayrı okuma", "en": "One meeting, two readings"}, "ps": [{"tr": "Faiz kararına iki gün kala kamuoyuna yönelen çağrı ile piyasanın fiyatladığı senaryo birbirinin tersi yönde duruyor. Başkan pazartesi günü faizlerin düşürülmesi gerektiğini söyledi; Fed Başkanı Kevin Warsh için övgü dolu bir ifade kullanırken indirime karşı çıkan bazı yetkilileri çok siyasi davranmakla suçladı. Aynı gün vadeli fiyatlamada işlemcilerin yaklaşık yüzde 68,5'i faizin yüzde 3,50-3,75 aralığında sabit kalmasını, kabaca üçte biri ise çeyrek puanlık bir artışı bekliyordu. Piyasanın fiyatladığı risk yukarı yönlü.", "en": "Two days before the decision, the public appeal and the scenario the market prices point in opposite directions. On Monday the president said rates should be lowered; he praised Fed Chair Kevin Warsh while accusing some officials who oppose cuts of acting very politically. On the same day futures pricing showed roughly 68.5 percent of traders expecting the rate to stay in its 3.50-3.75 percent range and about one in three expecting a quarter-point increase. The risk the market prices runs upward.", "refs": ["fed"]}, {"tr": "Bu dağılımın kendisi bir bilgi taşıyor. Sabit kalma senaryosunun üçte iki ağırlıkta olması, 28-29 Temmuz toplantısından çıkacak kararın büyük ölçüde beklendiğini gösteriyor; asıl bilgi kalan üçte birde. Tek bir toplantı için çeyrek puanlık artışa verilen bu ağırlık, katılımcıların enflasyonun yönüne dair ortak bir görüşe varmadığını söylüyor.", "en": "The distribution itself carries information. A two-thirds weight on no change says the outcome of the July 28-29 meeting is largely anticipated; the information sits in the remaining third. That much weight on a quarter-point increase at a single meeting says participants have not converged on a view about where inflation is heading.", "refs": ["fed"]}]}, {"h": {"tr": "Fiyatlamayı hangi kalem hareket ettiriyor", "en": "Which line actually moves the pricing"}, "ps": [{"tr": "Haziran verisine bakıldığında dağılımın nereden geldiği görünür hale geliyor. Tüketici fiyatları aylık bazda yüzde 0,4 geriledi, yıllık oran mayıstaki yüzde 4,2 seviyesinden yüzde 3,5 seviyesine indi ve çekirdek oran yüzde 2,6 seviyesine kadar düştü. Manşetle çekirdek arasındaki 0,9 puanlık aralığı taşıyan kalem belli: akaryakıt maliyetleri yıllık yüzde 15,7 arttı.", "en": "The June data show where that distribution comes from. Consumer prices fell 0.4 percent on the month, the annual rate eased to 3.5 percent from 4.2 percent in May, and core inflation came down to 2.6 percent. The line carrying the 0.9-point gap between headline and core is identifiable: fuel costs were up 15.7 percent from a year earlier.", "refs": ["fed"]}, {"tr": "O kalemin kaynağı pazartesi günü ucuzladı. Brent yüzde 9,13 düşüşle varil başına 87,94 dolar, WTI yüzde 7,94 düşüşle 82,22 dolar seviyesine indi; bir hafta önce fiyat 102 dolar seviyesine yaklaşmıştı. Ham petroldeki bu gerilemenin pompa fiyatına ve oradan tüketici sepetine geçmesi haftalar alır, dolayısıyla çarşamba günkü karara yetişmez. Buradan çıkan çıkarım şu: çeyrek puanlık artış ihtimalini ayakta tutan, manşet enflasyonun akaryakıta bağlı kısmı ve bu kalemdeki gerileme henüz veriye girmedi. Alternatif bir okuma da mümkün — yeni başkanın ileriye dönük yönlendirmeyi daraltması, katılımcıların beklenti dağılımını herhangi bir veri kaleminden bağımsız olarak genişletmiş olabilir.", "en": "The source of that line got cheaper on Monday. Brent fell 9.13 percent to $87.94 a barrel and WTI 7.94 percent to $82.22, and a week earlier prices had approached $102. A decline in crude takes weeks to reach the pump and from there the consumer basket, so it will not arrive in time for Wednesday's decision. The inference: what sustains the quarter-point increase probability is the fuel-driven part of headline inflation, and the decline in that line has not yet entered the data. An alternative reading is available — the new chair's narrowing of forward guidance may have widened the distribution of participants' expectations independently of any single data line.", "refs": ["fed", "oil"]}]}, {"h": {"tr": "Sonraki iki veri", "en": "The next two prints"}, "ps": [{"tr": "Buradan bir yön çağrısı çıkmaz, ama izlenebilir bir eşik çıkar. Ham petrol temmuz sonundaki seviyelerine yakın kalırsa, akaryakıtın yıllık enflasyona katkısının temmuz ve ağustos verilerinde daralması beklenir. Daralmazsa, manşetle çekirdek arasındaki aralığı taşıyan başka bir kalem var demektir ve bu da dağılımın neden kapanmadığını açıklar.", "en": "None of this yields a directional call, but it does yield a threshold worth watching. If crude holds near its late-July levels, fuel's contribution to annual inflation should narrow in the July and August prints. If it does not narrow, another line is carrying the gap between headline and core, and that would explain why the distribution has not closed.", "refs": ["fed", "oil"]}]}], "sources": [{"key": "fed", "kind": "news", "name": "Mortgage Professional America", "url": "https://www.mpamag.com/us/mortgage-industry/industry-trends/trump-renews-rate-pressure-on-fed-as-july-fomc-meeting-opens/583870", "title": {"tr": "Trump, Fed toplantısı açılırken faiz baskısını yeniledi", "en": "Trump renews rate pressure on the Fed as its July meeting opens"}, "publishedDate": "2026-07-27"}, {"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-02", "title": {"tr": "Yüzde 11,5 neyi savunuyor: fiyat düzeyini mi, rezervi mi?", "en": "What is 11.5 percent defending — the price level or the reserves?"}, "excerpt": {"tr": "Pakistan'da enflasyon hedefin çok üzerinde, ama cari açık neredeyse kapanmış durumda. Faizi sabit tutan komitenin kendi verisi, kredi yaratımının hangi tarafa kaydığını gösteriyor.", "en": "In Pakistan inflation is far above target, yet the current account has nearly closed. The committee's own data show which side credit creation has moved to."}, "sections": [{"h": {"tr": "Komitenin kendi gerekçesi", "en": "The committee's own reasoning"}, "ps": [{"tr": "Karar 27 Temmuz'da açıklandı: Pakistan Merkez Bankası'nın komitesi politika faizini oybirliğiyle yüzde 11,5 seviyesinde bıraktı ve mevcut duruşun enflasyonu orta vadede yüzde 5-7 hedef aralığına yöneltmek için uygun olduğunu değerlendirdi. Rakamlar bu değerlendirmeyi kolay kılmıyor: manşet enflasyon haziranda yüzde 11,7 seviyesinden yüzde 11,1 seviyesine indi, çekirdek enflasyon yüzde 8,4 ile yüksek kaldı. Politika faizi, hedefin yaklaşık iki katı bir manşet oranın karşısında duruyor.", "en": "The decision was announced on July 27: the committee of Pakistan's central bank unanimously left the policy rate at 11.5 percent, judging the current stance appropriate to guide inflation toward the 5-7 percent medium-term target range. The figures do not make that judgement easy: headline inflation eased to 11.1 percent in June from 11.7 percent, and core inflation stayed elevated at 8.4 percent. The policy rate sits against a headline rate roughly twice the target.", "refs": ["sbp"]}, {"tr": "Komitenin değişmiş saydığı şeyler ise fiyat düzeyinde değil, dış hesapta yer alıyor. Pakistan Merkez Bankası haziran sonu için konan 18 milyar dolar rezerv hedefini aştı; son haftalardaki borç geri ödemelerinin ardından rezervler 17 Temmuz itibarıyla yaklaşık 17,3 milyar dolar seviyesine geriledi ve aralık sonu için 20,20 milyar dolar hedefleniyor. FY26 döneminde cari işlemler açığı 139 milyon dolar seviyesinde kaldı; bir yıllık dış açık olarak bu, pratikte kapanmış bir hesap anlamına geliyor.", "en": "What the committee counts as changed sits in the external account rather than the price level. Pakistan's central bank surpassed its end-June reserve target of $18 billion; after recent debt repayments, reserves declined to about $17.3 billion as of July 17, with $20.20 billion targeted for end-December. The current account deficit was $139 million in FY26; as a year's external gap, that amounts to an account which has in practice closed.", "refs": ["sbp"]}]}, {"h": {"tr": "Kredi hangi taraftan geliyor", "en": "Which side the credit is coming from"}, "ps": [{"tr": "Asıl bilgi para ve kredi başlığında bulunuyor. Geniş para arzı büyümesi bir önceki toplantıdaki yüzde 15,2 seviyesinden yüzde 13,2 seviyesine yavaşladı. Aynı dönemde özel sektör kredisi yüzde 14,9 seviyesine hızlandı ve komiteye göre bu artış işletme sermayesi, sabit yatırım ile tüketici finansmanına yayılmış durumda. Net bütçe borçlanmasındaki büyüme ise yavaşladı.", "en": "The substance sits in the money and credit section. Broad money growth slowed to 13.2 percent from 15.2 percent at the previous meeting. Over the same period private sector credit accelerated to 14.9 percent, and the committee describes that increase as spread across working capital, fixed investment and consumer financing. Growth in net budgetary borrowing, meanwhile, slowed.", "refs": ["sbp"]}, {"tr": "İki serinin ters yönde hareket etmesi, toplam bir büyüklüğün yavaşlamasından fazlasını anlatıyor. Krediyi ticari banka açar, mevduat o kredinin gölgesi olarak doğar; dolayısıyla geniş para arzı yavaşlarken özel kredinin hızlanması, yaratımın durduğunu göstermez, el değiştirdiğini gösterir. Kamu tarafı çekilirken özel taraf devreye giriyor. Buradan çıkan çıkarım şu: yüzde 11,5, iç talebi bastırmaktan çok dış tamponu koruyan bir reel faiz düzeyi olarak tutuluyor. Daha sade bir alternatif de mümkün — manşet enflasyon hâlâ hedef bandının çok üzerinde olduğu için komite indirimi erken buluyor olabilir ve bu okuma dış hesaba dair ek bir anlatı gerektirmez.", "en": "The two series moving in opposite directions say more than a slowdown in one aggregate. The commercial bank makes the loan, and the deposit is born as that loan's shadow; so private credit accelerating while broad money slows does not show creation stopping, it shows creation changing hands. As the public side steps back, the private side steps in. The inference: 11.5 percent is being held as a real rate that protects the external cushion more than it suppresses domestic demand. A plainer alternative is available — with headline inflation still far above the target band, the committee may consider a cut premature, and that reading requires no additional story about the external account.", "refs": ["sbp"]}]}, {"h": {"tr": "Açık kalan soru", "en": "The question that stays open"}, "ps": [{"tr": "Bu okuma doğruysa, uyum yükü faizden çok rezerv birikimine biner ve bunun kendi takvimi var. Komite FY27 döneminde cari açığın milli gelirin yüzde 0 ile yüzde 1 arasında kalmasını, büyümenin ise yüzde 3,5-4,5 aralığında gerçekleşmesini bekliyor. Özel sektör kredisi geniş para arzının üzerinde büyümeyi sürdürürse ithalatı besleyen iç talep de artabilir; o durumda aralık sonu için konan 20,20 milyar dolar rezerv hedefi, faiz kararlarından daha çok şey söyleyen sayı haline gelir.", "en": "If that reading holds, the burden of adjustment falls on reserve accumulation more than on the rate, and that has its own timetable. The committee expects the current account deficit to stay between 0 percent and 1 percent of GDP in FY27, with growth of 3.5-4.5 percent. If private sector credit keeps growing faster than broad money, the domestic demand that feeds imports may rise with it; in that case the $20.20 billion end-December reserve target becomes the number that says more than the rate decisions do.", "refs": ["sbp"]}]}], "sources": [{"key": "sbp", "kind": "news", "name": "State Bank of Pakistan", "url": "https://www.sbp.org.pk/assets/document/publications/MPS-July-2026-Eng.pdf", "title": {"tr": "Pakistan Merkez Bankası politika faizini yüzde 11,5 seviyesinde tuttu", "en": "Pakistan's central bank keeps its policy rate at 11.5 percent"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-03", "title": {"tr": "Celestica'da yüzde 62 büyüme, yüzde 8,2 marjla geliyor", "en": "At Celestica 62 percent growth arrives on an 8.2 percent margin"}, "excerpt": {"tr": "Celestica geliri bir yılda neredeyse iki katına çıkardı ve yıl beklentisini yükseltti. Yükseltmenin içindeki asıl varsayım gelirde değil, kârın gelirden daha hızlı artırılmasında saklı.", "en": "Celestica nearly doubled revenue in a year and raised its full-year outlook. The assumption inside that raise sits not in revenue but in earnings being lifted faster than sales."}, "sections": [{"h": {"tr": "Yükseltmenin aritmetiği", "en": "The arithmetic of the raise"}, "ps": [{"tr": "İkinci çeyrek geliri Celestica'da bir yıl önceki 2,89 milyar dolar seviyesinden 4,70 milyar dolar seviyesine, düzeltilmiş hisse başına kâr 1,39 dolar seviyesinden 2,54 dolar seviyesine çıktı ve her ikisi de şirketin kendi beklenti aralığının üst sınırını aştı. Büyümenin kaynağı tek bir bölüm: Bağlantı ve Bulut Çözümleri yüzde 84 artışla 3,81 milyar dolar seviyesine ulaşırken İleri Teknoloji Çözümleri yüzde 8 artışla 0,89 milyar dolar seviyesinde kaldı. Donanım platformu satışları yüzde 58 artışla yaklaşık 1,9 milyar dolar oldu.", "en": "Second-quarter revenue at Celestica rose to $4.70 billion from $2.89 billion a year earlier and adjusted earnings per share to $2.54 from $1.39, both above the top of the company's own guidance range. The growth comes from one segment: Connectivity and Cloud Solutions rose 84 percent to $3.81 billion while Advanced Technology Solutions rose 8 percent to $0.89 billion. Hardware platform sales grew 58 percent to about $1.9 billion.", "refs": ["celestica"]}, {"tr": "Yıl beklentisindeki değişiklik iki ayrı hareket içeriyor ve ikisinin oranı aynı değil. Gelir beklentisi 19,0 milyar dolar seviyesinden 20,5 milyar dolar seviyesine çıkarıldı; bu yaklaşık yüzde 8 bir artışa denk geliyor. Düzeltilmiş hisse başına kâr beklentisi ise 10,15 dolar seviyesinden 11,30 dolar seviyesine yükseltildi; bu da yaklaşık yüzde 11. Celestica, gelire eklediğinden oransal olarak fazlasını kâra ekliyor.", "en": "The change in the full-year outlook contains two separate moves, and their proportions differ. The revenue outlook was raised to $20.5 billion from $19.0 billion, which works out at about 8 percent. The adjusted earnings per share outlook was raised to $11.30 from $10.15, about 11 percent. Celestica is adding proportionally more to earnings than it is adding to revenue.", "refs": ["celestica"]}]}, {"h": {"tr": "Marjın taşıdığı varsayım", "en": "The assumption the margin is carrying"}, "ps": [{"tr": "Bu farkı anlamlı kılan sayı düzeltilmiş faaliyet marjı: yüzde 8,2. Bu seviyede her ek gelir dolarının yaklaşık sekiz senti düzeltilmiş faaliyet kârına dönüşüyor. Yüzde 62 bir büyüme oranı ile yüzde 8,2 bir marj yan yana konduğunda ortaya çıkan tablo, kıt olan girdinin teknoloji olmadığı, hacim ve tedarik tahsisi olduğu bir iş modeline işaret ediyor. Donanım platformu satışlarının yüzde 58 artışla yaklaşık 1,9 milyar dolar seviyesine ulaşması da bu okumayı destekliyor.", "en": "The figure that makes that difference meaningful is the adjusted operating margin: 8.2 percent. At that level roughly eight cents of every incremental revenue dollar becomes adjusted operating profit. Put a 62 percent growth rate next to an 8.2 percent margin and the picture points to a business whose scarce input is volume and supply allocation rather than technology. Hardware platform sales rising 58 percent to about $1.9 billion supports the same reading.", "refs": ["celestica"]}, {"tr": "Kârın gelirden hızlı yükseltilmesi, ek gelirin mevcut yüzde 8,2 seviyesinin üzerinde bir marjla geleceği varsayımını taşıyor. Bu varsayım savunulabilir: hacim arttıkça sabit maliyetler dağılır ve donanım platformu satışlarının payı yükselir. Ancak aynı sonucu üretecek başka bir yol daha var — hisse başına kâr, faaliyet marjı hiç değişmeden de faiz gideri, vergi oranı ya da hisse sayısındaki bir değişiklikle yükselebilir. Açıklanan veriler bu iki yolu birbirinden ayırmıyor.", "en": "Lifting earnings faster than revenue carries the assumption that the incremental revenue arrives at a margin above the current 8.2 percent. That assumption is defensible: fixed costs spread as volume rises and the hardware platform share increases. There is another route to the same result, though — earnings per share can rise with no change in operating margin, through interest expense, the tax rate or the share count. The disclosed figures do not separate those two routes.", "refs": ["celestica"]}]}, {"h": {"tr": "Bir çeyrek sonra ayrışacak", "en": "One quarter will separate them"}, "ps": [{"tr": "Ayrım için beklenmesi gereken süre kısa. Celestica üçüncü çeyrek için 5,25 milyar dolar ile 5,55 milyar dolar arasında gelir ve 2,88 dolar ile 3,08 dolar arasında düzeltilmiş hisse başına kâr öngörüyor. Üçüncü çeyrek düzeltilmiş faaliyet marjı yüzde 8,2 seviyesinin üzerinde açıklanırsa, yükseltmeyi taşıyan varsayımın faaliyet tarafında olduğu görülür. Marj yerinde sayar ve kâr yine de aralığın üst ucunda çıkarsa, farkı üreten kalem faaliyet satırının altındadır.", "en": "The wait for that separation is short. Celestica guides to third-quarter revenue between $5.25 billion and $5.55 billion and adjusted earnings per share between $2.88 and $3.08. If the third-quarter adjusted operating margin prints above 8.2 percent, the assumption behind the raise sits on the operating side. If the margin holds flat and earnings still come in at the top of the range, the line producing the difference is below the operating line.", "refs": ["celestica"]}]}], "sources": [{"key": "celestica", "kind": "news", "name": "Celestica", "url": "https://www.globenewswire.com/news-release/2026/07/27/3333904/0/en/Celestica-Announces-Second-Quarter-2026-Financial-Results.html", "title": {"tr": "Celestica geliri yüzde 62 arttı, yıl beklentisini yükseltti", "en": "Celestica revenue rises 62 percent and the company lifts its full-year outlook"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-04", "title": {"tr": "Brent ateşkesi fiyatladı, yük hâlâ uzun yoldan gidiyor", "en": "Brent priced the ceasefire; the cargo still takes the long way"}, "excerpt": {"tr": "Brent bir seansta dokuz puan geri verdi. Aynı gün Suudi ham petrolünün Babülmendep çıkışı durdu ve Süveyş Kanalı üzerinden taşınan miktar ikiye katlandı. Fiyat ile rota ters yöne gidiyor.", "en": "Brent gave back nine points in a session. The same day Saudi crude stopped leaving through Bab al-Mandeb and volumes through the Suez Canal doubled. Price and route are moving in opposite directions."}, "sections": [{"h": {"tr": "Ekranda dokuz puan", "en": "Nine points on the screen"}, "ps": [{"tr": "Brent pazartesi günü yüzde 9,13 gerileyerek varil başına 87,94 dolar, WTI yüzde 7,94 düşüşle 82,22 dolar seviyesine indi. Bir hafta önce fiyat 102 dolar seviyesine yaklaşmıştı. Hareketin gerekçesi askeri: ABD, İran hedeflerine yönelik 13 gece süren saldırılarını durdurdu ve Washington bunun için resmi bir açıklama yapmadı. Bir seansta fiyatlanan şey teslim edilmiş bir varil değil; saldırıların durmuş olması.", "en": "Brent fell 9.13 percent on Monday to $87.94 a barrel and WTI 7.94 percent to $82.22. A week earlier prices had approached $102. The reason given is military: the United States halted 13 consecutive nights of strikes on Iranian targets, and Washington issued no official explanation. What a single session priced was not a delivered barrel; it was the halt in strikes.", "refs": ["oil"]}]}, {"h": {"tr": "Rota ne yaptı", "en": "What the route did"}, "ps": [{"tr": "Fiziki tarafta gün ters yönde geçti. İran destekli Husiler Suudi limanlarına deniz ablukası ilan etti ve Kızıldeniz ile Babülmendep Boğazı'nda gemilere saldırdı. Sonucu iki sayı özetliyor: Suudi ham petrolünün Babülmendep üzerinden ihracatı durdu ve Süveyş Kanalı üzerinden taşınan miktar iki katına çıkarak günde 1,06 milyon varile ulaştı. Bir çıkış kapandığında hacim yok olmaz, yer değiştirir; kuzeye kayan bu 1,06 milyon varil, güney çıkışının fiilen kapandığının ölçüsü.", "en": "On the physical side the day went the other way. Iran-backed Houthis declared a maritime embargo on Saudi ports and attacked vessels in the Red Sea and the Bab al-Mandeb strait. Two numbers summarise the result: Saudi crude exports through Bab al-Mandeb stopped, and volumes carried through the Suez Canal doubled to 1.06 million barrels a day. When one exit closes the volume does not vanish, it relocates; those 1.06 million barrels moving north are the measure of how firmly the southern exit has shut.", "refs": ["oil"]}, {"tr": "İki gün önceki yazımda Kızıldeniz'de yükselen savaş riski sigortası ile düşen vadeli fiyat arasındaki ayrışmayı işlemiş ve vadeli fiyatın fiziki riski küçümsediğini savunmuştum. O yazıda eksik olan, rota değişikliğinin büyüklüğüydü; primler ve dışlama koşulları görünüyordu, taşınan hacim görünmüyordu. Süveyş Kanalı rakamı o boşluğu dolduruyor ve tezi aynı yönde güçlendiriyor.", "en": "In my column two days ago I examined the divergence between rising war-risk insurance in the Red Sea and a falling futures price, and argued that the futures price understated the physical risk. What that piece lacked was the size of the rerouting; the premiums and exclusion terms were visible, the volume moved was not. The Suez Canal figure fills that gap and strengthens the argument in the same direction.", "refs": ["oil", "history-redsea"]}]}, {"h": {"tr": "Eşik", "en": "The threshold"}, "ps": [{"tr": "Buradaki çıkarımın zayıf noktası açık: Süveyş Kanalı üzerindeki artış ablukadan değil, mevsimsel ya da sözleşmeye bağlı bir yönlendirmeden de kaynaklanmış olabilir ve tek bir günün rakamı bunu ayırmaya yetmez. Ayrım için beklenecek şey belli. Abluka yerinde kalırsa, Süveyş Kanalı üzerinden taşınan ham petrol miktarı günde bir milyon varilin üzerinde tutunur; abluka gevşerse aynı hacim güney rotasına döner ve Brent'in pazartesi günü fiyatladığı gevşeme, geç de olsa fiziki tarafta karşılığını bulur. Ümit Burnu üzerinden sapmalar ise her iki durumda da rotanın en pahalı ucunu gösterir.", "en": "The weak point in the inference is plain: the increase through the Suez Canal could reflect seasonal or contractual routing rather than the embargo, and a single day's figure cannot separate the two. What to wait for is equally plain. If the embargo holds, crude volumes through the Suez Canal stay above one million barrels a day; if it loosens, the same volume returns to the southern route and the easing Brent priced on Monday finds its physical counterpart, late. Diversions round the Cape of Good Hope, in either case, mark the most expensive end of the route.", "refs": ["oil"]}]}], "sources": [{"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}, {"key": "history-redsea", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-25/", "title": {"tr": "Kızıldeniz'de sigorta duvarı ve düşen vadeli petrol fiyatı", "en": "A Red Sea insurance wall and a falling oil futures price"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "eco-05", "title": {"tr": "Girdi 41,3, satış 25,6 — aradaki farkı kim taşıyor?", "en": "Inputs at 41.3, output at 25.6 — who carries the difference?"}, "excerpt": {"tr": "Teksas imalatçıları Dallas Fed anketinde hammadde fiyatlarının satış fiyatlarından hızlı arttığını bildiriyor. Üretim hızlanırken istihdam endeksinin gerilemesi, farkın nereye yazıldığına dair bir ipucu veriyor.", "en": "In the Dallas Fed survey Texas manufacturers report input prices rising faster than the prices they charge. Production accelerating while the employment index eases is a clue about where that difference is being booked."}, "sections": [{"h": {"tr": "İki endeks arasındaki fark", "en": "The gap between two indexes"}, "ps": [{"tr": "Dallas Fed'in 27 Temmuz'da yayımladığı temmuz imalat anketinde hammadde fiyatları endeksi 42,4 seviyesinden 41,3 seviyesine, mamul fiyatları endeksi 28,6 seviyesinden 25,6 seviyesine geriledi. İkisi de düştü, ama aradaki fark yerinde duruyor: firmalar ödedikleri fiyatların arttığını, satabildikleri fiyatların ise belirgin biçimde daha az arttığını bildiriyor. Ankete katılan bir matbaa üreticisi, gümrük vergilerinin ve savaşın belirsizlik yaratmayı ve marjları daraltmayı sürdürdüğünü aktardı.", "en": "In the July manufacturing survey published by the Dallas Fed on July 27, the raw materials prices index eased to 41.3 from 42.4 and the finished goods prices index to 25.6 from 28.6. Both fell, but the gap between them held: firms report that the prices they pay are rising and the prices they can charge are rising markedly less. A printing manufacturer responding to the survey said tariffs and the war continue to create uncertainty and compress margins.", "refs": ["dallasfed"]}, {"tr": "Aynı ankette faaliyet tarafı güçlendi. Üretim endeksi 4,1 seviyesinden 10,1 seviyesine, yeni siparişler endeksi 2,3 seviyesinden 6,4 seviyesine, genel iş etkinliği endeksi 0,0 seviyesinden 1,3 seviyesine çıktı ve şirketlerin kendi görünümüne ilişkin endeks 11,1 puan artarak 13,4 seviyesine ulaştı. Bu tablonun içinde ters yönde hareket eden tek başlık istihdam: endeks 13,9 seviyesinden 12,2 seviyesine indi.", "en": "In the same survey the activity side strengthened. The production index rose to 10.1 from 4.1, new orders to 6.4 from 2.3 and general business activity to 1.3 from 0.0, while the index of companies' own outlook gained 11.1 points to 13.4. Within that picture one heading moved the other way: employment, where the index fell to 12.2 from 13.9.", "refs": ["dallasfed"]}]}, {"h": {"tr": "Farkı kim taşıyor", "en": "Who carries the difference"}, "ps": [{"tr": "Satış fiyatına geçmeyen bir maliyet artışı üç yere gidebilir: kâra, çalışma saatine ya da kadroya. Üretimin hızlanıp istihdam endeksinin gerilemesi, ilk ikisinin şu an daha çok kullanıldığını düşündürüyor — aynı ya da daha yüksek çıktı, daha az yeni işe alımla üretiliyor. İmalatçıların kendi ifadesi de bunu destekliyor: daralan şey marj. Ancak istihdam endeksi 12,2 ile hâlâ belirgin biçimde pozitif; bu gerileme aydan aya olağan bir dalgalanma da olabilir ve tek bir ayın hareketinden bir istihdam yavaşlaması çıkarmak fazla ileri gitmek olur.", "en": "A cost increase that does not pass into selling prices can go to three places: profit, hours or headcount. Production accelerating while the employment index eases suggests the first two are currently doing more of the work — the same or higher output produced with less new hiring. The manufacturers' own words point the same way: what is compressing is margin. Yet the employment index remains clearly positive at 12.2; that decline may equally be ordinary month-to-month movement, and reading a hiring slowdown out of a single month's change would be going too far.", "refs": ["dallasfed"]}, {"tr": "Girdi tarafı için önümüzdeki aylarda bir rahatlama görünüyor. Ham petrol pazartesi günü sert geriledi: Brent yüzde 9,13 düşüşle varil başına 87,94 dolar seviyesine indi. Enerji, imalatın hem doğrudan girdisi hem de nakliye maliyeti; bu düşüş sürerse hammadde fiyatları endeksinin ağustos anketinde daha da gerilemesi beklenebilir. Mamul fiyatları endeksinin aynı hızla düşmemesi ise beklenen sonuç, çünkü fiyat indirimi maliyet indiriminden sonra gelir.", "en": "For the input side, relief appears to be coming in the months ahead. Crude fell sharply on Monday: Brent dropped 9.13 percent to $87.94 a barrel. Energy is both a direct input to manufacturing and a transport cost; if that decline persists, the raw materials prices index may ease further in the August survey. That the finished goods index would not fall as fast is the expected outcome, because price cuts follow cost cuts.", "refs": ["dallasfed", "oil"]}]}, {"h": {"tr": "Bu veri neyi göstermiyor", "en": "What this data does not show"}, "ps": [{"tr": "Dikkatli olunması gereken nokta ölçünün kendisi. Bu bir yayılma endeksi: kaç firmanın artış, kaç firmanın azalış bildirdiğini ölçer, artışın ya da azalışın büyüklüğünü değil. Dolayısıyla marjın ne kadar daraldığını, hangi ücret diliminde çalışanın kaç saat kaybettiğini ya da bir hanenin gelirine ne olduğunu bu veriden çıkarmak mümkün olmuyor. Anket firmayı sayıyor, haneyi saymıyor; sıkışmanın kime yazıldığı sorusunun yanıtı ücret ve hane verisinde duruyor.", "en": "The point to be careful about is the measure itself. This is a diffusion index: it counts how many firms report an increase and how many a decrease, not the size of either. It is therefore not possible to derive from it how far margins compressed, which pay band lost how many hours, or what happened to a household's income. The survey counts firms and does not count households; the answer to who the squeeze is booked against sits in wage and household data.", "refs": ["dallasfed"]}]}], "sources": [{"key": "dallasfed", "kind": "news", "name": "Federal Reserve Bank of Dallas", "url": "https://www.dallasfed.org/research/surveys/tmos/2026/2607", "title": {"tr": "Teksas imalat anketinde üretim hızlandı, istihdam endeksi geriledi", "en": "Production accelerated in the Texas factory survey while the employment index eased"}, "publishedDate": "2026-07-27"}, {"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-06", "title": {"tr": "On beş yıllık kiraya karşılık bu yılın 249,2 milyon dolar zararı", "en": "Fifteen-year rent against this year's $249.2 million loss"}, "excerpt": {"tr": "Applied Digital 15 yıllık üç kira sözleşmesi duyurdu ve aynı mali yılda 249,2 milyon dolar zarar yazdı. Kırılganlık sözleşmede değil; sermayenin çıktığı an ile kiranın geldiği an arasındaki mesafede duruyor.", "en": "Applied Digital announced three 15-year leases and booked a $249.2 million loss in the same fiscal year. The fragility sits not in the contract; it sits in the distance between when the capital goes out and when the rent comes in."}, "sections": [{"h": {"tr": "Sözleşmenin uzunluğu", "en": "The length of the contract"}, "ps": [{"tr": "Şirket 15 yıllık üç kira sözleşmesi duyurdu: 300 megavatlık Delta Forge 1 için yaklaşık 7,5 milyar dolar, 300 megavatlık Polaris Forge 3 için yaklaşık 7,5 milyar dolar ve çeyrek sonrası imzalanan 210 megavatlık Delta Forge 2 için yaklaşık 5,2 milyar dolar sözleşmeli gelir. Applied Digital'in duyurduğu bu üç sözleşme, on beş yıla yayılmış bir gelir taahhüdü anlamına geliyor.", "en": "The company announced three 15-year leases: about $7.5 billion of contracted revenue for the 300-megawatt Delta Forge 1, about $7.5 billion for the 300-megawatt Polaris Forge 3 and about $5.2 billion for the 210-megawatt Delta Forge 2 signed after the quarter. Those three contracts announced by Applied Digital amount to a revenue commitment spread over fifteen years.", "refs": ["apld"]}, {"tr": "Bu taahhüdün karşısında duran sayılar aynı açıklamada yer alıyor. Mali yılın tamamında gelir yüzde 167 artışla 611,3 milyon dolar seviyesine çıktı, düzeltilmiş faiz, vergi ve amortisman öncesi kâr 107,2 milyon dolar oldu ve net zarar 249,2 milyon dolar seviyesine ulaştı. Dördüncü çeyrekte veri merkezi kira geliri 44,1 milyon dolar taban kira ile 6,5 milyon dolar kiracı geri ödemesinden oluştu; aynı çeyrekteki net zarar 110,6 milyon dolar.", "en": "The numbers standing against that commitment sit in the same release. For the full fiscal year revenue rose 167 percent to $611.3 million, adjusted EBITDA was $107.2 million and the net loss reached $249.2 million. In the fourth quarter, data centre rental revenue consisted of $44.1 million of base rent and $6.5 million of tenant recoveries; the net loss in that same quarter was $110.6 million.", "refs": ["apld"]}]}, {"h": {"tr": "Zaman uyuşmazlığı", "en": "The timing mismatch"}, "ps": [{"tr": "Bu iki sayı kümesi arasındaki ilişki, kredi riskinin nerede oturduğunu gösteriyor. Sözleşmeli gelir ileriye dönük bir vaattir; inşaat ise bugünkü nakittir. Düzeltilmiş kârın 107,2 milyon dolar ile pozitif, net zararın 249,2 milyon dolar ile büyük olması, aradaki farkın amortisman ve finansman giderlerinde toplandığını söylüyor; yani düzeltmenin dışarıda bıraktığı kalemler, tam da varlığın nasıl finanse edildiğini anlatan kalemler. İki gün önceki yazımda yapay zekâ harcamasının borçla finansmanında riskin en ağır bilançolu isimlerde yoğunlaştığını savunmuştum; buradaki yapı o tezin bir sonraki halkası, çünkü teminat bir kredi notu yerine henüz başlamamış bir kira akışı. Karşı argüman da güçlü: on beş yıllık, sözleşmeye bağlanmış kira, proje finansmanının üzerine kurulduğu teminat türüdür ve kiracılar yeterince güçlüyse bu yapı bir altyapı varlığına yaklaşır.", "en": "The relationship between those two sets of numbers shows where the credit risk sits. Contracted revenue is a forward promise; construction is present-tense cash. Adjusted EBITDA positive at $107.2 million against a net loss of $249.2 million says the difference gathers in depreciation and financing costs; the items the adjustment leaves out are precisely the items describing how the asset is funded. In my column two days ago I argued that in the debt financing of AI spending the risk concentrates in the most asset-heavy names; the structure here is the next link in that argument, because the collateral is a rent stream that has not yet begun rather than a credit rating. The counter-case is strong too: a fifteen-year contracted lease is the collateral project finance is built on, and if the tenants are strong enough this structure moves closer to an infrastructure asset.", "refs": ["apld", "history-aidebt"]}, {"tr": "Aynı açıklamadaki ikinci hareket de bu çerçeveye giriyor. Bulut hizmetleri işi 5 Mayıs 2026'da ayrıldı ve Ekso Bionics ile birleşti; ortaya çıkan ChronoScale Holdings Nasdaq'ta CHRN koduyla işlem görüyor. Ancak Applied Digital bu şirketin yaklaşık yüzde 96 payını elinde tutuyor. Ayrılan şey borsa kotasyonu oldu; ekonomik maruziyetin neredeyse tamamı yerinde duruyor.", "en": "A second move in the same release belongs to the same frame. The cloud services business was separated on May 5, 2026 and merged with Ekso Bionics; the resulting ChronoScale Holdings trades on Nasdaq under CHRN. Applied Digital, however, retains roughly 96 percent of that company. What was separated was the listing; almost all of the economic exposure stays where it was.", "refs": ["apld"]}]}, {"h": {"tr": "Bunun kırılmaması için neyin doğru kalması gerekiyor", "en": "What has to stay true for this not to break"}, "ps": [{"tr": "Buradan bir çöküş takvimi çıkmaz; çıkan şey izlenebilir bir eşik. Kira akışı inşaat harcamasının önüne geçene kadar aradaki fark dış finansmanla kapanır ve o finansmanın koşulları, bugünkü zararın büyüklüğünden daha belirleyici olur. Yapı sağlamsa, taban kira kaleminin çeyreklik net zarardan daha hızlı büyümesi beklenir; dördüncü çeyrekteki 44,1 milyon dolar taban kira ile 110,6 milyon dolar net zarar arasındaki aralık daralmalıdır. Bu aralık daralmaz ya da açılırsa, sözleşmelerin uzunluğu değil, o uzunluğa ulaşmak için gereken köprü tartışılır hale gelir.", "en": "None of this yields a timetable for collapse; what it yields is a threshold that can be watched. Until the rent stream runs ahead of construction spending, the difference is closed with outside funding, and the terms of that funding matter more than the size of today's loss. If the structure is sound, base rent should grow faster than the quarterly net loss; the distance between $44.1 million of base rent and a $110.6 million net loss in the fourth quarter should narrow. If it does not narrow, or widens, what comes into question is the bridge needed to reach that length rather than the length of the contracts.", "refs": ["apld"]}]}], "sources": [{"key": "apld", "kind": "news", "name": "Applied Digital", "url": "https://ir.applieddigital.com/news-events/press-releases/detail/159/applied-digital-reports-fiscal-fourth-quarter-and-full-year", "title": {"tr": "Applied Digital yıllık geliri 611,3 milyon dolar seviyesine çıkardı, zarar sürdü", "en": "Applied Digital lifts annual revenue to $611.3 million while losses continue"}, "publishedDate": "2026-07-27"}, {"key": "history-aidebt", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-06/2026-07-25/", "title": {"tr": "460 milyar dolar yapay zekâ borcu ve onu fark eden bir kredi notu", "en": "460 billion dollars of AI debt, and a credit rating that notices"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "eco-01", "title": {"tr": "Yüzde 500'ü aşan açılışı iki parçaya ayırmak", "en": "Split a 500%-plus debut in two"}, "excerpt": {"tr": "CXMT'nin açılışında fiyat güçlü bir oy verdi. Kâr ve pazar payı temeli gösteriyor; serbest dolaşım ise oyun neden bu kadar yüksek sesle çıktığını açıklıyor.", "en": "Price cast a loud vote in CXMT's debut. Profit and market share show the fundamental; free float helps explain why the vote came out at such volume."}, "sections": [{"h": {"tr": "Hareket ile şirkete giren para", "en": "The move and the money raised"}, "ps": [{"tr": "CXMT halka arzını hisse başına 8,66 yuandan fiyatladı ve 57,92 milyar yuan topladı. Hisse, Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi; son bildirilen 52 yuanlık fiyat şirketin piyasa değerini yaklaşık 3,5 trilyon yuana taşıdı. Tape güçlü, fakat iki para akışını karıştırmamak gerekir: şirkete giren tutarı arz fiyatı belirledi, sonraki fiyat farkı ise ikincil piyasadaki pay sahipleri arasında oluştu. İlk gün fiyatı talebin şiddetini gösteriyor; tek başına şirketin kasasına yeni para eklemiyor.", "en": "CXMT priced its offering at 8.66 yuan a share and raised 57.92 billion yuan. The stock rose more than 500% on its first day in Shanghai; the last reported price of 52 yuan put the company's market value at roughly 3.5 trillion yuan. The tape is loud, but two cash flows should not be confused: the offer price set what reached the company, while the later gap formed among holders in the secondary market. A first-day price shows the force of demand; by itself it adds no new cash to the company.", "refs": ["cxmt-debut"]}, {"tr": "Temel tarafı boş değil. CNBC'ye göre CXMT, 2025'in son çeyreğinde küresel DRAM pazarının yüzde 7,67'sine sahipti. Şirket bu yılın ilk çeyreğinde 35,43 milyar yuan faaliyet kârı açıkladı; bir yıl önce 2,83 milyar yuan faaliyet zararı vardı. Bu dönüş, hissenin yalnızca bir hikâyeye dayanmadığını gösterir. Yine de faaliyet kârındaki sıçrama, 8,66 yuan ile 52 yuan arasındaki farkı mekanik olarak açıklamaz. Arz fiyatı, şirket verisi ve serbest piyasa fiyatı aynı tartının üç farklı kefesidir.", "en": "The fundamental side is not empty. CNBC said CXMT held 7.67% of the global DRAM market in the fourth quarter of 2025. The company reported first-quarter operating profit of 35.43 billion yuan this year, against a 2.83 billion yuan operating loss a year earlier. That turn shows the stock is not resting on a story alone. It still does not mechanically explain the gap between 8.66 yuan and 52 yuan. The offer price, company performance and the free-market price sit on three different pans of the scale.", "refs": ["cxmt-debut"]}]}, {"h": {"tr": "Serbest dolaşımın sesi", "en": "The sound of free float"}, "ps": [{"tr": "Haberde görüşüne yer verilen Theodore Shou, STAR pazarında ilk gün sıçramalarının olağandışı olmadığını, bu hareketin büyüklüğünde ise sınırlı serbest dolaşım ile birikmiş yatırımcı ilgisinin etkili olduğunu söyledi. Bu, fiyat ile temel arasına piyasa yapısını koyan makul mekanizmadır: alım talebi küçük bir işlem gören pay havuzuna yöneldiğinde marjinal fiyat hızla yukarı taşınabilir. Ancak bu bir analist açıklamasıdır, emir defterinin kanıtı değildir. Alternatif açıklama, DRAM kârlılığına ilişkin beklentilerin arz fiyatından sonra gerçekten yukarı değişmiş olmasıdır.", "en": "Theodore Shou, an analyst cited in the report, said large first-day jumps are not unusual on the STAR board and attributed the scale of this one to limited free float and built-up investor interest. That supplies a plausible market-structure bridge between price and fundamentals: when buying demand meets a small pool of tradable shares, the marginal price can move quickly. It remains an analyst's explanation, not proof from the order book. The alternative is that expectations for DRAM profitability genuinely rose after the offer was priced.", "refs": ["cxmt-debut"]}, {"tr": "Bu nedenle yüzde 500'ü aşan açılış tek bir hüküm vermiyor; iki ayrı sınama kuruyor. Piyasa yapısı sınaması, daha derin ve olağan işlem koşullarında fiyatın nasıl oluştuğudur. Temel sınaması ise ilk çeyrekteki faaliyet kârı dönüşünün sonraki dönemlerde sürüp nakde dönüşüp dönüşmediğidir. İlki zayıflar, ikincisi sürerse açılışın büyük kısmı kıt dolaşımın oyu olarak kalır. İkisi birlikte dayanırsa yeniden fiyatlama daha fazla ekonomik ağırlık kazanır. Piyasa anlatıyı değil akışı fiyatladı; şimdi temeli tartması gerekiyor.", "en": "A 500%-plus debut therefore delivers no single verdict; it creates two separate tests. The market-structure test is how price forms under deeper, more ordinary trading conditions. The fundamental test is whether the first-quarter operating-profit turn persists and converts into cash in later periods. If the first fades while the second holds, much of the debut remains a scarcity vote. If both endure, the repricing carries more economic weight. The market priced the flow rather than the narrative; it still has to weigh the fundamental.", "refs": ["cxmt-debut"]}]}], "sources": [{"key": "cxmt-debut", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/cxmt-china-market-debut-chipmaker-ipo.html", "title": {"tr": "Çinli bellek üreticisi CXMT Şanghay'daki ilk işlem gününde yüzde 500'den fazla yükseldi", "en": "Chinese memory maker CXMT rises more than 500% on its Shanghai debut"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-02", "title": {"tr": "Maliyet şoku nereye düşer: fiyatlara mı, kâra mı?", "en": "Where a cost shock lands: prices or profit"}, "excerpt": {"tr": "Enerji riski merkez bankalarının araçlarına, tarife değişikliği ise önce bir perakendecinin gelir tablosuna girdi. Aynı \"maliyet şoku\" etiketi, kaybı kimin taşıdığını söylemeye yetmiyor.", "en": "Energy risk entered central-bank instruments, while a tariff change first appeared in a retailer's income statement. The label \"cost shock\" alone does not say who bears the loss."}, "sections": [{"h": {"tr": "Fiyat baskısının üç kanalı", "en": "Three channels of price pressure"}, "ps": [{"tr": "MAS para politikasını üst üste ikinci kez sıkılaştırdı. Singapur dolarının ticaret ağırlıklı kur bandının değer kazanma eğimi az miktarda artırılırken bandın genişliği ve merkezi değiştirilmedi; karar, enerji fiyatlarının enflasyon riskini yeniden canlandırdığı bir dönemde alındı.", "en": "MAS tightened policy for a second consecutive step. It slightly raised the appreciation slope of the Singapore dollar's trade-weighted band while leaving the band's width and centre unchanged, acting as energy prices revived inflation risk.", "refs": ["mas-tightening"]}, {"tr": "ABD'de tahvil piyasası Federal Rezerv'in çarşamba günkü toplantısında faiz artırma olasılığını yaklaşık üçte bir olarak fiyatladı. Bloomberg'in haberi bu yeniden fiyatlamayı, Orta Doğu geriliminin petrol ve Hazine getirilerinde yarattığı oynaklık ile yeniden yükselen fiyat baskılarıyla ilişkilendirdi.", "en": "In the US, the bond market priced roughly a one-in-three chance that the Federal Reserve would raise rates at Wednesday's meeting. Bloomberg linked the repricing to volatility in oil and Treasury yields during Middle East tensions and to renewed price pressure.", "refs": ["fed-odds"]}, {"tr": "Shein'in taslak Hong Kong izahnamesi başka bir bilanço etkisi gösterdi: şirket 2026'nın ilk çeyreğinde 99 milyon dolar zarar etti; bir yıl önce 395 milyon dolar kâr etmişti. ABD geliri yüzde 14,3 düşerken faaliyet marjı yüzde 3,9'dan yüzde 2,9'a indi. Zarar, ABD'nin küçük paket muafiyetini kaldırmasının satış ve maliyet etkisinin yanı sıra 328 milyon dolar tutarında gerçeğe uygun değer giderini de içeriyordu.", "en": "Shein's draft Hong Kong prospectus showed a different balance-sheet effect: a loss of 99 million dollars in the first quarter of 2026, against 395 million dollars of profit a year earlier. US revenue fell 14.3% and the operating margin narrowed from 3.9% to 2.9%. The loss combined the sales-and-cost effect of the US removal of the small-parcel exemption with a fair-value charge of 328 million dollars.", "refs": ["shein-loss"]}]}, {"h": {"tr": "Politikadan önce yükün adresi", "en": "Incidence comes before policy"}, "ps": [{"tr": "Enerji fiyatındaki bir artış çok sayıda ithalatçının maliyetine aynı anda girdiğinde kur, enflasyon beklentisi ve politika faizi kanalında görünür. Tek bir gümrük muafiyetinin kaldırılması ise önce etkilenen iş modelinde paylaşılır: satıcı maliyeti marjında tutabilir, fiyatlara aktarabilir ya da hacim kaybedebilir. Shein verisinde daha düşük ABD satışı ile daha dar faaliyet marjının birlikte görülmesi, yükün en azından o çeyrekte tek bir kanala gitmediğine işaret ediyor.", "en": "When higher energy prices enter many importers' costs at once, they appear through the exchange rate, inflation expectations and the policy-rate channel. Removing one customs exemption is allocated first inside the exposed business model: the seller can absorb it in margin, pass it into prices or lose volume. Shein's lower US sales and narrower operating margin suggest the burden did not travel through only one channel that quarter.", "refs": ["mas-tightening", "fed-odds", "shein-loss"]}, {"tr": "Bu karşılaştırma Shein'in 99 milyon dolar tutarındaki zararını tarifelerin doğrudan ölçüsü yapmaz. 328 milyon dolar tutarındaki muhasebe gideri çeyrek sonucunu tek başına değiştirebilecek büyüklükte; ayrıca merkez bankası fiyatlaması da enerji dışındaki verileri içeriyor. Ayrımı sınamanın yolu, Shein'in fiyat ve sipariş hacmini tarife giderleriyle; genel enflasyon verisini ise ithalat fiyatlarıyla birlikte izlemektir. Şirket zararı, tek başına ekonominin geneline yayılan enflasyonu kanıtlamaz.", "en": "This comparison does not turn Shein's loss of 99 million dollars into a direct measure of tariffs. The accounting charge of 328 million dollars was large enough to change the quarterly result on its own, while central-bank pricing also reflects information beyond energy. The distinction requires Shein's prices and order volumes to be read with tariff expense, and inflation data with import prices. A company loss alone does not establish economy-wide inflation.", "refs": ["shein-loss", "mas-tightening", "fed-odds"]}]}], "sources": [{"key": "mas-tightening", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/singapore-mas-july-monetary-policy-middle-east-oil-prices-inflation-.html", "title": {"tr": "Singapur Merkez Bankası para politikasını üst üste ikinci kez sıkılaştırdı", "en": "Singapore's central bank tightens policy for a second meeting running"}, "publishedDate": "2026-07-27"}, {"key": "fed-odds", "kind": "news", "name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/bond-traders-on-edge-as-risks-of-fed-rate-hike-this-week-mount", "title": {"tr": "Tahvil piyasası çarşamba günkü Fed kararında faiz artırımı olasılığını üçte bir dolayında fiyatlıyor", "en": "The bond market prices roughly a one-in-three chance of a Fed rate rise on Wednesday"}, "publishedDate": "2026-07-26"}, {"key": "shein-loss", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/9ed6a6f4-c6a6-4027-9c54-19bffcd88913", "title": {"tr": "Shein, Hong Kong'daki planlanan kotasyon öncesinde ilk çeyrekte zarara döndü", "en": "Shein swings to a first-quarter loss ahead of its planned Hong Kong listing"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "eco-03", "title": {"tr": "Yüzde 2'lik zammı bir başka satışın tamamlanması taşıyor", "en": "A 2% sweetener rests on another sale closing"}, "excerpt": {"tr": "EQT'nin Perpetual için teklifi 22,07'den 22,50 Avustralya dolarına çıktı. Manşet fiyat değişti; teklifin ekonomisini belirleyen şey ise ona bağlanan koşullar.", "en": "EQT's offer for Perpetual moved from A$22.07 to A$22.50. The headline price changed; what determines the proposal's economics is the set of conditions attached to it."}, "sections": [{"h": {"tr": "Zam küçük, koşul listesi uzun", "en": "A small raise, a long list of conditions"}, "ps": [{"tr": "Teklif yaklaşık 2,6 milyar Avustralya dolarına (1,8 milyar dolar) yükseltildi. Avustralya basınındaki haberlere göre Perpetual, 27 Temmuz'da borsaya yaptığı açıklamada EQT ile ilişkilendirilen Windflower Pte'den nakit teklifin hisse başına 22,07 Avustralya dolarından 22,50 Avustralya dolarına çıkarıldığını duyurdu. Artış yüzde 2.", "en": "The offer was lifted to about A$2.6 billion ($1.8 billion). Australian press reports say Perpetual told the exchange on 27 July that Windflower Pte, an entity linked to EQT, had raised its cash offer from A$22.07 to A$22.50 a share. That is a 2% increase.", "refs": ["eqt-perpetual"]}, {"tr": "Aynı haberlere göre teklif bağlayıcı değil ve gösterge niteliğinde; inceleme sürecinin tamamlanması, sözleşmelerin imzalanması, düzenleyici onaylar ve Perpetual'in servet yönetimi biriminin Bain Capital'a satışının tamamlanması koşullarına bağlı. Bu yapıda masaya konan şey bir opsiyondur: alıcı fiyatı yükseltirken yükümlülüğünü olduğu yerde tutuyor.", "en": "According to the same reports the proposal is non-binding and indicative, conditional on completion of due diligence, execution of binding documents, regulatory approvals and completion of the sale of Perpetual's wealth management business to Bain Capital. Under that structure what is on the table is an option: the buyer raises the price while leaving its obligation where it was.", "refs": ["eqt-perpetual"]}]}, {"h": {"tr": "Adımların büyüklüğü ne söylüyor", "en": "What the size of the steps says"}, "ps": [{"tr": "Sıraya bakmak faydalı: temmuz başındaki 21,64 Avustralya doları reddedildi, ardından 22,07, şimdi 22,50 geldi. İlk adım yaklaşık yüzde 2, ikinci adım da yüzd
