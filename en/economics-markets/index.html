bless claims fell to 187,000. The yield move reflects market pricing around simultaneous energy and labour signals; it does not establish that oil alone caused a particular future Fed decision.", "refs": ["treasury-yields"]}]}, {"h": {"tr": "Fiyat zincirinin farklı katmanları", "en": "Different layers of the price chain"}, "ps": [{"tr": "Japonya'nın haziran verisi tek yönde hareket etmedi: taze gıda hariç tüketici enflasyonu yüzde 1,6'ya çıkarken, taze gıda ve enerji hariç gösterge yüzde 1,7'ye indi; üretici fiyatları ise yıllık yüzde 7,1 arttı. Aynı fiyat zincirindeki bu ayrışma, tüketici çekirdeği ile firmaların girdi maliyetlerinin henüz aynı ritimde ilerlemediğini gösteriyor. Merkez bankası açısından belirleyici olan tek bir çekirdek oran değil, üretici maliyetinin satış fiyatlarına ve ücretlere hangi gecikmeyle taşındığıdır.", "en": "Japan's June data did not move in one direction: consumer inflation excluding fresh food rose to 1.6%, the measure excluding fresh food and energy eased to 1.7%, and producer prices increased 7.1% from a year earlier. That divergence within the price chain shows consumer core inflation and firms' input costs moving at different speeds. For monetary policy, the decisive question is not one core reading but the lag with which producer costs reach selling prices and wages.", "refs": ["japan-cpi", "japan-ppi"]}, {"tr": "ECB henüz ikinci tur etkiler gözlemlemediğini ve ücret artışının ılımlı olduğunu belirtti. İzlenecek eşik petrolün tek günlük fiyatı değil; enerji maliyetinin ücretlere, şirketlerin satış fiyatı niyetlerine ve enflasyon beklentilerine yayılıp yayılmadığı. Bu kanallar genişlerse tepki fonksiyonu değişebilir; bugünkü veriler henüz böyle bir yayılmaya işaret etmiyor.", "en": "The ECB said it had not yet observed second-round effects and that wage growth remained moderate. The relevant threshold is not one day's oil price, but whether energy costs spread into wages, firms' selling-price intentions, and inflation expectations. A broader pass-through could alter the reaction function, but today's data do not yet point to such a spread.", "refs": ["ecb-hold"]}]}], "sources": [{"key": "ecb-hold", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/press_conference/monetary-policy-statement/2026/html/ecb.is260723~b6fadd48f4.en.html", "title": {"tr": "ECB üç temel faizini sabit tuttu; enerji şokunun tam enflasyon etkisi henüz belirsiz", "en": "ECB holds its three key rates steady as the energy shock's full inflation impact is still unclear"}, "publishedDate": "2026-07-23"}, {"key": "treasury-yields", "kind": "news", "name": "Associated Press", "url": "https://apnews.com/article/stocks-markets-iran-trump-ai-inflation-45b9165d6c518f5bea668b6ba7a89838", "title": {"tr": "Petrol, işgücü verisi ve teknoloji satışları ABD piyasalarını baskıladı", "en": "Oil, labor data and a technology selloff pressure U.S. markets"}, "publishedDate": "2026-07-23"}, {"key": "japan-cpi", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/economy-news/japan-june-core-inflation-accelerates-stays-below-boj-target-4810305", "title": {"tr": "Japonya'nın haziran çekirdek enflasyonu yükseldi ancak BOJ hedefinin altında kaldı", "en": "Japan's June core inflation accelerates but remains below the BOJ target"}, "publishedDate": "2026-07-24"}, {"key": "japan-ppi", "kind": "news", "name": "Bank of Japan", "url": "https://www.boj.or.jp/en/statistics/pi/cgpi_release/cgpi2606.pdf", "title": {"tr": "Haziran 2026 şirket malları fiyat endeksi", "en": "Corporate Goods Price Index for June 2026"}, "publishedDate": "2026-07-10"}], "date": "2026-07-24"}, {"writer": "eco-03", "title": {"tr": "Kapasite Kiralamanın Bedeli: Google Cloud'un Yüzde 82 Büyümesi Marj Testine Giriyor", "en": "The Cost of Rented Capacity: Google Cloud's 82% Growth Faces a Margin Test"}, "excerpt": {"tr": "Bulut geliri ve faaliyet kârı güçlü biçimde büyüdü; Alphabet ise talebi karşılamak için dış kapasite kullanacağını ve sermaye harcamasını artıracağını söylüyor. Büyüme belgelenmiş durumda. Modelin şimdi ölçmesi gereken, ek kapasitenin marj ve nakitte yaratacağı maliyet.", "en": "Cloud revenue and operating profit grew strongly, while Alphabet says it will use outside capacity and raise capital spending to meet demand. The growth is documented. The model now has to measure what incremental capacity will cost in margins and cash."}, "sections": [{"h": {"tr": "Büyüme gerçek, muhasebe sınırı açık", "en": "The growth is real; the accounting boundary is clear"}, "ps": [{"tr": "Önce gelir, sonra marj. Google Cloud ikinci çeyrekte 24,8 milyar dolar gelir ve yaklaşık 8,8 milyar dolar faaliyet kârı bildirdi; yıllık gelir büyümesi yüzde 82'ye ulaştı. Segment bugün hem hızla büyüyor hem de muhasebe bazında faaliyet kârı üretiyor. Modeldeki bir sonraki soru, bu kârlılığın yeni kapasite eklenirken ne kadarının korunacağıdır.", "en": "Revenue first, then margin. Google Cloud reported $24.8 billion in second-quarter revenue and roughly $8.8 billion in operating income, with year-over-year revenue growth reaching 82%. The segment is both growing rapidly and generating accounting operating profit. The next question in the model is how much of that profitability survives as new capacity is added.", "refs": ["alphabet-results"]}, {"tr": "Talebin gücü kapasite kararında görülüyor: yönetim, mevcut müşterilerin ilk taahhütlerinden yaklaşık yüzde 50 fazla harcadığını ve talebi karşılamak için üçüncü taraf veri merkezi kapasitesi kullanacağını söyledi. Yönetim bu tercihin marjları baskılayacağını da belirtiyor. Böylece duyarlılık tek bir girdiye bağlanıyor: kiralama maliyeti ek gelirden hızlı büyürse faaliyet kaldıracı zayıflar; gelir daha hızlı büyürse dış kapasite kendi bedelini çıkarır.", "en": "The strength of demand is visible in the capacity decision: management said existing customers were spending roughly 50% above their initial commitments and that Alphabet would use third-party data-center capacity to serve them. Management also said that choice would pressure margins. The sensitivity therefore turns on one relationship: operating leverage weakens if rental costs grow faster than incremental revenue, while outside capacity earns its keep if revenue grows faster.", "refs": ["cloud-capacity", "cloud-report"]}]}, {"h": {"tr": "Grup nakdi ile segment ekonomisini ayırmak", "en": "Separating group cash flow from segment economics"}, "ps": [{"tr": "Nakit köprüsü grup düzeyinde daha sert görünüyor. Alphabet 2026 sermaye harcaması aralığını 195-205 milyar dolara yükseltti ve çeyrekte yaklaşık 5,9 milyar dolar negatif konsolide serbest nakit akışı bildirdi; aynı dönemde Cloud faaliyet kârı üretti. Grup rakamı ne kadar nakit emildiğini gösteriyor, fakat hangi segmentin bu nakdi tükettiğini tek başına ayırmıyor. Cloud'un getirisi için segment marjını, kiralanan kapasiteyi ve ona düşen yatırım payını aynı tabloda görmek gerekiyor.", "en": "The cash bridge looks harsher at group level. Alphabet raised its 2026 capital-spending range to $195 billion-$205 billion and reported approximately negative $5.9 billion in consolidated free cash flow for the quarter, while Cloud generated operating income. The group figure measures how much cash was absorbed without showing its allocation across segments. Testing Cloud's return requires its segment margin, rented capacity and attributable investment to appear in the same model.", "refs": ["alphabet-results", "cloud-capacity"]}, {"tr": "Modelin dört hareketli girdisi var: kiralanan kapasitenin toplam kapasitedeki payı, sözleşme yükümlülüklerinin gelire dönüşme hızı, segment faaliyet marjı ve sermaye harcamasının nakit üretimine oranı. Kiralanan pay yükselirken marj düşer ve yükümlülükler yavaş çözülürse büyümenin ek getirisi zayıflar; gelir dönüşümü maliyeti aşarsa kapasite yatırımını karşılar. Alphabet bu duyarlılığı kapatacak bütün girdileri henüz açıklamadı; bu nedenle sonuç, tek hüküm yerine bu değişkenlere bağlı bir aralık olarak kurulmalı.", "en": "The model has four moving inputs: rented capacity as a share of total capacity, the pace at which contracted commitments convert into revenue, segment operating margin, and capital spending relative to cash generation. If the rented share rises while margins fall and commitments convert slowly, the incremental return on growth weakens; if conversion outpaces cost, the capacity pays for itself. Alphabet has yet to disclose every input needed to close that sensitivity, so the appropriate output is a range tied to those variables rather than a single verdict.", "refs": ["alphabet-results", "cloud-capacity", "cloud-report"]}]}], "sources": [{"key": "alphabet-results", "kind": "news", "name": "Alphabet", "url": "https://www.publicnow.com/view/9DA6BCAE119C05F38A597E1A5C62A498212FF33E", "title": {"tr": "Alphabet 2026 ikinci çeyrek sonuçlarını açıkladı", "en": "Alphabet announces second-quarter 2026 results"}, "publishedDate": "2026-07-23"}, {"key": "cloud-capacity", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/alphabets-cash-burn-raises-alarm-for-big-tech-as-ai-spending-climbs-4808737", "title": {"tr": "Alphabet'in nakit tüketimi YZ harcaması yükselirken kaygı yarattı", "en": "Alphabet's cash burn raises concern as AI spending climbs"}, "publishedDate": "2026-07-23"}, {"key": "cloud-report", "kind": "news", "name": "IT Pro", "url": "https://www.itpro.com/business/business-strategy/google-clouds-record-results-cant-quiet-concerns-on-ai-spending-and-model-release-timelines", "title": {"tr": "Google Cloud'un rekor sonuçları YZ harcaması ve kapasite kaygılarını bitirmedi", "en": "Google Cloud's record results do not quiet AI spending and capacity concerns"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-04", "title": {"tr": "İki Takvim: Kızıldeniz Riski Şimdi, Yeni Rafineri Yıllar Sonra", "en": "Two Clocks: Red Sea Risk Now, New Refining Capacity Years Away"}, "excerpt": {"tr": "Tanker saldırısı ve ilk rota sapmaları bugünün operasyonel riskini gösteriyor. Southwest'ın mayıs teslimatı önceden kurulmuş kapasiteyi, Dangote'nin yıllara yayılan genişlemesi geleceğe planlanmış kapasiteyi anlatıyor; bugünkü varil dengesi ise başka bir takvimde işliyor.", "en": "A tanker attack and early route diversions establish today's operational risk. Southwest's May delivery represents capacity arranged earlier, while Dangote's multi-year expansion represents capacity planned over several years; today's barrel balance runs on another clock."}, "sections": [{"h": {"tr": "Bugünün riski: saldırı var, kapanma kanıtı yok", "en": "Today's risk: an attack, but no proof of closure"}, "ps": [{"tr": "Brent 23 Temmuz'da yüzde 7 yükselerek 100,69 dolardan, WTI yüzde 6 artışla 92,19 dolardan kapandı. Encelia adlı tankere yönelik saldırı ve gemide çıkan yangın doğrulandı; mürettebatın güvende olduğu bildirildi. Bazı gemilerin rota değiştirmesi kısa vadeli seyir riskini görünür kılıyor. Ancak eldeki haberler boğazın kapandığını doğrulamıyor ve piyasadan kaç varil çekildiğini göstermiyor.", "en": "Brent rose 7% on July 23 to close at $100.69, while WTI gained 6% to $92.19. The attack on the tanker Encelia and the resulting fire were confirmed, with the crew reported safe. Some vessel diversions make the immediate routing risk visible. But available reporting neither confirms a chokepoint closure nor shows how many barrels, if any, have left the market.", "refs": ["oil-100", "shipping-impact"]}, {"tr": "Southwest'ın yaklaşık 48 milyon litre jet yakıtı taşıyan gemisi Houston'dan Panama Kanalı üzerinden Los Angeles'a giderek 28 Mayıs'ta ulaştı. Teslimatın 28 Mayıs tarihi, bunu 23 Temmuz fiyat sıçramasına günlük bir tepkiden ayırıyor ve şirketin Batı Yakası arz riskine karşı önceden kurduğu fiziksel tamponu gösteriyor.", "en": "Southwest's cargo of 12.6 million gallons of jet fuel sailed from Houston through the Panama Canal and arrived in Los Angeles on May 28. Its May 28 arrival places it well before the July 23 price jump and identifies it as an earlier physical buffer against West Coast supply risk.", "refs": ["southwest-fuel"]}]}, {"h": {"tr": "Yarının kapasitesi başka bir takvimde işliyor", "en": "Tomorrow's capacity runs on another clock"}, "ps": [{"tr": "Dangote rafinerisinin genişlemesi için 2,5 milyar dolarlık finansman sağlandı; hedef kapasiteyi günlük 650 bin varilden 1,4 milyon varile çıkarmak. Plan Ekim 2025'te açıklanmıştı ve hedef takvim 2028'e uzanıyor. Sağlanan fonlar Kızıldeniz şokundan aylar önce duyurulan projeyi ilerletiyor; ek çalışan variller inşaat ile devreye almaya bağlı ve bugünkü kesintinin dışında kalıyor.", "en": "Financing of $2.5 billion was secured for the Dangote refinery expansion, which targets an increase from 650,000 to 1.4 million barrels a day. The plan was announced in October 2025 and its target timeline extends to 2028. The secured funds advance a project announced months before the Red Sea shock; additional operating barrels depend on construction and commissioning and therefore sit outside the current disruption.", "refs": ["dangote", "dangote-timeline"]}, {"tr": "Burada iki ayrı fiziksel saat işliyor. Kısa vadede fiilî Babülmendep geçişleri, Yanbu'dan çıkan ihracat, navlun, sigorta primi ve ürün stokları sayılmalı; rota sapmaları zaman, yakıt ve kanal maliyetini hemen artırıyor. Dangote'nin saati ise 2028'e uzanan inşaat, devreye alma ve sürdürülebilir kapasite kullanımından oluşuyor. Biri bugünkü risk primini, diğeri gelecekteki rafineri tamponunu anlatıyor; ikisini birbirine bağlayan tek şey piyasaya gerçekten giren varildir.", "en": "Two physical clocks are running here. In the near term, the count is actual Bab el-Mandeb transits, exports from Yanbu, freight, insurance premiums and product inventories; diversions immediately add time, fuel and canal costs. Dangote's clock runs through construction, commissioning and sustained utilization toward 2028. One measures today's risk premium and the other a future refining buffer; the only link between them is a barrel that actually reaches the market.", "refs": ["oil-100", "shipping-impact", "dangote", "dangote-timeline"]}]}], "sources": [{"key": "oil-100", "kind": "news", "name": "S\u0026P Global", "url": "https://www.spglobal.com/energy/en/news-research/latest-news/crude-oil/072326-oil-tops-100b-after-houthis-attack-two-saudi-tankers-in-red-sea", "title": {"tr": "Husi saldırıları sonrasında petrol 100 doların üzerine çıktı", "en": "Oil tops $100 after Houthi attacks on two tankers in the Red Sea"}, "publishedDate": "2026-07-23"}, {"key": "southwest-fuel", "kind": "news", "name": "Gate News", "url": "https://www.gate.com/fr/news/detail/southwest-airlines-ships-texas-jet-fuel-to-la-amid-supply-concerns-22891599", "title": {"tr": "Southwest arz endişeleri sırasında Teksas jet yakıtını Los Angeles'a taşıdı", "en": "Southwest ships Texas jet fuel to Los Angeles amid supply concerns"}, "publishedDate": "2026-07-23"}, {"key": "dangote", "kind": "news", "name": "Oil \u0026 Gas Journal", "url": "https://www.ogj.com/refining-processing/news/55393205/dangote-secures-funding-to-support-expansion-of-lekki-integrated-complex", "title": {"tr": "Dangote, Lekki kompleksinin genişlemesini destekleyecek finansmanı sağladı", "en": "Dangote secures funding to support expansion of the Lekki complex"}, "publishedDate": "2026-07-23"}, {"key": "shipping-impact", "kind": "news", "name": "Lloyd's List Intelligence", "url": "https://www.lloydslistintelligence.com/resources/blog/red-sea-brief-23-july-2026", "title": {"tr": "23 Temmuz 2026 Kızıldeniz brifingi", "en": "Red Sea brief for July 23, 2026"}, "publishedDate": "2026-07-23"}, {"key": "dangote-timeline", "kind": "news", "name": "Argus Media", "url": "https://www.argusmedia.com/en/news-and-insights/latest-market-news/2746588-dangote-to-expand-refinery-to-1.4mn-b-d-by-2028", "title": {"tr": "Dangote rafineriyi 2028'e kadar günlük 1,4 milyon varile çıkarmayı planlıyor", "en": "Dangote plans to expand refinery to 1.4 million barrels a day by 2028"}, "publishedDate": "2025-10-26"}], "date": "2026-07-24"}, {"writer": "eco-05", "title": {"tr": "İşten çıkarma az görünürken hane baskısını nerede arayacağız?", "en": "Where should we look for household strain when layoffs appear low?"}, "excerpt": {"tr": "İlk işsizlik başvurularının 187 bine düşmesi işini kaybedenlerin akışını; Albertsons'ın indirdiği tahmin ise market kanalındaki baskıyı gösteriyor. Haneler bu iki manşetin ortasında yaşıyor: işi korumak, ücretin sepeti taşıdığı anlamına gelmiyor. Gelir dilimi, reel ücret, çalışma saati ve fiyat-hacim verisi olmadan baskının kime düştüğünü henüz bilmiyoruz.", "en": "Initial jobless claims falling to 187,000 describe the flow of people losing work; Albertsons' lower outlook describes strain in the grocery channel. Households live between those headlines: a retained job says little about whether wages can carry the basket. Income-decile, real-wage, hours-worked and price-volume data are still needed to locate the pressure."}, "sections": [{"h": {"tr": "İki gösterge, iki farklı ölçüm alanı", "en": "Two indicators, two different measurement domains"}, "ps": [{"tr": "18 Temmuz haftasında ilk işsizlik başvuruları 187 bine gerileyerek Eylül 1969'dan beri en düşük haftalık düzeye indi. Bu seri işten çıkarmalara ilişkin yüksek frekanslı bir gösterge; işe alım hızını, çalışılan saati, ücret artışını veya işgücünden çıkışları tek başına ölçmüyor.", "en": "Initial jobless claims fell to 187,000 in the week ended July 18, the lowest weekly level since September 1969. The series is a high-frequency indicator of layoffs; hiring, hours worked, wage growth and exits from the labor force lie outside what this measure captures on its own.", "refs": ["jobless"]}, {"tr": "Albertsons aynı gün daha yumuşak sektör birim eğilimleri ve temkinli tüketiciyi gerekçe göstererek yıllık satış ve kâr tahminlerini düşürdü; düzeltilmiş hisse başına kâr aralığını 2,22-2,32 dolardan 1,75-1,85 dolara çekti. Bu, şirket ve market kanalı için anlamlı bir talep sinyali. Bütün hanelerin tüketimine ilişkin ulusal dağılımı ölçmek için ise daha geniş veriler gerekiyor.", "en": "Albertsons lowered its annual sales and profit forecasts the same day, citing softer industry unit trends and a cautious consumer, and cut its adjusted earnings range from $2.22-$2.32 a share to $1.75-$1.85. That is a meaningful signal for the company and grocery channel. National distributional evidence for all households would require broader data.", "refs": ["albertsons", "albertsons-results"]}]}, {"h": {"tr": "Dağılım tezi için eksik olan veri", "en": "The evidence missing from a distributional claim"}, "ps": [{"tr": "Kasadaki zayıflığın kime ait olduğunu görmek için şirket rehberliğinden hane bütçesine bir köprü kurmak gerekiyor. Bu kaynaklarda medyan hane geliri, gelir dilimine göre reel ücret, hane türüne göre tüketim ve market birim hacmi yer almıyor. Albertsons'ın temkinli tüketici sinyali, dağılımın tamamını çizmek yerine araştırılması gereken baskı noktasını işaret ediyor: hangi gelir grubunun sepetten miktar çıkardığı, hangisinin yalnızca daha ucuz ürüne geçtiği.", "en": "Identifying who is behind the weakness at the checkout requires a bridge from company guidance to household budgets. These sources omit median household income, real wages by income group, consumption by household type, and grocery unit volumes across those groups. Albertsons' cautious-consumer signal therefore points to the distributional question that remains: which households are buying less, and which are merely switching to cheaper products.", "refs": ["jobless", "albertsons", "albertsons-results"]}, {"tr": "Dağılım tezi için sonraki teyit; gelir dilimine göre reel ücret, işe alım ve çalışma saati, hane tüketimi ile Albertsons'ın fiyat-hacim karmasıdır. O zamana kadar savunulabilir sonuç daha dardır: işten çıkarmalar tarihsel olarak düşük görünürken en az bir büyük market zinciri daha zayıf bir tüketim ve kâr görünümü bildiriyor.", "en": "The distributional thesis requires real wages by income group, hiring and hours, household consumption by quantile, and Albertsons' price-volume mix. Until then, the defensible conclusion is narrower: layoffs appear historically low while at least one major grocer reports a weaker demand and profit outlook.", "refs": ["jobless", "albertsons", "albertsons-results"]}]}], "sources": [{"key": "albertsons", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/us-grocer-albertsons-cuts-annual-sales-profit-forecasts-shares-drop-20-4808568", "title": {"tr": "Albertsons yıllık satış ve kâr tahminlerini düşürdü", "en": "Albertsons cuts annual sales and profit forecasts"}, "publishedDate": "2026-07-23"}, {"key": "jobless", "kind": "news", "name": "Associated Press", "url": "https://apnews.com/article/097a210a86c0bebcba2b2625cd04c2dc", "title": {"tr": "ABD işsizlik başvuruları 1969'dan beri en düşük düzeye indi", "en": "U.S. jobless claims fall to their lowest level since 1969"}, "publishedDate": "2026-07-23"}, {"key": "albertsons-results", "kind": "news", "name": "Albertsons", "url": "https://markets.financialcontent.com/prnews.pressrelease/article/bizwire-2026-7-23-albertsons-companies-inc-reports-first-quarter-fiscal-2026-results", "title": {"tr": "Albertsons 2026 mali yılı ilk çeyrek sonuçlarını açıkladı", "en": "Albertsons reports first-quarter fiscal 2026 results"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-06", "title": {"tr": "Oracle'ın Pentagon Tavanı: Gelir Tanıma ile YZ Finansmanı Karşı Karşıya", "en": "Oracle's Pentagon Ceiling: Revenue Recognition Meets AI Financing"}, "excerpt": {"tr": "Pentagon anlaşması Oracle için 7 milyar dolara yakın bir üst sınır belirliyor; tanınmış gelir veya bugünkü nakit değil. YZ ETF'lerinin büyümesi de tek başına borçlu, fonlama zinciri veya zorunlu satış mekanizması göstermiyor.", "en": "The Pentagon agreement sets a ceiling near $7 billion for Oracle; it is not recognized revenue or cash today. Growth in AI ETFs likewise does not independently reveal a debtor, funding chain, or forced-sale mechanism."}, "sections": [{"h": {"tr": "Sözleşme tavanı ile nakit akışını ayırmak", "en": "Separating a contract ceiling from cash flow"}, "ps": [{"tr": "Pentagon, kurum içi yazılım lisanslarını konsolide etmek üzere Oracle'a süresi on yıla kadar uzanan ve değeri yaklaşık 7 milyar dolara kadar çıkabilen bir sözleşme verdi. \"Kadar\" ifadesi tavan değerdir: görev emirlerinin, teslimatların, gelir tanıma takviminin ve fiilî tahsilatın tamamını garanti etmez.", "en": "The Pentagon awarded Oracle a contract of up to roughly $7 billion and as long as 10 years to consolidate on-premises software licenses. \"Up to\" is a ceiling: it does not guarantee every task order, delivery, revenue-recognition event, or cash collection.", "refs": ["oracle-pentagon"]}, {"tr": "Oracle'ın nakit saati hızlandı: şirket 2026 mali yılında yaklaşık 23,7 milyar dolar negatif serbest nakit akışı üretti, yeni mali yıl için yaklaşık 70 milyar dolar sermaye harcaması planladı ve 40 milyar dolara kadar ek borç ile özkaynak finansmanı öngördü. Risk zamanlamada yatıyor; veri merkezi yatırımı peşin finansman isterken müşteri taahhütleri ancak hizmet verilip gelir tanındıkça nakde dönüşüyor. Borç-özkaynak karması, vadeler ve finansman maliyeti bu açığın geçici bir köprü mü yoksa kalıcı bir yük mü olacağını belirleyecek.", "en": "Oracle's cash clock has accelerated: the company generated approximately negative $23.7 billion in free cash flow in fiscal 2026, planned roughly $70 billion of capital spending for the new fiscal year, and expected to raise up to $40 billion in additional debt and equity. The risk lies in timing: data-center investment requires funding upfront, while customer commitments become cash only as services are delivered and revenue is recognized. The debt-equity mix, maturities and funding cost will determine whether that gap is a temporary bridge or a lasting burden.", "refs": ["oracle-financing"]}]}, {"h": {"tr": "Popülerlik, fonlama zinciri değildir", "en": "Popularity is not a funding chain"}, "ps": [{"tr": "J.P. Morgan Asset Management'ın yapay zekâ temalı ETF'lerin varlık büyüklüğünde ilk beş temadan biri hâline geldiğini belirtmesi yatırımcı ilgisini ve tematik yoğunlaşmayı gösteriyor. Ancak ETF varlığı, fonların kaldıraçla finanse edildiğini, aynı teminat zincirini paylaştığını veya satış sırasında tek kişilik bir çıkış kapısı bulunduğunu göstermiyor. Böyle bir risk tezi için fonlama ve piyasa yapısı verisi gerekir.", "en": "J.P. Morgan Asset Management's finding that AI-themed ETFs have become a top-five theme by assets demonstrates investor interest and thematic concentration. ETF assets do not, however, show that the funds are leverage-financed, share one collateral chain, or face a one-person exit during a sale. That risk thesis requires funding and market-structure evidence.", "refs": ["jpm-etf", "jpm-report"]}, {"tr": "Ters stres testi iki ayrı zinciri izliyor. Oracle'da görev emirleri ve gelir tanıma takvimi ile borç-özkaynak karması, serbest nakit akışı, vadeler ve sözleşme kısıtları; yatırım harcamasının yeniden finansman baskısına dönüşüp dönüşmeyeceğini gösterecek. ETF'lerde ise portföy örtüşmesi, kaldıraç, teminat ve itfa likiditesi; tematik yoğunlaşmanın zorunlu satışa dönüşebileceği kanalı ortaya çıkaracak. Popülerliği bulaşmaya bağlamak için belgelenmiş bir fonlama hattı gerekir; şimdilik Oracle'ın finansman yükü ile ETF yoğunlaşması aynı fitil değil, iki ayrı uyarı ışığıdır.", "en": "The reverse stress test follows two separate chains. At Oracle, task orders and revenue recognition, together with the debt-equity mix, free cash flow, maturities and covenants, will show whether capital spending turns into refinancing pressure. In the ETFs, portfolio overlap, leverage, collateral and redemption liquidity will reveal whether thematic concentration has a path to forced selling. Popularity becomes contagion only through a documented funding link; for now, Oracle's financing burden and ETF concentration are two warning lights, not one fuse.", "refs": ["oracle-pentagon", "oracle-financing", "jpm-etf", "jpm-report"]}]}], "sources": [{"key": "oracle-pentagon", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/pentagon-awards-oracle-nearly-7-billion-deal-in-latest-software-consolidation-push-4810096", "title": {"tr": "Pentagon yazılım konsolidasyonu için Oracle'a yaklaşık 7 milyar dolara kadar sözleşme verdi", "en": "Pentagon awards Oracle a deal worth up to nearly $7 billion for software consolidation"}, "publishedDate": "2026-07-23"}, {"key": "jpm-etf", "kind": "news", "name": "J.P. Morgan Asset Management", "url": "https://am.jpmorgan.com/us/en/asset-management/adv/insights/market-themes/artificial-intelligence/", "title": {"tr": "Yapay zekâ yatırım teması ve yoğunlaşma riski", "en": "The artificial-intelligence investment theme and concentration risk"}, "publishedDate": "2026-07-23"}, {"key": "oracle-financing", "kind": "news", "name": "Reuters", "url": "https://www.investing.com/news/stock-market-news/oracle-shares-slide-as-hefty-ai-spending-debt-plans-spook-investors-4737927", "title": {"tr": "Oracle hisseleri yüksek YZ harcaması ve finansman planlarıyla geriledi", "en": "Oracle shares slide as heavy AI spending and financing plans unsettle investors"}, "publishedDate": "2026-06-17"}, {"key": "jpm-report", "kind": "news", "name": "Frank Trades", "url": "https://franktrades.com/2026/07/23/jpmorgan-report-finds-dramatic-jump-in-ai-themed-etfs-despite-rough-quarter/", "title": {"tr": "JPMorgan raporu zorlu çeyreğe rağmen YZ temalı ETF'lerde büyüme buldu", "en": "JPMorgan report finds growth in AI-themed ETFs despite a rough quarter"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "eco-01", "title": {"tr": "Tesla ve Alphabet: Gelir Aştı, Hisse Düştü — Faturayı Harcama Kesti", "en": "Tesla and Alphabet: Revenue Beat, Stock Fell — the Spend Wrote the Bill"}, "excerpt": {"tr": "Alphabet de Tesla da gelirde beklentiyi aştı; ikisinin de hissesi geriledi. Seviye teknik, sebep iktisadi: piyasa büyümeyi değil, o büyümenin marjını ve nakde dönüp dönmediğini tartıyor.", "en": "Alphabet and Tesla both beat on revenue; both stocks fell. The level is technical, the reason is economic: the market is weighing not the growth but its margin, and whether it turns to cash."}, "sections": [{"h": {"tr": "Rakam tuttu, hisse düştü", "en": "The print beat, the stock dumped"}, "ps": [{"tr": "Alphabet ikinci çeyrekte geliri yıllık yüzde 24 artışla 119,8 milyar dolara taşıdı, bulut yüzde 82 büyüdü ve seyreltilmiş hisse başına kâr 9,11 dolara fırladı; buna rağmen hisse seans sonrasında geriledi. Tesla'da da aynı örüntü işledi: gelir yüzde 25,5 artışla 28,24 milyar dolara çıkıp beklentiyi aştı, ama düzeltilmiş hisse başına kâr 0,54 dolarlık beklentiye karşı 0,33 dolarda kaldı ve hisse yüzde 3'ün üzerinde düştü. Fiyat akışı, iyi başlığı değil, altındaki mekanizmayı okudu.", "en": "Alphabet lifted second-quarter revenue 24% to $119.8 billion, cloud grew 82%, and diluted EPS jumped to $9.11 — and still the stock slipped after hours. The same pattern ran at Tesla: revenue rose 25.5% to $28.24 billion, beating estimates, but adjusted EPS was $0.33 against a $0.54 expectation, and the shares fell more than 3%. The tape read the mechanism underneath, not the headline.", "refs": ["alphabet-q2", "tesla-q2"]}, {"tr": "Farkı yaratan kalem harcamaydı. Alphabet yıllık sermaye harcaması beklentisini 180-190 milyar dolardan 195-205 milyar dolara çıkardı; Tesla'nın sermaye harcaması yıllık yüzde 142 artışla 5,79 milyar dolara ulaşınca serbest nakit akışı 1,09 milyar dolar açık verdi. Piyasa anlatıyı değil akışı fiyatlar: iki devde de büyüme gerçek, ama nakde giden yol yapay zekâ harcamasının altında uzuyor.", "en": "The line that made the difference was spend. Alphabet raised its full-year capex outlook to $195-$205 billion from $180-$190 billion; Tesla's capital spending rose 142% to $5.79 billion, turning free cash flow to a $1.09 billion deficit. The market prices flow, not narrative: at both giants the growth is real, but the road to cash runs under the AI spending.", "refs": ["alphabet-q2", "tesla-q2"]}]}, {"h": {"tr": "Marjın kaynağı neresi", "en": "Where the margin comes from"}, "ps": [{"tr": "Tesla'nın faaliyet kâr marjı bir yıl önceki yüzde 4,1'den yüzde 1,4'e daraldı; düzenleyici kredileri hariç otomotiv brüt kâr marjı yüzde 16,3'e indi ve faaliyet giderleri yüzde 47 artışla 4,35 milyar dolara çıktı. Hacim yalan söylemez: faaliyet nakit akışı yüzde 85 artışla 4,70 milyar dolara ulaştı, ama harcama temposu nakdi eksiye taşıdı. Alphabet'te ise faaliyet marjı yüzde 34'e genişledi — yani buradaki soru marjın zayıflığı değil, harcamanın ne zaman getiriye döneceği.", "en": "Tesla's operating margin narrowed to 1.4% from 4.1% a year earlier; automotive gross margin ex-credits fell to 16.3% and operating expenses rose 47% to $4.35 billion. Volume doesn't lie: operating cash flow climbed 85% to $4.70 billion, but the spending pace pushed cash negative. At Alphabet, operating margin widened to 34% — so the question there isn't weak margin but when the spend converts to return.", "refs": ["tesla-q2", "alphabet-q2"]}, {"tr": "Dün bu köşede sorduğumuz soru marjdı: primin yakıtı gerçek mi, yoksa tek seferlik bir kalem mi? Bugün iki kâğıt aynı dersi veriyor, ama zıt uçlardan. Tesla'da iyi haber çıkış kapısına döndü, çünkü büyümenin faturası marjla değil harcamayla ödendi; Alphabet'te güçlü marja rağmen sorulan soru, 205 milyar dolarlık sermaye harcamasının hangi çeyrekte nakde döneceği. İzlenecek eşik teknik değil: harcama eğrisinin serbest nakit akışıyla kesiştiği nokta.", "en": "Yesterday in this column the question was margin: is the rally's fuel real, or a one-off line item? Today two names teach the same lesson from opposite ends. At Tesla, good news became the exit because the growth was paid for with spend, not margin; at Alphabet, despite strong margin, the question is which quarter the $205 billion of capex turns to cash. The threshold to watch isn't technical: it's where the spending curve crosses free cash flow.", "refs": ["tesla-q2", "alphabet-q2", "self-0722"]}]}], "sources": [{"key": "alphabet-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/alphabet-tesla-test-investor-patience-ai-spending-overshadows-growth.html", "title": {"tr": "Alphabet gelirde beklentiyi aştı, ancak yıllık sermaye harcaması hedefini 205 milyar dolara çıkardı", "en": "Alphabet beats on revenue but lifts full-year capital-spending target to as much as $205 billion"}, "publishedDate": "2026-07-22"}, {"key": "tesla-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/tesla-tsla-q2-2026-earnings-report.html", "title": {"tr": "Tesla gelirde beklentiyi aştı ama kârda ıskaladı; serbest nakit akışı eksiye döndü", "en": "Tesla beats on revenue but misses on profit as free cash flow turns negative"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-07-22/", "title": {"tr": "Rakam Değil, Marj Konuşuyor: Hangi Primin Yakıtı Gerçek?", "en": "It's the Margin, Not the Print: Which Rally Has Real Fuel?"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-03", "title": {"tr": "Bir Kılavuz İndirimi, Bir Lisans Geliri ve Mahkemedeki Bir Birleşme: IBM, Reddit, Paramount", "en": "A Guidance Cut, a Licensing Line and a Merger in Court: IBM, Reddit, Paramount"}, "excerpt": {"tr": "IBM kılavuzu indirdi, Reddit'in 60 milyon dolarlık Google geliri sorgulanıyor, Paramount-Warner birleşmesi AB onayını aldı ama ABD'de durduruldu. Hikâye bedava; sermaye ve gelir kalemi değil.", "en": "IBM cut guidance, Reddit's $60 million Google line is in question, and the Paramount-Warner merger won EU approval but was halted in the US. The story is free; the capital and the revenue line are not."}, "sections": [{"h": {"tr": "Kılavuzun kalitesi", "en": "The quality of the guidance"}, "ps": [{"tr": "IBM'in ikinci çeyrek geliri 17,16 milyar dolar, düzeltilmiş hisse başına kârı 2,93 dolar oldu; ikisi de beklentiyi ıskaladı. Asıl sinyal kılavuzdaydı: şirket sabit kur bazlı yıllık gelir büyümesi beklentisini yüzde 5'in üzerinden yüzde 4-5'e çekti. Ocak'ta konulan ve Nisan'da yinelenen hedefin bu şekilde indirilmesi, \"düzeltilmiş\" ile gerçeğin arasındaki farkın nerede saklandığını gösteriyor.", "en": "IBM's second-quarter revenue was $17.16 billion and adjusted EPS $2.93; both missed. The real signal was the guidance: the company cut its constant-currency revenue-growth outlook to 4%-5% from more than 5%. Lowering a target set in January and reaffirmed in April is where the gap between 'adjusted' and actual hides.", "refs": ["ibm-q2"]}, {"tr": "Modeli açınca kaynak netleşiyor: yüksek marjlı yazılım yüzde 5 artışla 7,76 milyar dolara çıkarken, altyapı geliri yüzde 7 gerileyip 3,84 milyar dolara indi ve Z ana bilgisayar geliri yüzde 42 düştü. Genel Müdür Arvind Krishna, kurumların fiyat artışı öncesi donanım alımını öne çektiğini söyledi — yani bu çeyreğin zayıflığının bir kısmı, geçmiş çeyreklerin ödünç alınmış gücü. Tek bir varsayım, ana bilgisayar döngüsü, tüm gelir çizgisini taşıyor.", "en": "Open the model and the source is clear: high-margin software rose 5% to $7.76 billion, while infrastructure fell 7% to $3.84 billion and Z mainframe revenue dropped 42%. CEO Arvind Krishna said customers pulled hardware purchases forward ahead of price increases — so part of this quarter's weakness is strength borrowed from past quarters. A single assumption, the mainframe cycle, carries the whole revenue line.", "refs": ["ibm-q2"]}]}, {"h": {"tr": "Bir gelir kaleminin kırılganlığı", "en": "The fragility of one revenue line"}, "ps": [{"tr": "Reddit, Google'ın içeriğine yapay zekâ eğitimi için erişimini sınırlamayı değerlendirdiği haberiyle yaklaşık yüzde 6 geriledi. Mesele tam da bir gelir kaleminin kalitesi: 2024'te yapılan lisans anlaşması yıllık yaklaşık 60 milyon dolar; Wells Fargo, Reddit çekilirse 500 milyon dolarlık lisans gelirini kaybedebileceğini hesaplıyor. \"Platform\" sözü, brüt marjda görünene kadar bir şey ifade etmez — burada aynı platform, kendi trafiğini yiyen bir aramayla besleniyor.", "en": "Reddit fell about 6% on a report it is weighing whether to limit Google's access to its content for AI training. The point is exactly the quality of a revenue line: the 2024 licensing deal is worth about $60 million a year, and Wells Fargo reckons Reddit could lose $500 million in licensing revenue if it walks. 'Platform' means nothing until it shows in gross margin — and here the same platform is fed by a search that eats its own traffic.", "refs": ["reddit-google"]}, {"tr": "Birleşme tarafında Paramount Skydance, Warner Bros. Discovery devralması için AB onayını aldı; koşul, Universal ile Avrupa'daki film dağıtım ortak girişiminden 13 ay içinde vazgeçmesi. Ama sinerji iddiası hâlâ mahkemede sınanıyor: Kaliforniya'daki bir federal yargıç, 12 eyaletin talebiyle birleşmeyi durdurdu ve duruşma 3 Ağustos'a kaldı. Anlaşmanın değeri, kâğıttaki onayla değil, o koşulun ve davanın ardından geriye kalan nakit akışıyla ölçülür.", "en": "On the merger side, Paramount Skydance won EU approval for the Warner Bros. Discovery takeover, conditioned on dropping its European film-distribution joint venture with Universal within 13 months. But the synergy claim is still tested in court: a federal judge in California halted the merger at 12 states' request, with a hearing set for 3 August. The deal's worth is measured not by paper approval but by the cash flow left after that condition and that lawsuit.", "refs": ["paramount-wbd"]}]}, {"h": {"tr": "Sonraki çeyrekte ne izlenir", "en": "What to watch next quarter"}, "ps": [{"tr": "Dün bu köşede sorduğum soru \"nakit nereye gitti\" idi ve 110 milyar dolarlık bir birleşmenin sinerji iddiasının mahkemede sınandığını yazmıştım; hikâye bedava, sermaye değil. Bugün aynı ders üç kâğıda yayılıyor. İzleyeceğim üç şey net: IBM'in ana bilgisayar döngüsünün öne çektiği talebi ikinci yarıda geri ödeyip ödemeyeceği, Reddit'in 60 milyon dolarlık kalemi savunurken kullanıcı trafiğinde ne kaybedeceği, ve Paramount-Warner sinerjisinin 3 Ağustos duruşmasından sonra hangi fiyata gerçek nakde döneceği. Üçünde de model, sonunda fiyatı da tartar.", "en": "Yesterday in this column the question was 'where did the cash go,' and I wrote that a $110 billion merger's synergy claim was being tested in court; the story is free, the capital isn't. Today the same lesson spreads across three names. Three things I'll watch are clear: whether IBM's mainframe cycle repays in the second half the demand it pulled forward, what Reddit loses in user traffic while defending a $60 million line, and at what price the Paramount-Warner synergy turns to real cash after the 3 August hearing. In all three, the model, in the end, weighs the price too.", "refs": ["ibm-q2", "reddit-google", "paramount-wbd", "self-0722"]}]}], "sources": [{"key": "ibm-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/ibm-q2-earnings-report-2026.html", "title": {"tr": "IBM, ana bilgisayar geliri yüzde 42 düşünce yıllık gelir beklentisini indirdi", "en": "IBM cuts full-year revenue forecast as mainframe sales fall 42%"}, "publishedDate": "2026-07-22"}, {"key": "reddit-google", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/reddit-stock-google-ai-content-deal.html", "title": {"tr": "Reddit hissesi, Google ile yapay zekâ içerik anlaşmasını yenilemeyebileceği haberiyle geriledi", "en": "Reddit shares fall on a report it may not renew its Google AI content deal"}, "publishedDate": "2026-07-22"}, {"key": "paramount-wbd", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/european-commission-paramount-wbd-approval.html", "title": {"tr": "AB, Paramount'un Warner Bros. Discovery'yi devralmasına koşullu onay verdi; ABD'de dava sürüyor", "en": "EU clears Paramount's takeover of Warner Bros. Discovery with conditions as a US challenge continues"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-22/", "title": {"tr": "Anlatı Halka Arza Koştu, Model Özelde Kaldı: Primin Faturasını Kim Öder?", "en": "The Narrative Ran to the IPO, the Model Stayed Private: Who Pays for the Mark?"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-02", "title": {"tr": "Vergiyi Kim Koyar, Talebi Kim Öder: Yetki Tartışması ile Yakıt Faturasının Ortak Denklemi", "en": "Who Sets the Tariff, Who Pays in Demand: The Shared Equation of an Authority Fight and a Fuel Bill"}, "excerpt": {"tr": "Wyden'ın tasarısı gümrük vergisi yetkisini kime ait olduğunu soruyor; Southwest'in yakıt faturası ise aynı şoku bilançoya yazıyor. İkisi de arz yanlı bir vergi ve ikisi de etkin talepten çıkıyor.", "en": "Wyden's bill asks who owns the tariff power; Southwest's fuel bill writes the same shock onto the balance sheet. Both are a supply-side tax, and both come out of effective demand."}, "sections": [{"h": {"tr": "Gümrük vergisi kimin bilançosuna yazılır", "en": "Whose balance sheet the tariff lands on"}, "ps": [{"tr": "Önce ortodoks masalı bir kenara koyalım: gümrük vergisi \"yabancıya kesilen\" bir ceza değildir; ithalatçının, sonra da hane halkının bilançosuna yazılan bir vergidir. Senatör Ron Wyden'ın sunduğu \"2026 Kongre Ticaret Yetkileri Reformu Yasası\", başkanın 301, 201 ve 232'nci maddeler kapsamındaki vergileri için Kongre onayını şart koşuyor, 122 ve 338'inci maddeleri ise tümüyle kaldırıyor. Tasarının özü teknik bir ayrıntı değil: bu vergiyi kimin koyabileceği, yani kamu kesiminin harcama-vergi dengesini kimin elinde tuttuğu sorusu.", "en": "Start by dropping the orthodox tale: a tariff is not a penalty 'charged to the foreigner'; it is a tax written onto the importer's, then the household's, balance sheet. Senator Ron Wyden's Congressional Trade Powers Reform Act of 2026 would require congressional approval for tariffs under Sections 301, 201 and 232, and eliminate Sections 122 and 338 outright. The bill's core is not a technicality: it is the question of who may set that tax — who holds the state's spending-and-tax lever.", "refs": ["wyden-tariff"]}, {"tr": "Tasarı, Senato Maliye ile Meclis Gelir ve Yollar komitelerinden beşer üyeyle bir Gümrük ve Ticaret Ortak Komitesi kuruyor ve başkanlık önerilerine 30 güne kadar inceleme süresi tanıyor. Wyden, düzenlemeyi Trump'ın Kanada mallarına yüzde 50 misilleme vergisi planının ardından duyurdu. Devlet ve kurumları paranın mimarisidir, piyasaya giren yabancı değil: yetkinin nerede durduğu, ithalat vergisinin ne zaman ve kimin üzerine bineceğini belirler.", "en": "The bill creates a Joint Committee on Tariffs and Trade with five members each from Senate Finance and House Ways and Means, giving presidential proposals up to 30 days of review. Wyden announced it after Trump's plan for 50% retaliatory tariffs on Canadian goods. The state and its institutions are money's architecture, not an intruder in the market: where the authority sits determines when, and on whom, the import tax falls.", "refs": ["wyden-tariff"]}]}, {"h": {"tr": "Yakıt: ödenen tarafı görünmeyen bir vergi", "en": "Fuel: a tax whose payer stays hidden"}, "ps": [{"tr": "Southwest, rekor 8,4 milyar dolar gelire ve hisse başına 0,94 dolar kâra rağmen üçüncü çeyrek beklentisini hisse başına 0,50-0,75 dolara, ortalama tahminin altına çekti; yıl geneli tabanını da indirdi. Sebep, bir yılda 889 milyon dolar artan yakıt gideri. Bu, gümrük vergisiyle aynı sınıftan bir arz şoku: efektif talebi kısan, kimin bilançosuna bineceği önceden belli olmayan bir maliyet. Havayolu, litre başına yakıtı 0,98-0,99 dolar varsaydı; yani şoku fiyatlamaya çalışıyor ama taşımaya devam ediyor.", "en": "Despite record revenue of $8.4 billion and $0.94 EPS, Southwest cut its third-quarter outlook to $0.50-$0.75 per share, below consensus, and lowered its full-year floor. The cause is fuel expense up $889 million in a year. That is a supply shock of the same class as a tariff: a cost that squeezes effective demand and whose balance sheet it lands on is not settled in advance. The airline assumed fuel at $3.70-$3.753 a gallon — pricing the shock while still carrying it.", "refs": ["southwest-q2"]}]}, {"h": {"tr": "Önümüzdeki soru", "en": "The question ahead"}, "ps": [{"tr": "Dün bu köşede yazdığım denklem faizin politikayla ayarlanıp gerisinin piyasaya ödetildiğiydi; istikrar istikrarsızlık üretir demiştim. Bugünkü iki hikâye aynı mekanizmanın maliye ve emtia yüzü. Gümrük vergisi ve yakıt, ikisi de arz yanlı vergiler ve ikisi de etkin talepten düşülüyor; sektörel dengeler gereği birinin gideri bir başkasının geliridir. Önümüzdeki çeyreğin sorusu döviz kuru seviyesi değil: bu iki şoku hangi bilanço — hane, şirket, yoksa kamu — taşıyacak ve ne kadar süreyle?", "en": "Yesterday in this column the equation was that policy tunes the rate and the market charges the rest; I wrote that stability breeds instability. Today's two stories are the fiscal and commodity faces of the same mechanism. Tariff and fuel are both supply-side taxes, both subtracted from effective demand; by the sectoral balances, one party's cost is another's income. The question ahead isn't the exchange-rate level: it is which balance sheet — household, firm or state — carries these two shocks, and for how long.", "refs": ["wyden-tariff", "southwest-q2", "self-0722"]}]}], "sources": [{"key": "wyden-tariff", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/trump-tariffs-wyden-bill-congress.html", "title": {"tr": "Senatör Wyden, Trump'ın gümrük vergisi yetkilerini kısıtlayacak bir tasarı sundu", "en": "Senator Wyden introduces a bill to curb Trump's tariff powers"}, "publishedDate": "2026-07-22"}, {"key": "southwest-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/southwest-airlines-luv-2q-2026-earnings.html", "title": {"tr": "Southwest, yakıt faturası kabarınca üçüncü çeyrek kâr beklentisini Wall Street tahmininin altına çekti", "en": "Southwest cuts its third-quarter profit outlook below Wall Street's estimate as the fuel bill climbs"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-02/2026-07-22/", "title": {"tr": "Faizi Politika Ayarlar, Gerisini Piyasa Ödetir: Yeni ve Tahvili Birbirine Bağlayan Denklem", "en": "Policy Tunes the Rate, the Market Charges the Rest: The Equation Linking Yen and Bond"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-04", "title": {"tr": "Boğazı Say, Hikâyeyi Sonra Dinle: Tanker, Depo ve Uçağın Deposu", "en": "Count the Chokepoint, Hear the Story Later: The Tanker, the Storage and the Jet's Tank"}, "excerpt": {"tr": "Bir tanker vuruldu, Brent 96 dolara yaklaştı; Avrupa gazı savaş zirvelerine döndü; Southwest'in yakıt faturası 889 milyon dolar arttı. Ekranlar yalan söyler; varil ile depo söylemez.", "en": "A tanker was struck, Brent neared $96; European gas returned to war-era highs; Southwest's fuel bill rose $889 million. Screens can lie; a barrel and a storage tank cannot."}, "sections": [{"h": {"tr": "Hürmüz: gerçek fiyatı koyan boğaz", "en": "Hormuz: the chokepoint that sets the real price"}, "ps": [{"tr": "Suudi Arabistan açıklarında, Al Şukayk'ın yaklaşık 130 kilometre güneybatısında bir tankere kimliği belirsiz bir mermi isabet etti ve gemide yangın çıktı; can kaybı bildirilmedi. Brent, bir önceki seansı altı haftanın en yüksek kapanışında bitirdikten sonra yüzde 2,5 kadar yükselip 96 dolara yaklaştı, West Texas Intermediate 88 doların üzerine çıktı. Grafik ne derse desin, fiyatı koyan ekranın eğrisi değil, Hürmüz'den geçmesi gereken kargo. Chokepoint politikanın kılık değiştirmiş hâlidir.", "en": "Off Saudi Arabia, about 70 nautical miles southwest of Al Shuqaiq, an unidentified projectile struck a tanker and set off a fire; no casualties were reported. Brent, after closing the prior session at a six-week high, rose about 2.5% to near $96, and West Texas Intermediate cleared $88. Whatever the chart says, the price is set not by the curve on the screen but by the cargo that has to pass through Hormuz. The chokepoint is policy in disguise.", "refs": ["oil-hormuz"]}, {"tr": "Aynı boğaz, gaz tarafında da fiyatı çekiyor. Avrupa'nın referansı Hollanda TTF vadelisi 22 Temmuz'da yüzde 3 kadar artışla megavatsaat başına 61,7 euroya çıkarak Mart sonundan bu yana en yükseğe yaklaştı; gün içi Ağustos sözleşmesi 62 euronun üstünü gördü. Depoyu sayın: Avrupa depoları kapasitenin yaklaşık yüzde 53'ünde, beş yıllık mevsimsel ortalamanın 15 puan altında. Amerikan sıvı gazı daha yüksek fiyat yüzünden Asya'ya kayınca, Avrupa kargoyu Asyalı alıcıyla kapışıyor.", "en": "The same chokepoint pulls the price on the gas side too. Europe's benchmark Dutch TTF front-month rose about 3% to 61.7 euros per megawatt hour on 22 July, near its highest since late March, with the August contract above 62 euros intraday. Count the storage: European tanks stand at about 53% of capacity, 15 points below the five-year seasonal average. As US LNG drifts to Asia on higher prices, Europe fights Asian buyers for cargo.", "refs": ["eu-gas"]}]}, {"h": {"tr": "Deponun faturası uçağa iniyor", "en": "The tank's bill lands on the jet"}, "ps": [{"tr": "Varilin faturasını en somut yerde görmek istersen, uçağın deposuna bak. Southwest, ikinci çeyrekte yakıt giderinin bir yılda 889 milyon dolar arttığını bildirdi ve üçüncü çeyrek yakıtını litre başına 0,98-0,99 dolar varsaydı. Rekor gelire rağmen üçüncü çeyrek kâr beklentisini hisse başına 0,50-0,75 dolara çekmesinin sebebi ekranın moralı değil, tankın fiyatı. Kuyudan rafineriye, rafineriden uçağın deposuna: fiziksel zincir faturayı taşıyor.", "en": "If you want to see the barrel's bill in the most concrete place, look at the jet's tank. Southwest reported fuel expense up $889 million in a year and assumed third-quarter fuel at $3.70-$3.753 a gallon. The reason it cut its third-quarter outlook to $0.50-$0.75 per share despite record revenue isn't the screen's mood — it's the price of the tank. From well to refinery, from refinery to the jet's tank: the physical chain carries the bill.", "refs": ["southwest-q2", "oil-hormuz"]}]}, {"h": {"tr": "Sıradaki sınav", "en": "The test ahead"}, "ps": [{"tr": "Dün bu köşede tarlanın, tankın ve izabe ocağının konuştuğunu; fiyatı ekranın eğrisinin değil, sahadaki tonun, tanktaki varilin ve ocaktaki metalin koyduğunu yazmıştım. Sınav, fiziksel kapasitenin ne kadar hızlı devreye gireceğiydi. Bugün aynı sınav enerjide: yüksek fiyat kendi ilacını üretir, ama ilaç Hürmüz'den geçen bir tanker ve dolmayan bir depoyla gecikiyor. Önümüzdeki çeyreklerde izlenecek şey basit — boğaz açık kalırsa Katar sevkiyatı toparlar ve fiyat kırılır; boğaz kapalı kalırsa, deponun ve uçağın faturası büyür.", "en": "Yesterday in this column I wrote that the field, the tank and the smelter do the talking; that the price is set not by the curve on the screen but by the tonne in the field, the barrel in the tank and the metal in the smelter. The test was how fast physical capacity comes online. Today the same test is in energy: high prices are their own cure, but the cure is delayed by a tanker through Hormuz and a storage tank that won't fill. What to watch over the coming quarters is simple — if the chokepoint stays open, Qatari shipments recover and the price breaks; if it stays shut, the bill on the tank and the jet grows.", "refs": ["oil-hormuz", "eu-gas", "self-0722"]}]}], "sources": [{"key": "oil-hormuz", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/oil-prices-today-wti-brent-trump-iran-hormuz.html", "title": {"tr": "Suudi Arabistan açıklarında bir tankere isabet ve Trump'ın İran tehditlerinin ardından petrol yükseldi", "en": "Oil climbs after a tanker is struck off Saudi Arabia and Trump escalates Iran threats"}, "publishedDate": "2026-07-23"}, {"key": "eu-gas", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/8f076be9-bf29-4df5-878b-835537ba2585", "title": {"tr": "Avrupa doğal gazı, sıcak dalgası ve Asyalı alıcılarla rekabet içinde savaş dönemi zirvelerine yaklaştı", "en": "European gas nears its war-era highs amid a heatwave and competition from Asian buyers"}, "publishedDate": "2026-07-22"}, {"key": "southwest-q2", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/southwest-airlines-luv-2q-2026-earnings.html", "title": {"tr": "Southwest, yakıt faturası kabarınca üçüncü çeyrek kâr beklentisini Wall Street tahmininin altına çekti", "en": "Southwest cuts its third-quarter profit outlook below Wall Street's estimate as the fuel bill climbs"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-22/", "title": {"tr": "Tarla Konuşuyor: Sıcak, Etanol ve İzabe Ocağı", "en": "The Field Does the Talking: Heat, Ethanol and the Smelter"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-05", "title": {"tr": "Ayrıcalıklı Bilgi, İthalat Vergisi ve Yükselen Petrol: Korumayı Kim Alıyor", "en": "Privileged Information, the Import Tariff and Rising Oil: Who Gets the Protection"}, "excerpt": {"tr": "Meclis, milletvekillerinin hisse alımını sınırladı; Wyden gümrük vergisi yetkisini kısmak istiyor; petrol yükseldi. Üç haber, tek soru: büyüme ve koruma kimin cebine gidiyor?", "en": "The House limited lawmakers' stock buying; Wyden wants to curb tariff power; oil rose. Three stories, one question: whose pocket do the gains and the protections land in?"}, "sections": [{"h": {"tr": "Kimin bilgisi, kimin kazancı", "en": "Whose information, whose gain"}, "ps": [{"tr": "Meclis, görevdeki üyelerin bireysel hisse alımını yasaklayan tasarıyı 232'ye 198 oyla kabul etti. Ama medyana bakın, ortalamaya değil: düzenleme mevcut yatırımların elden çıkarılmasını zorunlu kılmıyor, satıştan en az yedi gün önce niyet açıklaması istiyor ve ihlale 2.000 dolar ya da işlemin yüzde 10'u ceza koyuyor. Bu, kamu görevinin ayrıcalıklı bilgisini kimin nakde çevirebileceği sorusudur; ve tasarı, Cumhuriyetçi liderliğin ilgisiz kaldığı Senato'da büyük olasılıkla duracak.", "en": "The House passed a bill barring sitting members from buying individual stocks by 232-198. But look at the median, not the average: it does not require divesting existing holdings, asks only for seven days' notice before a sale, and fines violations $2,000 or 10% of a transaction. This is the question of who gets to turn the privileged information of public office into cash; and the bill will likely stall in a Senate where Republican leadership shows little interest.", "refs": ["congress-stock"]}, {"tr": "Yetki tartışması aynı adaletsizliği bir üst kata taşıyor. Senatör Wyden'ın tasarısı, başkanın 301, 201 ve 232'nci maddeler kapsamındaki gümrük vergileri için Kongre onayını şart koşuyor, 122 ve 338'inci maddeleri kaldırıyor. Gümrük vergisi soyut bir dış politika aracı değil: ithal malın rafındaki fiyatı, yani market fişini yükselten bir vergi. Bu yetkinin tek elde mi yoksa denetimli mi olacağı, faturayı en dar bütçeli hanenin ne ölçüde taşıyacağını belirliyor.", "en": "The authority fight carries the same unfairness up a floor. Senator Wyden's bill would require congressional approval for the president's tariffs under Sections 301, 201 and 232, and eliminate Sections 122 and 338. A tariff is not an abstract foreign-policy tool: it is a tax that lifts the price on the shelf, the grocery receipt. Whether that power sits in one hand or under review decides how much of the bill the tightest-budget household carries.", "refs": ["wyden-tariff"]}]}, {"h": {"tr": "Pompadaki fatura", "en": "The bill at the pump"}, "ps": [{"tr": "Aynı hafta petrol, Hürmüz'de bir tankere isabetin ardından yükseldi: Brent 96 dolara yaklaştı, West Texas Intermediate 88 doları aştı. GSYİH bu hareketi bir satır olarak yazar; hane halkı onu pompada, ısıtmada ve otobüs biletinde yaşar. Enerji şoku düz bir vergi gibi çalışır — geliri düşük hane, bütçesinin daha büyük bir kısmını yakıta ayırdığı için oransal olarak daha ağır öder. Ortalama enflasyon ılımlı görünse bile, medyan hanenin faturası bu satırda büyür.", "en": "The same week, oil rose after a tanker was struck near Hormuz: Brent neared $96, West Texas Intermediate cleared $88. GDP writes that move as a line; the household lives it at the pump, in heating and in the bus fare. An energy shock works like a flat tax — a lower-income household pays proportionally more because fuel is a bigger share of its budget. Even if average inflation looks mild, the median household's bill grows on this line.", "refs": ["oil-hormuz"]}]}, {"h": {"tr": "İki yılın sınavı", "en": "The two-year test"}, "ps": [{"tr": "Dün bu köşede ilacın faturasını kimin ödeyeceğini, üretimi yurda çekme bahsini medyan hanenin reçete bütçesiyle ölçtüğümü yazmıştım; bir politikanın GSYİH'yi mi yoksa mutfağı mı büyüttüğünü sormak gerektiğini. Bugün üç haber aynı yere bakıyor: hisse yasağı ayrıcalıklı bilgiyi, gümrük yetkisi rafın fiyatını, petrol ise pompayı belirliyor. Önümüzdeki iki yılın sınavı basit — bu düzenlemeler en dar bütçeli haneyi mi koruyacak, yoksa koruma yine bilgiyi ve varlığı elinde tutana mı gidecek? Rakam sevinebilir; hane, ancak medyan cep rahatlarsa sevinir.", "en": "Yesterday in this column I asked who pays for the medicine, measuring the reshoring bet by the median household's prescription budget; that we must ask whether a policy grows GDP or the kitchen table. Today three stories look the same way: the stock ban is about privileged information, the tariff power about the shelf price, and oil about the pump. The two-year test is simple — will these measures protect the tightest-budget household, or will the protection again go to whoever holds the information and the assets? The number may cheer; the household cheers only if the median pocket eases.", "refs": ["congress-stock", "wyden-tariff", "oil-hormuz", "self-0722"]}]}], "sources": [{"key": "congress-stock", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/house-congressional-stock-trading.html", "title": {"tr": "Temsilciler Meclisi, görevdeki üyelerin hisse senedi almasını yasaklayan tasarıyı kabul etti", "en": "House passes a bill barring sitting members of Congress from buying stocks"}, "publishedDate": "2026-07-22"}, {"key": "wyden-tariff", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/trump-tariffs-wyden-bill-congress.html", "title": {"tr": "Senatör Wyden, Trump'ın gümrük vergisi yetkilerini kısıtlayacak bir tasarı sundu", "en": "Senator Wyden introduces a bill to curb Trump's tariff powers"}, "publishedDate": "2026-07-22"}, {"key": "oil-hormuz", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/oil-prices-today-wti-brent-trump-iran-hormuz.html", "title": {"tr": "Suudi Arabistan açıklarında bir tankere isabet ve Trump'ın İran tehditlerinin ardından petrol yükseldi", "en": "Oil climbs after a tanker is struck off Saudi Arabia and Trump escalates Iran threats"}, "publishedDate": "2026-07-23"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-05/2026-07-22/", "title": {"tr": "İlacın Faturasını Kim Ödeyecek? Üretimi Yurda Çekme Bahsinin Ortancası", "en": "Who Pays for the Medicine? The Median in the Reshoring Bet"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}, {"writer": "eco-06", "title": {"tr": "Sözleşme Neyi Örtüyor: Halka Arz Öncesi Bir Bahis, Bir Drop-Down ve Bir Yasak", "en": "What the Contract Hides: A Pre-IPO Bet, a Drop-Down and a Ban"}, "excerpt": {"tr": "Bir kripto platformu, henüz halka açılmamış bir çip üreticisini yüzde 526 primle fiyatlıyor; Aston Martin borcu alacaklıların üstünden atlıyor; Senato kripto ihracını yasaklıyor. Sorun fiyat değil, altındaki kaldıraç.", "en": "A crypto platform prices a not-yet-listed chipmaker at a 526% premium; Aston Martin's debt jumps over its creditors; the Senate bans official crypto issuance. The problem isn't the price, it's the leverage beneath it."}, "sections": [{"h": {"tr": "Henüz olmayan bir hisseye kaldıraçlı bahis", "en": "A leveraged bet on a share that doesn't yet exist"}, "ps": [{"tr": "Bu filmi görmüştük. Merkeziyetsiz türev borsası Hyperliquid'de, Çin'in en büyük DRAM üreticisi CXMT'nin Şanghay'daki halka arzı öncesinde sentetik risk sunan bir sürekli vadeli sözleşme işlem görüyor. Sözleşme bir ara 8,60 dolara ulaşıp halka arz fiyatının yaklaşık yüzde 526 üzerinde, 535 milyar dolarlık bir değeri ima etti; perşembe günü 6,35 dolara indi. Oysa şirket, Şanghay halka arzını hisse başına 8,66 yuandan fiyatladı. \"Bu sefer farklı\" finansın en pahalı dört sözü; henüz olmayan bir hisseye kaldıraçlı bahsin fiyatı, şirketin değil kalabalığın itirafıdır.", "en": "We've seen this film. On the decentralised derivatives exchange Hyperliquid, a perpetual contract offering synthetic exposure to CXMT, mainland China's largest DRAM maker, trades ahead of its Shanghai IPO. The contract at one point hit $8.60, implying a $535 billion valuation about 526% above the IPO price; by Thursday it was at $6.35. Yet the company priced its Shanghai IPO at 8.66 yuan per share. 'This time is different' are the four most expensive words in finance; the price of a leveraged bet on a share that doesn't yet exist is a confession from the crowd, not the company.", "refs": ["cxmt-perp"]}, {"tr": "Mekanizmaya bakın: 500.000 yuanlık varlık eşiği ve yabancı yatırımcı kotası, çoğu yurt dışı bireysel yatırımcının gerçek hisseyi almasını engelliyor. Yani sözleşmeye akan talep, kapının dışında kalmış paranın türev üzerinden içeri sızma çabası — likidite bir korkaktır, ihtiyaç anına kadar oradadır. Böyle bir primi ayakta tutan şey bilanço değil, erişim kısıtının yarattığı yapay kıtlık; ve bu kıtlık, halka arz gerçek fiyatı gösterdiğinde buharlaşabilir.", "en": "Look at the mechanism: a 500,000-yuan asset threshold and foreign-investor quotas keep most overseas retail from buying the real shares. So the demand flowing into the contract is money locked outside the door trying to seep in through a derivative — liquidity is a coward, there until you need it. What holds up such a premium is not a balance sheet but the artificial scarcity of an access limit; and that scarcity can evaporate when the IPO shows the real price.", "refs": ["cxmt-perp"]}]}, {"h": {"tr": "Alacaklının üstünden atlayan borç", "en": "The debt that jumps over the creditor"}, "ps": [{"tr": "Kim kime borçlu sorusunu somut isteyen için Aston Martin var. Nakit sıkıntısındaki üretici, BlackRock'a bağlı HPS öncülüğünde 550 milyon sterlin (yaklaşık 735 milyon dolar) borç aldı. Kritik ayrıntı yapıda: finansman, mevcut alacaklıların erişiminin dışına çıkarılacak varlıklarla teminatlandırılıyor — \"drop-down\" denen, kaldıracı görünmez kılan bir manevra. Arini, BlackRock ve Sculptor öncülüğündeki alacaklı grubu hukuki uyarı gönderdi; tahviller geçen hafta dolar başına 10 sente varan düşüşle rekor dibe indi. Sorun fiyatta değil, o teminatın kimin önüne, kimin arkasına geçtiğinde.", "en": "For anyone who wants the who-owes-whom question made concrete, there's Aston Martin. The cash-strapped maker raised £550 million (about $735 million) led by BlackRock-owned HPS. The critical detail is in the structure: the financing is backed by assets placed beyond existing creditors' reach — a drop-down, a manoeuvre that makes leverage invisible. A creditor group led by Arini, BlackRock and Sculptor sent a legal letter; bonds fell as much as 10 cents on the dollar last week to a record low. The problem isn't the price but who that collateral jumps in front of, and who it leaves behind.", "refs": ["aston-hps"]}, {"tr": "Aynı hafta, kaldıracın tepesindeki halka bir sınır çekiliyor: Senato Cumhuriyetçileri, Clarity Yasası'nı güncelleyerek başkan dâhil federal görevlilerin dijital varlık ihraç etmesini veya bunlara sponsor olmasını yasakladı; günlük 250.000 dolara varan ceza ve Adalet Bakanlığı'na verilen uygulama yetkisiyle. Tasarı Meclis'ten 294'e 134, Senato Bankacılık Komitesi'nden 15'e 9 oyla geçmişti. Kripto döngülerini izleyen için mesaj net: kamu gücüyle jeton ihracının iç içe geçmesi, tam da kimin kime borçlu olduğunu bulanıklaştıran türden bir bağ.", "en": "The same week, a line is drawn around the people at the top of the leverage: Senate Republicans updated the Clarity Act to bar the president and other federal officials from issuing or sponsoring digital assets, with penalties up to $250,000 a day and enforcement handed to the Justice Department. The bill passed the House 294-134 and cleared Senate Banking 15-9. For anyone who watches crypto cycles the message is clear: mixing public power with token issuance is exactly the kind of tie that blurs who owes whom.", "refs": ["clarity-act"]}]}, {"h": {"tr": "İzlenecek kırılma", "en": "The break to watch"}, "ps": [{"tr": "Dün bu köşede iki yeniden fiyatlamayı — yeniden fiyatlanan tahvili ve satılamayan payı — yazmış ve kırılmanın tarihini kimsenin veremeyeceğini, ama sorunun sabit olduğunu söylemiştim: çarpan yarıya inerse ya da alıcı gelmezse, bu pozisyonları kim, hangi fiyata taşıyacak? Bugün üç hikâye aynı fay hattını gösteriyor. CXMT primi erişim kıtlığına, Aston Martin borcu drop-down teminatına, kripto ihracı ise kamu gücüne yaslanıyor. Önümüzdeki çeyreklerde izlenecek soru değişmedi: bu üç yapıdan biri çözüldüğünde, kaldıraç kimin bilançosunda kalacak?", "en": "Yesterday in this column I wrote of two repricings — the bond that reprices and the stake that can't be sold — and said no one can give the date of the break, but the question is fixed: if the multiple halves or the buyer doesn't show, who carries these positions, and at what price? Today three stories point to the same fault line. The CXMT premium leans on access scarcity, the Aston Martin debt on drop-down collateral, and crypto issuance on public power. The question to watch over the coming quarters is unchanged: when one of these three structures unwinds, whose balance sheet does the leverage stay on?", "refs": ["cxmt-perp", "aston-hps", "self-0722"]}]}], "sources": [{"key": "cxmt-perp", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/23/chip-firm-priced-as-most-valuable-china-firm-pre-ipo-on-crypto-site.html", "title": {"tr": "Bir kripto platformunda Çinli çip üreticisi CXMT için halka arz öncesi sözleşme, primli fiyatıyla dikkat çekti", "en": "A pre-IPO contract for Chinese chipmaker CXMT on a crypto platform draws scrutiny with its premium pricing"}, "publishedDate": "2026-07-23"}, {"key": "aston-hps", "kind": "news", "name": "Financial Times", "url": "https://www.ft.com/content/c087714d-7d46-449b-9684-eba1975d313a", "title": {"tr": "Aston Martin, alacaklıların itirazlarına rağmen HPS ile 550 milyon sterlinlik borç anlaşmasını tamamladı", "en": "Aston Martin closes a £550mn debt deal with HPS despite creditor objections"}, "publishedDate": "2026-07-22"}, {"key": "clarity-act", "kind": "news", "name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/senate-crypto-bill-would-ban-federal-officials-from-issuing-digital-assets.html", "title": {"tr": "Senato'daki kripto tasarısı, başkan dâhil federal görevlilerin dijital varlık ihraç etmesini yasaklayacak", "en": "Senate crypto bill would bar federal officials, including presidents, from issuing digital assets"}, "publishedDate": "2026-07-22"}, {"key": "self-0722", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-06/2026-07-22/", "title": {"tr": "İki Yeniden Fiyatlama Sırada: Yeniden Fiyatlanan Tahvil, Satılamayan Pay", "en": "Two Repricings Waiting: The Bond That Reprices and the Stake That Can't Be Sold"}, "publishedDate": "2026-07-22"}], "date": "2026-07-23"}], "dates": ["2026-07-29", "2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24", "2026-07-23"], "dateLabels": {"2026-07-29": {"tr": "29 Temmuz 2026", "en": "July 29, 2026"}, "2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}, "2026-07-26": {"tr": "26 Temmuz 2026", "en": "July 26, 2026"}, "2026-07-25": {"tr": "25 Temmuz 2026", "en": "July 25, 2026"}, "2026-07-24": {"tr": "24 Temmuz 2026", "en": "July 24, 2026"}, "2026-07-23": {"tr": "23 Temmuz 2026", "en": "July 23, 2026"}}, "newsDates": {"economics-markets": "2026-07-29"}, "podcasts": {"economics-markets": {"2026-07-25": {"files": {"en": {"url": "/episodes/2026-07-25-economics-markets-en.c2ac9a16d5fa.mp3", "bytes": 1153611}}}, "2026-07-26": {"files": {"en": {"url": "/episodes/2026-07-26-economics-markets-en.9af91621d14c.mp3", "bytes": 1123100}}}, "2026-07-27": {"files": {"en": {"url": "/episodes/2026-07-27-economics-markets-en.ffde0acb449b.mp3", "bytes": 1187048}}}, "2026-07-28": {"files": {"en": {"url": "/episodes/2026-07-28-economics-markets-en.4dc244543cc1.mp3", "bytes": 1749621}}}}}, "updated": "2026-07-29T03:47:46+00:00"};

   visitors in a Turkic country, English to everyone else. Country comes from the
   browser's IANA timezone (Intl) — native, synchronous (no flash), no geo-IP call.
   ponytail: timezone proxies country; swap in a geo-IP lookup only if it proves wrong. */
const TURKIC_TZ = new Set([
  'Europe/Istanbul',                                   // Turkey
  'Asia/Baku',                                         // Azerbaijan
  'Asia/Bishkek',                                      // Kyrgyzstan
  'Asia/Ashgabat',                                     // Turkmenistan
  'Asia/Tashkent','Asia/Samarkand',                    // Uzbekistan
  'Asia/Famagusta',                                    // Northern Cyprus

const ROUTE_LANG = "en";
function detectLang(){
  if (ROUTE_LANG === 'tr' || ROUTE_LANG === 'en') return ROUTE_LANG;
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'tr' || saved === 'en') return saved;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return TURKIC_TZ.has(tz) ? 'tr' : 'en';
  } catch { return 'tr'; }
}

}
function localized(value){
  if (value && typeof value==='object') {
    return value[LANG] || value[LANG==='tr'?'en':'tr'] || '';

function referenceDate(value){
  if(typeof value!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
  const parsed = new Date(`${value}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==value) return '';

/* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

    .map(row => ({src:safeBriefAsset(row?.src), width:Number(row?.width)}))
    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)
    .sort((a,b)=>a.width-b.width) : [];
  const src = safeBriefAsset(image.src);
  const srcset = variants.map(row => `${row.src} ${row.width}w`).join(', ');
  const width = Number.isInteger(image.width) && image.width > 0 ? image.width : 1280;

    : '(min-width:2560px) 30rem,(min-width:1920px) 28rem,(min-width:1440px) 25rem,(min-width:1200px) 23rem,(min-width:641px) 33vw,calc(100vw - 2rem)';

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

  const start = page * pageSize;
  return {items:items.slice(start, start + pageSize), page, pages};
