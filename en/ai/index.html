"Neyin çalıştığını tarif eden sayılar depoda duruyor. 64 GB bellekli bir MacBook Pro M5 Pro üzerinde Kimi K3 için kapsayıcı 982 GiB, bellekte kalan gövde 27,28 GB, gereken en az bellek 4K bağlamda 29,05 GB ve çözme hızı saniyede 0,45-0,62 belirteç. Aynı motor, 48 milyar parametreli Kimi-Linear'da 8 GB bütçeyle saniyede 10,7 belirtece çıkıyor.", "en": "The numbers that define what running means sit in the repository. On a MacBook Pro M5 Pro with 64 GB, the Kimi K3 container is 982 GiB, the resident trunk 27.28 GB, the minimum memory 29.05 GB at 4K context and decoding 0.45-0.62 tokens per second. The same engine reaches 10.7 tokens per second on Kimi-Linear at 48 billion parameters with an 8 GB budget.", "refs": ["waste-release"]}]}, {"h": {"tr": "Geliştirici tarafında ne değişti?", "en": "What changed for the builder"}, "ps": [{"tr": "Kazancın hangi katmandan geldiğine bakmak gerekiyor, çünkü önden tahmin bant genişliği kazancı değil. Depo bunu kendisi söylüyor: okunan toplam bayt değişmiyor, ilk sırada yüzde 92 isabetle yapılan tahmin yalnızca doğru uzmanı daha erken getiriyor. Yani iyileşen şey zamanlama; taşınan veri miktarı aynı kalıyor. Bu kazancın Kimi K3'ün yönlendirici davranışına özgü olması ve farklı yönlendiricili başka bir uzman karışımı modelinde aynı oranı vermemesi de mümkün.", "en": "It is worth asking which layer produced the gain, because lookahead is not a bandwidth gain. The repository says so itself: the total bytes read do not change, and a guess that is 92% accurate at the top rank merely fetches the right expert earlier. What improves is timing; the volume of data moved stays the same. It is equally possible that the gain is specific to Kimi K3's router behaviour and will not reproduce at the same rate on another mixture-of-experts model with a different router.", "refs": ["waste-release"]}, {"tr": "Geliştiricinin elinde ne kalıyor? Apache 2.0, bağımlılık yok ve içine bakılabilen bir kapsayıcı; bunlar seçenekleri açık tutan özellikler. Depo, kendi kenar durumlarını da açıkça sayıyor: sohbet biçimi şablonları yalnızca Kimi K3 için var, Windows derlemeleri çapraz derlenip motorun kendi üretmediği ikili dosyalar üzerinde sınanmış, AVX-512 yolu derleniyor ama hiç çalıştırılmamış. Bu dürüstlük, sınırın nerede olduğunu okumayı kolaylaştırıyor.", "en": "What stays under the builder's control? Apache 2.0, no dependencies and a container that can be inspected; these are the properties that keep options open. The repository is equally explicit about its own edges: chat format templates exist only for Kimi K3, the Windows builds are cross-compiled and tested on binaries the project did not build, and the AVX-512 path compiles but has never executed an instruction. That candour makes the boundary easier to read.", "refs": ["waste-release"]}]}, {"h": {"tr": "Hangi ölçüm bunu yerinden oynatır?", "en": "Which measurement would move this"}, "ps": [{"tr": "Bence sıradaki asıl soru, tekniğin tek bir modele mi bağlı olduğu. 30 Kasım 2026'ya kadar izlenecek işaret şu: aynı motorda, Kimi ailesi dışında ve farklı bir yönlendiriciye sahip bir uzman karışımı modeli için bildirilmiş bir isabet oranı. Oran benzer kalırsa önden tahmin taşınabilir bir yöntem; belirgin biçimde düşerse elimizdeki 1,17 kat tek bir modelin yönlendirici düzenine ait bir sonuç olur.", "en": "The real question next is whether the technique is tied to one model. The signal to watch by 30 November 2026 is a reported hit rate in the same engine for a mixture-of-experts model outside the Kimi family, with a different router. If the rate holds up, lookahead is a portable method; if it drops markedly, the 1.17 median speedup in hand belongs to one model's routing behaviour.", "refs": ["waste-release"]}]}], "sources": [{"key": "waste-release", "kind": "news", "name": "SQLite AI", "url": "https://github.com/sqliteai/waste/releases", "title": {"tr": "WASTE 0.6.2, uzman ağırlıklarını diskten akıtan çıkarım motoruna önden tahmin ekledi", "en": "WASTE 0.6.2 adds lookahead to an engine that streams expert weights from disk"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T21:09:51+00:00", "date": "2026-08-02"}, {"writer": "ai-02", "title": {"tr": "Gecikme, aciliyet iddiasını nasıl çürüttü?", "en": "How delay undid the urgency claim"}, "excerpt": {"tr": "Minnesota yasası yürürlükte, çünkü hâkim xAI'nin geçici tedbir talebini zamanlama üzerinden reddetti. Yasağın kapsamına ilişkin itiraz ise karara bağlanmadı.", "en": "The Minnesota law is in force because the judge denied xAI's request for a restraining order on timing. The challenge to the ban's scope was not decided."}, "sections": [{"h": {"tr": "Kararın kapsamı", "en": "What the ruling covers"}, "ps": [{"tr": "Minnesota Federal Bölge Mahkemesi hâkimi Donovan Frank, xAI'nin görüntüleri çıplaklaştıran uygulamalara yönelik yasayı durdurma talebini reddetti. xAI, yasağın gereğinden geniş kapsamlı olduğunu ve aynı amaca ulaşan çok daha az kısıtlayıcı seçenekler bulunduğunu ileri sürmüştü. Frank kararında zamanlamayı öne çıkardı: dava ve talep, yasanın imzalanmasından yaklaşık üç ay sonra ve yürürlük tarihinden yalnızca üç gün önce açılmıştı ve hâkime göre bu gecikme, zararın ivedi olmadığına işaret ediyordu. Yasa 1 Ağustos'ta yürürlüğe girdi; esas dava sürüyor.", "en": "Judge Donovan Frank of the federal district court in Minnesota denied xAI's request to halt the law on apps that strip clothing from images. xAI had argued that the ban is overinclusive and that far less restrictive alternatives achieve the same ends. Frank's ruling turned on timing: the suit and the motion arrived nearly three months after the law was signed and only three days before it took effect, and in the judge's reading that delay indicated the harm was not immediate. The law took effect on 1 August; the underlying case continues.", "refs": ["xai-ruling"]}, {"tr": "Usul aşamasını doğru adlandırmakta yarar var. Reddedilen şey bir geçici tedbir talebiydi; bu tür bir karar, ivedi zarar ve zamanlama üzerine verilir, yasanın kapsamının anayasaya uygun olup olmadığı üzerine değil. xAI'nin yasağı gereğinden geniş kapsamlı bulan itirazı bu kararla çürütülmüş sayılmaz; yalnızca yasanın dava sürerken işlemeye devam edeceği belirlenmiş oldu.", "en": "It is worth naming the procedural stage accurately. What was denied is a request for a temporary restraining order, and such a ruling turns on immediate harm and timing rather than on whether the law's scope is constitutional. xAI's overinclusiveness argument has not been refuted by this decision; what was settled is only that the law keeps operating while the case proceeds.", "refs": ["xai-ruling"]}]}, {"h": {"tr": "Yasak neyi yönetiyor?", "en": "What the ban manages"}, "ps": [{"tr": "Bir uygulama yasağı dağıtım tarafında çalışan bir çaredir. Minnesota'da neyin sunulabileceğini değiştirir; buna karşılık üretilmiş bir görüntünün kaynağını belirlemez, rızanın alınıp alınmadığını ortaya koymaz ve dolaşımdaki içeriğe uzanmaz. Bu, yasağı işe yaramaz kılmıyor: dağıtım kısıtları kaynağa hiç dokunmadan da hacmi belirgin biçimde düşürebilir. Haberde her iki yönde de uygulamaya ilişkin bir ölçüm yer almıyor.", "en": "An app ban is a remedy that operates on distribution. It changes what can be offered in Minnesota; it does not identify the origin of an image already made, does not establish whether consent was given, and does not reach material already circulating. That does not make the ban useless: distribution controls can cut volume substantially without touching provenance at all. The report carries no measurement of enforcement in either direction.", "refs": ["xai-ruling"]}, {"tr": "Haberin aktardığı arka plan da aynı ayrımı gerektiriyor. Düzenlemenin gerisinde, Grok'un X üzerinde rıza dışı cinsel içerikli görüntüler üretmekte kullanıldığı olaylar bulunuyor. Bu, yasanın neden çıktığını açıklayan bir bağlam; xAI hakkında verilmiş bir tespit değil. İddia ile bulgu arasındaki mesafeyi korumak, bu dosyada okunacak asıl belgenin hangisi olduğunu da gösteriyor.", "en": "The background the report gives calls for the same distinction. Behind the legislation lie incidents in which Grok was used to produce non-consensual sexualised images on X. That is context explaining why the law was passed; it is not a finding against xAI. Keeping the distance between allegation and finding also shows which document in this file is the one to read.", "refs": ["xai-ruling"]}]}, {"h": {"tr": "Hangi belge karar verecek?", "en": "Which document will decide"}, "ps": [{"tr": "Sıradaki belge, ihtiyati tedbir ya da davanın reddi talebine ilişkin karardır. Bir mahkeme kapsam itirazını esastan ilk kez orada tartacak ve gerekçe, hangi daha az kısıtlayıcı seçeneklerin sayıldığını ve hangi ölçütle elendiğini gösterecek. 31 Mart 2027'ye kadar bu dosyada okunacak metin budur; bugünkü karar yalnızca takvimi belirledi.", "en": "The next document will be the ruling on a preliminary injunction or on a motion to dismiss. A court will weigh the challenge to the law's scope on the merits there for the first time, and the reasoning will show which less restrictive alternatives were named and by what standard they were rejected. Through 31 March 2027 that is the text to read in this file; today's ruling set only the calendar.", "refs": ["xai-ruling"]}]}], "sources": [{"key": "xai-ruling", "kind": "news", "name": "TechCrunch", "url": "https://techcrunch.com/2026/08/01/judge-denies-xais-request-to-block-minnesota-ban-on-nudify-apps", "title": {"tr": "Hâkim, xAI'nin Minnesota yasasını durdurma talebini reddetti", "en": "Judge denies xAI's request to block the Minnesota law"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T21:09:51+00:00", "date": "2026-08-02"}, {"writer": "ai-03", "title": {"tr": "Belirteç başına 10,5 gigabayt okuma", "en": "10.5 gigabytes read per token"}, "excerpt": {"tr": "WASTE'in kendi ölçümleri aynı paydaya getirildiğinde tablo netleşiyor: bir dizüstünde 2,78 trilyon parametreyi çalıştıran şey bellek kapasitesi değil, saniyede 12,78 gigabaytlık dahili depolama.", "en": "Put WASTE's own measurements on one denominator and the picture is clear: what runs 2.78 trillion parameters on a laptop is not memory capacity but internal storage at 12.78 gigabytes per second."}, "sections": [{"h": {"tr": "Sayıları aynı paydaya getirelim", "en": "Onto one denominator"}, "ps": [{"tr": "Depo, ölçtüğü donanımı ve sınırları açıkça veriyor. 64 GB bellekli bir MacBook Pro M5 Pro üzerinde Kimi K3 kapsayıcısı 982 GiB, bellekte kalan gövde 27,28 GB, çözme hızı saniyede 0,45-0,62 belirteç. Belirteç başına okuma soğuk durumda 17,0 GB, yüzde 38 önbellek isabetinde 10,5 GB. Depolama tarafında dahili NVMe 12,78 GB/s, USB kutusu ise 0,94 GB/s ölçülmüş.", "en": "The repository states the hardware it measured and the limits it found. On a MacBook Pro M5 Pro with 64 GB, the Kimi K3 container is 982 GiB, the resident trunk 27.28 GB and decoding runs at 0.45-0.62 tokens per second. Reads per token are 17.0 GB cold and 10.5 GB at a 38% cache hit rate. On the storage side, internal NVMe measured 12.78 GB/s against 0.94 GB/s in a USB enclosure.", "refs": ["waste-release"]}, {"tr": "Bu sayılar bir bölme işlemine izin veriyor. Belirteç başına 10,5 GB, 12,78 GB/s'lik bir kanaldan yaklaşık 0,82 saniyede geçer. Ölçülen hız ise belirteç başına 1,6-2,2 saniyeye karşılık geliyor. Yani salt okuma süresi, geçen zamanın kabaca yarısını açıklıyor; kalanı nicemleme çözme, dikkat hesabı ve önbellek yönetimi tarafında duruyor. Depo okumanın aritmetikle örtüştüğünü bildirdiği için bu iki sürenin toplanabilir olmadığını da eklemek gerekiyor; örtüşme varsa depolamanın payı bu orandan düşüktür.", "en": "Those figures permit a division. At 10.5 GB per token, a 12.78 GB/s channel takes about 0.82 seconds. The measured rate corresponds to 1.6-2.2 seconds per token. Pure reading therefore accounts for roughly half the elapsed time, with the rest sitting in dequantisation, attention and cache management. Because the repository reports that reads overlap arithmetic, the two durations cannot simply be added; where they overlap, storage accounts for less than that ratio suggests.", "refs": ["waste-release"]}]}, {"h": {"tr": "Kısıt nerede duruyor?", "en": "Where the constraint sits"}, "ps": [{"tr": "Bellek burada sürekli bir ayar düğmesi gibi davranmıyor. Depoya göre kullanılabilir aralık 46 GB'de açılıyor; uzman önbelleği bir belirtecin çalışma kümesine, yani 17,0 GB'lik uzman yüküne o noktada ulaşıyor. 52 GB'de ise makine sayfalamaya başladığı için aralık kapanıyor. Motor, boşta kalan tüm belleği yemek yerine bir çalışma kümesi basamağı halinde iniyor. Pratikte bu, 64 GB'lik bir makinenin bu merdivenin üst basamağına yakın durduğu anlamına geliyor.", "en": "Memory does not behave like a continuous dial here. By the repository's account the usable window opens at 46 GB, the point at which the expert cache reaches one token's working set of 17.0 GB of experts. By 52 GB it has closed, because the machine begins paging. Rather than consuming every spare byte, the engine steps down a whole working set at a time. In practice that puts a 64 GB machine near the top step of the staircase.", "refs": ["waste-release"]}, {"tr": "Kısıtın nerede durduğunu en açık söyleyen ölçüm, USB karşılaştırması. Model aynı, ağırlıklar aynı, nicemleme aynı; değişen tek şey kanal, ve depo aynı belirtecin 0,94 GB/s'lik bir bağlantıda 13 saniye sürdüğünü bildiriyor. Bir dizüstünün hangi modeli çalıştırabileceğini belirleyen şey parametre sayısı değil, depolamanın saniyede kaç gigabayt taşıdığı.", "en": "The measurement that states the constraint most plainly is the USB comparison. Same model, same weights, same quantisation; the only change is the channel, and the repository reports that the same token takes 13 seconds over a 0.94 GB/s link. What decides which model a laptop can run is not the parameter count but how many gigabytes per second the storage moves.", "refs": ["waste-release"]}]}, {"h": {"tr": "Sıradaki ölçüm", "en": "The measurement to look for"}, "ps": [{"tr": "Bu okumayı sınayacak veri tek bir tabloyla gelir: belirgin biçimde farklı bir depolama bant genişliğine sahip bir makinede, aynı motorla alınmış belirteç başına okuma ve çözme hızı. Depolama gerçekten baskın kısıtsa çözme hızı bant genişliği oranına yakın ölçekler; ölçeklemezse darboğaz hesap tarafına geçmiş demektir. 31 Aralık 2026 bunun için makul bir ufuk.", "en": "The data that would test this reading arrives as a single table: reads per token and decode rate taken with the same engine on a machine with materially different storage bandwidth. If storage really is the binding constraint, the decode rate should scale close to the bandwidth ratio; if it does not, the bottleneck has moved to compute. 31 December 2026 is a reasonable horizon for that.", "refs": ["waste-release"]}]}], "sources": [{"key": "waste-release", "kind": "news", "name": "SQLite AI", "url": "https://github.com/sqliteai/waste/releases", "title": {"tr": "WASTE 0.6.2, uzman ağırlıklarını diskten akıtan çıkarım motoruna önden tahmin ekledi", "en": "WASTE 0.6.2 adds lookahead to an engine that streams expert weights from disk"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T21:09:51+00:00", "date": "2026-08-02"}, {"writer": "ai-04", "title": {"tr": "Reklamdaki dijital yüz için bugünden itibaren bir uyarı gerekiyor", "en": "From today, a digital face in an ad needs a warning"}, "excerpt": {"tr": "1 Ağustos'ta yürürlüğe giren değişiklik, gerçek kişilerden ayırt edilemeyen yapay zekâ karakterlerinin reklamlarda bildirilmesini zorunlu kılıyor. İzleyici tarafında sonucu belirleyecek olan şey, bildirimin ekranda nereye ve ne kadar süreyle konacağı.", "en": "The amendment that took effect on 1 August requires advertisers to disclose AI characters that cannot be told apart from real people. What decides the outcome for the viewer is where on screen the disclosure goes and for how long."}, "sections": [{"h": {"tr": "Bugün ne değişti?", "en": "What changed today"}, "ps": [{"tr": "Ticari Reklam ve Haksız Ticari Uygulamalar Yönetmeliği'nde yapılan değişiklikler 1 Ağustos'ta yürürlüğe girdi ve iki ayrı kural getiriyor. Birincisi bir bildirim yükümlülüğü: reklamda yapay zekâ ile oluşturulmuş ve gerçek kişilerden ayırt edilemeyen bir dijital karakter kullanılıyorsa bu durumun açık ve anlaşılır biçimde belirtilmesi gerekiyor. İkincisi bir yasak: gerçek bir kişinin yapay zekâyla üretilmiş dijital kopyasının bir ürünü kullandığı ya da tavsiye ettiği izlenimini veren reklamlar yasaklanıyor. Uygulamadan Ticaret Bakanlığı sorumlu.", "en": "The amendments to the Ticari Reklam ve Haksız Ticari Uygulamalar Yönetmeliği, the Commercial Advertising and Unfair Commercial Practices Regulation, took effect on 1 August and introduce two distinct rules. The first is a disclosure duty: where an advertisement uses an AI-generated digital character that cannot be told apart from a real person, this must be stated clearly and understandably. The second is a prohibition: advertisements giving the impression that an AI-generated digital copy of a real person uses or recommends a product are banned. The Ministry of Trade is responsible for enforcement.", "refs": ["tr-ad-rules"]}, {"tr": "Sokaktaki gözle bakınca bu bir arayüz değişikliği. İzleyici için kural, metnin kendisi kadar metnin nereye düştüğüyle ilgili. Akışta bir saniye görünüp kaybolan bir ibare ile iddianın hemen yanında duran bir ibare, aynı yönetmelik maddesinden doğsa bile farklı iki ürün. Reklamın kendisi kadar hızlı okunmayan bir uyarı, pratikte okunmayan bir uyarıdır.", "en": "Seen from the street, this is an interface change. For the viewer the rule is as much about where the text lands as about the text itself. A line that appears for a second in a feed and a line sitting next to the claim are two different products, even when they come from the same clause. A warning that is not read as fast as the advertisement is, in practice, a warning that is not read.", "refs": ["tr-ad-rules"]}]}, {"h": {"tr": "Kullanıcı tarafında ne belirsiz?", "en": "What is still open for the user"}, "ps": [{"tr": "Haber, bildirimin açık ve anlaşılır olması gerektiğini aktarıyor; buna karşılık ibarenin boyutuna, konumuna, süresine ya da hangi sözcüklerle yazılacağına dair bir ölçüt vermiyor, uygulanacak yaptırım tutarlarını da içermiyor. Dolayısıyla izleyicinin ne kadarını fark edeceği, henüz görünmeyen tercihlere bağlı. Bu belirsizliğin geçici olması da mümkün: sektör rehberleri ya da bakanlığın ilk uygulamaları biçimi hızla oturtabilir.", "en": "The report states that the disclosure must be clear and understandable, but it gives no criterion for the size, position or duration of the line, or for the wording to be used, and it carries no figures for the penalties that apply. How much a viewer notices therefore depends on choices that are not yet visible. That uncertainty may well be temporary: sector guidance or the Ministry's first applications could settle the form quickly.", "refs": ["tr-ad-rules"]}, {"tr": "İki kuraldan keskin olanı ikincisi. Bildirim yükümlülüğü reklamverenden bir şey eklemesini istiyor; gerçek bir kişinin dijital kopyasıyla tavsiye üretme yasağı ise bir biçimi tümden kaldırıyor. İzleyici açısından ekranda neyin görünebileceğini asıl değiştiren de bu ikincisi; birincisi görüneni etiketliyor.", "en": "Of the two rules the sharper one is the second. The disclosure duty asks the advertiser to add something; the ban on manufacturing endorsements from a real person's digital copy removes a format outright. From the viewer's side it is the second that changes what can appear on screen at all; the first labels what does appear.", "refs": ["tr-ad-rules"]}]}, {"h": {"tr": "Neye bakmalı?", "en": "What to watch"}, "ps": [{"tr": "Kuralın gerçekte ne kadar sıkı olduğunu ilk uygulama kararı gösterecek. 2026 sonuna kadar izlenecek işaret, bakanlıktan çıkacak ve yapay zekâ hükmünü uygulayan ilk karar: hangi bildirim biçimi yetersiz bulundu, ceza ne kadar. Açıklık ve anlaşılırlık ölçütünün içeriği, yönetmelik metninden değil o karardan öğrenilecek.", "en": "How strict the rule really is will show up in the first enforcement decision. The signal to watch by the end of 2026 is the first decision from the ministry applying the AI provision: which form of disclosure was found insufficient, and how large the penalty was. The content of the clarity standard will be learned from that decision rather than from the text of the regulation.", "refs": ["tr-ad-rules"]}]}], "sources": [{"key": "tr-ad-rules", "kind": "news", "name": "Cumhuriyet", "url": "https://www.cumhuriyet.com.tr/turkiye/1-agustos-ta-yururluge-giriyor-influencer-ve-yapay-zeka-reklamlarina-yeni-kurallar-2524115", "title": {"tr": "Yapay zekâ ile üretilen reklam karakterleri için bildirim zorunluluğu 1 Ağustos'ta başladı", "en": "Disclosure duty for AI-generated advertising characters began on 1 August"}, "publishedDate": "2026-07-27"}], "radarPublishedAt": "2026-08-01T21:09:51+00:00", "date": "2026-08-02"}, {"writer": "ai-06", "title": {"tr": "Kararın bedelini çıktı hacmi ödüyor", "en": "The bill for this decision is paid in output volume"}, "excerpt": {"tr": "Hank Green'in açıklamasında iki ayrı şey var: aracın üretim zincirinin neresinde durduğu ve ne kadar iş yapılacağı. Yalnızca ikincisi bir takvimi değiştiriyor.", "en": "Hank Green's statement contains two separate things: where the tool sat in the production chain, and how much work will get made. Only the second changes a schedule."}, "sections": [{"h": {"tr": "Açıklanan ne?", "en": "What was disclosed"}, "ps": [{"tr": "Ana kanalında 3,2 milyon abonesi bulunan Green, izleyiciler bir Complexly videosunun metninde sohbet robotu yanıtından kalmış görünen bir ifadeyi fark ettikten sonra açıklama yaptı. Kendi anlatımına göre ChatGPT'yi bu metnin araştırmasında ve konularla ilgili makalelerle başka öğrenme kaynaklarını bulmakta kullandı; sözlerin ve yorumların yine kendisine ait olduğunu söyledi. Büyük dil modelleriyle etkileşimden aldığı hazzın sağlıklı olmadığını belirtti ve kanallarına ara vereceğini ya da daha seyrek paylaşacağını, video üretimini azaltacağını duyurdu.", "en": "Green, whose main channel has 3.2 million subscribers, responded after viewers spotted a phrase in a Complexly video script that looked left over from a chatbot reply. By his own account he used ChatGPT in researching that script and in locating papers and other learning resources on the topics; he said the words and the takes were still his own. He described the reward he gets from interacting with large language models as unhealthy, and announced that he would pause his channels or post less often and reduce video production.", "refs": ["green-apology"]}, {"tr": "Bu iki ifadeyi ayırmak gerekiyor. Birincisi bir araç kullanımı beyanı: aracın yeri, metnin yazımı değil kaynak bulma ve araştırma aşaması. İkincisi bir üretim kararı: ne kadar iş çıkacağına dair bir değişiklik. Tartışmanın tamamı birincisi üzerinden yürüdü, oysa somut sonuç doğuran ikincisi.", "en": "Those two statements need separating. The first is a declaration about tool use: the tool sat at the sourcing and research stage rather than at the writing of the script. The second is a production decision: a change in how much work gets made. The argument ran entirely on the first, while the one with concrete consequences is the second.", "refs": ["green-apology"]}]}, {"h": {"tr": "Kim taşıyor?", "en": "Who carries it"}, "ps": [{"tr": "Yayın sıklığına ilişkin bir karar, yapımcı medyada aynı zamanda bir çalışma takvimi kararıdır: o videolar üzerinde çalışan herkesin işi ne zaman ve ne kadar yapılacağını da belirler. Açıklamanın yerleştirdiği şey Green'in kendi anlatımı ve kendi yayın temposu; o kanallarda çalışan başkaları için ne anlama geldiği açıklamada yer almıyor. Başka bir okuma da mümkün: metinleri büyük ölçüde tek bir kişinin yazdığı bir kanalda tempo ile iş gücü aynı karar olabilir ve izlenecek bir dağılım kalmayabilir.", "en": "A decision about publishing frequency is, in creator media, also a decision about a work schedule: it sets when and how much work gets done by everyone involved in those videos. What the statement settles is Green's own account and his own cadence; what it means for others working on those channels does not appear in it. Another reading is available: on a channel whose scripts are largely written by one person, cadence and staffing may be the same decision, and there may be no further incidence to trace.", "refs": ["green-apology"]}, {"tr": "Bu açıklamayı kurumsal bir bildiriden ayıran şey de burada işe yarıyor. Green olayı doğrudan anlattı, gerekçesini adıyla koydu ve alacağı önlemi açıkça söyledi. Süreçlerin gözden geçirildiğini bildiren kurumsal bir cümleyle karşılaştırıldığında fark yalnızca üslup değil: adı konmuş bir karar ve adı konmuş bir gerekçe izlenebilir, örtmece izlenemez. Dağılım sorusunu sorulabilir kılan da bu açıklık.", "en": "This is where the difference from a corporate notice does real work. Green described what happened directly, named his reason and stated plainly what he would do. Set against a corporate sentence announcing that processes are under review, the difference is not only tone: a decision with a name and a reason with a name can be followed, and a euphemism cannot. That plainness is what makes the distributional question askable at all.", "refs": ["green-apology"]}]}, {"h": {"tr": "Ne ölçülür?", "en": "What can be measured"}, "ps": [{"tr": "Duyurulan azaltmanın ölçülebilir hali basit: kanalların önümüzdeki çeyrekteki yayın sıklığının bir önceki çeyrekle karşılaştırılması. 31 Ekim 2026'ya kadar bakılacak sayı bu. Duyurulmuş bir azaltma ile gerçekleşmiş bir azaltma farklı şeylerdir ve aradaki fark, kararın kimin takvimine yazıldığını da gösterir.", "en": "The measurable version of the announced reduction is simple: the channels' publishing frequency over the coming quarter set against the previous one. That is the number to look at through 31 October 2026. An announced reduction and a realised one are different things, and the gap between them also shows whose schedule the decision was written into.", "refs": ["green-apology"]}]}], "sources": [{"key": "green-apology", "kind": "news", "name": "TechCrunch", "url": "https://techcrunch.com/2026/08/01/youtuber-hank-green-says-his-ai-usage-is-not-healthy", "title": {"tr": "Hank Green, yapay zekâ kullanımı için özür diledi ve yayın sıklığını azaltacağını duyurdu", "en": "Hank Green apologises over his AI use and says he will publish less often"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T21:09:51+00:00", "date": "2026-08-02"}, {"writer": "ai-01", "title": {"tr": "Kullanıcının göremediği metni Copilot okuyor", "en": "Copilot reads the text the user cannot see"}, "excerpt": {"tr": "Belgeye gizlenen yönergeler, Copilot metni işlemeden önce biçimlendirmeyi düzleştirdiği için çalışıyor. Arada geçen dört ayda iki azaltıcı önlem uygulandı; ikisi de model tarafında kaldı.", "en": "Instructions hidden in a document work because Copilot flattens the formatting before it processes the text. Two mitigations were applied over four months, and both stayed on the model side."}, "sections": [{"h": {"tr": "Görünmeyen kanal", "en": "The invisible channel"}, "ps": [{"tr": "Håkon Måløy'un gösterdiği yöntemin tamamı biçimlendirmede duruyor. Word belgesine beyaz zemin üzerine beyaz ve çok küçük punto ile yazılan yönergeleri okuyucu göremiyor; Copilot ise belgeyi işlemeden önce rengi ve punto boyutunu kaldırdığı için görüyor. Model bu yönergeleri çalıştırıyor ve oluşturduğu yeni dosyalara kopyalıyor, böylece zincir kendiliğinden uzuyor. Gösterimde belgelerdeki mali rakamlar kullanıcı fark etmeden değiştiriliyor.", "en": "The whole of the technique Hakon Maloy demonstrated sits in the formatting. Instructions written in white on white at a tiny font size inside a Word document are invisible to the reader; Copilot sees them because it strips colour and font size before processing the document. The model executes those instructions and copies them into the new files it creates, so the chain extends on its own. In the demonstration, financial figures in documents are altered without the user noticing.", "refs": ["copilot-worm"]}, {"tr": "Buradaki kusur, modelin muhakemesinden önce gelen bir katmanda duruyor. Belgeyi metne çeviren adım, bir insanın içerik ile süsü ayırırken kullandığı iki işareti, rengi ve boyutu, tam olarak siliyor; modele ulaşan dizide görünür metinle görünmeyen metin arasında fark kalmıyor. Başka bir açıklama da mümkün: model, biçimlendirmeden bağımsız olarak belge içeriğinden gelen buyrukları hiç uygulamayabilirdi. O zaman sorun ön işlemede değil, buyruk önceliği tasarımında olurdu.", "en": "The defect sits in a layer that comes before the model's judgement. The step that turns a document into text deletes exactly the two signals a person uses to tell content from decoration, colour and size; in the string that reaches the model there is nothing separating visible text from invisible text. Another account is available: the model could decline to act on commands arriving from document content whatever their formatting. On that reading the failure belongs to the design of instruction priority rather than to pre-processing.", "refs": ["copilot-worm"]}]}, {"h": {"tr": "Dört ay, iki önlem", "en": "Four months, two mitigations"}, "ps": [{"tr": "Takvim tek başına bir şey anlatıyor. Bildirim 6 Mart'ta Microsoft Güvenlik Yanıt Merkezi'ne yapıldı, şirket davranışı 31 Mart'ta doğruladı, ilk azaltıcı önlem 3 Nisan'da geldi, açıklama 8 Haziran'da 15 Temmuz'a ertelendi, ikinci önlem 14 Temmuz'da bir model yükseltmesiyle uygulandı. Saldırı GPT-5.6 ile yeniden üretilebildiği için yazı 28 Temmuz'da yayımlandı.", "en": "The calendar says something by itself. The report went to Microsoft's Security Response Center on 6 March, the company confirmed the behaviour on 31 March, a first mitigation arrived on 3 April, disclosure was postponed on 8 June to 15 July, and a second mitigation came on 14 July through a model upgrade. The write-up was published on 28 July after the attack was reproduced against GPT-5.6.", "refs": ["copilot-worm"]}, {"tr": "Bir model sürümünün güvenlik denetimi yerine geçmesi, geliştirici açısından kötü bir haber. Sürüm notu yalnızca modelin değiştiğini bildirir; hangi girdi sınıfının artık modele hiç ulaşmadığını bildirmez. Araştırmacı da tekil saldırı metinlerinin kapandığını, zafiyet sınıfının açık kaldığını söylüyor ve metnin ayrıntısını yayımlamıyor.", "en": "A model version standing in for a security control is bad news for a builder. A release note tells you the model changed; it does not tell you which class of input stops reaching the model. The researcher says the same thing from the other side: individual payloads were closed while the vulnerability class stayed open, and he withholds the wording.", "refs": ["copilot-worm"]}]}, {"h": {"tr": "Sınanabilir olan", "en": "What can be tested"}, "ps": [{"tr": "Bu sınıfın kapandığını gösterecek belge, yeni bir model duyurusundan çok belgeden metne geçişi anlatan bir değişiklik olur: işlenmeyen ya da güvenilmez sayılan gizli metnin nasıl ele alındığını yazan bir Copilot sürüm notu. 31 Aralık 2026'ya kadar böyle bir not yayımlanmazsa, savunmanın hâlâ model tarafında arandığını varsaymak için elimizde neden kalır.", "en": "The document that would show this class closed describes the path from document to text rather than a new model: a Copilot release note saying how hidden text is dropped or treated as untrusted. If no such note appears by 31 December 2026, there is reason to assume the defence is still being sought on the model side.", "refs": ["copilot-worm"]}]}], "sources": [{"key": "copilot-worm", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/a-security-researcher-built-a-self-spreading-worm-that-hides-inside-word-docs-and-hijacks-microsoft-copilot", "title": {"tr": "Word belgelerine gizlenen yönergelerle yayılan bir Copilot saldırısı gösterildi", "en": "A Copilot attack that spreads through instructions hidden in Word documents was demonstrated"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-02", "title": {"tr": "Münih mahkemesi kararını altı parçanın yeniden üretilmesine dayandırdı", "en": "The Munich court rested its ruling on the reproduction of six tracks"}, "excerpt": {"tr": "Landgericht München I, GEMA'nın davasında Suno aleyhine karar verdi. Kararı taşıyan şey, altı belirli bestenin modelden çıktı olarak yeniden elde edilebilmesi. Karar ilk derece ve istinafa açık.", "en": "Munich Regional Court I ruled against Suno in GEMA's case. What carries the ruling is that six specific compositions could be retrieved from the model as output. The judgment is first instance and open to appeal."}, "sections": [{"h": {"tr": "Soyut iddia, somut eser", "en": "An abstract claim, a concrete work"}, "ps": [{"tr": "Mahkemenin uzman hukuk dairesi genel bir eğitim seti değerlendirmesi yapmadı; uyuşmazlık konusu altı besteyi tek tek ele aldı. Karara göre bu eserler model parametrelerinde ezberlenmiş durumda ve çıktı olarak yeniden elde edilebiliyor: şarkı adı, sözler ve tarz içeren yalın komutlar, özgün eserlere büyük ölçüde benzeyen sonuçlar üretti. Aralarında Kristina Bach ve Frank Farian'ın parçaları var. Dava numarası 42 O 763/25.", "en": "The court's specialised civil chamber did not assess a training set in general terms; it took the six disputed compositions one at a time. On the court's finding those works are memorised in the model's parameters and can be retrieved as output: plain prompts carrying a song title, lyrics and a style produced results substantially similar to the originals. Tracks by Kristina Bach and Frank Farian are among them. The case number is 42 O 763/25.", "refs": ["suno-ruling"]}, {"tr": "Bu, kanıtı denetlenebilir bir yere koyuyor. Bir eserin modelden çıkıp çıkmadığı, komut ve çıktı ikilisiyle tekrarlanabilen bir sınama; eğitim setinin içeriğine ilişkin bir iddia ise davalının açıklamasına bağlı kalırdı. Mahkeme ezberlemenin gerçek olduğunu söylerken de bu sınamaya dayanıyor.", "en": "That places the evidence somewhere it can be inspected. Whether a work comes out of a model is a test anyone can repeat with a prompt and an output; a claim about what the training set contained would have depended on the defendant's own account. The court's statement that memorisation is real rests on that test.", "refs": ["suno-ruling"]}]}, {"h": {"tr": "Hangi hak, hangi istisna", "en": "Which right, which exception"}, "ps": [{"tr": "Mahkeme bu çoğaltmayı Alman telif kanununun 16. maddesindeki çoğaltma hakkının ihlali saydı ve metin ve veri madenciliği istisnasının kapsamı dışında tuttu. Kararda ayrıca Suno'nun YouTube'dan müzik çekmek için akış kopyalama yöntemleri kullandığı ve platformun teknik koruma önlemini aştığı belirtiliyor. Açık uçlu komutlarla üretilen çıktılarda içeriği belirleme sorumluluğu kullanıcıya değil Suno'ya bağlandı; Amerikan hukukundaki adil kullanım savunması eğitimi korumadı ve dava Bartz ile Kadrey kararlarından ayrıldı.", "en": "The court treated that reproduction as an infringement of the reproduction right under section 16 of German copyright law and placed it outside the text-and-data-mining exception. The ruling also states that Suno used stream-ripping techniques to take music from YouTube and circumvented the platform's technical protection measure. For outputs produced from open-ended prompts, responsibility for determining the content attached to Suno rather than the user; the US fair use defence did not protect the training, and the case was distinguished from the Bartz and Kadrey decisions.", "refs": ["suno-ruling"]}, {"tr": "Kararın çıktı sınamasına dayanması, kapsamı konusunda bir soru bırakıyor. Aynı altı eseri artık yeniden üretmeyen bir sürüm, kendiliğinden bu tespitin dışına çıkar mı? Mahkemenin men hükmünü eserlere göre mi yoksa sürümlere göre mi kurduğu, basın açıklamasından okunamıyor. İkinci ihtimalde sürüm değiştirmek bir çözüm sağlamaz.", "en": "Because the ruling rests on an output test, it leaves a question about its reach. Would a version that no longer reproduces those six works fall outside the finding by itself? Whether the court framed the injunction around the works or around the model versions cannot be read from the press release. On the second reading, changing versions solves nothing.", "refs": ["suno-ruling"]}]}, {"h": {"tr": "Eksik belge", "en": "The missing document"}, "ps": [{"tr": "Karar men, bilgi verme ve tazminat taleplerini büyük ölçüde kabul ediyor, ancak kesin değil ve istinafa açık. Bu aşamada tazminat tutarı, eserlerin adları ve men hükmünün lafzı elimizde yok. Bu boşluğu kapatacak belgeyi adlandırmak mümkün: gerekçeli kararın tam metni. Hüküm fıkrasının nasıl yazıldığı, kararın tek bir modele mi yoksa bir davranışa mı bağlandığını gösterecek.", "en": "The judgment largely grants the claims for an injunction, disclosure and damages, but it is not final and remains open to appeal. At this stage the damages figure, the titles of the works and the wording of the injunction are not available. The document that would close that gap can be named: the full written judgment. How its operative part is drafted will show whether the ruling is tied to one model or to a practice.", "refs": ["suno-ruling"]}]}], "sources": [{"key": "suno-ruling", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/german-court-rules-ai-music-generator-suno-violated-copyrights-rejects-fair-use-defense", "title": {"tr": "Münih mahkemesi GEMA'nın davasında Suno aleyhine karar verdi", "en": "A Munich court ruled against Suno in GEMA's case"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-03", "title": {"tr": "Aynı iş yükü, altmışta bir sürede", "en": "The same workload, in one-sixtieth of the time"}, "excerpt": {"tr": "OpenAI'nin alan raporunda bir iş 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor. Kazanç donanımdan değil kodun yeniden yazılmasından geliyor ve ölçümün sistem sınırı raporda yazılı değil.", "en": "In OpenAI's field report one job falls from 15 hours 34 minutes to 14 minutes 54 seconds. The gain comes from rewritten code rather than hardware, and the measurement's system boundary is not stated in the report."}, "sections": [{"h": {"tr": "Dört ölçüm, aynı payda", "en": "Four measurements on one denominator"}, "ps": [{"tr": "Raporun sekiz vakasından dördü sayı veriyor. RustQC'de çalışma süresi 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor; bu 62 katlık bir oran, rapor bunu yaklaşık 60 kat olarak veriyor. HelixForge grafik işlemci görevlerinde 59,6 kat, ana hesaplama adımında 98,6 kat hızlanıyor. HI.SIM'de süre yaklaşık yüzde 31, hifiasm'de yaklaşık yüzde 15 azalıyor. İki vakada kazanç iki basamaklı kat, iki vakada üçte bir ile yedide bir arasında. Bu dağılım geniş ve raporun yazarları çalışmanın temsili olmadığını kendileri söylüyor.", "en": "Four of the report's eight cases carry numbers. On RustQC the runtime falls from 15 hours 34 minutes to 14 minutes 54 seconds, a ratio of 62 which the report gives as roughly 60. HelixForge runs 59.6 times faster on GPU tasks and 98.6 times faster on its main compute step. HI.SIM's runtime falls by about 31 percent and hifiasm's by about 15 percent. In two cases the gain is a double-digit multiple, in two others it lies between a third and a seventh. The spread is wide, and the report's authors state themselves that the work is not representative.", "refs": ["agentic-science"]}, {"tr": "Bu oranların hepsi yazılım tarafında. Kod yeniden yazılıyor, bir kısmı grafik işlemcisine taşınıyor; yeni bir çip, yeni bir raf ya da yeni bir güç bağlantısı devreye girmiyor. Dolayısıyla ölçülen şey, aynı donanımda daha az saat harcayan bir yazılımdır ve bu, kurulu kapasiteyi değiştirmez.", "en": "All of these ratios sit on the software side. Code is rewritten and some of it is moved onto a graphics processor; no new chip, no new rack and no new grid connection enters the picture. What is measured, then, is software that spends fewer hours on the same hardware, and that does not change installed capacity.", "refs": ["agentic-science"]}]}, {"h": {"tr": "Yazılmayan sınır", "en": "The boundary that is not written down"}, "ps": [{"tr": "Bir hızlanma oranının karşılaştırılabilir olması için makinenin, hassasiyetin, iş parçacığı ya da grafik işlemci sayısının, doluluğun ve başlangıç kodunun ne kadar iyileştirilmiş olduğunun yazılması gerekir. Rapor bunları vermiyor; zaten kendini bir başarım ölçümü değil alan raporu olarak tanımlıyor. Aynı işin 62 kat hızlanması, ajanın gücü kadar başlangıç noktasının ne kadar geride olduğunu da ölçer. Başka bir okuma da mümkün: bu paketler zaten uzun süredir kullanılan bilimsel araçlar olduğu için başlangıç kodunun elde kalmış kolay kazanç barındırmaması beklenebilirdi.", "en": "For a speedup ratio to be comparable, the machine, the precision, the thread or GPU count, the utilisation and how well optimised the starting code was all have to be written down. The report gives none of these; it describes itself as a field report rather than a benchmark. A 62-fold gain on the same job measures how far back the starting point was as much as it measures the agent. Another reading is available: these are long-established scientific packages, so one might have expected little easy headroom in the starting code.", "refs": ["agentic-science"]}, {"tr": "Sayılar üreticinin kendi ölçümleri. Bu onları yanlış yapmaz, karşılaştırılabilir yapmaz. Bir okuyucunun elinde bugün, aynı iş yükünü bağımsız olarak aynı sınırlarla çalıştıran bir sonuç bulunmuyor.", "en": "The numbers are the vendor's own measurements. That does not make them wrong; it makes them incomparable. What a reader does not have today is an independent run of the same workload inside the same stated boundaries.", "refs": ["agentic-science"]}]}, {"h": {"tr": "Serbest kalan saatler", "en": "The hours that come free"}, "ps": [{"tr": "62 kat kısalan bir işin bıraktığı boşluk kendiliğinden tasarrufa dönüşmüyor. Aynı makine aynı süre boyunca çalışmaya devam ederse, kısalan iş yalnızca daha fazla koşuya yer açar; toplam tüketimin düşmesi, boşta kalan saatlerin doldurulmamasına bağlı. Bunu görünür kılacak ölçüm belli: aynı laboratuvarın yeniden yazımdan önceki ve sonraki toplam işlem saatini ya da elektrik tüketimini aynı dönem için bildirmesi. Böyle bir sayı yayımlanmadığı sürece bu raporun gösterdiği şey işin süresidir, altyapının yükü değil.", "en": "The gap left by a job that shrinks 62-fold does not turn into a saving on its own. If the same machine keeps running for the same hours, a shorter job only makes room for more runs; total consumption falls only where the freed hours go unfilled. The measurement that would settle it is clear: the same laboratory reporting its total compute hours, or its electricity use, before and after the rewrite for the same period. Until such a figure is published, what this report shows is the duration of a job, not the load on the infrastructure.", "refs": ["agentic-science"]}]}], "sources": [{"key": "agentic-science", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/ai-coding-agents-can-modernize-research-software-but-cant-judge-if-the-science-is-right", "title": {"tr": "OpenAI'nin alan raporu, kodlama ajanlarının bilimsel doğruluğu denetleyemediğini bildiriyor", "en": "OpenAI's field report says coding agents cannot check scientific correctness"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-04", "title": {"tr": "Kaliforniya'nın saptama aracı neyi bulabilir?", "en": "What can California's detection tool actually find?"}, "excerpt": {"tr": "2 Ağustos'tan itibaren büyük üreticilerin herkese açık ve ücretsiz bir saptama aracı sunması gerekiyor. Her araç yalnızca kendi sisteminin işaretini tanıyor; işaretin platformlarda silinmemesini isteyen kural ise 2027'de başlıyor.", "en": "From 2 August the large providers must offer a free, publicly available detection tool. Each tool recognises only its own system's mark, and the rule that stops platforms removing that mark starts in 2027."}, "sections": [{"h": {"tr": "Bugün elinizde ne var", "en": "What you have today"}, "ps": [{"tr": "Kural, Kaliforniya'da kamuya açık olan ve ayda bir milyondan fazla ziyaretçi ya da kullanıcıya ulaşan üretken yapay zekâ sistemlerini kapsıyor. Bu ölçeğin üzerindeki sağlayıcı üç şey yapmak zorunda: kişisel veri toplamadan çalışan, herkese açık ve ücretsiz bir saptama aracı sunmak; kullanıcıya ürettiği görüntü, video ya da sese görünür bir bildirim ekleme seçeneği vermek; ve aynı dosyaya sağlayıcının adını, sistem sürümünü, üretim zamanını ve tekil bir kimliği taşıyan gizli bir işaret gömmek. Görünür bildirim seçenek, gizli işaret ise zorunlu.", "en": "The rule covers generative AI systems that are publicly accessible in California and reach more than a million monthly visitors or users. A provider above that scale has to do three things: offer a free, publicly available detection tool that works without collecting personal data; give the user the option of adding a visible disclosure to an image, video or audio file the system produced; and embed in that same file a hidden mark carrying the provider's name, the system version, the time of creation and a unique identifier. The visible disclosure is an option; the hidden mark is mandatory.", "refs": ["ca-transparency"]}, {"tr": "Sokaktaki gözle bakınca fark şu: elinizdeki dosyayı bir yere yapıştırıp bunu bir yapay zekânın üretip üretmediğini sormak tek bir kapıdan geçmiyor. Gizli işaret yalnızca onu gömen sağlayıcının kendi aracıyla saptanabiliyor. Yani kaç büyük üretici varsa o kadar araç var ve hangisine bakacağınızı önceden bilmiyorsanız hepsini denemeniz gerekiyor.", "en": "Seen from the street, the difference is this: pasting a file somewhere and asking whether AI made it does not go through a single door. The hidden mark can be detected only through the tool of the provider that embedded it. There are as many tools as there are large providers, and unless you already know which one to ask, you have to try them all.", "refs": ["ca-transparency"]}]}, {"h": {"tr": "Sonuç boş çıkarsa", "en": "When the answer comes back empty"}, "ps": [{"tr": "Boş sonuç, dosyanın insan yapımı olduğunu göstermiyor. Kapsam dışı kalan küçük bir araçla üretilmiş olabilir, işaret dosya dönüştürülürken düşmüş olabilir ya da yanlış sağlayıcının aracına bakıyor olabilirsiniz. Yasa bu üç durumu birbirinden ayıracak bir yöntem getirmiyor. Getirdiği şey, kapsamdaki sağlayıcıların kendi ürettiklerini kabul etmesini sağlayan bir kanaldır.", "en": "An empty answer does not show that a file was made by a person. It may have come from a smaller tool outside the scope, the mark may have been lost when the file was converted, or you may be asking the wrong provider's tool. The law brings no method for telling those three apart. What it brings is a channel that makes covered providers own what they produced.", "refs": ["ca-transparency"]}, {"tr": "Bir de takvim var. Büyük çevrimiçi platformların işareti okuması, kullanıcıya göstermesi ve bilerek silmemesi 1 Ocak 2027'de başlıyor; model ağırlığı dağıtan barındırma platformları için de aynı tarih geçerli. Görüntü ve ses kaydeden cihaz üreticileri 1 Ocak 2028'de giriyor. Aradaki beş ay boyunca, bir dosyanın size ulaşana kadar işaretini koruduğunu bu yasaya dayanarak varsayamazsınız.", "en": "Then there is the calendar. Large online platforms start having to read the mark, surface it and not knowingly strip it on 1 January 2027, and hosting platforms that distribute model weights fall under the same date. Manufacturers of devices that capture images and audio enter on 1 January 2028. Through the five months in between, this law gives you no basis for assuming a file kept its mark on the way to you.", "refs": ["ca-transparency"]}]}, {"h": {"tr": "Beklenecek işaret", "en": "The signal worth waiting for"}, "ps": [{"tr": "Yasa ihlal başına günlük 5.000 dolar ceza öngörüyor ve sistemi lisanslayan üçüncü taraf bildirim özelliğini devre dışı bırakırsa lisansın 96 saat içinde iptal edilmesini istiyor. Bir okuyucu için asıl ölçüt araçların kendisi olacak: kapsamdaki sağlayıcıların saptama sayfalarının hangi dosya türlerini kabul ettiği, ne kadar süre sakladığı ve boş sonucu nasıl anlattığı. Bu sayfalar 2 Ekim 2026'ya kadar yayımlanmazsa, yükümlülüğün kullanıcıya ulaşan bir karşılığı olmadığı görülecek.", "en": "The law sets a penalty of $5,000 per violation per day and requires that a licence be revoked within 96 hours if a third party licensing the system disables the disclosure capability. For a reader the real measure will be the tools themselves: which file types the covered providers' detection pages accept, how long they keep an upload and how they word an empty answer. If those pages have not appeared by 2 October 2026, the duty will have reached the user in name only.", "refs": ["ca-transparency"]}]}], "sources": [{"key": "ca-transparency", "kind": "news", "name": "California Legislative Information", "url": "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB853", "title": {"tr": "Kaliforniya'nın yapay zekâ şeffaflık yasası 2 Ağustos'ta yürürlüğe girdi", "en": "California's AI transparency law came into force on 2 August"}, "publishedDate": "2025-10-13"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-05", "title": {"tr": "On sonucun ispatı Lean'de derleniyor", "en": "The proofs of ten results compile in Lean"}, "excerpt": {"tr": "Depo, on sonucun Lean 4 biçimselleştirmesini taşıyor ve herkes kendi makinesinde derleyebiliyor. Derlemenin güvence verdiği şey dar: biçimsel ifadenin mathlib aksiyomlarından çıkması.", "en": "The repository carries Lean 4 formalisations of ten results and anyone can build them on their own machine. What the build guarantees is narrow: that the formal statement follows from mathlib's axioms."}, "sections": [{"h": {"tr": "Derlemenin söylediği", "en": "What the build says"}, "ps": [{"tr": "Depoda on ayrı sonucun Lean 4 dosyaları bulunuyor: yüksek boyutlu küre paketlemesinde asimptotik sınırlar, ikili ve küresel kodlar için üstel olarak daha güçlü sınırlar, sofik olmayan bir grup kuruluşu, Connes'in katılık konjektürüne karşı örnek, kalıcı için aritmetik devre alt sınırları, kuantum paralel tekrar, en yakın vektör probleminin yaklaşıklama zorluğu, Ehrhart'ın hacim konjektürü, çok renkli Ramsey sayıları için bir alt sınır ve uç graf kuramında karşı örnekler. Dosyalar Lean 4.32.0, mathlib ve Lake ile derleniyor.", "en": "The repository holds Lean 4 files for ten separate results: asymptotic bounds in high-dimensional sphere packing, exponentially stronger bounds for binary and spherical codes, a construction of non-sofic groups, a counterexample to Connes's rigidity conjecture, arithmetic circuit lower bounds for the permanent, quantum parallel repetition, hardness of approximation for the closest vector problem, Ehrhart's volume conjecture, a lower bound for multicolour Ramsey numbers and counterexamples in extremal graph theory. The files build with Lean 4.32.0, mathlib and Lake.", "refs": ["ten-proofs"]}, {"tr": "Bu, yapay zekâ iddialarında sık görülmeyen bir şey. Bir başarım puanı, puanı üretenin kurduğu düzeneğe güvenmeyi gerektirir; buradaki iddia ise okuyucunun kendi makinesinde çalıştırabileceği bir kontrolle sınanabiliyor. Depo ayrıca biçimselleştirmelerin Comparator ile bağımsız olarak denetlenmesine ilişkin yönerge veriyor.", "en": "That is uncommon in AI claims. A benchmark score asks you to trust the harness built by whoever produced the score; the claim here can be tested with a check the reader runs on their own machine. The repository also gives instructions for having the formalisations checked independently with Comparator.", "refs": ["ten-proofs"]}]}, {"h": {"tr": "Derlemenin söylemediği", "en": "What the build does not say"}, "ps": [{"tr": "Bir Lean derlemesi tek bir şeyi doğrular: dosyadaki biçimsel ifadenin, mathlib'in tanımlarından ve aksiyomlarından çıktığını. Bir hakemin baktığı iki soru bunun dışında kalıyor. Birincisi, biçimsel ifadenin amaçlanan teorem olup olmadığı; tanımlar kaydırıldığında derlenen ama farklı bir şey söyleyen ifadeler yazmak mümkündür. İkincisi, sonucun yeni olup olmadığı. İkisi de matematikçi işi ve derleyici bu işi devralmıyor.", "en": "A Lean build establishes one thing: that the formal statement in the file follows from mathlib's definitions and axioms. Two questions a referee asks fall outside it. The first is whether the formal statement is the intended theorem; with the definitions shifted it is possible to write statements that compile and say something else. The second is whether the result is new. Both are work for mathematicians, and the compiler does not take them over.", "refs": ["ten-proofs"]}, {"tr": "Depodaki açıklama metni sonuçları üreten modelin adını vermiyor ve yazım aşamasındaki insan katkısına ilişkin bir ifade taşımıyor. Bu, ispatların değerini düşürmez; hangi payın modele ait olduğunu sorulamaz kılar. Bu bilgi olmadan, buradan bir sistemin yeteneğine dair bir sonuç çıkarmak yerine, on ispatın kendisini konuşmak daha doğru.", "en": "The README does not name the model that produced the results and carries no statement about human involvement in preparing the write-ups. That does not lower the value of the proofs; it makes the question of which share belongs to the model unanswerable. Without that information it is sounder to talk about the ten proofs themselves than to draw a conclusion about a system's ability.", "refs": ["ten-proofs"]}]}, {"h": {"tr": "Sıradaki kanıt", "en": "The next piece of evidence"}, "ps": [{"tr": "Bu dosyaların taşıdığı belirsizlik tek bir yerde toplanıyor: ifadelerin sadakati. Onu kapatacak şey de belli. Her sonucun alanında çalışan matematikçilerin, Lean ifadesinin klasik ifadeyle aynı şeyi söylediğini adlarıyla teyit etmesi. Ramsey sınırı ve uç graf kuramındaki karşı örnekler gibi bilinen konjektürlere bağlanan sonuçlarda bu teyit hızlı gelebilir. Mucize değil, metot: burada metot derleyicide değil, ifadenin yazımında duruyor.", "en": "The uncertainty these files carry collects in one place: the faithfulness of the statements. What would close it is equally clear. Mathematicians working in each area confirming under their own names that the Lean statement says what the classical statement says. Where a result attaches to a known conjecture, as with the Ramsey bound and the counterexamples in extremal graph theory, that confirmation may come quickly. Not a miracle, a method: and here the method sits in the writing of the statement rather than in the compiler.", "refs": ["ten-proofs"]}]}], "sources": [{"key": "ten-proofs", "kind": "news", "name": "OpenAI", "url": "https://github.com/openai/ten-proofs", "title": {"tr": "OpenAI, on matematik sonucu için Lean sertifikalarını yayımladı", "en": "OpenAI publishes Lean certificates for ten mathematics results"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-06", "title": {"tr": "Hızlanan kod, doğrulama işini kimin masasına bırakıyor?", "en": "Faster code leaves the validation work on whose desk?"}, "excerpt": {"tr": "Rapor sekiz vakada kazancı ölçüyor. Doğrulama ölçütlerini kimin belirlediğini yazıyor, bu işin ne kadar sürdüğünü yazmıyor. Kendinden emin ama yanlış çıktının bedeli makaleye imza atanda kalıyor.", "en": "The report measures the gain in eight cases. It says who set the validation criteria; it does not say how long that work took. The cost of a confident but wrong output stays with whoever signs the paper."}, "sections": [{"h": {"tr": "Kazanç gerçek", "en": "The gain is real"}, "ps": [{"tr": "Önce kazancı teslim edelim. RustQC'de çalışma süresi 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor ve kodu yazan ajan. Sekiz vakanın tamamında bilimsel yazılımın yeniden yazılması ve taşınması ajanların üstünde. Bu, bir bilim insanının haftalarını alan bir işin başka bir tarafa geçmesi demek.", "en": "Grant the gain first. On RustQC the runtime falls from 15 hours 34 minutes to 14 minutes 54 seconds, and it is the agent that wrote the code. Across all eight cases the rewriting and porting of scientific software sits with the agents. That means a job which takes a scientist weeks has moved to another party.", "refs": ["agentic-work"]}, {"tr": "Aynı raporda işin ikinci yarısı da adlandırılıyor: doğrulama ölçütlerini ve başarı tanımını insanlar belirliyor. Yani ajan bir iş bitirmiyor; işin yazma kısmını devralıp değerlendirme kısmını insana bırakıyor.", "en": "The same report names the second half of the job: humans define the validation criteria and the definition of success. The agent does not finish a task; it takes over the writing part and leaves the assessment part to a person.", "refs": ["agentic-work"]}]}, {"h": {"tr": "Ölçülmeyen taraf", "en": "The side that goes unmeasured"}, "ps": [{"tr": "Bu ikinci yarının ne kadar tuttuğuna dair bir sayı yok. Oysa raporun kendi anlattığı iki durum, işin küçük olmadığını gösteriyor. bayesm vakasında ters çevrilmiş parametreler ve hesap hataları ancak istatistiksel kalibrasyon sınamalarıyla görülebiliyor; ajanlar hatalı kodu kendinden emin biçimde sunuyor. rustar-aligner'ın çıktısı özgün araçla tek uçlu okumalarda yüzde 99,815, çift uçlu okumalarda yüzde 99,883 örtüşüyor; kalan farkın önemli olup olmadığına birinin karar vermesi gerekiyor.", "en": "There is no figure for what that second half costs. Yet two situations the report describes itself show that the work is not small. In the bayesm case inverted parameters and calculation errors become visible only through statistical calibration testing, and the agents present erroneous code with confidence. The output of rustar-aligner matches the original tool for 99.815 percent of single-end reads and 99.883 percent of paired-end reads, and someone has to decide whether the remaining difference matters.", "refs": ["agentic-work"]}, {"tr": "Bir tarafı saatle ölçüp diğer tarafı hiç ölçmemek, kazancın nereye yazıldığını da belirsiz bırakıyor. Sürenin kısalmasından yararlanan taraf laboratuvar, aracı sağlayan taraf şirket; kendinden emin ama yanlış bir çıktının bedelini ödeyecek olan ise makaleye imza atan araştırmacı. Buradan otomatik bir sonuç çıkmıyor; doğrulama yükü, yazma yükünün yanında küçük de kalabilir. Ama rapor bunu söylemiyor, çünkü ölçmüyor.", "en": "Measuring one side in hours and the other not at all also leaves it unclear where the gain is credited. The party that benefits from the shorter runtime is the laboratory, the party supplying the tool is the company, and the one who will pay for a confident wrong output is the researcher who signs the paper. No conclusion follows automatically from that; the validation burden may well be small next to the writing burden. But the report does not say so, because it does not measure it.", "refs": ["agentic-work"]}]}, {"h": {"tr": "Sorulabilir olan", "en": "What can be asked"}, "ps": [{"tr": "Bir sonraki alan raporundan istenebilecek şey somut bir sütundur: her vakada doğrulama ölçütlerini kurmak ve sınamaları yapmak için harcanan insan saati, çalışma süresi kazancının yanında. Yazarlar bu çalışmanın temsili olmadığını zaten belirtiyor; iki sayı yan yana durduğunda, hızlanmanın işi ortadan mı kaldırdığı yoksa yer mi değiştirdiği ilk kez sınanabilir hâle gelir.", "en": "What can be asked of the next field report is one concrete column: the human hours spent setting the validation criteria and running the tests in each case, placed beside the runtime gain. The authors already state that this work is not representative; once the two numbers stand side by side, it becomes possible to test for the first time whether the speedup removed the work or moved it.", "refs": ["agentic-work"]}]}], "sources": [{"key": "agentic-work", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/ai-coding-agents-can-modernize-research-software-but-cant-judge-if-the-science-is-right", "title": {"tr": "OpenAI'nin alan raporu, kodlama ajanlarının bilimsel doğruluğu denetleyemediğini bildiriyor", "en": "OpenAI's field report says coding agents cannot check scientific correctness"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-01", "title": {"tr": "Geometri çalışma zamanında hesaplanıyor", "en": "The geometry is computed at run time"}, "excerpt": {"tr": "Gösterimlerde sahne, varlık kütüphanesinden değil çalışma zamanında hesaplanan koddan geliyor; geliştirici için bu düzenlenebilir bir çıktı demek. Kazancın boyutu ise sabit tutulmuş bir düzenekle ölçülmedi.", "en": "In these demonstrations the scene arrives as code computed at run time rather than from an asset library, which gives a developer something editable. The size of the gain, though, was never measured with anything held fixed."}, "sections": [{"h": {"tr": "Yığında ne değişti", "en": "What changed in the stack"}, "ps": [{"tr": "Alışılmış üç boyutlu geliştirmede varlıklar kütüphanelerden derlenir, dokular görüntü dosyası olarak yüklenir ve fizik bir motora bırakılır. Son günlerde paylaşılan gösterimlerde bu sıra kayboluyor: geometri, noktaları ve yüzeyleri çalışma zamanında hesaplayan kodla kuruluyor; dokular gölgelendirici, yani yine kod olarak var oluyor; fizik ve denetimler de aynı üretimin parçası. Her şey tarayıcıda Three.js üzerinde çalıştığı için çıktı tek bir HTML dosyasına sığıyor.", "en": "In conventional 3D development, assets are assembled from libraries, textures are loaded as image files and physics is handed to an engine. In the demonstrations shared over the past few days that sequence disappears: geometry is built by code that computes points and surfaces at run time, textures exist as shaders and therefore as more code, and the physics and controls belong to the same generation. Because it all runs on Three.js in the browser, the output fits in a single HTML file.", "refs": ["opus5"]}, {"tr": "Bir geliştirici açısından bu farkın karşılığı somut. Varlık hattı yerine açılıp değiştirilebilen bir dosya çıkıyor; Matt Shumer nişancı oyununun kaynak kodunu ve istemini paylaşabildi. Bedelin nerede biriktiği de görünür hale geliyor: Pankaj Kumar'ın sonsuz yordamsal dünya, on beş biyom ve iki oyun kipi taşıyan Minecraft kopyası için 25 milyon belirteç harcandığını yazdı. Yani maliyet varlık lisansından ve motor kurulumundan üretim bütçesine kayıyor.", "en": "For a developer the difference has a concrete payoff. Instead of an asset pipeline there is a file that can be opened and changed; Matt Shumer was able to publish both the prompt and the source of his shooter. Where the cost accumulates also becomes visible: Pankaj Kumar wrote that his Minecraft clone, with an infinite procedural world, fifteen biomes and two game modes, consumed 25 million tokens. The expense moves from asset licences and engine setup to a generation budget.", "refs": ["opus5"]}]}, {"h": {"tr": "Karşılaştırmalar neyi sabit tutmadı", "en": "What the comparisons did not hold constant"}, "ps": [{"tr": "Modeller arası kıyaslamaların tamamı tek seferlik denemelere dayanıyor ve puanlamayı denemeyi yapan kişi veriyor. Chetaslua aynı istemi Opus 5, GPT-5.6 Sol ve Kimi K3 üzerinde çalıştırdı ve diğerlerinin çıktısında daha az çalışan parça gördüğünü söyledi; atomic.chat dört modele üç fizik sahnesi kurdurdu ve yalnızca birinin üçünü de inandırıcı işlediğini aktardı; ChrisGPT bir yıl arayla aynı türden isteği yineledi. Anthropic'in \"çok daha güçlü görsel çıktılar\" ifadesi ise satıcı beyanı. Hiçbirinde istem kümesi, tekrar sayısı ve puanlama ölçütü sabitlenmedi.", "en": "Every cross-model comparison here is a single run scored by the person who ran it. Chetaslua put the same prompt through Opus 5, GPT-5.6 Sol and Kimi K3 and said the others returned fewer working parts; atomic.chat had four models build three physics scenes and reported that only one handled all three convincingly; ChrisGPT repeated a similar request a year apart. Anthropic's line about \"much stronger visual outputs\" is a vendor statement. In none of these was the prompt set, the number of runs or the scoring criterion held fixed.", "refs": ["opus5"]}, {"tr": "Bu, gösterimleri değersiz kılmıyor; ne kadarının modelden, ne kadarının istem seçiminden ve tarayıcı hedefinden geldiğini ayıramaz hale getiriyor. Ayrımı yapacak düzenek karmaşık da değil: ortak bir istem kümesi, model başına birkaç tekrar, önceden yazılmış bir puanlama ölçütü ve başarısız denemelerin de bildirilmesi. Böyle bir karşılaştırma yayımlanana kadar elimizdeki, çalıştığı görülen tek tek dosyalar.", "en": "That does not make the demonstrations worthless; it makes it impossible to separate how much comes from the model and how much from the choice of prompt and the browser target. The setup that would separate them is not complicated: a shared prompt set, several runs per model, a scoring rubric written in advance and failed attempts reported alongside the successes. Until such a comparison is published, what we have is individual files that were seen to run.", "refs": ["opus5"]}]}], "sources": [{"key": "opus5", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/claude-opus-5-pushes-prompt-to-game-ai-from-rough-color-blocks-to-full-3d-prototypes-with-physics-and-music/", "title": {"tr": "Tek istemden üretilen üç boyutlu oyun sahneleri topluluk testlerinde karşılaştırıldı", "en": "Community tests compare 3D game scenes generated from a single prompt"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-02", "title": {"tr": "Çekilen görüntünün izlediği yol", "en": "The path the footage takes"}, "excerpt": {"tr": "Çerçevedeki küçük ışık, çekimin yapıldığı anı bildirmeye çalışıyor. Tartışmanın konusu ise o andan sonrası: görüntünün nereye gittiği, kimin baktığı ve ne kadar kaldığı.", "en": "The small light in the frame tries to signal the moment of capture. The argument is about what happens after that moment: where the footage goes, who looks at it and how long it stays."}, "sections": [{"h": {"tr": "Yakalama anındaki bildirim", "en": "Notice at the moment of capture"}, "ps": [{"tr": "Meta geçen yıl Ray-Ban ve Oakley iş birlikleriyle dünya genelinde 7 milyon çiftin üzerinde gözlük sattı. Cihaz küçük kameralar, mikrofonlar ve bir asistan taşıyor; çevreyi tarif edebiliyor, ses ve video çekebiliyor. Kamera çalışırken çerçevede küçük bir ışık yanıp sönüyor, ancak mercek neredeyse fark edilmiyor. Utrecht'teki TivoliVredenburg salonu ile bazı yolcu gemileri cihazı kendi mekânlarında yasakladı.", "en": "Meta sold 7 million pairs and more worldwide last year through its Ray-Ban and Oakley partnerships. The device carries small cameras, microphones and an assistant; it can describe surroundings and capture audio and video. A small light blinks in the frame while the camera is active, but the lens is nearly undetectable. The TivoliVredenburg venue in Utrecht and several cruise ships have banned it on their own premises.", "refs": ["glasses"]}, {"tr": "Bu ışık yalnızca tek bir soruyu yanıtlıyor: şu anda çekim var mı. Mahremiyet avukatı Charlotte Meindersma NOS'a, kullanıcı görüntüyü Instagram ya da Facebook'ta paylaşmasa bile çekilen her şeyin Meta'ya ulaştığını söyledi. Bits of Freedom'dan Evelyn Austin ise İsveçli gazetecilerin, görüntülerin bir bölümünün Meta'nın Kenya'daki içerik denetim tesislerinden birine iletildiğini bulduğunu aktardı; Austin'e göre tesise ulaşanlar arasında cinsel ilişki, tuvalet ve banka kartı görüntüleri vardı. Meta, görüntüleri inceleyen Kenyalı şirketle ortaklığını sonlandırdığını bildirdi.", "en": "That light answers exactly one question: is something being filmed right now. Privacy lawyer Charlotte Meindersma told NOS that everything captured reaches Meta even when the user never shares it on Instagram or Facebook. Evelyn Austin of Bits of Freedom said Swedish journalists found that part of the footage was forwarded to one of Meta's content-moderation facilities in Kenya, and that what arrived there included people having sex, people on the toilet and bank cards. Meta said it has ended the partnership with the Kenyan firm that reviewed the material.", "refs": ["glasses"]}]}, {"h": {"tr": "Hangi belge boşluğu kapatır", "en": "Which document would close the gap"}, "ps": [{"tr": "Elimizdeki tablo bu noktada eşit ağırlıkta değil. Bir yanda doğrulanmış işlemler var: Autoriteit Persoonsgegevens'e rızası olmadan çekilip görüntüsü yayımlanan üç kişiden başvuru geldi; Birleşik Krallık düzenleyicisi Meta çalışanlarının gözlüklerle çekilmiş hassas içeriği görüntüleyebildiğini öğrendikten sonra soruşturma açtı; Avrupa Veri Koruma Kurulu'nun yaz sonuna kadar bir inceleme başlatması bekleniyor. Öte yanda ABD'de açılan davalar iddia aşamasında ve şirketin yerleşik mahremiyet güvencesi sözünü tutmadığı savını sınayacak bir karar henüz yok.", "en": "The picture is not evenly weighted at this point. On one side sit confirmed procedures: the Autoriteit Persoonsgegevens has logged complaints from three people filmed without consent whose images were later published; Britain's regulator opened an investigation after learning that Meta employees could view sensitive content recorded with the glasses; the European Data Protection Board is expected to open an inquiry by the end of the summer. On the other, the suits filed in the United States are at the allegation stage, and no ruling yet tests the claim that the company broke its promise of built-in privacy safeguards.", "refs": ["glasses"]}, {"tr": "Bits of Freedom yasak istiyor. Yasak bir çare önerisi; hangi verinin ne kadar saklandığı sorusunu yanıtlamak içinse başka bir belge gerekiyor. Bu boşluğu kapatacak şeyler adlandırılabilir durumda: saklama süresi, insan incelemesine hangi ölçütle içerik yönlendirildiği, o incelemeyi hangi ülkedeki hangi şirketin yaptığı ve çevredeki kişinin silme talebini nereye ileteceği. Avrupa Veri Koruma Kurulu incelemesinin kapsamını yayımlaması, bunlardan hangilerinin gerçekten sorulduğunu gösterecek ilk somut adım olur.", "en": "Bits of Freedom wants a ban. A ban is a proposed remedy; answering which data is kept and for how long requires a different document. What would close that gap can be named: a retention period, the criterion by which content is routed to human review, which company in which country performs that review, and where a bystander sends a deletion request. Publication of the scope of the European Data Protection Board's inquiry would be the first concrete indication of which of these is actually being asked.", "refs": ["glasses"]}]}], "sources": [{"key": "glasses", "kind": "news", "name": "NL Times", "url": "https://nltimes.nl/2026/08/02/meta-ai-glasses-raise-dutch-privacy-alarm-hidden-cameras-film-without-consent", "title": {"tr": "Hollandalı dijital haklar örgütü Meta'nın yapay zekâ gözlükleri için yasak istiyor", "en": "A Dutch digital rights group wants Meta's AI glasses banned"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-03", "title": {"tr": "Bir istemin bellekte bıraktığı 320 gigabayt", "en": "The 320 gigabytes one request leaves in memory"}, "excerpt": {"tr": "Çıkarımda darboğaz hızlandırıcının pahalı belleğinden bir alt katmana kayıyor. Kioxia'nın yeni sürücüsü o katmanın adayı, ancak elimizdeki bütün rakamlar satıcının kendi ölçümü ve sürücünün fiyatı yok.", "en": "In inference the bottleneck is sliding from the accelerator's expensive memory to the tier beneath it. Kioxia's new drive is a candidate for that tier, but every number we have is the vendor's own and the drive has no price."}, "sections": [{"h": {"tr": "Aritmetik nereye işaret ediyor", "en": "Where the arithmetic points"}, "ps": [{"tr": "Rakamları aynı paydaya getirelim. 70 milyar parametreli bir model, bir milyon belirteçlik bağlamda tek bir kullanıcı için yaklaşık 320 gigabayt anahtar-değer önbelleği üretiyor. Bu, bir NVIDIA H100'ün toplam yüksek bant genişlikli bellek kapasitesinin dört katı. Veri bir yere gitmek zorunda ve en yakın aday NVMe sürücü. PCIe 5 hızında tipik bir kurumsal sürücü yaklaşık 14 GB/s veriyor; altıncı nesilde standart dört şeritli bir sürücüde tavan 28 GB/s'ye çıkıyor.", "en": "Put the figures on one denominator. A model with 70 billion parameters running a one-million-token context window generates roughly 320 gigabytes of key-value cache for a single user. That is four times the entire high-bandwidth memory capacity of an NVIDIA H100. The data has to go somewhere, and the nearest candidate is an NVMe drive. At PCIe Gen 5 speeds a typical enterprise drive supplies about 14 GB/s; at the sixth generation the ceiling for a standard four-lane drive rises to 28 GB/s.", "refs": ["fms"]}, {"tr": "Kioxia'nın 30 Temmuz'da duyurduğu CM10 bu katmana oturuyor: 332 katmanlı BiCS FLASH onuncu nesil TLC bellek ve hava soğutmanın yanında doğrudan soğuk plaka sıvı soğutma. E3.S ve 9,5 milimetre E1.S biçimleri, ısının fanla değil soğuk plakayla alındığı yoğun hızlandırıcı raflarını hedefliyor. Hangi basamakta durduğunu da söylemek gerek: sürücüler seçili müşterilere örnekleniyor, fiyat ve çıkış tarihi açıklanmadı, ilk kamuya açık gösterim salı günü.", "en": "The CM10, which Kioxia announced on 30 July, sits in that tier: 332-layer BiCS FLASH generation ten TLC memory, and direct cold-plate liquid cooling alongside conventional air cooling. The E3.S and 9.5 millimetre E1.S form factors target dense accelerator racks where cold plates rather than fans remove the heat. It is worth naming where this sits on the ladder: the drives are sampling to select customers, price and availability have not been disclosed, and the first public demonstration is on Tuesday.", "refs": ["fms"]}]}, {"h": {"tr": "Rakamların paydası", "en": "The denominator behind the numbers"}, "ps": [{"tr": "Başarım rakamları Kioxia'nın kendi ölçümü ve karşılaştırma kendi önceki nesline karşı yapılmış: CM9'a kıyasla sıralı okumada yaklaşık yüzde 92, rastgele okumada yaklaşık yüzde 85 artış; tepe sıralı okuma 28,4 GB/s, rastgele okuma 6,29 milyon IOPS. Arabirim nesli tek başına ayırt edici değil; Micron'un 9650'si şubat 2026'da, Samsung'un PM1763'ü 8 Temmuz'da seri üretime geçmişti. Üç satıcı da altıncı nesilde olduğuna göre fark, bellek yoğunluğu ve ısı yönetimi tarafında aranacak.", "en": "The performance figures are Kioxia's own measurements against its own previous generation: roughly 92 percent higher sequential read and roughly 85 percent higher random read than the CM9, with peak sequential read at 28.4 GB/s and random read at 6.29 million IOPS. The interface generation is not what separates the field; Micron's 9650 reached mass production in February 2026 and Samsung's PM1763 on 8 July. With all three vendors on the sixth generation, the difference will be found in memory density and thermal handling.", "refs": ["fms"]}, {"tr": "Bant genişliğinin bir de bedeli var. Altıncı nesil, ikili işaretlemeden PAM-4 dört seviyeli kodlamaya geçerek şerit başına 64 GT/s'ye çıkıyor ve PCIe tarihinde ilk kez ileri hata düzeltme ekliyor; bu her yönde yaklaşık 4 ile 8 nanosaniye gecikme demek. Model ağırlığı yüklerken ya da eğitim verisi hazırlarken bu ihmal edilebilir. İlk belirtece kadar geçen sürenin ölçüldüğü çıkarım hatlarında ise ayrı hesaplanması gereken bir gider. Bu katmanın gerçekten işe yaradığını gösterecek olan, aynı iş yükünde yapılmış bağımsız bir ölçüm.", "en": "Bandwidth also has a cost. The sixth generation moves from binary signalling to PAM-4 four-level encoding to reach 64 GT/s per lane and adds forward error correction for the first time in PCIe's history, which means roughly 4 to 8 nanoseconds of latency per direction. Loading model weights or staging training data, that is negligible. In inference pipelines where time to first token is measured, it is an expense to be counted separately. What would show that this tier genuinely helps is an independent measurement on a common workload.", "refs": ["fms"]}]}], "sources": [{"key": "fms", "kind": "news", "name": "Tech Times", "url": "https://www.techtimes.com/articles/322686/20260802/fms-2026-opens-tuesday-liquid-cooled-pcie-60-ssds-debate-ai-memory-tiers.htm", "title": {"tr": "Sıvı soğutmalı kurumsal SSD, yapay zekâ bellek katmanı tartışmasının merkezine yerleşti", "en": "A liquid-cooled enterprise SSD moves to the centre of the AI memory-tier debate"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-04", "title": {"tr": "Görsel başına yarım sent, abonelik için 14,99 dolar", "en": "Half a cent per image, $14.99 for the subscription"}, "excerpt": {"tr": "Pippa'nın çizere ödeme yaptığı taraf kuruşuna kadar yazılı. Abonenin ekranında ne göreceği ise henüz aynı netlikte değil.", "en": "The side of Pippa where the illustrator gets paid is written down to the cent. What a subscriber will see on screen is not yet described with the same precision."}, "sections": [{"h": {"tr": "Ödeme tarafı sayılarla yazılı", "en": "The payment side is written in numbers"}, "ps": [{"tr": "Sokaktaki gözle bakınca ilk fark şu: bu hizmette ödemenin nasıl işlediği tahmine bırakılmamış. Bir abone, bir çizerin üslubundan türeyen görsel ya da video ürettiğinde çizer görsel başına 0,005 dolar, video için saniyede 0,003 dolar alıyor. Buna abonelik gelirinden beslenen yüzde 5'lik bir telif havuzundan pay ekleniyor. Abonelikler aylık 14,99 dolar ile 99,99 dolar arasında. Şirketin şu anda yaklaşık 800 ücretli abonesi ve dört çizerle imzalanmış anlaşması var; dört çizerle daha görüşüldüğü söyleniyor.", "en": "Seen from the street, the first thing that stands out is that nothing about how the payment works is left to guesswork. When a subscriber generates an image or a clip whose style derives from an illustrator's work, that illustrator receives $0.005 per image and $0.003 per second of video, plus a share of a 5 percent royalty pool funded by subscription revenue. Subscriptions run from $14.99 to $99.99 a month. The company currently has about 800 paying subscribers and signed agreements with four illustrators, with four more said to be in talks.", "refs": ["pippa"]}, {"tr": "Çizer tarafındaki süreç de tarif edilmiş. Katılmak isteyenler, gönderdikleri çizimlerin kendilerine ait olduğunu doğrulayan çok aşamalı bir incelemeden geçiyor; onaylananların eserleriyle eğitilen modeller abonelere açılıyor ve çizere kendi işine yönlendiren bir profil sayfası veriliyor. Kurucu ortak Sean Wright, topluluğu tarafından dışlanmaktan çekinen çizerlere takma adla katılma seçeneği sunduklarını söylüyor. Bu ayrıntı, ürünün satış konuşmasından çok kimin katılmakta tereddüt ettiğini anlatıyor.", "en": "The process on the illustrator's side is described too. Those who want to take part go through a multi-step review confirming that the drawings they submit are their own; models trained on approved artists' work become available to subscribers, and each artist gets a profile page pointing to their work elsewhere. Cofounder Sean Wright says illustrators worried about being ostracised by their community can join under a pseudonym. That detail says less about the pitch than about who is hesitating to sign up.", "refs": ["pippa"]}]}, {"h": {"tr": "Ekranda ne çıktığı henüz açık değil", "en": "What comes out on screen is not yet clear"}, "ps": [{"tr": "İşin abonenin gördüğü tarafında tablo daha zayıf. The Verge'ün por
