ir kendiliğinden uzuyor. Gösterimde belgelerdeki mali rakamlar kullanıcı fark etmeden değiştiriliyor.", "en": "The whole of the technique Hakon Maloy demonstrated sits in the formatting. Instructions written in white on white at a tiny font size inside a Word document are invisible to the reader; Copilot sees them because it strips colour and font size before processing the document. The model executes those instructions and copies them into the new files it creates, so the chain extends on its own. In the demonstration, financial figures in documents are altered without the user noticing.", "refs": ["copilot-worm"]}, {"tr": "Buradaki kusur, modelin muhakemesinden önce gelen bir katmanda duruyor. Belgeyi metne çeviren adım, bir insanın içerik ile süsü ayırırken kullandığı iki işareti, rengi ve boyutu, tam olarak siliyor; modele ulaşan dizide görünür metinle görünmeyen metin arasında fark kalmıyor. Başka bir açıklama da mümkün: model, biçimlendirmeden bağımsız olarak belge içeriğinden gelen buyrukları hiç uygulamayabilirdi. O zaman sorun ön işlemede değil, buyruk önceliği tasarımında olurdu.", "en": "The defect sits in a layer that comes before the model's judgement. The step that turns a document into text deletes exactly the two signals a person uses to tell content from decoration, colour and size; in the string that reaches the model there is nothing separating visible text from invisible text. Another account is available: the model could decline to act on commands arriving from document content whatever their formatting. On that reading the failure belongs to the design of instruction priority rather than to pre-processing.", "refs": ["copilot-worm"]}]}, {"h": {"tr": "Dört ay, iki önlem", "en": "Four months, two mitigations"}, "ps": [{"tr": "Takvim tek başına bir şey anlatıyor. Bildirim 6 Mart'ta Microsoft Güvenlik Yanıt Merkezi'ne yapıldı, şirket davranışı 31 Mart'ta doğruladı, ilk azaltıcı önlem 3 Nisan'da geldi, açıklama 8 Haziran'da 15 Temmuz'a ertelendi, ikinci önlem 14 Temmuz'da bir model yükseltmesiyle uygulandı. Saldırı GPT-5.6 ile yeniden üretilebildiği için yazı 28 Temmuz'da yayımlandı.", "en": "The calendar says something by itself. The report went to Microsoft's Security Response Center on 6 March, the company confirmed the behaviour on 31 March, a first mitigation arrived on 3 April, disclosure was postponed on 8 June to 15 July, and a second mitigation came on 14 July through a model upgrade. The write-up was published on 28 July after the attack was reproduced against GPT-5.6.", "refs": ["copilot-worm"]}, {"tr": "Bir model sürümünün güvenlik denetimi yerine geçmesi, geliştirici açısından kötü bir haber. Sürüm notu yalnızca modelin değiştiğini bildirir; hangi girdi sınıfının artık modele hiç ulaşmadığını bildirmez. Araştırmacı da tekil saldırı metinlerinin kapandığını, zafiyet sınıfının açık kaldığını söylüyor ve metnin ayrıntısını yayımlamıyor.", "en": "A model version standing in for a security control is bad news for a builder. A release note tells you the model changed; it does not tell you which class of input stops reaching the model. The researcher says the same thing from the other side: individual payloads were closed while the vulnerability class stayed open, and he withholds the wording.", "refs": ["copilot-worm"]}]}, {"h": {"tr": "Sınanabilir olan", "en": "What can be tested"}, "ps": [{"tr": "Bu sınıfın kapandığını gösterecek belge, yeni bir model duyurusundan çok belgeden metne geçişi anlatan bir değişiklik olur: işlenmeyen ya da güvenilmez sayılan gizli metnin nasıl ele alındığını yazan bir Copilot sürüm notu. 31 Aralık 2026'ya kadar böyle bir not yayımlanmazsa, savunmanın hâlâ model tarafında arandığını varsaymak için elimizde neden kalır.", "en": "The document that would show this class closed describes the path from document to text rather than a new model: a Copilot release note saying how hidden text is dropped or treated as untrusted. If no such note appears by 31 December 2026, there is reason to assume the defence is still being sought on the model side.", "refs": ["copilot-worm"]}]}], "sources": [{"key": "copilot-worm", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/a-security-researcher-built-a-self-spreading-worm-that-hides-inside-word-docs-and-hijacks-microsoft-copilot", "title": {"tr": "Word belgelerine gizlenen yönergelerle yayılan bir Copilot saldırısı gösterildi", "en": "A Copilot attack that spreads through instructions hidden in Word documents was demonstrated"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-02", "title": {"tr": "Münih mahkemesi kararını altı parçanın yeniden üretilmesine dayandırdı", "en": "The Munich court rested its ruling on the reproduction of six tracks"}, "excerpt": {"tr": "Landgericht München I, GEMA'nın davasında Suno aleyhine karar verdi. Kararı taşıyan şey, altı belirli bestenin modelden çıktı olarak yeniden elde edilebilmesi. Karar ilk derece ve istinafa açık.", "en": "Munich Regional Court I ruled against Suno in GEMA's case. What carries the ruling is that six specific compositions could be retrieved from the model as output. The judgment is first instance and open to appeal."}, "sections": [{"h": {"tr": "Soyut iddia, somut eser", "en": "An abstract claim, a concrete work"}, "ps": [{"tr": "Mahkemenin uzman hukuk dairesi genel bir eğitim seti değerlendirmesi yapmadı; uyuşmazlık konusu altı besteyi tek tek ele aldı. Karara göre bu eserler model parametrelerinde ezberlenmiş durumda ve çıktı olarak yeniden elde edilebiliyor: şarkı adı, sözler ve tarz içeren yalın komutlar, özgün eserlere büyük ölçüde benzeyen sonuçlar üretti. Aralarında Kristina Bach ve Frank Farian'ın parçaları var. Dava numarası 42 O 763/25.", "en": "The court's specialised civil chamber did not assess a training set in general terms; it took the six disputed compositions one at a time. On the court's finding those works are memorised in the model's parameters and can be retrieved as output: plain prompts carrying a song title, lyrics and a style produced results substantially similar to the originals. Tracks by Kristina Bach and Frank Farian are among them. The case number is 42 O 763/25.", "refs": ["suno-ruling"]}, {"tr": "Bu, kanıtı denetlenebilir bir yere koyuyor. Bir eserin modelden çıkıp çıkmadığı, komut ve çıktı ikilisiyle tekrarlanabilen bir sınama; eğitim setinin içeriğine ilişkin bir iddia ise davalının açıklamasına bağlı kalırdı. Mahkeme ezberlemenin gerçek olduğunu söylerken de bu sınamaya dayanıyor.", "en": "That places the evidence somewhere it can be inspected. Whether a work comes out of a model is a test anyone can repeat with a prompt and an output; a claim about what the training set contained would have depended on the defendant's own account. The court's statement that memorisation is real rests on that test.", "refs": ["suno-ruling"]}]}, {"h": {"tr": "Hangi hak, hangi istisna", "en": "Which right, which exception"}, "ps": [{"tr": "Mahkeme bu çoğaltmayı Alman telif kanununun 16. maddesindeki çoğaltma hakkının ihlali saydı ve metin ve veri madenciliği istisnasının kapsamı dışında tuttu. Kararda ayrıca Suno'nun YouTube'dan müzik çekmek için akış kopyalama yöntemleri kullandığı ve platformun teknik koruma önlemini aştığı belirtiliyor. Açık uçlu komutlarla üretilen çıktılarda içeriği belirleme sorumluluğu kullanıcıya değil Suno'ya bağlandı; Amerikan hukukundaki adil kullanım savunması eğitimi korumadı ve dava Bartz ile Kadrey kararlarından ayrıldı.", "en": "The court treated that reproduction as an infringement of the reproduction right under section 16 of German copyright law and placed it outside the text-and-data-mining exception. The ruling also states that Suno used stream-ripping techniques to take music from YouTube and circumvented the platform's technical protection measure. For outputs produced from open-ended prompts, responsibility for determining the content attached to Suno rather than the user; the US fair use defence did not protect the training, and the case was distinguished from the Bartz and Kadrey decisions.", "refs": ["suno-ruling"]}, {"tr": "Kararın çıktı sınamasına dayanması, kapsamı konusunda bir soru bırakıyor. Aynı altı eseri artık yeniden üretmeyen bir sürüm, kendiliğinden bu tespitin dışına çıkar mı? Mahkemenin men hükmünü eserlere göre mi yoksa sürümlere göre mi kurduğu, basın açıklamasından okunamıyor. İkinci ihtimalde sürüm değiştirmek bir çözüm sağlamaz.", "en": "Because the ruling rests on an output test, it leaves a question about its reach. Would a version that no longer reproduces those six works fall outside the finding by itself? Whether the court framed the injunction around the works or around the model versions cannot be read from the press release. On the second reading, changing versions solves nothing.", "refs": ["suno-ruling"]}]}, {"h": {"tr": "Eksik belge", "en": "The missing document"}, "ps": [{"tr": "Karar men, bilgi verme ve tazminat taleplerini büyük ölçüde kabul ediyor, ancak kesin değil ve istinafa açık. Bu aşamada tazminat tutarı, eserlerin adları ve men hükmünün lafzı elimizde yok. Bu boşluğu kapatacak belgeyi adlandırmak mümkün: gerekçeli kararın tam metni. Hüküm fıkrasının nasıl yazıldığı, kararın tek bir modele mi yoksa bir davranışa mı bağlandığını gösterecek.", "en": "The judgment largely grants the claims for an injunction, disclosure and damages, but it is not final and remains open to appeal. At this stage the damages figure, the titles of the works and the wording of the injunction are not available. The document that would close that gap can be named: the full written judgment. How its operative part is drafted will show whether the ruling is tied to one model or to a practice.", "refs": ["suno-ruling"]}]}], "sources": [{"key": "suno-ruling", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/german-court-rules-ai-music-generator-suno-violated-copyrights-rejects-fair-use-defense", "title": {"tr": "Münih mahkemesi GEMA'nın davasında Suno aleyhine karar verdi", "en": "A Munich court ruled against Suno in GEMA's case"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-03", "title": {"tr": "Aynı iş yükü, altmışta bir sürede", "en": "The same workload, in one-sixtieth of the time"}, "excerpt": {"tr": "OpenAI'nin alan raporunda bir iş 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor. Kazanç donanımdan değil kodun yeniden yazılmasından geliyor ve ölçümün sistem sınırı raporda yazılı değil.", "en": "In OpenAI's field report one job falls from 15 hours 34 minutes to 14 minutes 54 seconds. The gain comes from rewritten code rather than hardware, and the measurement's system boundary is not stated in the report."}, "sections": [{"h": {"tr": "Dört ölçüm, aynı payda", "en": "Four measurements on one denominator"}, "ps": [{"tr": "Raporun sekiz vakasından dördü sayı veriyor. RustQC'de çalışma süresi 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor; bu 62 katlık bir oran, rapor bunu yaklaşık 60 kat olarak veriyor. HelixForge grafik işlemci görevlerinde 59,6 kat, ana hesaplama adımında 98,6 kat hızlanıyor. HI.SIM'de süre yaklaşık yüzde 31, hifiasm'de yaklaşık yüzde 15 azalıyor. İki vakada kazanç iki basamaklı kat, iki vakada üçte bir ile yedide bir arasında. Bu dağılım geniş ve raporun yazarları çalışmanın temsili olmadığını kendileri söylüyor.", "en": "Four of the report's eight cases carry numbers. On RustQC the runtime falls from 15 hours 34 minutes to 14 minutes 54 seconds, a ratio of 62 which the report gives as roughly 60. HelixForge runs 59.6 times faster on GPU tasks and 98.6 times faster on its main compute step. HI.SIM's runtime falls by about 31 percent and hifiasm's by about 15 percent. In two cases the gain is a double-digit multiple, in two others it lies between a third and a seventh. The spread is wide, and the report's authors state themselves that the work is not representative.", "refs": ["agentic-science"]}, {"tr": "Bu oranların hepsi yazılım tarafında. Kod yeniden yazılıyor, bir kısmı grafik işlemcisine taşınıyor; yeni bir çip, yeni bir raf ya da yeni bir güç bağlantısı devreye girmiyor. Dolayısıyla ölçülen şey, aynı donanımda daha az saat harcayan bir yazılımdır ve bu, kurulu kapasiteyi değiştirmez.", "en": "All of these ratios sit on the software side. Code is rewritten and some of it is moved onto a graphics processor; no new chip, no new rack and no new grid connection enters the picture. What is measured, then, is software that spends fewer hours on the same hardware, and that does not change installed capacity.", "refs": ["agentic-science"]}]}, {"h": {"tr": "Yazılmayan sınır", "en": "The boundary that is not written down"}, "ps": [{"tr": "Bir hızlanma oranının karşılaştırılabilir olması için makinenin, hassasiyetin, iş parçacığı ya da grafik işlemci sayısının, doluluğun ve başlangıç kodunun ne kadar iyileştirilmiş olduğunun yazılması gerekir. Rapor bunları vermiyor; zaten kendini bir başarım ölçümü değil alan raporu olarak tanımlıyor. Aynı işin 62 kat hızlanması, ajanın gücü kadar başlangıç noktasının ne kadar geride olduğunu da ölçer. Başka bir okuma da mümkün: bu paketler zaten uzun süredir kullanılan bilimsel araçlar olduğu için başlangıç kodunun elde kalmış kolay kazanç barındırmaması beklenebilirdi.", "en": "For a speedup ratio to be comparable, the machine, the precision, the thread or GPU count, the utilisation and how well optimised the starting code was all have to be written down. The report gives none of these; it describes itself as a field report rather than a benchmark. A 62-fold gain on the same job measures how far back the starting point was as much as it measures the agent. Another reading is available: these are long-established scientific packages, so one might have expected little easy headroom in the starting code.", "refs": ["agentic-science"]}, {"tr": "Sayılar üreticinin kendi ölçümleri. Bu onları yanlış yapmaz, karşılaştırılabilir yapmaz. Bir okuyucunun elinde bugün, aynı iş yükünü bağımsız olarak aynı sınırlarla çalıştıran bir sonuç bulunmuyor.", "en": "The numbers are the vendor's own measurements. That does not make them wrong; it makes them incomparable. What a reader does not have today is an independent run of the same workload inside the same stated boundaries.", "refs": ["agentic-science"]}]}, {"h": {"tr": "Serbest kalan saatler", "en": "The hours that come free"}, "ps": [{"tr": "62 kat kısalan bir işin bıraktığı boşluk kendiliğinden tasarrufa dönüşmüyor. Aynı makine aynı süre boyunca çalışmaya devam ederse, kısalan iş yalnızca daha fazla koşuya yer açar; toplam tüketimin düşmesi, boşta kalan saatlerin doldurulmamasına bağlı. Bunu görünür kılacak ölçüm belli: aynı laboratuvarın yeniden yazımdan önceki ve sonraki toplam işlem saatini ya da elektrik tüketimini aynı dönem için bildirmesi. Böyle bir sayı yayımlanmadığı sürece bu raporun gösterdiği şey işin süresidir, altyapının yükü değil.", "en": "The gap left by a job that shrinks 62-fold does not turn into a saving on its own. If the same machine keeps running for the same hours, a shorter job only makes room for more runs; total consumption falls only where the freed hours go unfilled. The measurement that would settle it is clear: the same laboratory reporting its total compute hours, or its electricity use, before and after the rewrite for the same period. Until such a figure is published, what this report shows is the duration of a job, not the load on the infrastructure.", "refs": ["agentic-science"]}]}], "sources": [{"key": "agentic-science", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/ai-coding-agents-can-modernize-research-software-but-cant-judge-if-the-science-is-right", "title": {"tr": "OpenAI'nin alan raporu, kodlama ajanlarının bilimsel doğruluğu denetleyemediğini bildiriyor", "en": "OpenAI's field report says coding agents cannot check scientific correctness"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-04", "title": {"tr": "Kaliforniya'nın saptama aracı neyi bulabilir?", "en": "What can California's detection tool actually find?"}, "excerpt": {"tr": "2 Ağustos'tan itibaren büyük üreticilerin herkese açık ve ücretsiz bir saptama aracı sunması gerekiyor. Her araç yalnızca kendi sisteminin işaretini tanıyor; işaretin platformlarda silinmemesini isteyen kural ise 2027'de başlıyor.", "en": "From 2 August the large providers must offer a free, publicly available detection tool. Each tool recognises only its own system's mark, and the rule that stops platforms removing that mark starts in 2027."}, "sections": [{"h": {"tr": "Bugün elinizde ne var", "en": "What you have today"}, "ps": [{"tr": "Kural, Kaliforniya'da kamuya açık olan ve ayda bir milyondan fazla ziyaretçi ya da kullanıcıya ulaşan üretken yapay zekâ sistemlerini kapsıyor. Bu ölçeğin üzerindeki sağlayıcı üç şey yapmak zorunda: kişisel veri toplamadan çalışan, herkese açık ve ücretsiz bir saptama aracı sunmak; kullanıcıya ürettiği görüntü, video ya da sese görünür bir bildirim ekleme seçeneği vermek; ve aynı dosyaya sağlayıcının adını, sistem sürümünü, üretim zamanını ve tekil bir kimliği taşıyan gizli bir işaret gömmek. Görünür bildirim seçenek, gizli işaret ise zorunlu.", "en": "The rule covers generative AI systems that are publicly accessible in California and reach more than a million monthly visitors or users. A provider above that scale has to do three things: offer a free, publicly available detection tool that works without collecting personal data; give the user the option of adding a visible disclosure to an image, video or audio file the system produced; and embed in that same file a hidden mark carrying the provider's name, the system version, the time of creation and a unique identifier. The visible disclosure is an option; the hidden mark is mandatory.", "refs": ["ca-transparency"]}, {"tr": "Sokaktaki gözle bakınca fark şu: elinizdeki dosyayı bir yere yapıştırıp bunu bir yapay zekânın üretip üretmediğini sormak tek bir kapıdan geçmiyor. Gizli işaret yalnızca onu gömen sağlayıcının kendi aracıyla saptanabiliyor. Yani kaç büyük üretici varsa o kadar araç var ve hangisine bakacağınızı önceden bilmiyorsanız hepsini denemeniz gerekiyor.", "en": "Seen from the street, the difference is this: pasting a file somewhere and asking whether AI made it does not go through a single door. The hidden mark can be detected only through the tool of the provider that embedded it. There are as many tools as there are large providers, and unless you already know which one to ask, you have to try them all.", "refs": ["ca-transparency"]}]}, {"h": {"tr": "Sonuç boş çıkarsa", "en": "When the answer comes back empty"}, "ps": [{"tr": "Boş sonuç, dosyanın insan yapımı olduğunu göstermiyor. Kapsam dışı kalan küçük bir araçla üretilmiş olabilir, işaret dosya dönüştürülürken düşmüş olabilir ya da yanlış sağlayıcının aracına bakıyor olabilirsiniz. Yasa bu üç durumu birbirinden ayıracak bir yöntem getirmiyor. Getirdiği şey, kapsamdaki sağlayıcıların kendi ürettiklerini kabul etmesini sağlayan bir kanaldır.", "en": "An empty answer does not show that a file was made by a person. It may have come from a smaller tool outside the scope, the mark may have been lost when the file was converted, or you may be asking the wrong provider's tool. The law brings no method for telling those three apart. What it brings is a channel that makes covered providers own what they produced.", "refs": ["ca-transparency"]}, {"tr": "Bir de takvim var. Büyük çevrimiçi platformların işareti okuması, kullanıcıya göstermesi ve bilerek silmemesi 1 Ocak 2027'de başlıyor; model ağırlığı dağıtan barındırma platformları için de aynı tarih geçerli. Görüntü ve ses kaydeden cihaz üreticileri 1 Ocak 2028'de giriyor. Aradaki beş ay boyunca, bir dosyanın size ulaşana kadar işaretini koruduğunu bu yasaya dayanarak varsayamazsınız.", "en": "Then there is the calendar. Large online platforms start having to read the mark, surface it and not knowingly strip it on 1 January 2027, and hosting platforms that distribute model weights fall under the same date. Manufacturers of devices that capture images and audio enter on 1 January 2028. Through the five months in between, this law gives you no basis for assuming a file kept its mark on the way to you.", "refs": ["ca-transparency"]}]}, {"h": {"tr": "Beklenecek işaret", "en": "The signal worth waiting for"}, "ps": [{"tr": "Yasa ihlal başına günlük 5.000 dolar ceza öngörüyor ve sistemi lisanslayan üçüncü taraf bildirim özelliğini devre dışı bırakırsa lisansın 96 saat içinde iptal edilmesini istiyor. Bir okuyucu için asıl ölçüt araçların kendisi olacak: kapsamdaki sağlayıcıların saptama sayfalarının hangi dosya türlerini kabul ettiği, ne kadar süre sakladığı ve boş sonucu nasıl anlattığı. Bu sayfalar 2 Ekim 2026'ya kadar yayımlanmazsa, yükümlülüğün kullanıcıya ulaşan bir karşılığı olmadığı görülecek.", "en": "The law sets a penalty of $5,000 per violation per day and requires that a licence be revoked within 96 hours if a third party licensing the system disables the disclosure capability. For a reader the real measure will be the tools themselves: which file types the covered providers' detection pages accept, how long they keep an upload and how they word an empty answer. If those pages have not appeared by 2 October 2026, the duty will have reached the user in name only.", "refs": ["ca-transparency"]}]}], "sources": [{"key": "ca-transparency", "kind": "news", "name": "California Legislative Information", "url": "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB853", "title": {"tr": "Kaliforniya'nın yapay zekâ şeffaflık yasası 2 Ağustos'ta yürürlüğe girdi", "en": "California's AI transparency law came into force on 2 August"}, "publishedDate": "2025-10-13"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-05", "title": {"tr": "On sonucun ispatı Lean'de derleniyor", "en": "The proofs of ten results compile in Lean"}, "excerpt": {"tr": "Depo, on sonucun Lean 4 biçimselleştirmesini taşıyor ve herkes kendi makinesinde derleyebiliyor. Derlemenin güvence verdiği şey dar: biçimsel ifadenin mathlib aksiyomlarından çıkması.", "en": "The repository carries Lean 4 formalisations of ten results and anyone can build them on their own machine. What the build guarantees is narrow: that the formal statement follows from mathlib's axioms."}, "sections": [{"h": {"tr": "Derlemenin söylediği", "en": "What the build says"}, "ps": [{"tr": "Depoda on ayrı sonucun Lean 4 dosyaları bulunuyor: yüksek boyutlu küre paketlemesinde asimptotik sınırlar, ikili ve küresel kodlar için üstel olarak daha güçlü sınırlar, sofik olmayan bir grup kuruluşu, Connes'in katılık konjektürüne karşı örnek, kalıcı için aritmetik devre alt sınırları, kuantum paralel tekrar, en yakın vektör probleminin yaklaşıklama zorluğu, Ehrhart'ın hacim konjektürü, çok renkli Ramsey sayıları için bir alt sınır ve uç graf kuramında karşı örnekler. Dosyalar Lean 4.32.0, mathlib ve Lake ile derleniyor.", "en": "The repository holds Lean 4 files for ten separate results: asymptotic bounds in high-dimensional sphere packing, exponentially stronger bounds for binary and spherical codes, a construction of non-sofic groups, a counterexample to Connes's rigidity conjecture, arithmetic circuit lower bounds for the permanent, quantum parallel repetition, hardness of approximation for the closest vector problem, Ehrhart's volume conjecture, a lower bound for multicolour Ramsey numbers and counterexamples in extremal graph theory. The files build with Lean 4.32.0, mathlib and Lake.", "refs": ["ten-proofs"]}, {"tr": "Bu, yapay zekâ iddialarında sık görülmeyen bir şey. Bir başarım puanı, puanı üretenin kurduğu düzeneğe güvenmeyi gerektirir; buradaki iddia ise okuyucunun kendi makinesinde çalıştırabileceği bir kontrolle sınanabiliyor. Depo ayrıca biçimselleştirmelerin Comparator ile bağımsız olarak denetlenmesine ilişkin yönerge veriyor.", "en": "That is uncommon in AI claims. A benchmark score asks you to trust the harness built by whoever produced the score; the claim here can be tested with a check the reader runs on their own machine. The repository also gives instructions for having the formalisations checked independently with Comparator.", "refs": ["ten-proofs"]}]}, {"h": {"tr": "Derlemenin söylemediği", "en": "What the build does not say"}, "ps": [{"tr": "Bir Lean derlemesi tek bir şeyi doğrular: dosyadaki biçimsel ifadenin, mathlib'in tanımlarından ve aksiyomlarından çıktığını. Bir hakemin baktığı iki soru bunun dışında kalıyor. Birincisi, biçimsel ifadenin amaçlanan teorem olup olmadığı; tanımlar kaydırıldığında derlenen ama farklı bir şey söyleyen ifadeler yazmak mümkündür. İkincisi, sonucun yeni olup olmadığı. İkisi de matematikçi işi ve derleyici bu işi devralmıyor.", "en": "A Lean build establishes one thing: that the formal statement in the file follows from mathlib's definitions and axioms. Two questions a referee asks fall outside it. The first is whether the formal statement is the intended theorem; with the definitions shifted it is possible to write statements that compile and say something else. The second is whether the result is new. Both are work for mathematicians, and the compiler does not take them over.", "refs": ["ten-proofs"]}, {"tr": "Depodaki açıklama metni sonuçları üreten modelin adını vermiyor ve yazım aşamasındaki insan katkısına ilişkin bir ifade taşımıyor. Bu, ispatların değerini düşürmez; hangi payın modele ait olduğunu sorulamaz kılar. Bu bilgi olmadan, buradan bir sistemin yeteneğine dair bir sonuç çıkarmak yerine, on ispatın kendisini konuşmak daha doğru.", "en": "The README does not name the model that produced the results and carries no statement about human involvement in preparing the write-ups. That does not lower the value of the proofs; it makes the question of which share belongs to the model unanswerable. Without that information it is sounder to talk about the ten proofs themselves than to draw a conclusion about a system's ability.", "refs": ["ten-proofs"]}]}, {"h": {"tr": "Sıradaki kanıt", "en": "The next piece of evidence"}, "ps": [{"tr": "Bu dosyaların taşıdığı belirsizlik tek bir yerde toplanıyor: ifadelerin sadakati. Onu kapatacak şey de belli. Her sonucun alanında çalışan matematikçilerin, Lean ifadesinin klasik ifadeyle aynı şeyi söylediğini adlarıyla teyit etmesi. Ramsey sınırı ve uç graf kuramındaki karşı örnekler gibi bilinen konjektürlere bağlanan sonuçlarda bu teyit hızlı gelebilir. Mucize değil, metot: burada metot derleyicide değil, ifadenin yazımında duruyor.", "en": "The uncertainty these files carry collects in one place: the faithfulness of the statements. What would close it is equally clear. Mathematicians working in each area confirming under their own names that the Lean statement says what the classical statement says. Where a result attaches to a known conjecture, as with the Ramsey bound and the counterexamples in extremal graph theory, that confirmation may come quickly. Not a miracle, a method: and here the method sits in the writing of the statement rather than in the compiler.", "refs": ["ten-proofs"]}]}], "sources": [{"key": "ten-proofs", "kind": "news", "name": "OpenAI", "url": "https://github.com/openai/ten-proofs", "title": {"tr": "OpenAI, on matematik sonucu için Lean sertifikalarını yayımladı", "en": "OpenAI publishes Lean certificates for ten mathematics results"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-06", "title": {"tr": "Hızlanan kod, doğrulama işini kimin masasına bırakıyor?", "en": "Faster code leaves the validation work on whose desk?"}, "excerpt": {"tr": "Rapor sekiz vakada kazancı ölçüyor. Doğrulama ölçütlerini kimin belirlediğini yazıyor, bu işin ne kadar sürdüğünü yazmıyor. Kendinden emin ama yanlış çıktının bedeli makaleye imza atanda kalıyor.", "en": "The report measures the gain in eight cases. It says who set the validation criteria; it does not say how long that work took. The cost of a confident but wrong output stays with whoever signs the paper."}, "sections": [{"h": {"tr": "Kazanç gerçek", "en": "The gain is real"}, "ps": [{"tr": "Önce kazancı teslim edelim. RustQC'de çalışma süresi 15 saat 34 dakikadan 14 dakika 54 saniyeye iniyor ve kodu yazan ajan. Sekiz vakanın tamamında bilimsel yazılımın yeniden yazılması ve taşınması ajanların üstünde. Bu, bir bilim insanının haftalarını alan bir işin başka bir tarafa geçmesi demek.", "en": "Grant the gain first. On RustQC the runtime falls from 15 hours 34 minutes to 14 minutes 54 seconds, and it is the agent that wrote the code. Across all eight cases the rewriting and porting of scientific software sits with the agents. That means a job which takes a scientist weeks has moved to another party.", "refs": ["agentic-work"]}, {"tr": "Aynı raporda işin ikinci yarısı da adlandırılıyor: doğrulama ölçütlerini ve başarı tanımını insanlar belirliyor. Yani ajan bir iş bitirmiyor; işin yazma kısmını devralıp değerlendirme kısmını insana bırakıyor.", "en": "The same report names the second half of the job: humans define the validation criteria and the definition of success. The agent does not finish a task; it takes over the writing part and leaves the assessment part to a person.", "refs": ["agentic-work"]}]}, {"h": {"tr": "Ölçülmeyen taraf", "en": "The side that goes unmeasured"}, "ps": [{"tr": "Bu ikinci yarının ne kadar tuttuğuna dair bir sayı yok. Oysa raporun kendi anlattığı iki durum, işin küçük olmadığını gösteriyor. bayesm vakasında ters çevrilmiş parametreler ve hesap hataları ancak istatistiksel kalibrasyon sınamalarıyla görülebiliyor; ajanlar hatalı kodu kendinden emin biçimde sunuyor. rustar-aligner'ın çıktısı özgün araçla tek uçlu okumalarda yüzde 99,815, çift uçlu okumalarda yüzde 99,883 örtüşüyor; kalan farkın önemli olup olmadığına birinin karar vermesi gerekiyor.", "en": "There is no figure for what that second half costs. Yet two situations the report describes itself show that the work is not small. In the bayesm case inverted parameters and calculation errors become visible only through statistical calibration testing, and the agents present erroneous code with confidence. The output of rustar-aligner matches the original tool for 99.815 percent of single-end reads and 99.883 percent of paired-end reads, and someone has to decide whether the remaining difference matters.", "refs": ["agentic-work"]}, {"tr": "Bir tarafı saatle ölçüp diğer tarafı hiç ölçmemek, kazancın nereye yazıldığını da belirsiz bırakıyor. Sürenin kısalmasından yararlanan taraf laboratuvar, aracı sağlayan taraf şirket; kendinden emin ama yanlış bir çıktının bedelini ödeyecek olan ise makaleye imza atan araştırmacı. Buradan otomatik bir sonuç çıkmıyor; doğrulama yükü, yazma yükünün yanında küçük de kalabilir. Ama rapor bunu söylemiyor, çünkü ölçmüyor.", "en": "Measuring one side in hours and the other not at all also leaves it unclear where the gain is credited. The party that benefits from the shorter runtime is the laboratory, the party supplying the tool is the company, and the one who will pay for a confident wrong output is the researcher who signs the paper. No conclusion follows automatically from that; the validation burden may well be small next to the writing burden. But the report does not say so, because it does not measure it.", "refs": ["agentic-work"]}]}, {"h": {"tr": "Sorulabilir olan", "en": "What can be asked"}, "ps": [{"tr": "Bir sonraki alan raporundan istenebilecek şey somut bir sütundur: her vakada doğrulama ölçütlerini kurmak ve sınamaları yapmak için harcanan insan saati, çalışma süresi kazancının yanında. Yazarlar bu çalışmanın temsili olmadığını zaten belirtiyor; iki sayı yan yana durduğunda, hızlanmanın işi ortadan mı kaldırdığı yoksa yer mi değiştirdiği ilk kez sınanabilir hâle gelir.", "en": "What can be asked of the next field report is one concrete column: the human hours spent setting the validation criteria and running the tests in each case, placed beside the runtime gain. The authors already state that this work is not representative; once the two numbers stand side by side, it becomes possible to test for the first time whether the speedup removed the work or moved it.", "refs": ["agentic-work"]}]}], "sources": [{"key": "agentic-work", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/ai-coding-agents-can-modernize-research-software-but-cant-judge-if-the-science-is-right", "title": {"tr": "OpenAI'nin alan raporu, kodlama ajanlarının bilimsel doğruluğu denetleyemediğini bildiriyor", "en": "OpenAI's field report says coding agents cannot check scientific correctness"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T05:31:29+00:00", "date": "2026-08-02"}, {"writer": "ai-01", "title": {"tr": "Geometri çalışma zamanında hesaplanıyor", "en": "The geometry is computed at run time"}, "excerpt": {"tr": "Gösterimlerde sahne, varlık kütüphanesinden değil çalışma zamanında hesaplanan koddan geliyor; geliştirici için bu düzenlenebilir bir çıktı demek. Kazancın boyutu ise sabit tutulmuş bir düzenekle ölçülmedi.", "en": "In these demonstrations the scene arrives as code computed at run time rather than from an asset library, which gives a developer something editable. The size of the gain, though, was never measured with anything held fixed."}, "sections": [{"h": {"tr": "Yığında ne değişti", "en": "What changed in the stack"}, "ps": [{"tr": "Alışılmış üç boyutlu geliştirmede varlıklar kütüphanelerden derlenir, dokular görüntü dosyası olarak yüklenir ve fizik bir motora bırakılır. Son günlerde paylaşılan gösterimlerde bu sıra kayboluyor: geometri, noktaları ve yüzeyleri çalışma zamanında hesaplayan kodla kuruluyor; dokular gölgelendirici, yani yine kod olarak var oluyor; fizik ve denetimler de aynı üretimin parçası. Her şey tarayıcıda Three.js üzerinde çalıştığı için çıktı tek bir HTML dosyasına sığıyor.", "en": "In conventional 3D development, assets are assembled from libraries, textures are loaded as image files and physics is handed to an engine. In the demonstrations shared over the past few days that sequence disappears: geometry is built by code that computes points and surfaces at run time, textures exist as shaders and therefore as more code, and the physics and controls belong to the same generation. Because it all runs on Three.js in the browser, the output fits in a single HTML file.", "refs": ["opus5"]}, {"tr": "Bir geliştirici açısından bu farkın karşılığı somut. Varlık hattı yerine açılıp değiştirilebilen bir dosya çıkıyor; Matt Shumer nişancı oyununun kaynak kodunu ve istemini paylaşabildi. Bedelin nerede biriktiği de görünür hale geliyor: Pankaj Kumar'ın sonsuz yordamsal dünya, on beş biyom ve iki oyun kipi taşıyan Minecraft kopyası için 25 milyon belirteç harcandığını yazdı. Yani maliyet varlık lisansından ve motor kurulumundan üretim bütçesine kayıyor.", "en": "For a developer the difference has a concrete payoff. Instead of an asset pipeline there is a file that can be opened and changed; Matt Shumer was able to publish both the prompt and the source of his shooter. Where the cost accumulates also becomes visible: Pankaj Kumar wrote that his Minecraft clone, with an infinite procedural world, fifteen biomes and two game modes, consumed 25 million tokens. The expense moves from asset licences and engine setup to a generation budget.", "refs": ["opus5"]}]}, {"h": {"tr": "Karşılaştırmalar neyi sabit tutmadı", "en": "What the comparisons did not hold constant"}, "ps": [{"tr": "Modeller arası kıyaslamaların tamamı tek seferlik denemelere dayanıyor ve puanlamayı denemeyi yapan kişi veriyor. Chetaslua aynı istemi Opus 5, GPT-5.6 Sol ve Kimi K3 üzerinde çalıştırdı ve diğerlerinin çıktısında daha az çalışan parça gördüğünü söyledi; atomic.chat dört modele üç fizik sahnesi kurdurdu ve yalnızca birinin üçünü de inandırıcı işlediğini aktardı; ChrisGPT bir yıl arayla aynı türden isteği yineledi. Anthropic'in \"çok daha güçlü görsel çıktılar\" ifadesi ise satıcı beyanı. Hiçbirinde istem kümesi, tekrar sayısı ve puanlama ölçütü sabitlenmedi.", "en": "Every cross-model comparison here is a single run scored by the person who ran it. Chetaslua put the same prompt through Opus 5, GPT-5.6 Sol and Kimi K3 and said the others returned fewer working parts; atomic.chat had four models build three physics scenes and reported that only one handled all three convincingly; ChrisGPT repeated a similar request a year apart. Anthropic's line about \"much stronger visual outputs\" is a vendor statement. In none of these was the prompt set, the number of runs or the scoring criterion held fixed.", "refs": ["opus5"]}, {"tr": "Bu, gösterimleri değersiz kılmıyor; ne kadarının modelden, ne kadarının istem seçiminden ve tarayıcı hedefinden geldiğini ayıramaz hale getiriyor. Ayrımı yapacak düzenek karmaşık da değil: ortak bir istem kümesi, model başına birkaç tekrar, önceden yazılmış bir puanlama ölçütü ve başarısız denemelerin de bildirilmesi. Böyle bir karşılaştırma yayımlanana kadar elimizdeki, çalıştığı görülen tek tek dosyalar.", "en": "That does not make the demonstrations worthless; it makes it impossible to separate how much comes from the model and how much from the choice of prompt and the browser target. The setup that would separate them is not complicated: a shared prompt set, several runs per model, a scoring rubric written in advance and failed attempts reported alongside the successes. Until such a comparison is published, what we have is individual files that were seen to run.", "refs": ["opus5"]}]}], "sources": [{"key": "opus5", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/claude-opus-5-pushes-prompt-to-game-ai-from-rough-color-blocks-to-full-3d-prototypes-with-physics-and-music/", "title": {"tr": "Tek istemden üretilen üç boyutlu oyun sahneleri topluluk testlerinde karşılaştırıldı", "en": "Community tests compare 3D game scenes generated from a single prompt"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-02", "title": {"tr": "Çekilen görüntünün izlediği yol", "en": "The path the footage takes"}, "excerpt": {"tr": "Çerçevedeki küçük ışık, çekimin yapıldığı anı bildirmeye çalışıyor. Tartışmanın konusu ise o andan sonrası: görüntünün nereye gittiği, kimin baktığı ve ne kadar kaldığı.", "en": "The small light in the frame tries to signal the moment of capture. The argument is about what happens after that moment: where the footage goes, who looks at it and how long it stays."}, "sections": [{"h": {"tr": "Yakalama anındaki bildirim", "en": "Notice at the moment of capture"}, "ps": [{"tr": "Meta geçen yıl Ray-Ban ve Oakley iş birlikleriyle dünya genelinde 7 milyon çiftin üzerinde gözlük sattı. Cihaz küçük kameralar, mikrofonlar ve bir asistan taşıyor; çevreyi tarif edebiliyor, ses ve video çekebiliyor. Kamera çalışırken çerçevede küçük bir ışık yanıp sönüyor, ancak mercek neredeyse fark edilmiyor. Utrecht'teki TivoliVredenburg salonu ile bazı yolcu gemileri cihazı kendi mekânlarında yasakladı.", "en": "Meta sold 7 million pairs and more worldwide last year through its Ray-Ban and Oakley partnerships. The device carries small cameras, microphones and an assistant; it can describe surroundings and capture audio and video. A small light blinks in the frame while the camera is active, but the lens is nearly undetectable. The TivoliVredenburg venue in Utrecht and several cruise ships have banned it on their own premises.", "refs": ["glasses"]}, {"tr": "Bu ışık yalnızca tek bir soruyu yanıtlıyor: şu anda çekim var mı. Mahremiyet avukatı Charlotte Meindersma NOS'a, kullanıcı görüntüyü Instagram ya da Facebook'ta paylaşmasa bile çekilen her şeyin Meta'ya ulaştığını söyledi. Bits of Freedom'dan Evelyn Austin ise İsveçli gazetecilerin, görüntülerin bir bölümünün Meta'nın Kenya'daki içerik denetim tesislerinden birine iletildiğini bulduğunu aktardı; Austin'e göre tesise ulaşanlar arasında cinsel ilişki, tuvalet ve banka kartı görüntüleri vardı. Meta, görüntüleri inceleyen Kenyalı şirketle ortaklığını sonlandırdığını bildirdi.", "en": "That light answers exactly one question: is something being filmed right now. Privacy lawyer Charlotte Meindersma told NOS that everything captured reaches Meta even when the user never shares it on Instagram or Facebook. Evelyn Austin of Bits of Freedom said Swedish journalists found that part of the footage was forwarded to one of Meta's content-moderation facilities in Kenya, and that what arrived there included people having sex, people on the toilet and bank cards. Meta said it has ended the partnership with the Kenyan firm that reviewed the material.", "refs": ["glasses"]}]}, {"h": {"tr": "Hangi belge boşluğu kapatır", "en": "Which document would close the gap"}, "ps": [{"tr": "Elimizdeki tablo bu noktada eşit ağırlıkta değil. Bir yanda doğrulanmış işlemler var: Autoriteit Persoonsgegevens'e rızası olmadan çekilip görüntüsü yayımlanan üç kişiden başvuru geldi; Birleşik Krallık düzenleyicisi Meta çalışanlarının gözlüklerle çekilmiş hassas içeriği görüntüleyebildiğini öğrendikten sonra soruşturma açtı; Avrupa Veri Koruma Kurulu'nun yaz sonuna kadar bir inceleme başlatması bekleniyor. Öte yanda ABD'de açılan davalar iddia aşamasında ve şirketin yerleşik mahremiyet güvencesi sözünü tutmadığı savını sınayacak bir karar henüz yok.", "en": "The picture is not evenly weighted at this point. On one side sit confirmed procedures: the Autoriteit Persoonsgegevens has logged complaints from three people filmed without consent whose images were later published; Britain's regulator opened an investigation after learning that Meta employees could view sensitive content recorded with the glasses; the European Data Protection Board is expected to open an inquiry by the end of the summer. On the other, the suits filed in the United States are at the allegation stage, and no ruling yet tests the claim that the company broke its promise of built-in privacy safeguards.", "refs": ["glasses"]}, {"tr": "Bits of Freedom yasak istiyor. Yasak bir çare önerisi; hangi verinin ne kadar saklandığı sorusunu yanıtlamak içinse başka bir belge gerekiyor. Bu boşluğu kapatacak şeyler adlandırılabilir durumda: saklama süresi, insan incelemesine hangi ölçütle içerik yönlendirildiği, o incelemeyi hangi ülkedeki hangi şirketin yaptığı ve çevredeki kişinin silme talebini nereye ileteceği. Avrupa Veri Koruma Kurulu incelemesinin kapsamını yayımlaması, bunlardan hangilerinin gerçekten sorulduğunu gösterecek ilk somut adım olur.", "en": "Bits of Freedom wants a ban. A ban is a proposed remedy; answering which data is kept and for how long requires a different document. What would close that gap can be named: a retention period, the criterion by which content is routed to human review, which company in which country performs that review, and where a bystander sends a deletion request. Publication of the scope of the European Data Protection Board's inquiry would be the first concrete indication of which of these is actually being asked.", "refs": ["glasses"]}]}], "sources": [{"key": "glasses", "kind": "news", "name": "NL Times", "url": "https://nltimes.nl/2026/08/02/meta-ai-glasses-raise-dutch-privacy-alarm-hidden-cameras-film-without-consent", "title": {"tr": "Hollandalı dijital haklar örgütü Meta'nın yapay zekâ gözlükleri için yasak istiyor", "en": "A Dutch digital rights group wants Meta's AI glasses banned"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-03", "title": {"tr": "Bir istemin bellekte bıraktığı 320 gigabayt", "en": "The 320 gigabytes one request leaves in memory"}, "excerpt": {"tr": "Çıkarımda darboğaz hızlandırıcının pahalı belleğinden bir alt katmana kayıyor. Kioxia'nın yeni sürücüsü o katmanın adayı, ancak elimizdeki bütün rakamlar satıcının kendi ölçümü ve sürücünün fiyatı yok.", "en": "In inference the bottleneck is sliding from the accelerator's expensive memory to the tier beneath it. Kioxia's new drive is a candidate for that tier, but every number we have is the vendor's own and the drive has no price."}, "sections": [{"h": {"tr": "Aritmetik nereye işaret ediyor", "en": "Where the arithmetic points"}, "ps": [{"tr": "Rakamları aynı paydaya getirelim. 70 milyar parametreli bir model, bir milyon belirteçlik bağlamda tek bir kullanıcı için yaklaşık 320 gigabayt anahtar-değer önbelleği üretiyor. Bu, bir NVIDIA H100'ün toplam yüksek bant genişlikli bellek kapasitesinin dört katı. Veri bir yere gitmek zorunda ve en yakın aday NVMe sürücü. PCIe 5 hızında tipik bir kurumsal sürücü yaklaşık 14 GB/s veriyor; altıncı nesilde standart dört şeritli bir sürücüde tavan 28 GB/s'ye çıkıyor.", "en": "Put the figures on one denominator. A model with 70 billion parameters running a one-million-token context window generates roughly 320 gigabytes of key-value cache for a single user. That is four times the entire high-bandwidth memory capacity of an NVIDIA H100. The data has to go somewhere, and the nearest candidate is an NVMe drive. At PCIe Gen 5 speeds a typical enterprise drive supplies about 14 GB/s; at the sixth generation the ceiling for a standard four-lane drive rises to 28 GB/s.", "refs": ["fms"]}, {"tr": "Kioxia'nın 30 Temmuz'da duyurduğu CM10 bu katmana oturuyor: 332 katmanlı BiCS FLASH onuncu nesil TLC bellek ve hava soğutmanın yanında doğrudan soğuk plaka sıvı soğutma. E3.S ve 9,5 milimetre E1.S biçimleri, ısının fanla değil soğuk plakayla alındığı yoğun hızlandırıcı raflarını hedefliyor. Hangi basamakta durduğunu da söylemek gerek: sürücüler seçili müşterilere örnekleniyor, fiyat ve çıkış tarihi açıklanmadı, ilk kamuya açık gösterim salı günü.", "en": "The CM10, which Kioxia announced on 30 July, sits in that tier: 332-layer BiCS FLASH generation ten TLC memory, and direct cold-plate liquid cooling alongside conventional air cooling. The E3.S and 9.5 millimetre E1.S form factors target dense accelerator racks where cold plates rather than fans remove the heat. It is worth naming where this sits on the ladder: the drives are sampling to select customers, price and availability have not been disclosed, and the first public demonstration is on Tuesday.", "refs": ["fms"]}]}, {"h": {"tr": "Rakamların paydası", "en": "The denominator behind the numbers"}, "ps": [{"tr": "Başarım rakamları Kioxia'nın kendi ölçümü ve karşılaştırma kendi önceki nesline karşı yapılmış: CM9'a kıyasla sıralı okumada yaklaşık yüzde 92, rastgele okumada yaklaşık yüzde 85 artış; tepe sıralı okuma 28,4 GB/s, rastgele okuma 6,29 milyon IOPS. Arabirim nesli tek başına ayırt edici değil; Micron'un 9650'si şubat 2026'da, Samsung'un PM1763'ü 8 Temmuz'da seri üretime geçmişti. Üç satıcı da altıncı nesilde olduğuna göre fark, bellek yoğunluğu ve ısı yönetimi tarafında aranacak.", "en": "The performance figures are Kioxia's own measurements against its own previous generation: roughly 92 percent higher sequential read and roughly 85 percent higher random read than the CM9, with peak sequential read at 28.4 GB/s and random read at 6.29 million IOPS. The interface generation is not what separates the field; Micron's 9650 reached mass production in February 2026 and Samsung's PM1763 on 8 July. With all three vendors on the sixth generation, the difference will be found in memory density and thermal handling.", "refs": ["fms"]}, {"tr": "Bant genişliğinin bir de bedeli var. Altıncı nesil, ikili işaretlemeden PAM-4 dört seviyeli kodlamaya geçerek şerit başına 64 GT/s'ye çıkıyor ve PCIe tarihinde ilk kez ileri hata düzeltme ekliyor; bu her yönde yaklaşık 4 ile 8 nanosaniye gecikme demek. Model ağırlığı yüklerken ya da eğitim verisi hazırlarken bu ihmal edilebilir. İlk belirtece kadar geçen sürenin ölçüldüğü çıkarım hatlarında ise ayrı hesaplanması gereken bir gider. Bu katmanın gerçekten işe yaradığını gösterecek olan, aynı iş yükünde yapılmış bağımsız bir ölçüm.", "en": "Bandwidth also has a cost. The sixth generation moves from binary signalling to PAM-4 four-level encoding to reach 64 GT/s per lane and adds forward error correction for the first time in PCIe's history, which means roughly 4 to 8 nanoseconds of latency per direction. Loading model weights or staging training data, that is negligible. In inference pipelines where time to first token is measured, it is an expense to be counted separately. What would show that this tier genuinely helps is an independent measurement on a common workload.", "refs": ["fms"]}]}], "sources": [{"key": "fms", "kind": "news", "name": "Tech Times", "url": "https://www.techtimes.com/articles/322686/20260802/fms-2026-opens-tuesday-liquid-cooled-pcie-60-ssds-debate-ai-memory-tiers.htm", "title": {"tr": "Sıvı soğutmalı kurumsal SSD, yapay zekâ bellek katmanı tartışmasının merkezine yerleşti", "en": "A liquid-cooled enterprise SSD moves to the centre of the AI memory-tier debate"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-04", "title": {"tr": "Görsel başına yarım sent, abonelik için 14,99 dolar", "en": "Half a cent per image, $14.99 for the subscription"}, "excerpt": {"tr": "Pippa'nın çizere ödeme yaptığı taraf kuruşuna kadar yazılı. Abonenin ekranında ne göreceği ise henüz aynı netlikte değil.", "en": "The side of Pippa where the illustrator gets paid is written down to the cent. What a subscriber will see on screen is not yet described with the same precision."}, "sections": [{"h": {"tr": "Ödeme tarafı sayılarla yazılı", "en": "The payment side is written in numbers"}, "ps": [{"tr": "Sokaktaki gözle bakınca ilk fark şu: bu hizmette ödemenin nasıl işlediği tahmine bırakılmamış. Bir abone, bir çizerin üslubundan türeyen görsel ya da video ürettiğinde çizer görsel başına 0,005 dolar, video için saniyede 0,003 dolar alıyor. Buna abonelik gelirinden beslenen yüzde 5'lik bir telif havuzundan pay ekleniyor. Abonelikler aylık 14,99 dolar ile 99,99 dolar arasında. Şirketin şu anda yaklaşık 800 ücretli abonesi ve dört çizerle imzalanmış anlaşması var; dört çizerle daha görüşüldüğü söyleniyor.", "en": "Seen from the street, the first thing that stands out is that nothing about how the payment works is left to guesswork. When a subscriber generates an image or a clip whose style derives from an illustrator's work, that illustrator receives $0.005 per image and $0.003 per second of video, plus a share of a 5 percent royalty pool funded by subscription revenue. Subscriptions run from $14.99 to $99.99 a month. The company currently has about 800 paying subscribers and signed agreements with four illustrators, with four more said to be in talks.", "refs": ["pippa"]}, {"tr": "Çizer tarafındaki süreç de tarif edilmiş. Katılmak isteyenler, gönderdikleri çizimlerin kendilerine ait olduğunu doğrulayan çok aşamalı bir incelemeden geçiyor; onaylananların eserleriyle eğitilen modeller abonelere açılıyor ve çizere kendi işine yönlendiren bir profil sayfası veriliyor. Kurucu ortak Sean Wright, topluluğu tarafından dışlanmaktan çekinen çizerlere takma adla katılma seçeneği sunduklarını söylüyor. Bu ayrıntı, ürünün satış konuşmasından çok kimin katılmakta tereddüt ettiğini anlatıyor.", "en": "The process on the illustrator's side is described too. Those who want to take part go through a multi-step review confirming that the drawings they submit are their own; models trained on approved artists' work become available to subscribers, and each artist gets a profile page pointing to their work elsewhere. Cofounder Sean Wright says illustrators worried about being ostracised by their community can join under a pseudonym. That detail says less about the pitch than about who is hesitating to sign up.", "refs": ["pippa"]}]}, {"h": {"tr": "Ekranda ne çıktığı henüz açık değil", "en": "What comes out on screen is not yet clear"}, "ps": [{"tr": "İşin abonenin gördüğü tarafında tablo daha zayıf. The Verge'ün portalda gezindiğinde bulduğu şey, ağırlıklı olarak Pixar estetiğini kötü taklit eden çocuk odaklı animasyonlar; bağımsız bir çizerin elini andıran bir sonuç görülmemiş. Bunun bir nedeni teknik: şirket kendi çizerlerinin verdiği veri kümeleriyle eğitilmiş modellere tümüyle geçmeyi hedeflese de bugünkü altyapı, kendi ifadesiyle \"daha geniş içerik kümesi üzerinde başlangıç eğitimi\" almış açık modellere dayanıyor.", "en": "On the side a subscriber actually sees, the picture is thinner. Browsing the portal, The Verge found mostly kid-oriented animation doing a poor job of imitating Pixar's look, with nothing that resembled an independent illustrator's hand. Part of the reason is technical: although the company hopes to move entirely to models trained on datasets its own artists supply, today's stack rests on open models that, in its own words, carry \"initial training on the broader set of content out there\".", "refs": ["pippa"]}, {"tr": "Alıcının bugün bekleyecek nedeni var. Ülke, dil ve plan koşullarına dair bir bilgi verilmiyor; şirket ayrıca hizmete Seedance 2.5'i eklemeyi planlıyor ki bu model rakip platformlarda da satılıyor. Yani bir sonraki adım ürünü rakiplerinden ayırmayabilir. Ayrımı yaratacak şey anlaşmalı çizer sayısının dördün üzerine çıkması ve portalda üslubu tanınabilir işlerin görünmesi olur; ikisi de dışarıdan bakan biri için sayılabilir işaretler.", "en": "A buyer has reason to wait. Nothing is given about country, language or plan requirements, and the company plans to add Seedance 2.5, a model also sold on rival platforms. The next step may therefore not distinguish the product from its competitors at all. What would distinguish it is the roster growing beyond four illustrators and work with a recognisable style appearing in the portal, and both are countable from the outside.", "refs": ["pippa"]}]}], "sources": [{"key": "pippa", "kind": "news", "name": "The Verge", "url": "https://www.theverge.com/ai-artificial-intelligence/974018/pippa-seedance-artist-royalties", "title": {"tr": "Pippa, her üretim için çizere ödeme yapan bir video aboneliği kurdu", "en": "Pippa has built a video subscription that pays an illustrator for every generation"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-05", "title": {"tr": "Gönderim sayısı ölçtüğü şeyden koptu", "en": "The submission count came loose from what it measured"}, "excerpt": {"tr": "Bir ödül programında gelen bildirim sayısı uzun süre bulunan açık sayısının vekili olarak iş gördü. Üretim maliyeti düşünce vekil ile hedef arasındaki bağ zayıfladı ve konulan eşiğin bedeli tek bir örnekte belgelendi.", "en": "In a bounty programme the number of incoming reports long served as a proxy for the number of vulnerabilities found. When the cost of producing a report fell, the link between proxy and target weakened, and the cost of the threshold that followed is documented in a single case."}, "sections": [{"h": {"tr": "Vekil ölçüt ile hedef arasındaki bağ", "en": "The link between the proxy and the target"}, "ps": [{"tr": "Bir hata ödül programı, gelen bildirim sayısını doğrudan ölçemediği bir şeyin vekili olarak kullanır: bulunan gerçek açık sayısı. Bu vekilin işe yaraması, bir bildirim yazmanın belirli bir emek gerektirmesine bağlıdır. Financial Times'a dayanan habere göre Apple, uydurma açıklar içeren düşük nitelikli yapay zekâ üretimi bildirimlerin inceleme hattını tıkaması üzerine araştırmacıların gönderebileceği bildirim sayısını sınırladı ve 30 günlük bir bekleme süresi getirdi. Üretim maliyeti düştüğünde sayılan kümenin bileşimi değişir ve vekil ölçüt hedefi izlemeyi bırakır.", "en": "A bug bounty programme uses the number of incoming reports as a proxy for something it cannot measure directly: the number of genuine vulnerabilities found. The proxy works only while writing a report costs a certain amount of effort. According to a report citing the Financial Times, Apple has limited how many reports researchers may submit and introduced a 30-day waiting period after a flood of low-quality AI-generated submissions containing hallucinated flaws clogged its review pipeline. When the cost of producing a report falls, the composition of the counted set changes and the proxy stops tracking the target.", "refs": ["bounty"]}, {"tr": "Buradaki müdahalenin nereye uygulandığı önemli. Üst sınır ve bekleme süresi bildirimin niteliğine değil, gönderen kişiye bağlanıyor. Böyle bir eşik, ayırt etme gücü olmayan bir sınıflandırıcıya benzer: kabul oranını düşürür, ama hangi tarafta kimin kaldığını gönderim geçmişine göre belirler. Nitelik ölçütüyle değil, gönderen kimliğiyle çalışan bir filtre, doğru bildirimi de yanlış bildirimle aynı oranda eler.", "en": "Where the intervention is applied matters. The cap and the waiting period attach to the person submitting rather than to the quality of the report. A threshold of that kind behaves like a classifier with no discriminating power: it lowers the acceptance rate, but decides who ends up on which side by submission history. A filter that runs on submitter identity rather than on a quality criterion screens out correct reports at the same rate as wrong ones.", "refs": ["bounty"]}]}, {"h": {"tr": "Eşiğin iki yönlü bedeli", "en": "The two-sided cost of the threshold"}, "ps": [{"tr": "Bu bedelin bir örneği belgelenmiş durumda. İtalyan girişim Bynario, ChatGPT kullanarak bir makinenin tümüyle ele geçirilmesine yol açabilecek ciddi bir macOS açığı buldu, ancak Apple daha fazla gönderimi engellediği için bunu iletemedi; genel müdür Alfredo Pesoli açığın karaborsa değerini 100.000 dolar ile 200.000 dolar arasında tahmin ediyor. Habere göre Apple sonrasında Bynario ile temasa geçti. Tek bir vaka bir oran vermez, ama eşiğin yanlış negatif üretebildiğini gösterir; bu, kabul oranına bakan bir değerlendirmede görünmeyen bir maliyet.", "en": "One instance of that cost is documented. The Italian startup Bynario used ChatGPT to find a serious macOS vulnerability that could give an attacker full control of a machine, but could not report it because Apple had blocked further submissions; chief executive Alfredo Pesoli estimates the flaw's black-market value at $100,000 to $200,000. Apple has since reached out to Bynario, according to the report. A single case gives no rate, but it does show that the threshold can produce a false negative, a cost invisible to any assessment that looks only at the acceptance rate.", "refs": ["bounty"]}, {"tr": "Eşiği değerlendirmek için gereken sayılar ise yok. Haberde sınırın hangi tarihte yürürlüğe girdiği, kaç bildirimin nitelik gerekçesiyle elendiği ve daha yüksek kota talebinin hangi ölçütle karara bağlandığı yer almıyor. Aynı haberde Apple'ın kendi açık aramasında Anthropic ve OpenAI modellerini kullandığı ve son güncellemelerinin her zamankinin beş katı düzeltme taşıdığı aktarılıyor. Bu da bir hacim rakamı; düzeltilen açıkların ciddiyeti ve istismar edilme olasılığı bildirilmediği sürece programın hedefine ne kadar yaklaştığını göstermez. Bu soruyu yanıtlayacak asgari veri seti dar: yürürlük tarihi, elenen bildirim sayısı ve kota itirazlarının sonucu.", "en": "The numbers needed to assess the threshold are missing. The report does not give the date the cap took effect, how many submissions were screened out on quality grounds, or the criterion by which a request for a higher quota is decided. The same report says Apple uses models from Anthropic and OpenAI in its own vulnerability hunting and that its latest updates carried five times as many fixes as usual. That too is a volume figure; without the severity of the fixed flaws and their likelihood of exploitation it says nothing about how close the programme is to its target. The minimum dataset that would answer the question is narrow: the effective date, the number of screened-out submissions, and the outcome of quota appeals.", "refs": ["bounty"]}]}], "sources": [{"key": "bounty", "kind": "news", "name": "The Decoder", "url": "https://the-decoder.com/a-real-macos-flaw-worth-200k-went-unreported-because-apples-bug-bounty-inbox-was-full-of-ai-slop/", "title": {"tr": "Apple, hata bildirimlerine üst sınır ve 30 günlük bekleme süresi getirdi", "en": "Apple has capped bug submissions and imposed a 30-day waiting period"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-06", "title": {"tr": "Sayfa kaldırıldı ama siparişler yerinde", "en": "The page came down but the orders stayed"}, "excerpt": {"tr": "ISBNdb tanıtım sayfasını kaldırdı ve model eğitmediğini açıkladı. Kaldırılan şey bir ilan; kitabı satan, parayı alan ve rafı boşalan taraflar arasındaki akış aynı yerde duruyor.", "en": "ISBNdb took down its marketing page and said it does not train models. What came down is a listing; the flow between whoever sells the book, whoever collects the money and whoever loses the shelf is still in place."}, "sections": [{"h": {"tr": "Kim kazanıyor, kim kaybediyor", "en": "Who gains and who loses"}, "ps": [{"tr": "Önce akışı kurmak gerek. 404 Media'nın birkaç gün önceki haberine göre kitap tedarikçileri alışılmadık ölçüde büyük toplu siparişler almaya başladı. Bu talebin karşısında kaynakları zaten kısıtlı olan okullar ve kütüphaneler duruyor; ikinci el piyasadan aldıkları hacim daraldıkça açıkta kalıyorlar. Satıcı tarafında hesap farklı. 404 Media'dan Samantha Cole'a konuşan isimsiz bir satıcı, durumun kendisine hem parasal getiri sağladığını hem de satması güç eski stoku erittiğini, ancak kullanım amacını ve az bulunan kitapların hamur yapılmasını onaylamadığını söyledi.", "en": "Start by establishing the flow. According to 404 Media's reporting a few days ago, book suppliers began receiving unusually large bulk orders. Facing that demand are schools and libraries already short on resources, left exposed as the volume they can buy on the second-hand market narrows. On the seller's side the arithmetic is different. An anonymous seller who spoke to 404 Media's Samantha Cole said the trade both brings in money and clears out old inventory that is hard to sell, while adding that they do not approve of the end use or of uncommon books being pulped.", "refs": ["isbndb"]}, {"tr": "ISBNdb bu akışın ortasında duruyordu. Kaldırılan tanıtım sayfasında kitapların, ağ taramasının kopyalayamayacağı biçimde yapılandırılmış, hakem değerlendirmesinden geçmiş, alana özgü insan bilgisi olduğu savunuluyor ve dünyanın en iyi yapay zekâ eğitim verisinin rafta durduğu yazıyordu. Şirketin yayımladığı güncellemede ise yapay zekâ modelleri eğitmediği ve hiç eğitmediği, sayfanın pazar ilgisini ölçen bir deneme olduğu ve böyle bir hizmetin hayata geçirilmediği belirtiliyor. İki metin arasındaki fark şu: biri bir hizmet öneriyor, diğeri o hizmetin hiç kurulmadığını söylüyor. İkisi de siparişlerin kimden geldiğini söylemiyor.", "en": "ISBNdb stood in the middle of that flow. The marketing page that has been removed argued that books represent curated, peer-reviewed, domain-specific human knowledge structured in a way no web crawl can replicate, and said the world's best AI training data is sitting on a shelf. In the update the company published, it says it does not train AI models and never has, that the page was a test of market interest and that no such service was ever brought to life. The difference between the two texts is this: one offers a service, the other says the service was never built. Neither says who the orders are coming from.", "refs": ["isbndb"]}]}, {"h": {"tr": "Yazılı olan ve olmayan", "en": "What is written down and what is not"}, "ps": [{"tr": "Bu tartışmanın yazılı hale gelmiş tek bölümü mahkeme dosyasından geliyor. Uygulama ocak ayında, belgelerin Anthropic bünyesindeki \"Project Panama\" adlı programı ortaya çıkarmasıyla gündeme geldi ve şirket yazarlarla 1,5 milyar dolar tutarında bir uzlaşmaya vardı. Bu rakam bir maliyetin kime yazıldığını gösteriyor: telif hakkı sahiplerine, dava yoluyla ve toplu biçimde. Kütüphanelere ve okullara yazılan maliyetin ise böyle bir muhatabı yok; ikinci el piyasadaki daralma kimseyle pazarlık masasına oturmuyor.", "en": "The only part of this argument that has been written down comes from a court file. The practice surfaced in January when documents exposed a programme inside Anthropic called \"Project Panama\", and the company reached a $1.5 billion settlement with authors. That figure shows where one cost was booked: to copyright holders, through litigation and in bulk. The cost booked to libraries and schools has no such counterparty; a contraction in the second-hand market sits down at no negotiating table.", "refs": ["isbndb"]}, {"tr": "Bir sayfanın kaldırılması bu dağılımı değiştirmiyor. Değiştirecek olan üç sayı var ve üçü de bugün bilinmiyor: siparişleri kimin verdiği, kaç cildin alındığı ve taranan cildin kütüphane dolaşımına geri dönüp dönmediği. Bu üçü açıklandığında tedarik zincirinin hangi ucunda kimin durduğu tartışılabilir hale gelir. Açıklanmadığı sürece elimizde kalan, bir satıcının hem kazandığını hem rahatsız olduğunu söylediği tek bir ifade.", "en": "Taking a page down does not change that distribution. Three numbers would, and none of them is known today: who is placing the orders, how many volumes are being bought, and whether a scanned volume returns to library circulation. Once those three are disclosed, who stands at which end of the supply chain becomes arguable. Until then what remains is one seller's statement that they are both profiting and uneasy.", "refs": ["isbndb"]}]}], "sources": [{"key": "isbndb", "kind": "news", "name": "Kotaku", "url": "https://kotaku.com/book-database-shutters-ai-service-following-outrage-over-destroyed-rare-texts-2000721018", "title": {"tr": "ISBNdb, yapay zekâ eğitim verisi tanıtım sayfasını kaldırdı", "en": "ISBNdb has taken down its AI training-data marketing page"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-02T18:50:48+00:00", "date": "2026-08-02"}, {"writer": "ai-01", "title": {"tr": "Kırk yedi puanlık sıçrama hangi katmandan geldi", "en": "Which layer produced the forty-seven-point jump"}, "excerpt": {"tr": "DeepSeek, V4-Flash-0731'de mimariyi ve parametre sayısını değiştirmediğini söylüyor. Geriye iki değişken kalıyor: eğitim sonrası çalışma ve aracının içinden geçtiği arayüz.", "en": "DeepSeek says it changed neither the architecture nor the parameter count in V4-Flash-0731. That leaves two variables: the post-training work and the interface the agent runs through."}, "sections": [{"h": {"tr": "Şirketin kendi tablosu", "en": "The company's own table"}, "ps": [{"tr": "DeepSeek, genel denemeye açtığı V4-Flash-0731 için mimariyi ve parametre sayısını değiştirmediğini, sürümün bir eğitim ve eğitim sonrası iyileştirmesi olduğunu belirtti. Kendi yayımladığı ölçümlerde önizleme sürümüne göre Terminal Bench 2.1 61,8'den 82,7'ye, NL2Repo 39,4'ten 54,2'ye, Cybergym 38,7'den 76,7'ye, DeepSWE ise 7,3'ten 54,4'e çıkıyor. Aynı tabloda Claude Opus 4.8 için Terminal Bench 2.1 değeri 85,0; DSBench-FullStack'te Opus 4.8 71,6 puanda, DeepSeek'in yeni sürümü 68,7 puanda. Bu sayıların tamamı şirketin kendi ölçümü ve bağımsız bir değerlendirme henüz yok.", "en": "DeepSeek said that in V4-Flash-0731, now in public beta, it changed neither the architecture nor the parameter count, and that the build is a training and post-training upgrade. In the figures it published itself, Terminal Bench 2.1 rises from 61.8 to 82.7 against the preview build, NL2Repo from 39.4 to 54.2, Cybergym from 38.7 to 76.7 and DeepSWE from 7.3 to 54.4. In the same table Claude Opus 4.8 stands at 85.0 on Terminal Bench 2.1, and on DSBench-FullStack Opus 4.8 scores 71.6 against 68.7 for DeepSeek's new build. All of these are the company's own measurements, and no independent evaluation exists yet.", "refs": ["source-one"]}, {"tr": "Bir geliştirici için dürüst karşılaştırma noktası rakip model değil, aynı ağırlık ailesinin önizleme sürümü. O eksende dört sayının üçü birbirine benziyor: on beş ile otuz sekiz puan arası kazanç. DeepSWE'deki 7,3'ten 54,4'e geçiş bu desenin dışında duruyor ve tek başına kırk yedi puan taşıyor. Aynı mimari, aynı parametre sayısı ve aynı ölçüt üzerinde bu genlikte bir fark, açıklamanın adını koyduğu tek değişkenle, yani eğitim sonrası çalışmayla, kendiliğinden açıklanmıyor.", "en": "For a developer the honest comparison is not a rival model but the preview build of the same weight family. On that axis three of the four numbers behave alike, with gains between fifteen and thirty-eight points. The move from 7.3 to 54.4 on DeepSWE sits outside that pattern and carries forty-seven points on its own. On the same architecture, the same parameter count and the same benchmark, a difference of that width is not self-explained by the one variable the announcement names, which is the post-training work.", "refs": ["source-one"]}]}, {"h": {"tr": "Aynı sürümde değişen ikinci şey", "en": "The second thing that changed in the same release"}, "ps": [{"tr": "Aynı sürüm, arayüz tarafında Responses biçimini doğrudan desteklemeye başladı ve Codex'e uyarlandı. Aracı ölçütlerinde puan yalnızca modelin ürettiği metinden çıkmıyor; araç çağrılarını taşıyan katmanın çağrıyı doğru biçimlendirip yanıtı geri verebilmesi de puana giriyor. Bu yüzden DeepSWE'deki genliğin bir kısmının, modelin yeteneğinden değil ölçüm düzeneğiyle uyumun düzelmesinden gelmiş olması akla yakın bir okuma. Buna karşı ileri sürülebilecek açıklama da güçlü: önizleme sürümü araç kullanımı için yeterince eğitilmemiş olabilir ve o durumda kırk yedi puan gerçek bir yetenek farkıdır.", "en": "The same release began supporting the Responses format natively and was adapted for Codex. On agentic benchmarks the score does not come only from the text a model produces; whether the layer carrying tool calls can format a call correctly and return the answer also enters the score. That makes it a plausible reading that part of the width on DeepSWE comes from a better fit with the measuring apparatus rather than from model competence. The competing account is equally strong: the preview build may simply have been undertrained for tool use, in which case the forty-seven points are a real difference in capability.", "refs": ["source-one"]}, {"tr": "İki okumayı ayıran deney pahalı değil. Aynı araç katmanı, aynı görev kümesi ve aynı puanlama yöntemi sabit tutularak iki sürüm yan yana koşulduğunda, farkın ne kadarının düzenekten geldiği doğrudan görülür. Şirketin yayımladığı tablo bu koşulların hangisinin sabit tutulduğunu söylemiyor. Bir ölçüt puanı iş akışı sonucu değildir; hangi katmanın kazandırdığı belirlenmeden sayı, satın alma kararına dönüştürülebilecek bir bilgi taşımıyor.", "en": "The experiment that separates the two readings is not expensive. Run the two builds side by side while holding the tool layer, the task set and the scoring method constant, and it becomes directly visible how much of the difference comes from the apparatus. The table the company published does not say which of those conditions were held fixed. A benchmark score is not a workflow result, and until the contributing layer is identified the number does not carry information a purchasing decision can rest on.", "refs": ["source-one"]}]}, {"h": {"tr": "Fiyatın altındaki sayı", "en": "The number underneath the price"}, "ps": [{"tr": "Fiyatlandırmada önbellek ıskası hâlinde milyon giriş belirteci başına 0,14 dolar, önbellek isabetinde 0,0028 dolar ve milyon çıkış belirteci başına 0,28 dolar açıklandı. Karşılaştırma olarak verilen değerler GPT-5.6 Sol için 5 dolar ve 30 dolar, Claude Fable 5 için 10 dolar ve 50 dolar, Claude Sonnet 5 için 3 dolar ve 15 dolar. Bu aralık, bir ekibin yeniden deneme bütçesini, geniş dallanmayı ve ikinci bir gözden geçirme turunu hesapta tutulabilir hâle getiriyor.", "en": "Pricing is stated as $0.14 per million input tokens on a cache miss, $0.0028 on a cache hit and $0.28 per million output tokens. The comparison figures given are $5 and $30 for GPT-5.6 Sol, $10 and $50 for Claude Fable 5 and $3 and $15 for Claude Sonnet 5. That range is what makes a team's retry budget, wide fan-out and a second review pass affordable enough to plan around.", "refs": ["source-one"]}, {"tr": "Belirteç başına ücret ile tamamlanan görev başına maliyet aynı şey değil: ucuz bir model daha çok deneme, daha çok gözden geçirme ve daha çok hata kurtarma gerektirdiğinde aradaki fark kapanır. Bu ayrımı ölçecek işaret bağımsız bir değerlendirmede duruyor. 31 ekim 2026'ya kadar, araç katmanı açıklanmış bağımsız bir ölçüm Terminal Bench 2.1 sonucunu birkaç puan içinde yeniden üretirse kazanç model tarafındadır; sonuç belirgin biçimde düşük kalırsa düzenek uyumu açıklaması ağırlık kazanır.", "en": "Price per token and cost per completed task are not the same thing: when a cheap model needs more attempts, more review and more error recovery, the gap closes. The signal that would measure that distinction sits in an independent evaluation. If, by 31 October 2026, an independent measurement with a disclosed tool layer reproduces the Terminal Bench 2.1 result within a few points, the gain is on the model side; if the result comes in markedly lower, the apparatus-fit account gains weight.", "refs": ["source-one"]}]}], "sources": [{"key": "source-one", "kind": "news", "name": "OfficeChai", "url": "https://officechai.com/ai/deepseek-releases-deepseek-v4-flash-0731-gives-opus-4-8-level-performance-at-a-fraction-of-the-price/", "title": {"tr": "DeepSeek, V4-Flash-0731 sürümünü genel denemeye açtı", "en": "DeepSeek opens its V4-Flash-0731 build to public beta"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "ai-02", "title": {"tr": "Mahkeme kimin dava açabileceğine karar verdi", "en": "The court decided who may sue"}, "excerpt": {"tr": "Yargıç Engelmayer, davalıların dava ehliyeti itirazını kabul etmedi. Bu aşamada karara bağlanan tek soru, davanın kimin tarafından açılabileceği.", "en": "Judge Engelmayer rejected the defendants' objection on standing. The only question settled at this stage is who is entitled to bring the case."}, "sections": [{"h": {"tr": "Kararın kapsamı", "en": "The reach of the ruling"}, "ps": [{"tr": "New York Güney Bölge Mahkemesi yargıcı Paul A. Engelmayer 31 temmuz cuma günü, Perplexity AI ve SerpApi'nin dava ehliyeti gerekçesiyle yaptığı reddi talebini kabul etmedi. Yargıç, Dijital Binyıl Telif Hakkı Yasası'nın ifadesini geniş yorumlayarak zarar gören herhangi bir kişinin ihlal nedeniyle hukuk davası açabileceğini belirtti ve Reddit'in ileri sürdüğü zararın yasanın koruma amacı içinde kaldığına hükmetti. Koruma önlemlerinin dolanılmasına ve kullanıcı içeriğinin toplu olarak çekilmesine ilişkin iddialar görülmeye devam edecek.", "en": "On Friday 31 July, Judge Paul A. Engelmayer of the Southern District of New York rejected the motion by Perplexity AI and SerpApi to dismiss on standing grounds. Reading the Digital Millennium Copyright Act's language broadly, the judge noted that any person injured may bring a civil action for such a violation, and held that the harm Reddit alleges falls within the statute's protective scope. The claims about circumvention of protections and the bulk removal of user content will go forward.", "refs": ["source-one"]}, {"tr": "Reddi talebinin aşılması, iddiaların doğru olduğunun anlaşılması demek değil. Bu usul aşamasında mahkeme iddiaları doğru varsayarak yalnızca davanın sürüp süremeyeceğine bakar. Perplexity'nin ya da SerpApi'nin ne yaptığına dair bir tespit yapılmadı, bir koruma önleminin dolanıldığı belirlenmedi ve hangi içeriğin nereye ulaştığı konusunda bir bulgu yok.", "en": "Clearing a motion to dismiss is not a finding that the allegations are true. At this procedural stage the court assumes the allegations and looks only at whether the case may continue. Nothing has been determined about what Perplexity or SerpApi did, no protective measure has been found to have been circumvented, and there is no finding about which content reached where.", "refs": ["source-one"]}]}, {"h": {"tr": "Sırada duran olgu soruları", "en": "The factual questions still ahead"}, "ps": [{"tr": "Kararda geçen iddia iki ayrı olguyu birleştiriyor: bir koruma önleminin dolanılması ve kullanıcı içeriğinin toplu olarak çekilmesi. Hangi önlemin söz konusu olduğu, o önlemin nasıl aşıldığı ve bunu kimin yaptığı, dosyanın bundan sonra üretmesi gereken bilgiler. İçeriğe erişmenin teknik yolu ile bir erişim denetimini kırmanın hukuki karşılığı aynı şey değil ve bu iki durumu ayıran şey, isteklerin nasıl gönderildiğini gösteren teknik belgeler.", "en": "The allegation in the ruling joins two separate facts: circumvention of a protective measure, and the bulk removal of user content. Which measure was at issue, how it was got around, and by whom, are what the case has yet to produce. The technical route to reaching content and the legal meaning of breaking an access control are not the same thing, and what separates them is documentary evidence showing how the requests were made.", "refs": ["source-one"]}, {"tr": "Bu aşamada verilen geniş yorumun sonraki aşamalarda daralması da mümkün. Dava ehliyeti ile esas, farklı ölçütlerle değerlendirilir: birincisi davacının yasanın koruduğu bir zarara uğrayıp uğramadığına, ikincisi davalının fiilinin yasanın tanımına girip girmediğine bakar. Bugünkü karar birinci soruyu geniş yorumladı; ikinci soruya dair bir işaret vermedi.", "en": "The broad reading given at this stage may also narrow later. Standing and the merits are assessed by different tests: the first asks whether the plaintiff suffered a harm the statute protects against, the second whether the defendant's conduct falls within the statute's definition. Friday's ruling read the first question broadly; it gave no indication on the second.", "refs": ["source-one"]}]}, {"h": {"tr": "Çözümün ne çözeceği", "en": "What a remedy would settle"}, "ps": [{"tr": "Bu davanın olası sonuçları erişim üzerine kurulu. Tazminat ya da bir tedbir kararı, içeriğin nasıl elde edildiğine dair anlaşmazlığı yönetir; hangi Reddit gönderisinin bir ürünün hangi yanıtına girdiğini göstermez. Kaynağın izini sürmek, ürün tarafında hangi metnin hangi kaynaktan geldiğini gösteren bir kanıt yolu gerektirir ve bu, dolanma iddiasının ispatından ayrı bir iş.", "en": "The outcomes available in this case are built on access. Damages or an injunction manage the dispute over how the content was obtained; they do not show which Reddit post entered which answer in a product. Tracing the source would require an evidentiary path showing, on the product side, which text came from which origin, and that is separate work from proving the circumvention claim.", "refs": ["source-one"]}, {"tr": "İzlenebilir işaret dosyanın kendisinde. 31 aralık 2026'ya kadar taraflardan biri isteklerin nasıl gönderildiğini gösteren teknik belgeleri sunar ya da mahkeme esasa ilişkin bir karar verirse, Reddit kararında geniş yorumlanan ehliyet sorusunun davanın sonucunu ne kadar belirlediği görülebilir. O belgeler gelmediği sürece dosyada kanıtlanmış bir dolanma yok, kabul edilmiş bir iddia var.", "en": "The observable signal is in the docket itself. If, by 31 December 2026, either party produces technical documentation showing how the requests were made, or the court rules on the merits, it will become visible how far the standing question read broadly in the Reddit ruling determines the outcome. Until those documents arrive, the file holds an allegation permitted to proceed rather than a proven act of circumvention.", "refs": ["source-one"]}]}], "sources": [{"key": "source-one", "kind":
