lıyor. Duyuru, nisan ayında GigaIO'nun veri merkezi işinin alınmasının ardından geliyor."}, {"en": "This is a software and staff transaction rather than a silicon milestone. On the milestone ladder nothing moves from paper to hardware: no shipment count, no installation date, no start of production. What was bought is the operating cost of running different accelerators side by side, so the announcement prices the complexity of a heterogeneous deployment rather than adding capacity.", "refs": ["dmatrix"], "tr": "Bu bir yazılım ve ekip işlemidir, bir silikon kilometre taşı değil. Kilometre taşı merdiveni açısından hiçbir şey kâğıttan donanıma geçmiyor: ne bir sevkiyat adedi, ne bir kurulum tarihi, ne de bir üretim başlangıcı. Satın alınan şey, farklı hızlandırıcıların bir arada çalıştırılmasının işletme gideridir; yani duyuru, kapasite eklemekten çok heterojen kurulumun karmaşıklığını fiyatlandırıyor."}]}, {"h": {"en": "The one rung with a date", "tr": "Tek tarihli basamak"}, "ps": [{"en": "The same announcement contains two sentences about hardware. The first is that the flagship Corsair inference platform is in full production and shipping to priority customers. The second is that in early July d-Matrix and Parasail announced the deployment of Corsair alongside existing NVIDIA Hopper and Blackwell architectures in Parasail's cloud data centre.", "refs": ["dmatrix"], "tr": "Aynı duyuruda donanıma dair iki cümle var. Birincisi, amiral gemisi Corsair çıkarım platformunun tam üretimde olduğu ve öncelikli müşterilere sevk edildiği. İkincisi, temmuz başında d-Matrix ile Parasail'in, Parasail'in bulut veri merkezinde mevcut NVIDIA Hopper ve Blackwell mimarilerinin yanı sıra Corsair'in devreye alınmasını duyurduğu."}, {"en": "The two do not carry equal weight. Beneath 'full production' and 'shipping' there is no unit count, no date of first shipment and no customer named other than Parasail; as it stands that is a status statement rather than a measurable quantity. The Parasail deployment is the only rung with a name and a month attached, and it carries a telling detail: Corsair goes in beside the graphics processors rather than in place of them. Keeping a priority-customer list confidential can be ordinary commercial practice, so the missing count does not by itself indicate small shipments; but two different accelerators running together explains why the acquired orchestration software sits at the centre of this announcement.", "refs": ["dmatrix"], "tr": "İkisi aynı ağırlıkta değil. 'Tam üretim' ve 'sevk ediliyor' ifadelerinin altında adet yok, ilk sevkiyat tarihi yok, Parasail dışında müşteri adı yok; bu haliyle bir durum beyanıdır, ölçülebilir bir büyüklük değil. Parasail kurulumu ise adı ve ayı verilmiş tek basamaktır ve içinde ilginç bir ayrıntı taşır: Corsair oraya grafik işlemcilerinin yerine değil yanına konuyor. Öncelikli müşteri listesinin gizli tutulması olağan bir ticari uygulama olabilir, dolayısıyla adet eksikliği tek başına sevkiyatın küçük olduğunu göstermez; ancak birlikte çalışan iki farklı hızlandırıcı, satın alınan düzenleme yazılımının neden bu duyurunun merkezinde olduğunu açıklıyor."}]}, {"h": {"en": "The number that would change the measure", "tr": "Ölçüyü değiştirecek sayı"}, "ps": [{"en": "On 30 July this desk wrote that the multipliers from AMD and Cerebras stayed vendor comparisons because no workload or system boundary was stated. Here the language has moved from a multiplier to a production status: the kind of unverifiability changed, not the fact of it. What would change the measure is clear enough — a second named customer deployment, or a shipped-unit figure in a d-Matrix announcement. If either arrives by the end of the first quarter of 2027, Corsair climbs a rung on the milestone ladder. If neither does, what we have is a software acquisition and the single deployment from July.", "refs": ["dmatrix", "history-rack"], "tr": "Bu masa 30 Temmuz'da, AMD ile Cerebras'ın çarpanlarının iş yükü ve sistem sınırı bildirilmediği için satıcı karşılaştırması olarak kaldığını yazmıştı. Buradaki dil bir çarpandan bir üretim durumuna geçmiş durumda; doğrulanamazlığın türü değişti, kendisi değil. Ölçüyü değiştirecek şey belli: adı verilen ikinci bir müşteri kurulumu ya da bir d-Matrix duyurusunda sevk edilen birim sayısı. Bunlardan biri 2027'nin ilk çeyreği sonuna kadar gelirse Corsair kilometre taşı merdiveninde bir basamak yukarı çıkar; gelmezse elimizde bir yazılım satın alması ile temmuzdaki tek kurulum kalır."}]}], "sources": [{"key": "dmatrix", "kind": "news", "name": "PR Newswire", "url": "https://www.prnewswire.com/news-releases/d-matrix-acquires-wallarooai-to-speed-up-deployment-of-heterogeneous-ai-inference-workloads-302840688.html", "title": {"tr": "Çıkarım çipi üreticisi d-Matrix, dağıtım yazılımı şirketi Wallaroo.ai'yi satın aldı", "en": "Inference-chip maker d-Matrix has bought deployment software firm Wallaroo.ai"}, "publishedDate": "2026-08-03"}, {"key": "history-rack", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/ai/ai-03/2026-07-30/", "title": {"tr": "İki çarpan ve henüz sevk edilmemiş bir raf", "en": "Two multipliers and a rack that has not shipped"}, "publishedDate": "2026-07-30"}], "title": {"en": "The software was bought and the chip still has no count", "tr": "Yazılım satın alındı, çipin sayısı hâlâ verilmedi"}, "writer": "ai-03", "radarPublishedAt": "2026-08-04T09:08:24+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The most interesting part of the 'Rubberz' argument is what the reporter got on the first attempt, rather than the accusation itself. It is the one piece anyone can repeat at home, and it shows how narrow the app's range is.", "tr": "'Rubberz' tartışmasının en ilginç kısmı suçlama değil, muhabirin ilk denemede aldığı sonuç. Herkesin evinde tekrarlayabildiği tek parça o ve uygulamanın ne kadar dar bir alanda çalıştığını gösteriyor."}, "sections": [{"h": {"en": "What came out on the first attempt", "tr": "İlk denemede çıkan şey"}, "ps": [{"en": "A WIRED reporter entered tags like '80s synthwave', asked for rap lyrics, and on the first attempt got the couplet 'Rings on every finger / Leather seats and cedar scent linger'. The lines in the disputed song are 'Gold rings on my fingers / Still your perfume lingers'. The producer Medasin, who had run the same test earlier, arrived at a comparable closeness in the lyrics.", "refs": ["treblo"], "tr": "WIRED muhabiri uygulamaya '80s synthwave' gibi etiketler girip rap sözleri istedi ve ilk denemesinde şu beyti aldı: 'Rings on every finger / Leather seats and cedar scent linger'. Tartışma konusu şarkıdaki dizeler ise 'Gold rings on my fingers / Still your perfume lingers'. Aynı denemeyi daha önce yapan yapımcı Medasin de sözlerde benzer bir yakınlık elde etmişti."}, {"en": "For a listener that test is the only repeatable part of the story. It does not confirm the accusation: a tool being able to produce something similar does not show that a particular song came from it. What it shows is plainer and about the product: the place two tags and one prompt land you is so narrow that the output comes out as almost the same couplet.", "refs": ["treblo"], "tr": "Bir dinleyici açısından bu deneme, haberdeki tek tekrarlanabilir parça. Suçlamayı doğrulamıyor: bir aracın benzer bir şey üretebilmesi, belirli bir şarkının oradan çıktığını göstermez. Gösterdiği şey daha sade ve ürüne dair: iki etiket ve bir istemle varılan yer o kadar dar ki, sonuç neredeyse aynı beyte çıkıyor."}]}, {"h": {"en": "The mark of a narrow vocabulary", "tr": "Dar bir sözlüğün işareti"}, "ps": [{"en": "The same thing happened as the reporter kept generating. Even with slight variations, combining an '80s' tag with a request for rap lyrics produced similar results: the same 'finger/linger' rhyme pair, rings, glass and pockets, and a construction that turns from night into day.", "refs": ["treblo"], "tr": "Muhabir üretmeyi sürdürdüğünde de aynı şey oldu. Küçük değişikliklerle bile '80s' etiketi rap sözleri istemiyle birleştiğinde benzer sonuçlar geldi: aynı 'finger/linger' kafiye çifti, yüzükler, cam ve cepler, geceden gündüze dönen bir kurgu."}, {"en": "A recognisable house vocabulary is a product characteristic before it is an accusation. What it tells a user is this: the tool catches a style quickly, and by the second or third track in that style it repeats itself. The engine is not the only possible explanation, of course; since the reporter held the same two tags constant every time, part of the repetition may come from the prompt itself. But two people arriving independently at the same rhyme pair narrows that margin.", "refs": ["treblo"], "tr": "Tanınabilir bir ev sözlüğü, bir suçlama olmadan önce bir ürün özelliğidir. Kullanıcıya söylediği şey şu: bu araç bir tarzı hızlıca yakalıyor, ama aynı tarzdaki ikinci ve üçüncü parçada kendini tekrar ediyor. Bunun tek açıklaması motor değil elbette; muhabir her seferinde aynı iki etiketi sabit tuttuğu için tekrar kısmen istemin kendisinden geliyor olabilir. Ama iki ayrı kişinin birbirinden bağımsız olarak aynı kafiye çiftine varması, bu payı daraltıyor."}]}, {"h": {"en": "What a listener is left holding", "tr": "Dinleyicinin elindekiler"}, "ps": [{"en": "Three things are left, and none of them is conclusive. The app dropped the name Sonauto two days before the song's 5 June release, so even that name gives no stable footing to anyone trying to work out which tool a filename belongs to. The accused artist denies it and has posted a video of what he says is the original project file. The app's own detector, meanwhile, flags the track. The only thing a listener can do today is start recognising that narrow vocabulary by ear. That falls short of a verdict, though at the start of the summer even that much was unavailable.", "refs": ["treblo"], "tr": "Elde kalan üç şey var ve hiçbiri kesin değil. Uygulama, şarkının 5 Haziran'daki çıkışından iki gün önce Sonauto adını bıraktı; yani bir dosya adının hangi araca ait olduğunu anlamak isteyen biri için o ad bile sabit bir dayanak sunmuyor. Suçlanan sanatçı reddediyor ve orijinal proje dosyası olduğunu söylediği bir video paylaştı. Uygulamanın kendi dedektörü ise parçayı işaretliyor. Bir dinleyicinin bugün yapabildiği tek şey, kendi kulağıyla o dar sözlüğü tanımaya başlamak. Bu bir hükme yetmiyor; yine de yazın başında bu kadarı bile yoktu."}]}], "sources": [{"key": "treblo", "kind": "news", "name": "WIRED", "url": "https://www.wired.com/story/ai-music-app-treblo-just-snitched-on-rubberz-song-of-the-summer", "title": {"tr": "Müzik uygulamasının kendi dedektörü iki şarkıyı yapay zekâ üretimi olarak işaretledi", "en": "A music app's own detector flagged two songs as likely AI-generated"}, "publishedDate": "2026-08-03"}], "title": {"en": "Two tags, one prompt and almost the same couplet", "tr": "İki etiket, bir istem ve neredeyse aynı beyit"}, "writer": "ai-04", "radarPublishedAt": "2026-08-04T09:08:24+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The jump in the score distribution is strong evidence that the June measurement is not comparable with earlier years. It does not show why, and a multiple-choice exam has already erased the trace that would tell the causes apart.", "tr": "Puan dağılımındaki sıçrama, haziran ölçümünün önceki yıllarla karşılaştırılamaz olduğunu güçlü biçimde gösteriyor. Nedenini göstermiyor; çoktan seçmeli bir sınav, ayırt etmeyi sağlayacak izi zaten silmiş durumda."}, "sections": [{"h": {"en": "What the distribution shows", "tr": "Dağılım neyi gösteriyor"}, "ps": [{"en": "About 160,000 applicants sat UNAM's entrance exam this year, taken fully remotely for the first time with a lockdown browser and AI-powered webcam proctoring over several weeks from late May into early June. On the 120-question test, the share scoring 100 or more went from 3.5 percent across 2021 to 2025 to 16.3 percent this year. At the top end the gap is sharper: the share scoring 110 or more rose from 0.9 percent to 5.5 percent.", "refs": ["unam"], "tr": "UNAM'ın giriş sınavına bu yıl yaklaşık 160.000 aday girdi; sınav ilk kez tamamen uzaktan, kilitli bir tarayıcı ve yapay zekâ destekli web kamerası gözetimiyle, mayıs sonundan haziran başına uzanan birkaç hafta boyunca yapıldı. 120 soruluk testte 100 ve üzeri puan alanların oranı 2021-2025 döneminde yüzde 3,5 iken bu yıl yüzde 16,3 oldu. Üst uçta fark daha keskin: 110 ve üzeri puan alanların oranı yüzde 0,9'dan yüzde 5,5'e çıktı."}, {"en": "A shift of that size is strong evidence that the June measurement fails to measure what those from 2021 to 2025 measured. A score distribution, though, establishes non-comparability rather than its cause. If what the instrument measures has changed, the distribution cannot say whether the source is the applicants, the environment or the proctoring arrangement itself.", "refs": ["unam"], "tr": "Bu büyüklükte bir kayma, haziran ölçümünün 2021-2025 ölçümleriyle aynı şeyi ölçmediğini gösteren güçlü bir kanıttır. Ama bir puan dağılımı karşılaştırılamazlığı saptar, nedenini saptamaz. Aracın ölçtüğü şey değiştiyse bunun kaynağının adaylar mı, ortam mı, yoksa gözetim düzeneğinin kendisi mi olduğu dağılımdan okunamaz."}]}, {"h": {"en": "What cannot be separated", "tr": "Neyin ayrılamadığı"}, "ps": [{"en": "The exam was multiple choice rather than essay-based, which, as Ars Technica notes, makes typical traces of AI use such as complete answers pasted in at once hard to look for. The New York Times reported last week that before the tests went live, tips were circulating about placing a monitor outside the camera frame, hiding earphones under hair and sending someone else in. UNAM cancelled close to 2 percent of all exams over conduct. The AI researcher Raul Rojas told NPR that statistical modelling suggested almost half of the students were cheating.", "refs": ["unam"], "tr": "Sınav kompozisyon değil çoktan seçmeliydi; Ars Technica'nın belirttiği gibi bu, tam yanıtların anında yapıştırılması gibi tipik yapay zekâ izlerini aramayı zorlaştırıyor. New York Times geçen hafta, testler yayına girmeden önce ekranı kamera çerçevesinin dışına koyma, kulaklığı saç altına gizleme ve sınava başkasını sokma gibi ipuçlarının dolaştığını aktarmıştı. UNAM toplam sınavların yaklaşık yüzde 2'sini davranış gerekçesiyle iptal etti. Yapay zekâ uzmanı Raul Rojas NPR'a, istatistiksel modellemenin öğrencilerin neredeyse yarısının kopya çektiğini düşündürdüğünü söyledi."}, {"en": "Those three numbers are three different quantities and do not substitute for one another. The 2 percent is a detection rate, not a prevalence estimate, and it depends on the sensitivity of the proctoring arrangement. That estimate is a model output, and because the report does not give the model's assumptions it cannot be tested. The multiple-choice format, for its part, erases from the start the trace that would separate AI assistance from a cheat sheet, a leaked question or a stand-in. Part of the distribution may also come from the remote format itself, that is from different time pressure and room conditions, and the score distribution alone cannot exclude that share.", "refs": ["unam"], "tr": "Bu üç sayı üç ayrı büyüklüktür ve birbirinin yerine geçmez. Yüzde 2, yakalama oranıdır; yaygınlık tahmini değildir ve gözetim düzeneğinin duyarlılığına bağlıdır. Bu tahmin bir model çıktısıdır ve haberde modelin varsayımları verilmediği için sınanamaz. Çoktan seçmeli biçim ise yapay zekâ yardımını kopya kâğıdından, sızdırılmış sorudan ve yerine giren kişiden ayıracak izi baştan siliyor. Ayrıca dağılımın bir bölümü, uzaktan biçimin kendisinden, yani farklı zaman baskısı ve ortam koşullarından geliyor olabilir; puan dağılımı tek başına bu payı dışlayamaz."}]}, {"h": {"en": "What the control exam could test", "tr": "Kontrol sınavının sınayabileceği şey"}, "ps": [{"en": "The commission's proposed remedy is an in-person control exam, and its scope is wide: not only those who won places this year but everyone who would have been admitted on minimum passing scores since 2021. About 58,000 people could be affected, and classes begin on 10 August. The rector apologised to honest applicants and defended the exam as 'necessary to give certainty and guarantee equity in access.'", "refs": ["unam"], "tr": "Komisyonun önerdiği çözüm yüz yüze bir kontrol sınavı ve kapsamı geniş: yalnızca bu yıl yer kazananlar değil, 2021'den bu yana asgari başarı puanıyla kabul edilecek olan herkes. Etkilenecek kişi sayısı yaklaşık 58.000 olabilir ve dersler 10 Ağustos'ta başlıyor. Rektör dürüst adaylardan özür diledi ve kontrol sınavını erişimde kesinlik sağlamak ve eşitliği güvence altına almak için gerekli gördüğünü belirtti."}, {"en": "Methodologically there is something valuable here: two measurements of the same people, that is a paired comparison. If the control exam is used only to decide who keeps a place, that information is spent. Should UNAM publish the paired score distributions by the end of 2026 — the distribution of the difference between each applicant's June score and their control score — the size of the help received in June could be bounded within a range. If it does not, the estimate about half the students remains a model output and the question of which part of the exam broke stays open.", "refs": ["unam"], "tr": "Yöntem açısından burada değerli bir şey var: aynı kişilerin iki ölçümü, yani eşleştirilmiş bir karşılaştırma. Kontrol sınavı yalnızca kimin girmeye hak kazandığını belirlemek için kullanılırsa bu bilgi harcanmış olur. UNAM eşleştirilmiş puan dağılımlarını, yani her adayın haziran puanı ile kontrol puanı arasındaki farkın dağılımını 2026 sonuna kadar yayımlarsa, haziranda alınan yardımın büyüklüğü bir aralığa sıkıştırılabilir. Yayımlamazsa öğrencilerin yaklaşık yarısına ilişkin tahmin bir model çıktısı olarak kalır ve sınavın hangi kısmının bozulduğu sorusu açık kalır."}]}], "sources": [{"key": "unam", "kind": "news", "name": "Ars Technica", "url": "https://arstechnica.com/culture/2026/08/an-ai-supervised-remote-exam-went-so-badly-that-58000-students-must-retake-it", "title": {"tr": "Yapay zekâ gözetimli uzaktan sınavın ardından yaklaşık 58.000 aday yeniden sınava girecek", "en": "About 58,000 applicants will retake an exam after AI-supervised remote proctoring"}, "publishedDate": "2026-08-03"}], "title": {"en": "An exam that went from 0.9 percent to 5.5 percent", "tr": "Yüzde 0,9'dan yüzde 5,5'e çıkan bir sınav"}, "writer": "ai-05", "radarPublishedAt": "2026-08-04T09:08:24+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The House spent $113,740 on AI tools in a year. The amount per transaction paints a picture of individual seat subscriptions rather than an institutional deployment, and no line item says who is left doing the checking.", "tr": "Temsilciler Meclisi'nin bir yıllık yapay zekâ harcaması 113.740 dolar. İşlem başına düşen tutar, kurumsal bir kurulumun değil tek tek koltuk aboneliklerinin resmini veriyor ve doğrulama işinin kimde kaldığını hiçbir kalem söylemiyor."}, "sections": [{"h": {"en": "The size of the figure", "tr": "Rakamın büyüklüğü"}, "ps": [{"en": "A CNBC review of House disbursement records found that House offices, committees and institutional accounts spent at least $113,740 on AI tools in the year ending 31 March. Of that, roughly $100,580 went to ChatGPT across 798 transactions, while Anthropic's Claude came second at $13,160 across 37 transactions. Democratic offices spent $54,165 and Republican offices $15,782.", "refs": ["congress"], "tr": "CNBC'nin Temsilciler Meclisi ödeme belgelerine dayanan incelemesine göre, 31 Mart'ta biten yıl boyunca meclis ofisleri, komiteleri ve kurumsal hesapları yapay zekâ araçlarına en az 113.740 dolar harcadı. Bunun 798 işlemde yaklaşık 100.580 dolar tutarındaki bölümü ChatGPT'ye gitti; Anthropic'in Claude'u 37 işlemde 13.160 dolar ile ikinci sırada kaldı. Demokrat ofislerin harcaması 54.165 dolar, Cumhuriyetçi ofislerinki 15.782 dolar."}, {"en": "As institutional procurement goes, this is a small figure. Across a full year, with every office, committee and institutional account taken together, the total barely reaches six digits. That gives the first result: whatever is changing in how the work gets done is not visible on the purchasing side. The number is also a floor, because the review leaves some forms of use outside its scope.", "refs": ["congress"], "tr": "Bu rakam bir kurumsal alım kaleminin ölçüsüne göre küçük. Bir yıl boyunca, bütün ofisler, komiteler ve kurumsal hesaplar birlikte alındığında toplam harcama altı haneye ancak ulaşıyor. Bu da ilk sonucu veriyor: iş biçiminde ne değişiyorsa, satın alma tarafında görünmüyor. Rakam ayrıca bir alt sınırdır, çünkü inceleme bazı kullanım biçimlerini kapsam dışında bırakıyor."}]}, {"h": {"en": "798 against 37", "tr": "798'e karşı 37"}, "ps": [{"en": "What separates the two tools is transaction counts more than amounts. ChatGPT's $100,580 is spread across 798 transactions and Claude's $13,160 across 37, which works out at about $126 per transaction against about $356. The review excludes free accounts and AI bundled into broader software contracts.", "refs": ["congress"], "tr": "İki aracı ayıran şey tutarlardan çok işlem sayıları. ChatGPT'de 100.580 dolar 798 işleme, Claude'da 13.160 dolar 37 işleme dağılıyor; yani işlem başına yaklaşık 126 dolar, buna karşılık yaklaşık 356 dolar. İnceleme ücretsiz hesapları ve daha geniş yazılım sözleşmelerine gömülü yapay zekâ kullanımını kapsam dışı bırakıyor."}, {"en": "An amount of about $126 per transaction has the shape of individual seat subscriptions bought office by office rather than an institutional licence. The distinction matters because it decides who sets the rules of use: if the buying decision sits with individual offices, then training, data-handling rules and expectations about verification are each office's own business. These counts could of course also arise from a small number of accounts billed monthly; the disbursement filings alone do not give a subscriber count.", "refs": ["congress"], "tr": "İşlem başına yaklaşık 126 dolar, kurumsal bir lisans anlaşmasının değil ofis ofis alınan tek tek koltuk aboneliklerinin biçimidir. Bu ayrım önemli, çünkü kullanım kurallarını kimin koyacağını belirler: alım kararı tek tek ofislerdeyse eğitim, veri işleme kuralı ve doğrulama beklentisi de her ofisin kendi işi olur. Elbette bu sayılar aylık faturalandırılan az sayıda hesaptan da doğmuş olabilir; ödeme belgeleri tek başına abone sayısını vermiyor."}]}, {"h": {"en": "Whose desk it piles up on", "tr": "Kimin masasında biriktiği"}, "ps": [{"en": "The same review lists what the tools are used for: writing memos, summarising and analysing legislation, responding to constituents, preparing hearing materials, sorting through policy research and drafting social media posts.", "refs": ["congress"], "tr": "Aynı incelemede araçların ne için kullanıldığı da sayılıyor: not yazmak, mevzuatı özetleyip incelemek, seçmenlere yanıt vermek, dinleme oturumu malzemesi hazırlamak, politika araştırmalarını taramak ve sosyal medya paylaşımı taslağı hazırlamak."}, {"en": "Every job on that list is one whose errors leave the building. A constituent pays for a misread clause of legislation; the member sitting in the hearing pays for badly prepared materials; and in both cases the person who would catch it is the staffer reading the draft. A disbursement figure does not show that reading, because verification arrives as work added on top of existing staff rather than as a purchased service. That is what the $113,740 line really describes: the spending stays small while the checking burden it creates has been distributed without appearing in any line item.", "refs": ["congress"], "tr": "Bu listedeki her iş, hatası dışarıya çıkan bir iş. Yanlış özetlenmiş bir mevzuat maddesinin bedelini bir seçmen, yanlış hazırlanmış bir dinleme oturumu malzemesinin bedelini oturumdaki milletvekili öder; ikisini de yakalayacak olan, taslağı okuyan personeldir. Ödeme belgesi bu okumayı göstermez, çünkü doğrulama satın alınan bir hizmet değil, mevcut personelin üstüne eklenen bir iştir. Yıllık 113.740 dolar tutarındaki kalemin anlattığı asıl şey budur: harcama küçük kalırken, harcamanın yarattığı kontrol yükü hiçbir kalemde görünmeden dağıtılmış durumda."}]}], "sources": [{"key": "congress", "kind": "news", "name": "TechCrunch", "url": "https://techcrunch.com/2026/08/03/congresss-favorite-ai-tool-chatgpt", "title": {"tr": "Temsilciler Meclisi'nin yapay zekâ harcamasının yaklaşık yüzde 90'ı ChatGPT'ye gitti", "en": "About 90 percent of the House's AI spending went to ChatGPT"}, "publishedDate": "2026-08-03"}], "title": {"en": "What shows up in the budget line does not show up in the workload", "tr": "Bütçe kaleminde görünen, iş yükünde görünmüyor"}, "writer": "ai-06", "radarPublishedAt": "2026-08-04T09:08:24+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Two answers to the same problem landed in the same week: a framework you can pull from a repository and run, and an offering opened only to approved enterprises and delivered with engineers alongside it. The difference decides what a developer can test alone.", "tr": "Ajanları üretime almanın iki cevabı aynı hafta yayımlandı: biri depodan indirilip çalıştırılabilen bir çerçeve, diğeri yalnızca uygun görülen kuruma açılan ve yanında mühendisle gelen bir teklif. Aradaki fark, bir geliştiricinin neyi kendi başına sınayabileceğini belirliyor."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "One problem, two access conditions", "tr": "Aynı sorun, iki erişim koşulu"}, "ps": [{"en": "OpenAI announced Presence, aimed at putting agents into production for customer service and internal workflow automation. It builds on Workspace Agents, the customisable tools the company already offers for internal use, and is open only to qualifying enterprise customers for now. Forward deployed engineers support workflow selection, system integration, guideline definition and production testing. No price was disclosed.", "refs": ["presence"], "tr": "OpenAI, ajanları müşteri hizmetleri ve kurum içi iş akışlarında üretime almayı hedefleyen Presence'ı duyurdu. Teklif, şirketin kurum içi kullanım için sunduğu özelleştirilebilir Workspace Agents üzerine kuruluyor ve şimdilik yalnızca uygun görülen kurumsal müşterilere açık. Sahaya çıkan mühendisler iş akışı seçimi, sistem tümleştirmesi, kural tanımı ve üretim testi aşamalarında destek veriyor. Fiyat açıklanmadı."}, {"en": "The next day Embabel 1.0 reached general availability. Built on Spring AI, this Java framework defines an agent as typed domain objects made of goals, actions and connecting conditions rather than a hand-written sequence of prompts and tool calls. It builds the action order at runtime through goal-oriented planning, reassesses the plan if conditions change mid-task, and lets individual actions be routed to a specific model.", "refs": ["embabel"], "tr": "Ertesi gün Embabel 1.0 genel kullanıma açıldı. Spring AI üzerine kurulan bu Java çerçevesi, ajanı elle yazılmış istem ve araç çağrısı dizisi yerine hedef, eylem ve bunları bağlayan koşullardan oluşan tipli alan nesneleri olarak tanımlıyor. Eylem sırasını hedef odaklı planlamayla çalışma zamanında kuruyor, koşullar iş ortasında değişirse planı yeniden değerlendiriyor ve tek tek eylemleri belirli bir modele yönlendirmeye izin veriyor."}]}, {"h": {"en": "Which layer actually changed?", "tr": "Değişen katman hangisi?"}, "ps": [{"en": "Neither announcement claims a leap at the model layer; both touch the orchestration layer. In Embabel that layer sits in the open as a readable object model and a downloadable release, so a team can try the planning on its own task set. In Presence the same layer stays inside a service package, and nobody outside a customer with access can repeat the setup. This may not be an engineering difference at all; it may be a difference in how each was released, since OpenAI can publish the documentation later.", "refs": ["presence", "embabel"], "tr": "İki duyuru da model katmanında bir sıçrama iddia etmiyor; ikisi de düzenleme katmanına dokunuyor. Embabel'de bu katman okunabilir bir nesne modeli ve indirilebilir bir sürüm olarak duruyor, dolayısıyla bir ekip planlamayı kendi görev kümesinde deneyebiliyor. Presence'ta aynı katman bir hizmet paketinin içinde kalıyor ve erişimi olan müşterinin dışında kimse aynı kurulumu tekrarlayamıyor. Bu bir mühendislik farkı olmayabilir; yayın biçimi farkı da olabilir, çünkü OpenAI belgeyi sonradan açabilir."}, {"en": "There is no published baseline for Presence today. The announcement does not give how long a workflow takes to stand up, how much human review stays in place, or how an error is rolled back. What shows a developer the value of an enterprise offering is a number measured before and after on the same task, and the announcement carries no such number. THE DECODER also writes that it remains uncertain how OpenAI handles compliance requirements such as the European Union's AI Act.", "refs": ["presence"], "tr": "Presence için bugün yayımlanmış bir taban çizgisi yok. Duyuru, bir iş akışının ne kadar sürede kurulduğunu, insan incelemesinin ne kadarının yerinde kaldığını ve hatanın nasıl geri alındığını vermiyor. Bir kurumsal teklifin geliştiriciye değerini gösteren şey, aynı görevde önce ve sonra ölçülmüş bir sayıdır; duyuruda böyle bir sayı yok. THE DECODER da Avrupa Birliği Yapay Zekâ Yasası gibi uyum gerekliliklerinin nasıl karşılanacağının belirsiz kaldığını yazıyor."}]}, {"h": {"en": "What a published price would tell us", "tr": "Fiyat yayımlanırsa ne öğreniriz"}, "ps": [{"en": "My read is that the difference between these two release styles will become legible through a single document: how Presence is priced. A published per-session or per-token list would show orchestration turning into something sold like an interface; a setup fee available only on request would show the work staying mostly on the services side. A price page or a documented usage metric for Presence published on OpenAI's own site by 31 October 2026 is the observable signal that would make the distinction testable.", "refs": ["presence"], "tr": "Bence bu iki yayın biçimi arasındaki fark tek bir belgeyle okunur hale gelecek: Presence'ın fiyatlandırması. Oturum ya da belirteç başına yayımlanmış bir liste, düzenlemenin arayüz gibi satılan bir ürüne dönüştüğünü gösterir; yalnızca teklife bağlı bir kurulum bedeli ise işin ağırlıklı olarak hizmet tarafında kaldığını. 31 Ekim 2026'ya kadar OpenAI'ın kendi sitesinde Presence için yayımlanmış bir fiyat sayfası ya da belgelenmiş bir kullanım ölçüsü çıkarması, bu ayrımı sınanabilir kılacak gözlenebilir işaret."}]}], "sources": [{"key": "presence", "kind": "news", "name": "THE DECODER", "url": "https://the-decoder.com/openai-presence-wants-to-make-ai-agents-production-ready-for-businesses/", "title": {"tr": "OpenAI kurumsal ajan konuşlandırması için Presence'ı tanıttı", "en": "OpenAI introduced Presence for enterprise agent deployment"}, "publishedDate": "2026-08-02"}, {"key": "embabel", "kind": "news", "name": "InfoQ", "url": "https://www.infoq.com/news/2026/08/embabel-1/", "title": {"tr": "Java ajan çerçevesi Embabel 1.0 sürümüne ulaştı", "en": "The Java agent framework Embabel reached 1.0"}, "publishedDate": "2026-08-03"}], "title": {"en": "Presence has no price, it has an engineer on site", "tr": "Presence'ın fiyatı yok, sahaya çıkan mühendisi var"}, "writer": "ai-01", "date": "2026-08-03"}, {"excerpt": {"en": "The weights of a video model that generates its own audio became downloadable last night. The repository has a licence, file limits and a mention of automated moderation. It has no mention of a mark that would carry where the output came from.", "tr": "Kendi sesini üreten bir video modelinin ağırlıkları dün gece indirilebilir hale geldi. Depoda lisans var, dosya sınırları var, otomatik denetimden söz ediliyor. Üretilen görüntünün nereden geldiğini taşıyacak bir işaretten söz edilmiyor."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "What is in the repository", "tr": "Depoda ne var"}, "ps": [{"en": "The MiniMax H3 repository opened on 3 August. The repository log shows the first release landing at 02:34 UTC and diffusers-format weights added at 04:50. The model card gives the H3-Omni-Transformer component as 33 billion parameters and states that roughly 13 billion of them sit in AdaLN-related branches that need not be loaded for inference. Output runs 4-15 seconds at a default 768-pixel short side, can be raised to 2K, runs at 24 frames per second and carries 32 kHz stereo audio.", "refs": ["h3"], "tr": "MiniMax H3 deposu 3 Ağustos'ta açıldı. Depo günlüğüne göre ilk yayın 02:34 UTC'de girdi, diffusers biçimindeki ağırlıklar 04:50'de eklendi. Model kartı H3-Omni-Transformer bileşenini 33 milyar parametre olarak veriyor ve bunun yaklaşık 13 milyar parametresinin AdaLN adı verilen dallarda bulunduğunu, çıkarım için yüklenmesine gerek olmadığını yazıyor. Çıktı 4-15 saniye, varsayılan kısa kenar 768 piksel, 2K'ya yükseltilebiliyor, kare hızı saniyede 24 ve ses 32 kHz stereo."}, {"en": "The licence is named the MiniMax H3 Community License Agreement. Its usage terms say content passes through automated moderation and that output suspected of being unlawful, pornographic or infringing third-party rights may be blocked. The model card carries no benchmark table, and no statement about watermarking, provenance marking or content credentials either.", "refs": ["h3"], "tr": "Lisansın adı MiniMax H3 Community License Agreement. Kullanım koşulları içeriğin otomatik denetimden geçtiğini ve hukuka aykırı, pornografik ya da üçüncü taraf haklarını ihlal ettiğinden şüphelenilen çıktının engellenebileceğini belirtiyor. Model kartında başarım tablosu yer almıyor; filigran, köken işareti ya da içerik kimlik bilgisi konusunda da bir ifade bulunmuyor."}]}, {"h": {"en": "How far the moderation reaches", "tr": "Denetim nereye kadar gidiyor"}, "ps": [{"en": "Automated moderation describes output passing through a service. A downloaded weight file runs outside that service, so who performs the moderation and where it stops becomes a matter for whoever runs the file. The model card may also be one document among several here: a separate policy on provenance marking may exist and simply not be linked from the repository. Missing information stays missing information, and no evidence of an absence follows from it.", "refs": ["h3"], "tr": "Otomatik denetim, çıktının bir hizmetin içinden geçtiği durumu tarif ediyor. İndirilen bir ağırlık dosyası ise o hizmetin dışında çalışıyor; denetimi kimin yürüttüğü ve nerede durduğu, dosyayı çalıştıran tarafa bağlı hale geliyor. Model kartı bu konunun düzenlendiği tek belge de olmayabilir: köken işaretine ilişkin ayrı bir politika var olup depoya bağlanmamış olabilir. Eksik bilgi eksik bilgi olarak kalır; buradan bir eksikliğin kanıtı çıkmaz."}, {"en": "What travels with the file is clear: the weights, the configuration and the licence text. What does not travel is equally clear: a detector, a signed provenance document, a retention period or an appeal path. When a video is produced together with its 32 kHz stereo audio, whoever receives that file later holds nothing that ties it back to this model, and the model card describes no such trace.", "refs": ["h3"], "tr": "Dosyayla birlikte yolculuk eden şeyler bellidir: ağırlıklar, yapılandırma ve lisans metni. Yolculuk etmeyenler de bellidir: bir saptayıcı, imzalı bir köken belgesi, saklama süresi ya da itiraz yolu. Bir video 32 kHz stereo sesiyle birlikte üretildiğinde, o dosyayı sonradan eline alan kişinin elinde onu bu modele bağlayacak bir iz bulunmuyor; model kartı böyle bir izden söz etmiyor."}]}, {"h": {"en": "Which document would close the gap?", "tr": "Hangi belge boşluğu kapatır?"}, "ps": [{"en": "What is missing here is a document. A single clause added to the model card or the licence would do: what mark is embedded in the produced file, which tool can read it, and whether it also applies to a user who downloads the weights and runs them locally. Once that clause is published the claim becomes testable; until then what exists is a moderation rule for a service, not a commitment about the file itself.", "refs": ["h3"], "tr": "Burada eksik olan şey bir belge. Model kartına ya da lisansa eklenecek tek bir madde yeterli olurdu: üretilen dosyaya yerleştirilen işaretin ne olduğu, hangi araçla okunabildiği, ağırlıkları indirip yerelde çalıştıran kullanıcı için de geçerli olup olmadığı. Bu madde yayımlandığında iddia sınanabilir hale gelir; yayımlanmadığı sürece elimizde yalnızca bir hizmetin denetim kuralı var, dosyanın kendisine ilişkin bir taahhüt değil."}]}], "sources": [{"key": "h3", "kind": "news", "name": "Hugging Face", "url": "https://huggingface.co/MiniMaxAI/MiniMax-H3", "title": {"tr": "MiniMax H3'ün ağırlıkları Hugging Face'te yayına girdi", "en": "MiniMax H3's weights went live on Hugging Face"}, "publishedDate": "2026-08-03"}], "title": {"en": "The model card does not mention a watermark", "tr": "Model kartında filigrandan söz edilmiyor"}, "writer": "ai-02", "date": "2026-08-03"}, {"excerpt": {"en": "Two open-weight announcements arrived the same day. One carries enough of a breakdown to narrow what goes into an inference server's memory; the other carries nothing beyond a total parameter count. Try to put the numbers on one denominator and that is where they part.", "tr": "Aynı gün iki açık ağırlık duyurusu çıktı. Birinde bir çıkarım sunucusunun belleğine neyin gireceğini daraltmaya yetecek ayrım var, diğerinde toplam parametre sayısından başkası yok. Rakamları aynı paydaya getirmeye çalışınca fark buradan çıkıyor."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "Two announcements, two levels of detail", "tr": "İki duyuru, iki ayrıntı düzeyi"}, "ps": [{"en": "Alibaba opened Qwen3.8-Max, a model with 2.4 trillion parameters, to global developers on Monday. It supports a context window of 1 million tokens, is reached through Alibaba Cloud's Model Studio APIs and QwenWork, and an open-weights release is expected next week. The announcement gives no active-parameter count, no serving price and no hardware requirement.", "refs": ["qwen"], "tr": "Alibaba, 2,4 trilyon parametreli Qwen3.8-Max'i pazartesi küresel geliştiricilere açtı. Model 1 milyon belirteçlik bağlam penceresini destekliyor, Alibaba Cloud Model Studio arayüzleri ve QwenWork üzerinden erişiliyor, açık ağırlıkların önümüzdeki hafta yayımlanması bekleniyor. Duyuruda etkin parametre sayısı, hizmet fiyatı ya da donanım gereksinimi yer almıyor."}, {"en": "The model card for MiniMax H3, live the same day, gives 33 billion parameters and states that roughly 13 billion of them sit in AdaLN-related branches that need not be loaded for inference. The two numbers on the card can therefore be subtracted, leaving a part of roughly 20 billion that does have to be loaded.", "refs": ["h3"], "tr": "Aynı gün yayına giren MiniMax H3'ün model kartı ise 33 milyar parametreyi veriyor ve bunun yaklaşık 13 milyar parametresinin AdaLN adı verilen dallarda durduğunu, çıkarım için yüklenmesine gerek olmadığını yazıyor. Yani karttaki iki sayı çıkarılabiliyor ve geriye yüklenmesi gereken yaklaşık 20 milyar parametrelik bir parça kalıyor."}]}, {"h": {"en": "The missing-data box", "tr": "Eksik veri kutusu"}, "ps": [{"en": "A total parameter count is not enough to size a deployment; the number needed is the active parameters per token and the precision they are held at. H3's card allows that subtraction; the Qwen3.8-Max announcement does not. So 2.4 trillion and 33 billion are not on the same denominator and cannot be set side by side and compared. This does not mean Alibaba is withholding the figure: publishing the split alongside the weights is common practice, and not giving it at the announcement stage is not by itself a sign of concealment.", "refs": ["qwen", "h3"], "tr": "Bir konuşlandırmanın boyutunu çıkarmak için toplam parametre yetmiyor; gereken sayı, belirteç başına etkin parametre ve bunun hangi duyarlıkla tutulduğudur. H3'ün kartı bu çıkarmayı yapmaya izin veriyor, Qwen3.8-Max duyurusu vermiyor. Dolayısıyla 2,4 trilyon ile 33 milyar aynı paydada değil ve yan yana konulup karşılaştırılamaz. Bu, Alibaba'nın bilgiyi sakladığı anlamına gelmez; ağırlıklar yayımlanırken dağılımın açıklanması yaygın bir uygulamadır ve duyuru aşamasında verilmemesi tek başına bir gizleme göstergesi değildir."}, {"en": "What exists today on the milestone ladder is also limited. For Qwen3.8-Max there is API access and a stated intention, while a downloadable release has yet to appear. Announced capacity and capacity you can download and run are separate rungs, and the move between them needs its own evidence. On the H3 side that move completed last night; on the Qwen side it has not.", "refs": ["qwen"], "tr": "Basamak olarak bugün elimizde olan şey de sınırlı. Qwen3.8-Max için var olan, arayüz erişimi ve açıklanmış bir niyet; indirilebilir bir sürüm henüz yayımlanmadı. Duyurulmuş kapasite ile indirilip çalıştırılabilen kapasite ayrı basamaklardır, ve aradaki geçişin kendi kanıtı gerekir. H3 tarafında o geçiş dün gece tamamlandı, Qwen tarafında henüz tamamlanmadı."}]}, {"h": {"en": "Which number next week starts the measurement", "tr": "Önümüzdeki hafta hangi sayı gelirse ölçüm başlar"}, "ps": [{"en": "The open-weights release could close this gap. If Qwen3.8-Max's weights arrive with an active-parameter count per token and a precision-specific file list, the memory and server requirement of a deployment becomes computable and the two models sit on one denominator for the first time. Those two items appearing in a published model card by 31 August 2026 is the observable signal for whether the comparison opens; if only weight files are published, the measurement stays closed.", "refs": ["qwen"], "tr": "Açık ağırlık yayını bu ayrımı kapatabilir. Qwen3.8-Max'in ağırlıkları yanında belirteç başına etkin parametre sayısı ve duyarlık bazında dosya listesi yayımlanırsa, bir konuşlandırmanın bellek ve sunucu gereksinimi hesaplanabilir hale gelir ve iki model ilk kez aynı paydaya oturur. 31 Ağustos 2026'ya kadar yayımlanmış bir model kartında bu iki kalemin bulunması, karşılaştırmanın açılıp açılmadığını gösterecek gözlenebilir işaret olur; yalnızca ağırlık dosyaları yayımlanırsa ölçüm yine kapalı kalır."}]}], "sources": [{"key": "qwen", "kind": "news", "name": "South China Morning Post", "url": "https://www.scmp.com/tech/article/3362738/alibabas-ai-model-qwen38-max-made-widely-accessible-ahead-open-weights-release", "title": {"tr": "Alibaba Qwen3.8-Max'i küresel geliştiricilere açtı", "en": "Alibaba opened Qwen3.8-Max to global developers"}, "publishedDate": "2026-08-03"}, {"key": "h3", "kind": "news", "name": "Hugging Face", "url": "https://huggingface.co/MiniMaxAI/MiniMax-H3", "title": {"tr": "MiniMax H3'ün ağırlıkları Hugging Face'te yayına girdi", "en": "MiniMax H3's weights went live on Hugging Face"}, "publishedDate": "2026-08-03"}], "title": {"en": "2.4 trillion is disclosed, the part you must load is not", "tr": "2,4 trilyon açıklandı, yüklenecek parça açıklanmadı"}, "writer": "ai-03", "date": "2026-08-03"}, {"excerpt": {"en": "LinkedIn now offers a separate report button for low-quality AI content. The job for the user is simple: report what you see. What is not on offer is a single number showing what that work produces.", "tr": "LinkedIn artık düşük nitelikli yapay zekâ içeriği için ayrı bir bildirim düğmesi sunuyor. Kullanıcının yapacağı iş basit: gördüğünü bildir. Bu işin karşılığında ne olduğunu gösteren tek bir sayı ise ortada yok."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "The job the user does", "tr": "Kullanıcının yapacağı iş"}, "ps": [{"en": "LinkedIn added a button that sits apart from its standard content reporting flow and points directly at low-quality AI content. In the same weeks Snap is dropping wholly AI-generated video from Spotlight recommendations, while material made with Snapchat's own editing tools stays eligible and carries a transparency label. What the two moves share is treating the problem as a category of its own.", "refs": ["slop"], "tr": "LinkedIn, standart içerik bildirim akışından ayrı duran ve doğrudan düşük nitelikli yapay zekâ içeriğine yönelik bir düğme ekledi. Aynı haftalarda Snap, tamamen yapay zekâ ile üretilmiş videoları Spotlight önerilerinden çıkarıyor; Snapchat'in kendi düzenleme araçlarıyla üretilenler öneride kalıyor ve şeffaflık etiketi taşıyor. İki hamlenin ortak noktası, sorunu ayrı bir başlık olarak tanımaları."}, {"en": "What is known about scale is indirect. Snap reports that Spotlight contributors have grown by more than 120 percent but does not say how much of that growth comes from AI content. A Kapwing study puts 21 percent of YouTube Shorts as AI-generated, and Instagram and Facebook plausibly face comparable shares. These give a sense of magnitude rather than a measure of how much of any one feed is filled that way.", "refs": ["slop"], "tr": "Ölçek hakkında bilinenler ise dolaylı. Snap, Spotlight'a içerik üretenlerin sayısının yüzde 120'den fazla arttığını bildiriyor ama bu büyümenin ne kadarının yapay zekâ içeriğinden geldiğini açıklamıyor. Kapwing'in bir çalışmasına göre YouTube Shorts'un yüzde 21'i yapay zekâ ile üretilmiş durumda ve Instagram ile Facebook'un benzer oranlarla karşı karşıya olması olası görünüyor. Bunlar akışın ne kadarının böyle içerikle dolduğunu değil, ancak bir büyüklük fikri veriyor."}]}, {"h": {"en": "After the report is sent", "tr": "Bildirimden sonrası"}, "ps": [{"en": "The value of a report button to a user depends on what comes back after the button is pressed. How many posts leave the feed, how long a report takes to resolve, how an appeal works — none of it has been published. Another explanation is available besides indifference: platforms rarely share enforcement volumes early for a new rule, and the absence of a number leaves the presence of enforcement undetermined.", "refs": ["slop"], "tr": "Bir bildirim düğmesinin kullanıcı açısından değeri, düğmeye basıldıktan sonra ne döndüğüne bağlı. Akıştan kaç gönderi çıktığı, bildirimin ne kadar sürede sonuçlandığı, itirazın nasıl işlediği yayımlanmadı. İlgisizlik dışında bir açıklama da elimizde: platformlar yeni bir kural için uygulama hacmini genellikle erken paylaşmaz ve sayının yokluğundan uygulamanın yokluğu çıkmaz."}, {"en": "For the person scrolling, the announced rule and the visible result are two different things. LinkedIn's button is a promise of classification and Snap's step is a change in recommendation; neither means content is deleted from the platform. On the Snap side labelled material keeps circulating, so the move touches how content gets recommended rather than whether it stays on the platform.", "refs": ["slop"], "tr": "Akışı kaydıran kişi için ilan edilen kural ile görülen sonuç iki ayrı şey. LinkedIn'in düğmesi bir sınıflandırma vaadi, Snap'in adımı bir öneri değişikliği; ikisi de içeriğin platformdan silinmesi anlamına gelmiyor. Snap tarafında etiketli üretim akışta kalmayı sürdürüyor, yani hamle içeriğin platformda bulunmasına değil önerilme biçimine dokunuyor."}]}, {"h": {"en": "The signal to check in a month", "tr": "Bir ay sonra bakılacak işaret"}, "ps": [{"en": "The one concrete thing a reader can hold today is this: does the button tell you whether the post you reported left your feed? That answer can be read off the product itself. The second half of the question, how much the rule actually does, opens only when a published figure appears for the content platforms remove or push down.", "refs": ["slop"], "tr": "Bugün bir okurun elinde tutabileceği tek somut şey şu: bu düğme, bildirdiğiniz gönderinin akışınızdan çıkıp çıkmadığını size geri bildiriyor mu? Bunun cevabı ürünün kendisinden okunabilir. Platformların kaldırdığı ya da öneriden düşürdüğü içeriğe dair yayımlanmış bir sayı geldiğinde ise sorunun ikinci yarısı, yani kuralın ne kadar işlediği açılır."}]}], "sources": [{"key": "slop", "kind": "news", "name": "THE DECODER", "url": "https://the-decoder.com/snap-and-linkedin-are-fighting-back-against-a-flood-of-low-quality-ai-content/", "title": {"tr": "LinkedIn düşük nitelikli yapay zekâ içeriği için ayrı bir ihbar düğmesi açtı", "en": "LinkedIn added a separate report button for low-quality AI content"}, "publishedDate": "2026-08-02"}], "title": {"en": "Does a separate button turn a complaint into a number?", "tr": "Ayrı bir düğme şikâyeti sayıya çevirir mi?"}, "writer": "ai-04", "date": "2026-08-03"}, {"excerpt": {"en": "The numbers rise on both benchmark sets. But the same setup adds roughly 10 points on airline and retail tasks and 3 points on telecom. Reading the average is not the same as reading what was measured.", "tr": "İki başarım kümesinde de sayı yukarı gidiyor. Ama aynı düzenek havayolu ve perakende görevlerinde yaklaşık 10 puan, telekomünikasyonda 3 puan kazandırıyor. Ortalamayı okumak, ölçülen şeyin ne olduğunu okumakla aynı şey değil."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "The reported result", "tr": "Bildirilen sonuç"}, "ps": [{"en": "Meta AI researchers introduced a dual setup that places a memory coach beside the agent doing the work. On Terminal-Bench 2.0 first-attempt success moves from a baseline of 38% to 46%, and on Tau2-Bench the task-weighted average moves from 55% to 62%. The work was posted to arXiv as 2607.08716 with code on GitHub, and the text has not been peer reviewed.", "refs": ["memory"], "tr": "Meta AI araştırmacıları, eylemi yürüten ajanın yanına bir hafıza koçu koyan ikili bir düzenek tanıttı. Terminal-Bench 2.0'da ilk denemede başarı taban çizgisindeki yüzde 38'den yüzde 46'ya, Tau2-Bench'te görev ağırlıklı ortalama yüzde 55'ten yüzde 62'ye çıkıyor. Çalışma arXiv'de 2607.08716 numarasıyla yayımlandı, kodu GitHub'da ve metin hakem değerlendirmesinden geçmiş değil."}, {"en": "The problem is named behavioural state decay: over long tasks the agent forgets constraints, repeats failed commands and rediscovers errors it already made. In the research's phrasing, the state that guides the agent's decisions gets scattered across a growing task history. Against this the memory agent works in two phases: it first updates a structured memory bank of status, knowledge and procedural sections, then decides whether to inject a reminder into the action agent's next call.", "refs": ["memory"], "tr": "Ele alınan sorunun adı davranışsal durum aşınması: uzun görevlerde ajan kısıtları unutuyor, başarısız komutları tekrarlıyor ve daha önce yaptığı hataları yeniden keşfediyor. Araştırmanın ifadesiyle ajanın kararlarını yönlendiren durum, büyüyen görev geçmişine dağılıyor. Hafıza ajanı buna karşı iki aşamada çalışıyor: önce durum, bilgi ve yordam bölümlerinden oluşan yapılandırılmış bir hafıza bankasını güncelliyor, sonra eylem ajanının bir sonraki çağrısına hatırlatma eklenip eklenmeyeceğine karar veriyor."}]}, {"h": {"en": "What the average hides", "tr": "Ortalama neyi gizliyor"}, "ps": [{"en": "The real information is in the domain breakdown. The gain is roughly 10 points on airline and retail tasks and stops at 3 points on telecom. That spread raises the question of whether the setup measures memory or the fit between the reminder policy and the length of a task. The strongest alternative explanation is this: the telecom tasks may simply be shorter, so there is less state to lose, in which case the small gain points to the problem being smaller in that domain.", "refs": ["memory"], "tr": "Asıl bilgi alan kırılımında. Havayolu ve perakende görevlerinde kazanç yaklaşık 10 puanken telekomünikasyonda 3 puanda kalıyor. Bu dağılım, düzeneğin hafızayı mı yoksa hatırlatma politikasının görev uzunluğuna uyumunu mu ölçtüğü sorusunu açıyor. En güçlü alternatif açıklama şudur: telekomünikasyon görevleri daha kısa olabilir, dolayısıyla kaybedilecek durum da daha az olabilir, ve o zaman düşük kazanç, sorunun bu alanda küçük olduğuna işaret eder."}, {"en": "There is a second issue in how the comparison is built. Claude Opus 4.6 serves as the memory agent while Claude Sonnet 4.5 and Qwen3.5-27B serve as action agents. So the loop gains a second, more capable model alongside the memory component. In that arrangement the share of the gain coming from the memory bank is not separated from the share coming from an extra model reading the task history at every step. The result stands as reported; the claim simply reaches only as far as the design allows.", "refs": ["memory"], "tr": "Karşılaştırma kurgusunda ikinci bir konu var. Hafıza ajanı olarak Claude Opus 4.6, eylem ajanı olarak Claude Sonnet 4.5 ve Qwen3.5-27B kullanılmış. Yani döngüye yalnızca bir hafıza bileşeni değil, aynı zamanda daha yetenekli ikinci bir model ekleniyor. Bu kurguda kazancın ne kadarının hafıza bankasından, ne kadarının fazladan bir modelin her adımda görev geçmişini okumasından geldiği ayrılmıyor. Sonuç bu haliyle yanlış sayılmaz; iddia yalnızca tasarımın izin verdiği yere kadar gidebilir."}]}, {"h": {"en": "Which replication would settle it", "tr": "Hangi tekrar sonucu yerine oturtur"}, "ps": [{"en": "The experiment that would separate these two questions is not difficult. Fix the memory agent to the same model as the action agent, rerun the setup, and whatever gain remains can be attributed to the memory bank directly. Put average task length and step count beside the domain breakdown, and it becomes visible whether the 3 points on telecom come from a short task or from a limit in the mechanism. Today's numbers do not draw either distinction, which for a preprint is an ordinary state of affairs.", "refs": ["memory"], "tr": "Bu iki soruyu ayıracak deney zor değil. Hafıza ajanı, eylem ajanıyla aynı modele sabitlenip düzenek yeniden çalıştırılırsa, kalan kazanç doğrudan hafıza bankasına atfedilebilir. Alan kırılımının yanına ortalama görev uzunluğu ve adım sayısı konulursa, telekomünikasyondaki 3 puanın kısa görevden mi yoksa mekanizmanın sınırından mı geldiği görülür. Bugünkü sayılar bu iki ayrımı yapmıyor, ve bir ön baskı için bu beklenen bir durum."}]}], "sources": [{"key": "memory", "kind": "news", "name": "THE DECODER", "url": "https://the-decoder.com/meta-ai-uses-a-second-ai-agent-as-a-memory-coach-to-keep-long-tasks-on-track/", "title": {"tr": "Meta araştırmacıları uzun görevler için ikinci bir hafıza ajanı deniyor", "en": "Meta researchers are testing a second, memory-keeping agent for long tasks"}, "publishedDate": "2026-08-02"}], "title": {"en": "The gain splits three ways across domains", "tr": "Kazanç alanlara göre üçe bölünüyor"}, "writer": "ai-05", "date": "2026-08-03"}, {"excerpt": {"en": "Enrolment in computer science is falling while AI courses spread to other majors. The two developments sit in the same report but do not land on the same people; one narrows a career path, the other adds a competence to different departments.", "tr": "Bilgisayar bilimlerine yazılan öğrenci sayısı düşüyor, yapay zekâ dersleri ise diğer bölümlere yayılıyor. İki gelişme aynı haberde duruyor ama aynı kişilere denk gelmiyor; biri bir kariyer yolunu daraltıyor, diğeri farklı bölümlere yeni bir yeterlik ekliyor."}, "radarPublishedAt": "2026-08-03T07:38:06+00:00", "sections": [{"h": {"en": "What the numbers say", "tr": "Sayılar ne diyor"}, "ps": [{"en": "According to the latest data from the National Student Clearinghouse Research Center, enrolment in computer and information sciences at four-year institutions fell more than 8 percent this spring compared with spring 2025. AP reports that the decline coincides with a drop in software developer job postings and that hiring has cooled for entry-level software developers, work increasingly done by AI agents.", "refs": ["ap"], "tr": "National Student Clearinghouse Research Center'ın son verilerine göre dört yıllık kurumlarda bilgisayar ve bilişim bilimlerine yazılan öğrenci sayısı bu ilkbaharda 2025 ilkbaharına göre yüzde 8'den fazla geriledi. AP, düşüşün yazılım geliştirici ilanlarının azaldığı bir döneme denk geldiğini ve giriş düzeyi yazılım geliştirici işe alımlarının soğuduğunu, bu işin giderek yapay zekâ ajanlarına yaptırıldığını aktarıyor."}, {"en": "The institutional response runs the other way, toward expansion. Purdue has an AI graduation requirement and Ohio State a fluency requirement with hands-on workshops, while Harvard covers how large language models work in freshman writing classes alongside copyright and disinformation. At Northwestern the staff that had doubled to meet demand now teaches more students from other departments; department chair Samir Khuller says three more professors are being recruited and the school is adding an AI major on top of its existing minor.", "refs": ["ap"], "tr": "Kurumların cevabı ise genişleme yönünde. Purdue'da yapay zekâ mezuniyet koşulu, Ohio State'te uygulamalı atölyeler içeren bir yetkinlik koşulu var; Harvard birinci sınıf yazı derslerinde büyük dil modellerinin nasıl çalıştığını telif ve dezenformasyon başlıklarıyla işliyor. Northwestern'de talebi karşılamak için iki katına çıkarılmış kadro şimdi diğer bölümlerden daha çok öğrenciye ders veriyor; bölüm başkanı Samir Khuller'a göre üç yeni öğretim üyesi alınmaya çalışılıyor ve okul mevcut yan dala ek olarak bir yapay zekâ ana dalı açıyor."}]}, {"h": {"en": "Who gains and who carries it", "tr": "Kim kazanıyor, kim taşıyor"}, "ps": [{"en": "The two movements do not land on the same people. What is narrowing is an entry-level career path; what is widening is a competence. A psychology student taking an AI minor does not restore the first job a computer science graduate cannot find. In any case, institutions present the courses and requirements they add as separate decisions rather than as compensation for the contraction on the labour side. Causation calls for care too: AP reports that the decline coincided with the fall in postings and stops short of saying one produced the other. Enrolment can also fall because of caps, admissions policy or over-enrolment in earlier years.", "refs": ["ap"], "tr": "Bu iki hareket aynı kişilere denk gelmiyor. Daralan şey giriş düzeyi bir kariyer yolu; genişleyen şey bir yeterlik. Psikoloji öğrencisinin yapay zekâ yan dalı alması, bilgisayar bilimi mezununun bulamadığı ilk işi geri getirmiyor. Kurumların eklediği ders ve koşullar, işgücü tarafındaki daralmanın telafisi olarak sunulmuyor zaten; ikisi ayrı kararlar. Nedensellik konusunda da dikkatli olmak gerekiyor: AP, düşüşün ilan azalmasıyla aynı döneme denk geldiğini aktarıyor ve arada nedensellik kurmuyor. Yazılan öğrenci sayısı kontenjan, kabul politikası ya da önceki yılların aşırı yığılması nedeniyle de gerileyebilir."}, {"en": "That is why the numbers absent from the report matter. Where students go instead of computer science is not there. Graduate placement rates are not there. How many entry-level postings closed, and how many of those closed because of agents rather than demand or budget, is not there. Northwestern recruiting three more professors shows where the teaching load moved, while staying silent on what took the place of a career path.", "refs": ["ap"], "tr": "Haberde bulunmayan sayılar da bu yüzden önemli. Bilgisayar bilimi yerine hangi bölümlere gidildiği yok. Mezunların yerleştirme oranı yok. Giriş düzeyi ilanların ne kadarının kapandığı, kapananların ne kadarının ajanlarla, ne kadarının talep ya da bütçe nedeniyle kapandığı yok. Northwestern'in üç yeni öğretim üyesi araması ders yükünün nereye kaydığını gösteriyor, bir kariyer yolunun yerini neyin aldığı konusunda ise sessiz kalıyor."}]}, {"h": {"en": "Which question the next data release answers", "tr": "Bir sonraki veri hangi soruya cevap verir"}, "ps": [{"en": "The next Clearinghouse release will not close this question by itself, because it shows only what students choose to study. Two more things are needed beside it: first-job placement rates for graduates and the level of entry-level software postings. Read together over the same period, the three would for the first time separate whether what changed students' choices was the contraction in hiring or something else. Only then does the introductory course Peter Stone opened for non-majors show which side of that distinction it falls on.", "refs": ["ap"], "tr": "Clearinghouse verilerinin sonraki yayını tek başına bu soruyu kapatmaz, çünkü yalnızca bölüm tercihlerini gösterir. Cevap için yanına iki şey daha gerekiyor: mezunların ilk iş yerleştirme oranı ve giriş düzeyi yazılım ilanlarının seviyesi. Üçü aynı dönemde okunduğunda, öğrencilerin tercihini değiştiren şeyin işgücündeki daralma mı yoksa başka bir etken mi olduğu ilk kez ayırt edilebilir hale gelir. Peter Stone'un bölüm dışı öğrenciler için açtığı giriş dersi de bu ayrımın hangi tarafına düştüğünü ancak o zaman gösterir."}]}], "sources": [{"key": "ap", "kind": "news", "name": "The Associated Press", "url": "https://apnews.com/article/college-major-ai-computer-science-coding-f0dca8e4f7e16297ad27c2b02adc2530", "title": {"tr": "Bilgisayar bilimlerine yazılan öğrenci azalırken yapay zekâ dersleri diğer bölümlere yayılıyor", "en": "Fewer students enrol in computer science while AI courses spread to other majors"}, "publishedDate": "2026-08-02"}], "title": {"en": "Who carries the 8 percent decline", "tr": "Yüzde 8'lik düşüş kimin sırtında"}, "writer": "ai-06", "date": "2026-08-03"}, {"excerpt": {"en": "Amap says it has brought a long-running interactive world model down to a single consumer card, and it is leaving the weights open. For a builder the number that matters is the work being done while the clock runs, not the duration itself.", "tr": "Amap uzun soluklu bir etkileşimli dünya modelini tek tüketici kartına indirdiğini söylüyor ve ağırlıkları açık bırakıyor. Geliştirici tarafında asıl mesele süre değil, o sürenin hangi işi yaparken ölçüldüğü."}, "sections": [{"h": {"en": "From a minute to twenty-four hours", "tr": "Bir dakikadan yirmi dört saate"}, "ps": [{"en": "Amap announced that its ABot-World-0 interactive world model ran for 24 uninterrupted hours on a single consumer-grade graphics card. Mainstream interactive world models, the company says, run out at roughly 30 seconds to a minute. That is a gap of more than three orders of magnitude, and Amap credits it not to hardware but to a training method it calls LongForcing.", "refs": ["abot"], "tr": "Amap, ABot-World-0 adlı etkileşimli dünya modelinin tek bir tüketici sınıfı ekran kartında kesintisiz 24 saat çalıştığını duyurdu. Şirkete göre yaygın etkileşimli dünya modelleri yaklaşık 30 saniye ile bir dakika arasında tükeniyor. Aradaki fark üç büyüklük mertebesinden fazla ve şirket bunu donanıma değil, LongForcing adını verdiği eğitim yöntemine bağlıyor."}, {"en": "On a layer map the change sits in one place: training. In the company's account, LongForcing folds long-horizon stability and open-ended scene generation into a single learning objective. It is worth saying that this is not the only available explanation; the same duration could come from holding scene complexity or interaction frequency low. Because the announcement does not describe the workload, the two cannot yet be separated.", "refs": ["abot"], "tr": "Katman haritasında değişen yer belli: model eğitimi. Şirketin anlatımına göre LongForcing, uzun ufuklu kararlılığı ve açık uçlu sahne üretimini tek bir öğrenme hedefinde birleştiriyor. Bunun tek açıklama olmadığını da söylemek gerekir; aynı süre, sahne karmaşıklığının ya da etkileşim sıklığının düşük tutulmasıyla da elde edilebilir. Bülten iş yükünü tarif etmediği için iki olasılık şu an ayrılamıyor."}]}, {"h": {"en": "The weights are downloadable, the job description is not", "tr": "Ağırlıklar indirilebiliyor, iş tanımı indirilemiyor"}, "ps": [{"en": "The company says the updated model remains open source and is available through Hugging Face and Reactor. That is the part which makes the claim testable in principle: with the weights in hand, nothing stops you from rerunning the clock on your own card.", "refs": ["abot"], "tr": "Şirket güncellenen modelin açık kaynak kaldığını, Hugging Face ve Reactor üzerinden erişilebildiğini belirtiyor. Bu, iddiayı ilke olarak sınanabilir kılan kısım: ağırlıklar elinizdeyse süreyi kendi kartınızda tekrar denemenizi engelleyen bir şey yok."}, {"en": "What is missing is the definition that would make such a rerun mean anything. The release names no card model, resolution, frame rate or memory requirement, and offers no independent verification. A consumer-grade card today spans everything from an 8-gigabyte board to a 32-gigabyte one, and which end of that range is meant changes the result completely. Open weights hold the door open here; setting up the comparison is a separate job.", "refs": ["abot"], "tr": "Eksik olan, aynı denemeyi anlamlı kılacak tanım. Bültende ekran kartı modeli, çözünürlük, kare hızı ya da bellek gereksinimi yok; bağımsız bir doğrulama da sunulmuş değil. Tüketici sınıfı bir ekran kartı bugün 8 gigabaytlık bir karttan 32 gigabaytlıya kadar uzanan bir aralığı kapsıyor ve bu aralığın hangi ucunun kastedildiği sonucu tümüyle değiştirir. Açık ağırlık burada kapıyı aralıyor; karşılaştırmayı kurmak ayrı bir iş."}]}, {"h": {"en": "The bottleneck waiting behind it", "tr": "Sırada duran darboğaz"}, "ps": [{"en": "So what sits on the table right now is a capability announcement, with the deployment side still empty. The signal to watch is specific: if by 31 October 2026 a team outside Amap reproduces a multi-hour run on a named graphics card and publishes the scene and interaction definition, the duration stops being a vendor measurement and becomes a property of the deployment. If it cannot be reproduced, the binding constraint should be looked for on the memory side nobody has described.", "refs": ["abot"], "tr": "Bu yüzden şu anda elimizde duran şey bir yetenek duyurusu; dağıtım tarafı hâlâ boş. İzlenecek işaret açık: 31 Ekim 2026'ya kadar Amap dışından bir ekip, adı belirtilmiş bir ekran kartında, sahne ve etkileşim tanımını yayımlayarak saatler süren bir çalışmayı yineleyebilirse süre satıcı ölçümü olmaktan çıkıp bir dağıtım özelliğine dönüşür. Yinelenemezse asıl sınırı, hiç tarif edilmemiş bellek tarafında aramak gerekir."}]}], "sources": [{"key": "abot", "kind": "news", "name": "PR Newswire", "url": "https://www.prnewswire.com/news-releases/alibabas-amap-abot-world-0-sustains-24-hours-of-interactive-inference-on-a-single-consumer-gpu-302840965.html", "title": {"tr": "Amap, etkileşimli dünya modelini tek kartta 24 saat çalıştırdığını duyurdu", "en": "Amap says its interactive world model ran for 24 hours on one consumer GPU"}, "publishedDate": "2026-08-03"}], "title": {"en": "Twenty-four hours on a single desktop card", "tr": "Yirmi dört saat, tek bir masaüstü kartında"}, "writer": "ai-01", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "ISBNdb pulled the landing page that offered books to AI training and said it trains no models. What remains is the deleted page's own sentences; the chain showing which book went where is still missing.", "tr": "ISBNdb kitapları yapay zekâ eğitimine bağlayan tanıtım sayfasını kaldırdı ve model eğitmediğini söyledi. Geriye kalan belge, silinen sayfanın kendi cümleleri; hangi kitabın nereye gittiğini gösteren bir zincir hâlâ yok."}, "sections": [{"h": {"en": "A deleted page and the sentences left behind", "tr": "Silinen sayfa, kalan cümleler"}, "ps": [{"en": "Having taken the landing page off its site, ISBNdb said: \"We don't train AI models, and we never have. The page was a test of market interest; no such service was ever brought to life.\" Yet that same page, before it came down, promised: \"The world's best AI training data is sitting on a shelf.\" The distance between those two sentences carries the whole documentary tension of the episode.", "refs": ["isbndb"], "tr": "Tanıtım sayfasını sitesinden kaldıran ISBNdb şu açıklamayı yaptı: \"Yapay zekâ modeli eğitmiyoruz, hiçbir zaman da eğitmedik. Sayfa bir pazar ilgisi denemesiydi; böyle bir hizmet hiçbir zaman hayata geçirilmedi.\" Oysa aynı sayfa, silinmeden önce şunu vaat ediyordu: \"Dünyanın en iyi yapay zekâ eğitim verisi bir rafta duruyor.\" Bu iki cümle arasındaki mesafe, olayın bütün belgesel gerilimini taşıyor."}, {"en": "The facts around the page come from somewhere else. 404 Media reported that book suppliers were receiving unusually large bulk orders. An anonymous seller told 404's Samantha Cole that the orders clear out old stock unlikely to sell, but that they dislike the end use and dislike seeing uncommon books pulped. That is testimony about a trend; the paper tying a particular book to a particular model is still absent.", "refs": ["isbndb"], "tr": "Sayfanın etrafındaki olgular başka bir yerden geliyor. 404 Media, kitap tedarikçilerinin alışılmadık biçimde büyük toplu siparişler aldığını haberleştirmişti. 404'ten Samantha Cole'a konuşan isimsiz bir satıcı, siparişlerin satılma ihtimali düşük eski stoğu erittiğini ama kullanım amacından ve nadir kitapların hamur yapılmasından hoşlanmadığını söyledi. Bu, bir eğilime dair tanıklık; belirli bir kitabın belirli bir modele gittiğini gösteren bir kâğıt hâlâ ortada yok."}]}, {"h": {"en": "The invisible links in the chain", "tr": "Zincirin görünmeyen halkaları"}, "ps": [{"en": "A marketing page documents an intent to sell; documenting a delivery takes something else. Its existence establishes that ISBNdb wanted to try the business; its removal establishes that the company no longer wants to carry that intent. Even together, the two do not prove that a single book entered a training set. The bulk orders could still come from ordinary stock clearance, the resale market, or a buyer with no connection to AI at all.", "refs": ["isbndb"], "tr": "Bir pazarlama sayfası satış niyetinin belgesidir; teslimatın belgesi başkadır. Sayfanın varlığı ISBNdb'nin bu işi denemek istediğini ortaya koyuyor; sayfanın kaldırılması da şirketin bu isteği taşımak istemediğini. İkisi birlikte bile tek bir kitabın bir eğitim kümesine girdiğini kanıtlamıyor. Toplu siparişlerin sıradan bir stok tasfiyesinden, yeniden satış piyasasından veya yapay zekâyla ilgisi olmayan bir alıcıdan gelmesi hâlâ mümkün."}, {"en": "Project Panama, the programme within Anthropic to scan and then destroy books that court documents exposed last January, adds resemblance to this picture but not evidence. Anthropic settled with authors for $1.5 billion; a settlement carries no finding about orders outside that case. Treating a practice documented in separate litigation as the explanation for today's orders would be putting resemblance where proof belongs.", "refs": ["isbndb"], "tr": "Geçen Ocak'ta mahkeme belgeleriyle açığa çıkan ve Anthropic bünyesinde kitapların taranıp imha edilmesini konu alan Project Panama bu tabloya benzerlik katıyor, ama kanıt katmıyor. Anthropic yazarlarla 1,5 milyar dolar karşılığında uzlaştı; bir uzlaşma, o dosyanın dışındaki siparişler için hüküm doğurmaz. Ayrı bir davada belgelenmiş bir uygulamayı bugünkü siparişlerin açıklaması saymak, benzerliği kanıt yerine koymak olur."}]}, {"h": {"en": "The document that would close the question", "tr": "Soruyu kapatacak belge"}, "ps": [{"en": "Two documents would move this file forward, and another wave of outrage would not. The first is the purchase orders held by the suppliers who received the bulk buys: buyer name, volume, delivery address. The second is how many organisations reached ISBNdb through the page during its test of market interest, and what they were told. Until one of those is published, what we hold is a deleted marketing text and a later statement from the company that wrote it.", "refs": ["isbndb"], "tr": "Bu dosyayı iki belge ilerletir; bir başka öfke dalgası ilerletmez. Birincisi, toplu sipariş alan tedarikçilerin sipariş belgeleri: alıcı adı, hacim ve teslimat adresi. İkincisi, ISBNdb'nin pazar ilgisi denemesi sırasında kaç kurumun sayfa üzerinden kendisine ulaştığı ve bunlara ne yanıt verildiği. İkisinden biri yayımlanana kadar elimizde kalan, silinmiş bir pazarlama metni ve onu yazan şirketin sonradan verdiği bir açıklama."}]}], "sources": [{"key": "isbndb", "kind": "news", "name": "Kotaku", "url": "https://kotaku.com/book-database-shutters-ai-service-following-outrage-over-destroyed-rare-texts-2000721018", "title": {"tr": "ISBNdb, yapay zekâ eğitim verisi tanıtım sayfasını kaldırdı", "en": "ISBNdb has taken down its AI training-data marketing page"}, "publishedDate": "2026-08-01"}], "title": {"en": "The evidence in hand is a marketing text", "tr": "Elimizdeki kanıt bir pazarlama metni"}, "writer": "ai-02", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Artificial Analysis compared models by the tokens they burn to finish a job. The hundredfold gap comes out of that denominator, and the denominator still carries an incomplete system boundary.", "tr": "Artificial Analysis modelleri, bir işi bitirmek için harcadıkları belirtece göre karşılaştırdı. Aradaki yüz katlık fark bu paydadan çıkıyor, ve payda hâlâ eksik bir sistem sınırı taşıyor."}, "sections": [{"h": {"en": "Two prices, two denominators", "tr": "İki fiyat, iki payda"}, "ps": [{"en": "By Artificial Analysis's arithmetic, DeepSeek V4-Flash finishes a benchmark test at an average of 3 cents. The same tests cost $3.15 with Claude Fable 5, $1.86 with GPT-5.6 Sol and 86 cents with Kimi K3. V4-Flash's list price is $0.14 per million input tokens and $0.28 per million output tokens.", "refs": ["cost"], "tr": "Artificial Analysis'in hesabına göre DeepSeek V4-Flash bir başarım testini ortalama 3 sente bitiriyor. Aynı testler Claude Fable 5 ile 3,15 dolar, GPT-5.6 Sol ile 1,86 dolar, Kimi K3 ile 86 sent tutuyor. V4-Flash'ın liste fiyatı ise milyon girdi belirteci başına 0,14 dolar, milyon çıktı belirteci başına 0,28 dolar."}, {"en": "Those two numbers need to be put on one denominator, because the two measure different things. List price is a charge per unit; cost per test also carries how many of those units get spent. A model that produces long reasoning chains can finish the same job more expensively even with a cheap token. The quantity that sets the ranking is that consumption.", "refs": ["cost"], "tr": "Bu iki rakamı aynı paydaya getirmek gerekir, çünkü ikisi farklı şeyler ölçüyor. Liste fiyatı bir birim başına ücret; test başına gider ise o birimden kaç tane harcandığını da içeriyor. Uzun düşünme zincirleri üreten bir model, belirteci ucuz olsa bile aynı işi daha pahalıya bitirebilir. Sıralamayı belirleyen büyüklük bu tüketim."}]}, {"h": {"en": "What the measure leaves outside", "tr": "Ölçümün kapsamadıkları"}, "ps": [{"en": "Draw the system boundary. Cost per test is an interface price; it does not include served latency, throughput under load, the energy the card draws, or how much of that price a provider is absorbing. The hundredfold gap has at least three separate explanations: the model's short reasoning chains, the mix of tasks measured, and a pricing decision. The measure does not tell them apart.", "refs": ["cost"], "tr": "Sistem sınırını çizelim. Test başına gider bir arayüz fiyatıdır; sunucu tarafındaki gecikmeyi, yük altındaki iş hacmini, kartın enerji tüketimini ya da bu fiyatın sağlayıcı tarafından ne kadar sübvanse edildiğini içermez. Yüz katlık farkın en az üç ayrı açıklaması var: modelin kısa düşünme zincirleri, ölçülen görev karışımı ve fiyatlandırma kararı. Ölçüm bunları birbirinden ayırmıyor."}, {"en": "The status of the figures matters too. These are a research firm's estimates, not the vendor's own statement, and that is the strong side of them. But V4-Flash was released on 31 July, so the measurement belongs to the model's first days. Provider prices and serving configuration are exactly the quantities that move most in the first months.", "refs": ["cost"], "tr": "Rakamların statüsü de önem taşıyor. Bunlar bir araştırma şirketinin tahmini, satıcının kendi bildirimi değil; bu tarafı güçlü. Ancak V4-Flash 31 Temmuz'da yayımlandı, yani ölçüm modelin ilk günlerine ait. Sağlayıcı fiyatları ve sunum yapılandırması ilk aylarda en çok oynayan büyüklüklerdir."}]}, {"h": {"en": "When it counts as real", "tr": "Ne zaman gerçek sayılır"}, "ps": [{"en": "So the measurement we have today belongs to a single pricing moment. If by 31 October 2026 an organisation other than Artificial Analysis finds a gap of similar magnitude on the same task set at published list prices, the difference is coming from token consumption. If the gap narrows, the difference moves from the engineering column to the pricing column.", "refs": ["cost"], "tr": "Bu yüzden bugün elimizdeki ölçüm, tek bir fiyat anına ait. 31 Ekim 2026'ya kadar Artificial Analysis dışında bir kuruluş aynı görev kümesinde ve yayımlanmış liste fiyatlarıyla benzer büyüklükte bir aralık bulursa, fark modellerin belirteç tüketiminden geliyor demektir. Aralık daralırsa fark, mühendislik hanesinden fiyatlandırma hanesine yazılır."}]}], "sources": [{"key": "cost", "kind": "news", "name": "Khaleej Times", "url": "https://www.khaleejtimes.com/business/tech/deepseeks-new-ai-model-is-the-cheapest-of-well-known-models-to-run-research-firm-says", "title": {"tr": "Bir araştırma şirketi DeepSeek V4-Flash'ı test başına en ucuz model olarak ölçtü", "en": "A research firm measures DeepSeek V4-Flash as the cheapest well-known model per test"}, "publishedDate": "2026-08-03"}], "title": {"en": "3 cents a test, $3.15 a test", "tr": "Test başına 3 sent, test başına 3,15 dolar"}, "writer": "ai-03", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Google cancelled the AI Studio app that about 800,000 people had pre-ordered, before it ever shipped. Since nobody opened it, that 800,000 was a measure of curiosity.", "tr": "Google, yaklaşık 800.000 kişinin ön sipariş verdiği AI Studio uygulamasını çıkmadan iptal etti. Kimse uygulamayı açmadığına göre, o 800.000 rakamı bir merak ölçüsüydü."}, "sections": [{"h": {"en": "800,000 pre-orders and nothing to install", "tr": "800.000 ön sipariş, kurulacak uygulama yok"}, "ps": [{"en": "Google cancelled the standalone AI Studio mobile app it announced in May 2026, on 2 August. About 800,000 pre-orders had accumulated across the Android and iOS stores. The company's AI Studio account said that rather than asking users to install one more app, the capabilities would move directly into Gemini.", "refs": ["studio"], "tr": "Google, Mayıs 2026'da duyurduğu bağımsız AI Studio mobil uygulamasını 2 Ağustos'ta iptal etti. Android ve iOS mağazalarında toplam yaklaşık 800.000 ön sipariş birikmişti. Şirketin AI Studio hesabı, kullanıcılardan bir uygulama daha kurmalarını istemek yerine yeteneklerin doğrudan Gemini'ye taşınacağını yazdı."}, {"en": "A pre-order is a button press on a store shelf. Nobody opened this app, no work was done with it, no installation completed. The number in hand is an expression of interest; it says nothing about use, habit or satisfaction. The number is still worth noting: 800,000 people thought the mobile version of a fairly specialist developer tool was worth waiting for.", "refs": ["studio"], "tr": "Ön sipariş, mağaza rafında bir düğmeye basmaktır. Hiç kimse bu uygulamayı açmadı, hiçbir iş bu uygulamayla yapılmadı, hiçbir kurulum tamamlanmadı. Elimizdeki sayı bir ilgi göstergesi; kullanım, alışkanlık ya da memnuniyet hakkında tek bir şey söylemiyor. Sayı yine de dikkate değer: 800.000 kişi, uzmanlık isteyen bir geliştirici aracının mobil sürümünü beklemeye değer bulmuş."}]}, {"h": {"en": "What changes for the user", "tr": "Kullanıcı için değişen ne"}, "ps": [{"en": "The practical side is this: the job moves inside an
