s its findings as the first molecular confirmation of that transfer. When a claim moves from testimony to material evidence, what changes is less its degree of truth than the ground of the argument: objections built on the reliability of a written source no longer land in the same place.", "refs": ["pox"]}]}, {"h": {"tr": "İki yüzyıl yavaş, sonra hızlı", "en": "Two centuries slow, then fast"}, "ps": [{"tr": "Ekibin bildirdiği ikinci bulgu daha ilginç ve daha kırılgan. Virüs, sömürge genişlemesiyle çakışan yaklaşık iki yüzyıl boyunca yavaş bir genom evrimi gösteriyor; ardından yaygın aşılama dönemi çevresinde mutasyon oranı hızlanıyor. Bir okuma, virüsün yayılmak için yeterince iyi bir biçime ulaştığı ve daha fazla uyarlanmaya ihtiyaç duymadığı yönünde.", "en": "The team's second finding is more interesting and more fragile. The virus shows slow genome evolution across roughly two centuries coinciding with colonial expansion, after which the mutation rate accelerates around the period of widespread vaccination. One reading is that the virus reached a form good enough to spread and needed no further adaptation.", "refs": ["pox"]}, {"tr": "Araştırmacılar burada durup kendileri sınırı çiziyor: bu örtüşme için düzgün bir nedensellikten söz edilemez, ancak bağıntı en azından dikkat çekicidir. Bu ihtiyat yerinde, çünkü aynı örüntüyü daha sıradan bir şey de üretebilir: farklı dönemlerden elde edilen genom sayısı eşit değildir ve örnekleme yoğunluğundaki değişim, gerçek bir oran değişimi olmadan da hızda görünür bir kayma yaratabilir. Molekül tanıklıktan daha az konuşkan değil; yalnızca farklı bir dilde yanılıyor.", "en": "The researchers stop here and draw the line themselves: no proper causation can be claimed for the overlap, though the correlation is at least notable. That caution is well placed, because something more prosaic can produce the same pattern: the number of genomes recovered from different periods is not equal, and a change in sampling density can create an apparent shift in rate without any real change in rate. The molecule is no less talkative than testimony; it simply errs in a different language.", "refs": ["pox"]}]}, {"h": {"tr": "İki kanıt türünün birbirini denetlediği yer", "en": "Where two kinds of evidence check each other"}, "ps": [{"tr": "Bu köşenin 25 Temmuz tarihli yazısında, veba genomlarının yaklaşık 5.300 yıl öncesinin yazısız Avrasya'sını okunur kıldığını savunmuştum. Şili'deki iki mezar aynı aleti bu kez yazılı kaynağın bol olduğu bir döneme sokuyor ve önemli olan da bu: tarih öncesinde genom tek tanıktı, burada ikinci tanık. İki kanıt türü aynı olaya farklı yerlerden bakıyor ve birbirini denetleyebiliyor. Bu denetimin ilk sınavı da belli: aynı dönemden daha çok genom elde edildiğinde bildirilen hız değişiminin ayakta kalıp kalmadığı görülecek. Bir salgının kimden kime geçtiğine dair beş yüzyıllık bir tartışmanın artık hem kimin anlattığına hem de kimin kemiğinde ne kaldığına bakılarak sürdürülebilmesi, geçmişi kimin adına konuştuğumuz sorusunu da sessizce değiştiriyor.", "en": "In this column's 25 July piece I argued that plague genomes had made the unwritten Eurasia of about 5,300 years ago legible. The two graves in Chile put the same instrument into a period rich in written sources, and that is what matters: in prehistory the genome was the only witness, here it is the second. Two kinds of evidence look at the same event from different places and can check one another. The first test of that checking is already clear: once more genomes from the same period are recovered, we will see whether the reported change in rate survives. That a five-century argument about who passed an epidemic to whom can now be continued by asking both who told the story and what remains in whose bone quietly changes the question of on whose behalf we speak for the past.", "refs": ["pox", "prior-06"]}]}], "sources": [{"key": "pox", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/chilean-mummies-reveal-a-lost-lineage-of-smallpox/", "title": {"tr": "Şili mumyalarından çiçek virüsünün soyu tükenmiş bir kolu çıktı", "en": "An extinct branch of the smallpox virus has been recovered from Chilean mummies"}, "publishedDate": "2026-07-30"}, {"key": "prior-06", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/science/sci-06/2026-07-25/", "title": {"tr": "Beş bin üç yüz yıl önce Avrasya çoktan tek bir odaydı", "en": "Five thousand three hundred years ago Eurasia was already one room"}, "publishedDate": "2026-07-25"}], "date": "2026-07-31"}, {"writer": "sci-01", "title": {"tr": "25 yıllık müon açığını kapatan hesap, faturayı ölçümlere çıkardı", "en": "The calculation that closed the 25-year muon gap sent the bill to the measurements"}, "excerpt": {"tr": "Müonun manyetik salınımındaki milyonda birlik sapma kuram tarafında kapandı. Kapanınca ortaya çıkan şey, kırk yıla yayılmış pion üretim ölçümlerinin birbirine uymadığıydı.", "en": "The one-part-in-a-million deviation in the muon's magnetic wobble closed on the theory side. What closing it revealed was that four decades of pion production measurements do not agree with one another."}, "sections": [{"h": {"tr": "Açığın kapandığı gün", "en": "The day the gap closed"}, "ps": [{"tr": "Müonun manyetik salınımı, çeyrek yüzyıl boyunca kuramsal öngörüden milyonda bir düzeyinde saptı ve bu sapma keşfedilmemiş parçacıklara işaret ediyor sayıldı. Budapeşte-Marsilya-Wuppertal işbirliğinin örgü QCD hesabı 2021'de müonun bilinen fizikle tam uyumlu salındığını gösterdi; sonuç Fermilab'ın güncellenmiş ölçümüyle aynı gün açıklandı.", "en": "For a quarter of a century the muon's magnetic wobble sat about one part in a million away from theoretical prediction, and that deviation was taken as a hint of undiscovered particles. In 2021 the Budapest-Marseille-Wuppertal collaboration's lattice QCD calculation showed the muon wobbling exactly as known physics requires, and the result was released the same day as Fermilab's updated measurement.", "refs": ["muon"]}, {"tr": "Aynı sayıya ikinci bir yoldan varılıyor. Alex Keshavarzi ve arkadaşlarının Haziran 2020'de yayımladığı veri temelli öngörü, kuarkların davranışını elektron-pozitron çarpışmalarından çıkarıyordu ve Fermilab'ın Nisan 2021 ölçümüyle o kadar keskin biçimde çelişti ki yeni parçacık keşfi için gereken katı eşiğe neredeyse dayandı. Örgü hesabı bu çelişkiyi çözmedi; yerini değiştirdi.", "en": "The same number can be reached by a second route. The data-driven prediction published by Alex Keshavarzi and colleagues in June 2020 inferred quark behaviour from electron-positron collisions, and it clashed with Fermilab's April 2021 measurement so sharply that it nearly reached the stringent threshold required to claim a new particle. The lattice calculation did not dissolve that clash; it moved where the clash sits.", "refs": ["muon"]}]}, {"h": {"tr": "Yükü taşıyan ölçüm", "en": "The measurement left carrying the weight"}, "ps": [{"tr": "Veri temelli yol, elektron-pozitron çarpışmalarındaki pion üretim oranlarının ölçümüne dayanıyor. Novosibirsk'teki VEPP-2000 çarpıştırıcısında 2023'te yeni bir algılayıcı kurulup oranlar yeniden ölçüldüğünde, değerler belirgin biçimde değişti. Liverpool Üniversitesi'nden Fedor Ignatov bunu \"It was a surprise. No one expected it to be like that\" sözleriyle anlatıyor. BABAR çarpıştırıcısının 2023 çözümlemesi ise eski oranla çarpıcı bir uyum içinde.", "en": "The data-driven route depends on measurements of pion production rates in electron-positron collisions. When a new detector was installed at the VEPP-2000 collider in Novosibirsk in 2023 and the rates were measured again, the values changed significantly. Fedor Ignatov of the University of Liverpool describes it this way: \"It was a surprise. No one expected it to be like that\". The BABAR collider's 2023 analysis, meanwhile, sits in striking agreement with the older rate.", "refs": ["muon"]}, {"tr": "Bir kuramsal hesabın deneyle buluşması, uyuşmazlığı kuram ile ölçüm arasından çıkarıp ölçümlerin kendi arasına taşıdı: şimdi ayrışan şey iki yöntem yerine aynı yöntemi besleyen girdilerdir. Bilinmeyen bir parçacık bunun tek açıklaması sayılmaz; onlarca yıla yayılmış deneyler arasındaki gözden kaçmış yöntem ayrımları da aynı ayrışmayı üretebilir ve o durumda Standart Model'e dokunmak gerekmez.", "en": "A theoretical calculation meeting the experiment carried the disagreement out from between theory and measurement and set it down among the measurements themselves: what now diverges is one method's own inputs rather than two rival methods. An unknown particle counts as only one account of this. Overlooked procedural differences between experiments spread across decades could produce the same divergence, and in that case nothing in the Standard Model needs touching.", "refs": ["muon"]}]}, {"h": {"tr": "Neye bakılacak", "en": "What to watch"}, "ps": [{"tr": "Keshavarzi, VEPP-2000 sonucundan daha çok incelenmiş bir ölçüm bulunmadığını ve şimdiye dek bir sorun saptanmadığını söylüyor; kendi özeti de bunu doğruluyor: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Bakılacak yer, bağımsız bir pion oranı ölçümünün VEPP-2000'in yeni değerine mi yoksa BABAR ile eski ölçümlerin oluşturduğu kümeye mi düşeceğidir. Müonun kendi sayısı bir süre daha aynı kalabilir; ona giden yolun iki ucu birbirine yaklaşmadan hangi tarafta yeni fizik olduğu söylenemez.", "en": "Keshavarzi says no measurement has been scrutinised more than VEPP-2000's and that so far no problems have been found; his own summary bears it out: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" What to watch is whether an independent measurement of the pion rate lands on VEPP-2000's new value or in the cluster formed by BABAR and the older results. The muon's own number may hold steady for a while yet; until the two ends of the road leading to it converge, no one can say which side holds new physics.", "refs": ["muon"]}]}], "sources": [{"key": "muon", "kind": "news", "name": "Quanta Magazine", "url": "https://www.quantamagazine.org/physicists-solve-a-muon-mystery-now-old-results-dont-add-up-20260729", "title": {"tr": "Müondaki 25 yıllık açığı kapatan hesap, kırk yıllık pion ölçümlerini birbiriyle çelişkide bıraktı", "en": "The calculation that closed a 25-year muon gap has left four decades of pion measurements in conflict"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Çocukluk kokusunun izi, koku soğanında doğum sonrası hücrelerde bulundu", "en": "The trace of a childhood scent was found in postnatal cells of the olfactory bulb"}, "excerpt": {"tr": "Ankete 647 kişi katıldı. Nedensel adım ise farede atıldı: doğumdan sonraki ilk gün oluşan granül hücreleri ışıkla susturulunca hayvanın kokuya ilgisi düştü.", "en": "647 people took part in the survey. The causal step was taken in the mouse: when granule cells formed on the first day after birth were silenced with light, the animal's interest in the odour fell."}, "sections": [{"h": {"tr": "İki ayrı kanıt, iki ayrı tür", "en": "Two kinds of evidence, two species"}, "ps": [{"tr": "Çalışma iki koldan yürüdü. Ankete 647 kişi katıldı ve çocukluğunun hoş kokularını bildirdi. Fareler ise doğum sonrası 23–33. günler arasında, insanda erken çocukluğa karşılık gelen dönemde, çekici kokularla zenginleştirilmiş bir ortamda tutuldu.", "en": "The study ran along two tracks. 647 people took part in the survey and reported the pleasant smells of their childhood. Mice, for their part, were kept in an environment enriched with attractive odorants between postnatal days 23 and 33, the period corresponding to early childhood in humans.", "refs": ["smell"]}, {"tr": "Yetişkin farede anının geri çağrılması, doğumdan sonraki ilk gün oluşan granül hücrelerine bağlı çıktı. Ekip bu hücreleri halorodopsin taşıyan bir lentivirüsle işaretleyip 561 nanometre ışıkla susturdu; kokuya ayrılan inceleme süresi düştü, alışma eğrisi dikleşti ve tercih göstergesi geriledi. Grup büyüklükleri 18 ve 12 hayvandı.", "en": "In the adult mouse, recall of the memory turned out to depend on granule cells formed on the first day after birth. The team labelled those cells with a lentivirus carrying halorhodopsin and silenced them with light at 561 nanometres; investigation time devoted to the odorant fell, the habituation slope steepened and the preference index declined. Group sizes were 18 and 12 animals.", "refs": ["smell"]}]}, {"h": {"tr": "İki açıklama yarışıyor", "en": "Two accounts in competition"}, "ps": [{"tr": "Yazarların önerdiği mekanizma, erken kokunun ödül sistemiyle artan bağlantı üzerinden koku soğanına yerleşmesidir. Scientific American'ın aktardığı biçimde granül hücreleri haz ve ödül bölgeleriyle ayrıcalıklı bağlantılar kuruyor, böylece erken koku çocuklukta damgalanıyor.", "en": "The mechanism the authors propose is that the early odorant settles into the olfactory bulb through increased connectivity with the reward system. As Scientific American puts it, granule cells make privileged connections with pleasure and reward areas, so the early scent becomes imprinted in childhood.", "refs": ["smell"]}, {"tr": "Işıkla susturmanın ardından değişen davranış, ödül üzerinden kurulan bir damgalanmanın kesilmesiyle açıklanabilir. Aynı sonuç, erken kokunun yalnızca tanıdık olmasından da doğabilir; granül hücreleri kapatıldığında aşinalığı okuyan yol da kapanır ve inceleme süresi yine düşer. İki açıklamayı ayırmak, hazzı ve aşinalığı birbirinden bağımsız sınamayı gerektirir.", "en": "The behaviour that changes after silencing with light can be explained by the interruption of an imprint established through reward. The same outcome could also arise from the early odorant being merely familiar; when granule cells are shut off, the route that reads familiarity closes too and investigation time falls just the same. Separating the two accounts requires testing pleasure and familiarity independently of one another.", "refs": ["smell"]}]}, {"h": {"tr": "Kimin için ne değişir", "en": "Whose life this changes"}, "ps": [{"tr": "Bu araştırmadan kliniğe bugün taşınabilecek bir uygulama çıkmıyor. Scientific American'ın derlediği iki uyarı da bunu destekliyor: AgroParisTech-INRAE'den Hervé This çalışmanın ağırlıkla olumlu anılara odaklandığını söylüyor, Buckingham Üniversitesi'nden Luca Turin ise kokunun ayrıksılığının görünürde kalabileceğini savunuyor. Yaşlanan farede anının sürmesi için kokunun aralıklarla yeniden verilmesi gerekiyor ve doğum sonrası hücreler devreden çekilirken limbik bağlantılar güçleniyor. İnsanda karşılığı olan soru budur: erken kokuya yeniden maruz kalmak, yaşlanmayla zayıflayan bir anıyı ayakta tutar mı?", "en": "Nothing in this research can be carried into the clinic today. The two cautions Scientific American gathered support that reading: Hervé This of AgroParisTech-INRAE says the work focused largely on positive memories, while Luca Turin of the University of Buckingham argues smell's distinctiveness may be only apparent. In the ageing mouse, the memory persists only if the odorant is presented again periodically, and as the postnatal cells disengage the limbic connections strengthen. That is the question with a human counterpart: does re-exposure to an early scent hold up a memory that ageing weakens?", "refs": ["smell"]}]}], "sources": [{"key": "smell", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories", "title": {"tr": "Farelerde koku soğanı granül hücrelerinin susturulması, çocukluk koku tercihini değiştirdi", "en": "Silencing olfactory-bulb granule cells in mice changed a childhood scent preference"}, "publishedDate": "2026-07-29", "primary": {"kind": "paper", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003845", "publishedDate": "2026-07-14", "title": {"tr": "Olumlu erken yaşam koku anısı koku soğanında kökleniyor ve koku sisteminin ötesinde geniş ölçekli değişiklikleri tetikliyor", "en": "Positive early-life olfactory memory is rooted in the olfactory bulb and triggers large-scale changes beyond the olfactory system"}}}], "date": "2026-07-30"}, {"writer": "sci-03", "title": {"tr": "Demirle gübreleme için en az zarar veren yer Güney Okyanusu çıktı", "en": "The Southern Ocean comes out as the least damaging place to add iron"}, "excerpt": {"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde plankton kütlesi düşüyor, Güney Okyanusu'nda yükseliyor; karar bu farkta.", "en": "The same intervention runs in opposite directions in two oceans. In the equatorial Pacific plankton biomass falls, in the Southern Ocean it rises, and the decision lives in that difference."}, "sections": [{"h": {"tr": "İki bölge, ters yönde iki sonuç", "en": "Two regions, two opposite outcomes"}, "ps": [{"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde okyanus alanının yüzde 0,35'i gübrelendiğinde büyük zooplankton kütlesi en az yüzde 10 düşüyor. Güney Okyanusu'nda daha küçük bir alan, yüzde 0,2, gübrelendiğinde aynı kütle yüzde 10 artıyor.", "en": "The same intervention runs in opposite directions in two oceans. When 0.35 percent of the ocean area in the equatorial Pacific is fertilised, macrozooplankton biomass falls by at least 10 percent. When a smaller area in the Southern Ocean, 0.2 percent, is fertilised, that same biomass rises by 10 percent.", "refs": ["iron"]}, {"tr": "Karbon tarafındaki sayı ise şu: net uzaklaştırma 5,3 ppm'e, yani yılda 0,70 gigaton karbondioksite kadar çıkıyor. California Üniversitesi'nden Jun Yu, Adam Martiny ve arkadaşları bu değerleri altmış yılı aşkın gübreleme verisini kullanan bir bilgisayar modellemesinden çıkarıyor ve Güney Okyanusu'nun ekolojik bozulma ile karbon uzaklaştırması arasında en iyi dengeyi sunduğu sonucuna varıyor.", "en": "On the carbon side the number is this: net removal reaches up to 5.3 parts per million, that is 0.70 gigatonnes of carbon dioxide a year. Jun Yu, Adam Martiny and colleagues at the University of California derive these values from a computer model drawing on more than six decades of fertilisation data, and conclude that the Southern Ocean offers the best balance between ecological disturbance and carbon removal.", "refs": ["iron"]}]}, {"h": {"tr": "Farkı ne yapıyor", "en": "What makes the difference"}, "ps": [{"tr": "İki bölgenin ters yönde davranması, eklenen demirin karşılaştığı besin ağının ne yaptığına bağlı görünüyor: Güney Okyanusu'nda demir eksikliği üretimi sınırlayan asıl kısıt olduğu için eklenen demir üretimi yukarı çekiyor ve üstteki halkalara besin taşıyor, Ekvator Pasifiği'nde ise büyümenin yönü zooplanktonun beslendiği topluluğun bileşimini onun aleyhine değiştiriyor.", "en": "The opposite behaviour of the two regions appears to depend on what the food web meeting the added iron does with it: in the Southern Ocean, iron scarcity is the binding constraint on production, so added iron pulls production upward and carries food to the levels above, while in the equatorial Pacific the direction of growth shifts the composition of the community zooplankton feed on against them.", "refs": ["iron"]}, {"tr": "Bu bir çıkarım ve yanında başka açıklamalar da duruyor. Bölgesel sıralama, okyanusların gerçek davranışından çok her bölgenin modelin besin ağı parametrelerinde nasıl temsil edildiğinden de doğabilir; iki bölgenin plankton toplulukları modele farklı ayrıntı düzeyinde girmişse sıralama o ayrıntının izini taşır. Yazarların kendi uyarısı da bu yönde okunmalı: demirle gübrelemenin uzak etkileri var ve yerel her girişim doğası gereği yerel olmayan sonuçlar doğuruyor.", "en": "This is an inference, and other accounts stand beside it. The regional ranking could also arise less from how the oceans actually behave than from how each region is represented in the model's food-web parameters; if the plankton communities of the two regions entered the model at different levels of detail, the ranking carries the trace of that detail. The authors' own caution should be read in the same direction: ocean iron fertilisation has downstream effects, and any localised intervention inherently produces nonlocal consequences.", "refs": ["iron"]}]}, {"h": {"tr": "Elimizde olan kollar", "en": "The levers we actually hold"}, "ps": [{"tr": "Bu çalışmanın verdiği şey iki ayar düğmesidir: nerede ve ne kadar alanda. Güney Okyanusu'nda yüzde 0,2 ile plankton kütlesi yüzde 10 artıyor, Ekvator Pasifiği'nde yüzde 0,35 ile en az yüzde 10 düşüyor; yer seçimi tek başına sonucun işaretini çeviriyor. Bunun karşılığı sahada henüz sınanmadı. Elimizde bir modelleme çözümlemesi var ve bir saha denemesinin ilk işi, modelin zooplanktona dair öngörüsünün tuttuğunu ölçmek olur.", "en": "What this study hands over is two dials: where, and over how much area. In the Southern Ocean 0.2 percent makes plankton biomass rise by 10 percent, while in the equatorial Pacific 0.35 percent makes it fall by at least 10 percent; the choice of place alone flips the sign of the outcome. None of this has been tested at sea yet. What we hold is a modelling analysis, and the first job of any field trial would be to measure whether the model's prediction about zooplankton holds.", "refs": ["iron"]}]}], "sources": [{"key": "iron", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-oceans-australia-fertilize-carbon-dioxide.html", "title": {"tr": "Model çalışması, demirle gübreleme için Güney Okyanusu'nu Ekvator Pasifiği'nin önüne koyuyor", "en": "A modelling study puts the Southern Ocean ahead of the equatorial Pacific for iron fertilisation"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-04", "title": {"tr": "Tekrarsız bir döşemeyi silisyum nitrüre kazıdılar ve ışık bir ellilik kazandı", "en": "They etched an aperiodic tiling into silicon nitride and the light acquired a handedness"}, "excerpt": {"tr": "Matematikte 2022'de bulunan \"şapka\", sonsuz bir yüzeyi hiç tekrarlamadan kaplıyor. Tokyo'daki ekip onu ince filme oyunca kırınan lazer ışığı aynada bakışımsız çıktı.", "en": "The hat, found in mathematics in 2022, covers an infinite surface without ever repeating. When a team in Tokyo etched it into a thin film, the diffracted laser light came out mirror-asymmetric."}, "sections": [{"h": {"tr": "Döşemeden aygıta", "en": "From tiling to device"}, "ps": [{"tr": "\"Şapka\" döşemesini 2022'de amatör matematikçi David Smith buldu. Tek bir taş, sonsuz bir yüzeyi hiçbir örüntüyü tekrarlamadan kaplıyor; adı da Albert Einstein'dan gelmiyor, Almanca \"ein Stein\", yani \"tek taş\" ifadesinden geliyor. Yarım yüzyıldan uzun süredir açık duran bir soru böylece kapandı ve elde bir şekil kaldı: kendini asla tekrarlamayan bir kaplama kuralı.", "en": "The hat tile was found in 2022 by the amateur mathematician David Smith. A single stone covers an infinite surface without repeating any pattern, and its name does not come from Albert Einstein but from the German \"ein Stein\", that is, one stone. A question left open for more than half a century closed, and what remained in hand was a shape: a tiling rule that never repeats itself.", "refs": ["hat"]}, {"tr": "Tokyo Üniversitesi Endüstriyel Bilim Enstitüsü'ndeki ekip o kuralı bir aygıta çevirdi. Şapkanın biçimine dayanan örüntüyü silisyum nitrür ince filme oydular, üzerine lazer düşürdüler ve Bragg kırınımıyla çıkan ışığı okudular. Işık aynada bakışımsız geldi; yani bir ellilik taşıyordu. Baş yazar Yuto Moritake çıkış noktasını sade anlatıyor: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "en": "The team at the University of Tokyo's Institute of Industrial Science turned that rule into a device. They etched a pattern based on the hat's shape into a silicon nitride thin film, shone a laser onto it and read the light coming out of Bragg diffraction. The light arrived mirror-asymmetric, that is, carrying a handedness. Lead author Yuto Moritake states the starting point plainly: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "refs": ["hat"]}]}, {"h": {"tr": "Neden beklenmiyordu", "en": "Why that was not expected"}, "ps": [{"tr": "Kırınım normalde düzenli bir örgünün işidir: tekrar eden aralıklar, ışığı belirli açılara yönlendirir. Şapka döşemesinde tekrar yok, buna karşın çıkan ışıkta bir yön tercihi var; bu tercihin kaynağı, düzenli bir örgü yerine döşemenin kendi bakışımsızlığı görünüyor. Aynı ellilik, örüntünün filmin kenarlarında nasıl kesildiğinden de doğabilir; sonlu bir parçanın kenar seçimi de bakışımı bozar ve bunu ayırmak farklı kesimlerle aynı ölçümü yinelemeyi gerektirir.", "en": "Diffraction is normally the business of a regular lattice: repeating spacings steer light into particular angles. In the hat tiling there is no repetition, yet the emerging light shows a directional preference, and the source of that preference appears to be the tile's own asymmetry rather than a regular lattice. The same handedness could also arise from how the pattern was cut at the film's edges; the choice of boundary in a finite patch also breaks symmetry, and separating the two requires repeating the measurement with different cuts.", "refs": ["hat"]}, {"tr": "Kullanım tarafında ekip lazer ışığının kutuplanmasını denetlemeyi, haberleşmeyi ve kuantum şifrelemeyi sayıyor. Ortada bir aygıt yerine bir olgu duruyor: ince filme kazınmış bir örüntünün kırınan ışığa bir el kazandırdığı gösterildi. O elin ne kadar güçlü, ne kadar kararlı ve hangi dalga boylarında seçilebilir olduğu, bir kutuplanma denetleyicisi yapmaya kalkan herkesin ilk ölçeceği şeydir; makale bu üç sayıyı vermiyor.", "en": "On the application side the team lists control of laser light polarisation, telecommunications and quantum cryptography. What is actually on the table is a phenomenon rather than a device: a pattern etched into a thin film was shown to give diffracted light a hand. How strong that hand is, how stable, and at which wavelengths it can be selected are the first things anyone building a polarisation controller would measure, and the paper does not supply those three numbers.", "refs": ["hat"]}]}], "sources": [{"key": "hat", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/maths-acclaimed-einstein-tile-finds-a-new-home-among-physicists", "title": {"tr": "Lazer ışığı, tekrarsız \"şapka\" döşemesinden bir ellilik kazandı", "en": "Laser light picked up a handedness from the aperiodic hat tile"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-05", "title": {"tr": "Yirmi bin toprak yapısı, 4.500 kilometrekareden çıkarılabilir mi?", "en": "Can twenty thousand earthworks be inferred from 4,500 square kilometres?"}, "excerpt": {"tr": "Amazon'da havadan lazerle taranan alan 4.500 km². Bulunan anıtsal yapı sayısı 400'den fazla. Yayımlanan sayı ise 20.000. Aradaki adımın adı örnekleme.", "en": "The area scanned by airborne laser in Amazonia is 4,500 km². The number of monumental sites found is more than 400. The number published is 20,000. The step in between is called sampling."}, "sections": [{"h": {"tr": "Gerçekten ölçülen alan", "en": "The area that was actually measured"}, "ps": [{"tr": "Araştırma havadan lazer taramasıyla, yaklaşık 450 km uzunluğunda düz hatlar boyunca her 10 km'de 1 km genişliğinde şeritler tarayarak toplam 4.500 km² kadar alanı ölçtü ve iyi korunmuş 400'den fazla anıtsal tören alanı belgeledi. Taranan alanın yarısından fazlası dizgesel olarak değerlendirildi.", "en": "The survey measured a total of about 4,500 km² by airborne laser scanning, mapping 1 km wide strips every 10 km along straight transects roughly 450 km long, and documented more than 400 well-preserved monumental ceremonial sites. More than half of the scanned area was systematically assessed.", "refs": ["amazon"]}, {"tr": "Bu sayıdan bütün bölgede 20.000'den fazla tören merkezi bulunduğu öngörülüyor. Öngörünün kapsadığı alan yaklaşık 183.000 km², yani taranan alanın kırk katından fazla; bu 183.000 km² de Büyük Amazonya'nın yüzde üçünden azına denk geliyor. Her 10 km'de 1 km genişliğinde bir şerit tarandığında koridorun onda biri görülür. Yani sayı, görülenin on katına çıkmakla kalmıyor; kırk katından fazlasına genişletiliyor.", "en": "From that count, more than 20,000 ceremonial centres are projected across the whole region. The area the projection covers is about 183,000 km², more than forty times the area scanned, and those 183,000 km² themselves amount to less than three percent of Greater Amazonia. When a 1 km wide strip is scanned every 10 km, one tenth of the corridor is seen. So the number reaches beyond ten times what was seen, out to more than forty times it.", "refs": ["amazon"]}]}, {"h": {"tr": "Sayıdan nüfusa", "en": "From count to population"}, "ps": [{"tr": "İkinci genişletme nüfus tarafında. Yazarlar birinci binyılın başı için 1,25–3 milyon aralığını veriyor ve bu aralığı ihtiyatlı sayıyor; Amazon'un tümü için daha önce önerilen 1–10 milyon aralığıyla karşılaştırdıklarında ihtiyat iddiası anlaşılır hale geliyor. Yapı sayısından kişi sayısına geçmek, her yapının kaç kişiye hizmet ettiğine dair bir kabul gerektirir ve bu kabul, taramanın kendisinden gelmez.", "en": "The second extension is on the population side. The authors give a range of 1.25 to 3 million for the start of the first millennium and call that range cautious; set against the 1 to 10 million proposed earlier for the whole Amazon, the claim to caution becomes intelligible. Moving from a count of structures to a count of people requires an assumption about how many people each structure served, and that assumption does not come from the scanning.", "refs": ["amazon"]}, {"tr": "Genişletmenin gücü, hatların yapı yoğunluğunu yansız örnekleyip örneklemediğine bağlıdır. Toprak yapıları akarsu boylarında ya da su basmayan yüksek düzlüklerde kümeleniyorsa, o özellikleri dik kesen bir hat ile onlara paralel giden bir hat bambaşka yoğunluklar okur; hatların yönü sonucun içine girer. Alternatif olarak yapılar bölgeye gerçekten düzgün dağılmış olabilir, o durumda 20.000 sayısı yerinde durur. Ama iki durumu birbirinden ayırmak için ikinci bir taramaya ihtiyaç var.", "en": "The strength of the extension depends on whether the transects sample earthwork density without bias. If earthworks cluster along watercourses or on flood-free high ground, a transect cutting across those features and one running parallel to them read entirely different densities, and the orientation of the transects enters the result. Alternatively the structures may genuinely be distributed evenly across the region, in which case the figure of 20,000 stands. But separating the two cases takes a second survey.", "refs": ["amazon"]}]}, {"h": {"tr": "Bunu ne kapatır", "en": "What would settle it"}, "ps": [{"tr": "Tartışmayı ilerletecek olan, daha büyük bir sayı yerine ikinci bir örnekleme düzenidir: aynı 183.000 km² üzerinde farklı aralıkla ya da farklı yönde uçulmuş hatlar. İki ayrı geometri birbirine yakın yoğunluk veriyorsa genişletme dayanak kazanır; ayrışıyorsa fark, yapıların kendisinden çok hatların nereden geçtiğinden gelir. Bulgunun kendisi sağlam: 400'den fazla anıtsal yapı bulundu ve bunlar var. Sınanması gereken, o dört yüzden yirmi bine giden adımın kendisi.", "en": "What would move the argument forward is a second sampling design rather than a larger number: transects flown at a different spacing or in a different orientation over the same 183,000 km². If two separate geometries give densities close to one another, the extension gains support; if they diverge, the difference comes from where the transects ran rather than from the structures. The finding itself is solid: more than 400 monumental sites were found, and they exist. What needs testing is the step that runs from those four hundred to twenty thousand.", "refs": ["amazon"]}]}], "sources": [{"key": "amazon", "kind": "news", "name": "University of Helsinki", "url": "https://www.helsinki.fi/en/news/culture/ancient-civilization-millions-once-flourished-amazon", "title": {"tr": "Amazon'da 4.500 kilometrekarelik lidar taraması 400'den fazla anıtsal yapıyı haritaladı", "en": "A lidar survey of 4,500 square kilometres in Amazonia mapped more than 400 monumental sites"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-06", "title": {"tr": "Bir zihnin temelinde proteinleri doğru katlamak olabilir", "en": "The base of a mind may be nothing grander than folding proteins correctly"}, "excerpt": {"tr": "Ahtapot zekâsını hep devrelerde aradık. Harvard'daki ekip bir basamak aşağıya, proteinleri kuran makinenin kendisine baktı ve orada yalnızca ahtapotlarda görülen bir kopma buldu.", "en": "We have always looked for octopus intelligence in circuitry. A team at Harvard looked one step lower, at the machine that builds the proteins, and found there a break seen only in octopuses."}, "sections": [{"h": {"tr": "Bir basamak aşağıda", "en": "One step lower down"}, "ps": [{"tr": "Harvard'daki ekip, yalnızca ahtapotlarda görülen bir ribozomal RNA kopması buldu. Bu değişiklik bakteriye aktarıldığında hücreler protein üretirken daha az hata yaptı ve yanlış katlanmış moleküllerin zehirli yığınlar oluşturma riski düştü. Ahtapot dokusunda protein yığınları, kalamardakine göre hem daha az hem daha küçüktü.", "en": "The team at Harvard found a break in ribosomal RNA that occurs only in octopuses. When the change was engineered into bacteria, the cells made fewer mistakes while building proteins and the risk of misfolded molecules forming toxic aggregates fell. Protein clumps in octopus tissue were both fewer and smaller than in squid.", "refs": ["octopus"]}, {"tr": "Bir zihni anlamaya çalışırken alıştığımız yer nöronların birbirine nasıl bağlandığıdır: devreler, ağlar, katmanlar. Burada bakılan yer bir basamak aşağıda. Nöron bir yapıdır ve o yapı proteinlerden kurulur; onları kuran ribozom hata yaparsa, en zarif devre şeması bile yanlış malzemeyle örülür. Bu çalışmanın gösterdiği şey, o malzeme atölyesinde ahtapotlara özgü bir ayarın bulunduğudur.", "en": "When we try to understand a mind, the place we are used to looking is how neurons connect to one another: circuits, networks, layers. What is examined here is one step lower. A neuron is a structure, and that structure is built out of proteins; if the ribosome assembling them makes mistakes, even the most elegant circuit diagram gets woven from the wrong material. What this study shows is that in that materials workshop there is a setting particular to octopuses.", "refs": ["octopus"]}]}, {"h": {"tr": "Zamanlama ve temkin", "en": "Timing and restraint"}, "ps": [{"tr": "Zamanlama dikkat çekiyor. Yazarlar bu değişikliğin, sığ su ahtapotlarının yaklaşık 100 milyon yıl önce karmaşık ortamlara yerleşmesi ve sinir sistemlerinin hızla genişlemesiyle örtüştüğünü belirtiyor. Ortak baş yazar Rishav Mitra bağı kurarken dilini özenle ölçüyor: değişiklik \"might help these neurons to work well\".", "en": "The timing is striking. The authors note that this change coincides with shallow-water octopuses settling into complex environments roughly 100 million years ago and their nervous systems expanding rapidly. Co-lead author Rishav Mitra measures his language carefully in drawing the link: the change \"might help these neurons to work well\".", "refs": ["octopus"]}, {"tr": "Neden özellikle nöronlar? Uzun ömürlü ve sürekli protein üreten hücrelerde hata birikimi diğer dokulardan daha pahalıya gelir; daha doğru bir ribozom en çok orada işe yarar. Ama aynı değişiklik nöronlarla ilgisi olmayan bir nedenle de seçilmiş olabilir; sıcak ya da değişken suya dayanmak da protein katlanmasını zorlar ve o durumda sinirsel yarar yan üründür. Zamanlamanın örtüşmesi, iki açıklamadan hangisinin doğru olduğunu söylemez.", "en": "Why neurons in particular? In long-lived cells that build protein continuously, accumulated error costs more than it does in other tissue, and a more accurate ribosome pays off most there. But the same change could have been selected for a reason unconnected with neurons; tolerating warm or variable water also strains protein folding, and in that case any neural benefit is a by-product. The coincidence of timing does not tell us which of the two accounts is right.", "refs": ["octopus"]}]}, {"h": {"tr": "Bilmek ne demek olurdu", "en": "What knowing would take"}, "ps": [{"tr": "Genetikçi Eli Eisenberg sınırı açıkça koyuyor: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" İnsanda sınama ribozomal RNA'yı değiştirip öğrenme ile sorun çözmeyi ölçmeyi gerektiriyor ve çok zor sayılıyor. Yine de burada duran şey küçük değil. Bir zihnin nasıl kurulduğunu sorarken hep bir üst kata, düşüncenin kendisine bakmaya alışmışız; bu bulgu aynı soruyu bodruma taşıyor ve orada bir molekülün nasıl doğru katlandığını soruyor. Şimdilik bir hipotez. Ama sorunun yerini değiştiren bir hipotez.", "en": "The geneticist Eli Eisenberg sets the limit plainly: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" Testing this in humans would mean altering ribosomal RNA and measuring learning and problem-solving, which is described as highly challenging. Even so, what stands here is not small. Asking how a mind is built, we are used to looking upstairs, at thought itself; this finding carries the same question down to the basement and asks there how a molecule folds correctly. For now it is a hypothesis. But it is one that moves where the question sits.", "refs": ["octopus"]}]}], "sources": [{"key": "octopus", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/a-unique-cellular-trick-may-explain-octopus-intelligence", "title": {"tr": "Ahtapot ribozomal RNA'sındaki bir kopma, protein üretimindeki hataları azaltıyor", "en": "A break in octopus ribosomal RNA lowers errors in protein building"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}], "dates": ["2026-08-05", "2026-08-04", "2026-08-03", "2026-08-02", "2026-08-01", "2026-07-31", "2026-07-30"], "dateLabels": {"2026-08-05": {"tr": "5 Ağustos 2026", "en": "August 5, 2026"}, "2026-08-04": {"tr": "4 Ağustos 2026", "en": "August 4, 2026"}, "2026-08-03": {"tr": "3 Ağustos 2026", "en": "August 3, 2026"}, "2026-08-02": {"tr": "2 Ağustos 2026", "en": "August 2, 2026"}, "2026-08-01": {"tr": "1 Ağustos 2026", "en": "August 1, 2026"}, "2026-07-31": {"tr": "31 Temmuz 2026", "en": "July 31, 2026"}, "2026-07-30": {"tr": "30 Temmuz 2026", "en": "July 30, 2026"}}, "newsDates": {"science": "2026-08-05"}, "podcasts": {"science": {"2026-07-30": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-07-30-science-en.1104a6942156.mp3", "bytes": 1759652}}}}}, "2026-07-31": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-07-31-science-en.217d5d2b04ee.mp3", "bytes": 1719528}}}}}, "2026-08-01": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-08-01-science-en.887a2299ae50.mp3", "bytes": 1515982}}}}}, "2026-08-04": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-08-04-science-en.c5e8f9e071d6.mp3", "bytes": 2011681}}}}}, "2026-08-05": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-08-05-science-en.b0c76756f85c.mp3", "bytes": 1941046}}}}}}}, "updated": "2026-08-05T06:48:46+00:00"};

/* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

  return file && file.url;
}

const NEWS_PAGE_SIZE = 6;
function pageItems(items, requestedPage, pageSize){
  const pages = Math.max(1, Math.ceil(items.length / pageSize));
  const page = Math.max(0, Math.min(requestedPage, pages - 1));
  const start = page * pageSize;
  return {items:items.slice(start, start + pageSize), page, pages};
}

function renderBriefs(){

  // forward in time, and the deck boots scrolled to the newest (rightmost) page.

  editions.forEach(([key], pageIndex)=>{
    const items = BRIEFS.filter(brief => brief && brief.topic===TOPIC &&

function articleHTML(a){
  const proseParts = [];
  const parts = [];
  const u = UI[LANG];
  const seenKeys = new Set();
  const seenUrls = new Set();
  const sources = [];
  (Array.isArray(a.sources) ? a.sources : []).forEach(source=>{
    if(!source || typeof source!=='object' || Array.isArray(source)) return;
    const key = typeof source.key==='string' ? source.key : '';
    // Old archives omitted `kind`; those records were external reporting.
    const kind = source.kind ?? 'news';
    if(kind!=='news' && kind!=='article') return;
    const rawHref = typeof source.url==='string' ? source.url : '';
    let href = safeHref(rawHref);
    const name = typeof source.name==='string' ? source.name.trim() : '';
    const title = localized(source.title);
    const publishedDate = typeof source.publishedDate==='string' ? source.publishedDate : '';
    const citationDate = referenceDate(publishedDate);
    if(publishedDate && !citationDate) return;
    if(kind==='article'){
      if(!citationDate) return;
      try{
        const parsed = new URL(rawHref);
        const canonical = `https://eigenradar.com${parsed.pathname}`;
        if(rawHref!==canonical || parsed.protocol!=='https:'
            || parsed.host!=='eigenradar.com' || parsed.search || parsed.hash
            || !/^\/tr\/(?:ai|geopolitics|economics-markets|science)\/(?:ai|geo|eco|sci)-\d{2}\/\d{4}-\d{2}-\d{2}\/(?:[2-9]\d*\/)?$/.test(parsed.pathname)
            || name!=='Eigen Radar'
            || !parsed.pathname.includes(`/${publishedDate}/`)) return;
        parsed.pathname = parsed.pathname.replace(/^\/tr\//,`/${LANG}/`);
        href = parsed.href;
      }catch{return;}
    }
    if(!/^[a-z][a-z0-9-]{0,63}$/.test(key) || seenKeys.has(key)
        || !href || seenUrls.has(href) || !name || !title) return;
    seenKeys.add(key); seenUrls.add(href);
    sources.push({
      ...source,
      _citationHref:href,
      _citationInternal:kind==='article',
      _citationDate:citationDate
    });
  });
  const sourceNumbers = new Map(sources.map((source,index)=>[source.key,index+1]));
  const sourceOccurrences = new Map();
  let occurrence = 0;
  const sections = Array.isArray(a.sections) ? a.sections : [];
  sections.forEach(s=>{
    if (!s || typeof s !== 'object' || Array.isArray(s)) return;
    const heading = localized(s.h);
    if (heading) proseParts.push(`<h2>${escapeHTML(heading)}</h2>`);
    const paragraphs = Array.isArray(s.ps) ? s.ps : [];
    paragraphs.forEach(p=>{
      occurrence += 1;
      const refs = Array.isArray(p?.refs) ? [...new Set(p.refs)] : [];
      const markers = refs.map(key=>sourceNumbers.get(key)).filter(Boolean).map(number=>{
        const ids = sourceOccurrences.get(number) || [];
        const citationId = `reader-citation-${number}-${ids.length+1}`;
        ids.push(citationId);
        sourceOccurrences.set(number,ids);
        return `<a id="${citationId}" href="${escapeHTML(articleRoute(a,LANG))}#reference-${number}" data-reader-target="reader-reference-${number}" aria-label="${escapeHTML(`${u.reference} ${number}`)}" data-citation-occurrence="${occurrence}">[${number}]</a>`;
      }).join(', ');
      proseParts.push(`<p>${escapeHTML(localized(p))}${markers ? `<sup class="citation">${markers}</sup>` : ''}</p>`);
    });
  });
  if(proseParts.length) parts.push(`<div class="article-prose">${proseParts.join('')}</div>`);
  if(sources.length){
    const hasRetrospective = sources.some(source=>source.retrospective===true);
    const items = sources.map((source,index)=>{
      const marker = source.retrospective===true
        ? `<sup class="retrospective-marker" aria-hidden="true">†</sup><span class="visually-hidden"> — ${escapeHTML(u.retrospectiveLabel)}</span>` : '';
      const attrs = source._citationInternal ? '' : ' class="external" target="_blank" rel="noopener noreferrer external"';
      const number = index+1;
      const ids = sourceOccurrences.get(number) || [];
      const backlinks = ids.map((citationId,occurrence)=>{
        const suffix = ids.length>1 ? String(occurrence+1) : '';
        const label = `${u.returnToCitation} ${number}${ids.length>1 ? ` ${occurrence+1}` : ''}`;
        const permanentCitationId = citationId.replace(/^reader-/,'');
        return `<a href="${escapeHTML(articleRoute(a,LANG))}#${permanentCitationId}" data-reader-target="${citationId}" aria-label="${escapeHTML(label)}">↩${suffix}</a>`;
      }).join('');
      const kindLabel = source._citationInternal ? u.previousArticle : u.newsSource;
      const dateHTML = source._citationDate
        ? `<time datetime="${escapeHTML(source.publishedDate)}">${escapeHTML(source._citationDate)}</time>`
        : `<span class="reference-date-unavailable">${escapeHTML(u.dateUnavailable)}</span>`;
      return `<li id="reader-reference-${number}" tabindex="-1"><span class="reference-kind${source._citationInternal?' internal':''}">${escapeHTML(kindLabel)}</span><a href="${escapeHTML(source._citationHref)}"${attrs}><span class="reference-heading"><strong>${escapeHTML(source.name)}</strong><span aria-hidden="true">·</span>${dateHTML}</span><cite>${escapeHTML(localized(source.title))}${marker}</cite></a>${backlinks?`<span class="reference-backlinks">${backlinks}</span>`:''}</li>`;
    }).join('');
    const note = hasRetrospective ? `<p class="references-note">${escapeHTML(u.retrospectiveNote)}</p>` : '';
    parts.push(`<section class="references" id="reader-references" aria-labelledby="reader-references-title"><h2 id="reader-references-title">${escapeHTML(u.references)}</h2><ol class="reference-list">${items}</ol>${note}</section>`);
  }
  return parts.join('');
}

/* Articles reference a writer by ID; fall back to name for legacy data.
   Never returns undefined: an unknown ref yields a placeholder, so one retired or
   mistyped id cannot throw in renderAll() and blank the date menu + writers section. */
function personaOf(ref){
  return WRITERS.find(w=>w.id===ref) || WRITERS.find(w=>w.name===ref)
      || {id:ref, name:ref, role:{tr:'Konuk yazar', en:'Guest columnist'}};
}

/* An article is identified by writer + date, plus its edition index n when a writer files
   more than once that day — stable enough to share as a #hash. Edition 1 is encoded bare
   (no /n suffix) so every already-published permalink keeps resolving. topic is derivable
   from the article, so it isn't in the key. Mirrors build.py's article_key(). */
let currentArticle = null;
let savedScroll = 0;  // where the reader left the edition before opening a column
/* The article's edition index as build.py's int() would read it: decimal digits only
   (so "0x10"/"1e1" are garbage, not 16/10), truncated toward zero, anything unreadable
   is edition 1. Mirrors build.py's article_key() coercion. */
function editionN(a){
  const raw = typeof a.n === 'string' && !/^\s*[+-]?\d+\s*$/.test(a.n) ? NaN : a.n;
  return Math.trunc(Number(raw) || 1);
}
function articleId(a){
  const n = editionN(a);
  return n > 1 ? `${a.writer}/${a.date}/${n}` : `${a.writer}/${a.date}`;
}
/* One article per writer: their latest same-day edition (highest n). A writer who files
   twice over a day's news pool shows only their newest column in every roster; the earlier
   edition stays reachable by its permalink and from the reader's edition selector. */
function latestPerWriter(list){
  const best = new Map();
  list.forEach(a=>{
    const id = personaOf(a.writer).id;
    const cur = best.get(id);
    if (!cur || editionN(a) > editionN(cur)) best.set(id, a);
  });
  const seen = new Set(), out = [];
  list.forEach(a=>{ const id = personaOf(a.writer).id;
    if (!seen.has(id)){ seen.add(id); out.push(best.get(id)); } });
  return out;
}
function hashId(){
  const raw = location.hash.replace(/^#/, '');
  try { return decodeURIComponent(raw); }
  catch { return raw; }
}

/* Sidebar list of every writer publishing on this article's desk + day. */
function renderReaderNav(a){
  const nav = $('readerNav');
  const siblings = latestPerWriter(
    ARTICLES.filter(x => x.date===a.date && topicOf(x)===topicOf(a)));
  nav.innerHTML = `<div class="nav-head">${UI[LANG].writersBtn}</div>`;
  siblings.forEach(x => {
    const b = document.createElement('button');
    // Name + what they wrote about: a bare roster of names gives the reader no reason
    // to click. textContent, not innerHTML — titles are data.
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = personaOf(x.writer).name;
    const tl = document.createElement('span'); tl.className = 'tl';
    tl.textContent = localized(x.title);
    b.append(nm, tl);
    b.title = localized(x.title);
    if (articleId(x) === articleId(a)) b.setAttribute('aria-current','true');
    else b.addEventListener('click', () => openArticle(x));
    nav.appendChild(b);
  });

  // Keep one option per loaded date and show the current article's date as selected.
  // Repeat editions stay in the article's dedicated edition controls.
  const u = UI[LANG];
  const byDate = new Map();
  ARTICLES
    .filter(x => personaOf(x.writer).id===personaOf(a.writer).id)
    .forEach(x => {
      const current = byDate.get(x.date);
      if (x.date===a.date) byDate.set(x.date, a);
      else if (!current || editionN(x)>editionN(current)) byDate.set(x.date, x);
    });
  const writerDates = [...byDate.values()].sort((x,y) => y.date.localeCompare(x.date));
  if (writerDates.length > 1){
    const field = document.createElement('label');
    field.className = 'reader-history';
    const head = document.createElement('span');
    head.className = 'nav-head';
    head.textContent = u.moreFrom;
    const select = document.createElement('select');
    select.className = 'reader-history-select';
    select.dataset.writerHistorySelect = '1';
    writerDates.forEach(x => {
      const option = document.createElement('option');
      option.value = articleId(x);
      option.textContent = localized(DATE_LABELS[x.date]) || x.date;
      option.selected = x.date===a.date;
      select.appendChild(option);
    });
    select.addEventListener('change', () => {
      const next = writerDates.find(x => articleId(x)===select.value);
      if (next) openArticle(next);
    });
    field.append(head, select);
    nav.appendChild(field);
  }
}

/* Free on-device read-aloud (Web Speech API). Zero synthesis cost, so every column has
   audio even though only the weekly desk briefs get ElevenLabs episodes. */
function articleText(a){
  const parts = [localized(a.title)];
  (Array.isArray(a.sections) ? a.sections : []).forEach(s=>{
    if (!s || typeof s!=='object') return;
    parts.push(localized(s.h));
    (Array.isArray(s.ps) ? s.ps : []).forEach(p=>parts.push(localized(p)));
  });
  return parts.filter(Boolean).join('. ');
}
function stopReadAloud(){
  const u = UI[LANG];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.listen-btn.speaking').forEach(b=>{
    b.classList.remove('speaking');
    b.textContent = u.listenBtn;
  });
}

function renderReader(a){
  const u = UI[LANG];
  const w = personaOf(a.writer);
  stopReadAloud();  // a re-render (language switch, next column) invalidates the utterance
  // Every path into the reader (open, language switch, next column) lands here, so the
  // tab/share title tracks the article from one place.
  const shareTitle = localized(a.title);
  if (shareTitle) document.title = `${shareTitle} — Eigen Radar`;
  $('btnTr').href = articleRoute(a, 'tr');
  $('btnEn').href = articleRoute(a, 'en');
  $('readerBack').textContent = u.back;
  $('readerShare').textContent = u.shareBtn;
  renderReaderNav(a);
  $('readerContent').innerHTML = `
    <div class="wtop">
      <div class="avatar">${avatarOf(w)}</div>
      <div>
        <div class="wname">${escapeHTML(w.name)}<span class="ai-badge">${escapeHTML(badgeOf(w))}</span></div>
        <div class="wrole">${escapeHTML(localized(w.role))} · ${u.aiPersona} · ${escapeHTML(localized(DATE_LABELS[a.date]))} · ${escapeHTML(editionLabel(a))}</div>
      </div>
    </div>
    <h1>${escapeHTML(localized(a.title))}</h1>
    ${radarStampHTML(a)}
    <div class="body">${articleHTML(a)}</div>
    ${disclaimerHTML(topicOf(a)) ? `<div class="disclaimer" role="note">${disclaimerHTML(topicOf(a))}</div>` : ''}
  `;
  // Same-day editions of THIS writer: a rerun files a second column beside the first.
  // Rosters show only the latest; here in the open column, offer the reader the others.
  const editions = ARTICLES
    .filter(x => personaOf(x.writer).id===w.id && x.date===a.date)
    .sort((x,y)=>editionN(x)-editionN(y));
  if (editions.length > 1){
    const erow = document.createElement('div');
    erow.className = 'editions-row';
    const lab = document.createElement('span');
    lab.className = 'editions-label';
    lab.textContent = u.editionsToday;
    erow.appendChild(lab);
    editions.forEach(x=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'edition-btn';
      b.innerHTML = `<span class="edition-text">${escapeHTML(editionLabel(x))}</span><span class="edition-symbol" aria-hidden="true">${escapeHTML(editionSymbol(x))}</span>`;
      b.setAttribute('aria-label', `${u.editionWord} ${editionLabel(x)}`);
      if (articleId(x)===articleId(a)) b.setAttribute('aria-current','true');
      else b.addEventListener('click', ()=>openArticle(x));
      erow.appendChild(b);
    });
    $('readerContent').querySelector('.wtop').after(erow);
  }
  if ('speechSynthesis' in window){
    const row = document.createElement('div');
    row.className = 'listen-row';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'listen-btn';
    b.textContent = u.listenBtn;
    // ponytail: rate only — pitch/volume are the same API, add sliders if anyone asks
    const rate = document.createElement('input');
    rate.type = 'range'; rate.min = '0.5'; rate.max = '2'; rate.step = '0.1';
    const defaultRate = 1.2;
    const normalizeRate = value => {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) && parsed >= 0.5 && parsed <= 2
        ? Math.round(parsed * 10) / 10
        : defaultRate;
    };
    try { rate.value = String(normalizeRate(localStorage.getItem('ttsRate'))); }
    catch { rate.value = String(defaultRate); }
    rate.className = 'listen-rate';
    rate.setAttribute('aria-label', u.listenRate);
    const out = document.createElement('span');
    out.className = 'listen-rate-val';
    const showRate = ()=>{ out.textContent = rate.value + '×'; };
    showRate();
    // speechSynthesis ignores rate changes mid-utterance; restart so the slider actually does something
    rate.addEventListener('input', ()=>{
      rate.value = String(normalizeRate(rate.value));
      showRate();
      try { localStorage.setItem('ttsRate', rate.value); } catch {}
      if (b.classList.contains('speaking')){ stopReadAloud(); speak(); }
    });
    function speak(){
      const msg = new SpeechSynthesisUtterance(articleText(a));
      msg.lang = LANG==='tr' ? 'tr-TR' : 'en-US';
      msg.rate = normalizeRate(rate.value);
      msg.onend = msg.onerror = stopReadAloud;
      b.classList.add('speaking');
      b.textContent = u.listenStop;
      speechSynthesis.speak(msg);
    }
    b.addEventListener('click', ()=>{
      if (b.classList.contains('speaking')) stopReadAloud(); else speak();
    });
    row.append(b, rate, out);
    $('readerContent').querySelector('h1').after(row);
  }
}

/* Show an article in the reading pane. fromNav=true when we're reacting to a hash change
   (deep link / back-forward) — the hash is already correct, so we don't rewrite it. */
function showArticle(a, fromNav){
  currentArticle = a;
  // A deep link may land on a different desk/day than what's rendered behind the reader.
  const t = topicOf(a);
  if (t !== TOPIC || selectedDate !== a.date){
    if (t !== TOPIC){
      TOPIC = t;
      newsPage = 0;
      try { localStorage.setItem('topic', t); } catch {}
      selectedBriefDate = topicBriefEditions()[0]?.[0] || null;
    }
    selectedDate = a.date;
    activeFilter = 'all';
    renderAll();
  }
  renderReader(a);
  if (!fromNav && hashId() !== articleId(a)) location.hash = articleId(a);
  if (!document.body.classList.contains('reading')) savedScroll = window.scrollY;
  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  $('readerBack').focus();
}
function openArticle(a){ showArticle(a, false); }

function closeArticle(){
  if (!currentArticle) return;
  stopReadAloud();
  currentArticle = null;
  document.title = topicMeta(TOPIC).pageMeta[LANG].page;
  document.body.classList.remove('reading');
  $('btnTr').href = homeLanguageRoute('tr');
  $('btnEn').href = homeLanguageRoute('en');
  window.scrollTo(0, savedScroll);  // back to where the reader left the edition
  if (hashId()) history.pushState(null, '', location.pathname + location.search);
}

/* Citation fragments live inside the hash-routed reader. Keep the article's shareable
   hash intact while scrolling in either direction; otherwise `hashchange` would treat
   the citation/reference fragment as an unknown article and close the reader. */
$('readerContent').addEventListener('click', event=>{
  const link = event.target.closest('a[data-reader-target]');
  if(!link || !currentArticle || !isPlainClick(event)) return;
  const target = document.getElementById(link.dataset.readerTarget);
  if(!target) return;
  event.preventDefault();
  target.scrollIntoView({block:'start'});
  target.focus({preventScroll:true});
});

/* Single source of truth for the reader: the URL hash. Handles deep links on load and
   the browser back/forward buttons. openArticle sets the hash, which lands back here. */
function syncFromHash(){
  const id = hashId();
  const a = id && ARTICLES.find(x => articleId(x) === id);
  if (!a){
    currentArticle = null;
    if (document.body.classList.contains('reading')){
      document.body.classList.remove('reading');
      document.title = topicMeta(TOPIC).pageMeta[LANG].page;
      window.scrollTo(0, savedScroll);  // browser Back out of a column
    }
    return;
  }
  if (currentArticle && articleId(currentArticle) === id) return;
  showArticle(a, true);
}
$('readerBack').addEventListener('click', closeArticle);
/* Logo goes home: close any open column in place rather than reloading. The href stays
   a real link so middle-click / new-tab still work. */
$('homeLink').addEventListener('click', e => {
  if (!isPlainClick(e)) return;
  e.preventDefault();
  closeArticle();
  window.scrollTo(0, 0);
});
/* The hash id was designed to be shared; this is its one-tap affordance. Native share
   sheet where the platform has one, clipboard with a brief confirmation elsewhere. */
$('readerShare').addEventListener('click', async ()=>{
  const u = UI[LANG];
  const payload = {title: currentArticle ? localized(currentArticle.title) : document.title,
                   url: location.href};
  if (navigator.share) { navigator.share(payload).catch(()=>{}); return; }
  try {
    await navigator.clipboard.writeText(payload.url);
    $('readerShare').textContent = u.shareCopied;
    setTimeout(()=>{ $('readerShare').textContent = UI[LANG].shareBtn; }, 2000);
  } catch {}
});
window.addEventListener('hashchange', syncFromHash);
