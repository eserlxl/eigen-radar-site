ırdığı gösterildi. O elin ne kadar güçlü, ne kadar kararlı ve hangi dalga boylarında seçilebilir olduğu, bir kutuplanma denetleyicisi yapmaya kalkan herkesin ilk ölçeceği şeydir; makale bu üç sayıyı vermiyor.", "en": "On the application side the team lists control of laser light polarisation, telecommunications and quantum cryptography. What is actually on the table is a phenomenon rather than a device: a pattern etched into a thin film was shown to give diffracted light a hand. How strong that hand is, how stable, and at which wavelengths it can be selected are the first things anyone building a polarisation controller would measure, and the paper does not supply those three numbers.", "refs": ["hat"]}]}], "sources": [{"key": "hat", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/maths-acclaimed-einstein-tile-finds-a-new-home-among-physicists", "title": {"tr": "Lazer ışığı, tekrarsız \"şapka\" döşemesinden bir ellilik kazandı", "en": "Laser light picked up a handedness from the aperiodic hat tile"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-05", "title": {"tr": "Yirmi bin toprak yapısı, 4.500 kilometrekareden çıkarılabilir mi?", "en": "Can twenty thousand earthworks be inferred from 4,500 square kilometres?"}, "excerpt": {"tr": "Amazon'da havadan lazerle taranan alan 4.500 km². Bulunan anıtsal yapı sayısı 400'den fazla. Yayımlanan sayı ise 20.000. Aradaki adımın adı örnekleme.", "en": "The area scanned by airborne laser in Amazonia is 4,500 km². The number of monumental sites found is more than 400. The number published is 20,000. The step in between is called sampling."}, "sections": [{"h": {"tr": "Gerçekten ölçülen alan", "en": "The area that was actually measured"}, "ps": [{"tr": "Araştırma havadan lazer taramasıyla, yaklaşık 450 km uzunluğunda düz hatlar boyunca her 10 km'de 1 km genişliğinde şeritler tarayarak toplam 4.500 km² kadar alanı ölçtü ve iyi korunmuş 400'den fazla anıtsal tören alanı belgeledi. Taranan alanın yarısından fazlası dizgesel olarak değerlendirildi.", "en": "The survey measured a total of about 4,500 km² by airborne laser scanning, mapping 1 km wide strips every 10 km along straight transects roughly 450 km long, and documented more than 400 well-preserved monumental ceremonial sites. More than half of the scanned area was systematically assessed.", "refs": ["amazon"]}, {"tr": "Bu sayıdan bütün bölgede 20.000'den fazla tören merkezi bulunduğu öngörülüyor. Öngörünün kapsadığı alan yaklaşık 183.000 km², yani taranan alanın kırk katından fazla; bu 183.000 km² de Büyük Amazonya'nın yüzde üçünden azına denk geliyor. Her 10 km'de 1 km genişliğinde bir şerit tarandığında koridorun onda biri görülür. Yani sayı, görülenin on katına çıkmakla kalmıyor; kırk katından fazlasına genişletiliyor.", "en": "From that count, more than 20,000 ceremonial centres are projected across the whole region. The area the projection covers is about 183,000 km², more than forty times the area scanned, and those 183,000 km² themselves amount to less than three percent of Greater Amazonia. When a 1 km wide strip is scanned every 10 km, one tenth of the corridor is seen. So the number reaches beyond ten times what was seen, out to more than forty times it.", "refs": ["amazon"]}]}, {"h": {"tr": "Sayıdan nüfusa", "en": "From count to population"}, "ps": [{"tr": "İkinci genişletme nüfus tarafında. Yazarlar birinci binyılın başı için 1,25–3 milyon aralığını veriyor ve bu aralığı ihtiyatlı sayıyor; Amazon'un tümü için daha önce önerilen 1–10 milyon aralığıyla karşılaştırdıklarında ihtiyat iddiası anlaşılır hale geliyor. Yapı sayısından kişi sayısına geçmek, her yapının kaç kişiye hizmet ettiğine dair bir kabul gerektirir ve bu kabul, taramanın kendisinden gelmez.", "en": "The second extension is on the population side. The authors give a range of 1.25 to 3 million for the start of the first millennium and call that range cautious; set against the 1 to 10 million proposed earlier for the whole Amazon, the claim to caution becomes intelligible. Moving from a count of structures to a count of people requires an assumption about how many people each structure served, and that assumption does not come from the scanning.", "refs": ["amazon"]}, {"tr": "Genişletmenin gücü, hatların yapı yoğunluğunu yansız örnekleyip örneklemediğine bağlıdır. Toprak yapıları akarsu boylarında ya da su basmayan yüksek düzlüklerde kümeleniyorsa, o özellikleri dik kesen bir hat ile onlara paralel giden bir hat bambaşka yoğunluklar okur; hatların yönü sonucun içine girer. Alternatif olarak yapılar bölgeye gerçekten düzgün dağılmış olabilir, o durumda 20.000 sayısı yerinde durur. Ama iki durumu birbirinden ayırmak için ikinci bir taramaya ihtiyaç var.", "en": "The strength of the extension depends on whether the transects sample earthwork density without bias. If earthworks cluster along watercourses or on flood-free high ground, a transect cutting across those features and one running parallel to them read entirely different densities, and the orientation of the transects enters the result. Alternatively the structures may genuinely be distributed evenly across the region, in which case the figure of 20,000 stands. But separating the two cases takes a second survey.", "refs": ["amazon"]}]}, {"h": {"tr": "Bunu ne kapatır", "en": "What would settle it"}, "ps": [{"tr": "Tartışmayı ilerletecek olan, daha büyük bir sayı yerine ikinci bir örnekleme düzenidir: aynı 183.000 km² üzerinde farklı aralıkla ya da farklı yönde uçulmuş hatlar. İki ayrı geometri birbirine yakın yoğunluk veriyorsa genişletme dayanak kazanır; ayrışıyorsa fark, yapıların kendisinden çok hatların nereden geçtiğinden gelir. Bulgunun kendisi sağlam: 400'den fazla anıtsal yapı bulundu ve bunlar var. Sınanması gereken, o dört yüzden yirmi bine giden adımın kendisi.", "en": "What would move the argument forward is a second sampling design rather than a larger number: transects flown at a different spacing or in a different orientation over the same 183,000 km². If two separate geometries give densities close to one another, the extension gains support; if they diverge, the difference comes from where the transects ran rather than from the structures. The finding itself is solid: more than 400 monumental sites were found, and they exist. What needs testing is the step that runs from those four hundred to twenty thousand.", "refs": ["amazon"]}]}], "sources": [{"key": "amazon", "kind": "news", "name": "University of Helsinki", "url": "https://www.helsinki.fi/en/news/culture/ancient-civilization-millions-once-flourished-amazon", "title": {"tr": "Amazon'da 4.500 kilometrekarelik lidar taraması 400'den fazla anıtsal yapıyı haritaladı", "en": "A lidar survey of 4,500 square kilometres in Amazonia mapped more than 400 monumental sites"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-06", "title": {"tr": "Bir zihnin temelinde proteinleri doğru katlamak olabilir", "en": "The base of a mind may be nothing grander than folding proteins correctly"}, "excerpt": {"tr": "Ahtapot zekâsını hep devrelerde aradık. Harvard'daki ekip bir basamak aşağıya, proteinleri kuran makinenin kendisine baktı ve orada yalnızca ahtapotlarda görülen bir kopma buldu.", "en": "We have always looked for octopus intelligence in circuitry. A team at Harvard looked one step lower, at the machine that builds the proteins, and found there a break seen only in octopuses."}, "sections": [{"h": {"tr": "Bir basamak aşağıda", "en": "One step lower down"}, "ps": [{"tr": "Harvard'daki ekip, yalnızca ahtapotlarda görülen bir ribozomal RNA kopması buldu. Bu değişiklik bakteriye aktarıldığında hücreler protein üretirken daha az hata yaptı ve yanlış katlanmış moleküllerin zehirli yığınlar oluşturma riski düştü. Ahtapot dokusunda protein yığınları, kalamardakine göre hem daha az hem daha küçüktü.", "en": "The team at Harvard found a break in ribosomal RNA that occurs only in octopuses. When the change was engineered into bacteria, the cells made fewer mistakes while building proteins and the risk of misfolded molecules forming toxic aggregates fell. Protein clumps in octopus tissue were both fewer and smaller than in squid.", "refs": ["octopus"]}, {"tr": "Bir zihni anlamaya çalışırken alıştığımız yer nöronların birbirine nasıl bağlandığıdır: devreler, ağlar, katmanlar. Burada bakılan yer bir basamak aşağıda. Nöron bir yapıdır ve o yapı proteinlerden kurulur; onları kuran ribozom hata yaparsa, en zarif devre şeması bile yanlış malzemeyle örülür. Bu çalışmanın gösterdiği şey, o malzeme atölyesinde ahtapotlara özgü bir ayarın bulunduğudur.", "en": "When we try to understand a mind, the place we are used to looking is how neurons connect to one another: circuits, networks, layers. What is examined here is one step lower. A neuron is a structure, and that structure is built out of proteins; if the ribosome assembling them makes mistakes, even the most elegant circuit diagram gets woven from the wrong material. What this study shows is that in that materials workshop there is a setting particular to octopuses.", "refs": ["octopus"]}]}, {"h": {"tr": "Zamanlama ve temkin", "en": "Timing and restraint"}, "ps": [{"tr": "Zamanlama dikkat çekiyor. Yazarlar bu değişikliğin, sığ su ahtapotlarının yaklaşık 100 milyon yıl önce karmaşık ortamlara yerleşmesi ve sinir sistemlerinin hızla genişlemesiyle örtüştüğünü belirtiyor. Ortak baş yazar Rishav Mitra bağı kurarken dilini özenle ölçüyor: değişiklik \"might help these neurons to work well\".", "en": "The timing is striking. The authors note that this change coincides with shallow-water octopuses settling into complex environments roughly 100 million years ago and their nervous systems expanding rapidly. Co-lead author Rishav Mitra measures his language carefully in drawing the link: the change \"might help these neurons to work well\".", "refs": ["octopus"]}, {"tr": "Neden özellikle nöronlar? Uzun ömürlü ve sürekli protein üreten hücrelerde hata birikimi diğer dokulardan daha pahalıya gelir; daha doğru bir ribozom en çok orada işe yarar. Ama aynı değişiklik nöronlarla ilgisi olmayan bir nedenle de seçilmiş olabilir; sıcak ya da değişken suya dayanmak da protein katlanmasını zorlar ve o durumda sinirsel yarar yan üründür. Zamanlamanın örtüşmesi, iki açıklamadan hangisinin doğru olduğunu söylemez.", "en": "Why neurons in particular? In long-lived cells that build protein continuously, accumulated error costs more than it does in other tissue, and a more accurate ribosome pays off most there. But the same change could have been selected for a reason unconnected with neurons; tolerating warm or variable water also strains protein folding, and in that case any neural benefit is a by-product. The coincidence of timing does not tell us which of the two accounts is right.", "refs": ["octopus"]}]}, {"h": {"tr": "Bilmek ne demek olurdu", "en": "What knowing would take"}, "ps": [{"tr": "Genetikçi Eli Eisenberg sınırı açıkça koyuyor: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" İnsanda sınama ribozomal RNA'yı değiştirip öğrenme ile sorun çözmeyi ölçmeyi gerektiriyor ve çok zor sayılıyor. Yine de burada duran şey küçük değil. Bir zihnin nasıl kurulduğunu sorarken hep bir üst kata, düşüncenin kendisine bakmaya alışmışız; bu bulgu aynı soruyu bodruma taşıyor ve orada bir molekülün nasıl doğru katlandığını soruyor. Şimdilik bir hipotez. Ama sorunun yerini değiştiren bir hipotez.", "en": "The geneticist Eli Eisenberg sets the limit plainly: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" Testing this in humans would mean altering ribosomal RNA and measuring learning and problem-solving, which is described as highly challenging. Even so, what stands here is not small. Asking how a mind is built, we are used to looking upstairs, at thought itself; this finding carries the same question down to the basement and asks there how a molecule folds correctly. For now it is a hypothesis. But it is one that moves where the question sits.", "refs": ["octopus"]}]}], "sources": [{"key": "octopus", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/a-unique-cellular-trick-may-explain-octopus-intelligence", "title": {"tr": "Ahtapot ribozomal RNA'sındaki bir kopma, protein üretimindeki hataları azaltıyor", "en": "A break in octopus ribosomal RNA lowers errors in protein building"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Sinir sistemi işareti nüfus ölçeğinde, tanı ölçeğinde değil", "en": "The nervous-system signal is population-scale, not diagnostic"}, "excerpt": {"tr": "2,56 milyon kişilik çalışma fibromiyaljinin genetik işaretlerini beyin ve sinir hücrelerinde topluyor. Bu, biyolojik çerçeveyi keskinleştiriyor; tek bir hastanın tanısını, ağrısının kaynağını ya da tedavisini belirlemiyor.", "en": "A study of 2.56 million people concentrates fibromyalgia's genetic signal in brain and neural cells. That sharpens the biological framework without determining one patient's diagnosis, source of pain or treatment."}, "sections": [{"h": {"tr": "Büyük örneklem neyi satın aldı", "en": "What the large sample bought"}, "ps": [{"tr": "Meta-analiz 11 kohorttan 54.629 fibromiyalji olgusunu 2.509.126 kontrolle birleştirdi; toplam 2.563.755 kişi. Çok kökenli genom çapında tarama 26 risk bölgesi buldu. Bu büyüklük, daha küçük çalışmaların yakalayamadığı zayıf ve dağınık ilişkileri görünür kılıyor; fakat her bölge hastalığın küçük bir nüfus düzeyi olasılık farkını taşıyor. ‘Risk bölgesi’, bir kişide hastalığı açıklayan mutasyon ya da klinik test anlamına gelmiyor.", "en": "The meta-analysis combined 54,629 fibromyalgia cases with 2,509,126 controls across 11 cohorts, a total of 2,563,755 people. The multi-ancestry genome-wide scan found 26 risk loci. That scale makes weak, distributed associations visible where smaller studies could not, but each locus carries a small population-level difference in probability. A ‘risk locus’ is not a mutation that explains the condition in one person or a clinical test.", "refs": ["fibromyalgia"]}, {"tr": "En güçlü ilişki, Huntington hastalığının nedensel geni HTT'deki kodlayan bir varyantla kuruldu; gen önceliklendirmesi HTT'yi düzenleyen GPR52 ile DCC, DRD2/NCAM1, MDGA2 ve CELF4 gibi sinir sistemi adaylarını da öne çıkardı. Kalıtılabilirlik zenginleşmesi beyin dokuları ve sinir hücrelerinde toplandı. Aynı genin iki hastalıkta görünmesi iki hastalığın aynı olduğu anlamına gelmez: ortak genetik bölge farklı hücrelerde, farklı biyolojik yollar ve etki büyüklükleriyle çalışabilir.", "en": "The strongest association involved a coding variant in HTT, the causal gene for Huntington's disease; gene prioritisation also highlighted the HTT regulator GPR52 and neural candidates including DCC, DRD2/NCAM1, MDGA2 and CELF4. Heritability enrichment concentrated in brain tissues and neural cells. The same gene appearing in two conditions does not make the conditions the same: a shared genomic region can act through different cells, pathways and effect sizes.", "refs": ["fibromyalgia"]}]}, {"h": {"tr": "Korelasyon nüfus ölçeğinde durur", "en": "Correlation stops at the population scale"}, "ps": [{"tr": "Fibromiyaljinin bel ağrısı, travma sonrası stres bozukluğu ve irritabl bağırsak sendromuyla genetik korelasyonları 0,7'nin üzerindeydi. Bu sayıların dili ortak kalıtsal yatkınlıktır; bir durumun ötekine yol açtığını ya da yakınmaların ‘yalnızca psikolojik’ olduğunu söylemez. Kohortların hastane ve birinci basamak kayıtlarındaki tanı kodlarına dayanması da önemlidir: genişlik, klinik değerlendirmedeki farklılıkları ve yanlış sınıflandırmayı otomatik olarak ortadan kaldırmaz.", "en": "Fibromyalgia's genetic correlations with low-back pain, post-traumatic stress disorder and irritable bowel syndrome exceeded 0.7. Those numbers describe shared inherited liability; they do not say that one condition causes another or that symptoms are ‘only psychological’. It also matters that cohorts used diagnosis codes from hospital or primary-care records: scale does not automatically remove differences in clinical assessment or misclassification.", "refs": ["fibromyalgia"]}, {"tr": "Fibromiyaljinin görülme sıklığında büyük cinsiyet farkları olmasına rağmen erkeklerle kadınların genetik mimarisi çalışmada neredeyse aynı çıktı. Bu bulgu, sıklık farkını genetik farkla açıklayan basit hesabı zayıflatıyor; tanıya erişim, hormonlar, çevre ve ölçüm gibi başka katmanları açık bırakıyor. Bugünkü klinik değer, kronik ağrıyı sinir sistemi biyolojisi içinde sınanabilir hedeflere ayıran daha sağlam bir araştırma haritasında yatıyor. Bu verilerden ilaç seçimi çıkmıyor.", "en": "Despite large sex differences in fibromyalgia prevalence, the study found nearly identical genetic architecture in males and females. That weakens a simple account in which prevalence follows genetic difference and leaves other layers—diagnostic access, hormones, environment and measurement—open. Its clinical value today lies in a stronger research map dividing chronic pain into testable targets within nervous-system biology. Drug choice does not follow from these data.", "refs": ["fibromyalgia"]}]}], "sources": [{"key": "fibromyalgia", "kind": "news", "name": "Nature Medicine", "url": "https://www.nature.com/articles/s41591-026-04492-6", "title": {"tr": "2,56 milyon kişilik fibromiyalji meta-analizi 26 genetik risk bölgesi buldu", "en": "A fibromyalgia meta-analysis across 2.56 million people found 26 genetic risk loci"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-03", "title": {"tr": "Kuraklığın tanısını artık yalnızca yağış koymuyor", "en": "Rainfall no longer diagnoses the drought alone"}, "excerpt": {"tr": "Amazon havzasındaki 2023–2024 kuraklığı alanın yüzde 88'ine yayıldı. Yağış kırılmanın yalnızca bir tarafı: 2005 sonrasında ısınan havanın su talebi, büyük kuraklıkları şiddetlendiren baskın bileşen hâline geliyor.", "en": "The Amazon drought of 2023–2024 spread across 88 percent of the basin. Rainfall is only one side of the break: after 2005, warming-driven atmospheric demand becomes the dominant intensifier of major droughts."}, "sections": [{"h": {"tr": "Kırk dört yıllık sıralama", "en": "A forty-four-year ranking"}, "ps": [{"tr": "Araştırmacılar 1980–2024 arasındaki Amazon kuraklıklarını aynı çerçevede sıraladığında 2023–2024 olayı havzanın yüzde 88'ini kapladı. Büyüklüğü, en büyük beş kuraklığın ortalamasının dört katına ulaştı. Bu iki sayı farklı şeyleri tutuyor: yüzde 88 mekânsal yayılımı, dört kat ise süre ile şiddeti birleştiren büyüklüğü. Tek bir yağış istasyonunun kötü yılı değil, havza ölçeğinde eşzamanlı bir su açığı söz konusu.", "en": "When the researchers ranked Amazon droughts from 1980 to 2024 in one framework, the 2023–2024 event covered 88 percent of the basin. Its magnitude reached four times the average of the five largest droughts. The two numbers capture different dimensions: 88 percent is spatial reach, while fourfold magnitude combines duration and intensity. This was not one rain gauge's bad year but a basin-scale water deficit occurring at once.", "refs": ["amazon-drought"]}, {"tr": "Daha önemli ayrım zaman içinde belirdi. 2005 öncesindeki büyük kuraklıklar başlıca yağış azlığıyla açıklanırken, 2005 sonrasında ısınmanın artırdığı atmosferik buharlaştırma talebi şiddetlendirici baskın bileşen hâline geldi. Sıcak hava toprağın ve bitkinin üzerindeki su çekişini büyütüyor; aynı yağış açığı daha yüksek sıcaklık altında daha ağır bir ekolojik bilanço üretebiliyor. Böylece meteorolojik kuraklık ile bitkinin yaşadığı su stresi arasındaki bağ değişiyor.", "en": "The more consequential division appeared over time. Before 2005 major droughts were explained chiefly by reduced rainfall; after 2005, warming-enhanced atmospheric evaporative demand became the dominant intensifier. Hotter air increases the pull of water from soil and vegetation, so the same rainfall deficit can produce a heavier ecological balance sheet at higher temperature. The link between meteorological drought and the water stress experienced by plants is changing.", "refs": ["amazon-drought"]}]}, {"h": {"tr": "Tahmin ile hazırlık arasındaki ölçü", "en": "The measure between forecast and preparation"}, "ps": [{"tr": "Çalışma kuraklık örüntüsünü tropik Hint ve Pasifik okyanuslarıyla Kuzey Atlantik'teki deniz yüzeyi sıcaklığı sapmalarına bağlıyor. Bu bağlantılar uzak okyanusların Amazon'u tek başına yönettiğini kanıtlamıyor; atmosferik dolaşım üzerinden birlikte değişen koşulları işaretliyor. Yağış, sıcaklık ve okyanus sapmaları birbirine bağlı olduğundan her bileşenin payı seçilen kuraklık göstergesine ve döneme duyarlı.", "en": "The study links the drought pattern to sea-surface temperature anomalies in the tropical Indian and Pacific oceans and the North Atlantic. Those links do not prove that distant oceans govern the Amazon alone; they identify conditions that co-vary through atmospheric circulation. Because rainfall, temperature and ocean anomalies are coupled, each component's share remains sensitive to the drought indicator and period selected.", "refs": ["amazon-drought"]}, {"tr": "Hazırlık sistemi yağışı izlemeyi sürdürüyor ve eşiğe atmosferik talebi de ekliyor. Nehir taşımacılığı, yangın yönetimi, tarım ve elektrik üretimi için aynı yağış tahmini farklı sıcaklıklarda farklı risk demek. Havza yöneticileri yağış açığı ile buharlaştırma talebini birlikte izlediğinde uyarı, gökten gelmeyen suyun yanında toprağın ve ormanın su kaybetme hızını da kapsar. Isınma, kuraklığın ikinci bir sayacı hâline gelmiş durumda.", "en": "A preparedness system continues to track rainfall and adds atmospheric demand to its thresholds. For river transport, fire management, farming and power generation, the same rainfall forecast means different risk at different temperatures. When basin managers track rainfall deficit and evaporative demand together, an alert covers water missing from the sky alongside the rate at which soil and forest lose it. Warming has become a second drought meter.", "refs": ["amazon-drought"]}]}], "sources": [{"key": "amazon-drought", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-62139-5", "title": {"tr": "Amazon'un 2023–2024 kuraklığı havzanın yüzde 88'ini etkiledi", "en": "The Amazon drought of 2023–2024 affected 88 percent of the basin"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-04", "title": {"tr": "Küresel bina haritası iki vekil üzerine kurulu", "en": "The global building map stands on two proxies"}, "excerpt": {"tr": "Model 9.000'i aşkın kent merkezindeki yapı stokunu iklimlendirme kırılganlığına çeviriyor. Haritanın gücü küresel tutarlılık; sınırı ise gerçek sayaçlar yerine yapım dönemiyle bina kompaktlığını kullanması.", "en": "A model turns building stock across more than 9,000 urban centres into a map of climatization vulnerability. Its strength is global consistency; its limit is reliance on construction epoch and compactness rather than actual meters."}, "sections": [{"h": {"tr": "Haritanın iki taşıyıcı kolonu", "en": "The map's two load-bearing columns"}, "ps": [{"tr": "Bir binanın iklimlendirme gereksinimini küresel ölçekte karşılaştırmak için ortak bir yapı dili gerekiyor. Çalışma, yapı ayak izlerini ve Dünya gözlemlerini eş büyüklükteki coğrafi karelerde birleştirip 9.000'i aşkın kent merkezini aynı hesap çerçevesine yerleştiriyor. Ayak izi ile yükseklik, yapı stokunun biçimini kuruyor; yapım dönemi de farklı teknik standartlar altında inşa edilmiş stok için zaman katmanı ekliyor. Böylece tek tek binaları denetlemek yerine tutarlı bir dünya modeli üretiliyor.", "en": "Comparing building climatization needs globally requires one common language for structures. The study combines building footprints and Earth observations in equally sized geographic tiles, placing more than 9,000 urban centres inside one computational frame. Footprint and height construct the stock's geometry; construction epoch adds a time layer for structures built under different technical standards. The result is a consistent world model rather than an audit of individual buildings.", "refs": ["building-climatization"]}, {"tr": "Modelin yük taşıyan iki vekili yapım dönemi ile kompaktlık. Yapıların yüzde 43'ünün 1980 öncesine ait olması, eski stokun haritadaki ağırlığını belirliyor. Kompaktlık ise dış yüzey ile kapalı hacim arasındaki ilişkiyi yaklaşık olarak temsil ediyor; aynı yerel ısıtma ya da soğutma gereksiniminde daha elverişsiz biçimler farklı kırılganlık puanı alıyor. Enerji sayaçları, HVAC verimi ve iç sıcaklık ölçümleri bu hesapta doğrudan gözlenmiyor. Harita bu yüzden enerji tüketimini ölçen bir sayaç ağı değil, yapı verisinden kurulan bir tarama modeli.", "en": "The model's two load-bearing proxies are construction epoch and compactness. With 43 percent of buildings predating 1980, older stock carries substantial weight in the map. Compactness approximates the relation between exterior surface and enclosed volume, so less favourable forms receive a different vulnerability score under the same local heating or cooling need. Energy meters, HVAC efficiency and indoor temperatures are not observed directly. The map is therefore a screening model assembled from building data, not a metering network measuring energy use.", "refs": ["building-climatization"]}]}, {"h": {"tr": "Senaryo çıktısı ile bina denetimi arasındaki mesafe", "en": "The distance between a scenario output and a building audit"}, "ps": [{"tr": "Bu kurulum günümüzde yaklaşık 48 milyon kişiyi, yerel ısıtma veya soğutma gereksinimine göre kırılgan yapıların yoğunlaştığı alanlarla eşleştiriyor. Bu sayı enerji yoksulluğunu, arızalı iklimlendirme sistemlerini ya da tek tek evlerde ölçülen sıcaklığı doğrudan saymıyor. Yapı stokunun vekil özelliklerini yerel iklim gereksinimiyle aynı modelde buluşturuyor. Dolayısıyla 48 milyon, bina düzeyindeki kesin bir envanterden çok karşılaştırılabilir bir maruziyet taramasıdır.", "en": "Under this construction, about 48 million people now fall within areas where buildings vulnerable relative to local heating or cooling needs are concentrated. That count does not directly enumerate energy poverty, failed climatization systems or measured temperatures in individual homes. It brings proxy features of building stock together with local climate needs in one model. The 48 million is therefore a comparable exposure screening result rather than a definitive building-level inventory.", "refs": ["building-climatization"]}, {"tr": "Basitleştirilmiş şekil katsayısı ile ayak izi ve yükseklik hataları modelin geometrik hata bütçesini oluşturuyor. Yenileme oranları, HVAC verimi, kültürel uyum ve kullanıcı davranışı ise aynı geometrinin gerçek yaşamda farklı sonuçlar vermesine yol açabilir. Bu sınırlar haritayı değersizleştirmiyor; uygun kullanım alanını daraltıyor. Kent ve ulusal ölçekte hangi bölgelerin daha ayrıntılı saha çalışmasına ihtiyaç duyduğunu sıralayabilir. Tek bir evin güvenliği, enerji faturası ya da yenileme reçetesi için yerel ölçüm ve bina denetimi yine gerekli.", "en": "A simplified shape factor plus footprint and height errors form the model's geometric error budget. Renovation rates, HVAC efficiency, cultural adaptation and occupant behaviour can then make identical geometry perform differently in practice. Those limits narrow the map's proper use. It can rank regions that need deeper field work at city or national scale. Judging one home's safety, energy bill or retrofit prescription still requires local measurements and a building audit.", "refs": ["building-climatization"]}]}], "sources": [{"key": "building-climatization", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-58888-y", "title": {"tr": "Küresel yapı stoku modeli, bugün 48 milyon kişiyi iklimlendirme açısından kırılgan alanlarda buluyor", "en": "A global building-stock model places 48 million people in climatization-vulnerable areas today"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-05", "title": {"tr": "Okyanusun üretim toplamı, saha ölçümlerine yaklaşınca küçüldü", "en": "The ocean production total shrank when it moved closer to field measurements"}, "excerpt": {"tr": "Genişletilmiş karbon izotopu veri tabanı, küresel deniz birincil üretimini yaygın uydu ürünlerinden yüzde 10–20 aşağı çekiyor. Sonuç, seyrek ölçümle model arasındaki kalibrasyonu değiştiriyor ve doğrudan küresel sayım sunmuyor.", "en": "An expanded carbon-isotope database pulls global marine primary production 10–20 percent below common satellite products. The result changes calibration between sparse measurements and a model and provides no direct global census."}, "sections": [{"h": {"tr": "Ölçüm ağı büyüdüğünde", "en": "When the measurement network grows"}, "ps": [{"tr": "Deniz net birincil üretimi küresel ölçekte doğrudan sayılamıyor. Karbon izotopu kuluçka deneyleri yerel ve seyrek, uydular ise okyanus rengini geniş alanda görüyor ama karbon akışını doğrudan tartmıyor. Çalışma, saha kuluçka veri tabanının kapsamını yaklaşık yüzde 50 genişletti ve birden çok uydu ürününü bu gözlemlerle aynı noktalarda karşılaştırdı. Yöntemin hikâyesi yeni bir sensörden çok, uydunun vekil ölçüsünü daha geniş bir saha ağına yeniden bağlamak.", "en": "Global marine net primary production cannot be counted directly: carbon-isotope incubation experiments are local and sparse, while satellites see ocean colour broadly but do not weigh carbon flow itself. The study expanded the coverage of the field-incubation database by about 50 percent and compared multiple satellite products with those observations at matched locations. The methodological story is less a new sensor than a broader field network reconnecting a satellite proxy to measured production.", "refs": ["marine-productivity"]}, {"tr": "Bu karşılaştırmayla sınırlandırılan model, küresel üretimi yaygın uydu ürünlerinden yüzde 10–20 daha düşük hesapladı. Model tek bir düzeltme katsayısı uygulamak yerine çevresel değişkenlerle saha ölçümleri arasındaki ilişkiyi yeniden öğreniyor. Uydu döneminin yeniden kurulumlarında Kuzey Yarımküre'de mekânsal farklılaşma artarken Güney Yarımküre'de üretim daha tekdüze dağılıyor. Yani hem toplam hem haritanın biçimi değişiyor.", "en": "The model constrained by that comparison estimated global production 10–20 percent below widely used satellite products. Rather than applying one correction factor, it relearns the relation between field measurements and environmental variables. Reconstructions over the satellite era show growing spatial heterogeneity in the Northern Hemisphere and a more homogeneous distribution in the Southern Hemisphere. Both the total and the shape of the map change.", "refs": ["marine-productivity"]}]}, {"h": {"tr": "Daha düşük sayının güven aralığı", "en": "The confidence interval around the lower number"}, "ps": [{"tr": "Saha ölçümleriyle sınırlanan model, doğrudan küresel gözlemden farklı bir kanıt türüdür. Saha noktaları kıyılar, mevsimler ve erişilebilir bölgeler arasında eşit dağılmıyor; model bu boşlukları sıcaklık, ışık, besin ve renk gibi çevresel değişkenlerle dolduruyor. Veri tabanının yüzde 50 büyümesi önemli, fakat okyanusun her hücresini ölçülmüş hâle getirmiyor. Sonuç, eski ürünlerin saha ölçümlerine göre taşıdığı sistematik farkı niceliyor ve onların tümünü yanlış ilan etmiyor.", "en": "A model constrained by field measurements is a different kind of evidence from direct global observation. Field sites are uneven across coasts, seasons and accessible regions, and the model fills those gaps with environmental variables such as temperature, light, nutrients and colour. A 50 percent expansion is substantial, yet every ocean cell remains short of direct measurement. The result quantifies the products' systematic difference from field measurements without declaring all older products wrong.", "refs": ["marine-productivity"]}, {"tr": "Yüzde 10–20'lik aşağı yönlü revizyon, okyanusun atmosferden aldığı karbonun aynı oranda değiştiği anlamına da gelmez; birincil üretim ile uzun süreli karbon gömülmesi aynı büyüklük değildir. Ancak karbon döngüsü modellerinin başlangıç akısını ve hangi bölgelerde değişim arayacağını etkiler. Bağımsız sınama için en değerli ek veri, bugünkü veri tabanında seyrek kalan açık okyanus ve mevsimlerde aynı kuluçka protokolleriyle alınacak ölçümlerdir.", "en": "A 10–20 percent downward revision does not mean that the ocean's uptake of atmospheric carbon changes by the same amount; primary production and long-term carbon storage are not the same quantity. It does alter the starting flux in carbon-cycle models and where they look for change. The most valuable independent test would add measurements with the same incubation protocols in open-ocean regions and seasons that remain sparse in the present database.", "refs": ["marine-productivity"]}]}], "sources": [{"key": "marine-productivity", "kind": "news", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03828-x", "title": {"tr": "Gözlemle sınırlandırılan model, küresel deniz üretkenliğini uydu ürünlerinden yüzde 10–20 daha düşük hesapladı", "en": "An observation-constrained model put global marine productivity 10–20 percent below satellite products"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-06", "title": {"tr": "Çeşitlilik yalnızca çevrede yaşamıyor, çevreyi yapanlarda da yaşıyor", "en": "Diversity lives not only in an environment but in the organisms that build it"}, "excerpt": {"tr": "Fanerozoyik fosil topluluklarında resif kurucuları ve tortu karıştırıcılar daha yüksek çeşitlilikle birlikte görülüyor. Yüz milyonlarca yıla yayılan ilişki, yaşamın yalnızca çevreye uymadığını, yaşanabilir çevreyi de kurduğunu gösteriyor.", "en": "Across Phanerozoic fossil communities, reef builders and sediment mixers accompany higher diversity. A relationship spanning hundreds of millions of years shows that life not only fits environments; it also constructs habitable ones."}, "sections": [{"h": {"tr": "Her jeolojik evrede aynı soru", "en": "The same question in every geological stage"}, "ps": [{"tr": "Çalışma Fanerozoyik'in her evresinde, resif kurucuları ya da tortuyu karıştıran biyotürbasyon canlıları bulunan fosil topluluklarını bunların bulunmadığı topluluklarla karşılaştırdı. Çeşitliliği yalnız tür sayısıyla değil, bolluk dağılımını da hesaba katan Shannon ölçüsüyle değerlendirdi ve her evre için etki büyüklüğü hesapladı. Yaklaşık 541 milyon yıllık kaydı tek toplamda eritmek yerine zaman dilimlerine ayırmak, ilişkinin ne zaman sürdüğünü ve ne zaman zayıfladığını görmeyi sağlıyor.", "en": "For every stage of the Phanerozoic, the study compared fossil communities containing reef builders or sediment-mixing bioturbators with communities lacking them. It assessed diversity not only by species count but with the Shannon measure, which includes abundance distribution, and calculated an effect size for each stage. Rather than melting roughly 541 million years into one total, the stage-by-stage design shows when the relationship persists and when it weakens.", "refs": ["ecosystem-engineers"]}, {"tr": "Fanerozoyik'in büyük bölümünde ekosistem mühendislerinin bulunduğu topluluklar anlamlı biçimde daha yüksek çeşitlilik taşıdı; etki en güçlü biçimde ılımlı sıcaklıklarda görüldü. Bu ilişki makul bir mekanizmaya sahip: resifler üç boyutlu barınak ve yüzey, tortu karıştırıcılar ise oksijen ve besin akışı yaratıyor. Fakat veri karşılaştırmalı fosil kaydı olduğu için mekanizma deneysel olarak ayrıştırılmıyor; mühendisler çeşitliliği artırabilir, çeşitlilik de mühendislerin kalabildiği istikrarlı koşulları işaretleyebilir.", "en": "Through much of the Phanerozoic, communities with ecosystem engineers carried significantly greater diversity, with the strongest effect at moderate temperatures. The association has a plausible mechanism: reefs create three-dimensional shelter and surface, while sediment mixers create flows of oxygen and nutrients. But because the evidence is a comparative fossil record, the mechanism is not experimentally separated; engineers may raise diversity, while diversity may also mark stable conditions in which engineers persist.", "refs": ["ecosystem-engineers"]}]}, {"h": {"tr": "Mühendisin türü geleceği değiştiriyor", "en": "The kind of engineer changes the future"}, "ps": [{"tr": "Yaklaşık son 250 milyon yılda modern resif kurucuları iklim baskısına biyotürbasyon yapan canlılardan daha duyarlı görünüyor. İki grup habitatı aynı yoldan kurmuyor: resif, karmaşık ama sıcaklık ve kimyaya hassas bir fiziksel yapı; tortu karıştırma ise deniz tabanında daha dağınık bir işlem. Bugünkü ısınmada ‘ekosistem mühendisi’ etiketini tek bir dayanıklılık sınıfı saymak bu nedenle yanıltıcı. Hangi mühendislik işlevinin kaybolduğu, tür sayısı kadar önem taşıyabilir.", "en": "Across roughly the past 250 million years, modern reef builders appear more sensitive to climate stress than bioturbators. The two groups do not construct habitat in the same way: a reef is a complex physical structure sensitive to temperature and chemistry, whereas sediment mixing is a more distributed process across the seabed. Treating ‘ecosystem engineer’ as one resilience class under present warming is therefore misleading. Which engineering function disappears may matter as much as the species count.", "refs": ["ecosystem-engineers"]}, {"tr": "Fosil kaydı, korunmaya uygun kabukları, erişilebilir kayaçları ve iyi örneklenmiş bölgeleri kayıran bir parça dizisidir. Buna rağmen aynı karşılaştırmanın yüz milyonlarca yıl boyunca tekrar tekrar çıkması, canlılığı fiziksel çevrenin etkin bir kurucusu olarak çerçeveliyor. Yaşam, sonraki yaşamın kullanacağı oyukları, yüzeyleri ve kimyasal yolları kuruyor. İlişki bir nedensellik hükmünden ziyade çeşitlilik tarihinin ortamı kuran canlılarla birlikte yazılması gerektiğine dair bir işaret.", "en": "The fossil record is a sequence of fragments favouring preservable shells, accessible rocks and well-sampled regions. Even so, the same comparison recurring over hundreds of millions of years frames life as an active builder of physical environments. Organisms construct cavities, surfaces and chemical pathways that later life can use. The association serves as a sign that the history of diversity must be written with environment-building organisms, rather than as a verdict of causality.", "refs": ["ecosystem-engineers"]}]}], "sources": [{"key": "ecosystem-engineers", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-73628-6", "title": {"tr": "Fosil topluluklarında ekosistem mühendislerinin varlığı daha yüksek deniz çeşitliliğiyle birlikte görüldü", "en": "Fossil communities with ecosystem engineers were associated with greater marine diversity"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}], "dates": ["2026-08-04", "2026-08-03", "2026-08-02", "2026-08-01", "2026-07-31", "2026-07-30", "2026-07-29"], "dateLabels": {"2026-08-04": {"tr": "4 Ağustos 2026", "en": "August 4, 2026"}, "2026-08-03": {"tr": "3 Ağustos 2026", "en": "August 3, 2026"}, "2026-08-02": {"tr": "2 Ağustos 2026", "en": "August 2, 2026"}, "2026-08-01": {"tr": "1 Ağustos 2026", "en": "August 1, 2026"}, "2026-07-31": {"tr": "31 Temmuz 2026", "en": "July 31, 2026"}, "2026-07-30": {"tr": "30 Temmuz 2026", "en": "July 30, 2026"}, "2026-07-29": {"tr": "29 Temmuz 2026", "en": "July 29, 2026"}}, "newsDates": {"science": "2026-08-04"}, "podcasts": {"science": {"2026-07-30": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-07-30-science-en.1104a6942156.mp3", "bytes": 1759652}}}}}, "2026-07-31": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-07-31-science-en.217d5d2b04ee.mp3", "bytes": 1719528}}}}}, "2026-08-01": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-08-01-science-en.887a2299ae50.mp3", "bytes": 1515982}}}}}, "2026-08-04": {"editions": {"1": {"files": {"en": {"url": "/episodes/2026-08-04-science-en.c5e8f9e071d6.mp3", "bytes": 2011681}}}}}}}, "updated": "2026-08-04T17:28:12+00:00"};

      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}

  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

function dailyPodcastSource(podcasts,topic,date,lang){
  const dateEntry = ((podcasts || {})[topic] || {})[date];
  const entry = dateEntry && dateEntry.editions && dateEntry.editions['1'];
  const file = entry && entry.files && entry.files[lang];
  return file && file.url;
}

function pageItems(items, requestedPage, pageSize){

  const start = page * pageSize;
  return {items:items.slice(start, start + pageSize), page, pages};
}
