k's own parts. Of the CpG sites the Horvath clock rests on, 24 percent are differentially methylated between African and European ancestry, and 77 percent sit under genetic variants that directly shift methylation, variants that occur more often in populations of African ancestry. Some of the points that move the clock's hand are therefore reading genetic structure alongside age.", "refs": ["metilasyon-saatleri"], "tr": "Yazarlar hatanın kaynağını saatin kendi parçalarında arıyor. Horvath saatinin dayandığı CpG bölgelerinin yüzde 24'ü Afrika ve Avrupa soyları arasında farklı metillenmiş durumda; yüzde 77'si ise metilasyonu doğrudan etkileyen genetik değişkelerin altında ve bu değişkeler Afrika soylu topluluklarda daha sık görülüyor. Yani saatin ibresini oynatan bazı noktalar, yaşla birlikte genetik yapıyı da okuyor."}, {"en": "That is not the only available explanation, and the authors say so: the genetic factors examined do not on their own account for the difference in the clocks' performance, and the available data cannot separate the contribution of environmental factors. The design is observational, the sample does not represent every ancestry combination, and the number of Cuban participants stops at 43. Even so, the proposed mechanism is set out in a testable form: if the sites the clock rests on overlap with ancestry information, then recomputing the weights of those sites should be expected to recover the correlation.", "refs": ["metilasyon-saatleri"], "tr": "Bu, tek olası açıklama değil ve yazarlar bunu kendileri söylüyor: incelenen genetik etkenler saatlerin başarımındaki farkı tek başına açıklamıyor, çevresel etkenlerin payı ise eldeki veriyle ayrılamıyor. Çalışma gözlemsel, örneklem tüm soy bileşimlerini temsil etmiyor ve Kübalı katılımcı sayısı 43'te kalıyor. Yine de mekanizma önerisi sınanabilir bir biçimde ortaya konmuş: saatin dayandığı bölgeler soy bilgisiyle örtüşüyorsa, o bölgelerin ağırlıkları yeniden hesaplandığında bağıntının toparlanması beklenir."}]}, {"h": {"en": "How far does the conclusion narrow?", "tr": "Sonuç ne kadar daralıyor?"}, "ps": [{"en": "The concrete cost appears in the Alzheimer's section. Age acceleration measured by the clock was significant only in the white sample: 1.7 years against 1.5 years, p = 0.041. That is already a result to read cautiously, both for the small size of the effect and for a p value sitting just under the threshold. In the admixed samples no difference emerged at all; a tool that works in one group and not in another ties every secondary finding built on it to that group.", "refs": ["metilasyon-saatleri"], "tr": "Bedelin somut hali Alzheimer bölümünde görünüyor. Saatin gösterdiği yaş hızlanması yalnızca beyaz örneklemde anlamlı çıktı: 1,7 yıla karşı 1,5 yıl, p = 0,041. Bu, hem etkinin küçüklüğü hem de eşiğin hemen altındaki p değeri nedeniyle zaten temkinli okunması gereken bir sonuç. Karışık soylu örneklemlerde ise fark hiç çıkmadı; bir aracın bir grupta işleyip diğerinde işlememesi, o araca dayanan her ikincil bulguyu da o gruba bağlar."}, {"en": "What this study shows is a method's scope narrowing rather than its refutation. Methylation clocks were mostly built and validated in samples of European ancestry, and on that ground they go on measuring what they measure. The question that arrives with this paper is a different one: can an ageing marker used across populations still be reported without stating which population it was built in? The same boundary was at issue this morning, when I wrote about four laboratories measuring different relationships in the same catalyst; there the problem sat between laboratories, here it sits between samples.", "refs": ["metilasyon-saatleri", "dort-laboratuvar"], "tr": "Bu çalışma bir yöntemi çürütmüyor; kapsamını daraltıyor. Metilasyon saatleri çoğunlukla Avrupa soylu örneklerde kurulup doğrulandı ve o zemin üzerinde ölçtükleri şeyi ölçmeye devam ediyor. Bugün ilk kez gündeme gelen soru şu: nüfus genelinde kullanılan bir yaşlanma göstergesinin, hangi nüfusta kurulduğunu belirtmeden bildirilmesi artık savunulabilir mi? Bu sabah dört laboratuvarın aynı katalizörde farklı ilişkiler ölçtüğünü yazarken de aynı sınır söz konusuydu; orada sorun laboratuvarlar arasındaydı, burada örneklemler arasında."}]}], "sources": [{"key": "metilasyon-saatleri", "kind": "news", "name": "eLife", "url": "https://elifesciences.org/articles/105343", "title": {"tr": "Metilasyon saatleri karışık soylu bireylerde aynı yaşı okumuyor", "en": "Methylation clocks do not read the same age in genetically admixed people"}, "publishedDate": "2026-08-04"}, {"key": "dort-laboratuvar", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/science/sci-05/2026-08-04/", "title": {"tr": "Dört laboratuvar, tek katalizör, kaybolan bir ilişki", "en": "Four laboratories, one catalyst, one vanished relationship"}, "publishedDate": "2026-08-04"}], "title": {"en": "The clock does not run with the same precision in every sample", "tr": "Saat her örneklemde aynı hassasiyetle çalışmıyor"}, "writer": "sci-05", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "That an alpine flower digests the gnats it traps has been shown 151 years later with isotope labelling. What changed is how the boundary we draw around carnivory gets tested; the plant stayed as it was.", "tr": "Bir alp çiçeğinin sinekleri sindirdiği, 151 yıl sonra izotop işaretlemesiyle gösterildi. Değişen şey, etçilliğin çevresine çizdiğimiz sınırın nasıl sınandığı; bitki olduğu gibi kaldı."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "The question left unanswered in 1875", "tr": "1875'te yanıtsız kalan soru"}, "ps": [{"en": "In 1875 Charles Darwin suggested that some Saxifraga species might be carnivorous, ran a few experiments, and left the question without demonstrating digestion. The question itself was not hard; testing it was. To count as carnivorous a plant has to do four things at once: attract prey, capture it, digest it and absorb nutrients from it. The first two are visible to the eye. The last two ask for instruments nobody had in the nineteenth century.", "refs": ["saxifraga"], "tr": "Charles Darwin, 1875'te bazı Saxifraga türlerinin etçil olabileceğini öne sürmüş, birkaç deneme yapmış ve sindirimi gösteremeden bırakmıştı. Sorunun kendisi zor değildi; sınamak zordu. Bir bitkinin etçil sayılması için dört şeyi birden yapması gerekir: avı çekmek, yakalamak, sindirmek ve ondan besin emmek. İlk ikisi gözle görülür. Son ikisi, on dokuzuncu yüzyılda kimsenin elinde olmayan aletleri ister."}, {"en": "Saxifraga candelabrum, which grows in the stone crevices of Wufeng Mountain near Shangri-La in Yunnan, meets the first two conditions easily. Mature plants carried an average of 71 trapped insects, mostly small gnats of the family Chironomidae. The trap is selective: the larger insects that pollinate the flowers do not stick to the secretion. The plant lets go of the visitor it needs and holds on to the one it does not.", "refs": ["saxifraga"], "tr": "Yunnan'ın Şangri-La yöresinde, Wufeng Dağı'nın taş yarıklarında yetişen Saxifraga candelabrum ilk iki maddeyi rahatça karşılıyor. Olgun bitkilerde ortalama 71 tuzağa düşmüş böcek sayıldı; çoğu Chironomidae ailesinden küçük sinekler. Tuzak seçici: çiçekleri tozlaştıran iri böcekler yapışkan salgıya takılmıyor. Bitki, kendisine gereken ziyaretçiyi bırakıp gerekmeyeni tutuyor."}]}, {"h": {"en": "The trail the nitrogen left", "tr": "Azotun bıraktığı iz"}, "ps": [{"en": "The team tested the last two conditions along three separate paths. Phosphatase staining showed digestive activity in the glandular hairs, and the same stain gave nothing in the close relative Saxifraga filicaulis. Then the plants were fed fruit flies labelled with ¹⁵N. In Saxifraga candelabrum δ¹⁵N rose significantly (p = 0.0001), as it did in the known carnivore Drosera peltata (p = 0.009). In two non-carnivorous comparison species it did not move at all: p = 0.978 in Salvia przewalskii and p = 0.853 in Saxifraga diversifolia. The insect's nitrogen came out in the plant's tissue.", "refs": ["saxifraga"], "tr": "Ekip son iki maddeyi üç ayrı yoldan sınadı. Fosfataz boyaması, salgı bezli tüylerde sindirim etkinliği gösterdi; aynı boyama yakın akraba Saxifraga filicaulis'te hiçbir şey vermedi. Ardından bitkilere ¹⁵N ile işaretlenmiş meyve sinekleri verildi. Saxifraga candelabrum'da δ¹⁵N anlamlı biçimde yükseldi (p = 0,0001); bilinen etçil Drosera peltata'da da yükseldi (p = 0,009). Etçil olmayan iki karşılaştırma türünde ise hiç kıpırdamadı: Salvia przewalskii'de p = 0,978, Saxifraga diversifolia'da p = 0,853. Böceğin azotu, bitkinin dokusunda çıktı."}, {"en": "The third path runs through the genome. Across six independent origins of carnivory the study found convergence in genes for leaf morphogenesis, digestion and nutrition; lineages far apart from one another reached for similar tools to do the same job. Convergence on its own does not count as proof of carnivory; taken together with the isotope result it shows the finding is more than a resemblance at the surface.", "refs": ["saxifraga"], "tr": "Üçüncü yol genomdan geçiyor. Etçilliğin altı bağımsız kökeninde, yaprak biçimlenmesi, sindirim ve beslenmeyle ilgili genlerde yakınsama bulundu; birbirinden uzak soylar aynı işi yapmak için benzer araçlara yönelmiş. Yakınsama tek başına etçillik kanıtı sayılmaz; izotop sonucuyla birlikte ise bulgunun yüzeydeki bir benzerlikten ibaret olmadığını gösterir."}]}, {"h": {"en": "Where does the boundary move?", "tr": "Sınır nereye kayıyor?"}, "ps": [{"en": "What this study really opens is a method rather than a species. The genus Saxifraga contains around 450 species, and many are known to carry the same sticky hairs. The same three tests can be applied to others. Whatever comes out, something more interesting than a change in the count is at stake: carnivory is read from the test applied to a plant rather than from how the plant looks. Nature stayed as it was; where we stand to measure it moved.", "refs": ["saxifraga"], "tr": "Bu çalışmanın asıl açtığı şey, tek bir türün ötesinde bir yöntem. Saxifraga cinsinin yaklaşık 450 türü var ve birçoğunun aynı yapışkan tüyleri taşıdığı biliniyor. Aynı üç sınama başkalarına uygulanabilir. Sonuç ne çıkarsa çıksın, sayının değişmesinden daha ilginç olan şu: etçillik, bitkiye uygulanan sınamadan okunuyor. Doğa aynı kaldı; ölçüde durduğumuz yer değişti."}, {"en": "That the open questions of a discipline can wait 151 years is a sign of its durability rather than its slackness. Darwin's guess was written down, was not forgotten, and remained testable; when the instruments to test it arrived, the question was still there. Some of the questions left open today ask for the same patience. The answer depends on the question having been written properly.", "refs": ["saxifraga"], "tr": "Bir bilim dalının açık bıraktığı soruların 151 yıl bekleyebilmesi, o dalın gevşekliğinin değil dayanıklılığının işareti. Darwin'in tahmini yazıya geçmişti, unutulmadı ve sınanabilir olmayı sürdürdü; sınayacak aletler geldiğinde soru hâlâ oradaydı. Bugün açık bırakılan soruların bir bölümü de aynı sabrı istiyor. Yanıt, sorunun düzgün yazılmış olmasına bağlı."}]}], "sources": [{"key": "saxifraga", "kind": "news", "name": "New Scientist", "url": "https://www.newscientist.com/article/2583122-darwin-proved-right-about-gnat-trapping-carnivorous-plant", "title": {"tr": "Bir alp çiçeğinin sinekleri sindirdiği azot izleyicisiyle gösterildi", "en": "A nitrogen tracer shows an alpine flower digesting the gnats it traps"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75288-y", "publishedDate": "2026-08-04", "title": {"tr": "Saxifraga'da etçilliğin çok yönlü kanıtlarla belirlenmesi", "en": "Identification of carnivory in the flowering plant Saxifraga via multidisciplinary evidence"}}}], "title": {"en": "Labelled nitrogen answered the question Darwin left open", "tr": "Darwin'in bıraktığı soruyu işaretli azot yanıtladı"}, "writer": "sci-06", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "The Dark Energy Spectroscopic Instrument was built to measure distant galaxies. The composition of these white dwarfs came out of the time left over from that survey; the real question is what the composition shows.", "tr": "Karanlık Enerji Tayfölçüm Aygıtı uzak gökadaları ölçmek için kuruldu. Bu beyaz cücelerin bileşimi, o taramanın arasında kalan zamandan çıktı; asıl soru bileşimin neyi gösterdiği."}, "sections": [{"h": {"en": "What was measured is a spectrum", "tr": "Ölçülen şey bir tayf"}, "ps": [{"en": "Work led by Paula Izquierdo of the University of Warwick identified 12 white dwarfs whose atmospheres are heavily enriched in heavy elements. The elements read off the spectra are oxygen, magnesium, silicon, calcium and iron. That is what was measured directly: absorption lines in a stellar atmosphere, and the abundances derived from the depth of those lines. The results appeared in the peer-reviewed journal Monthly Notices of the Royal Astronomical Society, and the preprint sits on arXiv as 2607.14251.", "refs": ["desi"], "tr": "Warwick Üniversitesi'nden Paula Izquierdo'nun yürüttüğü çalışma, atmosferi ağır elementlerce çok zenginleşmiş 12 beyaz cüce belirledi. Tayflarda okunan elementler oksijen, magnezyum, silisyum, kalsiyum ve demir. Doğrudan ölçülen şey budur: bir yıldız atmosferindeki soğurma çizgileri ve bu çizgilerin derinliğinden çıkarılan bolluklar. Sonuçlar hakemli Monthly Notices of the Royal Astronomical Society dergisinde yayımlandı, ön baskısı arXiv'de 2607.14251 numarasıyla duruyor."}, {"en": "The route from there to a shattered rocky planet is an inference, and it leans on a single expectation: heavy elements do not linger at the surface of a white dwarf, they settle downwards. Their visibility therefore implies that something fell in recently. The alternative that bounds the inference grows from the same soil. A single body swallowed in the recent past and a debris disc feeding the star slowly over a long stretch can leave similar absorption lines, and a composition resembling rocky material from the inner Solar System is compatible with either.", "refs": ["desi"], "tr": "Buradan parçalanmış bir kayaç gezegene giden yol ise bir çıkarımdır ve tek bir beklentiye yaslanır: beyaz cücelerin yüzeyinde ağır elementlerin uzun süre kalması beklenmez, aşağı çökerler. Görülüyorlarsa yakın geçmişte oraya bir şey düşmüş olmalıdır. Çıkarımı sınırlayan alternatif de aynı yerden doğuyor. Yakın geçmişte yutulmuş tek bir gök cismi ile uzun süredir yavaşça beslenen bir kalıntı diski, benzer soğurma çizgileri bırakabilir; bileşimin iç Güneş Sistemi'ndeki kayaç malzemeye benzemesi her iki durumla da uyumludur."}]}, {"h": {"en": "The sample was not built as a search", "tr": "Örneklem bir arama için kurulmadı"}, "ps": [{"en": "The data were gathered in the time that falls outside the instrument's primary task, so the sample was not assembled as a survey designed to hunt for planetary debris. This cuts both ways. On one side there is scale for nothing: a programme surveying distant galaxies also yields spectra of nearby stars as a by-product. On the other, the selection effect stops being controllable. What fraction these 12 objects represent does not follow from this data, because the criterion that decided which stars were observed had nothing to do with planetary debris. Izquierdo describes these super-enriched examples as having turned up among the objects surveyed, and that carries a different weight from the yield of a search.", "refs": ["desi"], "tr": "Veriler, aygıtın asıl görevi dışında kalan zaman diliminde toplandı; örneklem gezegen kalıntısı aramak için tasarlanmış bir tarama gibi kurulmuş değil. Bu iki yönlü bir durumdur. Bir yanda bedava ölçek var: uzak gökadaları tarayan bir program, yan ürün olarak yakın yıldızların tayfını da veriyor. Öte yanda seçim etkisi denetlenemez hâle geliyor. Bu 12 cismin hangi oranı temsil ettiği bu veriden çıkmaz, çünkü hangi yıldızların gözlendiğini belirleyen ölçüt gezegen kalıntısıyla ilgisizdi. Izquierdo, bu aşırı zenginleşmiş örneklerin taranan cisimler arasında bulunduğunu anlatıyor; bu ifade bir aramanın verimiyle aynı ağırlığı taşımıyor."}, {"en": "The most interesting subset is the objects for which evidence pointing to water-rich planetesimals is reported. Abundances read off a white dwarf's surface can mean that a body which once carried water orbited that star, and that is one of the few ways of looking into the inner region of a dead planetary system. How often it happens is a different question, and only a selection built for that purpose can answer it. What we hold for now is a list of compositions; measuring a rate awaits a separate study.", "refs": ["desi"], "tr": "En ilgi çekici alt küme, su bakımından zengin gezegenimsi kalıntılara işaret eden kanıtın bildirildiği cisimler. Bir beyaz cücenin yüzeyinde okunan bolluklar, o yıldızın çevresinde bir zamanlar su taşıyan bir cismin dolaştığı anlamına gelebiliyor; bu, ölmüş bir gezegen sisteminin iç bölgesine bakmanın sayılı yollarından biri. Ne kadar sık rastlandığı ise başka bir sorudur ve ancak bu iş için kurulmuş bir seçimle yanıtlanır. Elimizdeki şey şimdilik bir bileşim listesidir; sıklığın ölçülmesi ayrı bir çalışmayı bekliyor."}]}], "sources": [{"key": "desi", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-desi-side-reveals-spectra-disintegrated.html", "title": {"tr": "DESI gözlemlerinden metalce çok zengin 12 beyaz cüce ve parçalanmış kayaç gezegen kalıntıları çıktı", "en": "DESI observations yielded 12 heavily metal-enriched white dwarfs and the debris of shattered rocky planets"}, "publishedDate": "2026-08-02", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.14251", "publishedDate": "2026-07-15", "title": {"tr": "DESI DR1'den ilk gezegenimsiler: metalce çok zengin 12 beyaz cüce", "en": "First planetesimals from DESI DR1: 12 highly metal-rich white dwarfs"}}}], "title": {"en": "The rocks of the inner Solar System are sitting on 12 white dwarf surfaces", "tr": "İç Güneş Sistemi'nin kayaçları 12 beyaz cücenin yüzeyinde duruyor"}, "writer": "sci-01", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "An analysis of 23,417 participants found depression's brain correlates outside the usual addresses too. It does not mean we can look at one patient's scan and say something.", "tr": "23.417 katılımcılık bir çözümleme, depresyonun beyindeki bağıntılarını alışılmış adreslerin dışında da buldu. Bir hastanın taramasına bakıp bir şey söyleyebileceğimiz anlamına gelmiyor."}, "sections": [{"h": {"en": "The expected addresses", "tr": "Beklenen adresler"}, "ps": [{"en": "Work led by Janine D. Bijsterbosch of Washington University pooled the scans of 23,417 participants across six large population datasets and appeared in the peer-reviewed journal Nature Mental Health on 13 July. Grey-matter volume in the frontal cortex, anterior cingulate and insula falls as depression scores rise. Those three regions were expected; they fit the account of emotion regulation and decision-making that has been told for years.", "refs": ["scans"], "tr": "Washington Üniversitesi'nden Janine D. Bijsterbosch'un yürüttüğü çalışma, altı büyük nüfus veri kümesindeki 23.417 katılımcının görüntülerini birlikte çözümledi ve hakemli Nature Mental Health dergisinde 13 Temmuz'da yayımlandı. Alın korteksi, ön singulat ve insulada gri madde hacmi depresyon düzeyiyle birlikte azalıyor. Bu üç bölge zaten bekleniyordu; duygu düzenlemesi ve karar verme üzerine yıllardır anlatılan tabloya uyuyorlar."}, {"en": "Two results were not expected. No clear association appeared in subcortical structures such as the amygdala and hippocampus, though a large share of the depression literature looks precisely there. Smaller motor and visual regions, by contrast, went together with higher depression scores. Bijsterbosch calls this a surprise, and rightly: nobody was looking for the visual cortex as an address of mood disorder.", "refs": ["scans"], "tr": "Beklenmeyen iki sonuç var. Amigdala ve hipokampus gibi kortikal altı yapılarda belirgin bir bağıntı bulunamadı; oysa depresyon üzerine yazılmış literatürün büyük bölümü tam da oraya bakar. Buna karşılık motor ve görme bölgelerindeki küçülme daha yüksek depresyon düzeyleriyle birlikte gitti. Bijsterbosch bunu sürpriz olarak niteliyor ve haklı: kimse görme korteksini duygudurum bozukluğunun adresi olarak aramıyordu."}]}, {"h": {"en": "Who is in the sample and who is not", "tr": "Örneklemde kim var, kim yok"}, "ps": [{"en": "The authors offer their own account of this divergence, and the account lies in the sample itself: population datasets usually exclude patients with severe depression. So the gap between what was found subcortically and what was not may come from who was scanned; it need not come from the brain at all. Another possibility sits alongside it: the older amygdala findings, obtained in small clinical samples, may be too fragile to reproduce at this scale. The two explanations do not exclude each other, and telling them apart runs through large samples that also include severely ill patients.", "refs": ["scans"], "tr": "Yazarlar bu ayrışmanın bir açıklamasını kendileri veriyor ve açıklama örneklemin kendisinde: nüfus temelli veri kümeleri ağır depresyonu olan hastaları çoğunlukla dışarıda bırakır. Yani kortikal altı yapılarda bulunanla bulunmayan arasındaki fark, kimin taranmış olduğundan kaynaklanıyor olabilir; kaynağının beyin olması gerekmiyor. Bunun yanında bir başka olasılık daha duruyor: küçük klinik örneklemlerle elde edilmiş eski amigdala bulguları, bu ölçekte tekrar edilemeyecek kadar kırılgan olabilir. İki açıklama birbirini dışlamıyor ve ikisini ayırt etmenin yolu ağır hastaları da kapsayan büyük örneklemlerden geçiyor."}, {"en": "At the bedside the implication is narrow, and should honestly be kept narrow. This is an observational association study; it does not measure which change produces the other and it opens no route from a single scan to a diagnosis. Its value lies elsewhere: it changes where to look. And there is this too — the patients a clinic sees most are the people this evidence represents least. That does not invalidate the finding; it sets how far it generalises, and to whom.", "refs": ["scans"], "tr": "Hastanın yanında bunun karşılığı dar ve dürüstçe dar tutulmalı. Bu gözlemsel bir bağıntı çalışmasıdır; hangi değişimin diğerini doğurduğunu ölçmüyor ve tek bir taramadan tanıya giden bir yol açmıyor. Değeri başka yerde: nereye bakılacağını değiştiriyor. Bir de şu var, kliniğin en çok gördüğü hastalar bu kanıtın en az temsil ettiği kişilerdir. Bu, bulguyu geçersiz kılmaz; hangi hastaya ne kadar genellenebileceğini belirler."}]}], "sources": [{"key": "scans", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-large-scale-brain-scan-reveals.html", "title": {"tr": "Yirmi üç bini aşkın beyin görüntüsünde depresyonun izi motor ve görme alanlarında da çıktı", "en": "Across more than 23,000 brain scans, depression's correlates also appeared in motor and visual areas"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Nature Mental Health", "url": "https://doi.org/10.1038/s44220-026-00680-y", "publishedDate": "2026-07-13", "title": {"tr": "Depresyonun nörogörüntüleme bağıntıları altı büyük nüfus veri kümesinde ortaya konuldu", "en": "The neuroimaging correlates of depression established across six large-scale population datasets"}}}], "title": {"en": "The amygdala did not show up but the motor and visual cortex did", "tr": "Amigdala çıkmadı ama motor ve görme korteksi çıktı"}, "writer": "sci-02", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Four lighting set-ups were tested side by side at six railway stations. The gain comes with a number, and the place where the gain stops sits in the same study.", "tr": "Altı tren istasyonunda dört aydınlatma düzeni yan yana denendi. Kazanç bir sayıyla verildi; kazancın nerede durduğu da aynı çalışmada duruyor."}, "sections": [{"h": {"en": "Four set-ups placed side by side", "tr": "Yan yana konan dört düzen"}, "ps": [{"en": "At six rural railway stations inside a German dark-sky reserve, four set-ups were compared through the 2023 and 2024 field seasons: 1800 K amber LEDs, high-pressure sodium lamps, 4000 K cool-white LEDs and unlit control points. Under the amber LEDs, trapped insect numbers came out 39 percent to 51 percent lower than under the other two lamp types, and captured biomass 51 percent to 77 percent lower. That is a workable lever: platform lighting is replaced on a cycle anyway.", "refs": ["amber"], "tr": "Almanya'da bir karanlık gökyüzü koruma alanındaki altı kırsal tren istasyonunda, 2023 ve 2024 saha mevsimleri boyunca dört düzen karşılaştırıldı: 1800 K kehribar LED'ler, yüksek basınçlı sodyum lambalar, 4000 K soğuk beyaz LED'ler ve aydınlatılmamış denetim noktaları. Kehribar LED altında tuzaklarla sayılan böcek bireyleri diğer iki lamba türüne göre yüzde 39 ile yüzde 51 arasında, yakalanan biyokütle ise yüzde 51 ile yüzde 77 arasında düşük çıktı. Bu, uygulanabilir bir kaldıraçtır: peron aydınlatması zaten belli aralıklarla yenileniyor."}, {"en": "The more useful information sits in the second result. High-pressure sodium, long treated as the gentler option, turned out to draw insects as strongly as the cool-white LED. This result supports the inference that the blue content of the light sets the dividing line, with the fixture mattering far less; even sodium light, which looks warm, does not suffice to deter insects. This inference has an alternative, though: if the lamps were not matched for light output, part of the observed difference may come from brightness rather than spectrum. Separating the two runs through a comparison built at equal lumen levels.", "refs": ["amber"], "tr": "Asıl bilgi ise ikinci sıradaki sonuçta. Uzun süre daha yumuşak sayılan yüksek basınçlı sodyum lamba, böcek çekmekte soğuk beyaz LED kadar güçlü çıktı. Bu sonuç, ayrımı belirleyen şeyin ışığın mavi bileşeni olduğu çıkarımını destekliyor; sodyum lambanın sıcak görünen ışığı bile böcekleri caydırmaya yetmiyor. Yalnız bu çıkarımın bir alternatifi var: lambaların ışık çıkışı eşitlenmemişse, gözlenen farkın bir bölümü tayftan değil, parlaklıktan geliyor olabilir. İki açıklamayı ayırmanın yolu, aynı lümen düzeyinde kurulmuş bir karşılaştırmadan geçiyor."}]}, {"h": {"en": "Where the gain stops", "tr": "Kazancın durduğu yer"}, "ps": [{"en": "The researchers state the limit plainly: although the 1800 K LED was the least attractive source in the study, it still drew more individuals and more species than the unlit control points. That sentence sets the size of the lever. Swapping the lamp cuts the insects drawn in by nearly half but not to zero; the remaining load comes from the light itself. For whoever decides, this separates two questions: which lamp to install, and where not to light at all. The second is the stronger instrument, and it carries a different cost.", "refs": ["amber"], "tr": "Araştırmacılar sınırı açıkça yazıyor: 1800 K LED çalışmanın en az çekici ışık kaynağı olmakla birlikte, aydınlatılmamış denetim noktalarından yine de daha fazla birey ve daha fazla tür çekti. Bu cümle, kaldıracın ölçeğini belirler. Lambayı değiştirmek çekilen böcek sayısını yarıya yakın düşürüyor, ama sıfıra indirmiyor; artakalan yük ışığın kendisinden geliyor. Karar verecek olan için bu, iki ayrı sorunun ayrılması demektir: hangi lambayı takacağız ve nereyi hiç aydınlatmayacağız. İkincisi ilkinden daha güçlü bir araçtır ve maliyeti de farklıdır."}, {"en": "It is also worth keeping straight what quantity was measured. This is a field experiment, and over two seasons it measured the individuals, the biomass and the number of species arriving at traps; that is attraction. How local populations move over years is a different quantity and cannot be read off the same measurement. The signal to watch is clear: once amber lighting becomes permanent at the same stations, the quantity to follow over several seasons is breeding-season abundance. That is where it will show whether the lever actually works.", "refs": ["amber"], "tr": "Ölçülen büyüklüğün ne olduğunu da yerinde tutmak gerekiyor. Bu bir saha deneyidir ve iki mevsim boyunca tuzaklara gelen bireyleri, biyokütleyi ve tür sayısını ölçmüştür; yani çekimi ölçer. Yerel popülasyonların yıllar içindeki gidişi ayrı bir büyüklüktür ve aynı ölçümden okunamaz. İzlenecek işaret bellidir: aynı istasyonlarda kehribar aydınlatma kalıcı hâle geldikten sonra izlenmesi gereken büyüklük, üreme dönemi bolluğudur. Kaldıracın gerçekten işe yarayıp yaramadığı orada görünür."}]}], "sources": [{"key": "amber", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-simple-amber-nights-safer-insects.html", "title": {"tr": "Altı istasyonda 1800 K kehribar LED, çekilen böcek sayısını yaklaşık yarı yarıya azalttı", "en": "At six stations, 1800 K amber LEDs roughly halved the insects drawn in"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Biological Conservation", "url": "https://doi.org/10.1016/j.biocon.2026.111964", "publishedDate": "2026-06-19", "title": {"tr": "Eniyilenmiş ışık kaynakları tren istasyonlarında gece böcek çekimini azaltıyor", "en": "Optimised light sources reduce nocturnal insect attraction at railway stations"}}}], "title": {"en": "Amber lamps cut insect numbers by nearly half, and darkness is still better", "tr": "Kehribar lamba böcek sayısını yarıya yakın düşürdü, karanlık yine de daha iyi"}, "writer": "sci-03", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "When the equation for front shape is coupled to the equation for competition, reproductive advantage is no longer the only thing deciding an expanding population's fate. The generality the model buys comes at a price.", "tr": "Cephe biçiminin denklemi ile rekabetin denklemi birbirine bağlandığında, genişleyen bir topluluğun kaderini belirleyen tek şey üreme üstünlüğü olmuyor. Modelin kazandırdığı genellik, bir bedelle geliyor."}, "sections": [{"h": {"en": "Two equations coupled together", "tr": "Birbirine bağlanan iki denklem"}, "ps": [{"en": "Sergio Eraso and Mehran Kardar of the MIT physics department combined the KPZ equation, the most stripped-down model of front shape, with the Fisher equation, a classic of evolutionary biology, into a single model. The work appeared in the peer-reviewed Journal of Statistical Mechanics: Theory and Experiment on 3 August; the preprint sits on arXiv as 2604.01187. What was built is easy to describe: one equation says how the rough surface of the front develops, the other how two populations compete along the same line, and the model solves both at once.", "refs": ["fronts"], "tr": "MIT Fizik Bölümü'nden Sergio Eraso ve Mehran Kardar, cephe biçiminin en yalın modeli olan KPZ denklemi ile evrimsel biyolojinin klasik Fisher denklemini tek bir modelde birleştirdi. Çalışma hakemli Journal of Statistical Mechanics: Theory and Experiment dergisinde 3 Ağustos'ta yayımlandı; ön baskısı arXiv'de 2604.01187 numarasıyla duruyor. Yapılan işi tarif etmek kolay: bir denklem cephenin pürüzlü yüzeyinin nasıl geliştiğini, diğeri iki topluluğun aynı hat üzerinde nasıl yarıştığını anlatıyor, model ikisini aynı anda çözüyor."}, {"en": "The solution yields three distinct front shapes: rounded bulges, composite bulges with sloping sides, and V-shaped dents. Which shape appears is set by the balance between fitness and spreading speed. The result Eraso underlines is this: greater expansion speed does not necessarily mean greater success in taking new ground, and a favourable position can let a less fit population persist for a long time. When new mutations add trait diversity, fitness variation is reported to follow the Tracy-Widom distribution, and that is the model's one numerically testable output.", "refs": ["fronts"], "tr": "Çözümün verdiği çıktı üç ayrı cephe biçimi: yuvarlak çıkıntılar, eğimli yanları olan bileşik çıkıntılar ve V biçiminde girintiler. Hangi biçimin ortaya çıkacağını uyum ile yayılma hızının dengesi belirliyor. Eraso'nun altını çizdiği sonuç şu: daha yüksek yayılma hızı yeni bölgeyi ele geçirmekte mutlaka daha başarılı olmak anlamına gelmiyor, elverişli bir konum uyumu düşük bir topluluğun uzun süre tutunmasına yetebiliyor. Yeni mutasyonlar çeşitlilik kattığında uyum dalgalanmalarının Tracy-Widom dağılımını izlediği bildiriliyor; bu, modelin sayısal olarak sınanabilir tek çıktısıdır."}]}, {"h": {"en": "What universality costs", "tr": "Evrenselliğin bedeli"}, "ps": [{"en": "The authors themselves write that the model is theoretical and simplified, and that reproducing the observed shapes qualitatively does not prove the underlying mechanism is the same. The warning follows from the nature of the KPZ class, and it weighs more than it looks. The power of KPZ-type models is that very different microscopic rules give the same large-scale statistics; that is exactly where the generality comes from. The same property works in reverse: a front shape observed in an experiment resembling the model's does not show that the rules in a bacterial colony match the model's. The alternative explanation could be a nutrient gradient, cell adhesion or a local density limit, and all three can produce a similar bulge.", "refs": ["fronts"], "tr": "Yazarlar modelin kuramsal ve sadeleştirilmiş olduğunu, gözlenen biçimleri niteliksel olarak üretmesinin altta yatan düzeneğin aynı olduğunu kanıtlamadığını kendileri yazıyor. Bu uyarı KPZ sınıfının doğasından geliyor ve göründüğünden ağırdır. KPZ türü modellerin gücü, birbirinden çok farklı mikroskobik kuralların aynı büyük ölçek istatistiklerini vermesindedir; genellik tam olarak buradan doğar. Aynı özellik ters yönde de işler: bir deneyde gözlenen cephe biçiminin modeldekine benzemesi, bakteri kolonisindeki kuralların modeldekiyle aynı olduğunu göstermez. Alternatif açıklama beslenme gradyanı, hücre yapışması ya da yerel yoğunluk sınırı olabilir ve üçü de benzer bir çıkıntı üretebilir."}, {"en": "So the model's counterpart should be sought in a distribution; shape-matching does not stand in for that test. The bacterial experiments that started the work showed initially mixed colonies separating into distinct sectors as they expanded; the measurable quantity is the boundary statistics of those sectors. If an experiment can pool sector widths across many colonies and extract the distribution of fitness variation, the Tracy-Widom form will either appear or fail to appear. That is what the theory offers, and that is what makes the price of simplification worth paying: the model declines to explain what happens in one colony, while it says something falsifiable about the statistics of many.", "refs": ["fronts"], "tr": "Bu yüzden modelin karşılığını dağılımda aramak gerekiyor; biçim eşlemesi bu sınamanın yerini tutmuyor. Çalışmanın çıkış noktası olan bakteri deneyleri, başlangıçta karışık kolonilerin genişlerken ayrı dilimlere ayrıldığını gösteriyordu; ölçülebilir büyüklük o dilimlerin sınır istatistiğidir. Bir deney, çok sayıda koloninin dilim genişliklerini toplayıp uyum dalgalanmasının dağılımını çıkarabilirse, Tracy-Widom biçimi ya vardır ya yoktur. Kuramın önerdiği şey budur ve sadeleştirmenin bedelini ödemeye değer kılan da budur: model tek bir koloninin öyküsünü vermiyor; çok sayıda koloninin istatistiği hakkında yanlışlanabilir bir şey söylüyor."}]}], "sources": [{"key": "fronts", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-position-competition-populations.html", "title": {"tr": "Genişleyen bir topluluğun ön cephesinde konum, uyum üstünlüğünün önüne geçebiliyor", "en": "At the front of an expanding population, position can outweigh a fitness advantage"}, "publishedDate": "2026-08-03", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2604.01187", "publishedDate": "2026-04-01", "title": {"tr": "Genişleyen toplulukların ön cephesinde rekabet", "en": "Competition at the front of expanding populations"}}}], "title": {"en": "A bulge at the front can beat an advantage behind it", "tr": "Öndeki tümsek, arkadaki üstünlüğü yenebiliyor"}, "writer": "sci-04", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The davunetide data were revisited and a significant effect in women is reported. The same analysis also changed the outcome scale; what the two decisions do together has to be counted separately.", "tr": "Davunetide verisi yeniden ele alındı ve kadınlarda anlamlı bir etki bildirildi. Aynı çözümlemede sonlanım ölçeği de değişti; iki kararın birlikte ne yaptığı ayrıca hesaplanmalı."}, "sections": [{"h": {"en": "Two decisions taken at once", "tr": "Aynı anda alınmış iki karar"}, "ps": [{"en": "Illana Gozes and colleagues at Tel Aviv University revisited the 52-week data from an international trial in progressive supranuclear palsy covering more than 300 patients; the analysis appeared in the peer-reviewed journal Molecular Psychiatry on 3 July. Two decisions were taken at once. First, patients were separated by sex. Second, the 10-item PSP Rating Scale recommended by the US Food and Drug Administration was applied for the first time and compared with the 28-item scale that served as the primary endpoint. This is a reanalysis of existing data rather than a fresh trial.", "refs": ["davunetide"], "tr": "Tel Aviv Üniversitesi'nden Illana Gozes ve ekibi, ilerleyici supranükleer felç için yürütülmüş 52 haftalık uluslararası bir denemenin 300'den fazla hastayı kapsayan verisini yeniden ele aldı; çözümleme hakemli Molecular Psychiatry dergisinde 3 Temmuz'da yayımlandı. İki karar aynı anda alındı. Birincisi, hastalar cinsiyete göre ayrıldı. İkincisi, ABD Gıda ve İlaç Dairesi'nin önerdiği 10 maddelik PSP Derecelendirme Ölçeği ilk kez uygulanıp birincil sonlanım olan 28 maddelik ölçekle karşılaştırıldı. Bu yeni bir deneme değil, var olan verinin yeniden çözümlemesidir."}, {"en": "The reported numbers look strong. In mixed-effects models a significant treatment effect favouring women is given (P = 0.0005), with gains on the cognitive battery in total raw score, letter–number sequencing and language. The correlation between the cerebrospinal-fluid phosphorylated Tau/Tau ratio and a behavioural measure also runs in opposite directions by sex: in women r = 0.77 with P = 0.006, in men r = −0.62 with P = 0.075, and the value reported for the sex difference is P = 0.0002. The men's own P value means an effect that was not demonstrated; it falls short of establishing an opposite one.", "refs": ["davunetide"], "tr": "Bildirilen sayılar güçlü görünüyor. Karma etkili modellerde kadınlar lehine anlamlı bir tedavi etkisi veriliyor (P = 0,0005); bilişsel bataryada toplam ham puan, harf-sayı sıralaması ve dil puanlarında iyileşme var. Beyin omurilik sıvısındaki fosforile Tau/Tau oranı ile bir davranış ölçütü arasındaki bağıntının yönü de cinsiyete göre ters çıkıyor: kadınlarda r = 0,77 ve P = 0,006, erkeklerde r = −0,62 ve P = 0,075, cinsiyet farkı için bildirilen değer ise P = 0,0002. Erkeklerdeki bağıntının kendi P değeri, gösterilememiş bir etki anlamına geliyor; ters yönde bir etkiyi kanıtlamış sayılmıyor."}]}, {"h": {"en": "What the two decisions do together", "tr": "İki kararın birlikte etkisi"}, "ps": [{"en": "When a subgroup split and a change of outcome scale meet inside the same analysis, the number of routes by which a difference can appear is multiplied. Sex means two arms; two scales mean two separate endpoints; add motor and cognitive subscores and the count of comparisons grows quickly. The reported P values are not corrected for that multiplicity, so the ordinary condition of subgroup analyses holds: the finding generates a hypothesis. The alternative reading deserves to be taken seriously too. The difference may be real and biological; the oppositely signed Tau correlation given in the paper is an independent hint of a disease process that differs by sex, and an original design that was not powered for it could hide such a difference.", "refs": ["davunetide"], "tr": "Bir alt grup ayrımı ile bir sonlanım ölçeği değişikliği aynı çözümlemede bir araya geldiğinde, bir farkın ortaya çıkabileceği yolların sayısı çarpılır. Cinsiyet iki kol demektir; iki ölçek iki ayrı sonlanım demektir; buna motor ve bilişsel alt puanlar eklenince karşılaştırma sayısı hızla büyür. Bildirilen P değerleri bu çokluğa göre düzeltilmemiştir; dolayısıyla alt grup çözümlemelerinin olağan durumu geçerlidir: bulgu hipotez üretir. Alternatif okuma da ciddiye alınmalı. Fark gerçek ve biyolojik olabilir; makalede verilen ters yönlü Tau bağıntısı, cinsiyete göre farklı bir hastalık sürecine işaret eden bağımsız bir ipucudur ve yeterince güçlü kurulmamış özgün bir tasarım böyle bir farkı gizleyebilir."}, {"en": "Design is what decides between these two readings. The study that would settle it has to be prespecified: a sample of women only, the 10-item scale declared in advance as the primary endpoint, and an analysis plan written before treatment begins. The phosphorylated Tau/Tau ratio could sit in that design as a predetermined stratification variable. Whatever such a trial returned would be informative; the strength of the present analysis is that it shows why the trial should be built. In a rare disease that counts for a good deal, though its place on the ladder of evidence stays fixed.", "refs": ["davunetide"], "tr": "Bu ikisi arasında karar verecek olan tasarımdır. Bunu yerine oturtacak çalışma önceden tanımlanmış olmalı: yalnızca kadınları kapsayan bir örneklem, birincil sonlanım olarak baştan ilan edilmiş 10 maddelik ölçek ve tedaviye başlamadan yazılmış bir çözümleme planı. Fosforile Tau/Tau oranı da bu tasarımda önceden belirlenmiş bir katman değişkeni olarak yer alabilir. Böyle bir denemenin sonucu ne çıkarsa çıksın bilgi verir; şu anki çözümlemenin gücü ise o denemenin neden kurulması gerektiğini göstermesindedir. Nadir bir hastalıkta bu küçük bir katkı değildir, ama kanıt basamağında bulunduğu yer bellidir."}]}], "sources": [{"key": "davunetide", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-experimental-treatment-significantly-fatal-brain.html", "title": {"tr": "Davunetide verileri cinsiyete göre yeniden çözümlendi: kadınlarda etki bulundu, erkeklerde bulunmadı", "en": "Davunetide data were reanalysed by sex: an effect in women, none in men"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Molecular Psychiatry", "url": "https://doi.org/10.1038/s41380-026-03709-x", "publishedDate": "2026-07-03", "title": {"tr": "Tauopatide karşıt moleküler cinsiyet bağıntıları ve davunetidin kadınlarda motor ve bilişsel etkinliği", "en": "Opposite molecular sex correlations in tauopathy paralleled by motor and cognitive efficacy of davunetide in women"}}}], "title": {"en": "A sex-based reanalysis generates a hypothesis", "tr": "Cinsiyete göre yeniden çözümleme hipotez üretiyor"}, "writer": "sci-05", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T09:56:15+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The place of two infant burials found at Ephesos strikes us as strange. How much of the strangeness comes from the find, and how much from our own categories?", "tr": "Efes'te bulunan iki bebek gömüsünün yeri bize tuhaf geliyor. Tuhaflığın ne kadarı buluntudan, ne kadarı bizim sınıflandırmamızdan geliyor?"}, "sections": [{"h": {"en": "The place and the labour spent", "tr": "Yer ve harcanan emek"}, "ps": [{"en": "Two infant skeletons were found in a tile- and stone-lined cist grave inside a latrine channel that had gone out of use at the Roman-era Odeion in Ephesos. The remains date to the 8th–9th centuries AD, and arm-bone measurements indicate that both infants were born about six weeks premature. The first thing the find says is labour: tile and stone were carried into the channel, a small room was built, and two infants were placed there.", "refs": ["efes"], "tr": "Efes'teki Roma dönemi Odeion yapısının kullanım dışı kalmış bir lağım kanalında, kiremit ve taşla örülmüş bir sanduka mezar içinde iki bebek iskeleti bulundu. Kalıntılar MS sekizinci–dokuzuncu yüzyıla tarihleniyor ve kol kemiği ölçüleri her iki bebeğin de yaklaşık altı hafta erken doğduğuna işaret ediyor. Buluntunun ilk anlattığı şey emektir: kanalın içine kiremit ve taş taşınmış, bir oda örülmüş, iki bebek oraya yerleştirilmiş."}, {"en": "The second detail is smaller and sharper. One of the infants had a rare 5-millimetre cervical rib extending from a neck vertebra, which the authors describe as only the second such case documented in an infant burial. The anomaly is associated with developmental and genetic complications. The bioarchaeologist Caroline Partiot reads the find as a sign that ancient populations looked after vulnerable individuals.", "refs": ["efes"], "tr": "İkinci ayrıntı daha küçük ve daha keskin. Bebeklerden birinde boyun omurundan uzanan 5 milimetrelik ender bir servikal kaburga saptandı; yazarlar bunun bir bebek gömüsünde belgelenen ikinci örnek olduğunu belirtiyor. Bu anomali gelişimsel ve genetik komplikasyonlarla ilişkilendiriliyor. Biyoarkeolog Caroline Partiot buluntuyu, eski toplulukların savunmasız bireyleri gözettiğinin göstergesi olarak okuyor."}]}, {"h": {"en": "What the name carries", "tr": "Adın taşıdığı çağrışım"}, "ps": [{"en": "Reading this find, most of the emotional work is done by a single word: latrine. The word makes us think of a place for discarding, yet the channel's function had long ended, and what was made inside it was not a pit but a built grave. Our category may be misnaming the act. There is an alternative to this, and it is not weak: burial outside a cemetery can be a trace of exclusion rather than of love. Refusing unbaptised infants a place in consecrated ground is a known practice, and the study leaves open whether these infants had been baptised and whether they were entitled to burial in a cemetery. Both readings look at the same stones.", "refs": ["efes"], "tr": "Bu buluntuyu okurken duygusal işin büyük bölümünü tek bir kelime yapıyor: lağım. Kelime bize bir atma yeri düşündürüyor, oysa kanalın işlevi çoktan sona ermişti ve içine yapılan şey bir çukur değil, örülmüş bir mezardı. Sınıflandırmamız buradaki eylemi yanlış adlandırıyor olabilir. Bunun bir alternatifi var ve zayıf değil: mezarlık dışına gömülmek, sevginin değil, dışlanmanın izi de olabilir. Vaftiz edilmemiş bebeklerin kutsal alana kabul edilmemesi bilinen bir uygulamadır ve çalışma bebeklerin vaftiz edilip edilmediğini, mezarlığa gömülme haklarının bulunup bulunmadığını açıkta bırakıyor. İki okuma da aynı taşlara bakıyor."}, {"en": "Nor is it settled that they were twins; similar age, similar size and simultaneous burial point that way, but the study offers it as a possibility. What remains is what archaeology can usually give us, and it is not little: a grave lets us measure the labour someone spent, not the feeling behind that labour. We cannot know what the person carrying tile for two premature infants twelve centuries ago felt. What we know is that someone carried it; and that is usually enough to test the assumptions we make that belittle people in the past.", "refs": ["efes"], "tr": "İkiz oldukları da kesin değil; benzer yaş, benzer boyut ve aynı anda gömülme bu yönü gösteriyor, ancak çalışma bunu bir olasılık olarak sunuyor. Geriye kalan, arkeolojinin genellikle bize verebildiği şeydir ve az değildir: bir mezar, birinin harcadığı emeği ölçmemize izin verir, o emeğin ardındaki duyguyu değil. On iki yüzyıl önce iki erken doğmuş bebek için kiremit taşıyan kişinin ne hissettiğini bilemeyiz. Bildiğimiz şey, birinin taşıdığıdır; ve geçmişteki insanları küçümseyen varsayımlarımızı sınamak için genellikle bu kadarı yeter."}]}], "sources": [{"key": "efes", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-laid-rest-ancient-infants-twins.html", "title": {"tr": "Efes'te kullanım dışı kalmış bir lağım kanalının içine özenle gömülmüş iki bebek bulundu", "en": "Two infants were found carefully buried inside a disused latrine channel at Ephesos"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Childhood in the Past", "url": "https://doi.org/10.1080/17585716.2026.2682804", "publishedDate": "2026-07-13", "title": {"tr": "Beklenmedik yerlerde huzur: Efes Odeion'unun bir lağım kanalında olasılıkla ikiz iki bebeğin Orta Bizans dönemi gömüsü", "en": "Peace in Unexpected Places: The Middle Byzantine Burial of Two Perinates, Possibly Twins, in a Latrine Canal of the Odeion in the Artemision of Ephesos"}}}], "title": {"en": "Inside a latrine channel, a small room was built out of tile", "tr": "Bir lağım kanalının içine kiremitten küçük bir oda örülmüş"}, "writer": "sci-06", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Giving dark-matter particles a hidden attractive force does not make structures gather faster. The same coupling dilutes the particle's effective mass in the background and takes the gain back.", "tr": "Karanlık madde parçacıklarına gizli bir çekici kuvvet vermek, yapıların daha hızlı toplanmasını sağlamıyor. Aynı bağ, parçacığın etkin kütlesini arka planda daha hızlı seyreltiyor ve kazancı geri alıyor."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "The expected speed-up never arrived", "tr": "Beklenen hızlanma gelmedi"}, "ps": [{"en": "The calculation by Marco Costa, Cyril Creque-Sarbinowski, Olivier Simon and Zachary J. Weiner starts from a plain question: what if dark-matter particles interacted with one another through a long-range force as well as gravity? Intuition answers quickly. Extra attraction builds clumps sooner. What the authors find for minimal scalar-mediated models runs the other way: the force does not enhance the growth of unbiased tracers of structure.", "refs": ["haber-karanlik-kuvvet"], "tr": "Marco Costa, Cyril Creque-Sarbinowski, Olivier Simon ve Zachary J. Weiner'in hesabı sade bir soruyla başlıyor: karanlık madde parçacıkları çekimin yanı sıra kendi aralarında uzun menzilli bir kuvvetle de etkileşseydi ne olurdu? Sezgi net bir cevap verir. Fazladan çekim, yığınları daha çabuk kurar. Yazarların skaler aracılı asgari modellerde bulduğu sonuç bunun tersi yönde: bu kuvvet, yapının tarafsız izleyicilerinin büyümesini artırmıyor."}, {"en": "The mechanism ties itself off at a single point. Whatever density perturbations gain from the force during the matter era is offset by a faster dilution of the background dark-matter density, and the two effects largely cancel. That is a reading, not an observation. Another reading of the same calculation is available: in a narrow corner of parameter space, with a very light mediator, gain and dilution could arrive at different times and leave a net increase. What the authors show is that this is not how the model naturally behaves.", "refs": ["haber-karanlik-kuvvet"], "tr": "Mekanizma tek bir yerde düğümleniyor. Madde çağında yoğunluk dalgalanmalarının kuvvetten kazandığı ivme, arka plandaki karanlık madde yoğunluğunun daha hızlı seyrelmesiyle karşılanıyor; iki etki birbirini büyük ölçüde götürüyor. Bu bir yorum, gözlem değil. Aynı hesabın başka bir okuması da mümkün: parametre uzayının dar bir köşesinde, çok hafif bir aracıyla, kazanç ve seyrelme farklı zamanlarda devreye girip net bir artış bırakabilir. Yazarların gösterdiği şey, bunun modelin doğal davranışı olmadığı."}]}, {"h": {"en": "What was picked up as a patch stays as a constraint", "tr": "Yama diye alınan şey, kısıt olarak kalıyor"}, "ps": [{"en": "The real price comes from the requirement to stay consistent with cosmic microwave background measurements. Matching the observed distances demands a substantially higher dark-energy density, and that suppresses growth rather than raising it. A massive mediator makes the picture heavier still, because the mediator itself does not cluster and contributes to gravity only as a smooth component. The dark force therefore stops being a convenient candidate for closing the tension between background and low-redshift measurements.", "refs": ["haber-karanlik-kuvvet"], "tr": "Asıl bedel, kozmik mikrodalga arka alan ölçümleriyle uyumlu kalma zorunluluğundan çıkıyor. Gözlenen uzaklıkları tutturmak için karanlık enerji yoğunluğunu belirgin biçimde yükseltmek gerekiyor ve bu, büyümeyi artırmak yerine bastırıyor. Kütleli bir aracı tabloyu daha da ağırlaştırıyor, çünkü aracının kendisi toplanmıyor ve çekime yalnızca düzgün dağılmış bir katkı bırakıyor. Böylece karanlık kuvvet, arka alanla düşük kırmızıya kayma ölçümleri arasındaki gerilimi kapatmak için elverişli bir aday olmaktan çıkıyor."}, {"en": "For anyone watching the sky this is a useful result. Knowing that a model cannot close a gap narrows the range that model is allowed to occupy. If the coming large surveys report the growth rate of structure at low redshift with a tighter uncertainty than today's, the coupling strengths open to this family of scalar forces will measurably tighten by the end of 2027. The concrete thing to watch is simple: not the published growth-rate value itself, but the size of its error bar.", "refs": ["haber-karanlik-kuvvet"], "tr": "Bu, gökyüzüne bakan biri için işe yarar bir sonuç. Bir modelin bir açığı kapatamayacağını bilmek, o modelin izin verilen aralığını daraltır. Önümüzdeki büyük taramalar düşük kırmızıya kaymada yapı büyüme hızını bugünkünden dar bir hata payıyla verirse, 2027 sonuna kadar bu skaler kuvvet ailesinin bağ gücü aralığı ölçülebilir biçimde sıkışır. İzlenecek somut işaret basit: yayımlanan büyüme hızı değerinin kendisi değil, o değerin hata payı."}]}], "sources": [{"key": "haber-karanlik-kuvvet", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/08/260801042822.htm", "title": {"tr": "Karanlık maddeye çekici bir kuvvet eklenince yapı oluşumunun hızlanmak yerine yavaşladığı hesaplandı", "en": "Adding an attractive force to dark matter was calculated to slow structure growth rather than speed it up"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Journal of Cosmology and Astroparticle Physics", "url": "https://iopscience.iop.org/article/10.1088/1475-7516/2026/06/055", "publishedDate": "2026-06-22", "title": {"tr": "Karanlık kuvvetler yapı büyümesini bastırıyor", "en": "Dark forces suppress structure growth"}}}], "title": {"en": "A force was added to dark matter, and the universe gathered more slowly", "tr": "Karanlık maddeye kuvvet eklendi, evren daha yavaş toplandı"}, "writer": "sci-01", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "In a mouse model of sickle-cell disease, blood-forming stem cells carry marks of premature ageing, and those marks are reversed with existing drugs. The weight of the finding is that it moves the disease's address one step upstream.", "tr": "Orak hücreli hastalığın bir fare modelinde kan yapıcı kök hücreler erken yaşlanma izleri taşıyor ve bu izler mevcut ilaçlarla geri çevriliyor. Bulgunun ağırlığı, hastalığın adresini bir basamak yukarı taşımasında."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "The disease's address moves one step upstream", "tr": "Hastalığın adresi bir basamak yukarı taşınıyor"}, "ps": [{"en": "A Nature research highlight published on 3 August reports that in a mouse model of sickle-cell disease, blood-forming stem cells show chronic stress, DNA damage and signs of premature ageing. The same highlight reports that certain cancer drugs already in use, and anti-ageing compounds, reverse those signs. The underlying work is by Barve and colleagues in Science Translational Medicine.", "refs": ["haber-orak-hucre"], "tr": "Nature'ın 3 Ağustos'ta yayımladığı araştırma özeti, orak hücreli hastalığın bir fare modelinde kan yapıcı kök hücrelerin kronik stres, DNA hasarı ve erken yaşlanma belirtileri gösterdiğini aktarıyor. Aynı özet, kullanımdaki bazı kanser ilaçlarının ve yaşlanma karşıtı bileşiklerin bu belirtileri geri çevirdiğini bildiriyor. Kaynak, Barve ve arkadaşlarının Science Translational Medicine dergisinde yayımlanan çalışması."}, {"en": "That description shifts the familiar picture of where the disease lives. Sickle-cell disease is usually told as a story in which a single letter deforms the red blood cell; what is described here is that the pool the blood is made from is worn down as well. The two readings do not exclude one another. The wear on the stem cells may be a consequence of the disease, or the trace left by a lifelong strain on production. The highlight does not say which comes first.", "refs": ["haber-orak-hucre"], "tr": "Bu tarif, hastalığın nerede yaşadığına dair alışılmış resmi biraz kaydırıyor. Orak hücreli hastalık, tek bir harf değişikliğinin kırmızı kan hücresinin biçimini bozduğu bir tablo olarak anlatılır; burada anlatılan ise kanın üretildiği havuzun da yıpranmış olması. İki okuma birbirini dışlamıyor. Kök hücrelerdeki yıpranma hastalığın bir sonucu da olabilir, üretimi ömür boyu zorlayan bir yükün bıraktığı iz de. Özet, hangisinin önce geldiğini söylemiyor."}]}, {"h": {"en": "The road to the clinic did not get shorter", "tr": "Kliniğe giden yol kısalmadı"}, "ps": [{"en": "Working with drugs already in use shortens one road: how the molecule behaves, and what it does at which dose, is already known. But the road that shortens is not the safety road. Sickle-cell disease is a lifelong condition that usually begins in childhood; what would need measuring for cancer drugs here is less the effect than what accumulates over years of use. The finding itself does not answer that question. It only makes the question worth asking.", "refs": ["haber-orak-hucre"], "tr": "Kullanımdaki ilaçlarla çalışmak bir yolu kısaltır: molekülün nasıl davrandığı, hangi dozda ne yaptığı zaten bilinir. Ama kısalan yol güvenlik yolu değil. Orak hücreli hastalık çoğunlukla çocuklukta başlayan, ömür boyu süren bir tablo; kanser ilaçlarının burada ölçülmesi gereken şey etkiden çok, yıllara yayılan kullanımda neyin biriktiği. Bulgunun kendisi bu soruyu yanıtlamıyor, yalnızca sormaya değer hâle getiriyor."}, {"en": "A trace of ageing reversed in a mouse is not a disease reversed in a person, and as Nature reports it, no such demonstration exists. The concrete thing to watch in the coming period is whether the same compounds are opened to a human study for this purpose. If they are not, that would not mean the finding was wrong; it would signal that the mouse blood system does not resemble ours closely enough, or that the risk looks larger than the gain.", "refs": ["haber-orak-hucre"], "tr": "Bir farede geri döndürülen yaşlanma izi, insanda geri döndürülmüş bir hastalık değildir; Nature'ın aktardığı hâliyle böyle bir gösterim de yok. Önümüzdeki dönemde izlenecek somut işaret, aynı bileşiklerin insanda bu amaçla bir denemeye açılıp açılmadığı olacak. Açılmazsa bu, bulgunun yanlış olduğu anlamına gelmez; fare kan sisteminin insanınkine yeterince benzemediğine ya da riskin kazançtan büyük göründüğüne dair bir işaret olur."}]}], "sources": [{"key": "haber-orak-hucre", "kind": "news", "name": "Nature", "url": "https://www.nature.com/articles/d41586-026-02339-1", "title": {"tr": "Orak hücreli farelerde kan kök hücreleri erken yaşlanma izleri taşıyor", "en": "In sickle-cell mice, blood stem cells carry marks of premature ageing"}, "publishedDate": "2026-08-03"}], "title": {"en": "What does ageing reversed in a mouse say to the clinic?", "tr": "Farede geri döndürülen yaşlanma kliniğe ne söyler?"}, "writer": "sci-02", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "Yangsan's national record was not broken in a single afternoon. What carries it is that the city had not dropped below 40 degrees for days, and the long-run day count the weather agency placed beside it.", "tr": "Yangsan'daki ülke rekoru tek bir öğle vaktinde kırılmadı. Rekoru taşıyan şey, kentin günlerce 40 derecenin altına inmemiş olması ve meteoroloji idaresinin yanına koyduğu uzun dönemli gün sayısı."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "A single day did not do this work", "tr": "Rekor tek bir günün işi değil"}, "ps": [{"en": "The Korea Meteorological Administration reported 42.5 degrees Celsius at 13:26 local time in Yangsan, in the country's southeast, and said it was the highest value in more than a century of observation. That same day more than twenty localities across the country were under emergency heat alerts. In the city itself, temperatures had run above 40 degrees on five consecutive days.", "refs": ["haber-yangsan"], "tr": "Kore Meteoroloji İdaresi, ülkenin güneydoğusundaki Yangsan'da yerel saatle 13:26'da 42,5 santigrat derece ölçüldüğünü bildirdi ve bunun bir asrı aşan ölçüm geçmişindeki en yüksek değer olduğunu belirtti. Aynı gün ülke genelinde yirmiden fazla yerleşim acil sıcaklık uyarısı altındaydı. Kentte sıcaklık, o güne gelene kadar beş gün üst üste 40 derecenin üzerinde seyretmişti."}, {"en": "That detail changes what the number means. A high reading standing on its own can be the product of an unusual day; a national high arriving at the end of an unbroken hot spell measures something else. In a city that has not dropped below 40 degrees for five days, the ground, the walls and the asphalt never get time to release their heat, and the next day starts from a higher point than the last. There is a reasonable counter-explanation as well: if the ground around a measuring station has been built up over the years, what the station reads carries the city's own warmth with it. The figure the agency published does not settle that distinction on its own.", "refs": ["haber-yangsan"], "tr": "Bu ayrıntı, sayının anlamını değiştiriyor. Tek başına duran bir rekor, alışılmadık bir günün ürünü olabilir; kesintisiz bir sıcak dönemin sonunda gelen rekor ise başka bir şeyi ölçer. Beş gün boyunca 40 derecenin altına inmeyen bir kentte topraktan, duvardan ve asfalttan ısı boşalmaya vakit bulamaz; ertesi günün başlangıç noktası bir öncekinden yüksektir. Buna karşı ileri sürülebilecek makul bir açıklama da var: ölçüm istasyonunun çevresi yıllar içinde yapılaştıysa istasyonun okuduğu değer kentin kendi ısısını da taşır. İdarenin yayımladığı rakam bu ayrımı tek başına çözmüyor."}]}, {"h": {"en": "From eight days to nineteen", "tr": "Sekiz günden on dokuz güne"}, "ps": [{"en": "The agency placed a second number beside its headline figure: the country's average annual count of heatwave days has gone from eight in the 1970s to nineteen over the past five years. That is a nationwide trend, not something resting on one station's single afternoon. A national high is the news; this second number is what stands behind it.", "refs": ["haber-yangsan"], "tr": "İdare rekorun yanına ikinci bir sayı koydu: ülkedeki yıllık ortalama sıcak hava dalgası gün sayısı, yetmişli yıllardaki sekizden son beş yılda on dokuza çıktı. Bu, tek bir istasyonun tek bir öğleden sonrasına bağlı olmayan, ülke ölçeğinde bir eğilim. Rekorun kendisi bir haber; bu sayı ise haberin arka planı."}, {"en": "Eight hot days a year and nineteen hot days a year do not ask the same preparation of the same country. Eight days can be handled with a budget set aside for an unusual stretch, temporary cooling points and warning systems. Nineteen days requires rethinking outdoor work, the school calendar and the summer curve of electricity demand. There is a concrete signal to watch: where the number of days Yangsan exceeds 40 degrees, and the number of localities under emergency heat alerts nationwide, settle by the end of next summer. If the nineteen-day average holds or rises, what changes the scale of preparation will be duration, not a single peak.", "refs": ["haber-yangsan"], "tr": "Yılda sekiz sıcak günle on dokuz sıcak gün, aynı ülkede aynı hazırlığı gerektirmez. Sekiz gün, olağandışı bir dönem için ayrılmış bir bütçeyle, geçici serinleme noktalarıyla ve uyarı sistemleriyle geçirilebilir. On dokuz gün, açık havada çalışan işleri, okul takvimini ve elektrik talebinin yaz eğrisini yeniden düşünmeyi gerektirir. Somut ve izlenebilir bir işaret var: Yangsan'ın 40 dereceyi aştığı gün sayısının ve ülke genelindeki acil sıcaklık uyarısı altındaki yerleşim sayısının önümüzdeki yaz sonunda nereye oturduğu. On dokuz günlük ortalama korunur ya da yükselirse, hazırlığın ölçeğini değiştiren şey rekor değil süre olacak."}]}], "sources": [{"key": "haber-yangsan", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-south-korea-highest-temperature.html", "title": {"tr": "Yangsan'da 42,5 derece ölçüldü, Güney Kore'nin en yüksek sıcaklığı", "en": "Yangsan measured 42.5 C, South Korea's highest temperature"}, "publishedDate": "2026-08-03"}], "title": {"en": "Yangsan stayed above 40 degrees for five days", "tr": "Yangsan beş gün 40 derecenin üstünde kaldı"}, "writer": "sci-03", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "In a parliament of fixed size you cannot both protect the local winner and match national vote shares. The theorem's real use is that it turns an argument about electoral systems into an argument about choices.", "tr": "Sandalye sayısı sabit bir mecliste hem yerel kazananı korumak hem de ülke oy oranlarını tutturmak matematiksel olarak mümkün değil. Teoremin asıl faydası, seçim tartışmasını tercih tartışmasına çevirmesi."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "What exactly the theorem forbids", "tr": "Teorem tam olarak neyi yasaklıyor"}, "ps": [{"en": "Sebastian Tim Holdum and Frederik Ravn Klausen define two-tier electoral systems, regionality and proportionality mathematically and build an impossibility theorem: no electoral system with a fixed parliament size can guarantee both proportional and geographic representation. Regionality means whoever wins the local contest keeps that seat; proportionality means national seat totals match national vote shares. Once enough parties compete, one of the three has to be given up.", "refs": ["haber-teorem"], "tr": "Sebastian Tim Holdum ve Frederik Ravn Klausen, iki kademeli seçim sistemlerini, bölgeselliği ve orantılılığı matematiksel olarak tanımlayıp bir imkânsızlık teoremi kuruyor: sandalye sayısı sabit hiçbir seçim sistemi, orantılı temsil ile coğrafi temsili birlikte güvence altına alamaz. Bölgesellik, yerel yarışı kazananın sandalyesini koruması demek; orantılılık, ülke genelindeki sandalye dağılımının oy oranlarına uyması. Parti sayısı yeterince arttığında üçünden biri bırakılmak zorunda."}, {"en": "The theorem connects two live cases through the same constraint. The German parliament keeps growing because the system lets seat count float in order to keep both regionality and proportionality. In Denmark's 2022 election a disproportionality emerged that decided the majority. By proving that these different outcomes share one mathematical source, the study turns electoral engineering into an explicit choice among competing guarantees.", "refs": ["haber-teorem"], "tr": "Teorem, iki güncel örneği aynı kısıt üzerinden birbirine bağlıyor. Alman parlamentosu büyümeye devam ediyor, çünkü sistem bölgeselliği ve orantılılığı korumak için sandalye sayısını serbest bırakıyor. Danimarka'nın 2022 seçiminde ise çoğunluğu belirleyen bir orantısızlık ortaya çıktı. Çalışma, farklı görünen bu sonuçların tek bir matematiksel kaynağı paylaştığını kanıtlayarak seçim mühendisliğini rakip güvenceler arasında açık bir tercihe dönüştürüyor."}]}, {"h": {"en": "The proposed algorithm sends the bill to regionality", "tr": "Önerilen algoritma faturayı bölgeselliğe kesiyor"}, "ps": [{"en": "To get around the theorem the authors propose an algorithm they call geographically ranked guaranteed proportionality. It secures proportionality and weakens regionality in exchange: once a party's national quota is filled, a candidate who finished well ahead in their own district can lose the seat. Of the three the theorem forbids together, the leg being given up is stated plainly.", "refs": ["haber-teorem"], "tr": "Yazarlar teoremin etrafından dolaşmak için coğrafi sıralamalı güvenceli orantılılık adını verdikleri bir algoritma öneriyor. Bu algoritma orantılılığı güvence altına alıyor, karşılığında bölgeselliği zayıflatıyor: bir partinin ülke genelindeki kotası dolduğunda, kendi bölgesinde açık ara önde bitiren bir aday sandalyesini kaybedebiliyor. Teoremin yasakladığı üçlüden vazgeçilen ayak açıkça belli."}, {"en": "As engineering this is a good design; as politics it is a hard one. The reason is visibility: asking a voter to accept that the candidate who won their district does not enter parliament is a plainer price than letting the seat count quietly grow, and plain prices gather more resistance. Another explanation is available: countries that let the chamber float may already be paying this cost and merely sending the bill to the budget and the size of the room, in which case what drives resistance is habit rather than visibility. The signal to watch in the coming period is whether a country using a two-tier system, in its next reform debate, writes down explicitly which of the three conditions it is dropping.", "refs": ["haber-teorem"], "tr": "Mühendislik açısından bu iyi bir tasarım, siyaset açısından zor bir tasarım. Nedeni görünürlük: bir seçmenin kendi bölgesinde kazanan adayın meclise girmemesini kabul etmesi, sandalye sayısının sessizce büyümesini kabul etmesinden daha açık bir bedeldir ve açık bedeller daha çok direnç toplar. Başka bir açıklama da mümkün: yer sayısını serbest bırakan ülkeler bu maliyeti zaten ödüyor olabilir, yalnızca faturayı bütçeye ve salon büyüklüğüne kesiyorlardır; o zaman direncin kaynağı görünürlük değil alışkanlık olur. Önümüzdeki dönemde izlenecek işaret, iki kademeli sistem kullanan bir ülkenin reform tartışmasında bu üç koşuldan hangisini açıkça bıraktığını yazması olacak."}]}], "sources": [{"key": "haber-teorem", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/08/260801042812.htm", "title": {"tr": "İki kademeli seçim sistemleri için bir imkânsızlık teoremi yayımlandı", "en": "An impossibility theorem was published for two-tier electoral systems"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Annals of Operations Research", "url": "https://link.springer.com/article/10.1007/s10479-026-07344-1", "publishedDate": "2026-07-31", "title": {"tr": "İki kademeli seçim sistemleri için imkânsızlık teoremi", "en": "Impossibility theorem for two-tier electoral systems"}}}], "title": {"en": "One of the three has to go", "tr": "Üçünden biri bırakılacak"}, "writer": "sci-04", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "The results of the British Columbia grizzly programme are heavy. But a count of twelve animals cannot carry a survival rate; what it carries is a direction.", "tr": "British Columbia'daki boz ayı programının sonuçları ağır. Ama on iki hayvanlık bir sayı bir hayatta kalma oranını taşıyamaz; taşıdığı şey bir yöndür."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "How much a small number carries", "tr": "Küçük bir sayı ne kadarını taşır"}, "ps": [{"en": "Lana M. Ciarniello's evaluation took in fourteen orphaned grizzly cubs between 2019 and 2022, released thirteen, and could establish the fate of twelve. Ten of those died, nine of them before their first denning. Median survival was 107 days. The recorded causes of death were human-bear conflict, illegal killing and attack by other bears.", "refs": ["haber-boz-ayi"], "tr": "Lana M. Ciarniello'nun değerlendirmesine 2019-2022 arasında on dört öksüz boz ayı yavrusu alındı, on üçü salındı, on ikisinin sonu bilinebildi. Bunların onu öldü; dokuzu ilk kış uykusuna girmeden. Ortanca hayatta kalma süresi 107 gün. Ölüm nedenleri insan-ayı çatışması, yasa dışı öldürme ve diğer ayıların saldırısı olarak kaydedildi."}, {"en": "It is easy to write an 83 percent mortality rate out of these numbers, but with twelve animals the uncertainty around that rate is as wide as the rate itself; one or two different endings move the figure by tens of points. The author says as much, describing the narrow sample as the natural size of programmes like this. A precise rate does not come out of it; the size of the direction does. Ten of twelve attempts ending the same way is hard to put down to chance.", "refs": ["haber-boz-ayi"], "tr": "Bu sayılardan yüzde 83'lük bir ölüm oranı yazmak kolay, ama on iki hayvanlık bir kümede o oranın etrafındaki belirsizlik oranın kendisi kadar geniştir; bir ya da iki farklı son, rakamı onlarca puan oynatır. Yazarın kendisi de bunu söylüyor ve örneklem darlığını bu tür programların doğal boyutu olarak niteliyor. Buradan kesin bir oran çıkmaz; çıkan şey yönün büyüklüğüdür. On iki denemenin onunun aynı yönde bitmesini tesadüfle geçiştirmek zordur."}]}, {"h": {"en": "Two explanations for the same data", "tr": "Aynı veriye iki açıklama"}, "ps": [{"en": "The explanation the author proposes is a problem of weight. Captive-reared yearlings were released at a mean of 127.4 kg against 36.1 kg for their wild counterparts. Every animal released above roughly 135 kg died. Animals that could be measured after release lost between 0.25 and 0.48 kg a day. The author calls this a trap: a body a motherless animal must carry without knowing how to feed it runs up an energy bill that the lean conditions of spring cannot cover.", "refs": ["haber-boz-ayi"], "tr": "Yazarın önerdiği açıklama bir ağırlık sorunu. Elde büyütülen bir yaşındakiler ortalama 127,4 kg ile salındı; yabani yaşıtlarının ortalaması 36,1 kg. Yaklaşık 135 kg üzerinde salınan bireylerin tamamı öldü. Salındıktan sonra ölçülebilen hayvanlar günde 0,25 ile 0,48 kg arasında kaybetti. Yazar buna bir tuzak diyor: annesiz büyümüş bir hayvanın nasıl besleneceğini bilmeden taşımak zorunda kaldığı gövde, ilkbaharın kıt koşullarında karşılanamayacak bir enerji faturası çıkarıyor."}, {"en": "A second explanation fits the same picture. Half the deaths came from human-bear conflict and a fifth from illegal killing; the immediate cause of most deaths was people, not hunger. Weight may mark an animal that chooses to go near people, while human contact remains what kills it. The two explanations separate at a point where separation is possible: if the programme pulls release weight down towards wild levels and cuts feeding and human contact to break habituation, the share of animals reaching a first denning should change. That share is the concrete signal to watch; if mean release weight falls while the number reaching a first winter stays where it is, the problem was not the weight.", "refs": ["haber-boz-ayi"], "tr": "Aynı tabloya ikinci bir açıklama da uyuyor. Ölümlerin yarısı insan-ayı çatışmasından, beşte biri yasa dışı öldürmeden geldi; yani ölümlerin çoğunluğunun doğrudan nedeni açlık değil insandı. Ağırlık, insanların yakınına gitmeyi seçen bir hayvanın belirteci olabilir; öldüren şey yine de insan teması olur. İki açıklama ayrılabilir bir yerde ayrılıyor: program salım ağırlığını yabani düzeye çekerse ve alışkanlığı kırmak için besleme ile insan teması azaltılırsa, ilk kış uykusuna ulaşan hayvan oranı değişmelidir. İzlenecek somut işaret bu oran; salım ağırlığı ortalaması düşerken ilk kışa varan hayvan sayısı yerinde kalırsa, sorunun ağırlıkta olmadığı görülür."}]}], "sources": [{"key": "haber-boz-ayi", "kind": "news", "name": "Frontiers in Conservation Science", "url": "https://www.frontiersin.org/articles/10.3389/fcosc.2026.1855000/full", "title": {"tr": "Elde büyütülüp doğaya bırakılan on iki boz ayı yavrusunun onu öldü", "en": "Ten of twelve hand-reared grizzly cubs returned to the wild died"}, "publishedDate": "2026-08-03"}], "title": {"en": "Fourteen cubs, twelve known endings", "tr": "On dört yavru, on iki bilinen son"}, "writer": "sci-05", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "About two percent of the human genome comes from two lineages that have never been matched to a fossil group. That does not say our family tree is incomplete; it says the gap can now be measured.", "tr": "İnsan genomunun yaklaşık yüzde ikisi, bugüne kadar hiçbir fosil topluluğuyla eşleştirilmemiş iki soydan geliyor. Bu, soy ağacımızın eksik olduğunu değil, eksikliğin artık ölçülebildiğini söylüyor."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "Two nameless relatives", "tr": "Adsız iki akraba"}, "ps": [{"en": "Yulin Zhang and colleagues at Berkeley report traces of two previously undescribed archaic lineages in the modern human genome, using a computational approach they call TRACE. In the study published in Science, the first split from the human family tree about 800,000 years ago, mixed with modern humans more than 50,000 years ago, and accounts today for roughly one percent of every person's genome, appearing at similar levels inside and outside Africa. The second is dated to about 1.8 million years ago, did not mix directly with Homo sapiens, mixed with Denisovans in Eurasia and reached us through them, and is most common in Oceanian populations.", "refs": ["haber-hominin"], "tr": "Berkeley'den Yulin Zhang ve arkadaşları, TRACE adını verdikleri bir hesaplama yaklaşımıyla modern insan genomunda daha önce tanımlanmamış iki eski soyun izini bildirdi. Science dergisinde yayımlanan çalışmaya göre ilki insan soy ağacından yaklaşık 800.000 yıl önce ayrılmış, 50.000 yıldan uzun süre önce modern insanlarla karışmış ve bugün her insanın genomunun yaklaşık yüzde birini oluşturuyor; Afrika içindeki ve dışındaki topluluklarda benzer oranda görülüyor. İkincisi yaklaşık 1,8 milyon yıl öncesine tarihleniyor, Homo sapiens ile doğrudan karışmamış, Avrasya'da Denisovalılar ile karışıp insana oradan geçmiş ve en çok Okyanusya topluluklarında görülüyor."}, {"en": "Our archaic relatives that carry names were known from bone first and found in the genome afterwards. Here the order reverses. What sits in the genome has no face, no cave, no toolkit. A person carries a share from an ancestor they could not meet in any museum. That is an unfamiliar position in the story we tell about ourselves: drawing a branch of the family tree without ever knowing what the branch looked like.", "refs": ["haber-hominin"], "tr": "Adı olan eski akrabalarımızı önce kemikten tanıdık, genomda sonra bulduk. Burada sıra tersine dönüyor. Genomda duran şeyin bir yüzü, bir mağarası, bir alet takımı yok. Bir insan, kendisine hiçbir müzede rastlayamayacağı bir atadan pay taşıyor. Bu, insanın kendisi hakkındaki hikâyesinde alışılmadık bir konum: soy ağacının bir dalını, o dalın nasıl göründüğünü hiç bilmeden çizmek."}]}, {"h": {"en": "Reading a family tree without fossils", "tr": "Fosilsiz bir soy ağacı okumak"}, "ps": [{"en": "The approach does not rest on ancient DNA but on ancestry relationships built from the genomes of people living today. Segments that reach far deeper than expected are sought out, and that depth is read as a contribution from outside. As the authors report it, some of these segments cluster in regions tied to immunity and metabolism — not scattered debris, then, but an inheritance that may have been useful.", "refs": ["haber-hominin"], "tr": "Yaklaşımın dayanağı eski DNA değil; bugün yaşayan insanların genomları
