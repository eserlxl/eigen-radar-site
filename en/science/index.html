 metres closes only with a higher-frequency radar. Until one of those happens, the map is a well-documented statement of what four instruments jointly imply; it cannot count as a statement about where the ice is.", "refs": ["mars"]}]}], "sources": [{"key": "mars", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-laying-odds-potential-martian-future.html", "title": {"tr": "Mars'ın buz haritası artık sınır çizmek yerine olasılık veriyor", "en": "A Mars ice map now states the odds instead of drawing a boundary"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "The Planetary Science Journal", "url": "https://doi.org/10.3847/PSJ/ae8904", "publishedDate": "2026-07-31", "title": {"tr": "Mars'ta yüzey altı su buzunun haritalanması: olasılıkçı bir yaklaşım", "en": "Subsurface Water Ice Mapping on Mars: A Probabilistic Approach"}}}], "date": "2026-08-01"}, {"writer": "sci-06", "title": {"tr": "Ay'daki yeni çukuru kimse hedeflemedi", "en": "Nobody aimed the new crater on the Moon"}, "excerpt": {"tr": "On iki metrelik bir tüp bir buçuk yıl önce işini bitirdi ve o günden beri kimsenin olmadı. Çarşamba günü Ay'da bir çukur açması bekleniyor. Fiziksel olarak önemsiz; asıl soru, bunu bir kaza mı yoksa artık sıradan bir sonuç mu sayacağımız.", "en": "A twelve-metre tube finished its job a year and a half ago and has belonged to nobody since. On Wednesday it is expected to open a hole in the Moon. Physically it is trivial; the real question is whether we count it an accident or an ordinary consequence."}, "sections": [{"h": {"tr": "Kimsenin olmayan bir nesne", "en": "An object that belongs to nobody"}, "ps": [{"tr": "Nesnenin ölçüleri belli: yaklaşık 12 metrelik boyda, 4.500 kilogramlık ağırlıkta bir üst kademe. 15 Ocak 2025'te iki özel iniş aracını yola çıkardı; Firefly Aerospace'in Blue Ghost aracı Ay'a tümüyle başarılı iniş yapan ilk özel uzay aracı oldu, ispace'in aracı ise parçalandı. Uzay izleme uzmanı Bill Gray, kademenin Ay'ın batı kenarındaki Einstein Krateri yakınına saatte 5.400 mil hızla, yani sesin yedi katıyla çarpacağını öngörüyor. Los Alamos Ulusal Laboratuvarı'ndan Benjamin Fernando yaklaşık 27 metrelik çapta ve 5 metrelik derinlikte bir çukur bekliyor; enerji üç ton TNT'ye eşdeğer.", "en": "The object's dimensions are known: an upper stage about 12 metres long and 4,500 kilograms in weight. On 15 January 2025 it sent two private landers on their way; Firefly Aerospace's Blue Ghost became the first private spacecraft to make a fully successful lunar landing, while the ispace lander wrecked. Space tracking expert Bill Gray predicts that the stage could hit near Einstein Crater on the Moon's western limb at 5,400 mph, seven times the speed of sound. Benjamin Fernando of Los Alamos National Laboratory expects a hole about 27 metres across and 5 metres deep, with energy equivalent to three tons of TNT.", "refs": ["moon"]}, {"tr": "Ay'ın yüzeyi zaten kraterlerle kaplı olduğu için 27 metrelik bir çukur fiziksel olarak hiçbir şeyi değiştirmiyor. Bu okumayı önce vermek gerekir, çünkü doğrudur. Ay sürekli doğal nesnelerle dövülüyor, bunların çoğu bundan çok daha fazla enerjiyle geliyor. Emekli astrofizikçi Jonathan McDowell da çarpmanın kendisinin bir sorun olmayacağını söylüyor. Buradaki mesele fizik değildir.", "en": "The Moon's surface is already covered in craters, so a 27-metre hole changes nothing physically, and this reading should come first because it is correct. The Moon is struck constantly by natural objects, most of them arriving with far more energy than this. The retired astrophysicist Jonathan McDowell also says the impact itself will not be a problem. What is at stake here is not physics.", "refs": ["moon"]}]}, {"h": {"tr": "Kazayı deneye çeviren şey", "en": "What turns an accident into an experiment"}, "ps": [{"tr": "NASA'nın Lunar Reconnaissance Orbiter aracı ile Güney Kore'nin Danuri aracının bölgeyi çarpmadan önce ve sonra görüntülemesi planlanıyor. Bakabilen iki aracın orada bulunması, bir çöp parçasını kütlesi, hızı ve zamanı bilinen bir çarpma denemesine dönüştürüyor; Fernando'nun bu olayın enkaz çarpmalarının gelecekteki astronotlar için ne kadar tehlike oluşturduğunu anlamaya yarayacağını söylemesinin nedeni de bu. Değerin tamamı başka amaçlarla gönderilmiş araçlardan ödünç alınıyor.", "en": "NASA's Lunar Reconnaissance Orbiter and South Korea's Danuri are to image the region before and after the impact. Two spacecraft happening to be there and able to look turn a piece of litter into an impact experiment with a known mass, speed and time, which is why Fernando says the event will help work out how much of a hazard debris impacts pose to future astronauts. The whole of the value is borrowed from spacecraft sent for other purposes.", "refs": ["moon"]}, {"tr": "Ödünç alınmış olmanın bir bedeli var. Kütle ve hız ölçülmüş değerler sayılmaz; Gray'in izleme çalışmasının kestirimleridir ve öngörü bir kurum duyurusundan gelmiyor. Başlangıç koşulları ayarlanmak yerine çıkarılmış bir çarpma denemesi, tasarlanmış bir denemeden zayıf kalır. Yararlıdır, ama planlanmış bir sınamanın yerini tutmaz ve sonuçları bu sınırla okunmalıdır.", "en": "Being borrowed has a price. The mass and the speed cannot be counted as measured values; they are estimates from Gray's tracking work, and the prediction does not come from an agency announcement. An impact experiment whose initial conditions were inferred rather than set stays weaker than one that was designed. It is useful, but it does not replace a planned test, and its results should be read within that limit.", "refs": ["moon"]}]}, {"h": {"tr": "Kimin sorunu", "en": "Whose problem it is"}, "ps": [{"tr": "McDowell'in işaret ettiği ay üssü işletimi yaklaşırken, ayrılmadan sonra bir kademenin sorumluluğunun kimsede olmaması yalnızca Ay boş kaldığı sürece sorun yaratmıyordu. Gray de yukarısının kalabalıklaştığını söylüyor. Kurumsal soru burada duruyor: fırlatma sağlayıcısı mı, yükün müşterisi mi, ruhsatı veren devlet mi. Bugünkü yanıt hiç kimse. Yanıtın değiştiğini gösterecek işaret basit: iki yörünge aracının çektiği görüntülerin bir olay olarak mı, yoksa güzel bir fotoğraf olarak mı ele alınacağı.", "en": "The arrangement in which nobody holds responsibility for a stage after separation caused no trouble only while the Moon stayed empty, and lunar base operations of the kind McDowell points to are approaching. Gray says things are getting crowded up there. The institutional question sits here: the launch provider, the payload customer, or the licensing state. Today the answer is nobody. The signal that the answer has changed is simple: whether the images taken by the two orbiters are treated as an incident or as a nice photograph.", "refs": ["moon"]}, {"tr": "ABD ve Kanada'nın doğusu ile Güney Amerika'nın büyük bölümü çarşamba gecesi en iyi görüşe sahip olabilir; toz bulutu teleskopla on dakikalarca izlenebilir, parlamanın kendisi görülemeyecek kadar sönük kalır. Bakan biri, insan yapımı bir nesnenin başka bir dünyada bıraktığı izi tam oluşurken görebilir. Ve bunu kimsenin planlamadığını bilerek bakar.", "en": "The eastern parts of the US and Canada and much of South America may have the best views on Wednesday night; the dust plume can be watched by telescope for tens of minutes, while the flash itself stays too dim to see. Anyone watching may see the mark a human-made object leaves on another world at the moment it is made. And they watch it knowing that nobody planned it.", "refs": ["moon"]}]}], "sources": [{"key": "moon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-discarded-spacex-rocket-high-collision.html", "title": {"tr": "Terk edilmiş bir Falcon 9 üst kademesinin çarşamba günü Ay'a çarpması bekleniyor", "en": "A discarded Falcon 9 upper stage is expected to strike the Moon on Wednesday"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "sci-01", "title": {"tr": "Mars'ın iyon kaybı, rüzgârı başka bir yörüngeden izleyerek kaynağına bağlandı", "en": "Tying Mars's ion loss to its source took watching the wind from another orbit"}, "excerpt": {"tr": "MAVEN yıllardır kaçan iyonları sayıyor. Eksik olan, o sırada gelen güneş rüzgârının ne yaptığıydı; Tianwen-1 yukarı akışta durunca ölçüm iki uçlu hale geldi.", "en": "MAVEN has been counting escaping ions for years. What was missing was what the incoming solar wind was doing at that moment; with Tianwen-1 standing upstream, the measurement finally had two ends."}, "sections": [{"h": {"tr": "Tek araçla ölçülemeyen şey", "en": "What one spacecraft could not measure"}, "ps": [{"tr": "Science Advances'te 31 Temmuz 2026'da yayımlanan hakemli çalışmada iş bölümü açık: MAVEN Mars yakınında kaçan iyonları ölçtü, Tianwen-1 ise yukarı akıştaki güneş rüzgârını izledi. Baş yazar Chi Zhang, tek bir uzay aracıyla hem gelen rüzgârı hem kaçan iyonları aynı anda ölçmenin büyük bir güçlük olduğunu söylüyor.", "en": "In the peer-reviewed study published in Science Advances on 31 July 2026 the division of labour is explicit: MAVEN measured ions escaping near Mars while Tianwen-1 monitored the solar wind upstream. Lead author Chi Zhang says measuring the incoming wind and the escaping ions at once with a single spacecraft was a major challenge.", "refs": ["mars-ions"]}, {"tr": "Bu, ölçüm geometrisinin bir sonucudur ve etkisi büyük. Tek araçla toplanan kaçış oranı kendi başına bir sayı olarak kalır: gezegenin atmosfer yitirdiğini söyler, o anda kaybı neyin sürüklediğini sessizce geçer. Yukarı akışta ikinci bir gözlemci durunca aynı sayı bir sürücüyle eşleştirilebiliyor. Daha sade bir okuma da elde duruyor: eşleşmenin bir bölümü, iki aracın aynı büyük ölçekli rüzgâr olayını farklı konumlardan görmesinden doğabilir, ve bunu ayırmak için olay sayısının artması gerekiyor.", "en": "This follows from measurement geometry, and its effect is large. An escape rate gathered by one spacecraft stays a number on its own: it says the planet is losing atmosphere and passes over what was driving the loss at that moment. With a second observer standing upstream, the same number can be matched to a driver. A plainer reading also remains available: part of the match could arise from the two craft seeing the same large-scale wind event from different positions, and separating that requires more events.", "refs": ["mars-ions"]}]}, {"h": {"tr": "Bulutun içindeki akı", "en": "The flux inside the cloud"}, "ps": [{"tr": "Makalenin özetine göre ortak gözlemler, iyon taşıyan yerel plazma bulutlarının Kelvin-Helmholtz kararsızlığının ürettiği doğrusal olmayan dalga paketleri olduğunu doğrudan gösteriyor. İki noktalı ölçüm sayesinde bu dalgaların uzamsal ölçeği ilk kez sınırlandırıldı. Sayı da veriliyor: plazma bulutları içindeki iyon akıları, olağan kararlı durum kaçış kanallarındakinden bir ila iki kat büyüklük mertebesi yüksek.", "en": "According to the paper's abstract, the joint observations give direct evidence that the localized plasma clouds carrying ions are nonlinear wave packets generated by the Kelvin-Helmholtz instability. Two-point measurement constrains the spatial scale of those waves for the first time. The figure is given too: ion fluxes within plasma clouds are one to two orders of magnitude higher than those in typical steady-state escape channels.", "refs": ["mars-ions"]}, {"tr": "Yüz kata varan bir akı farkı, bu kanalın kayıp bütçesindeki ağırlığını tek başına belirlemiyor, çünkü bütçeyi belirleyen şey akının yanında bu bulutların ne sıklıkta ve ne kadar geniş bir alanda oluştuğudur. Ölçek kısıtı burada değerli: sıklık ölçülebilirse toplam pay hesaplanabilir hale gelir. Kaçışın ağırlıkla gezegenin tek bir yanında görülmesi ve o yanın güneş rüzgârının elektrik alan yönüne bağlı olması, mekanizmayı destekleyen ikinci gözlem. Rastgele bir kayıp süreci böyle bir yön seçmezdi.", "en": "A flux difference reaching a hundredfold does not by itself fix this channel's weight in the loss budget, because the budget depends on how often and over how wide an area these clouds form as much as on the flux. The scale constraint matters here: once frequency can be measured, the total share becomes computable. That escape appears mainly on one side of the planet, and that the side depends on the direction of the solar wind's electric field, is a second observation supporting the mechanism. A random loss process would not pick a side.", "refs": ["mars-ions"]}]}, {"h": {"tr": "Sıradaki ölçüm", "en": "The next measurement"}, "ps": [{"tr": "Bu sonucu asıl sınayacak gözlem şu: elektrik alanın yönü döndüğünde kaçışın yoğunlaştığı yan da dönmeli. İki aracın yeniden eşzamanlı ve uygun konumda bulunduğu her dönemde bu bekleniyor, ve öngörülen yön değişimi görülmezse mekanizmanın kaçış bütçesindeki payı aşağı çekilir. Ekibin kendisi de ek uzay aracı gözlemleri ve sayısal benzetimler istiyor; bir sonraki gözlem dizisinin sonuçları 2027 ortasına kadar yayımlanırsa, sayı ilk kez tek bir olaydan fazlasına dayanacak.", "en": "The observation that will really test this result is straightforward: when the direction of the electric field turns, the side where escape concentrates should turn with it. That is expected in every period when the two craft are again suitably placed at the same time, and if the predicted reversal does not appear, the mechanism's share of the escape budget drops. The team itself calls for additional spacecraft observations and numerical simulations; if results from the next observing series are published by the middle of 2027, the figure will rest on more than a single event for the first time.", "refs": ["mars-ions"]}]}], "sources": [{"key": "mars-ions", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-solar-mars-upper-atmosphere-boosting.html", "title": {"tr": "MAVEN iyonları sayarken Tianwen-1 güneş rüzgârını izledi ve Mars'taki kaçış dalgalara bağlandı", "en": "With MAVEN counting ions and Tianwen-1 watching the solar wind, ion escape at Mars was tied to waves"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Science Advances", "url": "https://pubmed.ncbi.nlm.nih.gov/42536743/", "publishedDate": "2026-07-31", "title": {"tr": "Eşzamanlı Mars yörünge gözlemleri, Kelvin-Helmholtz kararsızlığının sürüklediği toplu atmosferik iyon kaçışını ortaya koyuyor", "en": "Simultaneous Mars-orbit observations reveal Kelvin-Helmholtz instability-driven bulk atmospheric ion escape"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-02", "title": {"tr": "Üç hafta ateş, birkaç acil servis, sonunda ayak bileğindeki kene", "en": "Three weeks of fever, several emergency rooms, and finally the tick on the ankle"}, "excerpt": {"tr": "Hasta önce ateş nöbetleri, döküntü ve bulantıyla geldi; yüz felci eklendi, yatış geldi. Tanı ancak evde bulunan kene test edildikten sonra bir isim kazandı.", "en": "The patient came first with febrile episodes, a rash and nausea; facial paralysis followed, then admission. The diagnosis acquired a name only after the tick found at home was tested."}, "sections": [{"h": {"tr": "Hastanın izlediği yol", "en": "The path the patient took"}, "ps": [{"tr": "Open Forum Infectious Diseases'te 24 Temmuz 2026'da çevrimiçi yayımlanan olgu bildirimine göre orta Teksas'ta yaşayan bir kişi, evinde ayak bileğine tutunmuş, kan emmiş bir kene buluyor. Kene, yumuşak kene kaynaklı tekrarlayan ateşin etkeni olan Borrelia turicatae için pozitif çıkıyor. Hasta bundan üç hafta önce ateş nöbetleri, döküntü ve bulantı yaşamaya başlamıştı; Phys.org'a göre tabloya yorgunluk, baş ağrısı ve yüz felci de eklendi, birden çok acil servis başvurusu ve sonunda hastaneye yatış oldu.", "en": "According to the case report published online in Open Forum Infectious Diseases on 24 July 2026, a central Texas resident finds an engorged tick attached to their ankle at home. The tick tests positive for Borrelia turicatae, the causative agent of soft tick-borne relapsing fever. The patient had begun having febrile episodes, a rash and nausea three weeks earlier; according to Phys.org, fatigue, headaches and facial paralysis joined the picture, with multiple emergency room admissions and eventual hospitalization.", "refs": ["tick-case"]}, {"tr": "Bu seyri hasta açısından okumak gerekiyor. Ateş nöbetleri arayla geliyor, aralarda kişi düzeliyor ve her başvuru kendi başına bakıldığında geçici bir tabloya benziyor. Yüz felcinin eklenmesi ciddiyeti gösteriyor ama etkeni göstermiyor. Sonunda tanıyı yönlendiren şey bir laboratuvar bulgusu oldu; yalnız o bulgu hastadan değil, evde bulunan keneden geldi. Makalenin kendi ifadesiyle enfeksiyonun tanısı konulamadı.", "en": "That course has to be read from the patient's side. The febrile episodes come at intervals, the person recovers between them, and each presentation on its own looks like something passing. Facial paralysis shows the severity without showing the agent. In the end a laboratory finding steered the diagnosis, except that the finding came from the tick found at home rather than from the patient. In the paper's own words, the infection remained undiagnosed.", "refs": ["tick-case"]}]}, {"h": {"tr": "Tanı listesine hiç girmeyen ihtimal", "en": "The possibility that never entered the differential"}, "ps": [{"tr": "Yazarların çıkardığı sonuç bir görünürlük sorununa işaret ediyor: enfekte yumuşak keneler yalnızca kırsalda değil, şehir parklarında, mahallelerde ve evlerde de bulunabiliyor. İstedikleri üç şey de bununla uyumlu: hekimler arasında daha fazla farkındalık, geliştirilmiş tanı testleri ve artırılmış sürveyans.", "en": "The conclusion the authors draw points to a visibility problem: infected soft ticks may be present not only in rural environments but also in city parks, neighborhoods and homes. The three things they ask for follow from that: greater awareness among health care providers, improved diagnostic testing and increased surveillance.", "refs": ["tick-case"]}, {"tr": "Klinik açıdan asıl darboğaz burada. Austin içinde yaşayan, tekrarlayan ateşle gelen bir hastada bu ihtimal ayırıcı tanı listesine girmiyorsa gerekli test hiç istenmiyor, ve test istenmediği sürece bölgede kaç olgunun benzer biçimde adsız kaldığı da bilinmiyor. Gecikmenin tek açıklaması bu olmayabilir: testin erişilebilirliği ya da ateş nöbetleri arasında uygun anda örnek alma güçlüğü de aynı sonucu verebilir.", "en": "Clinically that is where the bottleneck sits. If the possibility does not enter the differential for a patient living inside Austin who presents with recurring fevers, the necessary test is never ordered, and while it is not ordered nobody knows how many cases in the area stay unnamed in the same way. This may not be the only explanation for the delay: test availability, or the difficulty of sampling at the right moment between febrile episodes, could produce the same outcome.", "refs": ["tick-case"]}]}, {"h": {"tr": "Bir olgunun taşıyabileceği yük", "en": "What a single case can carry"}, "ps": [{"tr": "Payda bir kişi. Bu, bir kentte yerleşmiş bir bulaş döngüsü anlamına gelmiyor ve makale de böyle bir iddia taşımıyor. Hastalar açısından tabloyu değiştirecek iki gözlem var: aynı bölgedeki konutlardan toplanan kenelerde enfeksiyonun birden fazla noktada gösterilmesi, ya da laboratuvarda doğrulanmış bir insan enfeksiyonunun bildirilmesi. İkincisi geldiğinde tedavi de erken başlayabilir; ilki geldiğinde sürveyansın kapsamı genişler.", "en": "The denominator is one person. That does not amount to an established urban transmission cycle, and the paper makes no such claim. For patients, two observations would change the picture: infection shown in ticks collected from more than one residential site in the same area, or a laboratory-confirmed human infection reported. When the second arrives, treatment can start earlier; when the first arrives, the reach of surveillance widens.", "refs": ["tick-case"]}]}], "sources": [{"key": "tick-case", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-case-soft-borne-relapsing-fever.html", "title": {"tr": "Austin'de bir evde bulunan kene Borrelia turicatae taşıyordu; hastanın enfeksiyonu doğrulanamadı", "en": "A tick found in an Austin home carried Borrelia turicatae; the patient's infection was never confirmed"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Open Forum Infectious Diseases", "url": "https://pubmed.ncbi.nlm.nih.gov/42517151/", "publishedDate": "2026-07-24", "title": {"tr": "Austin, Teksas büyükşehir bölgesinde bir konutta spiroket taşıyan Ornithodoros turicata'ya insan maruziyeti", "en": "Human Exposure to Spirochete-Infected Ornithodoros turicata in a Residential Setting in the Austin, Texas Metropolitan Area"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-03", "title": {"tr": "Bulut parlatma El Niño'yu zayıflatıyor, ardından La Niña'yı öne çekiyor", "en": "Cloud brightening weakens El Nino, then pulls the following La Nina forward"}, "excerpt": {"tr": "Benzetimde kaldıraç çalışıyor. Aynı benzetimde kaldıracın bırakıldığı an etki de zayıflıyor, ve hedeflenen El Niño'nun ardından La Niña daha erken geliyor.", "en": "In the simulation the lever works. In the same simulation the effect weakens the moment the lever is released, and the La Nina after the targeted El Nino arrives earlier."}, "sections": [{"h": {"tr": "Modelin tuttuğu yer", "en": "Where the model holds"}, "ps": [{"tr": "Science Advances'te 10 Temmuz 2026'da yayımlanan hakemli çalışma, deniz bulutu parlatmayı uzun vadeli ısınma yerine mevsimlik ve çok yıllık bir olguya yöneltiyor. Ekip önce 2019-2020 Avustralya orman yangınlarının sağladığı fırsat deneyinden yararlanıyor: yangınların yol açtığı doğal bulut parlatması ve ardından gelen La Niña benzeri tepki, güneydoğu Pasifik'te benzetimle yeniden üretiliyor. Sonra 1997-1998 ve 2015-2016 El Niño olayları üzerinde deneniyor.", "en": "The peer-reviewed study published in Science Advances on 10 July 2026 turns marine cloud brightening away from long-term warming and toward a seasonal-to-multiyear phenomenon. The team first exploits the opportunistic experiment provided by the 2019-2020 Australian wildfires: the natural cloud brightening those fires produced, and the La Nina-like response that followed, are reproduced by simulating the intervention in the southeast Pacific. It is then tried on the 1997-1998 and 2015-2016 El Nino events.", "refs": ["cloud-brightening"]}, {"tr": "Mekanizma açıkça adlandırılıyor. El Niño'nun büyüme evresinde başlatılan müdahale, El Niño koşullarını normalde güçlendiren Bjerknes geri beslemelerini bozuyor. Bu, bir sıcaklık farkının doğrudan bastırılması yerine, olayı büyüten döngünün kesilmesi anlamına geliyor; kaldıracın tutunduğu yer de burası. Phys.org'un aktardığı donanım ölçeği ise ayrı bir kısıt: deniz tuzu memeleriyle donatılmış yaklaşık 2.400 gemi gerekiyor ve mevcut memeler gereken hacme henüz ulaşamıyor.", "en": "The mechanism is named plainly. An intervention started during El Nino's growth phase disrupts the Bjerknes feedbacks that normally amplify El Nino conditions. That means cutting the loop which grows the event rather than suppressing a temperature difference directly, and it is where the lever finds its grip. The hardware scale Phys.org reports is a separate constraint: roughly 2,400 vessels equipped with sea-salt nozzles are needed, and current nozzles cannot yet achieve the required volume.", "refs": ["cloud-brightening"]}]}, {"h": {"tr": "Kaldıraç bırakıldığında", "en": "When the lever is released"}, "ps": [{"tr": "Çalışmanın en dikkat çekici bulgusu sürekliliğe dair. Müdahale sonlandırıldıktan sonra etkiler zayıflıyor, ve yalnızca en erken ve en uzun müdahaleler nötr ENSO koşullarını geri getirip uzak bağlantıları zayıflatıyor. İstenmeyen sonuçlar arasında hedeflenen El Niño'nun ardından daha erken bir La Niña sayılıyor; erken ve kısa müdahalelerin bu etkiyi dengeleyebileceği belirtiliyor.", "en": "The study's most striking finding concerns persistence. After the intervention is terminated the effects weaken, and only the earliest and longest interventions restore neutral ENSO conditions and weaken teleconnections. Among the unintended consequences is an earlier La Nina following the targeted El Nino, and the paper notes that early and short interventions may counter that effect.", "refs": ["cloud-brightening"]}, {"tr": "Bu, bir müdahalenin muhasebesini değiştiriyor. Kazanç ile maliyet aynı olay içinde kapanmıyor; kazanç hedeflenen El Niño'da, maliyetin bir bölümü onu izleyen evrede ortaya çıkıyor. Erken ve uzun müdahale nötr koşulları geri getiriyor ama gemi sayısını ve süreyi yukarı çekiyor; erken ve kısa olanı ise La Niña etkisini dengeliyor. Yani zamanlama tek bir en iyi değeri olan bir ayar değil, iki ayrı hedefin çekiştirdiği bir denge. Daha ihtiyatlı bir okuma da mümkün: bu davranış modelin ENSO temsiline özgü olabilir ve başka bir modelde farklı çıkabilir.", "en": "This changes the accounting for an intervention. Gain and cost do not close inside the same event; the gain sits in the targeted El Nino while part of the cost appears in the phase that follows. An early and long intervention restores neutral conditions and at the same time raises the ship count and the duration, while an early and short one balances the La Nina effect. Timing, then, is a setting pulled between two aims rather than one with a single best value. A more cautious reading is also available: this behaviour may be specific to how this model represents ENSO and could come out differently in another.", "refs": ["cloud-brightening"]}]}, {"h": {"tr": "Modelin bakmadığı yer", "en": "What the model did not look at"}, "ps": [{"tr": "Wan uzun vadeli etkilere bakmadıklarını söylüyor. Bir kaldıracı tartılabilir kılacak çalışma da tam olarak budur: art arda gelen birkaç ENSO çevriminde müdahalenin toplam bilançosu. Şu an elimizde iki tarihsel olay üzerinde ölçülmüş bir kazanç, bir zayıflama ve bir kayma var; bunların üst üste bindiğinde nasıl davrandığı açık kalıyor. İzlenecek işaret, çok çevrimli bir benzetimin bölgesel sıcaklık ve yağış farklarıyla birlikte yayımlanması.", "en": "Wan says the team did not look at long-term impacts. The study that would make such a lever weighable is exactly that: the intervention's full balance across several successive ENSO cycles. What exists now is a gain, a weakening and a shift measured over two historical events, and how they behave when stacked remains open. The signal to watch is a multi-cycle simulation published together with regional temperature and precipitation differences.", "refs": ["cloud-brightening"]}]}], "sources": [{"key": "cloud-brightening", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-pacific-cloud-brightening-weaken-el.html", "title": {"tr": "Model çalışması, ekvator Pasifiği'nde bulut parlatmanın El Niño'yu zayıflattığını, Avrupa ile Asya'yı ısıttığını buluyor", "en": "A modelling study finds that brightening clouds over the equatorial Pacific weakens El Niño and warms Europe and Asia"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Science Advances", "url": "https://pubmed.ncbi.nlm.nih.gov/42418575/", "publishedDate": "2026-07-10", "title": {"tr": "Hedeflenmiş deniz bulutu parlatma, ardından gelen El Niño'yu zayıflatıyor", "en": "Targeted marine cloud brightening weakens subsequent El Nino"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-04", "title": {"tr": "Yetmiş mantıksal kübitin altında 97 fiziksel kübit ve bir eleme adımı var", "en": "Under seventy logical qubits sit 97 physical qubits and a discard step"}, "excerpt": {"tr": "Ön baskının asıl katkısı kübit sayısında değil, sonucun ne kadar doğru olduğunu cihazın kendi sendrom ölçümlerinden çıkarabilmesinde. Sertifikanın bedeli elenen çalıştırmalarla ödeniyor.", "en": "The preprint's real contribution lies in deriving how correct the result is from the device's own syndrome measurements, rather than in the qubit count. The certificate is paid for in discarded runs."}, "sections": [{"h": {"tr": "Devreyi neden yeniden tasarladılar", "en": "Why they redesigned the circuit"}, "ps": [{"tr": "28 Temmuz 2026'da arXiv'e gönderilen ön baskı, örnekleme temelli önerilerin karmaşıklık kuramına dayanan zorluğunu iki yetenekle birleştirmeyi hedefliyor: donanım hatalarını bastırmak ve kuantum hesabının kendisini doğrulamak. Yazarların çözümü yapılandırılmış devreler; bu devreler kanıtlanabilir zorluk güvencelerinin yanında bir kuantum koduna gömülmeye elverişli. Böylece yüksek devre derinliklerinde yüksek sadakate ulaşmak ile deneysel sadakati kod sendromlarının ölçümüyle belgelemek aynı anda mümkün oluyor.", "en": "The preprint submitted to arXiv on 28 July 2026 sets out to combine the complexity-theoretic hardness of sampling-based proposals with two capabilities: suppressing hardware errors and verifying the quantum computation itself. The authors' answer is structured circuits, which alongside provable hardness guarantees admit an encoding in a quantum code. That makes it possible at once to reach high fidelities at high circuit depths and to certify an experimental fidelity by measuring code syndromes.", "refs": ["quantum"]}, {"tr": "Parçaları tek tek koyalım. Gösterim, 468 T kapısıyla katkılanmış 70 kübitlik, 70 derinliğindeki bir Clifford devresi üzerinde yapılıyor. Bu hesabı uzay-zaman kodlarında kodlamak için toplam 97 fiziksel kübit kullanılıyor ve sendrom sonrası eleme uygulandığında kapı hata oranları 10 kat bastırılıyor. Yani 70 sayısı bir donanım sayımından çok, kodlanmış bir hesabın genişliğini veriyor; donanım tarafındaki gerçek sayı 97.", "en": "Set the parts out one by one. The demonstration runs on a 70-qubit, depth-70 Clifford circuit doped with 468 T gates. A total of 97 physical qubits encode that computation in spacetime codes, and gate error rates are suppressed by 10 times after syndrome post-selection. The 70 therefore gives the width of an encoded computation more than a hardware count; the real number on the hardware side is 97.", "refs": ["quantum"]}]}, {"h": {"tr": "Sertifikanın fiyatı", "en": "The price of the certificate"}, "ps": [{"tr": "Sonuç için verilen rakam bir alt sınır: elde edilen durumun sadakati için yüzde 95 güvenle 0,284. Bu, sadakatin en az bu kadar olduğunu söylüyor ve ne kadar daha yüksek olduğunu açık bırakıyor. Yazarlar sertifikanın cihaza bağlı olduğunu da belirtiyor. Buna karşılık kazanılan şey somut: sertifika, mevcut sadakat vekili başarım ölçütlerine göre çok daha zayıf gürültü varsayımları gerektiriyor.", "en": "The figure given for the result is a lower bound: 0.284 at 95 percent confidence for the fidelity of the resulting state. It says the fidelity is at least that much and leaves open how much higher. The authors also state that the certificate is device dependent. What is gained in return is concrete: the certificate requires substantially weaker noise assumptions than existing fidelity proxy benchmarks.", "refs": ["quantum"]}, {"tr": "Eleme adımının bedeli de burada. Sendrom sonrası eleme, sendromları temiz çıkmayan çalıştırmaları atmak demek; 10 katlık bastırma bu atmanın karşılığında geliyor ve ön baskı bu maliyeti gizlemiyor. Karşılaştırma tarafında Phys.org'un aktardığı 2.415 mantıksal iki kübitlik işlem ve yaklaşık 15 dakikalık süre duruyor. Klasik tarafta pratik dışı süre hareketli bir eşiktir: daha iyi bir benzetim algoritması bu eşiği aşağı çeker, ve çalışma henüz hakem değerlendirmesinden geçmedi.", "en": "The cost of the discard step sits here too. Syndrome post-selection means throwing away runs whose syndromes do not come back clean; the 10-fold suppression is bought with those discards, and the preprint does not hide the cost. On the comparison side stand the 2,415 logical two-qubit operations and roughly 15 minutes that Phys.org reports. On the classical side a prohibitive runtime is a moving threshold: a better simulation algorithm pulls it down, and the work has not yet been through peer review.", "refs": ["quantum"]}]}, {"h": {"tr": "Faydalı kübite kalan yol", "en": "The distance to a useful qubit"}, "ps": [{"tr": "Bu devrenin ürettiği şey zor bir dağılımdan alınmış örneklerdir; yazarların kendi tanımıyla yöntem, hataya karşı denetlenen bir sadakat sertifikasını korurken bir kararlayıcı durumu bir sihir durumuna yükseltmenin dizgesel bir yolu. Bunun bir uygulamaya dönüşmesi için aynı kodlama ve eleme düzeninin, çıktısı kendi başına değerli olan bir hesapta ve katlanılabilir bir eleme oranıyla yürüdüğünün gösterilmesi gerekiyor. İzlenecek iki işaret var: bağımsız bir klasik benzetim denemesinin bu çalıştırmayı yakalayıp yakalamadığı, ve ön baskının aynı sayılarla hakemli yayına dönüşüp dönüşmediği.", "en": "What this circuit produces is samples from a hard distribution; in the authors' own description the method is a systematic way of promoting a stabilizer state to a magic state while keeping an error-detected fidelity certificate. For that to become an application, the same encoding and discard scheme would have to be shown running on a computation whose output is valuable in itself, at a tolerable discard rate. Two signals are worth watching: whether an independent classical simulation attempt catches this run, and whether the preprint becomes a peer-reviewed publication with the same numbers intact.", "refs": ["quantum"]}]}], "sources": [{"key": "quantum", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-quantum-task-classical-simulations.html", "title": {"tr": "IBM ve Chicago Üniversitesi, hatası denetlenebilen bir devrede 70 mantıksal kübit çalıştırdı", "en": "IBM and the University of Chicago ran 70 logical qubits in a circuit whose errors can be checked"}, "publishedDate": "2026-08-01", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.25941", "publishedDate": "2026-07-28", "title": {"tr": "Doğrulanabilir biçimde yüksek sadakatle zor devrelerden örnekleme", "en": "Sampling hard circuits with verifiably high fidelity"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-05", "title": {"tr": "Günde bir avokado neyi düşürdü?", "en": "What did an avocado a day actually lower?"}, "excerpt": {"tr": "Randomize deneme, 786 katılımcı, 26 hafta. Anlamlı tek fark toplam LDL parçacık derişiminde; parçacık boyutunda, alt sınıflarda, HDL parçacıklarında ve apolipoproteinlerde fark gözlenmedi.", "en": "A randomized trial, 786 participants, 26 weeks. The only significant difference is in total LDL particle concentration; none was observed in particle size, subclasses, HDL particles or the apolipoproteins."}, "sections": [{"h": {"tr": "Ölçülen fark", "en": "The difference that was measured"}, "ps": [{"tr": "Tasarım sağlam: çok merkezli, paralel kollu, randomize. Karın bölgesi obezitesi olan 786 katılımcı çözümlenmiş, 389'u avokado kolunda, 397'si alışılmış beslenme kolunda. Katılımcıların yüzde 74'ü kadın, ortalama yaş 51±14 yıl, ortalama beden kitle indeksi 32,9±5,4 kg/m². Süre 26 hafta. Toplam LDL parçacık derişimindeki ortalama fark -49,1 nmol/L; yüzde 95 güven aralığı -83,6 ile -14,5 ve P değeri 0,005.", "en": "The design is sound: multicenter, parallel-arm, randomized. It analysed 786 participants with abdominal obesity, 389 in the avocado group and 397 in the habitual diet group. Participants were 74 percent female, mean age 51±14 years, mean body mass index 32.9±5.4 kg/m2. The duration was 26 weeks. The mean difference in total LDL particle concentration is -49.1 nmol/L, with a 95 percent confidence interval of -83.6 to -14.5 and a P value of .005.", "refs": ["avocado"]}, {"tr": "Şimdi listenin geri kalanı. LDL parçacık boyutunda anlamlı fark gözlenmedi. LDL alt sınıflarında gözlenmedi. Trigliseritten zengin lipoprotein parçacıklarında gözlenmedi. HDL parçacıklarında ve apolipoprotein A ile B'de de gözlenmedi. Birbiriyle ilişkili bir ölçüm panelinde tek bir değerin anlamlı çıkması, o değerin müdahaleye en duyarlı ölçüt olduğunu düşündürebilir; aynı sonuç, panelin genişliğiyle birlikte okunduğunda beklenen dağılıma da uyar. Bu deneme ikisini ayırt edecek bilgiyi kendi başına sağlamıyor.", "en": "Now the rest of the list. No significant difference was observed in LDL particle size. None in LDL subclasses. None in triglyceride-rich lipoprotein particles. None in HDL particles or in apolipoproteins A or B. When one value in a panel of correlated measures comes out significant, it may suggest that value is the measure most sensitive to the intervention; read together with the width of the panel, the same outcome also fits the expected spread. This trial on its own does not supply what would separate the two.", "refs": ["avocado"]}]}, {"h": {"tr": "Ölçüt ile son nokta arasındaki mesafe", "en": "The distance between a measure and an endpoint"}, "ps": [{"tr": "Penn State Beslenme Bilimleri Bölümü kaynaklı açıklama farkı kabaca yüzde 4'lük bir kalp-damar riski azalmasına çeviriyor. Bu sayı denemede ölçülmedi; bir lipoprotein ölçütünden türetilmiş bir tahmindir. Aynı açıklamada karşılaştırma için verilen yüzde 14 ile yüzde 29 aralığı genel beslenmenin iyileştirilmesiyle ilişkilendiriliyor, yani başka bir kanıt türünden geliyor. İki sayı yan yana konduğunda aynı ölçekte görünüyor, oysa biri bir denemeden türetilmiş, öteki gözlemsel ilişkilendirmeden geliyor.", "en": "The release sourced from Penn State's Department of Nutritional Sciences converts the difference into roughly a 4 percent lower cardiovascular risk. That number was not measured in the trial; it is an estimate derived from a lipoprotein measure. The 14 percent to 29 percent range the same release gives for comparison is associated with improving the overall diet, and so comes from a different kind of evidence. Placed side by side the two figures look like the same scale, when one is derived from a trial and the other from observational association.", "refs": ["avocado"]}, {"tr": "Finansman tarafının iki parçası var ve ikisi de kayda değer. Araştırmayı Avocado Nutrition Center destekledi; makalenin çıkar çatışması bildiriminde ise beyan edilen bir durum yok. İkisini birlikte aktarmak gerekiyor: tek başına ilki bir sonucu geçersiz kılmaz, tek başına ikincisi ise ana denemenin kim tarafından desteklendiğini görünmez bırakır. Ana denemenin adı da açık: Habitual Diet and Avocado Trial, ve bu yayın onun bir yan çalışması.", "en": "The funding side has two parts and both are worth stating. The Avocado Nutrition Center supported the research, while the paper's declaration of competing interest reports none. Both belong in the account: the first alone does not invalidate a result, and the second alone leaves who supported the parent trial invisible. The parent trial is named openly too: the Habitual Diet and Avocado Trial, of which this publication is an ancillary study.", "refs": ["avocado"]}]}, {"h": {"tr": "Neyin gösterilmesi gerekir", "en": "What would have to be shown"}, "ps": [{"tr": "Bu sonucun taşıyabileceği ifade şudur: karın bölgesi obezitesi olan yetişkinlerde günde 1 avokado, 26 hafta içinde toplam LDL parçacık derişimini ölçülebilir biçimde düşürüyor. Bunun ötesine geçmek için iki şeyden biri gerekiyor: aynı farkın bağımsız bir grupta, önceden ilan edilmiş bir birincil sonlanım noktası olarak yinelenmesi, ya da olay sayısı için güçlendirilmiş bir denemenin yürütülmesi. İlki ulaşılabilir; ikincisi bu etki büyüklüğünde çok geniş bir örneklem ister.", "en": "The statement this result can carry is this: in adults with abdominal obesity, 1 avocado a day measurably lowers total LDL particle concentration over 26 weeks. Going beyond that needs one of two things: the same difference repeated in an independent group as a prespecified primary endpoint, or a trial powered for events. The first is reachable; the second, at this effect size, demands a very large sample.", "refs": ["avocado"]}]}], "sources": [{"key": "avocado", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/07/260731034155.htm", "title": {"tr": "786 kişilik randomize denemede günde bir avokado, LDL parçacık derişimini 49 nmol/L düşürdü", "en": "In a 786-person randomised trial, an avocado a day lowered LDL particle concentration by 49 nmol/L"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Journal of Clinical Lipidology", "url": "https://pubmed.ncbi.nlm.nih.gov/42364969/", "publishedDate": "2026-06-12", "title": {"tr": "Karın bölgesi obezitesi olan yetişkinlerde günde 1 avokadonun lipoprotein parçacık derişimlerine etkisi", "en": "Effect of incorporating 1 avocado per day on lipoprotein particle concentrations compared to habitual intake in adults with abdominal obesity"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-06", "title": {"tr": "Bir tanrının iki hayvanı aynı ay ışığını yansıtıyor", "en": "A god's two animals reflect the same moonlight"}, "excerpt": {"tr": "Ölçüm sade: on iki müze örneği, bir spektrometre, ay ışığına neredeyse özdeş dalga boyları. Zor olan, üç bin yıl önce birinin bu benzerliği fark edip etmediğini bilmek.", "en": "The measurement is plain: twelve museum specimens, a spectrometer, wavelengths nearly identical to moonlight. The hard part is knowing whether anyone noticed that resemblance three thousand years ago."}, "sections": [{"h": {"tr": "Ölçülebilen kısım", "en": "The part that can be measured"}, "ps": [{"tr": "Dartmouth Koleji'nden antropolog Nathaniel Dominy ile St Andrews Üniversitesi'nden primatolog Catherine Hobaiter, Amerikan Doğa Tarihi Müzesi'ndeki on iki hayvan örneği üzerinde spektrometri kullandı ve habeş maymunu kürkünden ve aynak tüyünden yansıyan ışığın dalga boylarını ölçtü. Türler kutsal habeş maymunu Papio hamadryas, kutsal aynak Threskiornis aethiopicus ve karşılaştırma için Papio anubis. Bildirilen sonuç, yansıyan dalga boylarının ay ışığınınkiyle neredeyse özdeş olması. Çalışma Time and Mind dergisinde 14 Temmuz 2026'da çevrimiçi yayımlandı.", "en": "Nathaniel Dominy, an anthropologist at Dartmouth College, and Catherine Hobaiter, a primatologist at the University of St Andrews, used spectrometry on twelve animal specimens from the American Museum of Natural History and measured the wavelengths of light reflected from baboon fur and ibis feathers. The species are the sacred baboon Papio hamadryas, the sacred ibis Threskiornis aethiopicus and the olive baboon Papio anubis. The reported result is that the reflected wavelengths are nearly identical to moonlight. The study was published online in the journal Time and Mind on 14 July 2026.", "refs": ["thoth"]}, {"tr": "Sorunun neden var olduğunu hatırlamak gerekiyor. Ay tanrısı Thoth, birbirine hiç benzemeyen iki hayvanla temsil ediliyor: bir maymun ve bir kuş. İkisini aynı tanrıya bağlayan görünür bir ortaklık uzun süre bulunamadı. Şimdi bir ölçüm aleti, üç bin yıllık bir ikonografi sorusuna aday bir yanıt sunuyor: ikisini birleştiren şey renkleri.", "en": "It is worth recalling why the question existed. The moon god Thoth is represented by two animals that resemble each other not at all: a monkey and a bird. No visible property binding both to the same god was found for a long time. Now an instrument offers a candidate answer to a three-thousand-year-old question of iconography: what unites them is their coloration.", "refs": ["thoth"]}]}, {"h": {"tr": "Ölçülemeyen kısım", "en": "The part that cannot"}, "ps": [{"tr": "Burada iki ayrı önerme var ve yalnızca biri ölçüldü. Kürk ile tüyün yansıttığı dalga boylarının ay ışığına neredeyse özdeş olması fiziksel bir olgudur. Antik Mısırlıların bu hayvanları o benzerlik yüzünden seçmiş olması ise hiçbir spektrometrenin ulaşamayacağı bir çıkarımdır. Daha sade bir okuma da elde duruyor: kutsal sayılan hayvanların listesi uzundu ve uzun bir listede iki üyenin renkçe örtüşmesi rastlantıyla da gerçekleşebilir. Yazarlar bu ihtiyatı koruyor; yorumu bağlantıyı açıklayabilecek bir öneri olarak sunuyor ve bu zihinleri anlama fırsatlarının seyrek olduğunu kabul ediyorlar.", "en": "There are two propositions here and only one was measured. That the wavelengths reflected by fur and feathers are nearly identical to moonlight is a physical fact. That the ancient Egyptians chose these animals because of that resemblance is an inference no spectrometer reaches. A plainer reading also remains available: the list of animals held sacred was long, and in a long list two members may overlap in coloration by chance. The authors keep that caution, offering the interpretation as what may explain the connection and acknowledging that opportunities to understand these minds are rare.", "refs": ["thoth"]}, {"tr": "Yine de bir şey değişiyor, ve değişen teoloji değil. Bir ikonografi sorusuna bugüne kadar metin, kabartma ve mezar resmiyle yanıt aranıyordu; şimdi listeye bir ölçüm aleti de giriyor. Çalışmayı bir antropolog ile bir primatoloğun birlikte yapması da rastlantı sayılmaz: soruyu yanıtlamak için hem hayvanın kendisini hem onu kutsayan kültürü okumak gerekiyordu. Bu, kanıt dağarcığının genişlemesidir, ve genişleyen dağarcık bir açıklamayı kanıtlanmış hale getirmiyor.", "en": "Something does change, though, and it is not the theology. Until now a question of iconography was answered with texts, reliefs and tomb paintings; now an instrument joins the list. That the study was done jointly by an anthropologist and a primatologist is no accident either: answering the question required reading both the animal itself and the culture that made it sacred. This is a widening of what counts as evidence, and a widened repertoire does not make an explanation proven.", "refs": ["thoth"]}]}, {"h": {"tr": "Kalan soru", "en": "The question that stays"}, "ps": [{"tr": "Tek bir çarpıcı örtüşme ile bir örüntü arasındaki fark sayılabilir bir şeydir. Kutsal sayılan öteki hayvan eşleşmeleri aynı yöntemle ölçülür ve benzer bir renk uyumu çıkarsa rastlantı okuması zayıflar; çıkmazsa bu eşleşme tek başına kalır, ki bu da bir yanıttır. Ölçüm bize hayvanların hangi dalga boylarını yansıttığını söyleyebiliyor. Onları seçen zihni ise hâlâ yalnızca bıraktığı resimlerden okuyoruz, ve o resimlerin sessiz kaldığı yerde ihtiyatlı kalmak merakın koşuludur.", "en": "The difference between one striking overlap and a pattern is something that can be counted. If other pairings of animals held sacred are measured the same way and a similar match in coloration appears, the chance reading weakens; if none appears, this pairing stands alone, and that is an answer too. The measurement can tell us which wavelengths the animals reflect. The mind that chose them we still read only from the pictures it left, and where those pictures fall silent, staying cautious is the condition of curiosity.", "refs": ["thoth"]}]}], "sources": [{"key": "thoth", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-moonlight-fur-feathers-egyptian-god.html", "title": {"tr": "Bir tanrının iki hayvanının kürkü ve tüyü, ay ışığına yakın dalga boyları yansıtıyor", "en": "The fur and feathers of a god's two animals reflect wavelengths close to moonlight"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-01", "title": {"tr": "Samanyolu'nun cüce uyduları, dalga karanlık maddesine bir eğri çizdi", "en": "The Milky Way's dwarf satellites have drawn a curve for wave dark matter"}, "excerpt": {"tr": "Yeni sınır yeni bir gözlemden değil, eski sayımın daha geniş bir model ailesine sorulmasından geliyor; sonuç tek bir kütle değeri yerine bir eğri, ve o eğrinin altında sınanmamış tek bir varsayım duruyor.", "en": "The new bound comes not from a new observation but from asking an old census about a wider family of models; the result is a curve rather than a single mass, and beneath that curve sits one untested assumption."}, "sections": [{"h": {"tr": "Bir sayı değil, bir eğri", "en": "A curve, not a number"}, "ps": [{"tr": "Ölçüm şu: yüzde 95 güvenle, doruk dalga sayısı 10.000 Mpc⁻¹ üzerindeki modeller için ultrahafif skaler parçacığın kütlesi 6 × 10⁻¹⁸ elektronvoltun üzerinde. Bu sayının kaynağı yeni bir teleskop değil; Dark Energy Survey ile Pan-STARRS1 gözlemlerinden derlenmiş, yıllardır elimizde olan cüce uydu galaksi sayımı. Yeni olan, bu sayımın COZMIC benzetimleri üzerinden daha geniş bir model ailesine sorulması.", "en": "The measurement reads as follows: at 95 per cent confidence, for models whose peak wavenumber exceeds 10,000 Mpc⁻¹, the mass of the ultralight scalar particle lies above 6 × 10⁻¹⁸ electronvolts. That number does not come from a new telescope. It comes from the dwarf satellite galaxy census compiled from Dark Energy Survey and Pan-STARRS1 observations, which we have had for years. What is new is that the census has been put, through COZMIC simulations, to a wider family of models.", "refs": ["udm"]}, {"tr": "Sınırın biçimi, içeriğinin kendisi. Tek bir kütle eşiği yerine iki büyüklük arasındaki bağıntı veriliyor: doruk dalga sayısı küçüldükçe eşik karesel olarak düşüyor. Bir alt sınırın sayı olmaktan çıkıp yüzeye dönüşmesi, ölçümün hangi soruya cevap verdiğini de değiştirir; artık tek bir parçacık adayı değil, bir aile eleniyor.", "en": "The shape of the bound is its content. Instead of a single mass threshold, a relation between two quantities is given: as the peak wavenumber falls, the threshold drops quadratically. When a lower bound stops being a number and becomes a surface, the question the measurement answers changes with it; what is being ruled out is now a family, not a single particle candidate.", "refs": ["udm"]}]}, {"h": {"tr": "Soğuk bulanıklıkla sıcak dalga arasındaki fark nereden geliyor", "en": "Where the difference between cold fuzziness and warm waves comes from"}, "ps": [{"tr": "İki senaryonun ayrımı başlangıç koşulunda. Soğuk bulanık karanlık maddede alan başlangıçta türdeştir ve yapıyı bastıran şey, gökbilim ölçeğinde büyük olan Jeans boyudur. Sıcak dalga karanlık maddesinde ise alan başlangıçta oldukça türdeş değildir; bu hem serbest akış bastırması hem de Poisson kaynaklı yoğunluk dalgalanmaları üretir. Yazarların yazdığı gibi, serbest akış yapıyı daha da büyük ölçeklerde bastırabiliyor.", "en": "The two scenarios part company at their initial conditions. In cold fuzzy dark matter the field starts out homogeneous, and what suppresses structure is the Jeans length, which is large on astronomical scales. In warm wave dark matter the initial field is highly inhomogeneous, which produces both free-streaming suppression and Poisson-driven density fluctuations. As the authors put it, free streaming can suppress structure on still larger scales.", "refs": ["udm"]}, {"tr": "Küçük uyduların sayısı bu ayrımı görebilir, çünkü her iki mekanizma da küçük ölçekli yapının kurulmasını geciktirir ve Samanyolu çevresindeki en sönük halolar bunun ilk kurbanıdır. Ama aynı eksik uyduları başka bir şey de üretebilir: sönük galaksilerin halolara nasıl yerleştiği. Sayım bize halo sayısını değil, ışık veren halo sayısını verir; aradaki dönüşüm gözlem değil, modeldir.", "en": "The abundance of small satellites can see that distinction, because both mechanisms delay the assembly of small-scale structure, and the faintest haloes around the Milky Way are the first casualties. Something else can produce the same missing satellites, however: how faint galaxies populate haloes at all. The census counts the haloes that shine, and the conversion from those to the total number of haloes is a model rather than an observation.", "refs": ["udm"]}]}, {"h": {"tr": "Sınırı taşıyan varsayım", "en": "The assumption carrying the bound"}, "ps": [{"tr": "Yazarlar bu noktayı kendileri işaretliyor: incelenen sıcak ultrahafif modellerde galaksi-halo bağıntısının soğuk karanlık maddedekiyle aynı kaldığı varsayılıyor ve bunun izleyen çalışmalar için doğal bir alan olduğu söyleniyor. Sınırın gücü de kırılganlığı da orada. Eğer bu modellerde küçük halolarda yıldız oluşumu farklı işliyorsa, aynı uydu sayımı aynı eğriyi vermez. Eğrinin sınanacağı yer yeni bir parçacık değil, sönük galaksilerin nasıl aydınlandığına dair bağımsız bir ölçüm olacak.", "en": "The authors flag this themselves: in the warm ultralight models they consider, the galaxy–halo connection is assumed to be unchanged from cold dark matter, and they describe this as a natural area for follow-up work. That is where the bound draws both its strength and its fragility. If star formation in small haloes works differently in these models, the same satellite census will not yield the same curve. The place where the curve gets tested will not be a new particle, but an independent measurement of how faint galaxies come to shine.", "refs": ["udm"]}]}], "sources": [{"key": "udm", "kind": "news", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae8b9f", "title": {"tr": "Samanyolu uydularının sayımı, ultrahafif karanlık maddeye yeni bir alt sınır koydu", "en": "A census of Milky Way satellites sets a new lower bound on ultralight dark matter"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "sci-02", "title": {"tr": "Ondaki on kat kimin için ölçüldü?", "en": "Who was the tenfold measured for?"}, "excerpt": {"tr": "Çıngıraklı yılanın kendi kanındaki baskılayıcılar, laboratuvarda mevcut panzehirden on kat güçlü çıktı. Bu sayının hangi toksin ailesinde, hangi kapta ve hangi payda üzerinde ölçüldüğü, hastaya ne kadar yaklaştığını belirliyor.", "en": "Inhibitors from the rattlesnake's own blood proved ten times more potent than current antivenom in the laboratory. Which toxin family, which vessel and which denominator that number was measured on decides how close it gets to a patient."}, "sections": [{"h": {"tr": "Kap: hücre dışı düzenek", "en": "The vessel: an in vitro assay"}, "ps": [{"tr": "Sean B. Carroll'ın ekibi, çıngıraklı yılan serumundaki Fetuin-A proteininden türeyen dört korunmuş metalloproteinaz baskılayıcısını inceledi. Belirli birleşimlerinin birbirlerinin etkinliğini tamamladığı, çıngıraklı yılan zehrinin öldürücülüğünü tümüyle etkisiz kılmaya yettiği ve ticari panzehire göre yaklaşık on kat güç gösterdiği bildiriliyor. Birleşimler birden çok engerek türünün zehrine karşı geniş koruma sağladı. Ölçüm hücre dışı düzenekte yapıldı; insanda etkililik ya da güvenlilik gösterilmedi.", "en": "Sean B. Carroll's team examined four conserved metalloproteinase inhibitors derived from the protein Fetuin-A in rattlesnake serum. Specific combinations are reported to complement one another's activities, to suffice to fully neutralise rattlesnake venom lethality, and to show approximately ten times greater potency than commercial antivenom. The combinations gave broad protection against venoms from several viper species. The measurement was made in vitro; efficacy and safety in humans were not demonstrated.", "refs": ["anti"]}, {"tr": "Bu güç ölçüsü, hasta sonucuna giden yolun ilk adımıdır. Bir hastanın kaybettiği doku, zehir kana karıştıktan sonra geçen dakikalarda belirlenir; laboratuvar kabında ise zehir ile baskılayıcı çoğu zaman aynı anda buluşur. Yayımlanan malzeme bağlanmanın gücünü gösteriyor; zamanlamayı bu aşamadaki bir çalışma zaten ölçmeyi üstlenmez.", "en": "That potency figure is the first step on the road to a patient outcome. The tissue a patient loses is decided in the minutes after venom enters the blood; in a laboratory vessel, venom and inhibitor usually meet at the same moment. The published material shows the strength of the binding; timing is something a study at this stage does not undertake to measure.", "refs": ["anti"]}]}, {"h": {"tr": "Payda: bir toksin ailesi", "en": "The denominator: one toxin family"}, "ps": [{"tr": "Çalışma yalnızca metalloproteinaz ailesindeki toksinleri hedefliyor. Engerek zehri tek bir molekül yerine doku yıkımından pıhtılaşma bozukluğuna kadar farklı işler gören bir karışımdır ve diğer aileler için benzer bir geliştirme süreci gerekiyor. On kat, zehrin bir kesitine karşı ölçülmüş bir sayı.", "en": "The work targets only toxins in the metalloproteinase family. Viper venom is a mixture doing different jobs, from tissue destruction to disrupted clotting, and other families would need comparable development. The tenfold figure was measured against one slice of the venom.", "refs": ["anti"]}, {"tr": "Yine de bu işin asıl ilgi çekici yanı baskılayıcının kaynağında duruyor. Yeniden birleşim yoluyla üretilen bir baskılayıcı, hayvan bağışıklamasına dayanan üretim zincirini ortadan kaldırır; ürünün tutarlılığı ve arzı, güç ölçüsünden daha kalıcı bir kazanç olabilir. Buna karşılık aynı sonucun daha sıradan bir açıklaması da var: karşılaştırma ölçütü olan ticari panzehir, bu belirli toksin ailesi için zaten görece zayıf olabilir ve on kat, eski ürünün bu dar kesitteki eksikliğini ölçüyor olabilir.", "en": "Even so, what makes this work most interesting sits in the source of the inhibitor. An inhibitor produced recombinantly removes a manufacturing chain that depends on immunising animals; consistency of product and reliability of supply may be a more durable gain than the potency figure. Against that, there is a more prosaic account of the same result: the commercial antivenom used as the comparator may already be relatively weak against this particular toxin family, so the tenfold may be measuring the old product's shortfall on a narrow slice.", "refs": ["anti"]}]}, {"h": {"tr": "Bir sonraki ölçüm ne olmalı", "en": "What the next measurement should be"}, "ps": [{"tr": "Bu aşamada dürüst cümle şu: kapta çalışıyor. Bir sonraki adım, ilan edilmiş bir dozla ve önceden belirlenmiş bir sağkalım sonlanım noktasıyla yürütülen hayvan çalışmalarıdır; ardından gücün yanı sıra bağışıklık tepkisinin ve vücutta kalma süresinin de ölçülmesi gerekir. Çıngıraklı yılan ısırığıyla karşılaşan kişi çoğunlukla kırsalda ve hastaneye uzaktadır; onun için önemli olan sayı, ısırıktan sonraki ilk saatte verilebilen dozun ne yaptığıdır.", "en": "The honest sentence at this stage is that it works in the vessel. The next step is animal work with a declared dose and a prespecified survival endpoint, after which immune response and residence time in the body have to be measured alongside potency. The person who meets a rattlesnake bite is usually rural and far from a hospital; the number that matters for them is what a dose given in the first hour after the bite actually does.", "refs": ["anti"]}]}], "sources": [{"key": "anti", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-combined-rattlesnake-proteins-potent-current.html", "title": {"tr": "Çıngıraklı yılanın kendi proteinleri laboratuvarda mevcut panzehirden on kat güçlü çıktı", "en": "A rattlesnake's own proteins proved ten times more potent than current antivenom in the laboratory"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Proceedings of the National Academy of Sciences", "url": "https://doi.org/10.1073/pnas.2612168123", "publishedDate": "2026-07-29", "title": {"tr": "Doğanın panzehiri: korunmuş çıngıraklı yılan serum metalloproteinaz baskılayıcılarının birleşimleri engerek zehirlerinin öldürücü etkisini engelliyor", "en": "Nature's antivenom: Combinations of conserved rattlesnake serum metalloproteinase inhibitors block the lethal action of viper venoms"}}}], "date": "2026-07-31"}, {"writer": "sci-03", "title": {"tr": "El Niño'nun ikinci ibresi tuzdan yapılıyor", "en": "El Niño is getting a second needle made of salt"}, "excerpt": {"tr": "Deniz yüzeyi sıcaklığı El Niño'nun tanımlayıcı ölçüsü. SMOS'un izlediği tuzluluk ise aynı sistemi su döngüsü üzerinden okuyor; değeri, daha erken konuşup konuşmadığı sınandığında belli olacak.", "en": "Sea-surface temperature is El Niño's defining measure. Salinity tracked by SMOS reads the same system through the water cycle; its value will be known when we test whether it speaks earlier."}, "sections": [{"h": {"tr": "Batıdaki havuz doğuya yürürken", "en": "As the western pool moves east"}, "ps": [{"tr": "Normal bir yılda alize rüzgârları, batı Pasifik'teki düşük tuzluluklu yüzey suyu havuzunu batıda tutar. ESA'nın SMOS ve NASA'nın SMAP uydularından derlediği görüntüde, gelişmekte olan 2026 El Niño'su bu düzeni gevşetiyor: havuzun doğu kenarı, derin konveksiyon ve yoğun yağış kuşağıyla birlikte doğuya kayıyor. Bu bir tuz haritasından fazlası; okyanusa nerede tatlı su girdiğini ve su kütlelerinin nereye taşındığını gösteren bir iz.", "en": "In a normal year, the trade winds hold the western Pacific's low-salinity surface-water pool in the west. In the picture assembled from ESA's SMOS and NASA's SMAP satellites, the emerging 2026 El Niño loosens that arrangement: the pool's eastern edge moves east with the belt of deep convection and heavy rain. This is more than a salt map; it traces where freshwater enters the ocean and where water masses move.", "refs": ["salinity"]}, {"tr": "Yağışın arttığı bölgeler tatlılaşırken buharlaşmanın ağır bastığı bölgeler daha tuzlu hale geliyor. Tuzluluk, sıcaklıkla birlikte deniz suyunun yoğunluğunu belirliyor; yoğunluk da ısıyı taşıyan akıntıların bir parçası. Böylece aynı El Niño hem ısı bütçesinde hem su bütçesinde iki ayrı fiziksel iz bırakıyor.", "en": "Regions receiving more rain become fresher while those dominated by evaporation become saltier. Salinity, together with temperature, sets seawater density, and density is part of the circulation that carries heat. The same El Niño therefore leaves two physical traces, one in the heat budget and another in the water budget.", "refs": ["salinity"]}]}, {"h": {"tr": "İkinci ölçü, birincinin yerine geçmiyor", "en": "The second measure does not replace the first"}, "ps": [{"tr": "Deniz yüzeyi sıcaklığı El Niño'nun tanımlayıcı özelliği olmaya devam ediyor. Tuzluluğun önerdiği kazanç başka: yağışa, buharlaşmaya ve yüzey akıntılarına hızlı yanıt veren tamamlayıcı bir değişken eklemek. Biri okyanusun ne kadar ısı taşıdığını, öbürü tatlı suyun nerede girip çıktığını yaklaşık olarak anlatıyor; ikisini birlikte okumak, bağlı okyanus-atmosfer sisteminin tek göstergede kaybolan kısmını görünür kılıyor.", "en": "Sea-surface temperature remains El Niño's defining characteristic. The proposed gain from salinity is different: add a companion variable that responds quickly to rain, evaporation and surface currents. One describes how much heat the ocean carries, the other approximates where freshwater enters and leaves; reading both exposes part of the coupled ocean-atmosphere system that one indicator can hide.", "refs": ["salinity"]}, {"tr": "Buradaki sınır, güzel bir eşzamanlı görüntünün erken uyarı olmadığıdır. 2026 örüntüsü gelişmekte olan olayı izliyor; tuzluluğun sıcaklıktan önce düzenli biçimde değiştiğini henüz göstermiyor. Yağış ve akıntıların olaydan olaya değişmesi de sinyali öne çekmek yerine gürültüye çevirebilir.", "en": "The boundary is that an elegant simultaneous picture is not an early warning. The 2026 pattern follows the developing event; it does not yet show that salinity moves consistently before temperature. Rainfall and currents may also vary from event to event, turning the proposed lead into noise.", "refs": ["salinity"]}]}, {"h": {"tr": "Erken sözü bir indeks sınayacak", "en": "An index will test the claim of earliness"}, "ps": [{"tr": "Araştırmacılar şimdi ENSO'ya özgü bir deniz yüzeyi tuzluluğu indeksi geliştiriyor. Doğru sınama, aynı geçmiş olaylarda sıcaklık indeksinin yanına tuzluluğu ekleyip öngörü süresi ile hata payının gerçekten iyileşip iyileşmediğine bakmak; ardından aynı hesabı ileriye dönük tahminlerde kilitlemek. Tuzdan yapılmış ikinci ibre ancak birinci ibreden önce ve tutarlı biçimde hareket ederse erken uyarı sayılacak.", "en": "Researchers are now developing an ENSO-specific sea-surface-salinity index. The proper test is to add it beside the temperature index across the same past events, ask whether lead time and error actually improve, and then lock that calculation for prospective forecasts. A second needle made of salt becomes an early warning only if it moves before the first one, consistently. That is a climate measurement question, not a replacement for the temperature series.", "refs": ["salinity"]}]}], "sources": [{"key": "salinity", "kind": "news", "name": "European Space Agency", "url": "https://www.esa.int/Applications/Observing_the_Earth/FutureEO/SMOS/SMOS_salinity_could_offer_early_indicator_of_El_Nino", "title": {"tr": "SMOS tuzluluk örüntüleri El Niño için daha erken bir sinyal sunabilir", "en": "SMOS salinity patterns could offer an earlier signal of El Niño"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "sci-04", "title": {"tr": "Ölçümden bir parça çıkarıldı: karşı taraftaki ayna", "en": "One component was removed from the measurement: the mirror at the far end"}, "excerpt": {"tr": "Uzaktan kimyasal saptama düzeneklerinin iki ucu vardır; biri lazer, öbürü hedefe önceden kurulan yansıtıcı. Bu çalışma ikincisini çıkarıyor ve yerine oradaki her neyse onu koyuyor. Böylece trafik levhası ölçüm aletinin bir parçası oluyor.", "en": "Standoff chemical detection has two ends: the laser at one, and a reflector installed in advance at the other. This work removes the second and puts whatever happens to be standing there in its place. A traffic sign thereby becomes part of the instrument."}, "sections": [{"h": {"tr": "Çıkarılan bileşen", "en": "The component that came out"}, "ps": [{"tr": "Tim Johnson'ın Pasifik Kuzeybatı Ulusal Laboratuvarı'ndaki ekibi, 7500-600 cm⁻¹ (1,33-16,7 mikrometre) aralığında çalışan kuantum kaskad lazerli bir izge ölçerle, alüminyum levhadan mermere, araç panelinden bitki örtüsüne kadar 60'a yakın yaygın malzemenin yansıtıcılığını ölçtü. On metrelik sorgulama uzunluğuna sahip denetimli laboratuvar aerosol odasında dietil sebakat ve kalsiyum karbonat saptanıp ayırt edildi; düzenek on bir metreye kadar mesafede çalıştı.", "en": "Tim Johnson's team at Pacific Northwest National Laboratory measured the reflectance of close to 60 common materials, from aluminium panels to marble, car panels and vegetation, using a quantum-cascade laser spectrometer operating across 7500-600 cm⁻¹ (1.33-16.7 micrometres). In a controlled laboratory aerosol chamber with a ten-metre interrogation length, diethyl sebacate and calcium carbonate were detected and told apart; the system worked at distances of up to eleven metres.", "refs": ["aero"]}, {"tr": "Katkının nerede olduğunu görmek için düzeneği parçalarına ayırmak yeterli. Klasik açık yol izge ölçümünde ışık, hedefin karşısına kurulan bir yansıtıcıdan geri döner; bu, iki uçlu bir kurulum demektir ve ölçüm yapılacak her yere önceden gidilmesini gerektirir. Ekip bu bileşeni çıkarıp yerine oradaki yüzeyi koyuyor. Kazanç tek uçlu bir ölçüm; bedeli, dönen ışığın miktarını artık denetlenmeyen bir yüzeyin dağınık yansıtıcılığının belirlemesi. Yüzey, aletin bir parçası haline geliyor.", "en": "To see where the contribution lies, it is enough to take the setup apart. In classical open-path spectroscopy the light returns from a reflector installed opposite the target, which makes it a two-ended arrangement and requires going in advance to every place a measurement will be taken. The team removes that component and puts the surface already present in its place. The gain is a one-ended measurement; the price is that the amount of light returned is now set by the diffuse reflectance of a surface nobody controls. The surface becomes part of the instrument.", "refs": ["aero"]}]}, {"h": {"tr": "On bir metre bir tavan değil, bir bütçe kalemi", "en": "Eleven metres is a budget line, not a ceiling"}, "ps": [{"tr": "Bildirilen on bir metre bir fizik sınırı gibi okunmamalı; laboratuvar geometrisinin verdiği bir sayı. Menzili büyütmek dönen foton sayısıyla ödenir ve o sayı hem mesafenin karesiyle hem de yüzeyin dağınık yansıtıcılığıyla azalır. Ekibin 60'a yakın malzemeyi tek tek ölçmesinin nedeni de bu: kazancın ne kadarının gerçekte var olduğu, hedefin arkasında hangi yüzeyin bulunduğuna bağlı. Boyalı bir trafik levhasıyla ıslak bir ağaç gövdesi aynı aleti farklı iki alete çevirir.", "en": "The reported eleven metres should not be read as a limit of physics; it is a number the laboratory geometry gave. Extending the range is paid for in returned photons, and that count falls both with the square of the distance and with the diffuse reflectance of the surface. That is why the team measured close to 60 materials one by one: how much of the gain actually exists depends on which surface stands behind the target. A painted traffic sign and a wet tree trunk turn the same instrument into two different instruments.", "refs": ["aero"]}, {"tr": "Yazarların saydığı asıl güçlük yorum tarafında duruyor. Daha geniş parçacık boyu dağılımları ve karmaşık kimyasal karışımlar izgeleri güçleştiriyor ve ekip bu durumların çözümlenmesinde yapay öğrenme yöntemlerine gerek duyulabileceğini belirtiyor. Bu, zor işi optikten çıkarım aşamasına taşımak demektir; problemin yeri değişir, büyüklüğü olduğu gibi kalır. Aynı güçlüğün daha sıradan bir açıklaması da var: karmaşık izgeler yüzeyden çok aerosolün kendi kimyasal karmaşıklığından doğuyor olabilir; o durumda sıradan yüzey kullanmanın bedeli sanıldığından küçüktür.", "en": "The main difficulty the authors count sits on the interpretive side. Broader particle size distributions and complex chemical mixtures make the spectra harder to read, and the team states that machine-learning methods may be needed to analyse those cases. That means moving the hard part out of the optics and into the inference stage; the location of the problem changes while its size stays as it was. There is a more prosaic account of the same difficulty: crowded spectra may arise more from the aerosol's own chemical complexity than from the surface, in which case the price of using ordinary surfaces is smaller than it looks.", "refs": ["aero"]}]}, {"h": {"tr": "Kurulan ve kurulmayan", "en": "What was built and what was not"}, "ps": [{"tr": "Kurulan şey nettir: yansıtıcı gerektirmeyen tek uçlu bir izge ölçüm yolu, geniş bir malzeme yansıtıcılık kataloğu ve denetimli bir odada iki maddenin ayırt edilmesi. Kurulmayan da o kadar nettir: sahada, denetlenmeyen bir arka planla ve gerçek bir aerosol bulutuyla yapılmış bir ölçüm ve bu koşullar altında ilan edilmiş bir saptama eşiği. Bir aygıtın hazır sayılması için üçüncüsü gerekir; ilk ikisi yolu açar, üçüncüsü teslim eder.", "en": "What was built is clear: a one-ended spectroscopic path that needs no reflector, a broad catalogue of material reflectances, and the discrimination of two substances in a controlled chamber. What was not built is just as clear: a measurement made in the field, against an uncontrolled background and a real aerosol plume, and a declared detection threshold under those conditions. Calling a device ready requires the third; the first two open the path, the third delivers it.", "refs": ["aero"]}]}], "sources": [{"key": "aero", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-spectroscopy-aerosols-traffic-tree-trunks.html", "title": {"tr": "Trafik levhasından yansıyan kızılötesi ışık, havadaki kimyasalı uzaktan tanıdı", "en": "Infrared light bounced off a traffic sign identified airborne chemicals at a distance"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Applied Optics", "url": "https://opg.optica.org/ao/abstract.cfm?doi=10.1364/AO.604722", "publishedDate": "2026-07-29", "title": {"tr": "Yaygın yüzeylerden kızılötesi lazer yansımasıyla aerosol ve buhar saptama: parlayan her şey altın değildir", "en": "Aerosol and vapor detection via infrared laser reflectance from common surfaces: all that shimmers is not gold"}}}], "date": "2026-07-31"}, {"writer": "sci-05", "title": {"tr": "Bir kuş halkadan kaybolduğunda ölüm tek ihtimal değil", "en": "When a banded bird disappears, death is not the only possibility"}, "excerpt": {"tr": "Yarım milyondan fazla halkalama gözlemi dişiler için daha düşük görünür sağkalım veriyor. 'Görünür' sözcüğü küçük değil: ölüm ile çalışma alanından kalıcı ayrılışı aynı paydada tutuyor.", "en": "More than half a million banding records give females lower apparent survival. The word 'apparent' is not small: it keeps death and permanent departure from the study area in one denominator."}, "sections": [{"h": {"tr": "Yarım milyon gözlemde aynı yön", "en": "The same direction across half a million records"}, "ps": [{"tr": "Joanna Wu ve arkadaşları, ABD ile Kanada'da 1992-2018 arasında toplanan 563.414 yakala-işaretle-yeniden yakala gözlemini, 17 familyadan 92 tür için çözümledi. Dişilerin görünür sağkalımı türlerin 82'sinde erkeklerinkinden düşük çıktı; fark 35 türde istatistiksel olarak anlamlıydı. Erginler için ortalama oran dişilerde 0,479, erkeklerde 0,538; aradaki fark yüzde 12,4.", "en": "Joanna Wu and colleagues analysed 563,414 capture-mark-recapture records collected in the United States and Canada from 1992 to 2018 across 92 species in 17 families. Female apparent survival was below the male estimate in 82 species, with a statistically significant difference in 35. Mean adult rates were 0.479 for females and 0.538 for males, a 12.4 per cent gap.", "refs": ["birds"]}, {"tr": "Yazarlar bu oranları erginliğe ulaştıktan sonra ortalama 1,36 yıl ve 1,61 yıl olarak ifade ediyor. Geniş örnek, tek bir türdeki rastlantıyı azaltıyor; geçici bireyleri ayıran Cormack-Jolly-Seber modeli de ilk yakalamadan sonra bir daha görülmeyen kuşların yarattığı bilinen bir yanlılığı ele alıyor. Yine de ölçümün adı sonucu sınırlıyor: bu, sağkalım değil görünür sağkalım.", "en": "The authors express those rates as average post-adulthood lifespans of 1.36 and 1.61 years. The large sample reduces the chance of a one-species accident, while a transient Cormack-Jolly-Seber model addresses a known bias from birds never seen after first capture. Yet the name of the measure still bounds the result: it is apparent survival, not survival alone.", "refs": ["birds"]}]}, {"h": {"tr": "Kayıp kuş iki farklı yere gidebilir", "en": "A missing bird can go to two different places"}, "ps": [{"tr": "Bir kuş sonraki yıl aynı ağlarda yakalanmadığında iki temel açıklama vardır: ölmüştür ya da örneklenen alanı kalıcı olarak terk etmiştir. Standart yakalama-yeniden yakalama verisi bu iki yolu tek başına ayıramaz. Dişiler daha uzağa dağılıyorsa, düşük görünen oranın bir bölümü ölümden değil alan sadakatindeki farktan doğabilir. Bu ayrım, başlıktaki yaşam süresi sözünü doğrudan nedensel bir sonuca çevirmeyi engelliyor.", "en": "When a bird is not caught in the same nets the next year, two basic explanations remain: it died, or it permanently left the sampled area. Standard capture-recapture data cannot separate those paths on their own. If females disperse farther, part of the lower-looking rate may arise from site fidelity rather than death. That distinction prevents turning the lifespan language in the headline into a direct causal result.", "refs": ["birds"]}, {"tr": "Çalışmadaki örüntüler iki açıklamayı da açık bırakıyor. Cinsiyet farkı uzun mesafe göçmenlerinde daha büyük; bu gerçek hareket ve enerji maliyetleriyle uyumlu. Dağılmaya uygun kanat biçimi taşıyan türlerde farkın küçülmesi ise alan değiştirme olasılığının ölçüme karışabileceğini hatırlatıyor. Bağıntılar mekanizma öneriyor, hangisinin payını ölçmüyor.", "en": "Patterns in the study leave both explanations open. The sex gap is larger in long-distance migrants, consistent with real movement and energy costs. Its smaller size in species with wing shapes suited to dispersal also warns that movement among sites may enter the measure. The correlations propose mechanisms; they do not apportion them.", "refs": ["birds"]}]}, {"h": {"tr": "Paydayı ayıracak bir sonraki veri", "en": "The next data must split the denominator"}, "ps": [{"tr": "Sonucu ilerletecek tekrar, daha çok halka saymaktan ibaret değil. Aynı türleri birden fazla alanda yeniden yakalayan ya da bireysel vericilerle izleyen bir tasarım, kalıcı göç olasılığını ölümden ayrı tahmin edebilir. O zaman 82 türdeki ortak yönün ne kadarının gerçek sağkalım, ne kadarının mekân değiştirme olduğu görülebilir. Bugünkü çalışma güçlü bir örüntü kuruyor; henüz iki çıkışı olan kapının hangi tarafından geçildiğini söylemiyor.", "en": "The replication that advances this result is not simply another count of bands. A design that recaptures the same species across multiple sites or tracks individuals can estimate permanent emigration separately from death. Then we can see how much of the shared direction across 82 species is true survival and how much is movement. Today's study establishes a strong pattern; it does not yet say which side of a two-exit door the birds used.", "refs": ["birds"]}]}], "sources": [{"key": "birds", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-female-birds-shorter-lifespans-male.html", "title": {"tr": "Kuzey Amerika ötücü kuşlarında dişilerin görünür sağkalımı erkeklerinkinin altında", "en": "Female North American songbirds show lower apparent survival than males"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Proceedings of the Royal Society B", "url": "https://doi.org/10.1098/rspb.2025.3227", "publishedDate": "2026-07-29", "title": {"tr": "Kuzey Amerika ötücü kuşlarında dişilerin görünür sağkalımı erkeklerinkinden düşük", "en": "Female North American passerine birds have lower apparent survival than males"}}}], "date": "2026-07-31"}, {"writer": "sci-06", "title": {"tr": "Tanıklıkla anlatılan bir tarih, artık bir molekülle de anlatılıyor", "en": "A history told by testimony is now also told by a molecule"}, "excerpt": {"tr": "Çiçek hastalığının Amerika'ya sömürgecilikle geldiğini zaten biliyorduk. Şili'deki iki mezardan çıkan virüs genomu bu sonucu yerinde bırakıyor ve onu taşıyan kanıt türünü değiştiriyor; bu da bundan sonra hangi tartışmaların çözülebileceğini belirliyor.", "en": "We already knew that smallpox reached the Americas with colonisation. The viral genome recovered from two graves in Chile leaves that conclusion in place and changes the kind of evidence carrying it, which decides which arguments can be settled from here on."}, "sections": [{"h": {"tr": "Bilinen bir sonucun yeni bir kanıt türü", "en": "A new kind of evidence for a known conclusion"}, "ps": [{"tr": "Kuzey Şili'deki Camarones 9 kazı alanında iki bireyin kalıntılarından variola virüsü DNA'sı çıkarıldı; ikisi de 1492 ile 1631 arasında yaşamış olarak tarihlendi. Genomlar bugün soyu tükenmiş, ortaçağ Avrupa suşlarından sonra ayrılmış bir kola ait ve birbirlerine neredeyse tıpatıp benziyorlar; bu benzerlik iki kişinin aynı salgın sırasında hastalandığına işaret ediyor.", "en": "Variola virus DNA has been extracted from the remains of two individuals at the Camarones 9 site in northern Chile, both dated to between 1492 and 1631. The genomes belong to a now-extinct branch that split off after medieval European strains, and they are near-identical to one another, a resemblance pointing to two people falling ill in the same outbreak.", "refs": ["pox"]}, {"tr": "Buradaki yenilik sonucun kendisinde değil. Sömürgeciliğin hastalığı taşıdığı, yüzyıllardır kroniklerden, vaftiz defterlerinden ve nüfus tahminlerinden çıkarılıyordu; ekip bulgularını bu taşınmanın ilk moleküler doğrulaması olarak sunuyor. Bir iddianın tanıklıktan maddi kanıta geçmesi, doğruluk derecesini artırmaktan çok tartışmanın zeminini değiştirir: yazılı kaynağın güvenilirliği üzerine kurulmuş itirazlar artık aynı yere düşmez.", "en": "The novelty here lies elsewhere than in the conclusion itself. That colonisation carried the disease has been inferred for centuries from chronicles, baptismal registers and population estimates; the team present
