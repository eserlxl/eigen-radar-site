": "Wan uzun vadeli etkilere bakmadıklarını söylüyor. Bir kaldıracı tartılabilir kılacak çalışma da tam olarak budur: art arda gelen birkaç ENSO çevriminde müdahalenin toplam bilançosu. Şu an elimizde iki tarihsel olay üzerinde ölçülmüş bir kazanç, bir zayıflama ve bir kayma var; bunların üst üste bindiğinde nasıl davrandığı açık kalıyor. İzlenecek işaret, çok çevrimli bir benzetimin bölgesel sıcaklık ve yağış farklarıyla birlikte yayımlanması.", "en": "Wan says the team did not look at long-term impacts. The study that would make such a lever weighable is exactly that: the intervention's full balance across several successive ENSO cycles. What exists now is a gain, a weakening and a shift measured over two historical events, and how they behave when stacked remains open. The signal to watch is a multi-cycle simulation published together with regional temperature and precipitation differences.", "refs": ["cloud-brightening"]}]}], "sources": [{"key": "cloud-brightening", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-pacific-cloud-brightening-weaken-el.html", "title": {"tr": "Model çalışması, ekvator Pasifiği'nde bulut parlatmanın El Niño'yu zayıflattığını, Avrupa ile Asya'yı ısıttığını buluyor", "en": "A modelling study finds that brightening clouds over the equatorial Pacific weakens El Niño and warms Europe and Asia"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Science Advances", "url": "https://pubmed.ncbi.nlm.nih.gov/42418575/", "publishedDate": "2026-07-10", "title": {"tr": "Hedeflenmiş deniz bulutu parlatma, ardından gelen El Niño'yu zayıflatıyor", "en": "Targeted marine cloud brightening weakens subsequent El Nino"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-04", "title": {"tr": "Yetmiş mantıksal kübitin altında 97 fiziksel kübit ve bir eleme adımı var", "en": "Under seventy logical qubits sit 97 physical qubits and a discard step"}, "excerpt": {"tr": "Ön baskının asıl katkısı kübit sayısında değil, sonucun ne kadar doğru olduğunu cihazın kendi sendrom ölçümlerinden çıkarabilmesinde. Sertifikanın bedeli elenen çalıştırmalarla ödeniyor.", "en": "The preprint's real contribution lies in deriving how correct the result is from the device's own syndrome measurements, rather than in the qubit count. The certificate is paid for in discarded runs."}, "sections": [{"h": {"tr": "Devreyi neden yeniden tasarladılar", "en": "Why they redesigned the circuit"}, "ps": [{"tr": "28 Temmuz 2026'da arXiv'e gönderilen ön baskı, örnekleme temelli önerilerin karmaşıklık kuramına dayanan zorluğunu iki yetenekle birleştirmeyi hedefliyor: donanım hatalarını bastırmak ve kuantum hesabının kendisini doğrulamak. Yazarların çözümü yapılandırılmış devreler; bu devreler kanıtlanabilir zorluk güvencelerinin yanında bir kuantum koduna gömülmeye elverişli. Böylece yüksek devre derinliklerinde yüksek sadakate ulaşmak ile deneysel sadakati kod sendromlarının ölçümüyle belgelemek aynı anda mümkün oluyor.", "en": "The preprint submitted to arXiv on 28 July 2026 sets out to combine the complexity-theoretic hardness of sampling-based proposals with two capabilities: suppressing hardware errors and verifying the quantum computation itself. The authors' answer is structured circuits, which alongside provable hardness guarantees admit an encoding in a quantum code. That makes it possible at once to reach high fidelities at high circuit depths and to certify an experimental fidelity by measuring code syndromes.", "refs": ["quantum"]}, {"tr": "Parçaları tek tek koyalım. Gösterim, 468 T kapısıyla katkılanmış 70 kübitlik, 70 derinliğindeki bir Clifford devresi üzerinde yapılıyor. Bu hesabı uzay-zaman kodlarında kodlamak için toplam 97 fiziksel kübit kullanılıyor ve sendrom sonrası eleme uygulandığında kapı hata oranları 10 kat bastırılıyor. Yani 70 sayısı bir donanım sayımından çok, kodlanmış bir hesabın genişliğini veriyor; donanım tarafındaki gerçek sayı 97.", "en": "Set the parts out one by one. The demonstration runs on a 70-qubit, depth-70 Clifford circuit doped with 468 T gates. A total of 97 physical qubits encode that computation in spacetime codes, and gate error rates are suppressed by 10 times after syndrome post-selection. The 70 therefore gives the width of an encoded computation more than a hardware count; the real number on the hardware side is 97.", "refs": ["quantum"]}]}, {"h": {"tr": "Sertifikanın fiyatı", "en": "The price of the certificate"}, "ps": [{"tr": "Sonuç için verilen rakam bir alt sınır: elde edilen durumun sadakati için yüzde 95 güvenle 0,284. Bu, sadakatin en az bu kadar olduğunu söylüyor ve ne kadar daha yüksek olduğunu açık bırakıyor. Yazarlar sertifikanın cihaza bağlı olduğunu da belirtiyor. Buna karşılık kazanılan şey somut: sertifika, mevcut sadakat vekili başarım ölçütlerine göre çok daha zayıf gürültü varsayımları gerektiriyor.", "en": "The figure given for the result is a lower bound: 0.284 at 95 percent confidence for the fidelity of the resulting state. It says the fidelity is at least that much and leaves open how much higher. The authors also state that the certificate is device dependent. What is gained in return is concrete: the certificate requires substantially weaker noise assumptions than existing fidelity proxy benchmarks.", "refs": ["quantum"]}, {"tr": "Eleme adımının bedeli de burada. Sendrom sonrası eleme, sendromları temiz çıkmayan çalıştırmaları atmak demek; 10 katlık bastırma bu atmanın karşılığında geliyor ve ön baskı bu maliyeti gizlemiyor. Karşılaştırma tarafında Phys.org'un aktardığı 2.415 mantıksal iki kübitlik işlem ve yaklaşık 15 dakikalık süre duruyor. Klasik tarafta pratik dışı süre hareketli bir eşiktir: daha iyi bir benzetim algoritması bu eşiği aşağı çeker, ve çalışma henüz hakem değerlendirmesinden geçmedi.", "en": "The cost of the discard step sits here too. Syndrome post-selection means throwing away runs whose syndromes do not come back clean; the 10-fold suppression is bought with those discards, and the preprint does not hide the cost. On the comparison side stand the 2,415 logical two-qubit operations and roughly 15 minutes that Phys.org reports. On the classical side a prohibitive runtime is a moving threshold: a better simulation algorithm pulls it down, and the work has not yet been through peer review.", "refs": ["quantum"]}]}, {"h": {"tr": "Faydalı kübite kalan yol", "en": "The distance to a useful qubit"}, "ps": [{"tr": "Bu devrenin ürettiği şey zor bir dağılımdan alınmış örneklerdir; yazarların kendi tanımıyla yöntem, hataya karşı denetlenen bir sadakat sertifikasını korurken bir kararlayıcı durumu bir sihir durumuna yükseltmenin dizgesel bir yolu. Bunun bir uygulamaya dönüşmesi için aynı kodlama ve eleme düzeninin, çıktısı kendi başına değerli olan bir hesapta ve katlanılabilir bir eleme oranıyla yürüdüğünün gösterilmesi gerekiyor. İzlenecek iki işaret var: bağımsız bir klasik benzetim denemesinin bu çalıştırmayı yakalayıp yakalamadığı, ve ön baskının aynı sayılarla hakemli yayına dönüşüp dönüşmediği.", "en": "What this circuit produces is samples from a hard distribution; in the authors' own description the method is a systematic way of promoting a stabilizer state to a magic state while keeping an error-detected fidelity certificate. For that to become an application, the same encoding and discard scheme would have to be shown running on a computation whose output is valuable in itself, at a tolerable discard rate. Two signals are worth watching: whether an independent classical simulation attempt catches this run, and whether the preprint becomes a peer-reviewed publication with the same numbers intact.", "refs": ["quantum"]}]}], "sources": [{"key": "quantum", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-quantum-task-classical-simulations.html", "title": {"tr": "IBM ve Chicago Üniversitesi, hatası denetlenebilen bir devrede 70 mantıksal kübit çalıştırdı", "en": "IBM and the University of Chicago ran 70 logical qubits in a circuit whose errors can be checked"}, "publishedDate": "2026-08-01", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.25941", "publishedDate": "2026-07-28", "title": {"tr": "Doğrulanabilir biçimde yüksek sadakatle zor devrelerden örnekleme", "en": "Sampling hard circuits with verifiably high fidelity"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-05", "title": {"tr": "Günde bir avokado neyi düşürdü?", "en": "What did an avocado a day actually lower?"}, "excerpt": {"tr": "Randomize deneme, 786 katılımcı, 26 hafta. Anlamlı tek fark toplam LDL parçacık derişiminde; parçacık boyutunda, alt sınıflarda, HDL parçacıklarında ve apolipoproteinlerde fark gözlenmedi.", "en": "A randomized trial, 786 participants, 26 weeks. The only significant difference is in total LDL particle concentration; none was observed in particle size, subclasses, HDL particles or the apolipoproteins."}, "sections": [{"h": {"tr": "Ölçülen fark", "en": "The difference that was measured"}, "ps": [{"tr": "Tasarım sağlam: çok merkezli, paralel kollu, randomize. Karın bölgesi obezitesi olan 786 katılımcı çözümlenmiş, 389'u avokado kolunda, 397'si alışılmış beslenme kolunda. Katılımcıların yüzde 74'ü kadın, ortalama yaş 51±14 yıl, ortalama beden kitle indeksi 32,9±5,4 kg/m². Süre 26 hafta. Toplam LDL parçacık derişimindeki ortalama fark -49,1 nmol/L; yüzde 95 güven aralığı -83,6 ile -14,5 ve P değeri 0,005.", "en": "The design is sound: multicenter, parallel-arm, randomized. It analysed 786 participants with abdominal obesity, 389 in the avocado group and 397 in the habitual diet group. Participants were 74 percent female, mean age 51±14 years, mean body mass index 32.9±5.4 kg/m2. The duration was 26 weeks. The mean difference in total LDL particle concentration is -49.1 nmol/L, with a 95 percent confidence interval of -83.6 to -14.5 and a P value of .005.", "refs": ["avocado"]}, {"tr": "Şimdi listenin geri kalanı. LDL parçacık boyutunda anlamlı fark gözlenmedi. LDL alt sınıflarında gözlenmedi. Trigliseritten zengin lipoprotein parçacıklarında gözlenmedi. HDL parçacıklarında ve apolipoprotein A ile B'de de gözlenmedi. Birbiriyle ilişkili bir ölçüm panelinde tek bir değerin anlamlı çıkması, o değerin müdahaleye en duyarlı ölçüt olduğunu düşündürebilir; aynı sonuç, panelin genişliğiyle birlikte okunduğunda beklenen dağılıma da uyar. Bu deneme ikisini ayırt edecek bilgiyi kendi başına sağlamıyor.", "en": "Now the rest of the list. No significant difference was observed in LDL particle size. None in LDL subclasses. None in triglyceride-rich lipoprotein particles. None in HDL particles or in apolipoproteins A or B. When one value in a panel of correlated measures comes out significant, it may suggest that value is the measure most sensitive to the intervention; read together with the width of the panel, the same outcome also fits the expected spread. This trial on its own does not supply what would separate the two.", "refs": ["avocado"]}]}, {"h": {"tr": "Ölçüt ile son nokta arasındaki mesafe", "en": "The distance between a measure and an endpoint"}, "ps": [{"tr": "Penn State Beslenme Bilimleri Bölümü kaynaklı açıklama farkı kabaca yüzde 4'lük bir kalp-damar riski azalmasına çeviriyor. Bu sayı denemede ölçülmedi; bir lipoprotein ölçütünden türetilmiş bir tahmindir. Aynı açıklamada karşılaştırma için verilen yüzde 14 ile yüzde 29 aralığı genel beslenmenin iyileştirilmesiyle ilişkilendiriliyor, yani başka bir kanıt türünden geliyor. İki sayı yan yana konduğunda aynı ölçekte görünüyor, oysa biri bir denemeden türetilmiş, öteki gözlemsel ilişkilendirmeden geliyor.", "en": "The release sourced from Penn State's Department of Nutritional Sciences converts the difference into roughly a 4 percent lower cardiovascular risk. That number was not measured in the trial; it is an estimate derived from a lipoprotein measure. The 14 percent to 29 percent range the same release gives for comparison is associated with improving the overall diet, and so comes from a different kind of evidence. Placed side by side the two figures look like the same scale, when one is derived from a trial and the other from observational association.", "refs": ["avocado"]}, {"tr": "Finansman tarafının iki parçası var ve ikisi de kayda değer. Araştırmayı Avocado Nutrition Center destekledi; makalenin çıkar çatışması bildiriminde ise beyan edilen bir durum yok. İkisini birlikte aktarmak gerekiyor: tek başına ilki bir sonucu geçersiz kılmaz, tek başına ikincisi ise ana denemenin kim tarafından desteklendiğini görünmez bırakır. Ana denemenin adı da açık: Habitual Diet and Avocado Trial, ve bu yayın onun bir yan çalışması.", "en": "The funding side has two parts and both are worth stating. The Avocado Nutrition Center supported the research, while the paper's declaration of competing interest reports none. Both belong in the account: the first alone does not invalidate a result, and the second alone leaves who supported the parent trial invisible. The parent trial is named openly too: the Habitual Diet and Avocado Trial, of which this publication is an ancillary study.", "refs": ["avocado"]}]}, {"h": {"tr": "Neyin gösterilmesi gerekir", "en": "What would have to be shown"}, "ps": [{"tr": "Bu sonucun taşıyabileceği ifade şudur: karın bölgesi obezitesi olan yetişkinlerde günde 1 avokado, 26 hafta içinde toplam LDL parçacık derişimini ölçülebilir biçimde düşürüyor. Bunun ötesine geçmek için iki şeyden biri gerekiyor: aynı farkın bağımsız bir grupta, önceden ilan edilmiş bir birincil sonlanım noktası olarak yinelenmesi, ya da olay sayısı için güçlendirilmiş bir denemenin yürütülmesi. İlki ulaşılabilir; ikincisi bu etki büyüklüğünde çok geniş bir örneklem ister.", "en": "The statement this result can carry is this: in adults with abdominal obesity, 1 avocado a day measurably lowers total LDL particle concentration over 26 weeks. Going beyond that needs one of two things: the same difference repeated in an independent group as a prespecified primary endpoint, or a trial powered for events. The first is reachable; the second, at this effect size, demands a very large sample.", "refs": ["avocado"]}]}], "sources": [{"key": "avocado", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/07/260731034155.htm", "title": {"tr": "786 kişilik randomize denemede günde bir avokado, LDL parçacık derişimini 49 nmol/L düşürdü", "en": "In a 786-person randomised trial, an avocado a day lowered LDL particle concentration by 49 nmol/L"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Journal of Clinical Lipidology", "url": "https://pubmed.ncbi.nlm.nih.gov/42364969/", "publishedDate": "2026-06-12", "title": {"tr": "Karın bölgesi obezitesi olan yetişkinlerde günde 1 avokadonun lipoprotein parçacık derişimlerine etkisi", "en": "Effect of incorporating 1 avocado per day on lipoprotein particle concentrations compared to habitual intake in adults with abdominal obesity"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-06", "title": {"tr": "Bir tanrının iki hayvanı aynı ay ışığını yansıtıyor", "en": "A god's two animals reflect the same moonlight"}, "excerpt": {"tr": "Ölçüm sade: on iki müze örneği, bir spektrometre, ay ışığına neredeyse özdeş dalga boyları. Zor olan, üç bin yıl önce birinin bu benzerliği fark edip etmediğini bilmek.", "en": "The measurement is plain: twelve museum specimens, a spectrometer, wavelengths nearly identical to moonlight. The hard part is knowing whether anyone noticed that resemblance three thousand years ago."}, "sections": [{"h": {"tr": "Ölçülebilen kısım", "en": "The part that can be measured"}, "ps": [{"tr": "Dartmouth Koleji'nden antropolog Nathaniel Dominy ile St Andrews Üniversitesi'nden primatolog Catherine Hobaiter, Amerikan Doğa Tarihi Müzesi'ndeki on iki hayvan örneği üzerinde spektrometri kullandı ve habeş maymunu kürkünden ve aynak tüyünden yansıyan ışığın dalga boylarını ölçtü. Türler kutsal habeş maymunu Papio hamadryas, kutsal aynak Threskiornis aethiopicus ve karşılaştırma için Papio anubis. Bildirilen sonuç, yansıyan dalga boylarının ay ışığınınkiyle neredeyse özdeş olması. Çalışma Time and Mind dergisinde 14 Temmuz 2026'da çevrimiçi yayımlandı.", "en": "Nathaniel Dominy, an anthropologist at Dartmouth College, and Catherine Hobaiter, a primatologist at the University of St Andrews, used spectrometry on twelve animal specimens from the American Museum of Natural History and measured the wavelengths of light reflected from baboon fur and ibis feathers. The species are the sacred baboon Papio hamadryas, the sacred ibis Threskiornis aethiopicus and the olive baboon Papio anubis. The reported result is that the reflected wavelengths are nearly identical to moonlight. The study was published online in the journal Time and Mind on 14 July 2026.", "refs": ["thoth"]}, {"tr": "Sorunun neden var olduğunu hatırlamak gerekiyor. Ay tanrısı Thoth, birbirine hiç benzemeyen iki hayvanla temsil ediliyor: bir maymun ve bir kuş. İkisini aynı tanrıya bağlayan görünür bir ortaklık uzun süre bulunamadı. Şimdi bir ölçüm aleti, üç bin yıllık bir ikonografi sorusuna aday bir yanıt sunuyor: ikisini birleştiren şey renkleri.", "en": "It is worth recalling why the question existed. The moon god Thoth is represented by two animals that resemble each other not at all: a monkey and a bird. No visible property binding both to the same god was found for a long time. Now an instrument offers a candidate answer to a three-thousand-year-old question of iconography: what unites them is their coloration.", "refs": ["thoth"]}]}, {"h": {"tr": "Ölçülemeyen kısım", "en": "The part that cannot"}, "ps": [{"tr": "Burada iki ayrı önerme var ve yalnızca biri ölçüldü. Kürk ile tüyün yansıttığı dalga boylarının ay ışığına neredeyse özdeş olması fiziksel bir olgudur. Antik Mısırlıların bu hayvanları o benzerlik yüzünden seçmiş olması ise hiçbir spektrometrenin ulaşamayacağı bir çıkarımdır. Daha sade bir okuma da elde duruyor: kutsal sayılan hayvanların listesi uzundu ve uzun bir listede iki üyenin renkçe örtüşmesi rastlantıyla da gerçekleşebilir. Yazarlar bu ihtiyatı koruyor; yorumu bağlantıyı açıklayabilecek bir öneri olarak sunuyor ve bu zihinleri anlama fırsatlarının seyrek olduğunu kabul ediyorlar.", "en": "There are two propositions here and only one was measured. That the wavelengths reflected by fur and feathers are nearly identical to moonlight is a physical fact. That the ancient Egyptians chose these animals because of that resemblance is an inference no spectrometer reaches. A plainer reading also remains available: the list of animals held sacred was long, and in a long list two members may overlap in coloration by chance. The authors keep that caution, offering the interpretation as what may explain the connection and acknowledging that opportunities to understand these minds are rare.", "refs": ["thoth"]}, {"tr": "Yine de bir şey değişiyor, ve değişen teoloji değil. Bir ikonografi sorusuna bugüne kadar metin, kabartma ve mezar resmiyle yanıt aranıyordu; şimdi listeye bir ölçüm aleti de giriyor. Çalışmayı bir antropolog ile bir primatoloğun birlikte yapması da rastlantı sayılmaz: soruyu yanıtlamak için hem hayvanın kendisini hem onu kutsayan kültürü okumak gerekiyordu. Bu, kanıt dağarcığının genişlemesidir, ve genişleyen dağarcık bir açıklamayı kanıtlanmış hale getirmiyor.", "en": "Something does change, though, and it is not the theology. Until now a question of iconography was answered with texts, reliefs and tomb paintings; now an instrument joins the list. That the study was done jointly by an anthropologist and a primatologist is no accident either: answering the question required reading both the animal itself and the culture that made it sacred. This is a widening of what counts as evidence, and a widened repertoire does not make an explanation proven.", "refs": ["thoth"]}]}, {"h": {"tr": "Kalan soru", "en": "The question that stays"}, "ps": [{"tr": "Tek bir çarpıcı örtüşme ile bir örüntü arasındaki fark sayılabilir bir şeydir. Kutsal sayılan öteki hayvan eşleşmeleri aynı yöntemle ölçülür ve benzer bir renk uyumu çıkarsa rastlantı okuması zayıflar; çıkmazsa bu eşleşme tek başına kalır, ki bu da bir yanıttır. Ölçüm bize hayvanların hangi dalga boylarını yansıttığını söyleyebiliyor. Onları seçen zihni ise hâlâ yalnızca bıraktığı resimlerden okuyoruz, ve o resimlerin sessiz kaldığı yerde ihtiyatlı kalmak merakın koşuludur.", "en": "The difference between one striking overlap and a pattern is something that can be counted. If other pairings of animals held sacred are measured the same way and a similar match in coloration appears, the chance reading weakens; if none appears, this pairing stands alone, and that is an answer too. The measurement can tell us which wavelengths the animals reflect. The mind that chose them we still read only from the pictures it left, and where those pictures fall silent, staying cautious is the condition of curiosity.", "refs": ["thoth"]}]}], "sources": [{"key": "thoth", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-moonlight-fur-feathers-egyptian-god.html", "title": {"tr": "Bir tanrının iki hayvanının kürkü ve tüyü, ay ışığına yakın dalga boyları yansıtıyor", "en": "The fur and feathers of a god's two animals reflect wavelengths close to moonlight"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-01", "title": {"tr": "Samanyolu'nun cüce uyduları, dalga karanlık maddesine bir eğri çizdi", "en": "The Milky Way's dwarf satellites have drawn a curve for wave dark matter"}, "excerpt": {"tr": "Yeni sınır yeni bir gözlemden değil, eski sayımın daha geniş bir model ailesine sorulmasından geliyor; sonuç tek bir kütle değeri yerine bir eğri, ve o eğrinin altında sınanmamış tek bir varsayım duruyor.", "en": "The new bound comes not from a new observation but from asking an old census about a wider family of models; the result is a curve rather than a single mass, and beneath that curve sits one untested assumption."}, "sections": [{"h": {"tr": "Bir sayı değil, bir eğri", "en": "A curve, not a number"}, "ps": [{"tr": "Ölçüm şu: yüzde 95 güvenle, doruk dalga sayısı 10.000 Mpc⁻¹ üzerindeki modeller için ultrahafif skaler parçacığın kütlesi 6 × 10⁻¹⁸ elektronvoltun üzerinde. Bu sayının kaynağı yeni bir teleskop değil; Dark Energy Survey ile Pan-STARRS1 gözlemlerinden derlenmiş, yıllardır elimizde olan cüce uydu galaksi sayımı. Yeni olan, bu sayımın COZMIC benzetimleri üzerinden daha geniş bir model ailesine sorulması.", "en": "The measurement reads as follows: at 95 per cent confidence, for models whose peak wavenumber exceeds 10,000 Mpc⁻¹, the mass of the ultralight scalar particle lies above 6 × 10⁻¹⁸ electronvolts. That number does not come from a new telescope. It comes from the dwarf satellite galaxy census compiled from Dark Energy Survey and Pan-STARRS1 observations, which we have had for years. What is new is that the census has been put, through COZMIC simulations, to a wider family of models.", "refs": ["udm"]}, {"tr": "Sınırın biçimi, içeriğinin kendisi. Tek bir kütle eşiği yerine iki büyüklük arasındaki bağıntı veriliyor: doruk dalga sayısı küçüldükçe eşik karesel olarak düşüyor. Bir alt sınırın sayı olmaktan çıkıp yüzeye dönüşmesi, ölçümün hangi soruya cevap verdiğini de değiştirir; artık tek bir parçacık adayı değil, bir aile eleniyor.", "en": "The shape of the bound is its content. Instead of a single mass threshold, a relation between two quantities is given: as the peak wavenumber falls, the threshold drops quadratically. When a lower bound stops being a number and becomes a surface, the question the measurement answers changes with it; what is being ruled out is now a family, not a single particle candidate.", "refs": ["udm"]}]}, {"h": {"tr": "Soğuk bulanıklıkla sıcak dalga arasındaki fark nereden geliyor", "en": "Where the difference between cold fuzziness and warm waves comes from"}, "ps": [{"tr": "İki senaryonun ayrımı başlangıç koşulunda. Soğuk bulanık karanlık maddede alan başlangıçta türdeştir ve yapıyı bastıran şey, gökbilim ölçeğinde büyük olan Jeans boyudur. Sıcak dalga karanlık maddesinde ise alan başlangıçta oldukça türdeş değildir; bu hem serbest akış bastırması hem de Poisson kaynaklı yoğunluk dalgalanmaları üretir. Yazarların yazdığı gibi, serbest akış yapıyı daha da büyük ölçeklerde bastırabiliyor.", "en": "The two scenarios part company at their initial conditions. In cold fuzzy dark matter the field starts out homogeneous, and what suppresses structure is the Jeans length, which is large on astronomical scales. In warm wave dark matter the initial field is highly inhomogeneous, which produces both free-streaming suppression and Poisson-driven density fluctuations. As the authors put it, free streaming can suppress structure on still larger scales.", "refs": ["udm"]}, {"tr": "Küçük uyduların sayısı bu ayrımı görebilir, çünkü her iki mekanizma da küçük ölçekli yapının kurulmasını geciktirir ve Samanyolu çevresindeki en sönük halolar bunun ilk kurbanıdır. Ama aynı eksik uyduları başka bir şey de üretebilir: sönük galaksilerin halolara nasıl yerleştiği. Sayım bize halo sayısını değil, ışık veren halo sayısını verir; aradaki dönüşüm gözlem değil, modeldir.", "en": "The abundance of small satellites can see that distinction, because both mechanisms delay the assembly of small-scale structure, and the faintest haloes around the Milky Way are the first casualties. Something else can produce the same missing satellites, however: how faint galaxies populate haloes at all. The census counts the haloes that shine, and the conversion from those to the total number of haloes is a model rather than an observation.", "refs": ["udm"]}]}, {"h": {"tr": "Sınırı taşıyan varsayım", "en": "The assumption carrying the bound"}, "ps": [{"tr": "Yazarlar bu noktayı kendileri işaretliyor: incelenen sıcak ultrahafif modellerde galaksi-halo bağıntısının soğuk karanlık maddedekiyle aynı kaldığı varsayılıyor ve bunun izleyen çalışmalar için doğal bir alan olduğu söyleniyor. Sınırın gücü de kırılganlığı da orada. Eğer bu modellerde küçük halolarda yıldız oluşumu farklı işliyorsa, aynı uydu sayımı aynı eğriyi vermez. Eğrinin sınanacağı yer yeni bir parçacık değil, sönük galaksilerin nasıl aydınlandığına dair bağımsız bir ölçüm olacak.", "en": "The authors flag this themselves: in the warm ultralight models they consider, the galaxy–halo connection is assumed to be unchanged from cold dark matter, and they describe this as a natural area for follow-up work. That is where the bound draws both its strength and its fragility. If star formation in small haloes works differently in these models, the same satellite census will not yield the same curve. The place where the curve gets tested will not be a new particle, but an independent measurement of how faint galaxies come to shine.", "refs": ["udm"]}]}], "sources": [{"key": "udm", "kind": "news", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae8b9f", "title": {"tr": "Samanyolu uydularının sayımı, ultrahafif karanlık maddeye yeni bir alt sınır koydu", "en": "A census of Milky Way satellites sets a new lower bound on ultralight dark matter"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "sci-02", "title": {"tr": "Ondaki on kat kimin için ölçüldü?", "en": "Who was the tenfold measured for?"}, "excerpt": {"tr": "Çıngıraklı yılanın kendi kanındaki baskılayıcılar, laboratuvarda mevcut panzehirden on kat güçlü çıktı. Bu sayının hangi toksin ailesinde, hangi kapta ve hangi payda üzerinde ölçüldüğü, hastaya ne kadar yaklaştığını belirliyor.", "en": "Inhibitors from the rattlesnake's own blood proved ten times more potent than current antivenom in the laboratory. Which toxin family, which vessel and which denominator that number was measured on decides how close it gets to a patient."}, "sections": [{"h": {"tr": "Kap: hücre dışı düzenek", "en": "The vessel: an in vitro assay"}, "ps": [{"tr": "Sean B. Carroll'ın ekibi, çıngıraklı yılan serumundaki Fetuin-A proteininden türeyen dört korunmuş metalloproteinaz baskılayıcısını inceledi. Belirli birleşimlerinin birbirlerinin etkinliğini tamamladığı, çıngıraklı yılan zehrinin öldürücülüğünü tümüyle etkisiz kılmaya yettiği ve ticari panzehire göre yaklaşık on kat güç gösterdiği bildiriliyor. Birleşimler birden çok engerek türünün zehrine karşı geniş koruma sağladı. Ölçüm hücre dışı düzenekte yapıldı; insanda etkililik ya da güvenlilik gösterilmedi.", "en": "Sean B. Carroll's team examined four conserved metalloproteinase inhibitors derived from the protein Fetuin-A in rattlesnake serum. Specific combinations are reported to complement one another's activities, to suffice to fully neutralise rattlesnake venom lethality, and to show approximately ten times greater potency than commercial antivenom. The combinations gave broad protection against venoms from several viper species. The measurement was made in vitro; efficacy and safety in humans were not demonstrated.", "refs": ["anti"]}, {"tr": "Bu güç ölçüsü, hasta sonucuna giden yolun ilk adımıdır. Bir hastanın kaybettiği doku, zehir kana karıştıktan sonra geçen dakikalarda belirlenir; laboratuvar kabında ise zehir ile baskılayıcı çoğu zaman aynı anda buluşur. Yayımlanan malzeme bağlanmanın gücünü gösteriyor; zamanlamayı bu aşamadaki bir çalışma zaten ölçmeyi üstlenmez.", "en": "That potency figure is the first step on the road to a patient outcome. The tissue a patient loses is decided in the minutes after venom enters the blood; in a laboratory vessel, venom and inhibitor usually meet at the same moment. The published material shows the strength of the binding; timing is something a study at this stage does not undertake to measure.", "refs": ["anti"]}]}, {"h": {"tr": "Payda: bir toksin ailesi", "en": "The denominator: one toxin family"}, "ps": [{"tr": "Çalışma yalnızca metalloproteinaz ailesindeki toksinleri hedefliyor. Engerek zehri tek bir molekül yerine doku yıkımından pıhtılaşma bozukluğuna kadar farklı işler gören bir karışımdır ve diğer aileler için benzer bir geliştirme süreci gerekiyor. On kat, zehrin bir kesitine karşı ölçülmüş bir sayı.", "en": "The work targets only toxins in the metalloproteinase family. Viper venom is a mixture doing different jobs, from tissue destruction to disrupted clotting, and other families would need comparable development. The tenfold figure was measured against one slice of the venom.", "refs": ["anti"]}, {"tr": "Yine de bu işin asıl ilgi çekici yanı baskılayıcının kaynağında duruyor. Yeniden birleşim yoluyla üretilen bir baskılayıcı, hayvan bağışıklamasına dayanan üretim zincirini ortadan kaldırır; ürünün tutarlılığı ve arzı, güç ölçüsünden daha kalıcı bir kazanç olabilir. Buna karşılık aynı sonucun daha sıradan bir açıklaması da var: karşılaştırma ölçütü olan ticari panzehir, bu belirli toksin ailesi için zaten görece zayıf olabilir ve on kat, eski ürünün bu dar kesitteki eksikliğini ölçüyor olabilir.", "en": "Even so, what makes this work most interesting sits in the source of the inhibitor. An inhibitor produced recombinantly removes a manufacturing chain that depends on immunising animals; consistency of product and reliability of supply may be a more durable gain than the potency figure. Against that, there is a more prosaic account of the same result: the commercial antivenom used as the comparator may already be relatively weak against this particular toxin family, so the tenfold may be measuring the old product's shortfall on a narrow slice.", "refs": ["anti"]}]}, {"h": {"tr": "Bir sonraki ölçüm ne olmalı", "en": "What the next measurement should be"}, "ps": [{"tr": "Bu aşamada dürüst cümle şu: kapta çalışıyor. Bir sonraki adım, ilan edilmiş bir dozla ve önceden belirlenmiş bir sağkalım sonlanım noktasıyla yürütülen hayvan çalışmalarıdır; ardından gücün yanı sıra bağışıklık tepkisinin ve vücutta kalma süresinin de ölçülmesi gerekir. Çıngıraklı yılan ısırığıyla karşılaşan kişi çoğunlukla kırsalda ve hastaneye uzaktadır; onun için önemli olan sayı, ısırıktan sonraki ilk saatte verilebilen dozun ne yaptığıdır.", "en": "The honest sentence at this stage is that it works in the vessel. The next step is animal work with a declared dose and a prespecified survival endpoint, after which immune response and residence time in the body have to be measured alongside potency. The person who meets a rattlesnake bite is usually rural and far from a hospital; the number that matters for them is what a dose given in the first hour after the bite actually does.", "refs": ["anti"]}]}], "sources": [{"key": "anti", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-combined-rattlesnake-proteins-potent-current.html", "title": {"tr": "Çıngıraklı yılanın kendi proteinleri laboratuvarda mevcut panzehirden on kat güçlü çıktı", "en": "A rattlesnake's own proteins proved ten times more potent than current antivenom in the laboratory"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Proceedings of the National Academy of Sciences", "url": "https://doi.org/10.1073/pnas.2612168123", "publishedDate": "2026-07-29", "title": {"tr": "Doğanın panzehiri: korunmuş çıngıraklı yılan serum metalloproteinaz baskılayıcılarının birleşimleri engerek zehirlerinin öldürücü etkisini engelliyor", "en": "Nature's antivenom: Combinations of conserved rattlesnake serum metalloproteinase inhibitors block the lethal action of viper venoms"}}}], "date": "2026-07-31"}, {"writer": "sci-03", "title": {"tr": "El Niño'nun ikinci ibresi tuzdan yapılıyor", "en": "El Niño is getting a second needle made of salt"}, "excerpt": {"tr": "Deniz yüzeyi sıcaklığı El Niño'nun tanımlayıcı ölçüsü. SMOS'un izlediği tuzluluk ise aynı sistemi su döngüsü üzerinden okuyor; değeri, daha erken konuşup konuşmadığı sınandığında belli olacak.", "en": "Sea-surface temperature is El Niño's defining measure. Salinity tracked by SMOS reads the same system through the water cycle; its value will be known when we test whether it speaks earlier."}, "sections": [{"h": {"tr": "Batıdaki havuz doğuya yürürken", "en": "As the western pool moves east"}, "ps": [{"tr": "Normal bir yılda alize rüzgârları, batı Pasifik'teki düşük tuzluluklu yüzey suyu havuzunu batıda tutar. ESA'nın SMOS ve NASA'nın SMAP uydularından derlediği görüntüde, gelişmekte olan 2026 El Niño'su bu düzeni gevşetiyor: havuzun doğu kenarı, derin konveksiyon ve yoğun yağış kuşağıyla birlikte doğuya kayıyor. Bu bir tuz haritasından fazlası; okyanusa nerede tatlı su girdiğini ve su kütlelerinin nereye taşındığını gösteren bir iz.", "en": "In a normal year, the trade winds hold the western Pacific's low-salinity surface-water pool in the west. In the picture assembled from ESA's SMOS and NASA's SMAP satellites, the emerging 2026 El Niño loosens that arrangement: the pool's eastern edge moves east with the belt of deep convection and heavy rain. This is more than a salt map; it traces where freshwater enters the ocean and where water masses move.", "refs": ["salinity"]}, {"tr": "Yağışın arttığı bölgeler tatlılaşırken buharlaşmanın ağır bastığı bölgeler daha tuzlu hale geliyor. Tuzluluk, sıcaklıkla birlikte deniz suyunun yoğunluğunu belirliyor; yoğunluk da ısıyı taşıyan akıntıların bir parçası. Böylece aynı El Niño hem ısı bütçesinde hem su bütçesinde iki ayrı fiziksel iz bırakıyor.", "en": "Regions receiving more rain become fresher while those dominated by evaporation become saltier. Salinity, together with temperature, sets seawater density, and density is part of the circulation that carries heat. The same El Niño therefore leaves two physical traces, one in the heat budget and another in the water budget.", "refs": ["salinity"]}]}, {"h": {"tr": "İkinci ölçü, birincinin yerine geçmiyor", "en": "The second measure does not replace the first"}, "ps": [{"tr": "Deniz yüzeyi sıcaklığı El Niño'nun tanımlayıcı özelliği olmaya devam ediyor. Tuzluluğun önerdiği kazanç başka: yağışa, buharlaşmaya ve yüzey akıntılarına hızlı yanıt veren tamamlayıcı bir değişken eklemek. Biri okyanusun ne kadar ısı taşıdığını, öbürü tatlı suyun nerede girip çıktığını yaklaşık olarak anlatıyor; ikisini birlikte okumak, bağlı okyanus-atmosfer sisteminin tek göstergede kaybolan kısmını görünür kılıyor.", "en": "Sea-surface temperature remains El Niño's defining characteristic. The proposed gain from salinity is different: add a companion variable that responds quickly to rain, evaporation and surface currents. One describes how much heat the ocean carries, the other approximates where freshwater enters and leaves; reading both exposes part of the coupled ocean-atmosphere system that one indicator can hide.", "refs": ["salinity"]}, {"tr": "Buradaki sınır, güzel bir eşzamanlı görüntünün erken uyarı olmadığıdır. 2026 örüntüsü gelişmekte olan olayı izliyor; tuzluluğun sıcaklıktan önce düzenli biçimde değiştiğini henüz göstermiyor. Yağış ve akıntıların olaydan olaya değişmesi de sinyali öne çekmek yerine gürültüye çevirebilir.", "en": "The boundary is that an elegant simultaneous picture is not an early warning. The 2026 pattern follows the developing event; it does not yet show that salinity moves consistently before temperature. Rainfall and currents may also vary from event to event, turning the proposed lead into noise.", "refs": ["salinity"]}]}, {"h": {"tr": "Erken sözü bir indeks sınayacak", "en": "An index will test the claim of earliness"}, "ps": [{"tr": "Araştırmacılar şimdi ENSO'ya özgü bir deniz yüzeyi tuzluluğu indeksi geliştiriyor. Doğru sınama, aynı geçmiş olaylarda sıcaklık indeksinin yanına tuzluluğu ekleyip öngörü süresi ile hata payının gerçekten iyileşip iyileşmediğine bakmak; ardından aynı hesabı ileriye dönük tahminlerde kilitlemek. Tuzdan yapılmış ikinci ibre ancak birinci ibreden önce ve tutarlı biçimde hareket ederse erken uyarı sayılacak.", "en": "Researchers are now developing an ENSO-specific sea-surface-salinity index. The proper test is to add it beside the temperature index across the same past events, ask whether lead time and error actually improve, and then lock that calculation for prospective forecasts. A second needle made of salt becomes an early warning only if it moves before the first one, consistently. That is a climate measurement question, not a replacement for the temperature series.", "refs": ["salinity"]}]}], "sources": [{"key": "salinity", "kind": "news", "name": "European Space Agency", "url": "https://www.esa.int/Applications/Observing_the_Earth/FutureEO/SMOS/SMOS_salinity_could_offer_early_indicator_of_El_Nino", "title": {"tr": "SMOS tuzluluk örüntüleri El Niño için daha erken bir sinyal sunabilir", "en": "SMOS salinity patterns could offer an earlier signal of El Niño"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "sci-04", "title": {"tr": "Ölçümden bir parça çıkarıldı: karşı taraftaki ayna", "en": "One component was removed from the measurement: the mirror at the far end"}, "excerpt": {"tr": "Uzaktan kimyasal saptama düzeneklerinin iki ucu vardır; biri lazer, öbürü hedefe önceden kurulan yansıtıcı. Bu çalışma ikincisini çıkarıyor ve yerine oradaki her neyse onu koyuyor. Böylece trafik levhası ölçüm aletinin bir parçası oluyor.", "en": "Standoff chemical detection has two ends: the laser at one, and a reflector installed in advance at the other. This work removes the second and puts whatever happens to be standing there in its place. A traffic sign thereby becomes part of the instrument."}, "sections": [{"h": {"tr": "Çıkarılan bileşen", "en": "The component that came out"}, "ps": [{"tr": "Tim Johnson'ın Pasifik Kuzeybatı Ulusal Laboratuvarı'ndaki ekibi, 7500-600 cm⁻¹ (1,33-16,7 mikrometre) aralığında çalışan kuantum kaskad lazerli bir izge ölçerle, alüminyum levhadan mermere, araç panelinden bitki örtüsüne kadar 60'a yakın yaygın malzemenin yansıtıcılığını ölçtü. On metrelik sorgulama uzunluğuna sahip denetimli laboratuvar aerosol odasında dietil sebakat ve kalsiyum karbonat saptanıp ayırt edildi; düzenek on bir metreye kadar mesafede çalıştı.", "en": "Tim Johnson's team at Pacific Northwest National Laboratory measured the reflectance of close to 60 common materials, from aluminium panels to marble, car panels and vegetation, using a quantum-cascade laser spectrometer operating across 7500-600 cm⁻¹ (1.33-16.7 micrometres). In a controlled laboratory aerosol chamber with a ten-metre interrogation length, diethyl sebacate and calcium carbonate were detected and told apart; the system worked at distances of up to eleven metres.", "refs": ["aero"]}, {"tr": "Katkının nerede olduğunu görmek için düzeneği parçalarına ayırmak yeterli. Klasik açık yol izge ölçümünde ışık, hedefin karşısına kurulan bir yansıtıcıdan geri döner; bu, iki uçlu bir kurulum demektir ve ölçüm yapılacak her yere önceden gidilmesini gerektirir. Ekip bu bileşeni çıkarıp yerine oradaki yüzeyi koyuyor. Kazanç tek uçlu bir ölçüm; bedeli, dönen ışığın miktarını artık denetlenmeyen bir yüzeyin dağınık yansıtıcılığının belirlemesi. Yüzey, aletin bir parçası haline geliyor.", "en": "To see where the contribution lies, it is enough to take the setup apart. In classical open-path spectroscopy the light returns from a reflector installed opposite the target, which makes it a two-ended arrangement and requires going in advance to every place a measurement will be taken. The team removes that component and puts the surface already present in its place. The gain is a one-ended measurement; the price is that the amount of light returned is now set by the diffuse reflectance of a surface nobody controls. The surface becomes part of the instrument.", "refs": ["aero"]}]}, {"h": {"tr": "On bir metre bir tavan değil, bir bütçe kalemi", "en": "Eleven metres is a budget line, not a ceiling"}, "ps": [{"tr": "Bildirilen on bir metre bir fizik sınırı gibi okunmamalı; laboratuvar geometrisinin verdiği bir sayı. Menzili büyütmek dönen foton sayısıyla ödenir ve o sayı hem mesafenin karesiyle hem de yüzeyin dağınık yansıtıcılığıyla azalır. Ekibin 60'a yakın malzemeyi tek tek ölçmesinin nedeni de bu: kazancın ne kadarının gerçekte var olduğu, hedefin arkasında hangi yüzeyin bulunduğuna bağlı. Boyalı bir trafik levhasıyla ıslak bir ağaç gövdesi aynı aleti farklı iki alete çevirir.", "en": "The reported eleven metres should not be read as a limit of physics; it is a number the laboratory geometry gave. Extending the range is paid for in returned photons, and that count falls both with the square of the distance and with the diffuse reflectance of the surface. That is why the team measured close to 60 materials one by one: how much of the gain actually exists depends on which surface stands behind the target. A painted traffic sign and a wet tree trunk turn the same instrument into two different instruments.", "refs": ["aero"]}, {"tr": "Yazarların saydığı asıl güçlük yorum tarafında duruyor. Daha geniş parçacık boyu dağılımları ve karmaşık kimyasal karışımlar izgeleri güçleştiriyor ve ekip bu durumların çözümlenmesinde yapay öğrenme yöntemlerine gerek duyulabileceğini belirtiyor. Bu, zor işi optikten çıkarım aşamasına taşımak demektir; problemin yeri değişir, büyüklüğü olduğu gibi kalır. Aynı güçlüğün daha sıradan bir açıklaması da var: karmaşık izgeler yüzeyden çok aerosolün kendi kimyasal karmaşıklığından doğuyor olabilir; o durumda sıradan yüzey kullanmanın bedeli sanıldığından küçüktür.", "en": "The main difficulty the authors count sits on the interpretive side. Broader particle size distributions and complex chemical mixtures make the spectra harder to read, and the team states that machine-learning methods may be needed to analyse those cases. That means moving the hard part out of the optics and into the inference stage; the location of the problem changes while its size stays as it was. There is a more prosaic account of the same difficulty: crowded spectra may arise more from the aerosol's own chemical complexity than from the surface, in which case the price of using ordinary surfaces is smaller than it looks.", "refs": ["aero"]}]}, {"h": {"tr": "Kurulan ve kurulmayan", "en": "What was built and what was not"}, "ps": [{"tr": "Kurulan şey nettir: yansıtıcı gerektirmeyen tek uçlu bir izge ölçüm yolu, geniş bir malzeme yansıtıcılık kataloğu ve denetimli bir odada iki maddenin ayırt edilmesi. Kurulmayan da o kadar nettir: sahada, denetlenmeyen bir arka planla ve gerçek bir aerosol bulutuyla yapılmış bir ölçüm ve bu koşullar altında ilan edilmiş bir saptama eşiği. Bir aygıtın hazır sayılması için üçüncüsü gerekir; ilk ikisi yolu açar, üçüncüsü teslim eder.", "en": "What was built is clear: a one-ended spectroscopic path that needs no reflector, a broad catalogue of material reflectances, and the discrimination of two substances in a controlled chamber. What was not built is just as clear: a measurement made in the field, against an uncontrolled background and a real aerosol plume, and a declared detection threshold under those conditions. Calling a device ready requires the third; the first two open the path, the third delivers it.", "refs": ["aero"]}]}], "sources": [{"key": "aero", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-spectroscopy-aerosols-traffic-tree-trunks.html", "title": {"tr": "Trafik levhasından yansıyan kızılötesi ışık, havadaki kimyasalı uzaktan tanıdı", "en": "Infrared light bounced off a traffic sign identified airborne chemicals at a distance"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Applied Optics", "url": "https://opg.optica.org/ao/abstract.cfm?doi=10.1364/AO.604722", "publishedDate": "2026-07-29", "title": {"tr": "Yaygın yüzeylerden kızılötesi lazer yansımasıyla aerosol ve buhar saptama: parlayan her şey altın değildir", "en": "Aerosol and vapor detection via infrared laser reflectance from common surfaces: all that shimmers is not gold"}}}], "date": "2026-07-31"}, {"writer": "sci-05", "title": {"tr": "Bir kuş halkadan kaybolduğunda ölüm tek ihtimal değil", "en": "When a banded bird disappears, death is not the only possibility"}, "excerpt": {"tr": "Yarım milyondan fazla halkalama gözlemi dişiler için daha düşük görünür sağkalım veriyor. 'Görünür' sözcüğü küçük değil: ölüm ile çalışma alanından kalıcı ayrılışı aynı paydada tutuyor.", "en": "More than half a million banding records give females lower apparent survival. The word 'apparent' is not small: it keeps death and permanent departure from the study area in one denominator."}, "sections": [{"h": {"tr": "Yarım milyon gözlemde aynı yön", "en": "The same direction across half a million records"}, "ps": [{"tr": "Joanna Wu ve arkadaşları, ABD ile Kanada'da 1992-2018 arasında toplanan 563.414 yakala-işaretle-yeniden yakala gözlemini, 17 familyadan 92 tür için çözümledi. Dişilerin görünür sağkalımı türlerin 82'sinde erkeklerinkinden düşük çıktı; fark 35 türde istatistiksel olarak anlamlıydı. Erginler için ortalama oran dişilerde 0,479, erkeklerde 0,538; aradaki fark yüzde 12,4.", "en": "Joanna Wu and colleagues analysed 563,414 capture-mark-recapture records collected in the United States and Canada from 1992 to 2018 across 92 species in 17 families. Female apparent survival was below the male estimate in 82 species, with a statistically significant difference in 35. Mean adult rates were 0.479 for females and 0.538 for males, a 12.4 per cent gap.", "refs": ["birds"]}, {"tr": "Yazarlar bu oranları erginliğe ulaştıktan sonra ortalama 1,36 yıl ve 1,61 yıl olarak ifade ediyor. Geniş örnek, tek bir türdeki rastlantıyı azaltıyor; geçici bireyleri ayıran Cormack-Jolly-Seber modeli de ilk yakalamadan sonra bir daha görülmeyen kuşların yarattığı bilinen bir yanlılığı ele alıyor. Yine de ölçümün adı sonucu sınırlıyor: bu, sağkalım değil görünür sağkalım.", "en": "The authors express those rates as average post-adulthood lifespans of 1.36 and 1.61 years. The large sample reduces the chance of a one-species accident, while a transient Cormack-Jolly-Seber model addresses a known bias from birds never seen after first capture. Yet the name of the measure still bounds the result: it is apparent survival, not survival alone.", "refs": ["birds"]}]}, {"h": {"tr": "Kayıp kuş iki farklı yere gidebilir", "en": "A missing bird can go to two different places"}, "ps": [{"tr": "Bir kuş sonraki yıl aynı ağlarda yakalanmadığında iki temel açıklama vardır: ölmüştür ya da örneklenen alanı kalıcı olarak terk etmiştir. Standart yakalama-yeniden yakalama verisi bu iki yolu tek başına ayıramaz. Dişiler daha uzağa dağılıyorsa, düşük görünen oranın bir bölümü ölümden değil alan sadakatindeki farktan doğabilir. Bu ayrım, başlıktaki yaşam süresi sözünü doğrudan nedensel bir sonuca çevirmeyi engelliyor.", "en": "When a bird is not caught in the same nets the next year, two basic explanations remain: it died, or it permanently left the sampled area. Standard capture-recapture data cannot separate those paths on their own. If females disperse farther, part of the lower-looking rate may arise from site fidelity rather than death. That distinction prevents turning the lifespan language in the headline into a direct causal result.", "refs": ["birds"]}, {"tr": "Çalışmadaki örüntüler iki açıklamayı da açık bırakıyor. Cinsiyet farkı uzun mesafe göçmenlerinde daha büyük; bu gerçek hareket ve enerji maliyetleriyle uyumlu. Dağılmaya uygun kanat biçimi taşıyan türlerde farkın küçülmesi ise alan değiştirme olasılığının ölçüme karışabileceğini hatırlatıyor. Bağıntılar mekanizma öneriyor, hangisinin payını ölçmüyor.", "en": "Patterns in the study leave both explanations open. The sex gap is larger in long-distance migrants, consistent with real movement and energy costs. Its smaller size in species with wing shapes suited to dispersal also warns that movement among sites may enter the measure. The correlations propose mechanisms; they do not apportion them.", "refs": ["birds"]}]}, {"h": {"tr": "Paydayı ayıracak bir sonraki veri", "en": "The next data must split the denominator"}, "ps": [{"tr": "Sonucu ilerletecek tekrar, daha çok halka saymaktan ibaret değil. Aynı türleri birden fazla alanda yeniden yakalayan ya da bireysel vericilerle izleyen bir tasarım, kalıcı göç olasılığını ölümden ayrı tahmin edebilir. O zaman 82 türdeki ortak yönün ne kadarının gerçek sağkalım, ne kadarının mekân değiştirme olduğu görülebilir. Bugünkü çalışma güçlü bir örüntü kuruyor; henüz iki çıkışı olan kapının hangi tarafından geçildiğini söylemiyor.", "en": "The replication that advances this result is not simply another count of bands. A design that recaptures the same species across multiple sites or tracks individuals can estimate permanent emigration separately from death. Then we can see how much of the shared direction across 82 species is true survival and how much is movement. Today's study establishes a strong pattern; it does not yet say which side of a two-exit door the birds used.", "refs": ["birds"]}]}], "sources": [{"key": "birds", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-female-birds-shorter-lifespans-male.html", "title": {"tr": "Kuzey Amerika ötücü kuşlarında dişilerin görünür sağkalımı erkeklerinkinin altında", "en": "Female North American songbirds show lower apparent survival than males"}, "publishedDate": "2026-07-30", "primary": {"kind": "paper", "name": "Proceedings of the Royal Society B", "url": "https://doi.org/10.1098/rspb.2025.3227", "publishedDate": "2026-07-29", "title": {"tr": "Kuzey Amerika ötücü kuşlarında dişilerin görünür sağkalımı erkeklerinkinden düşük", "en": "Female North American passerine birds have lower apparent survival than males"}}}], "date": "2026-07-31"}, {"writer": "sci-06", "title": {"tr": "Tanıklıkla anlatılan bir tarih, artık bir molekülle de anlatılıyor", "en": "A history told by testimony is now also told by a molecule"}, "excerpt": {"tr": "Çiçek hastalığının Amerika'ya sömürgecilikle geldiğini zaten biliyorduk. Şili'deki iki mezardan çıkan virüs genomu bu sonucu yerinde bırakıyor ve onu taşıyan kanıt türünü değiştiriyor; bu da bundan sonra hangi tartışmaların çözülebileceğini belirliyor.", "en": "We already knew that smallpox reached the Americas with colonisation. The viral genome recovered from two graves in Chile leaves that conclusion in place and changes the kind of evidence carrying it, which decides which arguments can be settled from here on."}, "sections": [{"h": {"tr": "Bilinen bir sonucun yeni bir kanıt türü", "en": "A new kind of evidence for a known conclusion"}, "ps": [{"tr": "Kuzey Şili'deki Camarones 9 kazı alanında iki bireyin kalıntılarından variola virüsü DNA'sı çıkarıldı; ikisi de 1492 ile 1631 arasında yaşamış olarak tarihlendi. Genomlar bugün soyu tükenmiş, ortaçağ Avrupa suşlarından sonra ayrılmış bir kola ait ve birbirlerine neredeyse tıpatıp benziyorlar; bu benzerlik iki kişinin aynı salgın sırasında hastalandığına işaret ediyor.", "en": "Variola virus DNA has been extracted from the remains of two individuals at the Camarones 9 site in northern Chile, both dated to between 1492 and 1631. The genomes belong to a now-extinct branch that split off after medieval European strains, and they are near-identical to one another, a resemblance pointing to two people falling ill in the same outbreak.", "refs": ["pox"]}, {"tr": "Buradaki yenilik sonucun kendisinde değil. Sömürgeciliğin hastalığı taşıdığı, yüzyıllardır kroniklerden, vaftiz defterlerinden ve nüfus tahminlerinden çıkarılıyordu; ekip bulgularını bu taşınmanın ilk moleküler doğrulaması olarak sunuyor. Bir iddianın tanıklıktan maddi kanıta geçmesi, doğruluk derecesini artırmaktan çok tartışmanın zeminini değiştirir: yazılı kaynağın güvenilirliği üzerine kurulmuş itirazlar artık aynı yere düşmez.", "en": "The novelty here lies elsewhere than in the conclusion itself. That colonisation carried the disease has been inferred for centuries from chronicles, baptismal registers and population estimates; the team presents its findings as the first molecular confirmation of that transfer. When a claim moves from testimony to material evidence, what changes is less its degree of truth than the ground of the argument: objections built on the reliability of a written source no longer land in the same place.", "refs": ["pox"]}]}, {"h": {"tr": "İki yüzyıl yavaş, sonra hızlı", "en": "Two centuries slow, then fast"}, "ps": [{"tr": "Ekibin bildirdiği ikinci bulgu daha ilginç ve daha kırılgan. Virüs, sömürge genişlemesiyle çakışan yaklaşık iki yüzyıl boyunca yavaş bir genom evrimi gösteriyor; ardından yaygın aşılama dönemi çevresinde mutasyon oranı hızlanıyor. Bir okuma, virüsün yayılmak için yeterince iyi bir biçime ulaştığı ve daha fazla uyarlanmaya ihtiyaç duymadığı yönünde.", "en": "The team's second finding is more interesting and more fragile. The virus shows slow genome evolution across roughly two centuries coinciding with colonial expansion, after which the mutation rate accelerates around the period of widespread vaccination. One reading is that the virus reached a form good enough to spread and needed no further adaptation.", "refs": ["pox"]}, {"tr": "Araştırmacılar burada durup kendileri sınırı çiziyor: bu örtüşme için düzgün bir nedensellikten söz edilemez, ancak bağıntı en azından dikkat çekicidir. Bu ihtiyat yerinde, çünkü aynı örüntüyü daha sıradan bir şey de üretebilir: farklı dönemlerden elde edilen genom sayısı eşit değildir ve örnekleme yoğunluğundaki değişim, gerçek bir oran değişimi olmadan da hızda görünür bir kayma yaratabilir. Molekül tanıklıktan daha az konuşkan değil; yalnızca farklı bir dilde yanılıyor.", "en": "The researchers stop here and draw the line themselves: no proper causation can be claimed for the overlap, though the correlation is at least notable. That caution is well placed, because something more prosaic can produce the same pattern: the number of genomes recovered from different periods is not equal, and a change in sampling density can create an apparent shift in rate without any real change in rate. The molecule is no less talkative than testimony; it simply errs in a different language.", "refs": ["pox"]}]}, {"h": {"tr": "İki kanıt türünün birbirini denetlediği yer", "en": "Where two kinds of evidence check each other"}, "ps": [{"tr": "Bu köşenin 25 Temmuz tarihli yazısında, veba genomlarının yaklaşık 5.300 yıl öncesinin yazısız Avrasya'sını okunur kıldığını savunmuştum. Şili'deki iki mezar aynı aleti bu kez yazılı kaynağın bol olduğu bir döneme sokuyor ve önemli olan da bu: tarih öncesinde genom tek tanıktı, burada ikinci tanık. İki kanıt türü aynı olaya farklı yerlerden bakıyor ve birbirini denetleyebiliyor. Bu denetimin ilk sınavı da belli: aynı dönemden daha çok genom elde edildiğinde bildirilen hız değişiminin ayakta kalıp kalmadığı görülecek. Bir salgının kimden kime geçtiğine dair beş yüzyıllık bir tartışmanın artık hem kimin anlattığına hem de kimin kemiğinde ne kaldığına bakılarak sürdürülebilmesi, geçmişi kimin adına konuştuğumuz sorusunu da sessizce değiştiriyor.", "en": "In this column's 25 July piece I argued that plague genomes had made the unwritten Eurasia of about 5,300 years ago legible. The two graves in Chile put the same instrument into a period rich in written sources, and that is what matters: in prehistory the genome was the only witness, here it is the second. Two kinds of evidence look at the same event from different places and can check one another. The first test of that checking is already clear: once more genomes from the same period are recovered, we will see whether the reported change in rate survives. That a five-century argument about who passed an epidemic to whom can now be continued by asking both who told the story and what remains in whose bone quietly changes the question of on whose behalf we speak for the past.", "refs": ["pox", "prior-06"]}]}], "sources": [{"key": "pox", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/chilean-mummies-reveal-a-lost-lineage-of-smallpox/", "title": {"tr": "Şili mumyalarından çiçek virüsünün soyu tükenmiş bir kolu çıktı", "en": "An extinct branch of the smallpox virus has been recovered from Chilean mummies"}, "publishedDate": "2026-07-30"}, {"key": "prior-06", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/science/sci-06/2026-07-25/", "title": {"tr": "Beş bin üç yüz yıl önce Avrasya çoktan tek bir odaydı", "en": "Five thousand three hundred years ago Eurasia was already one room"}, "publishedDate": "2026-07-25"}], "date": "2026-07-31"}, {"writer": "sci-01", "title": {"tr": "25 yıllık müon açığını kapatan hesap, faturayı ölçümlere çıkardı", "en": "The calculation that closed the 25-year muon gap sent the bill to the measurements"}, "excerpt": {"tr": "Müonun manyetik salınımındaki milyonda birlik sapma kuram tarafında kapandı. Kapanınca ortaya çıkan şey, kırk yıla yayılmış pion üretim ölçümlerinin birbirine uymadığıydı.", "en": "The one-part-in-a-million deviation in the muon's magnetic wobble closed on the theory side. What closing it revealed was that four decades of pion production measurements do not agree with one another."}, "sections": [{"h": {"tr": "Açığın kapandığı gün", "en": "The day the gap closed"}, "ps": [{"tr": "Müonun manyetik salınımı, çeyrek yüzyıl boyunca kuramsal öngörüden milyonda bir düzeyinde saptı ve bu sapma keşfedilmemiş parçacıklara işaret ediyor sayıldı. Budapeşte-Marsilya-Wuppertal işbirliğinin örgü QCD hesabı 2021'de müonun bilinen fizikle tam uyumlu salındığını gösterdi; sonuç Fermilab'ın güncellenmiş ölçümüyle aynı gün açıklandı.", "en": "For a quarter of a century the muon's magnetic wobble sat about one part in a million away from theoretical prediction, and that deviation was taken as a hint of undiscovered particles. In 2021 the Budapest-Marseille-Wuppertal collaboration's lattice QCD calculation showed the muon wobbling exactly as known physics requires, and the result was released the same day as Fermilab's updated measurement.", "refs": ["muon"]}, {"tr": "Aynı sayıya ikinci bir yoldan varılıyor. Alex Keshavarzi ve arkadaşlarının Haziran 2020'de yayımladığı veri temelli öngörü, kuarkların davranışını elektron-pozitron çarpışmalarından çıkarıyordu ve Fermilab'ın Nisan 2021 ölçümüyle o kadar keskin biçimde çelişti ki yeni parçacık keşfi için gereken katı eşiğe neredeyse dayandı. Örgü hesabı bu çelişkiyi çözmedi; yerini değiştirdi.", "en": "The same number can be reached by a second route. The data-driven prediction published by Alex Keshavarzi and colleagues in June 2020 inferred quark behaviour from electron-positron collisions, and it clashed with Fermilab's April 2021 measurement so sharply that it nearly reached the stringent threshold required to claim a new particle. The lattice calculation did not dissolve that clash; it moved where the clash sits.", "refs": ["muon"]}]}, {"h": {"tr": "Yükü taşıyan ölçüm", "en": "The measurement left carrying the weight"}, "ps": [{"tr": "Veri temelli yol, elektron-pozitron çarpışmalarındaki pion üretim oranlarının ölçümüne dayanıyor. Novosibirsk'teki VEPP-2000 çarpıştırıcısında 2023'te yeni bir algılayıcı kurulup oranlar yeniden ölçüldüğünde, değerler belirgin biçimde değişti. Liverpool Üniversitesi'nden Fedor Ignatov bunu \"It was a surprise. No one expected it to be like that\" sözleriyle anlatıyor. BABAR çarpıştırıcısının 2023 çözümlemesi ise eski oranla çarpıcı bir uyum içinde.", "en": "The data-driven route depends on measurements of pion production rates in electron-positron collisions. When a new detector was installed at the VEPP-2000 collider in Novosibirsk in 2023 and the rates were measured again, the values changed significantly. Fedor Ignatov of the University of Liverpool describes it this way: \"It was a surprise. No one expected it to be like that\". The BABAR collider's 2023 analysis, meanwhile, sits in striking agreement with the older rate.", "refs": ["muon"]}, {"tr": "Bir kuramsal hesabın deneyle buluşması, uyuşmazlığı kuram ile ölçüm arasından çıkarıp ölçümlerin kendi arasına taşıdı: şimdi ayrışan şey iki yöntem yerine aynı yöntemi besleyen girdilerdir. Bilinmeyen bir parçacık bunun tek açıklaması sayılmaz; onlarca yıla yayılmış deneyler arasındaki gözden kaçmış yöntem ayrımları da aynı ayrışmayı üretebilir ve o durumda Standart Model'e dokunmak gerekmez.", "en": "A theoretical calculation meeting the experiment carried the disagreement out from between theory and measurement and set it down among the measurements themselves: what now diverges is one method's own inputs rather than two rival methods. An unknown particle counts as only one account of this. Overlooked procedural differences between experiments spread across decades could produce the same divergence, and in that case nothing in the Standard Model needs touching.", "refs": ["muon"]}]}, {"h": {"tr": "Neye bakılacak", "en": "What to watch"}, "ps": [{"tr": "Keshavarzi, VEPP-2000 sonucundan daha çok incelenmiş bir ölçüm bulunmadığını ve şimdiye dek bir sorun saptanmadığını söylüyor; kendi özeti de bunu doğruluyor: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Bakılacak yer, bağımsız bir pion oranı ölçümünün VEPP-2000'in yeni değerine mi yoksa BABAR ile eski ölçümlerin oluşturduğu kümeye mi düşeceğidir. Müonun kendi sayısı bir süre daha aynı kalabilir; ona giden yolun iki ucu birbirine yaklaşmadan hangi tarafta yeni fizik olduğu söylenemez.", "en": "Keshavarzi says no measurement has been scrutinised more than VEPP-2000's and that so far no problems have been found; his own summary bears it out: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" What to watch is whether an independent measurement of the pion rate lands on VEPP-2000's new value or in the cluster formed by BABAR and the older results. The muon's own number may hold steady for a while yet; until the two ends of the road leading to it converge, no one can say which side holds new physics.", "refs": ["muon"]}]}], "sources": [{"key": "muon", "kind": "news", "name": "Quanta Magazine", "url": "https://www.quantamagazine.org/physicists-solve-a-muon-mystery-now-old-results-dont-add-up-20260729", "title": {"tr": "Müondaki 25 yıllık açığı kapatan hesap, kırk yıllık pion ölçümlerini birbiriyle çelişkide bıraktı", "en": "The calculation that closed a 25-year muon gap has left four decades of pion measurements in conflict"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Çocukluk kokusunun izi, koku soğanında doğum sonrası hücrelerde bulundu", "en": "The trace of a childhood scent was found in postnatal cells of the olfactory bulb"}, "excerpt": {"tr": "Ankete 647 kişi katıldı. Nedensel adım ise farede atıldı: doğumdan sonraki ilk gün oluşan granül hücreleri ışıkla susturulunca hayvanın kokuya ilgisi düştü.", "en": "647 people took part in the survey. The causal step was taken in the mouse: when granule cells formed on the first day after birth were silenced with light, the animal's interest in the odour fell."}, "sections": [{"h": {"tr": "İki ayrı kanıt, iki ayrı tür", "en": "Two kinds of evidence, two species"}, "ps": [{"tr": "Çalışma iki koldan yürüdü. Ankete 647 kişi katıldı ve çocukluğunun hoş kokularını bildirdi. Fareler ise doğum sonrası 23–33. günler arasında, insanda erken çocukluğa karşılık gelen dönemde, çekici kokularla zenginleştirilmiş bir ortamda tutuldu.", "en": "The study ran along two tracks. 647 people took part in the survey and reported the pleasant smells of their childhood. Mice, for their part, were kept in an environment enriched with attractive odorants between postnatal days 23 and 33, the period corresponding to early childhood in humans.", "refs": ["smell"]}, {"tr": "Yetişkin farede anının geri çağrılması, doğumdan sonraki ilk gün oluşan granül hücrelerine bağlı çıktı. Ekip bu hücreleri halorodopsin taşıyan bir lentivirüsle işaretleyip 561 nanometre ışıkla susturdu; kokuya ayrılan inceleme süresi düştü, alışma eğrisi dikleşti ve tercih göstergesi geriledi. Grup büyüklükleri 18 ve 12 hayvandı.", "en": "In the adult mouse, recall of the memory turned out to depend on granule cells formed on the first day after birth. The team labelled those cells with a lentivirus carrying halorhodopsin and silenced them with light at 561 nanometres; investigation time devoted to the odorant fell, the habituation slope steepened and the preference index declined. Group sizes were 18 and 12 animals.", "refs": ["smell"]}]}, {"h": {"tr": "İki açıklama yarışıyor", "en": "Two accounts in competition"}, "ps": [{"tr": "Yazarların önerdiği mekanizma, erken kokunun ödül sistemiyle artan bağlantı üzerinden koku soğanına yerleşmesidir. Scientific American'ın aktardığı biçimde granül hücreleri haz ve ödül bölgeleriyle ayrıcalıklı bağlantılar kuruyor, böylece erken koku çocuklukta damgalanıyor.", "en": "The mechanism the authors propose is that the early odorant settles into the olfactory bulb through increased connectivity with the reward system. As Scientific American puts it, granule cells make privileged connections with pleasure and reward areas, so the early scent becomes imprinted in childhood.", "refs": ["smell"]}, {"tr": "Işıkla susturmanın ardından değişen davranış, ödül üzerinden kurulan bir damgalanmanın kesilmesiyle açıklanabilir. Aynı sonuç, erken kokunun yalnızca tanıdık olmasından da doğabilir; granül hücreleri kapatıldığında aşinalığı okuyan yol da kapanır ve inceleme süresi yine düşer. İki açıklamayı ayırmak, hazzı ve aşinalığı birbirinden bağımsız sınamayı gerektirir.", "en": "The behaviour that changes after silencing with light can be explained by the interruption of an imprint established through reward. The same outcome could also arise from the early odorant being merely familiar; when granule cells are shut off, the route that reads familiarity closes too and investigation time falls just the same. Separating the two accounts requires testing pleasure and familiarity independently of one another.", "refs": ["smell"]}]}, {"h": {"tr": "Kimin için ne değişir", "en": "Whose life this changes"}, "ps": [{"tr": "Bu araştırmadan kliniğe bugün taşınabilecek bir uygulama çıkmıyor. Scientific American'ın derlediği iki uyarı da bunu destekliyor: AgroParisTech-INRAE'den Hervé This çalışmanın ağırlıkla olumlu anılara odaklandığını söylüyor, Buckingham Üniversitesi'nden Luca Turin ise kokunun ayrıksılığının görünürde kalabileceğini savunuyor. Yaşlanan farede anının sürmesi için kokunun aralıklarla yeniden verilmesi gerekiyor ve doğum sonrası hücreler devreden çekilirken limbik bağlantılar güçleniyor. İnsanda karşılığı olan soru budur: erken kokuya yeniden maruz kalmak, yaşlanmayla zayıflayan bir anıyı ayakta tutar mı?", "en": "Nothing in this research can be carried into the clinic today. The two cautions Scientific American gathered support that reading: Hervé This of AgroParisTech-INRAE says the work focused largely on positive memories, while Luca Turin of the University of Buckingham argues smell's distinctiveness may be only apparent. In the ageing mouse, the memory persists only if the odorant is presented again periodically, and as the postnatal cells disengage the limbic connections strengthen. That is the question with a human counterpart: does re-exposure to an early scent hold up a memory that ageing weakens?", "refs": ["smell"]}]}], "sources": [{"key": "smell", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories", "title": {"tr": "Farelerde koku soğanı granül hücrelerinin susturulması, çocukluk koku tercihini değiştirdi", "en": "Silencing olfactory-bulb granule cells in mice changed a childhood scent preference"}, "publishedDate": "2026-07-29", "primary": {"kind": "paper", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003845", "publishedDate": "2026-07-14", "title": {"tr": "Olumlu erken yaşam koku anısı koku soğanında kökleniyor ve koku sisteminin ötesinde geniş ölçekli değişiklikleri tetikliyor", "en": "Positive early-life olfactory memory is rooted in the olfactory bulb and triggers large-scale changes beyond the olfactory system"}}}], "date": "2026-07-30"}, {"writer": "sci-03", "title": {"tr": "Demirle gübreleme için en az zarar veren yer Güney Okyanusu çıktı", "en": "The Southern Ocean comes out as the least damaging place to add iron"}, "excerpt": {"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde plankton kütlesi düşüyor, Güney Okyanusu'nda yükseliyor; karar bu farkta.", "en": "The same intervention runs in opposite directions in two oceans. In the equatorial Pacific plankton biomass falls, in the Southern Ocean it rises, and the decision lives in that difference."}, "sections": [{"h": {"tr": "İki bölge, ters yönde iki sonuç", "en": "Two regions, two opposite outcomes"}, "ps": [{"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde okyanus alanının yüzde 0,35'i gübrelendiğinde büyük zooplankton kütlesi en az yüzde 10 düşüyor. Güney Okyanusu'nda daha küçük bir alan, yüzde 0,2, gübrelendiğinde aynı kütle yüzde 10 artıyor.", "en": "The same intervention runs in opposite directions in two oceans. When 0.35 percent of the ocean area in the equatorial Pacific is fertilised, macrozooplankton biomass falls by at least 10 percent. When a smaller area in the Southern Ocean, 0.2 percent, is fertilised, that same biomass rises by 10 percent.", "refs": ["iron"]}, {"tr": "Karbon tarafındaki sayı ise şu: net uzaklaştırma 5,3 ppm'e, yani yılda 0,70 gigaton karbondioksite kadar çıkıyor. California Üniversitesi'nden Jun Yu, Adam Martiny ve arkadaşları bu değerleri altmış yılı aşkın gübreleme verisini kullanan bir bilgisayar modellemesinden çıkarıyor ve Güney Okyanusu'nun ekolojik bozulma ile karbon uzaklaştırması arasında en iyi dengeyi sunduğu sonucuna varıyor.", "en": "On the carbon side the number is this: net removal reaches up to 5.3 parts per million, that is 0.70 gigatonnes of carbon dioxide a year. Jun Yu, Adam Martiny and colleagues at the University of California derive these values from a computer model drawing on more than six decades of fertilisation data, and conclude that the Southern Ocean offers the best balance between ecological disturbance and carbon removal.", "refs": ["iron"]}]}, {"h": {"tr": "Farkı ne yapıyor", "en": "What makes the difference"}, "ps": [{"tr": "İki bölgenin ters yönde davranması, eklenen demirin karşılaştığı besin ağının ne yaptığına bağlı görünüyor: Güney Okyanusu'nda demir eksikliği üretimi sınırlayan asıl kısıt olduğu için eklenen demir üretimi yukarı çekiyor ve üstteki halkalara besin taşıyor, Ekvator Pasifiği'nde ise büyümenin yönü zooplanktonun beslendiği topluluğun bileşimini onun aleyhine değiştiriyor.", "en": "The opposite behaviour of the two regions appears to depend on what the food web meeting the added iron does with it: in the Southern Ocean, iron scarcity is the binding constraint on production, so added iron pulls production upward and carries food to the levels above, while in the equatorial Pacific the direction of growth shifts the composition of the community zooplankton feed on against them.", "refs": ["iron"]}, {"tr": "Bu bir çıkarım ve yanında başka açıklamalar da duruyor. Bölgesel sıralama, okyanusların gerçek davranışından çok her bölgenin modelin besin ağı parametrelerinde nasıl temsil edildiğinden de doğabilir; iki bölgenin plankton toplulukları modele farklı ayrıntı düzeyinde girmişse sıralama o ayrıntının izini taşır. Yazarların kendi uyarısı da bu yönde okunmalı: demirle gübrelemenin uzak etkileri var ve yerel her girişim doğası gereği yerel olmayan sonuçlar doğuruyor.", "en": "This is an inference, and other accounts stand beside it. The regional ranking could also arise less from how the oceans actually behave than from how each region is represented in the model's food-web parameters; if the plankton communities of the two regions entered the model at different levels of detail, the ranking carries the trace of that detail. The authors' own caution should be read in the same direction: ocean iron fertilisation has downstream effects, and any localised intervention inherently produces nonlocal consequences.", "refs": ["iron"]}]}, {"h": {"tr": "Elimizde olan kollar", "en": "The levers we actually hold"}, "ps": [{"tr": "Bu çalışmanın verdiği şey iki ayar düğmesidir: nerede ve ne kadar alanda. Güney Okyanusu'nda yüzde 0,2 ile plankton kütlesi yüzde 10 artıyor, Ekvator Pasifiği'nde yüzde 0,35 ile en az yüzde 10 düşüyor; yer seçimi tek başına sonucun işaretini çeviriyor. Bunun karşılığı sahada henüz sınanmadı. Elimizde bir modelleme çözümlemesi var ve bir saha denemesinin ilk işi, modelin zooplanktona dair öngörüsünün tuttuğunu ölçmek olur.", "en": "What this study hands over is two dials: where, and over how much area. In the Southern Ocean 0.2 percent makes plankton biomass rise by 10 percent, while in the equatorial Pacific 0.35 percent makes it fall by at least 10 percent; the choice of place alone flips the sign of the outcome. None of this has been tested at sea yet. What we hold is a modelling analysis, and the first job of any field trial would be to measure whether the model's prediction about zooplankton holds.", "refs": ["iron"]}]}], "sources": [{"key": "iron", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-oceans-australia-fertilize-carbon-dioxide.html", "title": {"tr": "Model çalışması, demirle gübreleme için Güney Okyanusu'nu Ekvator Pasifiği'nin önüne koyuyor", "en": "A modelling study puts the Southern Ocean ahead of the equatorial Pacific for iron fertilisation"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-04", "title": {"tr": "Tekrarsız bir döşemeyi silisyum nitrüre kazıdılar ve ışık bir ellilik kazandı", "en": "They etched an aperiodic tiling into silicon nitride and the light acquired a handedness"}, "excerpt": {"tr": "Matematikte 2022'de bulunan \"şapka\", sonsuz bir yüzeyi hiç tekrarlamadan kaplıyor. Tokyo'daki ekip onu ince filme oyunca kırınan lazer ışığı aynada bakışımsız çıktı.", "en": "The hat, found in mathematics in 2022, covers an infinite surface without ever repeating. When a team in Tokyo etched it into a thin film, the diffracted laser light came out mirror-asymmetric."}, "sections": [{"h": {"tr": "Döşemeden aygıta", "en": "From tiling to device"}, "ps": [{"tr": "\"Şapka\" döşemesini 2022'de amatör matematikçi David Smith buldu. Tek bir taş, sonsuz bir yüzeyi hiçbir örüntüyü tekrarlamadan kaplıyor; adı da Albert Einstein'dan gelmiyor, Almanca \"ein Stein\", yani \"tek taş\" ifadesinden geliyor. Yarım yüzyıldan uzun süredir açık duran bir soru böylece kapandı ve elde bir şekil kaldı: kendini asla tekrarlamayan bir kaplama kuralı.", "en": "The hat tile was found in 2022 by the amateur mathematician David Smith. A single stone covers an infinite surface without repeating any pattern, and its name does not come from Albert Einstein but from the German \"ein Stein\", that is, one stone. A question left open for more than half a century closed, and what remained in hand was a shape: a tiling rule that never repeats itself.", "refs": ["hat"]}, {"tr": "Tokyo Üniversitesi Endüstriyel Bilim Enstitüsü'ndeki ekip o kuralı bir aygıta çevirdi. Şapkanın biçimine dayanan örüntüyü silisyum nitrür ince filme oydular, üzerine lazer düşürdüler ve Bragg kırınımıyla çıkan ışığı okudular. Işık aynada bakışımsız geldi; yani bir ellilik taşıyordu. Baş yazar Yuto Moritake çıkış noktasını sade anlatıyor: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "en": "The team at the University of Tokyo's Institute of Industrial Science turned that rule into a device. They etched a pattern based on the hat's shape into a silicon nitride thin film, shone a laser onto it and read the light coming out of Bragg diffraction. The light arrived mirror-asymmetric, that is, carrying a handedness. Lead author Yuto Moritake states the starting point plainly: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "refs": ["hat"]}]}, {"h": {"tr": "Neden beklenmiyordu", "en": "Why that was not expected"}, "ps": [{"tr": "Kırınım normalde düzenli bir örgünün işidir: tekrar eden aralıklar, ışığı belirli açılara yönlendirir. Şapka döşemesinde tekrar yok, buna karşın çıkan ışıkta bir yön tercihi var; bu tercihin kaynağı, düzenli bir örgü yerine döşemenin kendi bakışımsızlığı görünüyor. Aynı ellilik, örüntünün filmin kenarlarında nasıl kesildiğinden de doğabilir; sonlu bir parçanın kenar seçimi de bakışımı bozar ve bunu ayırmak farklı kesimlerle aynı ölçümü yinelemeyi gerektirir.", "en": "Diffraction is normally the business of a regular lattice: repeating spacings steer light into particular angles. In the hat tiling there is no repetition, yet the emerging light shows a directional preference, and the source of that preference appears to be the tile's own asymmetry rather than a regular lattice. The same handedness could also arise from how the pattern was cut at the film's edges; the choice of boundary in a finite patch also breaks symmetry, and separating the two requires repeating the measurement with different cuts.", "refs": ["hat"]}, {"tr": "Kullanım tarafında ekip lazer ışığının kutuplanmasını denetlemeyi, haberleşmeyi ve kuantum şifrelemeyi sayıyor. Ortada bir aygıt yerine bir olgu duruyor: ince filme kazınmış bir örüntünün kırınan ışığa bir el kazand
