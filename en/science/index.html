-differences-undermine-ai.html", "title": {"tr": "Dört laboratuvar aynı katalizörü sınadı, model eğitiminde kullanılan ilişkiler kayboldu", "en": "Four laboratories tested the same catalyst and the relationships used to train models disappeared"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Catalysis", "url": "https://www.nature.com/articles/s41929-026-01559-y", "publishedDate": "2026-07-31", "title": {"tr": "Veriye dayalı modelleme için laboratuvarlar arası karşılaştırmalı sınamayla karbondioksit hidrojenlenmesinde katalizör etkinliği ve etkinlik yitiminde belirsizliğin niceliklendirilmesi", "en": "Quantifying uncertainty in catalyst activity and deactivation during CO2 hydrogenation via round-robin testing for data-driven modelling"}}}], "title": {"en": "Four laboratories, one catalyst, one vanished relationship", "tr": "Dört laboratuvar, tek katalizör, kaybolan bir ilişki"}, "writer": "sci-05", "date": "2026-08-04"}, {"excerpt": {"en": "The slow clicks of male sperm whales are the loudest communication sound measured in any mammal. We know the sound's decibels; we do not know what it is for. That distance is what this story is really about.", "tr": "Erkek ispermeçet balinalarının yavaş tıklamaları, bir memelide ölçülmüş en yüksek iletişim sesi. Sesin desibelini biliyoruz; ne için çıkarıldığını bilmiyoruz. Aradaki mesafe, bu haberin asıl konusu."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "What was measured", "tr": "Ölçülen"}, "ps": [{"en": "That a sound can travel 70 km through the open sea and still be heard at the end of it is hard to picture on a human scale, and the sound is made by an animal. An international team measured the slow clicks of male sperm whales using recording tags fixed with suction cups to whales in waters off the Seychelles, Sri Lanka, Norway and Scotland. According to the result in the Annals of the New York Academy of Sciences, source levels exceed 200 dB re 1 microPascal, the loudest communication sound measured in any mammal, with an estimated active space of about 70 km under typical deep-water conditions. These clicks are separate from the echolocation clicks the whales use to find prey.", "refs": ["balina"], "tr": "Bir sesin açık denizde 70 km yol alıp sonunda hâlâ duyulabilmesi insan ölçeğinde zor hayal ediliyor; üstelik o sesi çıkaran bir hayvan. Uluslararası bir ekip, Seyşeller, Sri Lanka, Norveç ve İskoçya sularında balinalara vantuzla tutturulan kaydedicilerle erkek ispermeçet balinalarının yavaş tıklamalarını ölçtü. Annals of the New York Academy of Sciences dergisindeki sonuca göre kaynak düzeyleri 1 mikropaskal başına 200 desibeli aşıyor; bu, herhangi bir memelide ölçülmüş en yüksek iletişim sesi ve derin suyun olağan koşullarında etkin erişim alanı yaklaşık 70 km. Bu tıklamalar, balinaların avlarını bulmak için kullandığı yankı bulma tıklamalarından ayrı."}, {"en": "As for what the sound is for, we have a proposal. A large male's large nose produces a lower-frequency click; if that holds, the sound could be a signal that announces body size in a way that cannot be faked. This is what biologists call honest advertisement: a declaration that is physically expensive to lie with. Peter Teglberg Madsen of the team defends the proposal while also setting its limit: the behavioural function of the clicks is not known, and how other whales respond to them is not known. What was measured is the sound; what is proposed is its meaning.", "refs": ["balina"], "tr": "Sesin ne işe yaradığına gelince, elimizde bir öneri var. Büyük bir erkeğin büyük burnu daha alçak frekanslı bir tıklama üretir; bu doğruysa ses, bedenin büyüklüğünü taklit edilemez biçimde ilan eden bir işaret olabilir. Biyologların dürüst reklam dediği şey budur: yalan söylemesi fiziksel olarak pahalı bir bildirim. Ekipten Peter Teglberg Madsen bu öneriyi savunurken sınırı da koyuyor: tıklamaların davranıştaki işlevi bilinmiyor ve diğer balinaların bunlara nasıl karşılık verdiği bilinmiyor. Yani ölçülen, sesin kendisi; önerilen, sesin anlamı."}]}, {"h": {"en": "The distance between measuring and understanding", "tr": "Ölçmek ile anlamak arasındaki mesafe"}, "ps": [{"en": "The gap between those two is more interesting than the result itself. With a device stuck to an animal's back we can pin down, in decibels, the intensity of a sound made out at sea; we cannot say what the same sound is for. Our ability to measure has outrun our ability to understand. The deflationary reading is waiting and deserves its due: perhaps these clicks are not a language in any sense, and the honest-signal interpretation is a familiar case of sexual selection, in which case what changes is only a loudness record for a sound on this planet. But even that reading does not close the same gap; it only says the gap is more ordinary.", "refs": ["balina"], "tr": "Bu ikisi arasındaki boşluk, sonucun kendisinden daha ilgi çekici. Bir hayvanın sırtına yapıştırılan bir aygıtla, denizde çıkarılan bir sesin şiddetini desibel ölçeğinde saptayabiliyoruz; aynı sesin ne için çıkarıldığını söyleyemiyoruz. Ölçme yeteneğimiz, anlama yeteneğimizi geride bıraktı. Sönümleyici okuma da hazır beklemektedir ve hakkı verilmelidir: belki bu tıklamalar hiçbir anlamda bir dil değildir, dürüst işaret yorumu da eşeysel seçilimin bildik bir örneğidir; o zaman değişen şey, yeryüzündeki bir sesin şiddet rekorundan ibaret kalır. Ama bu okuma bile aynı boşluğu kapatmıyor, yalnızca boşluğun daha sıradan olduğunu söylüyor."}, {"en": "Meanwhile one end of the gap is in our hands. Alongside factors we cannot change, such as temperature, salinity and depth, there is shipping noise; under heavy traffic the same signal's reach falls from 70 km to a few km. We do not yet know what the sound says; we do know that we can make it inaudible. Shipping routes, speed limits and noise measurements are numbers we write. For someone reading the news tonight, the real question is how willing we are to let a message we have not yet decoded be silenced before we have had time to decode it.", "refs": ["balina"], "tr": "Bu arada boşluğun bir ucu bizim elimizde. Sıcaklık, tuzluluk ve derinlik gibi değiştiremediğimiz etkenlerin yanında bir de gemi gürültüsü var; yoğun gemi trafiğinde aynı sinyalin erişimi 70 km'den birkaç km düzeyine iniyor. Bir sesin ne dediğini henüz bilmiyoruz; onu duyulmaz kılabildiğimizi ise biliyoruz. Gemi rotaları, hız sınırları ve gürültü ölçümleri bizim yazdığımız sayılardır. Bu gece haberi okuyan biri için asıl soru, henüz çözemediğimiz bir bildirimin çözmeye vaktimiz olmadan susturulmasına ne kadar razı olduğumuzdur."}]}], "sources": [{"key": "balina", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-male-sperm-whales-loudest-communication.html", "title": {"tr": "Erkek ispermeçet balinalarının yavaş tıklamaları 200 desibeli aşıyor", "en": "Male sperm whales' slow clicks exceed 200 decibels"}, "publishedDate": "2026-08-03"}], "title": {"en": "A sound that carries seventy kilometres, and we do not know what it says", "tr": "Yetmiş kilometre giden bir ses; ne dediğini bilmiyoruz"}, "writer": "sci-06", "date": "2026-08-04"}, {"excerpt": {"en": "Three small moons and a set of rings returned a spectrum with clay in it and no water ice. Both halves of that result matter, and the second is the stranger one.", "tr": "Üç küçük uydu ve bir halka takımı, içinde kil bulunan, su buzu bulunmayan bir tayf verdi. Sonucun iki yarısı da önemli; asıl tuhaf olanı ikincisi."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "Two pieces of news in one spectrum", "tr": "Tayfın içindeki iki haber"}, "ps": [{"en": "The James Webb Space Telescope looked at three of Neptune's inner moons and at its rings in the near infrared, and magnesium-rich phyllosilicates — clay minerals — turned up on Larissa, on Galatea and in the rings. Those minerals had never been seen on the surface of anything in the solar system beyond Jupiter. The work, led by Ryleigh Davis, appeared on 29 July in Science Advances.", "refs": ["neptun-uydulari"], "tr": "James Webb Uzay Teleskobu, Neptün'ün üç iç uydusuna ve halkalarına yakın kızılötesinde baktı; Larissa, Galatea ve halkalarda magnezyumca zengin filosilikatların, yani kil minerallerinin izi çıktı. Bu mineraller Güneş Sistemi'nde Jüpiter'in ötesinde bugüne dek hiçbir cismin yüzeyinde görülmemişti. Ryleigh Davis'in yönettiği çalışma 29 Temmuz'da Science Advances dergisinde yayımlandı."}, {"en": "The second piece of news in the same spectrum is an absence. No water ice was detected on any of the three moons or in the rings. That far from the Sun, in a region where nearly everything around them is icy, a surface without ice is a situation that demands an explanation, and the team calls it surprising. Finding clay is a discovery; failing to find ice is a puzzle.", "refs": ["neptun-uydulari"], "tr": "Aynı tayfın ikinci haberi bir yokluk. Üç uydunun ve halkaların hiçbirinde su buzu saptanmadı. Güneş'ten bu kadar uzakta, çevresindeki hemen her şeyin buzlu olduğu bir bölgede, buzsuz bir yüzey açıklama bekleyen bir durumdur; ekip de bunu şaşırtıcı buluyor. Kil bulmak bir keşif, buz bulamamak ise bir bilmece."}]}, {"h": {"en": "What clay requires", "tr": "Kil neyi gerektirir"}, "ps": [{"en": "Phyllosilicates do not form without liquid water, and forming them takes prolonged heating. The most likely address for such an environment is deep inside a large icy body, where radioactive decay and other sources melt its ice. The reading that follows is this: Neptune's inner moons today may have gathered from the wreckage of an older moon system broken apart when Triton was captured, and the clay may have been carried up from inside those older bodies.", "refs": ["neptun-uydulari"], "tr": "Filosilikatlar sıvı su olmadan oluşmaz ve oluşmaları için uzun süreli bir ısınma gerekir. Böyle bir ortamın en olası adresi, radyoaktif bozunmanın ve başka kaynakların buzunu erittiği büyük bir buzlu cismin derinliğidir. Buradan çıkan okuma şu: Neptün'ün bugünkü iç uyduları, Triton yakalanırken parçalanan daha eski bir uydu düzeninin enkazından toparlanmış olabilir; kil de o eski cisimlerin iç kısmından yüzeye taşınmış olabilir."}, {"en": "That reading is not the only option, and the team does not present it as one. A Pluto-sized dwarf planet torn apart by tides as it passed close to Neptune could have left the same minerals. The absence of clay on Proteus, the largest of the three, can be read two ways as well: either it gathered from a clay-poor part of the debris, or it was later heated enough to destroy those minerals. The spectrum does not say which story is right. It says which material any story now has to account for.", "refs": ["neptun-uydulari"], "tr": "Bu okuma tek seçenek değil ve ekip de tek seçenek olduğunu söylemiyor. Neptün'ün yakınından geçerken gelgit kuvvetleriyle parçalanmış, Plüton büyüklüğünde bir cüce gezegen de aynı mineralleri bırakabilirdi. Üçünün en büyüğü olan Proteus'ta kil bulunmaması da iki yönde okunabilir: ya enkazın kilce yoksul bir bölümünden toparlandı ya da sonradan bu mineralleri yok edecek kadar ısındı. Tayf, hangi hikâyenin doğru olduğunu değil, hikâyenin hangi maddeyi açıklamak zorunda olduğunu söylüyor."}]}, {"h": {"en": "The gap the measurement leaves", "tr": "Ölçümün bıraktığı boşluk"}, "ps": [{"en": "The team also sees a hydrated mineral on all three moons and in the rings that it cannot name. Identifying it, Davis says, will require fresh laboratory measurements under outer solar system conditions — technically difficult but doable. This is a good example of an observation able to describe its own gap: the question to ask is clear, and so is where the answer would come from.", "refs": ["neptun-uydulari"], "tr": "Ekip, üç uydunun ve halkaların hepsinde sulu bir mineral daha görüyor ve bu mineralin ne olduğunu söyleyemiyor. Davis'e göre onu tanımlamak, dış Güneş Sistemi koşullarında yapılacak yeni laboratuvar ölçümleri isteyecek; teknik olarak zor ama yapılabilir bir iş. Bu, bir gözlemin kendi eksiğini tarif edebilmesinin iyi bir örneği: hangi sorunun sorulacağı belli, cevabın nereden geleceği de."}, {"en": "What remains is the scale of the thing. Neptune has been approached once in human history, by Voyager 2 in 1989, and everything we hold today is the product of that single pass and of telescopes looking from a distance. Davis says a spacecraft dedicated to an ice giant is the obvious next step, that such missions ranked high on the most recent planetary science priority list, and that they take decades to develop. The clay has shown us the inside of another world. Reading it properly will mean going there, and that may not be the work of the generation that took the spectrum.", "refs": ["neptun-uydulari"], "tr": "Geriye ölçeğin kendisi kalıyor. Neptün'e insanlık tarihinde yalnızca bir kez, 1989'da Voyager 2'yle yaklaşıldı; bugün elimizdeki her şey, o tek geçişin ve uzaktan bakan teleskopların ürünü. Davis, buz devi bir gezegene adanmış bir aracın açık bir sonraki adım olduğunu, böyle görevlerin en son gezegen bilimi öncelik listesinde üst sırada sayıldığını, ama geliştirilmelerinin on yıllar aldığını söylüyor. Kil, bize başka bir dünyanın içini gösterdi. Onu gerçekten okumak için oraya gitmemiz gerekecek ve bu, tayfı alan kuşağın işi olmayabilir."}]}], "sources": [{"key": "neptun-uydulari", "kind": "news", "name": "Space.com", "url": "https://www.space.com/astronomy/neptune/3-moons-of-neptune-may-be-remnants-of-ice-worlds-shattered-in-a-catastrophic-crash", "title": {"tr": "Neptün'ün iç uydularında kil var, su buzu hiç yok", "en": "Clay on Neptune's inner moons, and no water ice at all"}, "publishedDate": "2026-08-03"}], "title": {"en": "Clay where there should have been ice", "tr": "Buz olması gereken yerde kil"}, "writer": "sci-01", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "England's family-history rule sends 1.4 per cent of women under 50 for risk assessment and reaches 4.4 per cent of the breast cancers that follow within ten years. Widening it works, and the cost of widening it is the whole argument.", "tr": "İngiltere'nin aile öyküsü kuralı, 50 yaş altı kadınların yüzde 1,4'ünü risk değerlendirmesine gönderiyor ve on yıl içinde ortaya çıkan meme kanserlerinin yüzde 4,4'üne ulaşıyor. Kuralı genişletmek işe yarıyor; asıl tartışma da bu genişlemenin bedeli."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "Two ratios", "tr": "İki oran"}, "ps": [{"en": "The analysis, from teams in Cambridge and London, sets two numbers side by side. The NICE family-history criteria used in primary care refer 1.4 per cent of women under 50 for further assessment, and that group contains 4.4 per cent of the women who will develop breast cancer within ten years. The full BOADICEA model, which adds reproductive history, lifestyle factors and a polygenic risk score to family history, refers 26.5 per cent and contains 34.8 per cent. The analysis rests on 1,258 women recruited to the Generations Study between 2004 and 2011, 392 of whom developed breast cancer, weighted to the national population by age and family history.", "refs": ["meme-kanseri-riski"], "tr": "Cambridge ve Londra'daki ekiplerin çözümlemesi iki sayıyı yan yana koyuyor. Birinci basamakta kullanılan NICE aile öyküsü ölçütleri, 50 yaş altı kadınların yüzde 1,4'ünü ileri değerlendirmeye yönlendiriyor ve bu grup, on yıl içinde meme kanseri gelişecek kadınların yüzde 4,4'ünü kapsıyor. Aile öyküsünün yanına üreme geçmişini, yaşam biçimi etkenlerini ve poligenik risk puanını ekleyen tam BOADICEA modeli ise yüzde 26,5'ini yönlendiriyor ve yüzde 34,8'ini kapsıyor. Çözümleme, 2004–2011 arasında Generations Study'ye alınmış, 392'sinde meme kanseri gelişen 1.258 kadına dayanıyor ve örnek, yaş ile aile öyküsü bakımından ülke nüfusuna göre ağırlıklandırıldı."}, {"en": "Where that gap comes from is shown too. Of the women under 50 that the model places above population-level risk, 73 per cent have no family history of breast cancer. Restricting assessment to women who do have a family history cuts the share of cancers BOADICEA captures from 34.8 per cent to 15.7 per cent, roughly by half. Removing the polygenic score also lowers sensitivity substantially when all women are assessed. The gain, in other words, does not come from the model reading family history better. It comes from the model looking outside family history.", "refs": ["meme-kanseri-riski"], "tr": "Farkın nereden geldiği de gösteriliyor. Modelin yüksek riskli saydığı 50 yaş altı kadınların yüzde 73'ünde meme kanseri aile öyküsü yok. Değerlendirmeyi yalnızca aile öyküsü olanlarla sınırlamak, BOADICEA'nın yakaladığı kanser oranını yüzde 34,8'den yüzde 15,7'ye, yani neredeyse yarıya düşürüyor. Poligenik puanı çıkarmak da tüm kadınlar değerlendirildiğinde duyarlılığı belirgin biçimde azaltıyor. Yani aradaki kazanç, modelin daha iyi bir aile öyküsü okuması olmasından değil, aile öyküsünün dışına çıkmasından geliyor."}]}, {"h": {"en": "Who is left out", "tr": "Kimin dışarıda kaldığı"}, "ps": [{"en": "Which women these results apply to matters as much as the results. Only White women were included in the analysis, and the authors say separate work is needed for other races and ethnicities, pointing to a recent ethnicity-adapted version of BOADICEA for that purpose. Mammographic density and rare pathogenic variants were not in the dataset, and the comparison used a single risk model. In the 1.5 per cent slice with a strong family history the numbers are small, so the finding about removing the polygenic score in that group has to be read with caution.", "refs": ["meme-kanseri-riski"], "tr": "Bu sonuçların hangi kadınlar için geçerli olduğu, sonuçların kendisi kadar önemli. Çözümlemeye yalnızca beyaz kadınlar alındı; yazarlar da başka etnik kökenler için ayrı çalışmalar gerektiğini, BOADICEA'nın etnik kökene uyarlanmış yeni bir sürümünün bu iş için kullanılabileceğini söylüyor. Meme yoğunluğu ve ender patojenik varyant verisi kümede yoktu ve karşılaştırma tek bir risk modeliyle yapıldı. Güçlü aile öyküsü olan yüzde 1,5'lik kesitte sayılar küçük kaldığı için, bu grupta poligenik puanın çıkarılmasına ilişkin sonuç temkinle okunmalı."}, {"en": "There is one more assumption, and the authors note it plainly: everyone eligible for assessment was assumed to accept it. In the only published UK study offering breast cancer risk assessment in primary care, uptake reached 16.1 per cent. Lower uptake, the authors say, does not change how many women must be assessed to find one, but it lowers the sensitivity of every strategy proportionately, so BOADICEA's relative advantage holds while the absolute gain shrinks. The 34.8 per cent on paper means a fraction of that in practice.", "refs": ["meme-kanseri-riski"], "tr": "Bir varsayım daha var ve yazarlar bunu da açıkça yazıyor: değerlendirmeye hakkı olan herkesin değerlendirmeyi kabul ettiği varsayıldı. Birinci basamakta meme kanseri risk değerlendirmesi sunan, yayımlanmış tek Britanya çalışmasında katılım yüzde 16,1'de kalmıştı. Yazarlara göre düşük katılım, bir kadını bulmak için kaç kişinin değerlendirilmesi gerektiğini değiştirmiyor ama tüm yolların duyarlılığını orantılı biçimde düşürüyor; yani BOADICEA'nın göreli üstünlüğü sürer, mutlak kazanç küçülür. Kâğıt üzerindeki yüzde 34,8, sahada bunun bir kesri demektir."}]}, {"h": {"en": "The capacity question", "tr": "Kapasite sorusu"}, "ps": [{"en": "The cost of widening can be put in numbers. On the full BOADICEA route, 26.5 per cent of women under 50 would be referred to secondary care or to genetics services. The authors note that this means a serious load on both general-practice workflows and genetics service capacity. Because comprehensive risk assessment requires verified family history and genetic data, the time it takes per woman is not short either. What the current rule prefers is a small referral burden, at the price of missing most of the cancers.", "refs": ["meme-kanseri-riski"], "tr": "Genişletmenin bedeli sayıya dökülebiliyor. Tam BOADICEA yolunda 50 yaş altı kadınların yüzde 26,5'i ikinci basamağa ya da genetik birimlerine yönlendirilecek. Yazarlar bunun hem aile hekimliği iş akışları hem de genetik hizmet kapasitesi için ciddi bir yük anlamına geldiğini belirtiyor. Kapsamlı bir risk değerlendirmesi, aile öyküsünün doğrulanmasını ve genetik veriyi gerektirdiği için, kadın başına ayrılan süre de kısa değil. Şu anki kuralın tercih ettiği şey, kanserlerin çoğunu kaçırma pahasına küçük bir yönlendirme yükü."}, {"en": "The useful statement to take from this work is a measurement rather than a recommendation: family history is a weak filter for finding risk under 50, and the size of that weakness is now known in numbers. Where the next piece of information comes from is clear as well. An implementation study in primary care, measuring real uptake and what protection referred women can actually reach afterwards, would show how much of these percentages arrives at the patient. Until that measurement exists, 34.8 per cent is the opening of a capacity argument, not its conclusion.", "refs": ["meme-kanseri-riski"], "tr": "Bu çalışmadan çıkarılabilecek yararlı ifade, bir öneri değil bir ölçüm: aile öyküsü, 50 yaş altında riski bulmak için zayıf bir eleme aracı ve zayıflığının büyüklüğü artık sayıyla biliniyor. Bir sonraki bilgi de nereden geleceği belli. Birinci basamakta yürütülecek, gerçek katılım oranını ve yönlendirilen kadınların sonrasında hangi korumaya erişebildiğini ölçen bir uygulama çalışması, buradaki yüzdelerin ne kadarının hastaya ulaştığını gösterecek. O ölçüm gelmeden, yüzde 34,8 bir kapasite tartışmasının başlangıcıdır, sonucu değil."}]}], "sources": [{"key": "meme-kanseri-riski", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-nice-referral-criteria-women-breast.html", "title": {"tr": "Aile öyküsüne dayalı yönlendirme, sonraki meme kanserlerinin yüzde 4,4'ünü buluyor", "en": "Family-history referral reaches 4.4 per cent of the breast cancers that follow"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "British Journal of Cancer", "url": "https://www.nature.com/articles/s41416-026-03547-2", "publishedDate": "2026-08-04", "title": {"tr": "50 yaş altı kadınlarda birinci basamakta meme kanseri risk değerlendirmesi ve yönlendirmesi için NICE ölçütleri ile BOADICEA çok etkenli risk modelinin karşılaştırılması", "en": "Comparison of NICE criteria with the BOADICEA multifactorial risk model to guide breast cancer risk assessment and referral amongst women under age 50 within primary care"}}}], "title": {"en": "Referral finds one woman in seventy, and most cancers sit outside that group", "tr": "Yönlendirme yetmiş kadından birini buluyor, kanserlerin çoğu o kümenin dışında"}, "writer": "sci-02", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Southern England had 1.5 millimetres of rain in July, two per cent of normal. What a crusted soil does with the rain when it returns is the next number that matters.", "tr": "Güney İngiltere'ye temmuzda 1,5 milimetre yağmur düştü; normalin yüzde ikisi. Bundan sonra önemli olan sayı ise açığın kendisi değil, kabuk bağlamış toprağın geri gelen yağmurla ne yapacağı."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "What was measured", "tr": "Ölçülen"}, "ps": [{"en": "England and Wales have come through their driest July in 190 years. Southern England averaged 1.5 millimetres of rain across the month, 2 per cent of the 1991–2020 average, while mean temperatures ran 3.2°C above normal for the time of year. According to provisional Met Office figures, at least 20 stations measured no rainfall at all through July, a first in their measurement history.", "refs": ["kuraklik-temmuz"], "tr": "İngiltere ve Galler, 190 yılın en kurak temmuzunu geride bıraktı. Güney İngiltere'de ay boyunca ortalama 1,5 milimetre yağış düştü; bu, 1991–2020 ortalamasının yüzde 2'si. Ortalama sıcaklıklar aynı dönemde mevsim normalinin 3,2 derece üzerindeydi. Met Office'in geçici verilerine göre en az 20 istasyonda temmuz boyunca hiç yağış ölçülmedi ve bu, o istasyonların ölçüm tarihinde ilk."}, {"en": "Looking at individual stations is necessary to read that statement correctly. The station at Kew Gardens has been measuring since 1871, Heathrow since 1948, and local measurement around Reading since 1858; the 42-day dry run at Heathrow is a first for that site. Series of different lengths put different weight on the same sentence: a first since 1858 is not the same claim as a first since 1948, even when both are worth noting.", "refs": ["kuraklik-temmuz"], "tr": "Tek tek istasyonlara bakmak, bu ifadeyi doğru okumak için gerekli. Kew Gardens'daki istasyon 1871'den, Heathrow 1948'den, Reading çevresindeki yerel ölçümler 1858'den bu yana sürüyor; Heathrow'daki 42 günlük yağışsız dizi de o istasyon için bir ilk. Farklı uzunluktaki ölçüm dizileri, aynı cümleye farklı ağırlıklar yükler: 1858'den beri ilk olmak ile 1948'den beri ilk olmak aynı iddia değildir, ikisi de dikkate değer olsa bile."}, {"en": "The drought has now spread beyond the farming basin. More than half of England and all of Wales are officially in drought. Across the continent water is thinning out as a production input too: low levels on the Danube have forced nuclear reactors offline in Hungary and Romania, and low water on the Rhine has curtailed shipping. The first bill for a rainfall deficit is paid by farmers, the second by electricity generators, and the third by everyone who moves cargo on a river.", "refs": ["kuraklik-temmuz"], "tr": "Kuraklık artık tarım havzasının dışına taşmış durumda. İngiltere'nin yarısından fazlası ile Galler'in tamamı resmen kurak ilan edildi. Kıtada da su bir üretim girdisi olarak eksiliyor: Tuna'daki düşük seviye Macaristan ve Romanya'da nükleer reaktörlerin durdurulmasına yol açtı, Ren'deki düşük su ise gemi taşımacılığını kısıtladı. Yağış açığının ilk faturasını çiftçi öder, ikincisini elektrik üreticisi, üçüncüsünü de yükünü nehirden taşıyan herkes."}]}, {"h": {"en": "When the rain returns", "tr": "Yağmur döndüğünde"}, "ps": [{"en": "Jeff Da Costa at the University of Reading warns that the risk of severe flash flooding is now substantial, because soils are crusted and reservoirs stressed. The mechanism is simple and unforgiving: a surface baked dry for long enough loses its rate of taking water in, so the same rain sits on top of the soil instead of entering it. The rainfall that ends the drought can do damage faster than the drought did. Nor, Da Costa says, should a day or two of rain be expected to solve it.", "refs": ["kuraklik-temmuz"], "tr": "Reading Üniversitesi'nden Jeff Da Costa, toprakların kabuk bağladığını ve barajların zorlandığını söyleyerek şiddetli ani sel riskinin artık çok ciddi olduğu uyarısını yapıyor. Mekanizma basit ve acımasız: uzun süre kurumuş bir yüzey suyu içine alma hızını yitirir, aynı yağmur toprağa değil yüzeye biner. Kuraklığın sonunu getirecek olan yağış, kuraklığın kendisinden daha hızlı zarar verebilir. Da Costa'ya göre bir iki günlük yağmurun sorunu çözmesi de beklenmemeli."}, {"en": "Who holds which lever becomes clear here. Reservoir operators and water companies manage storage, while drainage infrastructure was sized for a different distribution of rainfall and cannot be changed quickly. The farmers warning of crop shortages and the people living where flash floods pass stand at two ends of the same event. Drought looks like a shortage. Water's distribution through time is the central problem, and infrastructure was built for the old spread.", "refs": ["kuraklik-temmuz"], "tr": "Kolun ucunda kim var sorusu burada netleşiyor. Baraj işletmecileri ve su şirketleri depolamayı yönetiyor; drenaj altyapısı ise başka bir yağış dağılımına göre boyutlandırılmış durumda ve kısa sürede değiştirilemez. Ekin kıtlığı uyarısı yapan çiftçiler ile ani selin geçtiği yerlerde yaşayanlar aynı olayın iki ayrı ucunda duruyor. Kuraklık bir eksiklik gibi görünür, oysa asıl sorun suyun toplam miktarı değil zaman içindeki dağılımıdır ve altyapı o dağılıma göre kurulmuştur."}, {"en": "Two things are worth watching. The first is whether the count of stations measuring zero stays at 20 once the Met Office firms up its provisional figures. The second, and the more important, is how river flows behave after the first substantial rain: if the same amount of rainfall produces a far sharper rise in flow than in past years, the reduced capacity of the soil to take water in stops being an assumption and becomes a measured climate quantity.", "refs": ["kuraklik-temmuz"], "tr": "İzlenecek iki şey var. Birincisi, Met Office'in geçici sayıları kesinleştirdiğinde sıfır yağış ölçen istasyon sayısının 20'de kalıp kalmayacağı. İkincisi ve daha önemlisi, ilk belirgin yağmurun ardından akarsu debilerinin nasıl davranacağı: eğer aynı miktar yağış geçmiş yıllara göre çok daha keskin bir debi artışı üretiyorsa, toprağın su alma kapasitesindeki kayıp bir varsayım olmaktan çıkıp ölçülmüş bir iklim büyüklüğü hâline gelir."}]}], "sources": [{"key": "kuraklik-temmuz", "kind": "news", "name": "New Scientist", "url": "https://www.newscientist.com/article/2583057-parts-of-the-uk-endure-first-ever-month-without-any-rain", "title": {"tr": "Yirmi Britanya istasyonunda temmuz boyunca hiç yağmur ölçülmedi", "en": "Twenty UK weather stations measured no rain at all through July"}, "publishedDate": "2026-08-04"}], "title": {"en": "At Kew the July gauge stayed empty for the first time since 1871", "tr": "Kew'de yağmur ölçer temmuz boyunca boş kaldı, 1871'den bu yana ilk kez"}, "writer": "sci-03", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "grafify online wraps three well-known R packages in a browser interface. What makes it worth reading is the boundary its author draws around it, more than the work it performs.", "tr": "grafify online, iyi bilinen üç R paketini tarayıcıdaki bir arayüzle sarmalıyor. Okumaya değer kılan da yaptığı işten çok, yazarın çevresine çizdiği sınır."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "What was built", "tr": "Ne inşa edildi"}, "ps": [{"en": "grafify online, written by Avinash R. Shenoy at Imperial College London, is an interface built in R on the Shiny framework. Three familiar packages sit underneath it: ggplot2 for graphics, lme4 for mixed-effects models, and emmeans for post-hoc comparisons with false-discovery-rate correction. It draws box, violin, bar, point-and-error, before-after, histogram, density and numeric XY plots, and fits linear models, mixed-effects models, t-tests and analyses of variance. It invents no new method. It puts existing methods within reach of someone who does not write the code that calls them.", "refs": ["grafify"], "tr": "Imperial College London'dan Avinash R. Shenoy'un yazdığı grafify online, R diliyle ve Shiny çatısıyla kurulmuş bir arayüz. Altında üç tanıdık paket var: grafikler için ggplot2, karma etkili modeller için lme4, ardıl karşılaştırmalar için de yanlış keşif oranı düzeltmesi uygulayan emmeans. Uygulama kutu, keman, çubuk, nokta-hata, önce-sonra, sıklık, yoğunluk ve sayısal XY grafikleri çiziyor; doğrusal modeller, karma etkili modeller, t sınamaları ve varyans çözümlemesi kurabiliyor. Yeni bir yöntem üretmiyor; var olan yöntemleri, onları çağıran kodu yazmayan birinin erişimine açıyor."}, {"en": "How it is distributed is more interesting than the tool itself. There is a hosted web app; the code sits on GitHub and is archived on Zenodo; and a standalone Windows program is offered. The notable option is the third one: a serverless browser build compiled to WebAssembly through Shinylive. In that build the computation runs on the user's own machine and the data goes to no server at all. For anyone working with unpublished clinical or field data, that is not a convenience. It decides whether the tool can be used.", "refs": ["grafify"], "tr": "Dağıtım biçimi, aracın kendisinden daha ilginç. Barındırılan bir web uygulaması var; kod GitHub'da duruyor ve Zenodo'da arşivlendi; ayrıca bağımsız bir Windows programı sunuluyor. Asıl dikkat çekici olan dördüncü değil üçüncü seçenek: Shinylive ile WebAssembly'ye derlenmiş, sunucusuz bir tarayıcı sürümü. Bu sürümde hesaplama kullanıcının makinesinde çalışır, veri hiçbir sunucuya gitmez. Yayımlanmamış hasta ya da alan verisiyle çalışan biri için bu, bir kolaylık değil, aracın kullanılabilir olup olmamasını belirleyen koşuldur."}]}, {"h": {"en": "The ceiling", "tr": "Sınır"}, "ps": [{"en": "Shenoy writes plainly in the paper where the tool stops: up to two fixed and two random factors, and random-intercept models only. Anyone with a more complex design has to go back to the underlying R package. A tool stating its own ceiling this clearly is a design decision rather than a technical footnote: the option that is absent from the menu also keeps a user from fitting the wrong model.", "refs": ["grafify"], "tr": "Shenoy, aracın nerede durduğunu makalede açıkça yazıyor: en çok iki sabit ve iki rastgele etken, yalnızca rastgele kesişimli modeller. Daha karmaşık bir tasarımı olan, altta yatan R paketine dönmek zorunda. Bir aracın kendi tavanını bu netlikte söylemesi, teknik bir ayrıntı değil tasarım kararıdır: menüde bulunmayan seçenek, kullanıcıyı yanlış modeli kurmaktan da alıkoyar."}, {"en": "What it removes and what it does not are separate, though. A mixed-effects model appearing in a menu does not say that the model fits the data; deciding which factor is fixed and which is random is still the user's job, and the interface does not ask that question, it only carries out the answer. Removing the barrier of writing code does not remove the obligation to understand the design. The tool's honesty lies in not confusing the two.", "refs": ["grafify"], "tr": "Bununla birlikte, kaldırdığı iş ile kaldırmadığı iş ayrı. Bir menüde karma etkili modelin bulunması, o modelin veriye uygun olduğunu söylemez; hangi etkenin sabit hangisinin rastgele olduğuna karar vermek hâlâ kullanıcının işi ve arayüz bu kararı sormaz, yalnızca uygular. Kod yazma engelini kaldırmak, tasarımı anlama yükümlülüğünü kaldırmıyor. Aracın dürüstlüğü, bu iki şeyi karıştırmamasında."}]}, {"h": {"en": "Who can rebuild it", "tr": "Kim yeniden kurabilir"}, "ps": [{"en": "Open source code and a Zenodo archive together mean an analysis can be rebuilt years later. When the version running underneath can be known, the question of how a figure was produced has a durable answer. The same cannot be said of a hosted service that updates quietly and cannot hand back its old behaviour. The archive secures not the tool but the results made with it.", "refs": ["grafify"], "tr": "Açık kaynak kodu ve Zenodo arşivi birlikte, bir çözümlemenin yıllar sonra da yeniden kurulabilmesi anlamına geliyor. Altta çalışan sürüm bilinebilir olduğunda, bir grafiğin nasıl üretildiği sorusunun cevabı kalıcıdır. Sessizce güncellenen ve eski davranışını geri veremeyen barındırılan bir hizmet için aynı şey söylenemez. Arşiv, aracın kendisine değil, onunla üretilmiş sonuçlara güvenceyi sağlıyor."}, {"en": "The signal to watch follows from that. Whether published methods sections cite grafify online with an archived version number or only by name is a separate question from whether the tool works. If the number is there, the open code and the archive have turned into a real guarantee. If only the name is there, one more box that runs in a browser has been added, and what turns inside it remains unknown.", "refs": ["grafify"], "tr": "İzlenecek işaret de buradan çıkıyor. Yayımlanan makalelerin yöntem bölümlerinde grafify online'ın arşivlenmiş bir sürüm numarasıyla mı yoksa yalnızca adıyla mı anılacağı, aracın işe yarayıp yaramadığından ayrı bir soru. Numarayla anılıyorsa, açık kod ve arşiv gerçekten bir güvenceye dönüşmüş olur; yalnızca adla anılıyorsa, tarayıcıda çalışan bir kutu daha eklenmiş olur ve içinde ne döndüğü yine bilinmez."}]}], "sources": [{"key": "grafify", "kind": "news", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003909", "title": {"tr": "Kod yazmayan araştırmacılar için açık kaynaklı bir istatistik uygulaması", "en": "An open statistics app for researchers who do not write code"}, "publishedDate": "2026-08-03"}], "title": {"en": "Two fixed factors, two random: a tool that states its own ceiling", "tr": "İki sabit, iki rastgele etken: tavanını kendi söyleyen bir araç"}, "writer": "sci-04", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "A number reported as a three per cent hit to solar generation carries a standard deviation larger than itself. That does not make it wrong. It changes what can be said with it.", "tr": "Güneş üretiminde yüzde üçlük bir darbe olarak aktarılan sayı, kendisinden büyük bir standart sapma taşıyor. Bu, sayıyı yanlış yapmıyor; onunla ne söylenebileceğini değiştiriyor."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The number reported and the number in the paper", "tr": "Aktarılan sayı ve makaledeki sayı"}, "ps": [{"en": "As reported, smoke from Canada's 2023 fires cut solar generation across North America and Europe by 3 per cent at a cost approaching two billion dollars, with North America losing 711 million dollars and Europe about 1.17 billion dollars. The paper's own abstract gives the same quantities like this: a modelled May–September production deficit of 6.38 terawatt hours with one standard deviation of 8.86 terawatt hours, equal to 2.8 per cent of five-month generation; an economic deficit of 1.88 billion dollars with one standard deviation of 2.71 billion dollars; a carbon burden of 2.083 megatons of carbon dioxide with one standard deviation of 2.656 megatons.", "refs": ["duman-gunes"], "tr": "Habere göre 2023 Kanada yangınlarının dumanı, Kuzey Amerika ve Avrupa'da güneş elektriği üretimini yüzde 3 düşürdü ve bunun bedeli iki milyar dolara yaklaştı; Kuzey Amerika 711 milyon dolar, Avrupa ise yaklaşık 1,17 milyar dolar yitirdi. Makalenin kendi özetinde ise aynı büyüklükler şöyle veriliyor: mayıs–eylül arası modellenen üretim açığı 6,38 teravatsaat, tek standart sapma 8,86 teravatsaat; beş aylık üretimin yüzde 2,8'i; parasal açık 1,88 milyar dolar, tek standart sapma 2,71 milyar dolar; karbon yükü 2,083 megaton karbondioksit, tek standart sapma 2,656 megaton."}, {"en": "When an estimate's standard deviation exceeds its central value, the plausible range of that distribution includes zero and also includes a loss twice the headline. This does not mean the study is flawed; the point estimate is still the best single number available, and the authors put the uncertainty in the opening lines of the abstract rather than hiding it. What it means is that a sentence reporting that it cost two billion dollars claims more precision than the ± sign can carry. The accurate sentence gives the order of magnitude of the loss, not its decimal place.", "refs": ["duman-gunes"], "tr": "Bir tahminin standart sapması merkezî değerinden büyükse, o dağılımın makul aralığı sıfırı da içerir, manşetin iki katı bir kaybı da. Bu, çalışmanın kusurlu olduğu anlamına gelmez; nokta tahmin hâlâ eldeki en iyi tek sayıdır ve yazarlar belirsizliği gizlemek yerine özetin ilk cümlelerine koymuştur. Anlamı şudur: iki milyar dolara mal olduğunu bildiren bir cümle, ± işaretinin taşıyabileceğinden daha fazla kesinlik iddia eder. Doğru cümle, kaybın büyüklük derecesini verir, ondalığını değil."}]}, {"h": {"en": "Where the spread comes from", "tr": "Yayılım nereden geliyor"}, "ps": [{"en": "The estimate does not come from comparing metered generation with a smoke-free counterfactual. It comes from the output of an Earth system model. The chain is long: aerosol emissions, then radiative and temperature anomalies, then photovoltaic output, then electricity price, then dollars. Each link adds its own uncertainty, and the last is the most fragile, because price is a variable of the market rather than of the model. The authors' calculation also allows for the smoke's cooling effect raising panel efficiency and so offsetting part of the loss, which makes the result the difference between two opposing effects, and differences carry more uncertainty than their components.", "refs": ["duman-gunes"], "tr": "Tahmin, sayaçtan okunan üretim ile dumansız bir karşı olgunun karşılaştırılmasından değil, bir yer sistemi modelinin çıktısından geliyor. Zincir uzun: aerosol salımı, ışınım ve sıcaklık sapması, fotovoltaik üretim, elektrik fiyatı, dolar. Her halka kendi belirsizliğini ekler ve sonuncusu en kırılganıdır, çünkü fiyat modelin değil piyasanın değişkenidir. Yazarların hesabı, dumanın soğutma etkisinin panel verimini artırarak kaybı kısmen dengelemesini de içeriyor; yani sonuç iki karşıt etkinin farkı, ve farkların belirsizliği bileşenlerinkinden büyük olur."}, {"en": "The spread may arise in two ways, and they lead to very different conclusions. If it comes largely from the model's internal variability, a larger ensemble narrows the band and a sharper number is reached in time. If it is structural — dependent on how the optical properties of the aerosol, the cloud interactions or the panel-efficiency relation are set up — then more runs will not narrow anything; they will only draw the same uncertainty as a smoother curve. The single standard deviation given in the abstract does not separate those two cases.", "refs": ["duman-gunes"], "tr": "Yayılımın kaynağı iki türlü olabilir ve ikisi çok farklı sonuçlar doğurur. Eğer yayılım büyük ölçüde modelin iç değişkenliğinden geliyorsa, daha kalabalık bir topluluk koşusu bandı daraltır ve zamanla daha keskin bir sayıya varılır. Eğer yayılım yapısalsa (aerosol optik özelliklerinin, bulut etkileşimlerinin ya da panel verim ilişkisinin nasıl kurulduğuna bağlıysa) daha çok koşu bandı daraltmaz, yalnızca aynı belirsizliği daha düzgün bir eğriyle gösterir. Özetin verdiği tek standart sapma, bu iki durumu birbirinden ayırmıyor."}]}, {"h": {"en": "What would settle it", "tr": "Ne, neyi çözerdi"}, "ps": [{"en": "The test that would genuinely narrow the band lies outside the model. Comparing metered photovoltaic output in the affected grids against a smoke-free counterfactual built from observed irradiance yields a second estimate that does not depend on the same model. If that estimate lands near the 6.38 terawatt hour point value, the wide band amounts to cautious reporting rather than a weakness. If it lands clearly away from it, the question of which link in the chain is responsible becomes something one can go and look for.", "refs": ["duman-gunes"], "tr": "Bandı gerçekten daraltacak sınama modelin dışındadır. Etkilenen şebekelerdeki sayaçla ölçülmüş fotovoltaik üretimi, gözlenmiş ışınım verisinden kurulmuş dumansız bir karşı olguyla karşılaştırmak, aynı modele bağlı olmayan ikinci bir tahmin verir. Bu tahmin 6,38 teravatsaatlik nokta değerin yakınına düşerse, aradaki geniş bant bir zayıflık değil yalnızca temkinli bir raporlama olur. Belirgin biçimde uzağa düşerse, sorun modelin hangi halkasında olduğu aranabilir hâle gelir."}, {"en": "A second case is on its way as well. Canadian smoke has reached Europe again this year, and the study's lead author, Roșu, says it is too early to compare with 2023 while the season is still running. That is a correct caution and also a valuable opportunity: applying the same method to an independent year, and finding the loss fraction consistent across the two events, would raise confidence. What should be waited for is the same magnitude arrived at twice by different routes, rather than a bigger number.", "refs": ["duman-gunes"], "tr": "İkinci bir olay da yolda. Bu yıl Kanada dumanı yeniden Avrupa'ya ulaştı ve çalışmanın ilk yazarı Roșu, mevsim sürerken 2023'le karşılaştırma yapmanın erken olduğunu söylüyor. Bu doğru bir çekince ve aynı zamanda değerli bir fırsat: aynı yöntem bağımsız bir yıla uygulandığında, yöntemin verdiği kayıp oranı iki olayda tutarlı çıkarsa güven artar. Beklenmesi gereken, daha büyük bir sayı değil, aynı büyüklüğe iki ayrı yoldan varılması."}]}], "sources": [{"key": "duman-gunes", "kind": "news", "name": "New Scientist", "url": "https://www.newscientist.com/article/2582931-canadian-wildfires-are-reducing-solar-power-generation-in-europe", "title": {"tr": "Kanada'daki 2023 yangınlarının dumanı iki kıtada güneş üretimini düşürdü", "en": "Smoke from Canada's 2023 fires cut solar output on two continents"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03860-x", "publishedDate": "2026-07-28", "title": {"tr": "Kanada'nın 2023 yangın dumanı güneş elektriği üretiminde yüzde 2,8'lik düşüşe yol açtı ve iki milyar dolara mal oldu", "en": "Canada's 2023 wildfire smoke caused a 2.8 percent drop in solar power generation, costing two billion dollars"}}}], "title": {"en": "The loss is 6.38 terawatt hours and the spread is 8.86", "tr": "Kayıp 6,38 teravatsaat, yayılım 8,86"}, "writer": "sci-05", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "The obstacle between us and the first spectrum of another living world may not be the star's glare or the planet's faintness. It may be an ordinary cloud of dust, orbiting alongside the planet we want to read.", "tr": "Bizimle bir başka canlı dünyanın ilk tayfı arasındaki engel, yıldızın parıltısı ya da gezegenin sönüklüğü olmayabilir. Okumak istediğimiz gezegenle aynı yörüngede dönen sıradan bir toz bulutu da olabilir."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The name of the obstacle", "tr": "Engelin adı"}, "ps": [{"en": "Inside our own solar system a thin veil of dust hangs between the planets; the zodiacal light visible in the sky before dawn is sunlight reflected off it. The same thing exists around other stars, and nearby Sun-like systems are thought to carry at least three times as much habitable-zone dust as ours. The work by Miles H. Currie and colleagues, posted to arXiv on 15 July and accepted for publication in The Astronomical Journal, asks what that dust will do by simulating Earth-like planetary systems and applying an atmospheric retrieval tool to synthetic spectra of the kind a future Habitable Worlds Observatory would take.", "refs": ["eksozodyak"], "tr": "Kendi Güneş Sistemimizin içinde, gezegenlerin arasında ince bir toz perdesi asılı durur; gökyüzünde şafaktan önce görünen zodyak ışığı, bu tozdan yansıyan güneş ışığıdır. Başka yıldızların çevresinde de aynısı var ve Güneş benzeri yakın sistemlerin, yaşanabilir bölgesinde bizimkinin en az üç katı toz taşıdığı düşünülüyor. Miles H. Currie ve arkadaşlarının 15 Temmuz'da arXiv'e yükledikleri ve The Astronomical Journal'da yayımlanmak üzere kabul edilen çalışma, bu tozun ne yapacağını sormak için Dünya benzeri gezegen sistemlerini benzetiyor ve gelecekteki Habitable Worlds Observatory'nin alacağı yapay tayflara bir atmosfer geri çatma aracı uyguluyor."}, {"en": "The result is this: light scattered by micron-sized dust adds a smooth, cloud-like continuum to the extracted spectrum and reduces the apparent depth of molecular absorption features. Even an amount of dust like our own solar system's can shallow visible-wavelength absorption features by up to 50 per cent, and the effect worsens at longer wavelengths. What is at stake here is reading the planet rather than detecting it. The dot remains where it was; the writing on it does not survive.", "refs": ["eksozodyak"], "tr": "Sonuç şu: mikron boyutlu tozun saçtığı ışık, çıkarılan tayfa buluta benzer düzgün bir süreklilik ekliyor ve moleküler soğurma çizgilerinin görünen derinliğini azaltıyor. Güneş Sistemi'ndeki kadar bir toz miktarı bile, görünür bölgedeki soğurma çizgilerini yüzde 50'ye varan oranda sığlaştırabiliyor; etki uzun dalga boylarında daha da belirginleşiyor. Burada tehlikeye giren şey gezegeni bulmak değil, onu okumak. Nokta yerinde duruyor; okunamayan, üstündeki yazı."}]}, {"h": {"en": "The operation beneath the sentence", "tr": "Cümlenin altındaki işlem"}, "ps": [{"en": "The sentence reporting that oxygen was found in the atmosphere of another world, on the day it is finally said, will rest on a subtraction most people will never see. The dust has to be cleaned out of the spectrum, and the work reports that if abundance is to be measured, the fraction of dust allowed to remain tightens as dust density rises. This amounts to a requirement rather than a discovery: a line in the budget that the instrument and the processing have to meet.", "refs": ["eksozodyak"], "tr": "Başka bir dünyanın atmosferinde oksijen bulunduğunu bildiren cümle, günün birinde kurulduğunda, çoğu insanın hiç görmeyeceği bir çıkarma işleminin üstünde duracak. Tozun tayftan temizlenmesi gerekiyor ve çalışmanın bildirdiğine göre bolluk ölçmek isteniyorsa, geriye kalabilecek toz payı toz yoğunluğu arttıkça daralıyor. Bu, bir keşif değil bir gereklilik: aygıtın ve işlemenin karşılaması gereken bir bütçe kalemi."}, {"en": "The same work also opens a door, and the door concerns the size of the question we ask. Asking only whether a molecule is there, instead of measuring how much of it is there, relaxes the required dust subtraction by an order of magnitude, and more so at higher spectral resolution. The universe, in other words, answers a smaller question far more cheaply. This is a bargain science meets often: give up the quantity and take the presence.", "refs": ["eksozodyak"], "tr": "Ama aynı çalışma bir kapı da açıyor ve bu kapı, sorduğumuz sorunun boyutuyla ilgili. Bir molekülün ne kadar bulunduğunu ölçmek yerine yalnızca orada olup olmadığını sormak, gereken toz çıkarma duyarlılığını bir büyüklük derecesi gevşetiyor; tayfsal çözünürlük yüksekse daha da fazla. Yani evren, daha küçük bir soruya çok daha ucuza cevap veriyor. Bu, bilimin sık karşılaştığı bir pazarlıktır: kesinliği bırakıp varlığı almak."}]}, {"h": {"en": "The question we can afford", "tr": "Hangi soruyu sormaya gücümüz yeter"}, "ps": [{"en": "A binary answer is a smaller claim than a number, but a small claim honestly made is worth more than a number resting on unmodelled dust. This amounts to a choice of direction rather than a consolation. The generation that builds the Habitable Worlds Observatory will inherit not its own curiosity but the question the processing can carry — and being able to say that a molecule is present in the air of another planet resembles nothing humanity has been able to say so far.", "refs": ["eksozodyak"], "tr": "İkili bir cevap, bir sayıdan daha küçük bir iddiadır; ama dürüstçe kurulmuş küçük bir iddia, modellenmemiş bir tozun üstünde duran bir sayıdan daha değerlidir. Bu bir teselli değil, bir yön seçimi. Habitable Worlds Observatory'yi inşa edecek kuşak, kendi merakını değil, işlemenin taşıyabileceği soruyu miras alacak; ve bir gezegenin havasında bir molekülün bulunduğunu söyleyebilmek de, insanlığın bugüne dek söyleyebildiği hiçbir şeye benzemiyor."}, {"en": "How would we know this idea had moved from possibility to fact? There are two observable signals. The first is whether the telescope's design documents adopt the high spectral resolution and the dust-subtraction allowance this work implies. The second is nearer: whether the 50 per cent figure and the order-of-magnitude relaxation survive into the journal version. What question a generation gets to ask is often decided inside numbers this small.", "refs": ["eksozodyak"], "tr": "Bu fikrin bir olasılıktan gerçeğe geçtiğini nereden anlarız? İki gözlenebilir işaret var. Birincisi, teleskobun tasarım belgelerinin bu çalışmanın ima ettiği yüksek tayfsal çözünürlüğü ve toz çıkarma payını benimseyip benimsemediği. İkincisi daha yakın: çalışma dergi sürümüne geçtiğinde yüzde 50'lik değerin ve bir büyüklük derecelik gevşemenin aynı kalıp kalmayacağı. Bir kuşağın hangi soruyu sorabileceği, çoğu zaman böyle küçük sayıların içinde belirlenir."}]}], "sources": [{"key": "eksozodyak", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-zodiacal-exoplanetary-hinder-life-worlds.html", "title": {"tr": "Yaşanabilir bölgedeki toz, bir soğurma çizgisinin derinliğini yarıya indirebilir", "en": "Dust in the habitable zone can halve the depth of an absorption line"}, "publishedDate": "2026-08-03", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.14329", "publishedDate": "2026-07-15", "title": {"tr": "Ekzodyak tayf etkisi: yaşanabilir bölgede kalan toz, Dünya benzeri gezegenlerin nitelenmesini yanlı hâle getirebilir", "en": "The exozodi spectral effect: Residual habitable zone dust may bias exoEarth characterization"}}}], "title": {"en": "Before asking whether a world breathes, we have to subtract its dust", "tr": "Bir dünyanın soluk alıp almadığını sormadan önce tozunu çıkarmamız gerekiyor"}, "writer": "sci-06", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "An X-ray flash marked the instant the star's surface was breached, to within seconds. The relativistic jet expected from the same explosion was not found, and that absence narrows the models more than the detection does.", "tr": "Bir X-ışını parlaması, yıldızın yüzeyinin delindiği anı saniyeler içinde işaretledi. Aynı patlamada beklenen görelilikli jetin bulunamaması, ölçümden çok modelleri daraltıyor."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "The instant the surface gave way", "tr": "Yüzeyin delindiği an"}, "ps": [{"en": "When a star collapses, the first light of the explosion is released at the moment the shock wave reaches the surface and breaks out, and it lasts anywhere from seconds to hours. On 21 March 2026 the Einstein Probe satellite detected a soft X-ray flash designated EP260321a; two peer-reviewed papers announced by NSF NOIRLab identify that flash as the shock breakout of the supernova SN 2026gzf. The thermal X-ray peak is 1.0 × 10⁴⁵ erg/s at a temperature of 130 electronvolts. In the past two decades only one other such breakout has been caught in X-rays with confidence.", "refs": ["sok-kirilmasi"], "tr": "Bir yıldız çöktüğünde patlamanın ilk ışığı, şok dalgası yüzeye ulaşıp dışarı çıktığı anda salınır ve saniyelerle saatler arasında sürer. Einstein Probe uydusu 21 Mart 2026'da EP260321a adlı yumuşak X-ışını parlamasını saptadı; NSF NOIRLab'ın duyurduğu iki hakemli makale bu parlamayı SN 2026gzf süpernovasının şok kırılması olarak tanımlıyor. Isıl X-ışını tepe gücü 1,0 × 10⁴⁵ erg/s, sıcaklık 130 elektronvolt. Son yirmi yılda böyle bir kırılmanın X-ışınında güvenle yakalandığı yalnızca bir örnek daha var."}, {"en": "The follow-up that came afterwards describes an event more violent than an ordinary core collapse. Brendan O'Connor and colleagues place the source at redshift 0.0344, a luminosity distance of 158 megaparsecs, and give ejecta of 2.0 solar masses with 0.45 solar masses of nickel. The velocity read from the width of the iron lines is 35,000 km/s at 3.6 days and 20,000 km/s by day 11. These are the numbers that suit a broad-lined Type Ic explosion of a star that had already shed its hydrogen and helium shells.", "refs": ["sok-kirilmasi"], "tr": "Sonrasındaki izleme, sıradan bir çekirdek çökmesinden daha sert bir olaya işaret ediyor. Brendan O'Connor ve arkadaşları kaynağı 0,0344 kırmızıya kaymada, yani 158 megaparseklik ışıklılık uzaklığında konumlandırıyor; fırlatılan kütleyi 2,0 güneş kütlesi, nikel kütlesini 0,45 güneş kütlesi olarak veriyor. Demir çizgilerinin genişliğinden okunan hız 3,6 günde 35.000 km/s, 11. günde 20.000 km/s. Bunlar, hidrojen ve helyum kabuğunu önceden dökmüş bir yıldızın geniş çizgili Tip Ic patlamasına yakışan sayılar."}]}, {"h": {"en": "The jet that was not there", "tr": "Bulunmayan jet"}, "ps": [{"en": "Explosions in this class are usually spoken of together with a gamma-ray burst and a relativistic jet. Here neither appears. Jillian Rastinejad and colleagues report that radio follow-up carried out between 5.8 and 54.5 days rules out an on-axis jet, and that deep X-ray observations exclude a typical gamma-ray burst afterglow. The teams read this as a weak, mildly relativistic outflow choked inside the material of the star.", "refs": ["sok-kirilmasi"], "tr": "Bu sınıftaki patlamalar çoğunlukla bir gama ışını patlamasıyla ve görelilikli bir jetle birlikte anılır. Burada ikisi de görünmüyor. Jillian Rastinejad ve arkadaşları 5,8 ile 54,5 gün arasında yürüttükleri radyo izlemesinin eksene bakan bir jeti dışladığını, derin X-ışını gözlemlerinin de olağan bir gama ışını patlaması artığını dışladığını bildiriyor. Ekiplerin okuması, zayıf ve az görelilikli bir dışa akışın yıldızın maddesi içinde boğulduğu yönünde."}, {"en": "The prosaic account deserves to be stated first. A jet may exist and point away from the line of sight; in that geometry radio follow-up would also stay silent. What separates the choked scenario is that an outflow trapped inside the star both delays and weakens the shock breakout, and that this fits the X-ray luminosity actually measured. The difference between the two accounts can be narrowed by watching the late radio emission of the same explosion: a jet pointing off axis reveals itself months later as it spreads.", "refs": ["sok-kirilmasi"], "tr": "Sıradan açıklamayı önce söylemek gerekir. Jet var olup gözlem ekseninden uzağa bakıyor olabilir; böyle bir geometride radyo izlemesi de sessiz kalır. Boğulma senaryosunu ayıran şey, dışa akışın yıldızın içinde kalmasının şok kırılmasını hem geciktirmesi hem de zayıflatması ve bunun ölçülen X-ışını gücüyle uyumlu olması. İki açıklama arasındaki fark, aynı patlamanın geç dönemdeki radyo ışıması izlenerek daraltılabilir: eksene bakmayan bir jet, aylar sonra genişledikçe kendini gösterir."}]}, {"h": {"en": "The count itself sets a limit", "tr": "Sayının kendisi bir sınır koyuyor"}, "ps": [{"en": "The second result Rastinejad and colleagues report reaches beyond one star. The Einstein Probe detection rate so far does not match the shock breakout frequency expected from Type Ic-BL supernovae. That means either these explosions emit less X-ray light than predicted, or some fraction of the fast transients the satellite sees comes from something else. A second and a third example separate the two possibilities.", "refs": ["sok-kirilmasi"], "tr": "Rastinejad ve arkadaşlarının bildirdiği ikinci sonuç, tek bir yıldızın ötesine geçiyor. Einstein Probe'un bugüne kadarki saptama hızı, Tip Ic-BL süpernovalarından beklenen şok kırılması sıklığıyla uyuşmuyor. Bu, ya bu patlamaların çıkardığı X-ışınının öngörülenden az olduğu ya da uydunun gördüğü hızlı geçici kaynakların bir bölümünün başka bir şeyden geldiği anlamına gelir. İki olasılığı ayıracak olan, ikinci ve üçüncü örneklerdir."}]}], "sources": [{"key": "sok-kirilmasi", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-astronomers-massive-star-death-explosive.html", "title": {"tr": "Şok yıldızın yüzeyini delerken çıkan ilk ışık X-ışınında yakalandı", "en": "The first light of a supernova was caught in X-rays as the shock broke the surface"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae84ba", "publishedDate": "2026-07-14", "title": {"tr": "EP260321a/SN 2026gzf: Geniş çizgili bir süpernovayla ilişkili en sönük şok kırılması", "en": "EP260321a/SN 2026gzf: The Faintest Shock Breakout Associated with a Broad-lined Supernova"}}}], "title": {"en": "The first light of the explosion arrived; the jet did not", "tr": "Patlamanın ilk ışığı geldi, jet gelmedi"}, "writer": "sci-01", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "In a sample of 178 twins the heritability of the raw brain signal comes out low and the heritability of the connectivity profile markedly higher. That difference decides which imaging measure could even be a candidate for a familial marker.", "tr": "178 kişilik bir ikiz örnekleminde ham beyin sinyalinin kalıtsallığı düşük, bağlantı deseninin kalıtsallığı belirgin biçimde yüksek çıkıyor. Bu fark, hangi görüntüleme ölçüsünün ailevi bir belirteç olmaya aday olabileceğini belirliyor."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "Three measures of the same stimulus", "tr": "Aynı uyarana üç ayrı ölçü"}, "ps": [{"en": "In the Human Connectome Project's 7-tesla release, 178 people passively watched short film clips across two sessions; the sample holds 51 monozygotic and 34 dizygotic twin pairs. Heritability of the raw BOLD time course came out at 0.064 on day one and 0.068 on day two. Heritability of the functional connectivity profile, computed from the same scans, came out at 0.36 on day one and 0.37 on day two. The stimulus is the same, the scan is the same, the people are the same; the only thing that changes is what gets measured.", "refs": ["kalitsallik"], "tr": "Human Connectome Project'in 7 tesla veri kümesindeki 178 kişi, iki oturumda kısa film parçalarını üzerlerine görev verilmeden izledi; örneklemin içinde 51 tek yumurta ve 34 çift yumurta ikizi çifti var. Kan oksijen düzeyine bağlı ham beyin sinyalinin (BOLD) kalıtsallığı ilk günde 0,064, ikinci günde 0,068 çıktı. Aynı taramalardan hesaplanan işlevsel bağlantı deseninin kalıtsallığı ise ilk günde 0,36, ikinci günde 0,37. Uyaran aynı, tarama aynı, kişiler aynı; değişen tek şey neyin ölçüldüğü."}, {"en": "The third measure is the neural timescale, which describes how long a window a region uses to respond to the stimulus. Its global heritability is 0.38 on day one (p = 0.003) and 0.75 on day two. That jump is a warning in itself: an estimate that almost doubles between two sessions does not yet count as a settled measure. The same authors report a steadier value at the level of individual regions; the volatility in the global figure is consistent with a small sample and the noise of a single session.", "refs": ["kalitsallik"], "tr": "Üçüncü ölçü, bir bölgenin uyarana ne kadar uzun bir zaman penceresiyle yanıt verdiğini anlatan sinirsel zaman ölçeği. Bütünsel kalıtsallığı ilk günde 0,38 (p = 0,003), ikinci günde 0,75. Bu sıçrama başlı başına bir uyarı: iki oturum arasında neredeyse iki katına çıkan bir tahmin, henüz oturmuş bir ölçü sayılmaz. Aynı yazarlar bölge düzeyinde daha durağan bir değer bildiriyor; bütünsel sayıdaki oynaklık, örneklem küçüklüğüyle ve tek bir oturumun gürültüsüyle uyumlu."}]}, {"h": {"en": "What alignment takes away", "tr": "Hizalama neyi götürüyor?"}, "ps": [{"en": "The most instructive part of the study recomputes heritability after applying alignment methods that superimpose individual functional maps. Raw BOLD heritability drops by 33 percent on day one (95 percent confidence interval 25–40) and connectivity profile heritability by 39 percent (32–46). A substantial share of the apparent heritability comes from where a response lands on a person's cortex rather than from the response the tissue gives to the stimulus.", "refs": ["kalitsallik"], "tr": "Çalışmanın en öğretici bölümü, bireysel işlevsel haritaları üst üste bindiren hizalama yöntemlerini uyguladıktan sonra kalıtsallığı yeniden hesaplaması. Ham BOLD kalıtsallığı ilk günde yüzde 33 (yüzde 95 güven aralığı 25–40), bağlantı deseni kalıtsallığı yüzde 39 (32–46) düşüyor. Görünen kalıtsallığın önemli bir bölümü, beyin dokusunun uyarana verdiği yanıttan çok, o yanıtın kişinin korteksinde nereye düştüğünden geliyor."}, {"en": "There is a finding on the other side too: measured during films, the connectivity profile is 20 percent more heritable than at rest on day one and 30 percent more on day two for sensory networks. The stimulus, in other words, appears to make heritable structure visible. A plainer account could produce the same result: a film generates a stronger and more regular signal than rest, and a measure with less noise returns a higher heritability estimate.", "refs": ["kalitsallik"], "tr": "Bunun karşısına konulacak bulgu da var: film izlerken ölçülen bağlantı deseni, duyusal ağlarda dinlenme durumuna göre ilk günde yüzde 20, ikinci günde yüzde 30 daha kalıtsal. Yani uyaranın kendisi kalıtsal yapıyı görünür kılıyor gibi duruyor. Aynı sonucu üretebilecek daha sade bir açıklama var: film, dinlenmeye göre daha güçlü ve daha düzenli bir işaret üretir; gürültüsü azalan bir ölçünün kalıtsallık tahmini de yükselir."}]}, {"h": {"en": "When does a measure become a candidate marker?", "tr": "Bir ölçü belirteç olmaya ne zaman aday olur?"}, "ps": [{"en": "For an imaging measure to be used as a trait carried in families, two conditions have to hold: it must be heritable, and it must give the same value when the same person is measured again. The connectivity profile meets the first condition far better than the raw signal, and by staying at 0.36 and 0.37 across two days it comes close to the second. The neural timescale meets the first condition strongly while swinging from 0.38 to 0.75 on the second. No measure here is usable in the clinic today, but which measure is worth working on has become clearer.", "refs": ["kalitsallik"], "tr": "Bir görüntüleme ölçüsünün ailede taşınan bir özellik olarak kullanılabilmesi iki koşula bağlıdır: kalıtsal olması ve aynı kişide tekrar ölçüldüğünde aynı değeri vermesi. Bağlantı deseni birinci koşulu ham sinyalden çok daha iyi karşılıyor ve iki gün arasında 0,36 ile 0,37'de durarak ikinci koşula da yaklaşıyor. Sinirsel zaman ölçeği ise birinci koşulu güçlü biçimde karşılarken ikincisinde 0,38'den 0,75'e savruluyor. Bugün klinikte kullanılabilecek bir ölçü yok; ama hangi ölçünün üzerinde çalışmaya değeceği belirginleşiyor."}, {"en": "Who was measured is part of the result as well. Every participant is between 22 and 36 years old, and close to 90 percent identified as White. Heritability describes a ratio that depends on the genetic and environmental variety of the group it is measured in, so these numbers belong to a narrow group. Whether the same measures would fall in the same order in a childhood or an elderly sample cannot be drawn from this study.", "refs": ["kalitsallik"], "tr": "Kimin ölçüldüğü de sonucun bir parçası. Katılımcıların hepsi 22 ile 36 yaş arasında ve yaklaşık yüzde 90'ı beyaz olarak tanımlanıyor. Kalıtsallık, ölçüldüğü topluluğun genetik ve çevresel çeşitliliğine bağlı bir orandır; bu yüzden buradaki sayılar dar bir gruba ait. Çocukluk ya da yaşlılık dönemindeki bir örneklemde aynı ölçülerin aynı sırayı vereceği, bu çalışmadan çıkarılamaz."}]}], "sources": [{"key": "kalitsallik", "kind": "news", "name": "eLife", "url": "https://elifesciences.org/articles/106081", "title": {"tr": "Film izleyen beyinde kalıtsallık bağlantı deseninde toplanıyor", "en": "In a brain watching a film, heritability gathers in the connectivity profile"}, "publishedDate": "2026-08-04"}], "title": {"en": "Where does heritability show up in twins watching the same film?", "tr": "Aynı filmi izleyen ikizlerde kalıtsallık nerede görünüyor?"}, "writer": "sci-02", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "Three years of monitoring in the Indian River Lagoon tie the germination of a hardy native seagrass to freshwater input. That moves the lever of restoration away from the plant and towards the water regime.", "tr": "Indian River Lagoon'da üç yıllık izleme, dayanıklı bir yerli deniz çayırının çimlenmesini tatlı su girdisine bağlıyor. Bu, onarımın kaldıracını bitkiden çok suyun rejimine taşıyor."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "What was measured", "tr": "Ölçülen şey"}, "ps": [{"en": "Seagrass meadows are the quiet infrastructure of a coastal system: they hold sediment, shelter juvenile fish and bury carbon in the bed. Close to 20 percent of that habitat has been lost worldwide over historical time. In a system that has already lost much of its dominant species, the Florida Atlantic University Harbor Branch team monitored Ruppia maritima in the Indian River Lagoon for three years, measuring seasonal coverage, biomass, environmental conditions and the viability of the seed bank in the sediment.", "refs": ["ruppia"], "tr": "Deniz çayırları kıyı sisteminin sessiz altyapısıdır: çökeli tutar, balık yavrusunu barındırır, karbonu tabana gömer. Dünya genelinde bu alanın yaklaşık yüzde 20'si tarihsel olarak yitirildi. Florida Atlantic Üniversitesi Harbor Branch ekibi, baskın türlerini büyük ölçüde kaybetmiş bir sistemde, Indian River Lagoon'da Ruppia maritima türünü üç yıl izledi; mevsimlik örtüyü, biyokütleyi, çevre koşullarını ve çökeldeki tohum bankasının canlılığını ölçtü."}, {"en": "The most usable link inside the results sits in salinity. Lower salinity and freshwater exposure clearly increased germination. The team has kept the same species going as a self-sustaining population in a nursery it established in 2021, which means the path from seed to seedling is already closed in the laboratory.", "refs": ["ruppia"], "tr": "Sonuçların içindeki en işe yarar bağlantı tuzlulukta. Düşük tuzluluk ve tatlı su girdisi çimlenmeyi belirgin biçimde artırdı. Ekip aynı türü 2021'de kurduğu fidanlıkta kendi kendini yenileyen bir topluluk olarak sürdürüyor; yani tohumdan fideye giden yol laboratuvarda kapanmış durumda."}]}, {"h": {"en": "Who holds the lever?", "tr": "Kolu kim tutuyor?"}, "ps": [{"en": "The places where the monitoring was done also carry the answer: the Bee Gum Point nature preserve and mosquito impoundments. In those impoundments the water level and the freshwater input are already managed by hand. If the variable that triggers germination is a managed variable, then the lever of restoration sits in the seasonal regime of the water rather than in the number of seedlings. There is a cost on the other side: the same freshwater input carries other loads into the lagoon, and the wider system effects of lowering salinity were not measured in this study.", "refs": ["ruppia"], "tr": "İzlemenin yapıldığı yerler bu sorunun yanıtını da içeriyor: Bee Gum Point koruma alanı ve sivrisinek setleriyle çevrili havuzlar. Bu havuzlarda su seviyesi ve tatlı su girdisi zaten insan eliyle yönetiliyor. Çimlenmeyi tetikleyen değişken yönetilen bir değişkense, onarımın kaldıracı, fidan sayısından çok suyun mevsimlik rejimidir. Bunun karşılığı da var: aynı tatlı su girdisi lagüne başka yükler de taşır ve tuzluluğu düşürmenin sistemdeki diğer etkileri bu çalışmada ölçülmedi."}, {"en": "What the study delivers is a candidate species and the condition that wakes it, rather than a restoration outcome. Which planting method and which environmental conditions hold in the field has not been tested. The signal to watch is therefore plain: a field trial lasting more than one season, reporting planted area alongside the salinity it was planted into. The difference between a population renewing itself in a nursery and a meadow holding in the lagoon is exactly what such a trial measures.", "refs": ["ruppia"], "tr": "Çalışmanın verdiği şey, aday bir tür ve onu uyandıran koşul; onarılmış bir çayır henüz yok. Hangi dikim yönteminin ve hangi çevre koşullarının sahada tutacağı sınanmadı. İzlenecek işaret bu yüzden açık: dikilen alanın tuzlulukla birlikte bildirildiği, bir mevsimden fazla süren bir saha denemesi. Fidanlıkta yenilenen bir topluluk ile lagünde tutan bir çayır arasındaki fark, tam da o denemenin ölçtüğü şeydir."}]}], "sources": [{"key": "ruppia", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-resilient-native-seagrass-species-reshape.html", "title": {"tr": "Tuzluluk düştüğünde çimlenen bir deniz çayırı, onarım için aday gösterildi", "en": "A seagrass that germinates when salinity drops is proposed for restoration"}, "publishedDate": "2026-08-04"}], "title": {"en": "The seed wakes when the salinity drops", "tr": "Tuzluluk düşünce tohum uyanıyor"}, "writer": "sci-03", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "Dressing a silicon nitride ring in a silica cladding gathers two separate nonlinear effects into one device. What was built changes where the light sits; no new material was needed.", "tr": "Silisyum nitrür bir halkaya silika kılıf giydirildiğinde iki ayrı doğrusal olmayan etki tek aygıtta toplanıyor. Yapılan iş, ışığın nerede durduğunu değiştirmek; yeni bir malzeme gerekmedi."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "Two effects, one ring", "tr": "İki etki, tek halka"}, "ps": [{"en": "A frequency comb is a device that turns a single-colour laser into hundreds of evenly spaced colours. Silicon nitride does that job well through the Kerr effect, but it does not supply the Raman gain that silica does. Arghadeep Pal and colleagues wrote the solution into the geometry rather than the materials list: the silicon nitride ring resonator was wrapped in a silica cladding, and about 31 percent of the circulating light spilled into that cladding. Because a substantial share of the light travels outside the core, the nonlinear effects of two materials work in the same ring at the same time.", "refs": ["hibrit-tarak"], "tr": "Bir frekans tarağı, tek renkli bir lazerden düzenli aralıklı yüzlerce renk üreten bir aygıttır. Silisyum nitrür bu işi Kerr etkisiyle iyi yapar; silikanın verdiği Raman kazancını ise vermez. Arghadeep Pal ve arkadaşları çözümü geometriye yazdılar: silisyum nitrür halka rezonatörü silika kılıfla çevrildi ve dolaşan ışığın yaklaşık yüzde 31'i kılıfın içine taştı. Işığın önemli bir bölümü çekirdeğin dışında yol aldığı için, iki malzemenin doğrusal olmayan etkileri aynı halkada aynı anda çalışıyor."}, {"en": "Raman gain is what happens when light interacts with the molecular vibrations of a material and emerges at a new frequency. The shift measured in this device is 11 terahertz, and the on-chip threshold for Raman lasing is 143 milliwatts. That threshold is the critical number here because it marks where the mechanism switches on: below it the cladding is only a cladding, above it a second source of gain.", "refs": ["hibrit-tarak"], "tr": "Raman kazancı, ışığın malzemedeki moleküler titreşimlerle etkileşip yeni bir frekansta çıkmasıdır. Bu aygıtta ölçülen kayma 11 terahertz, yonga üzerindeki Raman lazer eşiği 143 milivat. Eşik, mekanizmanın çalıştığı noktayı gösterdiği için burada kritik sayıdır: altında kılıf yalnızca bir kılıftır, üstünde ikinci bir kazanç kaynağıdır."}]}, {"h": {"en": "Measured performance and the work left", "tr": "Ölçülen başarım ve kalan iş"}, "ps": [{"en": "Two numbers carry the result: the comb spans more than 400 nanometres and power conversion efficiency exceeds 32 percent. That efficiency is high by the standards of comb generators and is tied directly to the second source of gain in the cladding. Span and efficiency rising together supports the reading that the gain is feeding the comb, but two numbers measured on one device are not enough to separate out the mechanism's share.", "refs": ["hibrit-tarak"], "tr": "İki sayı sonucu taşıyor: tarak 400 nanometreden geniş bir aralığa yayılıyor ve güç dönüşüm verimi yüzde 32'yi aşıyor. Bu verim, frekans tarağı üreten aygıtlarda alışılmış olanın üzerinde ve doğrudan kılıftaki ikinci kazanç kaynağıyla ilişkilendiriliyor. Genişlik ile verimin birlikte artması, kazancın tarağı beslediği yorumunu destekler; ama tek bir aygıtta ölçülmüş iki sayı, mekanizmanın payını ayırmaya yetmez."}, {"en": "The missing piece is named by the authors themselves: the combs are not fully coherent. For a frequency comb to be usable in metrology and communications its teeth have to be locked to one another in a fixed phase relationship; without that lock the device stays a light source however high the efficiency. The authors write that improving coherence without giving up efficiency requires further work on the device design. What has been built here is the mechanism; what has not been built is the control that turns the mechanism into a usable component. The signal to watch is therefore narrow and concrete: a later study reporting a coherent comb from the same silicon nitride and silica arrangement, with power conversion efficiency staying at or above 32 percent.", "refs": ["hibrit-tarak"], "tr": "Eksik parçayı yazarlar kendileri adlandırıyor: tarakların eşevreliliği tam değil. Bir frekans tarağının ölçüm ve haberleşme işlerinde kullanılabilmesi, dişlerinin birbirine sabit bir faz ilişkisiyle kilitlenmesine bağlıdır; verim yüksek olsa bile bu kilit yoksa aygıt bir ışık kaynağı olarak kalır. Yazarlar verimi düşürmeden eşevreliliği iyileştirmenin aygıt tasarımında ek çalışma gerektirdiğini yazıyor. Yani burada kurulan şey mekanizmanın kendisi; kurulmamış olan, o mekanizmayı kullanılabilir bir bileşene çeviren denetim. İzlenecek işaret bu yüzden dar ve somut: aynı silisyum nitrür–silika düzeneğinden, güç dönüşüm verimi yüzde 32'nin altına inmeden eşevreli bir tarak bildiren bir sonraki çalışma."}]}], "sources": [{"key": "hibrit-tarak", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-materials-photonic-chip-generate-frequencies.html", "title": {"tr": "Çekirdek ile kılıfın iki ayrı doğrusal olmayan etkisi tek bir yüzükte birleştirildi", "en": "A ring resonator puts the core's and the cladding's nonlinear effects to work together"}, "publishedDate": "2026-08-04"}], "title": {"en": "31 percent of the light spills into the cladding, and the gain comes from there", "tr": "Işığın yüzde 31'i kılıfa taşıyor, kazanç oradan geliyor"}, "writer": "sci-04", "n": 3, "date": "2026-08-04"}, {"excerpt": {"en": "The error of epigenetic age clocks is not spread randomly from sample to sample; it shifts with ancestry. That does not invalidate the clocks, it narrows the ground on which they hold.", "tr": "Epigenetik yaş saatlerinin hatası örneklemden örnekleme rastgele dağılmıyor; soyla birlikte kayıyor. Bu, saatleri geçersiz kılmaz, geçerli oldukları alanı daraltır."}, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "sections": [{"h": {"en": "Where does the correlation fall?", "tr": "Bağıntı nereye düşüyor?"}, "ps": [{"en": "The peer-reviewed study published in eLife tested six methylation age clocks in the 621-person MAGENTA sample. The Horvath clock's correlation with chronological age is 0.72 in white participants, falling to 0.51 in African American and 0.45 in Puerto Rican participants. For the Zhang clock the same order runs 0.88, 0.70 and 0.66. The gap holds in three independent cohorts totalling more than 2,500 people as well: for participants aged 55 and over the correlation is 0.80 in the Swedish sample, 0.67 in GENOA and 0.57 in Grady.", "refs": ["metilasyon-saatleri"], "tr": "eLife'ta yayımlanan hakemli çalışma altı metilasyon yaş saatini 621 kişilik MAGENTA örnekleminde sınadı. Horvath saatinin takvim yaşıyla bağıntısı beyaz katılımcılarda 0,72; Afrikalı Amerikalılarda 0,51'e, Porto Rikolularda 0,45'e düşüyor. Zhang saatinde aynı sıra 0,88, 0,70 ve 0,66. Fark, 2.500'den fazla kişilik üç bağımsız kümede de duruyor: 55 yaş ve üzeri için bağıntı İsveç örnekleminde 0,80, GENOA'da 0,67, Grady'de 0,57."}, {"en": "A prediction tool losing correlation from one group to another is not by itself a defect; it also happens when a sample is small or an age range is narrow. What distinguishes this case is that the gap points the same way in the discovery sample and in three separate replication cohorts. Random fluctuation does not produce that regularity.", "refs": ["metilasyon-saatleri"], "tr": "Bir tahmin aracında bağıntının gruptan gruba düşmesi tek başına kusur sayılmaz; örneklem küçükse ya da yaş aralığı darsa da olur. Buradaki ayırt edici nokta, farkın hem keşif örnekleminde hem de üç ayrı doğrulama kümesinde aynı yöne bakması. Rastgele bir dalgalanma bu düzenliliği vermez."}]}, {"h": {"en": "The structure under the error", "tr": "Hatanın altındaki yapı"}, "ps": [{"en": "The authors look for the source of the error inside the cloc
