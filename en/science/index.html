ce Sheet was measured at between 12 and 20 nanomolar. That is far below what has been reported from the southwest of the same ice sheet: 270 nanomolar for Leverett Glacier, 1,575 for Isunnguata Sermia. The surprise is that the northern margin sits over an actively degassing petroleum system. A low concentration stands above a rich source.", "refs": ["grn"]}, {"tr": "Düşük olmak sıfır olmak anlamına gelmiyor. Çözümlenen bütün sular atmosfer dengesinin -4,9 nanomolar- yirmi katına varan doygunluk taşıyor; yani bu sular atmosfere net metan veriyor. Örnekleme ise bölgede tipik olarak eylülde biten erime mevsiminin sonunda yapılmış. Yazarlar güneybatı Grönland'da geç mevsim ölçümlerinin doruk döneme göre yaklaşık on kat düşük çıktığını hatırlatıyor. Buradaki sayı bir yıllık ortalama sayılmaz; mevsimin en zayıf ucundan alınmış bir kesittir.", "en": "Being low does not mean being zero. All analysed waters are supersaturated by up to twenty times the atmospheric equilibrium value of 4.9 nanomolar, which makes these waters a net source of methane to the atmosphere. Sampling took place at the end of the melt season, which in this region typically occurs in September. The authors recall that late-season measurements in southwestern Greenland come in about tenfold below peak-season values. This figure does not count as an annual mean; it is a slice taken from the season's weakest end.", "refs": ["grn"]}]}, {"h": {"tr": "İzotop hangi hesabı değiştiriyor", "en": "Which account the isotopes change"}, "ps": [{"tr": "Asıl kanıt derişimde değil, karbonun kendisinde duruyor. Erime sularının karbon izotop değerleri eksi 41,9 ile eksi 35,1 binde arasında. Buz tabakasının başka bölgelerinde bu değer tipik olarak eksi 50 bindenin altında kalıyor ve mikrobiyal üretime işaret ediyor. Buradaki ağır bileşim ile bölgesel jeolojik bağlam birlikte okunduğunda kaynak ağırlıklı olarak termojenik çıkıyor: buz altı mikrobiyal etkinliğinden büyük ölçüde bağımsız, yerin çok daha derininde çok daha önce oluşmuş bir gaz.", "en": "The evidence sits not in the concentration but in the carbon itself. Meltwaters exhibit carbon isotope values from minus 41.9 to minus 35.1 per mil. Elsewhere across the ice sheet that value typically stays below minus 50 per mil and points to microbial production. Read together with the regional geological context, the heavier composition here makes the source predominantly thermogenic: a gas largely independent of subglacial microbial activity, formed far deeper and far earlier.", "refs": ["grn"]}, {"tr": "Bunun pratik karşılığı bir kehanet değil, bir hesap düzeltmesidir. Buz tabakalarının çekilmesiyle açığa çıkacak metanı tahmin eden modeller şimdiye kadar ağırlıklı olarak mikrobiyal üretimi taşıyordu; bu üretim buz altındaki organik madde ve sıcaklık koşullarına bağlı olduğu için belli bir tavanı var. Jeolojik bir hazne farklı davranıyor: buzun bir mühür işlevi gördüğü yerde, mührün kalkması stok tarafından sınırlanıyor, üretim hızı tarafından değil. Yazarlar da buz küresi-karbon geri beslemeleri değerlendirilirken jeolojik metan haznelerinin hesaba katılması gerektiğini vurguluyor. Kuzey kenarda hangi mekanizmanın baskın olduğunu ayırt edecek gözlem belli: aynı havzalarda erime mevsiminin doruğunda yapılacak ölçümlerde hem derişimin hem izotop bileşiminin mevsim içinde nasıl kaydığı.", "en": "The practical consequence is a correction to the account, not a prophecy. Models that estimate methane released as ice sheets retreat have mostly carried microbial production, which depends on organic matter and temperature beneath the ice and therefore has a ceiling. A geological reservoir behaves differently: where ice acts as a seal, lifting the seal is limited by the stock, and not by a production rate. The authors likewise highlight the need to account for geological methane reservoirs when assessing cryosphere-carbon feedbacks. The observation that would separate the two mechanisms at the northern margin is clear: how both concentration and isotope composition shift within the year, measured in the same catchments at the height of the melt season.", "refs": ["grn"]}]}], "sources": [{"key": "grn", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75951-4", "title": {"tr": "Kuzey Grönland buzulunun altındaki metan mikrobiyal değil, jeolojik çıktı", "en": "Methane under the North Greenland Ice Sheet turns out to be geological, not microbial"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-04", "title": {"tr": "Sensöre bilerek kayıplı bir kanal eklediler ve ölçüm keskinleşti", "en": "They added a lossy channel to the sensor on purpose, and the measurement sharpened"}, "excerpt": {"tr": "Kuantum ölçümünde saptama kayıpları uzun süre kaçınılacak bir kusur sayıldı. Bu çalışmanın düzeneğinde kayıp, kaçınılan bir kusur olmaktan çıkıp kullanılan bir bileşene dönüşüyor; Fisher bilgisi üçe katlanıyor.", "en": "In quantum measurement, detection losses have long counted as a defect to avoid. In this study's device, loss stops being a defect to avoid and becomes a component in use; the Fisher information triples."}, "sections": [{"h": {"tr": "Düzeneğin üç parçası", "en": "The three parts of the device"}, "ps": [{"tr": "Birinci parça algılayıcı. Rydberg atomları, çok yüksek uyarılma seviyelerine çıkarıldıklarında büyük dipol momentleri taşır ve zayıf elektrik alanlarını yüksek duyarlıkla hisseder. Bir topluluk halinde kullanıldıklarında 160 nanosaniyelik çok kısa bir mikrodalga darbesi için tek atışta santimetre başına 217 ± 8 mikrovolt duyarlık elde edilmiş. Buradaki iki niteleyici önemli: tek atış, yani tekrarlı ortalama alma yok; ve 160 nanosaniye, yani sinyalin var olduğu süre son derece kısa.", "en": "The first part is the sensor. Rydberg atoms, driven to very high excitation levels, carry large dipole moments and feel weak electric fields with high sensitivity. Used as an ensemble, they reached single-shot precision of 217 ± 8 microvolts per centimetre for a very short 160-ns-long microwave pulse. The two qualifiers matter: single-shot, meaning no repeated averaging, and 160 nanoseconds, meaning the signal exists for a very short time.", "refs": ["ryd"]}, {"tr": "İkinci parça bağlantı. Aynı atomlar birbirleriyle dipol etkileşimi kurar; bu etkileşim çoğu düzenekte bir gürültü kaynağı sayılır, çünkü atomları bağımsız olmaktan çıkarır. Üçüncü parça yordamın kendisi: atomlar arası dipol etkileşimleri, saptama aşamasındaki alışılmış kayıplara karşı bilgiyi koruyan bir hata önleme yordamında kullanılıyor. Böylece sensörün içinde zaten bulunan bir etkileşim, ayrı bir kuantum işlemci kurulmadan bilgi işleme görevi üstleniyor.", "en": "The second part is the coupling. Those same atoms interact through their dipoles, and in most devices that interaction counts as a noise source, because it stops the atoms from being independent. The third part is the protocol itself: inter-atomic dipolar interactions are used in an error-prevention protocol that protects information against conventional losses at the detection stage. An interaction already present inside the sensor thereby takes on information processing, with no separate quantum processor built.", "refs": ["ryd"]}]}, {"h": {"tr": "Ters görünen adım ve geriye kalan yol", "en": "The step that looks backwards, and the road left"}, "ps": [{"tr": "Doğrusal olmayan, kayıplı ek bir kuantum kanalının sisteme katılması ilk bakışta yanlış yönde duruyor. Sezgi, kayıp eklemenin bilgiyi azaltacağını söyler. Ölçülen sonuç tersini veriyor: Fisher bilgisinde üç kat artış. Fisher bilgisi, bir ölçümün bilinmeyen bir parametre hakkında ne kadar şey söyleyebileceğinin üst sınırını verir; üç kat artış, aynı darbeden çıkarılabilecek bilginin üçe katlanması demektir. Eklenen kanal, bilgiyi ayırt edilebilir bir biçime taşıyarak kaybın vurduğu yerden uzaklaştırıyor.", "en": "Introducing an additional non-linear, lossy quantum channel into the system points the wrong way at first glance. Intuition says adding loss should reduce information. The measured result gives the opposite: a threefold enhancement of Fisher information. Fisher information gives the ceiling on how much a measurement can say about an unknown parameter, and a threefold rise means three times as much can be drawn from the same pulse. The added channel carries the information into a distinguishable form and away from where the loss lands.", "refs": ["ryd"]}, {"tr": "Sonuç şu sınırla birlikte okunmalı. Yapılmış olan: laboratuvar koşullarında tek bir alan genliği için, bilinen bir darbe süresinde, sayısı verilmiş bir duyarlık. Yapılmamış olan: farklı frekans bantlarında aynı kazancın sürüp sürmediği, sıcaklık ve manyetik kararsızlık altında yordamın ne kadar dayandığı, ve bağımsız bir grubun aynı düzeneği kurup aynı üç katı ölçmesi. Bir de biçimsel bir uyarı var: makale son düzenlemesi yapılmamış hızlandırılmış ön sürüm olarak yayımlandı ve bağımsız tekrar henüz bildirilmedi. Fikir sağlam görünüyor; sağlamlığın ölçüsü ikinci bir tezgâhta çıkar.", "en": "The result should be read with this boundary. Built: a stated precision, for one field magnitude, at a known pulse length, under laboratory conditions. Not built: whether the same gain holds across other frequency bands, how far the protocol survives thermal and magnetic instability, and whether an independent group can assemble the same device and measure the same factor of three. There is also a formal caveat: the paper appeared as an accelerated preview without final editing, and independent repetition has not yet been reported. The idea looks sound; the measure of soundness comes off a second bench.", "refs": ["ryd"]}]}], "sources": [{"key": "ryd", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76016-2", "title": {"tr": "Bilerek eklenen kayıplı bir kanal, Rydberg atomlu alan sensörünün taşıdığı bilgiyi üçe katladı", "en": "A deliberately lossy channel triples the information a Rydberg-atom field sensor keeps"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-05", "title": {"tr": "Karşılaştırma grubu yoktu ve yazarlar bunu kendileri yazdı", "en": "There was no comparison group, and the authors wrote that down themselves"}, "excerpt": {"tr": "Kırk iki kişilik, tek kollu, aşı öncesi ve sonrası ölçüme dayanan bir çalışma. Böyle bir tasarımla söylenebilecekler dardır. Buradaki ilginç nokta, o darlığın manşetten önce yazarlarca ilan edilmiş olması.", "en": "A single-arm study of forty-two people resting on measurement before and after vaccination. What such a design can say is narrow. The interesting part here is that the narrowness was declared by the authors ahead of any headline."}, "sections": [{"h": {"tr": "Tasarımın taşıyabileceği yük", "en": "What the design can carry"}, "ps": [{"tr": "Çalışma CoCo araştırmasına katılan 42 sağlık çalışanını kapsıyor ve ölçümler aşı öncesi ile sonrası olarak alınmış. Rastgeleleştirme yok, aşılanmamış bir karşılaştırma grubu yok. Katılımcıların önceki aşılamalarının ortancası 4,5 ve yüzde 90'ı en az bir enfeksiyon bildirmiş. Böyle bir toplulukta aşı sonrası yükselen her değer, aşının etkisi kadar zaman içindeki doğal seyrin, mevsimsel karşılaşmanın ve önceki bağışıklığın olgunlaşmasının da toplamıdır. Tasarım bu bileşenleri ayırmıyor; ayırmayı hedeflemiyor.", "en": "The study assessed 42 healthcare workers in the CoCo Study, with measurements taken before and after vaccination. There was no randomisation and no unvaccinated comparison group. Participants had a median of 4.5 previous vaccinations and 90 per cent reported at least one infection. In such a cohort, every value that rises after vaccination is the sum of the vaccine's effect, the natural course over time, seasonal exposure and the maturation of earlier immunity. The design does not separate these components; it does not set out to.", "refs": ["jn1"]}, {"tr": "Başlangıç değerleri, sonuçların nasıl okunacağını da belirliyor. Sıfırıncı günde bağlanma değerleri keskin bir antijenik sıralama gösterdi: Wu01 için 2438, BA.1.1 için 903, XBB.1.5 için 621, JN.1 için 84,1, KP.2 için 46,7, KP.3 için 54,4, XEC için 18,7. Başlangıç değerleri ile kat değişimi arasında ters yönlü bir bağıntı bulundu; en büyük kat artışları tabanın en düşük olduğu varyantlarda çıktı. Bu, tavanla sınırlı bir güçlenmenin beklenen görüntüsüdür ve göreli artışı mutlak kazançla karıştırmamak için yeterli sebeptir. 18,7'den başlayan bir değerin üçe katlanması ile 2438'den başlayan bir değerin aynı oranda artması, bağışıklık açısından aynı şey sayılmaz.", "en": "Baseline values also set how the results should be read. At day zero, binding titres showed a pronounced antigenic gradient: 2438 for Wu01, 903 for BA.1.1, 621 for XBB.1.5, 84.1 for JN.1, 46.7 for KP.2, 54.4 for KP.3, 18.7 for XEC. Baseline values correlated inversely with fold change, and the largest fold increases appeared for the variants with the lowest floor. That is the expected signature of ceiling-limited boosting, and reason enough not to conflate relative increase with absolute gain. Tripling a value that starts at 18.7 and raising a value that starts at 2438 by the same proportion do not count as the same thing immunologically.", "refs": ["jn1"]}]}, {"h": {"tr": "Sınırlılıklar bölümünün hakkını vermek", "en": "Giving the limitations section its due"}, "ps": [{"tr": "Yazarlar sınırlılıklar bölümünde, bu türden çalışmalarda alışılmış olandan daha açık davranıyor. Gözlenen kayışın JN.1 uyarlı hatırlatma dozunun mu yoksa önceki karşılaşmaların oluşturduğu hazırlıklı olgunlaşmanın mı ürünü olduğunu kesin olarak belirleyemediklerini yazıyorlar. Katılımcıların gönüllü sağlık çalışanları olması nedeniyle topluluğun kendi kendini seçme yanlılığı taşıyabileceğini ve genel nüfusu temsil etmeyebileceğini belirtiyorlar. Kritik nokta da şu: JN.1 uyarlı aşının yetkilendirildiği tarihte, önceki karşılaşması az olan bir karşılaştırma topluluğu kurmak uygulamada olanaksızdı.", "en": "In the limitations section the authors behave more frankly than is usual in work of this kind. They write that they cannot definitively determine whether the observed shift was induced by the JN.1-adapted booster or reflects pre-existing anticipatory maturation generated by prior exposures. They state that as participants were healthcare workers who volunteered, the cohort may be subject to self-selection bias and is not necessarily representative of the general population. And the critical point: by the time the JN.1-adapted vaccine was authorised, establishing a comparator cohort with minimal prior exposure was practically impossible.", "refs": ["jn1"]}, {"tr": "Bu sonuncusu bir mazeret sayılmamalı; bir tanıdır. Bir tasarımın ideal olmaması ile o tasarımın seçilebilir olmaması ayrı şeylerdir; dördüncü pandemi yılında karşılaştırma grubu talep etmek, var olmayan bir nüfusu talep etmek anlamına gelir. Doğru soru, çalışmanın kontrolsüz olup olmadığı yerine, kontrolsüz bir çalışmadan çıkarılabilecek sonucun sınırlarına uyulup uyulmadığıdır. Burada uyulmuş: yazarlar boyunca ilişkilendirme dili kullanıyor, mekanizma iddiasını yedi bağışçıdan alınan örneklerin tek hücre dizilemesine dayandırıyor ve nedensel katkıları ayırmak için bağışıklığı olmayan kişilerde ileriye dönük çalışmalara ve tanımlı takvimli kontrollü şemalara ihtiyaç duyulduğunu kendileri söylüyor. Kaç kişide sorusunun cevabı hâlâ kırk iki; ama bu kırk ikiden ne çıkarılabileceği doğru yazılmış.", "en": "That last point should not count as an excuse; it is a diagnosis. A design being less than ideal and a design being available are separate things; demanding a comparison group in the fourth year of a pandemic amounts to demanding a population that no longer exists. The right question, instead of whether the study is uncontrolled, is whether the limits on what an uncontrolled study can conclude were respected. Here they were: the authors use associational language throughout, rest the mechanistic claim on single-cell sequencing of samples from seven donors, and themselves say that prospective studies in antigen-naive individuals and controlled schedules with defined exposure are needed to disentangle the causal contributions. The answer to how many is still forty-two; but what can be drawn from those forty-two has been written down correctly.", "refs": ["jn1"]}]}], "sources": [{"key": "jn1", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76035-z", "title": {"tr": "JN.1 uyarlı hatırlatma dozu yeni hücre çağırmak yerine var olan bellek hücrelerini inceltiyor", "en": "A JN.1-adapted booster refines existing memory B cells instead of recruiting new ones"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-06", "title": {"tr": "Beş bin üç yüz yıl önce Avrasya çoktan tek bir odaydı", "en": "Five thousand three hundred years ago Eurasia was already one room"}, "excerpt": {"tr": "Bir hastalığın soyağacı, insanların birbirine ne kadar yakın olduğunu bir haritadan daha dürüst anlatabiliyor. İskandinavya, Orta Avrupa ve kuzey Çin aynı dallanmada buluşuyor; arada 7.500 kilometreyi aşan bir mesafe ve yalnızca birkaç yüzyıl var.", "en": "The family tree of a disease can tell you how close people were more honestly than a map. Scandinavia, Central Europe and northern China meet at the same branching, with more than 7,500 kilometres between them and only a few centuries."}, "sections": [{"h": {"tr": "Kemikten çıkan mesafe", "en": "The distance that came out of bone"}, "ps": [{"tr": "Bir ekip Doğu Avrasya'dan 8.000-400 yıl öncesine ait 1.400 eski insan kalıntısını taradı ve biri Doğu Asya'dan olmak üzere üç tarih öncesi Yersinia pestis genomu elde etti. Bu üç genom, yayımlanmış 136 eski ve güncel genomla birleştirildiğinde ortaya bir dallanma çıkıyor: yaklaşık 5.300 yıl öncesinde, İskandinavya'yı, Orta Avrupa'yı ve kuzey Çin'i aynı düğüme bağlayan bir nokta. Düşük tek nükleotid uzaklıkları ve uç tarihlendirme, 7.500 kilometreyi aşan bir alanda ayrışmaların yüzyıl ölçeğinde gerçekleştiğine işaret ediyor; en düşük yayılma hızının ortancası yılda 32,9 kilometrelik bir değer veriyor.", "en": "A team screened 1,400 ancient human remains from eastern Eurasia dated 8,000-400 years ago and recovered three prehistoric Yersinia pestis genomes, including one from East Asia. Integrated with 136 published ancient and modern genomes, those three produce a branching: at about 5,300 years ago, a node tying Scandinavia, Central Europe and northern China together. Low single-nucleotide distances and tip-dating indicate splits over century-scale intervals across more than 7,500 kilometres, with a median lower-bound dispersal rate of 32.9 kilometres a year.", "refs": ["pes"]}, {"tr": "Yılda otuz üç kilometrelik bir hız, yürüyerek bir günlük yoldan azdır. Bir ömür boyunca iki bin kilometre eder; on nesilde kıtanın bir ucundan diğerine yeter. Bu sayı hızlı bir felaket resmi çizmiyor. Çizdiği şey daha rahatsız edici: sabit, sıradan, kesintisiz bir temas. Bakteri o mesafeyi tek başına kat etmedi; insanlar, hayvanlar, mallar ve yollar taşıdı.", "en": "A rate of thirty-three kilometres a year is less than a day's walk. Over a lifetime it comes to two thousand kilometres; in ten generations it reaches from one end of the continent to the other. The number does not paint a picture of swift catastrophe. What it paints is more unsettling: steady, ordinary, unbroken contact. The bacterium did not cross that distance alone; people, animals, goods and roads carried it.", "refs": ["pes"]}]}, {"h": {"tr": "Tarih öncesini yeniden çerçevelemek", "en": "Reframing what came before history"}, "ps": [{"tr": "Tarih öncesi topluluklar için kullandığımız kelimeler -izole, yerel, dağınık- büyük ölçüde kanıtın sessizliğinden doğdu. Çanak çömlek ve mezar yavaş taşınır; hastalık ise taşınırken taşıyanı da anlatır. İncelenen yedi derin evre içinde yalnızca LNBA+ soyunun taban dalı, genom genelindeki mutasyon dağılımına kıyasla bozucu genomik yeniden düzenlenmede anlamlı bir yoğunlaşma gösteriyor; buna ymt geninin kazanılması dahil. Bakteri bu ağın içinde yalnızca yolculuk etmedi; yol boyunca kendisi de değişti.", "en": "The words we use for prehistoric communities — isolated, local, scattered — grew largely out of the silence of the evidence. Pottery and graves travel slowly; a disease, while being carried, also describes its carrier. Of the seven deep phases examined, only the basal stem of the LNBA+ lineage shows significant enrichment of disruptive genomic remodeling relative to the genome-wide background distribution of mutation categories, including acquisition of the ymt gene. The bacterium did not merely journey through this network; it was altered along the way.", "refs": ["pes"]}, {"tr": "Buradaki temkin gerçek. Bulgular genomlardan kurulan bir soyağacına dayanıyor, kervan yollarının doğrudan gözlemine değil. Genomlar hangi güzergâhın hangi yönde kullanıldığını söylemiyor; söyledikleri şey, uçların birbirine bağlı olduğu. Yine de bağlantının kendisi yeterince büyük bir kanıt. Bugün bir salgının haftalar içinde kıtaları geçmesini modern dünyaya özgü bir kusur sayma alışkanlığımız var. Bu çalışma, hızın değiştiğini ama örüntünün aynı kaldığını düşündürüyor: beş bin yıldır aynı odadayız, yalnızca ses daha çabuk yayılıyor.", "en": "The caution here is real. The findings rest on a phylogeny built from genomes, and not on direct observation of caravan routes. The genomes do not say which route was used in which direction; what they say is that the ends were connected. Even so, the connection alone counts as large evidence. We are in the habit of treating an epidemic crossing continents in weeks as a defect particular to the modern world. This study suggests the speed changed while the pattern stayed the same: we have been in the same room for five thousand years, and only the sound now travels faster.", "refs": ["pes"]}]}], "sources": [{"key": "pes", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75911-y", "title": {"tr": "Eski genomlar vebayı Doğu Asya'ya taşıdı ve Avrasya yayılımını 5.300 yıl öncesine tarihledi", "en": "Ancient genomes place plague in East Asia and date its Eurasian spread to 5,300 years ago"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}], "dates": ["2026-07-31", "2026-07-30", "2026-07-29", "2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25"], "dateLabels": {"2026-07-31": {"tr": "31 Temmuz 2026", "en": "July 31, 2026"}, "2026-07-30": {"tr": "30 Temmuz 2026", "en": "July 30, 2026"}, "2026-07-29": {"tr": "29 Temmuz 2026", "en": "July 29, 2026"}, "2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}, "2026-07-26": {"tr": "26 Temmuz 2026", "en": "July 26, 2026"}, "2026-07-25": {"tr": "25 Temmuz 2026", "en": "July 25, 2026"}}, "newsDates": {"science": "2026-07-31"}, "podcasts": {"science": {"2026-07-25": {"files": {"en": {"url": "/episodes/2026-07-25-science-en.64b39e4b7401.mp3", "bytes": 1242636}}}, "2026-07-26": {"files": {"en": {"url": "/episodes/2026-07-26-science-en.c4827f019e19.mp3", "bytes": 1177435}}}, "2026-07-27": {"files": {"en": {"url": "/episodes/2026-07-27-science-en.919634e32d2a.mp3", "bytes": 1110561}}}, "2026-07-28": {"files": {"en": {"url": "/episodes/2026-07-28-science-en.63f7591c34cf.mp3", "bytes": 1539805}}}, "2026-07-30": {"files": {"en": {"url": "/episodes/2026-07-30-science-en.1104a6942156.mp3", "bytes": 1759652}}}, "2026-07-31": {"files": {"en": {"url": "/episodes/2026-07-31-science-en.217d5d2b04ee.mp3", "bytes": 1719528}}}}}, "updated": "2026-07-31T10:31:52+00:00"};

function detectTopic(){
  if (TOPIC_IDS.has(ROUTE_TOPIC)) return ROUTE_TOPIC;
  try { const s = localStorage.getItem('topic'); if (TOPIC_IDS.has(s)) return s; } catch {}
  return 'ai';
}
let TOPIC = detectTopic();
function topicMeta(id){ return TOPICS.find(t=>t.id===id) || TOPICS[0]; }
// An article's topic comes from its writer; a news item carries its own, defaulting to
// 'ai' so the pre-topic archive still lands under the AI desk.
function knownTopic(value){
  return typeof value === 'string' && TOPIC_IDS.has(value) ? value : null;
}
function topicOf(a){ return knownTopic(personaOf(a.writer).topic) || 'ai'; }
function newsTopicOf(n){ return knownTopic(n.topic) || 'ai'; }
function topicArticleDates(){
  return [...new Set(DATES.filter(d =>
    ARTICLES.some(a => a.date===d && topicOf(a)===TOPIC)))].sort().reverse();
}
function topicBriefDates(){
  const dates = new Set();
  BRIEFS.forEach(brief=>{
    if(brief && brief.topic===TOPIC && typeof brief.editionDate==='string'){
      dates.add(brief.editionDate);
    }
  });
  return [...dates].sort().reverse();
}
function topicDates(){
  return [...new Set([...topicArticleDates(), ...topicBriefDates()])].sort().reverse();
}
function badgeOf(w){
  return topicMeta(w.topic).label[LANG].toLocaleUpperCase(LANG==='tr'?'tr-TR':'en-US');

function topicRoute(topic, lang){ return `/${lang}/${knownTopic(topic) || 'ai'}/`; }

}
function articleRoute(article, lang){
  if (!article) return topicRoute(TOPIC, lang);
  const path = articleId(article).split('/').map(encodeURIComponent).join('/');
  return `${topicRoute(topicOf(article), lang)}${path}/`;
}

function detectLang(){
  if (ROUTE_LANG === 'tr' || ROUTE_LANG === 'en') return ROUTE_LANG;
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'tr' || saved === 'en') return saved;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return TURKIC_TZ.has(tz) ? 'tr' : 'en';
  } catch { return 'tr'; }
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function localized(value){
  if (value && typeof value==='object') {
    return value[LANG] || value[LANG==='tr'?'en':'tr'] || '';

function referenceDate(value){
  if(typeof value!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
  const parsed = new Date(`${value}T00:00:00Z`);

    year:'numeric',month:'long',day:'numeric',timeZone:'UTC'

/* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

  const image = brief.image && typeof brief.image==='object' ? brief.image : {};
  const variants = Array.isArray(image.variants) ? image.variants
    .map(row => ({src:safeBriefAsset(row?.src), width:Number(row?.width)}))
    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)
    .sort((a,b)=>a.width-b.width) : [];
  const src = safeBriefAsset(image.src);
  const srcset = variants.map(row => `${row.src} ${row.width}w`).join(', ');
  const width = Number.isInteger(image.width) && image.width > 0 ? image.width : 1280;
  const height = Number.isInteger(image.height) && image.height > 0 ? image.height : 720;
  const loading = index===0 ? 'eager' : 'lazy';

    : '(min-width:2560px) 30rem,(min-width:1920px) 28rem,(min-width:1440px) 25rem,(min-width:1200px) 23rem,(min-width:641px) 33vw,calc(100vw - 2rem)';
  const mediaOpen = detailHref

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

function articleHTML(a){
  const proseParts = [];
  const parts = [];
  const u = UI[LANG];
  const seenKeys = new Set();
  const seenUrls = new Set();
  const sources = [];
  (Array.isArray(a.sources) ? a.sources : []).forEach(source=>{
    if(!source || typeof source!=='object' || Array.isArray(source)) return;
    const key = typeof source.key==='string' ? source.key : '';
    // Old archives omitted `kind`; those records were external reporting.
    const kind = source.kind ?? 'news';
    if(kind!=='news' && kind!=='article') return;
    const rawHref = typeof source.url==='string' ? source.url : '';
    let href = safeHref(rawHref);
    const name = typeof source.name==='string' ? source.name.trim() : '';
    const title = localized(source.title);
    const publishedDate = typeof source.publishedDate==='string' ? source.publishedDate : '';
    const citationDate = referenceDate(publishedDate);
    if(publishedDate && !citationDate) return;
    if(kind==='article'){
      if(!citationDate) return;
      try{
        const parsed = new URL(rawHref);
        const canonical = `https://eigenradar.com${parsed.pathname}`;
        if(rawHref!==canonical || parsed.protocol!=='https:'
            || parsed.host!=='eigenradar.com' || parsed.search || parsed.hash
            || !/^\/tr\/(?:ai|geopolitics|economics-markets|science)\/(?:ai|geo|eco|sci)-\d{2}\/\d{4}-\d{2}-\d{2}\/(?:[2-9]\d*\/)?$/.test(parsed.pathname)
            || name!=='Eigen Radar'
            || !parsed.pathname.includes(`/${publishedDate}/`)) return;
        parsed.pathname = parsed.pathname.replace(/^\/tr\//,`/${LANG}/`);
        href = parsed.href;
      }catch{return;}
    }
    if(!/^[a-z][a-z0-9-]{0,63}$/.test(key) || seenKeys.has(key)
        || !href || seenUrls.has(href) || !name || !title) return;
    seenKeys.add(key); seenUrls.add(href);
    sources.push({
      ...source,
      _citationHref:href,
      _citationInternal:kind==='article',
      _citationDate:citationDate
    });
  });
  const sourceNumbers = new Map(sources.map((source,index)=>[source.key,index+1]));
  const sourceOccurrences = new Map();
  let occurrence = 0;
  const sections = Array.isArray(a.sections) ? a.sections : [];
  sections.forEach(s=>{
    if (!s || typeof s !== 'object' || Array.isArray(s)) return;
    const heading = localized(s.h);
    if (heading) proseParts.push(`<h2>${escapeHTML(heading)}</h2>`);
    const paragraphs = Array.isArray(s.ps) ? s.ps : [];
    paragraphs.forEach(p=>{
      occurrence += 1;
      const refs = Array.isArray(p?.refs) ? [...new Set(p.refs)] : [];
      const markers = refs.map(key=>sourceNumbers.get(key)).filter(Boolean).map(number=>{
        const ids = sourceOccurrences.get(number) || [];
        const citationId = `reader-citation-${number}-${ids.length+1}`;
        ids.push(citationId);
        sourceOccurrences.set(number,ids);
        return `<a id="${citationId}" href="${escapeHTML(articleRoute(a,LANG))}#reference-${number}" data-reader-target="reader-reference-${number}" aria-label="${escapeHTML(`${u.reference} ${number}`)}" data-citation-occurrence="${occurrence}">[${number}]</a>`;
      }).join(', ');
      proseParts.push(`<p>${escapeHTML(localized(p))}${markers ? `<sup class="citation">${markers}</sup>` : ''}</p>`);
    });
  });
  if(proseParts.length) parts.push(`<div class="article-prose">${proseParts.join('')}</div>`);
  if(sources.length){
    const hasRetrospective = sources.some(source=>source.retrospective===true);
    const items = sources.map((source,index)=>{
      const marker = source.retrospective===true
        ? `<sup class="retrospective-marker" aria-hidden="true">†</sup><span class="visually-hidden"> — ${escapeHTML(u.retrospectiveLabel)}</span>` : '';
      const attrs = source._citationInternal ? '' : ' class="external" target="_blank" rel="noopener noreferrer external"';
      const number = index+1;
      const ids = sourceOccurrences.get(number) || [];
      const backlinks = ids.map((citationId,occurrence)=>{
        const suffix = ids.length>1 ? String(occurrence+1) : '';
        const label = `${u.returnToCitation} ${number}${ids.length>1 ? ` ${occurrence+1}` : ''}`;
        const permanentCitationId = citationId.replace(/^reader-/,'');
        return `<a href="${escapeHTML(articleRoute(a,LANG))}#${permanentCitationId}" data-reader-target="${citationId}" aria-label="${escapeHTML(label)}">↩${suffix}</a>`;
      }).join('');
      const kindLabel = source._citationInternal ? u.previousArticle : u.newsSource;
      const dateHTML = source._citationDate
        ? `<time datetime="${escapeHTML(source.publishedDate)}">${escapeHTML(source._citationDate)}</time>`
        : `<span class="reference-date-unavailable">${escapeHTML(u.dateUnavailable)}</span>`;
      return `<li id="reader-reference-${number}" tabindex="-1"><span class="reference-kind${source._citationInternal?' internal':''}">${escapeHTML(kindLabel)}</span><a href="${escapeHTML(source._citationHref)}"${attrs}><span class="reference-heading"><strong>${escapeHTML(source.name)}</strong><span aria-hidden="true">·</span>${dateHTML}</span><cite>${escapeHTML(localized(source.title))}${marker}</cite></a>${backlinks?`<span class="reference-backlinks">${backlinks}</span>`:''}</li>`;
    }).join('');
    const note = hasRetrospective ? `<p class="references-note">${escapeHTML(u.retrospectiveNote)}</p>` : '';
    parts.push(`<section class="references" id="reader-references" aria-labelledby="reader-references-title"><h2 id="reader-references-title">${escapeHTML(u.references)}</h2><ol class="reference-list">${items}</ol>${note}</section>`);
  }
  return parts.join('');
}

/* Articles reference a writer by ID; fall back to name for legacy data.
   Never returns undefined: an unknown ref yields a placeholder, so one retired or
   mistyped id cannot throw in renderAll() and blank the date menu + writers section. */
function personaOf(ref){
  return WRITERS.find(w=>w.id===ref) || WRITERS.find(w=>w.name===ref)
      || {id:ref, name:ref, role:{tr:'Konuk yazar', en:'Guest columnist'}};
}

/* An article is identified by writer + date, plus its edition index n when a writer files
   more than once that day — stable enough to share as a #hash. Edition 1 is encoded bare
   (no /n suffix) so every already-published permalink keeps resolving. topic is derivable
   from the article, so it isn't in the key. Mirrors build.py's article_key(). */
let currentArticle = null;
let savedScroll = 0;  // where the reader left the edition before opening a column
/* The article's edition index as build.py's int() would read it: decimal digits only
   (so "0x10"/"1e1" are garbage, not 16/10), truncated toward zero, anything unreadable
   is edition 1. Mirrors build.py's article_key() coercion. */
function editionN(a){
  const raw = typeof a.n === 'string' && !/^\s*[+-]?\d+\s*$/.test(a.n) ? NaN : a.n;
  return Math.trunc(Number(raw) || 1);
}
function articleId(a){
  const n = editionN(a);
  return n > 1 ? `${a.writer}/${a.date}/${n}` : `${a.writer}/${a.date}`;
}
/* One article per writer: their latest same-day edition (highest n). A writer who files
   twice over a day's news pool shows only their newest column in every roster; the earlier
   edition stays reachable by its permalink and from the reader's edition selector. */
function latestPerWriter(list){
  const best = new Map();
  list.forEach(a=>{
    const id = personaOf(a.writer).id;
    const cur = best.get(id);
    if (!cur || editionN(a) > editionN(cur)) best.set(id, a);
  });
  const seen = new Set(), out = [];
  list.forEach(a=>{ const id = personaOf(a.writer).id;
    if (!seen.has(id)){ seen.add(id); out.push(best.get(id)); } });
  return out;
}
function hashId(){
  const raw = location.hash.replace(/^#/, '');
  try { return decodeURIComponent(raw); }
  catch { return raw; }
}

/* Sidebar list of every writer publishing on this article's desk + day. */
function renderReaderNav(a){
  const nav = $('readerNav');
  const siblings = latestPerWriter(
    ARTICLES.filter(x => x.date===a.date && topicOf(x)===topicOf(a)));
  nav.innerHTML = `<div class="nav-head">${UI[LANG].writersBtn}</div>`;
  siblings.forEach(x => {
    const b = document.createElement('button');
    // Name + what they wrote about: a bare roster of names gives the reader no reason
    // to click. textContent, not innerHTML — titles are data.
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = personaOf(x.writer).name;
    const tl = document.createElement('span'); tl.className = 'tl';
    tl.textContent = localized(x.title);
    b.append(nm, tl);
    b.title = localized(x.title);
    if (articleId(x) === articleId(a)) b.setAttribute('aria-current','true');
    else b.addEventListener('click', () => openArticle(x));
    nav.appendChild(b);
  });

  // Keep one option per loaded date and show the current article's date as selected.
  // Repeat editions stay in the article's dedicated edition controls.
  const u = UI[LANG];
  const byDate = new Map();
  ARTICLES
    .filter(x => personaOf(x.writer).id===personaOf(a.writer).id)
    .forEach(x => {
      const current = byDate.get(x.date);
      if (x.date===a.date) byDate.set(x.date, a);
      else if (!current || editionN(x)>editionN(current)) byDate.set(x.date, x);
    });
  const writerDates = [...byDate.values()].sort((x,y) => y.date.localeCompare(x.date));
  if (writerDates.length > 1){
    const field = document.createElement('label');
    field.className = 'reader-history';
    const head = document.createElement('span');
    head.className = 'nav-head';
    head.textContent = u.moreFrom;
    const select = document.createElement('select');
    select.className = 'reader-history-select';
    select.dataset.writerHistorySelect = '1';
    writerDates.forEach(x => {
      const option = document.createElement('option');
      option.value = articleId(x);
      option.textContent = localized(DATE_LABELS[x.date]) || x.date;
      option.selected = x.date===a.date;
      select.appendChild(option);
    });
    select.addEventListener('change', () => {
      const next = writerDates.find(x => articleId(x)===select.value);
      if (next) openArticle(next);
    });
    field.append(head, select);
    nav.appendChild(field);
  }
}

/* Free on-device read-aloud (Web Speech API). Zero synthesis cost, so every column has
   audio even though only the weekly desk briefs get ElevenLabs episodes. */
function articleText(a){
  const parts = [localized(a.title)];
  (Array.isArray(a.sections) ? a.sections : []).forEach(s=>{
    if (!s || typeof s!=='object') return;
    parts.push(localized(s.h));
    (Array.isArray(s.ps) ? s.ps : []).forEach(p=>parts.push(localized(p)));
  });
  return parts.filter(Boolean).join('. ');
}
function stopReadAloud(){
  const u = UI[LANG];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.listen-btn.speaking').forEach(b=>{
    b.classList.remove('speaking');
    b.textContent = u.listenBtn;
  });
}

function renderReader(a){
  const u = UI[LANG];
  const w = personaOf(a.writer);
  stopReadAloud();  // a re-render (language switch, next column) invalidates the utterance
  // Every path into the reader (open, language switch, next column) lands here, so the
  // tab/share title tracks the article from one place.
  const shareTitle = localized(a.title);
  if (shareTitle) document.title = `${shareTitle} — Eigen Radar`;
  $('btnTr').href = articleRoute(a, 'tr');
  $('btnEn').href = articleRoute(a, 'en');
  $('readerBack').textContent = u.back;
  $('readerShare').textContent = u.shareBtn;
  renderReaderNav(a);
  $('readerContent').innerHTML = `
    <div class="wtop">
      <div class="avatar">${avatarOf(w)}</div>
      <div>
        <div class="wname">${escapeHTML(w.name)}<span class="ai-badge">${escapeHTML(badgeOf(w))}</span></div>
        <div class="wrole">${escapeHTML(localized(w.role))} · ${u.aiPersona} · ${escapeHTML(localized(DATE_LABELS[a.date]))}</div>
      </div>
    </div>
    <h1>${escapeHTML(localized(a.title))}</h1>
    <div class="body">${articleHTML(a)}</div>
    ${disclaimerHTML(topicOf(a)) ? `<div class="disclaimer" role="note">${disclaimerHTML(topicOf(a))}</div>` : ''}
  `;
  // Same-day editions of THIS writer: a rerun files a second column beside the first.
  // Rosters show only the latest; here in the open column, offer the reader the others.
  const editions = ARTICLES
    .filter(x => personaOf(x.writer).id===w.id && x.date===a.date)
    .sort((x,y)=>editionN(x)-editionN(y));
  if (editions.length > 1){
    const erow = document.createElement('div');
    erow.className = 'editions-row';
    const lab = document.createElement('span');
    lab.className = 'editions-label';
    lab.textContent = u.editionsToday;
    erow.appendChild(lab);
    editions.forEach(x=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'edition-btn';
      b.textContent = editionN(x);
      b.setAttribute('aria-label', `${u.editionWord} ${editionN(x)}`);
      if (articleId(x)===articleId(a)) b.setAttribute('aria-current','true');
      else b.addEventListener('click', ()=>openArticle(x));
      erow.appendChild(b);
    });
    $('readerContent').querySelector('.wtop').after(erow);
  }
  if ('speechSynthesis' in window){
    const row = document.createElement('div');
    row.className = 'listen-row';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'listen-btn';
    b.textContent = u.listenBtn;
    // ponytail: rate only — pitch/volume are the same API, add sliders if anyone asks
    const rate = document.createElement('input');
    rate.type = 'range'; rate.min = '0.5'; rate.max = '2'; rate.step = '0.1';
    const defaultRate = 1.2;
    const normalizeRate = value => {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) && parsed >= 0.5 && parsed <= 2
        ? Math.round(parsed * 10) / 10
        : defaultRate;
    };
    try { rate.value = String(normalizeRate(localStorage.getItem('ttsRate'))); }
    catch { rate.value = String(defaultRate); }
    rate.className = 'listen-rate';
    rate.setAttribute('aria-label', u.listenRate);
    const out = document.createElement('span');
    out.className = 'listen-rate-val';
    const showRate = ()=>{ out.textContent = rate.value + '×'; };
    showRate();
    // speechSynthesis ignores rate changes mid-utterance; restart so the slider actually does something
    rate.addEventListener('input', ()=>{
      rate.value = String(normalizeRate(rate.value));
      showRate();
      try { localStorage.setItem('ttsRate', rate.value); } catch {}
      if (b.classList.contains('speaking')){ stopReadAloud(); speak(); }
    });
    function speak(){
      const msg = new SpeechSynthesisUtterance(articleText(a));
      msg.lang = LANG==='tr' ? 'tr-TR' : 'en-US';
      msg.rate = normalizeRate(rate.value);
      msg.onend = msg.onerror = stopReadAloud;
      b.classList.add('speaking');
      b.textContent = u.listenStop;
      speechSynthesis.speak(msg);
    }
    b.addEventListener('click', ()=>{
      if (b.classList.contains('speaking')) stopReadAloud(); else speak();
    });
    row.append(b, rate, out);
    $('readerContent').querySelector('h1').after(row);
  }
}

/* Show an article in the reading pane. fromNav=true when we're reacting to a hash change
   (deep link / back-forward) — the hash is already correct, so we don't rewrite it. */
function showArticle(a, fromNav){
  currentArticle = a;
  // A deep link may land on a different desk/day than what's rendered behind the reader.
  const t = topicOf(a);
  if (t !== TOPIC || selectedDate !== a.date){
    if (t !== TOPIC){
      TOPIC = t;
      newsPage = 0;
      try { localStorage.setItem('topic', t); } catch {}
      selectedBriefDate = topicBriefDates()[0] || null;
    }
    selectedDate = a.date;
    activeFilter = 'all';
    renderAll();
  }
  renderReader(a);
  if (!fromNav && hashId() !== articleId(a)) location.hash = articleId(a);
  if (!document.body.classList.contains('reading')) savedScroll = window.scrollY;
  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  $('readerBack').focus();
}
function openArticle(a){ showArticle(a, false); }

function closeArticle(){
  if (!currentArticle) return;
  stopReadAloud();
  currentArticle = null;
  document.title = topicMeta(TOPIC).pageMeta[LANG].page;
  document.body.classList.remove('reading');
  $('btnTr').href = homeLanguageRoute('tr');
  $('btnEn').href = homeLanguageRoute('en');
  window.scrollTo(0, savedScroll);  // back to where the reader left the edition
  if (hashId()) history.pushState(null, '', location.pathname + location.search);
}

/* Citation fragments live inside the hash-routed reader. Keep the article's shareable
   hash intact while scrolling in either direction; otherwise `hashchange` would treat
   the citation/reference fragment as an unknown article and close the reader. */
$('readerContent').addEventListener('click', event=>{
  const link = event.target.closest('a[data-reader-target]');
  if(!link || !currentArticle || !isPlainClick(event)) return;
  const target = document.getElementById(link.dataset.readerTarget);
  if(!target) return;
  event.preventDefault();
  target.scrollIntoView({block:'start'});
  target.focus({preventScroll:true});
});

/* Single source of truth for the reader: the URL hash. Handles deep links on load and
   the browser back/forward buttons. openArticle sets the hash, which lands back here. */
function syncFromHash(){
  const id = hashId();
  const a = id && ARTICLES.find(x => articleId(x) === id);
  if (!a){
    currentArticle = null;
    if (document.body.classList.contains('reading')){
      document.body.classList.remove('reading');
      document.title = topicMeta(TOPIC).pageMeta[LANG].page;
      window.scrollTo(0, savedScroll);  // browser Back out of a column
    }
    return;
  }
  if (currentArticle && articleId(currentArticle) === id) return;
  showArticle(a, true);
}
$('readerBack').addEventListener('click', closeArticle);
/* Logo goes home: close any open column in place rather than reloading. The href stays
   a real link so middle-click / new-tab still work. */
$('homeLink').addEventListener('click', e => {
  if (!isPlainClick(e)) return;
  e.preventDefault();
  closeArticle();
  window.scrollTo(0, 0);
});
/* The hash id was designed to be shared; this is its one-tap affordance. Native share
   sheet where the platform has one, clipboard with a brief confirmation elsewhere. */
$('readerShare').addEventListener('click', async ()=>{
  const u = UI[LANG];
  const payload = {title: currentArticle ? localized(currentArticle.title) : document.title,
                   url: location.href};
  if (navigator.share) { navigator.share(payload).catch(()=>{}); return; }
  try {
    await navigator.clipboard.writeText(payload.url);
    $('readerShare').textContent = u.shareCopied;
    setTimeout(()=>{ $('readerShare').textContent = UI[LANG].shareBtn; }, 2000);
  } catch {}
});
window.addEventListener('hashchange', syncFromHash);

function writerCarouselMetrics(){
  const track = $('writersIntroGrid');
  const cards = [...track.querySelectorAll(':scope > .writer-intro-card')];
  if (!cards.length) return {track, cards, visible:0, start:0, maxStart:0};
  const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
  const step = cards[0].getBoundingClientRect().width + gap;
  const visible = Math.max(1, Math.min(cards.length,
    Math.round((track.clientWidth + gap) / step)));
  const maxStart = Math.max(0, cards.length - visible);
  const start = Math.max(0, Math.min(maxStart, Math.round(track.scrollLeft / step)));
  return {track, cards, visible, start, maxStart};
}

function updateWriterCarousel(announce=false, forcedStart=null){
  const u = UI[LANG];
  const metrics = writerCarouselMetrics();
  const start = forcedStart === null ? metrics.start :
    Math.max(0, Math.min(metrics.maxStart, forcedStart));
  const prev = $('writersIntroPrev');
  const next = $('writersIntroNext');
  const hasOverflow = metrics.cards.length > metrics.visible;
  prev.hidden = next.hidden = !hasOverflow;
  prev.disabled = !hasOverflow || start === 0;
  next.disabled = !hasOverflow || start === metrics.maxStart;
  const shell = metrics.track.closest('.writers-intro-shell');
  if (shell){
    shell.dataset.canScrollPrev = String(hasOverflow && start > 0);
    shell.dataset.canScrollNext = String(hasOverflow && start < metrics.maxStart);
  }
  metrics.track.dataset.start = String(start);
  if (announce && metrics.cards.length){
    $('writersIntroStatus').textContent = u.writersIntroStatus
      .replace('{start}', String(start + 1))
      .replace('{end}', String(Math.min(metrics.cards.length, start + metrics.visible)))
      .replace('{total}', String(metrics.cards.length));
  }
  return {...metrics, start};
}

function scrollWriterCarousel(direction){
  const metrics = updateWriterCarousel();
  if (!metrics.cards.length) return;
  const target = direction > 0
    ? Math.min(metrics.maxStart, metrics.start + metrics.visible)
    : Math.max(0, metrics.start - metrics.visible);
  if (target === metrics.start) return;
  const left = metrics.cards[target].offsetLeft - metrics.cards[0].offsetLeft;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  metrics.track.scrollTo({left, behavior:reduceMotion ? 'auto' : 'smooth'});
  updateWriterCarousel(true, target);
}

function resetWriterCarousel(){
  const track = $('writersIntroGrid');
  track.scrollLeft = 0;
  updateWriterCarousel(false, 0);
  requestAnimationFrame(()=>updateWriterCarousel());
}

function enableWriterCarouselMouseDrag(){
  const track = $('writersIntroGrid');
  let pointerId = null;
  let startX = 0;
  let startScroll = 0;
  let moved = false;
  let suppressClick = false;

  track.addEventListener('pointerdown', event=>{
    if (event.pointerType !== 'mouse' || event.button !== 0 || pointerId !== null) return;
    pointerId = event.pointerId;
    startX = event.clientX;
    startScroll = track.scrollLeft;
    moved = false;
  });
  track.addEventListener('pointermove', event=>{
    if (event.pointerId !== pointerId) return;
    const delta = event.clientX - startX;
    if (!moved){
      if (Math.abs(delta) <= 4) return;
      moved = true;
      track.classList.add('is-dragging');
      track.setPointerCapture(pointerId);
    }
    track.scrollLeft = startScroll - delta;
    event.preventDefault();
  });
  const finish = event=>{
    if (event.pointerId !== pointerId) return;
    const activePointer = pointerId;
    const didMove = moved;
    pointerId = null;
    moved = false;
    track.classList.remove('is-dragging');
    if (track.hasPointerCapture(activePointer)) track.releasePointerCapture(activePointer);
    if (didMove){
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; }, 0);
    }
    requestAnimationFrame(()=>updateWriterCarousel());
  };
  track.addEventListener('pointerup', finish);
  track.addEventListener('pointercancel', finish);
  track.addEventListener('lostpointercapture', finish);
  track.addEventListener('pointerleave', event=>{
    if (event.pointerId === pointerId && !moved) pointerId = null;
  });
  track.addEventListener('dragstart', event=>event.preventDefault());
  track.addEventListener('click', event=>{
    if (!suppressClick) return;
    suppressClick = false;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);
}

      <div class="wtop">

          <div class="wname">${escapeHTML(w.name)}<span class="ai-badge">${escapeHTML(badgeOf(w))}</span></div>
          <div class="wrole">${escapeHTML(localized(w.role))} · ${u.aiPersona}</div>
        </div>

/* ---------- filter state ---------- */
let activeFilter = 'all';
let searchQuery = '';
/* Fold both Turkish i pairs into one search form, then normalize combining marks. */
function searchFold(value){
  return String(value ?? '').normalize('NFKC').toLocaleLowerCase('tr-TR').replace(/ı/g,'i');
}
function newsHaystack(n){
  const parts = [];
  for (const f of ['title','summary','detail']){
    const v = n[f];
    if (v && typeof v==='object') parts.push(v.tr||'', v.en||'');
    else if (typeof v==='string') parts.push(v);
  }
  return searchFold(parts.join(' '));
}
function applyFilter(){
  newsPage = 0;
  renderNews();
}
$('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn || btn.tagName==='INPUT') return;
  if(btn.dataset.writers){ openDrawer(btn); return; }
  activeFilter = btn.dataset.f;
  document.querySelectorAll('.chip:not(.chip-writers)').forEach(c=>{
    c.classList.remove('active');
    if (c.tagName==='BUTTON') c.setAttribute('aria-pressed','false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-pressed','true');
  applyFilter();
});

/* ---------- writers drawer ---------- */
let drawerOpener = null;
function setDrawerBackgroundInert(inert){
  const drawer = $('drawer');
  const overlay = $('drawerOverlay');
  [...document.body.children].forEach(el=>{
    if(el!==drawer && el!==overlay && el.tagName!=='SCRIPT') el.inert = inert;
  });
}
function drawerFocusable(){
  return [...$('drawer').querySelectorAll(
    'button:not([disabled]),a[href],select:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )];
}
function openDrawer(opener){
  const drawer = $('drawer');
  if(drawer.classList.contains('open')) return;
  drawerOpener = opener || document.activeElement;
  drawer.inert = false;
  drawer.classList.add('open');
  $('drawerOverlay').classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  setDrawerBackgroundInert(true);
  $('drawerClose').focus();
}
function closeDrawer(restoreFocus=true){
  const drawer = $('drawer');
  if(!drawer.classList.contains('open')) return;
  drawer.classList.remove('open');
  $('drawerOverlay').classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  drawer.inert = true;
  document.body.style.overflow = '';
  setDrawerBackgroundInert(false);
  const opener = drawerOpener;
  drawerOpener = null;
  if(restoreFocus && opener?.isConnected) opener.focus();
}
$('drawerClose').addEventListener('click', closeDrawer);
$('drawerOverlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{
  const drawer = $('drawer');
  if(!drawer.classList.contains('open')) return;
  if(e.key==='Escape'){
    e.preventDefault();
    closeDrawer();
    return;
  }
  if(e.key!=='Tab') return;
  const focusable = drawerFocusable();
  if(!focusable.length){ e.preventDefault(); drawer.focus(); return; }
  const first = focusable[0];
  const last = focusable[focusable.length-1];
  if(e.shiftKey && (document.activeElement===first || !drawer.contains(document.activeElement))){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault();
    first.focus();
  }
});

/* ---------- language switch ---------- */
function setLang(l){
  try { localStorage.setItem('lang', l); } catch {}
  if (LANG === l) return;
  LANG = l;
  renderAll();
}
function chooseLanguage(e, lang){
  if (!isPlainClick(e)) return;
  if (ROUTE_LANG) {
    // Keep URL, canonical metadata and visible language aligned on localized routes.
    try { localStorage.setItem('lang', lang); } catch {}
    return;
  }
  e.preventDefault();
  setLang(lang);
}
$('btnTr').addEventListener('click', e=>chooseLanguage(e, 'tr'));
$('btnEn').addEventListener('click', e=>chooseLanguage(e, 'en'));

/* ---------- topic switch (one desk at a time, remembered like the language) ---------- */
function renderTopics(){
  const el = $('topicSwitch');
  el.innerHTML = '';
  TOPICS.forEach(t=>{
    const b = document.createElement('a');
    b.className = 'topic-btn' + (t.id===TOPIC ? ' active' : '');
    b.dataset.topic = t.id;
    b.href = topicRoute(t.id, LANG);
    if (t.id===TOPIC) b.setAttribute('aria-current', 'page');
    b.title = t.label[LANG];
    b.innerHTML = `${TOPIC_ICONS[t.id] || t.symbol}<span class="topic-label">${escapeHTML(t.label[LANG])}</span>`;
    el.appendChild(b);
  });
}
function setTopic(id){
  if (!TOPIC_IDS.has(id) || id===TOPIC) return;
  closeArticle();  // the current article belongs to the desk we're leaving
  try { localStorage.setItem('topic', id); } catch {}
  TOPIC = id;
  activeFilter = 'all';  // the previous desk's tags don't exist on this one
  searchQuery = '';      // a query is a per-desk thought; don't carry it across
  newsPage = 0;
  selectedDate = topicArticleDates()[0] || null;
  selectedBriefDate = topicBriefDates()[0] || null;
  renderAll();
}
$('topicSwitch').addEventListener('click', e=>{
  const b = e.target.closest('.topic-btn');
  if (!b || !isPlainClick(e)) return;
  if (TOPIC_IDS.has(ROUTE_TOPIC)){
    try { localStorage.setItem('topic', b.dataset.topic); } catch {}
    return;
  }
  e.preventDefault();
  setTopic(b.dataset.topic);
});

/* ---------- reader ---------- */
/* Escape closes; ArrowLeft/ArrowRight walk the same desk/day sibling list the reader
   nav renders (no wrap). Form controls and the topic tablist keep their own arrows. */
document.addEventListener('keydown', e=>{
  if (!currentArticle) return;
  if (e.key==='Escape'){ closeArticle(); return; }
  if (e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if (e.target.closest?.('input,select,textarea,[contenteditable]')) return;
  if ($('topicSwitch').contains(e.target)) return;
  const siblings = latestPerWriter(ARTICLES.filter(x =>
    x.date===currentArticle.date && topicOf(x)===topicOf(currentArticle)));
  const at = siblings.findIndex(x => articleId(x)===articleId(currentArticle));
  const next = siblings[at + (e.key==='ArrowRight' ? 1 : -1)];
  if (at >= 0 && next) openArticle(next);
});

/* ---------- date select ---------- */
$('dateSel').addEventListener('change', e=>{
  selectedDate = e.target.value;
  renderWriters();
});
$('briefDateSel').addEventListener('change', e=>{
  selectedBriefDate = e.target.value;
  renderBriefs();
  renderPodcast();
});
$('writersIntroPrev').addEventListener('click', ()=>scrollWriterCarousel(-1));
$('writersIntroNext').addEventListener('click', ()=>scrollWriterCarousel(1));
enableWriterCarouselMouseDrag();
let writerCarouselFrame = 0;
$('writersIntroGrid').addEventListener('scroll', ()=>{
  if (writerCarouselFrame) return;
  writerCarouselFrame = requestAnimationFrame(()=>{
    writerCarouselFrame = 0;
    updateWriterCarousel();
  });
}, {passive:true});
window.addEventListener('resize', ()=>updateWriterCarousel(), {passive:true});

/* ---------- boot ---------- */
function renderAll(){
  renderChrome();
  renderTopics();
  renderDeskDisclaimer();
  renderDateSelect();
  renderBriefDateSelect();
  renderPodcast();
  renderWriters();
  renderBriefs();
  renderFilters();
  renderNews();
  if (currentArticle) renderReader(currentArticle);  // keep the open article in sync (e.g. language switch)
}
renderAll();
syncFromHash();  // deep link: open the article named in the URL hash, if any

// Progressive enhancement only: unsupported browsers keep the current static-site path.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
