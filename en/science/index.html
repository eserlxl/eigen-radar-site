riants": [{"src": "/assets/briefs/2026-07-30/science-measurement-shifts-the-question-640.d59cd96f563b.webp", "width": 640}, {"src": "/assets/briefs/2026-07-30/science-measurement-shifts-the-question-1280.ef8907feb314.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Müon ölçümü, gerilimle değişen kristal ve aperiyodik ışık desenini tek hassas laboratuvar düzeneğinde bağlayan sahne", "en": "Precision laboratory scene connecting muon measurement, a strain-tuned crystal and an aperiodic light pattern"}, "generatedAt": "2026-07-30"}, "editionDate": "2026-07-30", "n": 1, "hasAnalysis": true}, {"id": "science-climate-response-thresholds", "topic": "science", "title": {"tr": "İklim tepkisi eşik, bölge ve uyum yoluna göre değişiyor", "en": "Climate response changes with threshold, region and adaptation path"}, "summary": {"tr": "Göl buzundaki sıcaklık eşikleri, demir gübrelemesinin bölgesel sonuçları ve sıcak su balıklarının uyumu; ortalama etkinin tek başına yerel tepkiyi temsil etmediğini gösteriyor.", "en": "Lake-ice thresholds, regional outcomes of iron fertilization and warm-water fish adaptation show that an average effect cannot represent a local response."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-30/science-climate-response-thresholds-1280.082a043f0701.webp", "variants": [{"src": "/assets/briefs/2026-07-30/science-climate-response-thresholds-640.9a42fe06d300.webp", "width": 640}, {"src": "/assets/briefs/2026-07-30/science-climate-response-thresholds-1280.082a043f0701.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Göl buzu eşiği, bölgesel okyanus tepkisi ve sıcak suya uyum sağlayan balığı tek su sistemi içinde gösteren kesit", "en": "Water-system cross-section joining a lake-ice threshold, regional ocean response and a fish adapted to warm water"}, "generatedAt": "2026-07-30"}, "editionDate": "2026-07-30", "n": 1, "hasAnalysis": true}, {"id": "science-reconstructing-hidden-pasts", "topic": "science", "title": {"tr": "Görünmeyen geçmiş, daha bütün izlerle yeniden sınıflandırılıyor", "en": "Hidden pasts are reclassified when the trace becomes more complete"}, "summary": {"tr": "Amazon'da bitki altındaki yapılar, Triyas'ta korunmuş organlar ve Gobi'de bütüncül iskelet; eksik izin nüfus, anatomi ve soy yorumunu nasıl sınırladığını gösteriyor.", "en": "Buried Amazonian structures, preserved Triassic organs and a fuller Gobi skeleton show how an incomplete trace constrains population, anatomy and lineage claims."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-30/science-reconstructing-hidden-pasts-1280.051642b95cd7.webp", "variants": [{"src": "/assets/briefs/2026-07-30/science-reconstructing-hidden-pasts-640.fa83b4209ef3.webp", "width": 640}, {"src": "/assets/briefs/2026-07-30/science-reconstructing-hidden-pasts-1280.051642b95cd7.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Orman altı toprak izleri, korunmuş sürüngen organları ve bütüncül küçük memeli iskeletini tek inceleme mekânında buluşturan sahne", "en": "Inspection space joining buried earthworks, preserved reptile organs and a fuller small-mammal skeleton"}, "generatedAt": "2026-07-30"}, "editionDate": "2026-07-30", "n": 1, "hasAnalysis": true}], "articles": [{"excerpt": {"en": "The days the cores spent shut down at Chooz gave the detector its first quantitative look at what spent fuel keeps emitting. The information lies less in the count than in how closely it matches a prediction computed from the decaying fuel inventory.", "tr": "Chooz'da geçen kapalı günler, algılayıcıya kullanılmış yakıtın yaymayı sürdürdüğü şeye dair ilk niceliksel bakışı verdi. Asıl bilgi sayının kendisinde değil, çürüyen yakıt envanterinden hesaplanan öngörüyle ne kadar örtüştüğünde."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "What was counted in the quiet", "tr": "Sessizlikte ne sayıldı"}, "ps": [{"en": "Shutting a reactor down does not end neutrino emission: long-lived fission products keep decaying in partly burnt fuel and in spent fuel held in cooling pools. The Double Chooz collaboration has now measured that residual flux quantitatively for the first time, at the Chooz B plant in France. The detector, 400 metres from the reactor cores and holding more than 30 cubic metres of liquid scintillator, counted 106 ± 18 candidate events in 17.2 days of reactor-off data. That is a signal at 5.9 sigma.", "refs": ["chooz"], "tr": "Bir reaktör kapatıldığında nötrino salımı bitmiyor: kısmen yanmış yakıtta ve soğutma havuzlarındaki kullanılmış yakıtta uzun ömürlü fisyon ürünleri bozunmayı sürdürüyor. Double Chooz işbirliği, Fransa'daki Chooz B santralinde bu artık akıyı ilk kez niceliksel olarak ölçtü. Reaktör kalplerinden 400 metrelik uzaklıktaki, 30 metreküpten fazla sıvı sintilatör taşıyan algılayıcı, 17,2 günlük reaktör kapalı verisinde 106 ± 18 aday olay saydı. Bu, 5,9 sigma anlamlılık taşıyan bir sinyal."}, {"en": "The count alone says little. What gives the measurement its value is the comparison: detailed simulations modelling the decay activities of fission products and the neutrino spectra predicted 88 ± 7 events, and the two intervals overlap. The thing to notice is which side is narrower. The model's ± 7 is smaller than the measurement's ± 18, which means the binding constraint today is counting statistics rather than the inventory calculation. The collaboration had posted the preprint describing this same measurement to arXiv in October 2025; the result was published in Physical Review Letters and the Max Planck Institute for Nuclear Physics announced it on 4 August.", "refs": ["chooz"], "tr": "Sayının tek başına anlamı sınırlı. Ölçümü değerli kılan karşılaştırma: fisyon ürünlerinin bozunma etkinliğini ve nötrino tayflarını modelleyen ayrıntılı benzetimler 88 ± 7 olay öngörüyordu ve iki aralık örtüşüyor. Dikkat edilmesi gereken, hangi tarafın daha dar olduğu. Modelin ± 7'lik belirsizliği, ölçümün ± 18'lik belirsizliğinden küçük; bugün ölçümü sınırlayan şey, envanter hesabından çok sayım istatistiği. Ekip aynı ölçümü anlatan ön baskıyı Ekim 2025'te arXiv'e koymuştu; sonuç Physical Review Letters'ta yayımlandı ve Max Planck Nükleer Fizik Enstitüsü 4 Ağustos'ta duyurdu."}]}, {"h": {"en": "Where a faint flux earns its keep", "tr": "Zayıf bir akının nerede işe yaradığı"}, "ps": [{"en": "Reactor-off periods are exactly the stretches neutrino experiments use to characterise their non-reactor background. Measuring a residual flux at 5.9 sigma at Chooz B shows those stretches can no longer be treated as empty. What ties the signal to spent fuel is the overlap rather than the size of the significance: the 88 ± 7 prediction computed from the decay inventory holds. A more prosaic account is available too, since an underestimated cosmogenic or accidental background would also produce extra events. Its weakness is that it cannot say why such an error should land on precisely the number the fuel inventory predicts.", "refs": ["chooz"], "tr": "Reaktör kapalı dönemler, nötrino deneylerinin reaktör dışı arka planını tanımlamak için kullandığı dönemlerdir. Chooz B'de 5,9 sigmalık bir artık akı ölçülmesi, bu dönemlerin artık tümüyle boş sayılamayacağını gösteriyor. Sinyali kullanılmış yakıta bağlayan asıl dayanak, anlamlılığın büyüklüğünden çok örtüşme: bozunma envanterinden hesaplanan 88 ± 7 öngörüsü tutuyor. Daha sıradan bir açıklama da düşünülebilir; kozmik kaynaklı ya da rastlantısal arka planın olduğundan az tahmin edilmesi de fazladan olay üretirdi. Bu açıklamanın zayıf yanı, öyle bir hatanın neden tam da yakıt envanterinin öngördüğü sayıya denk düşmesi gerektiğini söyleyememesi."}, {"en": "The reactor monitoring and nuclear safeguards use the team highlights remains a proposed application, and the work does not present it as a demonstrated capability. Safeguards need more than detecting that the flux exists; they need to resolve a change in the inventory. With 106 ± 18 events gathered over 17.2 days at 400 metres, the difference removing fuel from a pool would leave sits below today's uncertainty. This measurement opens that door; it does not walk through it.", "refs": ["chooz"], "tr": "Ekibin öne çıkardığı reaktör izleme ve nükleer denetim kullanımı ise önerilen bir uygulama; makale bunu gösterilmiş bir yetenek olarak sunmuyor. Denetim, akının varlığını saptamakla yetinemez; envanterdeki bir değişikliği ayırt etmesi gerekir. 400 metrelik uzaklıkta 17,2 günde toplanan 106 ± 18 olayla bir havuzdan yakıt çıkarılmasının bırakacağı fark, bugünkü belirsizliğin altında kalır. Bu ölçüm o kapıyı açıyor; içinden geçmiyor."}]}, {"h": {"en": "What the next shutdown separates", "tr": "Bir sonraki kapalı dönem neyi ayırır"}, "ps": [{"en": "Since the measurement is statistics-limited, what advances it is a longer shutdown campaign or a second detector at a different standoff. The signal to watch is simple: with more data, does the central value tighten toward 88, or does it stay above 106 and point to something missing in the inventory model? In the first case the decay calculation is confirmed and the uncertainty moves toward what safeguards work would demand; in the second, the gain arrives as a correction to what is known about the spectra of long-lived fission products rather than as an application.", "refs": ["chooz"], "tr": "Ölçüm istatistikle sınırlı olduğuna göre, bunu ilerletecek şey daha uzun bir kapalı dönem ya da farklı bir uzaklıktaki ikinci bir algılayıcı. İzlenecek işaret basit: daha fazla veriyle merkezî değer 88'e doğru sıkışıyor mu, yoksa 106'nın üstünde kalarak envanter modelinde bir eksiğe mi işaret ediyor? İlk durumda bozunma hesabı doğrulanmış olur ve belirsizlik denetim uygulamalarının isteyeceği düzeye yaklaşır; ikinci durumda eldeki kazanç bir uygulama yerine, uzun ömürlü fisyon ürünlerinin tayfına dair düzeltilmesi gereken bir bilgi olur."}]}], "sources": [{"key": "chooz", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-antineutrinos-spent-nuclear-fuel-emissions.html", "title": {"tr": "Kapatılmış reaktörden çıkmayı sürdüren antinötrinolar ilk kez sayıldı", "en": "The antineutrinos that keep leaving a shut-down reactor have been counted for the first time"}, "publishedDate": "2026-08-04", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2510.04869", "publishedDate": "2025-10-06", "title": {"tr": "Double Chooz deneyiyle kullanılmış nükleer yakıttan gelen nötrino salımının ilk ölçümü", "en": "First Measurement of Neutrino Emissions from Spent Nuclear Fuel by the Double Chooz Experiment"}}}], "title": {"en": "The reactor was off for 17 days and 106 neutrinos still arrived", "tr": "Reaktör 17 gün kapalıydı, 106 nötrino yine de geldi"}, "writer": "sci-01", "date": "2026-08-05"}, {"excerpt": {"en": "Working out how the genome folds in a rare gut immune cell added more than 100 candidate genes to Crohn's disease. The most striking of them has been studied for years under an entirely different illness, and what the patient gains today is still nothing.", "tr": "Bağırsaktaki seyrek bir bağışıklık hücresinde genomun nasıl katlandığını çıkarmak, Crohn hastalığına 100'den fazla aday gen ekledi. En dikkat çekeni yıllardır bambaşka bir hastalık için çalışılıyordu; hastanın bugün elde ettiği şey ise henüz yok."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "Why the search went to this cell", "tr": "Neden bu hücrede arandı"}, "ps": [{"en": "Type 3 innate lymphoid cells are enriched at barrier tissues such as the gut, where they regulate inflammation and support tissue integrity. The problem is that they are rare: the cell numbers conventional chromosome conformation capture methods demand are usually out of reach for them. A team led by Valeriya Malysheva of the VIB-University of Antwerp Center for Molecular Neurology used a low-input, high-resolution method to profile promoter-anchored chromosomal contacts in human type 3 innate lymphoid cells, and compared them with CD4 T cells.", "refs": ["ilc3"], "tr": "Tip 3 doğal lenfoid hücreler bağırsak gibi engel dokularında yoğunlaşıyor, iltihabı düzenliyor ve doku bütünlüğünü destekliyor. Sorun, seyrek olmaları: alışılmış kromozom konformasyon yakalama yöntemlerinin istediği hücre sayısı bu hücreler için genellikle ulaşılamaz durumda. VIB-Antwerp Üniversitesi Moleküler Nöroloji Merkezi'nden Valeriya Malysheva'nın yürüttüğü ekip, az girdiyle çalışan yüksek çözünürlüklü bir yöntemle insan tip 3 doğal lenfoid hücrelerinde promotöre bağlı kromozom temaslarını çıkardı ve bunları CD4 T hücreleriyle karşılaştırdı."}, {"en": "The map's job is to fill the gap that genome-wide association studies leave. Those studies point to regions of the genome associated with disease risk but do not say which gene is affected; a folding map shows which promoter a distant regulatory region physically touches. Linking Crohn's disease variants to target genes this way produced more than 100 candidates, about half of which had not previously been connected to the disease. Extending the method to five further immune traits, the team also found enrichment among genes regulating activation of this cell.", "refs": ["ilc3"], "tr": "Bu haritanın işi, genom çapında ilişkilendirme çalışmalarının bıraktığı boşluğu doldurmak. Bu çalışmalar hastalık riskiyle ilişkili genom bölgelerini gösterir ama hangi genin etkilendiğini söylemez; katlanma haritası, uzaktaki bir düzenleyici bölgenin fiziksel olarak hangi promotöre değdiğini gösterir. Crohn hastalığı varyantları bu şekilde hedef genlere bağlandığında 100'den fazla aday çıktı ve bunların yaklaşık yarısı hastalıkla daha önce ilişkilendirilmemişti. Ekip yöntemi beş başka bağışıklık özelliğine genişlettiğinde de bu hücrenin etkinleşmesini düzenleyen genlerde zenginleşme buldu."}]}, {"h": {"en": "How much CLN3 shows", "tr": "CLN3 ne kadarını gösteriyor"}, "ps": [{"en": "The most striking name on the list is CLN3, the causal gene for childhood Batten disease. When the team overexpressed it in a mouse cell line resembling type 3 innate lymphoid cells, stimulation-induced transcriptional programmes and cytokine secretion changed. That is consistent with the gene taking part in this cell's activation. But overexpression is a gain-of-function test; it does not show in which direction or at what magnitude the human risk variant acts. A more ordinary possibility is not ruled out either: a folding map can equally produce a case where a neighbouring gene sharing the same contact region is the stronger candidate.", "refs": ["ilc3"], "tr": "Listedeki en dikkat çekici ad CLN3; çocukluk çağı Batten hastalığının nedensel geni. Ekip bunu, fare kökenli ve tip 3 doğal lenfoid hücreye benzeyen bir hücre dizisinde aşırı ürettiğinde uyarıya bağlı gen ifade programları ve sitokin salgısı değişti. Bu, genin bu hücrenin etkinleşmesine karışabileceğiyle uyumlu. Ama aşırı üretim bir işlev kazandırma sınaması; insandaki risk varyantının hangi yönde ve ne büyüklükte etki yaptığını göstermiyor. Daha sıradan bir olasılık da elenmiş değil: katlanma haritası aynı temas bölgesini paylaşan komşu bir genin daha güçlü aday olduğu bir durumu da üretebilir."}, {"en": "For someone living with Crohn's disease nothing changes today. What changes is the shortlist a drug programme would start from, and which cell that shortlist belongs to. That is also the denominator to watch: the map covers a single cell type, whereas Crohn's disease involves several, from the gut epithelium to macrophages. That half of the hundred-plus candidates are new does not say the disease's known genetic map is incomplete so much as that it looks different when read through this cell.", "refs": ["ilc3"], "tr": "Crohn hastalığıyla yaşayan biri için bugün değişen bir şey yok. Değişen şey, bir ilaç programının hangi kısa listeyle başlayacağı ve o listenin hangi hücreye ait olduğu. Burada dikkat edilmesi gereken payda da bu: harita tek bir hücre tipini kapsıyor, oysa Crohn hastalığında bağırsak epitelinden makrofajlara kadar birden çok hücre işin içinde. Yüzden fazla adayın yarısının yeni olması, hastalığın bilinen genetik haritasının eksik olduğunu değil, bu hücre üzerinden bakıldığında farklı göründüğünü söylüyor."}]}, {"h": {"en": "Who it reaches, and when", "tr": "Kime, ne zaman ulaşır"}, "ps": [{"en": "The distance between a map like this and the clinic is measured by the order of the tests, not by the number of candidates. The next step is to see the same contacts in type 3 innate lymphoid cells taken from human intestinal tissue, and to see cytokine secretion move the other way when the gene is silenced; another round of overexpression in a mouse cell line will not answer it. Until that point CLN3 is a hypothesis rather than a target. And even if it becomes a target, which share of people with Crohn's disease a therapy aimed at this cell would help remains a separate question; the participant pool of genome-wide association studies and the patient population arriving at a clinic need not be the same population.", "refs": ["ilc3"], "tr": "Bu tür bir haritanın klinikle arasındaki mesafe, aday sayısıyla değil sınamaların sırasıyla ölçülür. Sıradaki adım, insan bağırsak dokusundan alınmış tip 3 doğal lenfoid hücrelerde aynı temasların görülmesi ve gen susturulduğunda sitokin salgısının ters yöne gitmesi; fare hücre dizisinde yeni bir aşırı üretim turu bunu karşılamaz. O aşamaya varılmadan CLN3 bir hedef değil, bir hipotez. Ve hedefe dönüşse bile, bu hücreyi konu alan bir tedavinin Crohn hastalarının hangi bölümünde işe yarayacağı ayrı bir soru olarak duruyor; genom çapında ilişkilendirme çalışmalarının katılımcı havuzu ile kliniğe başvuran hasta topluluğu aynı topluluk olmak zorunda değil."}]}], "sources": [{"key": "ilc3", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-3d-genome-rare-immune-cells.html", "title": {"tr": "Seyrek bir bağırsak bağışıklık hücresinin genom katlanması yeni Crohn genlerine işaret ediyor", "en": "The genome folding of a rare gut immune cell points to new Crohn's genes"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Nature Genetics", "url": "https://www.nature.com/articles/s41588-026-02681-0", "publishedDate": "2026-08-04", "title": {"tr": "Yüksek çözünürlüklü promotör etkileşim çözümlemesi, tip 3 doğal lenfoid hücrelerin etkinleşmesinde rol alan genleri bağışıklık hastalığı riskine bağlıyor", "en": "High-resolution promoter interaction analysis implicates genes involved in activation of type 3 innate lymphoid cells in immune disease risk"}}}], "title": {"en": "A gene from a childhood brain disease has joined the Crohn's list", "tr": "Bir çocukluk çağı beyin hastalığının geni Crohn listesine girdi"}, "writer": "sci-02", "date": "2026-08-05"}, {"excerpt": {"en": "Between depleted maize ground at 87.7 megagrams of carbon per hectare and native prairie at 146, Miscanthus reached 107. That the gain was absent at three of the seven sites carries as much information as the gain itself.", "tr": "Hektarda 87,7 megagram karbonla tükenmiş mısır toprağı ile 146 megagramla doğal preri arasında Miscanthus 107'ye ulaştı. Kazancın kendisi kadar, yedi alanın üçünde görülmemesi de bilgi taşıyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "How the stocks line up", "tr": "Stokların sıralaması"}, "ps": [{"en": "Ilsa B. Kantola of the University of Illinois and colleagues measured soil organic carbon to a depth of 1 metre under mature perennial bioenergy crops. In megagrams of carbon per hectare, the mean stocks line up as prairie 146, Miscanthus 107, Panicum virgatum 97.9, maize 87.7. What that ordering means lies less in the size of the numbers than in the distances between them: a wide gap separates maize from prairie, and the two perennial grasses fall somewhere inside it.", "refs": ["toprak"], "tr": "Illinois Üniversitesi'nden Ilsa B. Kantola ve arkadaşları, olgunlaşmış çok yıllık enerji bitkilerinin altındaki topraktaki organik karbonu 1 metre derinliğe kadar ölçtü. Hektar başına megagram karbon cinsinden ortalama stoklar şöyle sıralanıyor: preri 146, Miscanthus 107, Panicum virgatum 97,9, mısır 87,7. Bu sıralamanın anlamı, sayıların büyüklüğünden çok aralarındaki mesafede: mısır ile preri arasında geniş bir açık var ve iki çok yıllık ot bu açığın içinde bir yere düşüyor."}, {"en": "A stock gives the state at one moment; seeing the flow takes a second measurement. Over five years of monitoring the team found soil organic carbon rising at four of the seven sites, and carbon isotope analysis attributed the gain to the perennial crops themselves. That second step matters, because a rise in soil carbon could equally have come from fertiliser, from the residue of the previous crop, or from a difference in sampling depth; the isotope signature separates out which plant put the carbon there.", "refs": ["toprak"], "tr": "Stok bir andaki durumu verir; akışı görmek için ikinci bir ölçüm gerekir. Ekip beş yıllık izlemede yedi alanın dördünde topraktaki organik karbonun arttığını buldu ve karbon izotop çözümlemesiyle artışın kaynağını çok yıllık bitkilerin kendisine bağladı. Bu ikinci adım önemli, çünkü toprak karbonundaki bir artış gübreden, önceki ürünün artığından ya da örnekleme derinliğindeki farktan da gelebilirdi; izotop imzası, karbonun oraya hangi bitkiden geldiğini ayırıyor."}]}, {"h": {"en": "New storage, or a closing deficit", "tr": "Yeni depo mu, kapanan açık mı"}, "ps": [{"en": "The perennial stocks sit between depleted farmland and native prairie. That position settles what the measured gain is: a partial closing of the deficit maize opened. The soil is moving back toward the level it held before cultivation, and storage beyond that level has not been shown. What follows is that the share perennial bioenergy crops can take in a carbon budget is bounded by a ceiling. A different reading is available too: part of the distance between prairie and the grass plots may come from site conditions, soil type or moisture regime, in which case the prairie figure is a comparison point rather than a target.", "refs": ["toprak"], "tr": "Çok yıllık bitkilerin stokları tükenmiş tarım toprağı ile doğal preri arasında duruyor. Bu konum, ölçülen kazancın ne olduğunu belirliyor: mısırın açtığı açığın kısmen kapanması. Toprak, tarım öncesindeki düzeyine doğru geri gidiyor; o düzeyin ötesine geçen bir depolama gösterilmiş değil. Buradan çıkan sonuç, çok yıllık enerji bitkilerinin karbon bütçesindeki payının bir tavanla sınırlı olduğu. Farklı bir okuma da mümkün: preri ile ot alanları arasındaki fark kısmen alan koşullarından, toprak tipinden veya nem rejiminden gelebilir, o zaman preri değeri bir hedef değil yalnızca bir karşılaştırma noktası olur."}, {"en": "For deployment, the number carrying the real information is the three sites without gains. The announcement does not explain what set them apart; it could be planting year, previous crop, soil texture or drainage. If an agricultural policy is costed on an average gain per hectare, a failure rate of three in seven feeds straight into the budget. Five years is a short window for soil carbon and the crops had been established for under 11 years, so the three lagging sites may mark a permanent limit or a gain that has not arrived yet.", "refs": ["toprak"], "tr": "Uygulama açısından asıl bilgiyi taşıyan sayı, kazanç sağlamayan üç alan. Duyuru bu alanları neyin ayırdığını açıklamıyor; ekim yılı, önceki ürün, toprak dokusu ya da drenaj olabilir. Bir tarım politikası hektar başına ortalama kazançla hesaplanırsa, yedide üçlük bir başarısızlık oranı doğrudan bütçeye yansır. Toprak karbonu için beş yıl kısa bir pencere ve bitkiler 11 yıldan az süredir yerleşikti; yani üç alanın geride kalması kalıcı bir sınır da olabilir, henüz gelmemiş bir kazanç da."}]}, {"h": {"en": "Carbon accumulating in a harvested field", "tr": "Hasat edilen bir tarlada biriken karbon"}, "ps": [{"en": "The result the study highlights is that the stocks rose even while the crops continued to be harvested every year. That shows where the lever sits: the above-ground biomass leaves the field at harvest, and what holds carbon in the soil is the perennial root system and its reach down to a depth of 1 metre. Judging an energy crop by its climate effect therefore has to account for what the root leaves in the ground as well as for the fuel it displaces. For the same reason this is a gain that can be given back if the field is ploughed or returned to an annual crop; its permanence depends as much on how long the land use lasts as on the planting itself.", "refs": ["toprak"], "tr": "Çalışmanın öne çıkardığı sonuç, stokların bitkiler her yıl hasat edilmeye devam ederken bile yükselmesi. Bu, kaldıracın nerede olduğunu gösteriyor: yer üstündeki biyokütle hasatla tarladan çıkıyor, karbonu toprakta tutan şey çok yıllık kök dizgesi ve onun 1 metre derinliğe kadar uzanan etkisi. Bir enerji bitkisinin iklim açısından değerlendirilmesi, bu yüzden yalnızca yakıt olarak yerine geçtiği şeyle değil, kökün toprakta bıraktığıyla birlikte yapılmak zorunda. Aynı nedenle bu kazanç, tarlanın sürülmesi ya da tekrar tek yıllık ürüne dönmesi durumunda geri alınabilecek bir kazanç; kalıcılığı, ekimin kendisi kadar arazi kullanımının ne kadar süreceğine bağlı."}]}], "sources": [{"key": "toprak", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-perennial-bioenergy-grasses-rebuilding-midwest.html", "title": {"tr": "Çok yıllık enerji otları, yedi Illinois alanının dördünde toprak karbonunu geri koymaya başladı", "en": "Perennial bioenergy grasses began putting soil carbon back at four of seven Illinois sites"}, "publishedDate": "2026-08-04"}], "title": {"en": "Perennial grasses put carbon back in Illinois, at four sites out of seven", "tr": "Çok yıllık otlar Illinois'de karbonu geri koydu, yedi alanın dördünde"}, "writer": "sci-03", "date": "2026-08-05"}, {"excerpt": {"en": "What let the Göttingen team reach a three-dimensional orbital image with a table-top source was a reconstruction that makes do with less data rather than a brighter beam. That trade decides what is assumed as much as what is gained.", "tr": "Göttingen ekibinin üç boyutlu yörünge görüntüsüne masaüstü bir kaynakla ulaşmasını sağlayan şey daha parlak ışık değil, daha az veriyle yetinen bir geri oluşturma. Bu takas, ne kazanıldığı kadar neyin varsayıldığını da belirliyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The three pieces of the apparatus", "tr": "Aygıtın üç parçası"}, "ps": [{"en": "The setup has three pieces, and each carries a different load. The first is ultrafast momentum microscopy, a detection scheme that collects photoelectrons across a wide angular range at once. The second is a table-top, spectrally tunable high-harmonic extreme-ultraviolet source. The third is an algorithm that builds three-dimensional information from sparse, undersampled data. With that trio, the team of Wiebke Bennecke, Matthijs Jansen and Stefan Mathias performed the first three-dimensional photoemission orbital tomography experiment, imaging the frontier orbitals of a PTCDA molecule adsorbed on a pristine silver (110) surface.", "refs": ["orbital"], "tr": "Kurulum üç parçadan oluşuyor ve üçünün de yükü farklı. Birincisi ultrahızlı momentum mikroskopisi: fotoelektronları geniş bir açı aralığında aynı anda toplayan bir algılama düzeni. İkincisi masaüstü, tayfsal olarak ayarlanabilir bir yüksek harmonik aşırı mor ötesi kaynak. Üçüncüsü, seyrek ve eksik örneklenmiş veriden üç boyutlu bilgi kuran bir algoritma. Wiebke Bennecke, Matthijs Jansen ve Stefan Mathias'ın ekibi bu üçlüyle ilk üç boyutlu fotoemisyon yörünge tomografisi deneyini yaptı ve temiz bir gümüş (110) yüzeyine tutunmuş PTCDA molekülünün sınır yörüngelerini görüntüledi."}, {"en": "The method's limit is set by what photoemission delivers. The measurement gives electron momentum, and the algorithm supplies the missing half. That is why the resulting three-dimensional image does not count as a directly recorded picture; it is a reconstruction constrained by measurement. The distinction moves where the question of trustworthiness sits: it now concerns the assumptions under which the reconstruction yields a unique solution, as much as the detector's resolution.", "refs": ["orbital"], "tr": "Yöntemin sınırı, fotoemisyonun ne verdiğiyle belirleniyor. Ölçüm elektron momentumunu veriyor; eksik kalan yarıyı algoritma tamamlıyor. Bu yüzden ortaya çıkan üç boyutlu görüntü doğrudan kaydedilmiş bir resim sayılmaz; ölçümle sınırlanmış bir geri oluşturmadır. Aradaki fark, sonucun ne kadar güvenilir olduğu sorusunun nereye taşındığını değiştiriyor: soru artık algılayıcının çözünürlüğü kadar, geri oluşturmanın hangi varsayımlar altında tek çözüm ürettiğidir."}]}, {"h": {"en": "Where the bottleneck moved", "tr": "Darboğaz nereye kaydı"}, "ps": [{"en": "Photoemission orbital tomography was defined in 2009, and its three-dimensional application has until now demanded long measurements at large synchrotron facilities. The piece carrying the load here is the reconstruction algorithm, which lowers how much sampling is required. What makes the synchrotron unnecessary is the drop in the number of data points that must be collected, rather than the brightness of the table-top source. Naming a system's bottleneck correctly also settles which improvement will help: raising source brightness would not lift the next limit in this setup.", "refs": ["orbital"], "tr": "Fotoemisyon yörünge tomografisi 2009'da tanımlandı; üç boyutlu uygulaması bugüne dek büyük sinkrotron tesislerinde uzun ölçümler gerektiriyordu. Buradaki değişikliğin yükünü taşıyan parça, gereken örnekleme miktarını düşüren geri oluşturma algoritması. Yani sinkrotronu gereksiz kılan şey masaüstü kaynağın parlaklığı değil; toplanması gereken veri noktası sayısının azalması. Bir sistemin darboğazını doğru adlandırmak, hangi iyileştirmenin işe yarayacağını da belirler: kaynak parlaklığını artırmak bu kurulumda bir sonraki sınırı kaldırmaz."}, {"en": "There is a way to test that naming. Part of the speed-up may equally come from the parallel detection of momentum microscopy, in which case the critical component would be the detector rather than the algorithm. Separating the two only requires seeing how much data the same algorithm needs on an older, single-point angle-scanning setup. The paper does not draw that distinction on its own; what is measured is the performance of the combined apparatus.", "refs": ["orbital"], "tr": "Bu adlandırmayı sınamanın bir yolu var. Hızlanmanın bir bölümü momentum mikroskopisinin paralel algılamasından da gelmiş olabilir; o durumda kritik bileşen algoritma değil algılayıcı olurdu. İkisini ayırmak için aynı algoritmanın eski, tek noktalı açı taramalı bir düzenekte ne kadar veriyle çalıştığını görmek yeterli. Makale bu ayrımı kendi başına yapmıyor; ölçülen şey birleşik kurulumun başarımı."}]}, {"h": {"en": "The account of what is built and what is not", "tr": "Kurulanın ve kurulmayanın hesabı"}, "ps": [{"en": "The team presents femtosecond time-resolved orbital imaging as an opening rather than a completed result, and that is an honest line to draw. What has been built is a three-dimensional orbital map of one moment for one molecule-surface pair. What has not been built is an arrangement that keeps the same sampling economy alongside an excitation pulse: a pump-probe geometry asks for a fresh dataset at every delay step, and whether the sparse-sampling gain carries that multiplier has not been shown. This is also where the table-top setup's price becomes visible; instead of a synchrotron's generous photon budget, the work runs on a budget that rests on the reconstruction's assumptions.", "refs": ["orbital"], "tr": "Ekip femtosaniye ölçeğinde zamana bağlı yörünge görüntülemeyi tamamlanmış bir sonuç olarak değil, açılan bir olanak olarak sunuyor; bu dürüst bir sınır çizgisi. Kurulmuş olan şey, tek bir molekül–yüzey çifti için tek bir anın üç boyutlu yörünge haritası. Kurulmamış olan, aynı örnekleme ekonomisini bir uyarma darbesiyle birlikte koruyan bir düzenek: pompa–prob geometrisi her gecikme adımında yeni bir veri kümesi ister ve seyrek örnekleme kazancının bu çarpanı taşıyıp taşımadığı henüz gösterilmedi. Masaüstü kurulumun ödediği bedel de burada görünür hâle geliyor; sinkrotronun bol foton bütçesi yerine, geri oluşturmanın varsayımlarına dayanan bir bütçeyle çalışılıyor."}]}], "sources": [{"key": "orbital", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-molecular-orbitals-imaged-3d-path.html", "title": {"tr": "Masaüstü bir ışık kaynağı, moleküler yörüngeleri üç boyuta taşıdı", "en": "A table-top light source carries molecular orbitals into three dimensions"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-74308-1", "publishedDate": "2026-06-19", "title": {"tr": "Femtosaniye aşırı mor ötesi ışık kaynağıyla masaüstü üç boyutlu fotoemisyon yörünge tomografisi", "en": "Table-top three-dimensional photoemission orbital tomography with a femtosecond extreme ultraviolet light source"}}}], "title": {"en": "The measurement gives one half, the algorithm builds the rest", "tr": "Ölçüm yarısını veriyor, kalanını algoritma kuruyor"}, "writer": "sci-04", "date": "2026-08-05"}, {"excerpt": {"en": "Tregoning's diagnosis of the format will be familiar to anyone who produced the data in their first figure last. His remedy is made of habits, and habits are exactly the part nobody has measured.", "tr": "Tregoning'in biçime koyduğu tanı, ilk şeklindeki veriyi en son üreten herkese tanıdık gelir. Önerdiği çözüm alışkanlıklardan oluşuyor ve kimsenin ölçmediği kısım tam orası."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The diagnosis itself is uncontested", "tr": "Tanının kendisi tartışmalı değil"}, "ps": [{"en": "In a Perspective published on 4 August, John Tregoning of Imperial College London revisits the argument Peter Medawar made in 1963: that a scientific paper misrepresents how research actually proceeds. His conclusion is that this still holds, on the grounds that the format hides guesswork, abandoned routes and the people in the process. Two of his examples are concrete: the data in a paper's first figure often comes from the last experiment performed, and the formal scientific voice erases the authors' agency.", "refs": ["medawar"], "tr": "Imperial College London'dan John Tregoning, 4 Ağustos'ta yayımlanan bir Perspektif yazısında Peter Medawar'ın 1963'te ortaya attığı savı yeniden ele alıyor: bilimsel makale, araştırmanın gerçekte nasıl yürüdüğünü yanlış aktarır. Vardığı sonuç, bunun hâlâ geçerli olduğu; gerekçesi, biçimin tahmini, terk edilmiş yolları ve süreçteki insanları gizlemesi. Verdiği iki örnek somut: bir makalenin ilk şeklindeki verinin çoğu zaman en son yapılan deneyden gelmesi ve biçimsel bilimsel sesin yazarların etkinliğini silmesi."}, {"en": "The diagnosis is hard to argue with. The difficulty begins with what the diagnosis rests on. The text is an argument and offers no measurement of how often the reordering happens; in which fields, in which journals and at what rate is left open. That need not count as a fault, since a Perspective was never a genre built to report measurements in the first place. The consequence, even so, is that the argument stays untestable by its own standard: saying a format hides information cannot be confirmed without saying how much information is hidden.", "refs": ["medawar"], "tr": "Bu tanıya karşı çıkmak zor. Zorluk, tanının hangi kanıta dayandığında başlıyor. Metin bir sav yazısı ve sıralamanın ne sıklıkla değiştiğine dair bir ölçüm sunmuyor; hangi alanlarda, hangi dergilerde, hangi oranda olduğu açık değil. Bu bir kusur sayılmayabilir, çünkü Perspektif yazısı zaten ölçüm bildirmek üzere kurulmuş bir tür sayılmaz. Sonuç yine de ortada: sav kendi ölçütüne göre sınanamaz kalıyor; bir biçimin bilgi gizlediğini söylemek, gizlenen bilginin ne kadar olduğunu söylemeden doğrulanamaz."}]}, {"h": {"en": "The load a proposal made of habits cannot carry", "tr": "Alışkanlık önerisinin taşıyamadığı yük"}, "ps": [{"en": "Tregoning's proposal is to supplement the paper with preprints, conferences and open discussion rather than replace it. Those instruments already exist and are widely used; if the diagnosis still stands despite them, what is missing is the conditions under which they are used rather than the instruments. The piece itself says publication pressure pushes toward positive results. Without a change in what a behaviour returns, a call asking for that behaviour is not expected to leave a measurable effect. A different reading is available: the aim of the piece may be to legitimise a conversation rather than to specify an intervention, in which case the missing measurement is not a fault.", "refs": ["medawar"], "tr": "Tregoning'in önerisi makaleyi değiştirmek yerine ön baskılar, konferanslar ve açık tartışmayla tamamlamak. Bu araçlar zaten var ve yaygın; buna rağmen tanı yerinde duruyorsa, eksik olan araç değil onların hangi koşulda kullanıldığı. Yayın baskısının olumlu sonuçlara yönelttiğini yazının kendisi de söylüyor. Bir davranışın karşılığı değişmeden, o davranışı isteyen bir çağrının ölçülebilir bir etki bırakması beklenmez. Farklı bir okuma mümkün: yazının amacı bir müdahale tarif etmek yerine bir tartışmayı meşrulaştırmak olabilir, o zaman eksik ölçüm bir kusur sayılmaz."}, {"en": "That is a question already on the table. Yesterday this desk reported that in four laboratories working with the same catalyst batches and the same test protocol, input-output relationships clearly visible inside a single laboratory vanished between laboratories. What was hidden in that case was not a narrative choice; it was an error model missing from the data. What joins the two situations is whether what a paper withholds from its reader can be measured. In the catalyst case it could be, and it was; in the narrative rearrangement Tregoning describes, it has not been yet.", "refs": ["medawar", "laboratuvarlar"], "tr": "Bu masanın üzerinde duran bir soru. Bu desk dün, aynı katalizör partileri ve aynı sınama yönergesiyle çalışan dört laboratuvarda, tek laboratuvarın içinde açıkça görülen girdi–çıktı ilişkilerinin laboratuvarlar arasında kaybolduğunu aktarmıştı. O örnekte gizlenen şey bir anlatı tercihi değildi; hata modelinin veriye eklenmemesiydi. İki durumu birleştiren şey, makalenin okura neyi vermediğinin ölçülebilir olup olmaması. Katalizör örneğinde ölçülebilirdi ve ölçüldü; Tregoning'in tarif ettiği anlatı düzenlemesinde henüz ölçülmedi."}]}, {"h": {"en": "What it would take to make this testable", "tr": "Sınanabilir hâle gelmesi için gereken"}, "ps": [{"en": "Making the argument testable is not complicated: an outcome measure and a comparison group. The measure could be, for instance, the share of papers that report abandoned routes; the comparison group, papers published in the same field the previous year. Given that formats such as the registered report already require a structure of this kind, the material a measurement would need is available too. Until such a number exists, the claim that the format hides information stands as an apt observation, and the load it can carry as a reform proposal stays limited.", "refs": ["medawar"], "tr": "Savı sınanabilir kılacak şey karmaşık değil: bir sonuç ölçütü ve bir karşılaştırma grubu. Ölçüt, örneğin makalelerin terk edilmiş yolları bildirme oranı olabilir; karşılaştırma grubu, aynı alanda önceki yıl yayımlanmış makaleler. Kayıtlı rapor gibi biçimlerin zaten böyle bir yapıyı zorunlu kıldığı düşünülürse, ölçüm için gereken malzeme de mevcut. Böyle bir sayı üretilene kadar, biçimin bilgi gizlediği savı yerinde bir gözlem olarak kalır; bir reform önerisi olarak taşıyabileceği yük ise sınırlıdır."}]}], "sources": [{"key": "medawar", "kind": "news", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003912", "title": {"tr": "PLOS Biology, Medawar'ın bilimsel makale sorusunu yeniden açıyor", "en": "PLOS Biology reopens Medawar's question about the scientific paper"}, "publishedDate": "2026-08-04"}, {"key": "laboratuvarlar", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/science/sci-05/2026-08-04/", "title": {"tr": "Dört laboratuvar, tek katalizör, kaybolan bir ilişki", "en": "Four laboratories, one catalyst, one vanished relationship"}, "publishedDate": "2026-08-04"}], "title": {"en": "An argument about the scientific paper, published as a scientific paper", "tr": "Bilimsel makale üzerine bir sav, bilimsel makale olarak yayımlandı"}, "writer": "sci-05", "date": "2026-08-05"}, {"excerpt": {"en": "Urokodia's head carries a shape that never had to be invented from scratch again. Reading it took a tomograph; reading what it means takes admitting how little of that span we can picture.", "tr": "Urokodia'nın başı, bir daha baştan icat edilmesi gerekmemiş bir biçimi taşıyor. Bunu okumak bir tomografi gerektirdi; ne anlama geldiğini okumak ise o aralığın ne kadar azını gözümüzde canlandırabildiğimizi kabul etmeyi."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The shape that came out of the rock", "tr": "Kayanın içinden çıkan biçim"}, "ps": [{"en": "Urokodia aequalis, from the Chengjiang biota in Yunnan, China, is 2 to 3 centimetres long. Yu Liu of Yunnan University, Mark Williams of the University of Leicester and colleagues resolved the animal's three-dimensional anatomy with X-ray microtomography. What emerged is a seven-segmented head carrying a sclerotised hypostome, with pincer-like front appendages sitting just behind the eyes. The trunk appendages are biramous, with overlapping exite flaps.", "refs": ["urokodia"], "tr": "Çin'in Yunnan eyaletindeki Chengjiang yatağından çıkan Urokodia aequalis, 2 ila 3 santimetre boyunda. Yunnan Üniversitesi'nden Yu Liu ile Leicester Üniversitesi'nden Mark Williams ve arkadaşları, hayvanın üç boyutlu anatomisini X-ışını mikrotomografisiyle ortaya koydu. Ortaya çıkan şey yedi bölütlü, sertleşmiş bir hipostom taşıyan bir baş ve gözlerin hemen arkasında duran kıskaç biçimli ön uzantılar. Gövde uzantıları ise üst üste binen yan yaprakçıklarıyla iki dallı."}, {"en": "Each of those parts attaches somewhere. Phylogenetic analyses confirm the monophyly of Cheliceromorpha and place Urokodia as the earliest-branching upper stem-group chelicerate, linking lower stem-group megacheirans to crownward forms such as Mollisonia and Megachelicerax. The trunk appendages support a megacheiran origin for book gills. The animal is read, in other words, as an intermediate form: the place where the structure that today's spiders call a chelicera joins to the grasping appendage that came before it.", "refs": ["urokodia"], "tr": "Bu parçaların her biri bir yere bağlanıyor. Soyağacı çözümlemeleri Cheliceromorpha'nın monofilisini doğruluyor ve Urokodia'yı, alt kök grubundaki megakeiranları Mollisonia ile Megachelicerax gibi taçkısma yakın biçimlere bağlayan, üst kök grubunun en erken ayrılan üyesi olarak konumlandırıyor. Gövde uzantıları da kitapsı solungaçların megakeiran kökenini destekliyor. Yani hayvan bir ara biçim olarak okunuyor: bugünün örümceklerinde kelisera adını alan yapının, ondan önceki kavrayıcı uzantıya bağlandığı yer."}]}, {"h": {"en": "What a half-billion-year-old solution means", "tr": "Yarım milyar yıllık bir çözümün anlamı"}, "ps": [{"en": "A shape lasting this long invites the thought that the problem it solves has not changed. Grasping, seizing, holding: this task in front of an animal has stayed the same since the Cambrian, and the answer given to it has stayed essentially the same too. A more measured reading is also available. A form persisting does not always indicate continuous selective pressure; a developmental programme that makes changing the structure expensive produces the same result. Fossil anatomy alone does not settle that distinction; these are anatomical and phylogenetic inferences drawn from tomography, and how the appendages were used has not been observed.", "refs": ["urokodia"], "tr": "Bir biçimin bu kadar uzun sürmesi, çözdüğü sorunun değişmediğini düşündürür. Kavramak, yakalamak, tutmak: bir hayvanın önünde duran bu iş, Kambriyen'den bu yana aynı kaldı ve ona verilen yanıt da temelde aynı kaldı. Daha ölçülü bir okuma da var. Bir biçimin sürmesi her zaman sürekli seçilim baskısını göstermez; gelişim programının o yapıyı değiştirmeyi pahalı hâle getirmesi de aynı sonucu verir. Bu ayrımı fosil anatomisi tek başına çözmez; bunlar tomografiden çıkarılan anatomik ve soyağacı çıkarımları, uzantıların nasıl kullanıldığı gözlenmiş bir şey değil."}, {"en": "Something does genuinely change here, and what changes is our sense of scale rather than the spider. An interval of 518 million years is not something a person can picture. What makes it concrete is the continuity rather than the number itself: the closing motion of that pincer has not been interrupted once, from an age when no reader of this sentence had ancestors on land, to now. What a fossil really gives us is less a picture of the past than a measure of how thin a slice the present is.", "refs": ["urokodia"], "tr": "Yine de burada gerçekten değişen bir şey var; örümcek hakkındaki bilgimiz yerine ölçek duygumuz değişiyor. Bir insan 518 milyon yıllık bir aralığı gözünde canlandıramaz. Onu somutlaştıran şey, sayının büyüklüğünden çok aradaki süreklilik: o kıskacın kapanma hareketi, bu cümleyi okuyan hiç kimsenin atalarının henüz karaya çıkmadığı bir çağdan bugüne kadar hiç kesilmedi. Bir fosilin bize verdiği asıl şey geçmişin bir resmi değil; şimdiki zamanın ne kadar ince bir dilim olduğunun ölçüsü."}]}, {"h": {"en": "The single animal this reading rests on", "tr": "Bu okumanın dayandığı tek hayvan"}, "ps": [{"en": "It has to end with a caution, because this whole account rests on the anatomy of a single lineage. The claim of an intermediate form depends on Urokodia's pincer-like front appendages genuinely representing a transitional stage; further specimens with comparable preservation from the same biota would separate whether this is a property of the species or the variability of one individual. Until that separation is made, what stands is a well-supported candidate rather than a confirmed origin story. Even so, the gain for a reader today is solid: the structure at the mouth of the spider in the garden now has a history with a name attached to it.", "refs": ["urokodia"], "tr": "Bir uyarıyla bitirmek gerekiyor, çünkü bu anlatının tamamı tek bir soyun anatomisine dayanıyor. Ara biçim olma iddiası, Urokodia'nın kıskaç biçimli ön uzantılarının gerçekten bir geçiş aşamasını temsil etmesine bağlı; aynı yatakta benzer korunmuşluğa sahip başka örnekler, bunun bir tür özelliği mi yoksa tek bir bireyin değişkenliği mi olduğunu ayırır. O ayrım yapılana kadar, elimizde duran şey doğrulanmış bir köken anlatısı değil, iyi desteklenmiş bir aday. Yine de bir okur için bugünün kazancı sağlam: bahçedeki örümceğin ağzındaki yapı, artık adı olan bir tarihe sahip."}]}], "sources": [{"key": "urokodia", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/08/260803080906.htm", "title": {"tr": "518 milyon yıllık bir baş, örümcek zehir dişlerine giden kıskacı taşıyor", "en": "A head 518 million years old carries the pincer that leads to spider fangs"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Nature", "url": "https://www.nature.com/articles/s41586-026-10713-2", "publishedDate": "2026-07-01", "title": {"tr": "Urokodia, keliseraların ve kitapsı solungaçların kökenine ışık tutuyor", "en": "Urokodia sheds light on the origin of chelicerae and book gills of Chelicerata"}}}], "title": {"en": "A pincer that has kept closing for 518 million years", "tr": "518 milyon yıldır kapanmayı sürdüren bir kıskaç"}, "writer": "sci-06", "date": "2026-08-05"}, {"excerpt": {"en": "A Milky Way simulation finds the great majority of stellar-mass black holes without a partner. If that holds, the catalogue we have is a catalogue of exceptions.", "tr": "Bir Samanyolu benzetimi, gökadadaki yıldız kütleli kara deliklerin büyük çoğunluğunu eşsiz buluyor. Bu doğruysa, elimizdeki kara delik kataloğu bir istisnalar kataloğu."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "The number the simulation gives", "tr": "Benzetimin verdiği sayı"}, "ps": [{"en": "Tom Wagg and colleagues at the Flatiron Institute ran the Milky Way forward with a tool called cogsworth: stellar birth and death, the joint evolution of binary stars, and the kick a supernova gives the remnant it leaves behind all sit inside the same calculation. The preprint posted to arXiv on 24 July reports that roughly 170 million black holes have formed over the galaxy's history and that about 91 percent of them are alone today. Only around a hundred thousand still hold a luminous stellar companion. The work has not yet been peer reviewed.", "refs": ["kara-delikler"], "tr": "Flatiron Enstitüsü'nden Tom Wagg ve arkadaşları, cogsworth adlı araçla Samanyolu'nu baştan işletti: yıldızların doğuşu ve ölümü, çift yıldızların birlikte evrimi ve süpernova patlamasının geride bıraktığı kalıntıya verdiği tepme, aynı hesabın içinde. arXiv'e 24 Temmuz'da yüklenen ön baskı, gökadanın tarihi boyunca yaklaşık 170 milyon kara delik oluştuğunu ve bunların yaklaşık yüzde 91'inin bugün yalnız olduğunu bildiriyor. Işık saçan bir yıldız yoldaşını koruyan kara delik sayısı yalnızca yüz bin dolayında. Çalışma henüz hakem değerlendirmesinden geçmedi."}, {"en": "Nearly everything we know about stellar-mass black holes came from that smallest group. A black hole emits no light of its own; it is found through what it does to something else, through a companion star's motion or the X-rays from matter falling in. If the simulation has the ratio right, the catalogue astronomers have built is a catalogue of exceptions. The model also spreads black holes through a larger volume than the visible stars, giving the population a scale height about 2.5 times that of the visible disc. The prosaic account deserves to be stated first: a survey that can only see pairs returns pairs by construction, and that by itself does not establish that the solitary ones are out there.", "refs": ["kara-delikler"], "tr": "Yıldız kütleli kara delikler hakkında bildiklerimizin neredeyse tamamı, işte bu en küçük gruptan geldi. Kara delik kendi başına ışık salmaz; bir başkasına yaptığı iş üzerinden bulunur — yoldaş yıldızın devinimi, içine düşen maddenin saçtığı X ışınları. Oranı bu benzetim doğru veriyorsa, gökbilimcilerin kurduğu katalog bir istisnalar kataloğudur. Model ayrıca kara delikleri görünür yıldızlardan daha geniş bir hacme yayıyor: dağılımın ölçek yüksekliği görünür diskinkinin yaklaşık 2,5 katı. Sıradan açıklamayı önce söylemek gerekir: yalnızca çiftleri görebilen bir tarama zaten çift bulur ve bu tek başına yalnızların orada olduğunu kanıtlamaz."}]}, {"h": {"en": "What does the number rest on?", "tr": "Sayı neye dayanıyor?"}, "ps": [{"en": "The 91 percent is an output rather than a measurement, and the authors write plainly what it depends on: both the mass distribution and the kinematics are strongly sensitive to remnant-mass prescriptions and natal-kick models. A kick is the recoil a black hole receives when its progenitor explodes asymmetrically. Speed the kicks up and more black holes are torn out of their binaries and thrown into the sparse regions of the galaxy; slow them down and more pairs survive. The 91 percent is therefore a number that slides with the assumption.", "refs": ["kara-delikler"], "tr": "Yüzde 91, bir ölçüm değil bir çıktı ve yazarlar neye bağlı olduğunu açıkça yazıyor: kütle dağılımı da devinimler de kalıntı kütle reçetelerine ve doğuş tepmesi modellerine güçlü biçimde duyarlı. Tepme, öncül yıldız bakışımsız patladığında kara deliğin aldığı geri itme hızıdır. Tepmeleri hızlandırın, daha çok kara delik çiftinden koparılıp gökadanın seyrek bölgelerine savrulur; yavaşlatın, daha çok çift ayakta kalır. Bu durumda yüzde 91, varsayımla birlikte kayan bir sayıdır."}, {"en": "The quantity that matters here is therefore not the 91 percent itself but the width of the range it can take. Knowing how far that fraction retreats when the kick prescription changes teaches more than knowing a single central value. What would narrow the range is an observation that recognises a black hole without needing its companion; a census of that kind would test directly which kick model the galaxy agrees with. Until one arrives, the galaxy's dark population remains a well-built conditional, which is still better than no number at all.", "refs": ["kara-delikler"], "tr": "Bu yüzden buradaki asıl büyüklük yüzde 91'in kendisi değil, alabileceği aralığın genişliği. Tepme reçetesi değiştiğinde bu oranın nereye kadar gerilediğini bilmek, tek bir merkezî değeri bilmekten daha çok şey öğretir. Aralığı daraltacak şey, bir kara deliği yoldaşına ihtiyaç duymadan tanıyan bir gözlemdir; öyle bir sayım, hangi tepme modelinin gökadayla uyuştuğunu doğrudan sınar. O gelene kadar gökadanın karanlık nüfusu, iyi kurulmuş bir koşullu cümle olarak kalıyor — ve bu, hiç sayı olmamasından iyidir."}]}], "sources": [{"key": "kara-delikler", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-simulations-hint-hidden-population-companionless.html", "title": {"tr": "Bir Samanyolu benzetimi, yıldız kütleli kara deliklerin yaklaşık yüzde 91'ini yalnız buluyor", "en": "A Milky Way simulation finds about 91 percent of stellar-mass black holes alone"}, "publishedDate": "2026-08-03", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.22814", "publishedDate": "2026-07-24", "title": {"tr": "Gökada Yeraltını Haritalamak I: Samanyolu kara deliklerinin devinimleri, oluşum hızları ve demografisi üzerine kapsamlı benzetimler", "en": "Charting the Galactic Underworld I: Comprehensive simulations of the kinematics, rates, and demographics of Milky Way black holes"}}}], "title": {"en": "Ninety-one of every hundred black holes are alone", "tr": "Yüz kara delikten doksan biri yalnız"}, "writer": "sci-01", "date": "2026-08-04"}, {"excerpt": {"en": "In multiple sclerosis part of the disability accumulates independently of relapses, and counting relapses does not track it. 18,629 measurements from two large cohorts show that an astrocyte protein in the blood moves with that silent process.", "tr": "Multipl sklerozda engelliliğin bir bölümü ataklardan bağımsız birikiyor ve bu birikim atak sayarak izlenemiyor. İki büyük izlemden gelen 18.629 ölçüm, kandaki bir astrosit proteininin bu sessiz süreçle birlikte hareket ettiğini gösteriyor."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "Disability that accumulates without relapses", "tr": "Ataksız biriken engellilik"}, "ps": [{"en": "For a long time the relapse count was the measure in multiple sclerosis, yet in a share of patients disability grows slowly without any relapse at all. That silent worsening is called progression independent of relapse activity. A prospective observational study published in JAMA Neurology on 3 August looks for a blood measure that can follow exactly this. The data come from two cohorts: the eight-centre SMSC in Switzerland and the single-centre EPIC in the United States. Across 2,329 patients, 18,629 measurements were taken, with median follow-up of 6.9 years in SMSC and 13.1 in EPIC.", "refs": ["gfap"], "tr": "Multipl skleroz izleminde uzun süre atak sayısı ölçü alındı; oysa hastaların bir bölümünde engellilik hiç atak geçirilmeden, yavaşça artıyor. Bu sessiz kötüleşmenin adı ataktan bağımsız ilerleme. JAMA Neurology'de 3 Ağustos'ta yayımlanan ileriye dönük gözlemsel çalışma, tam da bunu izleyebilecek bir kan ölçütü arıyor. Veri iki ayrı izlemden geliyor: İsviçre'de sekiz merkezli SMSC ile Amerika Birleşik Devletleri'nde tek merkezli EPIC. Toplam 2.329 hastadan 18.629 ölçüm alındı; ortanca izlem süresi SMSC'de 6,9, EPIC'te 13,1 yıl."}, {"en": "The protein measured is glial fibrillary acidic protein, which enters the blood when astrocytes, the brain's support cells, are activated or injured. Where the value is elevated, the hazard of worsening independent of relapses rises 1.45-fold in SMSC (95% CI 1.21-1.75) and 1.36-fold in EPIC (1.07-1.71). That it points the same way in two populations of different size, in two countries, followed for different lengths of time, suggests the association is not a feature of a single centre. The lower bound of the EPIC interval is 1.07, so even if the association is real its size may be modest.", "refs": ["gfap"], "tr": "Ölçülen protein, beyindeki destek hücreleri olan astrositler etkinleştiğinde ya da zedelendiğinde kana geçen glial fibriler asidik protein. Değer yüksek olduğunda ataktan bağımsız kötüleşme riski SMSC'de 1,45 kat (yüzde 95 güven aralığı 1,21–1,75), EPIC'te 1,36 kat (1,07–1,71) yükseliyor. İki ayrı ülkede, farklı büyüklükte ve farklı süre izlenmiş iki toplulukta aynı yönde çıkması, bu ilişkinin tek bir merkezin özelliğinden ibaret olmadığını düşündürüyor. Güven aralıklarının alt sınırı EPIC'te 1,07; yani ilişki gerçek olsa bile büyüklüğü mütevazı olabilir."}]}, {"h": {"en": "What do we learn when the value falls?", "tr": "Değer düştüğünde ne öğreniyoruz?"}, "ps": [{"en": "The second finding is the more interesting one. Among patients whose protein level fell after starting treatment, the hazard of progression drops to 0.46 on fingolimod (0.26-0.84) and to 0.33 on B-cell therapies (0.18-0.61). That would mean the measure reflects not only who will worsen but whether a treatment is touching the silent process at all. The strongest counter-reading is plain, though: patients whose protein falls may have been different patients to begin with. An observational design cannot separate a treatment lowering the protein from patients with a better course being steered towards that treatment.", "refs": ["gfap"], "tr": "İkinci bulgu daha ilgi çekici. Tedaviye başladıktan sonra protein düzeyi düşen hastalarda ilerleme riski fingolimod altında 0,46 (0,26–0,84), B hücresine yönelen tedaviler altında 0,33 (0,18–0,61) oranına iniyor. Bu, ölçütün yalnızca kimin kötüye gideceğini değil, tedavinin sessiz sürece dokunup dokunmadığını da yansıtabileceği anlamına gelir. Ancak buradaki en güçlü karşı okuma açık: proteini düşen hastalar, başlangıçta da farklı hastalar olabilir. Gözlemsel bir tasarım, tedavinin proteini düşürmesi ile daha iyi seyirli hastaların o tedaviye yönlendirilmesini birbirinden ayıramaz."}, {"en": "What changes for a patient today? Honestly, little. The study proposes no threshold, says nothing about how often to measure, and does not show that changing treatment on the basis of the protein reduces disability; what it shows is an association. The step that would turn this into a clinical decision is clear: a prespecified trial in which treatment decisions are made from the measure from the outset, reporting its result. If such a trial declares a threshold and a decision rule, patients whose disease progresses without relapses would have a followable target for the first time. Until then this belongs on the research agenda rather than in the patient file.", "refs": ["gfap"], "tr": "Bir hasta için bugün ne değişiyor? Doğrusu, henüz az şey. Çalışma bir eşik değer önermiyor, kaç ayda bir ölçüm yapılacağını söylemiyor ve proteine bakarak tedavi değiştirmenin engelliliği azalttığını göstermiyor; gösterdiği şey bir ilişki. Bunu klinik karara çeviren adım bellidir: tedavi kararlarının baştan bu ölçüte göre verildiği, önceden tanımlanmış bir denemenin sonuç bildirmesi. Böyle bir deneme bir eşik ve bir karar kuralı ilan ederse, ataksız ilerleyen hastalar için ilk kez izlenebilir bir hedef doğar. O zamana kadar bu, hasta dosyasına giren bir bilgi değil, araştırma gündemine giren bir bilgidir."}]}], "sources": [{"key": "gfap", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-blood-marker-tracks-hidden-multiple.html", "title": {"tr": "Bir kan proteini, multipl sklerozda ataklar arasında biriken engelliliği izliyor", "en": "A blood protein tracks the disability that accumulates between relapses in MS"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "JAMA Neurology", "url": "https://jamanetwork.com/journals/jamaneurology/fullarticle/10.1001/jamaneurol.2026.2500", "publishedDate": "2026-08-03", "title": {"tr": "Multipl sklerozda serum glial fibriler asidik protein seyri, hastalık ilerlemesi ve tedavi yanıtı", "en": "Serum Glial Fibrillary Acidic Protein Dynamics, Disease Progression, and Therapy Response in Multiple Sclerosis"}}}], "title": {"en": "Does a protein see what the relapse count cannot?", "tr": "Bir protein, atak sayısının göremediğini görüyor mu?"}, "writer": "sci-02", "date": "2026-08-04"}, {"excerpt": {"en": "Argo floats measured a pigment a thousand metres down where it should not be. Behind that finding is a line added to the ocean's carbon ledger that scales with the severity of winter.", "tr": "Argo şamandıraları bin metre derinlikte, orada bulunmaması gereken bir pigment ölçtü. Bu bulgunun ardında, okyanusun karbonu derine indiren defterine kışın şiddetiyle ölçeklenen bir kalem eklenmesi var."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "A pigment that should not be at a thousand metres", "tr": "Bin metrede olmaması gereken pigment"}, "ps": [{"en": "Chlorophyll is the pigment of sunlit surface water; inside a particle drifting downward it cannot survive a journey of days, it breaks down and disperses. A study led by the Institute of Marine Sciences (ICM-CSIC) and the Barcelona Supercomputing Center reports that Argo floats in the Labrador and Irminger seas measured chlorophyll near a thousand metres between 2014 and 2017. It surprised lead author Marti Gali too, because the pigment would be expected to break down long before reaching that depth.", "refs": ["konveksiyon"], "tr": "Klorofil, güneş gören yüzey suyunun pigmentidir; aşağı doğru yol alan bir tanecik içinde günler süren bir yolculuğa dayanamaz, çözünür ve dağılır. Deniz Bilimleri Enstitüsü (ICM-CSIC) ile Barselona Süperbilgisayar Merkezi'nin yürüttüğü çalışma, Labrador ve Irminger denizlerinde 2014–2017 arasında Argo şamandıralarının bin metre dolayında klorofil ölçtüğünü bildiriyor. Baş yazar Martí Galí için de sürpriz olan bu, çünkü o derinliğe varmadan çok önce parçalanmış olması beklenirdi."}, {"en": "The explanation lies in the water itself rather than in the biology. In winter, cold and strong winds cool the surface; the cooled water grows heavier and drives down through the layer beneath it. On the way down it takes everything inside it along, living microalgae and organic debris alike. The paper in Science Advances describes this as a route separate from particles settling one by one: here the carbon is carried downward by the motion of the water rather than by gravity. Because the journey ends on a scale of hours rather than days, the pigment has no time to break down.", "refs": ["konveksiyon"], "tr": "Açıklamayı biyolojide değil suyun kendisinde aramak gerekiyor. Kışın soğuk ve sert rüzgârlar yüzey suyunu soğutur; soğuyan su ağırlaşır ve altındaki katmanı delerek hızla iner. İnerken içindeki her şeyi — canlı mikroalgleri, organik kırıntıyı — birlikte götürür. Science Advances dergisindeki çalışma bunu, taneciklerin tek tek çökelmesinden ayrı bir yol olarak tanımlıyor: burada karbonu aşağı taşıyan, yerçekiminden çok suyun kendi hareketidir. Yolculuk gün değil saat ölçeğinde bittiği için pigmentin bozulmaya vakti kalmıyor."}]}, {"h": {"en": "The line that changes in the carbon ledger", "tr": "Karbon defterinde değişen kalem"}, "ps": [{"en": "The magnitude is not trivial. In strong winters this route supplies between 30 percent and 50 percent of the organic particles found between 500 and 2000 m, roughly doubling in the harshest ones. What that means is this: part of the carbon reaching depth in this region depends not on how much was produced in summer but on how hard the winter was. An accounting built on summer production will describe two different years in the same sea with the same number. The counter-reading deserves recording too: the reported fraction holds for the subpolar North Atlantic and cannot be carried directly to basins where deep winter mixing does not operate on this scale.", "refs": ["konveksiyon"], "tr": "Büyüklük önemsiz değil. Güçlü kış mevsimlerinde 500 ile 2000 m arasında bulunan organik taneciklerin yüzde 30 ile yüzde 50 arasındaki bölümünü bu yol sağlıyor; en sert kışlarda katkı yaklaşık iki katına çıkıyor. Bunun anlamı şudur: bu bölgede derine inen karbonun bir bölümü yazın ne kadar üretildiğine değil, kışın ne kadar sert geçtiğine bağlı. Yaz üretimini esas alan bir hesap, aynı denizde iki farklı yılı aynı sayıyla anlatır. Karşı okumayı da kaydetmek gerek: bildirilen oran kutupaltı Kuzey Atlantik için geçerli, kışın derin karışımın bu ölçüde işlemediği havzalara doğrudan taşınamaz."}, {"en": "No lever comes out of this; nobody manages the winter. What comes out is a duty to keep watching. If winter mixing in the subpolar North Atlantic weakens, this route weakens with it and the depth at which the ocean holds carbon in this region is pulled upward. What would register that is unglamorous infrastructure: the same float network, in the same winter months, continuing to measure how deep the mixed layer reaches and whether the pigment is present at a thousand metres. When the next hard winter comes, whether the route still works down to the same depth will be a readable number.", "refs": ["konveksiyon"], "tr": "Buradan bir kaldıraç çıkmıyor; kimse kışı yönetmiyor. Çıkan şey bir izleme sorumluluğu. Kutupaltı Kuzey Atlantik'te kış karışımı zayıflarsa bu yol da zayıflar ve okyanusun bu bölgede karbonu tuttuğu derinlik yukarı çekilir. Bunu görecek olan gösteriş yapmayan bir altyapı: aynı şamandıra ağı, aynı kış aylarında, karışım katmanının ne kadar derine indiğini ve bin metrede pigmentin bulunup bulunmadığını ölçmeyi sürdürürse. Bir sonraki sert kış geldiğinde, bu yolun hâlâ aynı derinliğe kadar işleyip işlemediği okunabilir bir sayı olacak."}]}], "sources": [{"key": "konveksiyon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-mechanical-shortcut-rapidly-particles-deep.html", "title": {"tr": "Kış konveksiyonu, Kuzey Atlantik'te canlı algleri bin metrenin altına indiriyor", "en": "Winter convection carries living algae below a thousand metres in the North Atlantic"}, "publishedDate": "2026-08-03"}], "title": {"en": "Winter opens a chute in the Labrador Sea", "tr": "Kış, Labrador Denizi'nde bir baca açıyor"}, "writer": "sci-03", "date": "2026-08-04"}, {"excerpt": {"en": "In a microscope, resolution, field of view and frame rate share one budget. The Berkeley team enlarged the budget in two steps; the price of the second step is an assumption placed inside the reconstruction.", "tr": "Bir mikroskopta çözünürlük, görüş alanı ve kare hızı aynı bütçeyi paylaşır. Berkeley'deki ekip bütçeyi iki adımda büyüttü; ikinci adımın bedeli, geri kurma aşamasına yerleştirilmiş bir varsayım."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "Three properties, one budget", "tr": "Üç özellik, tek bütçe"}, "ps": [{"en": "In a microscope, raising resolution usually eats the field of view, and widening the field usually eats the frame rate. The reason is simple: the number of pixels a sensor can carry per second is fixed, and all three spend from the same budget. The first move by Kevin C. Zhou and colleagues, in the peer-reviewed paper published in Nature Photonics on 28 July, is to enlarge the budget directly: 48 sensors arranged in a grid deliver 48 times the pixels of a single sensor. But a sensor array has a defect; physical gaps remain between the sensors, and light falling into those gaps is never recorded.", "refs": ["mikroskop"], "tr": "Bir mikroskopta çözünürlüğü artırmak genellikle görüş alanını, görüş alanını genişletmek genellikle kare hızını yer. Nedeni basit: algılayıcının saniyede taşıyabileceği piksel sayısı sabittir ve üçü de aynı bütçeden harcar. Kevin C. Zhou ve arkadaşlarının Nature Photonics'te 28 Temmuz'da yayımlanan hakemli çalışmadaki ilk hamlesi doğrudan bütçeyi büyütmek: ızgara biçiminde dizilmiş 48 algılayıcı, tek bir algılayıcının 48 katı piksel veriyor. Ama bir algılayıcı dizisinin bir kusuru vardır; algılayıcılar arasında fiziksel boşluklar kalır ve o boşluklara düşen ışık kaydedilmez."}, {"en": "The second move is to close those gaps optically. A diffractive optical element sits in the Fourier plane of a near-4f imaging system, spreading each point's image into a multi-spot pattern. Information that would have fallen into a gap therefore also leaves a trace on the neighbouring sensors. The array is treated as one large sensor, the gaps count as erased regions of that large sensor, and compressive sensing algorithms reconstruct the erased part. That adds a further factor of 5.4. In total: about 3 micrometre resolution across a field wider than 5.2 square centimetres, at up to 120 frames per second, which is 25.2 billion pixels per second.", "refs": ["mikroskop"], "tr": "İkinci hamle, o boşlukları optikle kapatmak. Yaklaşık bir 4f görüntüleme düzeninin Fourier düzlemine kırınımlı bir optik öğe yerleştiriliyor; bu öğe her noktanın görüntüsünü çok noktalı bir desene dağıtıyor. Böylece boşluğa düşecek olan bilgi, komşu algılayıcıların üzerine de bir iz bırakıyor. Dizi tek bir büyük algılayıcı gibi ele alınıyor, boşluklar bu büyük algılayıcının silinmiş bölgeleri sayılıyor ve sıkıştırmalı algılama algoritmaları silinen kısmı geri kuruyor. Kazanç 5,4 kat daha. Toplam: 5,2 santimetrekareden geniş bir alanda yaklaşık 3 mikrometre çözünürlük, saniyede 120 kareye kadar hız, yani saniyede 25,2 milyar piksel."}]}, {"h": {"en": "Where is the gain paid for?", "tr": "Kazanç nerede ödeniyor?"}, "ps": [{"en": "The second gain comes at a price, and the price is an assumption. The reconstruction works by accepting that the object is sparse in some domain, meaning most of the image is empty and the information is gathered in a few places. Where that holds, the information falling into the gaps can be filled in reliably. In a dense, low-contrast specimen that is full everywhere, the assumption weakens, and the most likely home for error is precisely the filled-in regions. The counter-view is available: the two modes demonstrated, dark-field imaging and calcium tracking in freely moving Caenorhabditis elegans, produce sparse signals by their nature, which is not a limitation so much as an instrument matched to its own use.", "refs": ["mikroskop"], "tr": "İkinci kazancın bir bedeli var ve bu bedel bir varsayımla ödeniyor. Geri kurma, nesnenin bir uzayda seyrek olduğunu — yani görüntünün büyük bölümünün boş, bilginin az sayıda yerde toplandığını — kabul ederek çalışıyor. Bu doğru olduğunda boşluklara düşen bilgi güvenilir biçimde tamamlanabilir. Yoğun, düşük karşıtlıklı, her yeri dolu bir örnekte ise varsayım zayıflar ve hatanın en olası yeri tam da doldurulan bölgelerdir. Karşı görüş şu olabilir: gösterilen iki kip, karanlık alan görüntüleme ve serbest hareket eden Caenorhabditis elegans solucanlarında kalsiyum izleme, doğası gereği seyrek sinyaller üretir; bu bir kısıt değil, aracın kendi kullanım alanına uygun seçilmiş olmasıdır."}, {"en": "So it is worth separating what is known from what has not been built. Known: the 48-fold from 48 sensors, the 5.4-fold from the optics, and the 25.2 billion pixels their product yields are measured quantities. Not built: what the same instrument does on a specimen where the sparsity assumption does not hold. Laura Waller's claim of the largest space-bandwidth-time product among known microscopes is likewise a claim about a metric, not about every application. For a reading that keeps the two apart, the next step is clear: another group running the same reconstruction chain on its own specimen, preferably a dense tissue, and comparing the resulting image against an independent method.", "refs": ["mikroskop"], "tr": "Bu yüzden bilinen ile yapılmamış olanı ayırmak gerekiyor. Bilinen: 48 algılayıcının verdiği 48 kat, optikle sağlanan 5,4 kat ve bunların çarpımından çıkan 25,2 milyar piksel, ölçülmüş büyüklüklerdir. Yapılmamış olan: aynı düzeneğin seyreklik varsayımının geçmediği bir örnekte ne yaptığı. Laura Waller'ın bilinen mikroskoplar arasında en büyük uzay–bant genişliği–zaman çarpımı iddiası da bir ölçüt hakkındadır, her uygulama hakkında değil. Bu iki şeyi karıştırmayan bir okuma için sıradaki adım açık: başka bir grubun aynı geri kurma zincirini kendi örneğinde, tercihen yoğun bir dokuda çalıştırıp çıkan görüntüyü bağımsız bir yöntemle karşılaştırması."}]}], "sources": [{"key": "mikroskop", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-focus-microscope-captures-billion-pixels.html", "title": {"tr": "Kırk sekiz algılayıcı arasındaki boşlukları kırınımlı bir cam dolduruyor", "en": "A diffractive element fills the gaps between forty-eight sensors"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Photonics", "url": "https://www.nature.com/articles/s41566-026-01974-4", "publishedDate": "2026-07-28", "title": {"tr": "Algılayıcı dizisi ve kırınımlı optik öğeyle tek karede gigapiksel ölçeğinde görüntüleme", "en": "Snapshot gigapixel-scale imaging with a sensor array and a diffractive optical element"}}}], "title": {"en": "A piece of glass fills the gaps between forty-eight sensors", "tr": "Kırk sekiz algılayıcı arasındaki boşlukları bir cam parçası dolduruyor"}, "writer": "sci-04", "date": "2026-08-04"}, {"excerpt": {"en": "The same catalyst batches, the same testing protocol, four separate laboratories. Input-output relationships that were clear inside a single laboratory lost their significance once interlaboratory variability was counted.", "tr": "Aynı katalizör partileri, aynı sınama yönergesi, dört ayrı laboratuvar. Tek laboratuvarın içinde açıkça görülen girdi–çıktı ilişkileri, laboratuvarlar arası değişkenlik hesaba katıldığında anlamlılığını yitirdi."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "The design", "tr": "Tasarım"}, "ps": [{"en": "What makes a methods study valuable is as much what it holds fixed as what it finds. SLAC National Accelerator Laboratory, Pennsylvania State University, Stanford and UC Santa Barbara took the same batches of a rhodium-on-titania catalyst used for CO2 hydrogenation and applied the same testing protocol. The inputs were reaction temperature, rhodium loading and synthesis method; the outputs were conversion, selectivity and the production rates of carbon monoxide and methane. The peer-reviewed paper appeared in Nature Catalysis on 31 July. The aim was not to discover a catalyst but to measure the uncertainty in catalyst data.", "refs": ["round-robin"], "tr": "Bir yöntem çalışmasını değerli kılan, ne bulduğu kadar neyi sabit tuttuğudur. SLAC Ulusal Hızlandırıcı Laboratuvarı, Pennsylvania Eyalet Üniversitesi, Stanford ve Santa Barbara'daki Kaliforniya Üniversitesi, karbondioksitin hidrojenlenmesinde kullanılan rodyum–titanyum dioksit katalizörünün aynı partilerini aldı ve aynı sınama yönergesini uyguladı. Girdiler tepkime sıcaklığı, rodyum yüklemesi ve sentez yöntemiydi; çıktılar dönüşüm, seçicilik ile karbon monoksit ve metan üretim hızları. Hakemli çalışma Nature Catalysis'te 31 Temmuz'da yayımlandı. Amaç bir katalizör keşfetmek değil, katalizör verisinin belirsizliğini ölçmekti."}, {"en": "The result fits in one sentence: input-output relationships that were clear inside a single laboratory lost their statistical significance once interlaboratory variability was included. The authors report heat management as the largest contributor to that variability, meaning four reactors following the same protocol do not distribute heat the same way. Nothing here is debunked; what is debunked is treating those relationships as valid beyond the boundary of the laboratory that produced them.", "refs": ["round-robin"], "tr": "Sonuç tek cümlede duruyor: tek bir laboratuvarın içinde açıkça görülen girdi–çıktı ilişkileri, laboratuvarlar arası değişkenlik hesaba katıldığında istatistiksel anlamlılığını yitirdi. Yazarlar bu değişkenliğe en çok katkıyı ısı yönetiminin yaptığını bildiriyor — yani aynı yönergeyi izleyen dört reaktörün ısıyı aynı biçimde dağıtmaması. Burada çürüyen bir bulgu yok; çürüyen, o bulgunun laboratuvar sınırının ötesinde geçerli sayılmasıydı."}]}, {"h": {"en": "What broke, and what is left?", "tr": "Ne çürüdü, ne kaldı?"}, "ps": [{"en": "The defect sits in the dataset's error model rather than in the learning method. If a dataset assembled from several reactors does not carry intralaboratory and interlaboratory variability separately, it will present a feature as though it were informative when the variability has swallowed it. Machine learning does nothing wrong here; it does what it was given. The authors' contribution is to turn that distinction from a recommendation into a measured quantity. In fairness there is a limit: reactors at four separate institutions may be more diverse than a carefully curated dataset gathered under one programme. In that case the effect measured here should count as an upper bound rather than the typical case.", "refs": ["round-robin"], "tr": "Kusur, öğrenme yönteminde değil veri kümesinin hata modelinde duruyor. Birden çok reaktörden derlenmiş bir veri kümesi laboratuvar içi ve laboratuvarlar arası değişkenliği ayrı ayrı taşımıyorsa, bir özniteliği bilgi taşıyor gibi sunar; oysa değişkenlik onu yutmuştur. Makine öğrenmesi bu durumda yanlış bir şey yapmaz, kendisine verileni yapar. Yazarların katkısı da bu ayrımı bir öneri olmaktan çıkarıp ölçülmüş bir büyüklük haline getirmesidir. Adil olmak gerekirse bir sınır var: dört ayrı kurumun reaktörleri, tek bir programın denetiminde toplanmış özenli bir veri kümesinden daha çeşitli olabilir. O zaman buradaki etki tipik durum değil, üst sınır sayılmalıdır."}, {"en": "What is left is a narrow, actionable request. A study publishing experimental catalyst data should report its own reproducibility budget alongside its performance metrics: how much the result moves when repeated in the same laboratory, and how much when repeated in another. Given those two numbers, a feature selection becomes auditable; without them it does not. Rather than an item for a journal checklist, this is a field the dataset itself has to carry. It is also where the next round-robin study should be read: when heat management is equalised, do the vanished relationships come back?", "refs": ["round-robin"], "tr": "Geriye kalan, uygulanabilir ve dar bir istek. Deneysel katalizör verisi yayımlayan bir çalışma, başarım ölçütlerinin yanında kendi tekrarlanabilirlik bütçesini de bildirsin: aynı laboratuvarda tekrarlandığında sonuç ne kadar oynuyor, başka bir laboratuvarda ne kadar oynuyor. Bu iki sayı verildiğinde bir öznitelik seçimi denetlenebilir hale gelir; verilmediğinde denetlenemez. Bu, dergilerin denetim listesine eklenecek bir madde olmaktan çok, veri kümesinin kendi içinde taşıması gereken bir alandır. Laboratuvarlar arası karşılaştırmalı sonraki çalışmanın bakılacak yeri de bu olacak: ısı yönetimi eşitlendiğinde kaybolan ilişkiler geri geliyor mu?"}]}], "sources": [{"key": "round-robin", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-labs-experimental
