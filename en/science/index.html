lir bir sayı olacak."}]}], "sources": [{"key": "konveksiyon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-mechanical-shortcut-rapidly-particles-deep.html", "title": {"tr": "Kış konveksiyonu, Kuzey Atlantik'te canlı algleri bin metrenin altına indiriyor", "en": "Winter convection carries living algae below a thousand metres in the North Atlantic"}, "publishedDate": "2026-08-03"}], "title": {"en": "Winter opens a chute in the Labrador Sea", "tr": "Kış, Labrador Denizi'nde bir baca açıyor"}, "writer": "sci-03", "date": "2026-08-04"}, {"excerpt": {"en": "In a microscope, resolution, field of view and frame rate share one budget. The Berkeley team enlarged the budget in two steps; the price of the second step is an assumption placed inside the reconstruction.", "tr": "Bir mikroskopta çözünürlük, görüş alanı ve kare hızı aynı bütçeyi paylaşır. Berkeley'deki ekip bütçeyi iki adımda büyüttü; ikinci adımın bedeli, geri kurma aşamasına yerleştirilmiş bir varsayım."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "Three properties, one budget", "tr": "Üç özellik, tek bütçe"}, "ps": [{"en": "In a microscope, raising resolution usually eats the field of view, and widening the field usually eats the frame rate. The reason is simple: the number of pixels a sensor can carry per second is fixed, and all three spend from the same budget. The first move by Kevin C. Zhou and colleagues, in the peer-reviewed paper published in Nature Photonics on 28 July, is to enlarge the budget directly: 48 sensors arranged in a grid deliver 48 times the pixels of a single sensor. But a sensor array has a defect; physical gaps remain between the sensors, and light falling into those gaps is never recorded.", "refs": ["mikroskop"], "tr": "Bir mikroskopta çözünürlüğü artırmak genellikle görüş alanını, görüş alanını genişletmek genellikle kare hızını yer. Nedeni basit: algılayıcının saniyede taşıyabileceği piksel sayısı sabittir ve üçü de aynı bütçeden harcar. Kevin C. Zhou ve arkadaşlarının Nature Photonics'te 28 Temmuz'da yayımlanan hakemli çalışmadaki ilk hamlesi doğrudan bütçeyi büyütmek: ızgara biçiminde dizilmiş 48 algılayıcı, tek bir algılayıcının 48 katı piksel veriyor. Ama bir algılayıcı dizisinin bir kusuru vardır; algılayıcılar arasında fiziksel boşluklar kalır ve o boşluklara düşen ışık kaydedilmez."}, {"en": "The second move is to close those gaps optically. A diffractive optical element sits in the Fourier plane of a near-4f imaging system, spreading each point's image into a multi-spot pattern. Information that would have fallen into a gap therefore also leaves a trace on the neighbouring sensors. The array is treated as one large sensor, the gaps count as erased regions of that large sensor, and compressive sensing algorithms reconstruct the erased part. That adds a further factor of 5.4. In total: about 3 micrometre resolution across a field wider than 5.2 square centimetres, at up to 120 frames per second, which is 25.2 billion pixels per second.", "refs": ["mikroskop"], "tr": "İkinci hamle, o boşlukları optikle kapatmak. Yaklaşık bir 4f görüntüleme düzeninin Fourier düzlemine kırınımlı bir optik öğe yerleştiriliyor; bu öğe her noktanın görüntüsünü çok noktalı bir desene dağıtıyor. Böylece boşluğa düşecek olan bilgi, komşu algılayıcıların üzerine de bir iz bırakıyor. Dizi tek bir büyük algılayıcı gibi ele alınıyor, boşluklar bu büyük algılayıcının silinmiş bölgeleri sayılıyor ve sıkıştırmalı algılama algoritmaları silinen kısmı geri kuruyor. Kazanç 5,4 kat daha. Toplam: 5,2 santimetrekareden geniş bir alanda yaklaşık 3 mikrometre çözünürlük, saniyede 120 kareye kadar hız, yani saniyede 25,2 milyar piksel."}]}, {"h": {"en": "Where is the gain paid for?", "tr": "Kazanç nerede ödeniyor?"}, "ps": [{"en": "The second gain comes at a price, and the price is an assumption. The reconstruction works by accepting that the object is sparse in some domain, meaning most of the image is empty and the information is gathered in a few places. Where that holds, the information falling into the gaps can be filled in reliably. In a dense, low-contrast specimen that is full everywhere, the assumption weakens, and the most likely home for error is precisely the filled-in regions. The counter-view is available: the two modes demonstrated, dark-field imaging and calcium tracking in freely moving Caenorhabditis elegans, produce sparse signals by their nature, which is not a limitation so much as an instrument matched to its own use.", "refs": ["mikroskop"], "tr": "İkinci kazancın bir bedeli var ve bu bedel bir varsayımla ödeniyor. Geri kurma, nesnenin bir uzayda seyrek olduğunu — yani görüntünün büyük bölümünün boş, bilginin az sayıda yerde toplandığını — kabul ederek çalışıyor. Bu doğru olduğunda boşluklara düşen bilgi güvenilir biçimde tamamlanabilir. Yoğun, düşük karşıtlıklı, her yeri dolu bir örnekte ise varsayım zayıflar ve hatanın en olası yeri tam da doldurulan bölgelerdir. Karşı görüş şu olabilir: gösterilen iki kip, karanlık alan görüntüleme ve serbest hareket eden Caenorhabditis elegans solucanlarında kalsiyum izleme, doğası gereği seyrek sinyaller üretir; bu bir kısıt değil, aracın kendi kullanım alanına uygun seçilmiş olmasıdır."}, {"en": "So it is worth separating what is known from what has not been built. Known: the 48-fold from 48 sensors, the 5.4-fold from the optics, and the 25.2 billion pixels their product yields are measured quantities. Not built: what the same instrument does on a specimen where the sparsity assumption does not hold. Laura Waller's claim of the largest space-bandwidth-time product among known microscopes is likewise a claim about a metric, not about every application. For a reading that keeps the two apart, the next step is clear: another group running the same reconstruction chain on its own specimen, preferably a dense tissue, and comparing the resulting image against an independent method.", "refs": ["mikroskop"], "tr": "Bu yüzden bilinen ile yapılmamış olanı ayırmak gerekiyor. Bilinen: 48 algılayıcının verdiği 48 kat, optikle sağlanan 5,4 kat ve bunların çarpımından çıkan 25,2 milyar piksel, ölçülmüş büyüklüklerdir. Yapılmamış olan: aynı düzeneğin seyreklik varsayımının geçmediği bir örnekte ne yaptığı. Laura Waller'ın bilinen mikroskoplar arasında en büyük uzay–bant genişliği–zaman çarpımı iddiası da bir ölçüt hakkındadır, her uygulama hakkında değil. Bu iki şeyi karıştırmayan bir okuma için sıradaki adım açık: başka bir grubun aynı geri kurma zincirini kendi örneğinde, tercihen yoğun bir dokuda çalıştırıp çıkan görüntüyü bağımsız bir yöntemle karşılaştırması."}]}], "sources": [{"key": "mikroskop", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-focus-microscope-captures-billion-pixels.html", "title": {"tr": "Kırk sekiz algılayıcı arasındaki boşlukları kırınımlı bir cam dolduruyor", "en": "A diffractive element fills the gaps between forty-eight sensors"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Photonics", "url": "https://www.nature.com/articles/s41566-026-01974-4", "publishedDate": "2026-07-28", "title": {"tr": "Algılayıcı dizisi ve kırınımlı optik öğeyle tek karede gigapiksel ölçeğinde görüntüleme", "en": "Snapshot gigapixel-scale imaging with a sensor array and a diffractive optical element"}}}], "title": {"en": "A piece of glass fills the gaps between forty-eight sensors", "tr": "Kırk sekiz algılayıcı arasındaki boşlukları bir cam parçası dolduruyor"}, "writer": "sci-04", "date": "2026-08-04"}, {"excerpt": {"en": "The same catalyst batches, the same testing protocol, four separate laboratories. Input-output relationships that were clear inside a single laboratory lost their significance once interlaboratory variability was counted.", "tr": "Aynı katalizör partileri, aynı sınama yönergesi, dört ayrı laboratuvar. Tek laboratuvarın içinde açıkça görülen girdi–çıktı ilişkileri, laboratuvarlar arası değişkenlik hesaba katıldığında anlamlılığını yitirdi."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "The design", "tr": "Tasarım"}, "ps": [{"en": "What makes a methods study valuable is as much what it holds fixed as what it finds. SLAC National Accelerator Laboratory, Pennsylvania State University, Stanford and UC Santa Barbara took the same batches of a rhodium-on-titania catalyst used for CO2 hydrogenation and applied the same testing protocol. The inputs were reaction temperature, rhodium loading and synthesis method; the outputs were conversion, selectivity and the production rates of carbon monoxide and methane. The peer-reviewed paper appeared in Nature Catalysis on 31 July. The aim was not to discover a catalyst but to measure the uncertainty in catalyst data.", "refs": ["round-robin"], "tr": "Bir yöntem çalışmasını değerli kılan, ne bulduğu kadar neyi sabit tuttuğudur. SLAC Ulusal Hızlandırıcı Laboratuvarı, Pennsylvania Eyalet Üniversitesi, Stanford ve Santa Barbara'daki Kaliforniya Üniversitesi, karbondioksitin hidrojenlenmesinde kullanılan rodyum–titanyum dioksit katalizörünün aynı partilerini aldı ve aynı sınama yönergesini uyguladı. Girdiler tepkime sıcaklığı, rodyum yüklemesi ve sentez yöntemiydi; çıktılar dönüşüm, seçicilik ile karbon monoksit ve metan üretim hızları. Hakemli çalışma Nature Catalysis'te 31 Temmuz'da yayımlandı. Amaç bir katalizör keşfetmek değil, katalizör verisinin belirsizliğini ölçmekti."}, {"en": "The result fits in one sentence: input-output relationships that were clear inside a single laboratory lost their statistical significance once interlaboratory variability was included. The authors report heat management as the largest contributor to that variability, meaning four reactors following the same protocol do not distribute heat the same way. Nothing here is debunked; what is debunked is treating those relationships as valid beyond the boundary of the laboratory that produced them.", "refs": ["round-robin"], "tr": "Sonuç tek cümlede duruyor: tek bir laboratuvarın içinde açıkça görülen girdi–çıktı ilişkileri, laboratuvarlar arası değişkenlik hesaba katıldığında istatistiksel anlamlılığını yitirdi. Yazarlar bu değişkenliğe en çok katkıyı ısı yönetiminin yaptığını bildiriyor — yani aynı yönergeyi izleyen dört reaktörün ısıyı aynı biçimde dağıtmaması. Burada çürüyen bir bulgu yok; çürüyen, o bulgunun laboratuvar sınırının ötesinde geçerli sayılmasıydı."}]}, {"h": {"en": "What broke, and what is left?", "tr": "Ne çürüdü, ne kaldı?"}, "ps": [{"en": "The defect sits in the dataset's error model rather than in the learning method. If a dataset assembled from several reactors does not carry intralaboratory and interlaboratory variability separately, it will present a feature as though it were informative when the variability has swallowed it. Machine learning does nothing wrong here; it does what it was given. The authors' contribution is to turn that distinction from a recommendation into a measured quantity. In fairness there is a limit: reactors at four separate institutions may be more diverse than a carefully curated dataset gathered under one programme. In that case the effect measured here should count as an upper bound rather than the typical case.", "refs": ["round-robin"], "tr": "Kusur, öğrenme yönteminde değil veri kümesinin hata modelinde duruyor. Birden çok reaktörden derlenmiş bir veri kümesi laboratuvar içi ve laboratuvarlar arası değişkenliği ayrı ayrı taşımıyorsa, bir özniteliği bilgi taşıyor gibi sunar; oysa değişkenlik onu yutmuştur. Makine öğrenmesi bu durumda yanlış bir şey yapmaz, kendisine verileni yapar. Yazarların katkısı da bu ayrımı bir öneri olmaktan çıkarıp ölçülmüş bir büyüklük haline getirmesidir. Adil olmak gerekirse bir sınır var: dört ayrı kurumun reaktörleri, tek bir programın denetiminde toplanmış özenli bir veri kümesinden daha çeşitli olabilir. O zaman buradaki etki tipik durum değil, üst sınır sayılmalıdır."}, {"en": "What is left is a narrow, actionable request. A study publishing experimental catalyst data should report its own reproducibility budget alongside its performance metrics: how much the result moves when repeated in the same laboratory, and how much when repeated in another. Given those two numbers, a feature selection becomes auditable; without them it does not. Rather than an item for a journal checklist, this is a field the dataset itself has to carry. It is also where the next round-robin study should be read: when heat management is equalised, do the vanished relationships come back?", "refs": ["round-robin"], "tr": "Geriye kalan, uygulanabilir ve dar bir istek. Deneysel katalizör verisi yayımlayan bir çalışma, başarım ölçütlerinin yanında kendi tekrarlanabilirlik bütçesini de bildirsin: aynı laboratuvarda tekrarlandığında sonuç ne kadar oynuyor, başka bir laboratuvarda ne kadar oynuyor. Bu iki sayı verildiğinde bir öznitelik seçimi denetlenebilir hale gelir; verilmediğinde denetlenemez. Bu, dergilerin denetim listesine eklenecek bir madde olmaktan çok, veri kümesinin kendi içinde taşıması gereken bir alandır. Laboratuvarlar arası karşılaştırmalı sonraki çalışmanın bakılacak yeri de bu olacak: ısı yönetimi eşitlendiğinde kaybolan ilişkiler geri geliyor mu?"}]}], "sources": [{"key": "round-robin", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-labs-experimental-differences-undermine-ai.html", "title": {"tr": "Dört laboratuvar aynı katalizörü sınadı, model eğitiminde kullanılan ilişkiler kayboldu", "en": "Four laboratories tested the same catalyst and the relationships used to train models disappeared"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Catalysis", "url": "https://www.nature.com/articles/s41929-026-01559-y", "publishedDate": "2026-07-31", "title": {"tr": "Veriye dayalı modelleme için laboratuvarlar arası karşılaştırmalı sınamayla karbondioksit hidrojenlenmesinde katalizör etkinliği ve etkinlik yitiminde belirsizliğin niceliklendirilmesi", "en": "Quantifying uncertainty in catalyst activity and deactivation during CO2 hydrogenation via round-robin testing for data-driven modelling"}}}], "title": {"en": "Four laboratories, one catalyst, one vanished relationship", "tr": "Dört laboratuvar, tek katalizör, kaybolan bir ilişki"}, "writer": "sci-05", "date": "2026-08-04"}, {"excerpt": {"en": "The slow clicks of male sperm whales are the loudest communication sound measured in any mammal. We know the sound's decibels; we do not know what it is for. That distance is what this story is really about.", "tr": "Erkek ispermeçet balinalarının yavaş tıklamaları, bir memelide ölçülmüş en yüksek iletişim sesi. Sesin desibelini biliyoruz; ne için çıkarıldığını bilmiyoruz. Aradaki mesafe, bu haberin asıl konusu."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "What was measured", "tr": "Ölçülen"}, "ps": [{"en": "That a sound can travel 70 km through the open sea and still be heard at the end of it is hard to picture on a human scale, and the sound is made by an animal. An international team measured the slow clicks of male sperm whales using recording tags fixed with suction cups to whales in waters off the Seychelles, Sri Lanka, Norway and Scotland. According to the result in the Annals of the New York Academy of Sciences, source levels exceed 200 dB re 1 microPascal, the loudest communication sound measured in any mammal, with an estimated active space of about 70 km under typical deep-water conditions. These clicks are separate from the echolocation clicks the whales use to find prey.", "refs": ["balina"], "tr": "Bir sesin açık denizde 70 km yol alıp sonunda hâlâ duyulabilmesi insan ölçeğinde zor hayal ediliyor; üstelik o sesi çıkaran bir hayvan. Uluslararası bir ekip, Seyşeller, Sri Lanka, Norveç ve İskoçya sularında balinalara vantuzla tutturulan kaydedicilerle erkek ispermeçet balinalarının yavaş tıklamalarını ölçtü. Annals of the New York Academy of Sciences dergisindeki sonuca göre kaynak düzeyleri 1 mikropaskal başına 200 desibeli aşıyor; bu, herhangi bir memelide ölçülmüş en yüksek iletişim sesi ve derin suyun olağan koşullarında etkin erişim alanı yaklaşık 70 km. Bu tıklamalar, balinaların avlarını bulmak için kullandığı yankı bulma tıklamalarından ayrı."}, {"en": "As for what the sound is for, we have a proposal. A large male's large nose produces a lower-frequency click; if that holds, the sound could be a signal that announces body size in a way that cannot be faked. This is what biologists call honest advertisement: a declaration that is physically expensive to lie with. Peter Teglberg Madsen of the team defends the proposal while also setting its limit: the behavioural function of the clicks is not known, and how other whales respond to them is not known. What was measured is the sound; what is proposed is its meaning.", "refs": ["balina"], "tr": "Sesin ne işe yaradığına gelince, elimizde bir öneri var. Büyük bir erkeğin büyük burnu daha alçak frekanslı bir tıklama üretir; bu doğruysa ses, bedenin büyüklüğünü taklit edilemez biçimde ilan eden bir işaret olabilir. Biyologların dürüst reklam dediği şey budur: yalan söylemesi fiziksel olarak pahalı bir bildirim. Ekipten Peter Teglberg Madsen bu öneriyi savunurken sınırı da koyuyor: tıklamaların davranıştaki işlevi bilinmiyor ve diğer balinaların bunlara nasıl karşılık verdiği bilinmiyor. Yani ölçülen, sesin kendisi; önerilen, sesin anlamı."}]}, {"h": {"en": "The distance between measuring and understanding", "tr": "Ölçmek ile anlamak arasındaki mesafe"}, "ps": [{"en": "The gap between those two is more interesting than the result itself. With a device stuck to an animal's back we can pin down, in decibels, the intensity of a sound made out at sea; we cannot say what the same sound is for. Our ability to measure has outrun our ability to understand. The deflationary reading is waiting and deserves its due: perhaps these clicks are not a language in any sense, and the honest-signal interpretation is a familiar case of sexual selection, in which case what changes is only a loudness record for a sound on this planet. But even that reading does not close the same gap; it only says the gap is more ordinary.", "refs": ["balina"], "tr": "Bu ikisi arasındaki boşluk, sonucun kendisinden daha ilgi çekici. Bir hayvanın sırtına yapıştırılan bir aygıtla, denizde çıkarılan bir sesin şiddetini desibel ölçeğinde saptayabiliyoruz; aynı sesin ne için çıkarıldığını söyleyemiyoruz. Ölçme yeteneğimiz, anlama yeteneğimizi geride bıraktı. Sönümleyici okuma da hazır beklemektedir ve hakkı verilmelidir: belki bu tıklamalar hiçbir anlamda bir dil değildir, dürüst işaret yorumu da eşeysel seçilimin bildik bir örneğidir; o zaman değişen şey, yeryüzündeki bir sesin şiddet rekorundan ibaret kalır. Ama bu okuma bile aynı boşluğu kapatmıyor, yalnızca boşluğun daha sıradan olduğunu söylüyor."}, {"en": "Meanwhile one end of the gap is in our hands. Alongside factors we cannot change, such as temperature, salinity and depth, there is shipping noise; under heavy traffic the same signal's reach falls from 70 km to a few km. We do not yet know what the sound says; we do know that we can make it inaudible. Shipping routes, speed limits and noise measurements are numbers we write. For someone reading the news tonight, the real question is how willing we are to let a message we have not yet decoded be silenced before we have had time to decode it.", "refs": ["balina"], "tr": "Bu arada boşluğun bir ucu bizim elimizde. Sıcaklık, tuzluluk ve derinlik gibi değiştiremediğimiz etkenlerin yanında bir de gemi gürültüsü var; yoğun gemi trafiğinde aynı sinyalin erişimi 70 km'den birkaç km düzeyine iniyor. Bir sesin ne dediğini henüz bilmiyoruz; onu duyulmaz kılabildiğimizi ise biliyoruz. Gemi rotaları, hız sınırları ve gürültü ölçümleri bizim yazdığımız sayılardır. Bu gece haberi okuyan biri için asıl soru, henüz çözemediğimiz bir bildirimin çözmeye vaktimiz olmadan susturulmasına ne kadar razı olduğumuzdur."}]}], "sources": [{"key": "balina", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-male-sperm-whales-loudest-communication.html", "title": {"tr": "Erkek ispermeçet balinalarının yavaş tıklamaları 200 desibeli aşıyor", "en": "Male sperm whales' slow clicks exceed 200 decibels"}, "publishedDate": "2026-08-03"}], "title": {"en": "A sound that carries seventy kilometres, and we do not know what it says", "tr": "Yetmiş kilometre giden bir ses; ne dediğini bilmiyoruz"}, "writer": "sci-06", "date": "2026-08-04"}, {"excerpt": {"en": "Three small moons and a set of rings returned a spectrum with clay in it and no water ice. Both halves of that result matter, and the second is the stranger one.", "tr": "Üç küçük uydu ve bir halka takımı, içinde kil bulunan, su buzu bulunmayan bir tayf verdi. Sonucun iki yarısı da önemli; asıl tuhaf olanı ikincisi."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "Two pieces of news in one spectrum", "tr": "Tayfın içindeki iki haber"}, "ps": [{"en": "The James Webb Space Telescope looked at three of Neptune's inner moons and at its rings in the near infrared, and magnesium-rich phyllosilicates — clay minerals — turned up on Larissa, on Galatea and in the rings. Those minerals had never been seen on the surface of anything in the solar system beyond Jupiter. The work, led by Ryleigh Davis, appeared on 29 July in Science Advances.", "refs": ["neptun-uydulari"], "tr": "James Webb Uzay Teleskobu, Neptün'ün üç iç uydusuna ve halkalarına yakın kızılötesinde baktı; Larissa, Galatea ve halkalarda magnezyumca zengin filosilikatların, yani kil minerallerinin izi çıktı. Bu mineraller Güneş Sistemi'nde Jüpiter'in ötesinde bugüne dek hiçbir cismin yüzeyinde görülmemişti. Ryleigh Davis'in yönettiği çalışma 29 Temmuz'da Science Advances dergisinde yayımlandı."}, {"en": "The second piece of news in the same spectrum is an absence. No water ice was detected on any of the three moons or in the rings. That far from the Sun, in a region where nearly everything around them is icy, a surface without ice is a situation that demands an explanation, and the team calls it surprising. Finding clay is a discovery; failing to find ice is a puzzle.", "refs": ["neptun-uydulari"], "tr": "Aynı tayfın ikinci haberi bir yokluk. Üç uydunun ve halkaların hiçbirinde su buzu saptanmadı. Güneş'ten bu kadar uzakta, çevresindeki hemen her şeyin buzlu olduğu bir bölgede, buzsuz bir yüzey açıklama bekleyen bir durumdur; ekip de bunu şaşırtıcı buluyor. Kil bulmak bir keşif, buz bulamamak ise bir bilmece."}]}, {"h": {"en": "What clay requires", "tr": "Kil neyi gerektirir"}, "ps": [{"en": "Phyllosilicates do not form without liquid water, and forming them takes prolonged heating. The most likely address for such an environment is deep inside a large icy body, where radioactive decay and other sources melt its ice. The reading that follows is this: Neptune's inner moons today may have gathered from the wreckage of an older moon system broken apart when Triton was captured, and the clay may have been carried up from inside those older bodies.", "refs": ["neptun-uydulari"], "tr": "Filosilikatlar sıvı su olmadan oluşmaz ve oluşmaları için uzun süreli bir ısınma gerekir. Böyle bir ortamın en olası adresi, radyoaktif bozunmanın ve başka kaynakların buzunu erittiği büyük bir buzlu cismin derinliğidir. Buradan çıkan okuma şu: Neptün'ün bugünkü iç uyduları, Triton yakalanırken parçalanan daha eski bir uydu düzeninin enkazından toparlanmış olabilir; kil de o eski cisimlerin iç kısmından yüzeye taşınmış olabilir."}, {"en": "That reading is not the only option, and the team does not present it as one. A Pluto-sized dwarf planet torn apart by tides as it passed close to Neptune could have left the same minerals. The absence of clay on Proteus, the largest of the three, can be read two ways as well: either it gathered from a clay-poor part of the debris, or it was later heated enough to destroy those minerals. The spectrum does not say which story is right. It says which material any story now has to account for.", "refs": ["neptun-uydulari"], "tr": "Bu okuma tek seçenek değil ve ekip de tek seçenek olduğunu söylemiyor. Neptün'ün yakınından geçerken gelgit kuvvetleriyle parçalanmış, Plüton büyüklüğünde bir cüce gezegen de aynı mineralleri bırakabilirdi. Üçünün en büyüğü olan Proteus'ta kil bulunmaması da iki yönde okunabilir: ya enkazın kilce yoksul bir bölümünden toparlandı ya da sonradan bu mineralleri yok edecek kadar ısındı. Tayf, hangi hikâyenin doğru olduğunu değil, hikâyenin hangi maddeyi açıklamak zorunda olduğunu söylüyor."}]}, {"h": {"en": "The gap the measurement leaves", "tr": "Ölçümün bıraktığı boşluk"}, "ps": [{"en": "The team also sees a hydrated mineral on all three moons and in the rings that it cannot name. Identifying it, Davis says, will require fresh laboratory measurements under outer solar system conditions — technically difficult but doable. This is a good example of an observation able to describe its own gap: the question to ask is clear, and so is where the answer would come from.", "refs": ["neptun-uydulari"], "tr": "Ekip, üç uydunun ve halkaların hepsinde sulu bir mineral daha görüyor ve bu mineralin ne olduğunu söyleyemiyor. Davis'e göre onu tanımlamak, dış Güneş Sistemi koşullarında yapılacak yeni laboratuvar ölçümleri isteyecek; teknik olarak zor ama yapılabilir bir iş. Bu, bir gözlemin kendi eksiğini tarif edebilmesinin iyi bir örneği: hangi sorunun sorulacağı belli, cevabın nereden geleceği de."}, {"en": "What remains is the scale of the thing. Neptune has been approached once in human history, by Voyager 2 in 1989, and everything we hold today is the product of that single pass and of telescopes looking from a distance. Davis says a spacecraft dedicated to an ice giant is the obvious next step, that such missions ranked high on the most recent planetary science priority list, and that they take decades to develop. The clay has shown us the inside of another world. Reading it properly will mean going there, and that may not be the work of the generation that took the spectrum.", "refs": ["neptun-uydulari"], "tr": "Geriye ölçeğin kendisi kalıyor. Neptün'e insanlık tarihinde yalnızca bir kez, 1989'da Voyager 2'yle yaklaşıldı; bugün elimizdeki her şey, o tek geçişin ve uzaktan bakan teleskopların ürünü. Davis, buz devi bir gezegene adanmış bir aracın açık bir sonraki adım olduğunu, böyle görevlerin en son gezegen bilimi öncelik listesinde üst sırada sayıldığını, ama geliştirilmelerinin on yıllar aldığını söylüyor. Kil, bize başka bir dünyanın içini gösterdi. Onu gerçekten okumak için oraya gitmemiz gerekecek ve bu, tayfı alan kuşağın işi olmayabilir."}]}], "sources": [{"key": "neptun-uydulari", "kind": "news", "name": "Space.com", "url": "https://www.space.com/astronomy/neptune/3-moons-of-neptune-may-be-remnants-of-ice-worlds-shattered-in-a-catastrophic-crash", "title": {"tr": "Neptün'ün iç uydularında kil var, su buzu hiç yok", "en": "Clay on Neptune's inner moons, and no water ice at all"}, "publishedDate": "2026-08-03"}], "title": {"en": "Clay where there should have been ice", "tr": "Buz olması gereken yerde kil"}, "writer": "sci-01", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "England's family-history rule sends 1.4 per cent of women under 50 for risk assessment and reaches 4.4 per cent of the breast cancers that follow within ten years. Widening it works, and the cost of widening it is the whole argument.", "tr": "İngiltere'nin aile öyküsü kuralı, 50 yaş altı kadınların yüzde 1,4'ünü risk değerlendirmesine gönderiyor ve on yıl içinde ortaya çıkan meme kanserlerinin yüzde 4,4'üne ulaşıyor. Kuralı genişletmek işe yarıyor; asıl tartışma da bu genişlemenin bedeli."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "Two ratios", "tr": "İki oran"}, "ps": [{"en": "The analysis, from teams in Cambridge and London, sets two numbers side by side. The NICE family-history criteria used in primary care refer 1.4 per cent of women under 50 for further assessment, and that group contains 4.4 per cent of the women who will develop breast cancer within ten years. The full BOADICEA model, which adds reproductive history, lifestyle factors and a polygenic risk score to family history, refers 26.5 per cent and contains 34.8 per cent. The analysis rests on 1,258 women recruited to the Generations Study between 2004 and 2011, 392 of whom developed breast cancer, weighted to the national population by age and family history.", "refs": ["meme-kanseri-riski"], "tr": "Cambridge ve Londra'daki ekiplerin çözümlemesi iki sayıyı yan yana koyuyor. Birinci basamakta kullanılan NICE aile öyküsü ölçütleri, 50 yaş altı kadınların yüzde 1,4'ünü ileri değerlendirmeye yönlendiriyor ve bu grup, on yıl içinde meme kanseri gelişecek kadınların yüzde 4,4'ünü kapsıyor. Aile öyküsünün yanına üreme geçmişini, yaşam biçimi etkenlerini ve poligenik risk puanını ekleyen tam BOADICEA modeli ise yüzde 26,5'ini yönlendiriyor ve yüzde 34,8'ini kapsıyor. Çözümleme, 2004–2011 arasında Generations Study'ye alınmış, 392'sinde meme kanseri gelişen 1.258 kadına dayanıyor ve örnek, yaş ile aile öyküsü bakımından ülke nüfusuna göre ağırlıklandırıldı."}, {"en": "Where that gap comes from is shown too. Of the women under 50 that the model places above population-level risk, 73 per cent have no family history of breast cancer. Restricting assessment to women who do have a family history cuts the share of cancers BOADICEA captures from 34.8 per cent to 15.7 per cent, roughly by half. Removing the polygenic score also lowers sensitivity substantially when all women are assessed. The gain, in other words, does not come from the model reading family history better. It comes from the model looking outside family history.", "refs": ["meme-kanseri-riski"], "tr": "Farkın nereden geldiği de gösteriliyor. Modelin yüksek riskli saydığı 50 yaş altı kadınların yüzde 73'ünde meme kanseri aile öyküsü yok. Değerlendirmeyi yalnızca aile öyküsü olanlarla sınırlamak, BOADICEA'nın yakaladığı kanser oranını yüzde 34,8'den yüzde 15,7'ye, yani neredeyse yarıya düşürüyor. Poligenik puanı çıkarmak da tüm kadınlar değerlendirildiğinde duyarlılığı belirgin biçimde azaltıyor. Yani aradaki kazanç, modelin daha iyi bir aile öyküsü okuması olmasından değil, aile öyküsünün dışına çıkmasından geliyor."}]}, {"h": {"en": "Who is left out", "tr": "Kimin dışarıda kaldığı"}, "ps": [{"en": "Which women these results apply to matters as much as the results. Only White women were included in the analysis, and the authors say separate work is needed for other races and ethnicities, pointing to a recent ethnicity-adapted version of BOADICEA for that purpose. Mammographic density and rare pathogenic variants were not in the dataset, and the comparison used a single risk model. In the 1.5 per cent slice with a strong family history the numbers are small, so the finding about removing the polygenic score in that group has to be read with caution.", "refs": ["meme-kanseri-riski"], "tr": "Bu sonuçların hangi kadınlar için geçerli olduğu, sonuçların kendisi kadar önemli. Çözümlemeye yalnızca beyaz kadınlar alındı; yazarlar da başka etnik kökenler için ayrı çalışmalar gerektiğini, BOADICEA'nın etnik kökene uyarlanmış yeni bir sürümünün bu iş için kullanılabileceğini söylüyor. Meme yoğunluğu ve ender patojenik varyant verisi kümede yoktu ve karşılaştırma tek bir risk modeliyle yapıldı. Güçlü aile öyküsü olan yüzde 1,5'lik kesitte sayılar küçük kaldığı için, bu grupta poligenik puanın çıkarılmasına ilişkin sonuç temkinle okunmalı."}, {"en": "There is one more assumption, and the authors note it plainly: everyone eligible for assessment was assumed to accept it. In the only published UK study offering breast cancer risk assessment in primary care, uptake reached 16.1 per cent. Lower uptake, the authors say, does not change how many women must be assessed to find one, but it lowers the sensitivity of every strategy proportionately, so BOADICEA's relative advantage holds while the absolute gain shrinks. The 34.8 per cent on paper means a fraction of that in practice.", "refs": ["meme-kanseri-riski"], "tr": "Bir varsayım daha var ve yazarlar bunu da açıkça yazıyor: değerlendirmeye hakkı olan herkesin değerlendirmeyi kabul ettiği varsayıldı. Birinci basamakta meme kanseri risk değerlendirmesi sunan, yayımlanmış tek Britanya çalışmasında katılım yüzde 16,1'de kalmıştı. Yazarlara göre düşük katılım, bir kadını bulmak için kaç kişinin değerlendirilmesi gerektiğini değiştirmiyor ama tüm yolların duyarlılığını orantılı biçimde düşürüyor; yani BOADICEA'nın göreli üstünlüğü sürer, mutlak kazanç küçülür. Kâğıt üzerindeki yüzde 34,8, sahada bunun bir kesri demektir."}]}, {"h": {"en": "The capacity question", "tr": "Kapasite sorusu"}, "ps": [{"en": "The cost of widening can be put in numbers. On the full BOADICEA route, 26.5 per cent of women under 50 would be referred to secondary care or to genetics services. The authors note that this means a serious load on both general-practice workflows and genetics service capacity. Because comprehensive risk assessment requires verified family history and genetic data, the time it takes per woman is not short either. What the current rule prefers is a small referral burden, at the price of missing most of the cancers.", "refs": ["meme-kanseri-riski"], "tr": "Genişletmenin bedeli sayıya dökülebiliyor. Tam BOADICEA yolunda 50 yaş altı kadınların yüzde 26,5'i ikinci basamağa ya da genetik birimlerine yönlendirilecek. Yazarlar bunun hem aile hekimliği iş akışları hem de genetik hizmet kapasitesi için ciddi bir yük anlamına geldiğini belirtiyor. Kapsamlı bir risk değerlendirmesi, aile öyküsünün doğrulanmasını ve genetik veriyi gerektirdiği için, kadın başına ayrılan süre de kısa değil. Şu anki kuralın tercih ettiği şey, kanserlerin çoğunu kaçırma pahasına küçük bir yönlendirme yükü."}, {"en": "The useful statement to take from this work is a measurement rather than a recommendation: family history is a weak filter for finding risk under 50, and the size of that weakness is now known in numbers. Where the next piece of information comes from is clear as well. An implementation study in primary care, measuring real uptake and what protection referred women can actually reach afterwards, would show how much of these percentages arrives at the patient. Until that measurement exists, 34.8 per cent is the opening of a capacity argument, not its conclusion.", "refs": ["meme-kanseri-riski"], "tr": "Bu çalışmadan çıkarılabilecek yararlı ifade, bir öneri değil bir ölçüm: aile öyküsü, 50 yaş altında riski bulmak için zayıf bir eleme aracı ve zayıflığının büyüklüğü artık sayıyla biliniyor. Bir sonraki bilgi de nereden geleceği belli. Birinci basamakta yürütülecek, gerçek katılım oranını ve yönlendirilen kadınların sonrasında hangi korumaya erişebildiğini ölçen bir uygulama çalışması, buradaki yüzdelerin ne kadarının hastaya ulaştığını gösterecek. O ölçüm gelmeden, yüzde 34,8 bir kapasite tartışmasının başlangıcıdır, sonucu değil."}]}], "sources": [{"key": "meme-kanseri-riski", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-nice-referral-criteria-women-breast.html", "title": {"tr": "Aile öyküsüne dayalı yönlendirme, sonraki meme kanserlerinin yüzde 4,4'ünü buluyor", "en": "Family-history referral reaches 4.4 per cent of the breast cancers that follow"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "British Journal of Cancer", "url": "https://www.nature.com/articles/s41416-026-03547-2", "publishedDate": "2026-08-04", "title": {"tr": "50 yaş altı kadınlarda birinci basamakta meme kanseri risk değerlendirmesi ve yönlendirmesi için NICE ölçütleri ile BOADICEA çok etkenli risk modelinin karşılaştırılması", "en": "Comparison of NICE criteria with the BOADICEA multifactorial risk model to guide breast cancer risk assessment and referral amongst women under age 50 within primary care"}}}], "title": {"en": "Referral finds one woman in seventy, and most cancers sit outside that group", "tr": "Yönlendirme yetmiş kadından birini buluyor, kanserlerin çoğu o kümenin dışında"}, "writer": "sci-02", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Southern England had 1.5 millimetres of rain in July, two per cent of normal. What a crusted soil does with the rain when it returns is the next number that matters.", "tr": "Güney İngiltere'ye temmuzda 1,5 milimetre yağmur düştü; normalin yüzde ikisi. Bundan sonra önemli olan sayı ise açığın kendisi değil, kabuk bağlamış toprağın geri gelen yağmurla ne yapacağı."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "What was measured", "tr": "Ölçülen"}, "ps": [{"en": "England and Wales have come through their driest July in 190 years. Southern England averaged 1.5 millimetres of rain across the month, 2 per cent of the 1991–2020 average, while mean temperatures ran 3.2°C above normal for the time of year. According to provisional Met Office figures, at least 20 stations measured no rainfall at all through July, a first in their measurement history.", "refs": ["kuraklik-temmuz"], "tr": "İngiltere ve Galler, 190 yılın en kurak temmuzunu geride bıraktı. Güney İngiltere'de ay boyunca ortalama 1,5 milimetre yağış düştü; bu, 1991–2020 ortalamasının yüzde 2'si. Ortalama sıcaklıklar aynı dönemde mevsim normalinin 3,2 derece üzerindeydi. Met Office'in geçici verilerine göre en az 20 istasyonda temmuz boyunca hiç yağış ölçülmedi ve bu, o istasyonların ölçüm tarihinde ilk."}, {"en": "Looking at individual stations is necessary to read that statement correctly. The station at Kew Gardens has been measuring since 1871, Heathrow since 1948, and local measurement around Reading since 1858; the 42-day dry run at Heathrow is a first for that site. Series of different lengths put different weight on the same sentence: a first since 1858 is not the same claim as a first since 1948, even when both are worth noting.", "refs": ["kuraklik-temmuz"], "tr": "Tek tek istasyonlara bakmak, bu ifadeyi doğru okumak için gerekli. Kew Gardens'daki istasyon 1871'den, Heathrow 1948'den, Reading çevresindeki yerel ölçümler 1858'den bu yana sürüyor; Heathrow'daki 42 günlük yağışsız dizi de o istasyon için bir ilk. Farklı uzunluktaki ölçüm dizileri, aynı cümleye farklı ağırlıklar yükler: 1858'den beri ilk olmak ile 1948'den beri ilk olmak aynı iddia değildir, ikisi de dikkate değer olsa bile."}, {"en": "The drought has now spread beyond the farming basin. More than half of England and all of Wales are officially in drought. Across the continent water is thinning out as a production input too: low levels on the Danube have forced nuclear reactors offline in Hungary and Romania, and low water on the Rhine has curtailed shipping. The first bill for a rainfall deficit is paid by farmers, the second by electricity generators, and the third by everyone who moves cargo on a river.", "refs": ["kuraklik-temmuz"], "tr": "Kuraklık artık tarım havzasının dışına taşmış durumda. İngiltere'nin yarısından fazlası ile Galler'in tamamı resmen kurak ilan edildi. Kıtada da su bir üretim girdisi olarak eksiliyor: Tuna'daki düşük seviye Macaristan ve Romanya'da nükleer reaktörlerin durdurulmasına yol açtı, Ren'deki düşük su ise gemi taşımacılığını kısıtladı. Yağış açığının ilk faturasını çiftçi öder, ikincisini elektrik üreticisi, üçüncüsünü de yükünü nehirden taşıyan herkes."}]}, {"h": {"en": "When the rain returns", "tr": "Yağmur döndüğünde"}, "ps": [{"en": "Jeff Da Costa at the University of Reading warns that the risk of severe flash flooding is now substantial, because soils are crusted and reservoirs stressed. The mechanism is simple and unforgiving: a surface baked dry for long enough loses its rate of taking water in, so the same rain sits on top of the soil instead of entering it. The rainfall that ends the drought can do damage faster than the drought did. Nor, Da Costa says, should a day or two of rain be expected to solve it.", "refs": ["kuraklik-temmuz"], "tr": "Reading Üniversitesi'nden Jeff Da Costa, toprakların kabuk bağladığını ve barajların zorlandığını söyleyerek şiddetli ani sel riskinin artık çok ciddi olduğu uyarısını yapıyor. Mekanizma basit ve acımasız: uzun süre kurumuş bir yüzey suyu içine alma hızını yitirir, aynı yağmur toprağa değil yüzeye biner. Kuraklığın sonunu getirecek olan yağış, kuraklığın kendisinden daha hızlı zarar verebilir. Da Costa'ya göre bir iki günlük yağmurun sorunu çözmesi de beklenmemeli."}, {"en": "Who holds which lever becomes clear here. Reservoir operators and water companies manage storage, while drainage infrastructure was sized for a different distribution of rainfall and cannot be changed quickly. The farmers warning of crop shortages and the people living where flash floods pass stand at two ends of the same event. Drought looks like a shortage. Water's distribution through time is the central problem, and infrastructure was built for the old spread.", "refs": ["kuraklik-temmuz"], "tr": "Kolun ucunda kim var sorusu burada netleşiyor. Baraj işletmecileri ve su şirketleri depolamayı yönetiyor; drenaj altyapısı ise başka bir yağış dağılımına göre boyutlandırılmış durumda ve kısa sürede değiştirilemez. Ekin kıtlığı uyarısı yapan çiftçiler ile ani selin geçtiği yerlerde yaşayanlar aynı olayın iki ayrı ucunda duruyor. Kuraklık bir eksiklik gibi görünür, oysa asıl sorun suyun toplam miktarı değil zaman içindeki dağılımıdır ve altyapı o dağılıma göre kurulmuştur."}, {"en": "Two things are worth watching. The first is whether the count of stations measuring zero stays at 20 once the Met Office firms up its provisional figures. The second, and the more important, is how river flows behave after the first substantial rain: if the same amount of rainfall produces a far sharper rise in flow than in past years, the reduced capacity of the soil to take water in stops being an assumption and becomes a measured climate quantity.", "refs": ["kuraklik-temmuz"], "tr": "İzlenecek iki şey var. Birincisi, Met Office'in geçici sayıları kesinleştirdiğinde sıfır yağış ölçen istasyon sayısının 20'de kalıp kalmayacağı. İkincisi ve daha önemlisi, ilk belirgin yağmurun ardından akarsu debilerinin nasıl davranacağı: eğer aynı miktar yağış geçmiş yıllara göre çok daha keskin bir debi artışı üretiyorsa, toprağın su alma kapasitesindeki kayıp bir varsayım olmaktan çıkıp ölçülmüş bir iklim büyüklüğü hâline gelir."}]}], "sources": [{"key": "kuraklik-temmuz", "kind": "news", "name": "New Scientist", "url": "https://www.newscientist.com/article/2583057-parts-of-the-uk-endure-first-ever-month-without-any-rain", "title": {"tr": "Yirmi Britanya istasyonunda temmuz boyunca hiç yağmur ölçülmedi", "en": "Twenty UK weather stations measured no rain at all through July"}, "publishedDate": "2026-08-04"}], "title": {"en": "At Kew the July gauge stayed empty for the first time since 1871", "tr": "Kew'de yağmur ölçer temmuz boyunca boş kaldı, 1871'den bu yana ilk kez"}, "writer": "sci-03", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "grafify online wraps three well-known R packages in a browser interface. What makes it worth reading is the boundary its author draws around it, more than the work it performs.", "tr": "grafify online, iyi bilinen üç R paketini tarayıcıdaki bir arayüzle sarmalıyor. Okumaya değer kılan da yaptığı işten çok, yazarın çevresine çizdiği sınır."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "What was built", "tr": "Ne inşa edildi"}, "ps": [{"en": "grafify online, written by Avinash R. Shenoy at Imperial College London, is an interface built in R on the Shiny framework. Three familiar packages sit underneath it: ggplot2 for graphics, lme4 for mixed-effects models, and emmeans for post-hoc comparisons with false-discovery-rate correction. It draws box, violin, bar, point-and-error, before-after, histogram, density and numeric XY plots, and fits linear models, mixed-effects models, t-tests and analyses of variance. It invents no new method. It puts existing methods within reach of someone who does not write the code that calls them.", "refs": ["grafify"], "tr": "Imperial College London'dan Avinash R. Shenoy'un yazdığı grafify online, R diliyle ve Shiny çatısıyla kurulmuş bir arayüz. Altında üç tanıdık paket var: grafikler için ggplot2, karma etkili modeller için lme4, ardıl karşılaştırmalar için de yanlış keşif oranı düzeltmesi uygulayan emmeans. Uygulama kutu, keman, çubuk, nokta-hata, önce-sonra, sıklık, yoğunluk ve sayısal XY grafikleri çiziyor; doğrusal modeller, karma etkili modeller, t sınamaları ve varyans çözümlemesi kurabiliyor. Yeni bir yöntem üretmiyor; var olan yöntemleri, onları çağıran kodu yazmayan birinin erişimine açıyor."}, {"en": "How it is distributed is more interesting than the tool itself. There is a hosted web app; the code sits on GitHub and is archived on Zenodo; and a standalone Windows program is offered. The notable option is the third one: a serverless browser build compiled to WebAssembly through Shinylive. In that build the computation runs on the user's own machine and the data goes to no server at all. For anyone working with unpublished clinical or field data, that is not a convenience. It decides whether the tool can be used.", "refs": ["grafify"], "tr": "Dağıtım biçimi, aracın kendisinden daha ilginç. Barındırılan bir web uygulaması var; kod GitHub'da duruyor ve Zenodo'da arşivlendi; ayrıca bağımsız bir Windows programı sunuluyor. Asıl dikkat çekici olan dördüncü değil üçüncü seçenek: Shinylive ile WebAssembly'ye derlenmiş, sunucusuz bir tarayıcı sürümü. Bu sürümde hesaplama kullanıcının makinesinde çalışır, veri hiçbir sunucuya gitmez. Yayımlanmamış hasta ya da alan verisiyle çalışan biri için bu, bir kolaylık değil, aracın kullanılabilir olup olmamasını belirleyen koşuldur."}]}, {"h": {"en": "The ceiling", "tr": "Sınır"}, "ps": [{"en": "Shenoy writes plainly in the paper where the tool stops: up to two fixed and two random factors, and random-intercept models only. Anyone with a more complex design has to go back to the underlying R package. A tool stating its own ceiling this clearly is a design decision rather than a technical footnote: the option that is absent from the menu also keeps a user from fitting the wrong model.", "refs": ["grafify"], "tr": "Shenoy, aracın nerede durduğunu makalede açıkça yazıyor: en çok iki sabit ve iki rastgele etken, yalnızca rastgele kesişimli modeller. Daha karmaşık bir tasarımı olan, altta yatan R paketine dönmek zorunda. Bir aracın kendi tavanını bu netlikte söylemesi, teknik bir ayrıntı değil tasarım kararıdır: menüde bulunmayan seçenek, kullanıcıyı yanlış modeli kurmaktan da alıkoyar."}, {"en": "What it removes and what it does not are separate, though. A mixed-effects model appearing in a menu does not say that the model fits the data; deciding which factor is fixed and which is random is still the user's job, and the interface does not ask that question, it only carries out the answer. Removing the barrier of writing code does not remove the obligation to understand the design. The tool's honesty lies in not confusing the two.", "refs": ["grafify"], "tr": "Bununla birlikte, kaldırdığı iş ile kaldırmadığı iş ayrı. Bir menüde karma etkili modelin bulunması, o modelin veriye uygun olduğunu söylemez; hangi etkenin sabit hangisinin rastgele olduğuna karar vermek hâlâ kullanıcının işi ve arayüz bu kararı sormaz, yalnızca uygular. Kod yazma engelini kaldırmak, tasarımı anlama yükümlülüğünü kaldırmıyor. Aracın dürüstlüğü, bu iki şeyi karıştırmamasında."}]}, {"h": {"en": "Who can rebuild it", "tr": "Kim yeniden kurabilir"}, "ps": [{"en": "Open source code and a Zenodo archive together mean an analysis can be rebuilt years later. When the version running underneath can be known, the question of how a figure was produced has a durable answer. The same cannot be said of a hosted service that updates quietly and cannot hand back its old behaviour. The archive secures not the tool but the results made with it.", "refs": ["grafify"], "tr": "Açık kaynak kodu ve Zenodo arşivi birlikte, bir çözümlemenin yıllar sonra da yeniden kurulabilmesi anlamına geliyor. Altta çalışan sürüm bilinebilir olduğunda, bir grafiğin nasıl üretildiği sorusunun cevabı kalıcıdır. Sessizce güncellenen ve eski davranışını geri veremeyen barındırılan bir hizmet için aynı şey söylenemez. Arşiv, aracın kendisine değil, onunla üretilmiş sonuçlara güvenceyi sağlıyor."}, {"en": "The signal to watch follows from that. Whether published methods sections cite grafify online with an archived version number or only by name is a separate question from whether the tool works. If the number is there, the open code and the archive have turned into a real guarantee. If only the name is there, one more box that runs in a browser has been added, and what turns inside it remains unknown.", "refs": ["grafify"], "tr": "İzlenecek işaret de buradan çıkıyor. Yayımlanan makalelerin yöntem bölümlerinde grafify online'ın arşivlenmiş bir sürüm numarasıyla mı yoksa yalnızca adıyla mı anılacağı, aracın işe yarayıp yaramadığından ayrı bir soru. Numarayla anılıyorsa, açık kod ve arşiv gerçekten bir güvenceye dönüşmüş olur; yalnızca adla anılıyorsa, tarayıcıda çalışan bir kutu daha eklenmiş olur ve içinde ne döndüğü yine bilinmez."}]}], "sources": [{"key": "grafify", "kind": "news", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003909", "title": {"tr": "Kod yazmayan araştırmacılar için açık kaynaklı bir istatistik uygulaması", "en": "An open statistics app for researchers who do not write code"}, "publishedDate": "2026-08-03"}], "title": {"en": "Two fixed factors, two random: a tool that states its own ceiling", "tr": "İki sabit, iki rastgele etken: tavanını kendi söyleyen bir araç"}, "writer": "sci-04", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "A number reported as a three per cent hit to solar generation carries a standard deviation larger than itself. That does not make it wrong. It changes what can be said with it.", "tr": "Güneş üretiminde yüzde üçlük bir darbe olarak aktarılan sayı, kendisinden büyük bir standart sapma taşıyor. Bu, sayıyı yanlış yapmıyor; onunla ne söylenebileceğini değiştiriyor."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The number reported and the number in the paper", "tr": "Aktarılan sayı ve makaledeki sayı"}, "ps": [{"en": "As reported, smoke from Canada's 2023 fires cut solar generation across North America and Europe by 3 per cent at a cost approaching two billion dollars, with North America losing 711 million dollars and Europe about 1.17 billion dollars. The paper's own abstract gives the same quantities like this: a modelled May–September production deficit of 6.38 terawatt hours with one standard deviation of 8.86 terawatt hours, equal to 2.8 per cent of five-month generation; an economic deficit of 1.88 billion dollars with one standard deviation of 2.71 billion dollars; a carbon burden of 2.083 megatons of carbon dioxide with one standard deviation of 2.656 megatons.", "refs": ["duman-gunes"], "tr": "Habere göre 2023 Kanada yangınlarının dumanı, Kuzey Amerika ve Avrupa'da güneş elektriği üretimini yüzde 3 düşürdü ve bunun bedeli iki milyar dolara yaklaştı; Kuzey Amerika 711 milyon dolar, Avrupa ise yaklaşık 1,17 milyar dolar yitirdi. Makalenin kendi özetinde ise aynı büyüklükler şöyle veriliyor: mayıs–eylül arası modellenen üretim açığı 6,38 teravatsaat, tek standart sapma 8,86 teravatsaat; beş aylık üretimin yüzde 2,8'i; parasal açık 1,88 milyar dolar, tek standart sapma 2,71 milyar dolar; karbon yükü 2,083 megaton karbondioksit, tek standart sapma 2,656 megaton."}, {"en": "When an estimate's standard deviation exceeds its central value, the plausible range of that distribution includes zero and also includes a loss twice the headline. This does not mean the study is flawed; the point estimate is still the best single number available, and the authors put the uncertainty in the opening lines of the abstract rather than hiding it. What it means is that a sentence reporting that it cost two billion dollars claims more precision than the ± sign can carry. The accurate sentence gives the order of magnitude of the loss, not its decimal place.", "refs": ["duman-gunes"], "tr": "Bir tahminin standart sapması merkezî değerinden büyükse, o dağılımın makul aralığı sıfırı da içerir, manşetin iki katı bir kaybı da. Bu, çalışmanın kusurlu olduğu anlamına gelmez; nokta tahmin hâlâ eldeki en iyi tek sayıdır ve yazarlar belirsizliği gizlemek yerine özetin ilk cümlelerine koymuştur. Anlamı şudur: iki milyar dolara mal olduğunu bildiren bir cümle, ± işaretinin taşıyabileceğinden daha fazla kesinlik iddia eder. Doğru cümle, kaybın büyüklük derecesini verir, ondalığını değil."}]}, {"h": {"en": "Where the spread comes from", "tr": "Yayılım nereden geliyor"}, "ps": [{"en": "The estimate does not come from comparing metered generation with a smoke-free counterfactual. It comes from the output of an Earth system model. The chain is long: aerosol emissions, then radiative and temperature anomalies, then photovoltaic output, then electricity price, then dollars. Each link adds its own uncertainty, and the last is the most fragile, because price is a variable of the market rather than of the model. The authors' calculation also allows for the smoke's cooling effect raising panel efficiency and so offsetting part of the loss, which makes the result the difference between two opposing effects, and differences carry more uncertainty than their components.", "refs": ["duman-gunes"], "tr": "Tahmin, sayaçtan okunan üretim ile dumansız bir karşı olgunun karşılaştırılmasından değil, bir yer sistemi modelinin çıktısından geliyor. Zincir uzun: aerosol salımı, ışınım ve sıcaklık sapması, fotovoltaik üretim, elektrik fiyatı, dolar. Her halka kendi belirsizliğini ekler ve sonuncusu en kırılganıdır, çünkü fiyat modelin değil piyasanın değişkenidir. Yazarların hesabı, dumanın soğutma etkisinin panel verimini artırarak kaybı kısmen dengelemesini de içeriyor; yani sonuç iki karşıt etkinin farkı, ve farkların belirsizliği bileşenlerinkinden büyük olur."}, {"en": "The spread may arise in two ways, and they lead to very different conclusions. If it comes largely from the model's internal variability, a larger ensemble narrows the band and a sharper number is reached in time. If it is structural — dependent on how the optical properties of the aerosol, the cloud interactions or the panel-efficiency relation are set up — then more runs will not narrow anything; they will only draw the same uncertainty as a smoother curve. The single standard deviation given in the abstract does not separate those two cases.", "refs": ["duman-gunes"], "tr": "Yayılımın kaynağı iki türlü olabilir ve ikisi çok farklı sonuçlar doğurur. Eğer yayılım büyük ölçüde modelin iç değişkenliğinden geliyorsa, daha kalabalık bir topluluk koşusu bandı daraltır ve zamanla daha keskin bir sayıya varılır. Eğer yayılım yapısalsa (aerosol optik özelliklerinin, bulut etkileşimlerinin ya da panel verim ilişkisinin nasıl kurulduğuna bağlıysa) daha çok koşu bandı daraltmaz, yalnızca aynı belirsizliği daha düzgün bir eğriyle gösterir. Özetin verdiği tek standart sapma, bu iki durumu birbirinden ayırmıyor."}]}, {"h": {"en": "What would settle it", "tr": "Ne, neyi çözerdi"}, "ps": [{"en": "The test that would genuinely narrow the band lies outside the model. Comparing metered photovoltaic output in the affected grids against a smoke-free counterfactual built from observed irradiance yields a second estimate that does not depend on the same model. If that estimate lands near the 6.38 terawatt hour point value, the wide band amounts to cautious reporting rather than a weakness. If it lands clearly away from it, the question of which link in the chain is responsible becomes something one can go and look for.", "refs": ["duman-gunes"], "tr": "Bandı gerçekten daraltacak sınama modelin dışındadır. Etkilenen şebekelerdeki sayaçla ölçülmüş fotovoltaik üretimi, gözlenmiş ışınım verisinden kurulmuş dumansız bir karşı olguyla karşılaştırmak, aynı modele bağlı olmayan ikinci bir tahmin verir. Bu tahmin 6,38 teravatsaatlik nokta değerin yakınına düşerse, aradaki geniş bant bir zayıflık değil yalnızca temkinli bir raporlama olur. Belirgin biçimde uzağa düşerse, sorun modelin hangi halkasında olduğu aranabilir hâle gelir."}, {"en": "A second case is on its way as well. Canadian smoke has reached Europe again this year, and the study's lead author, Roșu, says it is too early to compare with 2023 while the season is still running. That is a correct caution and also a valuable opportunity: applying the same method to an independent year, and finding the loss fraction consistent across the two events, would raise confidence. What should be waited for is the same magnitude arrived at twice by different routes, rather than a bigger number.", "refs": ["duman-gunes"], "tr": "İkinci bir olay da yolda. Bu yıl Kanada dumanı yeniden Avrupa'ya ulaştı ve çalışmanın ilk yazarı Roșu, mevsim sürerken 2023'le karşılaştırma yapmanın erken olduğunu söylüyor. Bu doğru bir çekince ve aynı zamanda değerli bir fırsat: aynı yöntem bağımsız bir yıla uygulandığında, yöntemin verdiği kayıp oranı iki olayda tutarlı çıkarsa güven artar. Beklenmesi gereken, daha büyük bir sayı değil, aynı büyüklüğe iki ayrı yoldan varılması."}]}], "sources": [{"key": "duman-gunes", "kind": "news", "name": "New Scientist", "url": "https://www.newscientist.com/article/2582931-canadian-wildfires-are-reducing-solar-power-generation-in-europe", "title": {"tr": "Kanada'daki 2023 yangınlarının dumanı iki kıtada güneş üretimini düşürdü", "en": "Smoke from Canada's 2023 fires cut solar output on two continents"}, "publishedDate": "2026-08-04", "primary": {"kind": "paper", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03860-x", "publishedDate": "2026-07-28", "title": {"tr": "Kanada'nın 2023 yangın dumanı güneş elektriği üretiminde yüzde 2,8'lik düşüşe yol açtı ve iki milyar dolara mal oldu", "en": "Canada's 2023 wildfire smoke caused a 2.8 percent drop in solar power generation, costing two billion dollars"}}}], "title": {"en": "The loss is 6.38 terawatt hours and the spread is 8.86", "tr": "Kayıp 6,38 teravatsaat, yayılım 8,86"}, "writer": "sci-05", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "The obstacle between us and the first spectrum of another living world may not be the star's glare or the planet's faintness. It may be an ordinary cloud of dust, orbiting alongside the planet we want to read.", "tr": "Bizimle bir başka canlı dünyanın ilk tayfı arasındaki engel, yıldızın parıltısı ya da gezegenin sönüklüğü olmayabilir. Okumak istediğimiz gezegenle aynı yörüngede dönen sıradan bir toz bulutu da olabilir."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The name of the obstacle", "tr": "Engelin adı"}, "ps": [{"en": "Inside our own solar system a thin veil of dust hangs between the planets; the zodiacal light visible in the sky before dawn is sunlight reflected off it. The same thing exists around other stars, and nearby Sun-like systems are thought to carry at least three times as much habitable-zone dust as ours. The work by Miles H. Currie and colleagues, posted to arXiv on 15 July and accepted for publication in The Astronomical Journal, asks what that dust will do by simulating Earth-like planetary systems and applying an atmospheric retrieval tool to synthetic spectra of the kind a future Habitable Worlds Observatory would take.", "refs": ["eksozodyak"], "tr": "Kendi Güneş Sistemimizin içinde, gezegenlerin arasında ince bir toz perdesi asılı durur; gökyüzünde şafaktan önce görünen zodyak ışığı, bu tozdan yansıyan güneş ışığıdır. Başka yıldızların çevresinde de aynısı var ve Güneş benzeri yakın sistemlerin, yaşanabilir bölgesinde bizimkinin en az üç katı toz taşıdığı düşünülüyor. Miles H. Currie ve arkadaşlarının 15 Temmuz'da arXiv'e yükledikleri ve The Astronomical Journal'da yayımlanmak üzere kabul edilen çalışma, bu tozun ne yapacağını sormak için Dünya benzeri gezegen sistemlerini benzetiyor ve gelecekteki Habitable Worlds Observatory'nin alacağı yapay tayflara bir atmosfer geri çatma aracı uyguluyor."}, {"en": "The result is this: light scattered by micron-sized dust adds a smooth, cloud-like continuum to the extracted spectrum and reduces the apparent depth of molecular absorption features. Even an amount of dust like our own solar system's can shallow visible-wavelength absorption features by up to 50 per cent, and the effect worsens at longer wavelengths. What is at stake here is reading the planet rather than detecting it. The dot remains where it was; the writing on it does not survive.", "refs": ["eksozodyak"], "tr": "Sonuç şu: mikron boyutlu tozun saçtığı ışık, çıkarılan tayfa buluta benzer düzgün bir süreklilik ekliyor ve moleküler soğurma çizgilerinin görünen derinliğini azaltıyor. Güneş Sistemi'ndeki kadar bir toz miktarı bile, görünür bölgedeki soğurma çizgilerini yüzde 50'ye varan oranda sığlaştırabiliyor; etki uzun dalga boylarında daha da belirginleşiyor. Burada tehlikeye giren şey gezegeni bulmak değil, onu okumak. Nokta yerinde duruyor; okunamayan, üstündeki yazı."}]}, {"h": {"en": "The operation beneath the sentence", "tr": "Cümlenin altındaki işlem"}, "ps": [{"en": "The sentence reporting that oxygen was found in the atmosphere of another world, on the day it is finally said, will rest on a subtraction most people will never see. The dust has to be cleaned out of the spectrum, and the work reports that if abundance is to be measured, the fraction of dust allowed to remain tightens as dust density rises. This amounts to a requirement rather than a discovery: a line in the budget that the instrument and the processing have to meet.", "refs": ["eksozodyak"], "tr": "Başka bir dünyanın atmosferinde oksijen bulunduğunu bildiren cümle, günün birinde kurulduğunda, çoğu insanın hiç görmeyeceği bir çıkarma işleminin üstünde duracak. Tozun tayftan temizlenmesi gerekiyor ve çalışmanın bildirdiğine göre bolluk ölçmek isteniyorsa, geriye kalabilecek toz payı toz yoğunluğu arttıkça daralıyor. Bu, bir keşif değil bir gereklilik: aygıtın ve işlemenin karşılaması gereken bir bütçe kalemi."}, {"en": "The same work also opens a door, and the door concerns the size of the question we ask. Asking only whether a molecule is there, instead of measuring how much of it is there, relaxes the required dust subtraction by an order of magnitude, and more so at higher spectral resolution. The universe, in other words, answers a smaller question far more cheaply. This is a bargain science meets often: give up the quantity and take the presence.", "refs": ["eksozodyak"], "tr": "Ama aynı çalışma bir kapı da açıyor ve bu kapı, sorduğumuz sorunun boyutuyla ilgili. Bir molekülün ne kadar bulunduğunu ölçmek yerine yalnızca orada olup olmadığını sormak, gereken toz çıkarma duyarlılığını bir büyüklük derecesi gevşetiyor; tayfsal çözünürlük yüksekse daha da fazla. Yani evren, daha küçük bir soruya çok daha ucuza cevap veriyor. Bu, bilimin sık karşılaştığı bir pazarlıktır: kesinliği bırakıp varlığı almak."}]}, {"h": {"en": "The question we can afford", "tr": "Hangi soruyu sormaya gücümüz yeter"}, "ps": [{"en": "A binary answer is a smaller claim than a number, but a small claim honestly made is worth more than a number resting on unmodelled dust. This amounts to a choice of direction rather than a consolation. The generation that builds the Habitable Worlds Observatory will inherit not its own curiosity but the question the processing can carry — and being able to say that a molecule is present in the air of another planet resembles nothing humanity has been able to say so far.", "refs": ["eksozodyak"], "tr": "İkili bir cevap, bir sayıdan daha küçük bir iddiadır; ama dürüstçe kurulmuş küçük bir iddia, modellenmemiş bir tozun üstünde duran bir sayıdan daha değerlidir. Bu bir teselli değil, bir yön seçimi. Habitable Worlds Observatory'yi inşa edecek kuşak, kendi merakını değil, işlemenin taşıyabileceği soruyu miras alacak; ve bir gezegenin havasında bir molekülün bulunduğunu söyleyebilmek de, insanlığın bugüne dek söyleyebildiği hiçbir şeye benzemiyor."}, {"en": "How would we know this idea had moved from possibility to fact? There are two observable signals. The first is whether the telescope's design documents adopt the high spectral resolution and the dust-subtraction allowance this work implies. The second is nearer: whether the 50 per cent figure and the order-of-magnitude relaxation survive into the journal version. What question a generation gets to ask is often decided inside numbers this small.", "refs": ["eksozodyak"], "tr": "Bu fikrin bir olasılıktan gerçeğe geçtiğini nereden anlarız? İki gözlenebilir işaret var. Birincisi, teleskobun tasarım belgelerinin bu çalışmanın ima ettiği yüksek tayfsal çözünürlüğü ve toz çıkarma payını benimseyip benimsemediği. İkincisi daha yakın: çalışma dergi sürümüne geçtiğinde yüzde 50'lik değerin ve bir büyüklük derecelik gevşemenin aynı kalıp kalmayacağı. Bir kuşağın hangi soruyu sorabileceği, çoğu zaman böyle küçük sayıların içinde belirlenir."}]}], "sources": [{"key": "eksozodyak", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-zodiacal-exoplanetary-hinder-life-worlds.html", "title": {"tr": "Yaşanabilir bölgedeki toz, bir soğurma çizgisinin derinliğini yarıya indirebilir", "en": "Dust in the habitable zone can halve the depth of an absorption line"}, "publishedDate": "2026-08-03", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.14329", "publishedDate": "2026-07-15", "title": {"tr": "Ekzodyak tayf etkisi: yaşanabilir bölgede kalan toz, Dünya benzeri gezegenlerin nitelenmesini yanlı hâle getirebilir", "en": "The exozodi spectral effect: Residual habitable zone dust may bias exoEarth characterization"}}}], "title": {"en": "Before asking whether a world breathes, we have to subtract its dust", "tr": "Bir dünyanın soluk alıp almadığını sormadan önce tozunu çıkarmamız gerekiyor"}, "writer": "sci-06", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "The Dark Energy Spectroscopic Instrument was built to measure distant galaxies. The composition of these white dwarfs came out of the time left over from that survey; the real question is what the composition shows.", "tr": "Karanlık Enerji Tayfölçüm Aygıtı uzak gökadaları ölçmek için kuruldu. Bu beyaz cücelerin bileşimi, o taramanın arasında kalan zamandan çıktı; asıl soru bileşimin neyi gösterdiği."}, "sections": [{"h": {"en": "What was measured is a spectrum", "tr": "Ölçülen şey bir tayf"}, "ps": [{"en": "Work led by Paula Izquierdo of the University of Warwick identified 12 white dwarfs whose atmospheres are heavily enriched in heavy elements. The elements read off the spectra are oxygen, magnesium, silicon, calcium and iron. That is what was measured directly: absorption lines in a stellar atmosphere, and the abundances derived from the depth of those lines. The results appeared in the peer-reviewed journal Monthly Notices of the Royal Astronomical Society, and the preprint sits on arXiv as 2607.14251.", "refs": ["desi"], "tr": "Warwick Üniversitesi'nden Paula Izquierdo'nun yürüttüğü çalışma, atmosferi ağır elementlerce çok zenginleşmiş 12 beyaz cüce belirledi. Tayflarda okunan elementler oksijen, magnezyum, silisyum, kalsiyum ve demir. Doğrudan ölçülen şey budur: bir yıldız atmosferindeki soğurma çizgileri ve bu çizgilerin derinliğinden çıkarılan bolluklar. Sonuçlar hakemli Monthly Notices of the Royal Astronomical Society dergisinde yayımlandı, ön baskısı arXiv'de 2607.14251 numarasıyla duruyor."}, {"en": "The route from there to a shattered rocky planet is an inference, and it leans on a single expectation: heavy elements do not linger at the surface of a white dwarf, they settle downwards. Their visibility therefore implies that something fell in recently. The alternative that bounds the inference grows from the same soil. A single body swallowed in the recent past and a debris disc feeding the star slowly over a long stretch can leave similar absorption lines, and a composition resembling rocky material from the inner Solar System is compatible with either.", "refs": ["desi"], "tr": "Buradan parçalanmış bir kayaç gezegene giden yol ise bir çıkarımdır ve tek bir beklentiye yaslanır: beyaz cücelerin yüzeyinde ağır elementlerin uzun süre kalması beklenmez, aşağı çökerler. Görülüyorlarsa yakın geçmişte oraya bir şey düşmüş olmalıdır. Çıkarımı sınırlayan alternatif de aynı yerden doğuyor. Yakın geçmişte yutulmuş tek bir gök cismi ile uzun süredir yavaşça beslenen bir kalıntı diski, benzer soğurma çizgileri bırakabilir; bileşimin iç Güneş Sistemi'ndeki kayaç malzemeye benzemesi her iki durumla da uyumludur."}]}, {"h": {"en": "The sample was not built as a search", "tr": "Örneklem bir arama için kurulmadı"}, "ps": [{"en": "The data were gathered in the time that falls outside the instrument's primary task, so the sample was not assembled as a survey designed to hunt for planetary debris. This cuts both ways. On one side there is scale for nothing: a programme surveying distant galaxies also yields spectra of nearby stars as a by-product. On the other, the selection effect stops being controllable. What fraction these 12 objects represent does not follow from this data, because the criterion that decided which stars were observed had nothing to do with planetary debris. Izquierdo describes these super-enriched examples as having turned up among the objects surveyed, and that carries a different weight from the yield of a search.", "refs": ["desi"], "tr": "Veriler, aygıtın asıl görevi dışında kalan zaman diliminde toplandı; örneklem gezegen kalıntısı aramak için tasarlanmış bir tarama gibi kurulmuş değil. Bu iki yönlü bir durumdur. Bir yanda bedava ölçek var: uzak gökadaları tarayan bir program, yan ürün olarak yakın yıldızların tayfını da veriyor. Öte yanda seçim etkisi denetlenemez hâle geliyor. Bu 12 cismin hangi oranı temsil ettiği bu veriden çıkmaz, çünkü hangi yıldızların gözlendiğini belirleyen ölçüt gezegen kalıntısıyla ilgisizdi. Izquierdo, bu aşırı zenginleşmiş örneklerin taranan cisimler arasında bulunduğunu anlatıyor; bu ifade bir aramanın verimiyle aynı ağırlığı taşımıyor."}, {"en": "The most interesting subset is the objects for which evidence pointing to water-rich planetesimals is reported. Abundances read off a white dwarf's surface can mean that a body which once carried water orbited that star, and that is one of the few ways of looking into the inner region of a dead planetary system. How often it happens is a different question, and only a selection built for that purpose can answer it. What we hold for now is a list of compositions; measuring a rate awaits a separate study.", "refs": ["desi"], "tr": "En ilgi çekici alt küme, su bakımından zengin gezegenimsi kalıntılara işaret eden kanıtın bildirildiği cisimler. Bir beyaz cücenin yüzeyinde okunan bolluklar, o yıldızın çevresinde bir zamanlar su taşıyan bir cismin dolaştığı anlamına gelebiliyor; bu, ölmüş bir gezegen sisteminin iç bölgesine bakmanın sayılı yollarından biri. Ne kadar sık rastlandığı ise başka bir sorudur ve ancak bu iş için kurulmuş bir seçimle yanıtlanır. Elimizdeki şey şimdilik bir bileşim listesidir; sıklığın ölçülmesi ayrı bir çalışmayı bekliyor."}]}], "sources": [{"key": "desi", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-desi-side-reveals-spectra-disintegrated.html", "title": {"tr": "DESI gözlemlerinden metalce çok zengin 12 beyaz cüce ve parçalanmış kayaç gezegen kalıntıları çıktı", "en": "DESI observations yielded 12 heavily metal-enriched white dwarfs and the debris of shattered rocky planets"}, "publishedDate": "2026-08-02", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.14251", "publishedDate": "2026-07-15", "title": {"tr": "DESI DR1'den ilk gezegenimsiler: metalce çok zengin 12 beyaz cüce", "en": "First planetesimals from DESI DR1: 12 highly metal-rich white dwarfs"}}}], "title": {"en": "The rocks of the inner Solar System are sitting on 12 white dwarf surfaces", "tr": "İç Güneş Sistemi'nin kayaçları 12 beyaz cücenin yüzeyinde duruyor"}, "writer": "sci-01", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "An analysis of 23,417 participants found depression's brain correlates outside the usual addresses too. It does not mean we can look at one patient's scan and say something.", "tr": "23.417 katılımcılık bir çözümleme, depresyonun beyindeki bağıntılarını alışılmış adreslerin dışında da buldu. Bir hastanın taramasına bakıp bir şey söyleyebileceğimiz anlamına gelmiyor."}, "sections": [{"h": {"en": "The expected addresses", "tr": "Beklenen adresler"}, "ps": [{"en": "Work led by Janine D. Bijsterbosch of Washington University pooled the scans of 23,417 participants across six large population datasets and appeared in the peer-reviewed journal Nature Mental Health on 13 July. Grey-matter volume in the frontal cortex, anterior cingulate and insula falls as depression scores rise. Those three regions were expected; they fit the account of emotion regulation and decision-making that has been told for years.", "refs": ["scans"], "tr": "Washington Üniversitesi'nden Janine D. Bijsterbosch'un yürüttüğü çalışma, altı büyük nüfus veri kümesindeki 23.417 katılımcının görüntülerini birlikte çözümledi ve hakemli Nature Mental Health dergisinde 13 Temmuz'da yayımlandı. Alın korteksi, ön singulat ve insulada gri madde hacmi depresyon düzeyiyle birlikte azalıyor. Bu üç bölge zaten bekleniyordu; duygu düzenlemesi ve karar verme üzerine yıllardır anlatılan tabloya uyuyorlar."}, {"en": "Two results were not expected. No clear association appeared in subcortical structures such as the amygdala and hippocampus, though a large share of the depression literature looks precisely there. Smaller motor and visual regions, by contrast, went together with higher depression scores. Bijsterbosch calls this a surprise, and rightly: nobody was looking for the visual cortex as an address of mood disorder.", "refs": ["scans"], "tr": "Beklenmeyen iki sonuç var. Amigdala ve hipokampus gibi kortikal altı yapılarda belirgin bir bağıntı bulunamadı; oysa depresyon üzerine yazılmış literatürün büyük bölümü tam da oraya bakar. Buna karşılık motor ve görme bölgelerindeki küçülme daha yüksek depresyon düzeyleriyle birlikte gitti. Bijsterbosch bunu sürpriz olarak niteliyor ve haklı: kimse görme korteksini duygudurum bozukluğunun adresi olarak aramıyordu."}]}, {"h": {"en": "Who is in the sample and who is not", "tr": "Örneklemde kim var, kim yok"}, "ps": [{"en": "The authors offer their own account of this divergence, and the account lies in the sample itself: population datasets usually exclude patients with severe depression. So the gap between what was found subcortically and what was not may come from who was scanned; it need not come from the brain at all. Another possibility sits alongside it: the older amygdala findings, obtained in small clinical samples, may be too fragile to reproduce at this scale. The two explanations do not exclude each other, and telling them apart runs through large samples that also include severely ill patients.", "refs": ["scans"], "tr": "Yazarlar bu ayrışmanın bir açıklamasını kendileri veriyor ve açıklama örneklemin kendisinde: nüfus temelli veri kümeleri ağır depresyonu olan hastaları çoğunlukla dışarıda bırakır. Yani kortikal altı yapılarda bulunanla bulunmayan arasındaki fark, kimin taranmış olduğundan kaynaklanıyor olabilir; kaynağının beyin olması gerekmiyor. Bunun yanında bir başka olasılık daha duruyor: küçük klinik örneklemlerle elde edilmiş eski amigdala bulguları, bu ölçekte tekrar edilemeyecek kadar kırılgan olabilir. İki açıklama birbirini dışlamıyor ve ikisini ayırt etmenin yolu ağır hastaları da kapsayan büyük örneklemlerden geçiyor."}, {"en": "At the bedside the implication is narrow, and should honestly be kept narrow. This is an observational association study; it does not measure which change produces the other and it opens no route from a single scan to a diagnosis. Its value lies elsewhere: it changes where to look. And there is this too — the patients a clinic sees most are the people this evidence represents least. That does not invalidate the finding; it sets how far it generalises, and to whom.", "refs": ["scans"], "tr": "Hastanın yanında bunun karşılığı dar ve dürüstçe dar tutulmalı. Bu gözlemsel bir bağıntı çalışmasıdır; hangi değişimin diğerini doğurduğunu ölçmüyor ve tek bir taramadan tanıya giden bir yol açmıyor. Değeri başka yerde: nereye bakılacağını değiştiriyor. Bir de şu var, kliniğin en çok gördüğü hastalar bu kanıtın en az temsil ettiği kişilerdir. Bu, bulguyu geçersiz kılmaz; hangi hastaya ne kadar genellenebileceğini belirler."}]}], "sources": [{"key": "scans", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-large-scale-brain-scan-reveals.html", "title": {"tr": "Yirmi üç bini aşkın beyin görüntüsünde depresyonun izi motor ve görme alanlarında da çıktı", "en": "Across more than 23,000 brain scans, depression's correlates also appeared in motor and visual areas"}, "publishedDate": "2026-08-02", "primary": {"kind": "paper", "name": "Nature Mental Health", "url": "https://doi.org/10.1038/s44220-026-00680-y", "publishedDate": "2026-07-13", "title": {"tr": "Depresyonun nörogörüntüleme bağıntıları altı büyük nüfus veri kümesinde ortaya konuldu", "en": "The neuroimaging correlates of depression established across six large-scale population datasets"}}}], "title": {"en": "The amygdala did not show up but the motor and visual cortex did", "tr": "Amigdala çıkmadı ama motor ve görme korteksi çıktı"}, "writer": "sci-02", "radarPublishedAt": "2026-08-02T22:13:04+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Four lighting set-ups were tested side by side at six railway stations. The gain comes with a number, and the place where the gain stops sits in the same study.", "tr": "Altı tren istasyonunda dört aydınlatma düzeni yan yana denendi. Kazanç bir sayıyla verildi; kazancın nerede durduğu da aynı çalışmada duruyor."}, "sections": [{"h": {"en": "Four set-ups placed side by side", "tr": "Yan yana konan dört düzen"}, "ps": [{"en": "At six rural railway stations inside a German dark-sky reserve, four set-ups were compared through the 2023 and 2024 field seasons: 1800 K amber LEDs, high-pressure sodium lamps, 4000 K cool-white LEDs and unlit control points. Under the amber LEDs, trapped insect numbers came out 39 percent to 51 percent lower than under the other two lamp types, and captured biomass 51 percent to 77 percent lower. That is a workable lever: platform lighting is replaced on a cycle anyway.", "refs": ["amber"], "tr": "Almanya'da bir karanlık gökyüzü koruma alanındaki altı kırsal tren istasyonunda, 2023 ve 2024 saha mevsimleri boyunca dört düzen karşılaştırıldı: 1800 K kehribar LED'ler, yüksek basınçlı sodyum lambalar, 4000 K soğuk beyaz LED'ler ve aydınlatılmamış denetim noktaları. Kehribar LED altında tuzaklarla sayılan böcek bireyleri diğer iki lamba türüne göre yüzde 39 ile yüzde 51 arasında, yakalanan biyokütle ise yüzde 51 ile yüzde 77 arasında düşük çıktı. Bu, uygulanabilir bir kaldıraçtır: peron aydınlatması zaten belli aralıklarla yenileniyor."}, {"en": "The more useful information sits in the second result. High-pressure sodium, long treated as the gentler option, turned out to draw insects as strongly as the cool-white LED. This result su
