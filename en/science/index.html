ndan kurulan soy ilişkileri. Beklenenden çok daha derine uzanan parçalar aranıyor ve bu derinlik bir dışarıdan katkı olarak okunuyor. Yazarların bildirdiği kadarıyla bu parçaların bir bölümü bağışıklık ve metabolizmayla ilgili bölgelerde kümeleniyor — yani rastgele dağılmış bir kalıntı değil, işe yaramış olabilecek bir miras."}, {"en": "That is also where such a reading is fragile. An extraordinarily deep ancestry signal may indeed come from a separate group; but subgroups that stayed apart for a long time inside a single lineage leave a similar depth behind. What separates the two possibilities will come less from the genome than from the ground: if remains belonging to one of these unnamed lineages are found and sequenced, a relative who is today only the output of a calculation acquires a face. If none are found the question does not close either; we would have to learn to live with two branches of our own story that stay nameless.", "refs": ["haber-hominin"], "tr": "Bu tür bir okumanın kırılgan yeri de burada. Olağanüstü derin bir soy izi, gerçekten ayrı bir topluluktan gelmiş olabilir; ama tek bir soyun içinde uzun süre birbirinden ayrı kalmış alt gruplar da benzer bir derinlik bırakır. İki olasılığı ayıracak şey, genomdan çok yerden çıkacak: adı konmamış bu soylardan birine ait bir kalıntı bulunur ve dizilenirse, bugün yalnızca bir hesaplama sonucu olan akraba bir yüz kazanır. Bulunmazsa da soru kapanmaz; insanlığın kendi hikâyesinde adsız kalmayı sürdüren iki dalla yaşamayı öğrenmek gerekir."}]}], "sources": [{"key": "haber-hominin", "kind": "news", "name": "Sci.News", "url": "https://www.sci.news/genetics/human-dna-two-unknown-archaic-hominins-14961.html", "title": {"tr": "İnsan genomunda adı konmamış iki eski soy izi bildirildi", "en": "Two unnamed archaic lineages are reported in the human genome"}, "publishedDate": "2026-08-02"}], "title": {"en": "Two relatives in the genome with no name", "tr": "Genomda adı olmayan iki akraba"}, "writer": "sci-06", "n": 2, "date": "2026-08-03"}, {"excerpt": {"tr": "Plüton'un gölgesi aynı atmosferi iki yükseklikte farklı anlatıyor. Çok noktalı örtülmeler basınç düşüşünü güçlendirirken pus, örnekleme ve mevsimlik uçucu madde devri hangi geleceğin seçilebileceğini sınırlıyor.", "en": "Pluto's shadow tells different stories at two altitudes. Multichord occultations strengthen the case for falling pressure, while haze, sampling and seasonal volatile transport limit which future can be chosen."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Gölgenin içindeki geometri", "en": "The geometry inside the shadow"}, "ps": [{"tr": "Plüton bir yıldızın önünden geçerken yıldız ışığı bir anda kesilmiyor; ince atmosferde kırılarak aşama aşama sönüyor. Bu ışık eğrisi, yoğunluğun yükseklikle nasıl değiştiğini taşıyor. Amanda Sickafoose'un ekibi Ağustos 2017 ile Temmuz 2023 arasında on örtülmeyi bir araya getirdi. Dördü gölgeyi aynı anda birden fazla noktadan kesen çok noktalı gözlemlerdi, altısı tek noktadan geldi. Ayrım önemli: tek ışık eğrisi gölgenin merkezini ve boyutunu birbirine karıştırabilirken çok noktalı olay aynı atmosfer katmanını farklı doğrultulardan sınar. Dizinin en dar sonucu, 2015'teki New Horizons geçişinden yaklaşık 2021'e kadar süren basınç düzlüğünün sonrasında aşağı yönlü bir hareket başlamış olması.", "en": "When Pluto passes in front of a star, the light does not vanish at once; it fades through refraction in the thin atmosphere. That light curve carries the change in density with altitude. Amanda Sickafoose's team assembled ten occultations from August 2017 to July 2023. Four were multichord events that cut the shadow from several sites at once, while six came from single sites. The distinction matters. A lone curve can entangle the size and centring of the shadow, whereas several chords probe the same atmosphere along different paths. The narrow result of the series is that a pressure plateau extending from the 2015 New Horizons flyby to roughly 2021 appears to have given way to a decline.", "refs": ["haber-pluton"]}, {"tr": "Düşüş tek bir sayı değil. 2015-2021 dönemi 2022 ile karşılaştırıldığında, 1275 kilometrede pus dışarıda bırakılarak hesaplanan basınç yüzde 7 azaldı; hata payı yüzde 6. 1215 kilometrede pus hesaba katıldığında azalma yüzde 16, hata payı yüzde 2 oldu. İlk tahminin belirsizliği neredeyse değişimin kendisi kadar geniş, ikincisi daha sıkı. Bu fark, alt katmanlarda pusun ışık eğrisine daha fazla katkı vermesiyle uyumlu. Yine de iki değer aynı olayların ve eğrinin aynı parçalarının bire bir ölçümü değil. Örnekleme bileşimi de aradaki açıklığın bir bölümünü üretebilir. Bu nedenle yükseklik, burada yalnızca koordinat değil, sonucun hangi fiziksel bileşeni içerdiğini belirleyen bir seçimdir.", "en": "The fall is not one number. Comparing 2015-2021 with 2022, pressure at 1,275 kilometres declined by 7 per cent when the clear atmosphere was modelled, with an error bar of 6 per cent. At 1,215 kilometres, including haze, the decline was 16 per cent with an error bar of 2 per cent. Uncertainty around the first estimate is almost as large as the change; the second is tighter. The gap is consistent with haze contributing more lower down. Yet the two values do not use precisely the same events or identical parts of the light curve, so sample composition can also supply part of the difference. Altitude is therefore not merely a coordinate here. It determines which physical component enters the answer.", "refs": ["haber-pluton"]}]}, {"h": {"tr": "Bir aralığın seçemediği gelecek", "en": "The future one interval cannot choose"}, "ps": [{"tr": "Plüton'un azot ağırlıklı atmosferi, yüzey buzlarıyla buhar basıncı dengesinde. Basık yörünge ile yüksek eksen eğikliği bir Plüton yılı boyunca güneş ışınımını büyük ölçüde değiştiriyor; yüzeyin ısınması ve soğuması atmosferdeki gaz miktarını da oynatıyor. Bu yüzden birkaç yıllık gerileme iki ayrı uçucu madde taşınımı öngörüsünü tek başına ayıramaz. Bir model ailesi önümüzdeki on yıllarda atmosferin çökmesini, diğeri atmosferin kalmasını bekliyor. Yeni dizi, bu iki gelecekten birini doğrulamıyor. Sağladığı şey daha değerlendirilebilir bir sınır: düşüş gerçekten başladıysa hangi hızlarda ilerleyebileceği ve bu hızın alt atmosferde pusla birlikte nasıl göründüğü.", "en": "Pluto's nitrogen-dominated atmosphere is held in vapour-pressure equilibrium with surface ice. Its eccentric orbit and high obliquity shift solar insolation substantially through a Plutonian year, so warming and cooling at the surface move material into and out of the atmosphere. A decline over a few years cannot by itself decide between two families of volatile-transport model. Some anticipate collapse in the coming decades; others retain an atmosphere. The new series confirms neither future. It supplies something more testable: a bound on the rate at which a real decline could proceed, and on how that rate appears once haze in the lower atmosphere enters the measurement.", "refs": ["haber-pluton"]}, {"tr": "İzlenecek bir sonraki sayı, tek başına yeni basınç ortalaması değil. 2017-2023 boyunca üst atmosferin yapısı tutarlı kalırken alt atmosferdeki ışık eğrisinin eğimi değişti; bu değişim bir yıl ya da daha kısa sürede çöken pus parçacıklarıyla uyumlu. Bir eğrideki sivri çıkıntılar da aralıklı yüzerlik dalgalarına işaret etti. Yazarların ihtiyatı yerinde: yakın dönem basınç değişimini doğrulamak için daha fazla veri gerekiyor. 2028 sonuna kadar yayımlanacak çok noktalı örtülmeler 1215 kilometredeki basıncı 2015-2021 düzlüğünün altında tutarsa gerileme daha sağlam bir diziye dönüşür. Bunun için hem çok noktalı olay sayısını hem de aynı yükseklikteki değerin düzlüğe göre konumunu birlikte izlemek gerekiyor.", "en": "The next number to watch is not simply another mean pressure. Upper-atmospheric structure remained consistent from 2017 to 2023 while the lower light-curve slope changed, a pattern consistent with haze particles settling on yearly or shorter timescales. Spikes in one curve also indicated intermittent buoyancy waves. The authors' caution is well placed: more data are required to confirm a recent pressure change. If multichord occultations published through the end of 2028 continue to put the pressure at 1,215 kilometres below the 2015-2021 plateau, the retreat becomes a stronger sequence. That requires following both the number of multichord events and the position of the value at the same altitude relative to the plateau.", "refs": ["haber-pluton"]}]}], "sources": [{"key": "haber-pluton", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-pluto-hazy-atmosphere-collapsing-sun.html", "title": {"tr": "On yıldız örtülmesi, Plüton'un atmosfer basıncının düşmeye başladığını işaret ediyor", "en": "Ten stellar occultations point to a fall in Pluto's atmospheric pressure"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "The Planetary Science Journal", "url": "https://iopscience.iop.org/article/10.3847/PSJ/ae6cdd", "publishedDate": "2026-07-31", "title": {"tr": "2017-2023 yıldız örtülmesi verilerine dayanarak Plüton'un atmosferindeki değişimler", "en": "Changes in Pluto's Atmosphere Based on Stellar Occultation Data from 2017 to 2023"}}}], "title": {"tr": "Plüton'un incelen havası için iki yükseklik, iki yanıt", "en": "Two altitudes, two answers for Pluto's thinning air"}, "writer": "sci-01", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"tr": "Doravirin rejimi virüs baskılamasını korurken ortanca kilo artışını iki kilogram azalttı; kemik yoğunluğu ise daha çok düştü. Opti-DOR genel bir kazanç değil, hasta profiline bağlı bir takas gösteriyor.", "en": "The doravirine regimen preserved viral suppression while reducing median weight gain by two kilograms, but bone density fell further. Opti-DOR shows a patient-specific trade rather than a universal gain."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Aşağı olmama karşılığında alınan sonuç", "en": "What the noninferiority bargain bought"}, "ps": [{"tr": "Opti-DOR, Güney Afrika'daki iki merkezde daha önce antiretroviral tedavi almamış 600 yetişkini iki rejime rastgele ayırdı. Doravirin, lamivudin ve tenofovir disoproksil fumarat alan 299 kişinin 266'sında; dolutegravir, emtrisitabin ve tenofovir alafenamid alan 301 kişinin 273'ünde 48. haftada HIV RNA düzeyi mililitrede 50 kopyanın altındaydı. Kollar arasındaki fark 1,7 puandı ve yüzde 95 güven aralığı -6,6 ile 3,1 arasında kaldı. Önceden belirlenen aşağı olmama sınırı -10 puandı; dolayısıyla birincil sonlanım karşılandı. Bu tasarım doravirin rejiminin üstün olduğunu söylemiyor. Yalnızca virüs baskılamasında kabul edilen paydan daha fazla geride kalmadığını gösteriyor.", "en": "Opti-DOR randomised 600 previously untreated adults at two South African sites. At week 48, HIV RNA was below 50 copies per millilitre in 266 of 299 participants receiving doravirine, lamivudine and tenofovir disoproxil fumarate, and in 273 of 301 receiving dolutegravir, emtricitabine and tenofovir alafenamide. The difference was 1.7 percentage points, with a 95 per cent confidence interval from -6.6 to 3.1. Because the prespecified noninferiority margin was -10 points, the primary endpoint was met. This design does not say that the doravirine regimen was superior. It says that viral suppression did not fall behind by more than the margin the trial had accepted in advance.", "refs": ["haber-doravirin"]}, {"tr": "Karşılığında görülen kazanç kilo artışındaydı. Bir yıldaki ortanca artış doravirin kolunda 3,0, dolutegravir kolunda 5,0 kilogramdı; -2,0 kilogramlık farkın güven aralığı -3,0 ile -1,0 arasında ve P değeri 0,001'in altındaydı. Bu, iki farklı etkin ilacın yalın karşılaştırması değil; kollar tenofovirin farklı biçimlerini de içeriyor. Yine de denemenin klinik sorusu somut: integraz inhibitörü ve tenofovir alafenamid içeren rejimlerle kilo artışı yaşayan kişiler için virüs baskılamasını koruyan daha hafif bir seçenek bulunabilir mi? Bir yıllık iki kilogramlık ortanca fark herkeste aynı yararı anlatmaz, fakat kardiyometabolik komplikasyon riski yüksek bir kişi için ilaç seçimine girebilecek büyüklüktedir.", "en": "The return appeared in weight gain. Median gain over a year was 3.0 kilograms in the doravirine arm and 5.0 kilograms in the dolutegravir arm. The difference of -2.0 kilograms had a confidence interval from -3.0 to -1.0 kilograms and a P value below .001. This is not a clean comparison of two active drugs alone because the arms also contain different forms of tenofovir. Even so, the clinical question is concrete: can people vulnerable to weight gain on an integrase inhibitor and tenofovir alafenamide keep viral suppression with a lighter option? A median two-kilogram difference will not mean equal benefit for everyone, but it is large enough to enter a drug decision for someone at high cardiometabolic risk.", "refs": ["haber-doravirin"]}]}, {"h": {"tr": "Takasın öbür yüzü", "en": "The other face of the trade"}, "ps": [{"tr": "Kemik mineral yoğunluğu aynı yönde gitmedi. Kalçada azalma doravirin kolunda yüzde 2,1, karşı kolda yüzde 0,5; omurgada yüzde 3,2'ye karşı yüzde 1,3 oldu ve iki karşılaştırmada da P değeri 0,001'in altındaydı. En güçlü aday, doravirin kolundaki eski tenofovir disoproksil fumarat biçimi; tenofovir alafenamid birçok rejimde daha elverişli kemik ve böbrek profili nedeniyle onun yerini almıştı. Ancak bu deneme bileşenleri tek tek ayırmadığı için kaybı yalnızca bir ilaca yükleyemez. Daha az kilo alımının kemiğe binen yükü ve ölçülen yoğunluğu değiştirmesi de farkın bir bölümüne katkıda bulunabilir. Sonuç, kilo başlığının yanına aynı büyüklükte bir kemik sorusu koyuyor.", "en": "Bone mineral density moved in the opposite direction. Hip density fell 2.1 per cent in the doravirine arm and 0.5 per cent in the comparator; spine density fell 3.2 per cent against 1.3 per cent, with P below .001 for both comparisons. The leading candidate is the older tenofovir disoproxil fumarate used alongside doravirine, since tenofovir alafenamide replaced it in many regimens partly for its bone and renal profile. The trial did not isolate individual components, however, so the loss cannot be assigned to one drug alone. Smaller weight gain can also change mechanical loading and measured density. The result places a bone question beside the attractive weight headline.", "refs": ["haber-doravirin"]}, {"tr": "Bu takasın uygulanabileceği nüfus da dar. Katılımcılar yetişkin, daha önce tedavi almamış ve yalnızca 48 hafta izlenmişti. Başka bir rejimde virüs baskılaması sağlanmış kişiler, çocuklar, gebeler ve bir yıldan sonraki dayanıklılık bu sonuçta yok. Araştırmacılar bu nedenle doravirini dolutegravirin genel yerine değil, kilo artışının komplikasyon yaratma olasılığı yüksek kişiler için bir seçenek olarak konumluyor. Üstelik sıkı tedavi uyumu gerekiyor; dozların aksaması direnç riskini artırabilir. 96. hafta kemik yoğunluğu eğrileri arasındaki fark sabitlenirse kilo avantajı daha güvenli bir takasa dönüşür. Fark açılmayı sürdürürse kırık riski taşıyan kişilerde daha az kilo artışı, daha iyi bir toplam sonuç anlamına gelmeyebilir.", "en": "The population to whom this trade applies is also narrow. Participants were adults starting treatment and were followed for only 48 weeks. People already suppressed on another regimen, children, pregnant patients and durability beyond one year are absent from the result. The investigators therefore position doravirine as an option for people likely to suffer complications from weight gain, not as a universal replacement for dolutegravir. Strict adherence also matters because missed doses can increase resistance risk. If the separation between bone-density curves settles by week 96, the weight advantage becomes a safer bargain. If it continues to widen, less weight gain may not produce the better overall outcome for a person who already carries a fracture risk.", "refs": ["haber-doravirin"]}]}], "sources": [{"key": "haber-doravirin", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-doravirine-dolutegravir-suppress-hiv-viral.html", "title": {"tr": "600 kişilik denemede doravirin virüs baskılamada dolutegravire denk çıktı, kilo artışı daha az oldu", "en": "In a 600-person trial doravirine matched dolutegravir on viral suppression with less weight gain"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "JAMA", "url": "https://jamanetwork.com/journals/jama/fullarticle/10.1001/jama.2026.14762", "publishedDate": "2026-07-31", "title": {"tr": "Yetişkinlerde başlangıç HIV tedavisi ve tedaviye bağlı kilo artışı: Opti-DOR randomize klinik denemesi", "en": "Initial HIV Therapy for Adults and Treatment-Associated Weight Gain: The Opti-DOR Randomized Clinical Trial"}}}], "title": {"tr": "İki kilo daha az, kemik yoğunluğunda daha büyük kayıp", "en": "Two kilograms less, a larger loss in bone density"}, "writer": "sci-02", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"tr": "Geç Pliyosen'de Agulhas sızıntısı zayıflarken Atlantik devrilme dolaşımı güçlendi. Tortu vekilleri tek bir tuz kapısına dayanan açıklamayı daraltıyor, fakat bugünün okyanusu için doğrudan öngörü kurmuyor.", "en": "Atlantic overturning strengthened as Agulhas Leakage weakened in the late Pliocene. Sediment proxies narrow an explanation built around one salt gateway without directly forecasting today's ocean."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Akışı değil, yolu yeniden kurmak", "en": "Reconstructing the route, not gauging the flow"}, "ps": [{"tr": "Agulhas sızıntısının geç Pliyosen'deki gücü doğrudan ölçülmedi; deniz tabanına bırakılmış bir vekil zincirinden yeniden kuruldu. Utrecht Üniversitesi öncülüğündeki ekip, Agulhas Platosu'ndaki U1475 sondaj yerinin tortu çekirdeklerinde dinoflagellat kistleri ile organik lipit biyoişaretçilerini kullandı. Bunlar Güney Okyanusu subtropikal cephesinin 3,6 milyon ile 2,58 milyon yıl önceki enlemsel konumunu veriyor. Cephe, Hint Okyanusu suyunun Afrika çevresinden Atlantik'e geçebildiği yolu belirlediği için konum değişikliği olası sızıntı değişimine çevriliyor. Yaklaşık 3,6 milyon ile 3,3 milyon yıl önce cephenin kuzeye göç etmesi, sızıntı hacmi ile tuz beslemesinin kademeli olarak azaldığı bir dönem oluşturdu.", "en": "Late-Pliocene Agulhas Leakage was not measured by a flow gauge. It was reconstructed through a proxy chain left on the seabed. A Utrecht University-led team used dinoflagellate cysts and organic lipid biomarkers in cores from Site U1475 on the Agulhas Plateau to locate the Southern Ocean subtropical front between 3.6 million and 2.58 million years ago. The front determines the route by which Indian Ocean water can pass around Africa into the Atlantic, so its position becomes an inference about possible leakage. From roughly 3.6 million to 3.3 million years ago, a northward migration of the front marks a gradual reduction in leakage volume and salt supply.", "refs": ["haber-agulhas"]}, {"tr": "Yerleşik anlatı, daha az Hint Okyanusu tuzunun Atlantik meridyensel devrilme dolaşımını zayıflatmasını beklerdi. Karşılaştırma verisi tersini verdi. AMOC yolu boyunca yüzey ve dip verileri, Meksika Körfezi'ndeki sıcaklık dizisi, Atlantik ile Karayip kayıtları ve iklim benzetimleri aynı dönemde dolaşımın güçlendiğine ve Kuzey Atlantik Derin Suyu oluşumunun yoğunlaştığına işaret etti. Bu, Agulhas tuzunun hiçbir rol oynamadığını kanıtlamaz. Tuz anomalisinin kuzeye ulaşması zaman alır; iki dizideki gecikme zayıf ama gerçek bir bağı gizleyebilir. Yine de eşzamanlı ters yönler, sızıntıyı bu zaman ölçeğinde dolaşımın birinci dereceden ayar kolu saymayı güçleştiriyor.", "en": "The conventional account would expect less Indian Ocean salt to weaken the Atlantic Meridional Overturning Circulation. The comparison data moved the other way. Surface and bottom measurements along the AMOC pathway, Gulf of Mexico temperatures, published Atlantic and Caribbean data, and climate simulations indicate that overturning strengthened and North Atlantic Deep Water formation intensified during the same interval. That does not prove Agulhas salt has no role. A salt anomaly takes time to travel north, and a lag between the data series could conceal a weaker but real link. Still, opposite movements over the same interval make it harder to treat the leakage as the first-order control on circulation at this timescale.", "refs": ["haber-agulhas"]}]}, {"h": {"tr": "Karşı örneğin sınırı", "en": "The boundary of the counterexample"}, "ps": [{"tr": "Bu karşı örnek bugünkü Atlantik'e taşındığında kolayca gereğinden fazla konuşur. Geç Pliyosen boyunca kıtaların konumu benzer olsa da buz hacmi, Kuzey Kutbu'ndan gelen tatlı su, sıcaklık düzeni ve arka plan iklimi bugünkü koşullarla aynı değildi. İncelenen buzul olayı yaklaşık 3 derecelik soğumayla birlikte gerçekleşti. Araştırmacıların kendi sınırı açık: sonuç belirli bir eski coğrafya ve iklim düzenine ait, güncel ya da gelecekteki ısınma senaryolarına uygulanabilirliği belirsiz. Dolayısıyla bu çalışma AMOC'un bugün güvenli olduğunu söylemez. Daha dar ve daha yararlı bir şey söyler: dolaşımın gücünü tek bir tuz kapısına bağlayan model, başka tatlı su ve yoğunluk akışları karşısında sınanmak zorunda.", "en": "The counterexample can easily say too much when carried into today's Atlantic. Although continental positions were broadly familiar, late-Pliocene ice volume, Arctic freshwater supply, temperature patterns and background climate differed from present conditions. The glacial event examined here accompanied cooling of roughly 3 degrees Celsius. The researchers state the boundary directly: the result belongs to a specific ancient geography and climate, and its applicability to current or future warming is uncertain. The study therefore does not say that today's AMOC is safe. It says something narrower and more useful: any model that assigns circulation strength to one salt gateway must be tested against the other freshwater and density flows in the system.", "refs": ["haber-agulhas"]}, {"tr": "Bulguyu bugüne bağlamanın dürüst yolu bir manşet değil, model sıralamasıdır. Önümüzdeki iki yılda yayımlanacak AMOC duyarlılık karşılaştırmaları, Agulhas tuz terimini diğer denetimler yanında aynı koşullarda sınayabilir. Bu terim farklı modellerde birinci dereceden ikinci dereceye gerilerse tortu yeniden kurgusunun getirdiği kısıt kuramsal düzeneğe yerleşmiş olur. Birinci sırada kalırsa, geç Pliyosen'deki kopuşun gecikme, vekil seçimi ya da o döneme özgü başka bir tatlı su kaynağıyla açıklanması gerekir. Ayrıca aynı vekil zincirinin bugüne daha yakın bir buzul-buzularası aralığa uygulanması, bunun tek dönemlik bir karşı örnek mi yoksa yinelenen bir sistem özelliği mi olduğunu gösterebilir.", "en": "The honest bridge to the present is a model ranking, not a headline. AMOC sensitivity comparisons published over the next two years can test the Agulhas salt term beside other controls under matched conditions. If that term falls from first-order to second-order across models, the constraint from the sediment reconstruction will have entered the machinery of prediction. If it remains dominant, the late-Pliocene disconnection will need an explanation in lag, proxy choice or another freshwater source peculiar to that period. Applying the same proxy chain to a glacial-interglacial interval closer to the present would also show whether this was a one-period counterexample or a recurring property of the system.", "refs": ["haber-agulhas"]}]}], "sources": [{"key": "haber-agulhas", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-geological-evidence-role-agulhas-leakage.html", "title": {"tr": "Geç Pliyosen tortullarında Agulhas sızıntısı zayıflarken Atlantik dolaşımı güçlenmiş", "en": "In late Pliocene sediments the Atlantic overturning strengthened as Agulhas Leakage weakened"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Geoscience", "url": "https://www.nature.com/articles/s41561-026-02055-5", "publishedDate": "2026-08-03", "title": {"tr": "Geç Pliyosen Agulhas sızıntısının Atlantik meridyensel devrilme dolaşımından kopuşu", "en": "Disconnection of the late Pliocene Agulhas Leakage from Atlantic Meridional Overturning Circulation"}}}], "title": {"tr": "Agulhas Platosu'na gömülü Atlantik karşı örneği", "en": "The Atlantic counterexample buried on the Agulhas Plateau"}, "writer": "sci-03", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"tr": "Sodyum niyobat zarları denetimli açılarda üst üste konduğunda kimyasal bağ arayüzdeki atom örgüsünü de döndürdü. Yapı üretildi; işlev ölçümü ve otomatik yerleştirme hâlâ sıradaki basamaklar.", "en": "When sodium niobate membranes were stacked at controlled angles, chemical bonding rotated the interfacial lattice itself. The structure now exists; functional measurement and automated placement remain the next steps."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Üst üste koyma işleminin yük taşıyan adımları", "en": "The load-bearing steps in the stack"}, "ps": [{"tr": "North Carolina State University ekibi, serbest duran sodyum niyobat zarlarını geniş alanlı bir moiré üstörgüsü oluşturacak biçimde üst üste koydu. Üretim zincirinde fotolitografiyle basılan hizalama işaretleri açıyı görünür kıldı, zarlar elle konumlandırıldı ve tavlama katmanlar arasında kimyasal bağ kurdu. Ardından eşzamanlı hızlandırıcı ışınımıyla X ışını kırınımı, oluşan yapının yüksek kristalliğini sınadı. Sonuç iki işi bir araya getiriyor: ince tabakaları seçilen açıda çakıştırıyor ve bu açıyı geniş bir alanda koruyan, aktarma sonrasında dağılmayan, kırınım ölçümünde düzenli kalan bir oksit arayüzü üretiyor. Fakat zincirin en değişken halkası hâlâ insan eliyle yapılan konumlandırma; belirlenimci sözcüğünün üretim ölçeğinde sınanacağı yer tam burası.", "en": "A North Carolina State University team stacked freestanding sodium niobate membranes into a large-area moire superlattice. Photolithographic alignment marks made the chosen angle visible, the membranes were positioned by hand, and annealing formed chemical bonds between layers. Synchrotron X-ray diffraction then tested the crystallinity of the resulting structure. The result combines two tasks: placing thin sheets at a chosen angle and producing an oxide interface that holds that angle over a wide area, survives transfer and remains ordered in diffraction. Yet the most variable link is still manual positioning. That is where the word deterministic will have to be tested at manufacturing scale.", "refs": ["haber-moire"]}, {"tr": "Oksitleri daha önceki bükümlü malzemelerden ayıran şey katmanlar arasındaki bağ. Van der Waals malzemelerinde katmanlar zayıf çekimle tutulur ve moiré çoğunlukla geometrik çakışmadan doğar. Burada kimyasal bağ, arayüzdeki atom örgüsünü bozacak kadar güçlü; atom yapısı katmanlar arasında kademeli olarak dönüyor. Böylece desen yalnızca dışarıdan verilen açının izdüşümü olmaktan çıkıyor, bağın malzemeyi yeniden biçimlendirmesini de içeriyor. Bu mekanizma kırınım verisiyle uyumlu, ancak tek olasılık değil. Zar aktarma ve tavlama sırasında kalan gerinim de kademeli dönmeye katkı verebilir. Bağın payını ayırmak için aynı açıların farklı tavlama ve gerinim koşullarında karşılaştırılması gerekir.", "en": "The bond distinguishes these oxides from earlier twisted materials. In van der Waals systems, weak attraction holds layers together and the moire pattern is largely a geometric overlap. Here the chemical bond is strong enough to distort the atomic lattice at the interface, producing a gradual rotation through the structure. The pattern therefore includes material rearrangement by the bond rather than merely the projection of an imposed angle. Diffraction is consistent with that mechanism, but it is not the only possibility. Strain left by membrane transfer and annealing could also contribute to a gradual turn. Separating the bond's share requires matched angles under different annealing and strain conditions.", "refs": ["haber-moire"]}]}, {"h": {"tr": "Yapı üretildi, işlev henüz ölçülmedi", "en": "The structure was made; its function remains unmeasured"}, "ps": [{"tr": "Sodyum niyobat burada bir model dizge. Çalışma bükümlü örgünün kutuplanmayı, dielektrik yanıtı, iletimi ya da başka bir aygıt özelliğini ne kadar değiştirdiğini bildirmiyor; bu soruları sonraki araştırmaya bırakıyor. Bu ayrım, prototip ile teslim edilebilir bileşen arasındaki mesafeyi belirliyor. Yüksek kristallik ve denetlenen açı, özellik ölçümünün önkoşullarıdır ama onun yerine geçmez. Ayrıca laboratuvar ölçeğindeki geniş alan, üretim verimi anlamına gelmez: kaç zarın başarıyla aktarıldığı, açı sapmasının parça boyunca dağılımı ve tekrarlanan örnekler arasındaki değişkenlik açıklanmadan yöntem bir üretim hattına çevrilemez. Şimdilik yapılan şey sağlam bir yapısal platformdur; çalışan bir aygıt değil.", "en": "Sodium niobate is a model system here. The study does not report how the twisted lattice changes polarization, dielectric response, transport or any other device property; those questions are left to later work. That distinction marks the distance between a prototype and a deliverable component. High crystallinity and a controlled angle are prerequisites for measuring function, not substitutes for it. Nor does a large laboratory area establish manufacturing yield. The number of successful transfers, the distribution of angular error across a piece and variation between repeated samples would be needed before the method could become a production process. What exists today is a credible structural platform, not a working device.", "refs": ["haber-moire"]}, {"tr": "Bir sonraki eşik iki yoldan aşılabilir. Aynı zarlarda büküm açısına bağlı kutuplanma ya da dielektrik yanıt ölçülürse atom örgüsündeki dönüşün neden önemli olduğu gösterilir. Elle konumlandırmanın yerini alan otomatik bir düzenek aynı açı dağılımını tekrar tekrar üretirse yöntemin belirlenimci yanı güçlenir. 2027 sonuna kadar bu sonuçlardan biri yayımlanırsa çalışma yalnızca güzel bir arayüz kurmaktan çıkar: ya işlev ile yapı arasında bir bağlantı ya da laboratuvar adımı ile ölçeklenebilir üretim arasında bir köprü kazanır. İkisi de gelmezse mevcut sonuç değerini yitirmez; yalnızca kapsamı, kimyasal bağların oksit moiré örgüsünü biçimlendirebildiğini gösteren tek bir yapısal başarı olarak kalır.", "en": "The next threshold can be crossed in either of two ways. Measuring twist-angle-dependent polarization or dielectric response in the same membranes would show why the atomic rotation matters. Replacing manual positioning with an automated mechanism that repeatedly produces the same angle distribution would strengthen the claim of deterministic fabrication. If either result appears by the end of 2027, the work moves beyond a well-made interface: it gains either a link between structure and function or a bridge from a laboratory step to scalable production. Without either, the result retains value but remains narrower—a structural demonstration that chemical bonds can reshape an oxide moire lattice.", "refs": ["haber-moire"]}]}], "sources": [{"key": "haber-moire", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/08/260801042819.htm", "title": {"tr": "Oksit zarlar belirli açılarla üst üste konunca bağlar atom örgüsünü büktü", "en": "Stacking oxide membranes at set angles let the bonding twist the atomic lattice"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "ACS Nano", "url": "https://doi.org/10.1021/acsnano.6c04794", "publishedDate": "2026-07-13", "title": {"tr": "Geniş alanlı, yüksek kristalliğe sahip oksit moiré üstörgülerinin belirlenimci üretimi", "en": "Deterministic Fabrication of Large-Area, High-Crystallinity Oxide Moire Superlattices"}}}], "title": {"tr": "Kimyasal bağlar isteyerek bükülen örgüyü yeniden çizdi", "en": "Chemical bonds redrew a deliberately twisted lattice"}, "writer": "sci-04", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"tr": "EFFECT ölümde yüzde 40 azalmayı saptamak üzere boyutlandırıldı, fakat yüzde 21 buldu ve üstünlük eşiğini geçemedi. Sonuç etkisizliği değil, daha küçük bir etkinin belirsizliğini gösteriyor.", "en": "EFFECT was powered to detect a 40% mortality reduction, found 21% and missed its superiority threshold. The result shows uncertainty around a smaller effect, not proof of inactivity."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Protokoldeki etki ile görülen etki arasındaki boşluk", "en": "The gap between the planned and observed effects"}, "ps": [{"tr": "EFFECT, kanında kriptokok antijeni bulunan ancak menenjit belirtisi olmayan, HIV'le yaşayan 604 yetişkini Güney Afrika ve Tanzanya'daki 11 merkezde rastgele iki kola ayırdı. 14 gün boyunca flukonazole flusitozin eklenen kolda 304 kişiden 40'ı, yani yüzde 13'ü; yalnızca flukonazol alan kolda 300 kişiden 50'si, yani yüzde 17'si öldü. Mutlak fark 4 puan, göreli ölüm azalması yüzde 21. Protokol ise 600 kişilik örneklemi yüzde 91 güçle yüzde 40'lık göreli azalmayı saptamak üzere kurmuştu. Deneme kendi hedeflediğinden daha küçük, fakat klinik olarak önemsiz sayılamayacak bir farkla karşılaştı ve birincil üstünlük çözümlemesinde istatistiksel anlamlılığa ulaşamadı.", "en": "EFFECT randomised 604 adults living with HIV who had cryptococcal antigen in blood but no symptoms of meningitis across 11 sites in South Africa and Tanzania. In the arm receiving flucytosine added to fluconazole for 14 days, 40 of 304 participants died, or 13 per cent. In the fluconazole-only arm, 50 of 300 died, or 17 per cent. The absolute difference was 4 percentage points and the relative reduction in mortality was 21 per cent. The protocol had sized 600 participants to detect a 40 per cent relative reduction with 91 per cent power. The trial encountered an effect smaller than the one it was built for, but not obviously trivial, and did not reach statistical significance on its primary superiority analysis.", "refs": ["haber-effect"]}, {"tr": "Bu sonuç, 'fark yok' cümlesine çevrilemez. Güç hesabı büyük bir etkiyi hedeflediğinde daha küçük bir gerçek etki, örneklem içindeki rastlantısal değişimden ayrılmayabilir. EFFECT'te 4 puanlık mutlak ayrım bu olasılıkla uyumlu. Aynı veri tedavinin gerçekten etkisiz olmasıyla da uyumludur; tek deneme bu iki durumu ayıramaz. Doğru hüküm, yararın kanıtlanmadığıdır, yararın bulunmadığı değil. Ciddi yan olaylar nedeniyle hastaneye yatış ya da ölüm açısından kollar arasında fark görülmemesi güvenlikte belirgin bir ceza olmadığını düşündürüyor, fakat bu da etkili olduğuna dair eksik kanıtı tamamlamaz. Bir sonraki çalışmanın boyutu, manşetteki yüzde 21'i değil güven aralığındaki belirsizliği taşımalıdır.", "en": "That result cannot be translated into 'no difference'. When a power calculation targets a large effect, a smaller real effect may not separate from random variation inside the sample. The 4-point absolute gap in EFFECT is compatible with that account. The same data are also compatible with a genuinely inert treatment; one trial cannot distinguish the two. The correct verdict is that benefit was not demonstrated, not that no benefit exists. The absence of a difference in serious adverse events leading to hospitalisation or death suggests no obvious safety penalty, but it does not repair incomplete efficacy evidence. The next study must carry the uncertainty around the estimate, not simply the 21 per cent headline, into its sample-size calculation.", "refs": ["haber-effect"]}]}, {"h": {"tr": "İki alt grup, iki ayrı kanıt ağırlığı", "en": "Two subgroups, two different evidential weights"}, "ps": [{"tr": "Yüksek antijen düzeyine sahip 134 kişilik alt grupta göreli ölüm azalması yüzde 47 olarak bildirildi. Bu soru tamamen sonradan bulunmuş değil: başlangıç antijen titresine göre etkililik, protokolde ikincil sonlanımlar arasında yer alıyor. Bu nedenle sonuç, daha yüksek riskli kişileri hedefleyen yeni bir deneme için makul bir başlangıç noktasıdır. Tedaviye uyanlarda bildirilen yüzde 29'luk azalma aynı ağırlıkta değil; uyum çözümlemesi protokolün ikincil sonlanım listesinde görünmüyor ve tedaviye uyabilen kişiler baştan farklı riskler taşıyabilir. Önceden belirlenmiş olmak alt grup sonucunu doğrulamaz, yalnızca neden incelendiğini şeffaflaştırır. 134 kişilik payda hâlâ geniş bir belirsizlik ve çoklu karşılaştırma ihtimali bırakıyor.", "en": "A relative mortality reduction of 47 per cent was reported in the 134 participants with high antigen levels. That question was not wholly discovered after the fact: efficacy by baseline antigen titre appears among the protocol's secondary endpoints. The result can therefore serve as a defensible starting point for a new trial focused on people at higher risk. The 29 per cent reduction reported among adherent participants does not carry the same weight. Adherence analysis is absent from the protocol's listed secondary endpoints, and people able to adhere may differ in baseline risk. Prespecification does not confirm a subgroup result; it makes the reason for examining it transparent. A denominator of 134 still leaves wide uncertainty and room for multiplicity.", "refs": ["haber-effect"]}, {"tr": "Şu anda görülen sonuçlar bir konferans sunumuna dayanıyor; hakemli sonuç makalesinin yayımlandığı belirtilmiyor. Yayımlanmış protokol tasarımı doğrulamamıza izin veriyor, fakat birincil üstünlük çözümlemesinin güven aralığı, kayıp verilerin işlenişi ve alt grup tahminlerinin tamamı sonuç makalesinde görülmeli. 2027 ortasına kadar hakemli makale bu ayrıntıları protokoldeki tanımlarla verirse yüksek antijenli gruptaki yüzde 47, sonraki denemenin varsayımına dönüşebilir. Vermezse yalnızca ilgi çekici bir konferans sayısı olarak kalır. Yöntem açısından kazanç şimdiden açık: kaçırılan eşik, araştırmanın bittiği yer değil; hedeflenen etki büyüklüğü ile ölçülen fark arasındaki uyumsuzluğu bir sonraki tasarımın başlangıcı yapıyor.", "en": "The available results come from a conference presentation; no peer-reviewed results paper is reported. The published protocol lets readers verify the design, but the confidence interval for the primary superiority analysis, handling of missing data and the full set of subgroup estimates still belong in the results paper. If a peer-reviewed article published by mid-2027 reports those details under the protocol's definitions, the 47 per cent estimate in the high-antigen group can become an assumption for the next trial. If not, it remains an interesting conference number. The methodological gain is already clear: a missed threshold is not the end of inquiry. It turns the mismatch between the planned effect and the observed difference into the starting point for the next design.", "refs": ["haber-effect"]}]}], "sources": [{"key": "haber-effect", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-death-patients-hiv-fungal-disease.html", "title": {"tr": "Kriptokok antijeni denemesinde ölüm riski göreli olarak yüzde 21 düştü, sonuç anlamlılığa ulaşmadı", "en": "A cryptococcal antigen trial reported 21% lower relative mortality without reaching significance"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Trials", "url": "https://link.springer.com/article/10.1186/s13063-026-09520-x", "publishedDate": "2026-03-24", "title": {"tr": "Taramayla belirlenen HIV ilişkili kriptokok antijenemisi olan yetişkinlerde flukonazol artı flusitozine karşı tek başına flukonazol: çok merkezli faz III randomize denetimli deneme", "en": "Fluconazole plus flucytosine versus fluconazole alone for adults with HIV-associated cryptococcal antigenaemia identified through screening: a multi-centre phase III randomised-controlled trial"}}}], "title": {"tr": "Deneme yüzde 40 için kurulmuştu, sonuç yüzde 21'de kaldı", "en": "The trial was built for 40 per cent; the result stopped at 21 per cent"}, "writer": "sci-05", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"tr": "Blood Falls'taki deniz kökenli mikroorganizmalar yalnızca korunmuş DNA bırakmadı; etkin transkriptler ve ayrışmış haplotipler taşıyor. Yeni bulgu, eski tuzlu suyun yaşından çok bugün süren yaşamı gösteriyor.", "en": "Marine-derived microbes at Blood Falls left more than preserved DNA: they carry active transcripts and divergent haplotypes. The new finding concerns life persisting today more than the brine's age."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"tr": "Kızıl buzda sınırlı bir deniz topluluğu", "en": "A marine community bounded by red ice"}, "ps": [{"tr": "Taylor Buzulu'nun ucundaki Blood Falls, demirce zengin buzulaltı tuzlu suyunun kızıl dışa akışı. McMurdo Kuru Vadileri ile deniz karşılaştırma noktalarından alınan 167 su, tortu ve rüzgârla taşınan örnek içinde araştırmacılar ayrı bir deniz mikroökaryot topluluğu buldu. Diyatomeler, haptofitler, dinoflagellatlar ve siliyatlar arasında deniz gösterge türleri vardı. Dağılım geniş değildi: topluluk yalnızca buzul ucundaki kızıl buz, çamur ve tortuyla sınırlıydı. Bu sınır, tek başına bulunan bir DNA parçasından daha anlamlı. Aynı örnekleme ağı vadilerin başka yerlerinde ve deniz karşılaştırma alanlarında çalıştığı için, buzul ucundaki kümelenme rastgele taşınmış malzeme yerine yerel yaşam alanını işaret ediyor.", "en": "Blood Falls at the end of the Taylor Glacier is the red outflow of iron-rich subglacial brine. Across 167 aquatic, sediment and wind-borne samples from the McMurdo Dry Valleys and marine reference sites, researchers found a distinct marine micro-eukaryotic community. Marine indicator species appeared among diatoms, haptophytes, dinoflagellates and ciliates. Their distribution was not broad: the assemblage was restricted to red ice, mud and sediment at the glacier terminus. That boundary carries more information than an isolated fragment of DNA. Because the same sampling net extended elsewhere in the valleys and into marine comparisons, concentration at the terminus points to a local habitat rather than randomly transported material.", "refs": ["haber-blood-falls"]}, {"tr": "Topluluğun etkin ve yalıtılmış olduğu iki ayrı ölçümden geliyor. Metatranskriptom profilleri fotosentez, ozmotik baskı yanıtı ve hücresel onarım yolakları etkinleşmiş fototroflar gösterdi; transkript, eski DNA'nın korunmasından farklı olarak hücresel etkinliğin işaretidir. Haplotip ağları da Taylor Buzulu ucundaki diyatomelerin McMurdo Boğazı'ndaki soydaşlarından soya özgü biçimde ayrıştığını gösterdi. Bu ikisi birlikte, canlıların yakın zamanda rüzgârla gelmiş konuklardan çok yalıtılmış bir nüfusun torunları olduğuna işaret ediyor. Rüzgârla taşınan hücrelerin ulaştıktan sonra etkinleşmesi mümkündür, ancak aynı açıklamanın belirgin haplotip ayrışmasını da üretmesi daha güçtür.", "en": "Two different measurements support activity and isolation. Metatranscriptomic profiles revealed phototrophs with enriched pathways for photosynthesis, osmotic-stress response and cellular repair; unlike preserved DNA, a transcript indicates cellular activity. Haplotype networks also showed lineage-specific divergence between diatoms at the Taylor Glacier terminus and their counterparts in McMurdo Sound. Together, those results indicate descendants of an isolated population rather than recent visitors. Cells carried by wind could arrive and become active, but the same explanation has greater difficulty producing marked haplotype divergence as well.", "refs": ["haber-blood-falls"]}]}, {"h": {"tr": "İki milyon yılın kanıtı nerede duruyor?", "en": "Where the evidence for two million years begins and ends"}, "ps": [{"tr": "Tuzlu suyun yaklaşık iki milyon yıl önce bir buzulun okyanus bağlantısını kapatmasıyla yalıtıldığı düşüncesi bu çalışmanın doğrudan tarihlemesi değil. Daha önceki jeokimyasal ve izotopik kanıtlar, sıcak dönemlerde deniz suyunun Taylor Vadisi'ni bastığını ve ilerleyen buzulun suyu yeraltında bıraktığını destekliyor. Yeni makalenin katkısı biyolojik: bugün dışarı çıkan tuzlu suyun deniz kökenli ve etkin bir topluluğu barındırdığını gösteriyor. Bu, buzulaltı tuzlu suların yaşam alanı olabileceğine çalışan bir Dünya örneği ekler; Europa ya da Enceladus'ta yaşam bulunduğu anlamına gelmez. Başka dünyalara uzanan benzetme, yalnızca soğuk, tuzlu ve kapalı bir ortamın biyolojik olarak boş olmak zorunda olmadığını gösteren dar basamakta geçerlidir.", "en": "The idea that the brine was isolated roughly two million years ago when a glacier closed its ocean connection is not a direct date produced by this study. Earlier geochemical and isotopic evidence supports seawater flooding Taylor Valley during warm intervals and then being trapped beneath advancing ice. The new paper contributes the biology: brine emerging today contains an active community of marine origin. That adds a working Earth example of a subglacial brine as habitat; it does not amount to finding life on Europa or Enceladus. The analogy to other worlds is valid only at the narrow step showing that a cold, salty and enclosed environment need not be biologically empty.", "refs": ["haber-blood-falls"]}, {"tr": "En ilginç açık soru zaman değil, demir. Fitoplankton genellikle demirce fakir ortamlarda gelişirken bu soylar demirin bol olduğu Blood Falls çevresinde etkin. Topluluk düzeyindeki RNA yolakları onların fotosentez, ozmotik baskı ve onarım yaptığını gösteriyor, fakat demiri nasıl kullandıklarını söylemiyor. Bunun için tuzlu sudan tek tek soyların kültüre alınması ya da tam genomlarının çıkarılması gerekir. 2028 sonuna kadar böyle bir soy elde edilirse demir sorusu çevresel bir gariplik olmaktan çıkıp hücresel bir mekanizmaya bağlanabilir. O zamana kadar bulgunun sağlam çekirdeği daha sade: okyanus bağlantısını kaybetmiş bir tuzlu su sistemi, deniz kökenli bir topluluğu yalnızca saklamamış, etkin tutmuş.", "en": "The most interesting open question concerns iron rather than time. Phytoplankton often thrive where iron is scarce, yet these lineages are active amid the abundant iron of Blood Falls. Community-level RNA pathways show photosynthesis, osmotic-stress response and repair, but do not reveal what the organisms do with iron. That requires individual lineages recovered from the brine for culture or complete genome sequencing. If such a lineage is obtained by the end of 2028, the iron puzzle can move from environmental peculiarity to cellular mechanism. Until then, the firm core is simpler: a brine system cut off from the ocean did not merely preserve a marine-derived community; it kept that community active.", "refs": ["haber-blood-falls"]}]}], "sources": [{"key": "haber-blood-falls", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/how-antarcticas-blood-falls-came-to-be", "title": {"tr": "Blood Falls'ın kızıl buzunda denizden ayrı düşmüş bir mikrop topluluğu bulundu", "en": "A marine microbial community cut off from the ocean was identified in the red ice of Blood Falls"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "Nature Geoscience", "url": "https://www.nature.com/articles/s41561-026-02054-6", "publishedDate": "2026-08-03", "title": {"tr": "Antarktika Kuru Vadileri'ndeki buzulaltı tuzlu su beslemeli bir dizgede kalıntı deniz topluluğuna dair moleküler kanıt", "en": "Molecular evidence for a relict marine community in an Antarctic Dry Valleys subglacial brine-fed system"}}}], "title": {"tr": "Blood Falls'ta yaşayan şey geçmişten kalan bir iz değil", "en": "What lives at Blood Falls is more than a trace of the past"}, "writer": "sci-06", "n": 3, "radarUpdatedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"writer": "sci-01", "title": {"tr": "Işık hızının yüzde otuzundan saniyelerce tuzakta kalmaya", "en": "From thirty percent of light speed to seconds inside a trap"}, "excerpt": {"tr": "Hızlandırıcıdan çıkan çıplak argon çekirdekleri on binde bire yavaşlatılıp bir Penning tuzağında elektronlarla soğutuldu. Elde edilen şey bir ölçüm yeteneği; karşılığı ancak ilk duyarlı ölçümün belirsizliğinde görünüyor.", "en": "Bare argon nuclei from an accelerator were slowed by a factor of ten thousand and cooled with electrons inside a Penning trap. What was gained is a measurement capability, and its worth shows only in the uncertainty of the first precision measurement."}, "sections": [{"h": {"tr": "Yavaşlatma zinciri", "en": "The deceleration chain"}, "ps": [{"tr": "Darmstadt Teknik Üniversitesi ile GSI Ağır İyon Araştırma Merkezi'nin bildirdiği deneyde kullanılan parçacık, tüm elektronları sıyrılmış bir argon çekirdeği. Hızlandırıcıda ışık hızının yaklaşık yüzde 30'una çıkarılıyor; tuzaklanabilmesi için kinetik enerjisinin yaklaşık 10.000 kat düşürülmesi gerekiyor. Ardından 387 milimetre uzunluğundaki HITRAP soğutma tuzağında birkaç saniye tutuluyor ve orada elektronlarla soğutuluyor. Simon Rausch'a göre hızlandırıcıdan tuzağa uzanan bu yolun tümü ilk kez baştan sona gösterildi.", "en": "The particle in the experiment reported by the Technical University of Darmstadt and the GSI heavy-ion research centre is an argon nucleus stripped of every electron. The accelerator brings it to about 30% of the speed of light; to be trapped at all, its kinetic energy has to come down by a factor of about 10,000. It is then held for several seconds in the 387 mm HITRAP Cooling Trap and cooled there with electrons. According to Simon Rausch, the whole path from accelerator to trap was demonstrated end to end for the first time.", "refs": ["source-hitrap"]}, {"tr": "Bu sayıların sırası, sonucun neden bir yavaşlatma başarısı olarak okunması gerektiğini anlatıyor. Hızlı bir çekirdekle çalışmak, ona bakmak için çok kısa bir süreniz olması demek; enerjiyi almak, o süreyi uzatmak demek. Duyuruda yeni bir fiziksel büyüklük ölçümü ya da kuram sınaması yer almıyor; sunulan şey, yavaş ve yüksek yüklü ağır iyonlarla yapılacak duyarlı deneyler için kurulan teknolojik temel. Bu, kazanımın adının yetenek olduğu anlamına geliyor.", "en": "The order of those numbers is what makes the result read as an achievement in slowing things down. Working with a fast nucleus means having very little time to look at it; taking energy out means buying that time back. The announcement carries no new measurement of a physical quantity and no test of theory; what it presents is a technological foundation for precision experiments with slow, highly charged heavy ions. The right name for the gain, then, is capability.", "refs": ["source-hitrap"]}]}, {"h": {"tr": "Soğutmanın açtığı alan", "en": "The space that cooling opens"}, "ps": [{"tr": "Elektron soğutması, tuzakta bekleyen soğuk elektronların iyonların hareket enerjisini yavaş yavaş üzerlerine almasına dayanır. Yüksek yüklü iyonlara böyle bir Penning tuzağında ilk kez uygulandığı bildiriliyor. Duyuruda tesisin ilk kullanıcı deneyinin malzeme bilimi araştırması için yavaş altın iyonlarıyla yapıldığı da belirtiliyor; düzenek, bir gösteriden çıkıp başka ekiplerin kullandığı bir kaynak hâline gelmiş.", "en": "Electron cooling works by letting cold electrons waiting in the trap take up the ions' motion energy little by little. It is reported as applied to highly charged ions in such a Penning trap for the first time. The announcement also notes that the facility's first user experiment used slow gold ions for materials science research; the setup has moved from being a demonstration to being a resource other teams draw on.", "refs": ["source-hitrap"]}, {"tr": "Çıplak ve hidrojen benzeri ağır çekirdekler, elektrik alanların doğada ulaşabileceği en şiddetli değerlere yaklaştığı yerlerdir; bu yüzden kuantum elektrodinamiğinin en zorlu sınamaları oraya bakar. Yüksek yüklü ağır iyonlarla yapılacak duyarlı deneylerin kesinliği, çekirdeğin ne kadar soğuk ve ne kadar uzun tutulabildiğine bağlıdır. Saniyeler ölçeğindeki bir depolama süresi bu sınırı nereye taşıyor, eldeki duyuru söylemiyor. Yanıt, bu tuzakta yapılan ilk spektroskopi ölçümünün bildirdiği belirsizlikte duruyor; yetenek ancak o belirsizlik önceki sınırların altına inerse karşılığını veriyor.", "en": "Bare and hydrogen-like heavy nuclei are where electric fields come closest to the most violent values nature allows, which is why the hardest tests of quantum electrodynamics look there. The precision of experiments with slow, highly charged heavy ions depends on how cold the nucleus can be kept and for how long. Where a storage time measured in seconds moves that bound, the announcement in hand does not say. The answer sits in the uncertainty reported by the first spectroscopy measurement made in this trap; only if that uncertainty falls below the earlier limits does the capability pay for itself.", "refs": ["source-hitrap"]}]}], "sources": [{"key": "source-hitrap", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-electron-cooling-highly-ions-penning.html", "title": {"tr": "Hızlandırıcıdan çıkan çıplak argon çekirdekleri ilk kez bir Penning tuzağında elektronlarla soğutuldu", "en": "Bare argon nuclei from an accelerator were cooled with electrons in a Penning trap for the first time"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Physical Review X", "url": "https://doi.org/10.1103/961c-j3p5", "publishedDate": "2026-07-29", "title": {"tr": "Hızlandırıcıda üretilen yüksek yüklü iyonların yavaşlatılması ve tuzak içinde elektronla soğutulması", "en": "Deceleration of Accelerator-Produced and In-Trap Electron Cooling of Highly Charged Ions"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "radarUpdatedAt": "2026-08-02T17:23:58+00:00", "date": "2026-08-02"}, {"writer": "sci-02", "title": {"tr": "Sıçan pankreası farede büyüdü, insan hücresi hâlâ kapıda", "en": "A rat pancreas grew in a mouse, and human cells are still at the door"}, "excerpt": {"tr": "Türler arası organ üretiminde hedeflenebilir engellerden biri, konak embriyonun doğuştan gelen bağışıklık tanıması. Bu engeli azaltan üç strateji grubu kimerizmi artırıyor; insan hücrelerinin embriyo gövdesindeki payı yine de çok düşük kalıyor.", "en": "One tractable barrier to interspecies organ generation is innate immune recognition by the host embryo. Three strategy groups raise chimerism, yet the share of human cells in the embryo proper remains very low."}, "sections": [{"h": {"tr": "Engelin adı", "en": "Naming the barrier"}, "ps": [{"tr": "Institute of Science Tokyo ekibinin Cell dergisinde yayımladığı çalışma, yabancı bir embriyoda baskı altına giren verici hücrelerin yüzeyinde fosfatidilserin açığa çıktığını ve konak makrofajlardaki Axl reseptörünün bunu bir 'beni ye' işareti gibi okuduğunu bildiriyor. Ekip süreci ksenofagositoz olarak adlandırıyor. Verici hücreler yerleşemedikleri için değil, tanındıkları için ortadan kalkıyor.", "en": "The study published in Cell by the Institute of Science Tokyo team reports that when donor cells come under stress inside a foreign embryo, phosphatidylserine appears on their surface, and the Axl receptor on host macrophages reads it as an eat-me cue. The team names the process xenophagocytosis. Donor cells disappear because they are recognised, and not because they fail to settle.", "refs": ["source-chimera"]}, {"tr": "Bu, sorunun türünü değiştiriyor. Türler arası uyumsuzluk uzun süre bir genetik mesafe sorunu gibi ele alındı; burada tarif edilen ise doğuştan gelen bağışıklığın bir tanıma adımı. Fark pratik: genetik mesafeyi kısaltmak elinizde değil, bir tanıma adımını hedeflemek ise ilaç ve gen düzenleme araçlarının bildiği bir iş. Bununla birlikte alternatif bir okuma da açık: ksenofagositoz paralel engellerden yalnızca biri olabilir ve ortadan kaldırılması sıradaki engeli görünür kılabilir.", "en": "That changes the kind of problem this is. Cross-species incompatibility has long been treated as a matter of genetic distance; what is described here is a recognition step in innate immunity. The difference is practical: you cannot shorten genetic distance, but targeting a recognition step is work that drugs and gene-editing tools already know how to do. However, an alternative reading stays open: xenophagocytosis may be only one of several parallel barriers, and clearing it could bring the next one into view.", "refs": ["source-chimera"]}]}, {"h": {"tr": "Üç strateji, dört müdahale", "en": "Three strategies, four manipulations"}, "ps": [{"tr": "Ekip üç strateji grubunda dört müdahale denedi. Konak tarafındaki ilk grupta ya makrofajlar azaltıldı ya da Axl reseptörü devre dışı bırakıldı. Verici hücre tarafındaki iki ayrı yaklaşımda hücrelere CD47 ürettirildi veya ATP11C etkinliği artırılarak fosfatidilserinin zarın iç yüzünde tutulması amaçlandı. Bildirilene göre sıçandan fareye pankreas oluşturmanın başarı oranı arttı; insan hücreleriyle kurulan fare kimeralarında da verici hücrelerin katkısı yükseldi.", "en": "The team tested four manipulations within three strategy groups. In the first, host-side group, macrophages were either depleted or the Axl receptor was disrupted. The two donor-cell approaches engineered cells to express CD47 or increased ATP11C activity to keep phosphatidylserine on the inner face of the membrane. The reported success rate for generating a rat pancreas in mice increased, and the contribution of donor cells also rose in human-to-mouse chimeras.", "refs": ["source-chimera"]}, {"tr": "Bu gruplar aynı bedeli taşımıyor. Makrofaj azaltma ile Axl bozma konağın savunmasını değiştiriyor; CD47 ve ATP11C yaklaşımları ise müdahaleyi verici hücreye taşıyor ve konak bağışıklığını doğrudan zayıflatmıyor. Ayrım yalnız verimle ilgili değil: organ üretiminin hangi tarafında kalıcı bir değişiklik yapılacağını ve olası güvenlik yükünün hangi tarafa yazılacağını belirliyor.", "en": "These groups do not carry the same cost. Macrophage depletion and Axl disruption alter host defences; the CD47 and ATP11C approaches move the intervention into donor cells and do not directly weaken host immunity. The distinction is not merely about yield: it determines which side of organ generation receives a lasting change and where a potential safety burden sits.", "refs": ["source-chimera"]}]}, {"h": {"tr": "Kliniğe olan mesafe", "en": "The distance to the clinic"}, "ps": [{"tr": "Makale insan hücreleri için yalnız sağkalım değil, yüzdelik kimerizm de bildiriyor. PU.1 eksik farelerde E11.5 aşamasında insan hücrelerinin katkısı embriyo gövdesinde en çok yüzde 0,4, yumurta kesesinde ise en çok yüzde 20 oldu. Buna karşılık organ oluşumu sıçandan fareye, yani iki kemirgen arasında gösterildi; insan hücrelerinden işlevsel bir organ ve kliniğe ilişkin veri yok.", "en": "The paper reports percentage chimerism, not survival alone, for human cells. In PU.1-deficient mice at E11.5, human-cell contribution reached at most 0.4 percent in the embryo proper and at most 20 percent in the yolk sac. Organ formation, however, was demonstrated from rat to mouse, between two rodents; there is no functional organ made from human cells and no clinical data.", "refs": ["source-chimera"]}, {"tr": "Yumurta kesesi ile embriyo gövdesi arasındaki büyük fark, ksenofagositozun önemli fakat tek engel olmadığını gösteriyor. Makrofajlar devreye girmeden önce işleyen başka türler arası sınırlar, insan hücrelerinin organ oluşturacak dokulara katkısını düşük tutuyor olabilir. Bu nedenle sıradaki anlamlı ölçüt yeni bir yüzde istemek değil; embriyo gövdesindeki katkının artması ve insan hücrelerinin belirli, işlevsel bir dokuya düzenli biçimde katıldığının gösterilmesidir.", "en": "The large gap between yolk sac and embryo proper shows that xenophagocytosis is important but not the only barrier. Additional interspecies limits acting before macrophages emerge may keep human-cell contribution low in tissues that form organs. The next meaningful endpoint is therefore not simply another percentage, but a rise in embryo-proper contribution together with organised participation of human cells in a specified functional tissue.", "refs": ["source-chimera"]}]}], "sources": [{"key": "source-chimera", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-immune-blocking-strategy-interspecies-generation.html", "title": {"tr": "Fare embriyosunda sıçan organı büyütmenin önündeki engel bir bağışıklık tepkisi çıktı", "en": "The barrier to growing a rat organ in a mouse embryo turned out to be an immune response"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Cell", "url": "https://doi.org/10.1016/j.cell.2026.05.016", "publishedDate": "2026-06-05", "title": {"tr": "Ksenofagositozun engellenmesi türler arası kimerizmi artırıyor", "en": "Xenophagocytosis blockade enhances interspecies chimerism"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "radarUpdatedAt": "2026-08-02T17:23:58+00:00", "date": "2026-08-02"}, {"writer": "sci-03", "title": {"tr": "Bir elmas, derin mantodan geriye dönüşmüş bir mineral topluluğu taşıyor", "en": "A diamond carries a retrogressed mineral assemblage from the deep mantle"}, "excerpt": {"tr": "Juína elmasındaki götit, hematit ve manyetit topluluğu, yüksek basınç deneylerinden geri kazanılan fazlara benziyor. Bu benzerlik su taşıyan derin bir demir oksihidroksit geçmişini destekliyor; derinlik ve yaygınlık yine de hipotez düzeyinde.", "en": "The goethite, hematite and magnetite assemblage in a Juína diamond resembles phases recovered from high-pressure experiments. The match supports a deep water-bearing iron-oxyhydroxide history, while its depth and prevalence remain hypotheses."}, "sections": [{"h": {"tr": "Kapanımın kimliği", "en": "What the inclusion is"}, "ps": [{"tr": "Örnek, Mato Grosso'daki Chapadão yaylasından çıkan 3 × 2 × 1 milimetrelik bir elmas. İçindeki yaklaşık 35 mikrometrelik kapanımda götit, hematit ve manyetit ile yaklaşık yüzde 4 nikel ölçüldü. Scientific Reports makalesi bu topluluğu, götitin 35–57 gigapaskal ve 877–1827 santigrat derecede şoklanıp geri kazanıldığı deneylerde oluşan fazlara benzetiyor; bu basınçlar yaklaşık 900–1250 km derinliğe karşılık geliyor. Derinlik tahmini bu deneysel benzerlikten çıkarılıyor; kapanımın oluşum koşulları doğrudan ölçülmedi.", "en": "The sample is a 3 × 2 × 1 millimetre diamond from the Chapadão plateau in Mato Grosso. Its roughly 35-micrometre inclusion contains measured goethite, hematite and magnetite with about 4 percent nickel. The Scientific Reports paper compares this assemblage with phases produced when goethite was shocked and recovered at 35–57 gigapascals and 877–1827°C, pressures corresponding to roughly 900–1,250 km of depth. The depth estimate is inferred from this experimental analogue; formation conditions were not measured directly in the inclusion.", "refs": ["source-diamond"]}, {"tr": "Elmas kapanımı dış çevreden yalıtarak mineral topluluğunu yüzeye kadar taşıdı; ancak içerik yolculuk boyunca değişime uğradı. Yazarlar bugünkü götit, hematit ve manyetiti daha yüksek basınçlı bir demir oksihidroksit fazının geriye dönüşmesi ve parçalanmasıyla oluşmuş ürünler olarak yorumluyor. Elmasın tanıklığı, yalıtılmış bir geriye dönüşüm dizisinin ürünlerini korumasına dayanıyor; ilk mineralin kendisi değişti.", "en": "The diamond isolated the inclusion from its surroundings and carried the assemblage to the surface, while the contents changed during the journey. The authors interpret today's goethite, hematite and magnetite as products of retrogression and decomposition from a higher-pressure iron-oxyhydroxide phase. The diamond's testimony rests on preservation of the products of an isolated retrograde sequence; the original mineral itself was altered.", "refs": ["source-diamond"]}]}, {"h": {"tr": "Su döngüsünün derin kolu", "en": "The deep arm of the water cycle"}, "ps": [{"tr": "Yerin su bütçesinin yüzeyde görünmeyen bir kolu var: okyanus tabanı dalma-batma bölgelerinde mantoya inerken suyu mineral yapılarında taşıyor. Hangi fazların hangi basınçlarda kararlı olduğu, bu kolun ulaşabileceği derinliği belirliyor. Juína kapanımı, demir oksihidroksitin suyu geçiş bölgesinin altına taşıyabilmiş olabileceği hipotezini destekliyor; tek örnek bu taşıma yolunun ne kadar sık işlediğini göstermiyor.", "en": "The Earth's water budget has an arm that remains invisible at the surface: oceanic crust descending at subduction zones carries water in mineral structures. Which phases remain stable at which pressures sets how deep that arm can reach. The Juína inclusion supports the hypothesis that an iron oxyhydroxide may have carried water below the transition zone; one specimen does not show how often that route operates.", "refs": ["source-diamond"]}, {"tr": "Duyuruda araştırmacıların vurguladığı sonuç şu: bu tür minerallerden serbest kalan su çevredeki kayaların erime sıcaklığını düşürüyor ve yavaşça yükselen küçük hacimli magmalar üretebiliyor. Mekanizma makul, ama nedensellik yönünde dikkatli olmak gerekiyor. Elde bir kapanım var; belirli bir magma gövdesinin bu yolla oluştuğuna dair bir bağlantı bildirilmiyor. Bununla birlikte aynı gözlem, taşıyıcının varlığını gösterip yaygınlığı konusunda sessiz kalan tekil bir örnek olarak da okunabilir.", "en": "The conclusion the researchers stress in the announcement is this: water released from minerals of this kind lowers the melting point of surrounding rock and can produce small volumes of magma that rise slowly. The mechanism is plausible, but care is needed about the causal direction. What exists is one inclusion; no link is reported between it and any particular body of magma. However, the same observation can also be read as a single case that establishes the carrier's existence and stays silent about how common it is.", "refs": ["source-diamond"]}]}, {"h": {"tr": "Varlık değil, akış", "en": "Flux rather than existence"}, "ps": [{"tr": "Derin su döngüsünü ilgilendiren büyüklük akıştır: yılda kaç kilogram su mantoya iniyor ve ne kadarı geri dönüyor. Tek bir taştaki tek bir kapanım bu hesaba doğrudan sayı katmaz; olası mineral taşıyıcılarının listesini genişletir. Akışa ulaşmak için farklı kratonlardan daha çok elmastaki benzer geriye dönüşmüş toplulukların sıklığı, başlangıç fazlarının taşıyabildiği su miktarı ve suyun hangi derinlikte serbest kaldığı birlikte ölçülmeli. Juína bulgusu bu örneklem kurulana kadar değerli fakat tekil bir başlangıç noktasıdır.", "en": "The quantity that matters for the deep water cycle is flux: how many kilograms of water descend into the mantle each year and how much returns. One inclusion in one stone adds no number directly; it expands the list of possible mineral carriers. Estimating flux requires joint measurements of how often similar retrogressed assemblages occur in diamonds from different cratons, how much water their precursor phases can carry, and at what depth that water is released. Until such a sample exists, the Juína finding is a valuable but singular starting point.", "refs": ["source-diamond"]}]}], "sources": [{"key": "source-diamond", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-ancient-diamond-evidence-mineral-deep.html", "title": {"tr": "Bir elmasın içinde su taşıyan bir demir minerali litosferin altındaki basınçlardan sağ çıkmış", "en": "A water-bearing iron mineral survived sublithospheric pressures inside a diamond"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-46683-8", "publishedDate": "2026-05-11", "title": {"tr": "Dünya'nın mantosuna su taşıyıcısı olarak demir oksihidroksit", "en": "Iron oxyhydroxide as water carrier to the Earth's mantle"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "radarUpdatedAt": "2026-08-02T17:23:58+00:00", "date": "2026-08-02"}, {"writer": "sci-04", "title": {"tr": "Kırık amforanın eksik parçası artık ölçüm de yapıyor", "en": "The missing piece of a broken amphora now takes measurements too"}, "excerpt": {"tr": "Seramik onarımı Koç Üniversitesi'nde dört adımlı bir iş akışına çevrildi: fotoğrafla belgele, eksiği sayısal olarak kur, dolguyu bas, içine algılayıcı göm. Adımların her biri tanıdık; yeni olan, onarımın kendisinin bir ölçüm aracına dönüşmesi.", "en": "A team at Koç University turned ceramic repair into a four-step workflow: document by photograph, reconstruct the gap digitally, print the fill, embed sensors inside it. Each step is familiar; what is new is that the repair itself becomes an instrument."}, "sections": [{"h": {"tr": "Dört adım", "en": "Four steps"}, "ps": [{"tr": "Fotogrametri ile nesne yüzlerce örtüşen açıdan çekiliyor ve bu fotoğraflardan üç boyutlu bir sayısal model çıkarılıyor. Eksik bölüm bu model üzerinden sayısal olarak yeniden kuruluyor, ardından ona uyan dolgu eklemeli üretimle basılıyor. Dördüncü adımda dolgunun içine algılayıcılar gömülüyor. Yöntem Bandırma Arkeoloji Müzesi'ndeki geç Bizans dönemine ait Günsenin IV amforalarında ve İtalya'daki Minori Villa Romana e Antiquarium koleksiyonundaki Amalfi kıyısı amforalarında denendi.", "en": "Photogrammetry captures the object from hundreds of overlapping angles, and those photographs yield a three-dimensional digital model. The missing section is digitally reconstructed from that model, and a fill matched to it is then produced by additive manufacturing. In the fourth step, sensors are embedded inside the fill. The method was tried on late Byzantine Günsenin IV amphorae at the Bandırma Archaeology Museum and on Amalfi-coast amphorae in the collection of the Minori Villa Romana e Antiquarium in Italy.", "refs": ["source-pottery"]}, {"tr": "Gömülü algılayıcılar sıcaklık, nem, pH ve fiziksel gerilmeyi ölçmek üzere tasarlandı. Müzede yapılan ilk denemelerde günlük sıcaklık ve nem değişimleriyle bir gerilme algılayıcısının yakaladığı kuvvet örüntüleri kaydedildi. Ölçülen büyüklüklerin seçimi keyfi değil: tuz göçü, biçim bozulması ve mikro çatlaklar tam da bu üç değişkenin bileşiminden doğuyor.", "en": "Embedded sensors are designed to measure temperature, humidity, pH and physical stress. In first tests at the museum, daily changes in temperature and humidity were logged along with patterns of force picked up by a stress sensor. The choice of measured quantities is not arbitrary: salt migration, deformation and microfractures arise from the combination of exactly these three variables.", "refs": ["source-pottery"]}]}, {"h": {"tr": "Yeni olan parça", "en": "The part that is new"}, "ps": [{"tr": "Geleneksel alçı dolgu nesneyi zaman içinde tehdit eden çevresel değişimler ve fiziksel gerilmeler hakkında bilgi veremiyor. Burada eksik hacim, doldurulacak bir boşluk olmaktan çıkıp donanımın yuvası hâline geliyor. Fotogrametri, sayısal yeniden kurma ve eklemeli üretim ayrı ayrı yerleşmiş tekniklerdir; birleşimin getirdiği asıl değişiklik, onarımın pasif bir malzeme olmaktan çıkıp sürekli ölçüm yapan bir yapıya dönüşmesidir.", "en": "Traditional plaster repairs cannot provide information about environmental changes or physical stresses that may threaten the object over time. Here the missing volume stops being a gap to be filled and becomes the housing for the hardware. Photogrammetry, digital reconstruction and additive manufacturing are each well-established techniques; what the combination changes is that the repair stops being a passive material and turns into a structure that keeps measuring.", "refs": ["source-pottery"]}, {"tr": "Bu birleşim bir ödünleşme de getiriyor. Dolgunun aynı anda iki koşulu sağlaması gerekiyor: koruma açısından kabul edilebilir bir geometri ve elektronik parçaları taşıyabilen bir iç yapı. Bir seramik onarımında dolgu genellikle mümkün olduğunca ince ve geri alınabilir tutulur; algılayıcı barındıran bir dolgu ise kalınlık ve hacim ister. Bu iki gereksinimin nerede çakıştığı, yöntemin hangi nesnelerde kullanılabileceğini belirleyen asıl kısıttır.", "en": "The combination also brings a trade-off. The fill has to satisfy two conditions at once: a geometry acceptable for conservation, and an internal structure able to carry electronic components. In ceramic repair a fill is usually kept as thin and as reversible as possible; a fill that houses sensors demands thickness and volume. Where those two requirements collide is the real constraint on which objects the method can be used for.", "refs": ["source-pottery"]}]}, {"h": {"tr": "Teslim edilmemiş olan", "en": "What has not been delivered"}, "ps": [{"tr": "Haber duyurusu prototipte kullanılan filamentin kesin bileşimini, algılayıcıların güç kaynağını, verinin nasıl okunup aktarıldığını ve ölçüm ayarını açıklamıyor. Birincil makale ise malzeme yönünü bütünüyle boş bırakmıyor: prototiplemede filament kullanıldığını, PLA ve ABS'nin uzun süreli koruma için uygun olmadığını ve sonraki hedefin seramik olduğunu belirtiyor. Bu durumda elde belgelenmiş bir iş akışı ve açık bir malzeme hedefi var; müzede yıllarca çalışan bir sistem için kesin dolgu reçetesi, güç, okuma ve kalibrasyon hâlâ gerekiyor.", "en": "The news announcement does not identify the exact prototype filament, the sensors' power source, how data is read or transmitted, or the calibration. The primary paper does not leave the material path entirely blank: it says filament was used for prototyping, that PLA and ABS are unsuitable for long-term conservation, and that ceramic is the later goal. What exists is therefore a documented workflow with a stated material direction; a system meant to run for years in a museum still needs an exact fill recipe, power, readout and calibration.", "refs": ["source-pottery"]}]}], "sources": [{"key": "source-pottery", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-sensor-embedded-3d-ancient-pottery.html", "title": {"tr": "Kırık amforaların eksik parçaları, içine algılayıcı gömülü üç boyutlu baskılarla tamamlandı", "en": "Missing pieces of broken amphorae were completed with 3D prints holding embedded sensors"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Journal of Cultural Heritage", "url": "https://doi.org/10.1016/j.culher.2025.09.012", "publishedDate": "2025-11-01", "title": {"tr": "Arkeolojik seramik kayıp telafisi için fotogrametri, katmanlı üretim ve algılayıcılaştırma", "en": "Photogrammetry, additive manufacturing, and sensorization for archaeological ceramic loss compensation"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "radarUpdatedAt": "2026-08-02T17:23:58+00:00", "date": "2026-08-02"}, {"writer": "sci-05", "title": {"tr": "Ultra ince RuO₂'de spin dokusu var, düzenin adı henüz yok", "en": "Ultrathin RuO₂ has a spin texture, but its order is not yet named"}, "excerpt": {"tr": "Rutenyum dioksitte yıllardır süren tartışmaya yeni bir ölçüm eklendi. Ölçüm ikna edici; neyi kanıtladığı ise hangi kalınlıkta ve hangi sıcaklıkta yapıldığına bağlı.", "en": "A new measurement has been added to a years-long dispute about ruthenium dioxide. The measurement is convincing; what it proves depends on the thickness and the temperature at which it was made."}, "sections": [{"h": {"tr": "Ölçülen ile çıkarılan", "en": "What was measured and what was inferred"}, "ps": [{"tr": "Ölçüm, spin ayrımlı açı çözünürlüklü fotoemisyon spektroskopisiyle, alttaşın zorladığı gerilim altında büyütülmüş 2,7 nanometre kalınlığındaki RuO₂ katmanlı yapılarında yapıldı. Gözlenen şey momentuma bağlı bir spin dokusu: aynada tek ve aynada çift bileşenlerin bir arada bulunması. Çıkarım bunun bir adım ötesinde duruyor: kapsamlı simetri çözümlemesi bu dokunun mıknatıslık dışı kökenlerden gelemeyeceğini söylüyor. Manyetik nitelik doğrudan ölçülmüyor, dışlama yoluyla elde ediliyor.", "en": "The measurement was made with spin-resolved angle-resolved photoemission spectroscopy on RuO₂ heterostructures 2.7 nanometres thick, grown under strain imposed by the substrate. What was observed is a momentum-dependent spin texture: mirror-odd and mirror-even components coexisting. The inference sits one step beyond that: a comprehensive symmetry analysis says the texture cannot come from non-magnetic origins. The magnetic character is reached by exclusion rather than measured directly.", "refs": ["source-ruo2"]}, {"tr": "Dışlama yoluyla varılan bir sonuç, dışlanan seçeneklerin listesi kadar sağlamdır. Burada liste açık: simetri çözümlemesi yayımlandı ve ilk ilkelerden yapılan hesaplarla destekleniyor. Buna karşılık dokunun hangi manyetik düzene ait olduğu, yani zayıf ferromıknatıslık mı yoksa altermıknatıslık mı olduğu belirlenmiş değil. Ölçüm bir kapıyı kapatıyor, arkasındaki iki odayı birbirinden ayırmıyor.", "en": "A conclusion reached by exclusion is only as strong as the list of options excluded. Here the list is public: the symmetry analysis was published and is supported by calculations from first principles. What remains undetermined is which magnetic order the texture belongs to, that is, weak ferromagnetism or altermagnetism. The measurement closes one door without separating the two rooms behind it.", "refs": ["source-ruo2"]}]}, {"h": {"tr": "Sonucun sınırları nerede duruyor", "en": "Where the result's limits sit"}, "ps": [{"tr": "İki sınır sonucun kapsamını belirliyor. Birincisi kalınlık: birikmiş deneysel kanıt, RuO₂'nin yığın ve kalın film hâlinde herhangi bir manyetik düzen göstermediğine işaret ediyor ve bu çalışma o tabloyu değiştirmiyor. Yeni ölçüm bu nedenle yığın malzemeye dair eski iddiaları geri getirmiyor; gerilimin ultra ince sınırda ortaya çıkardığı ayrı bir duruma işaret ediyor. İkincisi sıcaklık: ölçümler yaklaşık 15 kelvinde yapıldı ve aynı dokunun oda sıcaklığında sürüp sürmediği bilinmiyor.", "en": "Two limits set the scope of the result. The first is thickness: accumulated experimental evidence points to RuO₂ showing no magnetic ordering in bulk or thick-film form, and this work does not change that picture. The new measurement therefore does not restore the earlier claims about bulk material; it points to a separate state that strain brings out in the ultrathin limit. The second is temperature: the measurements were made at about 15 kelvin, and whether the same texture persists at room temperature is unknown.", "refs": ["source-ruo2"]}, {"tr": "Bu iki sınır birlikte okunduğunda ortaya çıkan şey bir çürütme yerine bir daraltmadır. Tartışmanın önceki turlarında sorulan soru 'RuO₂ altermıknatıs mıdır' idi; bu sonucun izin verdiği soru 'gerilim altındaki ultra ince RuO₂ neyi gösterir' hâline geliyor. Bir iddianın kapsamı küçüldükçe sınanabilirliği artar; bu da bir kayıp sayılmaz.", "en": "Read together, those two limits produce a narrowing in place of a refutation. Earlier rounds of the dispute asked whether RuO₂ is an altermagnet; the question this result licenses becomes what ultrathin, strained RuO₂ shows. As a claim's scope shrinks its testability grows, and that does not count as a loss.", "refs": ["source-ruo2"]}]}, {"h": {"tr": "Tartışmayı ne bitirir", "en": "What would end the dispute"}, "ps": [{"tr": "Ayrımı yapacak ölçüm, aynı kalınlıktaki filmlerde sıcaklığı yukarı taşıyan bir çalışmadır: dokunun 15 kelvinin üstünde nereye kadar sürdüğü, hangi düzenin söz konusu olduğu konusunda bugünkü verinin veremediği bilgiyi verir. İkinci gereken, bağımsız bir grubun aynı gerilim ve kalınlık koşullarında spin ayrımlı ölçümü yinelemesidir. Bunlar yapılana kadar doğru cümle şudur: gerilim altındaki ince RuO₂'de manyetik kökenli bir spin dokusu ölçüldü ve düzeninin adı henüz konulmadı.", "en": "The measurement that would draw the distinction is one that carries temperature upward on films of the same thickness: how far the texture persists above 15 kelvin would supply what today's data cannot say about which order is at work. The second requirement is an independent group repeating the spin-resolved measurement under the same strain and thickness conditions. U
