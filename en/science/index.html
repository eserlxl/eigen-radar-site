nal figures seen by New Scientist.", "tr": "Birleşik Krallık'ın ulusal hava servisi Met Office'e göre temmuz “gerçekten olağanüstü” geçti: İngiltere ve Galler 190 yılın en kurak temmuzunu yaşadı. New Scientist'in gördüğü geçici verilere göre en az 20 istasyonda ay boyunca sıfır yağış ölçüldü ve bu, o istasyonların tarihinde ilk."}, "tag": "climate", "title": {"en": "Twenty UK weather stations measured no rain at all through July", "tr": "Yirmi Britanya istasyonunda temmuz boyunca hiç yağmur ölçülmedi"}, "topic": "science", "url": "https://www.newscientist.com/article/2583057-parts-of-the-uk-endure-first-ever-month-without-any-rain", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The peer-reviewed paper in Communications Earth \u0026 Environment (DOI 10.1038/s43247-026-03860-x) reports a modelled May–September deficit of 6.38 terawatt hours, with a one-standard-deviation spread of 8.86 terawatt hours, equal to 2.8 per cent of five-month photovoltaic generation, and an economic shortfall of 1.88 billion dollars with a spread of 2.71 billion. The estimate comes from an Earth system model rather than from metered generation. Lead author Iulian-Alin Roșu, at the Technical University of Crete, told New Scientist that North America lost about 711 million dollars and Europe almost 1.17 billion, that Germany was worst affected, and that higher European electricity prices explain the gap. The calculation also allows for the partly offsetting cooling caused by the smoke, which makes panels more efficient.", "tr": "Hakemli çalışma Communications Earth \u0026 Environment dergisinde yayımlandı (DOI 10.1038/s43247-026-03860-x). Mayıs–eylül arasında modellenen açık 6,38 teravatsaat; tek standart sapmalık yayılım ise 8,86 teravatsaat, yani beş aylık güneş üretiminin yüzde 2,8'i. Parasal açık 1,88 milyar dolar, yayılımı 2,71 milyar dolar. Tahmin, sayaç verisinden değil bir yer sistemi modelinden geliyor. Girit Teknik Üniversitesi'nden ilk yazar Iulian-Alin Roșu, New Scientist'e Kuzey Amerika'nın yaklaşık 711 milyon, Avrupa'nın ise 1,17 milyara yakın dolar yitirdiğini, en ağır darbeyi Almanya'nın aldığını ve aradaki farkı Avrupa'daki yüksek elektrik fiyatlarının açıkladığını söyledi. Hesap, dumanın yol açtığı soğumanın panel verimini bir miktar artırarak kaybı kısmen dengelemesini de içeriyor."}, "featured": true, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "New Scientist", "summary": {"en": "A modelling study of the record 2023 Canadian wildfire season finds that drifting smoke reduced photovoltaic generation across North America and Europe by about 3 per cent over five months, at a cost the authors put close to two billion dollars.", "tr": "Rekor kıran 2023 Kanada yangın mevsimini ele alan bir modelleme çalışması, sürüklenen dumanın beş ay boyunca Kuzey Amerika ve Avrupa'daki güneş elektriği üretimini yaklaşık yüzde 3 düşürdüğünü buluyor. Yazarların hesabına göre bunun bedeli iki milyar dolara yaklaşıyor."}, "tag": "climate", "title": {"en": "Smoke from Canada's 2023 fires cut solar output on two continents", "tr": "Kanada'daki 2023 yangınlarının dumanı iki kıtada güneş üretimini düşürdü"}, "topic": "science", "url": "https://www.newscientist.com/article/2582931-canadian-wildfires-are-reducing-solar-power-generation-in-europe", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The peer-reviewed analysis used 1,258 women under 50 recruited to the Generations Study between 2004 and 2011, 392 of whom developed breast cancer, weighted to the UK population by age and family history. The NICE criteria referred 1.4 per cent of women and caught 4.4 per cent of the cancers arising within ten years; the full BOADICEA model, which adds reproductive, lifestyle and polygenic factors, referred 26.5 per cent and caught 34.8 per cent. The authors report that 73 per cent of the under-50s the model flags have no family history of breast cancer. The limits are stated plainly: only White women were included, mammographic density and rare pathogenic variants were unavailable, only one risk model was compared, and full uptake of assessment was assumed although the one published UK primary-care study reached 16.1 per cent.", "tr": "Hakemli çözümleme, 2004–2011 arasında Generations Study'ye alınan 50 yaş altı 1.258 kadını kapsıyor; bunların 392'sinde meme kanseri gelişti ve örnek, yaş ile aile öyküsü bakımından Birleşik Krallık nüfusuna göre ağırlıklandırıldı. NICE ölçütleri kadınların yüzde 1,4'ünü yönlendirdi ve on yıl içinde ortaya çıkan kanserlerin yüzde 4,4'ünü yakaladı. Üreme, yaşam biçimi ve poligenik etkenleri de ekleyen tam BOADICEA modeli yüzde 26,5'ini yönlendirdi, yüzde 34,8'ini yakaladı. Yazarlara göre modelin işaret ettiği 50 yaş altı kadınların yüzde 73'ünde meme kanseri aile öyküsü yok. Çalışmanın sınırları açıkça bildiriliyor: yalnızca beyaz kadınlar dâhil edildi, meme yoğunluğu ile ender patojenik varyant verisi yoktu, tek bir risk modeliyle karşılaştırma yapıldı ve değerlendirmeye katılımın tam olacağı varsayıldı; oysa birinci basamakta yayımlanmış tek Britanya çalışmasında bu oran yüzde 16,1'de kalmıştı."}, "featured": true, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Medical Xpress", "summary": {"en": "A study in the British Journal of Cancer compared England's NICE family-history referral criteria with the multifactorial BOADICEA risk model in women under 50, and found that the current route identifies only a small fraction of those who go on to develop breast cancer within ten years.", "tr": "British Journal of Cancer'da yayımlanan çalışma, İngiltere'de kullanılan NICE aile öyküsü yönlendirme ölçütlerini çok etkenli BOADICEA risk modeliyle 50 yaş altı kadınlarda karşılaştırdı. Şu anki yolun, on yıl içinde meme kanseri gelişen kadınların yalnızca küçük bir bölümünü bulduğu görüldü."}, "tag": "biology", "title": {"en": "Family-history referral reaches 4.4 per cent of the breast cancers that follow", "tr": "Aile öyküsüne dayalı yönlendirme, sonraki meme kanserlerinin yüzde 4,4'ünü buluyor"}, "topic": "science", "url": "https://medicalxpress.com/news/2026-08-nice-referral-criteria-women-breast.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The peer-reviewed paper (DOI 10.7554/eLife.110390.4) reports that lightness predicted pupil size in the synesthetes but not in controls, and that synesthetes' pupils dilated no more than those of passive controls, while controls asked to invent and report colours dilated considerably more. The authors read that as evidence the synesthetic experience arrives without effort. Responses to a physically presented colour appeared at about 330 milliseconds, responses to a synesthetic colour at about 870. The limits are listed too: one block was run only in synesthetes, the time-course tests were not corrected for multiple comparisons, and the monitor was not linearised.", "tr": "Hakemli makale (DOI 10.7554/eLife.110390.4), açıklığın sinestetlerde gözbebeği boyutunu öngördüğünü, karşılaştırma gruplarında öngörmediğini bildiriyor. Sinestetlerin gözbebeği, edilgen karşılaştırma grubununkinden daha fazla genişlemedi; buna karşılık renk uydurup bildirmesi istenen grupta genişleme belirgin biçimde arttı. Yazarlar bunu, sinestetik deneyimin çaba gerektirmeden geldiğine kanıt sayıyor. Fiziksel olarak gösterilen renge tepki yaklaşık 330 milisaniyede, sinestetik renge tepki ise yaklaşık 870 milisaniyede belirdi. Sınırlar da sıralanıyor: bir blok yalnızca sinestetlere uygulandı, zaman seyri sınamalarında çoklu karşılaştırma düzeltmesi yapılmadı ve ekranın parlaklığı doğrusallaştırılmadı."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "eLife", "summary": {"en": "In a study published in eLife, 16 grapheme-colour synesthetes and two groups of 16 controls looked at digits while their pupils were measured. Pupil size in the synesthetes tracked the lightness of the colour they associate with a digit; in the controls it did not.", "tr": "eLife'ta yayımlanan çalışmada, 16 harf-renk sinesteti ile her biri 16 kişilik iki karşılaştırma grubu rakamlara bakarken gözbebekleri ölçüldü. Sinestetlerde gözbebeği boyutu, rakamla eşleştirdikleri rengin açıklığını izledi; karşılaştırma gruplarında böyle bir ilişki görülmedi."}, "tag": "biology", "title": {"en": "The pupil responds to a colour no one else in the room can see", "tr": "Gözbebeği, odadaki başka kimsenin görmediği bir renge tepki veriyor"}, "topic": "science", "url": "https://elifesciences.org/articles/110390", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The study appeared on 29 July in Science Advances. Lead author Ryleigh Davis, now at the University of California, San Diego, and at Caltech while the work was done, told Space.com that the interiors of large icy moons are normally hidden under thick shells of water ice and that Neptune's inner moons may be the only place where that material can be observed directly. The clays were found on the rings, on Larissa and on Galatea, but not on Proteus, the largest of the three. No water ice was detected on any of them, which the team calls surprising for that part of the solar system. The favoured reading is that Triton's capture destroyed an earlier moon system whose debris re-formed into today's inner moons; the team also allows that a Pluto-sized body torn apart by Neptune could deliver the same minerals. A hydrated mineral they have not been able to identify appears on all three moons and in the rings.", "tr": "Çalışma 29 Temmuz'da Science Advances dergisinde yayımlandı. Şu anda Kaliforniya Üniversitesi San Diego'da bulunan, araştırmayı Caltech'te yürüten ilk yazar Ryleigh Davis, Space.com'a büyük buzlu uyduların iç kısımlarının normalde kalın su buzu kabukları altında gizli kaldığını, Neptün'ün iç uydularının ise bu maddenin doğrudan görülebildiği tek yer olabileceğini söyledi. Kil mineralleri halkalarda, Larissa'da ve Galatea'da bulundu; üçünün en büyüğü olan Proteus'ta bulunmadı. Hiçbirinde su buzuna rastlanmadı ve ekip bunu Güneş Sistemi'nin o bölgesi için şaşırtıcı buluyor. Tercih edilen okuma, Triton'un yakalanmasının daha eski bir uydu düzenini parçaladığı, kalıntıların da bugünkü iç uyduları oluşturduğu yönünde. Ekip, Neptün'ün parçaladığı Plüton büyüklüğünde bir gök cisminin de aynı mineralleri açıklayabileceğini kabul ediyor. Üç uydunun ve halkaların hepsinde, henüz tanımlanamamış sulu bir mineral de görünüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Space.com", "summary": {"en": "James Webb Space Telescope spectra of Larissa, Galatea and Proteus, and of Neptune's rings, show magnesium-rich phyllosilicates: clay minerals that form only in the presence of liquid water and that had not been seen anywhere in the solar system beyond Jupiter.", "tr": "James Webb Uzay Teleskobu'nun Larissa, Galatea ve Proteus ile Neptün'ün halkalarından aldığı tayflarda magnezyumca zengin filosilikatlar görüldü: yalnızca sıvı suyun varlığında oluşan ve Güneş Sistemi'nde Jüpiter'in ötesinde bugüne dek saptanmamış kil mineralleri."}, "tag": "space", "title": {"en": "Clay on Neptune's inner moons, and no water ice at all", "tr": "Neptün'ün iç uydularında kil var, su buzu hiç yok"}, "topic": "science", "url": "https://www.space.com/astronomy/neptune/3-moons-of-neptune-may-be-remnants-of-ice-worlds-shattered-in-a-catastrophic-crash", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The 3.2-gigapixel LSST Camera sits on the 8.4-metre Simonyi Survey Telescope in Chile, and the observations behind the release were collected between April 2025 and January 2026 as part of a second early-data package covering roughly 3,000 square degrees. Observatory director Bob Blum says repeated visits to the region will show what the survey design can do. Access to the wider data package is currently limited to researchers in the United States and Chile and to authorised international data-rights holders, with a two-year proprietary period before the material becomes public.", "tr": "3,2 gigapikselik LSST Kamerası, Şili'deki 8,4 metrelik Simonyi Tarama Teleskobu'na bağlı. Yayımlanan verinin arkasındaki gözlemler, yaklaşık 3.000 kare dereceyi kapsayan ikinci erken veri paketinin parçası olarak Nisan 2025 ile Ocak 2026 arasında toplandı. Gözlemevi müdürü Bob Blum, bölgeye yapılacak yinelenen ziyaretlerin tarama tasarımının neler yapabileceğini göstereceğini söylüyor. Geniş veri paketine erişim şimdilik Amerika Birleşik Devletleri ile Şili'deki araştırmacılarla ve yetkilendirilmiş uluslararası veri hakkı sahipleriyle sınırlı; malzemenin herkese açılmasından önce iki yıllık kapalı bir dönem uygulanıyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Phys.org", "summary": {"en": "The NSF–DOE Vera C. Rubin Observatory has released its first LSST Camera image and catalogue of the COSMOS field, a patch of sky already studied by Hubble and by James Webb. The image holds more than 500,000 galaxies and more than 50,000 stars.", "tr": "NSF–DOE Vera C. Rubin Gözlemevi, LSST Kamerası'yla çektiği ilk COSMOS alanı görüntüsünü ve kataloğunu yayımladı. Daha önce Hubble ve James Webb tarafından da incelenen bu gökyüzü parçasının görüntüsünde 500 binden fazla gökada ve 50 binden fazla yıldız yer alıyor."}, "tag": "space", "title": {"en": "Rubin Observatory publishes its first deep image of the COSMOS field", "tr": "Rubin Gözlemevi, COSMOS alanının ilk derin görüntüsünü yayımladı"}, "topic": "science", "url": "https://phys.org/news/2026-08-rubin-observatory-deep-window-famous.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The preprint by Miles H. Currie and colleagues was posted to arXiv on 15 July (DOI 10.48550/arXiv.2607.14329) and has been accepted for publication, so it has passed review but is not yet in the journal. Nearby Sun-like systems are expected to hold at least three times as much habitable-zone dust as our own. Because the dust adds a smooth, cloud-like continuum, even a solar-system-like amount shallows absorption features, and the effect worsens at longer wavelengths. The authors also report a practical way around it: asking only whether a molecule is present, rather than measuring its abundance, relaxes the required dust subtraction by an order of magnitude, particularly at higher spectral resolution.", "tr": "Miles H. Currie ve arkadaşlarının ön baskısı 15 Temmuz'da arXiv'e yüklendi (DOI 10.48550/arXiv.2607.14329) ve dergide yayımlanmak üzere kabul edildi; yani değerlendirmeyi geçti, ama henüz basılmadı. Güneş benzeri yakın yıldız sistemlerinin, yaşanabilir bölgesinde bizimkinin en az üç katı toz barındırdığı düşünülüyor. Toz, buluta benzer düzgün bir süreklilik eklediği için Güneş Sistemi'ndeki kadar bir miktar bile soğurma çizgilerini sığlaştırıyor ve etki uzun dalga boylarına doğru büyüyor. Yazarlar pratik bir çıkış yolu da bildiriyor: bir molekülün bolluğunu ölçmek yerine yalnızca var olup olmadığını sormak, gereken toz çıkarma duyarlılığını bir büyüklük derecesi gevşetiyor; özellikle de tayfsal çözünürlük yüksekse."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Phys.org", "summary": {"en": "A preprint accepted by The Astronomical Journal simulates how dust in other planetary systems would contaminate spectra of Earth-like planets taken by a future Habitable Worlds Observatory, and finds it can reduce the apparent depth of visible molecular absorption features by up to 50 per cent.", "tr": "The Astronomical Journal'da yayımlanmak üzere kabul edilen bir ön baskı, başka gezegen sistemlerindeki tozun gelecekteki Habitable Worlds Observatory'nin Dünya benzeri gezegenlerden alacağı tayfları nasıl kirleteceğini benzetiyor. Görünür bölgedeki moleküler soğurma çizgilerinin görünen derinliğini yüzde 50'ye varan oranda azaltabildiği bulunuyor."}, "tag": "space", "title": {"en": "Dust in the habitable zone can halve the depth of an absorption line", "tr": "Yaşanabilir bölgedeki toz, bir soğurma çizgisinin derinliğini yarıya indirebilir"}, "topic": "science", "url": "https://phys.org/news/2026-08-zodiacal-exoplanetary-hinder-life-worlds.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The assessment rests on multi-model ensemble forecasts from leading global producing centres, issued through the organisation's Global Seasonal Climate Update; a full El Niño/La Niña update is due in early September. El Niño events recur every two to seven years, typically last nine to twelve months and usually peak between November and February, with the strongest effect on global mean temperature arriving the following year. WMO Secretary-General Celeste Saulo stressed that forecasts do not prevent hazards on their own, and United Nations Secretary-General António Guterres said the event is already making itself felt rather than approaching. The organisation notes that regional effects vary with intensity, duration, timing and interaction with other modes such as the Indian Ocean Dipole, and that extreme weather also occurs in neutral conditions.", "tr": "Değerlendirme, örgütün Küresel Mevsimlik İklim Güncellemesi kapsamında yayımlanan ve önde gelen küresel üretim merkezlerinden gelen çoklu model topluluk öngörülerine dayanıyor; tam El Niño/La Niña güncellemesi eylül başında bekleniyor. El Niño olayları iki ile yedi yılda bir yineleniyor, genellikle dokuz ile on iki ay sürüyor ve çoğunlukla kasım–şubat arasında doruğa çıkıyor; küresel ortalama sıcaklık üzerindeki en güçlü etki ise ertesi yıl ortaya çıkıyor. Örgütün genel sekreteri Celeste Saulo, öngörülerin tek başına tehlikeleri önlemediğini vurguladı. Birleşmiş Milletler Genel Sekreteri António Guterres ise olayın yaklaşmakta olmadığını, etkisini şimdiden hissettirdiğini söyledi. Örgüt, bölgesel etkilerin şiddete, süreye, zamanlamaya ve Hint Okyanusu Dipolü gibi başka salınımlarla etkileşime göre değiştiğini, aşırı hava olaylarının yansız koşullarda da görüldüğünü belirtiyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Phys.org", "summary": {"en": "The World Meteorological Organization says a strengthening El Niño is expected to shape global weather from August to October, with sea-surface temperature anomalies in the key monitoring regions forecast to pass 2.9°C.", "tr": "Dünya Meteoroloji Örgütü, güçlenen bir El Niño'nun ağustos–ekim döneminde küresel havayı biçimlendirmesinin beklendiğini bildirdi. İzleme bölgelerinde deniz yüzeyi sıcaklığı sapmalarının 2,9 dereceyi aşacağı öngörülüyor."}, "tag": "climate", "title": {"en": "WMO tells governments to prepare for a strong El Niño", "tr": "Dünya Meteoroloji Örgütü, güçlü bir El Niño'ya hazırlık çağrısı yaptı"}, "topic": "science", "url": "https://phys.org/news/2026-08-world-meteorological-strong-el-nio.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The team, led by Noel Castro Segura at the University of Warwick, published the work on 29 July in Monthly Notices of the Royal Astronomical Society. The system's 2023 eruption briefly made it one of the brightest X-ray sources in Earth's sky. Watching the accretion disc change while jets were launched gave the group a rare view of the link between infall and outflow, and dense winds continued after the outburst faded. On their reading, the mass thrown away may eventually match the mass swallowed. Castro Segura says people often imagine black holes simply swallowing everything around them, whereas the observations show a system that processes matter and expels a surprising amount of it. Kyle Solomons of the University of Cape Town adds that the finale of an outburst can be as intense as its opening.", "tr": "Warwick Üniversitesi'nden Noel Castro Segura'nın yönettiği ekip, çalışmayı 29 Temmuz'da Monthly Notices of the Royal Astronomical Society dergisinde yayımladı. Sistemin 2023'teki patlaması, onu kısa süreliğine gökyüzündeki en parlak X ışını kaynaklarından biri yapmıştı. Jetler fırlatılırken yığılma diskinin değişimini izlemek, ekibe içeri düşen madde ile dışarı atılan madde arasındaki bağa ender rastlanan bir bakış sağladı; yoğun rüzgârlar patlama sönümlendikten sonra da sürdü. Ekibin okumasına göre dışarı atılan kütle, sonunda yutulan kütleye eşit hâle gelebilir. Castro Segura, insanların kara delikleri çoğu zaman çevresindeki her şeyi yutan cisimler olarak düşündüğünü, gözlemlerin gösterdiğinin ise maddeyi işleyen ve şaşırtıcı bir bölümünü geri püskürten bir düzen olduğunu söylüyor. Cape Town Üniversitesi'nden Kyle Solomons da bir patlamanın finalinin başlangıcı kadar şiddetli olabileceğini ekliyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Space.com", "summary": {"en": "Observations with the Very Large Telescope followed the 2023 outburst of Swift J1727.8−1613, a black hole about 8,800 light-years away, from its first flare to its end, and found that the heaviest outflows came when the black hole was feeding least.", "tr": "Çok Büyük Teleskop'la yapılan gözlemler, yaklaşık 8.800 ışık yılı uzaklıktaki Swift J1727.8−1613 kara deliğinin 2023'teki patlamasını ilk parlamadan sonuna kadar izledi. En yoğun madde püskürtmelerinin, kara deliğin en az beslendiği dönemde gerçekleştiği bulundu."}, "tag": "space", "title": {"en": "Half the star may never reach the black hole", "tr": "Yıldızın yarısı kara deliğe hiç ulaşmamış olabilir"}, "topic": "science", "url": "https://www.space.com/astronomy/black-holes/astronomers-watch-a-black-holes-feeding-frenzy-end-with-a-bad-case-of-cosmic-indigestion", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The peer-reviewed, open-access paper (DOI 10.1371/journal.pbio.3003909) describes a tool built in R with the Shiny framework, wrapping ggplot2 for graphics, lme4 for mixed models and emmeans for post-hoc comparisons with false-discovery-rate correction. It draws box, violin, bar, point-and-error, before-after, histogram, density and numeric XY plots. The code sits on GitHub and is archived on Zenodo, and it runs three ways: as a hosted web app, as a serverless in-browser build compiled to WebAssembly, and as a standalone Windows program. The author states the boundary as well: the app handles up to two fixed and two random factors and only random-intercept models, and anything more complex has to go back to the underlying R package.", "tr": "Hakemli ve açık erişimli makale (DOI 10.1371/journal.pbio.3003909), R diliyle ve Shiny çatısıyla kurulmuş bir aracı anlatıyor: grafikler için ggplot2, karma modeller için lme4, yanlış keşif oranı düzeltmeli ardıl karşılaştırmalar için emmeans paketleri sarmalanıyor. Uygulama kutu, keman, çubuk, nokta-hata, önce-sonra, sıklık, yoğunluk ve sayısal XY grafikleri çiziyor. Kod GitHub'da bulunuyor ve Zenodo'da arşivlendi. Araç üç ayrı biçimde çalışıyor: barındırılan bir web uygulaması, WebAssembly'ye derlenmiş sunucusuz bir tarayıcı sürümü ve bağımsız bir Windows programı. Yazar sınırı da açıkça koyuyor: uygulama en çok iki sabit ve iki rastgele etkeni, yalnızca rastgele kesişimli modellerle işliyor; daha karmaşık tasarımlar için altta yatan R paketine dönmek gerekiyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "PLOS Biology", "summary": {"en": "PLOS Biology has published grafify online, a web application from Avinash R. Shenoy at Imperial College London that lets researchers draw publication-quality graphs and fit linear and mixed-effects models without writing any R code.", "tr": "PLOS Biology, Imperial College London'dan Avinash R. Shenoy'un geliştirdiği grafify online adlı web uygulamasını yayımladı. Araştırmacılar bu araçla tek satır R kodu yazmadan yayına uygun grafikler çizebiliyor, doğrusal ve karma etkili modeller kurabiliyor."}, "tag": "tech", "title": {"en": "An open statistics app for researchers who do not write code", "tr": "Kod yazmayan araştırmacılar için açık kaynaklı bir istatistik uygulaması"}, "topic": "science", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003909", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The Michigan cases have been linked to iceberg lettuce sourced from central Mexico. The state's Department of Health and Human Services said that, according to medical records, both people who died had significant underlying health conditions that may have been affected by cyclosporiasis and dehydration, and that no further information about the two cases will be released. Since May the Centers for Disease Control and Prevention has confirmed more than 6,700 cyclosporiasis cases acquired within the United States, spread across several outbreaks, not all of which have been traced to a source. Death from the infection is uncommon in the country: more than 2,200 cases were reported between 2011 and 2015 with no associated deaths.", "tr": "Michigan'daki vakalar, Meksika'nın orta bölgelerinden gelen buzdağı marulu ile ilişkilendirildi. Eyaletin Sağlık ve İnsan Hizmetleri Bakanlığı, tıbbi kayıtlara göre ölen iki kişide de siklosporiyaz ve sıvı yitiminden etkilenmiş olabilecek ciddi altta yatan sağlık sorunları bulunduğunu, bu iki vakayla ilgili başka bilgi paylaşılmayacağını açıkladı. Mayıstan bu yana Hastalık Denetimi ve Önleme Merkezleri, ülke içinde edinilmiş 6.700'den fazla siklosporiyaz vakasını doğruladı; bunlar birden çok salgına ait ve hepsinin kaynağı bulunabilmiş değil. Enfeksiyondan ölüm ülkede seyrek: 2011–2015 arasında 2.200'den fazla vaka bildirildi ve bunlara bağlı ölüm görülmedi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Live Science", "summary": {"en": "Two people have died in Michigan's Cyclospora cayetanensis outbreak, the first deaths documented in any of the Cyclospora outbreaks currently running in the United States. More than 11,000 people in the state have been affected and 193 have been hospitalised since early May.", "tr": "Michigan'daki Cyclospora cayetanensis salgınında iki kişi öldü. Bu ölümler, Amerika Birleşik Devletleri'nde süren Cyclospora salgınlarının hiçbirinde daha önce belgelenmemişti. Eyalette 11 binden fazla kişi etkilendi, mayıs başından bu yana 193 kişi hastaneye yatırıldı."}, "tag": "biology", "title": {"en": "Michigan reports the first deaths in a US Cyclospora outbreak", "tr": "Michigan, ABD'deki Cyclospora salgınının ilk ölümlerini bildirdi"}, "topic": "science", "url": "https://www.livescience.com/health/viruses-infections-disease/2-people-die-of-cyclospora-infection-in-michigan", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The letters date the episode to 39 BC, the year Calvinus governed Hispania, and match the revolt of the Indigenous Ceretani that the Roman historian Cassius Dio placed in that year but that had generally been thought to have happened farther west. The team, whose work was announced by the Autonomous University of Barcelona, also recovered the iron hobnails of legionary sandals, brooches and coins that support the dating. The university's statement says the revolt failed and was followed by severe repression, and that the governor ordered the punishment of soldiers who fled when the camp was ambushed. The researchers argue the finds reinforce that the Roman conquest of the Iberian Peninsula was neither a brief nor a peaceful process.", "tr": "Harfler olayı, Calvinus'un Hispania valiliğini yürüttüğü MÖ 39 yılına tarihliyor ve Romalı tarihçi Cassius Dio'nun aynı yıla yerleştirdiği, ancak genellikle daha batıda gerçekleştiği düşünülen yerli Ceretani ayaklanmasıyla örtüşüyor. Çalışmayı duyuran Barselona Özerk Üniversitesi'ne göre ekip, lejyoner sandaletlerinin demir çivilerini, giysi tokalarını ve tarihlemeyi destekleyen sikkeleri de çıkardı. Üniversitenin açıklamasında ayaklanmanın başarısız olduğu ve ardından ağır bir baskı döneminin geldiği, valinin de kamp pusuya düşürüldüğünde kaçan askerlerin cezalandırılmasını buyurduğu belirtiliyor. Araştırmacılar, buluntuların İber Yarımadası'nın Roma tarafından ele geçirilişinin ne kısa ne de barışçıl bir süreç olduğunu pekiştirdiğini savunuyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T12:27:15+00:00", "src": "Live Science", "summary": {"en": "Archaeologists surveying Collet de Jovell, an alpine pass in Cerdanya on the Spanish side of the eastern Pyrenees, found lead sling bullets from a Roman military camp. Two carry the letters CND, for the governor Gnaeus Domitius Calvinus.", "tr": "Doğu Pireneler'in İspanya tarafındaki Cerdanya'da yer alan Collet de Jovell adlı yüksek dağ geçidinde araştırma yapan arkeologlar, bir Roma askerî kampına ait kurşun sapan mermileri buldu. İkisinde, vali Gnaeus Domitius Calvinus'u gösteren CND harfleri var."}, "tag": "biology", "title": {"en": "Lead bullets stamped CND place a Roman camp in the eastern Pyrenees", "tr": "Üzerinde CND yazan kurşun sapan mermileri, bir Roma kampını Doğu Pireneler'e yerleştiriyor"}, "topic": "science", "url": "https://www.livescience.com/archaeology/romans/ancient-bullets-reveal-where-a-roman-camp-hid-in-the-pyrenees-of-spain-before-being-ambushed", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The peer-reviewed study, published in Nature Catalysis on 31 July, used reaction temperature, rhodium loading and synthesis method as inputs, and conversion, selectivity and CO and methane production rates as outputs. Input-output relationships that were clear within a single laboratory became statistically insignificant once interlaboratory variability was included. The authors report heat management as the largest contributor to that variability. First author Selin Bac says the findings are a reminder to be careful about what information is fed into a machine-learning model.", "tr": "Hakemli Nature Catalysis dergisinde 31 Temmuz'da yayımlanan çalışmada girdiler tepkime sıcaklığı, rodyum yüklemesi ve sentez yöntemi; çıktılar dönüşüm, seçicilik ile karbon monoksit ve metan üretim hızlarıydı. Tek bir laboratuvarın içinde açıkça görülen girdi–çıktı ilişkileri, laboratuvarlar arası değişkenlik hesaba katıldığında istatistiksel anlamlılığını yitirdi. Yazarlar, bu değişkenliğe en çok katkıyı ısı yönetiminin yaptığını bildiriyor. İlk yazar Selin Bac, bulguların bir makine öğrenmesi modeline hangi bilgiyi verdiğimiz konusunda dikkatli olmayı hatırlattığını söylüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "SLAC National Accelerator Laboratory, Pennsylvania State University, Stanford and UC Santa Barbara ran the same rhodium-on-titania catalyst batches for CO2 hydrogenation through four separate laboratories under one shared testing protocol. The aim was to measure the uncertainty inside the experimental datasets that feed machine-learning models.", "tr": "SLAC Ulusal Hızlandırıcı Laboratuvarı, Pennsylvania Eyalet Üniversitesi, Stanford ve Santa Barbara'daki Kaliforniya Üniversitesi, karbondioksitin hidrojenlenmesinde kullanılan aynı rodyum–titanyum dioksit katalizör partilerini aynı sınama yönergesiyle dört ayrı laboratuvarda denedi. Amaç, makine öğrenmesi modellerini besleyen deneysel veri kümelerindeki belirsizliği ölçmekti."}, "tag": "tech", "title": {"en": "Four laboratories tested the same catalyst and the relationships used to train models disappeared", "tr": "Dört laboratuvar aynı katalizörü sınadı, model eğitiminde kullanılan ilişkiler kayboldu"}, "topic": "science", "url": "https://phys.org/news/2026-08-labs-experimental-differences-undermine-ai.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Where glial fibrillary acidic protein (GFAP), released by injured astrocytes, was elevated, the hazard of disability worsening independent of relapses rose 1.45-fold in SMSC (95% CI 1.21-1.75) and 1.36-fold in EPIC (1.07-1.71). Among patients whose GFAP fell after starting treatment, the same hazard dropped to 0.46 (0.26-0.84) on fingolimod and 0.33 (0.18-0.61) on B-cell therapies. The study is observational: it shows an association, not that making treatment decisions from GFAP changes outcomes.", "tr": "Astrositlerin zedelendiğinde saldığı glial fibriler asidik protein (GFAP) yüksek olduğunda, ataktan bağımsız kötüleşme riski SMSC'de 1,45 (yüzde 95 güven aralığı 1,21–1,75), EPIC'te 1,36 (1,07–1,71) kat arttı. Tedaviye başladıktan sonra GFAP düşen hastalarda aynı risk fingolimod altında 0,46 (0,26–0,84), B hücresi tedavileri altında 0,33 (0,18–0,61) oranına indi. Çalışma gözlemsel; bulgular bir ilişkiyi gösteriyor, GFAP'ye göre tedavi kararı vermenin sonucu değiştirdiğini göstermiyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Medical Xpress", "summary": {"en": "A prospective observational study published in JAMA Neurology on 3 August examined 18,629 measurements from 2,329 people with multiple sclerosis. Samples came from the multi-centre Swiss SMSC cohort and the single-centre US EPIC cohort, with median follow-up of 6.9 and 13.1 years respectively.", "tr": "JAMA Neurology'de 3 Ağustos'ta yayımlanan ileriye dönük gözlemsel çalışma, multipl sklerozlu 2.329 kişiden alınan 18.629 ölçümü inceledi. Örnekler İsviçre'deki çok merkezli SMSC ile Amerika Birleşik Devletleri'ndeki tek merkezli EPIC izlemlerinden geldi; ortanca izlem süresi sırasıyla 6,9 ve 13,1 yıl."}, "tag": "biology", "title": {"en": "A blood protein tracks the disability that accumulates between relapses in MS", "tr": "Bir kan proteini, multipl sklerozda ataklar arasında biriken engelliliği izliyor"}, "topic": "science", "url": "https://medicalxpress.com/news/2026-08-blood-marker-tracks-hidden-multiple.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the peer-reviewed paper in Science Advances, cold, strong winter winds cool the surface water; the denser water sinks fast and carries living microalgae and organic debris below 1,000 metres. The pathway works far faster than gravitational settling of particles. In strong winters this mechanism supplies between 30 percent and 50 percent of the organic particles found between 500 and 2000 m, roughly doubling in the harshest winters. Lead author Martí Galí says finding chlorophyll at that concentration and depth came as a large surprise.", "tr": "Hakemli Science Advances dergisindeki çalışmaya göre soğuk ve sert kış rüzgârları yüzey suyunu soğutuyor, yoğunlaşan su hızla batıyor ve canlı mikroalgleri organik kırıntılarla birlikte 1.000 metrenin altına taşıyor. Bu yol, taneciklerin yerçekimiyle çökelmesinden çok daha hızlı işliyor. Güçlü kış mevsimlerinde 500 ile 2000 m arasında bulunan organik taneciklerin yüzde 30 ile yüzde 50 arasındaki bölümünü bu mekanizma sağlıyor, en sert kışlarda katkı yaklaşık iki katına çıkıyor. Baş yazar Martí Galí, o derinlikte bu yoğunlukta klorofil bulmanın büyük bir sürpriz olduğunu söylüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A study led by the Institute of Marine Sciences (ICM-CSIC) and the Barcelona Supercomputing Center reports that Argo floats in the Labrador and Irminger seas measured chlorophyll near a thousand metres between 2014 and 2017. Chlorophyll is a pigment of the sunlit surface layer and would be expected to break down long before reaching that depth.", "tr": "Deniz Bilimleri Enstitüsü (ICM-CSIC) ile Barselona Süperbilgisayar Merkezi'nin yürüttüğü çalışma, Labrador ve Irminger denizlerinde 2014–2017 arasında Argo şamandıralarının bin metre dolayında klorofil ölçtüğünü bildiriyor. Klorofil, güneş gören yüzey katmanının pigmenti; o derinliğe ulaşmadan çok önce parçalanmış olması bekleniyordu."}, "tag": "climate", "title": {"en": "Winter convection carries living algae below a thousand metres in the North Atlantic", "tr": "Kış konveksiyonu, Kuzey Atlantik'te canlı algleri bin metrenin altına indiriyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-mechanical-shortcut-rapidly-particles-deep.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "In the peer-reviewed paper published in Nature Photonics on 28 July, the 48 sensors deliver 48 times the pixels of a single sensor, while the physical gaps between them are covered by a diffractive optical element placed in the Fourier plane. The element spreads light into a distributed multi-spot point spread function, and compressive sensing algorithms reconstruct the missing information, adding a further 5.4-fold gain in throughput. The result is about 3 micrometre resolution across a field of view larger than 5.2 square centimetres at up to 120 frames per second, or 25.2 billion pixels per second. The reconstruction rests on the assumption that the object is sparse in some domain. The team demonstrated the system in dark-field imaging and in tracking calcium activity across freely moving Caenorhabditis elegans.", "tr": "Hakemli Nature Photonics dergisinde 28 Temmuz'da yayımlanan çalışmada 48 algılayıcı tek başına bir algılayıcının 48 katı piksel veriyor; algılayıcılar arasındaki fiziksel boşluklar ise Fourier düzlemine yerleştirilen kırınımlı bir optik öğeyle kapatılıyor. Bu öğe ışığı çok noktalı bir nokta yayılım işlevine dağıtıyor, sıkıştırmalı algılama algoritmaları da eksik bilgiyi geri kuruyor; böylece verim 5,4 kat daha artıyor. Sonuç, 5,2 santimetrekareden geniş bir görüş alanında yaklaşık 3 mikrometre çözünürlük ve saniyede 120 kare, yani saniyede 25,2 milyar piksel. Geri kurma, nesnenin bir uzayda seyrek olduğu varsayımına dayanıyor. Ekip sistemi karanlık alan görüntülemede ve serbestçe hareket eden Caenorhabditis elegans solucanlarında kalsiyum etkinliğini izlerken gösterdi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A computational microscope built by Kevin C. Zhou and colleagues at UC Berkeley treats 48 sensors arranged in a grid as one large sensor. The array fits on a credit-card-sized circuit board.", "tr": "Berkeley'deki Kaliforniya Üniversitesi'nden Kevin C. Zhou ve arkadaşlarının geliştirdiği hesaplamalı mikroskop, ızgara biçiminde dizilmiş 48 algılayıcıyı tek bir büyük algılayıcı gibi işliyor. Dizilim, kredi kartı boyutunda bir devre kartına sığıyor."}, "tag": "tech", "title": {"en": "A diffractive element fills the gaps between forty-eight sensors", "tr": "Kırk sekiz algılayıcı arasındaki boşlukları kırınımlı bir cam dolduruyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-focus-microscope-captures-billion-pixels.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the peer-reviewed paper in the Annals of the New York Academy of Sciences, source levels exceed 200 dB re 1 microPascal, the loudest communication sound measured in any mammal. Under typical deep-water conditions the estimated active space is about 70 km. The team proposes that a large male's large nose produces a lower-frequency click, so the sound may be an honest signal of body size. Peter Teglberg Madsen stresses that the behavioural function of the clicks, and how other whales respond to them, are not known. Temperature, salinity, depth and shipping noise all narrow the range; under heavy shipping noise the signal may travel only a few km.", "tr": "Hakemli Annals of the New York Academy of Sciences dergisindeki çalışmaya göre kaynak düzeyleri 1 mikropaskal başına 200 desibeli aşıyor; bu, herhangi bir memelide ölçülmüş en yüksek iletişim sesi. Derin suyun olağan koşullarında sesin etkin erişim alanı yaklaşık 70 km. Ekip, büyük bir erkeğin büyük burnunun daha alçak frekanslı tıklama ürettiğini, dolayısıyla sesin beden büyüklüğünün dürüst bir işareti olabileceğini öne sürüyor. Peter Teglberg Madsen, tıklamaların davranıştaki işlevinin ve diğer balinaların bunlara nasıl karşılık verdiğinin bilinmediğini vurguluyor. Sıcaklık, tuzluluk, derinlik ve gemi gürültüsü erişim alanını daraltıyor; yoğun gemi gürültüsünde sinyal yalnızca birkaç km gidebiliyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "An international team measured slow clicks using suction-cup sound recording tags attached to whales in waters off the Seychelles, Sri Lanka, Norway and Scotland. These clicks are low-frequency communication sounds, distinct from the echolocation clicks the whales use to find prey.", "tr": "Uluslararası bir ekip, Seyşeller, Sri Lanka, Norveç ve İskoçya sularında balinalara vantuzla tutturulan ses kaydedicilerle yavaş tıklamaları ölçtü. Bu tıklamalar, balinaların av bulmak için kullandığı yankı bulma tıklamalarından ayrı, alçak frekanslı iletişim sesleri."}, "tag": "biology", "title": {"en": "Male sperm whales' slow clicks exceed 200 decibels", "tr": "Erkek ispermeçet balinalarının yavaş tıklamaları 200 desibeli aşıyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-male-sperm-whales-loudest-communication.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the preprint posted to arXiv on 24 July, roughly 170 million black holes have formed in the galaxy to date and about 91 percent of them are currently isolated. Only around a hundred thousand retain a luminous stellar companion; most of the remaining binaries pair with another black hole or a white dwarf. The population's scale height is about 2.5 times that of the visible stars. The authors note that the mass distribution and kinematics are strongly dependent on remnant-mass prescriptions and natal-kick models. The preprint has not yet been peer reviewed.", "tr": "arXiv'e 24 Temmuz'da yüklenen ön baskıya göre gökadada bugüne dek yaklaşık 170 milyon kara delik oluştu ve bunların yaklaşık yüzde 91'i şu anda yalnız. Yalnızca yüz bin dolayında kara delik ışık saçan bir yıldız yoldaşını koruyor; kalan çiftlerin eşi çoğunlukla başka bir kara delik ya da bir beyaz cüce. Dağılımın ölçek yüksekliği görünür yıldızlarınkinin yaklaşık 2,5 katı. Yazarlar, kütle dağılımının ve devinimlerin kalıntı kütle reçetelerine ve doğuş tepmesi modellerine güçlü biçimde bağlı olduğunu belirtiyor. Ön baskı henüz hakem değerlendirmesinden geçmedi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A team led by Tom Wagg at the Flatiron Institute simulated billions of years of Milky Way history using a tool called cogsworth. The model computes stellar birth and death, binary evolution, supernova explosions and the natal kick each explosion gives a black hole together.", "tr": "Flatiron Enstitüsü'nden Tom Wagg'ın yürüttüğü ekip, cogsworth adlı araçla Samanyolu'nun milyarlarca yıllık geçmişini benzetimledi. Model, yıldızların doğuşunu ve ölümünü, çift yıldız evrimini, süpernova patlamalarını ve patlamanın kara deliğe verdiği tepme hızını birlikte hesaplıyor."}, "tag": "space", "title": {"en": "A Milky Way simulation finds about 91 percent of stellar-mass black holes alone", "tr": "Bir Samanyolu benzetimi, yıldız kütleli kara deliklerin yaklaşık yüzde 91'ini yalnız buluyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-simulations-hint-hidden-population-companionless.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The peer-reviewed study in the Journal of Human Evolution examines fragments ATD6-115, ATD6-128 and ATD6-401. The diploe, the spongy middle layer of the bone, accounts for between 41 percent and 50 percent of total cranial thickness. Total thickness falls within the ranges seen in modern humans and Neanderthals and clearly below Homo erectus and other early Pleistocene hominins. Rafael Gallareto-Sande says this is the first time the species' cranial thickness could be compared quantitatively, layer by layer.", "tr": "Hakemli Journal of Human Evolution dergisinde yayımlanan çalışmada ATD6-115, ATD6-128 ve ATD6-401 numaralı parçalar inceleniyor. Kemiğin süngerimsi orta katmanı olan diploe, toplam kafatası kalınlığının yüzde 41 ile yüzde 50 arasındaki bölümünü tutuyor. Toplam kalınlık, günümüz insanı ile Neandertallerde görülen aralıkların içinde kalıyor ve Homo erectus ile diğer erken Pleistosen insansılarının belirgin biçimde altında. Rafael Gallareto-Sande, türün kafatası kalınlığının ilk kez katman katman ve sayısal olarak karşılaştırılabildiğini söylüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "Three adult parietal bone fragments from the Gran Dolina site in the Sierra de Atapuerca, Burgos, Spain have been measured layer by layer for the first time. An earlier study in 2017 rested on a single juvenile bone.", "tr": "İspanya'nın Burgos ilindeki Atapuerca Sıradağları'nda bulunan Gran Dolina kazı alanından çıkan üç yetişkin parietal kemik parçası ilk kez katman katman ölçüldü. 2017'deki önceki çalışma tek bir çocuk kemiğine dayanıyordu."}, "tag": "biology", "title": {"en": "Three adult skull fragments bring Homo antecessor's bone layering closer to ours", "tr": "Üç yetişkin kafatası parçası, Homo antecessor'un kemik katmanlarını bize yaklaştırıyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-homo-antecessor-skull-layers-resemble.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the preprint posted to arXiv on 23 July, the secret key scrambles the hidden 0 or 1 bit across a row of quantum states, and the receiver measures those states together with the same key to recover the message. If an attacker intercepts the data and tries to split it between two accomplices, the measurement disturbs the information, and even when the key is released later both accomplices do no better than a coin flip. The authors state that the attacker's advantage shrinks exponentially as more quantum states are used. The work is a mathematical construction with a security proof; it contains no hardware implementation and the preprint has not been peer reviewed.", "tr": "arXiv'e 23 Temmuz'da yüklenen ön baskıya göre gizli anahtar, saklanan 0 ya da 1 bitini bir dizi kuantum durumuna dağıtıyor; alıcı aynı anahtarla durumları birlikte ölçerek mesajı geri alıyor. Saldırgan veriyi ele geçirip iki suç ortağı arasında bölmeye kalkarsa ölçüm bilgiyi bozuyor ve anahtar sonradan verilse bile her iki ortak da yazı tura atmaktan öteye geçemiyor. Yazarlar, kullanılan kuantum durumu sayısı arttıkça saldırganın üstünlüğünün üstel olarak küçüldüğünü belirtiyor. Çalışma bir matematiksel kurgu ve güvenlik kanıtı; donanım gerçeklemesi içermiyor ve ön baskı hakem değerlendirmesinden geçmedi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "Prabhanjan Ananth of UC Santa Barbara and Amit Sahai of UCLA have defined an information-theoretically secure, one-time private-key unclonable encryption scheme for one-bit messages. The construction rests on the no-cloning principle, which holds that an unknown quantum state cannot be copied exactly.", "tr": "Santa Barbara'daki Kaliforniya Üniversitesi'nden Prabhanjan Ananth ile Los Angeles'taki Kaliforniya Üniversitesi'nden Amit Sahai, tek bitlik mesajlar için bilgi kuramsal olarak güvenli, tek kullanımlık gizli anahtarlı bir kopyalanamaz şifreleme kurgusu tanımladı. Kurgu, bilinmeyen bir kuantum durumunun tıpatıp kopyasının çıkarılamayacağını söyleyen kopyalanamazlık ilkesine dayanıyor."}, "tag": "tech", "title": {"en": "A one-bit quantum cipher cannot be divided between two thieves", "tr": "Tek bitlik bir kuantum şifresi, iki hırsız arasında bölüşülemiyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-quantum-encryption-method-ciphertext-cloned.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "In the peer-reviewed study in ACS Nano, a voltage is applied across the pore; individual microcystin molecules briefly block the current as they pass, each variant leaving a characteristic signature. The team distinguished seven microcystin congeners. In a sample from Lake Lugano, MC-LR was measured at 12.7 nanomolar, against 13.1 nanomolar by liquid chromatography-mass spectrometry on the same sample. With a salt gradient added, MC-LR could be detected at 25 picomolar, 40 times below the World Health Organization's 1 nanomolar guideline value. Tamar Kohn says analysing samples without filtration remains an obstacle to be solved.", "tr": "Hakemli ACS Nano dergisinde yayımlanan çalışmada gözeneğe gerilim uygulanıyor; tek tek mikrosistin molekülleri geçerken akımı kısa süreli kesiyor ve her türev kendine özgü bir imza bırakıyor. Ekip yedi mikrosistin türevini birbirinden ayırdı. Lugano Gölü'nden alınan örnekte MC-LR derişimi 12,7 nanomolar ölçüldü; aynı örnek için sıvı kromatografisi–kütle spektrometrisi 13,1 nanomolar verdi. Tuz eğimi eklendiğinde MC-LR 25 pikomolar düzeyinde saptanabildi; bu, Dünya Sağlık Örgütü'nün 1 nanomolarlık kılavuz değerinin 40 katı altında. Tamar Kohn, örneklerin süzülmeden çözümlenebilmesinin hâlâ çözülmesi gereken bir sorun olduğunu söylüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A method developed by the groups of Matteo Dal Peraro and Tamar Kohn at EPFL in Lausanne uses the pore that the protein aerolysin forms spontaneously in a membrane as a sensor. The pore is about 10 nanometres long and about 1 nanometre across at its narrowest point.", "tr": "Lozan'daki İsviçre Federal Teknoloji Enstitüsü'nde (EPFL) Matteo Dal Peraro ve Tamar Kohn gruplarının geliştirdiği yöntem, aerolizin adlı proteinin zarda kendiliğinden oluşturduğu gözeneği algılayıcı olarak kullanıyor. Gözenek yaklaşık 10 nanometre uzunluğunda ve en dar yerinde yaklaşık 1 nanometre."}, "tag": "climate", "title": {"en": "A single protein pore tells apart microcystin variants in lake water", "tr": "Tek bir protein gözeneği, göl suyundaki mikrosistin türevlerini birbirinden ayırıyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-nanopore-method-cyanobacteria-toxins-lake.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The peer-reviewed study in New Phytologist starts from the point that the exchange between plant and fungus has mostly been studied by pulling roots out of the soil and washing them, which disturbs the very relationship under study. Mutez Ahmed of the Technical University of Munich says the method opens a box that had stayed closed in plant research, while lead author Braunmiller says it is now possible to see exactly how plants and fungi interact in soil. The work presents an imaging method; it does not report a measurement of the network's contribution to plant nutrition.", "tr": "Hakemli New Phytologist dergisinde yayımlanan çalışma, bitki ile mantar arasındaki alışverişin bugüne dek çoğunlukla kökleri topraktan çıkarıp yıkayarak incelenmesinin bu ilişkiyi bozduğu noktasından yola çıkıyor. Münih Teknik Üniversitesi'nden Mutez Ahmed, yöntemin bitki araştırmalarında kapalı kalmış bir kutuyu açtığını söylüyor; baş yazar Braunmiller ise artık bitki ile mantarın toprakta tam olarak nasıl etkileştiğinin görülebildiğini belirtiyor. Çalışma bir görüntüleme yöntemi tanıtıyor; mantar ağının bitki beslenmesine katkısını ölçen bir sonuç bildirmiyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "Henri M. Braunmiller and colleagues at the Technical University of Munich used synchrotron-based micro-computed tomography to image arbuscular mycorrhizal fungal structures in situ in soil. The method does not require lifting plant roots or disturbing the soil.", "tr": "Münih Teknik Üniversitesi'nden Henri M. Braunmiller ve arkadaşları, arbüsküler mikoriza mantarlarının toprak içindeki yapılarını yerinde görüntülemek için sinkrotron kaynaklı mikro bilgisayarlı tomografi kullandı. Yöntem, bitki köklerini yerinden çıkarmayı ya da toprağı bozmayı gerektirmiyor."}, "tag": "biology", "title": {"en": "Synchrotron tomography shows the fungal network in soil in three dimensions without disturbing roots", "tr": "Sinkrotron tomografisi, kökleri bozmadan topraktaki mantar ağını üç boyutlu gösteriyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-underground-fungal-networks-3d-view.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "In the peer-reviewed paper in Advanced Functional Materials, the movement of electronic charge during and after illumination was tracked with advanced microscopy and electrical measurements. Electrons accumulate near the crystal surface while the light is on; when it stops, the released charge triggers the displacement of domain walls and a transient jump of about -5 V in surface potential. Pankaj Sharma says the biggest change happened after the light was switched off. The team presents the result as a possibility for lower-energy memory and sensor devices; the work is a laboratory-scale observation, not a production-ready device.", "tr": "Hakemli Advanced Functional Materials dergisinde yayımlanan çalışmada elektron yükünün aydınlatma sırasında ve sonrasında nasıl hareket ettiği ileri mikroskopi ve elektriksel ölçümlerle izlendi. Aydınlatma boyunca elektronlar kristal yüzeyine yakın bölgede birikiyor; ışık kesildiğinde salınan bu yükler bölge duvarlarının yer değiştirmesini tetikliyor ve yüzey potansiyelinde yaklaşık −5 voltluk geçici bir sıçrama görülüyor. Pankaj Sharma, en büyük değişimin ışık söndükten sonra gerçekleştiğini söylüyor. Ekip sonucu daha az enerji harcayan bellek ve algılayıcı düzenekleri için bir olasılık olarak sunuyor; çalışma laboratuvar ölçeğinde bir gözlem, üretime hazır bir düzenek değil."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A team led by Haoze Zhang and Pankaj Sharma at Flinders University showed that nanoscale bubble domains in a PMN-xPT single crystal stay stable under near-visible illumination and then expand rapidly once the light is switched off.", "tr": "Flinders Üniversitesi'nden Haoze Zhang ve Pankaj Sharma'nın ekibi, PMN-xPT tek kristalindeki nanometre ölçekli kabarcık bölgelerinin görünür ışığa yakın dalga boylarındaki aydınlatma altında kararlı kaldığını, ışık kesildikten sonra ise hızla genişlediğini gösterdi."}, "tag": "physics", "title": {"en": "In a ferroelectric crystal, bubble domains grow after the light goes out", "tr": "Ferroelektrik bir kristalde kabarcık bölgeleri, ışık söndükten sonra büyüyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-nanoscale-domains-ferroelectric-crystal.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the peer-reviewed paper in Applied Catalysis B: Environment and Energy, the two metals divide the work: zinc prepares the reaction intermediates while copper eases the formation of the carbon-carbon bond ethanol requires. In a membrane-electrode assembly the catalyst reached 69 percent Faradaic efficiency for ethanol. The authors note that current density, energy efficiency, product concentration and long-term operation all need improvement; the work remains at laboratory scale and reports no industrial-scale performance.", "tr": "Hakemli Applied Catalysis B: Environment and Energy dergisindeki çalışmaya göre iki metal işi paylaşıyor: çinko ara ürünleri hazırlıyor, bakır ise etanol için gereken karbon–karbon bağının kurulmasını kolaylaştırıyor. Zar–elektrot birleşimli bir düzenekte etanol için yüzde 69 Faraday verimi elde edildi. Yazarlar akım yoğunluğu, enerji verimi, ürün derişimi ve uzun süreli çalışmada iyileştirme gerektiğini belirtiyor; çalışma laboratuvar ölçeğinde kalıyor ve sanayi ölçeğinde bir başarım bildirmiyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "A team at Sungkyunkwan University developed a catalyst that raises selectivity in the electrical conversion of carbon dioxide to ethanol by placing copper and zinc atoms adjacent to each other on a carbon support.", "tr": "Sungkyunkwan Üniversitesi'ndeki ekip, karbon taşıyıcı üzerine bakır ve çinko atomlarını birbirine komşu yerleştirerek karbondioksidin elektrikle etanole dönüştürülmesinde seçiciliği artıran bir katalizör geliştirdi."}, "tag": "climate", "title": {"en": "Copper and zinc atoms placed side by side steer carbon dioxide towards ethanol", "tr": "Yan yana duran bakır ve çinko atomları, karbondioksitten etanole giden yolu seçiyor"}, "topic": "science", "url": "https://phys.org/news/2026-08-catalyst-ethanol-electricity.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "According to the peer-reviewed paper in Paleobiology, the stones were abraded and became smoother inside the stomach, a trend clearest in plant-eating taxa. From this the authors propose two separate digestive solutions: a muscular stomach that ground plant material may have developed in the theropod line, while ornithischians and sauropods exceeding 20 metres may have relied on well-developed teeth and jaws together with prolonged fermentation in an elongated digestive tract. This is a hypothesis inferred from wear on fossil stones, not from a directly observed digestive process.", "tr": "Hakemli Paleobiology dergisinde yayımlanan çalışmaya göre taşlar mide içinde aşınarak pürüzsüzleşmiş ve bu eğilim en açık biçimde otçul türlerde görülüyor. Yazarlar buradan iki ayrı sindirim çözümü öneriyor: teropod soyunda bitkisel maddeyi öğüten kaslı bir mide gelişmiş olabilir; ornitiskiyenler ile 20 metreyi aşan sauropodlar ise gelişkin diş ve çeneleriyle uzayan bir sindirim kanalında sürdürülen mayalanmaya dayanmış olabilir. Bu bir hipotez; fosil taşların aşınma izlerinden çıkarılıyor ve doğrudan gözlenmiş bir sindirim sürecine dayanmıyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:07+00:00", "src": "Phys.org", "summary": {"en": "Ryuji Takasaki and colleagues at Okayama University of Science compared the wear patterns and shapes of gastroliths, or stomach stones, found in dinosaur fossils with those of modern birds and crocodilians. The specimens examined include a Tarbosaurus skeleton with a gastrolith-bearing region and Psittacosaurus, a distant relative of Triceratops.", "tr": "Okayama Bilim Üniversitesi'nden Ryuji Takasaki ve arkadaşları, dinozor fosillerinde bulunan gastrolitlerin (mide taşlarının) aşınma izlerini ve biçimlerini bugünkü kuşlar ile timsahlarınkiyle karşılaştırdı. İncelenen örnekler arasında gastrolit taşıyan bir Tarbosaurus iskeleti ve Triceratops'un uzak akrabası Psittacosaurus bulunuyor."}, "tag": "biology", "title": {"en": "Wear on stomach stones points to two separate digestive solutions in dinosaurs", "tr": "Mide taşlarının aşınması, dinozorlarda ik llow fault rupture, surface settlement and an overhead scanning carriage"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}, {"id": "science-climate-risk-proxies", "topic": "science", "title": {"tr": "İklim riski, yağışın ve sıcaklığın ötesinde iki yeni sayaç kazanıyor", "en": "Climate risk gains two counters beyond rainfall and temperature"}, "summary": {"tr": "Amazon kuraklıkları için atmosferik su talebi, kentler içinse yapı yaşı ve kompaktlık risk hesabını değiştiriyor. İki çalışma, iklim göstergesinin seçiminin kırılganlığı nasıl yeniden dağıttığını gösteriyor.", "en": "Atmospheric water demand changes the Amazon drought account, while building age and compactness reshape urban exposure. The studies show how indicator choice redistributes measured climate vulnerability."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-1280.d6be65706837.webp", "variants": [{"src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-640.9d0c2244992b.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-1280.d6be65706837.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Nem kaybeden yaprak ve kök dokusunun gözenekli bir geçişle çeşitli bina maketlerine dönüştüğü parlak kavramsal sahne", "en": "Bright conceptual scene in which moisture-stressed leaves and root texture transform through a porous transition into varied building models"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}], "articles": [{"excerpt": {"en": "A Milky Way simulation finds the great majority of stellar-mass black holes without a partner. If that holds, the catalogue we have is a catalogue of exceptions.", "tr": "Bir Samanyolu benzetimi, gökadadaki yıldız kütleli kara deliklerin büyük çoğunluğunu eşsiz buluyor. Bu doğruysa, elimizdeki kara delik kataloğu bir istisnalar kataloğu."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "The number the simulation gives", "tr": "Benzetimin verdiği sayı"}, "ps": [{"en": "Tom Wagg and colleagues at the Flatiron Institute ran the Milky Way forward with a tool called cogsworth: stellar birth and death, the joint evolution of binary stars, and the kick a supernova gives the remnant it leaves behind all sit inside the same calculation. The preprint posted to arXiv on 24 July reports that roughly 170 million black holes have formed over the galaxy's history and that about 91 percent of them are alone today. Only around a hundred thousand still hold a luminous stellar companion. The work has not yet been peer reviewed.", "refs": ["kara-delikler"], "tr": "Flatiron Enstitüsü'nden Tom Wagg ve arkadaşları, cogsworth adlı araçla Samanyolu'nu baştan işletti: yıldızların doğuşu ve ölümü, çift yıldızların birlikte evrimi ve süpernova patlamasının geride bıraktığı kalıntıya verdiği tepme, aynı hesabın içinde. arXiv'e 24 Temmuz'da yüklenen ön baskı, gökadanın tarihi boyunca yaklaşık 170 milyon kara delik oluştuğunu ve bunların yaklaşık yüzde 91'inin bugün yalnız olduğunu bildiriyor. Işık saçan bir yıldız yoldaşını koruyan kara delik sayısı yalnızca yüz bin dolayında. Çalışma henüz hakem değerlendirmesinden geçmedi."}, {"en": "Nearly everything we know about stellar-mass black holes came from that smallest group. A black hole emits no light of its own; it is found through what it does to something else, through a companion star's motion or the X-rays from matter falling in. If the simulation has the ratio right, the catalogue astronomers have built is a catalogue of exceptions. The model also spreads black holes through a larger volume than the visible stars, giving the population a scale height about 2.5 times that of the visible disc. The prosaic account deserves to be stated first: a survey that can only see pairs returns pairs by construction, and that by itself does not establish that the solitary ones are out there.", "refs": ["kara-delikler"], "tr": "Yıldız kütleli kara delikler hakkında bildiklerimizin neredeyse tamamı, işte bu en küçük gruptan geldi. Kara delik kendi başına ışık salmaz; bir başkasına yaptığı iş üzerinden bulunur — yoldaş yıldızın devinimi, içine düşen maddenin saçtığı X ışınları. Oranı bu benzetim doğru veriyorsa, gökbilimcilerin kurduğu katalog bir istisnalar kataloğudur. Model ayrıca kara delikleri görünür yıldızlardan daha geniş bir hacme yayıyor: dağılımın ölçek yüksekliği görünür diskinkinin yaklaşık 2,5 katı. Sıradan açıklamayı önce söylemek gerekir: yalnızca çiftleri görebilen bir tarama zaten çift bulur ve bu tek başına yalnızların orada olduğunu kanıtlamaz."}]}, {"h": {"en": "What does the number rest on?", "tr": "Sayı neye dayanıyor?"}, "ps": [{"en": "The 91 percent is an output rather than a measurement, and the authors write plainly what it depends on: both the mass distribution and the kinematics are strongly sensitive to remnant-mass prescriptions and natal-kick models. A kick is the recoil a black hole receives when its progenitor explodes asymmetrically. Speed the kicks up and more black holes are torn out of their binaries and thrown into the sparse regions of the galaxy; slow them down and more pairs survive. The 91 percent is therefore a number that slides with the assumption.", "refs": ["kara-delikler"], "tr": "Yüzde 91, bir ölçüm değil bir çıktı ve yazarlar neye bağlı olduğunu açıkça yazıyor: kütle dağılımı da devinimler de kalıntı kütle reçetelerine ve doğuş tepmesi modellerine güçlü biçimde duyarlı. Tepme, öncül yıldız bakışımsız patladığında kara deliğin aldığı geri itme hızıdır. Tepmeleri hızlandırın, daha çok kara delik çiftinden koparılıp gökadanın seyrek bölgelerine savrulur; yavaşlatın, daha çok çift ayakta kalır. Bu durumda yüzde 91, varsayımla birlikte kayan bir sayıdır."}, {"en": "The quantity that matters here is therefore not the 91 percent itself but the width of the range it can take. Knowing how far that fraction retreats when the kick prescription changes teaches more than knowing a single central value. What would narrow the range is an observation that recognises a black hole without needing its companion; a census of that kind would test directly which kick model the galaxy agrees with. Until one arrives, the galaxy's dark population remains a well-built conditional, which is still better than no number at all.", "refs": ["kara-delikler"], "tr": "Bu yüzden buradaki asıl büyüklük yüzde 91'in kendisi değil, alabileceği aralığın genişliği. Tepme reçetesi değiştiğinde bu oranın nereye kadar gerilediğini bilmek, tek bir merkezî değeri bilmekten daha çok şey öğretir. Aralığı daraltacak şey, bir kara deliği yoldaşına ihtiyaç duymadan tanıyan bir gözlemdir; öyle bir sayım, hangi tepme modelinin gökadayla uyuştuğunu doğrudan sınar. O gelene kadar gökadanın karanlık nüfusu, iyi kurulmuş bir koşullu cümle olarak kalıyor — ve bu, hiç sayı olmamasından iyidir."}]}], "sources": [{"key": "kara-delikler", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-simulations-hint-hidden-population-companionless.html", "title": {"tr": "Bir Samanyolu benzetimi, yıldız kütleli kara deliklerin yaklaşık yüzde 91'ini yalnız buluyor", "en": "A Milky Way simulation finds about 91 percent of stellar-mass black holes alone"}, "publishedDate": "2026-08-03", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.22814", "publishedDate": "2026-07-24", "title": {"tr": "Gökada Yeraltını Haritalamak I: Samanyolu kara deliklerinin devinimleri, oluşum hızları ve demografisi üzerine kapsamlı benzetimler", "en": "Charting the Galactic Underworld I: Comprehensive simulations of the kinematics, rates, and demographics of Milky Way black holes"}}}], "title": {"en": "Ninety-one of every hundred black holes are alone", "tr": "Yüz kara delikten doksan biri yalnız"}, "writer": "sci-01", "date": "2026-08-04"}, {"excerpt": {"en": "In multiple sclerosis part of the disability accumulates independently of relapses, and counting relapses does not track it. 18,629 measurements from two large cohorts show that an astrocyte protein in the blood moves with that silent process.", "tr": "Multipl sklerozda engelliliğin bir bölümü ataklardan bağımsız birikiyor ve bu birikim atak sayarak izlenemiyor. İki büyük izlemden gelen 18.629 ölçüm, kandaki bir astrosit proteininin bu sessiz süreçle birlikte hareket ettiğini gösteriyor."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "Disability that accumulates without relapses", "tr": "Ataksız biriken engellilik"}, "ps": [{"en": "For a long time the relapse count was the measure in multiple sclerosis, yet in a share of patients disability grows slowly without any relapse at all. That silent worsening is called progression independent of relapse activity. A prospective observational study published in JAMA Neurology on 3 August looks for a blood measure that can follow exactly this. The data come from two cohorts: the eight-centre SMSC in Switzerland and the single-centre EPIC in the United States. Across 2,329 patients, 18,629 measurements were taken, with median follow-up of 6.9 years in SMSC and 13.1 in EPIC.", "refs": ["gfap"], "tr": "Multipl skleroz izleminde uzun süre atak sayısı ölçü alındı; oysa hastaların bir bölümünde engellilik hiç atak geçirilmeden, yavaşça artıyor. Bu sessiz kötüleşmenin adı ataktan bağımsız ilerleme. JAMA Neurology'de 3 Ağustos'ta yayımlanan ileriye dönük gözlemsel çalışma, tam da bunu izleyebilecek bir kan ölçütü arıyor. Veri iki ayrı izlemden geliyor: İsviçre'de sekiz merkezli SMSC ile Amerika Birleşik Devletleri'nde tek merkezli EPIC. Toplam 2.329 hastadan 18.629 ölçüm alındı; ortanca izlem süresi SMSC'de 6,9, EPIC'te 13,1 yıl."}, {"en": "The protein measured is glial fibrillary acidic protein, which enters the blood when astrocytes, the brain's support cells, are activated or injured. Where the value is elevated, the hazard of worsening independent of relapses rises 1.45-fold in SMSC (95% CI 1.21-1.75) and 1.36-fold in EPIC (1.07-1.71). That it points the same way in two populations of different size, in two countries, followed for different lengths of time, suggests the association is not a feature of a single centre. The lower bound of the EPIC interval is 1.07, so even if the association is real its size may be modest.", "refs": ["gfap"], "tr": "Ölçülen protein, beyindeki destek hücreleri olan astrositler etkinleştiğinde ya da zedelendiğinde kana geçen glial fibriler asidik protein. Değer yüksek olduğunda ataktan bağımsız kötüleşme riski SMSC'de 1,45 kat (yüzde 95 güven aralığı 1,21–1,75), EPIC'te 1,36 kat (1,07–1,71) yükseliyor. İki ayrı ülkede, farklı büyüklükte ve farklı süre izlenmiş iki toplulukta aynı yönde çıkması, bu ilişkinin tek bir merkezin özelliğinden ibaret olmadığını düşündürüyor. Güven aralıklarının alt sınırı EPIC'te 1,07; yani ilişki gerçek olsa bile büyüklüğü mütevazı olabilir."}]}, {"h": {"en": "What do we learn when the value falls?", "tr": "Değer düştüğünde ne öğreniyoruz?"}, "ps": [{"en": "The second finding is the more interesting one. Among patients whose protein level fell after starting treatment, the hazard of progression drops to 0.46 on fingolimod (0.26-0.84) and to 0.33 on B-cell therapies (0.18-0.61). That would mean the measure reflects not only who will worsen but whether a treatment is touching the silent process at all. The strongest counter-reading is plain, though: patients whose protein falls may have been different patients to begin with. An observational design cannot separate a treatment lowering the protein from patients with a better course being steered towards that treatment.", "refs": ["gfap"], "tr": "İkinci bulgu daha ilgi çekici. Tedaviye başladıktan sonra protein düzeyi düşen hastalarda ilerleme riski fingolimod altında 0,46 (0,26–0,84), B hücresine yönelen tedaviler altında 0,33 (0,18–0,61) oranına iniyor. Bu, ölçütün yalnızca kimin kötüye gideceğini değil, tedavinin sessiz sürece dokunup dokunmadığını da yansıtabileceği anlamına gelir. Ancak buradaki en güçlü karşı okuma açık: proteini düşen hastalar, başlangıçta da farklı hastalar olabilir. Gözlemsel bir tasarım, tedavinin proteini düşürmesi ile daha iyi seyirli hastaların o tedaviye yönlendirilmesini birbirinden ayıramaz."}, {"en": "What changes for a patient today? Honestly, little. The study proposes no threshold, says nothing about how often to measure, and does not show that changing treatment on the basis of the protein reduces disability; what it shows is an association. The step that would turn this into a clinical decision is clear: a prespecified trial in which treatment decisions are made from the measure from the outset, reporting its result. If such a trial declares a threshold and a decision rule, patients whose disease progresses without relapses would have a followable target for the first time. Until then this belongs on the research agenda rather than in the patient file.", "refs": ["gfap"], "tr": "Bir hasta için bugün ne değişiyor? Doğrusu, henüz az şey. Çalışma bir eşik değer önermiyor, kaç ayda bir ölçüm yapılacağını söylemiyor ve proteine bakarak tedavi değiştirmenin engelliliği azalttığını göstermiyor; gösterdiği şey bir ilişki. Bunu klinik karara çeviren adım bellidir: tedavi kararlarının baştan bu ölçüte göre verildiği, önceden tanımlanmış bir denemenin sonuç bildirmesi. Böyle bir deneme bir eşik ve bir karar kuralı ilan ederse, ataksız ilerleyen hastalar için ilk kez izlenebilir bir hedef doğar. O zamana kadar bu, hasta dosyasına giren bir bilgi değil, araştırma gündemine giren bir bilgidir."}]}], "sources": [{"key": "gfap", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-08-blood-marker-tracks-hidden-multiple.html", "title": {"tr": "Bir kan proteini, multipl sklerozda ataklar arasında biriken engelliliği izliyor", "en": "A blood protein tracks the disability that accumulates between relapses in MS"}, "publishedDate": "2026-08-03", "primary": {"kind": "paper", "name": "JAMA Neurology", "url": "https://jamanetwork.com/journals/jamaneurology/fullarticle/10.1001/jamaneurol.2026.2500", "publishedDate": "2026-08-03", "title": {"tr": "Multipl sklerozda serum glial fibriler asidik protein seyri, hastalık ilerlemesi ve tedavi yanıtı", "en": "Serum Glial Fibrillary Acidic Protein Dynamics, Disease Progression, and Therapy Response in Multiple Sclerosis"}}}], "title": {"en": "Does a protein see what the relapse count cannot?", "tr": "Bir protein, atak sayısının göremediğini görüyor mu?"}, "writer": "sci-02", "date": "2026-08-04"}, {"excerpt": {"en": "Argo floats measured a pigment a thousand metres down where it should not be. Behind that finding is a line added to the ocean's carbon ledger that scales with the severity of winter.", "tr": "Argo şamandıraları bin metre derinlikte, orada bulunmaması gereken bir pigment ölçtü. Bu bulgunun ardında, okyanusun karbonu derine indiren defterine kışın şiddetiyle ölçeklenen bir kalem eklenmesi var."}, "radarPublishedAt": "2026-08-04T08:11:07+00:00", "sections": [{"h": {"en": "A pigment that should not be at a thousand metres", "tr": "Bin metrede olmaması gereken pigment"}, "ps": [{"en": "Chlorophyll is the pigment of sunlit surface water; inside a particle drifting downward it cannot survive a journey of days, it breaks down and disperses. A study led by the Institute of Marine Sciences (ICM-CSIC) and the Barcelona Supercomputing Center reports that Argo floats in the Labrador and Irminger seas measured chlorophyll near a thousand metres between 2014 and 2017. It surprised lead author Marti Gali too, because the pigment would be expected to break down long before reaching that depth.", "refs": ["konveksiyon"], "tr": "Klorofil, güneş gören yüzey suyunun pigmentidir; aşağı doğru yol alan bir tanecik içinde günler süren bir yolculuğa dayanamaz, çözünür ve dağılır. Deniz Bilimleri Enstitüsü (ICM-CSIC) ile Barselona Süperbilgisayar Merkezi'nin yürüttüğü çalışma, Labrador ve Irminger denizlerinde 2014–2017 arasında Argo şamandıralarının bin metre dolayında klorofil ölçtüğünü bildiriyor. Baş yazar Martí Galí için de sürpriz olan bu, çünkü o derinliğe varmadan çok önce parçalanmış olması beklenirdi."}, {"en": "The explanation lies in the water itself rather than in the biology. In winter, cold and strong winds cool the surface; the cooled water grows heavier and drives down through the layer beneath it. On the way down it takes everything inside it along, living microalgae and organic debris alike. The paper in Science Advances describes this as a route separate from particles settling one by one: here the carbon is carried downward by the motion of the water rather than by gravity. Because the journey ends on a scale of hours rather than days, the pigment has no time to break down.", "refs": ["konveksiyon"], "tr": "Açıklamayı biyolojide değil suyun kendisinde aramak gerekiyor. Kışın soğuk ve sert rüzgârlar yüzey suyunu soğutur; soğuyan su ağırlaşır ve altındaki katmanı delerek hızla iner. İnerken içindeki her şeyi — canlı mikroalgleri, organik kırıntıyı — birlikte götürür. Science Advances dergisindeki çalışma bunu, taneciklerin tek tek çökelmesinden ayrı bir yol olarak tanımlıyor: burada karbonu aşağı taşıyan, yerçekiminden çok suyun kendi hareketidir. Yolculuk gün değil saat ölçeğinde bittiği için pigmentin bozulmaya vakti kalmıyor."}]}, {"h": {"en": "The line that changes in the carbon ledger", "tr": "Karbon defterinde değişen kalem"}, "ps": [{"en": "The magnitude is not trivial. In strong winters this route supplies between 30 percent and 50 percent of the organic particles found between 500 and 2000 m, roughly doubling in the harshest ones. What that means is this: part of the carbon reaching depth in this region depends not on how much was produced in summer but on how hard the winter was. An accounting built on summer production will describe two different years in the same sea with the same number. The counter-reading deserves recording too: the reported fraction holds for the subpolar North Atlantic and cannot be carried directly to basins where deep winter mixing does not operate on this scale.", "refs": ["konveksiyon"], "tr": "Büyüklük önemsiz değil. Güçlü kış mevsimlerinde 500 ile 2000 m arasında bulunan organik taneciklerin yüzde 30 ile yüzde 50 arasındaki bölümünü bu yol sağlıyor; en sert kışlarda katkı yaklaşık iki katına çıkıyor. Bunun anlamı şudur: bu bölgede derine inen karbonun bir bölümü yazın ne kadar üretildiğine değil, kışın ne kadar sert geçtiğine bağlı. Yaz üretimini esas alan bir hesap, aynı denizde iki farklı yılı aynı sayıyla anlatır. Karşı okumayı da kaydetmek gerek: bildirilen oran kutupaltı Kuzey Atlantik için geçerli, kışın derin karışımın bu ölçüde işlemediği havzalara doğrudan taşınamaz."}, {"en": "No lever comes out of this; nobody manages the winter. What comes out is a duty to keep watching. If winter mixing in the subpolar North Atlantic weakens, this route weakens with it and the depth at which the ocean holds carbon in this region is pulled upward. What would register that is unglamorous infrastructure: the same float network, in the same winter months, continuing to measure how deep the mixed layer reaches and whether the pigment is present at a thousand metres. When the next hard winter comes, whether the route still works down to the same depth will be a readable number.", "refs": ["konveksiyon"], "tr": "Buradan bir kaldıraç çıkmıyor; kimse kışı yönetmiyor. Çıkan şey bir izleme sorumluluğu. Kutupaltı Kuzey Atlantik'te kış karışımı zayıflarsa bu yol da zayıflar ve okyanusun bu bölgede karbonu tuttuğu derinlik yukarı çekilir. Bunu görecek olan gösteriş yapmayan bir altyapı: aynı şamandıra ağı, aynı kış aylarında, karışım katmanının ne kadar derine indiğini ve bin metrede pigmentin bulunup bulunmadığını ölçmeyi sürdürürse. Bir sonraki sert kış geldiğinde, bu yolun hâlâ aynı derinliğe kadar işleyip işlemediği okunabi
