licy-insights.html", "title": {"tr": "Tür gözlem verilerini göstergelere çeviren açık veri küpü araçları yayımlandı", "en": "Open data-cube tools that turn species occurrence data into indicators were published"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T08:08:34+00:00", "n": 2, "radarUpdatedAt": "2026-08-02T17:31:24+00:00", "date": "2026-08-02"}, {"writer": "sci-04", "title": {"tr": "İki yapışkan bant, küçük bir pil ve bir renk okuması", "en": "Two adhesive patches, a small battery and a colour reading"}, "excerpt": {"tr": "CF SWIFT adlı düzenek, ter testinin üç ayrı adımını tek bir deri noktasına indiriyor. Tasarımın zarafeti, örneği hiç yolculuğa çıkarmamasında. Teslimata kalan mesafe ise yaşamın ilk ayını gerçekten temsil eden doğrulamada duruyor.", "en": "The system called CF SWIFT collapses three separate steps of the sweat test onto one patch of skin. The elegance of the design is that the sample never travels. The distance left to delivery is validation that truly represents the first month of life."}, "sections": [{"h": {"tr": "Düzeneği parçalarına ayırınca", "en": "Taking the system apart"}, "ps": [{"tr": "Birinci bant, küçük bir lityum-polimer pil ve pilokarpinle çalışan iyontoforez aracılığıyla deride ter üretimini başlatıyor. İkinci bant aynı noktaya yerleşiyor, çıkan teri topluyor ve klorürü renk değişimiyle ölçüyor. Sonuç, bant görüntüsünü işleyen bir telefon uygulamasından okunuyor; bütün işlem bir saatin altında tamamlanıyor. Çalışma npj Digital Medicine dergisinde yayımlandı.", "en": "The first patch starts sweat production through pilocarpine iontophoresis powered by a small lithium-polymer battery. The second sits on the same spot, collects the sweat and measures chloride through a colour change. The result is read by a phone app processing an image of the patch, and the whole procedure finishes in under an hour. The study was published in npj Digital Medicine.", "refs": ["source-one"]}, {"tr": "Standart ter testinde uyarım, toplama ve çözümleme üç ayrı adımdır; örnek, kapilerden şırıngayla çıkarılıp ayrı çözümleme aygıtına taşınır. Buradaki mühendislik hamlesi bu üç adımı aynı deri noktasında birbirine bağlayan bir donanım mimarisi kuruyor; bir tezgâhtaki üç istasyonu tek bir mengeneye toplamak gibi. Kazancın büyük bölümü ortadan kalkan aktarma adımlarından geliyor. Telefonla renk okuması da taşınabilirliği tamamlıyor, fakat doğruluk ile erişilebilirliğe ne kadar katkıyı her parçanın ayrı ayrı yaptığı bu tek karşılaştırmadan çıkmıyor.", "en": "In the standard sweat test, stimulation, collection and analysis are separate steps; sweat is extracted from a capillary with a syringe and moved to another analyser. The engineering move is a hardware architecture linking all three steps at one patch of skin, rather as three stations on a bench are folded into one clamp. Much of the gain comes from transfer steps that disappear. Phone-based colour reading completes the portable workflow, although this single comparison cannot isolate how much each component contributes to accuracy and access.", "refs": ["source-one"]}]}, {"h": {"tr": "Gösterimden teslimata kalan mesafe", "en": "The distance from demonstration to delivery"}, "ps": [{"tr": "Tek merkezli denemede 14 günlükten 21 yaşına kadar 55 kişi yer aldı: 3 sağlıklı yetişkin ve kistik fibroz ya da ilişkili bir durumu olan 52 kişi. Her katılımcı yeni düzenek ve standart yöntemle karşılaştırmalı olarak ölçüldü. İki yöntem arasındaki ortalama sapma 0,43 milimolar, uyum sınırları yaklaşık artı-eksi 12 milimolar olarak bildirildi; eşleşmelerin yüzde 84'ü 10 milimolar içinde kaldı ve hiçbiri 15 milimoları aşmadı. Bu sayılar yüksek korelasyondan daha açıklayıcı, çünkü tanı kararı klorür eşiğinin hangi tarafında kalındığına bağlı.", "en": "The single-centre study included 55 people aged from 14 days to 21 years: 3 healthy adults and 52 people with cystic fibrosis or a related condition. Each participant was measured comparatively with the new platform and the standard method. Mean bias between the methods was 0.43 millimolar and the limits of agreement were about plus or minus 12 millimolar; 84% of pairs were within 10 millimolar and none differed by more than 15. Those figures say more than a high correlation because a diagnosis depends on which side of a chloride threshold a result falls.", "refs": ["source-one"]}, {"tr": "Kohort yaş olarak geniş görünse de yalnız iki katılımcı 12 aylıktan küçüktü ve bir aylıktan küçük hiç kimse yoktu. Oysa geleneksel testte yetersiz ter örneği oranının en yüksek olduğu grup yenidoğanlar ve küçük bebekler. Yazarlar bu nedenle çok merkezli doğrulamayı, uzaktan ev testini ve düzenleyici onayı sonraki adımlar olarak sıralıyor. Bazı yazarların ter analizi cihazları geliştiren Epicore Biosystems ile bağları da makalede açıklanmış. Kurulan platform umut verici; fakat bir tanı aracı, ortalama uyumun yanında en zor yaş grubundaki örnek başarısıyla tamamlanır.", "en": "The cohort looks broad in age, yet only two participants were under 12 months and none was under one month. Neonates and young infants are the group with the highest rate of insufficient sweat samples in conventional testing. The authors therefore identify multicentre validation, remote home testing and regulatory clearance as next steps. The paper also discloses that several authors have ties to Epicore Biosystems, a developer of sweat-analysis devices. The platform is promising, but a diagnostic tool is completed by sampling success in the hardest age group as well as by average agreement.", "refs": ["source-one"]}]}], "sources": [{"key": "source-one", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-wearable-stickers-cystic-fibrosis-diagnosis.html", "title": {"tr": "İki bantlı ter testi, klorür ölçümünü tek deri noktasında birleştirdi", "en": "A two-patch sweat test combined chloride measurement at one skin site"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "npj Digital Medicine", "url": "https://doi.org/10.1038/s41746-026-03056-9", "publishedDate": "2026-07-28", "title": {"tr": "Kistik fibroz tanısı için ter uyarımı ve klorür çözümlemesini birleştiren esnek giyilebilir sistem", "en": "A flexible wearable system for integrated sweat stimulation and chloride analysis in cystic fibrosis diagnosis"}}}], "radarPublishedAt": "2026-08-02T08:08:34+00:00", "n": 2, "radarUpdatedAt": "2026-08-02T17:31:24+00:00", "date": "2026-08-02"}, {"writer": "sci-05", "title": {"tr": "637 hastanın 455'i bir noktada başka bir kompresyon aldı", "en": "455 of 637 patients received a different compression treatment at some point"}, "excerpt": {"tr": "VenUS 6 iyi tasarlanmış bir araştırma ve sonucu da makul. Ama iki sayı, sonucun ne kadar sıkı olduğunu belirliyor: hedeflenen güce ulaşılamaması ve katılımcıların yüzde 71'inin tedavi kolunu bir noktada değiştirmesi.", "en": "VenUS 6 is a well-designed trial and its result is reasonable. But two numbers govern how tight that result is: the intended power was not reached, and 71% of participants changed treatment arm at some point."}, "sections": [{"h": {"tr": "Sonuç ne diyor", "en": "What the result says"}, "ps": [{"tr": "Üç kollu, açık, randomize araştırmaya 637 hasta alındı ve 633'ü çözümlemeye girdi; çoğu toplum temelli olmak üzere 33 merkez yer aldı. Birincil sonuç ölçütü, körlenmiş değerlendiricilerin belirlediği iyileşme süresiydi ve izlem 12 aya kadar sürdü. Kompresyon kılıfı ile yerleşik kanıta dayalı tedavi karşılaştırmasında tehlike oranı 0,78 (0,61–1,00; p = 0,046), kılıf ile iki katmanlı bandaj karşılaştırmasında 0,79 (0,61–1,01; p = 0,056) bulundu. 12 aylık iyileşme oranları sırasıyla yüzde 76,2, yüzde 79,4 ve yüzde 80,1.", "en": "The three-arm, open, randomised trial enrolled 637 patients, of whom 633 entered the analysis, across 33 sites, most of them community-based. The primary outcome was time to healing as determined by blinded assessors, with follow-up of up to 12 months. The hazard ratio was 0.78 (0.61–1.00; p = 0.046) for compression wraps against established evidence-based treatment and 0.79 (0.61–1.01; p = 0.056) for wraps against the two-layer bandage. 12-month healing was 76.2%, 79.4% and 80.1% respectively.", "refs": ["source-one"]}, {"tr": "İki katmanlı bandajın yerleşik tedaviye göre aşağı kalmadığı sonucu tek bir hâlde gelmiyor. Tedavi politikası yaklaşımında tehlike oranı 1,01 (0,79–1,28) ve önceden belirlenmiş 1,33 sınırı karşılanıyor; varsayımsal yaklaşımda 1,16 (0,86–1,58) ve sınır karşılanmıyor. Araştırma planı bu iki farklı tahmin hedefini veriler görülmeden önce belirledi. İlki tedavi değişiklikleriyle birlikte gerçek hayatta bir yöntemi teklif etmenin sonucunu, ikincisi değişiklikler olmasaydı beklenen sonucu soruyor. Aşağı kalmama yorumu yanıtlanan klinik soruya göre değişiyor.", "en": "The conclusion on whether the two-layer bandage is inferior to established treatment takes two forms. Under the treatment-policy strategy the hazard ratio is 1.01 (0.79–1.28) and meets the prespecified margin of 1.33; under the hypothetical strategy it is 1.16 (0.86–1.58) and misses that margin. The trial plan prespecified these two estimands before the data were seen. The first asks what follows from offering a method in real practice with treatment switching; the second asks what might have happened without those changes. The non-inferiority interpretation changes with the clinical question being answered.", "refs": ["source-one"]}]}, {"h": {"tr": "Gücün nereye gittiği", "en": "Where the power went"}, "ps": [{"tr": "Yazarların kendi bildirdiği iki sınırlılık burada belirleyici. Katılımcıların 455'i, yani yüzde 71'i, izlem sırasında atandığından farklı bir kompresyon tedavisi aldı. Ayrıca iyileşme sıklığı örneklem hesabında varsayılandan düşük çıktı; bu yüzden gözlenen iyileşme olayı sayısı yüzde 80 güç için gerekenin epeyce altında kaldı ve hafif bir katılım eksikliği de bunun üzerine bindi. Düşük istatistiksel güç ile yüksek geçişkenlik bir araya geldiğinde, güven aralığının üst ucu tam 1,00'e değen bir sonucu okumak zorlaşır.", "en": "Two limitations the authors report themselves are decisive here. 455 of the participants, that is 71%, received a compression treatment other than the one they were allocated at some point during follow-up. Healing also occurred less often than the sample size calculation assumed, so the number of observed healing events fell well short of what 80% statistical power required, and slight under-recruitment came on top of that. When low power meets high crossover, a result whose confidence interval touches exactly 1.00 becomes hard to read.", "refs": ["source-one"]}, {"tr": "Buradaki hata biçimini adıyla söylemek gerekiyor: sonuç yanlış sayılmaz, yalnızca dar. p = 0,046 ile p = 0,056 arasındaki fark, iki tedavi arasındaki farkı değil olay sayısını yansıtıyor. Kılıfların iyileşmeyi hızlandırmadığı yönündeki ana mesaj ayakta kalıyor, çünkü üç kolun 12 aylık iyileşme oranları birbirine yakın ve hepsi aynı yöne bakıyor. Ayakta kalmayan şey, farkın büyüklüğüne dair herhangi bir kesin ifade.", "en": "The failure mode should be named: the result is narrow rather than wrong. The difference between p = 0.046 and p = 0.056 reflects the number of events, not a difference between the two treatments. The main message, that wraps do not speed healing, stands, because the 12-month healing rates in the three arms are close together and all point the same way. What does not stand is any precise statement about the size of the difference.", "refs": ["source-one"]}]}, {"h": {"tr": "Bir sonraki araştırmanın düzeltmesi gerekenler", "en": "What the next trial has to fix"}, "ps": [{"tr": "Adil olmak gerekiyor: toplum ortamında, körlenmiş değerlendiriciyle ve 12 aya kadar izlemle yürütülen bir araştırma yapmak zordur ve ekip eksikleri açıkça bildirdi. Bir sonraki araştırma için üç öncelik çıkıyor: örneklem büyüklüğünü burada gözlenen iyileşme sıklığına göre kurmak, tedavi değişikliğinin yönü ve nedenini zaman içinde ölçmek ve hangi tahmin hedefinin hangi klinik karara karşılık geldiğini baştan görünür kılmak. Mevcut çalışmanın tahmin hedefleri zaten önceden belirlenmişti. Şimdi güç ve bağlılık verisinin her iki soruyu da yanıtlayacak kadar sağlamlaştırılması gerekiyor.", "en": "Fairness is due: a trial run in community settings, with blinded assessors and follow-up of up to 12 months, is hard to do, and the team reported its shortfalls plainly. Three priorities follow for the next trial: base sample size on the healing incidence observed here, measure the direction and reason for treatment changes over time, and make clear from the outset which estimand corresponds to which clinical decision. The estimands in this study were already prespecified. The remaining priority is power and adherence data strong enough to answer both questions securely.", "refs": ["source-one"]}]}], "sources": [{"key": "source-one", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-compression-advantage-venous-leg-ulcers.html", "title": {"tr": "Venöz bacak ülserlerinde sargı yerine geçmesi beklenen kompresyon kılıfları iyileşmeyi hızlandırmadı", "en": "Compression wraps expected to replace bandaging did not speed healing in venous leg ulcers"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "PLOS Medicine", "url": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1005154", "publishedDate": "2026-07-10", "title": {"tr": "Venöz bacak ülserlerinde kompresyon tedavileri: VenUS 6, açık, çok merkezli, randomize klinik araştırma", "en": "Compression therapies for venous leg ulcers: The VENous Ulcer Study 6 (VenUS 6), an open, multicentre, randomised clinical trial"}}}], "radarPublishedAt": "2026-08-02T08:08:34+00:00", "n": 2, "radarUpdatedAt": "2026-08-02T17:31:24+00:00", "date": "2026-08-02"}, {"writer": "sci-06", "title": {"tr": "Bir bebeğin öğrenmesi, bakışın kendisine açılmasını bekliyor", "en": "An infant's learning waits for a gaze to open towards it"}, "excerpt": {"tr": "Aynı ekran, aynı süre, aynı hece dizileri. Değişen tek şey, konuşmacının gözlerinin görünür olup olmadığıydı. Gözler koyu camın ardına geçtiğinde bebek dinlemeyi sürdürdü ama öğrenmedi.", "en": "The same screen, the same length of time, the same syllable sequences. The only thing that changed was whether the speaker's eyes were visible. When the eyes went behind dark glass the infant went on listening but did not learn."}, "sections": [{"h": {"tr": "Aynı süre ekranda, farklı sonuç", "en": "The same time on the screen, a different outcome"}, "ps": [{"tr": "Birleşik Krallık ve Singapur'da 8 ile 10,5 aylık 47 bebek, hece üçlülerinden kurulmuş üç yapay dili dinledi. Her dil aynı konuşmacıyla eşleştirildi ve konuşmacının gözlüğü şeffaf, kısmen koyu ya da tamamen koyu oldu. Ekrana bakma süresi koşullar arasında anlamlı biçimde değişmedi. İstatistiksel olarak anlamlı öğrenme yalnızca gözlerin bütünüyle göründüğü dilde saptandı; kısmen görünür koşul ise sınırda kaldı. EEG çözümlemesine kullanılabilir kaydı olan 42 bebek girdi. Çalışma Nature Communications dergisinde yayımlandı.", "en": "In the United Kingdom and Singapore, 47 infants aged 8 to 10.5 months heard three artificial languages made from syllable triplets. Each language was paired with the same speaker, whose glasses were clear, partly shaded or fully dark. Time spent looking at the screen did not differ significantly between conditions. Statistically significant learning was detected only for the language presented with fully visible eyes, while the partial-gaze result was borderline. The EEG analysis included the 42 infants with usable recordings. The study was published in Nature Communications.", "refs": ["source-one"]}, {"tr": "Beyin etkinliği ölçümü daha incelikli bir ayrım gösteriyor. Yetişkinden bebeğe yönlü bağlantılar üç bakış koşulunda da saptandı; ancak bütünüyle görünür gözler, bağlantıyı gözlerin görünmediği koşula göre güçlendirdi. Yetişkinden bebeğe bağlantı örüntüsü öğrenmeyi, bebeğin kendi iç bağlantılarından daha iyi yordadı ve bakış ile öğrenme arasındaki ilişkiye aracılık etti. Konuşma ritmine sinirsel eşlenme yalnızca tam bakışta anlamlıydı fakat öğrenmeyi yordamıyordu. Dolayısıyla sonuç, iki beynin yalnız bir koşulda bağlandığını değil, zaten bulunan bağlantının bakışla ağırlık kazandığını söylüyor.", "en": "The brain measurements show a subtler distinction. Directed adult-to-infant connections were detected in all three gaze conditions, but fully visible eyes strengthened connectivity relative to the no-gaze condition. The adult-to-infant connectivity pattern predicted learning better than the infant's within-brain connectivity and mediated the relationship between gaze and learning. Neural entrainment to the speech rhythm was significant only under full gaze, yet did not predict learning. The result therefore does not say that two brains connect in only one condition; it says that gaze changes the weight of connectivity already present.", "refs": ["source-one"]}]}, {"h": {"tr": "47 davranış ölçümünün ve 42 EEG verisinin sınırı", "en": "The limits of 47 behavioural results and 42 EEG datasets"}, "ps": [{"tr": "Bu sonucun taşıyabileceği yükü abartmamak gerekiyor. Davranış örneklemi 47, EEG örneklemi 42 bebekten oluşuyor; iki şehir ve ekran üzerinden sunulan yapay dillerle sınırlı. Tam bakıştaki öğrenme etkisi küçük ile orta arasındaydı, kısmi bakış sonucuysa düzeltilmiş p = 0,058 ile sınırda kaldı. Üstelik yetişkinin videosu ve EEG'si önceden kaydedildiği için gerçek karşılıklılık yoktu; aracılık çözümlemesi de bağımsız bir deneyle nedensel doğrulama gerektiriyor. Bir sonraki sınama, bakışın erişilebilirliğini daha büyük bir örneklemde ve canlı, çift yönlü etkileşim içinde değiştirmeli.", "en": "The weight this result can carry should not be overstated. The behavioural sample comprised 47 infants and the EEG sample 42, limited to two cities and artificial languages presented on a screen. The learning effect under full gaze was small to moderate, while partial gaze was borderline at an adjusted p value of 0.058. Because the adult video and EEG were prerecorded, there was no real reciprocity, and the mediation analysis still requires causal validation in an independent experiment. The next test should vary gaze availability in a larger sample and during live, bidirectional interaction.", "refs": ["source-one"]}, {"tr": "Yine de elde kalan ayrım önemli. Bebekler üç koşulda da ekrana bakmış olsa da öğrenme aynı ölçüde ortaya çıkmadı; toplam görsel dikkat ne koşullar arasında farklıydı ne de öğrenmeyi yordadı. Bu, görünür gözün yalnızca bakışı uzatmadığını, konuşmacıdan bebeğe giden sinirsel bağlantının ağırlığını değiştiren toplumsal bir işaret olabileceğini düşündürüyor. Bunu ekranlar hakkında bir kurala çevirmek doğru değil. Çalışmanın gösterdiği daha dar şey, aynı ses akışı içinde neyin öğrenilmeye değer sayıldığının toplumsal bir ipucuyla değişebilmesi. Gerçek yaşam karşılıklılığının bu etkiyi güçlendirip güçlendirmediği ise hâlâ açık.", "en": "One distinction remains important. Although infants looked at the screen across all three conditions, learning did not emerge equally; total visual attention neither differed between conditions nor predicted learning. This suggests that visible eyes may do more than prolong looking and may change the weight of neural connectivity running from speaker to infant. It would be wrong to turn that into a rule about screens. The narrower result is that a social cue can change which part of an unchanged speech stream is treated as worth learning. Whether real-world reciprocity strengthens that effect remains open.", "refs": ["source-one"]}]}], "sources": [{"key": "source-one", "kind": "news", "name": "Medical Xpress", "url": "https://medicalxpress.com/news/2026-07-eye-contact-infants-tune-speaker.html", "title": {"tr": "Görünür gözler, öğrenmeyle ilişkili yetişkin-bebek bağlantısını güçlendirdi", "en": "Visible eyes strengthened adult-to-infant connectivity associated with learning"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://doi.org/10.1038/s41467-026-75831-x", "publishedDate": "2026-07-22", "title": {"tr": "Yetişkinden bebeğe tek yönlü sinirsel eşlenme, Birleşik Krallık ve Singapur'daki bebeklerde seçici toplumsal öğrenmeye aracılık ediyor", "en": "Adult-to-infant unidirectional neural coupling mediates selective social learning in infants from the United Kingdom and Singapore"}}}], "radarPublishedAt": "2026-08-02T08:08:34+00:00", "n": 2, "radarUpdatedAt": "2026-08-02T17:31:24+00:00", "date": "2026-08-02"}, {"writer": "sci-01", "title": {"tr": "İki milyon X-ışını kaynağı, aynı gökyüzünün üç kez geçilmesinden çıktı", "en": "Two million X-ray sources came out of crossing the same sky three times"}, "excerpt": {"tr": "eROSITA'nın ikinci yayımı yeni bir gökyüzü sunmuyor, aynı gökyüzünün daha derinini sunuyor. Sayının iki katına çıkması keskinleşen bir araçtan çok biriken poz süresinden geliyor ve bu kez olay verisi geride kaldı.", "en": "eROSITA's second release offers no new sky, it offers a deeper look at the same one. The doubling comes from accumulated exposure rather than a sharper instrument, and this time the event data stayed behind."}, "sections": [{"h": {"tr": "Üç geçişin toplamı", "en": "The sum of three passes"}, "ps": [{"tr": "Katalogda 1,9 milyon üzerinde noktasal kaynak ve yaklaşık 64.000 yayılı kaynak var; toplam iki milyona yaklaşıyor ve ilk yayımın kabaca iki katı. Hepsi Samanyolu'nun batı yarısına düşen gökyüzünden, 0,2-2,3 keV bandında. Gözlemler 12 Aralık 2019 ile 16 Haziran 2021 arasında, 556 günlük tarama çalışmasında toplandı. Noktasal olanların çoğu yıldızlar ve etkin galaksi çekirdekleri; yayılı olanlar galaksi kümeleri, yakın galaksiler ve süpernova kalıntıları.", "en": "The catalogue holds more than 1.9 million point-like sources and about 64,000 extended ones, close to two million in all and roughly twice the first release. All of it comes from the sky that falls to the western half of our galaxy, in the 0.2-2.3 keV band. Observations were collected between 12 December 2019 and 16 June 2021 across 556 days of survey operations. Most of the point-like ones are stars and active galactic nuclei; the extended ones are galaxy clusters, nearby galaxies and supernova remnants.", "refs": ["erosita"]}, {"tr": "Aradaki fark yeni bir teleskoptan ya da daha geniş bir gökyüzünden gelmiyor. Aynı alan üç kez tarandı ve üç geçiş üst üste kondu; biriken poz süresi, ilk geçişte gürültünün içinde kalan kaynakları eşiğin üstüne taşıdı. Ölçme gücünün derinlikle nasıl arttığının doğrudan bir örneği bu: gökyüzü büyümedi, sayılabilir olan büyüdü. Artışın tamamının poz süresinden geldiğinden emin olunamaz; saptama zincirindeki ya da ayarlamadaki bir değişiklik aynı yönde çalışırdı. Yayım kazancı derinliğe bağlıyor, ikisini ayırmaksa iki yayımın aynı alanda karşılaştırılmasını gerektirir.", "en": "The difference does not come from a new telescope or a wider sky. The same field was surveyed three times and the three passes were summed; the accumulated exposure lifted above the threshold sources that had stayed inside the noise on the first pass. It is a direct illustration of how measuring power grows with depth: the sky did not get bigger, the countable part of it did. One cannot be certain that the whole increase comes from exposure, since a change in the detection chain or in calibration would push the same way. The release attributes the gain to depth; separating the two would take a comparison of both releases over the same field.", "refs": ["erosita"]}]}, {"h": {"tr": "Katalog verildi, olay verisi verilmedi", "en": "The catalogue came, the event data did not"}, "ps": [{"tr": "İlk yayım ayarlanmış olay verisini ve üst düzey ürünleri de içeriyordu. İkincisi yalnızca kataloglardan oluşuyor. Fark teknik görünür, sonucu bağlayıcıdır: katalogdaki bir kaynağı kullanabilirsiniz, katalogda olmayan bir kaynağı arayamazsınız. Neyin kaynak sayıldığına ortaklığın kendi çözümlemesi karar verdi ve bağımsız bir grup bu kararı kendi eşikleriyle yeniden veremiyor.", "en": "The first release also carried calibrated event data and higher-level products. The second consists of catalogues alone. The difference looks technical and its consequence is binding: you can use a source that is in the catalogue, but you cannot go looking for one that is not there. What counts as a source was settled by the consortium's own analysis, and an outside group cannot take that decision again at its own thresholds.", "refs": ["erosita"]}, {"tr": "Aynı sırada Bonn Üniversitesi'nden bir ekip, A3266 galaksi kümesinin çevresinde kümeden en yakın kuzeybatı grubuna uzanan bir X-ışını lifi bildirdi. Bu türden bir sonuç tam olarak eşiğin en çok önem taşıdığı yerde duruyor: küme dış bölgelerindeki sönük yayılım, saptama ölçütündeki küçük bir değişiklikle var ya da yok görünebilir. İki milyon satırın her biri böyle bir kararı taşıyor ve o kararlar bundan sonraki her çalışmaya miras kalıyor.", "en": "Alongside it, a team at the University of Bonn reported an X-ray filament in the environs of the galaxy cluster A3266, running from the cluster towards its nearest north-western group. A result of that kind sits exactly where the threshold matters most: faint emission in cluster outskirts can appear or disappear under a small change in the detection criterion. Each of the two million lines carries a decision like that, and those decisions are inherited by every study that starts here.", "refs": ["erosita"]}]}, {"h": {"tr": "Sönük uçta ne kalır", "en": "What survives at the faint end"}, "ps": [{"tr": "Bir katalog ölçümün kendisi değildir, yorumlanmış hâlidir. Bu yüzden sönük uçtaki kaynakların ne kadarının gerçek olduğu sorusu kataloğun içinden yanıtlanamaz. Yanıtı ya farklı bir yöntemle bağımsız gözlem yapan bir araç verecek, ya da olay verisi yayımlandığında bir başka grubun kendi eşikleriyle yeniden saydığı sayılar.", "en": "A catalogue is not the measurement itself, only the measurement already interpreted. That is why the question of how much of the faint end is real cannot be answered from inside the catalogue. The answer will come either from an instrument observing independently by a different method, or from the numbers another group counts at its own thresholds once the event data are released.", "refs": ["erosita"]}]}], "sources": [{"key": "erosita", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-homing-ray-sky-erosita.html", "title": {"tr": "eROSITA ortaklığı, iki milyona yakın kaynak içeren ikinci X-ışını kataloğunu yayımladı", "en": "The eROSITA consortium published a second X-ray catalogue holding close to two million sources"}, "publishedDate": "2026-07-31", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.28140", "publishedDate": "2026-07-30", "title": {"tr": "A3266 çevresinde büyük ölçekli yapı oluşumu üzerine bir çalışma: içe düşen gruplar, lifler ve birleşme öncesi soğuk cephe", "en": "A study of the large-scale formation in the environment of A3266: Infalling groups, filaments, and a premerger cold front"}}}], "date": "2026-08-01"}, {"writer": "sci-02", "title": {"tr": "Bir kılıfın yapısı çözüldü, hasta hâlâ birkaç basamak uzakta", "en": "The structure of a coat was resolved; the patient is still several steps away"}, "excerpt": {"tr": "Kromozomlar tam ayrılamadığında geriye kalan ince DNA ipliğini ESCRT-III proteinleri kaplıyor. Düzeneğin yapısı çözülmüş durumda. Yazarların kendi cümlesi ise daha önemli: bu düzenek ile kanser gelişimi arasında doğrudan bir bağ gösterilmedi.", "en": "When chromosomes fail to separate fully, ESCRT-III proteins coat the thin strand of DNA left behind. The structure of the mechanism has been resolved. The authors' own sentence matters more: no direct link was shown between this mechanism and cancer development."}, "sections": [{"h": {"tr": "Görülen düzenek", "en": "The mechanism that was seen"}, "ps": [{"tr": "Hücre bölünürken kromozomlar her zaman temiz ayrılmıyor. Geriye kalan ince DNA köprüsü kardeş hücreleri birbirine bağlıyor ve kopması genomu bozuyor. Çalışma, ESCRT-III proteinlerinin bu köprünün çevresinde bir kılıf kurduğunu, NoCut denetim noktasının da bölünmenin tamamlanmasını kılıfın kurulmasına yetecek kadar geciktirdiğini gösteriyor.", "en": "When a cell divides, the chromosomes do not always come apart cleanly. The thin DNA bridge left behind ties the daughter cells together, and breaking it damages the genome. The study shows that ESCRT-III proteins assemble a coat around this bridge, and that the NoCut checkpoint delays completion of division long enough for the coat to form.", "refs": ["escrt"]}, {"tr": "Yöntem yığını burada önemli. Protein-DNA yapısı kriyo-elektron mikroskobuyla çözüldü, floresanla işaretlenmiş proteinler canlı hücrede izlendi, kendiliğinden oluşan köprüler geniş hücre topluluklarında çözümlendi ve köprü sıklığı protein baskılamayla bilinçli olarak yükseltildi. Nadir bir olayın seyrek görüntülerine bakmak yerine olayı çoğaltıp kılıfın kurulmasını gerçek zamanlı izlemek, yapının durağan bir resimden çıkarılması ile kurulurken görülmesi arasındaki farkı yaratıyor.", "en": "The stack of methods matters here. The protein-DNA structure was resolved by cryo-electron microscopy, fluorescently labelled proteins were followed in living cells, naturally occurring bridges were analysed across large cell populations, and the frequency of bridges was deliberately raised by inhibiting proteins. Multiplying a rare event and watching the coat assemble in real time, rather than looking at sparse images of it, is the difference between inferring a structure from a static picture and seeing it built.", "refs": ["escrt"]}]}, {"h": {"tr": "Kanserle bağın kurulmadığı yer", "en": "Where the link to cancer stops"}, "ps": [{"tr": "DNA köprüleri genom kararsızlığıyla ve kansere erken eşlik eden olaylarla ilişkilendiriliyor. Bu ilişki gerçek, ama çalışma bu düzenek ile kanser gelişimi arasında doğrudan bir bağ göstermiyor. Yazarların kendi ifadesiyle söylenen budur. Kılıfı güçlendirmenin ya da bozmanın kanser riskini değiştireceği sonucu bu verilerden çıkmıyor; kılıf, yedeği bulunan birkaç korumadan biri de olabilir, o durumda yokluğu telafi edilir.", "en": "DNA bridges are associated with genome instability and with events that accompany early cancer. That association is real, yet the study does not show a direct link between this mechanism and cancer development. That is the authors' own statement. The conclusion that strengthening or disrupting the coat would change cancer risk does not follow from these data; the coat may be one of several protections with a backup, in which case its absence is compensated.", "refs": ["escrt"]}, {"tr": "Böyle bir bağın kurulması için ne gerektiği bellidir. ESCRT işlevinin geri kalanı yerinde dururken yalnızca bu kılıfın kaldırıldığı hücreler ya da hayvanlar, dönüşüm olaylarını sayacak kadar uzun süre izlenmelidir. Ardından insan genetiğinden gelen bir işaret gelmelidir. Aradaki mesafe yıllarla ölçülür. Bunu söylemek çalışmanın değerini düşürmez; yalnızca bugün hangi cümlenin kurulabileceğini belirler.", "en": "What such a link would require is clear. Cells or animals in which only this coat is removed while the rest of ESCRT function stays in place would have to be followed long enough to count transformation events. A signal from human genetics would have to follow. The distance is measured in years, and saying so does not diminish the work; it only fixes which sentence can be written today.", "refs": ["escrt"]}]}, {"h": {"tr": "Hastanın yerinde duran model", "en": "The model standing where the patient is"}, "ps": [{"tr": "Burada hasta yok. Kültürdeki insan hücreleri var, tümör yok, doku yok, sonuç ölçütü yok. Yapısal bir soru için doğru basamak da zaten budur; eleştiri değil, tanımdır. Klinik açıdan bugün alınabilecek şey, bir sonraki çalışma bu düzeneğe dayanan bir tedavi açısı öne sürdüğünde sorulacak sorunun hazır olmasıdır: kılıf kaldırıldığında hücrede ne oluyor, ve bu, sayılabilen bir hastalık sonucuna bağlanıyor mu?", "en": "There is no patient here. There are human cells in culture, no tumour, no tissue, no outcome measure. That is the right stage for a structural question; this is a description rather than a criticism. What can be taken clinically today is that the question is ready for the next paper that proposes a therapeutic angle from this mechanism: what happens in the cell when the coat is removed, and does it connect to a disease outcome anyone can count?", "refs": ["escrt"]}]}], "sources": [{"key": "escrt", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-newly-mechanism-dna-cell-division.html", "title": {"tr": "Bölünen hücreler arasında kalan DNA köprülerini bir protein kılıfının koruduğu bulundu", "en": "A protein coat was found to shield the DNA bridges left between dividing cells"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Nature Structural \u0026 Molecular Biology", "url": "https://doi.org/10.1038/s41594-026-01841-4", "publishedDate": "2026-07-15", "title": {"tr": "ESCRT-III, yanlış ayrılmış DNA'nın çevresinde toplanarak genom kararlılığını koruyor", "en": "ESCRT-III assembles around mis-segregated DNA to protect genome stability"}}}], "date": "2026-08-01"}, {"writer": "sci-03", "title": {"tr": "Yüzgeç yasakları yürürlüğe girdi, ticaret akışı yerinde kaldı", "en": "The fin bans took effect and the trade flow stayed where it was"}, "excerpt": {"tr": "Düzenlemeyi benimseyen ülkelerin dışsatımı, dışalımı, iç tüketimi ve ticaret ortağı sayısı ölçülebilir biçimde değişmedi. Bu, kuralın boşa gittiğini kanıtlamaz; ölçtüğümüz büyüklüğün kuralın hedeflediği yerden bir adım uzakta durduğunu gösterir ve köpekbalığı nüfuslarının, çevrelerindeki deniz ekosistemlerinin durumunu ölçmeden bırakır.", "en": "Exports, imports, domestic consumption and the number of trade partners did not measurably change in the countries that adopted the rules. That does not establish that the rules were wasted; it shows that the quantity we measure sits one step away from where the rules aim, and it leaves the state of shark populations and of the marine ecosystems around them unmeasured."}, "sections": [{"h": {"tr": "Kuralın hedefi ile ölçülen büyüklük", "en": "What the rule aims at and what gets measured"}, "ps": [{"tr": "Çözümleme, yüzgeç kesimi düzenlemesi getiren ülkeleri kuralı benimsemeden önce ve sonra karşılaştırdı, düzenleme getirmeyen ülkeleri de denetim grubu olarak kullandı. Dışsatım, dışalım, iç tüketim ve ticaret ortağı sayısında istatistiksel olarak anlamlı bir değişiklik bulunmadı. Veri, balıkçılık ürünlerini tedarik zinciri boyunca birbirine bağlayan ve 2024'te yayımlanan ARTIS kümesinden geliyor; avlananla ticareti yapılanı birlikte görmeyi ilk kez bu bağlantı sağlıyor.", "en": "The analysis compared countries that introduced finning regulations before and after adoption, using countries without regulations as a control group. No statistically significant change was found in exports, imports, domestic consumption or the number of trade partners. The data come from ARTIS, released in 2024, which links fishery products along the supply chain; that link is what first makes it possible to see catch and trade together.", "refs": ["shark"]}, {"tr": "Kuralın hedefi güvertede olan şeydir: yüzgecin alınıp gövdenin denize atılması. Ölçülen büyüklük ise gümrük sınırından geçen tonajdır. Bir kural iniş uygulamasını değiştirip ticaret hacmini yerinde bırakabilir. Ticaret düzenleme getirmemiş ortaklara kayabilir ve toplam talep hiç kıpırdamaz. Düzenleme gerçekten etkisiz de kalmış olabilir. Dördüncü bir olasılık daha var: ticaret istatistiği ürünü öyle kaba sınıflandırıyordur ki değişiklik zaten görünmez. Bu çözümleme dördünü birbirinden ayıramaz; yazarlar da ayırdığını söylemiyor.", "en": "What the rule aims at is what happens on deck: the fin taken and the body thrown back. What gets measured is the tonnage that crosses a customs boundary. A rule can change landing practice and leave trade volume where it was. Trade can shift to partners that adopted nothing while total demand never stirs. The regulation may also genuinely have had no effect. A fourth possibility remains: the trade statistics classify the product so coarsely that any change is invisible from the start. This analysis cannot separate the four, and the authors do not claim that it does.", "refs": ["shark"]}]}, {"h": {"tr": "Kolun tutulduğu yer", "en": "Where the lever is held"}, "ps": [{"tr": "ARTIS avlananla ticareti yapılanı bağladığı için, düzenlemenin izinin aranacağı yer toplam akış değil karaya çıkarılan ürünün bileşimidir. Toplam akış, zincirin en sonundaki toplamdır; bir kuralın ilk değiştirdiği şey ise zincirin başındaki uygulamadır. Aradaki her adım, farkı seyrelten bir işlem yapar. Bu yüzden akışa bakarak boş çıkan bir sonuç, kuralın etkisiz olduğunu değil, ölçümün yanlış halkada durduğunu da anlatabilir. Korunmak istenen stok ise zincirin daha da gerisinde duruyor: köpekbalığı nüfusları ve bağlı oldukları deniz ekosistemleri.", "en": "Because ARTIS links catch to trade, the place to look for the trace of the regulation is the composition of landed product rather than aggregate flow. Aggregate flow is the total at the far end of the chain, while the first thing a rule changes is practice at its start. Every step in between performs an operation that dilutes the difference. So an empty result read from flow can equally say that the measurement stands on the wrong link rather than that the rule has no effect. The stock the rule sets out to protect sits further back still: shark populations and the marine ecosystems they hold together.", "refs": ["shark"]}, {"tr": "ARTIS'in gösterdiği durağan ticaret akışı karşısında, kuralı benimseyen ülkedeki balıkçının üstlendiği uyum maliyeti bir üstünlüğe dönüşmüyor. Gövdeyi de taşımak yer ve yakıt demektir; düzenleme getirmemiş ortak bunu ödemez. Piyasa kıpırdamadığında bu bedel yalnızca eşitsiz dağılır. Biyoçeşitlilik açısından bakıldığında da durum aynı kapıya çıkıyor: balıkçılık ölümlülüğü ölçülmediği sürece, bir yasağın nesli tehlikedeki türler üzerindeki etkisi kâğıt üzerinde kalır. İzlenmesi gereken şey kuralın kapsamı değil, hangi tarafın hangi bedeli ödediğidir.", "en": "The compliance cost carried by the fisher in the adopting country does not turn into an advantage against the flat trade flow ARTIS shows. Carrying the body as well means space and fuel; the partner that adopted nothing does not pay for it. When the market does not move, that cost is simply distributed unevenly. Seen from biodiversity the situation comes out at the same door: as long as fishing mortality goes unmeasured, the effect of a ban on threatened species stays on paper. What needs tracking is which party pays which cost, rather than the reach of the rule on paper.", "refs": ["shark"]}]}, {"h": {"tr": "Sırada hangi sayı var", "en": "Which number comes next"}, "ps": [{"tr": "Yazarlar denetimi ve tedarik zinciri davranışını hâlâ araştırılması gereken alanlar olarak gösteriyor; doğru sıralama da budur. ARTIS'in av ile ticareti bağlayan yapısı, düzenleme getiren ve getirmeyen ülkelerde karaya çıkarılan ürünün biçiminin karşılaştırılmasına yeter. Bir fark önce orada görünmelidir. Orada da görünmezse, kuralın etkisiz kaldığı okuması belirgin biçimde güçlenir. Toplam akışa bakarak beklemek ise, hangi yanıt çıkarsa çıksın onu yorumlayamamak demektir.", "en": "The authors name enforcement and supply-chain behaviour as the areas still to be investigated, and that is the right order. The catch-to-trade structure of ARTIS is enough to compare the form of landed product in countries with and without regulations. A difference should show up there first. If it does not show up there either, the reading that the rule had no effect becomes markedly stronger. Waiting on aggregate flow instead means being unable to interpret whichever answer arrives.", "refs": ["shark"]}]}], "sources": [{"key": "shark", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-shark-finning-significantly-global-analysis.html", "title": {"tr": "Yüzgeç kesimi kuralları, küresel yüzgeç ticaretinde ölçülebilir bir etki göstermedi", "en": "Shark-finning rules showed no measurable effect on the global fin trade"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://doi.org/10.1038/s41467-026-75625-1", "publishedDate": "2026-07-31", "title": {"tr": "Yüzgeç kesimi düzenlemelerine küresel ticaretin tepkileri", "en": "Global trade responses to shark finning regulations"}}}], "date": "2026-08-01"}, {"writer": "sci-04", "title": {"tr": "Bir biti çevirmenin enerjisi, darbenin biçiminden yeniden hesaplandı", "en": "The energy of flipping a bit was recalculated from the shape of the pulse"}, "excerpt": {"tr": "Edinburgh'daki grup malzemeyi değiştirmedi, darbeyi değiştirdi. Benzetimde anahtarlama enerjisi bugünkü bellek teknolojilerinin kat kat altına iniyor. Parçalarına ayırınca tasarrufun nerede durduğu da görünüyor: darbeyi üretecek düzeneğin bedeli hesabın dışında.", "en": "The Edinburgh group did not change the material, it changed the pulse. In simulation the switching energy falls orders of magnitude below today's memory technologies. Take it apart and you can see where the saving sits: the price of the machine that would generate the pulse is outside the calculation."}, "sections": [{"h": {"tr": "Değiştirilen parça", "en": "The component that was changed"}, "ps": [{"tr": "Yapılan iş şu: en iyi denetim kuramı, van der Waals tek katmanında mıknatıslanmayı çeviren çok hızlı bir manyetik alan darbesinin biçimini hesaplıyor. Karşılaştırma tabanları DRAM, STT-MRAM ve daha yeni SOT-MRAM. Elde edilen enerjiler bu üçünün birkaç kat altında ve yazarlar bunları, tek bir bitin işlenmesi için ısıl alt sınır olan Landauer sınırına yaklaşan değerler olarak tanımlıyor. Çalışma bütünüyle hesaplamalı: aygıt üretilmedi, ölçülmedi.", "en": "Here is what was done: optimal control theory computes the shape of a very fast magnetic field pulse that reverses the magnetisation of a van der Waals monolayer. The comparison baselines are DRAM, STT-MRAM and the newer SOT-MRAM. The energies obtained sit orders of magnitude below all three, and the authors describe them as approaching the Landauer limit, the thermal floor for processing a single bit. The work is entirely computational: no device was built and none was measured.", "refs": ["pulse"]}, {"tr": "En iyi denetim kuramıyla biçimlendirilen alan, mıknatıslanmanın dönme hareketiyle çekişmek yerine ona uyduğu için kazanç malzemeden bağımsız duruyor. Kaba bir alan hedefe doğru iter ve aşmanın bedelini öder. Bu, malzemeler arasında taşınabilen türden bir düzenektir ve yazarların matematiğin elektrik akımlarına ve lazer darbelerine genişletilebileceğini söylemesinin nedeni de budur; aynı cümlede bunun denenmediğini de söylüyorlar. Kazancın büyük bölümünün darbenin biçiminden çok kısalığından gelmesi de olanaklıdır; ikisini ayırmak, aynı süreli biçimlendirilmemiş bir darbeyle karşılaştırma gerektirir.", "en": "The field shaped by optimal control theory follows the precession of the magnetisation instead of fighting it, so the gain stands independent of the material. A blunt field pushes towards the target and pays for the overshoot. This is the kind of mechanism that carries between materials, which is why the authors say the mathematics could extend to electrical currents and laser pulses, and in the same breath say it has not been tried. It is equally possible that most of the gain comes from the pulse being short rather than from its shape; separating the two would take a comparison against an unshaped pulse of the same duration.", "refs": ["pulse"]}]}, {"h": {"tr": "Faturanın kaydığı yer", "en": "Where the bill moves to"}, "ps": [{"tr": "DRAM, STT-MRAM ve SOT-MRAM için verilen sayılar, çalışan bir bellekte adreslenmiş bir hücrenin yazma enerjileridir. Benzetimdeki sayı ise ideal bir alan altında tek bir katmanın mıknatıslanmasını çevirmek için gereken enerjidir. Bunlar farklı muhasebe sınırlarıdır. Belirli bir biçime sahip, pikosaniye ölçeğinde bir alan profilini üretmek bedavaya gelmez ve o alanı komşusuna değil tek bir hücreye ulaştırmak ayrı bir sorundur. Yayımlanan duyuruda bu bedelin hesaba katılıp katılmadığı belirtilmiyor.", "en": "The figures given for DRAM, STT-MRAM and SOT-MRAM are the write energies of an addressed cell inside a working memory. The figure from the simulation is the energy needed to reverse the magnetisation of a single layer under an ideal field. Those are different accounting boundaries. Producing a picosecond-scale field profile of a particular shape does not come free, and delivering that field to one cell rather than its neighbour is a separate problem. The announcement does not state whether this cost was included.", "refs": ["pulse"]}, {"tr": "Van der Waals tek katmanından bir belleğe giden yolda dört ayrı adım duruyor. Saymak bu sonucu küçültmez, yerine oturtur. Çalışma sıcaklığında durumunu koruyan bir tek katman gerekiyor. Tasarlanan profili üreten bir alan kaynağı gerekiyor. Alanın komşu hücreleri etkilemeden adreslenmesi gerekiyor. Ve enerjinin spin dizgesine ulaşan bölümünde değil, kaynağın uçlarında ölçülmesi gerekiyor. Dördü ayrı adımdır ve hiçbiri bu makalede yoktur.", "en": "The path from a van der Waals monolayer to a memory holds four separate steps, and counting them does not shrink the result, it places it. A monolayer that holds its state at operating temperature is needed. A field source that produces the designed profile is needed. Addressing so that the field does not reach neighbouring cells is needed. And the energy has to be measured at the terminals of the source rather than in the part that reaches the spin system. Those are four separate steps and none of them is in this paper.", "refs": ["pulse"]}]}, {"h": {"tr": "Rakamı ayakta tutacak ölçüm", "en": "The measurement that would keep the number standing"}, "ps": [{"tr": "Sayıyı sınayacak şey bellidir: gerçek bir van der Waals tek katmanında yapılmış, enerjiyi spine ulaşan bölümde değil kaynakta bildiren bir laboratuvar gösterimi. O gelene kadar sonuç, olduğu şey olarak okunmalıdır; ideal bir darbenin biçimine dair bir denetim kuramı sonucudur. Gerçek bir katkıdır bu; duyurudaki sayıdan daha küçük bir savdır.", "en": "What would test the number is clear: a laboratory demonstration in a real van der Waals monolayer that reports the energy at the source rather than in the part that reaches the spin. Until that arrives, the result should be read as what it is, a control-theory result about the shape of an ideal pulse. It is a genuine contribution, and it is a smaller claim than the number in the announcement.", "refs": ["pulse"]}]}], "sources": [{"key": "pulse", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-optimized-magnetic-pulses-memory-energy.html", "title": {"tr": "Benzetimler, biçimlendirilmiş manyetik darbelerin bellek anahtarlama enerjisini keskin biçimde düşürebileceğini bildiriyor", "en": "Simulations report that shaped magnetic pulses could sharply cut memory switching energy"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Advanced Materials", "url": "https://doi.org/10.1002/adma.202523059", "publishedDate": "2026-07-14", "title": {"tr": "En iyi denetim, van der Waals mıknatıslarında çok hızlı ve enerji açısından verimli mıknatıslanma çevrimini sağlıyor", "en": "Optimal Control Drives Ultrafast and Energy-Efficient Magnetization Switching in Van der Waals Magnets"}}}], "date": "2026-08-01"}, {"writer": "sci-05", "title": {"tr": "Bir olasılık haritasında ortalama, her zaman sıfırın üstünde çıkar", "en": "On a probability map the mean always comes out above zero"}, "excerpt": {"tr": "Courville ve arkadaşları Mars'ın buz haritasını sınırlardan olasılıklara çevirdi. Kendi yazdıkları uyarı haritadan daha öğretici: model uzayı sıfırdan yüze kadar buz içerdiği için ortalama buz oranı, veri buzu desteklemediğinde bile sıfırın üstünde kalıyor.", "en": "Courville and colleagues turned the Mars ice map from boundaries into probabilities. The caution they wrote themselves teaches more than the map: because the model space runs from zero to a hundred percent ice, the mean ice content stays above zero even where the data disfavour ice."}, "sections": [{"h": {"tr": "Neyin olasılığı", "en": "The probability of what"}, "ps": [{"tr": "Tasarım açık: dört ayrı kanıt türü Bayes çerçevesinde birleşiyor. Mars Odyssey'in nötron izge ölçeri üst yarım metredeki suya eşdeğer hidrojeni veriyor, Mars Global Surveyor ile Mars Reconnaissance Orbiter'ın ısıl verisi ısıl ataleti, SHARAD radarı dielektrik geçirgenliği, yörüngeden haritalanan sekiz buz göstergesi arazi türü de biçimi. Her biri bir olasılık yoğunluğu üretiyor, yoğunluklar çarpılıyor ve 60 güney ile 60 kuzey enlemleri arasında hava, buz ve kayaç oranlarının sonsal dağılımı çıkıyor.", "en": "The design is explicit: four kinds of evidence combine in a Bayesian framework. Mars Odyssey's neutron spectrometer gives water-equivalent hydrogen in the upper half-metre, thermal data from Mars Global Surveyor and Mars Reconnaissance Orbiter give thermal inertia, the SHARAD radar gives dielectric permittivity, and eight ice-indicative terrain types mapped from orbit give the shape. Each produces a probability density, the densities are multiplied, and between 60 south and 60 north what comes out is a posterior distribution over the fractions of air, ice and rock.", "refs": ["mars"]}, {"tr": "Sayılar da açık. Yüzeye yakın buz her iki yarıkürede yaklaşık 45 dereceden kutuplara doğru olası. Kuzey Alba Patera için fazla buz olasılığı yüzde 56,6, ortanca buz oranı yüzde 42,4; Hellas Planitia için yüzde 59,7 ve yüzde 44,3. Ekvator kuşağında, 30 güney ile 30 kuzey arasında, gözenek dolduran buz dışlanamıyor ama büyük miktarlar destek görmüyor ve en büyük olabilirlik çoğu yerde sıfıra yakın çıkıyor.", "en": "The numbers are explicit too. Near-surface ice is likely poleward of about 45 degrees in both hemispheres. For North Alba Patera the probability of excess ice is 56.6 percent with a median ice content of 42.4 percent; for Hellas Planitia, 59.7 percent and 44.3 percent. In the equatorial belt, between 30 south and 30 north, pore-filling ice cannot be excluded but large amounts find no support, and the maximum likelihood comes out near zero in most places.", "refs": ["mars"]}]}, {"h": {"tr": "Hangi istatistiğin okunduğu sonucu değiştirir", "en": "Which statistic is read changes the answer"}, "ps": [{"tr": "Yazarlar model uzayı sıfırdan yüz oranına kadar buz içerdiği için ortalama buz oranının her zaman sıfırın üstünde çıktığını, ortanca değerlerin yanıltıcı olabileceğini ve tutucu kestirim olarak en büyük olabilirlik ile bir sigmalık alt sınırın kullanılması gerektiğini yazıyor. Bu bir sunum ayrıntısı sayılamaz. Ortanca ile en büyük olabilirlik aynı sonsal dağılımı iki ayrı yerinden anlattığı için, iniş yeri seçen biri hangisini okuduğuna göre başka bir gezegen görür.", "en": "The authors write that because the model space includes ice from zero to a hundred percent the mean ice content always comes out above zero, that median values can be misleading, and that maximum likelihood and the one-sigma lower bound should be used as conservative estimates. This cannot be counted as a matter of presentation. Because the median and the maximum likelihood describe the same posterior from two different places, someone choosing a landing site sees a different planet depending on which one is read.", "refs": ["mars"]}, {"tr": "Belirsizliğin kendisi de içeriden geliyor. Araç hataları, kayaç yoğunluğu için metreküp başına 2.500-3.500 kilogramlık aralık gibi fiziksel özellik aralıkları ve kuramsal model belirsizliği yayılıyor; yazarlar bu belirsizlik kestirimi için yerinde bir ölçüm bulunmadığını açıkça yazıyor. Buna bir de derinlik ekleniyor. Araçlar ilk metre kadarına ulaşıyor, model ise üst beş metrenin türdeş olduğunu varsayıyor. Bir ile beş metre arasındaki bölgede sonsal dağılımı taşıyan şey veri değil varsayımdır. Varsayımın yeterli olduğu yerler de vardır elbette; buzun tek bir süreçle yerleştiği bir alanda türdeşlik iyi bir yaklaşımdır.", "en": "The uncertainty itself comes from inside as well. Instrument errors, ranges for physical properties such as 2,500 to 3,500 kilograms per cubic metre for rock density, and theoretical model uncertainty are all propagated; the authors write plainly that no in-place measurement exists for checking this uncertainty estimate. Depth is added on top. The instruments reach about the first metre, while the model assumes the upper five metres are homogeneous. In the band between one and five metres what carries the posterior is the assumption rather than the data. There are of course places where the assumption is fine: where ice was emplaced by a single process, homogeneity is a good approximation.", "refs": ["mars"]}]}, {"h": {"tr": "Neyi doğrulama sayarız", "en": "What would count as a check"}, "ps": [{"tr": "Doğrulamanın nasıl yapılacağı da bu makaleden çıkarılabilir. Mars'ta haritalanmış bir noktaya bir araç ulaştığında dürüst karşılaştırma, yazarların önerdiği en büyük olabilirlik ve bir sigmalık alt sınır üzerinden yapılmalıdır. Ortancaya bakılırsa çerçeve, kendi uyardığı biçimde iyimser görünür. Bir ile beş metre arasındaki boşluk ise ancak daha yüksek frekanslı bir radarla kapanır. Bunlardan biri gerçekleşene kadar harita, dört aracın birlikte neyi ima ettiğine dair iyi belgelenmiş bir açıklamadır; buzun nerede olduğuna dair bir açıklama sayılamaz.", "en": "How the check should be made can also be drawn from this paper. When a spacecraft reaches a mapped location on Mars, the honest comparison runs through the maximum likelihood and the one-sigma low bound the authors recommend. Read against the median, the framework will look optimistic in exactly the way it warned about. The gap between one and five metres closes only with a higher-frequency radar. Until one of those happens, the map is a well-documented statement of what four instruments jointly imply; it cannot count as a statement about where the ice is.", "refs": ["mars"]}]}], "sources": [{"key": "mars", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-laying-odds-potential-martian-future.html", "title": {"tr": "Mars'ın buz haritası artık sınır çizmek yerine olasılık veriyor", "en": "A Mars ice map now states the odds instead of drawing a boundary"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "The Planetary Science Journal", "url": "https://doi.org/10.3847/PSJ/ae8904", "publishedDate": "2026-07-31", "title": {"tr": "Mars'ta yüzey altı su buzunun haritalanması: olasılıkçı bir yaklaşım", "en": "Subsurface Water Ice Mapping on Mars: A Probabilistic Approach"}}}], "date": "2026-08-01"}, {"writer": "sci-06", "title": {"tr": "Ay'daki yeni çukuru kimse hedeflemedi", "en": "Nobody aimed the new crater on the Moon"}, "excerpt": {"tr": "On iki metrelik bir tüp bir buçuk yıl önce işini bitirdi ve o günden beri kimsenin olmadı. Çarşamba günü Ay'da bir çukur açması bekleniyor. Fiziksel olarak önemsiz; asıl soru, bunu bir kaza mı yoksa artık sıradan bir sonuç mu sayacağımız.", "en": "A twelve-metre tube finished its job a year and a half ago and has belonged to nobody since. On Wednesday it is expected to open a hole in the Moon. Physically it is trivial; the real question is whether we count it an accident or an ordinary consequence."}, "sections": [{"h": {"tr": "Kimsenin olmayan bir nesne", "en": "An object that belongs to nobody"}, "ps": [{"tr": "Nesnenin ölçüleri belli: yaklaşık 12 metrelik boyda, 4.500 kilogramlık ağırlıkta bir üst kademe. 15 Ocak 2025'te iki özel iniş aracını yola çıkardı; Firefly Aerospace'in Blue Ghost aracı Ay'a tümüyle başarılı iniş yapan ilk özel uzay aracı oldu, ispace'in aracı ise parçalandı. Uzay izleme uzmanı Bill Gray, kademenin Ay'ın batı kenarındaki Einstein Krateri yakınına saatte 5.400 mil hızla, yani sesin yedi katıyla çarpacağını öngörüyor. Los Alamos Ulusal Laboratuvarı'ndan Benjamin Fernando yaklaşık 27 metrelik çapta ve 5 metrelik derinlikte bir çukur bekliyor; enerji üç ton TNT'ye eşdeğer.", "en": "The object's dimensions are known: an upper stage about 12 metres long and 4,500 kilograms in weight. On 15 January 2025 it sent two private landers on their way; Firefly Aerospace's Blue Ghost became the first private spacecraft to make a fully successful lunar landing, while the ispace lander wrecked. Space tracking expert Bill Gray predicts that the stage could hit near Einstein Crater on the Moon's western limb at 5,400 mph, seven times the speed of sound. Benjamin Fernando of Los Alamos National Laboratory expects a hole about 27 metres across and 5 metres deep, with energy equivalent to three tons of TNT.", "refs": ["moon"]}, {"tr": "Ay'ın yüzeyi zaten kraterlerle kaplı olduğu için 27 metrelik bir çukur fiziksel olarak hiçbir şeyi değiştirmiyor. Bu okumayı önce vermek gerekir, çünkü doğrudur. Ay sürekli doğal nesnelerle dövülüyor, bunların çoğu bundan çok daha fazla enerjiyle geliyor. Emekli astrofizikçi Jonathan McDowell da çarpmanın kendisinin bir sorun olmayacağını söylüyor. Buradaki mesele fizik değildir.", "en": "The Moon's surface is already covered in craters, so a 27-metre hole changes nothing physically, and this reading should come first because it is correct. The Moon is struck constantly by natural objects, most of them arriving with far more energy than this. The retired astrophysicist Jonathan McDowell also says the impact itself will not be a problem. What is at stake here is not physics.", "refs": ["moon"]}]}, {"h": {"tr": "Kazayı deneye çeviren şey", "en": "What turns an accident into an experiment"}, "ps": [{"tr": "NASA'nın Lunar Reconnaissance Orbiter aracı ile Güney Kore'nin Danuri aracının bölgeyi çarpmadan önce ve sonra görüntülemesi planlanıyor. Bakabilen iki aracın orada bulunması, bir çöp parçasını kütlesi, hızı ve zamanı bilinen bir çarpma denemesine dönüştürüyor; Fernando'nun bu olayın enkaz çarpmalarının gelecekteki astronotlar için ne kadar tehlike oluşturduğunu anlamaya yarayacağını söylemesinin nedeni de bu. Değerin tamamı başka amaçlarla gönderilmiş araçlardan ödünç alınıyor.", "en": "NASA's Lunar Reconnaissance Orbiter and South Korea's Danuri are to image the region before and after the impact. Two spacecraft happening to be there and able to look turn a piece of litter into an impact experiment with a known mass, speed and time, which is why Fernando says the event will help work out how much of a hazard debris impacts pose to future astronauts. The whole of the value is borrowed from spacecraft sent for other purposes.", "refs": ["moon"]}, {"tr": "Ödünç alınmış olmanın bir bedeli var. Kütle ve hız ölçülmüş değerler sayılmaz; Gray'in izleme çalışmasının kestirimleridir ve öngörü bir kurum duyurusundan gelmiyor. Başlangıç koşulları ayarlanmak yerine çıkarılmış bir çarpma denemesi, tasarlanmış bir denemeden zayıf kalır. Yararlıdır, ama planlanmış bir sınamanın yerini tutmaz ve sonuçları bu sınırla okunmalıdır.", "en": "Being borrowed has a price. The mass and the speed cannot be counted as measured values; they are estimates from Gray's tracking work, and the prediction does not come from an agency announcement. An impact experiment whose initial conditions were inferred rather than set stays weaker than one that was designed. It is useful, but it does not replace a planned test, and its results should be read within that limit.", "refs": ["moon"]}]}, {"h": {"tr": "Kimin sorunu", "en": "Whose problem it is"}, "ps": [{"tr": "McDowell'in işaret ettiği ay üssü işletimi yaklaşırken, ayrılmadan sonra bir kademenin sorumluluğunun kimsede olmaması yalnızca Ay boş kaldığı sürece sorun yaratmıyordu. Gray de yukarısının kalabalıklaştığını söylüyor. Kurumsal soru burada duruyor: fırlatma sağlayıcısı mı, yükün müşterisi mi, ruhsatı veren devlet mi. Bugünkü yanıt hiç kimse. Yanıtın değiştiğini gösterecek işaret basit: iki yörünge aracının çektiği görüntülerin bir olay olarak mı, yoksa güzel bir fotoğraf olarak mı ele alınacağı.", "en": "The arrangement in which nobody holds responsibility for a stage after separation caused no trouble only while the Moon stayed empty, and lunar base operations of the kind McDowell points to are approaching. Gray says things are getting crowded up there. The institutional question sits here: the launch provider, the payload customer, or the licensing state. Today the answer is nobody. The signal that the answer has changed is simple: whether the images taken by the two orbiters are treated as an incident or as a nice photograph.", "refs": ["moon"]}, {"tr": "ABD ve Kanada'nın doğusu ile Güney Amerika'nın büyük bölümü çarşamba gecesi en iyi görüşe sahip olabilir; toz bulutu teleskopla on dakikalarca izlenebilir, parlamanın kendisi görülemeyecek kadar sönük kalır. Bakan biri, insan yapımı bir nesnenin başka bir dünyada bıraktığı izi tam oluşurken görebilir. Ve bunu kimsenin planlamadığını bilerek bakar.", "en": "The eastern parts of the US and Canada and much of South America may have the best views on Wednesday night; the dust plume can be watched by telescope for tens of minutes, while the flash itself stays too dim to see. Anyone watching may see the mark a human-made object leaves on another world at the moment it is made. And they watch it knowing that nobody planned it.", "refs": ["moon"]}]}], "sources": [{"key": "moon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-discarded-spacex-rocket-high-collision.html", "title": {"tr": "Terk edilmiş bir Falcon 9 üst kademesinin çarşamba günü Ay'a çarpması bekleniyor", "en": "A discarded Falcon 9 upper stage is expected to strike the Moon on Wednesday"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "sci-01", "title": {"tr": "Mars'ın iyon kaybı, rüzgârı başka bir yörüngeden izleyerek kaynağına bağlandı", "en": "Tying Mars's ion loss to its source took watching the wind from another orbit"}, "excerpt": {"tr": "MAVEN yıllardır kaçan iyonları sayıyor. Eksik olan, o sırada gelen güneş rüzgârının ne yaptığıydı; Tianwen-1 yukarı akışta durunca ölçüm iki uçlu hale geldi.", "en": "MAVEN has been counting escaping ions for years. What was missing was what the incoming solar wind was doing at that moment; with Tianwen-1 standing upstream, the measurement finally had two ends."}, "sections": [{"h": {"tr": "Tek araçla ölçülemeyen şey", "en": "What one spacecraft could not measure"}, "ps": [{"tr": "Science Advances'te 31 Temmuz 2026'da yayımlanan hakemli çalışmada iş bölümü açık: MAVEN Mars yakınında kaçan iyonları ölçtü, Tianwen-1 ise yukarı akıştaki güneş rüzgârını izledi. Baş yazar Chi Zhang, tek bir uzay aracıyla hem gelen rüzgârı hem kaçan iyonları aynı anda ölçmenin büyük bir güçlük olduğunu söylüyor.", "en": "In the peer-reviewed study published in Science Advances on 31 July 2026 the division of labour is explicit: MAVEN measured ions escaping near Mars while Tianwen-1 monitored the solar wind upstream. Lead author Chi Zhang says measuring the incoming wind and the escaping ions at once with a single spacecraft was a major challenge.", "refs": ["mars-ions"]}, {"tr": "Bu, ölçüm geometrisinin bir sonucudur ve etkisi büyük. Tek araçla toplanan kaçış oranı kendi başına bir sayı olarak kalır: gezegenin atmosfer yitirdiğini söyler, o anda kaybı neyin sürüklediğini sessizce geçer. Yukarı akışta ikinci bir gözlemci durunca aynı sayı bir sürücüyle eşleştirilebiliyor. Daha sade bir okuma da elde duruyor: eşleşmenin bir bölümü, iki aracın aynı büyük ölçekli rüzgâr olayını farklı konumlardan görmesinden doğabilir, ve bunu ayırmak için olay sayısının artması gerekiyor.", "en": "This follows from measurement geometry, and its effect is large. An escape rate gathered by one spacecraft stays a number on its own: it says the planet is losing atmosphere and passes over what was driving the loss at that moment. With a second observer standing upstream, the same number can be matched to a driver. A plainer reading also remains available: part of the match could arise from the two craft seeing the same large-scale wind event from different positions, and separating that requires more events.", "refs": ["mars-ions"]}]}, {"h": {"tr": "Bulutun içindeki akı", "en": "The flux inside the cloud"}, "ps": [{"tr": "Makalenin özetine göre ortak gözlemler, iyon taşıyan yerel plazma bulutlarının Kelvin-Helmholtz kararsızlığının ürettiği doğrusal olmayan dalga paketleri olduğunu doğrudan gösteriyor. İki noktalı ölçüm sayesinde bu dalgaların uzamsal ölçeği ilk kez sınırlandırıldı. Sayı da veriliyor: plazma bulutları içindeki iyon akıları, olağan kararlı durum kaçış kanallarındakinden bir ila iki kat büyüklük mertebesi yüksek.", "en": "According to the paper's abstract, the joint observations give direct evidence that the localized plasma clouds carrying ions are nonlinear wave packets generated by the Kelvin-Helmholtz instability. Two-point measurement constrains the spatial scale of those waves for the first time. The figure is given too: ion fluxes within plasma clouds are one to two orders of magnitude higher than those in typical steady-state escape channels.", "refs": ["mars-ions"]}, {"tr": "Yüz kata varan bir akı farkı, bu kanalın kayıp bütçesindeki ağırlığını tek başına belirlemiyor, çünkü bütçeyi belirleyen şey akının yanında bu bulutların ne sıklıkta ve ne kadar geniş bir alanda oluştuğudur. Ölçek kısıtı burada değerli: sıklık ölçülebilirse toplam pay hesaplanabilir hale gelir. Kaçışın ağırlıkla gezegenin tek bir yanında görülmesi ve o yanın güneş rüzgârının elektrik alan yönüne bağlı olması, mekanizmayı destekleyen ikinci gözlem. Rastgele bir kayıp süreci böyle bir yön seçmezdi.", "en": "A flux difference reaching a hundredfold does not by itself fix this channel's weight in the loss budget, because the budget depends on how often and over how wide an area these clouds form as much as on the flux. The scale constraint matters here: once frequency can be measured, the total share becomes computable. That escape appears mainly on one side of the planet, and that the side depends on the direction of the solar wind's electric field, is a second observation supporting the mechanism. A random loss process would not pick a side.", "refs": ["mars-ions"]}]}, {"h": {"tr": "Sıradaki ölçüm", "en": "The next measurement"}, "ps": [{"tr": "Bu sonucu asıl sınayacak gözlem şu: elektrik alanın yönü döndüğünde kaçışın yoğunlaştığı yan da dönmeli. İki aracın yeniden eşzamanlı ve uygun konumda bulunduğu her dönemde bu bekleniyor, ve öngörülen yön değişimi görülmezse mekanizmanın kaçış bütçesindeki payı aşağı çekilir. Ekibin kendisi de ek uzay aracı gözlemleri ve sayısal benzetimler istiyor; bir sonraki gözlem dizisinin sonuçları 2027 ortasına kadar yayımlanırsa, sayı ilk kez tek bir olaydan fazlasına dayanacak.", "en": "The observation that will really test this result is straightforward: when the direction of the electric field turns, the side where escape concentrates should turn with it. That is expected in every period when the two craft are again suitably placed at the same time, and if the predicted reversal does not appear, the mechanism's share of the escape budget drops. The team itself calls for additional spacecraft observations and numerical simulations; if results from the next observing series are published by the middle of 2027, the figure will rest on more than a single event for the first time.", "refs": ["mars-ions"]}]}], "sources": [{"key": "mars-ions", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-solar-mars-upper-atmosphere-boosting.html", "title": {"tr": "MAVEN iyonları sayarken Tianwen-1 güneş rüzgârını izledi ve Mars'taki kaçış dalgalara bağlandı", "en": "With MAVEN counting ions and Tianwen-1 watching the solar wind, ion escape at Mars was tied to waves"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Science Advances", "url": "https://pubmed.ncbi.nlm.nih.gov/42536743/", "publishedDate": "2026-07-31", "title": {"tr": "Eşzamanlı Mars yörünge gözlemleri, Kelvin-Helmholtz kararsızlığının sürüklediği toplu atmosferik iyon kaçışını ortaya koyuyor", "en": "Simultaneous Mars-orbit observations reveal Kelvin-Helmholtz instability-driven bulk atmospheric ion escape"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-02", "title": {"tr": "Üç hafta ateş, birkaç acil servis, sonunda ayak bileğindeki kene", "en": "Three weeks of fever, several emergency rooms, and finally the tick on the ankle"}, "excerpt": {"tr": "Hasta önce ateş nöbetleri, döküntü ve bulantıyla geldi; yüz felci eklendi, yatış geldi. Tanı ancak evde bulunan kene test edildikten sonra bir isim kazandı.", "en": "The patient came first with febrile episodes, a rash and nausea; facial paralysis followed, then admission. The diagnosis acquired a name only after the tick found at home was tested."}, "sections": [{"h": {"tr": "Hastanın izlediği yol", "en": "The path the patient took"}, "ps": [{"tr": "Open Forum Infectious Diseases'te 24 Temmuz 2026'da çevrimiçi yayımlanan olgu bildirimine göre orta Teksas'ta yaşayan bir kişi, evinde ayak bileğine tutunmuş, kan emmiş bir kene buluyor. Kene, yumuşak kene kaynaklı tekrarlayan ateşin etkeni olan Borrelia turicatae için pozitif çıkıyor. Hasta bundan üç hafta önce ateş nöbetleri, döküntü ve bulantı yaşamaya başlamıştı; Phys.org'a göre tabloya yorgunluk, baş ağrısı ve yüz felci de eklendi, birden çok acil servis başvurusu ve sonunda hastaneye yatış oldu.", "en": "According to the case report published online in Open Forum Infectious Diseases on 24 July 2026, a central Texas resident finds an engorged tick attached to their ankle at home. The tick tests positive for Borrelia turicatae, the causative agent of soft tick-borne relapsing fever. The patient had begun having febrile episodes, a rash and nausea three weeks earlier; according to Phys.org, fatigue, headaches and facial paralysis joined the picture, with multiple emergency room admissions and eventual hospitalization.", "refs": ["tick-case"]}, {"tr": "Bu seyri hasta açısından okumak gerekiyor. Ateş nöbetleri arayla geliyor, aralarda kişi düzeliyor ve her başvuru kendi başına bakıldığında geçici bir tabloya benziyor. Yüz felcinin eklenmesi ciddiyeti gösteriyor ama etkeni göstermiyor. Sonunda tanıyı yönlendiren şey bir laboratuvar bulgusu oldu; yalnız o bulgu hastadan değil, evde bulunan keneden geldi. Makalenin kendi ifadesiyle enfeksiyonun tanısı konulamadı.", "en": "That course has to be read from the patient's side. The febrile episodes come at intervals, the person recovers between them, and each presentation on its own looks like something passing. Facial paralysis shows the severity without showing the agent. In the end a laboratory finding steered the diagnosis, except that the finding came from the tick found at home rather than from the patient. In the paper's own words, the infection remained undiagnosed.", "refs": ["tick-case"]}]}, {"h": {"tr": "Tanı listesine hiç girmeyen ihtimal", "en": "The possibility that never entered the differential"}, "ps": [{"tr": "Yazarların çıkardığı sonuç bir görünürlük sorununa işaret ediyor: enfekte yumuşak keneler yalnızca kırsalda değil, şehir parklarında, mahallelerde ve evlerde de bulunabiliyor. İstedikleri üç şey de bununla uyumlu: hekimler arasında daha fazla farkındalık, geliştirilmiş tanı testleri ve artırılmış sürveyans.", "en": "The conclusion the authors draw points to a visibility problem: infected soft ticks may be present not only in rural environments but also in city parks, neighborhoods and homes. The three things they ask for follow from that: greater awareness among health care providers, improved diagnostic testing and increased surveillance.", "refs": ["tick-case"]}, {"tr": "Klinik açıdan asıl darboğaz burada. Austin içinde yaşayan, tekrarlayan ateşle gelen bir hastada bu ihtimal ayırıcı tanı listesine girmiyorsa gerekli test hiç istenmiyor, ve test istenmediği sürece bölgede kaç olgunun benzer biçimde adsız kaldığı da bilinmiyor. Gecikmenin tek açıklaması bu olmayabilir: testin erişilebilirliği ya da ateş nöbetleri arasında uygun anda örnek alma güçlüğü de aynı sonucu verebilir.", "en": "Clinically that is where the bottleneck sits. If the possibility does not enter the differential for a patient living inside Austin who presents with recurring fevers, the necessary test is never ordered, and while it is not ordered nobody knows how many cases in the area stay unnamed in the same way. This may not be the only explanation for the delay: test availability, or the difficulty of sampling at the right moment between febrile episodes, could produce the same outcome.", "refs": ["tick-case"]}]}, {"h": {"tr": "Bir olgunun taşıyabileceği yük", "en": "What a single case can carry"}, "ps": [{"tr": "Payda bir kişi. Bu, bir kentte yerleşmiş bir bulaş döngüsü anlamına gelmiyor ve makale de böyle bir iddia taşımıyor. Hastalar açısından tabloyu değiştirecek iki gözlem var: aynı bölgedeki konutlardan toplanan kenelerde enfeksiyonun birden fazla noktada gösterilmesi, ya da laboratuvarda doğrulanmış bir insan enfeksiyonunun bildirilmesi. İkincisi geldiğinde tedavi de erken başlayabilir; ilki geldiğinde sürveyansın kapsamı genişler.", "en": "The denominator is one person. That does not amount to an established urban transmission cycle, and the paper makes no such claim. For patients, two observations would change the picture: infection shown in ticks collected from more than one residential site in the same area, or a laboratory-confirmed human infection reported. When the second arrives, treatment can start earlier; when the first arrives, the reach of surveillance widens.", "refs": ["tick-case"]}]}], "sources": [{"key": "tick-case", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-case-soft-borne-relapsing-fever.html", "title": {"tr": "Austin'de bir evde bulunan kene Borrelia turicatae taşıyordu; hastanın enfeksiyonu doğrulanamadı", "en": "A tick found in an Austin home carried Borrelia turicatae; the patient's infection was never confirmed"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Open Forum Infectious Diseases", "url": "https://pubmed.ncbi.nlm.nih.gov/42517151/", "publishedDate": "2026-07-24", "title": {"tr": "Austin, Teksas büyükşehir bölgesinde bir konutta spiroket taşıyan Ornithodoros turicata'ya insan maruziyeti", "en": "Human Exposure to Spirochete-Infected Ornithodoros turicata in a Residential Setting in the Austin, Texas Metropolitan Area"}}}], "radarPublishedAt": "2026-08-01T16:12:18+00:00", "n": 3, "date": "2026-08-01"}, {"writer": "sci-03", "title": {"tr": "Bulut parlatma El Niño'yu zayıflatıyor, ardından La Niña'yı öne çekiyor", "en": "Cloud brightening weakens El Nino, then pulls the following La Nina forward"}, "excerpt": {"tr": "Benzetimde kaldıraç çalışıyor. Aynı benzetimde kaldıracın bırakıldığı an etki de zayıflıyor, ve hedeflenen El Niño'nun ardından La Niña daha erken geliyor.", "en": "In the simulation the lever works. In the same simulation the effect weakens the moment the lever is released, and the La Nina after the targeted El Nino arrives earlier."}, "sections": [{"h": {"tr": "Modelin tuttuğu yer", "en": "Where the model holds"}, "ps": [{"tr": "Science Advances'te 10 Temmuz 2026'da yayımlanan hakemli çalışma, deniz bulutu parlatmayı uzun vadeli ısınma yerine mevsimlik ve çok yıllık bir olguya yöneltiyor. Ekip önce 2019-2020 Avustralya orman yangınlarının sağladığı fırsat deneyinden yararlanıyor: yangınların yol açtığı doğal bulut parlatması ve ardından gelen La Niña benzeri tepki, güneydoğu Pasifik'te benzetimle yeniden üretiliyor. Sonra 1997-1998 ve 2015-2016 El Niño olayları üzerinde deneniyor.", "en": "The peer-reviewed study published in Science Advances on 10 July 2026 turns marine cloud brightening away from long-term warming and toward a seasonal-to-multiyear phenomenon. The team first exploits the opportunistic experiment provided by the 2019-2020 Australian wildfires: the natural cloud brightening those fires produced, and the La Nina-like response that followed, are reproduced by simulating the intervention in the southeast Pacific. It is then tried on the 1997-1998 and 2015-2016 El Nino events.", "refs": ["cloud-brightening"]}, {"tr": "Mekanizma açıkça adlandırılıyor. El Niño'nun büyüme evresinde başlatılan müdahale, El Niño koşullarını normalde güçlendiren Bjerknes geri beslemelerini bozuyor. Bu, bir sıcaklık farkının doğrudan bastırılması yerine, olayı büyüten döngünün kesilmesi anlamına geliyor; kaldıracın tutunduğu yer de burası. Phys.org'un aktardığı donanım ölçeği ise ayrı bir kısıt: deniz tuzu memeleriyle donatılmış yaklaşık 2.400 gemi gerekiyor ve mevcut memeler gereken hacme henüz ulaşamıyor.", "en": "The mechanism is named plainly. An intervention started during El Nino's growth phase disrupts the Bjerknes feedbacks that normally amplify El Nino conditions. That means cutting the loop which grows the event rather than suppressing a temperature difference directly, and it is where the lever finds its grip. The hardware scale Phys.org reports is a separate constraint: roughly 2,400 vessels equipped with sea-salt nozzles are needed, and current nozzles cannot yet achieve the required volume.", "refs": ["cloud-brightening"]}]}, {"h": {"tr": "Kaldıraç bırakıldığında", "en": "When the lever is released"}, "ps": [{"tr": "Çalışmanın en dikkat çekici bulgusu sürekliliğe dair. Müdahale sonlandırıldıktan sonra etkiler zayıflıyor, ve yalnızca en erken ve en uzun müdahaleler nötr ENSO koşullarını geri getirip uzak bağlantıları zayıflatıyor. İstenmeyen sonuçlar arasında hedeflenen El Niño'nun ardından daha erken bir La Niña sayılıyor; erken ve kısa müdahalelerin bu etkiyi dengeleyebileceği belirtiliyor.", "en": "The study's most striking finding concerns persistence. After the intervention is terminated the effects weaken, and only the earliest and longest interventions restore neutral ENSO conditions and weaken teleconnections. Among the unintended consequences is an earlier La Nina following the targeted El Nino, and the paper notes that early and short interventions may counter that effect.", "refs": ["cloud-brightening"]}, {"tr": "Bu, bir müdahalenin muhasebesini değiştiriyor. Kazanç ile maliyet aynı olay içinde kapanmıyor; kazanç hedeflenen El Niño'da, maliyetin bir bölümü onu izleyen evrede ortaya çıkıyor. Erken ve uzun müdahale nötr koşulları geri getiriyor ama gemi sayısını ve süreyi yukarı çekiyor; erken ve kısa olanı ise La Niña etkisini dengeliyor. Yani zamanlama tek bir en iyi değeri olan bir ayar değil, iki ayrı hedefin çekiştirdiği bir denge. Daha ihtiyatlı bir okuma da mümkün: bu davranış modelin ENSO temsiline özgü olabilir ve başka bir modelde farklı çıkabilir.", "en": "This changes the accounting for an intervention. Gain and cost do not close inside the same event; the gain sits in the targeted El Nino while part of the cost appears in the phase that follows. An early and long intervention restores neutral conditions and at the same time raises the ship count and the duration, while an early and short one balances the La Nina effect. Timing, then, is a setting pulled between two aims rather than one with a single best value. A more cautious reading is also available: this behaviour may be specific to how this model represents ENSO and could come out differently in another.", "refs": ["cloud-brightening"]}]}, {"h": {"tr": "Modelin bakmadığı yer", "en": "What the model did not look at"}, "ps": [{"tr
