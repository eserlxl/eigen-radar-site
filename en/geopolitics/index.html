n front of the programme", "tr": "Programın önündeki engel"}, "ps": [{"en": "The paper's threat list carries dates rather than adjectives: Chinese aircraft locking radars on Japanese planes in December, two Chinese carriers seen near Iwo Jima for the first time in June, joint Chinese and Russian bomber and warship operations, and North Korea's development of hypersonic missiles. The Japan Times reported that the document says such military activity can only be met through overall national strength and cooperation with allies.", "refs": ["japan-paper"], "tr": "Raporun tehdit listesi sıfatlarla değil tarihlerle kuruluyor: aralıkta Çin uçaklarının Japon uçaklarına radar kilidi uygulaması, haziranda iki Çin uçak gemisinin ilk kez Iwo Jima yakınında görülmesi, Çin ile Rusya'nın ortak bombardıman uçağı ve savaş gemisi harekâtları ve Kuzey Kore'nin hipersonik füze geliştirmesi. The Japan Times'a göre belge, bu askeri faaliyetlere ancak bütüncül ulusal güç ve müttefiklerle iş birliğiyle karşılık verilebileceğini yazıyor."}, {"en": "The obstacle is inside the same document. Experts say fully domestic production is difficult in a country whose commercial drone market is dominated by Chinese imports. The system meant to carry the deterrent sits on the far side of the supply chain. The same priority may also answer a different need: the paper notes that uncrewed systems could offset a falling number of service members in a shrinking country.", "refs": ["japan-paper"], "tr": "Engel de belgenin içinde. Uzmanlara göre ticari insansız hava aracı pazarına Çin ithalatının hâkim olduğu bir ülkede tümüyle yerli üretim zor. Yani caydırıcılığı taşıyacak sistem, tedarik zincirinin karşı tarafında duruyor. Aynı öncelik başka bir ihtiyacın da karşılığı olabilir: rapor, insansız sistemlerin küçülen bir ülkede azalan asker sayısını telafi edebileceğini kaydediyor."}, {"en": "The test point comes after the naval trial. If the trial is completed and a final selection is announced before the year ends, the measure to watch is whether a single supplier is named and a production quantity is stated. Without a quantity, the programme has not moved past intent.", "refs": ["japan-paper"], "tr": "Sınama noktası deniz denemesinin sonrası. Deneme tamamlanır ve yıl bitmeden nihai seçim açıklanırsa, bakılacak ölçü tek bir tedarikçinin adının ve bir üretim miktarının duyurulup duyurulmadığı olacak. Miktar telaffuz edilmeden, program bir niyetten öteye geçmiş sayılmaz."}]}], "sources": [{"key": "japan-paper", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/japan-defense-paper-china-drones-5a6c6223b22deec4619af31cf69fdc34", "title": {"tr": "Japonya kabinesi, insansız sistemleri öne çıkaran 598 sayfalık savunma raporunu onayladı", "en": "Japan's cabinet approves a 598-page defence paper that puts uncrewed systems first"}, "publishedDate": "2026-08-04"}], "title": {"en": "Four makers were picked out of thirty-eight", "tr": "Otuz sekiz başvurudan dört üretici seçildi"}, "writer": "geo-03", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "The challenge to South Africa's expropriation law opened on Monday in the Western Cape High Court. Washington had already priced the text: all financial aid stopped, tariffs raised. A court can change the wording; it cannot change aid already withdrawn or duties already paid.", "tr": "Güney Afrika'nın kamulaştırma yasasına itiraz pazartesi günü Batı Cape Yüksek Mahkemesi'nde görülmeye başlandı. Washington ise bu metnin faturasını çoktan kesti: mali yardım tümüyle durduruldu, gümrük vergileri yükseltildi. Mahkeme metni değiştirebilir; kesilmiş yardımı ve ödenmiş vergiyi değiştiremez."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The price of the text", "tr": "Metnin fiyatı"}, "ps": [{"en": "The case opened on Monday. The Democratic Alliance, part of the government of national unity, argues alongside the Institute of Race Relations and AfriForum that the law breaches the constitution's protections of property. The law permits expropriation where there is a public interest and opens the way to expropriation without compensation if negotiations for a reasonable settlement fail. Sowetan reported that AfriForum wants sections 12(3) and 12(4), which set the conditions for nil compensation, struck down, and says its objection is to the constitutional method rather than to land reform.", "refs": ["expropriation-hearing"], "tr": "Dava pazartesi günü açıldı. Ulusal birlik hükümetinin parçası olan Demokratik İttifak, Irk İlişkileri Enstitüsü ve AfriForum ile birlikte, yasanın anayasanın mülkiyet güvencelerini ihlal ettiğini savunuyor. Yasa kamu yararı bulunduğunda kamulaştırmaya izin veriyor ve makul bir uzlaşma için yürütülen görüşmeler sonuçsuz kalırsa tazminatsız kamulaştırmanın önünü açıyor. Sowetan'a göre AfriForum tazminatsız kamulaştırmanın koşullarını belirleyen 12(3) ve 12(4) maddelerinin iptalini istiyor ve itirazının toprak reformuna değil bunun anayasal yöntemine olduğunu söylüyor."}, {"en": "Washington did not wait for this argument. Trump said the law would be used to target white farmers and cited it as the reason the United States withdrew all financial aid to South Africa and imposed high tariffs on the country. Pretoria rejects that, saying the law does not allow arbitrary seizures and is meant to bring unused land into production. Beneath the principle there is again a price: a piece of domestic legislation has been converted into a cost paid in trade and aid lines.", "refs": ["expropriation-hearing"], "tr": "Washington bu tartışmayı beklemedi. Trump, yasanın beyaz çiftçileri hedef almak için kullanılacağını söyledi ve bunu ABD'nin Güney Afrika'ya mali yardımı tümüyle kesmesinin ve ülkeye yüksek gümrük vergisi uygulamasının gerekçesi olarak gösterdi. Pretorya iddiayı reddediyor; yasanın keyfi el koymaya izin vermediğini ve atıl arazileri üretime kazandırmayı amaçladığını söylüyor. İlkenin altında yine bir fiyat var: bir iç hukuk metni, dış ticaret ve yardım kalemlerinde ödenen bir maliyete çevrilmiş durumda."}]}, {"h": {"en": "Where the bill sits", "tr": "Faturanın kaldığı yer"}, "ps": [{"en": "If the court strikes down sections 12(3) and 12(4), the route to expropriation without compensation closes. Whether the aid and the tariff come back depends on a different mechanism: those measures were justified by a political reading of how the law would be used rather than by its text, so they need not follow a court ruling on their own. Another possibility exists: if any US instrument names the statute explicitly as its ground, a ruling would give Pretoria something to point to in asking for that instrument to be reviewed.", "refs": ["expropriation-hearing"], "tr": "Mahkeme 12(3) ve 12(4) maddelerini iptal ederse tazminatsız kamulaştırma yolu kapanır. Yardımın ve verginin geri dönmesi ise başka bir mekanizmaya bağlı: bu önlemler yasanın metnine değil, yasanın nasıl kullanılacağına dair siyasi bir okumaya dayandırıldı; dolayısıyla bir mahkeme kararını kendiliğinden izlemeleri gerekmiyor. Farklı bir ihtimal de var: ABD tarafındaki herhangi bir işlemde yasa açıkça gerekçe olarak yazılıysa, iptal kararı Pretorya'ya bu işlemin gözden geçirilmesini isteyecek bir dayanak verir."}, {"en": "From the ledger side the timing decides. The hearing runs to the end of the week, the timing of a ruling is unclear and could take weeks or months. The tariff, meanwhile, is paid now, on every shipment. That interval is the cost carried by exporters in South Africa, and no domestic ruling removes it retroactively.", "refs": ["expropriation-hearing"], "tr": "Defter tarafından bakıldığında zamanlama belirleyici. Duruşmalar hafta sonuna kadar sürecek, kararın ne zaman çıkacağı belirsiz ve haftalar ya da aylar alabilir. Gümrük vergisi ise şimdi, her sevkiyatta ödeniyor. Bu aradaki fark, Güney Afrika'daki ihracatçıların taşıdığı maliyettir; iç hukuktaki hiçbir karar o maliyeti geriye dönük olarak kaldırmıyor."}, {"en": "The measure to watch is simple. If the court strikes down the nil-compensation provisions, the thing to check over the following three months is whether any US decision on aid or tariffs is amended. If none is, then citing the law was an occasion rather than a cause.", "refs": ["expropriation-hearing"], "tr": "Bakılacak ölçü sade. Mahkeme tazminatsız kamulaştırma hükümlerini iptal ederse, izleyen üç ay içinde ABD tarafında yardım veya vergi kararlarından herhangi birinin değiştirilip değiştirilmediğine bakmak gerekir. Değişmiyorsa, yasanın gerekçe olarak gösterilmesi bir sebep değil bir vesileydi."}]}], "sources": [{"key": "expropriation-hearing", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/south-africa-land-expropriation-court-trump-1c418e73bd0d6e48ed49913829c7bac0", "title": {"tr": "Güney Afrika'nın kamulaştırma yasasına itiraz Batı Cape Yüksek Mahkemesi'nde görülmeye başlandı", "en": "The challenge to South Africa's expropriation law opens in the Western Cape High Court"}, "publishedDate": "2026-08-03"}], "title": {"en": "The aid was cut and the tariff imposed before the case opened", "tr": "Yardım kesilip vergi konduktan sonra dava başladı"}, "writer": "geo-04", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Millions gathered in Karbala on Tuesday. On the same day, one of the groups Baghdad is trying to disarm chose the most crowded day of the year to announce that it would not give up its weapons. What sets the clock for Baghdad is the oil that cannot pass through Hormuz.", "tr": "Kerbela'da salı günü milyonlar toplandı. Aynı gün, Irak'ın silahsızlandırmaya çalıştığı gruplardan biri yılın en kalabalık gününü seçerek silah bırakmayacağını duyurdu. Bağdat'ın elindeki zamanı belirleyen ise Hürmüz'den geçemeyen petrol."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "On the Najaf-Karbala road", "tr": "Necef-Kerbela yolunda"}, "ps": [{"en": "The operations command overseeing Arbaeen said on Monday that the number of pilgrims who had entered Iraq exceeded 4.88 million since the start of the month of Muharram, and with those travelling from inside the country the gathering counts among the world's largest annual events. Iranian Foreign Minister Abbas Araghchi arrived in Najaf on Monday and went on to Karbala.", "refs": ["arbaeen-karbala"], "tr": "Erbain operasyon komutanlığı pazartesi günü, Muharrem ayının başından bu yana Irak'a giriş yapan ziyaretçi sayısının 4,88 milyon kişiyi aştığını açıkladı; ülke içinden gelenlerle birlikte tören dünyanın en büyük yıllık toplanmalarından biri sayılıyor. İran Dışişleri Bakanı Abbas Erakçi pazartesi Necef'e geldi ve Kerbela'ya geçti."}, {"en": "Two pilgrims from Baghdad said Iranian flags predominated along the road while flags from Arab and European countries were fewer than usual, and attributed that to the war. The change is less about Iran's weight rising than about everyone else withdrawing. Iraq is still hosting the occasion, but the composition of the crowd it hosts has narrowed: not a piece on someone else's board, a host whose guest list has thinned.", "refs": ["arbaeen-karbala"], "tr": "Bağdatlı iki ziyaretçi, yol boyunca ağırlıklı olarak İran bayrakları gördüklerini, Arap ve Avrupa ülkelerine ait bayrakların her zamankinden az olduğunu söyledi ve bunu savaşa bağladı. Buradaki değişim İran'ın ağırlığının artması kadar, geri kalan herkesin çekilmesi. Irak bu yıl da töreni ağırlıyor, ama ağırladığı kalabalığın bileşimi daraldı; başkalarının hesabında bir piyon değil, davetlisi azalan bir ev sahibi."}]}, {"h": {"en": "Baghdad's own list", "tr": "Bağdat'ın kendi listesi"}, "ps": [{"en": "Kataib Hezbollah, one of the most powerful Iran-backed groups, used its statement marking the day to reject calls to disarm and to say it would keep what it called the weapons of the resistance. Baghdad, for its part, continues to pursue the disarmament of a militia network many of whose members are close to Iran as a task it set for itself.", "refs": ["arbaeen-karbala"], "tr": "İran destekli en güçlü gruplardan Kataib Hizbullah, güne ilişkin açıklamasında silah bırakma çağrılarını reddetti ve direniş silahı diye nitelediği silahları elinde tutmayı sürdüreceğini bildirdi. Bağdat ise çoğu İran'a yakın milis ağını silahsızlandırmayı kendi önüne koyduğu bir hedef olarak sürdürüyor."}, {"en": "The day chosen for the answer matters as much as the answer. Placing the refusal on the most crowded religious day of the year sets it on ground that raises the cost to the state of confronting it directly. Another reading is available: this may be an opening position before bargaining rather than a settled one, since the group rejected the call without naming a timetable or a condition.", "refs": ["arbaeen-karbala"], "tr": "Cevabın verildiği gün, cevabın kendisi kadar anlamlı. Reddi yılın en kalabalık dini gününe yerleştirmek, onu devletin doğrudan karşısına almasının maliyetini yükselten bir meşruiyet zeminine oturtuyor. Başka bir okuma da mümkün: bu, kesin bir konum değil, pazarlık öncesinde masaya konan bir açılış olabilir; grup çağrıyı reddederken bir takvim ya da koşul telaffuz etmedi."}]}, {"h": {"en": "The limit drawn by the budget", "tr": "Bütçenin çizdiği sınır"}, "ps": [{"en": "This year's Arbaeen fell in a period when the closure of the Strait of Hormuz has disrupted Iraq's oil exports, which supply more than 90 percent of state revenue. The strait has been effectively shut since the war began in February because of Iranian attacks on shipping, while the United States blockades Iranian ports there, and on Tuesday morning a cargo ship reported being struck off the coast of Oman.", "refs": ["arbaeen-karbala", "hormuz-strike"], "tr": "Bu yılki Erbain, Hürmüz Boğazı'nın kapanmasının Irak'ın petrol ihracatını aksattığı bir döneme denk geldi; devlet gelirlerinin yüzde 90'ından fazlası bu ihracattan geliyor. Boğaz, şubatta başlayan savaştan bu yana İran'ın gemilere yönelik saldırıları nedeniyle fiilen kapalı ve ABD İran'ın buradaki limanlarına abluka uyguluyor; salı sabahı bir yük gemisi Umman açıklarında vurulduğunu bildirdi."}, {"en": "Disarmament is also a budget question: salaries, compensation, resettlement and revenue to carry them. If exports remain disrupted into the autumn, the measure to watch is whether Baghdad announces a new timetable or a budget line for the programme. Absent that announcement, the constraint to read is financial rather than political.", "refs": ["arbaeen-karbala"], "tr": "Silahsızlandırma bir bütçe işidir de: maaş, tazminat, yeniden yerleştirme ve bunları taşıyacak bir gelir gerekir. İhracat sonbahara kadar aksamayı sürdürürse, izlenecek ölçü Bağdat'ın programa yeni bir takvim ya da bütçe kalemi açıklayıp açıklamadığı olacak. Bu açıklama gelmezse, okunması gereken kısıt siyasi değil mali olacaktır."}]}], "sources": [{"key": "arbaeen-karbala", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/iraq-iran-arbaeen-bbf57a5fd18231f99064372dceb070b9", "title": {"tr": "Kataib Hizbullah, Erbain açıklamasında silah bırakma çağrılarını reddetti", "en": "Kataib Hezbollah rejects disarmament calls in its Arbaeen statement"}, "publishedDate": "2026-08-04"}, {"key": "hormuz-strike", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/iran-us-hormuz-mideast-gaza-israel-palestinians-ff5f13230ab92b5ae3022f45b2585444", "title": {"tr": "Hürmüz Boğazı'nda bir yük gemisi mermiyle vurulduğunu bildirdi", "en": "A cargo ship reports being hit by a projectile in the Strait of Hormuz"}, "publishedDate": "2026-08-04"}], "title": {"en": "An Arbaeen statement became the answer to the disarmament call", "tr": "Erbain bildirisi silah bırakma çağrısına verilen cevap oldu"}, "writer": "geo-05", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Monday's order creates no new judgment; it only refuses to halt an old one. The real story of the file lies in that long interval: from the attacks of the early 2000s until now, what was argued was never the events themselves but whether a US court could reach these defendants at all.", "tr": "Pazartesi verilen karar yeni bir hüküm kurmuyor; yalnızca eski bir hükmün uygulanmasını durdurmayı reddediyor. Dosyanın asıl hikâyesi bu uzun aralıkta: iki binli yılların başındaki saldırılardan bugüne, tartışılan şey olayların kendisi değil, bir ABD mahkemesinin bu davalıya ulaşıp ulaşamayacağıydı."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "How the file travelled", "tr": "Dosyanın seyri"}, "ps": [{"en": "Supreme Court Justice Sonia Sotomayor signed an order on Monday refusing to halt the $656 million judgment against Palestinian institutions in a lawsuit brought by Americans killed or wounded in attacks in Israel. The order came after the court ruled last year in favour of the victims and their families.", "refs": ["plo-judgment"], "tr": "Yüksek Mahkeme Yargıcı Sonia Sotomayor pazartesi günü imzaladığı kararla, İsrail'deki saldırılarda ölen ve yaralanan Amerikalıların açtığı davada Filistinli kurumlar aleyhine hükmedilen 656 milyon dolar tutarındaki tazminatın durdurulmasını reddetti. Karar, mahkemenin geçen yıl mağdurlar ve aileleri lehine verdiği hükmün ardından geldi."}, {"en": "The Palestine Liberation Organization and the Palestinian Authority had argued in court documents that paying now could destabilise government services in the West Bank, and asked for payment to be paused while they appeal the reinstatement of the verdict. The suit was brought under the Anti-Terrorism Act, a law meant to open US courts to victims of international terror attacks, by victims of attacks in Jerusalem in the early 2000s that killed 33 people and wounded hundreds more.", "refs": ["plo-judgment"], "tr": "Filistin Kurtuluş Örgütü ile Filistin Yönetimi mahkemeye sunduğu belgelerde tazminatın şimdi ödenmesinin Batı Şeria'daki kamu hizmetlerini istikrarsızlaştırabileceğini savunmuş ve yeniden yürürlüğe konan hükme itirazları sürerken ödemenin durdurulmasını istemişti. Dava, iki binli yılların başında Kudüs'te 33 kişinin ölümüne ve yüzlerce kişinin yaralanmasına yol açan saldırıların mağdurlarınca, uluslararası terör saldırılarının mağdurlarına ABD mahkemelerinin yolunu açmayı amaçlayan Terörle Mücadele Yasası kapsamında açılmıştı."}, {"en": "The route in between was not straight. A federal court in New York threw out the original verdict on appeal and went on ruling for the defendants even as Congress revised the law to let such suits proceed. The Supreme Court revived two cases in 2025, and the 2nd US Circuit Court of Appeals reinstated the verdict in March.", "refs": ["plo-judgment"], "tr": "Aradaki yol düz değil. New York'taki bir federal mahkeme ilk kararı istinafta bozdu ve Kongre yasayı davaların görülebilmesi için değiştirirken de davalılar lehine hüküm kurmayı sürdürdü. Yüksek Mahkeme 2025'te iki dosyayı yeniden canlandırdı; İkinci ABD Bölge Temyiz Mahkemesi martta hükmü yeniden yürürlüğe koydu."}]}, {"h": {"en": "The variable that kept changing", "tr": "Değişip duran değişken"}, "ps": [{"en": "In a file this long, where the argument concentrated says more than the order itself. The facts of the Jerusalem attacks stayed the same at every stage; what changed was whether a US court could reach these defendants. Congress answered not by relitigating the facts but by rewriting the text that governs jurisdiction.", "refs": ["plo-judgment"], "tr": "Bu kadar uzun bir dosyada tartışmanın nerede yoğunlaştığına bakmak, kararın kendisinden daha çok şey söyler. Kudüs'teki saldırılara ilişkin olgular her aşamada aynı kaldı; değişen, bir ABD mahkemesinin bu davalılara ulaşıp ulaşamayacağıydı. Kongre'nin cevabı da olguları yeniden tartışmak değil, yetkiyi düzenleyen metni yeniden yazmak oldu."}, {"en": "Refusing to pause enforcement shifts the argument once more: as the jurisdictional question closes, collection is what remains, and the defendants' stated ground is now fiscal rather than legal. An administration that funds services in the West Bank facing a payment of this size produces an outcome outside the courtroom. The counter-reading holds too: a single justice's decision on a stay is judged by its own standard and need not indicate how the pending appeal will be received.", "refs": ["plo-judgment"], "tr": "Uygulamanın durdurulmaması, tartışmayı bir kez daha kaydırıyor: yetki sorusu kapandığı ölçüde geriye tahsilat kalıyor ve davalıların öne sürdüğü gerekçe artık hukuki değil mali. Batı Şeria'da hizmetleri finanse eden bir idarenin bu büyüklükte bir ödemeyle karşılaşması, mahkeme salonunun dışında bir sonuç doğuruyor. Karşı okuma da mümkün: tek bir yargıcın verdiği durdurma kararı kendi ölçütlerine göre değerlendirilir ve bekleyen başvurunun nasıl karşılanacağına dair bir işaret sayılmayabilir."}, {"en": "For the first time, what comes next in a case older than twenty years is a question of payment rather than of law. The measure to watch over the coming months is plain: whether the high court takes up the pending appeal, and whether any payment or enforcement step is reported. If neither happens, the weight of the judgment stays on paper.", "refs": ["plo-judgment"], "tr": "Yirmi yılı aşan bir davanın bundan sonrası, ilk kez, hukuki bir sorudan çok bir ödeme sorusu. Önümüzdeki aylarda bakılacak ölçü açık: yüksek mahkeme bekleyen başvuruyu ele alıyor mu ve herhangi bir ödeme ya da icra adımı bildiriliyor mu. İkisi de gerçekleşmezse, hükmün ağırlığı kâğıt üzerinde kalmaya devam eder."}]}], "sources": [{"key": "plo-judgment", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/plo-lawsuit-antiterrorism-act-courts-694bea0f1557e8c262b569b603c13633", "title": {"tr": "Sotomayor, FKÖ ve Filistin Yönetimi aleyhindeki 656 milyon dolarlık tazminat kararını durdurmayı reddetti", "en": "Sotomayor declines to halt the $656 million judgment against the PLO and the Palestinian Authority"}, "publishedDate": "2026-08-03"}], "title": {"en": "In a case older than twenty years, the argument moved from jurisdiction to collection", "tr": "Yirmi yılı aşan davada tartışma yetkiden tahsilata geçti"}, "writer": "geo-06", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Washington is closing an embassy, two consulates, a presence post and a branch office. The projected saving is about 4.4 million dollars a year, and the document doing the work is a notice to lawmakers.", "tr": "Washington bir büyükelçiliği, iki başkonsolosluğu, bir temsil ofisini ve bir şube ofisini kapatıyor. Öngörülen tasarruf yılda yaklaşık 4,4 milyon dolar; işi gören belge ise milletvekillerine gönderilen bir bildirim."}, "sections": [{"h": {"en": "Four categories on one list", "tr": "Tek listede dört kategori"}, "ps": [{"en": "The five posts are not the same kind of thing. The State Department told Congress it would close the US embassy in Grenada, the consulates in Nagoya and Medan, the American Presence Post in Winnipeg and an embassy branch office in Douala. An embassy is accredited to a state. A consulate administers a consular district. A presence post and a branch office are extensions of a mission that continues to exist elsewhere in the same country. Of the five, one is an embassy.", "refs": ["source-one"], "tr": "Beş temsilcilik aynı türden birimler sayılmaz. Dışişleri Bakanlığı Kongre'ye, Grenada'daki ABD büyükelçiliğini, Nagoya ve Medan'daki başkonsoloslukları, Winnipeg'deki Amerikan Temsil Ofisi'ni ve Duala'daki büyükelçilik şube ofisini kapatacağını bildirdi. Büyükelçilik bir devlete akredite olur. Başkonsolosluk bir konsolosluk bölgesini yönetir. Temsil ofisi ve şube ofisi ise aynı ülkede başka bir yerde varlığını sürdüren bir temsilciliğin uzantısıdır. Beşi içinde yalnızca biri büyükelçiliktir."}, {"en": "The instrument is a notice, not a statute. In separate letters sent to lawmakers late last week and obtained by AP News, the department stated an intention. That is the whole legal weight the reporting establishes: an announced intention, a set of five names and a figure attached to them.", "refs": ["source-one"], "tr": "Kullanılan araç bir yasa değil, bir bildirim. AP News'in ulaştığı ve önceki haftanın son günlerinde milletvekillerine gönderilen ayrı yazılarda bakanlık bir niyet açıkladı. Habere dayanılarak kurulabilecek hukuki ağırlık bundan ibaret: açıklanmış bir niyet, beş isim ve bunlara iliştirilmiş bir rakam."}, {"en": "The figure is about 4.4 million dollars a year, and AP notes that the missions employ very few people compared with others. A saving that small is a weak explanation for a decision that changes where the United States keeps a permanent address. The more restrained reading is administrative consolidation whose selection criteria have not been published; a uniform cost programme applied to the smallest posts would look identical from outside, and nothing in the notices distinguishes the two.", "refs": ["source-one"], "tr": "Rakam yılda yaklaşık 4,4 milyon dolar ve AP, bu temsilciliklerin diğerlerine kıyasla çok az kişi çalıştırdığını belirtiyor. Bu büyüklükte bir tasarruf, ABD'nin nerede kalıcı bir adres tuttuğunu değiştiren bir karar için zayıf bir gerekçedir. Daha ölçülü okuma, seçim ölçütleri yayımlanmamış bir idari birleştirme olduğudur; en küçük temsilciliklere tek tip uygulanan bir gider programı dışarıdan tıpatıp aynı görünürdü ve bildirimlerde bu ikisini ayıran bir bilgi yok."}]}, {"h": {"en": "Doors opening in the same period", "tr": "Aynı dönemde açılan kapılar"}, "ps": [{"en": "The same administration is pressing ahead with plans to reopen shuttered posts in Libya and Syria, and it has already reopened the long-closed embassy in Venezuela. Placed beside the five closures, the change reads as a redistribution of where the United States is formally present rather than a withdrawal measured in dollars.", "refs": ["source-one"], "tr": "Aynı yönetim Libya ve Suriye'de kapalı temsilcilikleri açma planlarını sürdürüyor ve Venezuela'daki uzun süredir kapalı büyükelçiliği çoktan yeniden açtı. Beş kapanışın yanına konduğunda değişiklik, dolarla ölçülen bir geri çekilmeden çok, ABD'nin resmi olarak nerede bulunduğunun yeniden dağıtılması gibi okunuyor."}, {"en": "That redistribution has a direction the cost figure cannot express. Grenada, Winnipeg, Nagoya, Medan and Douala are being subtracted; Tripoli, Damascus and Caracas are being added or restored. Each of the three additions sits in a country where a permanent American address had been absent or interrupted, which is a different kind of asset from a consulate in a large allied economy.", "refs": ["source-one"], "tr": "Bu yeniden dağıtımın, gider rakamının anlatamayacağı bir yönü var. Grenada, Winnipeg, Nagoya, Medan ve Duala çıkarılıyor; Trablus, Şam ve Karakas ekleniyor ya da geri getiriliyor. Üç eklemenin her biri, kalıcı bir Amerikan adresinin bulunmadığı ya da kesintiye uğradığı ülkelerde; bu, büyük ve müttefik bir ekonomideki başkonsolosluktan farklı türde bir varlıktır."}, {"en": "What the notice cannot settle is what follows it. The reporting records that Congress was informed and what the department intends; it records no congressional response, condition or review step. Until one appears, the operative question is procedural rather than strategic: whether a notification of this kind is the end of the process or the opening of one.", "refs": ["source-one"], "tr": "Bildirimin çözemeyeceği şey, ardından ne geleceğidir. Haber, Kongre'nin bilgilendirildiğini ve bakanlığın neyi amaçladığını aktarıyor; Kongre'nin bir yanıtını, koşulunu ya da inceleme adımını aktarmıyor. Böyle bir adım görünene kadar asıl soru stratejik değil usule ilişkin: Bu türden bir bildirim sürecin sonu mu, yoksa bir sürecin başlangıcı mı?"}]}], "sources": [{"key": "source-one", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/trump-state-department-embassies-consulates-closures-20f74e71c13a8cbccb7ae3a36a1f7909", "title": {"tr": "Washington, üç bölgedeki beş diplomatik temsilciliğini kapatacağını Kongre'ye bildirdi", "en": "Washington tells Congress it will close five diplomatic posts in three regions"}, "publishedDate": "2026-08-04"}], "title": {"en": "Five posts, one instrument: a notice sent to Congress", "tr": "Beş temsilcilik, tek araç: Kongre'ye gönderilen bir bildirim"}, "writer": "geo-01", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Rome has an agenda with places on it: a deployment plan for Zawtar al-Gharbiyeh to be finalised, Bint Jbeil or Khiam to be designated next. The condition Israel states publicly for ending the occupation sits outside that list.", "tr": "Roma'daki gündemde yer adları var: Zavtar el-Garbiye için konuşlanma planı kesinleştirilecek, sırada Bint Cübeyl ya da Hıyam belirlenecek. İsrail'in işgali bitirmek için kamuoyu önünde koyduğu koşul ise bu listenin dışında duruyor."}, "sections": [{"h": {"en": "The agenda has come down from framework to map", "tr": "Gündem çerçeveden haritaya indi"}, "ps": [{"en": "The seventh round of US-mediated talks opened in Rome for three days with two items on it: designating new pilot areas for an Israeli withdrawal, with Bint Jbeil and Khiam named as possibilities, and finalising the Lebanese army's deployment plan for Zawtar al-Gharbiyeh, the first pilot zone under the framework agreed on 26 June. Six rounds produced one framework and one pilot zone. The seventh is being asked to produce a second.", "refs": ["source-one"], "tr": "ABD arabuluculuğundaki görüşmelerin yedinci turu, üç günlük programla ve iki maddeyle Roma'da açıldı: İsrail'in çekileceği yeni pilot bölgelerin belirlenmesi -olasılık olarak Bint Cübeyl ve Hıyam anılıyor- ve 26 Haziran'da varılan çerçeve kapsamındaki ilk pilot bölge Zavtar el-Garbiye için Lübnan ordusunun konuşlanma planının kesinleştirilmesi. Altı tur bir çerçeve ve bir pilot bölge üretti. Yedinci turdan ikinciyi üretmesi bekleniyor."}, {"en": "The composition of the Lebanese delegation says what is being negotiated. Two ambassadors, a brigadier-general, a legal adviser and a land-surveying expert. A team assembled to argue over principles has no obvious use for a surveyor; a team asked to agree where a line runs and which units stand behind it does.", "refs": ["source-one"], "tr": "Lübnan heyetinin bileşimi neyin pazarlık edildiğini gösteriyor. İki büyükelçi, bir tuğgeneral, bir hukuk danışmanı ve bir arazi ölçüm uzmanı. İlkeler üzerine tartışmak için kurulmuş bir heyetin ölçüm uzmanına belirgin bir ihtiyacı olmaz; bir hattın nereden geçtiğini ve arkasında hangi birliklerin duracağını karara bağlaması istenen heyetin olur."}]}, {"h": {"en": "The condition the agenda items do not reach", "tr": "Gündem maddelerinin ulaşamadığı koşul"}, "ps": [{"en": "Israel holds a buffer strip described as a 10 km Yellow Line inside Lebanon and, on Al Jazeera's account, occupies close to one-fifth of the country. Netanyahu has stated the condition for keeping it plainly: the buffer zone stays until Hezbollah disarms and as long as there is a threat. Hezbollah does not appear in the reporting as a party to the Rome talks.", "refs": ["source-one"], "tr": "İsrail, Lübnan içinde 10 km'lik Sarı Hat olarak tanımlanan bir tampon şeridi elinde tutuyor ve Al Jazeera'nın aktardığına göre ülkenin beşte birine yakınını işgal ediyor. Netanyahu bunu sürdürmenin koşulunu açıkça söyledi: Tampon bölge, Hizbullah silah bırakana kadar ve tehdit sürdüğü sürece kalacak. Habere göre Hizbullah, Roma görüşmelerinin tarafları arasında yer almıyor."}, {"en": "That arrangement can run its full course without touching the stated condition. Every pilot zone could be designated, every deployment plan signed, and the sentence about disarmament and threat would remain exactly as true as it was in June. The format advances a withdrawal in areas while the terms for ending it rest on an actor seated somewhere else.", "refs": ["source-one"], "tr": "Bu düzenek, söz konusu koşula hiç dokunmadan sonuna kadar işleyebilir. Her pilot bölge belirlenebilir, her konuşlanma planı imzalanabilir ve silah bırakma ile tehdide ilişkin cümle haziranda olduğu kadar geçerli kalır. Biçim, çekilmeyi bölge bölge ilerletirken çekilmeyi bitirecek koşullar başka bir yerde oturan bir aktöre bağlı duruyor."}, {"en": "The countercase is real and worth stating at full strength. A mediator may choose pilot zones precisely because a completed handover can create something a general demand cannot: an observed instance of a Lebanese army unit holding ground an Israeli unit vacated. That may become the raw material of any later argument about the wider line. Sequencing can buy evidence, and evidence is what a disputed condition may eventually have to be argued against.", "refs": ["source-one"], "tr": "Karşı görüş gerçektir ve tam gücüyle ifade edilmeyi hak eder. Bir arabulucu, pilot bölgeleri tam da tamamlanan bir devrin genel bir talebin yaratamayacağı bir şeyi üretebilmesi nedeniyle seçebilir: Bir İsrail birliğinin boşalttığı araziyi bir Lübnan ordusu birliğinin tuttuğuna dair gözlenmiş bir örnek. Bu, daha geniş hat üzerine ileride yürütülecek tartışmaların ham maddesi olabilir. Sıraya bağlamak kanıt biriktirebilir; tartışmalı bir koşul da eninde sonunda kanıtla karşılanabilir."}]}, {"h": {"en": "What these three days can actually settle", "tr": "Bu üç günün gerçekten karara bağlayabileceği şey"}, "ps": [{"en": "The ledger for Rome is short and checkable. Lebanon can arrive with a deployment plan for Zawtar al-Gharbiyeh and leave with it finalised. Israel can name a second pilot area. Both are acts with an address attached, and both are the sort of thing an outside party can later confirm or fail to confirm.", "refs": ["source-one"], "tr": "Roma'nın hesabı kısa ve denetlenebilir. Lübnan, Zavtar el-Garbiye için bir konuşlanma planıyla gelip planı kesinleştirmiş olarak dönebilir. İsrail ikinci bir pilot bölge belirleyebilir. İkisi de adresi olan işlemler ve ikisi de dışarıdan bir tarafın sonradan doğrulayabileceği ya da doğrulayamayacağı türden."}, {"en": "What neither side puts on the table in this format is a date. More than 4,000 people have been killed since the fighting began in March and more than a million have been displaced, and an arrangement that moves by village and by round leaves the cost of the interval to whoever is living in it. That is the weight the seventh round carries into the eighth.", "refs": ["source-one"], "tr": "Bu biçimde iki tarafın da masaya koymadığı şey bir tarihtir. Mart ayında çatışmalar başladığından bu yana 4.000'den fazla kişi öldü ve bir milyondan fazla kişi yerinden oldu; köy köy, tur tur ilerleyen bir düzenek, aradaki sürenin bedelini o sürenin içinde yaşayanlara bırakır. Yedinci turun sekizinciye taşıdığı yük budur."}]}], "sources": [{"key": "source-one", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/seventh-round-of-israel-lebanon-talks-begins-whats-on-the-agenda", "title": {"tr": "İsrail-Lübnan görüşmelerinin yedinci turu Roma'da pilot çekilme bölgeleri üzerine başladı", "en": "A seventh round of Israel-Lebanon talks opens in Rome over pilot withdrawal zones"}, "publishedDate": "2026-08-04"}], "title": {"en": "The seventh round bargains over village names", "tr": "Yedinci turda pazarlık köy adları üzerinden yürüyor"}, "writer": "geo-02", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "A short-range attack drone reached a market space beside a roundabout. BBC Verify geolocated it. A United Nations report had already found the pattern a year earlier.", "tr": "Kısa menzilli bir saldırı aracı, bir kavşağın yanındaki pazar alanına ulaştı. BBC Verify görüntüyü konumlandırdı. Bir Birleşmiş Milletler raporu bu örüntüyü bir yıl önce zaten saptamıştı."}, "sections": [{"h": {"en": "Range decides who is inside it", "tr": "Menzil, kimin içeride kaldığını belirler"}, "ps": [{"en": "BBC Verify placed the footage at a market space beside a roundabout in the Tavriiskyi district of northern Kherson, a city a few miles from the front line. That single geolocation carries the military content of the story. A market inside a short-range drone's operating radius is inside the engagement envelope, and no rule of engagement written after the fact changes the geometry.", "refs": ["source-one"], "tr": "BBC Verify görüntüyü Herson'un kuzeyindeki Tavriyskiy semtinde, cephe hattına birkaç kilometre uzaklıktaki kentte bir kavşağın yanındaki pazar alanına yerleştirdi. Hikâyenin askeri içeriğini bu tek konumlandırma taşıyor. Kısa menzilli bir insansız hava aracının çalışma yarıçapı içindeki bir pazar, angajman zarfının içindedir ve sonradan yazılan hiçbir angajman kuralı bu geometriyi değiştirmez."}, {"en": "The employment sequence matters more than the platform. The drone hovered, followed the man as he moved behind a white van, went under an umbrella as he circled the other way, then dived and detonated on impact. Each of those is an operator input rather than a fuse setting. A munition flown by a person watching a live feed makes discrimination a decision that is taken, not a limitation of the seeker.", "refs": ["source-one"], "tr": "Kullanım sırası, platformun kendisinden daha önemli. Araç havada asılı kaldı, adam beyaz minibüsün arkasına geçerken onu izledi, adam öbür taraftan dolanırken şemsiyenin altına girdi, sonra dalarak çarpma anında patladı. Bunların her biri bir tapa ayarı değil, operatörün verdiği bir karardır. Canlı görüntü izleyen bir insan tarafından uçurulan bir mühimmatta ayrım gözetmek, arayıcı başlığın sınırı olmaktan çıkıp alınan bir karara dönüşür."}]}, {"h": {"en": "What was already documented", "tr": "Daha önce belgelenmiş olan"}, "ps": [{"en": "A 2025 United Nations report found that Russian armed forces had recurrently killed and injured civilians in this area by using drones to target them. That is a monitoring body's finding, and it predates this video by a year. Ukraine's foreign minister called the attack a barbaric war crime and the practice a deliberate and systemic Russian strategy; that is a belligerent's characterisation of an adversary's intent and carries a different evidentiary weight. Russia is not quoted in the report.", "refs": ["source-one"], "tr": "Birleşmiş Milletler'in 2025 tarihli raporu, Rus silahlı kuvvetlerinin bu bölgede insansız hava araçlarıyla sivilleri hedef alarak defalarca sivil öldürdüğünü ve yaraladığını saptamıştı. Bu bir izleme kuruluşunun bulgusu ve söz konusu görüntüden bir yıl önceye ait. Ukrayna dışişleri bakanı saldırıyı barbarca bir savaş suçu, bu uygulamayı da kasıtlı ve sistemli bir Rus stratejisi diye niteledi; bu ise savaşan bir tarafın karşı tarafın niyetine ilişkin değerlendirmesidir ve kanıt değeri farklıdır. Haberde Rusya'nın görüşüne yer verilmiyor."}, {"en": "The same UN report addressed the publication and not only the strike: posting videos of civilians being killed and injured amounts to the war crime of outrages upon personal dignity. That is the part with a military logic behind it. A weapon used to empty a district needs the district to see it work, so the recording is part of the effect rather than a by-product of it. The drone that filmed a man holding up heads of garlic was carrying a camera for two reasons at once.", "refs": ["source-one"], "tr": "Aynı BM raporu yalnızca saldırıyı değil, paylaşımı da ele aldı: Sivillerin öldürüldüğü ve yaralandığı görüntülerin yayımlanması, kişi onuruna saldırı savaş suçunu oluşturur. Arkasında askeri bir mantık bulunan kısım burasıdır. Bir semti boşaltmak için kullanılan silahın işe yaradığını o semtin görmesi gerekir; dolayısıyla görüntü kaydı, etkinin yan ürünü değil parçasıdır. Sarımsak başları kaldıran bir adamı görüntüleyen aracın kamerası aynı anda iki işi birden görüyordu."}]}, {"h": {"en": "Does visibility impose any cost?", "tr": "Görünürlük bir bedel yükler mi?"}, "ps": [{"en": "Zelensky wrote on Telegram that the world must see this. Both sides now want the same footage circulated, for opposite reasons, which is the ordinary condition of an attack designed around an audience. Publicity is the medium the tactic runs on, so neither side's use of it tells you much about whether the tactic will continue.", "refs": ["source-one"], "tr": "Zelenski Telegram'da dünyanın bunu görmesi gerektiğini yazdı. Artık iki taraf da aynı görüntünün yayılmasını, zıt gerekçelerle istiyor; bir izleyici kitlesi üzerine kurulmuş bir saldırının olağan hali budur. Tanıtım, taktiğin üzerinde işlediği ortamdır; bu yüzden taraflardan hiçbirinin bunu kullanması taktiğin süreceği konusunda pek bir şey söylemez."}, {"en": "The observable test is narrower. If publication is part of the intended effect, international attention should not suppress the pattern near Kherson's markets over the coming weeks while the front line stays where it is. A thinning-out under those conditions would point to a change in the operating unit's orders rather than to embarrassment. Yuriy left with concussion, trauma and multiple shrapnel wounds, and his van was destroyed. One vehicle and one vendor is the unit in which this campaign is actually paid for.", "refs": ["source-one"], "tr": "Gözlenebilir sınama daha dar. Yayımlamak amaçlanan etkinin parçasıysa, uluslararası ilgi önümüzdeki haftalarda cephe hattı yerinde dururken Herson pazarlarının çevresindeki örüntüyü bastırmamalı. Bu koşullarda seyrelme görülmesi, utançtan çok saldırıyı yürüten birimin aldığı emirlerin değiştiğine işaret eder. Yuriy sarsıntı, travma ve çok sayıda şarapnel yarasıyla kurtuldu, minibüsü kullanılamaz hale geldi. Bu harekâtın bedelinin gerçekte ödendiği birim, bir araç ve bir satıcıdır."}]}], "sources": [{"key": "source-one", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cn4n03xg981o", "title": {"tr": "Kiev, Herson'da sebze satıcısına yapılan insansız hava aracı saldırısını savaş suçu olarak niteledi", "en": "Kyiv calls a drone attack on a Kherson vegetable seller a war crime after video emerges"}, "publishedDate": "2026-08-04"}], "title": {"en": "Kherson sits a few miles from the front, and that is the capability question", "tr": "Herson cepheye birkaç kilometre uzaklıkta; kabiliyet sorusu da bu"}, "writer": "geo-03", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Brent fell almost 5 percent to under 80 dollars after the Treasury secretary said a Hormuz deal might come today or tomorrow. Yesterday it fell 4.5 percent on a different sentence. Between the two there is still no published agreement.", "tr": "Hazine bakanının Hormuz anlaşmasının bugün ya da yarın gelebileceğini söylemesinin ardından Brent yüzde 5'e yakın gerileyip 80 dolar sınırının altına indi. Dün de başka bir cümleyle yüzde 4,5 gerilemişti. İki hareket arasında yayımlanmış bir anlaşma hâlâ yok."}, "sections": [{"h": {"en": "The second move on the second sentence", "tr": "İkinci cümle üzerine ikinci hareket"}, "ps": [{"en": "Brent fell by almost 5 percent to under 80 dollars a barrel and US West Texas Intermediate by more than 5 percent to 76 dollars, the lowest for both contracts since 13 July, after Treasury Secretary Scott Bessent told CNBC there was a chance of a deal today or tomorrow to open the strait.", "refs": ["source-one"], "tr": "Hazine Bakanı Scott Bessent'in CNBC'ye boğazı açacak bir anlaşmanın bugün ya da yarın gelme ihtimali bulunduğunu söylemesinin ardından Brent yüzde 5'e yakın gerileyerek varil başına 80 dolar sınırının altına, ABD'nin West Texas Intermediate cinsi ise yüzde 5'ten fazla düşerek 76 dolar düzeyine indi; iki sözleşme de 13 Temmuz'dan bu yana en düşük düzeyde."}, {"en": "This column made the same measurement yesterday on a 4.5 percent fall that followed a different statement about the perimeters of a deal. What has been added between the two moves is a second speaker. At the State Department, Rubio told reporters that progress had been made in discussions with Iran and Oman on getting more ships through, but not finality yet, and no details of what a potential deal would look like have been released.", "refs": ["source-one", "history-one"], "tr": "Bu köşe, dün de bir anlaşmanın çerçevesine ilişkin başka bir açıklamanın ardından gelen yüzde 4,5'lik düşüş üzerine aynı ölçümü yapmıştı. İki hareket arasına eklenen tek şey ikinci bir konuşmacı oldu. Dışişleri Bakanlığı'nda gazetecilere konuşan Rubio, İran ve Umman'la daha fazla geminin geçişine ilişkin görüşmelerde ilerleme sağlandığını, ancak henüz kesinlik bulunmadığını söyledi; olası bir anlaşmanın nasıl görüneceğine dair ayrıntı açıklanmadı."}]}, {"h": {"en": "Where a reopening would show up first", "tr": "Yeniden açılış önce nerede görünür?"}, "ps": [{"en": "Before the conflict began in late February the waterway handled about one-fifth of global daily oil and liquefied natural gas supplies. The slower series is at the pump. The RAC puts average UK petrol at 1.60 pounds a litre, back at the level seen when the conflict started, and the AAA puts US gasoline above 4 dollars a gallon with diesel almost 5.40 dollars. A futures contract can reprice in an afternoon; a national average cannot.", "refs": ["source-one"], "tr": "Şubat sonunda çatışma başlamadan önce bu su yolundan dünyanın günlük petrol ve sıvılaştırılmış doğal gaz arzının yaklaşık beşte biri geçiyordu. Daha yavaş seri pompada. RAC, Birleşik Krallık'ta ortalama benzini litre başına 1,60 sterlin olarak veriyor; bu, çatışmanın başındaki düzey. AAA ise ABD'de benzini galon başına 4 dolar üzerinde, motorini 5,40 dolar dolayında gösteriyor. Bir vadeli sözleşme bir öğleden sonrada yeniden fiyatlanabilir; ülke ortalaması fiyatlanamaz."}, {"en": "The unresolved commercial term is the charge. Asked whether Iran would be allowed to charge ships for passage, Bessent answered that it would be freedom of movement. Whether transit carries a fee decides whether a reopened strait restores the pre-war cost of the route or writes a new line into the cost of every voyage through it, and no text exists to answer that.", "refs": ["source-one"], "tr": "Çözülmemiş ticari koşul, ücret meselesi. İran'ın geçiş için gemilerden ücret almasına izin verilip verilmeyeceği sorulduğunda Bessent serbest dolaşım olacağını söyledi. Geçişin ücretli olup olmayacağı, yeniden açılan bir boğazın rotanın savaş öncesi giderini geri getireceğini mi, yoksa oradan geçen her seferin giderine yeni bir kalem yazacağını mı belirler; bunu yanıtlayacak bir metin ortada yok."}, {"en": "The countercase deserves its full weight. An understanding can ease war-risk cover and voyage planning before a single cargo moves, in which case the curve has read correctly something the physical series has yet to show. Qatar says its efforts with other mediators are continuing while admitting that no direct talks are currently planned, and Iran maintains it is talking only to Oman. A mediation channel that exists while a direct channel does not is exactly the structure in which a workable arrangement can be assembled quietly and announced late.", "refs": ["source-one"], "tr": "Karşı görüş tam ağırlığını hak ediyor. Bir mutabakat, tek bir yük hareket etmeden önce savaş riski teminatını ve sefer planlamasını rahatlatabilir; bu durumda eğri, fiziksel serinin henüz göstermediği bir şeyi doğru okumuş olur. Katar, diğer arabuluculara yönelik çabalarının sürdüğünü söylerken şu an planlanmış doğrudan bir görüşme bulunmadığını kabul ediyor; İran ise yalnızca Umman'la görüştüğünü yineliyor. Doğrudan kanalın bulunmadığı ama arabuluculuk kanalının var olduğu yapı, işleyebilir bir düzenlemenin sessizce kurulup geç duyurulmasına tam olarak uygun bir yapıdır."}]}, {"h": {"en": "The testable form", "tr": "Sınanabilir hâli"}, "ps": [{"en": "The test runs to mid-September and it has two branches. If a text on the strait is published and commercial transits resume, the pump averages should move within weeks of the first sustained sailings. If only statements continue, Brent should give back this week's fall on the next denial from Tehran.", "refs": ["source-one"], "tr": "Sınama eylül ortasına kadar sürüyor ve iki kolu var. Boğaza ilişkin bir metin yayımlanır ve ticari geçişler yeniden başlarsa, pompa ortalamalarının ilk düzenli seferlerden birkaç hafta sonra hareket etmesi gerekir. Yalnızca açıklamalar sürerse, Brent'in Tahran'dan gelecek bir sonraki yalanlamayla bu haftaki düşüşü geri vermesi gerekir."}, {"en": "Either way the number worth keeping is the gap between the announcement date and the first sailing date. Two price moves in two days on two sentences have already established what the futures market will pay for a statement. What it will pay for a signed route is still unpriced.", "refs": ["source-one", "history-one"], "tr": "Her iki durumda da saklanmaya değer sayı, duyuru tarihi ile ilk sefer tarihi arasındaki farktır. İki günde iki cümle üzerine yaşanan iki fiyat hareketi, vadeli piyasanın bir açıklamaya ne ödediğini çoktan ortaya koydu. İmzalanmış bir rotaya ne ödeyeceği ise hâlâ fiyatlanmadı."}]}], "sources": [{"key": "source-one", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cpw9v0gnzxwo", "title": {"tr": "Bessent 'bugün ya da yarın' deyince Brent 80 dolar sınırının altına indi", "en": "Brent falls below 80 dollars after Bessent says a Hormuz deal could come today or tomorrow"}, "publishedDate": "2026-08-04"}, {"key": "history-one", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-04/2026-08-04/", "title": {"tr": "Anlaşma duyurulduğunda ölçülen tek şey fiyattı", "en": "When the deal was announced, the only thing measured was the price"}, "publishedDate": "2026-08-04"}], "title": {"en": "Two statements, two price moves, no text", "tr": "İki açıklama, iki fiyat hareketi, ortada metin yok"}, "writer": "geo-04", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Paul Biya promoted five colonels and returned the presidential guard's commander to the post he has held since 2013. The cabinet he promised after last year's election and the vice-presidency created in April are still empty.", "tr": "Paul Biya beş albayı terfi ettirdi ve cumhurbaşkanlığı muhafız alayı komutanını 2013'ten beri yürüttüğü göreve geri getirdi. Geçen yılki seçimin ardından söz verdiği kabine ile nisanda oluşturulan cumhurbaşkanı yardımcılığı ise hâlâ boş."}, "sections": [{"h": {"en": "Two lists", "tr": "İki liste"}, "ps": [{"en": "The decrees signed on Monday from Geneva appointed officials to key army positions and raised five colonels to brigadier general. One of them, Raymond Jean Charles Beko'o Abondo, was immediately reappointed commander of the presidential guard, the unit responsible for protecting the president, which he has led since 2013. The list confirms people who are already where they are.", "refs": ["source-one"], "tr": "Pazartesi günü Cenevre'de imzalanan kararnameler ordudaki kilit görevlere atamalar yaptı ve beş albayı tuğgeneralliğe yükseltti. Bunlardan biri olan Raymond Jean Charles Beko'o Abondo, cumhurbaşkanının korunmasından sorumlu ve 2013'ten beri yönettiği muhafız alayının komutanlığına hemen yeniden atandı. Liste, zaten bulundukları yerde olan kişileri onaylıyor."}, {"en": "The second list is what the decrees left alone. A cabinet promised after last year's presidential election has not been named. A vice-presidency created in April is still unfilled. Both would require choosing among people who would then hold power inside the country, which is a heavier act than confirming an officer already in command.", "refs": ["source-one"], "tr": "İkinci liste, kararnamelerin dokunmadıklarından oluşuyor. Geçen yılki cumhurbaşkanlığı seçiminin ardından söz verilen kabine açıklanmadı. Nisanda oluşturulan cumhurbaşkanı yardımcılığı hâlâ boş. Her ikisi de ülke içinde yetki kullanacak kişiler arasında bir seçim yapmayı gerektirir; bu, halihazırda komutada olan bir subayı onaylamaktan daha ağır bir işlemdir."}, {"en": "A quieter reading fits the same facts. Both appointments may simply be files a president prefers to sign at home, or ones held back for a political moment that has not arrived. What can be said from the reporting is narrower: during nearly 60 days abroad the decree channel has carried army promotions and authorisations for his government to sign loan agreements with international financial institutions, and it has not carried the two appointments that would redistribute domestic authority.", "refs": ["source-one"], "tr": "Aynı olgulara daha sakin bir okuma da uyuyor. İki atama, bir cumhurbaşkanının ülkede imzalamayı yeğlediği dosyalar ya da henüz gelmemiş bir siyasi ana saklanan dosyalar olabilir. Haberden söylenebilecek olan daha dar: Yurt dışındaki yaklaşık 60 gün boyunca kararname kanalı ordudaki terfileri ve hükümete uluslararası finans kuruluşlarıyla kredi anlaşmaları imzalama yetkisini taşıdı; iç yetkiyi yeniden dağıtacak iki atamayı ise taşımadı."}]}, {"h": {"en": "Who is contesting it?", "tr": "Buna kim itiraz ediyor?"}, "ps": [{"en": "Communication Minister Rene Emmanuel Sadi told the French-language broadcaster RFI that the president is alive, will return soon and continues to work from Geneva, and rejected the opposition's claim that the absence amounts to a vacancy at the head of state. Mamadou Mota, vice-president of the opposition CRM, said last month that the country faced a glaring institutional vacuum, and that executive power is exercised at the heart of the nation rather than through smoke signals or telepathy from hotel suites on the other side of the world.", "refs": ["source-one"], "tr": "İletişim Bakanı Rene Emmanuel Sadi, Fransızca yayın yapan RFI'ye cumhurbaşkanının hayatta olduğunu, yakında döneceğini ve Cenevre'den çalışmayı sürdürdüğünü söyledi; muhalefetin bu yokluğun devlet başkanlığında bir boşluk anlamına geldiği yönündeki iddiasını reddetti. Muhalefetteki CRM'nin genel başkan yardımcısı Mamadou Mota bir ay önce ülkede göz önünde duran bir kurumsal boşluk bulunduğunu, yürütme yetkisinin dünyanın öbür ucundaki otel süitlerinden duman işaretleriyle ya da telepatiyle değil ulusun merkezinde kullanıldığını söyledi."}, {"en": "The argument is being conducted with one instrument removed from the public side of it. Reporting on the president's health has been banned in Cameroon since an announcement two years ago, so the question that would settle the dispute between Sadi and Mota is the one Cameroonian journalists cannot put in print. That constraint shapes what each side is able to assert and what neither can be held to.", "refs": ["source-one"], "tr": "Tartışma, kamusal tarafından bir araç eksiltilmiş halde yürütülüyor. Kamerun'da cumhurbaşkanının sağlığına ilişkin haber yapmak iki yıl önce duyurulan bir kararla yasak; dolayısıyla Sadi ile Mota arasındaki anlaşmazlığı çözecek soru, Kamerunlu gazetecilerin yazıya dökemediği sorudur. Bu kısıt, her iki tarafın neyi öne sürebileceğini ve hiçbirinin neyden sorumlu tutulamayacağını belirliyor."}]}, {"h": {"en": "A habit, or a signal?", "tr": "Alışkanlık mı, işaret mi?"}, "ps": [{"en": "Three earlier reshuffles are reported: after the 2023 coup in neighbouring Gabon, during last year's campaign for an eighth term, and again in June. Read against those three, Monday's decrees are the fourth instance of a familiar move by a government that reaches for the army list when it is being watched closely. On its own it is thin evidence of anything new.", "refs": ["source-one"], "tr": "Daha önceki üç değişiklik aktarılıyor: komşu Gabon'daki 2023 darbesinin ardından, geçen yıl sekizinci dönem kampanyası sırasında ve yeniden haziranda. Bu üçüyle birlikte okunduğunda pazartesinin kararnameleri, yakından izlendiği dönemlerde ordu listesine uzanan bir yönetimin tanıdık hamlesinin dördüncü örneği. Tek başına yeni bir şeyin zayıf bir kanıtıdır."}, {"en": "What separates habit from signal is the other list, and Cameroonians can watch it without any access to Geneva. If the cabinet is named or the vice-presidency filled while Biya is still abroad, the decree channel is doing more than confirming the army's top ranks. If neither happens before Biya returns, the loan authorisations signed abroad are the more consequential paper of these two months, and the promotions are the visible surface of a continuity being managed rather than announced.", "refs": ["source-one"], "tr": "Alışkanlığı işaretten ayıran şey öteki listedir ve Kamerunlular bunu Cenevre'ye hiç erişmeden izleyebilir. Kabine açıklanır ya da cumhurbaşkanı yardımcılığı doldurulursa, üstelik bu Biya hâlâ yurt dışındayken olursa, kararname kanalı ordunun üst kademesini onaylamaktan fazlasını yapıyor demektir. Biya'nın dönüşünden önce ikisi de olmazsa, bu iki ayın daha belirleyici belgesi yurt dışında imzalanan kredi yetkileridir; terfiler ise duyurulmaktan çok yönetilen bir sürekliliğin görünen yüzüdür."}]}], "sources": [{"key": "source-one", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/ckg9kd27lkpo", "title": {"tr": "Biya, Kamerun'dan ayrılışı 60 güne yaklaşırken ordudaki terfileri Cenevre'den imzaladı", "en": "Biya signs army promotions from Geneva as his absence from Cameroon nears 60 days"}, "publishedDate": "2026-08-04"}], "title": {"en": "What a decree can reach from Geneva", "tr": "Cenevre'den bir kararnamenin ulaşabildiği yer"}, "writer": "geo-05", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The port investigation was meant to be the test of a judiciary that had just been promised independence. The sixth anniversary arrives with a second destruction on top of the first and a reconstruction fund attached to someone else's condition.", "tr": "Liman soruşturması, henüz bağımsızlık sözü verilmiş bir yargının sınavı olacaktı. Altıncı yıl dönümü, birincinin üzerine binen ikinci bir yıkımla ve başkasının koşuluna bağlanmış bir imar fonuyla geldi."}, "sections": [{"h": {"en": "Three dates in order", "tr": "Sırasıyla üç tarih"}, "ps": [{"en": "2019: the economy collapsed and depositors lost access to their savings, which they still do not have. 4 August 2020: a store of ammonium nitrate at the port exploded and killed more than 200 people. 2024: an escalation the World Bank costed at 11 billion dollars, with a reconstruction bill Al Jazeera reports could reach 20 billion and more than a million people displaced by the recent conflict.", "refs": ["source-one"], "tr": "2019: Ekonomi çöktü ve mevduat sahipleri birikimlerine erişimini yitirdi; hâlâ da erişemiyorlar. 4 Ağustos 2020: Limandaki amonyum nitrat yığını patladı ve 200'den fazla kişi öldü. 2024: Dünya Bankası'nın 11 milyar dolar olarak hesapladığı bir tırmanma yaşandı; Al Jazeera'ya göre imar faturası 20 milyar dolara ulaşabilir ve son çatışmada bir milyondan fazla kişi yerinden oldu."}, {"en": "The order matters because the anniversary now falls inside a larger reconstruction question than the one the port created. The 2020 file asks who is answerable for a stockpile. The 2024 damage asks who pays for a country. The same state is handling both at the same time, and only one of them has money attached to it.", "refs": ["source-one"], "tr": "Sıra önemli, çünkü yıl dönümü artık limanın yarattığından daha büyük bir imar sorusunun içine düşüyor. 2020 dosyası bir yığından kimin sorumlu olduğunu soruyor. 2024'teki hasar ise bir ülkenin bedelini kimin ödeyeceğini. Aynı devlet ikisini aynı anda yürütüyor ve yalnızca birinin arkasında para var."}]}, {"h": {"en": "What was the institution's test?", "tr": "Kurumun sınavı neydi?"}, "ps": [{"en": "Al Jazeera reports that leadership changes promised judicial independence and that six years on there is still no accountability, with families continuing to press the authorities. Settlements endure when institutions absorb contestation. Here the contestation has stayed outside the institution, in the hands of relatives who return to it each August, which is the position it occupied on the first anniversary.", "refs": ["source-one"], "tr": "Al Jazeera, yönetim değişikliklerinin yargı bağımsızlığı vaat ettiğini ve altı yıl sonra hâlâ hesap sorulmadığını, ailelerin yetkilileri sıkıştırmayı sürdürdüğünü aktarıyor. Uzlaşmalar, kurumlar itirazı içine alabildiğinde kalıcı olur. Burada itiraz kurumun dışında, her ağustosta konuya dönen yakınların elinde kaldı; ilk yıl dönümünde de bulunduğu yer burasıydı."}, {"en": "The disanalogy is what keeps this from being one long story of impunity. The port file is a domestic judicial question with a domestic path to a verdict, blocked from inside. The reconstruction money is blocked by a condition set elsewhere: Al Jazeera reports that aid is being used as leverage to press for Hezbollah's disarmament, that the ceasefire carries no guarantee against renewed fighting, and that the agreement sets no timetable for an Israeli withdrawal. Treating the two as one arc would hide which lever exists for which problem.", "refs": ["source-one"], "tr": "Bunu tek bir uzun cezasızlık hikâyesi olmaktan çıkaran şey, aradaki benzemezliktir. Liman dosyası, hükme giden iç yolu bulunan ve içeriden tıkanmış bir yargı sorusudur. İmar parası ise başka bir yerde konulmuş bir koşulla tıkalı: Al Jazeera, yardımın Hizbullah'ın silah bırakması yönünde baskı aracı olarak kullanıldığını, ateşkesin yeniden çatışmaya karşı güvence içermediğini ve anlaşmada İsrail'in çekilmesi için takvim bulunmadığını bildiriyor. İkisini tek bir yay gibi ele almak, hangi sorun için hangi kolun bulunduğunu gizlerdi."}]}, {"h": {"en": "What would break the continuity?", "tr": "Sürekliliği ne kırar?"}, "ps": [{"en": "In the south the practical question is smaller and harder than either. Haidar Mudayhi, who heads the al-Mansouri municipality, said that the Israelis drop stun grenades every time someone tries to reach those areas. A reconstruction budget cannot be spent where a surveyor cannot stand, so the figure of 20 billion dollars describes an intention before it describes a plan.", "refs": ["source-one"], "tr": "Güneyde asıl soru bu ikisinden de küçük ve daha zor. Mansuriye belediye başkanı Haydar Mudayhi, biri o bölgelere ulaşmaya çalıştığında İsrail'in her seferinde ses bombası attığını söyledi. Bir ölçüm uzmanının ayakta duramadığı yerde imar bütçesi harcanamaz; bu yüzden 20 milyar dolar rakamı, bir plandan önce bir niyeti tarif ediyor."}, {"en": "Two events would break the pattern rather than extend it. A dated indictment in the port file would show a domestic institution absorbing a contest it has deferred for six years. Reconstruction money released without the disarmament condition would show the external lever loosening. Neither has a scheduled date. Until one does, each August adds a year to the count and nothing to the file.", "refs": ["source-one"], "tr": "İki gelişme örüntüyü sürdürmek yerine kırardı. Liman dosyasında tarihli bir iddianame, iç kurumun altı yıldır ertelediği bir itirazı içine aldığını gösterirdi. Silah bırakma koşuluna bağlanmadan serbest bırakılacak imar parası ise dışarıdaki kolun gevşediğini gösterirdi. İkisinin de belirlenmiş bir tarihi yok. Biri belirlenene kadar her ağustos sayıya bir yıl, dosyaya hiçbir şey ekliyor."}]}], "sources": [{"key": "source-one", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/beirut-port-blast-anniversary-overshadowed-by-new-wave-of-destruction", "title": {"tr": "Beyrut, liman patlamasının altıncı yılını dosya hâlâ sonuçlanmadan andı", "en": "Beirut marks six years since the port blast with the file still unresolved"}, "publishedDate": "2026-08-04"}], "title": {"en": "Six years, two reconstruction bills, one file that did not move", "tr": "Altı yıl, iki imar faturası ve yerinden kıpırdamayan bir dosya"}, "writer": "geo-06", "n": 3, "radarPublishedAt": "2026-08-04T17:35:04+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The Board of Peace published a fifteen-point implementation plan on Friday. Two days later its representative for Gaza wrote that the strikes had killed civilians and destroyed the medicines people rely on. The plan assigns obligations to both sides. It does not say who checks that they are met.", "tr": "Barış Kurulu cuma günü on beş maddelik bir uygulama planı yayımladı. İki gün sonra kurulun Gazze temsilcisi, saldırıların sivilleri öldürdüğünü ve ilaç stoklarını yok ettiğini yazdı. Plan iki tarafa da yükümlülük veriyor; bu yükümlülüğü kimin denetleyeceğini yazmıyor."}, "sections": [{"h": {"en": "The plan published on Friday", "tr": "Cuma günü yayımlanan plan"}, "ps": [{"en": "The fifteen-point roadmap the Board of Peace published on Friday divides the last stage of the ceasefire between the two sides: Hamas is to hand its weapons gradually to a Palestinian administration, and Israel is to begin withdrawing from Gaza before Hamas has fully disarmed. Nickolay Mladenov, the Board's High Representative for Gaza, named Egypt, Turkey, Qatar and the United States as the mediators and said both parties carry obligations under the comprehensive plan and the Sharm El Sheikh arrangement. Two days later the same representative wrote that strikes across Gaza had killed civilians and destroyed the medical supplies people depend on.", "refs": ["bop-envoy", "gaza-strikes"], "tr": "Barış Kurulu'nun cuma günü yayımladığı on beş maddelik yol haritası, ateşkesin son aşamasını iki tarafa bölüştürüyor: Hamas silahlarını kademeli olarak bir Filistin yönetimine devredecek, İsrail ise Hamas tümüyle silahsızlanmadan önce Gazze'den çekilmeye başlayacak. Kurulun Gazze Yüksek Temsilcisi Nickolay Mladenov, arabulucular olarak Mısır, Türkiye, Katar ve ABD'yi andı ve iki tarafın da kapsamlı plan ile Şarm El-Şeyh düzenlemesi altında yükümlülük taşıdığını belirtti. İki gün sonra aynı temsilci, Gazze genelindeki saldırıların sivilleri öldürdüğünü ve insanların bağımlı olduğu ilaç stoklarını yok ettiğini yazdı."}, {"en": "What kind of document is this? It distributes obligations, but it defines no body to inspect them, no penalty that operates on breach and no timetable showing by when a step must have been taken. The office set up to carry it holds a single instrument: a public account of what happened. Binding instruments look different from that; a monitoring team with a right of access, a permit that can be withdrawn, a payment that can be stopped.", "refs": ["bop-envoy"], "tr": "Bu ne tür bir belgedir? Yükümlülük dağıtıyor, ama denetleyecek bir organ, ihlal hâlinde işleyecek bir yaptırım ya da bir adımın hangi tarihe kadar atılmış olması gerektiğini gösteren bir takvim tanımlamıyor. Onu yürütmek üzere kurulan makamın elinde tek bir araç var: olan bitenin kamuya anlatılması. Bağlayıcı araçlar bundan farklı görünür; erişim yetkisi olan bir gözlemci heyeti, geri alınabilen bir izin, kesilebilen bir ödeme gibi."}]}, {"h": {"en": "The order each side reads", "tr": "İki tarafın okuduğu sıra"}, "ps": [{"en": "On the Israeli side, Netanyahu's spokesman Doron Spielman said disarming means physically handing over the weapons and that nothing less would do, repeating that Israel would not withdraw until Hamas had fully disarmed; Energy Minister Eli Cohen told Army Radio there was no deal to halt the attacks. Senior Hamas official Basem Naim said the group had shown considerable flexibility and tied any handover to Israel stopping its operations and pulling back. The same text is being read in the two capitals in opposite orders.", "refs": ["gaza-strikes", "bop-envoy"], "tr": "İsrail tarafında Netanyahu'nun sözcüsü Doron Spielman, silahsızlanmanın silahların fiilen teslim edilmesi anlamına geldiğini, bundan azının kabul edilmeyeceğini söyledi ve İsrail'in Hamas tümüyle silah bırakmadan çekilmeyeceğini yineledi; Enerji Bakanı Eli Cohen ordu radyosuna saldırıları durduran bir anlaşma bulunmadığını söyledi. Hamas'ın üst düzey yetkilisi Basem Naim ise örgütün önemli ölçüde esneklik gösterdiğini savundu ve teslimi İsrail'in operasyonları durdurmasına ve geri çekilmesine bağladı. Aynı metin, iki başkentte birbirinin tersi sırayla okunuyor."}, {"en": "With no agreed first move and no body to certify it, the only instrument the implementing office can use is a public statement. There is another possible explanation: the Board may hold leverage that does not become public, exercised through Washington and the three mediators, in which case the post is an opening move rather than the ceiling of its authority. The way to tell them apart is to watch for a mechanism with a name.", "refs": ["bop-envoy"], "tr": "Üzerinde uzlaşılmış bir ilk adım da, o adımı doğrulayacak bir merci de yoksa, uygulamayı yürüten makamın kullanabildiği tek araç kamuoyuna açıklama olarak kalıyor. Bunun bir başka açıklaması da mümkün: Kurul, Washington ve üç arabulucu üzerinden kamuya yansımayan bir baskı gücü taşıyor olabilir; o durumda paylaşım yetkinin sınırı değil, bir açılış hamlesidir. İkisini ayırmanın yolu, adı konmuş bir mekanizmanın ortaya çıkıp çıkmadığına bakmak."}]}, {"h": {"en": "Where the authority would become visible", "tr": "Yetkinin görünür hâle geleceği yer"}, "ps": [{"en": "The next real indicator will therefore not be a statement but a named arrangement: a monitoring team with defined access, a first step with a date attached, or one of the parties publicly accepting a sequence it had rejected. If none of these appears by 30 September, there is no ground for expecting the Hamas handover of weapons to begin while the strikes continue. In the meantime the counts accumulate: Palestinian medics reported at least 18 killed on Sunday, and Gaza health authorities say more than 1,230 Palestinians have died since the October ceasefire, alongside four Israeli soldiers in the same period.", "refs": ["gaza-strikes", "bop-envoy"], "tr": "Bu yüzden sıradaki asıl gösterge bir açıklama değil, adı konmuş bir düzenek olacak: erişim yetkisi tanımlanmış bir gözlem heyeti, tarihi belirlenmiş bir ilk adım ya da taraflardan birinin daha önce reddettiği sıralamayı açıkça kabul etmesi. Bunlardan biri 30 Eylül'e kadar ortaya çıkmazsa, saldırılar sürerken Hamas'ın silah devrini beklemek için bir dayanak kalmıyor. Arada sayılar birikiyor: Filistinli sağlık görevlilerine göre pazar günü en az 18 kişi öldü, Gazze sağlık makamlarına göre ekimdeki ateşkesten bu yana 1.230'dan fazla Filistinli, aynı dönemde dört İsrail askeri hayatını kaybetti."}]}], "sources": [{"key": "bop-envoy", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/board-of-peace-envoy-laments-recent-gaza-strikes-amid-effort-to-implement-trump-plan/", "title": {"tr": "Barış Kurulu'nun Gazze temsilcisi, saldırıların ilaç stoklarını yok ettiğini söyledi", "en": "The Board of Peace representative for Gaza says the strikes destroyed medical supplies"}, "publishedDate": "2026-08-03"}, {"key": "gaza-strikes", "kind": "news", "name": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/08/israeli-strikes-kill-18-gaza-minister-says-no-deal-halt-attacks", "title": {"tr": "Gazze'de en az 18 kişi öldü, İsrailli bakan saldırıları durduran bir anlaşma olmadığını söyledi", "en": "At least 18 killed in Gaza as an Israeli minister says no deal halts the attacks"}, "publishedDate": "2026-08-02"}], "title": {"en": "Which authority is meant to enforce the roadmap?", "tr": "Yol haritasını hangi makam uygulatacak?"}, "writer": "geo-01", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Flights and consular services between Caracas and Santo Domingo resumed six months ago. What was announced on Sunday is a roadmap, to be drawn up by mutual agreement, for talking about normalisation rather than the thing itself. The question that severed the relationship remains deferred.", "tr": "Caracas ile Santo Domingo arasında uçuşlar ve konsolosluk hizmetleri altı ay önce yeniden başlamıştı. Pazar günü açıklanan şey normalleşmenin kendisi yerine, onu görüşmek için ortak mutabakatla hazırlanacak bir yol haritası. İlişkiyi kesen soru ise hâlâ ertelenmiş durumda."}, "sections": [{"h": {"en": "The practical layer first, the political layer after", "tr": "Önce pratik katman, sonra siyasi katman"}, "ps": [{"en": "The sequence is worth noticing. Flights between the two capitals and consular services resumed in February 2026. The step announced by Venezuela's foreign ministry on Sunday is a roadmap, to be drawn up by mutual agreement, for talks on the gradual normalisation of diplomatic and consular relations. The movement of people, in other words, was restored before anyone addressed the recognition dispute that broke the relationship.", "refs": ["caracas-santodomingo"], "tr": "Sıralamaya dikkat etmek gerekiyor. İki başkent arasındaki uçuşlar ve konsolosluk hizmetleri şubat 2026'da yeniden başladı. Pazar günü Venezuela Dışişleri Bakanlığı'nın duyurduğu adım ise diplomatik ve konsolosluk ilişkilerinin kademeli olarak normalleşmesine dönük görüşmeler için ortak mutabakatla hazırlanacak bir yol haritası. Yani insanların hareketi, ilişkiyi kesen tanıma sorunu ele alınmadan önce yeniden kuruldu."}, {"en": "In one pan Caracas recovers a channel it had lost. In the other Santo Domingo gives up nothing it would have to defend at home, because a roadmap for talks commits no one to any act of recognition. What is deferred is precisely the question that cut the relationship: the Dominican Republic joining dozens of states in refusing to recognise the 2024 election result, which it treated as fraudulent.", "refs": ["caracas-santodomingo"], "tr": "Bir kefede Caracas kaybettiği bir kanalı geri kazanıyor. Öbür kefede Santo Domingo, iç kamuoyuna karşı savunmak zorunda kalacağı bir şeyden vazgeçmiş olmuyor; görüşme yol haritası kimseyi bir tanıma işlemine bağlamıyor. Ertelenen şey tam da ilişkiyi kesen sorunun kendisi: Dominik Cumhuriyeti'nin 2024 seçim sonucunu hileli sayarak tanımayan onlarca ülkeye katılması."}]}, {"h": {"en": "A text issued from one capital", "tr": "Tek başkentten çıkan metin"}, "ps": [{"en": "The statement that was published is Venezuela's. One party's announcement establishes that party's position, not a mutual commitment, and no Dominican statement appeared in the report. The nearest explanation for the political layer moving now is that the interlocutor has changed rather than the dispute: Delcy Rodriguez is serving as Venezuela's interim president. There is an alternative: Santo Domingo may simply have judged the practical value of consular traffic to outweigh the symbolic cost, in which case the party that moved is the Dominican Republic rather than Caracas.", "refs": ["caracas-santodomingo"], "tr": "Yayımlanan açıklama Venezuela'nın açıklaması. Tek tarafın duyurusu o tarafın konumunu belgeler, karşılıklı bir taahhüdü belgelemez. Habere Dominik Cumhuriyeti'nden bir açıklama yansımadı. Siyasi katmanın şimdi hareket etmesinin en yakın açıklaması, anlaşmazlığın değil muhatabın değişmiş olması: Venezuela'da geçiş dönemi devlet başkanlığını Delcy Rodriguez yürütüyor. Bunun bir alternatifi de var: Santo Domingo, konsolosluk pratiğinin faydasını simgesel maliyetten ağır bulmuş olabilir; o zaman değişen taraf Caracas değil, Dominik Cumhuriyeti'dir."}, {"en": "A rebuilt relationship has countable markers: ambassadors appointed on both sides, a text carrying two signatures, a date attached to implementation. Sunday's announcement contains none of them. That is not a failure; it simply shows that opening a channel and restoring recognition are separate transactions.", "refs": ["caracas-santodomingo"], "tr": "Yeniden kurulmuş bir ilişkinin sayılabilir işaretleri bellidir: karşılıklı atanan büyükelçiler, iki imzalı bir metin, uygulamaya bağlanmış bir tarih. Pazar günkü duyuruda bunların hiçbiri yok. Bu bir başarısızlık sayılmaz. Yalnızca bir kanalın açılması ile bir tanımanın geri verilmesinin ayrı işlemler olduğunu gösteriyor."}]}, {"h": {"en": "What comes next", "tr": "Sırada ne var"}, "ps": [{"en": "The rest is easy to measure. If no text carrying two signatures is published and no heads of mission are appointed on both sides by the end of October, Sunday's step will have been a channel of communication rather than a normalisation. The channel is not nothing; two governments being able to reach each other is a gain independent of whether the dispute is settled. But it is early to say a balance has been struck.", "refs": ["caracas-santodomingo"], "tr": "Bundan sonrasını ölçmek kolay. Ekim sonuna kadar iki imzalı bir metin yayımlanmaz ya da misyon şefleri karşılıklı olarak atanmazsa, pazar günkü adım bir normalleşme yerine bir iletişim kanalı olarak kalacak. Kanalın kendisi de küçümsenecek bir şey sayılmaz. İki hükümetin birbirine ulaşabilmesi, anlaşmazlığın çözülmesinden bağımsız bir kazanç. Ama denge kuruldu demek için erken."}]}], "sources": [{"key": "caracas-santodomingo", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/venezuela-and-the-dominican-republic-say-they-will-work-to-restore-ties", "title": {"tr": "Venezuela ile Dominik Cumhuriyeti, ilişkileri kademeli olarak normalleştirmek için yol haritasında anlaştı", "en": "Venezuela and the Dominican Republic agree a roadmap for gradual normalisation"}, "publishedDate": "2026-08-02"}], "title": {"en": "The flights came back in February and the ambassadors still have not", "tr": "Uçuşlar şubatta döndü, büyükelçiler hâlâ dönmedi"}, "writer": "geo-02", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "What Tehran saw was the force assembling. What it did not see was what it was being asked to do in return. The parties Trump named in the announcement were Saudi Arabia, the United Arab Emirates and Qatar; the concrete step the US wants from Tehran went unmentioned.", "tr": "Tahran'ın gördüğü şey kuvvetin toplanmasıydı. Görmediği şey, karşılığında ne yapması istendiği. Duyuruda Trump'ın andığı taraflar Suudi Arabistan, Birleşik Arap Emirlikleri ve Katar'dı; ABD'nin Tahran'dan istediği somut adım anılmadı."}, "sections": [{"h": {"en": "What was seen was the force assembling", "tr": "Görülen şey kuvvetin toplanmasıydı"}, "ps": [{"en": "Trump said the plan was for the biggest attack since the Second World War and that Tehran knew its scale because it had watched the preparation take shape. That is an observable: the other side can count aircraft, ships and munitions on the move. He then stopped the operation and announced that negotiations would open on Monday afternoon, without naming a venue or the participants.", "refs": ["iran-talks"], "tr": "Trump, planın İkinci Dünya Savaşı'ndan bu yana en büyük saldırı olduğunu, Tahran'ın kapsamını bildiğini, çünkü hazırlığı oluşurken gördüğünü söyledi. Bu bir gözlenebilir veridir: karşı taraf uçak, gemi ve mühimmat hareketini sayabilir. Ardından harekâtı durdurdu ve müzakerelerin pazartesi öğleden sonra başlayacağını duyurdu; görüşmenin yerini ve katılımcılarını bildirmedi."}, {"en": "Capability is the honest half of a signal. The other half, the demand, was left open. The announcement said a deal on Hormuz was expected first and a nuclear deal after it, but not which behaviour Tehran must stop or by what date it must act. A threat with no condition attached does not tell the other side what to give up. Deterrence requires the protected interest, the cost to be imposed and the behaviour that triggers it to be described together.", "refs": ["iran-talks"], "tr": "Kabiliyet, sinyalin dürüst yarısıdır. Öteki yarısı talep, bu kez açık bırakıldı. Duyuruda önce Hürmüz'de, ardından nükleer başlıkta bir anlaşma beklendiği söylendi; Tahran'ın hangi davranışı durdurması ya da hangi tarihe kadar ne yapması gerektiği söylenmedi. Koşula bağlanmamış bir tehdit, karşı tarafa neyi bırakması gerektiğini anlatmaz. Caydırıcılık ise korunan çıkarın, yüklenecek maliyetin ve maliyeti tetikleyecek davranışın birlikte tarif edilmesini gerektirir."}]}, {"h": {"en": "It was not Tehran that stopped it", "tr"
