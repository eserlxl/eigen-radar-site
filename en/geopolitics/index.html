008 Mumbai saldırılarını, 2016'daki Uri ve Pathankot saldırılarını, 2019 Pulvama saldırısını ve 2025 Pahalgam saldırısını sıraladı.", "en": "India's ambassador to Washington, Vinay Mohan Kwatra, argued in Newsweek that the decision to hold the 1960 Indus Waters Treaty in abeyance \"merely acknowledges what Pakistan's conduct had already destroyed\". India suspended the treaty on 23 April 2025, after the attack at Pahalgam in Jammu and Kashmir that killed 26 people. Kwatra maintained that Pakistan had spent half a century dismantling the goodwill in which the treaty was signed, listing the wars of 1965, 1971 and 1999 alongside the 2001 Parliament attack, the 2008 Mumbai attacks, the 2016 Uri and Pathankot attacks, the 2019 Pulwama attack and the 2025 Pahalgam attack.", "refs": ["indus"]}, {"tr": "Liste yarım yüzyıllık bir aşınmanın kanıtı olarak sunuluyor ve aynı zamanda düzenlemenin sondan bir öncekine kadar her maddeyi atlattığını gösteriyor. Üç savaş, dört adı geçen saldırı ve su düzeni yürümeye devam etti. Böyle bir sicili taşıyan bir yapı kırılgan değil, yalıtılmıştır. Bugünün en güçlü açıklaması önce söylenmeli: bir hükümet, çok sayıda sivilin öldüğü bir saldırının ardından bir karar aldı ve bir kararı açıklamak için tarihsel bir mekanizma gerekmez. Kronolojinin eklediği şey başka bir soru: aynı karar neden 1965'te, 1971'de, 1999'da, 2002'de ya da 2019'da değil de 2025'te elverişli hâle geldi.", "en": "The list is offered as evidence of half a century of erosion, and it simultaneously shows the arrangement outlasting every entry on it until the last. Three wars, four named attacks, and the water arrangement kept working. A structure carrying that history looks insulated rather than fragile. The strongest present-day explanation should come first: a government took a decision after a mass-casualty attack, and no historical mechanism is required to explain a decision. What the chronology adds is a different question — why the same decision became available in 2025 rather than in 1965, 1971, 1999, 2002 or 2019.", "refs": ["indus"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Kwatra'nın kendi metninde adı geçen değişiklik antlaşmada değil, ona iliştirilen doktrinde. Başbakan Narendra Modi'nin aktardığı formül suyu müzakere ve ticaretle aynı cümleye yerleştiriyor: \"Terör ve müzakere bir arada yürüyemez... Terör ve ticaret bir arada yürüyemez... Su ile kan birlikte akamaz.\" Bu cümle nehri, yalıtılmış teknik bir düzenleme kategorisinden çıkarıp esirgenebilir araçlar kategorisine taşıyor. Kwatra'nın çerçevesi hamleyi tamamlıyor: askıya alma bir eylem olarak değil, bir olgunun kabulü olarak sunuluyor; devletler geçmişle sürekli görünmesini istedikleri adımları böyle anlatır. Antlaşmanın yalıtımı hiçbir zaman yalnızca metninde değildi; iki hükümetin de suyu kavganın dışında tutmasındaydı. Biri bunu bırakınca yalıtım, tek bir madde değişmeden sona eriyor. Belirleyici değişken çok daha dar ve yakın da olabilir: Pahalgam saldırısının ölçeği ve niteliği ya da görünür bir karşılık verme yönündeki iç siyasi zorunluluk; o hâlde 2025 bir kategorinin sonunu değil belirli bir krizi işaretler.", "en": "The change named in Kwatra's own text lies not in the treaty but in the doctrine attached to it. The formula he quotes from Prime Minister Narendra Modi places water in the same sentence as talks and trade: \"Terror and talks cannot go together... Terror and trade cannot go together... Water and blood cannot flow together.\" That sentence moves the river out of the category of an insulated technical arrangement and into the category of instruments that can be withheld. Kwatra's framing completes the move: abeyance is presented as the recognition of a fact rather than as an act, which is how states describe a step they want read as continuous with the past. The treaty's insulation never rested on its text alone but on both governments keeping water outside the quarrel. Once one stops doing so, the insulation ends without a single clause changing. The decisive variable may also be far narrower and more recent — the scale and character of the Pahalgam attack, or a domestic requirement to respond visibly — in which case 2025 marks a particular crisis rather than the end of a category.", "refs": ["indus"]}, {"tr": "Analojinin kırıldığı yer burası. 1965, 1971 ve 1999, iki ordunun devletlerarası savaşlarıydı; Kwatra'nın andığı 2025 tetikleyicisi ise devlet dışı aktörlere atfedilen, sivillere yönelik bir saldırı. Devletlerarası savaşı atlatmak üzere kurulmuş bir düzenleme, suçlanan tarafın sorumluluğu reddettiği ve hiçbir ateşkesin tartışmayı kapatmadığı bir atıf kavgası için tasarlanmamıştı. Eski benzetmeyi geçersiz kılan maddi koşul budur. İzlenecek şey, askıya almanın antlaşmanın tanıdığı bir biçime kavuşup kavuşmayacağı: bildirilmiş bir değişiklik ya da müzakere edilmiş bir belge mi olacak, yoksa tek tarafın öne sürdüğü bir statü olarak mı kalacak.", "en": "This is where the analogy breaks. The years 1965, 1971 and 1999 were interstate wars between two armies, while the 2025 trigger Kwatra names is an attack on civilians attributed to non-state actors. An arrangement built to survive war between states was not designed for a quarrel over attribution, in which the accused party denies responsibility and no ceasefire closes the argument. That is the material condition under which the old comparison fails. What remains to be watched is whether the abeyance ever takes a form the treaty recognises — a notified modification or a negotiated instrument — or stays a status asserted by one party.", "refs": ["indus"]}]}], "sources": [{"key": "indus", "kind": "news", "name": "The Tribune", "url": "https://www.tribuneindia.com/news/india/pakistan-made-every-effort-to-dismantle-goodwill-under-indus-water-treaty-vinay-kwatra/", "title": {"tr": "Hindistan'ın Washington büyükelçisi İndus Suları Antlaşması'nın askıda kalacağını yazdı", "en": "India's envoy to Washington writes that the Indus Waters Treaty stays in abeyance"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Yerleşkenin dışında bir krater, Dışişleri'nde bir çağrı", "en": "A crater outside the compound, a summons inside the ministry"}, "excerpt": {"tr": "Litvanya'nın elindeki araç, Rusya'nın temsilcisini kendi bakanlığına çağırmaktan ibaret. Bu araç, kendisini kullanan kapının ötesine geçmiyor.", "en": "The instrument Lithuania holds is a summons of Russia's representative to its own ministry. That instrument does not travel past the door that uses it."}, "sections": [{"h": {"tr": "Gecenin bıraktığı", "en": "What the night left"}, "ps": [{"tr": "Kiev'deki Litvanya elçiliğinin yerleşkesinin hemen dışında bir füze krateri var. Dışişleri Bakanı Kestutis Budrys elçiliğin hasar gördüğünü açıkladı; füzeler binadan yalnızca metrelerce ötede patladı ve elçilik personelinden yaralanan olmadı. Ukrayna Dışişleri Bakanı Andrii Sibiha hasarı sınırlı diye tanımladı.", "en": "A missile crater sits just outside the compound of Lithuania's embassy in Kyiv. Foreign Minister Kestutis Budrys said the embassy had been damaged; the missiles came down only metres from the building, and no embassy staff were injured. Ukraine's foreign minister, Andrii Sybiha, called the damage limited.", "refs": ["lt-embassy"]}, {"tr": "Aynı gece kentin geri kalanında bilanço başkaydı: Kiev'e yönelik balistik füze saldırısında en az dokuz kişi öldü ve 33 kişi yaralandı. Atılan 27 balistik füzeden yalnızca biri düşürüldü. Elçiliğin aldığı hasar, o gecenin en küçük kalemiydi.", "en": "In the rest of the city that same night the ledger read differently: at least nine people were killed and 33 wounded in the ballistic missile attack on Kyiv. Of the 27 ballistic missiles fired, only one was brought down. The damage to the embassy was the smallest item of the night.", "refs": ["kyiv-strike"]}]}, {"h": {"tr": "Bir çağrının menzili", "en": "The reach of a summons"}, "ps": [{"tr": "Litvanya'nın seçtiği araç belli: Dışişleri Bakanlığı, Rusya'nın Vilnius'taki diplomatik temsilcisini cumartesi günü bakanlığa çağıracağını duyurdu. Bu aracın ürettiği şey, Litvanya'nın kendi binasında iletilen resmî bir itirazdır. Bir yaptırım kararı, bir denetim yetkisi ya da bir süre sınırı içermez.", "en": "The instrument Lithuania chose is plain: the foreign ministry announced it would summon Russia's diplomatic representative in Vilnius to the ministry on Saturday. What that instrument produces is a formal protest delivered inside Lithuania's own building. It carries no designation, no inspection power and no deadline.", "refs": ["lt-embassy"]}, {"tr": "Bu tercihin iki okuması var. Litvanya Dışişleri Bakanlığı somut bir tedbiri AB ortaklarıyla eşgüdüme saklıyor olabilir ve dar adım bilinçli olabilir. Daha yalın ihtimal ise, tek başına hareket eden bir devletin elindeki araçların gerçekten bundan ibaret olmasıdır. İkisini ayırt edecek şey, çağrının ardından adı konmuş bir tedbirin gelip gelmediğidir.", "en": "There are two readings of that choice. Lithuania's foreign ministry may be holding a concrete measure back for coordination with EU partners, in which case the narrow step is deliberate. The plainer possibility is that this is genuinely the extent of what a state acting alone holds. What separates the two is whether a named measure follows the summons.", "refs": ["lt-embassy"]}]}, {"h": {"tr": "Neyin karşılığı var", "en": "What has a counterpart"}, "ps": [{"tr": "Bir itirazın değeri, sonradan başka bir aracın ona dayanıp dayanmadığına bağlıdır. Diplomatik dosyaya giren bir protesto, tazminat talebine, listeye alma kararına ya da bir izleme mekanizmasına gerekçe olabilir; olmazsa tek bir geceye ait bir belge olarak kalır. Aynı gece Kiev'de sonucu belirleyen araç fizikseldi: 27 balistik füzeden yalnızca birinin düşürülmüş olması.", "en": "A protest is worth what some later instrument makes of it. A protest entered into the diplomatic file can become the basis for a claim, a listing decision or a monitoring mechanism; if it does not, it stays a document about one night. In Kyiv the instrument that decided the outcome that night was physical: only one of 27 ballistic missiles was brought down.", "refs": ["lt-embassy", "kyiv-strike"]}, {"tr": "Buradan izlenebilir bir sınama çıkıyor. Litvanya ya da AB tarafından yayımlanan resmî bir belgede elçiliğin gördüğü hasar bir listeye alma ya da tazminat talebinin gerekçesi olarak anılmazsa, yanıtın tamamı temsilcinin bakanlığa çağrılmasından ibaret kalmış olacaktır.", "en": "That yields an observable test. If no official Lithuanian or EU document cites the damage the embassy took as grounds for a listing or a claim, then the whole of the response will have been the summoning of a representative to a ministry.", "refs": ["lt-embassy"]}]}], "sources": [{"key": "lt-embassy", "kind": "news", "name": "LRT", "url": "https://www.lrt.lt/en/news-in-english/19/3008045/lithuanian-embassy-in-kyiv-damaged-in-russian-missile-attack", "title": {"tr": "Litvanya, Kiev'deki elçiliği hasar görünce Rusya'nın temsilcisini Dışişleri'ne çağırdı", "en": "Lithuania summons Russia's representative after missiles damage its embassy in Kyiv"}, "publishedDate": "2026-08-01"}, {"key": "kyiv-strike", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Tahran Maskat hattını kabul ediyor, ötekini reddediyor", "en": "Tehran acknowledges the Muscat track and denies the other one"}, "excerpt": {"tr": "Tek bir duyurunun içinde iki ayrı müzakere hattı var. Tahran bunlardan yalnızca birini sahipleniyor; saldırıların durdurulması ise öbürüne dayandırıldı.", "en": "One announcement contains two separate negotiating tracks. Tehran claims only one of them, while the halt in strikes was attributed to the other."}, "sections": [{"h": {"tr": "İki hat, tek duyuru", "en": "Two tracks, one announcement"}, "ps": [{"tr": "Başkan Donald Trump, planlanan saldırıyı bir anlaşmanın çerçevesi üzerinde uzlaşıldığı gerekçesiyle durdurduğunu ve bunun Hürmüz Boğazı'nın açılmasını kapsadığını bildirdi. Duyuru bir sosyal medya paylaşımıyla yapıldı; taraflarca imzalanmış bir metin ortaya konmadı.", "en": "President Donald Trump said he had halted the planned strike on the grounds that the perimeters of a deal had been agreed, and that this included the opening of the Strait of Hormuz. The announcement was made in a social media post; no text signed by the parties was produced.", "refs": ["trump-cancel"]}, {"tr": "Tahran'dan gelen ilk açıklama bu duyuruyu doğrulamıyor, ama başka bir masayı doğruluyor. Dışişleri Bakanı Abbas Arakçi, Umman'la Hürmüz Boğazı'na ilişkin müzakerelerin sonuçlandırılma yolunda olduğunu söyledi; Sözcü İsmail Bakai iki tarafın \"her iki tarafça kabul edilebilir bir güzergâh üzerinde bir mutabakata\" doğru ilerlediğini belirtti. Bu hattın da yayımlanmış bir metni yok.", "en": "The first statement out of Tehran does not confirm that announcement, but it does confirm a different table. Foreign Minister Abbas Araghchi said negotiations with Oman over the Strait of Hormuz were on the way to being finalised, and spokesperson Esmail Baghaei said the two sides were moving toward \"an understanding on a route acceptable to both sides\". That track has no published text either.", "refs": ["oman-talks"]}, {"tr": "İkinci açıklama ise doğrudan bir yalanlama. Mehr ajansı, askerî yetkililere dayanarak İran'ın saldırıların durdurulmasını istediği iddiasını \"yeni bir yalandan başka bir şey değil\" diye nitelendirdi. Fars ajansı, müzakere heyetinden bir üyeye dayanarak Hürmüz'de uzlaşı sağlandığı haberini asılsız buldu ve ABD'nin eylemleri sürdükçe boğazın kapalı kalacağını aktardı. Bu yalanlamalar bağımsız biçimde doğrulanmadı.", "en": "The second statement is a flat denial. The Mehr agency, citing military officials, called the claim that Iran had asked for the strikes to be halted \"nothing but a new lie\". The Fars agency, citing a member of the negotiating team, dismissed the report of a compromise over Hormuz as false and carried a statement that the strait would stay closed while US actions continued. These denials have not been independently verified.", "refs": ["iran-denial"]}]}, {"h": {"tr": "Kimin neyi kabul ettiği", "en": "What each side has accepted"}, "ps": [{"tr": "Bu soru bugünün erken saatlerinde bu köşede zaten sorulmuştu: çerçeveyi kim kabul etti ve nerede yazılı? İran tarafı o soruyu, çerçeveyi reddederek yanıtladı. Bir anlaşmanın varlığı için iki tarafın da onu tanıması gerekir; şu ana kadar tanıyan bir taraf var.", "en": "That question was already put in this column earlier today: who accepted the perimeters, and where is that written? The Iranian side answered that question by rejecting the framework. An agreement exists when both parties acknowledge it; so far one party does.", "refs": ["history-one", "iran-denial"]}, {"tr": "Tahran'ın iki açıklaması birbiriyle çelişmek zorunda değil; farklı hatları tarif ediyor olabilirler. Umman arabuluculuğundaki geçiş düzenlemesi Tahran'ın sahiplendiği hat, Washington'un tarif ettiği ikili pazarlık ise reddettiği hattır. Daha zayıf ama mümkün bir okuma da var: yalanlamalar iç kamuoyuna dönük bir duruş olabilir ve aynı mutabakat sessizce yürüyor olabilir.", "en": "Tehran's two statements need not contradict each other; they may describe different tracks. The transit arrangement mediated by Oman is the track Tehran claims, while the bilateral bargain Washington describes is the track it denies. A weaker but possible reading also exists: the denials may be a posture for a domestic audience while the same understanding proceeds quietly.", "refs": ["iran-denial", "oman-talks"]}, {"tr": "Bu iki okumayı ayıracak olan şey bir güzergâhtır. Maskat ya da Tahran, önümüzdeki altı hafta içinde geçişin hangi hattan ve kimin izniyle yapılacağını adıyla açıklarsa, sahiplenilen hattın gerçekten var olduğu görülebilir. Böyle bir açıklama gelmezse elde yalnızca duyuru kalır ve bunun bir denge sayılması güçleşir. Dengenin kurulduğunu söylemek için henüz erken olabilir.", "en": "What separates those two readings is a route. If Muscat or Tehran names, within the next six weeks, the line on which transit will run and the authority that clears it, then the acknowledged track may be seen to have been real. If no such statement comes, the announcement is all that remains, and calling it a balance becomes difficult. It may still be too early to say a balance has been struck.", "refs": ["oman-talks", "trump-cancel"]}]}], "sources": [{"key": "iran-denial", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/iran-denies-it-asked-trump-not-to-strike-or-agreed-to-deal-to-split-control-of-hormuz/", "title": {"tr": "İran ajansları, Tahran'ın saldırıların durdurulmasını istediğini ve Hürmüz'de uzlaşıldığını yalanladı", "en": "Iranian agencies deny that Tehran asked for a halt to US strikes or agreed a Hormuz deal"}, "publishedDate": "2026-08-02"}, {"key": "oman-talks", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "Arakçi, İran'ın Umman'la Hürmüz görüşmelerinin son aşamada olduğunu söyledi", "en": "Araghchi says Iran's talks with Oman on the Strait of Hormuz are in their final stages"}, "publishedDate": "2026-08-02"}, {"key": "trump-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}, {"key": "history-one", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-08-02/2/", "title": {"tr": "Çerçeveyi kim kabul etti, nerede yazılı?", "en": "Who agreed to the perimeters, and where is that written?"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "Bombardıman uçaklarının üssü menzilde; attıkları füzeler değil", "en": "The bombers' base is in range; the missiles they fired are not"}, "excerpt": {"tr": "Ukrayna 600 kilometre öteye vurabiliyor. Kiev üzerindeki 27 balistik füzeden yalnızca birini düşürebildi. Bu iki sayı aynı savaşın iki ayrı defterinde duruyor.", "en": "Ukraine can strike 600km away. It brought down one of the 27 ballistic missiles over Kyiv. Those two numbers sit in two different ledgers of the same war."}, "sections": [{"h": {"tr": "Menzil", "en": "Reach"}, "ps": [{"tr": "Zelenskiy, gece boyunca yapılan saldırılarda Saratov bölgesindeki Engels havaalanının ve bir petrol rafinerisinin vurulduğunu söyledi; her ikisi de Ukrayna sınırından yaklaşık 600 kilometre uzakta. Kaluga bölgesinde bir petrol deposu da hedef alındı. Ukrayna ordusu havaalanında yangın çıktığını bildirdi.", "en": "Zelensky said overnight strikes hit the Engels airfield and an oil refinery in the Saratov region, both about 600km from the Ukrainian border. An oil depot in the Kaluga region was also struck. The Ukrainian military said a fire broke out at the airfield.", "refs": ["engels"]}, {"tr": "Hedefin niteliği önemli. Ukrayna ordusuna göre Engels, Rusya'nın stratejik havacılığının ana üslerinden biri ve Tu-95MC ile Tu-160 bombardıman uçakları Ukrayna'ya füze atmak için burayı düzenli olarak kullanıyor. Rusya sekiz kişinin öldüğünü ve 635 insansız hava aracının düşürüldüğünü açıkladı; bu sayılar Rusya'nın kendi beyanıdır. Saratov Valisi Roman Busargin, Saratov ve Engels'te sivil altyapının zarar gördüğünü kabul etti ve iki kişinin öldüğünü söyledi.", "en": "The nature of the target matters. According to the Ukrainian military, Engels is one of the main bases of Russia's strategic aviation and Tu-95MC and Tu-160 bombers regularly use it to launch missiles at Ukraine. Russia said eight people were killed and 635 drones were shot down; those counts are Russia's own statement. Saratov's governor, Roman Busargin, admitted damage to civilian infrastructure in Saratov and Engels and said two people had been killed.", "refs": ["engels"]}]}, {"h": {"tr": "Aynı savaşın öbür defteri", "en": "The other ledger of the same war"}, "ps": [{"tr": "Savunma tarafındaki sayı başka bir şey söylüyor. Kiev'e yönelik saldırıda 27 balistik füze atıldı ve bunlardan yalnızca biri düşürüldü; en az dokuz kişi öldü, 33 kişi yaralandı. Bir üssü vurmak, o üsten daha önce kalkmış bir salvoyu durdurmaz.", "en": "The number on the defensive side says something else. 27 ballistic missiles were fired at Kyiv and only one of them was brought down; at least nine people were killed and 33 wounded. Striking a base does not stop a salvo that has already left it.", "refs": ["kyiv-strike"]}, {"tr": "Engels'e yapılan saldırı, füze üretim ve fırlatma döngüsüne maliyet yükler; Kiev'in üzerindeki füzeleri etkilemez. Bunun en olası açıklaması, iki tarafın birbirinden bağımsız iki kabiliyeti tüketmesidir: biri uzun menzilli taarruz, öbürü önleme stoku. Daha zayıf ama ihmal edilemez bir açıklama daha var: düşük önleme oranı stok darlığından çok salvonun profilinden ve hedef seçiminden kaynaklanıyor olabilir.", "en": "The strike on Engels imposes cost on the cycle that produces and launches missiles; it does not touch the missiles already over Kyiv. The most likely explanation is that the two sides are consuming two independent capabilities: long-range strike on one side, interceptor stock on the other. A weaker but not negligible explanation exists too: the low interception rate may come more from the salvo's profile and aim points than from a shortage of stock.", "refs": ["kyiv-strike", "engels"]}]}, {"h": {"tr": "Önce hangisi tükenir", "en": "Which one runs out first"}, "ps": [{"tr": "Bu karşılıklı vuruşmayı kazanacak taraf, deposu önce boşalmayan taraftır. Ukrayna'nın taarruz kabiliyeti kendi ürettiği araçlara dayanıyor, önleme kabiliyeti ise dışarıdan gelen tedariğe. İki depodan yalnızca biri ülke içinde doldurulabiliyor; öbürü azaldığında bedeli şehirler ödüyor.", "en": "The side that wins this exchange is the side whose magazine does not empty first. Ukraine's strike capability rests on what it builds itself, while its interception capability rests on supply from outside. Only one of those two magazines can be refilled at home, and when the other runs low the cost is paid by cities.", "refs": ["engels", "kyiv-strike"]}, {"tr": "Sınama açık. Önleyici tedariğinde bir değişiklik olmazsa, benzer büyüklükteki bir sonraki salvoda Kiev üzerindeki balistik önleme oranı sıfıra yakın kalacaktır. İzlenecek gösterge, 25 ve üzeri balistik füzeyle yapılan bir sonraki saldırı için Ukrayna'nın açıkladığı önleme oranıdır.", "en": "The test is plain. If nothing changes in interceptor supply, the ballistic interception rate over Kyiv will stay near zero in the next salvo of comparable size. The indicator to watch is the interception rate Ukraine publishes for the next attack involving 25 or more ballistic missiles.", "refs": ["kyiv-strike"]}]}], "sources": [{"key": "engels", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c998gg5pe09o", "title": {"tr": "Ukrayna, Engels havaalanı ile Saratov rafinerisini vurduğunu bildirdi; Rusya sekiz ölü açıkladı", "en": "Ukraine says it hit the Engels airfield and a Saratov refinery; Russia reports eight deaths"}, "publishedDate": "2026-08-02"}, {"key": "kyiv-strike", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Bir hafta önce değişen sicil, iki saat süren bir arama", "en": "A registry changed a week earlier, a boarding that lasted two hours"}, "excerpt": {"tr": "Toa Payoh'un beyan ettiği bayrak Kamerun'du. Pantelleria açıklarındaki arama iki saat sürdü ve geriye incelenecek belgeler bıraktı.", "en": "The flag the Toa Payoh declared was Cameroon's. The boarding off Pantelleria took two hours and left documentation to be reviewed."}, "sections": [{"h": {"tr": "Sicil, güzergâh, saat", "en": "Registry, route, clock"}, "ps": [{"tr": "Tanker 16 Temmuz'da Benin'in Cotonou limanından ayrıldı ve İstanbul'a gidiyordu. Pazar sabahı, Sicilya ile Tunus arasındaki Pantelleria'nın batısında, uluslararası sularda durduruldu. Beyan ettiği bayrak Kamerun'du.", "en": "The tanker left Cotonou in Benin on 16 July, bound for Istanbul. On Sunday morning it was stopped in international waters west of Pantelleria, the island between Sicily and Tunisia. The flag it declared was Cameroon's.", "refs": ["toa-payoh"]}, {"tr": "Operasyonun mekaniği şöyle: arama ekibi İtalyan savaş gemisi Thaon di Revel'den helikopterle indi, bir Yunan gemisi ile bir Polonya devriye uçağı destek verdi, iş yaklaşık iki saat sürdü. İtalya Savunma Bakanlığı'na göre tankerin kaptanı başlangıçta istenen iş birliğini göstermedi. Dayanak, bir savaş gemisinin ticaret gemisinin tabiiyetini denetlemesine izin veren BM Deniz Hukuku Sözleşmesi'nin 110. maddesiydi.", "en": "The mechanics ran like this: the boarding party came down by helicopter from the Italian warship Thaon di Revel, a Greek vessel and a Polish patrol aircraft gave support, and the work took about two hours. According to Italy's defence ministry the tanker's master initially did not provide the cooperation requested. The basis was Article 110 of the UN Convention on the Law of the Sea, which allows a warship to check a merchant ship's nationality.", "refs": ["toa-payoh"]}, {"tr": "Operasyonun ürettiği şey bilgi ve belge; İtalyan makamları bunları hâlâ inceliyor. Savunma Bakanı Guido Crosetto aramayı \"İtalya'nın Akdeniz güvenliğine ve Avrupa Birliği'nin eylemine katkısının somut bir göstergesi\" diye nitelendirdi. Irini'nin kendisi 2020'de Libya silah ambargosu için kurulmuştu; doğrulama aramaları görev alanına sonradan eklendi.", "en": "What the operation produced is information and documentation, and Italian authorities are still reviewing it. Defence Minister Guido Crosetto called it \"a concrete demonstration of Italy's contribution to the security of the Mediterranean and to the European Union's action\". Irini itself was set up in 2020 for the Libya arms embargo; verification boardings were added to its remit later.", "refs": ["toa-payoh"]}]}, {"h": {"tr": "Bayrağın fiyatı", "en": "What a flag costs"}, "ps": [{"tr": "Sayıları yan yana koyunca darboğazın yeri görünür hâle geliyor: bir sicil kısa sürede değiştirilebiliyor, bir arama iki saat sürüyor ve sonunda elde belge kalıyor. Kısıtlanan şey deniz yolundan çok geminin hangi devletin defterine yazıldığıdır. Bunun makul bir karşı okuması var: arama baştan delil toplamak için tasarlanmış olabilir ve geminin yoluna devam etmesi bir sınır değil, planın kendisi olabilir.", "en": "Set the numbers side by side and the place of the bottleneck becomes visible: a registry can be changed quickly, a boarding takes two hours, and what is left at the end is documentation. What is being restricted is less the sea lane than which state's books the ship is written into. There is a reasonable counter-reading: the boarding may have been designed from the outset to gather evidence, and the ship carrying on may be the plan rather than a limit.", "refs": ["toa-payoh"]}, {"tr": "Kamerun bayrağı, Umman'ın güney kıyısı açıklarında haziran ayından beri mahsur duran Caroline Bezengi'nin de üzerinde. AP'nin incelediği uydu görüntülerine göre gemiden yaklaşık 20 kilometrekarelik bir petrol tabakası yayıldı ve 31 Temmuz itibarıyla ham petrol kıyıya ulaştı. Umman geminin ve yükünün 23 Temmuz'a kadar kaldırılmasını istemişti; bu talimata uyulup uyulmadığı belirsiz. İki gemide de ortak kısıt aynı: yetkisi olanın elinde gemi yok.", "en": "The Cameroon flag is also on the Caroline Bezengi, stranded off Oman's southern coast since June. Satellite images reviewed by the AP show an oil sheen of roughly 20 square kilometres spreading from the ship, with crude reaching the shore as of 31 July. Oman ordered the vessel and its cargo removed by 23 July; whether that order was met is not clear. On both ships the shared constraint is the same: whoever holds the authority does not hold the vessel.", "refs": ["bezengi"]}, {"tr": "Bu yüzden rejimin maliyeti tutulan tonajda değil, yeniden bayraklandırmada görünür. Sınama da basit: İtalyan makamları Toa Payoh'tan alınan belgeleri eylül sonuna kadar ulusal bir el koyma işlemine dönüştürürse, doğrulama aramasının arkasında bir yaptırım var demektir. Dönüştürmezse, kalıcı olan tek maliyet geminin sicil değiştirmesidir.", "en": "So the cost of the regime shows up in re-registration rather than in detained tonnage. The test is simple enough: if Italian authorities turn the documentation taken from the Toa Payoh into a national seizure by the end of September, then there is enforcement behind the verification boarding. If they do not, the only lasting cost is the ship changing its registry.", "refs": ["toa-payoh", "bezengi"]}]}], "sources": [{"key": "toa-payoh", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/02/italian-navy-boards-tanker-from-russian-shadow-fleet", "title": {"tr": "AB deniz görev gücü, yaptırım listesindeki Toa Payoh tankerine Pantelleria açıklarında çıktı", "en": "An EU naval mission boards the sanctioned tanker Toa Payoh off Pantelleria"}, "publishedDate": "2026-08-02"}, {"key": "bezengi", "kind": "news", "name": "Fox News", "url": "https://www.foxnews.com/world/satellite-images-show-evidence-oil-leak-spreading-sanctioned-vessel-near-oman", "title": {"tr": "Uydu görüntüleri, Umman açıklarındaki yaptırımlı tankerden yayılan petrol tabakasını gösteriyor", "en": "Satellite images reviewed by AP show a spreading oil sheen from a sanctioned tanker off Oman"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Kavşaktaki kalabalık korunma istemeye gelmişti", "en": "The crowd at the intersection had come to ask for protection"}, "excerpt": {"tr": "Kabal'da bomba patladığında yakındaki kavşakta yüzlerce kişi hükümetten şiddete karşı adım istiyordu. Talep de saldırı da aynı kuruma yöneldi.", "en": "When the bomb went off in Kabal, hundreds of people at a nearby intersection were asking the government to act against the violence. The demand and the attack landed on the same institution."}, "sections": [{"h": {"tr": "Kavşak", "en": "The intersection"}, "ps": [{"tr": "Pazar akşamı Hayber Pahtunhva'nın Kabal ilçesinde patlama olduğunda, yakındaki kavşakta yüzlerce gösterici toplanmıştı. Talepleri açıktı: hükümet bölgede tırmanan şiddete karşı adım atsın. Bomba bu kalabalığın hemen yanında patladı.", "en": "When the explosion happened on Sunday evening in the Kabal area of Khyber Pakhtunkhwa, hundreds of demonstrators had gathered at a nearby intersection. Their demand was plain: that the government act against the escalating violence in the region. The bomb went off right beside that crowd.", "refs": ["swat"]}, {"tr": "Swat Emniyet Müdür Yardımcısı Fida Hüseyin en az 14 kişinin öldüğünü ve 22 kişinin yaralandığını bildirdi. İlçe Emniyet Amiri Ömer Han'a göre saldırgan karakolun girişindeydi ve polisler onu aramaya çalışırken bombayı patlattı. Saldırıyı üstlenen çıkmadı.", "en": "Swat Deputy Inspector General Fida Hussain said at least 14 people were killed and 22 wounded. According to District Police Officer Umar Khan, the attacker was at the entrance of the police station and detonated as officers tried to search him. No group claimed responsibility.", "refs": ["swat"]}]}, {"h": {"tr": "Eyaletin kendi sayısı", "en": "The province's own count"}, "ps": [{"tr": "Kalabalığın neden orada olduğunu eyaletin kendi rakamları anlatıyor. Pakistan Çatışma ve Güvenlik Çalışmaları Enstitüsü araştırmacıları, temmuz ayında eyalette terörle bağlantılı olarak sınıflandırdıkları 154 ölüm saptadı; bu, haziran rakamının iki katından fazla.", "en": "Why the crowd was there is told by the province's own figures. Researchers at the Pakistan Institute for Conflict and Security Studies recorded 154 deaths in the province during July that they classify as terrorism-related, more than double the June figure.", "refs": ["swat"]}, {"tr": "Talebin muhatabı ile saldırının hedefi aynı kurumdu. Kavşaktakiler eyalet güvenlik aygıtından korunma isterken, o aygıt kendi kapısında bir kişiyi ararken vuruldu. Bu örtüşmenin başka bir açıklaması da mümkün: göstericilerin yakınlığı saldırganın yer seçiminin nedeni olmayabilir ve hedef baştan karakolun kendisi olabilir.", "en": "The institution the demand was addressed to and the institution the attack hit were the same one. The people at the intersection were asking the provincial security apparatus for protection, while that apparatus was struck as it searched a man at its own gate. Another explanation of the overlap is possible: the demonstrators' proximity may not have been the attacker's reason for choosing the spot, and the station itself may have been the whole aim.", "refs": ["swat"]}]}, {"h": {"tr": "Kime seslenildiği", "en": "Whom the demand is addressed to"}, "ps": [{"tr": "Kınamalar Cumhurbaşkanı Asıf Ali Zerdari, Başbakan Şahbaz Şerif ve İçişleri Bakanı Muhsin Nakvi'den geldi; üçü de federal kademeden. Kavşakta dile getirilen talep ise eyalet kademesine yönelikti. Pakistan, güvenlik siyasetinin başkentte olduğu kadar eyaletlerinde de belirlendiği yükselen güçlerden biri; Güney Asya'da bu iki kademe arasındaki mesafe çoğu zaman haberin kendisidir.", "en": "The condemnations came from President Asif Ali Zardari, Prime Minister Shehbaz Sharif and Interior Minister Mohsin Naqvi, all three from the federal tier. The demand voiced at the intersection was addressed to the provincial one. Pakistan is one of the emerging powers whose security politics is settled in its provinces as much as in its capital, and in South Asia the distance between those two tiers is often the story itself.", "refs": ["swat"]}, {"tr": "Talebin karşılanıp karşılanmadığı bir açıklamayla değil, bir sayıyla anlaşılacak. İzlenecek gösterge, eyaletin aylık ölü sayısının haziran seviyesinin altına inip inmediğidir; temmuzda o sayı 154'tü.", "en": "Whether the demand is met will be settled by a number rather than a statement. The indicator to watch is whether the province's monthly death toll falls back below the June level; in July that figure was 154.", "refs": ["swat"]}]}], "sources": [{"key": "swat", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/suicide-bomber-kills-14-outside-police-station-in-pakistans-swat", "title": {"tr": "Pakistan'ın Swat vadisinde bir karakolun önünde en az 14 kişi öldürüldü", "en": "At least 14 killed by a suicide bomber at a police station in Pakistan's Swat valley"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "Neden ellinci yıl, kırkıncı değil?", "en": "Why the fiftieth anniversary, and not the fortieth?"}, "excerpt": {"tr": "Entebbe'de açılan heykel 1976'yı değiştirmiyor. Değişen şey, Uganda devletinin o günün ölülerinden hangisini sahiplendiğini söyleyen bir cümle.", "en": "The statue unveiled at Entebbe does not change 1976. What has changed is one sentence about which of that day's dead the Ugandan state claims."}, "sections": [{"h": {"tr": "Elli yıl önceki bölüm", "en": "The chapter fifty years back"}, "ps": [{"tr": "Olayın kendisi iyi bilinir. Tel Aviv'den kalkan bir Air France uçağı iki Filistinli ve iki Alman tarafından kaçırıldı, Libya üzerinden Uganda'ya yöneltildi ve Idi Amin uçağı karşıladı. 3 Temmuz 1976'daki baskında 100'den fazla rehine kurtarıldı.", "en": "The event itself is well known. An Air France flight out of Tel Aviv was hijacked by two Palestinians and two Germans, diverted via Libya to Uganda, and Idi Amin welcomed the plane. The raid of 3 July 1976 rescued more than 100 hostages.", "refs": ["entebbe"]}, {"tr": "Ölülerin listesi ise iki devlete birden ait. Yonatan Netanyahu ölen tek İsrail askeriydi. Operasyon sırasında üç rehine öldü ve Dora Bloch sonradan Kampala'da bir hastanede öldürüldü. İsrail birliğiyle çarpışırken ölen Ugandalı askerlerin sayısı en az 45'ti.", "en": "The list of the dead, though, belongs to two states at once. Yonatan Netanyahu was the only Israeli soldier killed. Three hostages died during the operation and Dora Bloch was later killed in a hospital in Kampala. The number of Ugandan soldiers killed fighting the Israeli force was at least 45.", "refs": ["entebbe"]}, {"tr": "Heykel şimdi olayın geçtiği eski havaalanı terminalinin önünde duruyor. Uganda Genelkurmay Başkanı Orgeneral Muhoozi Kainerugaba, anıtın Netanyahu'nun cesaretini onurlandırdığını söyledi ve dönemi \"tarihimizde acı bir bölüm\" diye andı.", "en": "The statue now stands outside the old airport terminal where it happened. Uganda's army chief, Gen Muhoozi Kainerugaba, said the monument honoured Netanyahu's courage, and called the period \"a painful chapter in our history\".", "refs": ["entebbe"]}]}, {"h": {"tr": "Değişen cümle", "en": "The sentence that moved"}, "ps": [{"tr": "Anıtın asıl işini bronz değil, Ugandalı ölülere ayrılan cümle görüyor. Kainerugaba onların \"haklı olduğuna inandıkları bir dava uğruna yiğitçe savaştığını\" söyledi, ardından \"bugün biliyoruz ki hizmet ettikleri Idi Amin hükûmeti, Uganda halkını temsil etmeyen acımasız bir diktatörlüktü\" diye ekledi. Askerleri rejimden ayırmak, ardıl devletlerin bir savaşı davasını devralmadan miras almasını sağlayan bilinen bir işlemdir.", "en": "The real work of the monument is done not by the bronze but by the sentence set aside for the Ugandan dead. Kainerugaba said they \"fought valiantly... in what they believed was a justified cause\", then added that \"today, we know that the government of Idi Amin, which they served, was a brutal dictatorship which did not represent the Ugandan people\". Separating the soldiers from the regime is the familiar operation by which successor states inherit a war without inheriting its cause.", "refs": ["entebbe"]}, {"tr": "Kainerugaba'nın bu cümleyi şimdi söyleyebilmesini iki koşulun aynı anda bulunması açıklıyor: ellinci yıl fırsatı verir, genelkurmay başkanlığı ise cümleyi söyleyecek yetkiyi. Bu iki koşul daha önce bir arada değildi. Buna karşı en güçlü güncel açıklama da not edilmeli: anıt, İsrail'le hâlihazırda yürüyen güvenlik iş birliğinin tören yüzü olabilir ve o hâlde tarihe dair ifadeler bir revizyon değil süsleme olur.", "en": "That Kainerugaba can say the sentence now is explained by two conditions being present at the same time: the fiftieth anniversary supplies the occasion, and the post of army chief supplies the authority to say it. Those two conditions were not together before. The strongest present-day explanation should be noted against it: the monument may be the ceremonial face of security cooperation with Israel that is already running, in which case the wording about history is decoration rather than revision.", "refs": ["entebbe"]}, {"tr": "Bir ayrım noktası da eklemek gerekiyor, çünkü bu tür açılışlara kolayca fazla yük bindirilir. Sınırların yeniden çizildiği ya da bir antlaşma maddesinin yeniden pazarlık edildiği düzenlemelerin aksine burada hiçbir kurumun yetkisi değişmiyor. Değişen tek şey, Uganda devletinin 1976'nın hangi kısmını sahiplendiğidir; Kainerugaba'nın ilişkilerin \"karşılıklı güven, saygı ve iş birliğiyle tanımlanan bir ortaklığa\" dönüştüğünü söylemesi de bu sahiplenmenin bugünkü karşılığı.", "en": "A disanalogy has to be added, because openings like this are easily loaded with too much. Unlike arrangements in which borders are redrawn or a treaty clause is renegotiated, no institution's authority changes here. The only thing that changes is which part of 1976 the Ugandan state claims; Kainerugaba saying that relations had become a \"partnership characterised by mutual trust, respect and co-operation\" is what that claim amounts to in the present.", "refs": ["entebbe"]}, {"tr": "Bu yüzden sahiplenmenin törenin ötesine geçip geçmediği gözlenebilir bir soru olarak duruyor. İzlenecek gösterge, önümüzdeki yıl içinde Uganda ile İsrail arasında açıklanmış, adı konmuş bir savunma ya da eğitim düzenlemesinin çıkıp çıkmadığıdır. Çıkmazsa elde 1976'ya dair yeniden yazılmış bir cümle kalır: gerçek ama dar bir değişiklik, çünkü hiçbir yetkiyi devretmiyor.", "en": "So whether the claim travels beyond ceremony stands as an observable question. The indicator to watch is whether a named and announced defence or training arrangement between Uganda and Israel appears within the coming year. If none does, what remains is a rewritten sentence about 1976: a real change, and a narrow one, because it transfers no authority.", "refs": ["entebbe"]}]}], "sources": [{"key": "entebbe", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c9v471x89m3o", "title": {"tr": "Uganda, Entebbe baskınından elli yıl sonra Yonatan Netanyahu'nun heykelini açtı", "en": "Uganda unveils a statue of Yonatan Netanyahu at Entebbe fifty years after the hostage rescue"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Ücret yoksa geçiş kuralını kim koyuyor?", "en": "If there is no fee, who sets the rule of passage?"}, "excerpt": {"tr": "Husilerin gemi trafiğini yöneten merkezi ücret planını reddetti ve güvenli geçiş hizmetini gönüllü ilan etti. Tarif yok; fakat kimin yetkili sayıldığına ilişkin bir standart var.", "en": "The Houthi-run centre overseeing vessel traffic denied a fee plan and called its safe-transit service voluntary. There is no tariff, but there is a standard for who counts as authorized."}, "sections": [{"h": {"tr": "Reddedilen ücret, korunan yetki", "en": "A denied fee, an asserted authority"}, "ps": [{"tr": "Husilerin yönettiği İnsani Operasyonlar Koordinasyon Merkezi 1 Ağustos'ta Babülmendep'ten geçen gemiler için ücret planlamadığını açıkladı. Merkez, güvenli geçiş hizmetinin gönüllü ve ücretsiz olduğunu, ödeme isteyenlerin Yemen'i ya da merkezi temsil etmediğini söyledi. Denizcilik şirketlerinden yetkisiz kişilere ödeme yapmamalarını ve bilgi vermemelerini istedi. Açıklama bir tarifeyi reddediyor; aynı cümlede geçerli muhatabın kim olduğunu da tanımlıyor.", "en": "The Houthi-run Humanitarian Operations Coordination Center said on 1 August that it was not planning fees for ships passing Bab al-Mandeb. It called its safe-transit service voluntary and free, and said anyone seeking payment represented neither Yemen nor the centre. Shipping companies were told not to pay or share information with unauthorized parties. The statement rejects a tariff while defining who counts as the valid interlocutor in the same sentence.", "refs": ["houthi-transit"]}, {"tr": "Bu ayrım önemlidir. Bir geçiş ücretinin fiyatı ölçülebilir; gönüllü hizmet ise kabul edilecek iletişim kanalını ve bilgi paylaşımını düzenler. Merkez gemiye ödeme yapma demiyor, kime ödeme yapılmaması gerektiğini söylüyor. Dolayısıyla reddedilen şey denetim değil, denetimin para biçimi. Geçiş kuralı faturadan yetkilendirmeye taşınıyor.", "en": "The distinction matters. A toll has a measurable price; a voluntary service governs the communication channel and the information a ship shares. The centre does not merely say not to pay, but specifies whom not to pay. What is rejected is therefore not control but its monetary form. The rule of passage moves from invoicing to authorization.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Bir haftada kurulan iki çerçeve", "en": "Two frameworks built in one week"}, "ps": [{"tr": "Açıklama, Reuters'ın Husilerin ücret fikrini İranlı yetkililerle görüştüğüne ilişkin haberinden sonra geldi. Aynı hafta grup Suudi Arabistan'a deniz ablukası ilan etmiş, Suudi Arabistan da seyrüsefer serbestisini korumak amacıyla 14 ülkeli bir deniz koalisyonu duyurmuştu. Bir tarafta ücretsiz fakat merkezden geçen güvenli geçiş hizmeti, diğer tarafta devletlerin kurduğu koruma koalisyonu var. İkisi de aynı rotada kimin güvenlik sağlayıcısı sayılacağını belirlemeye çalışıyor.", "en": "The statement followed a Reuters report that the Houthis had discussed a fee idea with Iranian officials. In the same week the group declared a maritime blockade on Saudi Arabia, while Saudi Arabia announced a 14-country maritime coalition to protect freedom of navigation. One side offers a free but centre-mediated safe-transit service; the other assembles a state-led protection coalition. Both seek to define who counts as the security provider on the same route.", "refs": ["houthi-transit"]}, {"tr": "İki çerçevenin aynı şey olduğu söylenemez. Koalisyon askerî kapasite ve devlet taahhüdü taşır; merkezin duyurusu ise gemilerle kurulacak ilişkiye dair tek taraflı bir kuraldır. Fakat pazar erişimi açısından ikisi de sigortacıya, armatöre ve kaptana aynı soruyu yöneltir: geçiş riskini azaltmak için kimin talimatı izlenecek? Kuralın etkisi, açıklamanın dilinden çok gemilerin davranışında ortaya çıkacak.", "en": "The two frameworks are not equivalent. The coalition carries military capability and state commitments; the centre's announcement is a unilateral rule for relations with vessels. Yet for market access both put the same question to insurers, owners and captains: whose instruction will be followed to reduce transit risk? The rule's effect will appear less in the statement's wording than in vessel behaviour.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Standardın ölçülebileceği yer", "en": "Where the standard can be measured"}, "ps": [{"tr": "Önümüzdeki ölçüt ücret tahsil edilip edilmemesinden daha geniştir. Denizcilik şirketleri merkezle temas kurmaya, rota bilgisi paylaşmaya ya da bu kanalın dışında kalan talepleri reddetmeye başlarsa, ücretsiz hizmet fiilî bir geçiş standardına dönüşür. Gemiler aynı rotayı bu kanala başvurmadan kullanır ve güvenlik koşulları değişmezse duyuru yetki iddiası olarak kalır. Babülmendep'te standardı belirleyecek şey fiyat listesi değil, tekrarlanan uyum davranışıdır.", "en": "The relevant test is broader than whether a fee is collected. If shipping companies begin contacting the centre, sharing route information or rejecting demands outside that channel, the free service becomes a de facto transit standard. If vessels use the same route without engaging the channel and security conditions do not change, the statement remains an assertion of authority. At Bab al-Mandeb the standard will be set not by a price list but by repeated compliance behaviour.", "refs": ["houthi-transit"]}]}], "sources": [{"key": "houthi-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/yemens-houthis-deny-plan-to-charge-ships-transiting-red-sea", "title": {"tr": "Husiler Kızıldeniz geçişinden ücret alma planını reddetti", "en": "Yemen's Houthis denied a plan to charge ships transiting the Red Sea"}, "publishedDate": "2026-08-01"}], "date": "2026-08-01"}, {"writer": "geo-02", "title": {"tr": "On dört günlük takvim ilk sınavını verdi", "en": "The fourteen-day clock has taken its first test"}, "excerpt": {"tr": "Hamas ilk adımı kabul ettiğini açıkladı, Trump İsrail'le mutabakat bulunduğunu söyledi. İki beyan arasındaki fark, birinin yükümlülüğü üstlenen taraftan, diğerinin üçüncü bir başkentten gelmesi.", "en": "Hamas announced it accepted the first step and Trump said there is an understanding with Israel. The difference between the two statements is that one comes from the party taking on the obligation and the other from a third capital."}, "sections": [{"h": {"tr": "Kim neyi kabul etti", "en": "Who accepted what"}, "ps": [{"tr": "Hamas 31 Temmuz'da anlaşmanın ilk adımını kabul ettiğini açıkladı: silahlar Filistinli bir komiteye teslim edilecek, karşılığında İsrail Gazze'den tam olarak çekilecek. Saatler sonra Trump, Camp David'deki kabine toplantısında İsrail'le bir mutabakat bulunduğunu ve İsrail'in memnun olduğunu söyledi. İsrail hükümeti metnin şartlarını resmen kabul etmedi. Bakan Itamar Ben-Gvir planı İsrail için kabul edilemez buldu; BM Daimi Temsilcisi Danny Danon CNN'de Hamas'ın bu silahlara yeniden ulaşıp ulaşamayacağını sordu.", "en": "On 31 July Hamas announced it accepted the first step of the agreement: weapons would be handed to a Palestinian committee and, in exchange, Israel would withdraw fully from Gaza. Hours later, at the Cabinet meeting at Camp David, Trump said there is an understanding with Israel and that Israel is content. The Israeli government has not formally accepted the terms. Minister Itamar Ben-Gvir called the plan unacceptable for Israel, while UN ambassador Danny Danon asked on CNN whether Hamas would reach those weapons again.", "refs": ["deal-understanding"]}, {"tr": "Bu köşe 31 Temmuz'da, metindeki yükümlülüklerin silah tarafında toplandığını ve İsrail'in çekilmesinin koşullu bir sonuç olarak bırakıldığını yazmıştı. Bir gün sonraki tablo o dizilimi somutlaştırıyor: kabul beyanı silah tarafından geldi, çekilme tarafına ilişkin elimizdeki şey üçüncü bir başkentin aktarımı.", "en": "This column wrote on 31 July that the obligations in the text are gathered on the weapons side, while an Israeli withdrawal is left as a conditional outcome. The picture a day later makes that ordering concrete: the declaration of acceptance came from the weapons side, and what we have on the withdrawal side is a third capital's account.", "refs": ["prior-vezir", "deal-understanding"]}]}, {"h": {"tr": "Mutabakatı kim taşıyor", "en": "Who carries the understanding"}, "ps": [{"tr": "Trump'ın sözleri tek taraflı bir aktarımdır ve İsrail'in hangi yükümlülüğü hangi tarihte üstlendiğini içermiyor; yazılı bir kabul de açıklanmadı. En güçlü karşı okuma şu: İsrail hükümeti kabul etmiş olabilir ve açıklamayı koalisyon içi dengeler nedeniyle geciktiriyordur. Bu okumayı doğrulayacak gözlemlenebilir tek şey, yayımlanmış bir İsrail kabine kararı ya da İsrailli yetkililerin kendi ağzından teyididir.", "en": "Trump's words are one party's account and do not state which obligation Israel took on, or when; no written acceptance was announced either. The strongest counter-reading is that the Israeli government has accepted and is delaying the announcement because of coalition arithmetic. The only observable that would confirm it is a published Israeli cabinet decision or confirmation from Israeli officials themselves.", "refs": ["deal-understanding"]}, {"tr": "Sahadan gelen ilk işaret ise ters yönde. 1 Ağustos'ta, Hamas'ın taslak anlaşmayı kabul ettiğini açıklamasından saatler sonra Gazze genelinde İsrail hava saldırıları düzenlendi; Al Jazeera en az iki Filistinlinin öldüğünü, en az on kişinin yaralandığını bildirdi. Ateşkes metinlerinin çevresinde silahlı eylemin sürmesi olağandışı sayılmaz; buradaki bilgi, çekilme tarafının henüz gözlemlenebilir bir davranış değişikliğine bağlanmamış olmasıdır.", "en": "The first signal from the ground points the other way. On 1 August, hours after Hamas announced it accepted the draft agreement, Israeli air attacks were carried out across Gaza; Al Jazeera reported at least two Palestinians killed and at least ten wounded. Continued armed action around ceasefire texts is not unusual; the information here is that the withdrawal side has yet to be tied to any observable change in behaviour.", "refs": ["gaza-strikes"]}]}, {"h": {"tr": "Takvimin bir sonraki adımı", "en": "The next step on the clock"}, "ps": [{"tr": "Denge kuruldu demek için erken. Sıradaki gözlemlenebilir adım basit: silahların teslim edileceği Filistinli komitenin adının açıklanması ve ilk teslimin gerçekleşmesi. Komite kurulur ve ilk teslim kamuya doğrulanırsa, anlaşma bir aktarım olmaktan çıkıp bir yükümlülüğe dönüşür. Kurulmadığı sürece elimizde iki tarafın birbirini bekleyerek durduğu bir metin kalır.", "en": "It is early to say a balance has been struck. The next observable step is simple: naming the Palestinian committee that is to receive the weapons, and the first handover taking place. If the committee is constituted and a first handover is publicly confirmed, the agreement moves from an account to an obligation. As long as it is not, what remains is a text with each side standing still and waiting on the other.", "refs": ["deal-understanding"]}]}], "sources": [{"key": "deal-understanding", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/trump-says-us-has-understanding-with-israel-on-hamas-disarmament-deal", "title": {"tr": "Trump, silahsızlanma anlaşmasında İsrail'le \"mutabakat\" olduğunu söyledi", "en": "Trump says there is an \"understanding\" with Israel on the disarmament deal"}, "publishedDate": "2026-07-31"}, {"key": "gaza-strikes", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/1/israel-launches-attacks-across-gaza-one-day-after-hamas-agrees-to-disarm", "title": {"tr": "Hamas'ın silahsızlanmayı kabul etmesinin ardından Gazze'de İsrail saldırıları sürdü", "en": "Israeli attacks resumed across Gaza after Hamas accepted disarmament"}, "publishedDate": "2026-08-01"}, {"key": "prior-vezir", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-31/", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-03", "title": {"tr": "Bezmer'e inen uçak menzil taşıyor", "en": "The aircraft that landed at Bezmer carries range"}, "excerpt": {"tr": "Bir tanker uçağı görev süresini ve menzili uzatır. Bulgaristan meclisinin verdiği yetki de bu kabiliyetin tavanını çiziyor: sekiz uçak, 250 kişi.", "en": "A tanker aircraft lengthens sortie time and range. The authorisation Bulgaria's parliament granted draws the ceiling of that capability: eight aircraft, 250 people."}, "sections": [{"h": {"tr": "İnen kabiliyet", "en": "The capability that landed"}, "ps": [{"tr": "31 Temmuz'da ilk ABD tanker uçağı Bulgaristan'ın güneydoğusundaki Bezmer hava üssüne indi. Bulgaristan meclisi 22 Temmuz'da sekiz tanker uçağı ve 250 ABD askerî personeline kadar yetki vermişti. Savunma Bakanı Dimitar Stoyanov konuşlanmanın geçici olduğunu, Başbakan Rumen Radev uçakların muharip görev için düşünülmediğini söyledi. Savunma Bakanlığı ülkeye doğrudan bir tehdit görmediğini değerlendirdi.", "en": "On 31 July the first US tanker aircraft landed at Bezmer air base in south-eastern Bulgaria. Bulgaria's parliament had authorised up to eight tanker aircraft and up to 250 US service members on 22 July. Defence Minister Dimitar Stoyanov said the deployment is temporary and Prime Minister Rumen Radev said the aircraft are not meant for combat missions. The defence ministry assessed that there is no direct threat to the country.", "refs": ["bezmer"]}, {"tr": "Havada yakıt ikmali bir süre ve mesafe çarpanıdır. Tanker desteğiyle aynı sayıdaki savaş uçağı hedef bölgede daha uzun kalır ve daha uzaktaki üslerden kalkabilir. Radev'in cümlesi bu yüzden hem doğru hem eksik: uçaklar ateş gücü taşımaz, ateş edenlerin görev süresini uzatır.", "en": "Air-to-air refuelling is a multiplier of time and distance. With tanker support the same number of combat aircraft stay longer over a target area and can launch from bases further away. Radev's sentence is therefore both accurate and incomplete: the aircraft carry no firepower and they lengthen the sorties of those that do.", "refs": ["bezmer"]}]}, {"h": {"tr": "Karşı tarafın görebildiği", "en": "What the other side can see"}, "ps": [{"tr": "İran Dışişleri Bakanı Abbas Arakçi, Bulgaristan'ı kararını yeniden değerlendirmeye çağırdı. Bir muhatabın gözlemleyebildiği şey üslenmedir: kalkış saatleri gizlenebilir, bir üsse yerleşen filo gizlenemez. Karşı okuma da açık — bu çağrı, bir tehdit değerlendirmesinden çok alışıldık bir diplomatik itiraz olabilir; ikisini ayıracak olan, İran'ın tutumunun sözden başka bir biçime dönüşüp dönüşmediğidir.", "en": "Iran's Foreign Minister Abbas Araghchi called on Bulgaria to reconsider its decision. What a counterpart can observe is the basing: departure times can be concealed, a squadron settling into a base cannot. The counter-reading is plain — the call may be a routine diplomatic objection rather than a threat assessment, and what separates the two is whether Iran's position takes any form beyond words.", "refs": ["bezmer"]}, {"tr": "Yetkinin sayıları da bir mesaj taşıyor. Sekiz uçak ve 250 kişilik tavan, sürdürülebilir bir ikmal temposunun sınırını belirler: bakım, yedek mürettebat ve yakıt ikmali bu kadroyla yapılabilecek görev sayısını çizer. Bir konuşlanmanın ne kadar dayanabileceğini uçak sayısından çok bu destek kadrosu söyler; Bezmer ve Yambol bölgesinde toplanan yaklaşık 475 imzalı dilekçe ise aynı tavanın yerel siyasi maliyetini gösteriyor.", "en": "The numbers in the authorisation carry a message of their own. A ceiling of eight aircraft and 250 people sets the limit of a sustainable refuelling tempo: maintenance, spare crews and fuel handling draw how many sorties that establishment can support. How long a deployment can hold is told less by the aircraft count than by that support staffing; the petition of nearly 475 signatures gathered in Bezmer and the Yambol region shows the local political cost of the same ceiling.", "refs": ["bezmer"]}]}, {"h": {"tr": "İzlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu konuşlanmanın lojistik bir destekten bir harekât üssüne dönüşüp dönüşmediğini anlamanın dürüst yolu tavanı izlemektir. Bulgaristan meclisi sekiz uçak veya 250 kişilik sınırı yukarı çekerse, görev tanımı da fiilen değişmiş olur. Tavan sabit kaldığı sürece elimizdeki şey, açıklandığı biçimiyle bir ikmal düzeneğidir.", "en": "The honest way to tell whether this deployment turns from logistical support into an operating base is to watch the ceiling. If Bulgaria's parliament raises the limit of eight aircraft or 250 personnel, the mission's definition will have changed in practice. As long as the ceiling holds, what is there is the refuelling arrangement it was described as.", "refs": ["bezmer"]}]}], "sources": [{"key": "bezmer", "kind": "news", "name": "Novinite", "url": "https://www.novinite.com/view_news.php?id=239909", "title": {"tr": "İlk ABD tanker uçağı Bulgaristan'daki Bezmer üssüne indi", "en": "The first US tanker aircraft landed at Bulgaria's Bezmer base"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-04", "title": {"tr": "Yaptırımlı gemi sızdırmaya başlayınca faturayı kim ödüyor?", "en": "Who pays when a sanctioned ship starts to leak?"}, "excerpt": {"tr": "Yaptırım tasarımı finansmanı ve sigortayı hedef alır. Umman açıklarındaki gövde, bu tasarımın dışarıda bıraktığı kalemi gösteriyor: geminin bakımını ve bir kaza hâlinde temizliği kimin üstleneceğini.", "en": "Sanctions design targets financing and insurance. The hull off Oman shows the line item that design leaves outside: who maintains the ship, and who cleans up if something goes wrong."}, "sections": [{"h": {"tr": "28 Temmuz'un görüntüsü", "en": "The image of 28 July"}, "ps": [{"tr": "28 Temmuz tarihli uydu görüntülerinde Caroline Bezengi adlı tankerin yakınında koyu petrol lekeleri, al-Qibliyyah adasının kuzeyinde ise daha açık renkli izler görülüyor. Alan, Umman'ın Zufar valiliğinde korunan bir deniz bölgesi. Uzaktan algılama uzmanı Wim Zwijnenburg, ham petrol depolayan geminin gövdelerinden en az birinin delinmiş göründüğünü söyledi. Gemi Avrupa Birliği ve Birleşik Krallık yaptırımları altında; takip verilerine göre Rus petrolünü Novorossiysk limanından yüklemişti.", "en": "Satellite images dated 28 July show dark oil slicks near the tanker Caroline Bezengi and lighter traces north of al-Qibliyyah island. The area is a protected marine zone in Oman's Dhofar governorate. Remote-sensing specialist Wim Zwijnenburg said at least one of the hulls of the crude storage vessel appears to have been breached. The vessel is under European Union and United Kingdom sanctions; tracking data indicate it loaded Russian oil at the port of Novorossiysk.", "refs": ["oman-spill"]}, {"tr": "Bu gemi, yaptırımın kestiği yolun nereye kıvrıldığının örneği. Kısıtlama, Rus ham petrolünün sigorta ve finans ağı üzerinden taşınmasını pahalılaştırdı; taşımanın kendisini durdurmadı. Ortaya çıkan filo aynı yükü taşıyor ve denetim ağının dışında yaşlanıyor.", "en": "This vessel is an example of where the route cut by sanctions bends to. The restriction made carrying Russian crude through the insurance and finance network more expensive; it did not stop the carrying. The fleet that emerged moves the same cargo and ages outside the inspection network.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Delinen gövdenin iki açıklaması", "en": "Two explanations for a breached hull"}, "ps": [{"tr": "Delinmenin en açık alternatif açıklaması savaş riskidir. İki deniz güvenliği kaynağına göre gemideki sorunlar 8 Haziran'da Yemen'in Mukalla limanı açıklarında başladı ve değerlendirmeler gemide bir patlamaya işaret ediyor. Bu doğruysa gövdeyi delen şey bir olaydır; yaptırımın payı da hasarlı bir geminin yedi hafta boyunca hangi tersaneye ulaşabileceği sorusunda aranmalıdır.", "en": "The clearest alternative explanation for the breach is war risk. According to two maritime security sources the vessel's trouble began on 8 June off Yemen's port of Mukalla, with assessments pointing to an onboard blast. If that holds, what breached the hull was an incident, and the part sanctions play is to be sought in the question of which yard a damaged ship could reach over seven weeks.", "refs": ["oman-spill"]}, {"tr": "Fatura tarafında hesap daha kolay. Sızıntı korunan bir deniz alanında; temizlik yükü Umman'ın kıyı ve çevre birimlerine düşüyor. Yaptırımı koyan Avrupa Birliği ve Birleşik Krallık, geminin ticaretini pahalılaştırma yetkisine sahip; sahildeki masrafı üstlenecek bir mekanizmaları yok. Uluslararası Denizcilik Örgütü durumu izlediğini doğruladı.", "en": "On the invoice side the arithmetic is easier. The leak sits in a protected marine area, and the burden of cleaning it falls on Oman's coastal and environmental bodies. The European Union and the United Kingdom, which imposed the sanctions, have the authority to make the vessel's trade more expensive; they have no mechanism for carrying the cost on the shore. The International Maritime Organization confirmed it is monitoring the situation.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What is measurable"}, "ps": [{"tr": "Bu vakada sınanacak olan, sorumluluğun bir adrese bağlanıp bağlanamayacağı. Geminin sigortacısı ya da işletmecisi kamuya açık biçimde tespit edilir ve Umman ile Uluslararası Denizcilik Örgütü bir hasar değerlendirmesi yayımlarsa, gölge filonun maliyeti ilk kez ölçülebilir bir kalem hâline gelir. Tespit yapılmadığı sürece masraf kıyıda kalır.", "en": "What will be tested here is whether responsibility can be attached to an address. If the vessel's registered insurer or operator is publicly identified and Oman and the International Maritime Organization publish a damage assessment, the cost of the shadow fleet becomes a measurable line item for the first time. As long as no such identification is made, the expense stays on the shore.", "refs": ["oman-spill"]}]}], "sources": [{"key": "oman-spill", "kind": "news", "name": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/07/oil-spill-shadow-fleet-tanker-spreading-oman-satellite-images-show", "title": {"tr": "Yaptırım listesindeki gölge filo tankerinden Umman açıklarına petrol sızıyor", "en": "Oil is leaking from a sanctioned shadow-fleet tanker off Oman"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-05", "title": {"tr": "50.000'den az oyla kurulan bir dış politika", "en": "A foreign policy built on fewer than 50,000 votes"}, "excerpt": {"tr": "Lima'daki yeni hükümet Washington'u stratejik ortak olarak tanımlıyor ve aynı hafta Meksika, Kolombiya ve Venezuela ile kapıları da açık tutuyor. Bu bir seçenek genişletmesi; arkasındaki seçim farkı ise hangi tarafın ne kadar zorlayabileceğini belirliyor.", "en": "The new government in Lima calls Washington a strategic partner and in the same week keeps doors open to Mexico, Colombia and Venezuela. That is a widening of options; the electoral margin behind it sets how hard any side can push."}, "sections": [{"h": {"tr": "Farkın büyüklüğü", "en": "The size of the margin"}, "ps": [{"tr": "Keiko Fujimori 28 Temmuz'da göreve başladı. Haziran ayındaki ikinci turu, solcu rakibi Roberto Sánchez karşısında 50.000'den az oy farkıyla kazanmıştı. Dışişleri Bakanı Carlos Espá bu hafta atandı; Espá daha önce Lima'daki ABD Büyükelçiliği'nde iletişim direktörü olarak çalışmıştı. Göreve başlama törenine ABD Dışişleri Bakan Yardımcısı Christopher Landau katıldı.", "en": "Keiko Fujimori took office on 28 July. She had won June's runoff by fewer than 50,000 votes over her left-wing rival Roberto Sánchez. Foreign Minister Carlos Espá was appointed this week; he had previously worked as communications director at the US embassy in Lima. US Deputy Secretary of State Christopher Landau attended the inauguration.", "refs": ["peru-alignment"]}, {"tr": "Hükümetin dış politika dili tereddütsüz: ABD stratejik ortak olarak tanımlanıyor ve organize suçla mücadele için kurulan Shield of the Americas koalisyonuna katılım planlanıyor. Bu tercihin dayandığı seçmen tabanı ise ülkeyi ikiye bölen bir farkla kazanılmış durumda. Dışarıya kesin görünen bir hizalanma, içeride ince bir çoğunluğa yaslanıyor.", "en": "The government's foreign-policy language is unhesitating: the United States is named a strategic partner and the plan is to join the Shield of the Americas coalition against organised crime. The electorate that choice rests on, though, was won by a margin that split the country in two. An alignment that looks firm from outside leans on a thin majority at home.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Aynı hafta açılan üç kapı", "en": "Three doors opened in the same week"}, "ps": [{"tr": "Aynı hükümet, Meksika ve Kolombiya ile diplomatik ilişkileri onarmayı ve Venezuela ile ilişkileri yeniden kurmayı da planlıyor. Bir başkent aynı hafta hem Washington'la bir güvenlik koalisyonu hem bölge komşularıyla normalleşme konuşuyorsa, seçenek kümesini genişletiyor demektir. Bunun en güçlü karşı okuması, bu genişliğin strateji yerine koalisyon içi denge ihtiyacından doğduğudur: dar farkla kazanmış bir hükümet, birbirine zıt seçmen bloklarına aynı anda bir şey söylemek zorundadır.", "en": "The same government also plans to repair diplomatic relations with Mexico and Colombia and to rebuild ties with Venezuela. When a capital talks in one week about a security coalition with Washington and about normalising with its regional neighbours, it is widening its option set. The strongest counter-reading is that this breadth comes from the arithmetic of coalition management rather than from strategy: a government that won narrowly has to say something to opposing blocs of voters at once.", "refs": ["peru-alignment"]}, {"tr": "Kısıtın nerede olduğu bakırla ilgili. Peru büyük bir bakır üreticisi ve son yıllarda Çin'e yakınlaşmış durumda. Bir güvenlik koalisyonuna katılmak imza gerektirir; ihracatın alıcısını değiştirmek sözleşme, liman ve fiyat gerektirir. Madencilik bölgelerinde çalışan ve geliri bu ihracata bağlı olan kesim, dış politika tercihini sandıktan çok bu ikinci kanaldan hissedecek.", "en": "Where the constraint sits has to do with copper. Peru is a major copper producer that has moved closer to China in recent years. Joining a security coalition takes a signature; changing who buys your exports takes contracts, ports and prices. The people working in the mining regions, whose income depends on those exports, will feel the foreign-policy choice through that second channel more than at the ballot box.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Sözden uygulamaya geçişin işareti", "en": "The sign that words became practice"}, "ps": [{"tr": "Sözün ne kadarının uygulamaya geçtiğini ölçmenin yolu var. Peru, Shield of the Americas koalisyonuna resmen katılır ve aynı dönemde Venezuela ile büyükelçi düzeyinde temsil yeniden kurulursa, çok yönlü hizalanma yürütülen bir politika olur. İkisinden yalnızca biri gerçekleşirse, hükümetin hangi kapıyı gerçekten açtığı da belli olur.", "en": "There is a way to measure how much of the talk becomes practice. If Peru formally joins the Shield of the Americas coalition and ambassadorial representation with Venezuela is restored in the same period, the multi-alignment becomes a policy being carried out. If only one of the two happens, it will also be clear which door the government actually opened.", "refs": ["peru-alignment"]}]}], "sources": [{"key": "peru-alignment", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/strategic-partner-perus-fujimori-plans-to-intensify-ties-with-the-us", "title": {"tr": "Peru'nun yeni hükümeti ABD ile ilişkileri derinleştirmeyi planlıyor", "en": "Peru's new government plans to deepen ties with the United States"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-06", "title": {"tr": "Bir makam basamak hâline geldiğinde seçmen de ona göre davranıyor", "en": "When an office becomes a stepping stone, voters treat it as one"}, "excerpt": {"tr": "Büyük Manchester belediye başkanlığının bu hafta boşalma sebebi, sahibinin başbakanlığa geçmesiydi. Aynı sandıkta katılım yedi puan düştü ve kazananı ikinci tercihler belirledi.", "en": "The reason the Greater Manchester mayoralty fell vacant this week was that its holder moved to the premiership. At the same ballot turnout fell by seven points and second preferences decided the winner."}, "sections": [{"h": {"tr": "Boşalan koltuğun sebebi", "en": "Why the seat fell vacant"}, "ps": [{"tr": "İşçi Partisi adayı Bev Craig, 31 Temmuz'da açıklanan sonuçla Büyük Manchester belediye başkanı seçildi. Ara seçim, Andy Burnham'ın haziranda Makerfield milletvekilliğini kazanması ve ardından parti liderliğine ve başbakanlığa geçmesiyle boşalan koltuk için yapıldı. İlk turda Craig 251.449 oyla yüzde 47,15, Reform UK adayı Sian Astley 111.928 oyla yüzde 20,99 aldı; hiçbir aday çoğunluğu sağlayamadığı için ikinci tercihler sayıldı ve Craig 309.525, Astley 157.178 oya ulaştı.", "en": "Labour's Bev Craig was elected mayor of Greater Manchester in a result declared on 31 July. The by-election was held for the seat vacated when Andy Burnham won the Makerfield parliamentary seat in June and then moved to the party leadership and the premiership. In the first round Craig took 251,449 votes, or 47.15 per cent, and Reform UK's Sian Astley 111,928 votes, or 20.99 per cent; because no candidate reached a majority, second preferences were counted and Craig reached 309,525 against Astley's 157,178.", "refs": ["manchester-mayor"]}, {"tr": "Bu haftaki boşalmanın sebebi, makamın ulusal liderliğe giden bir basamak olarak işleyebilmesiydi. Bir kurumun niteliği çoğu zaman sahiplerinin onu nasıl kullandığında görünür; bölgesel yürütmenin bu kez oynadığı rol, kendi bölgesindeki yetkilerinden çok Westminster'a açılan kapı oldu.", "en": "The reason for this week's vacancy was that the office can work as a step towards national leadership. The character of an institution usually shows in how its holders use it; the part the regional executive played this time was the door it opened to Westminster rather than the powers it holds in its own region.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "İki seçim arasındaki fark", "en": "The gap between two elections"}, "ps": [{"tr": "Karşılaştırma için elimizde bir önceki veri noktası var. Katılım bu seçimde yüzde 25 oldu; Mayıs 2024 seçiminde yüzde 32'ydi. Aynı dönemde Reform UK'in oyu 2024'teki 50.000 düzeyinden 157.000'in üzerine çıktı. İşçi Partisi koltuğu korudu; korunan zeminin bileşimi ise değişti.", "en": "There is a prior data point for comparison. Turnout at this election was 25 per cent; at the May 2024 election it was 32 per cent. Over the same span Reform UK's vote rose from 50,000 in 2024 to more than 157,000. Labour held the seat; the composition of the ground it held changed.", "refs": ["manchester-mayor"]}, {"tr": "Buradaki en açık benzemezliği kaydetmek gerekir. Temmuz sonunda yapılan tek koltuklu bir ara seçim ile mayıs ayında planlı biçimde yapılan bir seçim aynı sandık sayılmaz; mevsim, tek yarışın olması ve kampanya süresi katılımı kendi başına aşağı çeker. Yedi puanlık farkın ne kadarının siyasi ilgisizlikten, ne kadarının takvimden geldiğini bu iki oran söylemiyor.", "en": "The clearest disanalogy has to be set down. A single-seat by-election at the end of July does not count as the same ballot as a scheduled election in May; the season, the absence of other contests and the length of the campaign pull turnout down on their own. These two rates do not say how much of the seven-point gap comes from political disengagement and how much from the calendar.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "Bir sonraki dönüş", "en": "The next turn"}, "ps": [{"tr": "Asıl soru, ikinci tercihlere kalan bir yarışın istisna mı yoksa yeni normal mi olduğu. Craig'in ilk turda yüzde 47,15'te kalması, bölgesel yürütmenin tek bir partiye rahatça yazılmadığı anlamına geliyor. Aynı bölgede yapılacak bir sonraki planlı seçim de ikinci tercihlere kalırsa, makamın koalisyonla kazanıldığı bir döneme girilmiş olur.", "en": "The real question is whether a contest that goes to second preferences is the exception or the new normal. Craig stopping at 47.15 per cent in the first round means the regional executive is not comfortably assigned to a single party. If the next scheduled election in the same region also goes to second preferences, the office will have entered a period of being won by coalition.", "refs": ["manchester-mayor"]}]}], "sources": [{"key": "manchester-mayor", "kind": "news", "name": "ITV News", "url": "https://www.itv.com/news/granada/2026-07-31/labour-retain-greater-manchester-mayor-as-votes-finally-counted-after-15-hours", "title": {"tr": "Büyük Manchester belediye başkanlığını İşçi Partisi'nden Bev Craig kazandı", "en": "Labour's Bev Craig won the Greater Manchester mayoralty"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-01", "title": {"tr": "Yasak temyiz boyunca yürürlükte kalıyor", "en": "The ban stays in force while the appeal runs"}, "excerpt": {"tr": "Yüksek Mahkeme, Palestine Action davasında temyize tek bir gerekçeyle izin verdi ve ifade özgürlüğüne dayanan gerekçeleri kabul etmedi. Böylece dosya bir hak tartışmasından, bir bakanın kendi ölçütünü nasıl uyguladığı sorusuna daraldı; yasaklama kararı bu süre boyunca işlemeye devam ediyor.", "en": "The Supreme Court allowed the Palestine Action appeal on one ground and refused the free-expression grounds. The case has narrowed from a question about rights to a question about how a minister applied her own test, and the proscription keeps operating throughout."}, "sections": [{"h": {"tr": "Hangi gerekçeye izin verildi", "en": "Which ground was allowed through"}, "ps": [{"tr": "Birleşik Krallık Yüksek Mahkemesi 30 Temmuz'da Palestine Action'ın kurucularından Huda Ammori'nin başvurusunu tek bir gerekçeyle temyize açtı: dönemin İçişleri Bakanı Yvette Cooper'ın kendi politikasını yanlış uygulamış olması. İfade ve örgütlenme özgürlüğüne dayanan gerekçelere izin verilmedi. Bu ayrım dosyanın niteliğini değiştiriyor. Sonbaharda cevaplanacak soru şu: bakan, takdir yetkisini kendi ilan ettiği ölçüte uygun kullandı mı?", "en": "The UK Supreme Court opened Huda Ammori's challenge to appeal on 30 July on a single ground: that the then home secretary, Yvette Cooper, misapplied her own policy. Permission was refused on freedom of expression and association. The distinction changes what the case is about. The question to be answered in the autumn is this: did the minister exercise her discretion in line with the test she had herself announced?", "refs": ["proscription"]}, {"tr": "Dosyanın seyri de bu daralmayı gösteriyor. Şubat ayında High Court yasaklama kararının iptal edilmesi gerektiğine hükmetti, İstinaf Mahkemesi haziranda bu kararı bozdu, Yüksek Mahkeme ise geriye tek gerekçe bıraktı. Duruşma hızlandırıldı ve 1 Ekim ile 21 Aralık arasına alındı; kararı Lord Sales, Lord Leggatt ve Lady Simler verdi.", "en": "The path of the case shows the same narrowing. In February the High Court held that the proscription should be quashed; in June the Court of Appeal overturned that; the Supreme Court has now left one ground standing. The hearing has been expedited to a date between 1 October and 21 December, and the permission decision was taken by Lord Sales, Lord Leggatt and Lady Simler.", "refs": ["proscription"]}]}, {"h": {"tr": "Dar kapıdan çıkacak sonuç", "en": "What can come out of a narrow gate"}, "ps": [{"tr": "Ayakta kalan gerekçe yetkinin kullanılış biçimine ilişkin. Bu tür bir kusur çoğu zaman kararın usulüne uygun biçimde yeniden alınmasıyla giderilir; dolayısıyla başvurunun kabulü tek başına yasağın sona ermesi anlamına gelebilir de gelmeyebilir de. Alternatif okuma da mümkün: mahkeme bakanın politikasını öyle bir okuyabilir ki aynı sonuca yeniden ulaşmak pratikte mümkün olmaz. İki ihtimal arasındaki fark, kararın gerekçesinin ne kadar dar yazıldığına bağlı.", "en": "The surviving ground concerns how the power was used. A defect of that kind is usually cured by retaking the decision properly, so success on appeal may or may not end the ban. The other reading is open too: the court could construe the policy so tightly that reaching the same outcome again becomes impractical. The difference between the two turns on how narrowly the judgment is written.", "refs": ["proscription"]}, {"tr": "Bu ayrımı ayırt etmenin gözlenebilir bir yolu var. Temyiz bu tek gerekçeden kabul edilirse, 31 Mart 2027'ye kadar ya İçişleri Bakanlığı, yani Home Office, yeni bir yasaklama kararı alıp yayımlar ya da grup bakanlığın yasaklı örgütler listesinden çıkar. Hangisinin gerçekleştiği, kararın kapsamını gerekçe metnini okumadan da gösterir.", "en": "There is an observable way to tell them apart. If the appeal succeeds on that single ground, then by 31 March 2027 either the Home Office takes and publishes a fresh proscription decision, or the group comes off the Home Office list of proscribed organisations. Which of the two happens will show the judgment's reach without anyone having to parse its reasoning.", "refs": ["proscription"]}]}, {"h": {"tr": "Bu arada yürürlükte kalan yetki", "en": "The power that stays in force meanwhile"}, "ps": [{"tr": "Yasak temyiz boyunca yürürlükte. Yani ekimden aralığa uzanan duruşma penceresi boyunca, gruba destek ifade etmenin hukuki sonucu değişmiyor. Yargısal denetim başlamış olsa da idari işlem kesintisiz çalışmayı sürdürüyor.", "en": "The ban remains in force duri
