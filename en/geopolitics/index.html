 happens, the pattern of July should be expected to continue through August, and the outages should then be read as the result of a supply line rather than of a maintenance schedule.", "refs": ["cuba-grid"], "tr": "Bu yüzden bir sonraki adım bir açıklamada değil bir sevkiyatta görünür. Üçüncü bir tedarikçi devreye girerse bunun ilk kanıtı adaya boşaltılan kargo olur; ikinci kanıtı ise yeniden devreye alınan üretimin bir hafta boyunca talebin üzerinde kalmasıdır. İkisi de gerçekleşmezse temmuzdaki örüntünün ağustos boyunca sürmesini beklemek gerekir ve o zaman kesintiler bir bakım programının değil bir tedarik hattının sonucu olarak okunmalıdır."}]}], "sources": [{"key": "cuba-grid", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/3/grid-failure-plunges-cuba-into-nationwide-blackout", "title": {"tr": "Küba'nın ulusal elektrik şebekesi yeniden çöktü", "en": "Cuba's national grid collapses again, cutting power across the island"}, "publishedDate": "2026-08-03"}], "title": {"en": "Havana lost both suppliers in the same seven months", "tr": "Havana yedi ay içinde iki tedarikçisini de kaybetti"}, "writer": "geo-04", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The election office opened in Torit turns South Sudan's December date into an administrative task list for the first time. The first item on that list is not voting but reaching eight counties.", "tr": "Torit'te açılan seçim ofisi, Güney Sudan'ın aralık tarihini ilk kez bir idari görev listesine çeviriyor. Listenin ilk maddesi oy verme değil, sekiz ilçeye ulaşmak."}, "sections": [{"h": {"en": "What opened in Torit", "tr": "Torit'te açılan şey"}, "ps": [{"en": "Eastern Equatoria's governor, Louis Lobong Lojore, inaugurated the State High Election Committee's office in Torit. The country plans to hold its first general election since independence in 2011 on 22 December 2026. The opening is the first concrete step at which the national timetable acquires an address and a staff at state level; until then the date existed as a decree, and now it has a building.", "refs": ["south-sudan-office"], "tr": "Doğu Ekvatorya Valisi Louis Lobong Lojore, Torit'te Eyalet Yüksek Seçim Komitesi'nin ofisini hizmete açtı. Ülke 22 Aralık 2026'da, 2011'deki bağımsızlığından bu yana ilk genel seçimini yapmayı planlıyor. Açılış, ulusal takvimin eyalet düzeyinde bir adres ve bir kadro kazandığı ilk somut adım; o güne kadar tarih bir kararname olarak vardı, artık bir binası var."}, {"en": "Who was in the room is also a choice. The inauguration was attended by SPLM state deputy chairperson Margret Itoo Leonardo and SPLM-IO representative Ochola Bosco Oringa, with Deputy Governor Karlo Andrew Akwo Ajerry also present. The two sides of the power-sharing arrangement each sent a name into the room at the moment the machinery was set up. The weight of that should not be overstated: attending an opening is cheap and can be explained by protocol. Even so, the fact that the first objection to the process did not arrive at this stage is worth recording.", "refs": ["south-sudan-office"], "tr": "Salonda kimlerin bulunduğu da bir tercih. Açılışa SPLM eyalet başkan yardımcısı Margret Itoo Leonardo ile SPLM-IO temsilcisi Ochola Bosco Oringa katıldı; Vali Yardımcısı Karlo Andrew Akwo Ajerry de oradaydı. Güç paylaşımının iki tarafı, mekanizmanın kurulduğu anda aynı odaya birer isim gönderdi. Bunun ağırlığını abartmamak gerekir: bir açılışa katılmak ucuzdur ve protokolle de açıklanabilir. Yine de sürecin ilk itirazının bu aşamada gelmemiş olması dikkate değer bir veridir."}]}, {"h": {"en": "The administration that has to carry the timetable", "tr": "Takvimi taşıyacak olan idare"}, "ps": [{"en": "The committee's chairperson, Abdalla Hassan Famai, said they would visit the eight counties and administrative areas to explain to people how they can take part, because an election is an inclusive activity. Governor Lojore directed the committee to begin civic and voter education campaigns immediately across all counties, payams and bomas. The scope of that instruction is notable: the education is to reach not only county centres but the smallest administrative unit.", "refs": ["south-sudan-office"], "tr": "Komite başkanı Abdalla Hassan Famai, sekiz ilçeyi ve idari bölgeleri ziyaret ederek halka seçime nasıl katılacağını anlatacaklarını, çünkü seçimin kapsayıcı bir faaliyet olduğunu söyledi. Vali Lojore ise komiteye tüm ilçelerde, payamlarda ve bomalarda yurttaşlık ve seçmen eğitimi kampanyalarına derhal başlaması talimatını verdi. Talimatın kapsamı dikkat çekici: eğitim yalnızca ilçe merkezlerine değil, en küçük idari birime kadar indirilecek."}, {"en": "What the announcement provides and what it does not part company here. There is a task, a scope and a closing date; no schedule was published for which weeks the visits and the education will take place. The measure to follow in the coming period is therefore not December but registration: voter registration opening in all eight counties, and the committee announcing a date for it, would be the first concrete evidence that the timetable can be carried.", "refs": ["south-sudan-office"], "tr": "Duyurunun verdiği ve vermediği şeyler burada ayrışıyor. Ortada bir görev, bir kapsam ve bir bitiş tarihi var; ziyaretlerin ve eğitimin hangi haftalarda yapılacağına dair bir program açıklanmadı. Bu nedenle önümüzdeki dönemde izlenecek ölçüt aralık ayı değil, kayıt aşamasıdır: sekiz ilçenin tamamında seçmen kaydının açılması ve komitenin bu iş için bir tarih ilan etmesi, takvimin taşınabildiğini gösterecek ilk somut kanıt olur."}]}], "sources": [{"key": "south-sudan-office", "kind": "news", "name": "Radio Tamazuj", "url": "https://www.radiotamazuj.org/en/news/article/eastern-equatoria-launches-election-office", "title": {"tr": "Güney Sudan'ın Doğu Ekvatorya eyaletinde seçim ofisi açıldı", "en": "South Sudan's Eastern Equatoria opens a state election office"}, "publishedDate": "2026-08-03"}], "title": {"en": "Eight counties, one office, and a date in December", "tr": "Sekiz ilçe, bir ofis ve aralıkta bir tarih"}, "writer": "geo-05", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "A military offensive ended one group's presence in the Swat valley seventeen years ago. What was attacked on Sunday was the everyday protective arrangement that offensive left behind.", "tr": "Swat vadisinde bir askerî harekât, on yedi yıl önce bir grubun varlığını sona erdirmişti. Pazar günü saldırıya uğrayan, o harekâtın ardından geriye kalan gündelik koruma düzeniydi."}, "sections": [{"h": {"en": "The present-day explanation first", "tr": "Önce bugünün açıklaması"}, "ps": [{"en": "In the Kabal area of Khyber Pakhtunkhwa, an attacker detonated explosives at the entrance to a police station and at least 14 people were killed. Al Jazeera reported that Swat district police officer Umar Khan said the explosion followed an attempt by officers to stop and search the man; according to Arab News, assistant commissioner Ayesha Nasir said the apparent target of the attack was the police. Reported injury tolls differ between sources, and no group claimed responsibility.", "refs": ["swat-bombing"], "tr": "Hayber Pahtunhva'nın Kabal ilçesinde, polis merkezinin girişinde bir saldırgan üzerindeki patlayıcıyı ateşledi ve en az 14 kişi öldü. Al Jazeera'ya göre Swat İlçe Polis Müdürü Umar Han, patlamanın polislerin saldırganı durdurup arama yapmak istemesi üzerine gerçekleştiğini söyledi; Arab News'a göre Kaymakam Ayşe Nasır saldırının hedefinin polis olduğunun anlaşıldığını belirtti. Yaralı sayısına ilişkin bildirimler kaynaklar arasında farklılık gösteriyor ve saldırıyı üstlenen olmadı."}, {"en": "The strongest current explanation of the event is the resurgence of attacks in the area. That is precisely what the crowd at the nearby intersection had gathered to protest; Arab News named the rally the Swat People's Peace Uprising, organised by local residents and civil society groups. The demand, in other words, was addressed to a security institution, and the physical form that institution took at that moment was a police station gate and a search conducted at it.", "refs": ["swat-bombing"], "tr": "Bu olayın en güçlü güncel açıklaması, bölgede yeniden yükselen saldırılardır. Yakındaki kavşakta toplananlar da tam bunu protesto ediyordu; Arab News mitingi, yerel halk ve sivil toplum gruplarınca düzenlenen Swat Halkının Barış Ayaklanması olarak adlandırdı. Yani talep bir güvenlik kurumuna yöneltilmişti ve o kurumun o andaki fiziksel karşılığı bir karakol kapısı ile orada yapılan bir aramaydı."}]}, {"h": {"en": "What was inherited from 2009", "tr": "2009'dan devralınan düzen"}, "ps": [{"en": "The valley's present protective arrangement was inherited from somewhere. According to the same reporting, Swat was the centre of the Pakistan Taliban's presence until a 2009 military offensive drove the group out. What that offensive settled was a presence: an armed structure's control of the terrain was ended. What it handed on was everyday protection; where an army operation had been, there remained a district police force, a station and a search at its gate. It was that second arrangement that was attacked on Sunday.", "refs": ["swat-bombing"], "tr": "Vadinin bugünkü koruma düzeni bir yerden devralındı. Aynı habere göre Swat, 2009'daki askerî harekât grubu bölgeden çıkarana kadar Pakistan Talibanı'nın merkezi konumundaydı. O harekâtın çözdüğü şey bir varlıktı: silahlı bir yapının araziyi denetlemesi sona erdirildi. Devrettiği şey ise gündelik korumaydı; bir ordu operasyonunun bıraktığı yerde ilçe polisi, bir karakol ve girişte yapılan bir arama kaldı. Pazar günü saldırıya uğrayan da bu ikinci düzendi."}, {"en": "That is also where the analogy breaks, and the break matters. In 2009 the instrument used in Swat was a military offensive; the demand voiced on Sunday was addressed to civil administration and to a district police force, and the attack was aimed directly at that force. Statements from the top of the government, by contrast, preserve the language of 2009 in saying the fight will continue until it is eradicated. Which institution the answer comes from will also determine whether the arrangement the valley inherited is renewed: a reinforced police service and a newly declared military offensive mean two different futures for the same valley.", "refs": ["swat-bombing"], "tr": "Benzetmenin kırıldığı nokta da burasıdır ve önemlidir. 2009'da Swat'ta başvurulan araç bir askeri harekâttı; pazar günü dile getirilen talep ise sivil idareye ve ilçe polisine yöneltildi, saldırı da doğrudan o gücü hedef aldı. Buna karşılık hükümetin en üst düzeyinden gelen açıklamalar, mücadelenin kökü kazınana kadar süreceğini söyleyerek 2009'un dilini koruyor. Cevabın hangi kurumdan geleceği, vadinin devraldığı düzenin yenilenip yenilenmeyeceğini de belirleyecek: takviye edilen bir polis teşkilatı ile yeniden ilan edilen bir askeri harekât, aynı vadide farklı iki gelecek anlamına gelir."}]}], "sources": [{"key": "swat-bombing", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/suicide-bomber-kills-14-outside-police-station-in-pakistans-swat", "title": {"tr": "Swat'ta karakol kapısındaki intihar saldırısında 14 kişi öldü", "en": "A suicide bombing at a Swat police station gate kills 14"}, "publishedDate": "2026-08-02"}], "title": {"en": "Kabal's gate is what the 2009 offensive left behind", "tr": "Kabal'daki kapı, 2009 harekâtından geriye kalan"}, "writer": "geo-06", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The multiples will be quoted: PAC-3 output tripled, THAAD output quadrupled. The change that actually binds anyone is the length of the paper they are written on.", "tr": "Alıntılanacak olan katsayılar: PAC-3 üretimi üç, THAAD üretimi dört katına. Oysa tarafları asıl bağlayan değişiklik, bu katsayıların yazıldığı metnin süresi."}, "sections": [{"h": {"en": "What changed in the instrument", "tr": "Metinde değişen ne"}, "ps": [{"en": "The US defence department replaced a $4.7bn one-year agreement with Lockheed Martin with a seven-year contract valued at $58bn, and awarded Northrop Grumman more than $3bn, while stating that PAC-3 interceptor output would triple and THAAD output quadruple. Two of those four numbers describe quantities of missiles. The other two describe how long the buyer has agreed to keep buying them.", "refs": ["interceptor-contract"], "tr": "ABD savunma bakanlığı, Lockheed Martin'le yapılmış 4,7 milyar dolar değerindeki bir yıllık anlaşmanın yerine 58 milyar dolar değerinde yedi yıllık bir sözleşme koydu; Northrop Grumman'a da 3 milyar dolar üzerinde bir iş verdi. Aynı duyuruda PAC-3 önleyici füze üretiminin üç, THAAD üretiminin dört katına çıkacağı belirtildi. Bu dört sayının ikisi füze adedini anlatıyor. Diğer ikisi, alıcının ne kadar süre boyunca almayı taahhüt ettiğini."}, {"en": "A one-year agreement leaves the cost of expansion with the supplier: new tooling, a second line, hires and long-lead components all have to be recovered before the next annual decision, so the rational supplier expands slowly. A seven-year contract moves that horizon onto the buyer's side of the table, which is the condition under which a tripling can be planned rather than promised. It is also the reason a later administration will find the commitment expensive to unwind. The alternative reading is duller and cannot be excluded: multiyear conversions are a familiar budgeting device at the end of a bridge year, and this one may be ordinary procurement housekeeping that the production multiples were attached to afterwards.", "refs": ["interceptor-contract"], "tr": "Bir yıllık anlaşma, genişlemenin maliyetini tedarikçinin sırtında bırakır: yeni tezgâh, ikinci hat, istihdam ve uzun tedarik süreli parçaların tamamı bir sonraki yıllık karardan önce geri kazanılmak zorundadır, dolayısıyla aklı başında bir tedarikçi yavaş büyür. Yedi yıllık sözleşme bu ufku masanın alıcı tarafına taşır; üretimin üçe katlanmasının vaat edilmek yerine planlanabilmesinin koşulu da budur. Aynı özellik, taahhüdün ileride bir başka yönetim tarafından geri alınmasını pahalı kılar. Daha sıradan bir okuma da mümkün ve dışlanamaz: çok yıllı sözleşmeye geçiş, köprü yılının sonunda sık başvurulan bir bütçeleme yöntemidir ve bu iş, üretim katsayılarının sonradan iliştirildiği alışılmış bir tedarik işlemi olabilir."}]}, {"h": {"en": "Where the obligation can fail", "tr": "Yükümlülüğün kırılabileceği yer"}, "ps": [{"en": "Michael P. Duffey, the under-secretary for acquisition and sustainment, said that building what he called the Arsenal of Freedom \"requires robust, dynamic supply chains at every level\". Read as an official naming the weak point rather than as a slogan, that sentence identifies the layer the contract cannot reach. Washington can bind itself to seven years of orders; it cannot bind a fourth-tier supplier of solid rocket motors or seeker components to the same schedule, and the sub-tier is where an interceptor programme usually loses its year. A production multiple is an authority to buy at a rate. Depleted Patriot stocks in Ukraine are consumed at a rate. The two rates are set in different places.", "refs": ["interceptor-contract"], "tr": "Tedarik ve idameden sorumlu müsteşar Michael P. Duffey, \"Özgürlüğün Cephaneliği'ni kurmak her düzeyde sağlam ve devingen tedarik zincirleri gerektirir\" dedi. Bu cümleyi bir slogan olarak değil, bir yetkilinin zayıf halkayı işaret etmesi olarak okumak gerekir: sözleşmenin ulaşamadığı katman tam olarak orasıdır. Washington kendisini yedi yıllık siparişe bağlayabilir; katı yakıtlı roket motoru ya da arayıcı başlık üreten dördüncü kademe bir tedarikçiyi aynı takvime bağlayamaz ve önleyici füze programları yılını genellikle bu alt kademede kaybeder. Üretim katsayısı, belirli bir hızda satın alma yetkisidir. Ukrayna'da tükenen Patriot stokları ise belirli bir hızda harcanır. Bu iki hız ayrı yerlerde belirlenir."}, {"en": "The market read the announcement quickly — Northrop Grumman up about 1 percent, Lockheed Martin about 0.7 percent in early trading — which is roughly what a seven-year revenue floor is worth to an equity holder and tells us nothing about deliveries. If the department publishes annual delivery quantities for the first contract year, the multiple becomes testable within twelve months rather than seven: a first-year PAC-3 delivery figure at or above three times the last single-year rate would show the sub-tier moved with the contract, and anything materially below it would show that the instrument bought time rather than missiles.", "refs": ["interceptor-contract"], "tr": "Piyasa duyuruyu hızla fiyatladı: açılışta Northrop Grumman yaklaşık yüzde 1, Lockheed Martin yaklaşık yüzde 0,7 yükseldi. Bu, yedi yıllık bir gelir tabanının hissedar için kabaca ne ettiğini gösterir, teslimat hakkında ise hiçbir şey söylemez. Bakanlık sözleşmenin ilk yılına ait yıllık teslimat adetlerini yayımlarsa katsayı yedi yılda değil on iki ayda sınanabilir hâle gelir: ilk yıl PAC-3 teslimatının son tek yıllık üretimin üç katına ulaşması alt kademenin sözleşmeyle birlikte hareket ettiğini gösterir, belirgin biçimde altında kalması ise metnin füze değil zaman satın aldığını."}]}], "sources": [{"key": "interceptor-contract", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/8/3/pentagon-boosts-patriot-thaad-interceptor-output-amid-stockpile-strain", "title": {"tr": "Pentagon bir yıllık önleyici füze anlaşmasını yedi yıllık sözleşmeye çevirdi", "en": "The Pentagon turns a one-year interceptor agreement into a seven-year contract"}, "publishedDate": "2026-08-03"}], "title": {"en": "A one-year agreement was rewritten as a seven-year contract", "tr": "Bir yıllık anlaşma yedi yıllık sözleşme olarak yeniden yazıldı"}, "writer": "geo-01", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Two capitals appear in the exercise plan as framework nations. The rest of the coalition appears in a sentence about talks that are still under way, and the difference between those two sentences is the coalition's real shape.", "tr": "Tatbikat planında iki başkent çerçeve ülke olarak yer alıyor. Koalisyonun geri kalanı ise hâlâ süren görüşmelere ilişkin bir cümlede geçiyor; koalisyonun gerçek biçimi de bu iki cümle arasındaki farkta."}, "sections": [{"h": {"en": "Named, and not yet named", "tr": "Adı geçenler ve henüz geçmeyenler"}, "ps": [{"en": "A Polish defence ministry spokesperson set out what the autumn exercise is for: testing the command-and-control system, the organisation of logistical support and the deployment of troops, \"thereby confirming the force's ability to operate once hostilities have ended\". France and the United Kingdom will be the core participants as the coalition's framework nations, and Poland was chosen because it is the logistical and infrastructure hub for the Multinational Force Ukraine. Then comes the other sentence: military-to-military discussions are under way regarding the participation of other member countries.", "refs": ["poland-drills"], "tr": "Polonya Millî Savunma Bakanlığı sözcüsü, sonbahardaki tatbikatın ne işe yarayacağını sıraladı: komuta kontrol sisteminin sınanması, lojistik desteğin örgütlenmesi ve birliklerin konuşlandırılması, \"böylece kuvvetin çatışmalar sona erdiğinde harekât yeteneğinin doğrulanması\". Koalisyonun çerçeve ülkeleri olarak Fransa ve Birleşik Krallık çekirdek katılımcı olacak; Polonya ise Çokuluslu Ukrayna Kuvveti'nin lojistik ve altyapı merkezi olduğu için seçildi. Ardından öteki cümle geliyor: koalisyon üyesi diğer ülkelerin katılımı için ordular arası görüşmeler sürüyor."}, {"en": "Those are two different grammatical moods for two different levels of commitment. On one side of the scale, London and Paris have accepted a role with a name attached to it and a set of tasks that can be graded after the exercise. On the other, the remaining members are the subject of a negotiation whose outcome is not yet a fact, with the exercise only months away. A coalition assembled in 2025 to coordinate support for Kyiv is discovering that coordinating support and contributing units to a post-war force are separate decisions, taken by separate domestic majorities. It may also be nothing more than sequencing: framework nations plan first everywhere, and invitations follow a planning calendar rather than a hierarchy of willingness.", "refs": ["poland-drills"], "tr": "Bunlar iki farklı taahhüt düzeyine ait iki farklı kip. Terazinin bir kefesinde, Londra ve Paris adı konmuş bir rolü ve tatbikattan sonra değerlendirilebilecek görevleri kabul etmiş durumda. Öbür kefede, kalan üyeler sonucu henüz olgu olmayan bir müzakerenin konusu ve tatbikata yalnızca birkaç ay kaldı. Kyiv'e desteği eşgüdümlemek için 2025'te kurulan bir koalisyon, desteği eşgüdümlemek ile savaş sonrası bir kuvvete birlik vermenin ayrı kararlar olduğunu, üstelik ayrı iç çoğunluklarca alındığını görüyor. Bunun sıralamadan ibaret olması da mümkün: çerçeve ülkeler her yerde önce planlar, davetler ise isteklilik sıralamasını değil planlama takvimini izler."}]}, {"h": {"en": "The host's second request", "tr": "Ev sahibinin ikinci talebi"}, "ps": [{"en": "Warsaw brought a second item to the same table. Its 10 billion zloty East Shield programme along roughly 800km of border with Kaliningrad and Belarus — logistics hubs, storage, fortifications, shelters, and drone detection using radar, thermal imaging and acoustic sensors — is a national budget line that Poland wants treated as a NATO priority project. The cooperation established with Germany's Bundeswehr and the talks with US, French and British forces are the same request in a quieter register: turn a Polish expenditure into an allied one. Hosting the coalition's first exercise is the strongest argument available for making that case, and it is being made in the same week.", "refs": ["poland-drills"], "tr": "Varşova aynı masaya ikinci bir başlık getirdi. Kaliningrad ve Belarus sınırı boyunca yaklaşık 800 km uzunluğundaki hatta yürütülen 10 milyar zloti tutarındaki Doğu Kalkanı programı — lojistik merkezleri, depolar, tahkimatlar, sığınaklar ve radar, termal görüntüleme ile akustik algılayıcılara dayalı insansız hava aracı tespiti — ulusal bir bütçe kalemi ve Polonya bunun NATO öncelikli projesi sayılmasını istiyor. Almanya'nın Bundeswehr'iyle kurulan iş birliği ile ABD, Fransa ve Birleşik Krallık kuvvetleriyle yürütülen görüşmeler, aynı talebin daha alçak perdeden dile getirilmiş hâli: Polonya harcamasını ittifak harcamasına dönüştürmek. Koalisyonun ilk tatbikatına ev sahipliği yapmak, bu savı desteklemek için elde bulunan en güçlü gerekçe; gerekçe de aynı hafta öne sürülüyor."}, {"en": "Whether the coalition is a force or a letterhead is therefore answerable, and fairly soon. If the exercise takes place this autumn as planned, count the member states that put units on Polish soil beyond France and the United Kingdom, rather than the total number of troops; and afterwards, watch for East Shield in an alliance planning document rather than only in Polish ones. Two states doing the work of eleven would still be a coalition. It would still fall short of a guarantee.", "refs": ["poland-drills"], "tr": "Bu koalisyonun bir kuvvet mi yoksa bir antetli kâğıt mı olduğu, dolayısıyla yanıtlanabilir bir soru ve yanıtı da uzak değil. Tatbikat planlandığı gibi bu sonbaharda yapılırsa, toplam asker mevcudu yerine Fransa ve Birleşik Krallık dışında Polonya topraklarına birlik gönderen üye devletlerin sayısını saymak gerekir; sonrasında ise Doğu Kalkanı'nın yalnızca Polonya belgelerinde mi kaldığına, yoksa bir ittifak planlama belgesinde de göründüğüne bakmak gerekir. On bir devletin işini iki devletin yapması yine bir koalisyon olur. Bir güvence olmaya ise yetmez."}]}], "sources": [{"key": "poland-drills", "kind": "news", "name": "Defense News", "url": "https://www.defensenews.com/global/europe/2026/08/03/poland-readies-ukraine-coalition-of-willing-drills-eyes-nato-support-for-border-defense", "title": {"tr": "Polonya, İstekliler Koalisyonu'nun ilk tatbikatına ev sahipliğine hazırlanıyor", "en": "Poland is preparing to host the first Coalition of the Willing exercise"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who is a framework nation, and who is still being asked?", "tr": "Kim çerçeve ülke, kim hâlâ davet ediliyor?"}, "writer": "geo-02", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Heavy artillery and drones at Shererina on the first morning, hundreds of people across the Sudanese border by Sunday, and no figure from either side that would let anyone price the exchange.", "tr": "Shererina'da daha ilk sabah ağır topçu ve insansız hava araçları, pazar günü Sudan sınırının öte yanında yüzlerce insan; iki taraftan da bu çatışmanın bedelini hesaplatacak tek bir sayı yok."}, "sections": [{"h": {"en": "What was used on the first morning", "tr": "İlk sabah ne kullanıldı"}, "ps": [{"en": "Fighting began on Saturday morning at Shererina, a locality in western Tigray close to the Sudanese border, and ran into Sunday. A member of the Tigray People's Liberation Front told the BBC that heavy artillery and drones were used. Witnesses reported explosions, heavy gunfire and aircraft throughout Saturday, and by Sunday hundreds of people had crossed into Sudan, among them wounded fighters, according to Sudanese medical and local sources speaking to AFP.", "refs": ["tigray-fighting"], "tr": "Çatışma cumartesi sabahı, Sudan sınırına yakın batı Tigray'daki Shererina yerleşiminde başladı ve pazar gününe sarktı. Tigray Halk Kurtuluş Cephesi'nden bir üye BBC'ye ağır topçu ve insansız hava aracı kullanıldığını söyledi. Görgü tanıkları cumartesi boyunca patlama, yoğun silah sesi ve uçak sesi bildirdi; pazar gününe gelindiğinde, AFP'ye konuşan Sudanlı sağlık ve yerel kaynaklara göre aralarında yaralı savaşçıların da bulunduğu yüzlerce kişi Sudan'a geçmişti."}, {"en": "Tube artillery and armed drones on day one are not what an improvised clash looks like. Guns have to be emplaced, surveyed and supplied; drone crews need launch sites, links and a maintenance chain within range. Their presence on the first morning means the distance between peacetime posture and effective fire had already been closed, and that whatever warning either capital had, it was measured in hours rather than in the months a mobilisation would take. The competing explanation deserves equal weight: units that have faced each other for a long time can also generate a two-day exchange on their own, in which case the systems were simply what was already there and no decision was taken above them.", "refs": ["tigray-fighting"], "tr": "İlk gün namlulu topçu ve silahlı insansız hava aracı, doğaçlama bir çarpışmanın görüntüsü değildir. Toplar mevzilendirilmek, ölçülendirilmek ve ikmal edilmek zorundadır; insansız hava aracı ekipleri menzil içinde kalkış sahası, bağlantı ve bakım zinciri ister. Bunların ilk sabah orada olması, barış zamanı düzeni ile etkili ateş arasındaki mesafenin çoktan kapatıldığı anlamına gelir; iki başkentin eline geçen uyarı süresi de bir seferberliğin gerektireceği aylarla değil saatlerle ölçülür. Karşı açıklama da aynı ağırlığı hak ediyor: uzun süredir karşı karşıya duran birlikler iki günlük bir çarpışmayı kendi başlarına da çıkarabilir; o hâlde kullanılan sistemler yalnızca zaten orada olanlardır ve üstlerinde bir karar alınmamıştır."}]}, {"h": {"en": "Two claims and one silence", "tr": "İki iddia, bir sessizlik"}, "ps": [{"en": "The regional administration led by the TPLF called it an \"open war\" launched by the federal government in violation of the 2022 African Union-brokered agreement. From the federal side there was no statement by the government or the army; what exists is a social-media post by minister Abraham Belay confirming that clashes occurred, blaming the \"TPLF clique\", warning of \"worse consequences\" and calling for negotiation. A minister posting is a political signal with deniability built in. An army that declares nothing has declared neither an objective nor a condition on which it stops, and an adversary reading the same silence has to plan against the widest version of both.", "refs": ["tigray-fighting"], "tr": "TPLF yönetimindeki bölge idaresi olanı, federal hükûmetin 2022'de Afrika Birliği arabuluculuğunda imzalanan anlaşmayı çiğneyerek başlattığı bir \"açık savaş\" olarak niteledi. Federal tarafta ne hükûmetten ne de ordudan açıklama geldi; ortada bakan Abraham Belay'in çatışmaların yaşandığını doğrulayan, \"TPLF kliğini\" suçlayan, \"daha ağır sonuçlar\" konusunda uyaran ve müzakere çağrısı yapan sosyal medya paylaşımı var. Bir bakanın paylaşımı, içine inkâr payı yerleştirilmiş siyasi bir işarettir. Hiçbir şey ilan etmeyen bir ordu ne bir hedef ne de durma koşulu ilan etmiş olur; aynı sessizliği okuyan karşı taraf da ikisinin en geniş sürümüne göre plan yapmak zorunda kalır."}, {"en": "Western Tigray is disputed between Tigray and Amhara, which is why Shererina is worth artillery to both sides and why the 2022 agreement left it unresolved. The measurable question over the next month is not who advanced. If fighting resumes at Shererina before the start of September, watch whether either the federal army or the regional administration publishes a casualty figure of its own, or whether the African Union monitoring mechanism issues a statement on the agreement. A party that publishes a number has accepted a cost it can be held to; four years of parties that publish nothing is how a peace deal becomes a pause.", "refs": ["tigray-fighting"], "tr": "Batı Tigray, Tigray ile Amhara arasında ihtilaflı; Shererina'nın iki taraf için de topçu harcamaya değmesinin ve 2022 anlaşmasının burayı çözümsüz bırakmasının nedeni bu. Önümüzdeki ay ölçülebilir soru, kimin ilerlediği değil. Eylül başlamadan Shererina'da çatışma yeniden başlarsa, federal ordunun ya da bölge idaresinin kendi kayıp sayısını açıklayıp açıklamadığına, ya da Afrika Birliği izleme mekanizmasının anlaşmaya ilişkin bir açıklama yapıp yapmadığına bakmak gerekir. Bir sayı açıklayan taraf, hesabı sorulabilecek bir bedeli kabul etmiş olur; dört yıl boyunca hiçbir sayı açıklamayan taraflar ise bir barış anlaşmasını yalnızca bir ara vermeye dönüştürür."}]}], "sources": [{"key": "tigray-fighting", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cdrv6r3xgyeo", "title": {"tr": "Batı Tigray'da çatışma yeniden başlayınca yüzlerce kişi Sudan'a geçti", "en": "Hundreds cross into Sudan after fighting resumes in western Tigray"}, "publishedDate": "2026-08-03"}], "title": {"en": "The artillery returned to a border the armies had never left", "tr": "Toplar, orduların hiç terk etmediği bir sınıra geri döndü"}, "writer": "geo-03", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "When a chokepoint closes, cargo takes the long way round and pays for it. The long way round in this trade was the Red Sea, and since 20 July it has had a toll of its own.", "tr": "Bir boğaz kapandığında yük uzun yoldan dolaşır ve bunun bedelini öder. Bu ticarette uzun yol Kızıldeniz'di; 20 Temmuz'dan bu yana onun da kendi bedeli var."}, "sections": [{"h": {"en": "The count", "tr": "Sayım"}, "ps": [{"en": "11 ships crossed the Strait of Hormuz on Saturday and 8 on Sunday, against more than a hundred a day before the war, according to the ship-tracking firm Kpler. About 20 percent of the world's oil and gas used to move through that water. The temporary deal with the United States in early June lifted the count again; the resumption of strikes about a month later pushed it back down. Many of the ships still sailing switch off their position transmitters while crossing.", "refs": ["hormuz-traffic"], "tr": "Gemi takip şirketi Kpler'e göre Hürmüz Boğazı'ndan cumartesi 11, pazar 8 gemi geçti; savaştan önce günlük geçiş sayısı yüzün üzerindeydi. Dünya petrol ve doğal gazının yaklaşık yüzde 20'si bu sudan geçerdi. Haziran başında ABD ile varılan geçici anlaşma sayıyı yeniden yükseltmiş, yaklaşık bir ay sonra saldırıların başlaması yine aşağı itmişti. Hâlâ sefer yapan gemilerin çoğu geçiş sırasında konum vericilerini kapatıyor."}, {"en": "Switching off the transmitter is the clearest price in the whole dataset. An invisible ship is harder to charter, harder to insure and harder to sell a cargo from, and an owner who accepts those costs has decided that the discount for invisibility is smaller than the premium for being seen. That is a market pricing military risk directly, without waiting for a freight index to catch up. The obvious caveat is that going dark is also long-standing practice in sanctioned trades, so part of what the counter registers may be a change in who is still sailing rather than a change in how dangerous the crossing is.", "refs": ["hormuz-traffic"], "tr": "Vericiyi kapatmak, bütün veri kümesindeki en açık fiyat. Görünmeyen gemiyi kiralamak, sigortalamak ve yükünü satmak zorlaşır; bu maliyetleri kabul eden bir armatör, görünmezliğin indiriminin görünürlüğün priminden küçük olduğuna karar vermiş demektir. Bu, bir navlun endeksinin yetişmesini beklemeden askerî riski doğrudan fiyatlayan bir piyasadır. Bariz çekince şu: verici kapatmak yaptırım altındaki taşımacılıkta da eskiden beri başvurulan bir yöntem; dolayısıyla sayacın kaydettiğinin bir bölümü geçişin ne kadar tehlikeli olduğundaki değil, hâlâ kimin sefer yaptığındaki değişimi yansıtıyor olabilir."}]}, {"h": {"en": "The alternative route acquires a toll", "tr": "Alternatif hat da bedelli hâle geldi"}, "ps": [{"en": "Some tankers carrying Saudi crude had moved to a Red Sea lane running between the kingdom and west Africa; that was the detour the market found when Hormuz thinned out. On 20 July the Houthi movement declared a blockade of Saudi Arabia's Red Sea ports, and the UK Maritime Trade Operations agency has logged several attacks on ships in the past week. Kpler counted 28 commodity vessels through Bab el-Mandeb on Saturday, six of them dark, with overall traffic at roughly half its pre-attack level — the half that stayed is the half the threat does not name, because the announced target is Saudi shipping specifically. A selective blockade is cheap to run and awkward to answer: no single flag state's navy is obviously the aggrieved party. Crude loadings bound for Asia are now down to about four a day, the lowest since the war began, and Tim Wilkins of Intertanko describes a \"broadening, deteriorating, and increasingly complex security situation\".", "refs": ["hormuz-traffic"], "tr": "Suudi ham petrolü taşıyan bazı tankerler, krallık ile Batı Afrika arasında uzanan Kızıldeniz hattına kaymıştı; Hürmüz seyreldiğinde piyasanın bulduğu sapak buydu. Husi hareketi 20 Temmuz'da Suudi Arabistan'ın Kızıldeniz limanlarına abluka ilan etti; Birleşik Krallık Deniz Ticaret Operasyonları birimi son bir haftada gemilere yönelik birkaç saldırı kaydetti. Kpler cumartesi Babülmendep'ten 28 yük gemisinin geçtiğini, altısının vericisini kapattığını saydı; toplam trafik saldırı öncesinin kabaca yarısı düzeyinde. Sefere devam eden yarı, tehdidin hedef almadığı yarı: ilan edilen hedef özellikle Suudi gemiciliği. Seçici bir ablukayı işletmek ucuz, ona karşılık vermek ise zordur: hiçbir bayrak devletinin donanması apaçık mağdur taraf değildir. Asya'ya gidecek ham petrol yüklemeleri savaş başladığından bu yana en düşük düzeye, günde dört dolayına indi; Intertanko'dan Tim Wilkins ise sektörün karşısındakini \"genişleyen, kötüleşen ve giderek karmaşıklaşan bir güvenlik tablosu\" diye anlatıyor."}, {"en": "This is where the route talks described on 2 August become a commercial question rather than a diplomatic one. Iran said its negotiations with Oman on a third Hormuz corridor, with separate entry and exit lanes, were in their final stages. If such an arrangement is published and takes effect, the test is whether cargo believes it rather than whether it carries a signature: a return to more than thirty Hormuz transits a day on Kpler's count, with Asia-bound loadings above ten a day within a month of publication, would mean owners and underwriters have accepted the lanes as real. Traffic that stays near single figures would mean the corridor exists on paper and the risk premium is still being set by the people with the drones.", "refs": ["hormuz-traffic", "hormuz-route"], "tr": "2 Ağustos'ta anlatılan güzergâh görüşmelerinin diplomatik olmaktan çıkıp ticari bir soruya dönüştüğü yer tam da burası. İran, Umman'la Hürmüz'de giriş ve çıkış şeritleri ayrı üçüncü bir koridor için yürüttüğü müzakerelerin son aşamada olduğunu söylemişti. Böyle bir düzenleme yayımlanır ve yürürlüğe girerse sınav, metnin imzalanması değil yükün ona inanmasıdır: yayımdan sonraki bir ay içinde Kpler'in saydığı Hürmüz geçişlerinin günde otuzun, Asya'ya yüklemelerin günde onun üzerine çıkması, armatörlerin ve sigortacıların şeritleri gerçek saydığı anlamına gelir. Trafiğin tek haneli düzeyde kalması ise koridorun kâğıt üstünde kaldığını ve risk primini hâlâ insansız hava araçlarını elinde tutanların belirlediğini gösterir."}]}], "sources": [{"key": "hormuz-traffic", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cjrv0dy2e90o", "title": {"tr": "Gemi takip verilerine göre pazar günü Hürmüz Boğazı'ndan sekiz gemi geçti", "en": "Eight ships passed through the Strait of Hormuz on Sunday, ship-tracking data show"}, "publishedDate": "2026-08-03"}, {"key": "hormuz-route", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "İran, Umman'la Hürmüz güzergâhı görüşmelerinin son aşamada olduğunu açıkladı", "en": "Iran says talks with Oman on a new Hormuz shipping route are in their final stages"}, "publishedDate": "2026-08-02"}], "title": {"en": "Eight ships on Sunday, and the detour now has a price too", "tr": "Pazar günü sekiz gemi, artık sapağın da bir fiyatı var"}, "writer": "geo-04", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "About 40,000 against more than 60,000, and 11 deaths against 72. The distance between the two sets of figures is seventy metres of water and a question about who is entitled to describe what happened on it.", "tr": "60.000'in üzerine karşılık yaklaşık 40.000, 72'ye karşılık 11 ölüm. İki sayı kümesi arasındaki mesafe, yetmiş metrelik bir su ve orada olanı anlatmaya kimin yetkili olduğuna dair bir soru."}, "sections": [{"h": {"en": "The ministry publishes its own arithmetic", "tr": "Bakanlık kendi aritmetiğini yayımlıyor"}, "ps": [{"en": "Morocco's interior ministry released figures on Sunday: about 40,000 people involved in the mass crossing into Ceuta, 1,135 stopped before they could enter Melilla, and 11 dead, mostly by drowning. It said it was fact-checking reports of deaths coming from the other side of the border. Spokesperson Rachid El Khalti, quoted in Moroccan media, attributed the surge to the shore-to-shore distance of less than seventy metres, which he said \"created a misleading perception among many participants that the crossing would be easy\", and the ministry blamed the \"malicious exploitation\" of social media and the \"spread of misleading information\".", "refs": ["ceuta-morocco"], "tr": "Fas İçişleri Bakanlığı pazar günü kendi sayılarını açıkladı: Ceuta'ya toplu geçişe yaklaşık 40.000 kişi karıştı, 1.135 kişi Melilla'ya giremeden durduruldu, çoğu boğularak 11 kişi öldü. Bakanlık, sınırın öte yakasından gelen ölüm haberleri için doğrulama çalışması yürüttüğünü belirtti. Fas basınının aktardığına göre sözcü Rachid El Khalti, hareketliliği kıyılar arasındaki yetmiş metreden kısa mesafeye bağladı ve bunun \"katılanların çoğunda geçişin kolay olacağı yönünde yanıltıcı bir algı yarattığını\" söyledi; bakanlık ayrıca sosyal medyanın \"kötü niyetle kullanılmasını\" ve \"yanıltıcı bilginin yayılmasını\" sorumlu tuttu."}, {"en": "Until Sunday, Morocco had been the subject of everybody else's account of Ceuta: the country the migrants came from, the country the Spanish government wanted them returned to, the country twenty-two European governments were writing letters about. Publishing a count changes that position. A state that gives numbers has entered the argument as an author, and the numbers it chose are legible: 1,135 stopped at Melilla is enforcement asking for credit, and 11 drownings is a death toll that its own coastguard can be held to. It is fair to read the same release as domestic reassurance — Moroccan audiences also saw the footage, and a ministry that says the surge was manufactured by misinformation is telling its own public that nothing structural has failed.", "refs": ["ceuta-morocco"], "tr": "Pazar gününe kadar Fas, Ceuta'ya ilişkin başkalarının anlatısında bir konuydu: göçmenlerin geldiği ülke, İspanya hükûmetinin geri göndermek istediği ülke, yirmi iki Avrupa hükûmetinin hakkında mektup yazdığı ülke. Sayı yayımlamak bu konumu değiştirir. Rakam veren bir devlet tartışmaya yazar sıfatıyla girmiştir ve seçtiği rakamlar okunabilir: Melilla'da durdurulan 1.135 kişi, takdir bekleyen bir kolluk başarısıdır; 11 boğulma ise kendi sahil güvenliğinin hesabını verebileceği bir ölü sayısıdır. Aynı açıklamayı iç kamuoyuna güvence olarak okumak da yerinde olur: görüntüleri Faslılar da izledi ve hareketliliğin yanlış bilgiyle üretildiğini söyleyen bir bakanlık, kendi halkına yapısal hiçbir şeyin çökmediğini söylemiş olur."}]}, {"h": {"en": "A table Morocco is not sitting at", "tr": "Fas'ın oturmadığı bir masa"}, "ps": [{"en": "The gap between the two sets of figures is not a rounding error. Spain says more than 60,000 crossed by land and sea and puts the dead at 72; Miguel Ángel Pérez, the government's representative in Ceuta, says more than a thousand people were treated by health services. Foreign Minister José Manuel Albares said on Monday that the vast majority had already returned to Morocco and that \"every last one of them will return\" — a policy whose delivery depends entirely on a state that will not be in the room on Tuesday, when the twenty-two governments that signed the joint letter meet by videoconference to discuss external borders. The people counted differently are the same people; what differs is which side of seventy metres of water does the counting, and which side has to receive them afterwards.", "refs": ["ceuta-morocco", "ceuta-eu"], "tr": "İki sayı kümesi arasındaki fark bir yuvarlama hatası değil. İspanya karadan ve denizden 60.000'den fazla kişinin geçtiğini, ölü sayısının 72 olduğunu söylüyor; hükûmetin Ceuta temsilcisi Miguel Ángel Pérez binden fazla kişinin sağlık hizmeti aldığını belirtiyor. Dışişleri Bakanı José Manuel Albares pazartesi günü büyük çoğunluğun Fas'a döndüğünü belirtip \"sonuncusuna kadar hepsi dönecek\" dedi. Bu siyasetin uygulanması tümüyle tek bir devlete bağlı; o devlet ise salı günü dış sınırları görüşmek üzere video konferansla toplanacak yirmi iki imzacı hükûmetin masasında bulunmayacak. Farklı sayılan insanlar aynı insanlar; değişen, yetmiş metrelik suyun hangi yakasının saydığı ve sonrasında hangi yakanın onları geri almak zorunda kaldığı."}, {"en": "That makes Tuesday's meeting worth reading for its arithmetic rather than its language. The signatories wrote that they cannot allow uncontrolled mass crossings, and several of them acted nationally before the meeting was even called. If the ministers produce a text, the thing to look at is whether it cites a crossing figure at all, and if so whose: a European conclusion that uses the Spanish number treats Morocco as the object of the policy, while one that acknowledges both counts has conceded that the state on the other shore is a party to it. Nobody at that videoconference has to answer for the 11 or for the 72, which is the part of the arrangement neither count captures.", "refs": ["ceuta-morocco", "ceuta-eu"], "tr": "Bu da salı günkü toplantıyı dilinden çok aritmetiği açısından okumaya değer kılıyor. İmzacılar denetimsiz toplu geçişlere izin veremeyeceklerini yazdı ve birkaçı toplantı çağrısı yapılmadan önce ulusal düzeyde adım attı. Bakanlar bir metin çıkarırsa bakılacak şey, metnin herhangi bir geçiş sayısına atıf yapıp yapmadığı, yapıyorsa kimin sayısına yaptığıdır: İspanya'nın rakamını kullanan bir Avrupa sonuç metni Fas'ı siyasetin nesnesi sayar, iki sayımı da anan bir metin ise öteki kıyıdaki devletin bu siyasetin tarafı olduğunu kabul etmiş olur. O video konferansta ne 11'in ne de 72'nin hesabını verecek kimse var; iki sayımın da yakalayamadığı bölüm bu."}]}], "sources": [{"key": "ceuta-morocco", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/news/europe/2026/08/03/morocco-blames-ceuta-migrant-rush-on-misinformation-and-human-trafficking-networks/", "title": {"tr": "Fas İçişleri Bakanlığı Ceuta için 40.000 geçiş ve 11 ölüm bildirdi", "en": "Morocco's interior ministry counts 40,000 crossings and 11 deaths at Ceuta"}, "publishedDate": "2026-08-03"}, {"key": "ceuta-eu", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "title": {"tr": "22 AB hükümeti Ceuta için olağanüstü içişleri bakanları toplantısı istedi", "en": "22 EU governments call for an emergency interior ministers' meeting over Ceuta"}, "publishedDate": "2026-08-02"}], "title": {"en": "Rabat answered Madrid's count with a lower one", "tr": "Rabat, Madrid'in sayımına daha düşük bir sayımla karşılık verdi"}, "writer": "geo-05", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "A letter written on 2 July, published in August, thanking a recognition granted in 2020 over a territory contested since 1975. The road is 1,055km long and the argument beneath it is older than the asphalt.", "tr": "2 Temmuz'da yazılmış, ağustosta yayımlanmış, 1975'ten beri ihtilaflı bir bölge üzerinde 2020'de verilmiş bir tanımaya teşekkür eden bir mektup. Yol 1.055 km; altındaki tartışma asfalttan eski."}, "sections": [{"h": {"en": "Three dates in one letter", "tr": "Tek mektupta üç tarih"}, "ps": [{"en": "Morocco's state press agency published a letter from King Mohammed VI to Donald Trump confirming that the road formerly known as the Tiznit-Dakhla highway now carries the US president's name, as \"a personal expression of my high regard\". The letter is dated 2 July and appeared over the weekend; Trump had thanked the king in a social media post the previous week, with no parallel announcement from Rabat at the time. The king cites what he calls the \"historic recognition... of Morocco's sovereignty over its Sahara\", says it will \"forever be etched in the memory of Moroccans, from generation to generation\", and describes the 1,055km road as a \"strategic axis\" linking the \"north and south of Morocco\".", "refs": ["morocco-highway"], "tr": "Fas devlet haber ajansı, Kral VI. Muhammed'in Donald Trump'a yazdığı mektubu yayımladı; mektup, eskiden Tiznit-Dahle otoyolu diye bilinen yolun artık ABD başkanının adını taşıdığını, bunun \"kişisel takdirimin bir ifadesi\" olduğunu doğruluyor. Mektup 2 Temmuz tarihli ve hafta sonu ortaya çıktı; Trump bir hafta önce sosyal medya paylaşımında krala teşekkür etmiş, o sırada Rabat'tan koşut bir duyuru gelmemişti. Kral, ABD başkanının \"Fas'ın Sahra üzerindeki egemenliğini tarihî biçimde tanımasına\" atıf yapıyor, bunun \"kuşaktan kuşağa Faslıların hafızasına kazınacağını\" söylüyor ve 1.055 km uzunluğundaki yolu Fas'ın \"kuzeyi ile güneyini\" bağlayan bir \"stratejik eksen\" diye tanımlıyor."}, {"en": "The interval between the two documents is the interesting part. Trump's post came first and Rabat's confirmation came a week later, which reverses the usual order in which a state announces its own decisions and a foreign capital responds. Read against the phrase the king chose, the sequence suggests the naming was intended to be an internal administrative fact — a road, a designation, a sign — that acquired a diplomatic audience only after the audience claimed it. That reading may be too neat. Renaming infrastructure after a friendly head of state is an ordinary courtesy in many countries, and the fact that this particular road runs through disputed ground does not prove the courtesy was designed as an instrument of sovereignty.", "refs": ["morocco-highway"], "tr": "İlgi çekici olan, iki belge arasındaki aralık. Önce Trump'ın paylaşımı geldi, Rabat'ın doğrulaması bir hafta sonra; bu, bir devletin kendi kararını duyurup yabancı bir başkentin karşılık verdiği alışılmış sıralamayı tersine çeviriyor. Kralın seçtiği ifadeyle birlikte okunduğunda sıralama, adlandırmanın iç idari bir olgu olarak — bir yol, bir tanım, bir tabela — tasarlandığını ve diplomatik izleyicisini ancak izleyici sahip çıktıktan sonra kazandığını düşündürüyor. Bu okuma fazla derli toplu olabilir. Altyapıya dost bir devlet başkanının adını vermek pek çok ülkede sıradan bir nezaket jestidir ve bu yolun ihtilaflı topraktan geçiyor olması, jestin bir egemenlik aracı olarak tasarlandığını kanıtlamaz."}]}, {"h": {"en": "What a name settles and what it leaves open", "tr": "Bir adın çözdüğü ve açık bıraktığı"}, "ps": [{"en": "The positions the road runs through have not moved. The United Nations still lists Western Sahara as a non-self-governing territory and has pushed for a solution including a referendum that has never taken place; the Polisario Front controls part of the territory and seeks independence for the Sahrawi people; the African Union recognises that independence; the United Kingdom and Spain support Morocco's autonomy plan while withholding independence; and the United States recognised Morocco's claim in 2020 as part of an arrangement under which Morocco normalised relations with Israel. A road can carry a name across all five of those positions without any of them being amended. What changes is the register in which the Moroccan claim is asserted: from a diplomatic text that must be renewed to a physical object that has to be renamed if anyone wants it undone.", "refs": ["morocco-highway"], "tr": "Yolun içinden geçtiği konumlar yerinden oynamadı. Birleşmiş Milletler Batı Sahra'yı hâlâ kendi kendini yönetmeyen bölge olarak sayıyor ve hiç yapılmamış bir referandumu da içeren bir çözüm için bastırıyor; Polisario Cephesi bölgenin bir bölümünü denetliyor ve Sahravi halkı için bağımsızlık istiyor; Afrika Birliği bu bağımsızlığı tanıyor; Birleşik Krallık ile İspanya bağımsızlığı vermeksizin Fas'ın özerklik planını destekliyor; ABD ise Fas'ın iddiasını 2020'de, Fas'ın İsrail'le ilişkilerini normalleştirmesini içeren bir düzenlemenin parçası olarak tanıdı. Bir yol, bu beş konumun hiçbiri değiştirilmeden hepsinin içinden bir adı taşıyabilir. Değişen şey, Fas iddiasının hangi kayıtta öne sürüldüğüdür: yenilenmesi gereken bir diplomatik metinden, geri alınması için yeniden adlandırılması gereken fiziksel bir nesneye."}, {"en": "The disanalogy with 2020 is what makes this worth watching rather than filing. That recognition was an exchange, and its price — normalisation with Israel — was visible to everyone, including the states that declined to follow. This time nothing is asked in return, which removes the transaction that made the earlier step legible to third parties and leaves only a proper noun on a map. So the test is whether the name travels. If a European government that backs the autonomy plan uses the new designation in its own official correspondence within a year, rather than only quoting Moroccan usage, the naming will have done what the 2020 text could not: made a contested claim ordinary. If it never appears outside Moroccan and US documents, it will remain what it looks like today — a bilateral courtesy pointed at a fifty-year-old question.", "refs": ["morocco-highway"], "tr": "Bunu dosyalamak yerine izlemeye değer kılan şey, 2020 ile arasındaki farktır. O tanıma bir mübadeleydi ve bedeli — İsrail'le normalleşme — aynı adımı atmaktan kaçınan devletler de dâhil herkesin gözü önündeydi. Bu kez karşılığında bir şey istenmiyor; bu da önceki adımı üçüncü taraflar için okunabilir kılan alışverişi ortadan kaldırıyor ve geriye haritada bir özel ad bırakıyor. Dolayısıyla sınav, adın yol alıp almadığıdır. Özerklik planını destekleyen bir Avrupa hükûmeti yeni adı bir yıl içinde yalnızca Fas kullanımını aktararak değil kendi resmî yazışmasında kullanırsa, adlandırma 2020 metninin yapamadığını yapmış, ihtilaflı bir iddiayı sıradanlaştırmış olur. Fas ve ABD belgelerinin dışına hiç çıkmazsa, bugün göründüğü şey olarak kalır: elli yıllık bir soruya çevrilmiş ikili bir nezaket."}]}], "sources": [{"key": "morocco-highway", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c3r0vg88zr2o", "title": {"tr": "Kraliyet mektubu, Fas'ın bir otoyola Trump'ın adını verdiğini doğruladı", "en": "A royal letter confirms Morocco has renamed a highway after Trump"}, "publishedDate": "2026-08-03"}], "title": {"en": "Fifty years of dispute, and now a road sign", "tr": "Elli yıllık ihtilaf, şimdi bir yol tabelası"}, "writer": "geo-06", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"writer": "geo-01", "title": {"tr": "Salı günkü toplantının elindeki tek araç kendi iç sınırları", "en": "The only instrument Tuesday's meeting holds is its own internal borders"}, "excerpt": {"tr": "22 üye devletin imzaladığı mektup olağanüstü bir konsey topluyor. Ancak metnin adını andığı tek somut önlem, Ceuta'da değil, imzacıların kendi sınırlarında uygulanıyor.", "en": "A letter signed by 22 member states convenes an extraordinary council. Yet the one concrete measure the text names is applied not at Ceuta but at the signatories' own frontiers."}, "sections": [{"h": {"tr": "Mektubun çağırdığı organ", "en": "The body the letter convenes"}, "ps": [{"tr": "Yirmi iki üye devlet, İtalya ile Danimarka'nın başlattığı bir mektuba imza attı; Fransa, Portekiz ve Lüksemburg atmadı. Dönem başkanlığını temmuzda devralan İrlanda, Adalet ve İçişleri Konseyi'ni salı günü olağanüstü bir video konferansla topluyor. Metnin gerekçesi, denetimsiz kitlesel geçişlerin ve göçün araçsallaştırılmasının Avrupa Birliği'ne yasa dışı girişin mümkün olduğu algısını yaratması tehlikesi.", "en": "Twenty-two member states signed a letter initiated by Italy and Denmark; France, Portugal and Luxembourg did not. Ireland, which took over the rotating presidency in July, is convening the Justice and Home Affairs Council on Tuesday in an extraordinary videoconference. The stated reason is the danger that uncontrolled mass crossings and the instrumentalisation of migration create the perception that illegal entry into the European Union is possible.", "refs": ["ceuta-council"]}, {"tr": "Mektubun bağlayıcı bir yaptırımı yok; hukuken bağlayıcı olan, imzacıların saklı tuttuğu seçenek. O seçenek geçici iç sınır denetimlerini güçlendirmek ya da yeniden uygulamaya koymak. Bu yetki, her üye devletin kendi sınırında kullandığı bir yetki; Ceuta'daki dış sınırda kullanılan bir yetki değil. Alternatif okuma da mümkün: metin bir operasyon planından çok, iç kamuoyuna dönük bir konum bildirimi olabilir. İki okumayı ayıracak olan, salı günü hangi aracın ve hangi takvimin adının konacağı.", "en": "The letter carries no enforcement of its own; what is legally operative is the option the signatories reserve. That option is to reinforce or reintroduce temporary internal border controls. It is a power each member state exercises at its own frontier, not at the external border in Ceuta. A second reading is available: the text may be a position taken for domestic audiences rather than an operational plan. What separates the two readings is whether Tuesday names an instrument and a date.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "İki sınırda iki ayrı yetki", "en": "Two borders, two authorities"}, "ps": [{"tr": "Madrid'in verdiği rakamlara göre perşembe günü yaklaşık 50.000 kişi Ceuta'ya geçti, neredeyse tamamı geri gönderildi ve 67 kişi hayatını kaybetti. Komisyon Başkanı Ursula von der Leyen tek bir kişinin bile İspanya anakarasına ya da Birliğin geri kalanına ulaşmadığını söyledi. İç sınır denetimi, tam da bu ulaşmanın önlenmesi için düşünülmüş bir araç.", "en": "On Madrid's figures about 50,000 people crossed into Ceuta on Thursday, almost all were returned and 67 died. Commission President Ursula von der Leyen said not a single person reached mainland Spain or the rest of the Union. Internal border control is an instrument designed to prevent exactly that onward movement.", "refs": ["ceuta-council"]}, {"tr": "Uygulama maliyetini kimin taşıdığı da buradan çıkıyor. Başbakan Pedro Sánchez, üye devletlerin bir bölümünün dayanışma gösterdiğini, bir bölümününse İspanya'yı hedef alıp ülkenin Schengen alanından geçici olarak çıkarılmasını istediğini söyledi. Gündemi kuran taraf ise mektubu kaleme alan Roma ile Kopenhag; Paris, Lizbon ve Lüksemburg imzadan uzak durarak aynı gündemin dışında kaldı.", "en": "That is also where the compliance cost lands. Prime Minister Pedro Sánchez said some member states had shown solidarity while others had chosen to attack Spain and to call for its temporary exclusion from the Schengen area. The agenda-setters are Rome and Copenhagen, who drafted the letter; Paris, Lisbon and Luxembourg stayed outside it by withholding their signatures.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "Salı günü ölçülebilecek şey", "en": "What Tuesday will make measurable"}, "ps": [{"tr": "Bir konsey toplantısının çıktısı sonuç bildirgesi olabilir, tarifeli bir yükümlülük de olabilir. Eylül sonuna kadar herhangi bir imzacı, Ceuta'yı gerekçe göstererek geçici iç sınır denetimi bildiriminde bulunmazsa, salı günkü metnin bağladığı şey davranış değil, gündem olacak. Bildirim gelirse, mektubun saklı tuttuğu araç kullanılmış olur ve maliyeti ilk elde sınırdan geçen kişiler ve taşımacılar taşır.", "en": "A council meeting can produce conclusions, or it can produce a dated obligation. If no signatory notifies temporary internal border controls citing Ceuta before the end of September, what Tuesday's text binds is the agenda rather than behaviour. If a notification does come, the reserved instrument has been used, and the first cost falls on the people and hauliers who cross those frontiers.", "refs": ["ceuta-council"]}]}], "sources": [{"key": "ceuta-council", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/22-eu-leaders-call-for-emergency-talks-over-ceuta-migrant-crisis", "title": {"tr": "Yirmi iki AB üyesi Ceuta için olağanüstü bakanlar toplantısı istedi", "en": "Twenty-two EU members call for emergency ministerial talks on Ceuta"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Bir komutanlığın devri neyi devrediyor?", "en": "What does handing over a command actually transfer?"}, "excerpt": {"tr": "Wiesbaden'daki komutanlığın başına Avrupalı ya da Kanadalı bir general geçecek, Amerika Birleşik Devletleri yardımcı komutanlıkta kalacak. Yer değiştiren şey koordinasyon; koordine edilen kabiliyetlerin kaynağı olduğu yerde duruyor.", "en": "A European or Canadian general is to take the Wiesbaden command while the United States keeps the deputy's chair. What changes hands is the coordination; the source of the capabilities being coordinated stays where it is."}, "sections": [{"h": {"tr": "Devrin şekli", "en": "The shape of the handover"}, "ps": [{"tr": "Politico'ya dayandırılan habere göre Pentagon, Almanya'nın Wiesbaden kentindeki Ukrayna Güvenlik Yardım Grubu'nun komutasını başka bir NATO üyesine bırakıyor. Komutanlık teçhizat sevkiyatını koordine ediyor, eğitimi ve lojistik desteği yürütüyor. Geçiş bir yıla kadar sürebilecek; komutayı Avrupalı ya da Kanadalı bir general üstlenecek, ABD Avrupa Komutanlığı yardımcı komutan düzeyinde kalacak. Bir NATO yetkilisi bunu müttefiklerin daha fazla sorumluluk üstlenmesinin bir örneği daha olarak tanımladı.", "en": "According to a report sourced to Politico, the Pentagon is relinquishing command of the Security Assistance Group-Ukraine in Wiesbaden, Germany, to another NATO member. The command coordinates equipment deliveries and runs training and logistical support. The transition may take up to a year; a European or Canadian general takes command while US European Command remains at deputy level. A NATO official described this as another example of allies taking on greater responsibility.", "refs": ["sagu-handover"]}, {"tr": "Bir kefede bir koltuk değişiyor: personel, karargâh düzeni ve gündem sırası artık başka bir başkentin sorumluluğunda. Öbür kefede taahhüt değişmiyor. Yetkililerin verdiği bilgi, çalışmanın kesintiye uğramayacağı yönünde; yani devredilen şey yürütmenin sorumluluğu, kaynağın kendisi değil. Bir masanın başına kimin oturduğu ile masaya neyin konduğu ayrı sorular.", "en": "In one pan a chair changes hands: staffing, headquarters routine and the order of business now belong to another capital. In the other pan the commitment does not change. Officials describe the work as continuing uninterrupted, which means what moves is responsibility for execution rather than the resource itself. Who sits at the head of a table and what is placed on it are separate questions.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Aynı hattın öbür ucu", "en": "The other end of the same line"}, "ps": [{"tr": "Devrin karşılaştığı kısıt, aynı hafta Kiev'de görünür oldu. Cumhurbaşkanı Volodimir Zelenskiy 27 balistik füzenin atıldığını, bunlardan yalnızca birinin bir Patriot sistemiyle düşürüldüğünü açıkladı; acil servisler en az dokuz ölü ve 33 yaralı bildirdi. Koordinasyonun konusu olan tedarik akışının darboğazı, komutanlığın kimde olduğuyla değil, akıtılacak stokla ilgili.", "en": "The constraint the handover meets became visible in Kyiv the same week. President Volodymyr Zelenskyy said 27 ballistic missiles were launched and only one was brought down by a Patriot system; emergency services reported at least nine dead and 33 wounded. The bottleneck in the supply flow that coordination exists to manage is a question of stock, not of who holds the command.", "refs": ["sagu-handover", "kyiv-salvo"]}, {"tr": "Karşı sav güçlü: bir yıla yayılan ve ABD Avrupa Komutanlığı'nı yardımcı komutan düzeyinde tutan devir, tam da akışın değişken hâline gelmemesi için tasarlanmış olabilir. İttifak içi yük paylaşımı, öncelikleri kayan bir lider devletin görevi tümüyle bırakmasındansa görevin sürmesini sağlayan en az sarsıcı yol da olabilir. Bu okumada devir bir geri çekilme değil, bir sigorta.", "en": "The countercase is strong: a transfer spread over a year that keeps US European Command at deputy level may be designed precisely so that the flow does not become the variable. Burden-sharing inside an alliance can also be the least disruptive way of keeping a mission alive when the lead nation's priorities move, rather than of ending it. On that reading the handover is an insurance policy, not a withdrawal.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Devir tamamlandığında sorulacak soru", "en": "The question when the transfer completes"}, "ps": [{"tr": "Geriye tek bir açık soru kalıyor: komutayı devralan devlet, kendi bütçesiyle ve kendi personeliyle aynı akışı sürdürebilir mi, yoksa koltuğun yeni sahibi karar yetkisi olmadan sorumluluk mu üstlenir? Bu sorunun cevabı duyuruyla birlikte gelmiyor; devir takviminin sonunda, sevkiyatın sürekliliğine bakılarak veriliyor.", "en": "One open question remains: can the state that takes command sustain the same flow with its own budget and its own staff, or does the new occupant of the chair assume responsibility without the power of decision? The answer does not arrive with the announcement; it arrives at the end of the transition timetable, and the measure is the continuity of deliveries.", "refs": ["sagu-handover"]}]}], "sources": [{"key": "sagu-handover", "kind": "news", "name": "Interfax-Ukraine", "url": "https://en.interfax.com.ua/news/general/1189917.html", "title": {"tr": "Pentagon, Ukrayna'ya yardımı koordine eden komutanlığın başını bir NATO müttefikine bırakıyor", "en": "The Pentagon is handing leadership of the Ukraine aid command to a NATO ally"}, "publishedDate": "2026-08-01"}, {"key": "kyiv-salvo", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "Bir konteyner gemisi savaşı sürdüren tesis sayıldı", "en": "A container ship was counted as a facility that sustains the war"}, "excerpt": {"tr": "Yanina, Novorossiysk'in 130 deniz mili açığında iki insansız deniz aracıyla vuruldu. Hedef seçimini belirleyen ölçü mesafe değil, geminin hangi zincirin parçası sayıldığı.", "en": "The Yanina was struck by two naval drones 130 nautical miles off Novorossiysk. What sets the target is the chain the ship is counted as part of, rather than the distance to it."}, "sections": [{"h": {"tr": "Menzil ve hedef", "en": "Range and target"}, "ps": [{"tr": "Volodimir Zelenskiy, yaptırım listesindeki Rus bayraklı Yanina'nın iki insansız deniz aracıyla batırıldığını açıkladı. Gemi 100.000 tonun üzerinde kapasiteli; saldırı Novorossiysk limanının yaklaşık 130 deniz mili açığında, uluslararası sularda gerçekleşti. Zelenskiy hedeflerin savaş çabasını ayakta tutan tesisler arasından seçildiğini söyledi. Rosatom Genel Müdürü Aleksey Lihaçev geminin dondurulmuş gıda ve inşaat malzemesi taşıdığını öne sürdü, saldırıyı korsanlık olarak niteledi ve 17 mürettebatın kurtarıldığını bildirdi.", "en": "Volodymyr Zelensky said the sanctioned Russian-flagged Yanina had been sunk by two naval drones. The vessel has a capacity of more than 100,000 tonnes; the strike took place in international waters about 130 nautical miles off the port of Novorossiysk. Zelensky said targets were chosen from among facilities that sustain the war effort. Rosatom's chief executive Alexey Likhachev said the ship was carrying frozen food and construction materials, called the attack piracy and said all 17 crew had been rescued.", "refs": ["yanina-strike"]}, {"tr": "130 deniz mili bir niyet beyanı değil, bir dayanıklılık ve hedefleme ölçüsüdür. Kıyıdan çıkan insansız yüzey araçları, bu mesafede bir ticari tekneyi tehdit altında tutabiliyorsa, kıyı savunmasına bağlı bir kuvvet açık denizde risk üretebilen bir kuvvete dönüşmüş demektir. Karşı sav da geçerli: tek bir başarılı vuruş, sürdürülebilir bir tempo kanıtlamaz. Hava, seyir koşulları ve hedefin manevra yapmaması da sonucu açıklayabilir.", "en": "130 nautical miles measures endurance and targeting rather than intent. If uncrewed surface vessels launched from shore can hold a commercial hull at risk at that distance, a force tied to coastal defence has become one that can generate risk in open water. The countercase holds too: a single successful strike does not establish a sustainable rate. Weather, sea state and a target that did not manoeuvre could equally explain the outcome.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Sınıflandırma sorunu", "en": "The classification problem"}, "ps": [{"tr": "Aynı gövde için iki bağdaşmaz tanım ortaya kondu: savaş çabasını ayakta tutan bir tesis ve sivil yük taşıyan bir ticaret gemisi. Kyiv Independent, Rus tarafının iddialarını bağımsız olarak doğrulayamadığını yazdı. Doğrulanabilir olan yalnızca üç şey: geminin yaptırım listesinde bulunması, Rosatom'un olayı sahiplenerek açıklama yapması ve saldırının gerçekleşmiş olması. Kimin ne taşıdığı bu bilgiyle henüz kapanmıyor.", "en": "Two incompatible descriptions were offered for one hull: a facility sustaining the war effort, and a merchant ship carrying civilian cargo. The Kyiv Independent said it could not independently verify the Russian claims. Only three things are verifiable: that the ship was under sanctions, that Rosatom spoke for it, and that the strike happened. What was on board is not settled by this evidence.", "refs": ["yanina-strike"]}, {"tr": "Askerî olarak önemli olan, sınıflandırmanın sonucu değil, sınıflandırmanın kendisinin bir kabiliyet gerektirmesi. Bir gemiyi yaptırım listesiyle, sahiplik zinciriyle ve rotasıyla eşleştirip vurulabilir hâle getirmek, füzeden çok istihbarat ve hedefleme işidir. Ukrayna aynı gün Rusya'nın derinliklerindeki üç rafineriyi ve dört radar sistemini de vurduğunu açıkladı; bu, hedef üretiminin tek bir alana bağlı olmadığını gösteriyor.", "en": "What matters militarily is that classifying at all requires a capability, whatever the classification concludes. Matching a hull to a sanctions listing, an ownership chain and a sailing route until it becomes strikeable is a task of intelligence and targeting more than of munitions. Ukraine said it had also struck three refineries and four radar systems deep inside Russia the same day, which suggests target generation is not confined to one domain.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Tekrar olursa ne görünür", "en": "What becomes visible if it repeats"}, "ps": [{"tr": "Bu vuruş bir kereye mahsus mu, yoksa bir tempo mu, ekim sonuna kadar anlaşılır. Benzer mesafelerde ticari gövdelere yönelik ikinci ve üçüncü bir vuruş gelirse, gözlenecek karşılık refakat ve konvoy düzeni ya da Novorossiysk trafiğinin başka limanlara kayması olacaktır. Bu tedbirlerden hiçbiri görülmezse, olay bir kabiliyet gösterisi olarak kalır ve tempo iddiası düşer.", "en": "Whether this was a one-off or a tempo will be clear by the end of October. If a second and third strike on commercial hulls follow at comparable distances, the response to watch is escort and convoy practice, or a shift of Novorossiysk traffic to other ports. If none of those measures appears, the event stands as a demonstration of capability and the claim of tempo falls.", "refs": ["yanina-strike"]}]}], "sources": [{"key": "yanina-strike", "kind": "news", "name": "The Kyiv Independent", "url": "https://kyivindependent.com/ukraine-strikes-3-russian-oil-refineries-sinks-sanctioned-ship-zelensky-says/", "title": {"tr": "Ukrayna, yaptırım listesindeki Rus konteyner gemisi Yanina'yı batırdığını açıkladı", "en": "Ukraine says it sank the sanctioned Russian container ship Yanina"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Günlük 170.000 varil akan hatta 750.000 varil taahhüdü", "en": "A 750,000-barrel commitment on a line carrying 170,000"}, "excerpt": {"tr": "BOTAŞ ile SOMO ve NOC'un imzaladığı bir yıllık transit düzenlemesi günlük en az 750.000 varil öngörüyor. Hattın bugünkü akışı yaklaşık 170.000 varil; aradaki fark bir söz meselesi değil, bir yükleme meselesi.", "en": "The one-year transit arrangement BOTAŞ signed with SOMO and NOC sets a floor of 750,000 barrels a day. The line currently moves about 170,000; the gap is a loading problem rather than a promise."}, "sections": [{"h": {"tr": "Üç sayı ve bir süre", "en": "Three numbers and a term"}, "ps": [{"tr": "Cumartesi imzalanan düzenleme günlük en az 750.000 varil öngörüyor. Hattın tasarım kapasitesi 1,5 milyon varil, bugünkü akışı ise yaklaşık 170.000 varil ve bunun büyük bölümü Irak'ın Kürdistan bölgesindeki sahalardan geliyor. Anlaşma bir yıl yürürlükte kalacak; petrol, elektrik ve su kaynaklarını kapsayan geniş çerçeve ise hâlâ görüşülüyor.", "en": "The arrangement signed on Saturday sets a floor of 750,000 barrels a day. The line's design capacity is 1.5 million barrels and its current flow is about 170,000, most of it from fields in Iraq's Kurdistan region. The agreement runs for a year; the broader framework covering oil, electricity and water resources is still under negotiation.", "refs": ["ceyhan-transit"]}, {"tr": "Taban rakamı bir taahhüt, bir akış değil. Bugünkü hacmin ağırlığı kuzeydeki bir kaynak grubundan geliyorsa, 170.000'den 750.000'e çıkmak aynı sahaların daha çok üretmesiyle değil, federal denetimdeki üretimin bu hatta yönlendirilmesiyle olur. Bu bir tahsis kararı, bir boru kararı değil. Alternatif de var: taban rakamı çerçeve müzakeresinde tarafların birbirine gösterdiği bir referans olabilir ve fiilî akışın hiç değişmemesi de anlaşmanın ihlali sayılmayabilir.", "en": "A floor is a commitment, not a flow. If the bulk of today's volume comes from one group of northern fields, moving from 170,000 to 750,000 happens not by those fields producing more but by output under federal control being routed onto this line. That is an allocation decision, not a pipeline decision. There is an alternative: the floor may be a reference point the two sides hold up during the framework talks, and actual flow never changing may not amount to a breach.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Sayılar Hürmüz'de başlıyor. Irak'ın petrol ihracatı, şubat sonunda Amerika Birleşik Devletleri ile İsrail'in İran'a düzenlediği saldırıların ardından yüzde 80'in üzerinde geriledi; aylık gelirler yaklaşık 6 milyar dolar düzeyinden 2 milyar dolar altına indi. Boğaz kapalıyken Ceyhan, Irak ham petrolü için boğazdan geçmeyen tek yüksek kapasiteli çıkış.", "en": "The numbers begin at Hormuz. Iraq's oil exports fell by more than 80 percent after the United States and Israel struck Iran in late February, and monthly revenues dropped from about $6bn to under $2bn. For Iraqi crude, Ceyhan is the only high-capacity outlet that avoids the Strait of Hormuz while it stays closed.", "refs": ["ceyhan-transit"]}, {"tr": "Yükü kimin taşıdığı da buradan okunuyor. Bekleyebilecek durumda olmayan taraf Bağdat: gelir açığı aylık ve bütçesel. Türkiye tarafında kazanç transit ücreti ve boş kapasitenin doldurulması. Alıcılar içinse Ceyhan, Basra'ya göre farklı bir sigorta ve navlun profiline sahip bir yükleme noktası. Enerji ve Tabii Kaynaklar Bakanı Alparslan Bayraktar düzenlemenin uzun vadeli anlaşma çabaları sürerken uygulamaya konduğunu söyledi; Irak Başbakanı Ali el-Zeydi ise anlaşmayı önemli bir stratejik dönüm noktası olarak nitelendirdi.", "en": "Incidence can be read from the same place. The party that cannot wait is Baghdad: the revenue gap is monthly and budgetary. On the Turkish side the gain is transit revenue and the filling of idle capacity. For buyers, Ceyhan is a loading point with a different insurance and freight profile from Basra. Energy Minister Alparslan Bayraktar said the arrangement had been put in place while work continued towards a long-term agreement; Iraq's Prime Minister Ali al-Zaidi called it an important strategic milestone.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Bir yılın fiyatladığı şey", "en": "What a one-year term prices"}, "ps": [{"tr": "Sürenin kendisi bir bilgi taşıyor. Onlarca yıllık eski düzenlemenin yerine kalıcı bir metin değil, on iki aylık bir köprü konmuş. Bir köprünün fiyatlanması, iki tarafın da uzun vadeli çerçeveyi bu süre içinde bağlamayı taahhüt etmemesi anlamına gelir; aynı zamanda boğaz sorununun bir yıl içinde çözüleceğine dair bir varsayımın da satın alınmadığını gösterir. Taban rakamının anlamı, Ceyhan'daki aylık yükleme verilerinde görünecek.", "en": "The term itself carries information. What replaced a decades-old arrangement is a twelve-month bridge rather than a permanent text. Pricing a bridge means neither side has undertaken to bind the long-term framework within that period; it also shows that no assumption about the strait being resolved inside a year has been bought. The meaning of the floor shows up in monthly loading data at Ceyhan.", "refs": ["ceyhan-transit"]}]}], "sources": [{"key": "ceyhan-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/turkiye-and-iraq-sign-one-year-oil-pipeline-deal-amid-global-shift", "title": {"tr": "Türkiye ile Irak, Kerkük-Ceyhan hattı için bir yıllık transit anlaşması imzaladı", "en": "Türkiye and Iraq sign a one-year transit deal for the Kirkuk-Ceyhan pipeline"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Arakçi'nin arama listesinde bir genelkurmay başkanı da var", "en": "An army chief is on Araghchi's call list"}, "excerpt": {"tr": "İran cumartesi günü Pakistan, Türkiye ve Suudi Arabistan'a ayrı ayrı telefon açtı. Pakistan'daki muhatap dışişleri bakanı değil, Genelkurmay Başkanı Asım Münir'di ve üç görüşmenin metni aynı değil.", "en": "Iran placed separate calls to Pakistan, Türkiye and Saudi Arabia on Saturday. In Pakistan the counterpart was the army chief, Asim Munir, not the foreign minister, and the three readouts are not identical."}, "sections": [{"h": {"tr": "Kime ne söylendi", "en": "Who was told what"}, "ps": [{"tr": "İran'ın yarı resmî Mehr ajansına dayandırılan aktarıma göre Dışişleri Bakanı Seyyid Abbas Arakçi cumartesi günü üç ayrı telefon görüşmesi yaptı: Pakistan Genelkurmay Başkanı Asım Münir, Türkiye Dışişleri Bakanı Hakan Fidan ve Suudi Arabistan Dışişleri Bakanı Prens Faysal bin Ferhan. Münir ve Fidan'a söylenen, İran'ın egemenliğini, toprak bütünlüğünü ve ulusal güvenliğini korumaya hazır olduğu ve her saldırıya kararlılıkla karşılık vereceğiydi.", "en": "According to an account sourced to Iran's semi-official Mehr news agency, Foreign Minister Seyed Abbas Araghchi made three separate calls on Saturday: to Pakistan's Chief of Army Staff Asim Munir, Turkish Foreign Minister Hakan Fidan and Saudi Foreign Minister Prince Faisal bin Farhan. What Munir and Fidan were told was that Iran is prepared to safeguard its sovereignty, territorial integrity and national security and would respond decisively to any aggression.", "refs": ["araghchi-calls"]}, {"tr": "Riyad'a söylenen bir cümle uzun. Suudi mevkidaşına yapılan uyarıda yalnızca Amerika Birleşik Devletleri ya da İsrail kaynaklı düşmanca bir eylem değil, bu eyleme verilecek bölgesel destek de kararlı ve orantılı bir yanıtın gerekçesi olarak sayıldı. Farkın kaynağı iki türlü açıklanabilir: ya üç muhatap gerçekten farklı bir eşikle muhatap edildi, ya da fark görüşmelerde değil, bakanlığın kamuoyuna yazdığı metinde oluştu. Elimizdeki kanıt ikisini ayırmaya yetmiyor.", "en": "What Riyadh was told runs one clause longer. In the warning to the Saudi counterpart it was not only hostile action by the United States or Israel that was named as grounds for a firm and proportionate response, but regional support for such action as well. The difference admits two explanations: either the three counterparts really were addressed with different thresholds, or the difference arose in the ministry's public text rather than in the conversations. The available evidence does not separate them.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Üç muhatap, üç ayrı kısıt", "en": "Three counterparts, three constraints"}, "ps": [{"tr": "Belgelenmiş olan yalnızca kiminle konuşulduğu ve o kişinin makamı. Pakistan'da kanal askerî; muhatap ordunun başındaki isim. Türkiye'de kanal diplomatik; muhatap NATO üyesi bir devletin dışişleri bakanı. Suudi Arabistan'da da kanal diplomatik, ama metnin en açık uyarısı oraya yöneltilmiş. Muhatap seçimi, İran'ın her başkentte hangi kurumun karar verdiğine dair kendi değerlendirmesini gösteriyor; bu değerlendirmenin doğru olup olmadığı ayrı bir soru.", "en": "What is d
