ial security apparatus for protection, while that apparatus was struck as it searched a man at its own gate. Another explanation of the overlap is possible: the demonstrators' proximity may not have been the attacker's reason for choosing the spot, and the station itself may have been the whole aim.", "refs": ["swat"]}]}, {"h": {"tr": "Kime seslenildiği", "en": "Whom the demand is addressed to"}, "ps": [{"tr": "Kınamalar Cumhurbaşkanı Asıf Ali Zerdari, Başbakan Şahbaz Şerif ve İçişleri Bakanı Muhsin Nakvi'den geldi; üçü de federal kademeden. Kavşakta dile getirilen talep ise eyalet kademesine yönelikti. Pakistan, güvenlik siyasetinin başkentte olduğu kadar eyaletlerinde de belirlendiği yükselen güçlerden biri; Güney Asya'da bu iki kademe arasındaki mesafe çoğu zaman haberin kendisidir.", "en": "The condemnations came from President Asif Ali Zardari, Prime Minister Shehbaz Sharif and Interior Minister Mohsin Naqvi, all three from the federal tier. The demand voiced at the intersection was addressed to the provincial one. Pakistan is one of the emerging powers whose security politics is settled in its provinces as much as in its capital, and in South Asia the distance between those two tiers is often the story itself.", "refs": ["swat"]}, {"tr": "Talebin karşılanıp karşılanmadığı bir açıklamayla değil, bir sayıyla anlaşılacak. İzlenecek gösterge, eyaletin aylık ölü sayısının haziran seviyesinin altına inip inmediğidir; temmuzda o sayı 154'tü.", "en": "Whether the demand is met will be settled by a number rather than a statement. The indicator to watch is whether the province's monthly death toll falls back below the June level; in July that figure was 154.", "refs": ["swat"]}]}], "sources": [{"key": "swat", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/suicide-bomber-kills-14-outside-police-station-in-pakistans-swat", "title": {"tr": "Pakistan'ın Swat vadisinde bir karakolun önünde en az 14 kişi öldürüldü", "en": "At least 14 killed by a suicide bomber at a police station in Pakistan's Swat valley"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "Neden ellinci yıl, kırkıncı değil?", "en": "Why the fiftieth anniversary, and not the fortieth?"}, "excerpt": {"tr": "Entebbe'de açılan heykel 1976'yı değiştirmiyor. Değişen şey, Uganda devletinin o günün ölülerinden hangisini sahiplendiğini söyleyen bir cümle.", "en": "The statue unveiled at Entebbe does not change 1976. What has changed is one sentence about which of that day's dead the Ugandan state claims."}, "sections": [{"h": {"tr": "Elli yıl önceki bölüm", "en": "The chapter fifty years back"}, "ps": [{"tr": "Olayın kendisi iyi bilinir. Tel Aviv'den kalkan bir Air France uçağı iki Filistinli ve iki Alman tarafından kaçırıldı, Libya üzerinden Uganda'ya yöneltildi ve Idi Amin uçağı karşıladı. 3 Temmuz 1976'daki baskında 100'den fazla rehine kurtarıldı.", "en": "The event itself is well known. An Air France flight out of Tel Aviv was hijacked by two Palestinians and two Germans, diverted via Libya to Uganda, and Idi Amin welcomed the plane. The raid of 3 July 1976 rescued more than 100 hostages.", "refs": ["entebbe"]}, {"tr": "Ölülerin listesi ise iki devlete birden ait. Yonatan Netanyahu ölen tek İsrail askeriydi. Operasyon sırasında üç rehine öldü ve Dora Bloch sonradan Kampala'da bir hastanede öldürüldü. İsrail birliğiyle çarpışırken ölen Ugandalı askerlerin sayısı en az 45'ti.", "en": "The list of the dead, though, belongs to two states at once. Yonatan Netanyahu was the only Israeli soldier killed. Three hostages died during the operation and Dora Bloch was later killed in a hospital in Kampala. The number of Ugandan soldiers killed fighting the Israeli force was at least 45.", "refs": ["entebbe"]}, {"tr": "Heykel şimdi olayın geçtiği eski havaalanı terminalinin önünde duruyor. Uganda Genelkurmay Başkanı Orgeneral Muhoozi Kainerugaba, anıtın Netanyahu'nun cesaretini onurlandırdığını söyledi ve dönemi \"tarihimizde acı bir bölüm\" diye andı.", "en": "The statue now stands outside the old airport terminal where it happened. Uganda's army chief, Gen Muhoozi Kainerugaba, said the monument honoured Netanyahu's courage, and called the period \"a painful chapter in our history\".", "refs": ["entebbe"]}]}, {"h": {"tr": "Değişen cümle", "en": "The sentence that moved"}, "ps": [{"tr": "Anıtın asıl işini bronz değil, Ugandalı ölülere ayrılan cümle görüyor. Kainerugaba onların \"haklı olduğuna inandıkları bir dava uğruna yiğitçe savaştığını\" söyledi, ardından \"bugün biliyoruz ki hizmet ettikleri Idi Amin hükûmeti, Uganda halkını temsil etmeyen acımasız bir diktatörlüktü\" diye ekledi. Askerleri rejimden ayırmak, ardıl devletlerin bir savaşı davasını devralmadan miras almasını sağlayan bilinen bir işlemdir.", "en": "The real work of the monument is done not by the bronze but by the sentence set aside for the Ugandan dead. Kainerugaba said they \"fought valiantly... in what they believed was a justified cause\", then added that \"today, we know that the government of Idi Amin, which they served, was a brutal dictatorship which did not represent the Ugandan people\". Separating the soldiers from the regime is the familiar operation by which successor states inherit a war without inheriting its cause.", "refs": ["entebbe"]}, {"tr": "Kainerugaba'nın bu cümleyi şimdi söyleyebilmesini iki koşulun aynı anda bulunması açıklıyor: ellinci yıl fırsatı verir, genelkurmay başkanlığı ise cümleyi söyleyecek yetkiyi. Bu iki koşul daha önce bir arada değildi. Buna karşı en güçlü güncel açıklama da not edilmeli: anıt, İsrail'le hâlihazırda yürüyen güvenlik iş birliğinin tören yüzü olabilir ve o hâlde tarihe dair ifadeler bir revizyon değil süsleme olur.", "en": "That Kainerugaba can say the sentence now is explained by two conditions being present at the same time: the fiftieth anniversary supplies the occasion, and the post of army chief supplies the authority to say it. Those two conditions were not together before. The strongest present-day explanation should be noted against it: the monument may be the ceremonial face of security cooperation with Israel that is already running, in which case the wording about history is decoration rather than revision.", "refs": ["entebbe"]}, {"tr": "Bir ayrım noktası da eklemek gerekiyor, çünkü bu tür açılışlara kolayca fazla yük bindirilir. Sınırların yeniden çizildiği ya da bir antlaşma maddesinin yeniden pazarlık edildiği düzenlemelerin aksine burada hiçbir kurumun yetkisi değişmiyor. Değişen tek şey, Uganda devletinin 1976'nın hangi kısmını sahiplendiğidir; Kainerugaba'nın ilişkilerin \"karşılıklı güven, saygı ve iş birliğiyle tanımlanan bir ortaklığa\" dönüştüğünü söylemesi de bu sahiplenmenin bugünkü karşılığı.", "en": "A disanalogy has to be added, because openings like this are easily loaded with too much. Unlike arrangements in which borders are redrawn or a treaty clause is renegotiated, no institution's authority changes here. The only thing that changes is which part of 1976 the Ugandan state claims; Kainerugaba saying that relations had become a \"partnership characterised by mutual trust, respect and co-operation\" is what that claim amounts to in the present.", "refs": ["entebbe"]}, {"tr": "Bu yüzden sahiplenmenin törenin ötesine geçip geçmediği gözlenebilir bir soru olarak duruyor. İzlenecek gösterge, önümüzdeki yıl içinde Uganda ile İsrail arasında açıklanmış, adı konmuş bir savunma ya da eğitim düzenlemesinin çıkıp çıkmadığıdır. Çıkmazsa elde 1976'ya dair yeniden yazılmış bir cümle kalır: gerçek ama dar bir değişiklik, çünkü hiçbir yetkiyi devretmiyor.", "en": "So whether the claim travels beyond ceremony stands as an observable question. The indicator to watch is whether a named and announced defence or training arrangement between Uganda and Israel appears within the coming year. If none does, what remains is a rewritten sentence about 1976: a real change, and a narrow one, because it transfers no authority.", "refs": ["entebbe"]}]}], "sources": [{"key": "entebbe", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c9v471x89m3o", "title": {"tr": "Uganda, Entebbe baskınından elli yıl sonra Yonatan Netanyahu'nun heykelini açtı", "en": "Uganda unveils a statue of Yonatan Netanyahu at Entebbe fifty years after the hostage rescue"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Ücret yoksa geçiş kuralını kim koyuyor?", "en": "If there is no fee, who sets the rule of passage?"}, "excerpt": {"tr": "Husilerin gemi trafiğini yöneten merkezi ücret planını reddetti ve güvenli geçiş hizmetini gönüllü ilan etti. Tarif yok; fakat kimin yetkili sayıldığına ilişkin bir standart var.", "en": "The Houthi-run centre overseeing vessel traffic denied a fee plan and called its safe-transit service voluntary. There is no tariff, but there is a standard for who counts as authorized."}, "sections": [{"h": {"tr": "Reddedilen ücret, korunan yetki", "en": "A denied fee, an asserted authority"}, "ps": [{"tr": "Husilerin yönettiği İnsani Operasyonlar Koordinasyon Merkezi 1 Ağustos'ta Babülmendep'ten geçen gemiler için ücret planlamadığını açıkladı. Merkez, güvenli geçiş hizmetinin gönüllü ve ücretsiz olduğunu, ödeme isteyenlerin Yemen'i ya da merkezi temsil etmediğini söyledi. Denizcilik şirketlerinden yetkisiz kişilere ödeme yapmamalarını ve bilgi vermemelerini istedi. Açıklama bir tarifeyi reddediyor; aynı cümlede geçerli muhatabın kim olduğunu da tanımlıyor.", "en": "The Houthi-run Humanitarian Operations Coordination Center said on 1 August that it was not planning fees for ships passing Bab al-Mandeb. It called its safe-transit service voluntary and free, and said anyone seeking payment represented neither Yemen nor the centre. Shipping companies were told not to pay or share information with unauthorized parties. The statement rejects a tariff while defining who counts as the valid interlocutor in the same sentence.", "refs": ["houthi-transit"]}, {"tr": "Bu ayrım önemlidir. Bir geçiş ücretinin fiyatı ölçülebilir; gönüllü hizmet ise kabul edilecek iletişim kanalını ve bilgi paylaşımını düzenler. Merkez gemiye ödeme yapma demiyor, kime ödeme yapılmaması gerektiğini söylüyor. Dolayısıyla reddedilen şey denetim değil, denetimin para biçimi. Geçiş kuralı faturadan yetkilendirmeye taşınıyor.", "en": "The distinction matters. A toll has a measurable price; a voluntary service governs the communication channel and the information a ship shares. The centre does not merely say not to pay, but specifies whom not to pay. What is rejected is therefore not control but its monetary form. The rule of passage moves from invoicing to authorization.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Bir haftada kurulan iki çerçeve", "en": "Two frameworks built in one week"}, "ps": [{"tr": "Açıklama, Reuters'ın Husilerin ücret fikrini İranlı yetkililerle görüştüğüne ilişkin haberinden sonra geldi. Aynı hafta grup Suudi Arabistan'a deniz ablukası ilan etmiş, Suudi Arabistan da seyrüsefer serbestisini korumak amacıyla 14 ülkeli bir deniz koalisyonu duyurmuştu. Bir tarafta ücretsiz fakat merkezden geçen güvenli geçiş hizmeti, diğer tarafta devletlerin kurduğu koruma koalisyonu var. İkisi de aynı rotada kimin güvenlik sağlayıcısı sayılacağını belirlemeye çalışıyor.", "en": "The statement followed a Reuters report that the Houthis had discussed a fee idea with Iranian officials. In the same week the group declared a maritime blockade on Saudi Arabia, while Saudi Arabia announced a 14-country maritime coalition to protect freedom of navigation. One side offers a free but centre-mediated safe-transit service; the other assembles a state-led protection coalition. Both seek to define who counts as the security provider on the same route.", "refs": ["houthi-transit"]}, {"tr": "İki çerçevenin aynı şey olduğu söylenemez. Koalisyon askerî kapasite ve devlet taahhüdü taşır; merkezin duyurusu ise gemilerle kurulacak ilişkiye dair tek taraflı bir kuraldır. Fakat pazar erişimi açısından ikisi de sigortacıya, armatöre ve kaptana aynı soruyu yöneltir: geçiş riskini azaltmak için kimin talimatı izlenecek? Kuralın etkisi, açıklamanın dilinden çok gemilerin davranışında ortaya çıkacak.", "en": "The two frameworks are not equivalent. The coalition carries military capability and state commitments; the centre's announcement is a unilateral rule for relations with vessels. Yet for market access both put the same question to insurers, owners and captains: whose instruction will be followed to reduce transit risk? The rule's effect will appear less in the statement's wording than in vessel behaviour.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Standardın ölçülebileceği yer", "en": "Where the standard can be measured"}, "ps": [{"tr": "Önümüzdeki ölçüt ücret tahsil edilip edilmemesinden daha geniştir. Denizcilik şirketleri merkezle temas kurmaya, rota bilgisi paylaşmaya ya da bu kanalın dışında kalan talepleri reddetmeye başlarsa, ücretsiz hizmet fiilî bir geçiş standardına dönüşür. Gemiler aynı rotayı bu kanala başvurmadan kullanır ve güvenlik koşulları değişmezse duyuru yetki iddiası olarak kalır. Babülmendep'te standardı belirleyecek şey fiyat listesi değil, tekrarlanan uyum davranışıdır.", "en": "The relevant test is broader than whether a fee is collected. If shipping companies begin contacting the centre, sharing route information or rejecting demands outside that channel, the free service becomes a de facto transit standard. If vessels use the same route without engaging the channel and security conditions do not change, the statement remains an assertion of authority. At Bab al-Mandeb the standard will be set not by a price list but by repeated compliance behaviour.", "refs": ["houthi-transit"]}]}], "sources": [{"key": "houthi-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/yemens-houthis-deny-plan-to-charge-ships-transiting-red-sea", "title": {"tr": "Husiler Kızıldeniz geçişinden ücret alma planını reddetti", "en": "Yemen's Houthis denied a plan to charge ships transiting the Red Sea"}, "publishedDate": "2026-08-01"}], "date": "2026-08-01"}, {"writer": "geo-02", "title": {"tr": "On dört günlük takvim ilk sınavını verdi", "en": "The fourteen-day clock has taken its first test"}, "excerpt": {"tr": "Hamas ilk adımı kabul ettiğini açıkladı, Trump İsrail'le mutabakat bulunduğunu söyledi. İki beyan arasındaki fark, birinin yükümlülüğü üstlenen taraftan, diğerinin üçüncü bir başkentten gelmesi.", "en": "Hamas announced it accepted the first step and Trump said there is an understanding with Israel. The difference between the two statements is that one comes from the party taking on the obligation and the other from a third capital."}, "sections": [{"h": {"tr": "Kim neyi kabul etti", "en": "Who accepted what"}, "ps": [{"tr": "Hamas 31 Temmuz'da anlaşmanın ilk adımını kabul ettiğini açıkladı: silahlar Filistinli bir komiteye teslim edilecek, karşılığında İsrail Gazze'den tam olarak çekilecek. Saatler sonra Trump, Camp David'deki kabine toplantısında İsrail'le bir mutabakat bulunduğunu ve İsrail'in memnun olduğunu söyledi. İsrail hükümeti metnin şartlarını resmen kabul etmedi. Bakan Itamar Ben-Gvir planı İsrail için kabul edilemez buldu; BM Daimi Temsilcisi Danny Danon CNN'de Hamas'ın bu silahlara yeniden ulaşıp ulaşamayacağını sordu.", "en": "On 31 July Hamas announced it accepted the first step of the agreement: weapons would be handed to a Palestinian committee and, in exchange, Israel would withdraw fully from Gaza. Hours later, at the Cabinet meeting at Camp David, Trump said there is an understanding with Israel and that Israel is content. The Israeli government has not formally accepted the terms. Minister Itamar Ben-Gvir called the plan unacceptable for Israel, while UN ambassador Danny Danon asked on CNN whether Hamas would reach those weapons again.", "refs": ["deal-understanding"]}, {"tr": "Bu köşe 31 Temmuz'da, metindeki yükümlülüklerin silah tarafında toplandığını ve İsrail'in çekilmesinin koşullu bir sonuç olarak bırakıldığını yazmıştı. Bir gün sonraki tablo o dizilimi somutlaştırıyor: kabul beyanı silah tarafından geldi, çekilme tarafına ilişkin elimizdeki şey üçüncü bir başkentin aktarımı.", "en": "This column wrote on 31 July that the obligations in the text are gathered on the weapons side, while an Israeli withdrawal is left as a conditional outcome. The picture a day later makes that ordering concrete: the declaration of acceptance came from the weapons side, and what we have on the withdrawal side is a third capital's account.", "refs": ["prior-vezir", "deal-understanding"]}]}, {"h": {"tr": "Mutabakatı kim taşıyor", "en": "Who carries the understanding"}, "ps": [{"tr": "Trump'ın sözleri tek taraflı bir aktarımdır ve İsrail'in hangi yükümlülüğü hangi tarihte üstlendiğini içermiyor; yazılı bir kabul de açıklanmadı. En güçlü karşı okuma şu: İsrail hükümeti kabul etmiş olabilir ve açıklamayı koalisyon içi dengeler nedeniyle geciktiriyordur. Bu okumayı doğrulayacak gözlemlenebilir tek şey, yayımlanmış bir İsrail kabine kararı ya da İsrailli yetkililerin kendi ağzından teyididir.", "en": "Trump's words are one party's account and do not state which obligation Israel took on, or when; no written acceptance was announced either. The strongest counter-reading is that the Israeli government has accepted and is delaying the announcement because of coalition arithmetic. The only observable that would confirm it is a published Israeli cabinet decision or confirmation from Israeli officials themselves.", "refs": ["deal-understanding"]}, {"tr": "Sahadan gelen ilk işaret ise ters yönde. 1 Ağustos'ta, Hamas'ın taslak anlaşmayı kabul ettiğini açıklamasından saatler sonra Gazze genelinde İsrail hava saldırıları düzenlendi; Al Jazeera en az iki Filistinlinin öldüğünü, en az on kişinin yaralandığını bildirdi. Ateşkes metinlerinin çevresinde silahlı eylemin sürmesi olağandışı sayılmaz; buradaki bilgi, çekilme tarafının henüz gözlemlenebilir bir davranış değişikliğine bağlanmamış olmasıdır.", "en": "The first signal from the ground points the other way. On 1 August, hours after Hamas announced it accepted the draft agreement, Israeli air attacks were carried out across Gaza; Al Jazeera reported at least two Palestinians killed and at least ten wounded. Continued armed action around ceasefire texts is not unusual; the information here is that the withdrawal side has yet to be tied to any observable change in behaviour.", "refs": ["gaza-strikes"]}]}, {"h": {"tr": "Takvimin bir sonraki adımı", "en": "The next step on the clock"}, "ps": [{"tr": "Denge kuruldu demek için erken. Sıradaki gözlemlenebilir adım basit: silahların teslim edileceği Filistinli komitenin adının açıklanması ve ilk teslimin gerçekleşmesi. Komite kurulur ve ilk teslim kamuya doğrulanırsa, anlaşma bir aktarım olmaktan çıkıp bir yükümlülüğe dönüşür. Kurulmadığı sürece elimizde iki tarafın birbirini bekleyerek durduğu bir metin kalır.", "en": "It is early to say a balance has been struck. The next observable step is simple: naming the Palestinian committee that is to receive the weapons, and the first handover taking place. If the committee is constituted and a first handover is publicly confirmed, the agreement moves from an account to an obligation. As long as it is not, what remains is a text with each side standing still and waiting on the other.", "refs": ["deal-understanding"]}]}], "sources": [{"key": "deal-understanding", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/trump-says-us-has-understanding-with-israel-on-hamas-disarmament-deal", "title": {"tr": "Trump, silahsızlanma anlaşmasında İsrail'le \"mutabakat\" olduğunu söyledi", "en": "Trump says there is an \"understanding\" with Israel on the disarmament deal"}, "publishedDate": "2026-07-31"}, {"key": "gaza-strikes", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/1/israel-launches-attacks-across-gaza-one-day-after-hamas-agrees-to-disarm", "title": {"tr": "Hamas'ın silahsızlanmayı kabul etmesinin ardından Gazze'de İsrail saldırıları sürdü", "en": "Israeli attacks resumed across Gaza after Hamas accepted disarmament"}, "publishedDate": "2026-08-01"}, {"key": "prior-vezir", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-31/", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-03", "title": {"tr": "Bezmer'e inen uçak menzil taşıyor", "en": "The aircraft that landed at Bezmer carries range"}, "excerpt": {"tr": "Bir tanker uçağı görev süresini ve menzili uzatır. Bulgaristan meclisinin verdiği yetki de bu kabiliyetin tavanını çiziyor: sekiz uçak, 250 kişi.", "en": "A tanker aircraft lengthens sortie time and range. The authorisation Bulgaria's parliament granted draws the ceiling of that capability: eight aircraft, 250 people."}, "sections": [{"h": {"tr": "İnen kabiliyet", "en": "The capability that landed"}, "ps": [{"tr": "31 Temmuz'da ilk ABD tanker uçağı Bulgaristan'ın güneydoğusundaki Bezmer hava üssüne indi. Bulgaristan meclisi 22 Temmuz'da sekiz tanker uçağı ve 250 ABD askerî personeline kadar yetki vermişti. Savunma Bakanı Dimitar Stoyanov konuşlanmanın geçici olduğunu, Başbakan Rumen Radev uçakların muharip görev için düşünülmediğini söyledi. Savunma Bakanlığı ülkeye doğrudan bir tehdit görmediğini değerlendirdi.", "en": "On 31 July the first US tanker aircraft landed at Bezmer air base in south-eastern Bulgaria. Bulgaria's parliament had authorised up to eight tanker aircraft and up to 250 US service members on 22 July. Defence Minister Dimitar Stoyanov said the deployment is temporary and Prime Minister Rumen Radev said the aircraft are not meant for combat missions. The defence ministry assessed that there is no direct threat to the country.", "refs": ["bezmer"]}, {"tr": "Havada yakıt ikmali bir süre ve mesafe çarpanıdır. Tanker desteğiyle aynı sayıdaki savaş uçağı hedef bölgede daha uzun kalır ve daha uzaktaki üslerden kalkabilir. Radev'in cümlesi bu yüzden hem doğru hem eksik: uçaklar ateş gücü taşımaz, ateş edenlerin görev süresini uzatır.", "en": "Air-to-air refuelling is a multiplier of time and distance. With tanker support the same number of combat aircraft stay longer over a target area and can launch from bases further away. Radev's sentence is therefore both accurate and incomplete: the aircraft carry no firepower and they lengthen the sorties of those that do.", "refs": ["bezmer"]}]}, {"h": {"tr": "Karşı tarafın görebildiği", "en": "What the other side can see"}, "ps": [{"tr": "İran Dışişleri Bakanı Abbas Arakçi, Bulgaristan'ı kararını yeniden değerlendirmeye çağırdı. Bir muhatabın gözlemleyebildiği şey üslenmedir: kalkış saatleri gizlenebilir, bir üsse yerleşen filo gizlenemez. Karşı okuma da açık — bu çağrı, bir tehdit değerlendirmesinden çok alışıldık bir diplomatik itiraz olabilir; ikisini ayıracak olan, İran'ın tutumunun sözden başka bir biçime dönüşüp dönüşmediğidir.", "en": "Iran's Foreign Minister Abbas Araghchi called on Bulgaria to reconsider its decision. What a counterpart can observe is the basing: departure times can be concealed, a squadron settling into a base cannot. The counter-reading is plain — the call may be a routine diplomatic objection rather than a threat assessment, and what separates the two is whether Iran's position takes any form beyond words.", "refs": ["bezmer"]}, {"tr": "Yetkinin sayıları da bir mesaj taşıyor. Sekiz uçak ve 250 kişilik tavan, sürdürülebilir bir ikmal temposunun sınırını belirler: bakım, yedek mürettebat ve yakıt ikmali bu kadroyla yapılabilecek görev sayısını çizer. Bir konuşlanmanın ne kadar dayanabileceğini uçak sayısından çok bu destek kadrosu söyler; Bezmer ve Yambol bölgesinde toplanan yaklaşık 475 imzalı dilekçe ise aynı tavanın yerel siyasi maliyetini gösteriyor.", "en": "The numbers in the authorisation carry a message of their own. A ceiling of eight aircraft and 250 people sets the limit of a sustainable refuelling tempo: maintenance, spare crews and fuel handling draw how many sorties that establishment can support. How long a deployment can hold is told less by the aircraft count than by that support staffing; the petition of nearly 475 signatures gathered in Bezmer and the Yambol region shows the local political cost of the same ceiling.", "refs": ["bezmer"]}]}, {"h": {"tr": "İzlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu konuşlanmanın lojistik bir destekten bir harekât üssüne dönüşüp dönüşmediğini anlamanın dürüst yolu tavanı izlemektir. Bulgaristan meclisi sekiz uçak veya 250 kişilik sınırı yukarı çekerse, görev tanımı da fiilen değişmiş olur. Tavan sabit kaldığı sürece elimizdeki şey, açıklandığı biçimiyle bir ikmal düzeneğidir.", "en": "The honest way to tell whether this deployment turns from logistical support into an operating base is to watch the ceiling. If Bulgaria's parliament raises the limit of eight aircraft or 250 personnel, the mission's definition will have changed in practice. As long as the ceiling holds, what is there is the refuelling arrangement it was described as.", "refs": ["bezmer"]}]}], "sources": [{"key": "bezmer", "kind": "news", "name": "Novinite", "url": "https://www.novinite.com/view_news.php?id=239909", "title": {"tr": "İlk ABD tanker uçağı Bulgaristan'daki Bezmer üssüne indi", "en": "The first US tanker aircraft landed at Bulgaria's Bezmer base"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-04", "title": {"tr": "Yaptırımlı gemi sızdırmaya başlayınca faturayı kim ödüyor?", "en": "Who pays when a sanctioned ship starts to leak?"}, "excerpt": {"tr": "Yaptırım tasarımı finansmanı ve sigortayı hedef alır. Umman açıklarındaki gövde, bu tasarımın dışarıda bıraktığı kalemi gösteriyor: geminin bakımını ve bir kaza hâlinde temizliği kimin üstleneceğini.", "en": "Sanctions design targets financing and insurance. The hull off Oman shows the line item that design leaves outside: who maintains the ship, and who cleans up if something goes wrong."}, "sections": [{"h": {"tr": "28 Temmuz'un görüntüsü", "en": "The image of 28 July"}, "ps": [{"tr": "28 Temmuz tarihli uydu görüntülerinde Caroline Bezengi adlı tankerin yakınında koyu petrol lekeleri, al-Qibliyyah adasının kuzeyinde ise daha açık renkli izler görülüyor. Alan, Umman'ın Zufar valiliğinde korunan bir deniz bölgesi. Uzaktan algılama uzmanı Wim Zwijnenburg, ham petrol depolayan geminin gövdelerinden en az birinin delinmiş göründüğünü söyledi. Gemi Avrupa Birliği ve Birleşik Krallık yaptırımları altında; takip verilerine göre Rus petrolünü Novorossiysk limanından yüklemişti.", "en": "Satellite images dated 28 July show dark oil slicks near the tanker Caroline Bezengi and lighter traces north of al-Qibliyyah island. The area is a protected marine zone in Oman's Dhofar governorate. Remote-sensing specialist Wim Zwijnenburg said at least one of the hulls of the crude storage vessel appears to have been breached. The vessel is under European Union and United Kingdom sanctions; tracking data indicate it loaded Russian oil at the port of Novorossiysk.", "refs": ["oman-spill"]}, {"tr": "Bu gemi, yaptırımın kestiği yolun nereye kıvrıldığının örneği. Kısıtlama, Rus ham petrolünün sigorta ve finans ağı üzerinden taşınmasını pahalılaştırdı; taşımanın kendisini durdurmadı. Ortaya çıkan filo aynı yükü taşıyor ve denetim ağının dışında yaşlanıyor.", "en": "This vessel is an example of where the route cut by sanctions bends to. The restriction made carrying Russian crude through the insurance and finance network more expensive; it did not stop the carrying. The fleet that emerged moves the same cargo and ages outside the inspection network.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Delinen gövdenin iki açıklaması", "en": "Two explanations for a breached hull"}, "ps": [{"tr": "Delinmenin en açık alternatif açıklaması savaş riskidir. İki deniz güvenliği kaynağına göre gemideki sorunlar 8 Haziran'da Yemen'in Mukalla limanı açıklarında başladı ve değerlendirmeler gemide bir patlamaya işaret ediyor. Bu doğruysa gövdeyi delen şey bir olaydır; yaptırımın payı da hasarlı bir geminin yedi hafta boyunca hangi tersaneye ulaşabileceği sorusunda aranmalıdır.", "en": "The clearest alternative explanation for the breach is war risk. According to two maritime security sources the vessel's trouble began on 8 June off Yemen's port of Mukalla, with assessments pointing to an onboard blast. If that holds, what breached the hull was an incident, and the part sanctions play is to be sought in the question of which yard a damaged ship could reach over seven weeks.", "refs": ["oman-spill"]}, {"tr": "Fatura tarafında hesap daha kolay. Sızıntı korunan bir deniz alanında; temizlik yükü Umman'ın kıyı ve çevre birimlerine düşüyor. Yaptırımı koyan Avrupa Birliği ve Birleşik Krallık, geminin ticaretini pahalılaştırma yetkisine sahip; sahildeki masrafı üstlenecek bir mekanizmaları yok. Uluslararası Denizcilik Örgütü durumu izlediğini doğruladı.", "en": "On the invoice side the arithmetic is easier. The leak sits in a protected marine area, and the burden of cleaning it falls on Oman's coastal and environmental bodies. The European Union and the United Kingdom, which imposed the sanctions, have the authority to make the vessel's trade more expensive; they have no mechanism for carrying the cost on the shore. The International Maritime Organization confirmed it is monitoring the situation.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What is measurable"}, "ps": [{"tr": "Bu vakada sınanacak olan, sorumluluğun bir adrese bağlanıp bağlanamayacağı. Geminin sigortacısı ya da işletmecisi kamuya açık biçimde tespit edilir ve Umman ile Uluslararası Denizcilik Örgütü bir hasar değerlendirmesi yayımlarsa, gölge filonun maliyeti ilk kez ölçülebilir bir kalem hâline gelir. Tespit yapılmadığı sürece masraf kıyıda kalır.", "en": "What will be tested here is whether responsibility can be attached to an address. If the vessel's registered insurer or operator is publicly identified and Oman and the International Maritime Organization publish a damage assessment, the cost of the shadow fleet becomes a measurable line item for the first time. As long as no such identification is made, the expense stays on the shore.", "refs": ["oman-spill"]}]}], "sources": [{"key": "oman-spill", "kind": "news", "name": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/07/oil-spill-shadow-fleet-tanker-spreading-oman-satellite-images-show", "title": {"tr": "Yaptırım listesindeki gölge filo tankerinden Umman açıklarına petrol sızıyor", "en": "Oil is leaking from a sanctioned shadow-fleet tanker off Oman"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-05", "title": {"tr": "50.000'den az oyla kurulan bir dış politika", "en": "A foreign policy built on fewer than 50,000 votes"}, "excerpt": {"tr": "Lima'daki yeni hükümet Washington'u stratejik ortak olarak tanımlıyor ve aynı hafta Meksika, Kolombiya ve Venezuela ile kapıları da açık tutuyor. Bu bir seçenek genişletmesi; arkasındaki seçim farkı ise hangi tarafın ne kadar zorlayabileceğini belirliyor.", "en": "The new government in Lima calls Washington a strategic partner and in the same week keeps doors open to Mexico, Colombia and Venezuela. That is a widening of options; the electoral margin behind it sets how hard any side can push."}, "sections": [{"h": {"tr": "Farkın büyüklüğü", "en": "The size of the margin"}, "ps": [{"tr": "Keiko Fujimori 28 Temmuz'da göreve başladı. Haziran ayındaki ikinci turu, solcu rakibi Roberto Sánchez karşısında 50.000'den az oy farkıyla kazanmıştı. Dışişleri Bakanı Carlos Espá bu hafta atandı; Espá daha önce Lima'daki ABD Büyükelçiliği'nde iletişim direktörü olarak çalışmıştı. Göreve başlama törenine ABD Dışişleri Bakan Yardımcısı Christopher Landau katıldı.", "en": "Keiko Fujimori took office on 28 July. She had won June's runoff by fewer than 50,000 votes over her left-wing rival Roberto Sánchez. Foreign Minister Carlos Espá was appointed this week; he had previously worked as communications director at the US embassy in Lima. US Deputy Secretary of State Christopher Landau attended the inauguration.", "refs": ["peru-alignment"]}, {"tr": "Hükümetin dış politika dili tereddütsüz: ABD stratejik ortak olarak tanımlanıyor ve organize suçla mücadele için kurulan Shield of the Americas koalisyonuna katılım planlanıyor. Bu tercihin dayandığı seçmen tabanı ise ülkeyi ikiye bölen bir farkla kazanılmış durumda. Dışarıya kesin görünen bir hizalanma, içeride ince bir çoğunluğa yaslanıyor.", "en": "The government's foreign-policy language is unhesitating: the United States is named a strategic partner and the plan is to join the Shield of the Americas coalition against organised crime. The electorate that choice rests on, though, was won by a margin that split the country in two. An alignment that looks firm from outside leans on a thin majority at home.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Aynı hafta açılan üç kapı", "en": "Three doors opened in the same week"}, "ps": [{"tr": "Aynı hükümet, Meksika ve Kolombiya ile diplomatik ilişkileri onarmayı ve Venezuela ile ilişkileri yeniden kurmayı da planlıyor. Bir başkent aynı hafta hem Washington'la bir güvenlik koalisyonu hem bölge komşularıyla normalleşme konuşuyorsa, seçenek kümesini genişletiyor demektir. Bunun en güçlü karşı okuması, bu genişliğin strateji yerine koalisyon içi denge ihtiyacından doğduğudur: dar farkla kazanmış bir hükümet, birbirine zıt seçmen bloklarına aynı anda bir şey söylemek zorundadır.", "en": "The same government also plans to repair diplomatic relations with Mexico and Colombia and to rebuild ties with Venezuela. When a capital talks in one week about a security coalition with Washington and about normalising with its regional neighbours, it is widening its option set. The strongest counter-reading is that this breadth comes from the arithmetic of coalition management rather than from strategy: a government that won narrowly has to say something to opposing blocs of voters at once.", "refs": ["peru-alignment"]}, {"tr": "Kısıtın nerede olduğu bakırla ilgili. Peru büyük bir bakır üreticisi ve son yıllarda Çin'e yakınlaşmış durumda. Bir güvenlik koalisyonuna katılmak imza gerektirir; ihracatın alıcısını değiştirmek sözleşme, liman ve fiyat gerektirir. Madencilik bölgelerinde çalışan ve geliri bu ihracata bağlı olan kesim, dış politika tercihini sandıktan çok bu ikinci kanaldan hissedecek.", "en": "Where the constraint sits has to do with copper. Peru is a major copper producer that has moved closer to China in recent years. Joining a security coalition takes a signature; changing who buys your exports takes contracts, ports and prices. The people working in the mining regions, whose income depends on those exports, will feel the foreign-policy choice through that second channel more than at the ballot box.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Sözden uygulamaya geçişin işareti", "en": "The sign that words became practice"}, "ps": [{"tr": "Sözün ne kadarının uygulamaya geçtiğini ölçmenin yolu var. Peru, Shield of the Americas koalisyonuna resmen katılır ve aynı dönemde Venezuela ile büyükelçi düzeyinde temsil yeniden kurulursa, çok yönlü hizalanma yürütülen bir politika olur. İkisinden yalnızca biri gerçekleşirse, hükümetin hangi kapıyı gerçekten açtığı da belli olur.", "en": "There is a way to measure how much of the talk becomes practice. If Peru formally joins the Shield of the Americas coalition and ambassadorial representation with Venezuela is restored in the same period, the multi-alignment becomes a policy being carried out. If only one of the two happens, it will also be clear which door the government actually opened.", "refs": ["peru-alignment"]}]}], "sources": [{"key": "peru-alignment", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/strategic-partner-perus-fujimori-plans-to-intensify-ties-with-the-us", "title": {"tr": "Peru'nun yeni hükümeti ABD ile ilişkileri derinleştirmeyi planlıyor", "en": "Peru's new government plans to deepen ties with the United States"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-06", "title": {"tr": "Bir makam basamak hâline geldiğinde seçmen de ona göre davranıyor", "en": "When an office becomes a stepping stone, voters treat it as one"}, "excerpt": {"tr": "Büyük Manchester belediye başkanlığının bu hafta boşalma sebebi, sahibinin başbakanlığa geçmesiydi. Aynı sandıkta katılım yedi puan düştü ve kazananı ikinci tercihler belirledi.", "en": "The reason the Greater Manchester mayoralty fell vacant this week was that its holder moved to the premiership. At the same ballot turnout fell by seven points and second preferences decided the winner."}, "sections": [{"h": {"tr": "Boşalan koltuğun sebebi", "en": "Why the seat fell vacant"}, "ps": [{"tr": "İşçi Partisi adayı Bev Craig, 31 Temmuz'da açıklanan sonuçla Büyük Manchester belediye başkanı seçildi. Ara seçim, Andy Burnham'ın haziranda Makerfield milletvekilliğini kazanması ve ardından parti liderliğine ve başbakanlığa geçmesiyle boşalan koltuk için yapıldı. İlk turda Craig 251.449 oyla yüzde 47,15, Reform UK adayı Sian Astley 111.928 oyla yüzde 20,99 aldı; hiçbir aday çoğunluğu sağlayamadığı için ikinci tercihler sayıldı ve Craig 309.525, Astley 157.178 oya ulaştı.", "en": "Labour's Bev Craig was elected mayor of Greater Manchester in a result declared on 31 July. The by-election was held for the seat vacated when Andy Burnham won the Makerfield parliamentary seat in June and then moved to the party leadership and the premiership. In the first round Craig took 251,449 votes, or 47.15 per cent, and Reform UK's Sian Astley 111,928 votes, or 20.99 per cent; because no candidate reached a majority, second preferences were counted and Craig reached 309,525 against Astley's 157,178.", "refs": ["manchester-mayor"]}, {"tr": "Bu haftaki boşalmanın sebebi, makamın ulusal liderliğe giden bir basamak olarak işleyebilmesiydi. Bir kurumun niteliği çoğu zaman sahiplerinin onu nasıl kullandığında görünür; bölgesel yürütmenin bu kez oynadığı rol, kendi bölgesindeki yetkilerinden çok Westminster'a açılan kapı oldu.", "en": "The reason for this week's vacancy was that the office can work as a step towards national leadership. The character of an institution usually shows in how its holders use it; the part the regional executive played this time was the door it opened to Westminster rather than the powers it holds in its own region.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "İki seçim arasındaki fark", "en": "The gap between two elections"}, "ps": [{"tr": "Karşılaştırma için elimizde bir önceki veri noktası var. Katılım bu seçimde yüzde 25 oldu; Mayıs 2024 seçiminde yüzde 32'ydi. Aynı dönemde Reform UK'in oyu 2024'teki 50.000 düzeyinden 157.000'in üzerine çıktı. İşçi Partisi koltuğu korudu; korunan zeminin bileşimi ise değişti.", "en": "There is a prior data point for comparison. Turnout at this election was 25 per cent; at the May 2024 election it was 32 per cent. Over the same span Reform UK's vote rose from 50,000 in 2024 to more than 157,000. Labour held the seat; the composition of the ground it held changed.", "refs": ["manchester-mayor"]}, {"tr": "Buradaki en açık benzemezliği kaydetmek gerekir. Temmuz sonunda yapılan tek koltuklu bir ara seçim ile mayıs ayında planlı biçimde yapılan bir seçim aynı sandık sayılmaz; mevsim, tek yarışın olması ve kampanya süresi katılımı kendi başına aşağı çeker. Yedi puanlık farkın ne kadarının siyasi ilgisizlikten, ne kadarının takvimden geldiğini bu iki oran söylemiyor.", "en": "The clearest disanalogy has to be set down. A single-seat by-election at the end of July does not count as the same ballot as a scheduled election in May; the season, the absence of other contests and the length of the campaign pull turnout down on their own. These two rates do not say how much of the seven-point gap comes from political disengagement and how much from the calendar.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "Bir sonraki dönüş", "en": "The next turn"}, "ps": [{"tr": "Asıl soru, ikinci tercihlere kalan bir yarışın istisna mı yoksa yeni normal mi olduğu. Craig'in ilk turda yüzde 47,15'te kalması, bölgesel yürütmenin tek bir partiye rahatça yazılmadığı anlamına geliyor. Aynı bölgede yapılacak bir sonraki planlı seçim de ikinci tercihlere kalırsa, makamın koalisyonla kazanıldığı bir döneme girilmiş olur.", "en": "The real question is whether a contest that goes to second preferences is the exception or the new normal. Craig stopping at 47.15 per cent in the first round means the regional executive is not comfortably assigned to a single party. If the next scheduled election in the same region also goes to second preferences, the office will have entered a period of being won by coalition.", "refs": ["manchester-mayor"]}]}], "sources": [{"key": "manchester-mayor", "kind": "news", "name": "ITV News", "url": "https://www.itv.com/news/granada/2026-07-31/labour-retain-greater-manchester-mayor-as-votes-finally-counted-after-15-hours", "title": {"tr": "Büyük Manchester belediye başkanlığını İşçi Partisi'nden Bev Craig kazandı", "en": "Labour's Bev Craig won the Greater Manchester mayoralty"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-01", "title": {"tr": "Yasak temyiz boyunca yürürlükte kalıyor", "en": "The ban stays in force while the appeal runs"}, "excerpt": {"tr": "Yüksek Mahkeme, Palestine Action davasında temyize tek bir gerekçeyle izin verdi ve ifade özgürlüğüne dayanan gerekçeleri kabul etmedi. Böylece dosya bir hak tartışmasından, bir bakanın kendi ölçütünü nasıl uyguladığı sorusuna daraldı; yasaklama kararı bu süre boyunca işlemeye devam ediyor.", "en": "The Supreme Court allowed the Palestine Action appeal on one ground and refused the free-expression grounds. The case has narrowed from a question about rights to a question about how a minister applied her own test, and the proscription keeps operating throughout."}, "sections": [{"h": {"tr": "Hangi gerekçeye izin verildi", "en": "Which ground was allowed through"}, "ps": [{"tr": "Birleşik Krallık Yüksek Mahkemesi 30 Temmuz'da Palestine Action'ın kurucularından Huda Ammori'nin başvurusunu tek bir gerekçeyle temyize açtı: dönemin İçişleri Bakanı Yvette Cooper'ın kendi politikasını yanlış uygulamış olması. İfade ve örgütlenme özgürlüğüne dayanan gerekçelere izin verilmedi. Bu ayrım dosyanın niteliğini değiştiriyor. Sonbaharda cevaplanacak soru şu: bakan, takdir yetkisini kendi ilan ettiği ölçüte uygun kullandı mı?", "en": "The UK Supreme Court opened Huda Ammori's challenge to appeal on 30 July on a single ground: that the then home secretary, Yvette Cooper, misapplied her own policy. Permission was refused on freedom of expression and association. The distinction changes what the case is about. The question to be answered in the autumn is this: did the minister exercise her discretion in line with the test she had herself announced?", "refs": ["proscription"]}, {"tr": "Dosyanın seyri de bu daralmayı gösteriyor. Şubat ayında High Court yasaklama kararının iptal edilmesi gerektiğine hükmetti, İstinaf Mahkemesi haziranda bu kararı bozdu, Yüksek Mahkeme ise geriye tek gerekçe bıraktı. Duruşma hızlandırıldı ve 1 Ekim ile 21 Aralık arasına alındı; kararı Lord Sales, Lord Leggatt ve Lady Simler verdi.", "en": "The path of the case shows the same narrowing. In February the High Court held that the proscription should be quashed; in June the Court of Appeal overturned that; the Supreme Court has now left one ground standing. The hearing has been expedited to a date between 1 October and 21 December, and the permission decision was taken by Lord Sales, Lord Leggatt and Lady Simler.", "refs": ["proscription"]}]}, {"h": {"tr": "Dar kapıdan çıkacak sonuç", "en": "What can come out of a narrow gate"}, "ps": [{"tr": "Ayakta kalan gerekçe yetkinin kullanılış biçimine ilişkin. Bu tür bir kusur çoğu zaman kararın usulüne uygun biçimde yeniden alınmasıyla giderilir; dolayısıyla başvurunun kabulü tek başına yasağın sona ermesi anlamına gelebilir de gelmeyebilir de. Alternatif okuma da mümkün: mahkeme bakanın politikasını öyle bir okuyabilir ki aynı sonuca yeniden ulaşmak pratikte mümkün olmaz. İki ihtimal arasındaki fark, kararın gerekçesinin ne kadar dar yazıldığına bağlı.", "en": "The surviving ground concerns how the power was used. A defect of that kind is usually cured by retaking the decision properly, so success on appeal may or may not end the ban. The other reading is open too: the court could construe the policy so tightly that reaching the same outcome again becomes impractical. The difference between the two turns on how narrowly the judgment is written.", "refs": ["proscription"]}, {"tr": "Bu ayrımı ayırt etmenin gözlenebilir bir yolu var. Temyiz bu tek gerekçeden kabul edilirse, 31 Mart 2027'ye kadar ya İçişleri Bakanlığı, yani Home Office, yeni bir yasaklama kararı alıp yayımlar ya da grup bakanlığın yasaklı örgütler listesinden çıkar. Hangisinin gerçekleştiği, kararın kapsamını gerekçe metnini okumadan da gösterir.", "en": "There is an observable way to tell them apart. If the appeal succeeds on that single ground, then by 31 March 2027 either the Home Office takes and publishes a fresh proscription decision, or the group comes off the Home Office list of proscribed organisations. Which of the two happens will show the judgment's reach without anyone having to parse its reasoning.", "refs": ["proscription"]}]}, {"h": {"tr": "Bu arada yürürlükte kalan yetki", "en": "The power that stays in force meanwhile"}, "ps": [{"tr": "Yasak temyiz boyunca yürürlükte. Yani ekimden aralığa uzanan duruşma penceresi boyunca, gruba destek ifade etmenin hukuki sonucu değişmiyor. Yargısal denetim başlamış olsa da idari işlem kesintisiz çalışmayı sürdürüyor.", "en": "The ban remains in force during the appeal. Through the hearing window that runs from October to December, the legal consequence of expressing support for the group is unchanged. Judicial scrutiny has begun, but the administrative measure keeps running without interruption.", "refs": ["proscription"]}, {"tr": "Bu sürenin bedelini ödeyenler dosyanın tarafı değil. Yasaklama kararından bu yana 3.500'den fazla kişi gözaltına alındı ve temyiz izninin verildiği gün Westminster Sulh Mahkemesi önünde 77 kişi daha gözaltına alındı. Mahkemenin takvimi ile sokaktaki takvim aynı hızda ilerlemiyor.", "en": "The people who pay for that interval are not parties to it. More than 3,500 have been arrested since the proscription, and on the day permission was granted another 77 were arrested outside Westminster Magistrates' Court. The court's calendar and the calendar on the street do not run at the same speed.", "refs": ["proscription"]}]}], "sources": [{"key": "proscription", "kind": "news", "name": "The Jewish Chronicle", "url": "https://www.thejc.com/news/uk/palestine-action-appeal-supreme-court-v7uetpjk", "title": {"tr": "Birleşik Krallık Yüksek Mahkemesi, Palestine Action yasağına karşı temyize tek gerekçeyle izin verdi", "en": "The UK Supreme Court allows an appeal against the Palestine Action ban on a single ground"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-02", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "excerpt": {"tr": "Barış Kurulu'nun Gazze metni bir sıra ve bir takvim içeriyor: 14 gün, önce polis silahları, sonra ağır silahlar, en sonda çekilme. Ancak takvimin son adımını atacak taraf, yani İsrail, metin hakkında henüz konuşmadı.", "en": "The Board of Peace's text on Gaza contains a sequence and a clock: 14 days, police weapons first, heavy weapons next, withdrawal last. But the party that would take the final step, Israel, has not yet spoken about the text."}, "sections": [{"h": {"tr": "Takvim ve sıra", "en": "The clock and the sequence"}, "ps": [{"tr": "Al Jazeera'nın bir kopyasını edindiğini bildirdiği metin, ayrıntılı bir silahsızlanma yol haritasının 14 gün içinde hazırlanmasını öngörüyor ve bu sürenin uluslararası bir doğrulama organının onayıyla uzatılabileceğini yazıyor. Silahlar Gazze'yi yönetecek bir Ulusal Komite'ye devredilecek; önce polis silahları aktarılacak, ardından ağır silahlar etkisiz hale getirilecek ve Gazze'deki tüm askeri faaliyet duracak.", "en": "The text, a copy of which Al Jazeera says it obtained, requires a detailed disarmament roadmap within 14 days and provides that the period can be extended with the approval of an international verification body. Weapons pass to a National Committee that would administer Gaza: police weapons first, then heavy weapons decommissioned, with all military activity in Gaza to cease.", "refs": ["board-of-peace"]}, {"tr": "Sıranın sonunda ise bir devir var. Silahsızlanma tamamlandığında İsrail güçleri çekilecek ve yerlerini bir Uluslararası İstikrar Gücü ile yeni bir Filistin polis gücü alacak. Yani metnin bütün ara adımları, en sondaki adımın atılacağı varsayımıyla anlam kazanıyor.", "en": "At the end of the sequence sits a handover. Once disarmament is complete, Israeli forces withdraw and are replaced by an International Stabilisation Force working with a new Palestinian police force. Every intermediate step in the text therefore acquires its meaning from the assumption that the final step will be taken.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "Kim neyi üstlendi", "en": "Who took on what"}, "ps": [{"tr": "Duyuruyu Trump yaptı. Hamas müzakere heyetinden Gazi Hamad görüşmelerin zor geçtiğini ve ulaşılabilecek en iyi formülün arandığını söyledi; ancak Hamas, İsrail yükümlülüklerini yerine getirmezse metni uygulamayacağını belirtti. Filistin İslami Cihadı anlaşmaya varıldığı yönündeki aktarımlara itiraz ederek mevcut ifadelere çekince koydu. İsrail'den ise açıklama gelmedi.", "en": "Trump made the announcement. Ghazi Hamad of the Hamas negotiating delegation said the talks had been difficult and that the best achievable formula had been sought; Hamas nonetheless said it would not implement the text if Israel failed to meet its obligations. Palestinian Islamic Jihad disputed accounts that an agreement had been reached and entered reservations about the current wording. Israel had made no comment.", "refs": ["board-of-peace"]}, {"tr": "Bir metnin ağırlığı, hangi tarafın hangi yükümlülüğü üstlendiğiyle ölçülür. Burada üstlenilen yükümlülüklerin tamamı silah tarafında toplanıyor; çekilme tarafında ise koşullu bir sonuç duruyor. Kabul edenler koşullu kabul etti, sıranın sonundaki adımı atacak taraf henüz konuşmadı.", "en": "A text's weight is measured by which party takes on which obligation. Here every obligation assumed gathers on the weapons side, while the withdrawal side holds a conditional outcome. Those who accepted did so conditionally, and the party that would take the last step in the sequence has yet to speak.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "En erken tarih 14. gün", "en": "The earliest date is day 14"}, "ps": [{"tr": "Koşullar birbirine bağlandığında ilk kırılma noktası genellikle en erken tarihli maddede ortaya çıkar. Bu metinde en erken tarih 14. gün, ve o gün sınanacak şey yol haritasının hazırlanmış olmasıdır. Alternatif bir okuma da mümkün: 14 günlük süre metne kamuya açık bir tarih iliştirmek için konmuş, uzatma yetkisi ise gecikmeyi soğurmak üzere aynı maddeye yerleştirilmiş olabilir.", "en": "The chaining of conditions usually puts the first break at the earliest-dated clause rather than the most visible one. In this text the earliest date is day 14, and what falls due that day is the preparation of the roadmap. Another reading is available: the 14-day period may exist to attach a public date to the text, with the extension power placed in the same clause to absorb delay.", "refs": ["board-of-peace"]}, {"tr": "Bu yüzden takip edilecek tarih 13 Ağustos. O güne kadar ya ayrıntılı yol haritası duyurulur ya da doğrulama organının uzatma onayı verdiği bildirilir. Hiçbiri olmazsa, metnin bağlayıcılığı hakkındaki soru artık yorum meselesi olmaktan çıkar.", "en": "The date to watch is therefore 13 August. By then either the detailed roadmap is announced or the verification body is reported to have approved an extension. If neither happens, the question about how much the text binds stops being a matter of interpretation.", "refs": ["board-of-peace"]}]}], "sources": [{"key": "board-of-peace", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-says-board-of-peace-reaches-agreement-on-disarmament-of-hamas-in-gaza", "title": {"tr": "Trump, Barış Kurulu'nun Gazze'de aşamalı silahsızlanma üzerinde anlaştığını açıkladı", "en": "Trump says the Board of Peace has agreed a phased disarmament plan for Gaza"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-03", "title": {"tr": "NATO havalanan uçaklarla neyi caydırıyor?", "en": "What is NATO deterring with jets that were already airborne?"}, "excerpt": {"tr": "Bir seyir füzesi ittifak toprağına 80 kilometre girdi ve bir tarlada patladı. Uçaklar havalandı, ateş açılmadı; caydırıcılığı bu kez taşıyan şey gösterilmiş bir önleme değil, verilmiş bir söz.", "en": "A cruise missile travelled 80km into alliance territory and detonated in a field. Jets went up, nothing was fired; what carried deterrence this time was a promise, not a demonstrated intercept."}, "sections": [{"h": {"tr": "Olayın ölçüleri", "en": "The measurements of the event"}, "ps": [{"tr": "Füze yerel saatle 04.00 sularında, Lublin yakınlarındaki Tarnawa-Kolonia köyünün civarında bir tarlaya düştü ve 10 metrelik bir çukur açtı. Nokta, Ukrayna sınırının yaklaşık 80 kilometre içinde. Başbakan Donald Tusk mühimmatın büyük olasılıkla Rus olduğunu, incelemenin bir Kh-101 seyir füzesine işaret ettiğini söyledi.", "en": "The missile came down at about 04.00 local time in a field near the village of Tarnawa-Kolonia, close to Lublin, leaving a crater 10 metres wide. The point of impact lies about 80km inside the Ukrainian border. Prime Minister Donald Tusk said the munition was most likely Russian and that analysis pointed to a Kh-101 cruise missile.", "refs": ["poland-missile"]}, {"tr": "Saldırı sırasında Polonya savaş uçaklarını havalandırdı. Tusk, Polonya'nın hedef alındığını düşündürecek bir neden bulunmadığını, füzenin yerleşim yerlerini tehdit etmesi halinde ordunun müdahaleye hazır olduğunu belirtti. Mühimmat ateşle karşılanmadı; olay yerinde yaralanan olmadı.", "en": "Poland scrambled fighter jets during the attack. Tusk said there was no reason to believe Poland had been targeted and that the military stood ready to intercept had the missile threatened populated areas. The munition was not engaged, and no one was hurt at the site.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Angajmanın eşiği", "en": "The threshold of engagement"}, "ps": [{"tr": "Tusk'ın cümlesi aslında bir kural bildiriyor. Müdahale, mühimmatın ittifak toprağına girmiş olmasına değil, yerleşim yerlerini tehdit etmesine bağlanmış. Bu eşik seçildiğinde, sınırdan 80 kilometre içeri giren bir seyir füzesinin ateş açılmadan yere inmesi bir aksaklık olmaktan çıkar; sistemin öngördüğü sonuç haline gelir.", "en": "Tusk's sentence in fact states a rule. Engagement is tied not to a munition entering alliance territory but to its threatening populated areas. Once that threshold is chosen, a cruise missile coming down unengaged 80km inside the border stops being a malfunction and becomes the outcome the system is designed to produce.", "refs": ["poland-missile"]}, {"tr": "Bu eşiğin sınanması uzun sürmeyecek. NATO üyesi Polonya'nın hava sahasına 31 Ekim'e kadar yeni bir mühimmat girerse, cevabı verilecek soru mühimmatın havada ateşle karşılanıp karşılanmadığı olacak; bir kez daha tarlada bulunursa, kuralın istisna değil uygulama olduğu görülür.", "en": "That threshold will not wait long to be tested. If another munition enters the airspace of NATO member Poland before 31 October, the question to answer is whether it is engaged in the air; if it is again found in a field, the rule will have shown itself to be the practice rather than the exception.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Beyanın taşıdığı yük", "en": "The load the declaration carries"}, "ps": [{"tr": "NATO'da Avrupa Müttefik Kuvvetleri Komutanı Orgeneral Alexus Grynkewich, ittifakın kendi toprağını savunmak için gereken her önlemi almayı sürdüreceğini bildirdi. Bu bir taahhüt beyanıdır ve beyanın işe yaraması için karşı tarafın onu inandırıcı bulması gerekir. Kabiliyetin aksine beyan sayılamaz; yalnızca sınanır.", "en": "NATO's Supreme Allied Commander Europe, Gen Alexus Grynkewich, said the alliance would continue to take all necessary measures to defend NATO territory. That is a declaration of commitment, and a declaration works only if the other side finds it credible. Unlike capability, a declaration cannot be counted; it can only be tested.", "refs": ["poland-missile"]}, {"tr": "Kısıtlamanın bir mühendislik gerekçesi de olabilir: seyrek yerleşimli arazi üzerinde önleme, düşen parçalarla kendi zararını yaratır ve bu tercih bir kabiliyet boşluğuna işaret etmeyebilir. Karşı tarafın gördüğü şey ise şudur: havalanan uçaklar, ateş açılmamış bir hat ve bir tarladaki krater.", "en": "There may be an engineering reason for the restraint: an intercept over sparsely populated ground creates its own harm through falling debris, and the choice need not indicate a gap in capability. What the other side observes is this: aircraft in the air, a line along which nothing was fired, and a crater in a field.", "refs": ["poland-missile"]}]}], "sources": [{"key": "poland-missile", "kind": "news", "name": "The Irish Times", "url": "https://www.irishtimes.com/world/2026/07/30/russia-accused-of-violating-polish-airspace-after-missile-explodes-near-village/", "title": {"tr": "Doğu Polonya'da bir füze patladı, NATO ittifak toprağını savunacağını bildirdi", "en": "A missile explodes in eastern Poland and NATO says it will defend alliance territory"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-04", "title": {"tr": "İki gemi, bir terminal ve iki gün önceki uyarı", "en": "Two vessels, one terminal and a warning two days earlier"}, "excerpt": {"tr": "Dimyat'ta vurulan şey bir boru hattı ya da bir sözleşme değil, bir gövdeydi. Tek bir insansız hava aracı iki gemiyi rıhtımdan uzaklaştırdı ve gazı karaya indiren donanımın ne kadar dar bir yerde toplandığını gösterdi.", "en": "What was hit at Damietta was neither a pipeline nor a contract but a hull. A single drone moved two vessels off the berth and showed how narrow the equipment base that lands gas ashore really is."}, "sections": [{"h": {"tr": "Vurulan donanım", "en": "The equipment that was hit"}, "ps": [{"tr": "Marshall Adaları bayraklı Energos Winter, New Fortress Energy tarafından işletilen yüzer bir depolama ve gazlaştırma ünitesi; işi sıvılaştırılmış doğal gazı yeniden gaza çevirmek. Gemi çarşamba günü Orta Avrupa saatiyle 15.20 sularında sancak tarafından vuruldu ve çıkan yangın Bermuda bayraklı LNG tankeri Gaslog Salem'e sıçradı.", "en": "The Marshall Islands-flagged Energos Winter is a floating storage and regasification unit operated by New Fortress Energy; its job is to turn liquefied natural gas back into gas. It was struck on the starboard side at about 15.20 CET on Wednesday, and the fire spread to the Bermuda-flagged LNG tanker Gaslog Salem.", "refs": ["damietta"]}, {"tr": "Mürettebat tahliye edildi ve can kaybı bildirilmedi. Buna karşılık iki gemi de hasar tespiti için açığa çekildi ve terminaldeki işleyiş aksadı. Zarar, işleyişin bağlı olduğu iki gövdenin rıhtımdan ayrılmasında toplandı.", "en": "The crews were evacuated and no casualties were reported. Both vessels, however, were moved offshore for damage assessment, and operations at the terminal were disrupted. The damage gathered in the removal from the berth of the two hulls on which the operation depends.", "refs": ["damietta"]}]}, {"h": {"tr": "Yerine hızlıca koyulamayan şey", "en": "The thing you cannot quickly replace"}, "ps": [{"tr": "Bir gövdeye isabet eden tek bir insansız hava aracının iki gemiyi rıhtımdan uzaklaştırıp bir terminali aksatabilmesi, kırılganlığın nerede toplandığını gösteriyor: sayısı sınırlı ve yerine birkaç gün içinde bir başkası çekilemeyen özel donanımlı yüzer ünitelerde. Alternatif okuma da elde: gemilerin açığa çekilmesi hasardan değil ihtiyattan kaynaklanmış olabilir; bu durumda aksama kısa sürer ve yoğunlaşma göründüğü kadar derin çıkmaz.", "en": "That one drone hitting one hull could push two vessels off a berth and disrupt a terminal shows where the fragility gathers: in a small number of specialised floating units for which no substitute can be brought in within days. The other reading is available: the vessels may have been moved out of caution rather than damage, in which case the disruption is brief and the concentration is shallower than it looks.", "refs": ["damietta"]}, {"tr": "Fiyatlanabilir ikinci bir bilgi daha var. İran devlet televizyonu Dimyat'ı iki gün önce olası bir misilleme hedefi olarak anmıştı; bu, Ukrayna'nın bir İran gemisine düzenlediği saldırıların ardından gelmişti. Hedef, vurulmadan önce açıkça adlandırılmıştı. Saldırıyı üstlenen çıkmadı; İran Dışişleri Bakanı Abbas Erakçi ülkesinin tırmanma peşinde olmadığını söyledi ve Kiev'den tazminat istedi.", "en": "A second piece of information can also be priced. Iranian state television had named Damietta as a possible retaliation target two days earlier, following Ukrainian strikes on an Iranian vessel. The target was named in public before it was hit. No one claimed the attack; Iran's Foreign Minister Abbas Araghchi said his country was not seeking escalation and demanded compensation from Kyiv.", "refs": ["damietta"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What can actually be measured"}, "ps": [{"tr": "Sorumluluk belirlenmemişken bu olayın ağırlığını siyasi açıklamalardan okumak mümkün değil. Ölçülebilir olan tek şey donanımın kendisi: hangi gemi hangi rıhtıma ne zaman dönüyor ve terminal hangi tarihte olağan işleyişine geçiyor.", "en": "With responsibility unestablished, the weight of this event cannot be read off political statements. The only measurable thing is the equipment itself: which vessel returns to which berth and when, and on what date the terminal resumes normal operation.", "refs": ["damietta"]}, {"tr": "İzlenecek tarih 31 Ağustos. Energos Winter o güne kadar Dimyat'taki rıhtımına döner ve terminal işleyişi normale geçerse, olay bir kesinti olarak kalır. Dönmezse, tek bir gövdenin kaybının ne kadar süreyle bir ithalat kapısını meşgul edebildiği ölçülmüş olur.", "en": "The date to watch is 31 August. If the Energos Winter is back at its Damietta berth by then and the terminal's operation has returned to normal, the event stays an interruption. If it is not, we will have a measurement of how long the loss of a single hull can occupy an import gateway.", "refs": ["damietta"]}]}], "sources": [{"key": "damietta", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/2026/07/30/drone-hits-us-lng-vessel-at-damietta-in-first-attack-on-egyptian-soil", "title": {"tr": "Mısır, Dimyat Limanı'ndaki iki gemide çıkan yangının bir insansız hava aracından kaynaklandığını açıkladı", "en": "Egypt says a drone caused the fire on two gas vessels at Damietta port"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-05", "title": {"tr": "On dört imza, iki eksik komşu", "en": "Fourteen signatures, two absent neighbours"}, "excerpt": {"tr": "Riyad'da duyurulan deniz savunma ittifakında asıl bilgi, bildirinin altındaki isimlerde duruyor. İmzacıların çoğu koridorun kıyısında yaşayan ülkeler; aynı sularda aynı çıkarı taşıyan Birleşik Arap Emirlikleri ile Umman ise listede yok.", "en": "The real information in the maritime alliance announced in Riyadh sits in the names beneath the statement. Most signatories are states that live on the corridor; the United Arab Emirates and Oman, with the same interest in the same waters, are absent from the list."}, "sections": [{"h": {"tr": "İmzayı atanlar", "en": "Those who signed"}, "ps": [{"tr": "Suudi Savunma Bakanlığı'nın duyurusuna göre ittifakın merkezi Riyad'da olacak ve Suudi Arabistan'ın yanı sıra Türkiye, Kuveyt, Bahreyn, Katar, Ürdün, Mısır, Pakistan, Cibuti, Somali, Bangladeş, Yemen, Sudan ve Komorlar imzacılar arasında yer alıyor. Toplantıya bir Avrupa Birliği heyeti de katıldı. Bildiri ittifakın işini istihbarat paylaşımı, ortak tatbikatlar ve ortak deniz harekatları olarak tanımlıyor.", "en": "According to the Saudi defence ministry, the alliance will be headquartered in Riyadh, and alongside Saudi Arabia the signatories include Türkiye, Kuwait, Bahrain, Qatar, Jordan, Egypt, Pakistan, Djibouti, Somalia, Bangladesh, Yemen, Sudan and the Comoros. A European Union delegation also attended the meeting. The statement defines the alliance's work as intelligence sharing, joint exercises and joint maritime operations.", "refs": ["red-sea-alliance"]}, {"tr": "Listeyi coğrafyayla birlikte okumak gerekiyor. Bildirinin kendisi korunacak alanı Bab-ül Mendeb Boğazı, Kızıldeniz ve Aden Körfezi olarak tanımlıyor; Cibuti, Somali, Yemen, Sudan ve Mısır bu hattın kıyısında duruyor. İmza listesi bir maruziyet haritası gibi okunabiliyor: o sudan çıkamayanlar imza atıyor.", "en": "The list has to be read together with the geography. The statement itself defines the area to be protected as the Bab al-Mandeb Strait, the Red Sea and the Gulf of Aden; Djibouti, Somalia, Yemen, Sudan and Egypt sit along that line. The signature list reads like a map of exposure: the states that cannot sail away from those waters are the ones signing.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "İmzalamayanlar", "en": "Those who did not sign"}, "ps": [{"tr": "Birleşik Arap Emirlikleri ile Umman, aynı sulardaki aynı tehdide rağmen imzacılar arasında yok. Bildiri ulusal süreçlerini tamamlayan başka ülkelerin kurucu belgeye katılmasına kapıyı açık bırakıyor; yani liste kapanmış bir liste olarak duyurulmadı.", "en": "The United Arab Emirates and Oman are not among the signatories, despite facing the same threat in the same waters. The statement leaves the door open for other countries to accede to the charter once they complete their national procedures, so the list was not announced as a closed one.", "refs": ["red-sea-alliance"]}, {"tr": "Bu maddenin işleyip işlemediği yakında görülecek. 30 Eylül'e kadar en az bir ülkenin katılımı duyurulursa, açık kapı gerçekten bir katılım mekanizması olarak çalışıyor demektir; kimse eklenmezse, kurucu 14 ülkenin oluşturduğu çekirdek ittifakın tamamı olarak kalır.", "en": "Whether that clause works will be visible soon. If at least one country's accession is announced by 30 September, the open door is functioning as a real mechanism for joining; if nobody is added, the core of 14 founders remains the whole of the alliance.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "Listenin söylediği", "en": "What the list says"}, "ps": [{"tr": "Katılıma açık, istihbarat paylaşımı ve tatbikat üzerine kurulu bir yapı, sonradan girilebilir olacak biçimde tasarlanmıştır. Bu tasarım, korumayı isteyip adının bugün anılmasını istemeyen devletlere bir bekleme odası bırakır. Alternatif bir açıklama da var: iki ülkenin yokluğu, yapının tasarımına ya da merkezinin nerede olacağına ilişkin farklı bir değerlendirmeden kaynaklanıyor olabilir.", "en": "A structure that is open to accession and built on intelligence sharing and exercises is designed to be joined later. That design leaves a waiting room for states that want the protection without having their names read out today. Another explanation is available: the two absences may reflect a different judgement about the structure's design, or about where it is headquartered.", "refs": ["red-sea-alliance"]}, {"tr": "İlk günün bilançosu bu yüzden gemi sayısıyla tutulamaz. Bugün elde olan şey, bir bildirinin altında adının yazılmasını kabul edenlerin listesi. Bir ittifakın kabiliyeti sonradan ölçülür; kimin adını verdiği ilk gün belli olur ve o bilgi kendi başına bir şey söyler.", "en": "The balance of the first day therefore cannot be kept in ships. What exists today is a list of those who accepted having their names written under a statement. An alliance's capability is measured later; who gave their name is settled on day one, and that fact says something on its own.", "refs": ["red-sea-alliance"]}]}], "sources": [{"key": "red-sea-alliance", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/saudi-arabia-announces-maritime-defence-alliance-to-secure-vital-waterways", "title": {"tr": "Suudi Arabistan ve 13 ülke Kızıldeniz için deniz savunma ittifakı kurdu", "en": "Saudi Arabia and 13 other states form a maritime defence alliance for the Red Sea"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-06", "title": {"tr": "Çiti aşan geri gönderiliyor, yüzen gönderilmiyor", "en": "Those who climb the fence go back, those who swim do not"}, "excerpt": {"tr": "Ceuta'nın sınırı yerinden oynamadı; bir mahkeme kararı oynadı. Aynı hattı geçmenin iki ayrı hukuki sonuca bağlanması, olağanüstü durumun neden tam bu hafta ilan edildiğini açıklıyor.", "en": "Ceuta's border did not move; a court ruling did. Tying two different legal consequences to the same line explains why the emergency was declared in precisely this week."}, "sections": [{"h": {"tr": "Perşembe günü olan", "en": "What happened on Thursday"}, "ps": [{"tr": "Ceuta yönetiminin başkanı Jesus Vivas mutlak insani ve toplumsal bir olağanüstü durum ilan etti ve Madrid'den sınır denetimini yeniden kurmak üzere asker istedi. Son 10 gün içinde 1.500 ila 2.000 kişi kente girdi; perşembe günü yüzlerce kişi daha geldi. İçişleri Bakanlığı göç kaynaklı bir krizin ulusal olağanüstü hal tanımına girmediğini belirterek talebi reddetti, ancak sınıra 60 askerin gönderilmesine onay verdi.", "en": "Ceuta's regional president, Jesus Vivas, declared an absolute humanitarian and social emergency and asked Madrid for troops to restore control of the border. Between 1,500 and 2,000 people entered the city over the past 10 days, with hundreds more arriving on Thursday. The interior ministry refused the request, saying a migration crisis does not meet the definition of a national emergency, but authorised 60 troops for the border.", "refs": ["ceuta"]}, {"tr": "Aynı haberde kentin kapasitesinden çok daha az konuşulan bir tarih var. Temmuz başında İspanya Yüksek Mahkemesi, Ceuta ve Melilla'ya ulaşmaya çalışırken denizde yakalanan kişilerin Fas'a doğrudan iade edilemeyeceğine hükmetti. Yetkililer kaçakçılık ağlarının bu kararı kullandığını söylüyor.", "en": "The same report carries a date that is discussed far less than the city's capacity. Earlier in July, Spain's Supreme Court ruled that people intercepted at sea while trying to reach Ceuta or Melilla cannot be returned directly to Morocco. Officials say smuggling networks have made use of the decision.", "refs": ["ceuta"]}]}, {"h": {"tr": "Yerinde duran hat, değişen kural", "en": "The line stayed, the rule changed"}, "ps": [{"tr": "Sınır hattı yerinde duruyor. Değişen şey, aynı hattı geçmenin artık iki ayrı hukuki sonuç doğurması: çiti tırmanan kişi hâlâ anında geri gönderilebiliyor, denizden gelen gönderilemiyor. Geçiş yönteminin sudan yana kayması bu dikişi izliyor; kararın ayırdığı yerden geçiliyor.", "en": "The line is where it was. What changed is that crossing the same line now produces two different legal consequences: someone who climbs the fence can still be sent straight back, someone who arrives by sea cannot. The shift of method towards the water follows that seam; people cross where the ruling drew its distinction.", "refs": ["ceuta"]}, {"tr": "Guardia Civil sözcüsünün anlatımı bu kaymayı tarihlendiriyor: karardan sonra gelişler yavaş bir sızıntı halinde sürmüş, perşembe günü ise bir patlama yaşanmış. Yani değişim kararla birlikte başladı, ama görünür hale gelmesi için kentin kapasitesinin dolmasını bekledi.", "en": "A Guardia Civil spokesperson's account dates that shift: arrivals had been a slow trickle since the ruling, and Thursday brought an explosion. The change began with the decision, then waited for the city's capacity to fill before it became visible.", "refs": ["ceuta"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Uzun süredir yerinde duran bir sınırda ani bir hareketlenmenin sebebini hattın kendisinde aramak yanıltıcıdır; hat yıllardır aynı geçme isteğini üretiyordu. Burada değişen değişken, geçişin hukuken ne anlama geldiğini belirleyen kuraldır. Alternatif okuma da göz ardı edilemez: İçişleri Bakanlığı sorumluluğu insan kaçakçılığı ağlarına yükledi ve deniz koşulları, ağların fiyatlandırması ya da Fas'ın denetim tercihleri de aynı zamanlamayı üretebilirdi.", "en": "When a long-settled border suddenly stirs, looking for the cause in the line itself misleads; the line had been producing the same wish to cross it for years. The variable that changed here is the rule that decides what a crossing means. Nor can another reading be set aside: the interior ministry blamed people-smuggling networks, and sea conditions, the networks' pricing or Morocco's policing choices could have produced the same timing.", "refs": ["ceuta"]}, {"tr": "Bu ayrım kentin kendisi için de sonuç doğuruyor. Ceuta'nın sınırı bir çizgi olarak sabit kaldığı sürece kapasitesi de sabit kalır; değişen kural ise o kapasiteye kaç kişinin ve hangi yoldan ulaşacağını belirler. Bunun ölçüsü basit: deniz yoluyla gelenlerin sayısı ile çitten geçiş girişimlerinin sayısı arasındaki dağılım. Bugün bir sınırı yöneten şey, hangi geçişin hangi sonucu doğurduğuna karar veren cümledir.", "en": "The distinction has consequences for the city too. As long as Ceuta's border stays fixed as a line, so does its capacity; the rule that changed decides how many reach that capacity, and by which route. The measure of that is straightforward: the split between arrivals by sea and attempts on the fence. What governs a border today is the sentence that decides which crossing produces which outcome.", "refs": ["ceuta"]}]}], "sources": [{"key": "ceuta", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/spanish-enclave-of-ceuta-raises-alarm-as-thousands-cross-morocco-border", "title": {"tr": "Ceuta olağanüstü durum ilan etti, Madrid sınıra 60 asker gönderiyor", "en": "Ceuta declares an emergency and Madrid sends 60 troops to the border"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-01", "title": {"tr": "Parayı serbest bırakan cümle Dünya Sağlık Örgütü'nü dışarıda tutuyor", "en": "The sentence that releases the money keeps the World Health Organization outside"}, "excerpt": {"tr": "Washington iki yıl bekletilen 600 milyon dolar tutarındaki ödeneği Gavi'ye açtı. Aynı duyuru, bu paranın Dünya Sağlık Örgütü'ne ulaşmasını engelliyor. Etkiyi üreten şey, ödeneğe eklenen uygunluk koşulu.", "en": "Washington opened up the $600m appropriation it had held back for two years to Gavi. The same announcement keeps that money from reaching the World Health Organization. What produces the effect is the eligibility condition attached to the appropriation."}, "sections": [{"h": {"tr": "Ödeneğe eklenen koşul", "en": "The condition attached to the appropriation"}, "ps": [{"tr": "Dışişleri Bakanlığı ile Sağlık ve İnsani Hizmetler Bakanlığı, Kongre'nin aşı için ayırdığı 600 milyon dolar tutarındaki ödeneği Gavi'ye açarken Dünya Sağlık Örgütü'nün bu ittifak üzerinden Amerikan kaynağı almasını engelledi. Duyuruyu Dışişleri Bakanı Marco Rubio ile Sağlık Bakanı Robert Kennedy Jr. birlikte yaptı ve desteğin sürmesi için Gavi'nin cıva içeren aşıların yerine cıvasız alternatifler koyma yönünde çalışması koşulu getirildi.", "en": "The State Department and the Department of Health and Human Services opened up to Gavi the $600m appropriation Congress had set aside for vaccines, while barring the World Health Organization from receiving American money through the alliance. Secretary of State Marco Rubio and Health Secretary Robert Kennedy Jr. announced it together, and continued support was made conditional on Gavi working towards replacing mercury-containing vaccines with mercury-free alternatives.", "refs": ["gavi-who"]}, {"tr": "Burada bağlayıcı olan, tutara eklenen uygunluk şartı. Bir ödenek serbest bırakıldığında iş biter; uygunluk şartı ise para her aktarıldığında yeniden uygulanır ve alıcı kurumun kimi finanse edebileceğini belirler. Daha sade bir açıklama da mümkün: karar, iki yıl süren bir bütçe tıkanıklığının teknik çözümü ve aşı içeriğine dair yerel siyasetin gereği olabilir.", "en": "What binds here is the eligibility test attached to the sum. Releasing an appropriation is a one-off act; an eligibility test applies again every time money moves, and it determines whom the receiving institution may fund. A plainer explanation is also available: the decision may be the technical resolution of a two-year budget blockage and a requirement of local politics over vaccine content.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Davranışını değiştirmek zorunda olan taraf", "en": "The party that has to change its conduct"}, "ps": [{"tr": "Koşulu karşılamak zorunda olan taraf Gavi. Dünya Sağlık Örgütü ise dolaylı bir kaynak kanalını, kendi aldığı bir karar olmadan, bir aracı kurumun uygunluk kuralları değiştiği için yitiriyor. Ölçek farkı bu kaybı somutlaştırıyor: Amerikan katkısı 2019'da 400 milyon dolar üzerindeydi, bu örgüt bütçesinin yaklaşık yüzde 15'iydi ve yıllık bütçe yaklaşık 3,4 milyar dolar.", "en": "The party obliged to satisfy the condition is Gavi. The World Health Organization loses an indirect funding channel without any decision of its own, because an intermediary institution's eligibility rules changed. The difference in scale makes the loss concrete: American funding reached more than $400m in 2019, about 15 percent of the organization's budget, and that budget runs to some $3.4bn a year.", "refs": ["gavi-who"]}, {"tr": "Koşulun gerçekten bağlayıcı olup olmadığı, gözlenebilir bir yerde belli olacak: Gavi'nin satın alma kararları. Gavi yıl sonuna kadar cıva içeren aşıların tedarikine ilişkin yayımlanmış bir değişiklik açıklarsa koşul davranış değiştirmiş olur. Böyle bir değişiklik yayımlanmazsa ödenek serbest bırakılmış, kural ise uygulanmamış olur.", "en": "Whether the condition truly binds will show up somewhere observable: Gavi's procurement decisions. If Gavi announces a published change to its sourcing of mercury-containing vaccines by the end of the year, the condition will have altered conduct. If no such change is published, the money will have been released and the rule left unapplied.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Aracı kurum üzerinden kurulan emsal", "en": "A precedent built through the intermediary"}, "ps": [{"tr": "Bir bağışçının, çekildiği kurumu hâlâ finanse ettiği bir ittifakın uygunluk kuralları üzerinden dışarıda tutması, doğrudan kesintiden farklı bir yetki kullanımıdır: karar bağışçıda kalır, uygulama yükü aracı kurumun üzerine geçer. Trump 2020'de katkıyı durdurdu, Biden Ocak 2021'de kararı geri aldı, Trump ise 20 Ocak 2025'te çekilmeyi duyurdu; bu kez kural, çekilmenin ulaşamadığı yere uzanıyor.", "en": "A donor keeping the body it has left outside the
