public material does not separate the two readings.", "refs": ["centcom-intercept", "iraq-strikes"]}]}, {"h": {"tr": "Sınırın nerede olduğu sayılabilir", "en": "Where the limit sits can be counted"}, "ps": [{"tr": "CENTCOM, Devrim Muhafızları ile vekillerinin daha fazla askerî yanıttan kaçınmak için saldırıları durdurması gerektiği uyarısında bulundu. Bu uyarının tutup tutmadığı söylemle değil oranla anlaşılır. Ağustos sonuna kadar Irak toprağından yöneltilen insansız hava aracı saldırılarının hızı, bildirilen 72 saatte otuz düzeyinin belirgin biçimde altına inerse maliyet dayatması işlemiş olur. Aynı tempo sürerse, vurulan depolar yerine konmuş demektir ve uyarı yalnızca duyurulmuş bir sınır olarak kalır.", "en": "CENTCOM warned that the Revolutionary Guard and its proxies must stop the attacks to avoid further military response. Whether that warning holds is settled by a rate, not by rhetoric. If, by the end of August, the tempo of drone attacks launched from Iraqi territory falls clearly below the reported level of thirty in 72 hours, the cost imposition will have worked. If the same tempo continues, the depots that were struck have been replaced, and the warning remains a line that was announced rather than defended.", "refs": ["iraq-strikes"]}]}], "sources": [{"key": "centcom-intercept", "kind": "news", "name": "News4JAX", "url": "https://www.news4jax.com/news/world/2026/07/28/saudi-arabia-says-it-shot-down-more-drones-as-houthis-claim-to-have-turned-back-tanker/", "title": {"tr": "CENTCOM: İran'ın ABD güçlerine balistik füze saldırısı önlendi", "en": "CENTCOM says it intercepted an Iranian ballistic missile attack on US forces"}, "publishedDate": "2026-07-28"}, {"key": "iraq-strikes", "kind": "news", "name": "Kurdistan24", "url": "https://www.kurdistan24.net/en/story/928895/us-and-saudi-arabia-conduct-joint-strikes-on-iran-aligned-militia-targets-across-eastern-iraq", "title": {"tr": "ABD ve Suudi Arabistan, Doğu Irak'ta İran'a yakın milis hedeflerini ortak vurdu", "en": "US and Saudi Arabia strike Iran-aligned militia targets across eastern Iraq"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "geo-04", "title": {"tr": "Tarifenin sınırı beş alıcıda çiziliyor", "en": "The tariff stops at five buyers"}, "excerpt": {"tr": "Yetki geniş görünüyor, kapsamı ise sayılı. İlk beş alıcı ve ilk beş aracı: ambargonun duvar mı sapak mı olduğu tam burada belli olur.", "en": "The authority looks broad; its coverage is counted. Five buyers and five intermediaries — that is exactly where you learn whether this is a wall or a detour."}, "sections": [{"h": {"tr": "Yetkinin kapsamı bir sayıyla sınırlı", "en": "The authority is bounded by a number"}, "ps": [{"tr": "Senato Dış İlişkiler Komitesi'nin açıklamasına göre başkana tanınan tarife yetkisi, Rus ham petrolü veya doğal gazının en büyük beş ithalatçısı ile Rusya'nın yaptırımlardan kaçmasına yardım eden ilk beş ülkeyle sınırlı. Tasarı ayrıca Rus yetkililerine ve enerji sektörüne yaptırım öngörüyor ve İran'ın enerji ile silah sektörlerine dönük mevcut kısıtlamaları uzatıyor. Reuters, tarife hedefleri arasında Çin ve Hindistan'ı sayıyor.", "en": "According to the Senate Foreign Relations Committee, the tariff authority granted to the president is limited to the five largest importers of Russian crude oil or gas and the top five countries helping Russia evade sanctions. The bill also imposes sanctions on Russian officials and the energy sector and extends existing restrictions on Iran's energy and weapons sectors. Reuters names China and India among the tariff targets.", "refs": ["senate-sanctions"]}, {"tr": "Takvim de kapsamın parçası. Reuters usul oylamasını, oylama sürerken 75'e karşı 11 olarak aktardı; tasarının Temsilciler Meclisi'ne eylülden önce gelmesi beklenmiyor. Yani bugün ortada yürürlükte bir tarife değil, yürürlüğe girme ihtimali olan bir yetki var ve o yetkinin kullanılıp kullanılmayacağına başkan karar verecek.", "en": "The calendar is part of the coverage too. Reuters reported the procedural vote as 75-11 while voting was still open, and the House is not expected to take the bill up before September. What exists today is therefore not a tariff in force but an authority that may come into force, and whether it is used will be the president's decision.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Beşinci sıradan sonrası açık kalıyor", "en": "Everything past fifth place stays open"}, "ps": [{"tr": "Sayıyla sınırlanmış bir liste, listeye girmemeyi bir hedef hâline getirir. Rus ham petrolünü satın alan tarafların hacimlerini daha fazla alıcıya dağıtması ya da ilk beşin dışındaki aracılar üzerinden yönlendirmesi hâlinde aynı yük aynı yere ulaşır, yalnızca daha uzun ve daha pahalı bir yoldan gider. Bu okumaya karşı sağlam bir itiraz var: Rus ham petrolü alımı birkaç büyük alıcıda yoğunlaşmışsa beş sıra akışın çoğunu kapsayabilir ve dağıtmanın maliyeti tarifenin maliyetini aşabilir. Hangisinin geçerli olduğu, ancak ilan edilmiş bir liste ve sonrasındaki hacim serisiyle sınanabilir.", "en": "A list bounded by a number turns staying off the list into an objective. If buyers of Russian crude spread their volumes across more purchasers, or route them through intermediaries outside the top five, the same cargo reaches the same place — only by a longer and dearer road. There is a solid objection to that reading: if purchases of Russian crude are concentrated among a few large buyers, five slots may cover most of the flow and the cost of dispersing it may exceed the cost of the tariff. Which of the two applies can only be tested against a published list and the volume series that follows it.", "refs": ["senate-sanctions"]}, {"tr": "Yükün kime bindiği de tartışmanın konusu. Temsilci Gregory Meeks metni bir yaptırım tasarısından çok başkana açılan geniş bir tarife yetkisi olarak niteledi; Senatör Jeanne Shaheen ise tasarıyı Ukrayna'ya destek için eldeki en iyi imkân saydı. Aradaki fark teknik sayılmaz. Bir gümrük vergisi ithalatçı tarafta tahsil edilir; ilk muhatabı satıcı değil alıcıdır. Bu, ölçünün etkisiz olduğu anlamına gelmez. Gecikme, kalite kaybı ve artan finansman maliyeti de amaçlanmış sonuçlar olabilir.", "en": "Who carries the burden is also under argument. Representative Gregory Meeks characterised the text less as a sanctions bill than as a broad tariff authority opened up for the president; Senator Jeanne Shaheen treated it as the best available means of supporting Ukraine. The difference hardly counts as technical. A customs duty is collected on the importing side; its first counterpart is the buyer rather than the seller. That does not make the measure ineffective. Delay, quality loss and higher financing costs may themselves be intended effects.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Ölçülecek olan hacim", "en": "Volume is what will be measured"}, "ps": [{"tr": "Bu tasarının bir duvar mı yoksa bir sapak mı olduğu, oylama sayısıyla değil iki gözlemle anlaşılacak: başkan yetkiyi kullanıp bir liste ilan ediyor mu ve ilandan sonra Rus ham petrolü alımları beş büyük alıcıda yoğunlaşmayı sürdürüyor mu, yoksa daha fazla tarafa mı dağılıyor? İkinci gözlem olmadan yetkinin genişliği hakkında söylenen her şey metin okumasıdır, akış okuması değil.", "en": "Whether this bill is a wall or a detour will be settled not by the vote count but by two observations: does the president use the authority and publish a list, and after any such publication do purchases of Russian crude stay concentrated among five large buyers, or spread across more of them? Without the second observation, everything said about the breadth of the authority is a reading of the text, not a reading of the flow.", "refs": ["senate-sanctions"]}]}], "sources": [{"key": "senate-sanctions", "kind": "news", "name": "The Globe and Mail", "url": "https://www.theglobeandmail.com/world/article-us-senate-russia-sanctions-bill-lindsey-graham/", "title": {"tr": "ABD Senatosu Rusya ve İran yaptırım tasarısını ilerletti", "en": "US Senate advances the Russia and Iran sanctions bill"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-05", "title": {"tr": "Kaçırılanlar neden suçlu sayılıyor?", "en": "Why are the trafficked treated as offenders?"}, "excerpt": {"tr": "IOM'un yeni bölgesel stratejisi tek bir ayrımı zorluyor: bilgisayar başındaki kişi failin kendisi mi, yoksa oraya borçla ve şiddetle oturtulmuş biri mi?", "en": "IOM's new regional strategy presses on a single distinction: is the person at the keyboard the offender, or someone put in that chair by debt and violence?"}, "sections": [{"h": {"tr": "Kaynak ülkeler listesi tesadüf değil", "en": "The list of source countries is no accident"}, "ps": [{"tr": "IOM Genel Direktörü Amy Pope, \"80'den fazla ülkeden gelen kişilerin dolandırıcılık merkezlerine kaçırıldığını görüyoruz\" dedi. Örgüt 2022 ile 2025 arasında zorla suça sürüklenen 3.500'den fazla insan ticareti mağduruna 39 ülkeden yardım etti; en çok mağdur Endonezya, Hindistan, Sri Lanka, Etiyopya, Kenya ve Bangladeş'ten geldi. Bu liste bir coğrafya değil, bir işgücü havzası tarif ediyor.", "en": "IOM Director General Amy Pope said, \"We're seeing victims from over 80 different countries being trafficked into the scam centres.\" Between 2022 and 2025 the organisation assisted more than 3,500 victims of trafficking for forced criminality from 39 countries, with the largest numbers from Indonesia, India, Sri Lanka, Ethiopia, Kenya and Bangladesh. That list describes not a geography but a labour catchment.", "refs": ["iom-scam-centres"]}, {"tr": "Seçim ölçütü de bunu doğruluyor. Aracılar sosyal medyadaki iş ilanlarıyla İngilizce bilen ve üniversite mezunu kişileri hedefliyor. Yani aranan, çaresiz bir kişi değil, yurt dışında nitelikli iş bulabileceğine inanacak kadar nitelikli bir kişi. Pope, çalışma izni yerine turist vizesiyle seyahat edilmesinin başvuru sahiplerinin araştırması gereken kritik bir uyarı işareti olduğunu belirtti.", "en": "The selection criteria confirm it. Recruiters use social media job advertisements to target English-speaking university graduates. What is sought, in other words, is someone qualified enough to believe a skilled job abroad is plausible, rather than someone visibly desperate. Pope said travelling on a tourist visa rather than a work permit was a critical warning sign that applicants should investigate.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "Statü, korumayı belirliyor", "en": "Status decides protection"}, "ps": [{"tr": "IOM'un vurgusu tek bir noktada toplanıyor: dolandırıcılığı yürütmeye zorlanan kişiler kovuşturulacak suçlular değil, korunması gereken insan ticareti mağdurlarıdır. Mağdurlar kapalı alanlarda tutuluyor, belgelerine el konuluyor ve şiddet ile borç esaretiyle çalıştırılıyor. Bu tabloda kişinin hangi sıfatla sınırdan geçtiği, sonrasında ona ne yapılabileceğini belirliyor.", "en": "IOM's emphasis converges on one point: people forced to run scams are trafficking victims who need protection, not criminals to be prosecuted. Victims are confined in compounds, stripped of their documents and made to work through violence and debt bondage. In that picture, the label a person carries when they cross a border determines what can be done with them afterwards.", "refs": ["iom-scam-centres"]}, {"tr": "Buradaki asıl değişken sınıflandırmadır. Bir kişi merkezden çıktığında mağdur olarak taranırsa ifade verebilir, tanıklığı soruşturmaya girer ve dönüş süreci bir koruma prosedürüne bağlanır; suçlu olarak işleme alınırsa aynı bilgi kaybolur. Yine de sınıflandırmanın kendiliğinden yerleşmesini beklemek fazla iyimser olur: mağdur statüsü, koruma ve barındırma maliyetini kişinin bulunduğu ülkeye yükler ve bu maliyeti taşıyacak idari kapasite her yerde aynı değildir.", "en": "The operative variable here is classification. If someone leaving a compound is screened as a victim, they can give evidence, that testimony enters an investigation, and their return runs through a protection procedure; if they are processed as an offender, the same information is lost. It would be too hopeful, though, to expect the classification to settle on its own: victim status places the cost of protection and shelter on the country where the person is found, and the administrative capacity to carry that cost is not the same everywhere.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "2025 sayıları neyi gösterdi", "en": "What the 2025 figures showed"}, "ps": [{"tr": "Doğu ve Güneydoğu Asya ile Avustralya ve Yeni Zelanda'da 2025'te dolandırıcılık suçlarından kaynaklanan kayıplar 88,3 milyar dolar ile 114,1 milyar dolar arasında hesaplandı. Bu büyüklük, sektörü ayakta tutanın tek tek merkezler değil bir tedarik zinciri olduğunu düşündürüyor. IOM'un 2026-2030 bölgesel stratejisinin sınanacağı yer de burası: kaynak ülkeler ile mağdurun bulunduğu devletler, ortak tarama ve dönüş sayılarını birlikte yayımlıyor mu?", "en": "Losses from scam offences in East and Southeast Asia, Australia and New Zealand in 2025 were put at between $88.3 billion and $114.1 billion. A figure of that size suggests what sustains the industry is a supply chain rather than individual compounds. That is where IOM's 2026-2030 regional strategy will be tested: do source countries and the states where victims are found publish joint screening and return figures together?", "refs": ["iom-scam-centres"]}]}], "sources": [{"key": "iom-scam-centres", "kind": "news", "name": "UN News", "url": "https://news.un.org/en/story/2026/07/1168038", "title": {"tr": "IOM: Çevrim içi dolandırıcılık merkezlerine insan ticareti hızla büyüyor", "en": "IOM says trafficking into online scam centres is growing fast"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-06", "title": {"tr": "On yılda dokuzuncu başkan", "en": "The ninth president in ten years"}, "excerpt": {"tr": "Peru'nun tekrarlayan sorunu sandıkta belirmiyor. Başkanı görevden alabilen bir kongre ile onu koruyabilen bir bloğun aritmetiğinde beliriyor.", "en": "Peru's recurring problem does not appear at the ballot box. It appears in the arithmetic between a congress that can remove a president and a bloc that can shield one."}, "sections": [{"h": {"tr": "Sayının kendisi bir kurum tarifi", "en": "The number is itself a description of an institution"}, "ps": [{"tr": "Keiko Fujimori salı günü Lima'da Kongre önünde, cumhuriyet başkanlığı görevlerini sadakatle yerine getireceğine dair yemin etti. Haziran ayındaki ikinci turda solcu rakibi Roberto Sanchez'i 50.000'den az oyla geçmişti ve bu, üç yenilginin ardından girdiği dördüncü başkanlık yarışıydı. Aynı törenle birlikte on yılda Peru'nun dokuzuncu başkanı oldu.", "en": "Keiko Fujimori took the oath before Congress in Lima on Tuesday, swearing to carry out the duties of the presidency faithfully. She had beaten her left-wing rival Roberto Sanchez by fewer than 50,000 votes in June's runoff, in her fourth presidential bid after three defeats. With that ceremony she became Peru's ninth president in a decade.", "refs": ["peru-fujimori"]}, {"tr": "O dokuz rakamı bir seçmen kararsızlığını değil, bir kurumsal düzenlemeyi anlatır. Peru başkanlarının çoğu sandıkta yenilerek değil, kongre tarafından görevden alınarak gitti. Bu yüzden yeni başkanın kaderini belirleyecek sayı 50.000'lik oy farkı değil, meclisteki blokudur: Fuerza Popular Kongre'nin en büyük grubuna sahip ve sağdaki müttefikleriyle birlikte Senato sandalyelerinin yarısını elinde tutuyor.", "en": "That nine describes an institutional arrangement rather than an indecisive electorate. Most Peruvian presidents have left not by losing an election but by being removed by congress. The number that will decide this president's fate is therefore not the margin of fewer than 50,000 votes but her bloc in the legislature: Fuerza Popular holds the largest group in Congress and, with its right-wing allies, half the Senate seats.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Babasının dönemiyle uyuşmayan koşul", "en": "The condition that does not match her father's term"}, "ps": [{"tr": "Eleştirmenlerin uzandığı benzetme hazır: yönetiminin babası Alberto Fujimori'nin otoriter dönemine benzeyebileceği ve sivil özgürlüklerin aşınabileceği kaygısı. Benzetmenin tuttuğu yer var, tutmadığı yer de var. Peru'yu son on yılda dokuz başkana taşıyan mekanizma, güçlü bir başkanlıktan çok başkanı indirebilecek kadar güçlü bir kongredir. Bu, tam tersi yönde bir sorundur. Elindeki yarım Senato tam da bu ikinci soruna karşı işliyor: görevden alınmaya karşı koruyor, ama yasama gündemini rahatça ilerletmeye yetmiyor.", "en": "The analogy critics reach for is ready to hand: the fear that her government will resemble the authoritarian rule of her father, Alberto Fujimori, and erode civil liberties. The analogy holds in places and fails in others. The mechanism that carried Peru through nine presidents in ten years has less to do with a strong presidency than with a congress strong enough to bring one down — the opposite problem. Her half of the Senate works precisely against that second problem: it protects against removal, but it is not enough to advance a legislative agenda comfortably.", "refs": ["peru-fujimori"]}, {"tr": "Getirdiği program da ödünç alınmış bir şablon. Kampanyası El Salvador'un Cecot cezaevini örnek alan bir mega hapishane, kimliği gizli tutulan yargıçlar, göçmen sınır dışı işlemleri ve mahkûmların yiyecek karşılığında çalıştırılması üzerine kuruluydu. Şablonlar, onları taşıyan kurumlardan hızlı yolculuk eder; bir cezaevi modeli ithal edilebilir, o modeli ayakta tutan yargı ve infaz kapasitesi ithal edilemez. Bunun bir kampanya çerçevesi olarak kalması da mümkün: yarım Senato, bu adımların çoğunun gerektireceği yasal değişikliği tek başına çıkarmaya yetmiyor.", "en": "The programme she brings is a borrowed template too. Her campaign was built on a megaprison modelled on El Salvador's Cecot facility, judges whose identities are concealed, migrant deportations, and prisoners required to work for food. Templates travel faster than the institutions that carry them; a prison model can be imported, but the judicial and custodial capacity that holds it up cannot. It may also remain a campaign frame: half a Senate is not enough on its own to pass the legal changes most of those steps would require.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Bu döngü nerede bükülebilir", "en": "Where this cycle can still be bent"}, "ps": [{"tr": "Döngünün bu turda kırılıp kırılmadığını iki gözlem gösterecek. Birincisi, ilk görevden alma girişimi geldiğinde yarım Senato bir arada duruyor mu; çünkü bu bloğun dağılması, önceki sekiz başkanın gidişini açıklayan mekanizmanın yeniden işlediği anlamına gelir. İkincisi, muhalefetin adalet aradığı 2022-2023 protestolarındaki ölümlere ilişkin dosyalar ilerliyor mu. Kurumların çekişmeyi soğurup soğuramadığı, sınırların nereden çizildiğinden çok bu iki soruda görünür.", "en": "Two observations will show whether the cycle breaks on this turn. The first is whether the half Senate holds together when the first removal attempt arrives; the dispersal of that bloc would mean the mechanism explaining the departure of the previous eight presidents is running again. The second is whether the cases over the deaths in the 2022-2023 protests, for which the opposition is seeking justice, move forward. Whether institutions can absorb contestation shows up in those two questions far more than in where any line is drawn.", "refs": ["peru-fujimori"]}]}], "sources": [{"key": "peru-fujimori", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/keiko-fujimori-sworn-in-as-peru-president-after-narrow-election-win", "title": {"tr": "Keiko Fujimori, kıl payı seçim zaferinin ardından Peru başkanlığına yemin etti", "en": "Keiko Fujimori sworn in as Peru's president after a narrow election win"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-01", "title": {"tr": "Yaptırım listesi kısaldıkça tarama eşiği yükseliyor", "en": "As the sanctions list shortens, the screening bar rises"}, "excerpt": {"tr": "Hazine'nin ikinci çıkarma turu yaptırımları gevşetmiyor, aracın kendisini yeniden tanımlıyor. Görünen taraf 84 adın silinmesi; asıl değişiklik 22 girişe eklenen ayırt edici bilgide.", "en": "Treasury's second removal round does not loosen sanctions; it redefines the instrument. The 84 deletions are the visible part; the change that matters sits in the identifiers added to 22 entries."}, "sections": [{"h": {"tr": "Silinen ad ile taranabilir hedef arasındaki fark", "en": "The difference between a deleted name and a screenable target"}, "ps": [{"tr": "Hazine Bakanlığı 27 Temmuz'da modernizasyon girişiminin ikinci turunu duyurdu: OFAC'ın Özel Olarak Belirlenmiş Kişiler ve Engellenen Kişiler listesinden 84 kişi ve kuruluş çıkarıldı, 22 liste girişine ayırt edici bilgi eklendi, 18 mükerrer giriş kümesi giderildi. Üç işlemin de aynı duyuruda yer alması tesadüf değil.", "en": "On 27 July the Treasury Department announced the second round of its modernization initiative: 84 individuals and entities came off OFAC's Specially Designated Nationals and Blocked Persons List, 22 list entries gained identifying information, and 18 sets of duplicates were resolved. That the three operations share one announcement is not incidental.", "refs": ["ofac"]}, {"tr": "Listeden çıkarma genellikle siyasi bir taviz olarak okunur. Hazine'nin bildirdiği ölçütler başka bir mekanizmaya işaret ediyor: vefat etmiş kişiler, faaliyeti sona ermiş kuruluşlar ve 20 yıldan uzun süre önce belirlenmiş, tarama için yeterli bilgi taşımayan hedefler. Bir bankanın süzgecinde eşleşmeyen bir ad, yaptırım uygulanmasını sağlamaz; yalnızca yanlış eşleşme üretir. Yine de tersi de mümkün: duyuru tek tek dosyaları yayımlamadığı için, çıkarmaların bir bölümünün sessiz bir siyasi gevşeme olması ihtimali dışlanamaz.", "en": "A delisting is usually read as a political concession. The criteria Treasury states point to a different mechanism: deceased individuals, defunct entities, and targets designated more than 20 years ago that lack the information needed for screening. A name that will not match inside a bank's filter enforces nothing; it produces false hits. The opposite reading remains available, though: because the announcement publishes no individual case files, some of the removals could still be a quiet political relaxation.", "refs": ["ofac"]}]}, {"h": {"tr": "Uyum yükü nereye kayıyor?", "en": "Where does the compliance burden move?"}, "ps": [{"tr": "Eklenen alanlar bu okumanın sınamasıdır: doğum tarihi, kimlik numarası, uyruk, cinsiyet. Bunlar bir adı makinenin eşleştirebileceği bir hedefe çeviren alanlardır. 22 girişe eklenmeleri, bir finans kuruluşunun süzgecinin ulaşabileceği kesinliği yükseltir; eşleşmeyen girişlerin silinmesi ise yanlış alarmı düşürür. Hangi adın okunabilir kılınacağına karar veren makam, uygulamanın dikkatinin nereye yoğunlaşacağına da karar vermiş olur.", "en": "The added fields are the test of that reading: date of birth, identification number, nationality, gender. These are what turn a name into something a machine can match. Adding them to 22 entries raises the precision a financial institution's filter can reach; deleting unmatchable entries lowers the false-positive load. Whoever decides which name becomes legible has also decided where enforcement attention will concentrate.", "refs": ["ofac"]}, {"tr": "İkinci bir değişiklik gündemin kimin elinde olduğuna dokunuyor. Hazine, 29 Haziran 2026'da listeden çıkarma başvurularının yapılabildiği bir Yeniden Değerlendirme Portalı açtığını bildiriyor. Bu, sıranın bir bölümünü kurumun iç önceliklerinden başvuru yapanlara taşır. Gözlenebilir işaret şu: sonraki turların bileşimi idari temizlikten mi, yoksa başvuruya dayalı çıkarmalardan mı ağırlık alacak.", "en": "A second change touches who holds the agenda. Treasury says it opened a Reconsideration Portal on 29 June 2026 through which delisting petitions can be filed. That moves part of the queue away from the agency's internal priorities and toward whoever files. The observable signal: whether the composition of later rounds tilts from administrative housekeeping toward petition-driven removals.", "refs": ["ofac"]}]}, {"h": {"tr": "Hangi ölçüyle değerlendirilecek?", "en": "By what measure will it be judged?"}, "ps": [{"tr": "Duyuruda Bakan Scott Bessent'in tutumu, yönetimin yaptırım başarısını \"yalnızca Hazine'nin listeye eklediği isim sayısıyla değil, etki, sonuç ve fayda üzerinden\" ölçtüğü biçiminde aktarılıyor. Bir duyuruda ilan edilen ölçüt bir konum belirler, uygulamayı belgelemez. Bu ölçütün ciddiye alınıp alınmadığı, sonraki turların her girişin hangi gerekçeyle çıkarıldığını ayrı ayrı yayımlayıp yayımlamamasından anlaşılacak.", "en": "The release attributes to Secretary Scott Bessent the position that the administration measures sanctions success \"in terms of effect, impact, and benefit-not just based on the number of names Treasury places on a list.\" A yardstick declared in a press release establishes a position; it does not document implementation. Whether it is meant seriously will show in whether later rounds publish, entry by entry, the ground on which each name was removed.", "refs": ["ofac"]}]}], "sources": [{"key": "ofac", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0578", "title": {"tr": "ABD Hazinesi yaptırım listesinden 84 kişi ve kuruluşu çıkardı", "en": "US Treasury removes 84 people and entities from its sanctions list"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-02", "title": {"tr": "Salonu terk etmek hangi yetkiyi geri alır?", "en": "What authority does walking out reclaim?"}, "excerpt": {"tr": "Bu köşenin önceki yazısında 144'e karşı 10'luk oyun meşruiyet verdiği, ama uygulamayı zorlayacak bir güç vermediği savunulmuştu. Pazartesi günkü çıkış, aynı hesabın öbür yarısını görünür kılıyor.", "en": "An earlier column here argued that the 144-10 vote conferred legitimacy but not the leverage to compel practice. Monday's walkout makes the other half of that sum visible."}, "sections": [{"h": {"tr": "Oyun ardından gelen çıkış", "en": "The walkout that followed the vote"}, "ps": [{"tr": "ABD heyeti pazartesi günü, Fransa'nın Rusya'nın Ukrayna'daki savaşına ilişkin konuşmasına başladığı sırada Güvenlik Konseyi salonunu terk etti. Anlaşmazlığın kaynağı Konsey'in gündemindeki savaş değil, Washington'ın BM insan hakları yüksek komiseri Volker Türk'ün görev süresinin uzatılmasına karşı oy vermesiydi.", "en": "The US delegation left the Security Council chamber on Monday as France's delegation began speaking about Russia's war in Ukraine. The dispute did not originate in the war on the Council's agenda but in Washington's vote against renewing the term of UN human rights chief Volker Turk.", "refs": ["unsc"]}, {"tr": "Bu köşenin önceki yazısında, Türk'ün 144'e karşı 10 oyla yeniden seçilmesinin kuruma meşruiyet kazandırdığı ama karşı oy veren devletlerin uygulamasını değiştirmediği ileri sürülmüştü. Pazartesi günkü çıkış o savın sınanabilir hale gelen tarafıdır: karşı oy veren devlet uyum göstermek yerine salondan çekildi. Karar aritmetiği tuttu; kararın muhatabı üzerindeki etkisi tutmadı.", "en": "An earlier column here argued that Turk's re-election by 144 votes to 10 gave the office legitimacy without changing the practice of the states that opposed it. Monday's walkout is the testable side of that argument: the opposing state's response was not compliance but withdrawal from the room. The coalition arithmetic held; its purchase on the state it was aimed at did not.", "refs": ["unsc", "history-turk"]}]}, {"h": {"tr": "İki delegasyonun farklı hesabı", "en": "Two delegations, two different sums"}, "ps": [{"tr": "Fransa'nın BM Daimî Temsilciliği ABD'nin artık bir \"insan hakları feneri\" olmadığını bildirdi ve oyla Kuzey Kore, Nikaragua, Mali ve Rusya ile aynı safta kaldığını söyledi. ABD Daimî Temsilcisi Mike Waltz ise Türk'ün \"ABD, Birleşik Krallık ve İsrail gibi özgür, egemen demokrasilere ders verdiğini\" savundu. Dönüşümlü temsilci Dan Negrea, Fransa \"küçümseyici ve saygısız söyleminden\" vazgeçene kadar çıkışların süreceğini duyurdu. Fransa'nın büyükelçisi Jerome Bonnafont çıkışa hiç değinmedi, BM'nin bağımsızlığını korumaktan söz etti.", "en": "France's UN Mission said the US was no longer a \"beacon of human rights\" and that the vote had left it standing with North Korea, Nicaragua, Mali and Russia. US Ambassador Mike Waltz replied that Turk \"has been lecturing free, sovereign democracies like the United States, the UK, and Israel.\" Alternate representative Dan Negrea announced the walkouts would continue until France renounced its \"condescending and disrespectful rhetoric.\" France's ambassador Jerome Bonnafont did not mention the walkout at all and spoke of preserving the UN's independence.", "refs": ["unsc"]}, {"tr": "Negrea'nın koyduğu koşul, çıkışı bir pazarlık aracına dönüştürüyor. Bu aracın bedeli düşük: Konsey, eksik bir heyetle de çalışmayı sürdürür, dolayısıyla masraf salonu terk edenin kendi gündem belirleme gücüne yazılır. Bu yüzden çıkışın hedefi Fransa'nın söylemi olmayabilir; muhatabı iç kamuoyu olan bir jest de aynı biçimi alır. İki yorumu ayıran şey, ABD'nin kendi metin taslağını savunması gereken bir oturumda aynı davranışı sürdürüp sürdürmeyeceğidir.", "en": "Negrea's condition turns the walkout into a bargaining instrument. It is a cheap one: the Council keeps working with a delegation missing, so the cost falls on the absentee's own agenda-setting. That is why France's rhetoric may not be the real target; a gesture aimed at a domestic audience takes exactly the same shape. What separates the two readings is whether the US repeats the behaviour in a session where it must defend a draft of its own.", "refs": ["unsc"]}]}, {"h": {"tr": "Ne gözlemlenebilir?", "en": "What can be observed"}, "ps": [{"tr": "Buradan bir denge çıkarmak için henüz erken. Ama sınanabilir bir eşik var: ABD, kendi sunduğu bir karar tasarısının görüşüldüğü bir oturumda da salonu terk ederse, çıkış bir müzakere aracı değil, kurumdan uzaklaşmanın alışkanlığa dönüşmüş biçimi olarak okunmalıdır. Tersine, taslak sahibi olduğu oturumlarda kalırsa, koşulun gerçekten Fransa'nın söylemine bağlandığı görülür.", "en": "It is too early to call this a balance. But there is a testable threshold: if the US also leaves a session in which a draft resolution it sponsored is under discussion, the walkout should be read not as a negotiating instrument but as distancing from the institution turned into habit. If, on the other hand, it stays in sessions where it owns the text, the condition really is tied to France's rhetoric.", "refs": ["unsc"]}]}], "sources": [{"key": "unsc", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/us-diplomats-walk-out-as-france-addresses-un-security-council", "title": {"tr": "Fransa söz alınca ABD diplomatları Güvenlik Konseyi salonundan çıktı", "en": "US diplomats walk out as France takes the floor at the Security Council"}, "publishedDate": "2026-07-27"}, {"key": "history-turk", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-25/", "title": {"tr": "144'e karşı 10 ve bir kurumun dayanıklılığı", "en": "144 against 10, and the durability of an institution"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "geo-03", "title": {"tr": "Bir uçağın satışını iki ayrı yetki belirliyor", "en": "Two separate authorities decide one aircraft's sale"}, "excerpt": {"tr": "\"Kimse bana ne satmamız gerektiğini söyleyemez\" bir niyet beyanıdır. Uygunluk kararını veren makam ise bir hafta önce Kongre'ye Ankara'nın hâlâ nitelikleri karşılamadığını bildirdi.", "en": "\"Nobody tells me what we should be selling\" is a statement of intent. The office that decides eligibility told Congress a week ago that Ankara still does not qualify."}, "sections": [{"h": {"tr": "Niyet ile uygunluk arasındaki mesafe", "en": "The distance between intent and eligibility"}, "ps": [{"tr": "Trump, uçakta gazetecilerin Netanyahu'nun itirazına ilişkin sorusuna \"Kimse bana ne satmamız gerektiğini söyleyemez\" diye yanıt verdi ve ekledi: \"Türkiye İsrail'in büyük hayranı değil, Bibi'nin de pek hayranı değil. Ama bana karşı harika davrandılar\". TRT Haber'in aktardığı sözlerinde Erdoğan'ı dostu olarak andı, Türkiye'yi de büyük bir müttefik diye tanımladı.", "en": "Asked aboard his plane about Netanyahu's objection, Trump answered, \"Nobody tells me what we should be selling.\" He added: \"Turkey's not a big fan of Israel, not a great fan of Bibi. But they've been great for me.\" In remarks carried by TRT Haber he called Erdogan a friend and Turkey a major ally.", "refs": ["f35"]}, {"tr": "Aynı haberde ikinci bir bilgi var ve satışın hangi aşamada olduğuna dair asıl veri odur: Dışişleri Bakanlığı bir hafta önce Kongre'ye Ankara'nın alım için hâlâ uygun olmadığını bildirdi. Bu, iki ayrı yetkinin aynı dosyada farklı yönde çalıştığını gösterir. Biri satışı istiyor, öbürü uygunluk ölçütünü tutuyor.", "en": "The same report carries a second fact, and it is the one that actually locates the sale: the State Department told Congress a week ago that Ankara still does not qualify for the purchase. Two separate authorities are working the same file in opposite directions. One wants the sale; the other holds the eligibility standard.", "refs": ["f35"]}]}, {"h": {"tr": "Kabiliyet ne zaman devreye girer?", "en": "When does the capability actually arrive?"}, "ps": [{"tr": "Bir beşinci nesil uçak, bölgesel hava resmini açıklandığı gün değiştirmez. Sıra bellidir: uygunluk, sözleşme, üretim sırası, teslimat, ardından mürettebat ve idame. Başkanın sözü bu dizinin ilk basamağının bile öncesindedir. Buna karşılık dizi bir veto değildir; uygunluk ölçütünü uygulayan makam yürütmenin içindedir ve yürütme kendi ölçütünü gözden geçirebilir. Bu yüzden bugünkü tablo bir engel değil, bir gecikme ölçüsüdür.", "en": "A fifth-generation aircraft does not change the regional air picture on the day it is announced. The sequence is fixed: eligibility, contract, production slot, delivery, then aircrew and sustainment. A president's remark sits before even the first of those steps. The sequence is not a veto, though: the office applying the eligibility standard sits inside the executive branch, and the executive can revise its own standard. What today's picture measures is delay, not obstruction.", "refs": ["f35"]}, {"tr": "Netanyahu'nun itirazı da uçak sayısıyla ilgili değil. Bir ülkenin o kabiliyet katmanında iş görebilmesi, komşularının hava planlamasında hangi varsayımı kuracağını belirler. Trump'ın yanıtı bu düzlemde verilmedi; ilişkinin kendisini öne çıkardı ve dengeyi hiç fiyatlamadı. İki taraf aynı dosyada iki ayrı ölçütle konuşuyor.", "en": "Netanyahu's objection is not about airframe counts either. Whether a state can operate at that capability tier sets the assumption its neighbours build into their own air planning. Trump's answer was not given on that plane; it foregrounded the relationship itself and priced the balance not at all. The two sides are arguing the same file with two different yardsticks.", "refs": ["f35"]}]}, {"h": {"tr": "Gözlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu dosyada söz ile sonuç arasındaki farkı ölçen tek bir belge var. Dışişleri Bakanlığı Kongre'ye ilettiği değerlendirmeyi değiştirir ve Türkiye'ye F-35 satışına ilişkin resmî bir bildirim yapılırsa, niyet beyanı kabiliyet hattına geçmiş olur. Böyle bir bildirim olmadıkça, uçakta söylenen sözün hava resmi üzerinde ölçülebilir bir karşılığı yoktur.", "en": "Only one document measures the gap between the remark and the outcome in this file. If the State Department revises its assessment to Congress and a formal notification of a proposed F-35 sale to Türkiye follows, the statement of intent will have crossed into the capability line. Absent such a notification, what was said aboard the plane has no measurable effect on the air picture.", "refs": ["f35"]}]}], "sources": [{"key": "f35", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog_entry/trump-on-netanyahu-opposing-f-35-sale-to-turkey-nobody-tells-me-what-we-should-be-selling/", "title": {"tr": "Trump, Türkiye'ye F-35 satışına yönelik Netanyahu itirazını reddetti", "en": "Trump brushes aside Netanyahu's objection to an F-35 sale to Türkiye"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-04", "title": {"tr": "Bab-ül Mendep'ten pazar günü geçen on bir gemi", "en": "Eleven ships through Bab al-Mandeb on Sunday"}, "excerpt": {"tr": "Yemen'in dışişleri bakanı adayı, Husilerin Hürmüz modelini kopyalamak istediğini söylüyor. Geçiş sayıları, kopyalamaya gerek kalmadan rotanın çoktan boşaldığını gösteriyor.", "en": "Yemen's foreign minister-designate says the Houthis want to copy the Hormuz model. The transit counts show the route has already emptied without any copying."}, "sections": [{"h": {"tr": "Sayılar ne diyor?", "en": "What the numbers say"}, "ps": [{"tr": "Afrah el-Zouba pazartesi günü Riyad'daki Yemen büyükelçiliğinde konuştu: \"Husiler İran modelini kopyalamak istiyor ve bu iki ana boğazı kapatacak\". Grubun yetersiz uluslararası tepki nedeniyle cesaretlendiğini savundu. Bu bir taraf değerlendirmesi ve bağımsız doğrulaması yok.", "en": "Afrah al-Zouba spoke on Monday at Yemen's embassy in Riyadh: \"The Houthis want to copy the Iranian model, and this will shut down two main straits\". She argued the group had been emboldened by an insufficient international response. This is one party's assessment, and it carries no independent verification.", "refs": ["redsea"]}, {"tr": "Aynı haberdeki üç sayı daha somut. Küresel konteyner trafiğinin yaklaşık yüzde 30'u Kızıldeniz'den geçiyor, küresel ticaretin yüzde 12 ile yüzde 15'i bu rotaya bağlı ve pazar günü boğazdan yalnızca 11 emtia gemisi geçti. Üçüncü sayı ilk ikisinin yanında durunca ortaya çıkan tablo şu: rotanın taşıdığı yükün payı hâlâ büyük, fiilen taşıdığı gemi sayısı ise değil.", "en": "Three other figures in the same report are more concrete. Roughly 30 percent of global container traffic transits the Red Sea, 12 percent to 15 percent of overall global trade depends on the route, and on Sunday only 11 commodity vessels passed through the strait. Set the third figure beside the first two and the picture is this: the route's share of the cargo that matters is still large; the number of ships actually using it is not.", "refs": ["redsea"]}]}, {"h": {"tr": "Sapak nereye çıkıyor?", "en": "Where does the detour lead?"}, "ps": [{"tr": "Hürmüz benzetmesi, kaldıracın nasıl işlediğini yanlış anlatıyor. Hürmüz'ün alternatifi yok; Bab-ül Mendep'in var, ama pahalı. Bir boğazın kapanması gerekmez, geçiş hacminin çökmesi yeter: masraf o anda sigorta primine ve daha uzun alternatif rotanın eklediği sefer günlerine geçmiş olur. İki boğazın kapatılacağı uyarısı bu yüzden bir tehdit değil, çoktan ödenmiş bir faturanın adıdır.", "en": "The Hormuz comparison misdescribes the instrument. Hormuz has no alternative; Bab al-Mandeb has one, and it is expensive. A strait does not have to close for the leverage to work; transit volume collapsing is enough, and at that moment the cost has already moved into insurance premiums and the sea-days a longer alternative route adds. The warning that two straits will be shut is therefore not a threat but the name of a bill already paid.", "refs": ["redsea"]}, {"tr": "Tek günlük bir sayımdan kalıcı bir yön değişikliği çıkarmak yanlış olur. Pazar günkü 11 gemi, Husilerin temmuzda Suudi Arabistan'a giden gemilere yönelik abluka ilanı ile Suudi Arabistan'ın Hudeyde limanına düzenlediği hava saldırılarının hemen ardından gelen kısa bir duraklamayı da yansıtabilir. Rotanın gerçekten terk edilip edilmediğini tek bir gün değil, art arda gelen haftalar gösterecek.", "en": "It would be wrong to read a durable reroute out of a single day's count. Sunday's 11 vessels may reflect a short pause immediately after the Houthis' July siege declaration on shipping bound for Saudi Arabia and the Saudi air strikes on the port of Hodeidah. What will show whether the route has actually been abandoned is consecutive weeks, not one day.", "refs": ["redsea"]}]}, {"h": {"tr": "Ölçülebilir eşik", "en": "A measurable threshold"}, "ps": [{"tr": "Bu yüzden izlenecek değişken bir açıklama değil, bir sayımdır. Husiler Suudi Arabistan'a yönelik abluka ilanını geri almadıkça boğazdan günlük geçen ticari gemi sayısının düşük kalmasını beklemek gerekir. Ablukanın kaldırıldığı duyurulur ve haftalık geçiş sayıları buna rağmen toparlanmazsa, maliyeti üreten şey ilan değil, sigortanın rotayı fiyatlama biçimidir; bu da ayrı bir sorundur.", "en": "So the variable to watch is a count rather than a statement. Unless the Houthis withdraw the siege declaration on shipping bound for Saudi Arabia, daily commercial transits through the strait should be expected to stay low. If the siege is announced as lifted and weekly transit counts still fail to recover, the cost is being generated by the way insurance prices the route rather than by the declaration, and that is a separate problem.", "refs": ["redsea"]}]}], "sources": [{"key": "redsea", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/houthis-want-to-copy-irans-hormuz-control-in-the-red-sea-yemeni-fm", "title": {"tr": "Yemen'in dışişleri bakanı adayı: Husiler Kızıldeniz'de Hürmüz modelini kopyalamak istiyor", "en": "Yemen's foreign minister-designate says the Houthis want to copy Iran's Hormuz model"}, "publishedDate": "2026-07-28"}], "date": "2026-07-28"}, {"writer": "geo-05", "title": {"tr": "Boykot çağrısı ile sandık arasındaki on iki sandalye", "en": "Twelve seats between the boycott call and the ballot box"}, "excerpt": {"tr": "Pakistan yönetimindeki Keşmir'de oylama üç aşamaya bölündü, internet kapatıldı ve haziranda yasaklanan hareket sandığın dışından konuşuyor. İtirazın merkezinde mültecilere ayrılan on iki meclis sandalyesi var.", "en": "In Pakistan-administered Kashmir the vote was split into three phases, the internet was cut, and the movement banned in June is speaking from outside the ballot. At the centre of the objection are twelve assembly seats reserved for refugees."}, "sections": [{"h": {"tr": "Kimin seçimi, hangi koşullarda?", "en": "Whose election, under what conditions?"}, "ps": [{"tr": "Yerel yasama seçiminin üç aşamasından ilki 27 Temmuz'da yapıldı. Yaklaşık 3,8 milyon seçmen kayıtlı; oylamanın bölünme gerekçesi güvenlik personelinin yetersizliği olarak açıklandı. Bölgenin büyük bölümünde mobil ve internet hizmetleri kesildi, sandık başında fiilî bir olağanüstü hâl uygulandı. Mirpur'da ilk aşamada katılımın düşük göründüğü aktarıldı.", "en": "The first of three phases of the local legislative election was held on 27 July. About 3.8 million voters are registered, and the split was attributed to a shortage of security personnel. Mobile and internet services were suspended across most of the territory and an unofficial state of emergency was in force at the polls. Turnout appeared low in Mirpur during the first phase.", "refs": ["kashmir"]}, {"tr": "Sandığın dışında kalan taraf da örgütlü. Cammu Keşmir Ortak Avami Eylem Komitesi haziranda terörle mücadele yasaları kapsamında yasaklandı; yöneticileri tutuklandı, bir bölümü gizlendi, bir bölümü protesto kamplarından örgütlenmeyi sürdürüyor. Haziran başından bu yana yaklaşık 40 kişi öldü. Boykot çağrısının gerekçesi tek bir maddede toplanıyor: mecliste 12 sandalyenin Keşmirli mültecilere ayrılması.", "en": "The side outside the ballot box is organised too. The Jammu Kashmir Joint Awami Action Committee was banned in June under anti-terrorism laws; its leaders were arrested, some went underground and some continue organising from protest camps. Nearly 40 people have been killed since early June. The boycott call rests on a single provision: the 12 assembly seats reserved for Kashmiri refugees.", "refs": ["kashmir"]}]}, {"h": {"tr": "Hangi seçenekler açık kaldı?", "en": "Which options stayed open?"}, "ps": [{"tr": "On iki sandalyeye yönelik itiraz, oy verip vermemekten önce meclisin kimi temsil ettiğine dair bir iddiadır. Sandığa giremeyen bir hareketin elinde kalan tek ölçülebilir kaldıraç katılım oranıdır; bu yüzden boykot bir çekilme değil, kalan tek aracın kullanılmasıdır. Ancak Mirpur'daki düşük katılımı doğrudan boykotun başarısı saymak erken olur: internet kesintisinin yarattığı pratik sürtünme de aynı sonucu üretebilir.", "en": "The objection to the twelve seats is a claim about whom the assembly represents, prior to any question of whether to vote. For a movement shut out of the ballot the only measurable leverage left is the turnout figure, so the boycott uses the one instrument still available rather than abandoning the contest. Reading Mirpur's low turnout directly as the boycott's success would be premature, though: the practical friction of the internet shutdown produces the same result.", "refs": ["kashmir"]}, {"tr": "Kesintinin yalnızca boykotçuları değil yarışan adayları da kısıtladığını, bağımsız aday Malik Alauddin'in sözleri gösteriyor: \"İnternet kesintisi hem siyasi adaylar hem de seçim süreci için ciddi zorluklar yarattı\". Üç aşamalı takvim ise yönetimin kendi kapasitesine dair bir beyandır: tek bir oy gününü güvence altına alamayan idare üç gün güvence altına alıyor. Seçmenin karşısındaki soru, bu koşullarda kimi seçeceğinden çok hangi koşulda seçtiğidir.", "en": "That the shutdown constrains contesting candidates and not only boycotters is shown by independent candidate Malik Alauddin: \"The internet shutdown has created serious difficulties ... for political candidates and the electoral process itself.\" The three-phase calendar is itself a statement about the administration's capacity: an authority that cannot secure one polling day secures three. The question in front of voters is less whom to choose than under what conditions they are choosing.", "refs": ["kashmir"]}]}, {"h": {"tr": "Kalan aşamalarda görülecek olan", "en": "What the remaining phases will show"}, "ps": [{"tr": "Kalan iki aşama, iki ayrı okumayı ayırt edebilecek tek malzemeyi üretecek. İnternet hizmetleri açıldığı hâlde katılım düşük kalırsa, engel, iletişim kesintisi değil temsil itirazıdır. Kesinti sürer ve katılım düşük kalırsa, hangi etkenin ağır bastığı bu seçimin verileriyle ayrılamayacak; bu durumda meclisin oluşumu, kendi meşruiyetine dair soruyu açık bırakarak tamamlanmış olur.", "en": "The remaining two phases will produce the only material capable of separating two readings. If services are restored and turnout stays low, the obstacle is the objection over representation rather than the communications cut. If the shutdown continues and turnout stays low, this election's own data will not separate the two factors, and the assembly will be constituted with the question of its legitimacy left open.", "refs": ["kashmir"]}]}], "sources": [{"key": "kashmir", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/pakistan-administered-kashmir-opens-polls-in-violence-wracked-vote", "title": {"tr": "Pakistan yönetimindeki Keşmir'de oylamanın ilk aşaması şiddet gölgesinde yapıldı", "en": "First phase of voting held in Pakistan-administered Kashmir amid violence"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-06", "title": {"tr": "Bir hukuki görüş neden haritayı değiştirmiyor?", "en": "Why does a legal opinion not change the map?"}, "excerpt": {"tr": "Uluslararası Adalet Divanı 2024'te işgalin sürdürülmesini hukuka aykırı buldu. İki yıl sonra hızlanan şey hukuki metin değil, çiftlik karakollarının idari statüsü.", "en": "In 2024 the International Court of Justice found the continued occupation unlawful. Two years on, what is accelerating is the administrative status of farm outposts rather than the legal text."}, "sections": [{"h": {"tr": "İki ayrı saat", "en": "Two clocks"}, "ps": [{"tr": "BM Genel Sekreteri Antonio Guterres, yerleşimlerin \"hiçbir hukuki geçerliliği bulunmadığını\" ve uluslararası hukukun \"açık bir çiğnenmesi\" olduğunu yineledi. \"Yerleşimler iki devletli çözümün ve adil, kalıcı, kapsamlı bir barışın önünde büyük bir engel olmayı sürdürüyor\" dedi. Bu değerlendirmenin dayanağı yeni değil: Uluslararası Adalet Divanı 2024'te verdiği istişari görüşte işgalin sürdürülmesini hukuka aykırı bulmuştu.", "en": "UN Secretary-General Antonio Guterres repeated that settlements have \"no legal validity\" and constitute a \"flagrant violation\" of international law. He said: \"Settlements remain a major obstacle to a two-state solution and to a just, lasting and comprehensive peace.\" The basis for that assessment is not new: in 2024 the International Court of Justice found in an advisory opinion that the continued occupation was unlawful.", "refs": ["westbank"]}, {"tr": "Aynı hafta başka bir saat işledi. Netanyahu cuma günü hükümetinin mevcut çiftlik karakollarının yasallaştırılmasını hızlandıracağını ve yenilerini kuracağını duyurdu. İki açıklama arasındaki fark yalnızca yön değil, tür farkı: biri uluslararası hukuk düzleminde bir tespit, öbürü iç planlama düzleminde bir işlem.", "en": "Another clock was running the same week. On Friday Netanyahu announced his government would accelerate the legalisation of existing farm outposts and establish new ones. The two statements differ in kind as well as in direction: one is a finding on the plane of international law, the other an act on the plane of domestic planning.", "refs": ["westbank"]}]}, {"h": {"tr": "Neden şimdi?", "en": "Why now?"}, "ps": [{"tr": "Mekanizma yasama değil idaredir. Bir karakolun yasallaştırılması, iç planlama mevzuatı içinde yürüyen bir işlemdir: izinsiz kurulmuş bir yerleşimi izinli hale getirir ve uluslararası düzlemdeki soruya hiç dokunmaz. İki saatin farkı burada belirginleşir. İdari işlemin arkasında dosyayı yürüten bir birim, bir takvim ve sahada bir müfettiş vardır; istişari görüşün arkasında bunların hiçbiri yoktur. Buna karşılık duyurunun zamanlaması yapısal değil konjonktürel olabilir: İsrail'de seçim takviminin yaklaştığı bir dönemde açıklama, planlama hattında kalıcı bir hızlanmadan çok koalisyon yönetimine dönük olabilir.", "en": "The mechanism is administrative, not legislative. Legalising an outpost is a procedure inside domestic planning law: it turns an unauthorised settlement into an authorised one and touches the international question not at all. This is where the difference between the two clocks becomes concrete. Behind the administrative act stand a unit that processes the file, a timetable and an inspector on the ground; behind the advisory opinion stands none of these. The timing may still be conjunctural rather than structural, though: with Israel's election calendar approaching, the announcement may serve coalition management more than any durable acceleration in the planning pipeline.", "refs": ["westbank"]}, {"tr": "Ölçülebilir taraf, planlama dosyalarının dışında sayılıyor. Al Jazeera'nın aktardığı OCHA verilerine göre ocak-temmuz 2026 döneminde İsrail güçleri veya yerleşimcilerce 77 Filistinli öldürüldü; bunların 18'i çocuk. Aynı dönemde Filistinlilerce üç İsrailli öldürüldü. Haberin yayımlandığı haftanın perşembesinden bu yana sekiz Filistinli ve iki İsrailli hayatını kaybetti, en az on Filistinli aile yerinden edildi. OCHA ocaktan bu yana yerleşimcilerle ilişkili 1.330'dan fazla olay saydı.", "en": "The measurable side is counted outside the planning files. OCHA figures cited by Al Jazeera record 77 Palestinians killed by Israeli forces or settlers between January and July 2026, 18 of them children, and three Israelis killed by Palestinians over the same period. Since the Thursday of the week the report was published, eight Palestinians and two Israelis have been killed and at least ten Palestinian families displaced. OCHA has counted more than 1,330 settler-related incidents since January.", "refs": ["westbank"]}]}, {"h": {"tr": "Ayrışan nokta", "en": "The disanalogy"}, "ps": [{"tr": "Sınır anlaşmazlıklarının tarihinde bir uluslararası tespitin sahadaki düzeni değiştirdiği örnekler vardır; ama bunların hemen hepsinde hattı yöneten bir makam bulunur: bir gözlem misyonu, bir tahkim komisyonu, bir mübadele takvimi. Burada ayrışan nokta budur. İstişari görüş bir hüküm değildir ve hattı yöneten bir idaresi yoktur; yerleşim dosyasını yürüten idare ise yalnızca taraflardan birine aittir. Bu yüzden önümüzdeki aylarda izlenmesi gereken şey yeni bir uluslararası metin değil, yayımlanan planlama onaylarıdır: duyurulan hızlanmanın karşılığı orada görünürse tespit ile harita arasındaki mesafe bir kez daha açılmış olacak.", "en": "The history of boundary disputes does contain cases where an international finding changed the order on the ground, but in almost all of them an authority administers the line: an observation mission, an arbitration commission, a timetable for exchange. That is the disanalogy here. An advisory opinion is not a judgment, and no administration governs the line; the administration that does process the settlement files belongs to one party only. So what should be watched in the coming months is the published planning approvals rather than any new international text: if the announced acceleration shows up there, the distance between the finding and the map will have widened once again.", "refs": ["westbank"]}]}], "sources": [{"key": "westbank", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/un-slams-israels-expansion-of-illegal-settlements-in-occupied-west-bank", "title": {"tr": "Guterres, Batı Şeria'daki yerleşim genişlemesini hukuka aykırı buldu", "en": "Guterres condemns settlement expansion in the occupied West Bank"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-01", "title": {"tr": "Gazze'ye girişi onaylayan makam değişmedi", "en": "The authority that admits the force did not change"}, "excerpt": {"tr": "Güvenlik kabinesi Uluslararası İstikrar Gücü'nün girişini onayladı. İlk kadro 200 kişi; çalışma alanı İsrail'in askerî denetimi dışında kalan bölgeler; hangi ülkenin asker göndereceğine karar verme yetkisi ise İsrail'de. Bu üç koşul bir araya geldiğinde onay, sahadaki denetimi değil sahaya kabulü düzenleyen bir kural hâline geliyor.", "en": "The security cabinet approved the entry of the International Stabilization Force. The first contingent is 200 strong; its area of work is whatever lies outside Israeli military control; and the power to decide which countries may send troops stays with Israel. Put together, those three conditions make the approval a rule about admission rather than about control on the ground."}, "sections": [{"h": {"tr": "Onaylanan metnin işlediği yer", "en": "Where the approved text operates"}, "ps": [{"tr": "İsrail güvenlik kabinesi pazar günü, Trump'ın 20 maddelik planında tanımlanan Uluslararası İstikrar Gücü'nün Gazze'ye girişini onayladı. Al Jazeera'nın aktardığı düzenlemeye göre güç, Uganda ve Fas gibi dost ülkelerden gelecek 200 personelle kurulacak, İsrail ordusuyla tam eşgüdüm içinde çalışacak ve yalnızca İsrail'in askerî denetimi dışında kalan alanlarda görev yapacak. Hangi ülkelerin asker göndereceğine İsrail karar verecek; konuşlanma tarihi açıklanmadı.", "en": "Israel's security cabinet approved on Sunday the entry into Gaza of the International Stabilization Force defined in Trump's 20-point plan. Under the arrangement reported by Al Jazeera, the force is to be built from 200 personnel drawn from friendly countries such as Uganda and Morocco, to work in full coordination with the Israeli military, and to operate only in areas outside Israeli military control. Israel will decide which countries may contribute troops, and no deployment date was given.", "refs": ["isf"]}, {"tr": "Bir kararın neyi bağladığını anlamak için hangi eylemin izne tabi olduğuna bakmak gerekir. Burada izne tabi olan şey, gücün görevi değil ülke ülke kabulüdür: katkı veren her devlet, birliğini gönderebilmek için ayrı bir onay almak zorunda. Bu yapıda güç, mandası aracılığıyla değil kendisini kabul eden makamın takdiri aracılığıyla var olur. Alternatif bir okuma da mümkün: çok uluslu konuşlandırmalarda ev sahibi devletin katkı veren ülkeleri onaylaması olağan bir kuvvet oluşturma usulüdür ve burada da yalnızca bu usul işliyor olabilir.", "en": "To see what a decision binds, look at which act requires permission. Here the permission attaches not to the force's task but to its admission, country by country: each contributing state must obtain a separate approval before it can send its unit. In that structure the force exists through the discretion of the authority that admits it rather than through its mandate. An alternative reading is available: in multinational deployments it is ordinary force-generation practice for a host state to approve contributing countries, and nothing more than that practice may be at work here.", "refs": ["isf"]}]}, {"h": {"tr": "Sayı ile harita birbirini sınırlıyor", "en": "The number and the map limit each other"}, "ps": [{"tr": "İki rakam yan yana konduğunda düzenlemenin ölçeği görünür oluyor. Al Jazeera, İsrail'in Gazze'nin yaklaşık yüzde 70'ini denetlediğini aktarıyor; gücün ilk kadrosu ise 200 kişi. Yani 200 kişilik bir birlik, toprağın geri kalanında ve yalnızca kabul edildiği ölçüde çalışacak. Bu, denetim değişikliğinden çok bir varlık göstergesidir; sahadaki fiilî yetki dağılımını değiştirmesi için kadronun da coğrafi kapsamın da büyümesi gerekir.", "en": "Two figures side by side show the scale of the arrangement. Al Jazeera reports that Israel controls about 70 percent of Gaza; the force's first contingent is 200 people. A 200-strong unit will therefore work in what remains, and only so far as it is admitted. That is closer to a presence than to a change of control; for the effective distribution of authority on the ground to shift, both the headcount and the geographic scope would have to grow.", "refs": ["isf"]}, {"tr": "Gazze Barış Kurulu genel direktörü Nickolay Mladenov onayı, istikrar ve silahsızlandırma için üzerinde anlaşılan çerçevenin kritik bir parçası olarak nitelendirdi. Bir açıklama bir pozisyonu kurar, uygulamayı değil. Bu düzenlemenin bağlayıcılık kazandığını gösterecek gözlenebilir işaret bellidir: adı açıklanmış bir katkı ülkesinin biriminin fiilen onaylanıp Gazze'de konuşlanması. Eylül sonuna kadar böyle bir birim kamuya duyurulmazsa, kararın sahadaki yetki dağılımını değil yalnızca çerçevenin sözlü kapsamını genişlettiği sonucuna varılabilir.", "en": "Nickolay Mladenov, director-general of the Gaza Board of Peace, called the approval a critical part of the agreed framework for stabilisation and demilitarisation. A statement establishes a position, not implementation. The observable sign that the arrangement has acquired binding force is specific: a named contributing country's unit actually approved and deployed inside Gaza. If no such unit is announced publicly by the end of September, the decision will have widened the framework's stated scope rather than the distribution of authority on the ground.", "refs": ["isf"]}]}], "sources": [{"key": "isf", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/israeli-government-nods-to-international-stabilisation-force-in-gaza", "title": {"tr": "İsrail güvenlik kabinesi uluslararası gücün Gazze'ye girişini onayladı", "en": "Israel's security cabinet approves the international force's entry into Gaza"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-02", "title": {"tr": "Üç aracı, iki taraf, tek ön koşul", "en": "Three mediators, two parties, one precondition"}, "excerpt": {"tr": "Umman heyeti Tahran'da, Katar ve Pakistan mesaj taşıyor, iki taraf ikinci gecedir ateş açmıyor. Aynı gün İran dinî lideri Mücteba Hamaney, herhangi bir anlaşmanın birincil koşulu olarak İsrail'in Lübnan'a saldırılarının mutlak ve koşulsuz biçimde sona ermesini gösterdi. Ateşin durması taraflar arasındaki seçenek kümesini henüz değiştirmiş değil.", "en": "An Omani delegation is in Tehran, Qatar and Pakistan are carrying messages, and neither side has fired for a second night. On the same day Iran's supreme leader, Mojtaba Khamenei, named an absolute and unconditional end to Israeli attacks on Lebanon as the primary condition for any agreement. The halt in fire has not yet changed the option set between the parties."}, "sections": [{"h": {"tr": "Ara verilen şeyin ölçüsü", "en": "The measure of what has paused"}, "ps": [{"tr": "İki hafta süren karşılıklı saldırıların ardından ikinci gece de vuruşma olmadı. İran ordu sözcüsü Muhammed Ekraminia misilleme operasyonlarının durdurulduğunu açıkladı; ABD'nin BM Daimi Temsilcisi Mike Waltz, Başkan Trump'ın görüşmelere biraz alan tanıdığını söyledi. Umman heyeti Tahran'da; İran Dışişleri sözcüsü İsmail Bakai'ye göre Katar ve Pakistan da mesaj taşıyor. Hürmüz'deki geçiş trafiğine ilişkin teknik ve siyasi istişarelerde ilerleme kaydedildiği bildirildi.", "en": "After two weeks of exchanges, a second night passed without strikes. Iran's army spokesman, Mohammad Akraminia, announced that retaliatory operations had been halted; Mike Waltz, the US ambassador to the United Nations, said President Trump was giving talks a little room. An Omani delegation is in Tehran, and Iran's foreign ministry spokesman, Esmaeil Baghaei, said Qatar and Pakistan were carrying messages too. Progress was reported in technical and political consultations on traffic through Hormuz.", "refs": ["pause"]}, {"tr": "Bir aranın müzakere değeri, geri alınmasının maliyetiyle ölçülür. Burada imzalanmış bir metin, ilan edilmiş bir takvim ya da adı konmuş bir izleme düzeneği yok; dolayısıyla saldırıların yeniden başlaması hiçbir tarafa hukuki bir bedel yüklemiyor. Değişen, tarafların elindeki seçenekler değil temasın kanalı. Bunun tek açıklaması diplomasi de olmayabilir: New York Times, Trump'ın tırmandırma planlarını füze önleyici stoklarına ilişkin kaygı nedeniyle beklettiğini bildirdi; doğrulanırsa ara, masanın değil ikmalin ürünü sayılır.", "en": "The bargaining value of a pause is measured by the cost of undoing it. Here there is no signed text, no announced timetable and no named monitoring arrangement, so a resumption of strikes imposes no legal cost on either side. What has changed is the channel of contact, not the options available to the parties. Diplomacy need not be the only explanation: the New York Times reported that Trump held back escalation plans over concern about interceptor stocks, and if that account holds, the pause is a product of resupply rather than of the table.", "refs": ["pause"]}]}, {"h": {"tr": "Koşulu koyan taraf odada değil", "en": "The party setting the condition is not in the room"}, "ps": [{"tr": "Aynı gün Tahran, pazarlığın kapsamını genişletti. İran dinî lideri Mücteba Hamaney X'te yayımladığı mesajda, Lübnan'ın toprak bütünlüğünün korunmasını ve saldırıların mutlak, koşulsuz biçimde sona ermesini herhangi bir anlaşmanın birincil koşulu olarak tanımladı; Hizbullah'ın savunulmasını İran'ın stratejik görevi saydı. Aynı koşul haziranda imzalanan ve Hürmüz anlaşmazlığı yüzünden geçerliliğini yitiren mutabakatta da vardı. 26 Haziran'da ABD arabuluculuğuyla varılan Lübnan çerçevesi aşamalı çekilme öngörüyor, takvim içermiyor ve Hizbullah bu çerçeveyi reddetti.", "en": "On the same day Tehran widened the scope of the bargain. In a post on X, Iran's supreme leader, Mojtaba Khamenei, described preserving Lebanon's territorial integrity and an absolute, unconditional end to the attacks as the primary condition for any agreement, and called the defence of Hezbollah Iran's strategic mandate. The same condition appeared in the June memorandum that has since lapsed over the Hormuz dispute. The US-mediated Lebanon framework of 26 June provides for a phased withdrawal, sets no timetable, and was rejected by Hezbollah.", "refs": ["khamenei"]}, {"tr": "Bu ön koşul, ABD-İran hattındaki uzlaşmayı üçüncü bir cephedeki davranışa bağlıyor. Sonuç, kimin bozabileceğine dair haritayı değiştiriyor: masadaki iki taraf anlaşsa bile, çerçeveyi reddetmiş bir aktörün Lübnan'daki hareketi anlaşmayı geçersiz kılabilir. Karşı okuma da ciddiye alınmalı; ön koşul, aynı zamanda Tahran'ın masadan kalkmadan zaman kazanmasını sağlayan bir dış seçenek işlevi görebilir ve bu durumda işlevi bağlamak değil erteleme hakkını saklı tutmaktır.", "en": "That precondition ties agreement on the US-Iran track to conduct in a third theatre. The effect is to redraw the map of who can spoil: even if the two parties at the table agree, movement in Lebanon by an actor that has rejected the framework could void the bargain. The counter-reading deserves weight too; the precondition can also serve as an outside option that lets Tehran buy time without leaving the table, in which case its function is to reserve the right to defer rather than to bind.", "refs": ["khamenei", "pause"]}]}, {"h": {"tr": "Dengenin ölçüleceği yer", "en": "Where a balance would become measurable"}, "ps": [{"tr": "Bu süreçte gözlenebilir eşik, sözlerin değil belgenin düzeyinde. Hürmüz geçiş trafiğine ilişkin görüşmeler eylül sonuna kadar tarafların kabul ettiği, yayımlanmış ve bir izleme merciini adıyla anan bir düzenleme üretirse, temas bir taahhüde dönüşmüş olur. Böyle bir metin çıkmazsa, aracıların sayısı arttıkça sürecin ilerlediği izlenimi güçlense de taraflar arasındaki seçenek kümesi aynı kalmış olacaktır.", "en": "The observable threshold in this process sits at the level of a document rather than of statements. If the talks on Hormuz traffic produce, by the end of September, a published arrangement accepted by the parties and naming a monitoring body, contact will have become a commitment. If no such text emerges, then however strongly a growing number of mediators suggests movement, the option set between the parties will have stayed where it was.", "refs": ["pause"]}]}], "sources": [{"key": "pause", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/us-and-iran-hit-pause-on-strikes-for-second-day", "title": {"tr": "ABD ile İran karşılıklı saldırılara ikinci gün de ara verdi", "en": "US and Iran hold off on strikes for a second day"}, "publishedDate": "2026-07-26"}, {"key": "khamenei", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/us-iran-peace-deal-depends-on-israel-leaving-lebanon-says-khamenei", "title": {"tr": "Hamaney, ABD'yle anlaşmanın ön koşulu olarak İsrail'in Lübnan saldırılarının bitmesini gösterdi", "en": "Khamenei makes an end to Israeli attacks on Lebanon the precondition for a deal with Washington"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-03", "title": {"tr": "Savunulan hattın maliyeti kime yazılıyor?", "en": "Who pays for the line that was defended?"}, "excerpt": {"tr": "Romanya üç günde üç insansız hava aracını düşürdü. Bu, ilan edilmiş değil savunulan bir hattır. Ancak maliyet, sarf malzemesi sayılabilecek bir gövdeye yükleniyor; onu gönderen tarafa değil. Caydırıcılığın ölçüsü, düşürme sayısı değil gönderme sıklığının değişip değişmediğidir.", "en": "Romania has downed three drones in three days. That is a line defended, not merely announced. The cost, however, falls on an airframe that can be treated as expendable, not on the party that launched it. The measure of deterrence is whether the rate of launches changes, rather than how many interceptions succeed."}, "sections": [{"h": {"tr": "Üç gün, üç müdahale", "en": "Three days, three interceptions"}, "ps": [{"tr": "Romanya Savunma Bakanlığı, pazar sabahı hava sahasına giren bir aracın düşürüldüğünü bildirdi; müdahaleyi Karadeniz üzerinde bir F-16 yaptı. Cuma ve cumartesi günü de birer araç engellenmişti. Cumhurbaşkanı Nicusor Dan, cuma günü düşürülen aracın Rusya Federasyonu'nun Ukrayna'ya yönelik savaşında kullandığı Şahid tipi olduğunu doğruladı. Rusya Savunma Bakanlığı ise gece boyunca 133 Ukrayna insansız hava aracını vurduğunu açıkladı.", "en": "Romania's defence ministry said an aircraft that entered its airspace on Sunday morning had been shot down, with an F-16 making the interception over the Black Sea. One aircraft had been stopped on Friday and another on Saturday. President Nicusor Dan confirmed that the one downed on Friday was a Shahed model used by the Russian Federation in its war against Ukraine. Russia's defence ministry said it had struck 133 Ukrainian drones overnight.", "refs": ["romania"]}, {"tr": "Üç gün üst üste düşürme, tatbikat düzeyinde bir sonuçtur: uyarı, tanımlama ve angajman zinciri işliyor. Ancak zincirin ucundaki hedef ucuz ve yenilenebilir. Bu yüzden düşürme, karşı tarafa bir bedel yüklemekten çok bir kabiliyeti gösterir. Bir başka açıklama da dışlanamaz; ihlaller, Ukrayna hedeflerine yönelik saldırıların taşmasından ya da rota hatasından kaynaklanıyor olabilir ve Moskova'nın gece boyunca Ukrayna insansız hava araçlarını vurduğu yönündeki açıklaması bu okumayı destekler.", "en": "Three interceptions on three consecutive days is a result at the drill level: the chain of warning, identification and engagement is working. But the target at the end of that chain is cheap and replaceable. An interception therefore demonstrates a capability more than it imposes a cost on the other side. Another explanation cannot be ruled out: the violations may come from spillover of strikes against Ukrainian targets or from navigation error, and Moscow's account of hitting Ukrainian drones through the night supports that reading.", "refs": ["romania"]}]}, {"h": {"tr": "Maliyet nereye yükleniyor", "en": "Where the cost lands"}, "ps": [{"tr": "Bükreş'in yanıtı iki katmanlı. Askerî katmanda hat savunuluyor. Siyasi katmanda ise Dışişleri Bakanı Oana Toiu tekrarlanan ihlaller nedeniyle Rusya büyükelçisini bakanlığa çağırdı; ABD Kara Kuvvetleri Albayı Martin O'Donnell ihlallerin sürmesini kabul edilemez ve tahammül edilemez buldu; NATO Genel Sekreteri Mark Rutte Moskova'nın davranışını hepimiz için tehlike olarak niteledi. Bunların hiçbiri gönderen tarafa ölçülebilir bir masraf çıkarmıyor.", "en": "Bucharest's answer has two layers. On the military layer the line is defended. On the political layer Foreign Minister Oana Toiu summoned Russia's ambassador over the repeated violations; US Army Colonel Martin O'Donnell called the continued violations unacceptable and intolerable; NATO Secretary-General Mark Rutte described Moscow's conduct as a danger to us all. None of that produces a measurable expense for the party doing the launching.", "refs": ["romania"]}, {"tr": "Bu yüzden sınırlı ve tekrarlanan müdahalenin bir sınır mı öğrettiği yoksa ihlali olağanlaştırdığı mı sorusu açık kalıyor ve yanıtı gönderme sıklığı verecek. Gözlenecek işaret, düşürme haberlerinin sayısı değil: Romanya'nın angajman kurallarını kalıcı biçimde değiştirdiğini duyurması ya da müttefiklerin ülkeye ek hava savunma unsuru konuşlandırması, savunmanın maliyetinin taşındığı anlamına gelir. Ekim sonuna kadar bu iki adımdan biri atılmaz ve ihlaller sürerse, üç günlük başarı bir caydırıcılık değişikliği olarak sayılamaz.", "en": "The question of whether limited, repeated interception teaches a limit or normalises the violation therefore stays open, and the rate of launches will answer it. The sign to watch is not the count of interception reports: a Romanian announcement of a durable change to its rules of engagement, or the deployment of additional allied air-defence assets to the country, would mean the cost of defending has been shifted. If neither step is taken by the end of October and the violations continue, the three-day success cannot be counted as a change in deterrence.", "refs": ["romania"]}]}], "sources": [{"key": "romania", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/romania-summons-russian-envoy-as-it-shoots-down-third-intruding-drone", "title": {"tr": "Romanya üç günde üçüncü insansız hava aracını düşürdü, Rus büyükelçiyi bakanlığa çağırdı", "en": "Romania downs a third drone in three days and summons Russia's ambassador"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-04", "title": {"tr": "Yakıt, ödeme ve uçuş aynı anda kesilince", "en": "When fuel, payment and flights are cut at once"}, "excerpt": {"tr": "Küba'ya uygulanan petrol ambargosu 29 Ocak'tan bu yana yürürlükte. Aynı dönemde Visa ve Mastercard ödeme hattını, Air Canada ile Air France uçuşları, Meliá otel kapasitesini geri çekti. Bir ambargonun ısırıp ısırmadığını belirleyen şey ilanı değil, yakıt, ödeme ve ulaşımın aynı anda kapanıp kapanmadığıdır.", "en": "The oil embargo on Cuba has been in force since 29 January. Over the same period Visa and Mastercard withdrew the payment channel, Air Canada and Air France withdrew flights, and Meliá withdrew hotel capacity. What decides whether an embargo bites is the simultaneous closing of fuel, payment and transport, rather than the announcement itself."}, "sections": [{"h": {"tr": "Üç kanal, tek ada", "en": "Three channels, one island"}, "ps": [{"tr": "Washington 29 Ocak 2026'da Küba'ya petrol ambargosu uyguladı. Al Jazeera'nın aktardığına göre o tarihten bu yana günde 20 saati aşan elektrik kesintileri yaşanıyor; çalışma günleri kısaldı, sanayi üretimi durdu, su ve ilaç sıkıntısı derinleşti. Aynı haberde Visa, Mastercard, Meliá otelleri, Air Canada ve Air France'ın ülkeden çekildiği bildiriliyor.", "en": "Washington imposed an oil embargo on Cuba on 29 January 2026. Al Jazeera reports that since then blackouts have exceeded 20 hours a day, working days have been shortened, industrial production has stopped, and shortages of water and medicine have deepened. The same report records the withdrawal of Visa, Mastercard, the Meliá hotel group, Air Canada and Air France.", "refs": ["cuba"]}, {"tr": "Bu liste tek bir yaptırım kalemi değil, üç ayrı halkadır. Petrol, üretimin girdisidir. Kart ağları, turizmden ve havalelerden gelen dövizin geçiş noktasıdır. Havayolları ve otel kapasitesi ise o dövizi getiren yolcuyu taşır. Üçü aynı anda kapandığında ada, birini ikame etmek için gereken parayı diğerinden elde edemez hâle gelir.", "en": "That list covers three separate links rather than a single sanctions line item. Oil is the input to production. The card networks are the crossing point for the hard currency that comes from tourism and remittances. Airlines and hotel capacity carry the passengers who bring that currency in. When all three close at once, the island can no longer earn from one what it needs to substitute for another.", "refs": ["cuba"]}]}, {"h": {"tr": "İkamenin çalışmadığı yer", "en": "Where substitution fails"}, "ps": [{"tr": "Kara sınırı olan bir ülkede kısıtlanan mal komşudan dolanır; maliyet artar, akış sürer. Adada bu dolanma yolu deniz ve hava taşımacılığından geçer ve her ikisi de sigortacı, kart ağı ve tarifeli sefer gerektirir. Yani ambargoyu etkili kılan, malın yasaklanmış olması değil finansman, sigorta ve fiziki hattın aynı anda denetlenmesidir. Karşı okuma yabana atılamaz: Küba'nın elektrik altyapısı ambargodan önce de arızalıydı ve mevcut kaynaklar, kesintilerin ne kadarının eskimiş santrallerden ne kadarının yakıt yokluğundan geldiğini ayıracak veriyi vermiyor.", "en": "In a country with a land border, a restricted good detours through a neighbour; cost rises and the flow continues. On an island that detour runs through sea and air transport, and both require an insurer, a card network and a scheduled service. What makes the embargo effective, then, is the joint control of finance, insurance and the physical route, rather than the prohibition of a good. The counter-reading cannot be waved away: Cuba's electricity infrastructure was already failing before the embargo, and the available sources do not separate how much of the outage time comes from ageing plants and how much from the absence of fuel.", "refs": ["cuba"]}, {"tr": "Ölçülebilir tek büyüklük şimdilik günlük kesinti süresi. Küba yeni bir yakıt tedarik anlaşması duyurur ya da bir kart ağı hizmetini yeniden açarsa, bu sürenin aralık bitmeden günde 20 saatin altına inmesi beklenir; üç halkadan hiçbiri açılmadığı hâlde süre kalıcı olarak gerilerse, kesintilerin ana nedeninin yakıt olmadığı sonucu çıkar. Devlet Başkanı Miguel Diaz-Canel'in Pinar del Rio'da ABD'yi soykırım politikasıyla suçlaması ise bu mekanizmayı değiştirmez; siyasi bir konumu kaydeder.", "en": "The one measurable quantity for now is daily outage time. If Cuba announces a new fuel supply agreement or a card network restores service, that time should fall below 20 hours a day before the end of December; if it declines durably while none of the three links reopens, the main driver of the outages is not fuel. President Miguel Díaz-Canel's accusation in Pinar del Río that the United States is pursuing a policy of genocide does not change this mechanism; it registers a political position.", "refs": ["cuba"]}]}], "sources": [{"key": "cuba", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/cuban-president-accuses-us-of-genocide-seeking-takeover", "title": {"tr": "Küba Devlet Başkanı, ABD'yi soykırım politikası izlemekle suçladı", "en": "Cuba's president accuses the US of pursuing a policy of genocide"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-05", "title": {"tr": "Af ABD'de geçerli, dava Tegucigalpa'da", "en": "The pardon holds in Washington; the case sits in Tegucigalpa"}, "excerpt": {"tr": "Juan Orlando Hernandez pazar günü Honduras'a döndü ve gözaltına alınmadı. Bunu belirleyen, Trump'ın aralık ayındaki affı değil; haziranda Honduras'ta yakalama kararının askıya alınmasıydı. Kararı veren merci ile 3 Ağustos'ta yargılamayı yürütecek merci aynı ülkenin kurumları.", "en": "Juan Orlando Hernández returned to Honduras on Sunday and was not detained. What decided that was not Trump's pardon in December but the suspension of an arrest warrant in Honduras in June. The body that took that decision and the body that will run the trial on 3 August belong to the same country's institutions."}, "sections": [{"h": {"tr": "Havalimanındaki kararın sahibi", "en": "Who owns the decision at the airport"}, "ps": [{"tr": "Hernandez, ABD'ye iade edilmesinin üzerinden dört yıl geçtikten sonra ülkesine döndü. ABD'de uyuşturucu kaçakçılığından 45 yıl hapis cezası almıştı; Trump Aralık 2025'te af çıkarırken adil yargılanmadığını ve Joe Biden yönetimince tuzağa düşürüldüğünü savundu. Al Jazeera'ya göre haziran 2026'da yakalama kararı askıya alındığı için Hernandez ülkeye girişte gözaltına alınmadı.", "en": "Hernández returned four years after his extradition to the United States. He had been sentenced there to 45 years for drug trafficking; in pardoning him in December 2025 Trump argued that he did not receive a fair trial and had been set up by Joe Biden's administration. Al Jazeera reports that because an arrest warrant was suspended in June 2026, Hernández was not detained on arrival.", "refs": ["honduras"]}, {"tr": "Af, ABD'deki mahkûmiyeti ortadan kaldırır ve orada biter. Honduras'ta ne olacağını belirleyen ise ulusal bir yargı kararıydı. Bu ayrımı vurgulamak gerekiyor; çünkü olay çoğunlukla Washington'ın bir hamlesi olarak okunuyor. Oysa uçaktan inen kişinin serbest yürüyebilmesini sağlayan işlem, dört ay önce Tegucigalpa'da alınmıştı. Elbette bu, dış etkinin yokluğu anlamına gelmez; affın yarattığı siyasi ortam yerel kararın hazırlayıcısı olabilir. Ancak yetkiyi kullanan merci yerel kaldı.", "en": "A pardon extinguishes the conviction in the United States and stops there. What happens in Honduras was settled by
