<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  .podcast-label{
    display:none;flex:0 0 auto;color:var(--muted);font-size:.58rem;font-weight:800;
    letter-spacing:.06em;line-height:1;text-transform:uppercase;white-space:nowrap;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    .podcast-label{display:inline-flex}
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .edition-symbol{display:inline;margin-inline-start:.3em}.edition-text{display:inline}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writer-intro-copy{min-width:0}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .radar-stamp{display:block;margin-top:5px;color:var(--muted);font-size:.64rem;
    line-height:1.25;letter-spacing:.02em}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: a full-width shell with a readable prose measure. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .article-prose{max-width:72ch;margin-inline:auto}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(100px,1fr) 140px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;

    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:5px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:140px;min-width:0;

    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .edition-btn .edition-symbol{display:inline;margin-inline-start:0}.edition-btn .edition-text{display:none}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}

  }
  @media(min-width:501px) and (max-width:640px){
    #briefsSection .section-title .podcast-bar{max-width:250px}

      display:inline-flex;font-size:.52rem;letter-spacing:.035em;
    }
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }
    .topic-btn svg{width:14px;height:14px}

am, which includes senior adviser Aryeh Lightstone, is pushing Israel to stop striking the territory as it advances the decommissioning agreement. Trump announced the agreement late on Thursday; it calls for Israel to cease military operations and for Hamas and its allies to halt all militant activity. After the text was released Israel said it had \"serious security concerns\" and had shared them with the United States, and local health officials said 17 people were killed in strikes overnight from Saturday into Sunday. No airstrikes were reported in Gaza on Monday. Israeli attacks have killed 1,250 people since the ceasefire reached in October. The Gaza Health Ministry puts the total killed in Israel's military offensive at 73,375.", "tr": "AP'nin PBS NewsHour'da yayımlanan 3 Ağustos tarihli haberine göre Barış Kurulu, açıklamasında hedefi şöyle tanımladı: \"Amaç açıktır ve tartışma konusu değildir: Şerit'teki silahların tümüyle etkisizleştirilmesi ve silah zoruyla yönetimden sivil yönetime geçiş.\" Görüşmeye vâkıf iki kişiye dayandırılan bilgiye göre Mladenov, Netanyahu'ya Gazze'deki hava saldırılarının durdurulması çağrısında da bulundu; kıdemli danışman Aryeh Lightstone'un da yer aldığı ekip, silahların etkisizleştirilmesi anlaşmasını ilerletirken İsrail'e saldırıları durdurması yönünde baskı yapıyor. Anlaşmayı perşembe akşamı Donald Trump duyurmuştu; metin İsrail'in askerî operasyonlarını durdurmasını, Hamas ile müttefiklerinin ise silahlı faaliyeti sonlandırmasını öngörüyor. Metnin yayımlanmasının ardından İsrail \"ciddi güvenlik endişeleri\" bulunduğunu ve bunları ABD'yle paylaştığını bildirdi; yerel sağlık yetkililerine göre cumartesiyi pazara bağlayan gece Gazze'deki saldırılarda 17 kişi öldü. Pazartesi günü Gazze'de hava saldırısı bildirilmedi. Ekimde varılan ateşkesten bu yana İsrail saldırılarında 1.250 kişi öldü. Gazze Sağlık Bakanlığı'na göre İsrail'in askerî harekâtında toplam 73.375 kişi hayatını kaybetti."}, "featured": true, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:06+00:00", "src": "PBS NewsHour", "summary": {"en": "The Associated Press reported that Nikolay Mladenov, the high representative of the Board of Peace overseeing Gaza's postwar transition, met Israeli Prime Minister Benjamin Netanyahu and his team on Monday. The board described the talks as \"constructive and detailed\".", "tr": "Associated Press'in haberine göre Gazze'nin savaş sonrası geçişini yürüten Barış Kurulu'nun yüksek temsilcisi Nikolay Mladenov, pazartesi günü İsrail Başbakanı Binyamin Netanyahu ve ekibiyle görüştü. Kurul görüşmeleri \"yapıcı ve ayrıntılı\" olarak nitelendirdi."}, "tag": "diplomacy", "title": {"en": "Board of Peace representative Mladenov meets Netanyahu on disarmament", "tr": "Barış Kurulu temsilcisi Mladenov, Netanyahu ile silahsızlandırmayı görüştü"}, "topic": "geopolitics", "url": "https://www.pbs.org/newshour/world/board-of-peace-envoy-meets-with-netanyahu-on-gaza-disarmament-deal-urges-halt-to-strikes", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The BBC's August 3 report said Spain estimates about 69,500 people have now returned to Morocco, above an initial estimate of 50,000. The official death toll stands at 72 on the Spanish side and 11 on the Moroccan side. In a letter to Spanish Prime Minister Pedro Sánchez, von der Leyen praised his \"swift handling\" of the crisis. EU interior ministers will take up the issue in emergency talks by video conference on Tuesday. The BBC reported that the scenes in Ceuta have strained relations among some of the EU's 27 member states.", "tr": "BBC'nin 3 Ağustos tarihli haberine göre İspanya, Fas'a dönenlerin sayısını yaklaşık 69.500 olarak tahmin ediyor; bu rakam ilk açıklanan 50 bin tahminini aşıyor. İspanya tarafındaki resmî ölü sayısı 72, Fas tarafında ise 11. Von der Leyen, İspanya Başbakanı Pedro Sánchez'e gönderdiği mektupta krizi \"hızlı biçimde ele alışını\" övdü. AB içişleri bakanları konuyu salı günü video konferansla yapılacak acil görüşmede ele alacak. BBC, Ceuta'daki görüntülerin AB'nin 27 üyesinden bazılarının arasındaki ilişkileri gerdiğini bildirdi."}, "featured": true, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:06+00:00", "src": "BBC News", "summary": {"en": "The BBC reported that European Commission President Ursula von der Leyen called for \"united action\" on border security after last week's mass crossing from Morocco into the Spanish enclave of Ceuta. EU interior ministers will hold emergency talks by video conference on Tuesday.", "tr": "BBC'ye göre Avrupa Komisyonu Başkanı Ursula von der Leyen, geçen hafta Fas'tan İspanya'nın Ceuta kentine yaşanan kitlesel geçişin ardından sınır güvenliğinde \"ortak hareket\" çağrısı yaptı. AB içişleri bakanları salı günü acil olarak video konferansla toplanacak."}, "tag": "security", "title": {"en": "Von der Leyen calls for \"united action\" on border security after Ceuta", "tr": "Von der Leyen, Ceuta'nın ardından sınır güvenliğinde \"ortak hareket\" istedi"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/cyvl84zmgyro", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The Kyiv Post reported on August 3 that Zaluzhny told a session on Euro-Atlantic integration: \"I know NATO very well. For roughly 12 years I've personally worked on mastering NATO standards, and every year I've listened to the same fairy tale that we're about to join.\" He then added: \"Unfortunately, we never will.\" In his account the core obstacle is a mismatch between the two militaries: Ukraine's armed forces have reached a level of development that cannot be folded into an alliance still working to \"doctrines of the Second World War\". He argued that Ukraine would first have to close the gap with member states' military standards, and that even then it would reach only about half the current strength of Russia's forces. He nonetheless said Ukraine needs technologies \"that are still in NATO countries today\", singling out anti-ballistic systems and additional space capabilities. As alternatives he pointed to a possible \"European security bloc\" and to the Joint Expeditionary Force, led by ten Northern European countries, in which Ukraine became the first non-member to gain enhanced partner status on November 5, 2025. Citing European Pravda, the Kyiv Post noted that the framework does not currently carry a mutual-defence obligation among its members.", "tr": "Kyiv Post'un 3 Ağustos tarihli haberine göre Zalujni, Euro-Atlantik bütünleşme oturumunda şunları söyledi: \"NATO'yu çok iyi biliyorum. Yaklaşık 12 yıl boyunca NATO standartlarını öğrenmek için bizzat çalıştım ve her yıl aynı masalı dinledim: Neredeyse katılıyoruz.\" Ardından \"Ne yazık ki hiçbir zaman katılmayacağız\" dedi. Zalujni'ye göre temel engel iki ordu arasındaki uyumsuzluk; Ukrayna Silahlı Kuvvetleri, hâlâ \"İkinci Dünya Savaşı doktrinleriyle\" işleyen bir ittifaka eklemlenemeyecek bir gelişmişlik düzeyine ulaştı. Ukrayna'nın önce üye devletlerin askerî standartlarıyla arasındaki farkı kapatması gerektiğini, bunu başarsa bile ancak Rusya ordusunun bugünkü gücünün yaklaşık yarısına ulaşacağını savundu. Buna karşın Ukrayna'nın \"bugün NATO ülkelerinde bulunan teknolojilere\", özellikle balistik füze savunma sistemlerine ve ek uzay kabiliyetlerine ihtiyaç duyduğunu söyledi. Alternatif olarak muhtemel bir \"Avrupa güvenlik bloku\"nu ve Ukrayna'nın 5 Kasım 2025'te ittifak dışından ilk gelişmiş ortak statüsü aldığı, on Kuzey Avrupa ülkesinin yürüttüğü Ortak Seferî Kuvvet'i işaret etti. Kyiv Post, European Pravda'ya dayanarak bu çerçevenin üyeler arasında karşılıklı savunma yükümlülüğü içermediğini aktardı."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:06+00:00", "src": "Kyiv Post", "summary": {"en": "The Kyiv Post reported that Valery Zaluzhny, Ukraine's former commander-in-chief and now ambassador to the United Kingdom, told a gathering of ambassadors in Kyiv that his country would not become a NATO member and urged Kyiv to look for security guarantees in other frameworks.", "tr": "Kyiv Post'a göre Ukrayna'nın eski Genelkurmay Başkanı ve Londra Büyükelçisi Valeriy Zalujni, Kiev'deki büyükelçiler toplantısında ülkesinin NATO üyesi olmayacağını söyledi ve güvenlik garantilerinin başka çerçevelerde aranmasını önerdi."}, "tag": "diplomacy", "title": {"en": "Zaluzhny says Ukraine will never join NATO", "tr": "Zalujni, Ukrayna'nın NATO'ya hiçbir zaman katılmayacağını söyledi"}, "topic": "geopolitics", "url": "https://www.kyivpost.com/post/81654", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The National's August 3 report said Defence Minister Israel Katz, a senior Likud figure, made the announcement on a talk show on the right-wing Channel 14. The trigger was Bluth's renewal of a restraining order against Tal Yinon Dardik, a settler suspected of sexually abusing a Palestinian man in Khirbet Humsa and accused of other attacks; Dardik lives in an illegal outpost in Area B, which is supposed to be under Palestinian civil control. The military responded that \"the chief of staff has no intention of replacing commanders in key positions during this sensitive period\". Katz later denied that he had announced a dismissal, calling that \"a complete lie, part of a political campaign directed against the government\". Yair Golan of the Democrats called the move \"a crossing of a red line that proves that this destructive government has lost all restraint\"; former prime minister Naftali Bennett called it \"a crazy step\"; and former defence minister Yoav Gallant called it \"a contemptible act\". Settlement leaders, by contrast, backed Bluth, with the mayor of Beit El citing his role in establishing 104 settlements.", "tr": "The National'ın 3 Ağustos tarihli haberine göre Likud'un kıdemli isimlerinden Savunma Bakanı Israel Katz, duyuruyu sağ eğilimli Channel 14'teki bir tartışma programında yaptı. Adımın gerekçesi, Bluth'un Hirbet Humsa'da bir Filistinliye cinsel istismarda bulunduğundan şüphelenilen ve başka saldırılara karıştığı ileri sürülen yerleşimci Tal Yinon Dardik hakkındaki uzaklaştırma kararını yenilemesiydi; Dardik, Filistin sivil yönetimi altında olması gereken B Bölgesi'nde yasa dışı bir yerleşim biriminde yaşıyor. Ordu, \"genelkurmay başkanının bu hassas dönemde kilit görevlerdeki komutanları değiştirme niyeti bulunmadığı\" açıklamasını yaptı. Katz daha sonra görevden alma duyurusu yaptığını yalanlayarak bunu \"tümüyle yalan, hükümete yönelik siyasi bir kampanyanın parçası\" olarak niteledi. Demokratlar'dan Yair Golan adımı \"bu yıkıcı hükümetin bütün ölçüyü yitirdiğini kanıtlayan bir kırmızı çizgi ihlali\", eski Başbakan Naftali Bennett \"çılgınca bir adım\", eski Savunma Bakanı Yoav Gallant ise \"aşağılık bir davranış\" olarak değerlendirdi. Yerleşim yönetimlerinden gelen tepki ise Bluth'u destekler yöndeydi; Beit El Belediye Başkanı, Bluth'un 104 yerleşim biriminin kurulmasındaki rolüne dikkat çekti."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:06+00:00", "src": "The National", "summary": {"en": "The National reported that Israeli Defence Minister Israel Katz announced on a television programme that he would replace Maj Gen Avi Bluth, head of Central Command and responsible for the occupied West Bank, with Maj Gen Dado Bar Kalifa. The military said no change of commanders was planned.", "tr": "The National'a göre İsrail Savunma Bakanı Israel Katz, işgal altındaki Batı Şeria'dan sorumlu Merkez Komutanlığı Komutanı Tümgeneral Avi Bluth'un yerine Tümgeneral Dado Bar Kalifa'yı getireceğini bir televizyon programında açıkladı. Ordu, komutanların değiştirilmesinin gündemde olmadığını bildirdi."}, "tag": "security", "title": {"en": "Katz announces the removal of his Central Command chief on live television", "tr": "Katz, Merkez Komutanlığı komutanını canlı yayında görevden aldığını duyurdu"}, "topic": "geopolitics", "url": "https://www.thenationalnews.com/news/mena/2026/08/03/uproar-in-israel-after-defence-minister-dismisses-pro-settlement-general-on-live-tv/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The BBC's August 3 report said governor Veniamin Kondratyev put the number of injured at 40, with 17 taken to hospital. In social media footage verified by the BBC, a drone is seen racing towards a cliffside before crashing into a fireball on the beach below as tourists watch from the shore and from the water. What the drone was targeting is unclear. Some Ukrainian Telegram channels claimed it came down because electronic warfare had jammed its signal. Several eyewitnesses quoted by Russian media said they heard gunfire before the explosion, which could indicate that air defences had tried to shoot it down. Residents and tourists in Arkhipo-Osipovka told local outlets that no sirens sounded before the strike. Both sides deny deliberately targeting civilians. The BBC reported that over the past year Ukraine has had increasing success with long-range strikes deep inside Russia, hitting energy infrastructure and commercial warehouses it says are used for military purposes, and that eight people were killed in such strikes in different Russian cities at the weekend. On Saturday, Ukrainian President Volodymyr Zelensky said at least nine people were killed in Russian ballistic missile strikes on Kyiv.", "tr": "BBC'nin 3 Ağustos tarihli haberine göre Vali Veniamin Kondratyev yaralı sayısının 40'a ulaştığını, 17 kişinin hastaneye kaldırıldığını bildirdi. BBC'nin doğruladığı sosyal medya görüntülerinde bir insansız hava aracının bir yamaca doğru hızla ilerledikten sonra aşağıdaki sahile düşerek alev topuna dönüştüğü, turistlerin kıyıdan ve sudan olanları izlediği görülüyor. Aracın neyi hedeflediği belirsiz. Bazı Ukrayna Telegram kanalları, aracın sinyalini bozan elektronik harp nedeniyle düştüğünü ileri sürdü. Rus basınına konuşan çeşitli görgü tanıkları ise patlamadan önce silah sesleri duyduklarını, bunun hava savunmasının aracı düşürmeye çalıştığına işaret edebileceğini söyledi. Arhipo-Osipovka sakinleri ve turistler yerel yayın organlarına saldırı öncesinde siren çalmadığını aktardı. İki taraf da sivilleri kasten hedef aldığını reddediyor. BBC, Ukrayna'nın son bir yılda Rusya derinliklerine uzun menzilli saldırılarda giderek başarılı olduğunu, enerji altyapısını ve askerî amaçla kullanıldığını söylediği ticari depoları vurduğunu, bu saldırılarda hafta sonu farklı Rus kentlerinde sekiz kişinin öldüğünü bildirdi. Cumartesi günü Kiev'e düzenlenen balistik füze saldırılarında ise Ukrayna Devlet Başkanı Volodimir Zelenski'ye göre en az dokuz kişi öldü."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T08:11:06+00:00", "src": "BBC News", "summary": {"en": "The BBC reported that seven people, three of them children, were killed when a drone came down on a crowded beach near the Black Sea village of Arkhipo-Osipovka in Russia. Krasnodar governor Veniamin Kondratyev accused Ukraine of \"a deliberate strike on civilians\"; Kyiv did not comment.", "tr": "BBC'ye göre Rusya'nın Karadeniz kıyısındaki Arhipo-Osipovka köyü yakınlarında kalabalık bir sahile düşen insansız hava aracında üçü çocuk yedi kişi öldü. Krasnodar Valisi Veniamin Kondratyev Ukrayna'yı \"sivillere kasıtlı saldırı\" ile suçladı; Kiev açıklama yapmadı."}, "tag": "conflict", "title": {"en": "Krasnodar governor says seven died when a drone came down on a crowded beach", "tr": "Krasnodar valisi, kalabalık bir sahile düşen insansız hava aracında 7 kişinin öldüğünü bildirdi"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/cr7kmnyrdn7o", "editionDate": "2026-08-04"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "The Guardian", "url": "https://www.theguardian.com/uk-news/2026/aug/03/judge-orders-return-of-alleged-victim-of-trafficking-sent-to-france-under-one-in-one-out-scheme", "publishedDate": "2026-08-03", "date": {"tr": "3 Ağu", "en": "Aug 3"}, "title": {"tr": "İngiliz yargıç, Fransa'ya gönderilen insan ticareti mağduru başvurucunun geri getirilmesini emretti", "en": "UK judge orders the return of a trafficking claimant sent to France"}, "summary": {"tr": "The Guardian'a göre Yüksek Mahkeme, Birleşik Krallık–Fransa düzenlemesi kapsamında Fransa'ya gönderilen insan ticareti mağduru bir başvurucunun Birleşik Krallık'a geri getirilmesini emretti.", "en": "The Guardian reported that the High Court ordered the UK government to return a trafficking claimant who had been sent to France under the bilateral migration arrangement."}, "detail": {"tr": "The Guardian'ın 3 Ağustos tarihli haberine göre Yargıç Sheldon, İçişleri Bakanlığının insan ticareti mağduru olabileceğini belirten sığınmacıların ilk olumsuz kararın yeniden değerlendirilmesini isteme hakkını kaldıran politika değişikliğini iptal etti. Mahkeme, Kasım 2025'te Fransa'ya gönderilen Sudanlı başvurucunun Birleşik Krallık'a geri getirilmesine hükmetti; başvurucunun insan ticareti mağduru olabileceğine ilişkin makul gerekçeler saptanmıştı. Davadaki ikinci bir başvurucunun dosyası Fransa'da yeniden değerlendirilecek. Mahkeme, hem İçişleri Bakanlığına hem de başvuruculara kararın çeşitli bölümleri için temyiz izni verdi.", "en": "The Guardian reported on August 3 that Mr Justice Sheldon quashed a Home Office policy change that removed asylum seekers' ability to request reconsideration after an initial negative trafficking decision. The court ordered the return to the United Kingdom of a Sudanese claimant who had been sent to France in November 2025 and for whom reasonable grounds of trafficking had been identified. A second claimant's case will be reconsidered in France. The court granted both the Home Office and the claimants permission to appeal on various parts of the judgment."}, "radarPublishedAt": "2026-08- g 3", "tr": "3 Ağu"}, "detail": {"en": "France 24 reported on August 3 that the ruling follows France's decision last week to expel the 45-year-old Fedorova and freeze her assets, a move she called \"censorship\". The Paris administrative court said Fedorova, a former journalist for Russia's state-run RT channel, had failed to show that being ordered to leave France would carry \"serious personal consequences\". Her lawyer, Emmanuel Piwnica, told AFP that his client was abroad when the order was issued and would not return unless it was suspended or overturned. Interior Minister Laurent Nunez accused her of relaying Russian propaganda to undermine \"the fundamental interests of the nation\", while Foreign Minister Jean-Noel Barrot described her as an \"agent of influence\". Fedorova formerly headed RT's French arm, a channel banned in France after Russia invaded Ukraine in 2022. She now works as a commentator for outlets in Vincent Bollore's media stable, including the CNews television channel. France 24 noted that officials raised the alarm about her influence as France faces elections next year.", "tr": "France 24'ün 3 Ağustos tarihli haberine göre karar, Fransa'nın geçen hafta 45 yaşındaki Fedorova'yı sınır dışı etme ve malvarlığını dondurma kararının ardından geldi; Fedorova bu adımı \"sansür\" olarak nitelemişti. Paris idare mahkemesi, Rusya'nın devlet kanalı RT'nin eski gazetecisi olan Fedorova'nın ülkeyi terke davet edilmesinin \"ciddi kişisel sonuçlar\" doğuracağını ortaya koyamadığını belirtti. Avukatı Emmanuel Piwnica AFP'ye, müvekkilinin karar çıktığında yurt dışında bulunduğunu, karar askıya alınmadıkça veya bozulmadıkça Fransa'ya dönmeyeceğini söyledi. İçişleri Bakanı Laurent Nuñez, Fedorova'yı \"ulusun temel çıkarlarını\" zayıflatmak üzere Rus propagandası aktarmakla suçladı; Dışişleri Bakanı Jean-Noël Barrot ise onu \"nüfuz ajanı\" olarak niteledi. Fedorova, RT'nin Fransa kolunun eski yöneticisiydi; kanal, Rusya'nın 2022'de Ukrayna'yı işgalinin ardınd long sea lanes between arid coasts towards an open threshold formed from water and light"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}, {"id": "geopolitics-two-white-house-agendas", "topic": "geopolitics", "title": {"tr": "Beyaz Saray'da iki ayrı güvenlik gündemi", "en": "Two separate security agendas at the White House"}, "summary": {"tr": "Trump'ın aynı gün Zelenski ve Netanyahu ile yaptığı kapalı görüşmeler olumlu tanımlandı; ancak biri Ukrayna'nın hava savunması ve barış görüşmelerine, diğeri İran ile bölgesel eşgüdüme odaklandı.", "en": "Trump's closed meetings with Zelenskyy and Netanyahu were described positively, but one focused on Ukraine's air defence and peace talks while the other centred on Iran and regional coordination."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/geopolitics-two-white-house-agendas-1280.7fb0194a96aa.webp", "variants": [{"src": "/assets/briefs/2026-07-29/geopolitics-two-white-house-agendas-640.e82d30229aa4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/geopolitics-two-white-house-agendas-1280.7fb0194a96aa.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Aydınlık resmî bir salonda iki ayrı malzeme yolunu sırayla yönlendiren pirinç zemin menteşesi illüstrasyonu", "en": "Illustration of a brass floor hinge sequentially redirecting two distinct material paths in a luminous formal hall"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}, {"id": "geopolitics-migration-protection-thresholds", "topic": "geopolitics", "title": {"tr": "Göç korumasında tanıma eşiği", "en": "The recognition threshold in migration protection"}, "summary": {"tr": "Malezya, BMMYK'nın mülteci belgelendirmesindeki rolünü sorgularken IOM, dolandırıcılık merkezlerine kaçırılanların suçlu değil, korunması gereken insan ticareti mağdurları olarak tanınmasını istedi.", "en": "Malaysia questioned UNHCR's role in refugee documentation as IOM urged authorities to recognise people trafficked into scam centres as victims needing protection, not criminals."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/geopolitics-migration-protection-thresholds-1280.5f0264970c43.webp", "variants": [{"src": "/assets/briefs/2026-07-29/geopolitics-migration-protection-thresholds-640.9a050de11478.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/geopolitics-migration-protection-thresholds-1280.5f0264970c43.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Yolcuların boş daraltıcı bölmelerin üzerinden aydınlık bir koruma avlusuna geçtiği kesit illüstrasyonu", "en": "Cutaway illustration of travellers crossing above empty constricting bays into a luminous protection atrium"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}], "articles": [{"excerpt": {"en": "Israel's Supreme Court heard a challenge on Monday to the legislation barring UNRWA from operating in the country. What the court will settle is the footing UNRWA's mandate can hold inside Israel's jurisdiction, a narrower question than the mandate itself. The place where aid actually runs into trouble is elsewhere.", "tr": "İsrail Yüksek Mahkemesi pazartesi günü UNRWA'yı ülkede faaliyetten meneden mevzuata yapılan itirazı dinledi. Mahkemenin karara bağlayacağı şey, UNRWA'nın görevinin İsrail'in yargı yetkisi içinde hangi dayanağa tutunabileceği; bu, görevin kendisinden daha dar bir soru. Yardımın fiilen zorlandığı yer ise başka."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The instrument in front of the court", "tr": "Mahkemenin önünde duran araç"}, "ps": [{"en": "Al Jazeera reported that Israel's Supreme Court on Monday heard arguments against the legislation barring UNRWA from operating in Israel. Supporters of the ban said the laws were necessary for national security. Rights advocates said the ban would jeopardise access to aid and basic services for millions of Palestinians. That same report does not name the petitioning organisation, set out the justices' assessments, or give a timetable for a ruling.", "refs": ["unrwa-court"], "tr": "Al Jazeera'nın aktardığına göre İsrail Yüksek Mahkemesi pazartesi günü, UNRWA'nın İsrail'de faaliyet göstermesini yasaklayan mevzuata karşı ileri sürülen savları dinledi. Yasağı destekleyenler mevzuatı ulusal güvenlik bakımından gerekli gördüklerini söyledi. Hak savunucuları ise yasağın milyonlarca Filistinlinin yardıma ve temel hizmetlere erişimini tehlikeye attığını savundu. Aynı haberde başvurucu kuruluşun adı, yargıçların değerlendirmeleri ve karar takvimi yer almıyor."}, {"en": "In the UNRWA case the two arguments are not measuring the same thing. The national-security case rests on a state's authority to decide which body may hold legal presence on its own territory, and inside Israel's jurisdiction that authority operates without dispute. The access case measures the services the agency delivers to Palestinians, and the weight of those services sits outside Israel's borders. The instrument before the court is a domestic law governing an organisation's presence within the country. It is not a text that governs delivery, and that is where the limit of any ruling is drawn.", "refs": ["unrwa-court"], "tr": "UNRWA davasında iki savın ölçtüğü şey aynı değil. Ulusal güvenlik gerekçesi, bir devletin kendi ülkesinde hangi kuruluşun tüzel varlık taşıyacağına karar verme yetkisine dayanıyor ve bu yetki İsrail'in yargı alanı içinde tartışmasız işliyor. Erişim gerekçesi ise ajansın Filistinlilere ulaştırdığı hizmetleri ölçüyor; o hizmetlerin ağırlığı İsrail sınırlarının dışında duruyor. Mahkemenin önündeki araç, bir kuruluşun ülke içindeki varlığını düzenleyen bir iç hukuk metni. Erişimi doğrudan düzenleyen bir metin değil ve kararın ne yapabileceğinin sınırı da burada çiziliyor."}]}, {"h": {"en": "Where the service actually runs into trouble", "tr": "Hizmetin fiilen zorlandığı yer"}, "ps": [{"en": "The United Nations noon briefing given the same day shows where the service in question is under strain. Deputy Spokesman Farhan Haq said air strikes, shelling and shooting continued across Gaza over the weekend. The Ministry of Health documented more than 150 fatalities in July, the highest monthly toll reported since the beginning of the year.", "refs": ["un-gaza"], "tr": "Birleşmiş Milletler'in aynı gün yaptığı öğle brifingi, tartışılan hizmetin nerede zorlandığını gösteriyor. Sözcü Yardımcısı Farhan Haq'ın aktardığına göre Gazze'de hafta sonu boyunca hava saldırıları, top ateşi ve silahlı saldırılar sürdü. Sağlık Bakanlığı temmuz ayında 150'den fazla ölüm bildirdi ve bu, yılbaşından bu yana bildirilen en yüksek aylık sayı oldu."}, {"en": "What follows is this. A ruling will be decisive for the agency's legal presence in Israel and for the contact points that depend on it, while what determines whether aid reaches Gaza is the continuation of strikes and the arrangements for entry. The counterargument deserves its weight. If UNRWA's logistics depend on registration, coordination and movement permits inside Israel, then upholding the ban could narrow access even so, with a lag. There is a signal that would test the distinction. If the court upholds the ban without interim relief, the thing to watch is whether UNRWA's share of distribution shifts in subsequent UN humanitarian reporting, rather than the language of the judgment.", "refs": ["unrwa-court", "un-gaza"], "tr": "Buradan şu çıkıyor: Karar, ajansın İsrail'deki tüzel varlığı ve buna bağlı temas noktaları üzerinde belirleyici olacak; yardımın Gazze'ye ulaşıp ulaşmadığını belirleyen değişkenler ise saldırıların sürmesi ve giriş düzenlemeleri. Karşı sav ihmal edilmemeli. UNRWA'nın lojistiği İsrail'deki tescil, koordinasyon ve geçiş izinlerine bağlıysa, yasağın onaylanması erişimi gecikmeli biçimde daraltıyor olabilir. Bu ayrımı sınayacak bir işaret var. Mahkeme yasağı geçici tedbir koymadan onaylarsa, izlenecek şey, kararın dili yerine sonraki BM insani raporlarında UNRWA'nın dağıtımdaki payının değişip değişmediği olacak."}]}], "sources": [{"key": "unrwa-court", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/3/israel-top-court-hears-challenge-to-unrwa-ban", "title": {"tr": "İsrail Yüksek Mahkemesi, UNRWA yasağına yapılan itirazı dinledi", "en": "Israel's top court hears the challenge to the UNRWA ban"}, "publishedDate": "2026-08-03"}, {"key": "un-gaza", "kind": "news", "name": "United Nations", "url": "https://press.un.org/en/2026/db260803.doc.htm", "title": {"tr": "BM, Sudan insani yardım çağrısının yüzde 40'ının karşılandığını bildirdi", "en": "The UN says Sudan's humanitarian appeal is just over 40 percent funded"}, "publishedDate": "2026-08-03"}], "title": {"en": "A statute can halt the service without altering the mandate", "tr": "Bir yasa hizmeti durdurabilir ama görev tanımını değiştiremez"}, "writer": "geo-01", "date": "2026-08-04"}, {"excerpt": {"en": "The Board of Peace's high representative met Netanyahu on Monday. The published text restates an aim both sides already profess, while the meeting's operative request appears not in the board's statement but in two unnamed sources.", "tr": "Barış Kurulu'nun yüksek temsilcisi pazartesi günü Netanyahu ile görüştü. Yayımlanan metin iki tarafın da zaten savunduğu bir amacı tekrar ediyor; görüşmenin asıl talebi ise kurulun açıklamasında değil, adı verilmeyen iki kaynakta duruyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "What the statement says and does not say", "tr": "Açıklamanın yazdığı ve yazmadığı"}, "ps": [{"en": "The Associated Press reported that Nikolay Mladenov, high representative of the Board of Peace overseeing Gaza's postwar transition, met Benjamin Netanyahu and his team on Monday. The board called the talks constructive and detailed, and set out the aim as the complete decommissioning of weapons in the Strip and a transition away from rule by the gun to civilian governance, adding that this goal was not in question.", "refs": ["bop-netanyahu"], "tr": "Associated Press'in haberine göre Gazze'nin savaş sonrası geçişini yürüten Barış Kurulu'nun yüksek temsilcisi Nikolay Mladenov, pazartesi günü Binyamin Netanyahu ve ekibiyle görüştü. Kurul görüşmeleri yapıcı ve ayrıntılı olarak nitelendirdi ve amacı, Şerit'teki silahların tümüyle etkisizleştirilmesi ve silah zoruyla yönetimden sivil yönetime geçiş olarak tanımladı; açıklamada bu amacın tartışma konusu olmadığı da belirtildi."}, {"en": "In one pan sits that sentence, carrying the board's signature. In the other sits the concrete request reported to have been made at the same meeting. That Mladenov asked Netanyahu to stop the strikes in Gaza comes not from the board's text but from two people familiar with the meeting. In diplomatic documents this difference is not trivial. The published sentence is a declaration of aim and commits neither party to anything today; the unpublished request is the only ask with a clock attached, and no institutional signature stands behind it. What exists is contact, not commitment.", "refs": ["bop-netanyahu"], "tr": "Bir kefede kurulun imzasını taşıyan bu cümle var; öbür kefede, aynı görüşmede dile getirildiği bildirilen somut talep. Mladenov'un Netanyahu'dan Gazze'deki saldırıları durdurmasını istediği bilgisi kurulun metninden değil, görüşmeye vâkıf iki kişiden geliyor. Diplomatik metinlerde bu fark önemsiz değil. Yayımlanan cümle bir amaç beyanı ve tarafların hiçbirini bugün bir şey yapmaya bağlamıyor; yayımlanmayan talep ise takvimi olan tek istek ve arkasında kurumsal bir imza yok. Elimizdeki, bir taahhüt değil bir temas."}]}, {"h": {"en": "The one observable that changed", "tr": "Değişen tek gözlenebilir"}, "ps": [{"en": "Donald Trump announced the agreement late on Thursday. The text called for Israel to cease its military operations and for Hamas and its allies to halt all militant activity. After it was released Israel said it had serious security concerns and had shared them with Washington, and it stepped up its strikes: local health officials said 17 people were killed overnight from Saturday into Sunday. On Monday no airstrikes were reported in Gaza. Israeli attacks have killed 1,250 people since the ceasefire reached in October.", "refs": ["bop-netanyahu"], "tr": "Anlaşmayı perşembe akşamı Donald Trump duyurmuştu. Metin İsrail'in askerî operasyonlarını durdurmasını, Hamas ile müttefiklerinin silahlı faaliyeti sonlandırmasını öngörüyordu. Metin yayımlandıktan sonra İsrail ciddi güvenlik endişeleri bulunduğunu ve bunları Washington'la paylaştığını bildirdi, saldırılarını da artırdı: Yerel sağlık yetkililerine göre cumartesiyi pazara bağlayan gece 17 kişi öldü. Pazartesi günü Gazze'de hava saldırısı bildirilmedi. Ekimdeki ateşkesten bu yana İsrail saldırılarında ölenlerin sayısı 1.250."}, {"en": "The one measurable thing that changed after the meeting is that single quiet day. It is early to call it an outcome. The same observation reads at least two ways: the board's request may have been met, or the day may simply have fallen into an ordinary gap between target lists and weather, and Israel's failure to withdraw its stated security concerns does not weaken that second reading. What separates the two is repetition, not rhetoric. If the next two days pass without strikes and Mladenov's request is this time written down under the board's own name, then something has been exchanged. A one-day gap remains a gap.", "refs": ["bop-netanyahu"], "tr": "Görüşmenin ardından değişen ölçülebilir tek şey bu tek günlük sessizlik. Bunu bir sonuç saymak için erken. Aynı gözlem en az iki biçimde okunabilir: Kurulun talebi karşılık bulmuş olabilir ya da hedef listesi ile hava durumu arasında sıradan bir aralığa denk gelinmiş olabilir; İsrail'in güvenlik endişelerine dair ifadesini geri almamış olması ikinci ihtimali zayıflatmıyor. Ayrımı yapacak olan da retorik değil, tekrar. Önümüzdeki iki gün saldırısız geçer ve Mladenov'un talebi bu kez kurulun kendi imzasıyla yazılırsa, ortada bir teati var demektir. Tek günlük bir aralık ise yalnızca bir aralıktır."}]}], "sources": [{"key": "bop-netanyahu", "kind": "news", "name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/board-of-peace-envoy-meets-with-netanyahu-on-gaza-disarmament-deal-urges-halt-to-strikes", "title": {"tr": "Barış Kurulu temsilcisi Mladenov, Netanyahu ile silahsızlandırmayı görüştü", "en": "Board of Peace representative Mladenov meets Netanyahu on disarmament"}, "publishedDate": "2026-08-03"}], "title": {"en": "The board's statement names the goal, and leaves out the actual request", "tr": "Kurulun açıklaması hedefi yazıyor, asıl talep açıklamada yok"}, "writer": "geo-02", "date": "2026-08-04"}, {"excerpt": {"en": "A drone that came down on a Black Sea beach killed seven people. Three observations — no warning, gunfire before the explosion, and no identifiable aimpoint — point to the terminal phase of a defensive engagement rather than to a chosen target.", "tr": "Karadeniz kıyısındaki bir sahile düşen insansız hava aracı yedi kişiyi öldürdü. Elimizdeki üç gözlem — uyarı yokluğu, patlamadan önceki silah sesi ve belirsiz hedef — bir nişan noktasına değil, savunma temasının son safhasına işaret ediyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "What is actually observable", "tr": "Elde ne var"}, "ps": [{"en": "The BBC reported that Krasnodar governor Veniamin Kondratyev said seven people, three of them children, were killed on the beach near Arkhipo-Osipovka, that the number of injured reached 40, and that 17 were taken to hospital. Krasnodar governor Veniamin Kondratyev accused Ukraine of a deliberate strike on civilians. Kyiv made no comment. Both sides deny deliberately targeting civilians.", "refs": ["beach-strike"], "tr": "BBC'nin haberine göre Krasnodar Valisi Veniamin Kondratyev, Arhipo-Osipovka yakınlarındaki sahilde üçü çocuk yedi kişinin öldüğünü, yaralı sayısının 40'a ulaştığını ve 17 kişinin hastaneye kaldırıldığını bildirdi. Vali, Ukrayna'yı sivillere yönelik kasıtlı bir saldırıyla suçladı. Kiev konuya ilişkin açıklama yapmadı. İki taraf da sivilleri kasten hedef aldığını reddediyor."}, {"en": "Three things can be counted. In footage verified by the BBC the drone travels towards a cliffside and then comes down on the beach below. Eyewitnesses quoted by Russian media say they heard gunfire before the explosion, which may indicate that air defences tried to bring it down. Residents and tourists told local outlets that no siren sounded beforehand. What the drone was aimed at is unclear. Some Ukrainian Telegram channels claim it fell because electronic warfare jammed its signal.", "refs": ["beach-strike"], "tr": "Sayılabilir olan üç şey var. BBC'nin doğruladığı görüntülerde araç bir yamaca doğru ilerledikten sonra aşağıdaki sahile düşüyor. Rus basınına konuşan görgü tanıkları patlamadan önce silah sesi duyduklarını söylüyor; bu, hava savunmasının aracı düşürmeye çalıştığına işaret edebilir. Sakinler ve turistler yerel yayın organlarına saldırı öncesinde siren çalmadığını aktarıyor. Aracın neyi hedeflediği ise belirsiz. Bazı Ukrayna Telegram kanalları aracın, sinyalini bozan elektronik harp nedeniyle düştüğünü ileri sürüyor."}]}, {"h": {"en": "What these do not establish", "tr": "Bunlar neyi kanıtlamaz"}, "ps": [{"en": "That trio does not show that a stretch of coastline was aimed at. The absence of warning suggests the defence detected the drone late; the fire before the explosion suggests the engagement was joined on the approach rather than over a target; and the unclear aimpoint suggests the drone may have lost its heading in the terminal phase. The competing explanation has to be written down too: the drone may have been aimed at a nearby facility and missed through an ordinary guidance failure, in which case the defence's role is secondary. Nor is the source of the electronic-warfare claim neutral — an account that lightens its own side's responsibility is not verified merely by being plausible.", "refs": ["beach-strike"], "tr": "Bu üçlü, bir kıyı şeridinin nişan alındığını göstermez. Uyarı verilmemesi, savunmanın aracı geç fark ettiğine; patlamadan önceki ateş, temasın hedefin üzerinde değil yaklaşma hattında kurulduğunu düşündürür. Hedefin belirsizliği ise aracın son safhada yönünü koruyamamış olabileceğine işaret eder. Bu okumanın karşısında duran açıklamayı da yazmak gerekir: Araç yakındaki bir tesise nişan alınmış ve isabetsizlik sıradan bir güdüm hatasından doğmuş olabilir; o durumda savunmanın rolü ikincil kalır. Elektronik harp iddiasının kaynağı da tarafsız değil — kendi tarafının sorumluluğunu hafifleten bir açıklama, doğru olsa bile doğrulanmış sayılmaz."}, {"en": "For the campaign the consequence is this. Ukraine's deep strikes, increasingly successful over the past year, hit energy infrastructure and commercial warehouses it says are used for military purposes, and eight people were killed in such strikes in different Russian cities at the weekend. In Saturday's ballistic missile attacks on Kyiv, Zelensky said at least nine people were killed. As volume grows, civilian harm arises not only from impact but from the defensive engagement itself, and neither side's statement closes that cost. On the present evidence that is as far as it goes. Capability can be counted, intent cannot, and the footage anyone holds does not make intent legible.", "refs": ["beach-strike"], "tr": "Kampanya açısından sonuç şu: Ukrayna'nın bir yıldır artan derinlik saldırıları enerji altyapısını ve askerî amaçla kullanıldığını söylediği ticari depoları vuruyor, hafta sonu farklı Rus kentlerinde sekiz kişi bu saldırılarda öldü. Cumartesi Kiev'e yapılan balistik füze saldırılarında ise Zelenski'ye göre en az dokuz kişi öldü. Hacim büyüdükçe sivil zarar yalnızca isabetten değil, savunma temasının kendisinden de doğuyor ve bu maliyet iki tarafın da beyanıyla kapatılamıyor. Bugünkü kanıtla söylenebilecek olan bu kadar. Kabiliyet sayılabilir, niyet sayılamaz; kimsenin elindeki görüntü niyeti okutmuyor."}]}], "sources": [{"key": "beach-strike", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cr7kmnyrdn7o", "title": {"tr": "Krasnodar valisi, kalabalık bir sahile düşen insansız hava aracında 7 kişinin öldüğünü bildirdi", "en": "Krasnodar governor says seven died when a drone came down on a crowded beach"}, "publishedDate": "2026-08-03"}], "title": {"en": "The gunfire was heard before any siren sounded", "tr": "Sirenler çalmadan önce silah sesi duyuldu"}, "writer": "geo-03", "date": "2026-08-04"}, {"excerpt": {"en": "The perimeters of a deal on Hormuz were said to be agreed and Brent fell 4.5 percent on Monday. The only series that measures actual crossings of the same strait points the other way: 51 between July 30 and August 2, against 71 in the four days before.", "tr": "Hürmüz'de bir anlaşmanın çerçevesi üzerinde uzlaşıldığı duyuruldu ve Brent pazartesi yüzde 4,5 düştü. Aynı boğazdan yapılan geçişleri ölçen tek seri ise ters yöne bakıyor: 30 Temmuz–2 Ağustos arasında 51 geçiş, önceki dört günde 71."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "Two series, two directions", "tr": "İki seri, iki yön"}, "ps": [{"en": "The BBC reported that in Monday Asia trading Brent fell 4.5 percent to $83.98 and US-traded crude fell 4.6 percent to $80.74. What moved the price was not a loading, a sailing clearance or an insurance binder; it was Trump saying the perimeters of a deal had been agreed and that these covered reopening Hormuz. Around 20 percent of the world's crude oil and liquefied natural gas normally passes through the strait, and that share explains why a spoken announcement produced a price response of this size.", "refs": ["iran-talks"], "tr": "BBC'nin aktardığına göre pazartesi Asya işlemlerinde Brent yüzde 4,5 düşüşle 83,98 dolar, ABD'de işlem gören ham petrol yüzde 4,6 düşüşle 80,74 dolar seviyesine geriledi. Fiyatı hareket ettiren şey bir yükleme, bir sefer izni ya da bir sigorta teminatı değil; Trump'ın bir anlaşmanın çerçevesi üzerinde uzlaşıldığını ve bunun Hürmüz'ün yeniden açılmasını kapsadığını söylemesiydi. Boğazdan normalde dünya ham petrolünün ve sıvılaştırılmış doğal gazının yaklaşık yüzde 20'si geçiyor; bu pay, sözlü bir duyurunun neden bu büyüklükte bir fiyat tepkisi ürettiğini açıklıyor."}, {"en": "The physical series does not point the same way. Kpler's vessel-tracking data show 51 crossings of the strait between July 30 and August 2, against 71 in the previous four days, roughly 28 percent fewer. Using the two measures in one sentence requires stating the lag: the price belongs to Monday, the crossing count to the four days before the announcement. The series therefore do not contradict each other; they measure different things. The price reflects an expectation, the crossing count the risk an owner and an underwriter actually took, and the second had gone on narrowing right up to the announcement.", "refs": ["iran-talks"], "tr": "Fiziksel seri aynı yöne bakmıyor. Kpler'in gemi takip verilerine göre boğazdan 30 Temmuz–2 Ağustos arasında 51 geçiş yapıldı; önceki dört günde bu sayı 71'di, yani yaklaşık yüzde 28 daha az. Bu iki ölçüyü aynı cümlede kullanırken gecikmeyi yazmak gerekir: Fiyat pazartesiye ait, geçiş sayısı ise duyurudan önceki dört güne. Dolayısıyla seriler birbirini yalanlamıyor; farklı şeyleri ölçüyorlar. Fiyat bir beklentiyi, geçiş sayısı ise armatörün ve sigortacının fiilen aldığı riski gösteriyor ve ikincisi duyuruya kadar daralmaya devam etmişti."}]}, {"h": {"en": "Which text actually exists", "tr": "Ortada hangi metin var"}, "ps": [{"en": "The document behind the announcement is what matters. Iran said it was not negotiating with the United States and had no plans to do so; the only channel it acknowledged is t
