ng the appeal. Through the hearing window that runs from October to December, the legal consequence of expressing support for the group is unchanged. Judicial scrutiny has begun, but the administrative measure keeps running without interruption.", "refs": ["proscription"]}, {"tr": "Bu sürenin bedelini ödeyenler dosyanın tarafı değil. Yasaklama kararından bu yana 3.500'den fazla kişi gözaltına alındı ve temyiz izninin verildiği gün Westminster Sulh Mahkemesi önünde 77 kişi daha gözaltına alındı. Mahkemenin takvimi ile sokaktaki takvim aynı hızda ilerlemiyor.", "en": "The people who pay for that interval are not parties to it. More than 3,500 have been arrested since the proscription, and on the day permission was granted another 77 were arrested outside Westminster Magistrates' Court. The court's calendar and the calendar on the street do not run at the same speed.", "refs": ["proscription"]}]}], "sources": [{"key": "proscription", "kind": "news", "name": "The Jewish Chronicle", "url": "https://www.thejc.com/news/uk/palestine-action-appeal-supreme-court-v7uetpjk", "title": {"tr": "Birleşik Krallık Yüksek Mahkemesi, Palestine Action yasağına karşı temyize tek gerekçeyle izin verdi", "en": "The UK Supreme Court allows an appeal against the Palestine Action ban on a single ground"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-02", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "excerpt": {"tr": "Barış Kurulu'nun Gazze metni bir sıra ve bir takvim içeriyor: 14 gün, önce polis silahları, sonra ağır silahlar, en sonda çekilme. Ancak takvimin son adımını atacak taraf, yani İsrail, metin hakkında henüz konuşmadı.", "en": "The Board of Peace's text on Gaza contains a sequence and a clock: 14 days, police weapons first, heavy weapons next, withdrawal last. But the party that would take the final step, Israel, has not yet spoken about the text."}, "sections": [{"h": {"tr": "Takvim ve sıra", "en": "The clock and the sequence"}, "ps": [{"tr": "Al Jazeera'nın bir kopyasını edindiğini bildirdiği metin, ayrıntılı bir silahsızlanma yol haritasının 14 gün içinde hazırlanmasını öngörüyor ve bu sürenin uluslararası bir doğrulama organının onayıyla uzatılabileceğini yazıyor. Silahlar Gazze'yi yönetecek bir Ulusal Komite'ye devredilecek; önce polis silahları aktarılacak, ardından ağır silahlar etkisiz hale getirilecek ve Gazze'deki tüm askeri faaliyet duracak.", "en": "The text, a copy of which Al Jazeera says it obtained, requires a detailed disarmament roadmap within 14 days and provides that the period can be extended with the approval of an international verification body. Weapons pass to a National Committee that would administer Gaza: police weapons first, then heavy weapons decommissioned, with all military activity in Gaza to cease.", "refs": ["board-of-peace"]}, {"tr": "Sıranın sonunda ise bir devir var. Silahsızlanma tamamlandığında İsrail güçleri çekilecek ve yerlerini bir Uluslararası İstikrar Gücü ile yeni bir Filistin polis gücü alacak. Yani metnin bütün ara adımları, en sondaki adımın atılacağı varsayımıyla anlam kazanıyor.", "en": "At the end of the sequence sits a handover. Once disarmament is complete, Israeli forces withdraw and are replaced by an International Stabilisation Force working with a new Palestinian police force. Every intermediate step in the text therefore acquires its meaning from the assumption that the final step will be taken.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "Kim neyi üstlendi", "en": "Who took on what"}, "ps": [{"tr": "Duyuruyu Trump yaptı. Hamas müzakere heyetinden Gazi Hamad görüşmelerin zor geçtiğini ve ulaşılabilecek en iyi formülün arandığını söyledi; ancak Hamas, İsrail yükümlülüklerini yerine getirmezse metni uygulamayacağını belirtti. Filistin İslami Cihadı anlaşmaya varıldığı yönündeki aktarımlara itiraz ederek mevcut ifadelere çekince koydu. İsrail'den ise açıklama gelmedi.", "en": "Trump made the announcement. Ghazi Hamad of the Hamas negotiating delegation said the talks had been difficult and that the best achievable formula had been sought; Hamas nonetheless said it would not implement the text if Israel failed to meet its obligations. Palestinian Islamic Jihad disputed accounts that an agreement had been reached and entered reservations about the current wording. Israel had made no comment.", "refs": ["board-of-peace"]}, {"tr": "Bir metnin ağırlığı, hangi tarafın hangi yükümlülüğü üstlendiğiyle ölçülür. Burada üstlenilen yükümlülüklerin tamamı silah tarafında toplanıyor; çekilme tarafında ise koşullu bir sonuç duruyor. Kabul edenler koşullu kabul etti, sıranın sonundaki adımı atacak taraf henüz konuşmadı.", "en": "A text's weight is measured by which party takes on which obligation. Here every obligation assumed gathers on the weapons side, while the withdrawal side holds a conditional outcome. Those who accepted did so conditionally, and the party that would take the last step in the sequence has yet to speak.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "En erken tarih 14. gün", "en": "The earliest date is day 14"}, "ps": [{"tr": "Koşullar birbirine bağlandığında ilk kırılma noktası genellikle en erken tarihli maddede ortaya çıkar. Bu metinde en erken tarih 14. gün, ve o gün sınanacak şey yol haritasının hazırlanmış olmasıdır. Alternatif bir okuma da mümkün: 14 günlük süre metne kamuya açık bir tarih iliştirmek için konmuş, uzatma yetkisi ise gecikmeyi soğurmak üzere aynı maddeye yerleştirilmiş olabilir.", "en": "The chaining of conditions usually puts the first break at the earliest-dated clause rather than the most visible one. In this text the earliest date is day 14, and what falls due that day is the preparation of the roadmap. Another reading is available: the 14-day period may exist to attach a public date to the text, with the extension power placed in the same clause to absorb delay.", "refs": ["board-of-peace"]}, {"tr": "Bu yüzden takip edilecek tarih 13 Ağustos. O güne kadar ya ayrıntılı yol haritası duyurulur ya da doğrulama organının uzatma onayı verdiği bildirilir. Hiçbiri olmazsa, metnin bağlayıcılığı hakkındaki soru artık yorum meselesi olmaktan çıkar.", "en": "The date to watch is therefore 13 August. By then either the detailed roadmap is announced or the verification body is reported to have approved an extension. If neither happens, the question about how much the text binds stops being a matter of interpretation.", "refs": ["board-of-peace"]}]}], "sources": [{"key": "board-of-peace", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-says-board-of-peace-reaches-agreement-on-disarmament-of-hamas-in-gaza", "title": {"tr": "Trump, Barış Kurulu'nun Gazze'de aşamalı silahsızlanma üzerinde anlaştığını açıkladı", "en": "Trump says the Board of Peace has agreed a phased disarmament plan for Gaza"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-03", "title": {"tr": "NATO havalanan uçaklarla neyi caydırıyor?", "en": "What is NATO deterring with jets that were already airborne?"}, "excerpt": {"tr": "Bir seyir füzesi ittifak toprağına 80 kilometre girdi ve bir tarlada patladı. Uçaklar havalandı, ateş açılmadı; caydırıcılığı bu kez taşıyan şey gösterilmiş bir önleme değil, verilmiş bir söz.", "en": "A cruise missile travelled 80km into alliance territory and detonated in a field. Jets went up, nothing was fired; what carried deterrence this time was a promise, not a demonstrated intercept."}, "sections": [{"h": {"tr": "Olayın ölçüleri", "en": "The measurements of the event"}, "ps": [{"tr": "Füze yerel saatle 04.00 sularında, Lublin yakınlarındaki Tarnawa-Kolonia köyünün civarında bir tarlaya düştü ve 10 metrelik bir çukur açtı. Nokta, Ukrayna sınırının yaklaşık 80 kilometre içinde. Başbakan Donald Tusk mühimmatın büyük olasılıkla Rus olduğunu, incelemenin bir Kh-101 seyir füzesine işaret ettiğini söyledi.", "en": "The missile came down at about 04.00 local time in a field near the village of Tarnawa-Kolonia, close to Lublin, leaving a crater 10 metres wide. The point of impact lies about 80km inside the Ukrainian border. Prime Minister Donald Tusk said the munition was most likely Russian and that analysis pointed to a Kh-101 cruise missile.", "refs": ["poland-missile"]}, {"tr": "Saldırı sırasında Polonya savaş uçaklarını havalandırdı. Tusk, Polonya'nın hedef alındığını düşündürecek bir neden bulunmadığını, füzenin yerleşim yerlerini tehdit etmesi halinde ordunun müdahaleye hazır olduğunu belirtti. Mühimmat ateşle karşılanmadı; olay yerinde yaralanan olmadı.", "en": "Poland scrambled fighter jets during the attack. Tusk said there was no reason to believe Poland had been targeted and that the military stood ready to intercept had the missile threatened populated areas. The munition was not engaged, and no one was hurt at the site.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Angajmanın eşiği", "en": "The threshold of engagement"}, "ps": [{"tr": "Tusk'ın cümlesi aslında bir kural bildiriyor. Müdahale, mühimmatın ittifak toprağına girmiş olmasına değil, yerleşim yerlerini tehdit etmesine bağlanmış. Bu eşik seçildiğinde, sınırdan 80 kilometre içeri giren bir seyir füzesinin ateş açılmadan yere inmesi bir aksaklık olmaktan çıkar; sistemin öngördüğü sonuç haline gelir.", "en": "Tusk's sentence in fact states a rule. Engagement is tied not to a munition entering alliance territory but to its threatening populated areas. Once that threshold is chosen, a cruise missile coming down unengaged 80km inside the border stops being a malfunction and becomes the outcome the system is designed to produce.", "refs": ["poland-missile"]}, {"tr": "Bu eşiğin sınanması uzun sürmeyecek. NATO üyesi Polonya'nın hava sahasına 31 Ekim'e kadar yeni bir mühimmat girerse, cevabı verilecek soru mühimmatın havada ateşle karşılanıp karşılanmadığı olacak; bir kez daha tarlada bulunursa, kuralın istisna değil uygulama olduğu görülür.", "en": "That threshold will not wait long to be tested. If another munition enters the airspace of NATO member Poland before 31 October, the question to answer is whether it is engaged in the air; if it is again found in a field, the rule will have shown itself to be the practice rather than the exception.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Beyanın taşıdığı yük", "en": "The load the declaration carries"}, "ps": [{"tr": "NATO'da Avrupa Müttefik Kuvvetleri Komutanı Orgeneral Alexus Grynkewich, ittifakın kendi toprağını savunmak için gereken her önlemi almayı sürdüreceğini bildirdi. Bu bir taahhüt beyanıdır ve beyanın işe yaraması için karşı tarafın onu inandırıcı bulması gerekir. Kabiliyetin aksine beyan sayılamaz; yalnızca sınanır.", "en": "NATO's Supreme Allied Commander Europe, Gen Alexus Grynkewich, said the alliance would continue to take all necessary measures to defend NATO territory. That is a declaration of commitment, and a declaration works only if the other side finds it credible. Unlike capability, a declaration cannot be counted; it can only be tested.", "refs": ["poland-missile"]}, {"tr": "Kısıtlamanın bir mühendislik gerekçesi de olabilir: seyrek yerleşimli arazi üzerinde önleme, düşen parçalarla kendi zararını yaratır ve bu tercih bir kabiliyet boşluğuna işaret etmeyebilir. Karşı tarafın gördüğü şey ise şudur: havalanan uçaklar, ateş açılmamış bir hat ve bir tarladaki krater.", "en": "There may be an engineering reason for the restraint: an intercept over sparsely populated ground creates its own harm through falling debris, and the choice need not indicate a gap in capability. What the other side observes is this: aircraft in the air, a line along which nothing was fired, and a crater in a field.", "refs": ["poland-missile"]}]}], "sources": [{"key": "poland-missile", "kind": "news", "name": "The Irish Times", "url": "https://www.irishtimes.com/world/2026/07/30/russia-accused-of-violating-polish-airspace-after-missile-explodes-near-village/", "title": {"tr": "Doğu Polonya'da bir füze patladı, NATO ittifak toprağını savunacağını bildirdi", "en": "A missile explodes in eastern Poland and NATO says it will defend alliance territory"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-04", "title": {"tr": "İki gemi, bir terminal ve iki gün önceki uyarı", "en": "Two vessels, one terminal and a warning two days earlier"}, "excerpt": {"tr": "Dimyat'ta vurulan şey bir boru hattı ya da bir sözleşme değil, bir gövdeydi. Tek bir insansız hava aracı iki gemiyi rıhtımdan uzaklaştırdı ve gazı karaya indiren donanımın ne kadar dar bir yerde toplandığını gösterdi.", "en": "What was hit at Damietta was neither a pipeline nor a contract but a hull. A single drone moved two vessels off the berth and showed how narrow the equipment base that lands gas ashore really is."}, "sections": [{"h": {"tr": "Vurulan donanım", "en": "The equipment that was hit"}, "ps": [{"tr": "Marshall Adaları bayraklı Energos Winter, New Fortress Energy tarafından işletilen yüzer bir depolama ve gazlaştırma ünitesi; işi sıvılaştırılmış doğal gazı yeniden gaza çevirmek. Gemi çarşamba günü Orta Avrupa saatiyle 15.20 sularında sancak tarafından vuruldu ve çıkan yangın Bermuda bayraklı LNG tankeri Gaslog Salem'e sıçradı.", "en": "The Marshall Islands-flagged Energos Winter is a floating storage and regasification unit operated by New Fortress Energy; its job is to turn liquefied natural gas back into gas. It was struck on the starboard side at about 15.20 CET on Wednesday, and the fire spread to the Bermuda-flagged LNG tanker Gaslog Salem.", "refs": ["damietta"]}, {"tr": "Mürettebat tahliye edildi ve can kaybı bildirilmedi. Buna karşılık iki gemi de hasar tespiti için açığa çekildi ve terminaldeki işleyiş aksadı. Zarar, işleyişin bağlı olduğu iki gövdenin rıhtımdan ayrılmasında toplandı.", "en": "The crews were evacuated and no casualties were reported. Both vessels, however, were moved offshore for damage assessment, and operations at the terminal were disrupted. The damage gathered in the removal from the berth of the two hulls on which the operation depends.", "refs": ["damietta"]}]}, {"h": {"tr": "Yerine hızlıca koyulamayan şey", "en": "The thing you cannot quickly replace"}, "ps": [{"tr": "Bir gövdeye isabet eden tek bir insansız hava aracının iki gemiyi rıhtımdan uzaklaştırıp bir terminali aksatabilmesi, kırılganlığın nerede toplandığını gösteriyor: sayısı sınırlı ve yerine birkaç gün içinde bir başkası çekilemeyen özel donanımlı yüzer ünitelerde. Alternatif okuma da elde: gemilerin açığa çekilmesi hasardan değil ihtiyattan kaynaklanmış olabilir; bu durumda aksama kısa sürer ve yoğunlaşma göründüğü kadar derin çıkmaz.", "en": "That one drone hitting one hull could push two vessels off a berth and disrupt a terminal shows where the fragility gathers: in a small number of specialised floating units for which no substitute can be brought in within days. The other reading is available: the vessels may have been moved out of caution rather than damage, in which case the disruption is brief and the concentration is shallower than it looks.", "refs": ["damietta"]}, {"tr": "Fiyatlanabilir ikinci bir bilgi daha var. İran devlet televizyonu Dimyat'ı iki gün önce olası bir misilleme hedefi olarak anmıştı; bu, Ukrayna'nın bir İran gemisine düzenlediği saldırıların ardından gelmişti. Hedef, vurulmadan önce açıkça adlandırılmıştı. Saldırıyı üstlenen çıkmadı; İran Dışişleri Bakanı Abbas Erakçi ülkesinin tırmanma peşinde olmadığını söyledi ve Kiev'den tazminat istedi.", "en": "A second piece of information can also be priced. Iranian state television had named Damietta as a possible retaliation target two days earlier, following Ukrainian strikes on an Iranian vessel. The target was named in public before it was hit. No one claimed the attack; Iran's Foreign Minister Abbas Araghchi said his country was not seeking escalation and demanded compensation from Kyiv.", "refs": ["damietta"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What can actually be measured"}, "ps": [{"tr": "Sorumluluk belirlenmemişken bu olayın ağırlığını siyasi açıklamalardan okumak mümkün değil. Ölçülebilir olan tek şey donanımın kendisi: hangi gemi hangi rıhtıma ne zaman dönüyor ve terminal hangi tarihte olağan işleyişine geçiyor.", "en": "With responsibility unestablished, the weight of this event cannot be read off political statements. The only measurable thing is the equipment itself: which vessel returns to which berth and when, and on what date the terminal resumes normal operation.", "refs": ["damietta"]}, {"tr": "İzlenecek tarih 31 Ağustos. Energos Winter o güne kadar Dimyat'taki rıhtımına döner ve terminal işleyişi normale geçerse, olay bir kesinti olarak kalır. Dönmezse, tek bir gövdenin kaybının ne kadar süreyle bir ithalat kapısını meşgul edebildiği ölçülmüş olur.", "en": "The date to watch is 31 August. If the Energos Winter is back at its Damietta berth by then and the terminal's operation has returned to normal, the event stays an interruption. If it is not, we will have a measurement of how long the loss of a single hull can occupy an import gateway.", "refs": ["damietta"]}]}], "sources": [{"key": "damietta", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/2026/07/30/drone-hits-us-lng-vessel-at-damietta-in-first-attack-on-egyptian-soil", "title": {"tr": "Mısır, Dimyat Limanı'ndaki iki gemide çıkan yangının bir insansız hava aracından kaynaklandığını açıkladı", "en": "Egypt says a drone caused the fire on two gas vessels at Damietta port"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-05", "title": {"tr": "On dört imza, iki eksik komşu", "en": "Fourteen signatures, two absent neighbours"}, "excerpt": {"tr": "Riyad'da duyurulan deniz savunma ittifakında asıl bilgi, bildirinin altındaki isimlerde duruyor. İmzacıların çoğu koridorun kıyısında yaşayan ülkeler; aynı sularda aynı çıkarı taşıyan Birleşik Arap Emirlikleri ile Umman ise listede yok.", "en": "The real information in the maritime alliance announced in Riyadh sits in the names beneath the statement. Most signatories are states that live on the corridor; the United Arab Emirates and Oman, with the same interest in the same waters, are absent from the list."}, "sections": [{"h": {"tr": "İmzayı atanlar", "en": "Those who signed"}, "ps": [{"tr": "Suudi Savunma Bakanlığı'nın duyurusuna göre ittifakın merkezi Riyad'da olacak ve Suudi Arabistan'ın yanı sıra Türkiye, Kuveyt, Bahreyn, Katar, Ürdün, Mısır, Pakistan, Cibuti, Somali, Bangladeş, Yemen, Sudan ve Komorlar imzacılar arasında yer alıyor. Toplantıya bir Avrupa Birliği heyeti de katıldı. Bildiri ittifakın işini istihbarat paylaşımı, ortak tatbikatlar ve ortak deniz harekatları olarak tanımlıyor.", "en": "According to the Saudi defence ministry, the alliance will be headquartered in Riyadh, and alongside Saudi Arabia the signatories include Türkiye, Kuwait, Bahrain, Qatar, Jordan, Egypt, Pakistan, Djibouti, Somalia, Bangladesh, Yemen, Sudan and the Comoros. A European Union delegation also attended the meeting. The statement defines the alliance's work as intelligence sharing, joint exercises and joint maritime operations.", "refs": ["red-sea-alliance"]}, {"tr": "Listeyi coğrafyayla birlikte okumak gerekiyor. Bildirinin kendisi korunacak alanı Bab-ül Mendeb Boğazı, Kızıldeniz ve Aden Körfezi olarak tanımlıyor; Cibuti, Somali, Yemen, Sudan ve Mısır bu hattın kıyısında duruyor. İmza listesi bir maruziyet haritası gibi okunabiliyor: o sudan çıkamayanlar imza atıyor.", "en": "The list has to be read together with the geography. The statement itself defines the area to be protected as the Bab al-Mandeb Strait, the Red Sea and the Gulf of Aden; Djibouti, Somalia, Yemen, Sudan and Egypt sit along that line. The signature list reads like a map of exposure: the states that cannot sail away from those waters are the ones signing.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "İmzalamayanlar", "en": "Those who did not sign"}, "ps": [{"tr": "Birleşik Arap Emirlikleri ile Umman, aynı sulardaki aynı tehdide rağmen imzacılar arasında yok. Bildiri ulusal süreçlerini tamamlayan başka ülkelerin kurucu belgeye katılmasına kapıyı açık bırakıyor; yani liste kapanmış bir liste olarak duyurulmadı.", "en": "The United Arab Emirates and Oman are not among the signatories, despite facing the same threat in the same waters. The statement leaves the door open for other countries to accede to the charter once they complete their national procedures, so the list was not announced as a closed one.", "refs": ["red-sea-alliance"]}, {"tr": "Bu maddenin işleyip işlemediği yakında görülecek. 30 Eylül'e kadar en az bir ülkenin katılımı duyurulursa, açık kapı gerçekten bir katılım mekanizması olarak çalışıyor demektir; kimse eklenmezse, kurucu 14 ülkenin oluşturduğu çekirdek ittifakın tamamı olarak kalır.", "en": "Whether that clause works will be visible soon. If at least one country's accession is announced by 30 September, the open door is functioning as a real mechanism for joining; if nobody is added, the core of 14 founders remains the whole of the alliance.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "Listenin söylediği", "en": "What the list says"}, "ps": [{"tr": "Katılıma açık, istihbarat paylaşımı ve tatbikat üzerine kurulu bir yapı, sonradan girilebilir olacak biçimde tasarlanmıştır. Bu tasarım, korumayı isteyip adının bugün anılmasını istemeyen devletlere bir bekleme odası bırakır. Alternatif bir açıklama da var: iki ülkenin yokluğu, yapının tasarımına ya da merkezinin nerede olacağına ilişkin farklı bir değerlendirmeden kaynaklanıyor olabilir.", "en": "A structure that is open to accession and built on intelligence sharing and exercises is designed to be joined later. That design leaves a waiting room for states that want the protection without having their names read out today. Another explanation is available: the two absences may reflect a different judgement about the structure's design, or about where it is headquartered.", "refs": ["red-sea-alliance"]}, {"tr": "İlk günün bilançosu bu yüzden gemi sayısıyla tutulamaz. Bugün elde olan şey, bir bildirinin altında adının yazılmasını kabul edenlerin listesi. Bir ittifakın kabiliyeti sonradan ölçülür; kimin adını verdiği ilk gün belli olur ve o bilgi kendi başına bir şey söyler.", "en": "The balance of the first day therefore cannot be kept in ships. What exists today is a list of those who accepted having their names written under a statement. An alliance's capability is measured later; who gave their name is settled on day one, and that fact says something on its own.", "refs": ["red-sea-alliance"]}]}], "sources": [{"key": "red-sea-alliance", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/saudi-arabia-announces-maritime-defence-alliance-to-secure-vital-waterways", "title": {"tr": "Suudi Arabistan ve 13 ülke Kızıldeniz için deniz savunma ittifakı kurdu", "en": "Saudi Arabia and 13 other states form a maritime defence alliance for the Red Sea"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-06", "title": {"tr": "Çiti aşan geri gönderiliyor, yüzen gönderilmiyor", "en": "Those who climb the fence go back, those who swim do not"}, "excerpt": {"tr": "Ceuta'nın sınırı yerinden oynamadı; bir mahkeme kararı oynadı. Aynı hattı geçmenin iki ayrı hukuki sonuca bağlanması, olağanüstü durumun neden tam bu hafta ilan edildiğini açıklıyor.", "en": "Ceuta's border did not move; a court ruling did. Tying two different legal consequences to the same line explains why the emergency was declared in precisely this week."}, "sections": [{"h": {"tr": "Perşembe günü olan", "en": "What happened on Thursday"}, "ps": [{"tr": "Ceuta yönetiminin başkanı Jesus Vivas mutlak insani ve toplumsal bir olağanüstü durum ilan etti ve Madrid'den sınır denetimini yeniden kurmak üzere asker istedi. Son 10 gün içinde 1.500 ila 2.000 kişi kente girdi; perşembe günü yüzlerce kişi daha geldi. İçişleri Bakanlığı göç kaynaklı bir krizin ulusal olağanüstü hal tanımına girmediğini belirterek talebi reddetti, ancak sınıra 60 askerin gönderilmesine onay verdi.", "en": "Ceuta's regional president, Jesus Vivas, declared an absolute humanitarian and social emergency and asked Madrid for troops to restore control of the border. Between 1,500 and 2,000 people entered the city over the past 10 days, with hundreds more arriving on Thursday. The interior ministry refused the request, saying a migration crisis does not meet the definition of a national emergency, but authorised 60 troops for the border.", "refs": ["ceuta"]}, {"tr": "Aynı haberde kentin kapasitesinden çok daha az konuşulan bir tarih var. Temmuz başında İspanya Yüksek Mahkemesi, Ceuta ve Melilla'ya ulaşmaya çalışırken denizde yakalanan kişilerin Fas'a doğrudan iade edilemeyeceğine hükmetti. Yetkililer kaçakçılık ağlarının bu kararı kullandığını söylüyor.", "en": "The same report carries a date that is discussed far less than the city's capacity. Earlier in July, Spain's Supreme Court ruled that people intercepted at sea while trying to reach Ceuta or Melilla cannot be returned directly to Morocco. Officials say smuggling networks have made use of the decision.", "refs": ["ceuta"]}]}, {"h": {"tr": "Yerinde duran hat, değişen kural", "en": "The line stayed, the rule changed"}, "ps": [{"tr": "Sınır hattı yerinde duruyor. Değişen şey, aynı hattı geçmenin artık iki ayrı hukuki sonuç doğurması: çiti tırmanan kişi hâlâ anında geri gönderilebiliyor, denizden gelen gönderilemiyor. Geçiş yönteminin sudan yana kayması bu dikişi izliyor; kararın ayırdığı yerden geçiliyor.", "en": "The line is where it was. What changed is that crossing the same line now produces two different legal consequences: someone who climbs the fence can still be sent straight back, someone who arrives by sea cannot. The shift of method towards the water follows that seam; people cross where the ruling drew its distinction.", "refs": ["ceuta"]}, {"tr": "Guardia Civil sözcüsünün anlatımı bu kaymayı tarihlendiriyor: karardan sonra gelişler yavaş bir sızıntı halinde sürmüş, perşembe günü ise bir patlama yaşanmış. Yani değişim kararla birlikte başladı, ama görünür hale gelmesi için kentin kapasitesinin dolmasını bekledi.", "en": "A Guardia Civil spokesperson's account dates that shift: arrivals had been a slow trickle since the ruling, and Thursday brought an explosion. The change began with the decision, then waited for the city's capacity to fill before it became visible.", "refs": ["ceuta"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Uzun süredir yerinde duran bir sınırda ani bir hareketlenmenin sebebini hattın kendisinde aramak yanıltıcıdır; hat yıllardır aynı geçme isteğini üretiyordu. Burada değişen değişken, geçişin hukuken ne anlama geldiğini belirleyen kuraldır. Alternatif okuma da göz ardı edilemez: İçişleri Bakanlığı sorumluluğu insan kaçakçılığı ağlarına yükledi ve deniz koşulları, ağların fiyatlandırması ya da Fas'ın denetim tercihleri de aynı zamanlamayı üretebilirdi.", "en": "When a long-settled border suddenly stirs, looking for the cause in the line itself misleads; the line had been producing the same wish to cross it for years. The variable that changed here is the rule that decides what a crossing means. Nor can another reading be set aside: the interior ministry blamed people-smuggling networks, and sea conditions, the networks' pricing or Morocco's policing choices could have produced the same timing.", "refs": ["ceuta"]}, {"tr": "Bu ayrım kentin kendisi için de sonuç doğuruyor. Ceuta'nın sınırı bir çizgi olarak sabit kaldığı sürece kapasitesi de sabit kalır; değişen kural ise o kapasiteye kaç kişinin ve hangi yoldan ulaşacağını belirler. Bunun ölçüsü basit: deniz yoluyla gelenlerin sayısı ile çitten geçiş girişimlerinin sayısı arasındaki dağılım. Bugün bir sınırı yöneten şey, hangi geçişin hangi sonucu doğurduğuna karar veren cümledir.", "en": "The distinction has consequences for the city too. As long as Ceuta's border stays fixed as a line, so does its capacity; the rule that changed decides how many reach that capacity, and by which route. The measure of that is straightforward: the split between arrivals by sea and attempts on the fence. What governs a border today is the sentence that decides which crossing produces which outcome.", "refs": ["ceuta"]}]}], "sources": [{"key": "ceuta", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/spanish-enclave-of-ceuta-raises-alarm-as-thousands-cross-morocco-border", "title": {"tr": "Ceuta olağanüstü durum ilan etti, Madrid sınıra 60 asker gönderiyor", "en": "Ceuta declares an emergency and Madrid sends 60 troops to the border"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-01", "title": {"tr": "Parayı serbest bırakan cümle Dünya Sağlık Örgütü'nü dışarıda tutuyor", "en": "The sentence that releases the money keeps the World Health Organization outside"}, "excerpt": {"tr": "Washington iki yıl bekletilen 600 milyon dolar tutarındaki ödeneği Gavi'ye açtı. Aynı duyuru, bu paranın Dünya Sağlık Örgütü'ne ulaşmasını engelliyor. Etkiyi üreten şey, ödeneğe eklenen uygunluk koşulu.", "en": "Washington opened up the $600m appropriation it had held back for two years to Gavi. The same announcement keeps that money from reaching the World Health Organization. What produces the effect is the eligibility condition attached to the appropriation."}, "sections": [{"h": {"tr": "Ödeneğe eklenen koşul", "en": "The condition attached to the appropriation"}, "ps": [{"tr": "Dışişleri Bakanlığı ile Sağlık ve İnsani Hizmetler Bakanlığı, Kongre'nin aşı için ayırdığı 600 milyon dolar tutarındaki ödeneği Gavi'ye açarken Dünya Sağlık Örgütü'nün bu ittifak üzerinden Amerikan kaynağı almasını engelledi. Duyuruyu Dışişleri Bakanı Marco Rubio ile Sağlık Bakanı Robert Kennedy Jr. birlikte yaptı ve desteğin sürmesi için Gavi'nin cıva içeren aşıların yerine cıvasız alternatifler koyma yönünde çalışması koşulu getirildi.", "en": "The State Department and the Department of Health and Human Services opened up to Gavi the $600m appropriation Congress had set aside for vaccines, while barring the World Health Organization from receiving American money through the alliance. Secretary of State Marco Rubio and Health Secretary Robert Kennedy Jr. announced it together, and continued support was made conditional on Gavi working towards replacing mercury-containing vaccines with mercury-free alternatives.", "refs": ["gavi-who"]}, {"tr": "Burada bağlayıcı olan, tutara eklenen uygunluk şartı. Bir ödenek serbest bırakıldığında iş biter; uygunluk şartı ise para her aktarıldığında yeniden uygulanır ve alıcı kurumun kimi finanse edebileceğini belirler. Daha sade bir açıklama da mümkün: karar, iki yıl süren bir bütçe tıkanıklığının teknik çözümü ve aşı içeriğine dair yerel siyasetin gereği olabilir.", "en": "What binds here is the eligibility test attached to the sum. Releasing an appropriation is a one-off act; an eligibility test applies again every time money moves, and it determines whom the receiving institution may fund. A plainer explanation is also available: the decision may be the technical resolution of a two-year budget blockage and a requirement of local politics over vaccine content.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Davranışını değiştirmek zorunda olan taraf", "en": "The party that has to change its conduct"}, "ps": [{"tr": "Koşulu karşılamak zorunda olan taraf Gavi. Dünya Sağlık Örgütü ise dolaylı bir kaynak kanalını, kendi aldığı bir karar olmadan, bir aracı kurumun uygunluk kuralları değiştiği için yitiriyor. Ölçek farkı bu kaybı somutlaştırıyor: Amerikan katkısı 2019'da 400 milyon dolar üzerindeydi, bu örgüt bütçesinin yaklaşık yüzde 15'iydi ve yıllık bütçe yaklaşık 3,4 milyar dolar.", "en": "The party obliged to satisfy the condition is Gavi. The World Health Organization loses an indirect funding channel without any decision of its own, because an intermediary institution's eligibility rules changed. The difference in scale makes the loss concrete: American funding reached more than $400m in 2019, about 15 percent of the organization's budget, and that budget runs to some $3.4bn a year.", "refs": ["gavi-who"]}, {"tr": "Koşulun gerçekten bağlayıcı olup olmadığı, gözlenebilir bir yerde belli olacak: Gavi'nin satın alma kararları. Gavi yıl sonuna kadar cıva içeren aşıların tedarikine ilişkin yayımlanmış bir değişiklik açıklarsa koşul davranış değiştirmiş olur. Böyle bir değişiklik yayımlanmazsa ödenek serbest bırakılmış, kural ise uygulanmamış olur.", "en": "Whether the condition truly binds will show up somewhere observable: Gavi's procurement decisions. If Gavi announces a published change to its sourcing of mercury-containing vaccines by the end of the year, the condition will have altered conduct. If no such change is published, the money will have been released and the rule left unapplied.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Aracı kurum üzerinden kurulan emsal", "en": "A precedent built through the intermediary"}, "ps": [{"tr": "Bir bağışçının, çekildiği kurumu hâlâ finanse ettiği bir ittifakın uygunluk kuralları üzerinden dışarıda tutması, doğrudan kesintiden farklı bir yetki kullanımıdır: karar bağışçıda kalır, uygulama yükü aracı kurumun üzerine geçer. Trump 2020'de katkıyı durdurdu, Biden Ocak 2021'de kararı geri aldı, Trump ise 20 Ocak 2025'te çekilmeyi duyurdu; bu kez kural, çekilmenin ulaşamadığı yere uzanıyor.", "en": "A donor keeping the body it has left outside the reach of an alliance it still funds, by way of that alliance's eligibility rules, exercises authority differently from a direct cut: the decision stays with the donor while the burden of applying it passes to the intermediary. Trump halted funding in 2020, Biden reversed it in January 2021, and Trump announced the withdrawal on 20 January 2025; this time the rule reaches where the withdrawal could not.", "refs": ["gavi-who"]}]}], "sources": [{"key": "gavi-who", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-cuts-who-off-from-gavi-vaccine-alliance", "title": {"tr": "ABD, Gavi'ye 600 milyon doları serbest bıraktı ama paranın DSÖ'ye gitmesini engelledi", "en": "US releases $600m for Gavi while barring the money from reaching the WHO"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-02", "title": {"tr": "Kızıldeniz'de kimin gemisi korunacak?", "en": "Whose ships will be protected in the Red Sea?"}, "excerpt": {"tr": "Riyad, Kızıldeniz'deki gemiler için ortak arıyor; koalisyonun bileşimi henüz kesinleşmedi. Bir davet listesi taahhüt üretmez ve Katar, Kuveyt ile Bahreyn'den gelen telefonlar koalisyona katılmayı değil gerilimin düşürülmesini istedi.", "en": "Riyadh is looking for partners to guard Red Sea shipping, and the coalition's composition has not yet been finalised. An invitation list produces no commitment, and the calls from Qatar, Kuwait and Bahrain asked for de-escalation rather than enlistment."}, "sections": [{"h": {"tr": "Bileşim belirlenmeden yetki alanı belirlenemez", "en": "The mandate cannot be set before the membership"}, "ps": [{"tr": "Suudi Arabistan, Kızıldeniz'deki gemileri Husilerin saldırılarından korumak için uluslararası bir koalisyon kurmaya çalışıyor. Al Jazeera'nin haberine göre onlarca ülkeyle görüşmeler sürüyor ve koalisyonun bileşimi henüz kesinleşmedi. Sıra burada önemli: bir korumanın kime, hangi sularda ve hangi kuvvet kullanma yetkisiyle sağlanacağı, o korumayı kimlerin üstlendiği belirlenmeden yazılamaz.", "en": "Saudi Arabia is trying to build an international coalition to protect shipping in the Red Sea from Houthi attacks. Al Jazeera reported that deliberations with dozens of countries continue and that the composition of the coalition has not yet been finalised. The order matters here: who is to be protected, in which waters, and with what authority to use force cannot be written down before it is settled who carries that protection.", "refs": ["red-sea-coalition"]}, {"tr": "Bileşimin açık kalması bir ihmal olmayabilir; pazarlığın kendisi olabilir. Katılacak devletlerin listesi, koalisyonun neyi yapmaya yetkili olacağını da belirler; geniş bir liste dar bir yetki alanı, dar bir liste geniş bir yetki alanı üretmeye eğilimlidir. Daha yüzeysel bir açıklama da mümkün: bu, duyuru öncesinde her ittifak girişiminde görülen olağan hazırlık sırası olabilir.", "en": "Leaving the membership open may not be an oversight; it may be the bargain itself. The list of participating states also fixes what the coalition is authorised to do; a broad list tends to produce a narrow mandate and a narrow list a broad one. A more superficial explanation is also available: this may be the ordinary sequence of preparation seen before any alliance announcement.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Aynı telefonlarda iki ayrı talep", "en": "Two different requests on the same calls"}, "ps": [{"tr": "Suudi Dışişleri Bakanı Prens Faysal bin Ferhan; Katar, Kuveyt ve Bahreyn'deki mevkidaşlarından telefon aldı ve bildirilene göre bu görüşmelerde gerilimi düşürme çabalarının sürdürülmesinin önemine vurgu yapıldı. Husiler 20 Temmuz'da Suudi Arabistan'a deniz ablukası ilan etmiş, gerekçe olarak Yemen'e yaklaşık 12 yıldır uygulandığını söyledikleri kuşatmayı göstermişti; Riyad da Hudeyde limanındaki tesisleri vurdu.", "en": "Saudi Foreign Minister Prince Faisal bin Farhan received calls from his counterparts in Qatar, Kuwait and Bahrain and, as reported, those calls stressed the importance of continuing efforts to de-escalate tensions. The Houthis announced a maritime blockade of Saudi Arabia on 20 July, citing what they called a nearly 12-year siege of Yemen; Riyadh struck facilities at Hodeidah port.", "refs": ["red-sea-coalition"]}, {"tr": "Bir kefede Riyad'ın kurmak istediği askerî düzenek, öbür kefede komşularının kamuya açık tercihi duruyor; ikisi birbirini dışlamaz, ancak biri diğerinin yerine geçemez. Gerilimi düşürme dili ile koruma gücüne katılma kararı aynı taahhüt sayılamaz. Bir devletin gerilimin düşürülmesini istemesi, o devletin bir devriye görevine kuvvet ayırdığı anlamına gelmez.", "en": "On one side of the scale sits the military arrangement Riyadh wants to build; on the other, its neighbours' publicly stated preference. The two do not exclude each other, and neither substitutes for the other. The language of de-escalation and a decision to join a protection force do not amount to the same commitment. A state asking for de-escalation has not thereby committed forces to a patrol.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Davetin taahhüde dönüştüğü an", "en": "The moment an invitation becomes a commitment"}, "ps": [{"tr": "Bu girişimin bir koalisyona dönüşüp dönüşmediği, ortak bir metnin yayımlanmasıyla anlaşılacak. İki ay içinde katılan devletleri adlarıyla sayan ve görev tanımını yazan bir kuruluş bildirisi çıkarsa davet aşaması kapanmış olur. Böyle bir metin çıkmazsa ortada sürmekte olan bir davet listesi vardır ve Kızıldeniz'deki gemilerin korunması tek tek devletlerin kendi kararlarına kalır.", "en": "Whether this effort becomes a coalition will be settled by the publication of a joint text. If within two months a founding statement appears that names the participating states and sets out the task, the invitation stage will have closed. If no such text appears, what exists is a running invitation list, and the protection of shipping in the Red Sea stays with the separate decisions of individual states.", "refs": ["red-sea-coalition"]}]}], "sources": [{"key": "red-sea-coalition", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/saudi-arabia-seeks-international-coalition-against-houthis-in-red-sea", "title": {"tr": "Suudi Arabistan, Kızıldeniz'deki gemiler için uluslararası bir koalisyon arıyor", "en": "Saudi Arabia is trying to assemble an international coalition to guard Red Sea shipping"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-03", "title": {"tr": "Balistiği durduran füze tükeniyor", "en": "The missile that stops a ballistic one is running out"}, "excerpt": {"tr": "Kiev perşembe sabaha karşı balistik füzelerle vuruldu. Ukrayna'nın elinde Patriot bataryası var; eksik olan, o bataryaların balistik hedeflere karşı kullandığı PAC-3 mühimmatı. Kısıt fırlatıcı sayısında değil ikmalde.", "en": "Kyiv was hit by ballistic missiles early on Thursday. Ukraine has Patriot batteries; what it lacks is the PAC-3 round those batteries use against ballistic targets. The constraint lies in resupply rather than in launcher count."}, "sections": [{"h": {"tr": "01.18'de olan şey", "en": "What happened at 01.18"}, "ps": [{"tr": "Kiev'de yerel saatle 01.18'de patlamalar duyuldu. Belediye Başkanı Vitali Klitschko konut dışı bazı alanlarda yangın çıktığını bildirdi ve halkı sığınaklara yönlendirdi. Saldırı, Zelenskiy'in bir gün önce hava kuvvetlerinden aldığı bilgiye dayanarak geniş çaplı bir Rus saldırısının muhtemel olduğunu söylemesinden sonra geldi. Uyarının kendisi işe yaradı; uyarının sonucunda kullanılabilecek mühimmat ise ayrı bir sorun.", "en": "Explosions were heard in Kyiv at 01.18 local time. Mayor Vitali Klitschko said fires broke out at some non-residential sites and told people to seek shelter. The attack came after Zelenskyy said a day earlier, on the basis of an air force report, that a large-scale Russian attack was likely. The warning itself worked; the munition available to act on the warning is a separate problem.", "refs": ["kyiv-ballistic"]}, {"tr": "Habere göre Ukrayna, Patriot bataryalarının ihtiyaç duyduğu PAC-3 önleyici füzelerinden yoksun ve Rus balistik füzelerini düşürebilen tek mühimmat bu. Trump ise Ukrayna'ya Patriot füzelerini kendi topraklarında üretme lisansı verilmesini kabul etti. Bu iki cümle aynı yöne bakmıyor: biri bu geceye, öbürü yıllar sonrasına ait.", "en": "According to the report, Ukraine lacks the PAC-3 interceptor missiles its Patriot batteries need, and that round is the only munition capable of downing Russian ballistic missiles. Trump, meanwhile, agreed to give Ukraine licences to manufacture Patriot missiles domestically. The two sentences do not point the same way: one belongs to tonight, the other to years from now.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Envanterin değil ikmalin sorunu", "en": "A problem of resupply rather than inventory"}, "ps": [{"tr": "Bir hava savunmasının kabiliyeti fırlatıcı sayısıyla değil atabileceği mühimmatla ölçülür. Batarya duruyorsa ve doğru mühimmat yoksa sistem hedefi görür, vuramaz. Üretim lisansı bu kısıtı bugün gevşetmez: tesis, sertifikasyon ve tedarik zinciri gerektirir; savunma ihtiyacı ise saldırı gecesinde doğar. Başka bir okuma da mümkün: Ukrayna açıklamadığı stoklar tutuyor olabilir ya da müttefikler kendi envanterlerinden hızlı bir devir yapabilir.", "en": "An air defence is measured by the rounds it can fire, not by the launchers it owns. If the battery stands and the right round is missing, the system sees the target and cannot engage it. A production licence does not ease that constraint today: it requires a plant, certification and a supply chain, while the need for defence arises on the night of the attack. Another reading is possible: Ukraine may hold stocks it has not disclosed, or allies may transfer quickly from their own inventories.", "refs": ["kyiv-ballistic"]}, {"tr": "Mühimmatını saymak zorunda olan bir savunma, hangi hedefi koruyacağını seçmek zorunda kalır. Bu seçim saldıran tarafa bilgi verir: hangi hedeflerin ucuza vurulabileceğini savunmanın kıtlığı belirler. Klitschko'nun bildirdiği hasarın konut dışı alanlarda kalması bu gecenin sonucudur; savunmanın kapasitesini kanıtlamaz.", "en": "A defence forced to count its rounds is forced to choose what it protects. That choice tells the attacker something: the defender's scarcity decides which targets can be struck cheaply. That the damage Klitschko reported stayed at non-residential sites is the outcome of this one night; it does not establish the defence's capacity.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Gözlenebilir eşik", "en": "The observable threshold"}, "ps": [{"tr": "Kıtlığın kapanıp kapanmadığı üretim haberinden değil devir haberinden anlaşılır. Üç ay içinde bir müttefik hükümet ya da Ukrayna Savunma Bakanlığı, üretim lisansından ayrı olarak teslim edilmiş PAC-3 mühimmatını açıkça duyurursa kısıt gevşemiş olur. Yalnızca üretim ve lisans duyuruları gelirse, balistik tehdide karşı bu kış da aynı mühimmat sayılmaya devam edecek.", "en": "Whether the shortage closes will be shown by a transfer, not by a production announcement. If within three months an allied government or Ukraine's defence ministry explicitly announces delivered PAC-3 rounds, separately from the manufacturing licence, the constraint will have eased. If only production and licensing announcements arrive, the same rounds will still be counted against the ballistic threat this winter.", "refs": ["kyiv-ballistic"]}]}], "sources": [{"key": "kyiv-ballistic", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/russia-ballistic-missile-strikes-on-kyiv-come-after-zelenskyys-warning", "title": {"tr": "Zelenskiy'in uyarısından saatler sonra Kiev balistik füzelerle vuruldu", "en": "Russian ballistic missiles hit Kyiv hours after Zelenskyy warned of a mass attack"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-04", "title": {"tr": "Bir yanda yüzde yüz, öbür yanda on beş yıl", "en": "One hundred percent on one side, fifteen years on the other"}, "excerpt": {"tr": "Mercosur-Singapur anlaşması Brezilya için ağustos başında yürürlüğe giriyor. Singapur ilk günden bütün Brezilya mallarına sıfır tarife uygularken Mercosur'un karşılığı on beş yıla yayılıyor. Asıl bilgi bu takvim farkında.", "en": "The Mercosur-Singapore agreement enters into force for Brazil at the start of August. Singapore applies zero tariffs to every Brazilian good from day one while Mercosur's side of the bargain stretches over fifteen years. The information sits in that gap between schedules."}, "sections": [{"h": {"tr": "İki takvim, tek anlaşma", "en": "Two schedules, one agreement"}, "ps": [{"tr": "The Rio Times'ın haberine göre anlaşma Brezilya bakımından 1 Ağustos 2026'da yürürlüğe giriyor. Singapur o günden itibaren Brezilya ihracatının yüzde 100'üne sıfır tarife uyguluyor. Mercosur ise Singapur kaynaklı kalemlerin yaklaşık yüzde 95,8-96'sındaki vergileri 15 yıla varan bir takvimle kaldırıyor ve bu kalemlerin yaklaşık yüzde 20-25,6'sı ilk günden vergisiz hale geliyor.", "en": "According to The Rio Times, the agreement enters into force for Brazil on 1 August 2026. From that day Singapore applies zero tariffs to 100 percent of Brazilian exports. Mercosur removes duties on roughly 95.8–96 percent of Singaporean lines on a schedule running up to 15 years, and about 20–25.6 percent of those lines become duty-free from the first day.", "refs": ["mercosur-singapore"]}, {"tr": "Bu iki takvim aynı anlaşmanın iki farklı fiyatı. Bir tarafın açılışı tek seferde tamamlanıyor, öbür tarafın açılışı taksitle ödeniyor. İlk yılın ölçülebilir etkisi de buna göre tek yönlü olabilir: Brezilya'nın Singapur'a satışında hemen görülebilir bir değişiklik beklenirken, Singapur mallarının Mercosur'a girişinde kalemlerin büyük bölümü hâlâ eski vergiyle karşılaşıyor. Başka bir mekanizma da bu tabloyu bozabilir: Singapur bir yeniden ihracat merkezi olduğundan, tarife değişmeden de yükün güzergâhı değişebilir.", "en": "The two schedules are two different prices for the same agreement. One side's opening completes at a stroke; the other side pays in instalments. The first year's measurable effect may accordingly run in one direction: a visible change can be expected in Brazil's sales to Singapore, while most lines still meet the old duty when Singaporean goods enter Mercosur. Another mechanism could disturb that picture: because Singapore is a re-export hub, cargo may change route without any tariff changing.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Hangi kalem ne zaman serbest kalıyor", "en": "Which line is freed, and when"}, "ps": [{"tr": "İlk günden serbest kalan yüzde 20-25,6 ile nihai yüzde 95,8-96 arasındaki aralık, Mercosur'un pazarlıkta koruduğu şeyin ölçüsü. Bir anlaşmanın hangi sektörü kolladığı, kapsam oranından çok bu aradan okunur; 15 yıllık kuyruğun içinde kalan kalemler, bloğun uyum yükünü kime ve ne zamana ertelediğini gösterir. Kapsam oranı yüksek göründüğünde bile taksit takvimi asıl hükümdür.", "en": "The band between the 20–25.6 percent freed on day one and the eventual 95.8–96 percent is the measure of what Mercosur protected in the bargain. Which sector an agreement shields is read less from its coverage ratio than from that gap; the lines left inside the 15-year tail show to whom and to when the bloc has deferred the burden of adjustment. Even when the coverage ratio looks high, the instalment schedule is the operative provision.", "refs": ["mercosur-singapore"]}, {"tr": "Yükün kimde kaldığı da buradan çıkıyor. Brezilyalı ihracatçı erişimi ilk gün alıyor; Mercosur'daki ithalatçı ve alıcı, ucuzlamayı yıllara bölünmüş biçimde alıyor. Korunan üretici için bu bir nefes payı, aynı kalemi girdi olarak kullanan imalatçı için gecikmiş bir maliyet avantajı. Tek bir oran iki farklı taraf için iki farklı anlam taşıyor.", "en": "Where the burden falls follows from the same place. The Brazilian exporter gets access on day one; the importer and the buyer inside Mercosur get the price relief split across years. For the protected producer that is breathing room; for the manufacturer using the same line as an input it is a delayed cost advantage. A single percentage carries two different meanings for two different parties.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Sınanabilir yer", "en": "Where this can be tested"}, "ps": [{"tr": "Takvim farkının gerçekten iş görüp görmediği gümrük serisinde sınanabilir. Yılın son çeyreğinde Brezilya'nın Singapur'a ihracatı geçen yılın aynı aylarına göre belirgin biçimde artarken Singapur'dan Mercosur'a ithalat aynı ölçüde artmazsa, asimetri beklendiği gibi çalışıyor demektir. İki yön birlikte hareket ederse açıklamayı tarifede değil talepte aramak gerekir.", "en": "Whether the gap between schedules actually does work can be tested in the customs series. If, in the final quarter of the year, Brazil's exports to Singapore rise markedly against the same months of last year while imports from Singapore into Mercosur do not rise as much, the asymmetry is working as expected. If both directions move together, the explanation has to be sought in demand rather than in the tariff.", "refs": ["mercosur-singapore"]}]}], "sources": [{"key": "mercosur-singapore", "kind": "news", "name": "The Rio Times", "url": "https://www.riotimesonline.com/brazil-ratifies-mercosur-singapore-free-trade-agreement/", "title": {"tr": "Mercosur-Singapur ticaret anlaşması Brezilya için 1 Ağustos'ta yürürlüğe giriyor", "en": "The Mercosur-Singapore trade agreement takes effect for Brazil on 1 August"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-05", "title": {"tr": "Riyad'a gitmeyen ziyaret", "en": "The visit that did not go to Riyadh"}, "excerpt": {"tr": "Irak Ulusal Güvenlik Konseyi saldırıları egemenlik ihlali saydı ve Başbakan Ali el-Zeydi, göreve geldiğinden bu yana Riyad'a yapacağı ilk ziyareti iptal etti. İptal edilen ziyaret Irak'ın kendi girişimiydi; bedeli de bu yüzden Irak'ta kalıyor.", "en": "Iraq's National Security Council called the strikes a violation of sovereignty, and Prime Minister Ali al-Zaidi cancelled the first visit to Riyadh he was to make since taking office. The cancelled visit was Iraq's own initiative, which is why the cost of cancelling it stays in Iraq."}, "sections": [{"h": {"tr": "İptal edilen şey kimin girişimiydi", "en": "Whose initiative was cancelled"}, "ps": [{"tr": "Başbakan Ali el-Zeydi'nin başkanlık ettiği Irak Ulusal Güvenlik Konseyi, Haşdi Şabi üslerine çarşamba günü yapılan saldırıları \"Irak'ın egemenliğinin açık bir ihlali\" olarak nitelendirdi ve saldırıların uluslararası hukuk ilkelerine ve BM Şartı'na aykırı olduğunu bildirdi. El-Zeydi, perşembe günü Riyad'da yapması beklenen ilk resmî Suudi Arabistan ziyaretini protesto amacıyla iptal etti.", "en": "Iraq's National Security Council, chaired by Prime Minister Ali al-Zaidi, called Wednesday's strikes on Popular Mobilisation Forces bases \"a flagrant violation of Iraq's sovereignty\" and said they contravened the principles of international law and the UN Charter. Al-Zaidi cancelled in protest the first official visit to Saudi Arabia he had been due to make in Riyadh on Thursday.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın elindeki karşılık seçenekleri arasında bu, kendisine en pahalı geleni. Ziyaret Riyad'ın Irak'a verdiği bir imtiyaz değildi; Irak'ın Riyad'a doğru attığı bir adımdı. İptal, karşı tarafın kaybını değil kendi programının kaybını üretiyor ve bir devletin kendi girişiminden vazgeçmesi, ilan edilen bir kınamadan daha somut bir maliyet taşıyor. Daha içe dönük bir açıklama da geçerli olabilir: iptal, vurulan silahlı grubun ve onun siyasi temsilinin beklentisini karşılamayı hedefliyor olabilir.", "en": "Among the responses available to Iraq, this is the one that costs Iraq most. The visit was no favour Riyadh granted Iraq; it was a step Iraq was taking towards Riyadh. Cancelling it produces a loss in Iraq's own programme rather than in the other party's, and a state giving up its own initiative carries a more concrete cost than a declared condemnation. A more inward-facing explanation may also hold: the cancellation may be aimed at meeting the expectations of the armed group that was struck and of its political representation.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Tek metin, iki muhatap", "en": "One text, two audiences"}, "ps": [{"tr": "Haşdi Şabi, Kerkük'ten Basra'ya uzanan yedi ilde en az 20 mensubunun öldüğünü ve 32 kişinin yaralandığını açıkladı; Irak ve İran medyası en az dört Devrim Muhafızları danışmanının öldüğünü bildirdi. Suudi Savunma Bakanlığı ise saldırıların Irak topraklarından petrol tesislerine yönelik insansız hava aracı saldırılarına yanıt olduğunu ve tırmanma istemediklerini söyledi. İki anlatı aynı olayı iki farklı sorumluluk zincirine bağlıyor.", "en": "The Popular Mobilisation Forces said at least 20 of its members were killed and 32 wounded across seven provinces from Kirkuk to Basra; Iraqi and Iranian media reported at least four Revolutionary Guard advisers killed. Saudi Arabia's defence ministry said the strikes answered drone attacks on petroleum facilities launched from Iraqi territory and that it does not seek escalation. The two accounts attach the same event to two different chains of responsibility.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın açıklaması iki muhataba birden konuşmak zorunda: vurulan silahlı gücün siyasi çevresine ve yatırım ile enerji bağı kurmak istediği komşusuna. Egemenlik dili bu ikisini aynı cümlede taşıyabiliyor, çünkü hukuki bir ihlal saptıyor ve karşılık verilecek bir düşman adı koymuyor. Suudi bakanlığın tırmanma istemediği yönündeki ifadesi de aynı işlevi ters yönden görüyor; iki taraf da olayı kapatılabilir bir çerçevede tutuyor.", "en": "Iraq's statement has to speak to two audiences at once: the political circle of the armed force that was struck, and the neighbour with which it wants investment and energy ties. The language of sovereignty can carry both in one sentence, because it establishes a legal violation while naming no enemy to be answered. The Saudi ministry's statement that it does not seek escalation serves the same function from the other direction; both sides keep the event inside a frame that can be closed.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Ziyaretin yeni tarihi ne söyleyecek", "en": "What the visit's new date will say"}, "ps": [{"tr": "Kınamanın sınırlı bir işaret mi yoksa yön değişikliği mi olduğu, ziyaretin akıbetinden anlaşılacak. Üç ay içinde ziyaret yeni bir tarihte gerçekleşir ve Irak kamuya açık bir tazminat talebi ile üslerin statüsünde bir değişiklik istemezse, egemenlik dili kapatılabilir bir çerçeve olarak kullanılmış olur. Ziyaret bu süre içinde yapılmazsa, Riyad'a dönük açılımın maliyeti Irak'ın hesapladığından yüksek çıkmış demektir.", "en": "Whether the condemnation was a bounded signal or a change of direction will be shown by what happens to the visit. If within three months it takes place on a new date and Iraq makes no public demand for compensation or change in the status of the bases, the language of sovereignty will have been used as a frame that can be closed. If the visit does not happen in that time, the cost of the opening towards Riyadh will have proved higher than Iraq reckoned.", "refs": ["iraq-sovereignty"]}]}], "sources": [{"key": "iraq-sovereignty", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/iraq-calls-saudi-us-attacks-flagrant-violation-of-sovereignty", "title": {"tr": "Irak, ABD-Suudi saldırılarını egemenlik ihlali sayıp başbakanın Riyad ziyaretini iptal etti", "en": "Iraq calls the US-Saudi strikes a sovereignty violation and cancels the PM's Riyadh trip"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-06", "title": {"tr": "Altıdan yediye, ikinci kez", "en": "From six to seven, for the second time"}, "excerpt": {"tr": "Nikaragua'da aynı anayasa maddesi iki yıl içinde ikinci kez yazılıyor. 2024'te görev süresi beşten altıya çıktı, şimdi yediye taşınıyor. Bu kez eklenen hüküm ise süreyi bırakıp kimin aday olabileceğini düzenliyor.", "en": "In Nicaragua the same constitutional clause is being written for the second time in two years. In 2024 the presidential term went from five to six years; now it moves to seven. The clause added this time leaves the term aside and regulates who may stand."}, "sections": [{"h": {"tr": "Aynı maddenin ikinci yazımı", "en": "The second writing of the same clause"}, "ps": [{"tr": "Kongre'ye gönderilen taslak, cumhurbaşkanlığı görev süresini altı yıldan yenilenebilir yedi yıla çıkarıyor ve \"hain\" ile \"darbeci\" olarak tanımlanan muhalifleri seçimlerin dışında bırakıyor. Kongre Başkanı Gustavo Porras taslağı salı günü okurken yönetim sisteminin \"fiilen yedi yıllık, yenilenebilir bir görev süresiyle örgütlenmeyi önerdiğini\" söyledi; onay eylülde bekleniyor. 2024'te kabul edilen değişiklik ise süreyi beş yıldan altı yıla çıkarmış ve Rosario Murillo'nun konumunu yükseltmişti.", "en": "The draft sent to Congress raises the presidential term from six to seven renewable years and excludes opposition figures described as traitors and coup-plotters from elections. Reading the draft on Tuesday, Congress President Gustavo Porras said the system of government \"proposes to be organised with an effective term of seven renewable years\"; approval is expected in September. The amendment adopted in 2024 had raised the term from five to six years and elevated the position of Rosario Murillo.", "refs": ["nicaragua-reform"]}, {"tr": "İki değişiklik aynı meclisten geliyor ama aynı araç sayılamaz. Süre uzatması bir yarışmayı erteler; uygunluk kuralı o yarışmayı ortadan kaldırır. Bu ayrım, iki metni tek bir eğilimin devamı saymayı engelleyen asıl farktır: birincisi makamı elde tutmaya, ikincisi karşı tarafın adaylığını hukuki bir kategoriye bağlamaya yarar. Daha zayıf bir okuma da mümkün: vatandaşlıktan çıkarmalarla fiilen uygulanan bir dışlama yazıya geçiriliyorsa, hüküm mevcut uygulamanın tescili olabilir.", "en": "The two amendments come from the same assembly and cannot be treated as the same instrument. Extending a term postpones a contest; an eligibility rule removes it. That distinction is what prevents reading the two texts as one continuous tendency: the first serves to keep hold of the office, the second to tie the other side's candidacy to a legal category. A weaker reading is also available: if an exclusion already applied in practice through the stripping of citizenship is being put in writing, the clause may register existing practice.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Zamanlamayı açıklayan şey, cumhurbaşkanının muhalefetin hükümeti ele geçirmesini önlemek için ülkede seçim yapılmayacağı yönündeki sözleridir. Bir yönetim seçimin gereksiz olduğunu söyledikten sonra seçimi tümüyle kaldırmak yerine kimin aday olabileceğini yazıyorsa, seçimin biçimini korumayı sürdürmeyi tercih etmiş demektir. Nikaragua'da bir sonraki genel seçim 2027'nin sonunda yapılacak; kural bu tarihten önce onaylanacak biçimde takvime yerleştirilmiş.", "en": "What explains the timing is the president's statements that there would be no elections in the country, in order to stop the opposition from seizing the government. If a government, having said elections are dispensable, then writes down who may stand rather than abolishing the vote outright, it has chosen to keep the form of the election. Nicaragua's next general election is due in late 2027, and the rule has been placed on the calendar to be approved before that date.", "refs": ["nicaragua-reform"]}, {"tr": "Buradaki benzemezlik önemli. 2024 değişikliği yürütmenin içindeki yetkiyi tek bir hanede topluyordu; bu taslak ise yarışmanın giriş koşulunu yazıyor. Aynı yönde ilerleyen iki adım gibi görünseler de birincisi iktidarın kullanımını, ikincisi iktidara aday olma hakkını düzenliyor. Aralarındaki devamlılığı kuran şey, ikisini de geçiren aynı çoğunluk; metinlerin içeriği bu devamlılığı kurmuyor.", "en": "The disanalogy here matters. The 2024 amendment gathered authority inside the executive into a single household; this draft writes the entry condition for the contest. They may look like two steps in one direction, yet the first regulates the exercise of power and the second the right to stand for it. Continuity between them is established by the same majority that passes both; the content of the texts does not establish it.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Onaylanan metnin kendisi", "en": "The approved text itself"}, "ps": [{"tr": "Bu hükmün ne kadar geniş çalışacağı, eylülde onaylanan metnin dilinden okunacak. Kabul edilen madde belirli bir suçu ve yargısal bir tespiti değil bir kişi kategorisini adlandırıyorsa, uygunluk kararı mahkemeden idareye geçmiş olur. Tanımlanmış bir suç ve yargısal tespit şartı korunursa, dışlama hiç değilse bir usule bağlı kalır. İzlenecek yer, resmî gazetede yayımlanan nihai metnin bu iki seçenekten hangisini yazdığıdır.", "en": "How widely this clause will work is to be read from the language of the text approved in September. If the adopted article names a category of persons instead of a defined offence and a judicial finding, the eligibility decision will have moved from the courts to the administration. If a defined offence and a judicial finding are kept as requirements, the exclusion at least remains tied to a procedure. The place to watch is which of the two the final text published in the official gazette writes.", "refs": ["nicaragua-reform"]}]}], "sources": [{"key": "nicaragua-reform", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/nicaraguas-daniel-ortega-aims-to-bar-traitors-from-future-elections", "title": {"tr": "Ortega'nın anayasa taslağı \"hainleri\" seçimlerden çıkarıp görev süresini yediye taşıyor", "en": "Ortega's draft constitutional reform would bar \"traitors\" and lengthen the presidential term"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-01", "title": {"tr": "Malezya'da mülteci kartını hangi imza veriyor?", "en": "Who signs the refugee card in Malaysia?"}, "excerpt": {"tr": "Dışişleri Bakanı'nın talebi bir kurumu ülkeden çıkarmayı hedeflemiyor. Hedefi daha dar ve daha keskin: belge verme yetkisini tek imzadan çift imzaya taşımak.", "en": "The foreign minister's demand does not aim to expel an agency. Its aim is narrower and sharper: to move the power to issue a document from one signature to two."}, "sections": [{"h": {"tr": "Ortada imzalanmış bir metin yok", "en": "There is no signed text in the middle of this"}, "ps": [{"tr": "Malezya BM mülteci sözleşmesine taraf değil. Buna karşın Şubat 2026 sonu itibarıyla ülkede BM Mülteciler Yüksek Komiserliği'ne kayıtlı yaklaşık 126.000 Arakanlı bulunuyor. Yani kurumu ülkede tutan şey bir antlaşma yükümlülüğü değil, sürdürülen bir hoşgörü; Dışişleri Bakanı Mohamad Hasan bu haftaki açıklamasıyla o hoşgörünün koşullarını yüksek sesle telaffuz etti: \"İş birliği yapmak istemiyorlarsa, bence BMMYK'nın varlığını yeniden değerlendirmemizin zamanı geldi\".", "en": "Malaysia is not a party to the UN refugee convention. Even so, about 126,000 Rohingya were registered with the UN refugee agency in the country as of late February 2026. What keeps the agency in place, then, is a tolerance extended year after year rather than any treaty obligation — and this week the foreign minister, Mohamad Hasan, said out loud what that tolerance is conditional on: \"If they do not want to cooperate, in my opinion, it is time for us to reconsider the presence of UNHCR\".", "refs": ["malaysia-unhcr"]}, {"tr": "Açıklamanın zamanlaması bir olaya bağlı. Penang eyaletindeki evlerinden tahliye edilen 100'den fazla Arakanlı sığınmacı, Kuala Lumpur'daki BMMYK ofisinin önünde toplandıktan sonra yetkililerce gözaltına alındı. Kurum, gözaltındakileri korumak ve belgelerini doğrulamak için yetkililerle çalıştığını, bu çabaların onların başka bir barınma yerine nakledilmesine katkıda bulunduğunu bildirdi. Kurumun elindeki araç burada görünür hale geliyor: doğrulama ve ikna, tahliyeyi durdurma yetkisi değil.", "en": "The timing is tied to a specific episode. More than 100 Rohingya asylum seekers, evicted from their homes in Penang state, were detained by the authorities after gathering outside the UNHCR office in Kuala Lumpur. The agency said it was working with officials to protect those held and to verify their documentation, and that this had helped move them to alternative accommodation. What the agency actually holds becomes visible there: verification and persuasion, not the power to stop a detention.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Talep, belgeyi çift imzaya bağlamak", "en": "The demand is to put a second signature on the document"}, "ps": [{"tr": "Hasan'ın somut önerisi şu: belge verilmeden önce BMMYK ile yerel makamlar ortak tarama yapsın. Bakan ayrıca kurumun kişilerin kendi ülkelerinden çevrim içi başvuru yapmasına izin vermesini eleştirdi ve bunun daha fazla mülteciyi ülkeye çektiğini savundu. Bu iki cümle birlikte okunduğunda talebin konusu belli oluyor: statü belirleme kararının kimde kalacağı. Bugün karar tek bir kurumun; önerilen düzenlemede karar, ikinci bir makamın onayı olmadan sonuç doğurmuyor.", "en": "Hasan's concrete proposal is this: UNHCR and local authorities should screen jointly before any document is issued. He also criticised the agency for letting people apply online from their home countries, arguing that this draws more refugees in. Read together, the two statements make the subject of the demand clear — it is about where the status determination sits. Today that decision belongs to a single agency; under the proposed arrangement it would produce no effect without a second authority's approval.", "refs": ["malaysia-unhcr"]}, {"tr": "Bir hoşgörünün koşullu izne dönüşmesi, kâğıt üzerinde küçük bir değişiklik gibi görünür; pratikte belirleyicidir, çünkü koşulu yazan taraf o koşulu ne zaman sıkacağına da karar verir. Yine de daha sade bir okuma mümkün: görünür bir gözaltı olayının ardından iç kamuoyuna verilmiş bir yanıt, kalıcı bir yetki değişikliğinden çok. İki okuma arasındaki farkı bakanın cümleleri değil, ortaya çıkacak prosedür metni belirleyecek.", "en": "Turning a tolerance into a conditional permission looks like a small change on paper; in practice it is decisive, because whoever writes the condition also decides when to tighten it. A plainer reading is available, though: this may be an answer to a domestic audience after a visible detention episode rather than a durable shift in authority. What separates the two readings is the procedural text that does or does not appear, not the minister's sentences.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Ölçülebilir olan ne", "en": "What can actually be measured"}, "ps": [{"tr": "Bakılacak tek şey var: ortak taramanın belge verme aşamasında gerçekten bir kapı olup olmadığı. Ekim sonuna kadar iç işleri bakanlığı ortak tarama usulünü kamuya açık biçimde tanımlar ve bundan sonra verilen belgeler yerel makamın onayını taşırsa, yetki fiilen el değiştirmiş olur. Böyle bir usul tanımlanmazsa, bu çağrı bir pozisyonu ucuza kaydetmiş ama statüyü kimin belirlediğini değiştirmemiş olacak.", "en": "There is one thing to watch: whether joint screening becomes an actual gate at the point of issuance. If the home ministry publicly describes a joint screening procedure before the end of October and documents issued afterwards carry a local authority's approval, then the power will have changed hands in practice. If no such procedure is described, the call will have registered a position cheaply without altering who determines status.", "refs": ["malaysia-unhcr"]}]}], "sources": [{"key": "malaysia-unhcr", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/malaysian-foreign-minister-calls-for-review-of-unhcrs-presence", "title": {"tr": "Malezya Dışişleri Bakanı, BMMYK'nın ülkedeki varlığının gözden geçirilmesini istedi", "en": "Malaysia's foreign minister calls for a review of UNHCR's presence"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-02", "title": {"tr": "İki metin, tek boğaz", "en": "Two texts, one strait"}, "excerpt": {"tr": "Maskat ortak bir mekanizma önerdi, Tahran kendi şeridini istedi. Masada bugüne kadar üzerinde anlaşılan tek şey, teklif alışverişinin sürdüğü.", "en": "Muscat proposed a joint mechanism; Tehran asked for its own lane. So far the only thing agreed at the table is that proposals are still being exchanged."}, "sections": [{"h": {"tr": "Kefelerde iki farklı mekanizma", "en": "Two different mechanisms in the pans"}, "ps": [{"tr": "Umman'ın önerisi Malakka Boğazı düzenlemesini örnek alıyor: boğazı kullanan gemiler seyir güvenliği, çevre koruma ile arama ve kurtarma harcamalarını finanse eden bir \"gönüllü ücret\" ödüyor. Önerinin taşıdığı asıl hüküm ücret değil, ücretin gerektirdiği ortaklık; düzenleme İran'ın boğaz üzerinde tek başına denetim kurmasını engelliyor.", "en": "Oman's proposal is modelled on the Strait of Malacca arrangement: ships using the waterway pay a \"voluntary fee\" that funds navigation safety, environmental protection and search and rescue. The provision that matters is the partnership the fee requires rather than the fee itself; the arrangement would stop Iran from exercising sole control over the strait.", "refs": ["hormuz-proposals"]}, {"tr": "Tahran'ın karşı önerisi başka bir yerden başlıyor. Dışişleri Bakan Yardımcısı Kazım Garibabadi, eşit bölüşüm planının İran'ın güvenlik kaygılarını karşılamadığını söyledi ve İran'ın \"boğazın kendi tarafındaki gemi trafiğini yöneteceğini\", Umman'ın ise karşı şeridin tamamını değil bir bölümünü yöneteceğini belirtti. Garibabadi'ye göre Umman deniz trafiği için üç hat öneriyor: İran karasularından geçen bir hat, uluslararası bir hat ve Umman karasularından geçen bir hat.", "en": "Tehran's counter-proposal starts somewhere else. Iran's deputy foreign minister, Kazem Gharibabadi, said the equal-division plan did not meet Iran's security concerns, and that Iran would \"manage shipping through its side of the strait\" while Oman would manage part but not all of the opposite lane. As Gharibabadi described it, the Omanis are proposing three lines for maritime traffic: one through Iran's territorial waters, an international one, and one through Omani waters.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Mekanizmanın eksik ayağı", "en": "The missing leg of the mechanism"}, "ps": [{"tr": "Malakka örneğinin çalışmasını sağlayan şey hattın çizimi değil, ücreti toplayan ve harcayan bir gövdenin varlığıdır. Ortada dolaşan iki metinden hiçbiri böyle bir gövdeyi kamuya açık biçimde adlandırmıyor. Bu eksiklik iki türlü okunabilir: ya taraflar idari sorunu bilinçli olarak sonraya bıraktı ya da anlaşamadıkları asıl konu zaten burası. İkinci ihtimalin lehine bir işaret yok; sıralama tercihi de en az kilitlenme kadar olağan bir müzakere pratiği.", "en": "What makes the Malacca precedent work has less to do with where the lines are drawn than with the existence of a body that collects the fee and spends it. Neither of the two texts in circulation names such a body publicly. The gap admits two readings: either the parties deliberately deferred the administrative question, or that is precisely where they cannot agree. Nothing yet favours the second; sequencing is as ordinary a negotiating practice as deadlock.", "refs": ["hormuz-proposals"]}, {"tr": "Kefelere ne konduğuna bakmak gerekir. Umman'ın kazandığı, boğazın tek bir devletin tasarrufunda olmadığı bir düzen ve bu düzende kendisine düşen rol. İran'ın istediği, bir şerit üzerindeki denetiminin tanınması. Ancak Garibabadi aynı konuşmada Tahran'ın denetimi sürdürmek için çatışmaya dönmek de dahil \"her türlü eylemi\" değerlendireceğini söyledi. Masaya oturmuş bir taraf, masa dışındaki seçeneğini bu kadar açık tutuyorsa, teklifin fiyatı henüz belirlenmemiş demektir.", "en": "It is worth looking at what goes into each pan. What Oman gains is an order in which the strait is not at one state's disposal, and a role for itself within it. What Iran wants is recognition of its control over one lane. Yet in the same remarks Gharibabadi said Tehran would consider \"any action\" to maintain control, including resuming warfare. When a party that has taken its seat keeps its outside option that visible, the price of the offer has not yet been set.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Denge demek için erken", "en": "Too early to call it a balance"}, "ps": [{"tr": "Çatışmanın 28 Şubat'ta başlamasından önce boğazdan dünya enerji arzının beşte biri geçiyordu; kapanma küresel ticareti aksattı. Bu ölçekte bir aksama, teklif alışverişini kendiliğinden bir ilerleme saymayı cazip kılar. Oysa şimdiye kadar değişen şey temas kanalı; taraflardan hiçbirinin üstlendiği yeni bir taahhüt yok. Bir sonraki turda bakılacak somut şey açık: metinlerden biri ücreti toplayacak gövdeyi ve başlangıç tarihini adlandırıyor mu?", "en": "Before the conflict began on 28 February, one-fifth of the world's energy supplies passed through the strait, and its closure has disrupted global trade. A disruption that large makes it tempting to count an exchange of proposals as progress in itself. What has changed so far, though, is the channel of contact; neither side has taken on a new commitment. The concrete thing to look for in the next round is plain: does either text name the body that would collect the fee, and a date on which it starts?", "refs": ["hormuz-proposals"]}]}], "sources": [{"key": "hormuz-proposals", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/iran-and-oman-exchange-proposals-to-manage-strait-of-hormuz", "title": {"tr": "İran ve Umman, Hürmüz Boğazı'nın yönetimi için karşılıklı öneri sundu", "en": "Iran and Oman exchange proposals for managing the Strait of Hormuz"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-03", "title": {"tr": "Saat 17.45'te başlayan cevap dizisi", "en": "The reply that began at 17.45"}, "excerpt": {"tr": "Önlenen bir salvo ile aynı gün yapılan hava harekâtı arasında ölçülebilir tek büyüklük var: tempo.", "en": "Between an intercepted salvo and the same day's air operation, one quantity is measurable: tempo."}, "sections": [{"h": {"tr": "Önlenen salvo", "en": "The salvo that was stopped"}, "ps": [{"tr": "CENTCOM'un açıklamasına göre Devrim Muhafızları, ABD Doğu saatiyle 17.45'te Ortadoğu'daki ABD güçlerine yönelik sürpriz bir saldırı girişimi kapsamında birden fazla balistik füze fırlattı; füzelerin tamamı önlendi ve birlikler yüksek hazırlık düzeyinde kaldı. Fırlatma, Başkan Donald Trump'ın cuma günü diplomasiye alan açmak için verdiği arayı bozdu.", "en": "According to CENTCOM, Revolutionary Guard forces launched multiple ballistic missiles at 17.45 Eastern time in an attempted surprise attack on US forces based in the Middle East; all of them were intercepted and the troops stayed at a high state of readiness. The launch broke the pause President Donald Trump had ordered on Friday to make room for diplomacy.", "refs": ["centcom-intercept"]}, {"tr": "Tam önleme bir kabiliyet ölçüsüdür, ama neyin ölçüsü olduğuna dikkat etmek gerekir. Bu sonuç, o eksende savunma kapsamının salvonun boyuna yettiğini gösterir; fırlatıcı envanteri, yeniden yükleme süresi veya bir sonraki salvonun büyüklüğü hakkında bir şey söylemez. Komutanlık hedefin yerini de açıklamadı. Elde kalan doğrulanmış büyüklük tektir: bir kez denendi, tutmadı.", "en": "A complete interception measures a capability, but it is worth being careful about which one. The result shows that defensive coverage on that axis was sufficient for a salvo of that size; it says nothing about launcher inventory, reload time, or how large the next salvo could be. The command did not identify the location of the target either. One verified quantity remains: it was tried once, and it did not work.", "refs": ["centcom-intercept"]}]}, {"h": {"tr": "Aynı gün, ikinci hareket", "en": "Same day, second move"}, "ps": [{"tr": "Aynı gün ABD ve Suudi savaş uçakları Doğu Irak'ta çok sayıda hedefi vurdu. CENTCOM vurulan yerleri \"doğrudan Devrim Muhafızları yönlendirmesiyle işletilen terörist lojistik ve silah tesisleri\" olarak tanımladı ve harekâtın 72 saat içinde ABD güçleri ile Suudi enerji altyapısına yöneltilen 30'dan fazla insansız hava aracı saldırısına yanıt olduğunu bildirdi. Hedefler İran sınırındaki Diyala ve Vasıt vilayetlerinde yoğunlaştı; bu vilayetler toplanma alanı, lojistik koridoru ve fırlatma mevzii işlevi görüyor.", "en": "The same day, US and Saudi fighter aircraft struck multiple targets across eastern Iraq. CENTCOM described the sites as \"terrorist logistics and weapons sites operated under direct IRGC direction\" and said the operation answered more than 30 drone attacks against US forces and Saudi energy infrastructure over 72 hours. The targets were concentrated in Diyala and Wasit governorates along the Iranian border, which serve as staging areas, logistics corridors and launch positions.", "refs": ["iraq-strikes"]}, {"tr": "İki hareketi yan yana koyduğunuzda ortaya çıkan tercih şu: cevap, füze kuvvetine değil, fırlatma ağına yazıldı. Depoyu ve koridoru vurmak, salvoyu vurmaktan farklı bir maliyet dayatmasıdır; hedefi tekrar üretmenin süresini uzatmayı amaçlar. Daha sade bir açıklama da mümkün: Irak'taki harekât zaten süregelen insansız hava aracı kampanyasına karşı planlanmış olabilir ve aynı güne denk gelmesi sıralamadan çok tesadüf olabilir. Kamuya açık malzeme iki okumayı da ayırt etmeye yetmiyor.", "en": "Set the two moves side by side and the choice becomes visible: the reply was addressed to the launch network, not to the missile force. Hitting a depot and a corridor imposes a different cost from hitting a salvo; it aims to lengthen the time needed to reconstitute. A plainer explanation is also available: the Iraq operation may already have been planned against the running drone campaign, and falling on the same day may be coincidence rather than sequence. The
