değerlendirmesine göre Hamas'ın silahsızlanmak yerine askerî gücünü yeniden kurmakta kararlı olduğunu söyledi. Spielman, \"Silahsızlanmak, silahları fiilen teslim etmek demektir. Daha azı değil\" ifadesini kullandı.", "en": "Doron Spielman, a spokesperson for Prime Minister Benjamin Netanyahu's office, told the Associated Press that Israel has \"serious security concerns\" about the proposed disarmament agreement and that its assessment is that Hamas remains committed to rebuilding its military rather than genuinely demilitarising. \"Disarming means physically giving up the weapons. Nothing less,\" he said."}, "detail": {"tr": "Spielman, Hamas silahsızlanmadan İsrail'in konuşlanmasını değiştirmesi hâlinde örgütün \"Gazze genelinde varlığını hızla genişleteceğini, terör altyapısını yeniden kuracağını\" söyledi. AP'nin doğruladığı anlaşma metnine göre, Hamas yönetimindeki polisin elindeki silahlar ABD destekli bir Filistin komitesi göreve geldiğinde bu komiteye devrediliyor; ağır silahların etkisizleştirilmesi ise komitenin konuşlanmasının ardından, aşamalı bir İsrail çekilmesine bağlı olarak başlıyor. Hamas, dokuz ay önce imzalanan ABD arabuluculuğundaki ateşkes kapsamında silahsızlanmaya başlayacağını açıklamıştı. Beyaz Saray, İsrail'in bu değerlendirmesine yorum yapmadı. Gazze'deki hastanelere göre gece boyunca süren İsrail saldırılarında çocuklar dahil en az 17 kişi öldü.", "en": "Spielman said that if Israel redeploys before Hamas is disarmed, the group \"will quickly expand its presence throughout Gaza, rebuild its terrorist infrastructure\". Under a copy of the agreement verified by the AP, weapons held by Hamas-run police pass to a US-backed Palestinian committee once it arrives, and the decommissioning of heavy weapons begins after that committee deploys, linked to a phased Israeli withdrawal. Hamas has said it will begin disarming under the US-brokered ceasefire signed nine months ago. The White House did not comment on Israel's assessment. At least 17 people, including children, were killed in overnight Israeli strikes, according to hospitals in Gaza."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "BBC News", "url": "https://www.bbc.co.uk/news/articles/czjlvvkzj20o", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Filistinli yetkililer, Gazze'ye ikinci gece süren saldırılarda en az 13 kişinin öldüğünü bildirdi", "en": "Palestinian officials report at least 13 killed in a second night of strikes on Gaza"}, "summary": {"tr": "Gazze Sivil Savunma İdaresi, İsrail savaş uçaklarının Gazze kenti, Han Yunus ve Deyr el-Belah'ı vurduğunu açıkladı; Filistinli yetkililer ölü sayısını, aralarında çocukların da bulunduğu en az 13 olarak verdi. İsrail ordusu sözcüsü, hedefin silahlı unsurlar olduğunu ve iki Hamas komutanının öldürüldüğünü söyledi. İsrail Enerji Bakanı Eli Cohen, bölgeye yönelik saldırıların durdurulmasına dair bir anlaşmaya varılmadığını belirtti.", "en": "Gaza's Civil Defence Authority said Israeli aircraft struck Gaza City, Khan Younis and Deir el-Balah, and Palestinian officials put the toll at at least 13, including several children. An Israel Defense Forces spokesperson said the military was targeting militants and that two Hamas commanders were killed. Israel's energy minister, Eli Cohen, said no agreement had been reached to stop attacks on the territory."}, "detail": {"tr": "Filistinli sağlık yetkilileri, Gazze kentinde bir konut binasına yapılan saldırıda biri çocuk iki kişinin, Cebeliya yakınlarında bir kişinin öldüğünü bildirdi; Han Yunus'ta bir eve düzenlenen saldırıda anne, baba ve dokuz yaşındaki oğulları, Deyr el-Belah'ta ise vurulan apartmanda bir kadın ile bir erkek yaşamını yitirdi. İsrail ordusu X'te, Nuhbe gücünden ve Meğazi Taburu'ndan birer komutanı öldürdüğünü duyurdu. Reuters'a konuşan Cohen, Hamas silahsızlanmazsa bölgenin tümüyle İsrail denetimine alınması gerektiğini düşündüğünü söyledi ve Gazze'nin şu anda yüzde 70'inin İsrail denetiminde olduğunu belirtti. Geçen ekimde yürürlüğe giren ateşkesten bu yana 1.100'den fazla Filistinli öldürüldü.", "en": "Palestinian health officials said two people, including a child, were killed in a strike on a residential building in Gaza City and another person near Jabalia; a father, mother and their nine-year-old son were killed in Khan Younis, and a man and a woman died when their apartment block was struck in Deir el-Balah. The IDF said on X that it had killed commanders from the Nukbha force and the Maghazi Battalion. Cohen, quoted by Reuters, said he saw a need for the strip to be placed under full Israeli control if Hamas did not disarm, and put the share of Gaza currently under Israeli control at 70 percent. More than 1,100 Palestinians have been killed since the ceasefire took effect last October."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/migrant-deaths-in-ceuta-rise-to-72-after-border-surge-from-morocco", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "İspanyol yetkililer Ceuta'da ölü sayısını 72 olarak verdi; geçenlerin neredeyse tamamı Fas'a döndü", "en": "Spanish officials put the Ceuta death toll at 72 as almost all who crossed return to Morocco"}, "summary": {"tr": "İspanya hükümetinin Ceuta temsilcisi Miguel Angel Perez, perşembe günü başlayan Fas'tan geçiş dalgasının ardından en az 72 kişinin öldüğünü söyledi. Ceuta yöneticisi Juan Jesus Vivas ise morga 88 cenaze geldiğini, bu sayının daha önceki geçiş girişimlerini de kapsadığını belirtti. Pazar günü kıyı şeridinde beş ceset daha bulundu.", "en": "Miguel Angel Perez, the Spanish government's representative in Ceuta, said at least 72 people had died after the surge of crossings from Morocco that began on Thursday. Ceuta's leader, Juan Jesus Vivas, said the morgue had received 88 bodies, a figure that includes earlier crossing attempts. Five more bodies were found along the coastline on Sunday."}, "detail": {"tr": "Birkaç gün içinde yaklaşık 60.000 kişi İspanya'nın Kuzey Afrika'daki özerk kenti Ceuta'ya geçti; bunların 48.000'den fazlası 48 saat içinde Fas'a döndü. İspanya Dışişleri Bakanı Jose Manuel Albares, \"Ceuta'ya girenlerin neredeyse tamamı Fas'a döndü\" dedi. Dalganın başlamasından bu yana sağlık hizmetleri 1.000'den fazla kişiyi tedavi etti. İspanya cumartesi günü kıyı açığına 500 metrelik yüzer bariyer kurdu, İtalya İspanya ile pasaportsuz Schengen geçişlerini askıya aldı, 22 AB üyesi ise sınırda eşgüdümlü adım çağrısı yaptı. İspanyol haber ajansı EFE, ölü sayısının artmasının beklendiğini bildirdi.", "en": "Around 60,000 people crossed into the Spanish exclave over several days, and more than 48,000 of them returned to Morocco within 48 hours. Spain's foreign minister, Jose Manuel Albares, said \"virtually all those who entered [Ceuta] have now returned to Morocco\". Health services have treated more than 1,000 people since the surge began. Spain installed a 500-metre floating barrier off the coast on Saturday, Italy suspended passport-free Schengen travel with Spain, and 22 EU member states called for coordinated action at the border. The Spanish news agency EFE reported that the toll is expected to rise."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Arakçi, İran'ın Umman'la Hürmüz görüşmelerinin son aşamada olduğunu söyledi", "en": "Araghchi says Iran's talks with Oman on the Strait of Hormuz are in their final stages"}, "summary": {"tr": "İran Dışişleri Bakanı Abbas Arakçi, Telegram paylaşımında Umman'la Hürmüz Boğazı'na ilişkin müzakerelerin \"sonuçlandırılma yolunda\" olduğunu belirtti. Dışişleri Sözcüsü İsmail Bakai, iki tarafın egemenlik haklarına saygılı, \"her iki tarafça kabul edilebilir bir güzergâh üzerinde bir mutabakata\" doğru ilerlediğini söyledi. Ortaya çıkmış bir metin yok.", "en": "Foreign Minister Abbas Araghchi said in a Telegram post that negotiations with Oman over the Strait of Hormuz were \"on the way to being finalised\". Foreign ministry spokesperson Esmail Baghaei said the two sides were moving toward \"an understanding on a route acceptable to both sides\" that respects sovereign rights. No text has been published."}, "detail": {"tr": "Cumhurbaşkanı Mesud Pezeşkiyan, ABD'yle imzalanacak bir mutabakat muhtırasının Tahran'ın gelecekteki dış ilişkilerinin \"temel taşı\" olacağını söyledi. İran Meclisi ulusal güvenlik komisyonu sözcüsü Hassam Gaşgavi, bir İran heyetinin yeniden Maskat'a gidebileceğini belirtti. Trump ise hızla anlaşmaya varılması hâlinde ABD ve İsrail'in yeni saldırıları durdurmayı kabul ettiğini, bunun \"Hürmüz Boğazı'nın derhâl, eksiksiz ve tam olarak AÇILMASINI\" kapsayacağını yazdı. Haziranda varılan ateşkes gemi güzergâhları anlaşmazlığı yüzünden çökmüş, çatışmalar temmuzda yeniden başlamıştı. Boğazdan küresel petrol tüketiminin yaklaşık yüzde 20'si geçiyor.", "en": "President Masoud Pezeshkian said a memorandum of understanding with the United States would become the \"cornerstone\" of Tehran's future foreign relations. Hassam Ghashghavi, spokesperson for the Iranian parliament's national security committee, said an Iranian delegation might travel to Muscat again. Trump said the United States and Israel had agreed to halt new attacks if a deal were reached rapidly, and that it would include the \"Immediate, Complete, and Total OPENING OF THE HORMUZ STRAIT\". A June ceasefire collapsed over shipping-route disputes and fighting resumed in July. The strait carries about 20 percent of global oil consumption."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/suicide-bomber-kills-14-outside-police-station-in-pakistans-swat", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Pakistan'ın Swat vadisinde bir karakolun önünde en az 14 kişi öldürüldü", "en": "At least 14 killed by a suicide bomber at a police station in Pakistan's Swat valley"}, "summary": {"tr": "Swat Emniyet Müdür Yardımcısı Fida Hüseyin, pazar akşamı Hayber Pahtunhva eyaletinin Kabal ilçesinde bir karakolun girişinde bombasını patlatan saldırganın en az 14 kişiyi öldürdüğünü, 22 kişiyi yaraladığını bildirdi. İlçe Emniyet Amiri Ömer Han, polislerin saldırganı aramaya çalıştığını, adamın bunun üzerine bombayı patlattığını söyledi. Saldırıyı üstlenen olmadı.", "en": "Swat Deputy Inspector General Fida Hussain said at least 14 people were killed and 22 wounded when a bomber detonated explosives at the entrance of a police station in Kabal, in Khyber Pakhtunkhwa province, on Sunday evening. District Police Officer Umar Khan said officers had tried to search the man before he detonated. No group claimed responsibility."}, "detail": {"tr": "Patlama, yakındaki bir kavşakta toplanmış, bölgede tırmanan şiddete karşı hükümetin adım atmasını isteyen yüzlerce göstericinin yanı başında meydana geldi. Cumhurbaşkanı Asıf Ali Zerdari, Başbakan Şahbaz Şerif ve İçişleri Bakanı Muhsin Nakvi saldırıyı kınadı. Pakistan Çatışma ve Güvenlik Çalışmaları Enstitüsü araştırmacıları, eyalette temmuz ayında terörle bağlantılı olarak sınıflandırdıkları 154 ölüm saptadı; bu, haziran rakamının iki katından fazla. Al Jazeera, Pakistan Talibanı'nın bölgede yakın dönemde eylemler yaptığını aktardı; ancak örgüt bu saldırıyı üstlenmedi.", "en": "The blast struck beside hundreds of protesters who had gathered at a nearby intersection to demand government action against escalating violence in the region. President Asif Ali Zardari, Prime Minister Shehbaz Sharif and Interior Minister Mohsin Naqvi condemned the attack. Researchers at the Pakistan Institute for Conflict and Security Studies recorded 154 deaths in the province during July that they classify as terrorism-related, more than double the June figure. Al Jazeera noted that the Pakistani Taliban has carried out recent operations in the area, but the group has not claimed this attack."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/saudi-crown-prince-mbs-urges-trump-to-prioritise-dialogue-in-us-iran-war", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Suudi devlet ajansı, veliaht prensin Trump'a diplomasiye öncelik verme çağrısı yaptığını bildirdi", "en": "Saudi state agency says the crown prince urged Trump to prioritise dialogue with Iran"}, "summary": {"tr": "Suudi Basın Ajansı, Veliaht Prens Muhammed bin Selman'ın Başkan Donald Trump'la telefonda görüştüğünü ve \"tırmanmayı azaltmak için diyaloğa öncelik verilmesi gerektiğini\" vurguladığını duyurdu. Ajansa göre veliaht prens ayrıca Körfez güvenliğinin korunmasına ve daha geniş bir çatışmanın önlenmesine dikkat çekti.", "en": "The Saudi Press Agency said Crown Prince Mohammed bin Salman spoke to President Donald Trump by telephone and stressed \"the need to prioritise dialogue to reduce escalation\". The agency said he also emphasised preserving Gulf security and preventing a wider conflict."}, "detail": {"tr": "Al Jazeera, görüşmenin Trump'ın planlanan saldırıları durduracağını açıklamasından saatler önce yapıldığını bildirdi ve ABD basınına dayanarak, veliaht prensin kaygısının İran'ın enerji altyapısına yönelik büyük saldırıların Körfez'deki petrol ve gaz tesislerine misillemeye yol açması olduğunu aktardı. Veliaht prensin gerekçesine ilişkin bu aktarım bağımsız biçimde doğrulanmadı. Trump, Truth Social'da \"bir anlaşmanın çerçevesi üzerinde uzlaşıldığı\" için saldırıları askıya alacağını, bunun Hürmüz Boğazı'nın yeniden açılmasını kapsadığını yazdı.", "en": "Al Jazeera reported that the call took place hours before Trump announced he would halt planned strikes, and cited US media reporting that the crown prince's concern was that major strikes on Iranian energy infrastructure could bring Iranian retaliation against Gulf oil and gas facilities. That account of his motive has not been independently confirmed. Trump wrote on Truth Social that he would suspend attacks because \"the perimeters of a deal has been agreed to\", involving the reopening of the Strait of Hormuz."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/02/italian-navy-boards-tanker-from-russian-shadow-fleet", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "AB deniz görev gücü, yaptırım listesindeki Toa Payoh tankerine Pantelleria açıklarında çıktı", "en": "An EU naval mission boards the sanctioned tanker Toa Payoh off Pantelleria"}, "summary": {"tr": "İtalyan askerî personeli, AB yaptırımları kapsamındaki Toa Payoh tankerine pazar sabahı Pantelleria'nın batısındaki uluslararası sularda çıktı; operasyon EUNAVFOR MED Irini kapsamında yürütüldü. Kamerun bayrağı taşıdığını beyan eden gemi, 16 Temmuz'da Benin'in Cotonou limanından ayrılmış ve İstanbul'a gidiyordu. İtalya Savunma Bakanlığı, aramanın geminin tabiiyetini ve bayrağını doğrulamak için yapıldığını bildirdi.", "en": "Italian military personnel boarded the EU-sanctioned tanker Toa Payoh in international waters west of Pantelleria on Sunday morning, in an operation conducted under EUNAVFOR MED Irini. The vessel, which declared Cameroon as its flag, had left Cotonou in Benin on 16 July bound for Istanbul. Italy's defence ministry said the boarding was carried out to verify the ship's nationality and flag."}, "detail": {"tr": "Arama ekibi, İtalyan savaş gemisi Thaon di Revel'den helikopterle indirildi; operasyona bir Yunan gemisi ile bir Polonya devriye uçağı destek verdi ve arama yaklaşık iki saat sürdü. İtalya, bir savaş gemisinin belirli koşullarda ticaret gemisinin tabiiyetini denetlemesine izin veren BM Deniz Hukuku Sözleşmesi'nin 110. maddesine dayandığını açıkladı. Savunma Bakanı Guido Crosetto operasyonu \"İtalya'nın Akdeniz güvenliğine ve Avrupa Birliği'nin eylemine katkısının somut bir göstergesi\" diye nitelendirdi. Bakanlığa göre tankerin kaptanı başlangıçta istenen iş birliğini göstermedi. İtalyan makamları arama sırasında elde edilen bilgi ve belgeleri şu anda inceliyor. Irini, 2020'de Libya'ya yönelik BM silah ambargosunu uygulamak için kurulmuş, görev alanı sonradan AB hükûmetlerince doğrulama aramalarını kapsayacak biçimde genişletilmişti.", "en": "The boarding party was landed by helicopter from the Italian warship Thaon di Revel, with support from a Greek vessel and a Polish patrol aircraft, and the operation lasted about two hours. Italy said it acted under Article 110 of the UN Convention on the Law of the Sea, which allows a warship to check a merchant ship's nationality in defined circumstances. Defence Minister Guido Crosetto called it \"a concrete demonstration of Italy's contribution to the security of the Mediterranean and to the European Union's action\". According to the ministry the tanker's master initially did not provide the cooperation requested. Italian authorities are currently reviewing the information and documentation obtained during the inspection. Irini was launched in 2020 to enforce the UN arms embargo on Libya, and its scope was later broadened by EU governments to include verification boardings."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Fox News", "url": "https://www.foxnews.com/world/satellite-images-show-evidence-oil-leak-spreading-sanctioned-vessel-near-oman", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Uydu görüntüleri, Umman açıklarındaki yaptırımlı tankerden yayılan petrol tabakasını gösteriyor", "en": "Satellite images reviewed by AP show a spreading oil sheen from a sanctioned tanker off Oman"}, "summary": {"tr": "Associated Press'in incelediği Planet Labs uydu görüntülerine göre, haziran ayından bu yana Umman'ın güney kıyısı açıklarında mahsur kalan Kamerun bayraklı Suezmax tankeri Caroline Bezengi'den yaklaşık 20 kilometrekarelik bir petrol tabakası yayıldı; 31 Temmuz itibarıyla koyu ham petrol lekeleri kıyıya ulaştı. Gemi, Rus ham petrolü taşıdığı gerekçesiyle İngiltere, AB, Kanada ve İsviçre'nin yaptırım listelerinde.", "en": "The Associated Press, reviewing Planet Labs satellite images, found that an oil sheen covering roughly 20 square kilometres had spread from the Caroline Bezengi, a Cameroon-flagged Suezmax tanker stranded off Oman's southern coast since June, with dark crude reaching the shoreline as of 31 July. The vessel is sanctioned by the UK, the EU, Canada and Switzerland over the transport of Russian crude."}, "detail": {"tr": "Sızıntı, Umman'ın Hallaniyat Adaları'ndaki Kıbliye Adası yakınlarında, nesli tehlike altındaki kuş türlerine ev sahipliği yapan korumalı bir Arap Denizi deniz koruma alanına doğru ilerliyor. Hollanda merkezli PAX kuruluşundan Wim Zwijnenburg, son günlerin görüntülerinin tabaka büyüdükçe dışarı çıkan petrolün arttığını gösterdiğini söyledi; tankerin 800.000 varilden fazla yük taşıdığını tahmin etti ve muson havasının gövdeyi parçalayabileceği uyarısında bulundu. Mürettebat haziranda gemide patlama olduğunu bildirmişti. Tanker, Rus petrolünü Karadeniz'deki Novorossiysk limanından yüklemişti. Uluslararası Denizcilik Örgütü durumu izliyor; Umman geminin ve yükünün 23 Temmuz'a kadar kaldırılmasını istemişti, bu talimata uyulup uyulmadığı belirsiz.", "en": "The slick is spreading near Qibliyah Island in Oman's Hallaniyat Islands, a protected Arabian Sea marine reserve that is home to endangered birds. Wim Zwijnenburg of the Dutch organisation PAX said imagery from the past few days indicates an increase in oil coming out as the size of the sheen grows, estimated that the tanker is carrying more than 800,000 barrels, and warned that monsoon weather could break the hull apart. The crew reported an onboard explosion in June. The tanker had loaded Russian oil at Novorossiysk in the Black Sea. The International Maritime Organization is monitoring the situation, and Oman ordered the removal of the vessel and its cargo by 23 July; whether that order was met is not clear."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c9v471x89m3o", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Uganda, Entebbe baskınından elli yıl sonra Yonatan Netanyahu'nun heykelini açtı", "en": "Uganda unveils a statue of Yonatan Netanyahu at Entebbe fifty years after the hostage rescue"}, "summary": {"tr": "Uganda, 1976 Entebbe kurtarma harekâtında ölen tek İsrail askeri ve İsrail başbakanının ağabeyi olan Yonatan Netanyahu'nun heykelini, operasyonun geçtiği eski havaalanı terminalinin önünde açtı. Uganda Genelkurmay Başkanı Orgeneral Muhoozi Kainerugaba, anıtın Netanyahu'nun cesaretini ve özverili hizmetini onurlandırdığını söyledi ve İsrail'le ilişkileri \"dikkate değer bir yolculuk\" diye nitelendirdi.", "en": "Uganda has unveiled a statue of Yonatan Netanyahu, the older brother of Israel's prime minister and the only Israeli soldier killed in the 1976 Entebbe rescue, outside the old airport terminal where the operation took place. Uganda's army chief, Gen Muhoozi Kainerugaba, said the monument honoured his courage and selfless service and described relations with Israel as a \"remarkable journey\"."}, "detail": {"tr": "Kainerugaba, İsrail birliğiyle çarpışırken ölen en az 45 Ugandalı askeri de andı; onların \"haklı olduğuna inandıkları bir dava uğruna yiğitçe savaştığını\" söyledi ve \"bugün biliyoruz ki hizmet ettikleri Idi Amin hükûmeti, Uganda halkını temsil etmeyen acımasız bir diktatörlüktü\" diye ekledi. 3 Temmuz 1976'daki baskında 100'den fazla rehine kurtarıldı; iki Filistinli ile iki Alman, Tel Aviv'den kalkan bir Air France uçağını kaçırıp Libya üzerinden Uganda'ya yöneltmiş, Amin uçağı karşılamıştı. Operasyon sırasında üç rehine öldü; Dora Bloch ise sonradan Kampala'da bir hastanede öldürüldü. Kainerugaba bu dönemi \"tarihimizde acı bir bölüm\" diye anarken ilişkilerin \"karşılıklı güven, saygı ve iş birliğiyle tanımlanan bir ortaklığa\" dönüştüğünü söyledi.", "en": "Kainerugaba also acknowledged the at least 45 Ugandan soldiers killed fighting the Israeli force, saying they \"fought valiantly... in what they believed was a justified cause\" and adding that \"today, we know that the government of Idi Amin, which they served, was a brutal dictatorship which did not represent the Ugandan people\". The raid on 3 July 1976 rescued more than 100 hostages after two Palestinians and two Germans hijacked an Air France flight from Tel Aviv and diverted it, via Libya, to Uganda, where Amin welcomed it. Three hostages died during the operation and Dora Bloch was later killed in a hospital in Kampala. Kainerugaba called the episode \"a painful chapter in our history\" and said relations had become a \"partnership characterised by mutual trust, respect and co-operation\"."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "BBC News", "url": "https://www.bbc.co.uk/news/articles/czrjyevmv61o", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "BBC incelemesi, gençleri kiralık saldırgan olarak devşiren ağa karşı kurulan Europol görev gücünü anlatıyor", "en": "A BBC investigation sets out the Europol taskforce formed against gangs hiring teenagers for attacks"}, "summary": {"tr": "BBC, polisin İran devletiyle bağlantılandırdığı ve 2022'den bu yana yaklaşık 35 cinayetten sorumlu tutulan Foxtrot ağını inceledi; ağın Avrupa'da İsrail hedeflerine yönelik saldırılarla da ilişkilendirildiği belirtiliyor. Gençlerin kiralık katil olarak devşirilmesine karşı kurulan Europol Operasyonel Görev Gücü GRIMM'e artık on bir ülke katılıyor.", "en": "The BBC examined the Foxtrot Network, an organised crime group that police link to the Iranian state and which is thought to have been responsible for about 35 murders since 2022, as well as attacks on Israeli targets in Europe. Europol's Operational Taskforce GRIMM, set up to counter the recruitment of teenagers as contract killers, now involves eleven countries."}, "detail": {"tr": "Europol'ün Avrupa Ciddi ve Organize Suçlar Merkezi'nin başkanı Andy Kraag, uygulamayı savunmasız gençlere \"cinayetin hesaplı biçimde dışarıya verilmesi\" diye tanımladı; görev gücüne göre gençlere sosyal medyadan ulaşılıyor ve talimatlar bilgisayar oyunlarını taklit eden \"oyunlaştırılmış\" bir düzende veriliyor. Katılan on bir ülke Belçika, Danimarka, Finlandiya, Fransa, Almanya, İzlanda, Hollanda, Norveç, İspanya, İsveç ve Birleşik Krallık. Norveçli genç Johannes Natland, West Yorkshire'da planlanan bir cinayet nedeniyle çarşamba günü Londra'da Old Bailey'de cinayet için anlaşma suçundan suçlu bulundu. Polis, ağın lideri Rawa Majid'in artık Tahran'da bulunduğunu, saldırıların bir bölümünün İran hükûmeti için yapıldığını, diğerlerinin uyuşturucu nüfuz kavgalarına dayandığını belirtiyor. Ağı üç yıldır araştıran İsveçli gazeteci Diamant Salihu, İran yönetiminin Majid'e ağını rejimin düşmanlarına saldırması yönünde talimat verdiğini söyledi. Bunlar polisin ve gazetecilerin değerlendirmeleri; İran bu iddiaları doğrulamadı.", "en": "Andy Kraag, head of Europol's European Serious and Organised Crime Centre, described the practice as the \"calculated outsourcing of murder\" to vulnerable young people; the taskforce says recruits are approached on social media and given instructions in a \"gamified\" way that imitates computer games. The eleven participating states are Belgium, Denmark, Finland, France, Germany, Iceland, the Netherlands, Norway, Spain, Sweden and the United Kingdom. Johannes Natland, a Norwegian teenager, was convicted of conspiracy to murder at the Old Bailey in London on Wednesday over a planned killing in West Yorkshire. Police say the network's leader, Rawa Majid, is now based in Tehran, that some attacks were carried out for the Iranian government and that others belong to drug turf wars. Diamant Salihu, a Swedish journalist who has researched the network for three years, said the Iranian government orders Majid to have his network attack its enemies. These are police and journalistic assessments, and Iran has not confirmed them."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "LRT", "url": "https://www.lrt.lt/en/news-in-english/19/3008045/lithuanian-embassy-in-kyiv-damaged-in-russian-missile-attack", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Litvanya, Kiev'deki elçiliği hasar görünce Rusya'nın temsilcisini Dışişleri'ne çağırdı", "en": "Lithuania summons Russia's representative after missiles damage its embassy in Kyiv"}, "summary": {"tr": "Litvanya Dışişleri Bakanlığı, gece boyunca süren Rus saldırısında Kiev'deki Litvanya elçiliğinin birkaç metre yakınına füze düşmesinin ardından cumartesi günü Rusya'nın Vilnius'taki diplomatik temsilcisini bakanlığa çağıracağını duyurdu. Dışişleri Bakanı Kestutis Budrys elçiliğin hasar gördüğünü söyledi; elçilik personelinden yaralanan olmadı.", "en": "Lithuania's foreign ministry said it would summon Russia's diplomatic representative in Vilnius on Saturday after missiles struck metres from the Lithuanian embassy in Kyiv during an overnight Russian attack. Foreign Minister Kestutis Budrys said the embassy had been damaged; no embassy staff were injured."}, "detail": {"tr": "Fotoğraflarda elçilik yerleşkesinin hemen dışında bir füze krateri görülüyor. Ukrayna Dışişleri Bakanı Andrii Sibiha hasarı sınırlı olarak tanımladı ve dayanışma mesajı verdi. Kiev Belediye Başkanı Vitali Kliçko kentin balistik füzelerle hedef alındığını bildirdi. Saldırıda Kiev'de en az dokuz kişi öldü, 20'den fazla kişi yaralandı; bu, iki gün içinde Ukrayna'ya düzenlenen ikinci büyük çaplı Rus saldırısıydı.", "en": "Photographs showed a missile crater just outside the embassy compound. Ukraine's foreign minister, Andrii Sybiha, described the damage as limited and expressed solidarity. Kyiv Mayor Vitalii Klychko said the city had been targeted with ballistic missiles. The wider attack killed at least nine people in Kyiv and injured more than 20, and was the second large-scale Russian strike on Ukraine within two days."}, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "summary": {"tr": "ABD Başkanı Truth Social paylaşımında, İran'ın ve diğer Orta Doğu ülkelerinin kendisinden beklemesini istediğini, \"hızla bir ANLAŞMAYA varılabilmesi şartıyla\" saldırıyı iptal etmeyi kabul ettiğini yazdı. Anlaşmanın Hürmüz Boğazı'nın tümüyle yeniden açılmasını ve İran'ın nükleer tehdidinin sona ermesini kapsayacağını belirtti. Tahran'dan hemen resmî bir yanıt gelmedi.", "en": "In a Truth Social post the US president wrote that Iran and other Middle Eastern countries had asked him to hold off, and that he had agreed to cancel the attack \"subject to being able to rapidly make a DEAL\". He said the agreement would cover the complete reopening of the Strait of Hormuz and an end to Iran's nuclear threat. Tehran gave no immediate official response."}, "detail": {"tr": "Trump aynı paylaşımda ABD'nin \"hedefi kilitlemiş ve hazır\" olduğunu, ardından \"İsrail de bu taahhütte bana katılıyor\" ifadesini kullandı. İsrail hükümeti hemen kamuya açık bir açıklama yapmadı. Al Jazeera, Axios'a dayandırarak Suudi Veliaht Prensi Muhammed bin Selman'ın cumartesi günü Trump'ı arayarak saldırının iptalini ve müzakerelere dönülmesini istediğini aktardı. İran Dışişleri Bakanı Abbas Erakçi, Suudi mevkidaşına herhangi bir ABD ya da İsrail saldırısının \"orantılı bir yanıt\" göreceğini söylemişti. Duyuru, Trump'ın cuma günü ABD'nin İran'ı \"çok sert\" vuracağını söylemesinin ardından geldi. Anlaşmanın içeriğini doğrulayan resmî bir açıklama Tahran'dan gelmedi.", "en": "In the same post Trump said the United States was \"locked and loaded\", then wrote that \"The country of Israel joins me in this commitment\". The Israeli government did not immediately issue a public statement. Al Jazeera, citing Axios, reported that Saudi Crown Prince Mohammed bin Salman telephoned Trump on Saturday to urge cancellation and a return to negotiations. Iran's Foreign Minister Abbas Araghchi had told his Saudi counterpart that any US or Israeli attack would meet a \"proportionate response\". The announcement followed Trump's statement on Friday that the United States would hit Iran \"very hard\". No official statement from Tehran confirming the contents of the agreement has been issued."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Euronews", "url": "http://www.euronews.com/2026/08/01/two-reported-attacks-on-tankers-near-strait-of-hormuz", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hürmüz Boğazı yakınında iki tankerin ayrı olaylarda vurulduğu bildirildi", "en": "Two tankers reported hit in separate incidents near the Strait of Hormuz"}, "summary": {"tr": "İngiltere Deniz Ticareti Operasyonları birimi UKMTO, Umman'ın Musandam yarımadasındaki Lima açıklarının kuzeydoğusunda bir tankerin kimliği belirsiz bir mermiyle vurulduğunu, makine dairesinin hasar gördüğünü ve yaralanma olmadığını bildirdi. Yaklaşık üç saat sonra Hasab'ın kuzeydoğusunda ikinci bir tankerin kaptanı, gemisinin çok yakınında büyük bir su sıçraması ve patlama gördüğünü aktardı; o aşamada hasar bildirilmedi.", "en": "The UK Maritime Trade Operations body, UKMTO, reported that a tanker was struck by an unknown projectile northeast of Lima on Oman's Musandam peninsula, damaging its engine room, with no injuries. About three hours later the master of a second tanker northeast of Khasab reported seeing a large splash and an explosion in close proximity to the vessel; no damage was reported at that stage."}, "detail": {"tr": "İlk gemi olayın ardından manevra kabiliyetini yitirdi. Bölge sahil güvenliği bilgilendirildi ve yetkililer her iki olayı da soruşturuyor. Hiçbir grup saldırıları üstlenmedi ve olayların nedeni bağımsız olarak doğrulanmış değil; anlatım UKMTO'nun ticari gemilerden aldığı ihbarlara dayanıyor. Boğazdan deniz yoluyla taşınan petrolün yaklaşık dörtte biri geçiyor. Bildirimler, Trump'ın anlaşmanın boğazı yeniden açacağını söylemesinden bir gün önce yapıldı.", "en": "The first vessel was left unable to manoeuvre, reported as \"not under command\", after the incident. The regional coast guard was informed and authorities are investigating both reports. No group claimed responsibility and the cause has not been independently confirmed; the account rests on the merchant reports UKMTO receives. About a quarter of seaborne oil trade passes through the strait. The advisories came a day before Trump said an agreement would reopen it."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/israel-kills-five-in-gaza-despite-trumps-hamas-disarmament-plan", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Gazze sivil savunması, silahsızlanma yol haritası tıkanırken saldırılarda sekiz kişinin öldüğünü bildirdi", "en": "Gaza's civil defence reports eight killed in strikes as the disarmament roadmap stalls"}, "summary": {"tr": "Gazze sivil savunması pazar günü en az sekiz Filistinlinin öldürüldüğünü açıkladı. Deyr el-Belah'ın güneyinde bir daireye düzenlenen helikopter saldırısında bir kadın ile bir erkek, Han Yunus'ta üç kişi, Gazze kentinin Eski Şehir bölgesinde bir kişi hayatını kaybetti. Rakamlar sivil savunmaya dayanıyor ve bağımsız olarak doğrulanmadı.", "en": "Gaza's civil defence said at least eight Palestinians were killed on Sunday. A woman and a man died in a helicopter strike on an apartment south of Deir el-Balah, three were killed in Khan Younis and one in the Old City of Gaza City. The figures come from the civil defence and have not been independently verified."}, "detail": {"tr": "Trump'ın Barış Kurulu tarafından yayımlanan 15 maddelik yol haritası, geçen yılki ateşkes anlaşmasının uygulanmasını hedefliyor ve İsrail'in çekilmesi ile Hamas'ın silahsızlanmasını öngörüyor. Başbakan Binyamin Netanyahu yol haritası hakkında kamuya açık bir açıklama yapmadı; Ulusal Güvenlik Bakanı Itamar Ben-Gvir planı \"kabul edilemez\" olarak niteledi. Hamas, silahlarını ancak İsrail askerî operasyonlarını durdurduktan sonra depolanmak üzere teslim edeceğini söylüyor; İsrailli yetkililer gerçek bir silahsızlanma olmadan çekilme olmayacağını belirtiyor. Cumartesi günü Gazze'nin merkezinde bir tıbbi malzeme deposu vurulmuş, yaklaşık 20 metreye 10 metrelik bir krater oluşmuştu. Yol haritasının görüşmelerinde adı geçenler arasında Trump'ın damadı ve kıdemli danışmanı Jared Kushner ile eski Fetih yöneticisi Muhammed Dahlan bulunuyor.", "en": "The 15-point roadmap published by Trump's Board of Peace aims to implement last year's ceasefire agreement and provides for an Israeli withdrawal and the disarmament of Hamas. Prime Minister Benjamin Netanyahu has not publicly commented on the roadmap; National Security Minister Itamar Ben-Gvir called the plan \"unacceptable\". Hamas says it will hand over its weapons for storage only after Israel halts military operations, while Israeli officials say there will be no withdrawal without genuine disarmament. On Saturday a strike destroyed a medical supply warehouse in central Gaza, leaving a crater about 20 metres by 10 metres. Those named around the roadmap include Trump's son-in-law and senior adviser Jared Kushner and the former Fatah official Mohammed Dahlan."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/2/three-dead-including-female-bomber-in-moscow-restaurant-attack", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Rus yetkililere göre patlayıcı taşıyan bir kadın Moskova'da bir restoranın önünde üç kişinin ölümüne yol açtı", "en": "Russian authorities say a woman carrying an explosive device caused three deaths outside a Moscow restaurant"}, "summary": {"tr": "Moskova'nın merkezinde en az üç kişi öldü, 20'den fazla kişi yaralandı. Rus yetkililere dayandırılan anlatıma göre patlayıcı taşıyan bir kadın, düzenek patlamadan önce bir güvenlik görevlisi tarafından durduruldu. Hiçbir grup saldırıyı üstlenmedi ve hedefin kim olduğu belirsiz.", "en": "At least three people were killed and more than 20 injured in central Moscow. According to the account attributed to Russian authorities, a woman carrying an explosive device was stopped by a security guard before it detonated. No group has claimed responsibility and it is not clear who the target was."}, "detail": {"tr": "Restoranın adı açıklanmadı. Olayın seyrine ilişkin anlatım Rus yetkililerden geliyor ve bağımsız olarak doğrulanmış değil. Cumartesi günkü ilk bildirimlerde üç ölü verilmiş, ancak düzeneğin nasıl taşındığına dair bir bilgi yer almamıştı. Yaralı sayısı da ilk açıklamalardan sonra yükseldi.", "en": "The restaurant was not named. The account of how the attack unfolded comes from Russian authorities and has not been independently verified. Initial reports on Saturday gave three deaths but included no description of how the device was carried. The number of injured also rose after the first statements."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Dawn", "url": "https://www.dawn.com/news/2020047/us-govt-advises-americans-to-leave-mideast", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "ABD büyükelçilikleri on bir Orta Doğu ülkesindeki Amerikalılara ülkeden ayrılmayı değerlendirmelerini bildirdi", "en": "US embassies tell Americans in eleven Middle Eastern countries to consider leaving"}, "summary": {"tr": "Bahreyn, Mısır, Irak, İsrail, Ürdün, Kuveyt, Lübnan, Umman, Katar, Suudi Arabistan ve Birleşik Arap Emirlikleri'ni kapsayan uyarılarda, Amerikalıların \"ayrılmayı değerlendirmesi ya da bir tırmanma hâlinde ayrılmaya hazır olması\" gerektiği belirtildi.", "en": "Alerts covering Bahrain, Egypt, Iraq, Israel, Jordan, Kuwait, Lebanon, Oman, Qatar, Saudi Arabia and the United Arab Emirates said Americans \"should consider departing, or be prepared to depart should there be escalation\"."}, "detail": {"tr": "Uyarılarda Amerikalıların dikkatli ve tetikte olmaları, uçuş iptallerine, dönemsel hava sahası kapanmalarına ve seyahat aksamalarına hazırlıklı olmaları istendi. Ürdün'dekilere ABD askerî üslerinden uzak durmaları, İsrail'dekilere en yakın sığınağın yerini belirlemeleri söylendi. Beyrut'taki büyükelçilik \"zorunlu ayrılış\" statüsünde olduğunu bildirdi. Metinlerde öngörülemeyen bir tırmanma ihtimaline atıf yapıldı.", "en": "The alerts told Americans to exercise caution and heightened vigilance and to be prepared for flight cancellations, periodic airspace closures and travel disruption. Those in Jordan were told to avoid US military bases and those in Israel to locate the nearest bomb shelter. The embassy in Beirut said it remained on \"ordered departure status\". The texts cited the possibility of unforeseen escalation."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "The Times of Israel", "url": "https://www.timesofisrael.com/irans-leadership-vacuum-leaves-two-factions-battling-for-control-over-wars-aim/", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "İran'da aşırı sertlik yanlıları ile müzakerecilerin savaşın amacı konusunda bölündüğü aktarıldı", "en": "Iran's ultra-hardliners and negotiators are described as split over the war's aim"}, "summary": {"tr": "Amir-Hussein Radjy ve Lee Keath imzalı habere göre, Paydari hareketinin önde gelen ismi Said Celili çevresindeki aşırı sertlik yanlıları tam zafer istiyor; Cumhurbaşkanı Mesud Pezeşkiyan ile baş müzakereci konumundaki Meclis Başkanı Muhammed Bakır Kalibaf ise askerî baskıyı pazarlık kozu olarak görüyor.", "en": "According to a report by Amir-Hussein Radjy and Lee Keath, ultra-hardliners around Saeed Jalili, the most prominent figure in the Paydari movement, are pressing for total victory, while President Masoud Pezeshkian and Parliament Speaker Mohammad Bagher Ghalibaf, who serves as chief negotiator, treat military pressure as leverage for a settlement."}, "detail": {"tr": "Haberde, nisan ayındaki ateşkes anlaşmasının Yüksek Ulusal Güvenlik Konseyi'nin 13 üyesinden 12'sinin desteğini aldığı, tek karşı oyun Celili'ye ait olduğu belirtiliyor. Aşırı sertlik yanlılarının denetiminde olduğu aktarılan devlet televizyonu, hem Pezeşkiyan'ın hem Kalibaf'ın müzakereleri anlattığı yayınları kesti. Kalibaf'ın danışmanı Mehdi Muhammedi'nin sözleri şöyle aktarıldı: \"Müzakere siyasi bir araçtır ve düşmanı bir mecburiyet noktasına getirip gerçek tavizler koparmak için askerî eylemi tamamlar.\" Şubat'ın 28'inde yaralandığı bildirilen yeni dinî lider Mojtaba Hamaney'in saklandığı ve hangi kanada yakın olduğunun belirsiz kaldığı yazılıyor. İranlı yetkililer konseydeki oylamayı doğrulamadı.", "en": "The report says the April ceasefire agreement was backed by 12 of the 13 members of the Supreme National Security Council, with Jalili casting the only dissenting vote. State television, which the report says the ultra-hardliners control, interrupted broadcasts in which both Pezeshkian and Ghalibaf discussed negotiations. Mahdi Mohammadi, an adviser to Ghalibaf, is quoted saying: \"Negotiation is a political tool and a complement to military action to force the enemy to a point of compulsion and extract real concessions.\" The new supreme leader Mojtaba Khamenei is reported to remain in hiding after being injured on 28 February, and his factional alignment is described as unclear. Iranian officials have not confirmed the council vote."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Dawn", "url": "https://www.dawn.com/news/2020037/us-may-not-have-enough-forces-to-defend-israel-against-iran", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Habere göre ABD'nin THAAD önleyici füze stokunun yaklaşık yarısı harcandı", "en": "Report says about half the US THAAD interceptor inventory has been fired"}, "summary": {"tr": "Dawn'ın haberine göre ABD Avrupa Komutanlığı Komutanı Orgeneral Alexus Grynkewich, bölgedeki deniz unsurlarının gerildiğini Pentagon yetkililerine kapalı biçimde iletti. 200'den fazla THAAD önleyicisi ateşlendi; bu, Pentagon envanterinin kabaca yarısına denk geliyor. Bunların 100'den fazlası donanma gemilerinden fırlatıldı.", "en": "Dawn reported that General Alexus Grynkewich, commander of US European Command, privately told Pentagon officials that naval assets in the region are stretched. More than 200 THAAD interceptors have been fired, roughly half the Pentagon's inventory, of which more than 100 were launched from navy ships."}, "detail": {"tr": "Haberde başka tüketim oranları da veriliyor: Hassas Vuruş Füzeleri'nin yaklaşık yüzde 45'i, Patriot önleyicilerinin yaklaşık yarısı, Tomahawk seyir füzelerinin yaklaşık yüzde 30'u, Havadan Karaya Ortak Menzil Dışı Füzeler'in yüzde 20'den fazlası ve SM-3 ile SM-6 önleyicilerinin yaklaşık yüzde 20'si. Bölgeye bir donanma muhribi daha görevlendirilmezse komutanların \"eninde sonunda Amerikan güçlerini korumakla İsrail için füze savunma harekâtını sürdürmek arasında zor bir seçimle karşılaşabileceği\" aktarılıyor. Gelişmiş önleyicilerin üretilebildiğinden daha hızlı tüketildiği belirtiliyor. Değerlendirme kapalı olarak niteleniyor; Pentagon bu oranları yayımlamadı ve rakamlar bağımsız olarak doğrulanamadı.", "en": "The report gives further consumption figures: about 45 percent of Precision Strike Missiles, around half of Patriot interceptors, roughly 30 percent of Tomahawk cruise missiles, more than 20 percent of Joint Air-to-Surface Standoff Missiles and about 20 percent of SM-3 and SM-6 interceptors. Without another navy destroyer assigned to the region, it says, commanders \"could eventually face a difficult choice between protecting American forces and continuing missile-defence operations for Israel\". Advanced interceptors are described as being consumed faster than they can be manufactured. The assessment is characterised as private; the Pentagon has not published these figures and they could not be independently verified."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "The Tribune", "url": "https://www.tribuneindia.com/news/india/pakistan-made-every-effort-to-dismantle-goodwill-under-indus-water-treaty-vinay-kwatra/", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Hindistan'ın Washington büyükelçisi İndus Suları Antlaşması'nın askıda kalacağını yazdı", "en": "India's envoy to Washington writes that the Indus Waters Treaty stays in abeyance"}, "summary": {"tr": "Newsweek dergisinde yazan Vinay Mohan Kwatra, 1960 tarihli antlaşmayı askıya alma kararının \"Pakistan'ın davranışının zaten yok ettiği şeyi yalnızca kabul ettiğini\" savundu. Hindistan antlaşmayı, Cammu Keşmir'in Pahalgam beldesinde 26 kişinin öldürüldüğü saldırının ardından 23 Nisan 2025'te askıya almıştı.", "en": "Writing in Newsweek, Vinay Mohan Kwatra argued that the decision to hold the 1960 treaty in abeyance \"merely acknowledges what Pakistan's conduct had already destroyed\". India suspended the treaty on 23 April 2025, after an attack that killed 26 people at Pahalgam in Jammu and Kashmir."}, "detail": {"tr": "Kwatra, Pakistan'ın antlaşmanın imzalandığı iyi niyeti yarım yüzyıl boyunca söktüğünü öne sürdü ve 1965, 1971 ile 1999 savaşlarını; 2001'deki parlamento baskınını, 2008 Mumbai saldırılarını, 2016'daki Uri ve Pathankot saldırılarını, 2019 Pulvama saldırısını ve 2025 Pahalgam saldırısını sıraladı. Başbakan Narendra Modi'nin formülünü aktardı: \"Terör ve müzakere bir arada yürüyemez... Terör ve ticaret bir arada yürüyemez... Su ile kan birlikte akamaz.\" Pakistan'ın altmış yıl boyunca antlaşmanın yeniden görüşülmesine yönelik Hindistan girişimlerini engellediğini, ülkedeki su kıtlığının ise hükümetin kötü yönetiminden kaynaklandığını yazdı. Bunlar Hindistan hükümetinin konumunu yansıtıyor; İslamabad bu değerlendirmeleri reddediyor.", "en": "Kwatra argued that Pakistan had spent half a century dismantling the goodwill in which the treaty was signed, listing the wars of 1965, 1971 and 1999 alongside the 2001 Parliament attack, the 2008 Mumbai attacks, the 2016 Uri and Pathankot attacks, the 2019 Pulwama attack and the 2025 Pahalgam attack. He cited Prime Minister Narendra Modi's formula: \"Terror and talks cannot go together... Terror and trade cannot go together... Water and blood cannot flow together.\" He wrote that Pakistan had blocked India's attempts to renegotiate the treaty over six decades and attributed Pakistan's water scarcity to government mismanagement. These positions are the Indian government's; Islamabad rejects them."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Dawn", "url": "https://www.dawn.com/news/2020095/second-phase-of-ajk-polls-begins-in-muzaffarabad-division", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Azad Cammu ve Keşmir'de ikinci tur oylaması dokuz sandalye ve on iki mülteci seçim bölgesini kapsadı", "en": "Azad Jammu and Kashmir's second polling phase covers nine seats and twelve refugee constituencies"}, "summary": {"tr": "Oy verme saat 08.00-17.00 arasında yapıldı. Muzaffarabad bölgesindeki dokuz sandalye için 207, Pakistan genelinde yaşayan mültecilere ayrılmış on iki seçim bölgesi için 137 aday yarıştı.", "en": "Polling ran from 8am to 5pm. There were 207 candidates for nine seats in Muzaffarabad division and 137 for twelve constituencies reserved for refugees living across Pakistan."}, "detail": {"tr": "Azad Cammu ve Keşmir Seçim Komisyonu'nun verilerine göre Muzaffarabad bölgesinde 809.621 kayıtlı seçmen bulunuyor; sandalyelerin beşi Muzaffarabad ilçesine, ikişeri Neelum ve Celum Vadisi ilçelerine ait. On iki mülteci seçim bölgesinde ise 438.834 kayıtlı seçmen var; bunların altısı Keşmir Vadisi'nden, altısı Cammu'dan gelen mültecileri temsil ediyor. Bölgede 1.483 sandık kuruldu; 533'ü çok hassas, 741'i hassas, 209'u normal olarak sınıflandırıldı. Mülteci seçim bölgeleri için 1.057 sandık daha açıldı.", "en": "On the Azad Jammu and Kashmir Election Commission's figures, Muzaffarabad division has 809,621 registered voters; five of its seats belong to Muzaffarabad district and two each to Neelum and Jhelum Valley. The twelve refugee constituencies hold 438,834 registered voters, six representing refugees from the Kashmir Valley and six from Jammu. The division was served by 1,483 polling stations, of which 533 were classed highly sensitive, 741 sensitive and 209 normal. A further 1,057 stations served the refugee constituencies."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/us-arabs-eye-historic-senate-win-for-abdul-el-sayed-despite-aipac-attacks", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Michigan Senato ön seçiminde dışarıdan yapılan 50 milyon doları aşan harcama tartışılıyor", "en": "More than fifty million dollars of outside spending shapes a Michigan Senate primary"}, "summary": {"tr": "Al Jazeera'nın haberine göre AIPAC ve İsrail yanlısı diğer gruplar, Michigan'daki Demokrat Senato ön seçiminde hekim ve halk sağlığı yöneticisi Abdul El-Sayed'in karşısındaki Kongre üyesi Haley Stevens'ı desteklemek için 50 milyon doları aşkın harcama yaptı. Kamuoyu yoklamaları El-Sayed'i önde gösteriyor.", "en": "Al Jazeera reported that AIPAC and other pro-Israel groups have spent more than $50m backing Congresswoman Haley Stevens against Abdul El-Sayed, a physician and public health official, in Michigan's Democratic Senate primary. Public polls favour El-Sayed."}, "detail": {"tr": "El-Sayed'i destekleyenler arasında Dearborn Belediye Başkanı Abdullah Hammoud, Kongre üyesi Ilhan Omar ve Senatör Bernie Sanders yer alıyor. Cumhuriyetçi aday eski Kongre üyesi Mike Rogers. El-Sayed kampanya boyunca kendisine yöneltilen soruları şöyle anlattı: \"İnsanlar 'nasıl dua ediyorsun' diye sormuyor. Ama bana 'ne için dua ediyorsun' diye soruldu.\" Genel seçim kasım 2026'da yapılacak. Harcama rakamları Al Jazeera'nın aktardığı biçimiyle veriliyor.", "en": "El-Sayed's supporters include Dearborn Mayor Abdullah Hammoud, Congresswoman Ilhan Omar and Senator Bernie Sanders. The Republican nominee is former Congressman Mike Rogers. El-Sayed described the questions put to him during the campaign: \"People don't ask, 'How do you pray?' But I have been asked, 'What do you pray for?'\" The general election takes place in November 2026. The spending figures are as reported by Al Jazeera."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/new-york-times-reveals-trump-administration-subpoena-over-north-korea-story", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "New York Times, Adalet Bakanlığı'nın Kuzey Kore operasyonu haberi nedeniyle bir muhabire celp gönderdiğini açıkladı", "en": "The New York Times says the Justice Department subpoenaed a reporter over a North Korea operation"}, "summary": {"tr": "Gazete, FBI ajanlarının şubat 2026'da bağımsız muhabir Matthew Cole'a New York'taki evinde bir celp tebliğ ettiğini, celpte Kuzey Kore'deki gizli bir askerî operasyona ilişkin haberinin kaynaklarını açıklamasının istendiğini bildirdi.", "en": "The paper said FBI agents delivered a subpoena to freelance reporter Matthew Cole at his New York home in February 2026, demanding that he identify his sources for reporting on a secret military operation in North Korea."}, "detail": {"tr": "Cole ile Times ulusal muhabiri Dave Philipps araştırmayı eylül 2025'te yayımlamıştı. Haber, 2019'da gizlilik derecesi taşıyan bir Deniz Kuvvetleri SEAL görevini anlatıyordu: Kuzey Kore kıyılarına elektronik dinleme donanımı yerleştirilmesi hedeflenmiş, muhabirlere göre görev SEAL'lerin bir Kuzey Kore teknesiyle karşılaşıp ateş açmasıyla başarısız olmuştu. Cole'un avukatı David A. O'Neill; gazete tarafında baş hukuk müşaviri David McCraw ve avukat Douglas Zolkind adı geçiyor. Times celbi \"hükümetin gazetecilere yönelik tırmanan saldırılarının bir parçası\" ve \"kamuoyunu bilgiden yoksun bırakmak için tasarlanmış, yönetimden gelen bir başka pervasız ve hukuka aykırı saldırı\" olarak nitelendirdi.", "en": "Cole and Times national correspondent Dave Philipps published the investigation in September 2025. It described a classified 2019 Navy SEAL mission to place electronic surveillance equipment on North Korean shores, which the reporters said failed when the SEALs encountered a North Korean boat and opened fire. Cole is represented by David A. O'Neill; on the paper's side, general counsel David McCraw and lawyer Douglas Zolkind are named. The Times called the subpoena \"part of the government's escalating attacks on journalists\" and \"another brazen and illegal attack from the administration designed to deny the public information\"."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/michigan-joins-minnesota-in-reporting-cyber-attacks-with-fbi-investigating", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Michigan dokuz su sisteminin saldırıya uğradığını bildirdi, FBI soruşturma yürütüyor", "en": "Michigan reports attacks on nine water systems as the FBI investigates"}, "summary": {"tr": "Michigan dokuz su sisteminin hedef alındığını açıkladı; Minnesota daha önce 30 tesisi bildirmişti. FBI'ın uyarısında en az yedi eyaletin olay bildirdiği belirtiliyor. Saldırıların failine ilişkin bir tespit açıklanmadı.", "en": "Michigan said nine water systems were targeted, after Minnesota reported 30 sites. An FBI advisory said at least seven states have reported incidents. No actor has been identified."}, "detail": {"tr": "Hedef alınan teknoloji, su ekipmanını uzaktan izlemek ve denetlemek için kullanılan işletim denetimleri ile programlanabilir mantık denetleyicileriydi. Michigan Çevre, Büyük Göller ve Enerji Bakanlığı iletişim direktörü Dale George, tüm sistemlerin güvenli biçimde çalışmayı sürdürdüğünü söyledi. FBI, kendisinin ve kurumlar arası ortaklarının \"kritik altyapıyı korumak için tümüyle görevde\" olduğunu bildirdi. FBI ile CISA daha önce İranlı bilgisayar korsanlarının su ve atık su sistemlerini hedef aldığı uyarısını yapmıştı. Minnesota Valisi Tim Walz sorumlunun İran olduğunu söylerken, Başkan Donald Trump \"bence bunun arkasında Minnesota var\" dedi; Al Jazeera bu sözlerin kanıt sunulmadan söylendiğini aktardı. Failin kim olduğu ortaya konmuş değil.", "en": "The technology targeted was the operational controls and programmable logic controllers used to monitor and control water equipment remotely. Dale George, communications director at Michigan's Department of Environment, Great Lakes and Energy, said all systems continued to operate safely. The FBI said it and its interagency partners \"are fully engaged to protect critical infrastructure\". The FBI and CISA had previously warned that Iranian hackers were targeting water and wastewater systems. Minnesota Governor Tim Walz said Iran was responsible, while President Donald Trump said \"I think Minnesota is behind it\", which Al Jazeera reported he offered without evidence. Attribution has not been established."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/why-did-ceuta-migrant-mayhem-chill-already-frosty-israel-spain-relations", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "İspanyol bakanın sözleri Ceuta tartışmasına İsrail'i de kattı", "en": "A Spanish minister's remark pulls Israel into the argument over Ceuta"}, "summary": {"tr": "Ulaştırma Bakanı Óscar Puente, İsrail'in Madrid Büyükelçisi Danny Danon'un İspanya'nın Ceuta'da olağanüstü hâl ilan ettiğine dair paylaşımına \"her şey epeyce netleşmeye başlıyor\" sözleriyle karşılık verdi. Al Jazeera, Fas'ın İsrail adına hareket ettiğine dair bir kanıt bulunmadığını yazdı.", "en": "Transport Minister Óscar Puente responded to a post by Israel's ambassador Danny Danon about Spain declaring a state of emergency in Ceuta by saying \"Well, it's all starting to become quite clear\". Al Jazeera wrote that there is no evidence Morocco acted on Israel's behalf."}, "detail": {"tr": "Başbakan Pedro Sánchez geçişlerin arkasında insan kaçakçılığı şebekelerini gösterdi. 50 binden fazla kişi kentin sınırını aştı ve geçiş sırasında en az 67 kişi öldü. Al Jazeera bu tartışmayı daha uzun bir dizinin içine yerleştiriyor: İspanya'nın nisan 2021'de Polisario Cephesi lideri İbrahim Gali'yi tedavi etmesi ve Fas'ın ertesi ay yaklaşık 10 bin göçmenin Ceuta'ya geçmesine izin vermesi; İspanya'nın 2022'de Batı Sahra'da Fas egemenliğini destekleyecek biçimde politika değiştirmesi; ve 2024'te bir İsrail savaş gemisine liman erişimini reddetmesinin ardından aynı izni Fas'ın vermesi.", "en": "Prime Minister Pedro Sánchez blamed human trafficking networks for the crossings. More than 50,000 people crossed into the enclave and at least 67 died attempting it. Al Jazeera places the exchange in a longer sequence: Spain's treatment of Polisario Front leader Brahim Ghali in April 2021 and Morocco's decision the following month to let about 10,000 migrants enter Ceuta; Spain's 2022 reversal in favour of Moroccan sovereignty over Western Sahara; and its 2024 refusal of port access to an Israeli warship, which Morocco then granted."}, "radarPublishedAt": "2026-08-02T06:53:47+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/22-eu-leaders-call-for-emergency-talks-over-ceuta-migrant-crisis", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Yirmi iki AB üyesi Ceuta için olağanüstü bakanlar toplantısı istedi", "en": "Twenty-two EU members call for emergency ministerial talks on Ceuta"}, "summary": {"tr": "İtalya ve Danimarka'nın başlattığı mektuba 22 üye devlet imza attı; dönem başkanı İrlanda, Adalet ve İçişleri Konseyi'ni salı günü olağanüstü video konferansla topluyor. Mektuba Fransa, Portekiz ve Lüksemburg imza atmadı.", "en": "22 member states signed a letter initiated by Italy and Denmark; Ireland, holding the rotating presidency, is convening the Justice and Home Affairs Council for an extraordinary videoconference on Tuesday. The letter was not signed by France, Portugal and Luxembourg."}, "detail": {"tr": "Mektup, denetimsiz kitlesel geçişlerin, göçün araçsallaştırılmasının ve benzeri karma tehditlerin Avrupa Birliği'ne yasa dışı girişin mümkün olduğu algısını yaratmasına izin verilemeyeceğini söylüyor. İmzacılar geçici iç sınır denetimlerini güçlendirme ya da yeniden uygulamaya koyma seçeneğini saklı tutuyor. Başbakan Pedro Sánchez, üye devletlerin bir bölümünün dayanışma gösterdiğini, bir bölümününse İspanya'yı hedef alıp ülkenin Schengen alanından geçici olarak çıkarılmasını istediğini söyledi. Buna karşılık Komisyon Başkanı Ursula von der Leyen, geçişler sırasında tek bir kişinin bile İspanya anakarasına ya da Birliğin geri kalanına ulaşmadığını belirtti. Madrid'in verdiği rakamlara göre perşembe günü yaklaşık 50.000 kişi Ceuta'ya geçti ve neredeyse tamamı geri gönderildi; can kaybı 67 olarak açıklandı.", "en": "The letter says uncontrolled mass crossings, the instrumentalisation of migration and comparable hybrid threats cannot be allowed to create the perception that illegal entry into the European Union is possible. The signatories reserve the option of reinforcing or reintroducing temporary internal border controls. Prime Minister Pedro Sánchez said some member states had offered solidarity while others had chosen to attack Spain and to call for its temporary exclusion from the Schengen area. Commission President Ursula von der Leyen said not a single person reached mainland Spain or the rest of the Union during the influx. On Madrid's figures about 50,000 people crossed into Ceuta on Thursday and almost all were returned; the announced death toll is 67."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "summary": {"tr": "Kiev'e gece boyunca düzenlenen saldırıda acil servislerin bildirdiğine göre en az dokuz kişi öldü, 33 kişi yaralandı. Cumhurbaşkanı Volodimir Zelenskiy 27 balistik füze atıldığını, bunlardan yalnızca birinin bir Patriot sistemiyle düşürüldüğünü söyledi.", "en": "At least nine people were killed and 33 wounded in an overnight attack on Kyiv, according to emergency services. President Volodymyr Zelenskyy said 27 ballistic missiles were launched and that only one was brought down by a Patriot system."}, "detail": {"tr": "Darnitski ilçesinde yedi kişinin öldüğü, 14 kişinin yaralandığı; Solomyanski ilçesinde iki kişinin öldüğü, ikisi çocuk sekiz kişinin yaralandığı ve 35 kişinin tahliye edildiği bildirildi. Şevçenkivski ilçesinde bir konut binası kısmen yıkıldı, Solomyanski'de beş katlı bir binada yangın çıktı. Litvanya'nın büyükelçilik binasında camlar kırıldı. Zelenskiy, önleyici füzeler olmadan geçen her gecenin daha fazla can kaybı anlamına geldiğini söyledi. Ukrayna tarafı ayrıca Başkurdistan'daki üç rafineri altyapısının ve Karadeniz ile Azak Denizi'ndeki hedeflerin vurulduğunu açıkladı; Rus kuvvetlerinin Harkiv'de Olgivka ve Zaporijya'da Lyubitske'yi ele geçirdiği bildirildi.", "en": "Seven people were reported killed and 14 wounded in the Darnytskyi district, and two killed with eight wounded, including two children, in Solomianskyi, where 35 residents were evacuated. A residential block was partly destroyed in Shevchenkivskyi and a fire broke out in a five-storey building in Solomianskyi. Windows were shattered at Lithuania's embassy. Zelenskyy said every night without interceptor missiles produces more casualties. Ukraine also said it had struck the infrastructure of three refineries in Bashkortostan and targets in the Black Sea and the Sea of Azov; Russian forces were reported to have taken Olhivka in Kharkiv region and Liubytske in Zaporizhzhia region."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/fighting-breaks-out-in-western-tigray-as-ethiopia-and-tplf-trade-blame", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Batı Tigray'da çatışma çıktı, Addis Ababa ile TPLF birbirini suçluyor", "en": "Fighting erupts in western Tigray as Addis Ababa and the TPLF trade blame"}, "summary": {"tr": "Sudan sınırına yakın Sheraro çevresinde cumartesi şafağında başlayan çatışmayı Tigray bölge yönetimi federal kuvvetlere, federal bakan Abraham Belay ise TPLF başkanı Debretsion Gebremichael'e bağlı güçlere yükledi.", "en": "Fighting that began at dawn on Saturday around Sheraro, close to the Sudanese border, was blamed on federal forces by Tigray's regional government and on forces loyal to TPLF chairman Debretsion Gebremichael by the federal minister Abraham Belay."}, "detail": {"tr": "Etiyopya uzmanı Kjetil Tronvoll, olayı Kasım 2022'de imzalanan Pretoria anlaşmasından bu yana yaşanan en ciddi olay olarak niteledi. O anlaşma 2020'de başlayan ve yüz binlerce kişinin ölümüne yol açan savaşı bitirdi, ancak silahsızlanma ile TPLF'nin hukuki statüsünü çözmeden bıraktı; TPLF temmuz ortasında anlaşmanın fiilen sona erdiğini açıklamıştı. Başbakan Abiy Ahmed'in danışmanı Getachew Reda, Debretsion'un Eritre'ye ve Amhara milislerine yaslanarak iktidarı ele geçirmeye çalıştığını öne sürdü. Abraham Belay ise savaşın yeterince sürdüğünü, anlaşmazlıkların diyalogla çözülmesi gerektiğini söyledi. Bölge analisti Faisal Roble güçlü bir uluslararası müdahale olmadan çok daha büyük bir savaşa gidilebileceği uyarısında bulundu. Amerika Birleşik Devletleri haziranda TPLF içindeki sertlik yanlılarına vize kısıtlaması getirmiş, Büyükelçi Ervin Massinga anlaşmayı korumak için Mekelle'ye gitmişti. Çatışmalara ilişkin can kaybı bildirilmedi.", "en": "Kjetil Tronvoll, a specialist on Ethiopia, called it the most serious incident since the Pretoria agreement of November 2022. That agreement ended a war which began in 2020 and killed hundreds of thousands, but left disarmament and the TPLF's legal status unresolved; the TPLF said in mid-July that the agreement was effectively dead. Getachew Reda, an adviser to Prime Minister Abiy Ahmed, said Debretsion was leaning on Eritrea and on Amhara militias in a bid to seize power. Abraham Belay said the war had gone on long enough and that differences should be settled through dialogue. The regional analyst Faisal Roble warned that without strong international intervention the situation could move towards a much larger war. The United States imposed visa restrictions on hardliners within the TPLF in June, and Ambassador Ervin Massinga travelled to Mekelle in an effort to preserve the agreement. No casualty figures were reported."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "trade", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/turkiye-and-iraq-sign-one-year-oil-pipeline-deal-amid-global-shift", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Türkiye ile Irak, Kerkük-Ceyhan hattı için bir yıllık transit anlaşması imzaladı", "en": "Türkiye and Iraq sign a one-year transit deal for the Kirkuk-Ceyhan pipeline"}, "summary": {"tr": "BOTAŞ ile Irak'ın devlet şirketleri SOMO ve NOC, cumartesi günü imzaladıkları bir yıllık düzenlemeyle günlük en az 750.000 varil taşınmasını öngörüyor. Hattın bugünkü akışı yaklaşık 170.000 varil, tasarım kapasitesi ise 1,5 milyon varil.", "en": "BOTAŞ and Iraq's state companies SOMO and NOC signed a one-year arrangement on Saturday providing for a minimum of 750,000 barrels a day. The line currently carries about 170,000 barrels; its design capacity is 1.5 million."}, "detail": {"tr": "Düzenleme, petrol, elektrik ve su kaynaklarını kapsayan daha geniş bir çerçeve anlaşması görüşülürken bir yıl yürürlükte kalacak. Bugünkü akışın büyük bölümü Irak'ın Kürdistan bölgesindeki sahalardan geliyor. Enerji ve Tabii Kaynaklar Bakanı Alparslan Bayraktar, hat için uzun vadeli yeni bir anlaşma çabaları sürerken bu transit düzenlemesinin uygulamaya konduğunu söyledi; Irak Başbakanı Ali el-Zeydi anlaşmayı önemli bir stratejik dönüm noktası olarak nitelendirdi. Irak'ın petrol ihracatı, şubat sonunda Amerika Birleşik Devletleri ile İsrail'in İran'a düzenlediği saldırıların ardından yüzde 80'in üzerinde geriledi; aylık gelirler yaklaşık 6 milyar dolar düzeyinden 2 milyar dolar altına indi. Irak ham petrolü için Ceyhan, Hürmüz Boğazı kapalı kaldığı sürece boğazdan geçmeyen tek yüksek kapasiteli çıkış noktası konumunda.", "en": "The arrangement runs for one year while a broader framework covering oil, electricity and water resources is negotiated. Most of the current flow comes from fields in Iraq's Kurdistan region. Energy Minister Alparslan Bayraktar said the transit arrangement had been put in place while work continued towards a new long-term agreement for the line; Iraq's Prime Minister Ali al-Zaidi called it an important strategic milestone. Iraq's oil exports fell by more than 80 percent after the United States and Israel struck Iran in late February, and monthly revenues dropped from about $6bn to under $2bn. For Iraqi crude, Ceyhan is the only high-capacity outlet that avoids the Strait of Hormuz while it stays closed."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Interfax-Ukraine", "url": "https://en.interfax.com.ua/news/general/1189917.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Pentagon, Ukrayna'ya yardımı koordine eden komutanlığın başını bir NATO müttefikine bırakıyor", "en": "The Pentagon is handing leadership of the Ukraine aid command to a NATO ally"}, "summary": {"tr": "Politico'nun aktardığına göre Pentagon, Almanya'nın Wiesbaden kentindeki Ukrayna Güvenlik Yardım Grubu'nun (SAG-U) komutasını başka bir NATO üyesine devredecek. Geçişin bir yıla kadar sürmesi bekleniyor.", "en": "According to Politico, the Pentagon will hand command of the Security Assistance Group-Ukraine (SAG-U) in Wiesbaden, Germany, to another NATO member. The transition is expected to take up to a year."}, "detail": {"tr": "Komutanlık, Ukrayna'ya askerî teçhizat sevkiyatını koordine ediyor, eğitim ve lojistik desteği yürütüyor. Habere göre komutayı Avrupalı ya da Kanadalı bir general üstlenecek, ABD Avrupa Komutanlığı ise yardımcı komutan düzeyinde görevde kalacak. Bir NATO yetkilisi, komutanın Avrupalı ya da Kanadalı olmasının müttefiklerin daha fazla sorumluluk üstlenmesinin bir örneği daha olacağını söyledi. Bir ABD yetkilisi ise grubun yönetimini eninde sonunda başka bir NATO üyesinin devralacağını belirtti. Yetkililer, devir sürecinin Ukrayna'ya yönelik çalışmaları kesintiye uğratmayacağını bildirdi.", "en": "The command coordinates deliveries of military equipment to Ukraine and oversees training and logistical support. The report says a European or Canadian general will take command while US European Command stays involved at deputy level. A NATO official said a European or Canadian officer taking command would be another example of allies assuming greater responsibility. A US official said another NATO member would eventually take over running the group. Officials said the transition should not interrupt the work with Ukraine."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Xinhua", "url": "https://english.news.cn/20260802/e50cf362c21a4efdb0ff77ef0f413399/c.html", "publishedDate": "2026-08-02", "date": {"tr": "2 Ağu", "en": "Aug 2"}, "title": {"tr": "Arakçi, Pakistan, Türkiye ve Suudi Arabistan'a bölgesel destek uyarısı yaptı", "en": "Araghchi warns Pakistan, Türkiye and Saudi Arabia against backing US action"}, "summary": {"tr": "İran Dışişleri Bakanı Seyyid Abbas Arakçi cumartesi günü Pakistan Genelkurmay Başkanı Asım Münir, Türkiye Dışişleri Bakanı Hakan Fidan ve Suudi Arabistan Dışişleri Bakanı Prens Faysal bin Ferhan ile ayrı ayrı telefonda görüştü.", "en": "Iran's Foreign Minister Seyed Abbas Araghchi held separate telephone calls on Saturday with Pakistan's Chief of Army Staff Asim Munir, Turkish Foreign Minister Hakan Fidan and Saudi Foreign Minister Prince Faisal bin Farhan."}, "detail": {"tr": "İran'ın yarı resmî Mehr ajansına dayandırılan habere göre Arakçi, Münir ve Fidan'a ülkesinin egemenliğini, toprak bütünlüğünü ve ulusal güvenliğini korumaya tümüyle hazır olduğunu, herhangi bir saldırıya kararlılıkla karşılık vereceğini söyledi. Suudi mevkidaşıyla görüşmesinde ise Amerika Birleşik Devletleri ya da İsrail kaynaklı düşmanca bir eylemin ve buna verilecek bölgesel desteğin İran silahlı kuvvetlerinden kararlı ve orantılı bir yanıt göreceği uyarısında bulundu. İran Dışişleri Bakanlığı aynı gün yaptığı açıklamada Washington'ı haziran ortasında varılan mutabakat metnini ihlal etmekle suçladı; İran hedeflerine yönelik saldırıların sürmesini, limanlara ve ticari denizciliğe uygulanan ablukayı ve artan ekonomik baskıyı gerekçe gösterdi ve bu uygulamalara direnmeyi sürdüreceğini bildirdi.", "en": "According to the report, which cites Iran's semi-official Mehr news agency, Araghchi told Munir and Fidan that Iran was fully prepared to safeguard its sovereignty, territorial integrity and national security and would respond decisively to any act of aggression. In the call with his Saudi counterpart he warned that any hostile action by the United States or Israel, and any regional support for it, would draw a firm and proportionate response from Iran's armed forces. In a statement the same day Iran's foreign ministry accused Washington of breaching the memorandum agreed in mid-June, citing continued strikes on Iranian targets, a blockade of ports and commercial shipping and increased economic pressure, and said it would keep resisting."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "The Kyiv Independent", "url": "https://kyivindependent.com/ukraine-strikes-3-russian-oil-refineries-sinks-sanctioned-ship-zelensky-says/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Ukrayna, yaptırım listesindeki Rus konteyner gemisi Yanina'yı batırdığını açıkladı", "en": "Ukraine says it sank the sanctioned Russian container ship Yanina"}, "summary": {"tr": "Volodimir Zelenskiy, 100.000 tonun üzerinde kapasiteli Rus bayraklı Yanina'nın iki insansız deniz aracıyla vurulduğunu söyledi. Saldırı, Novorossiysk limanının yaklaşık 130 deniz mili açığında uluslararası sularda gerçekleşti.", "en": "Volodymyr Zelensky said the Russian-flagged Yanina, with a capacity of more than 100,000 tonnes, was struck by two naval drones. The attack took place in international waters about 130 nautical miles from the port of Novorossiysk."}, "detail": {"tr": "Zelenskiy, hedeflerin savaş çabasını ayakta tutan tesisler arasından seçildiğini belirtti. Rosatom Genel Müdürü Aleksey Lihaçev geminin dondurulmuş gıda ve inşaat malzemesi dahil sivil yük taşıdığını öne sürdü ve saldırıyı korsanlık olarak niteledi; Rosatom 17 mürettebatın tamamının kurtarıldığını bildirdi. Kyiv Independent, Rus tarafının iddialarını bağımsız olarak doğrulayamadığını yazdı. Ukrayna aynı gün Rusya'nın derinliklerindeki üç petrol rafinerisini ve dört radar sistemini de vurduğunu açıkladı.", "en": "Zelensky said the targets were chosen from among facilities that sustain the war effort. Rosatom's chief executive Alexey Likhachev said the vessel was carrying civilian goods including frozen food and construction materials and described the attack as piracy; Rosatom said all 17 crew were rescued. The Kyiv Independent said it could not independently verify the Russian claims. Ukraine said it had also struck three oil refineries and four radar systems deep inside Russia the same day."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Malay Mail", "url": "https://www.malaymail.com/news/malaysia/2026/08/01/negeri-sembilan-polls-close-race-for-the-state-government-begins/229867", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Negeri Sembilan'da BN-PN ittifakı 36 sandalyenin 25'ini aldı", "en": "The BN-PN pact takes 25 of 36 seats in Negeri Sembilan"}, "summary": {"tr": "Malezya'nın Negeri Sembilan eyaletindeki erken seçimde, federal düzeyde rakip olan Barisan Nasional ile Perikatan Nasional'ın eyalet düzeyindeki ittifakı resmî olmayan sonuçlara göre 36 sandalyeden 25'ini kazandı.", "en": "In Malaysia's snap Negeri Sembilan state election, the state-level pact between Barisan Nasional and Perikatan Nasional — rivals at federal level — won 25 of 36 seats on unofficial results."}, "detail": {"tr": "BN Genel Başkanı Ahmad Zahid Hamidi, açıklanan sonuçlara göre yeni eyalet hükümetinin kurulması için iki koalisyon arasında görüşmelerin süreceğini söyledi. Umno Genel Sekreteri Asyraf Wajdi Dusuki, iki koalisyonun resmî olmayan sonuçlara göre 36 sandalyenin 25'ini aldığını bildirdi. DAP Genel Sekreteri Anthony Loke, Chennah'da MCA adayı Siow Kong Choon'a 491 oy farkla; görevdeki eyalet başbakanı Aminuddin Harun ise Linggi'de 1.668 oy farkla kaybetti. Katılım öğlen itibarıyla yüzde 37, saat 16.00 itibarıyla yüzde 65,38 olarak açıklandı. İttifak, eyalet hükümetini kurduktan sonra yaklaşan Melaka seçimine odaklanacağını duyurdu.", "en": "BN chairman Ahmad Zahid Hamidi said talks between the two coalitions would continue on forming the new state government on the basis of the announced results. Umno secretary-general Asyraf Wajdi Dusuki said the two coalitions had unofficially secured 25 of the 36 seats. DAP secretary-general Anthony Loke lost Chennah to the MCA's Siow Kong Choon by 491 votes, and the caretaker Menteri Besar Aminuddin Harun lost Linggi by 1,668 votes. Turnout was 37 percent by noon and 65.38 percent by 16.00. The pact said it would form the state government and then turn to the coming Melaka election."}, "radarPublishedAt": "2026-08-01T22:08:49+00:00", "editionDate": "2026-08-02"}, {"f
