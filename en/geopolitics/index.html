sıtıyor olabilir."}]}, {"h": {"en": "The alternative route acquires a toll", "tr": "Alternatif hat da bedelli hâle geldi"}, "ps": [{"en": "Some tankers carrying Saudi crude had moved to a Red Sea lane running between the kingdom and west Africa; that was the detour the market found when Hormuz thinned out. On 20 July the Houthi movement declared a blockade of Saudi Arabia's Red Sea ports, and the UK Maritime Trade Operations agency has logged several attacks on ships in the past week. Kpler counted 28 commodity vessels through Bab el-Mandeb on Saturday, six of them dark, with overall traffic at roughly half its pre-attack level — the half that stayed is the half the threat does not name, because the announced target is Saudi shipping specifically. A selective blockade is cheap to run and awkward to answer: no single flag state's navy is obviously the aggrieved party. Crude loadings bound for Asia are now down to about four a day, the lowest since the war began, and Tim Wilkins of Intertanko describes a \"broadening, deteriorating, and increasingly complex security situation\".", "refs": ["hormuz-traffic"], "tr": "Suudi ham petrolü taşıyan bazı tankerler, krallık ile Batı Afrika arasında uzanan Kızıldeniz hattına kaymıştı; Hürmüz seyreldiğinde piyasanın bulduğu sapak buydu. Husi hareketi 20 Temmuz'da Suudi Arabistan'ın Kızıldeniz limanlarına abluka ilan etti; Birleşik Krallık Deniz Ticaret Operasyonları birimi son bir haftada gemilere yönelik birkaç saldırı kaydetti. Kpler cumartesi Babülmendep'ten 28 yük gemisinin geçtiğini, altısının vericisini kapattığını saydı; toplam trafik saldırı öncesinin kabaca yarısı düzeyinde. Sefere devam eden yarı, tehdidin hedef almadığı yarı: ilan edilen hedef özellikle Suudi gemiciliği. Seçici bir ablukayı işletmek ucuz, ona karşılık vermek ise zordur: hiçbir bayrak devletinin donanması apaçık mağdur taraf değildir. Asya'ya gidecek ham petrol yüklemeleri savaş başladığından bu yana en düşük düzeye, günde dört dolayına indi; Intertanko'dan Tim Wilkins ise sektörün karşısındakini \"genişleyen, kötüleşen ve giderek karmaşıklaşan bir güvenlik tablosu\" diye anlatıyor."}, {"en": "This is where the route talks described on 2 August become a commercial question rather than a diplomatic one. Iran said its negotiations with Oman on a third Hormuz corridor, with separate entry and exit lanes, were in their final stages. If such an arrangement is published and takes effect, the test is whether cargo believes it rather than whether it carries a signature: a return to more than thirty Hormuz transits a day on Kpler's count, with Asia-bound loadings above ten a day within a month of publication, would mean owners and underwriters have accepted the lanes as real. Traffic that stays near single figures would mean the corridor exists on paper and the risk premium is still being set by the people with the drones.", "refs": ["hormuz-traffic", "hormuz-route"], "tr": "2 Ağustos'ta anlatılan güzergâh görüşmelerinin diplomatik olmaktan çıkıp ticari bir soruya dönüştüğü yer tam da burası. İran, Umman'la Hürmüz'de giriş ve çıkış şeritleri ayrı üçüncü bir koridor için yürüttüğü müzakerelerin son aşamada olduğunu söylemişti. Böyle bir düzenleme yayımlanır ve yürürlüğe girerse sınav, metnin imzalanması değil yükün ona inanmasıdır: yayımdan sonraki bir ay içinde Kpler'in saydığı Hürmüz geçişlerinin günde otuzun, Asya'ya yüklemelerin günde onun üzerine çıkması, armatörlerin ve sigortacıların şeritleri gerçek saydığı anlamına gelir. Trafiğin tek haneli düzeyde kalması ise koridorun kâğıt üstünde kaldığını ve risk primini hâlâ insansız hava araçlarını elinde tutanların belirlediğini gösterir."}]}], "sources": [{"key": "hormuz-traffic", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cjrv0dy2e90o", "title": {"tr": "Gemi takip verilerine göre pazar günü Hürmüz Boğazı'ndan sekiz gemi geçti", "en": "Eight ships passed through the Strait of Hormuz on Sunday, ship-tracking data show"}, "publishedDate": "2026-08-03"}, {"key": "hormuz-route", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "İran, Umman'la Hürmüz güzergâhı görüşmelerinin son aşamada olduğunu açıkladı", "en": "Iran says talks with Oman on a new Hormuz shipping route are in their final stages"}, "publishedDate": "2026-08-02"}], "title": {"en": "Eight ships on Sunday, and the detour now has a price too", "tr": "Pazar günü sekiz gemi, artık sapağın da bir fiyatı var"}, "writer": "geo-04", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "About 40,000 against more than 60,000, and 11 deaths against 72. The distance between the two sets of figures is seventy metres of water and a question about who is entitled to describe what happened on it.", "tr": "60.000'in üzerine karşılık yaklaşık 40.000, 72'ye karşılık 11 ölüm. İki sayı kümesi arasındaki mesafe, yetmiş metrelik bir su ve orada olanı anlatmaya kimin yetkili olduğuna dair bir soru."}, "sections": [{"h": {"en": "The ministry publishes its own arithmetic", "tr": "Bakanlık kendi aritmetiğini yayımlıyor"}, "ps": [{"en": "Morocco's interior ministry released figures on Sunday: about 40,000 people involved in the mass crossing into Ceuta, 1,135 stopped before they could enter Melilla, and 11 dead, mostly by drowning. It said it was fact-checking reports of deaths coming from the other side of the border. Spokesperson Rachid El Khalti, quoted in Moroccan media, attributed the surge to the shore-to-shore distance of less than seventy metres, which he said \"created a misleading perception among many participants that the crossing would be easy\", and the ministry blamed the \"malicious exploitation\" of social media and the \"spread of misleading information\".", "refs": ["ceuta-morocco"], "tr": "Fas İçişleri Bakanlığı pazar günü kendi sayılarını açıkladı: Ceuta'ya toplu geçişe yaklaşık 40.000 kişi karıştı, 1.135 kişi Melilla'ya giremeden durduruldu, çoğu boğularak 11 kişi öldü. Bakanlık, sınırın öte yakasından gelen ölüm haberleri için doğrulama çalışması yürüttüğünü belirtti. Fas basınının aktardığına göre sözcü Rachid El Khalti, hareketliliği kıyılar arasındaki yetmiş metreden kısa mesafeye bağladı ve bunun \"katılanların çoğunda geçişin kolay olacağı yönünde yanıltıcı bir algı yarattığını\" söyledi; bakanlık ayrıca sosyal medyanın \"kötü niyetle kullanılmasını\" ve \"yanıltıcı bilginin yayılmasını\" sorumlu tuttu."}, {"en": "Until Sunday, Morocco had been the subject of everybody else's account of Ceuta: the country the migrants came from, the country the Spanish government wanted them returned to, the country twenty-two European governments were writing letters about. Publishing a count changes that position. A state that gives numbers has entered the argument as an author, and the numbers it chose are legible: 1,135 stopped at Melilla is enforcement asking for credit, and 11 drownings is a death toll that its own coastguard can be held to. It is fair to read the same release as domestic reassurance — Moroccan audiences also saw the footage, and a ministry that says the surge was manufactured by misinformation is telling its own public that nothing structural has failed.", "refs": ["ceuta-morocco"], "tr": "Pazar gününe kadar Fas, Ceuta'ya ilişkin başkalarının anlatısında bir konuydu: göçmenlerin geldiği ülke, İspanya hükûmetinin geri göndermek istediği ülke, yirmi iki Avrupa hükûmetinin hakkında mektup yazdığı ülke. Sayı yayımlamak bu konumu değiştirir. Rakam veren bir devlet tartışmaya yazar sıfatıyla girmiştir ve seçtiği rakamlar okunabilir: Melilla'da durdurulan 1.135 kişi, takdir bekleyen bir kolluk başarısıdır; 11 boğulma ise kendi sahil güvenliğinin hesabını verebileceği bir ölü sayısıdır. Aynı açıklamayı iç kamuoyuna güvence olarak okumak da yerinde olur: görüntüleri Faslılar da izledi ve hareketliliğin yanlış bilgiyle üretildiğini söyleyen bir bakanlık, kendi halkına yapısal hiçbir şeyin çökmediğini söylemiş olur."}]}, {"h": {"en": "A table Morocco is not sitting at", "tr": "Fas'ın oturmadığı bir masa"}, "ps": [{"en": "The gap between the two sets of figures is not a rounding error. Spain says more than 60,000 crossed by land and sea and puts the dead at 72; Miguel Ángel Pérez, the government's representative in Ceuta, says more than a thousand people were treated by health services. Foreign Minister José Manuel Albares said on Monday that the vast majority had already returned to Morocco and that \"every last one of them will return\" — a policy whose delivery depends entirely on a state that will not be in the room on Tuesday, when the twenty-two governments that signed the joint letter meet by videoconference to discuss external borders. The people counted differently are the same people; what differs is which side of seventy metres of water does the counting, and which side has to receive them afterwards.", "refs": ["ceuta-morocco", "ceuta-eu"], "tr": "İki sayı kümesi arasındaki fark bir yuvarlama hatası değil. İspanya karadan ve denizden 60.000'den fazla kişinin geçtiğini, ölü sayısının 72 olduğunu söylüyor; hükûmetin Ceuta temsilcisi Miguel Ángel Pérez binden fazla kişinin sağlık hizmeti aldığını belirtiyor. Dışişleri Bakanı José Manuel Albares pazartesi günü büyük çoğunluğun Fas'a döndüğünü belirtip \"sonuncusuna kadar hepsi dönecek\" dedi. Bu siyasetin uygulanması tümüyle tek bir devlete bağlı; o devlet ise salı günü dış sınırları görüşmek üzere video konferansla toplanacak yirmi iki imzacı hükûmetin masasında bulunmayacak. Farklı sayılan insanlar aynı insanlar; değişen, yetmiş metrelik suyun hangi yakasının saydığı ve sonrasında hangi yakanın onları geri almak zorunda kaldığı."}, {"en": "That makes Tuesday's meeting worth reading for its arithmetic rather than its language. The signatories wrote that they cannot allow uncontrolled mass crossings, and several of them acted nationally before the meeting was even called. If the ministers produce a text, the thing to look at is whether it cites a crossing figure at all, and if so whose: a European conclusion that uses the Spanish number treats Morocco as the object of the policy, while one that acknowledges both counts has conceded that the state on the other shore is a party to it. Nobody at that videoconference has to answer for the 11 or for the 72, which is the part of the arrangement neither count captures.", "refs": ["ceuta-morocco", "ceuta-eu"], "tr": "Bu da salı günkü toplantıyı dilinden çok aritmetiği açısından okumaya değer kılıyor. İmzacılar denetimsiz toplu geçişlere izin veremeyeceklerini yazdı ve birkaçı toplantı çağrısı yapılmadan önce ulusal düzeyde adım attı. Bakanlar bir metin çıkarırsa bakılacak şey, metnin herhangi bir geçiş sayısına atıf yapıp yapmadığı, yapıyorsa kimin sayısına yaptığıdır: İspanya'nın rakamını kullanan bir Avrupa sonuç metni Fas'ı siyasetin nesnesi sayar, iki sayımı da anan bir metin ise öteki kıyıdaki devletin bu siyasetin tarafı olduğunu kabul etmiş olur. O video konferansta ne 11'in ne de 72'nin hesabını verecek kimse var; iki sayımın da yakalayamadığı bölüm bu."}]}], "sources": [{"key": "ceuta-morocco", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/news/europe/2026/08/03/morocco-blames-ceuta-migrant-rush-on-misinformation-and-human-trafficking-networks/", "title": {"tr": "Fas İçişleri Bakanlığı Ceuta için 40.000 geçiş ve 11 ölüm bildirdi", "en": "Morocco's interior ministry counts 40,000 crossings and 11 deaths at Ceuta"}, "publishedDate": "2026-08-03"}, {"key": "ceuta-eu", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "title": {"tr": "22 AB hükümeti Ceuta için olağanüstü içişleri bakanları toplantısı istedi", "en": "22 EU governments call for an emergency interior ministers' meeting over Ceuta"}, "publishedDate": "2026-08-02"}], "title": {"en": "Rabat answered Madrid's count with a lower one", "tr": "Rabat, Madrid'in sayımına daha düşük bir sayımla karşılık verdi"}, "writer": "geo-05", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "A letter written on 2 July, published in August, thanking a recognition granted in 2020 over a territory contested since 1975. The road is 1,055km long and the argument beneath it is older than the asphalt.", "tr": "2 Temmuz'da yazılmış, ağustosta yayımlanmış, 1975'ten beri ihtilaflı bir bölge üzerinde 2020'de verilmiş bir tanımaya teşekkür eden bir mektup. Yol 1.055 km; altındaki tartışma asfalttan eski."}, "sections": [{"h": {"en": "Three dates in one letter", "tr": "Tek mektupta üç tarih"}, "ps": [{"en": "Morocco's state press agency published a letter from King Mohammed VI to Donald Trump confirming that the road formerly known as the Tiznit-Dakhla highway now carries the US president's name, as \"a personal expression of my high regard\". The letter is dated 2 July and appeared over the weekend; Trump had thanked the king in a social media post the previous week, with no parallel announcement from Rabat at the time. The king cites what he calls the \"historic recognition... of Morocco's sovereignty over its Sahara\", says it will \"forever be etched in the memory of Moroccans, from generation to generation\", and describes the 1,055km road as a \"strategic axis\" linking the \"north and south of Morocco\".", "refs": ["morocco-highway"], "tr": "Fas devlet haber ajansı, Kral VI. Muhammed'in Donald Trump'a yazdığı mektubu yayımladı; mektup, eskiden Tiznit-Dahle otoyolu diye bilinen yolun artık ABD başkanının adını taşıdığını, bunun \"kişisel takdirimin bir ifadesi\" olduğunu doğruluyor. Mektup 2 Temmuz tarihli ve hafta sonu ortaya çıktı; Trump bir hafta önce sosyal medya paylaşımında krala teşekkür etmiş, o sırada Rabat'tan koşut bir duyuru gelmemişti. Kral, ABD başkanının \"Fas'ın Sahra üzerindeki egemenliğini tarihî biçimde tanımasına\" atıf yapıyor, bunun \"kuşaktan kuşağa Faslıların hafızasına kazınacağını\" söylüyor ve 1.055 km uzunluğundaki yolu Fas'ın \"kuzeyi ile güneyini\" bağlayan bir \"stratejik eksen\" diye tanımlıyor."}, {"en": "The interval between the two documents is the interesting part. Trump's post came first and Rabat's confirmation came a week later, which reverses the usual order in which a state announces its own decisions and a foreign capital responds. Read against the phrase the king chose, the sequence suggests the naming was intended to be an internal administrative fact — a road, a designation, a sign — that acquired a diplomatic audience only after the audience claimed it. That reading may be too neat. Renaming infrastructure after a friendly head of state is an ordinary courtesy in many countries, and the fact that this particular road runs through disputed ground does not prove the courtesy was designed as an instrument of sovereignty.", "refs": ["morocco-highway"], "tr": "İlgi çekici olan, iki belge arasındaki aralık. Önce Trump'ın paylaşımı geldi, Rabat'ın doğrulaması bir hafta sonra; bu, bir devletin kendi kararını duyurup yabancı bir başkentin karşılık verdiği alışılmış sıralamayı tersine çeviriyor. Kralın seçtiği ifadeyle birlikte okunduğunda sıralama, adlandırmanın iç idari bir olgu olarak — bir yol, bir tanım, bir tabela — tasarlandığını ve diplomatik izleyicisini ancak izleyici sahip çıktıktan sonra kazandığını düşündürüyor. Bu okuma fazla derli toplu olabilir. Altyapıya dost bir devlet başkanının adını vermek pek çok ülkede sıradan bir nezaket jestidir ve bu yolun ihtilaflı topraktan geçiyor olması, jestin bir egemenlik aracı olarak tasarlandığını kanıtlamaz."}]}, {"h": {"en": "What a name settles and what it leaves open", "tr": "Bir adın çözdüğü ve açık bıraktığı"}, "ps": [{"en": "The positions the road runs through have not moved. The United Nations still lists Western Sahara as a non-self-governing territory and has pushed for a solution including a referendum that has never taken place; the Polisario Front controls part of the territory and seeks independence for the Sahrawi people; the African Union recognises that independence; the United Kingdom and Spain support Morocco's autonomy plan while withholding independence; and the United States recognised Morocco's claim in 2020 as part of an arrangement under which Morocco normalised relations with Israel. A road can carry a name across all five of those positions without any of them being amended. What changes is the register in which the Moroccan claim is asserted: from a diplomatic text that must be renewed to a physical object that has to be renamed if anyone wants it undone.", "refs": ["morocco-highway"], "tr": "Yolun içinden geçtiği konumlar yerinden oynamadı. Birleşmiş Milletler Batı Sahra'yı hâlâ kendi kendini yönetmeyen bölge olarak sayıyor ve hiç yapılmamış bir referandumu da içeren bir çözüm için bastırıyor; Polisario Cephesi bölgenin bir bölümünü denetliyor ve Sahravi halkı için bağımsızlık istiyor; Afrika Birliği bu bağımsızlığı tanıyor; Birleşik Krallık ile İspanya bağımsızlığı vermeksizin Fas'ın özerklik planını destekliyor; ABD ise Fas'ın iddiasını 2020'de, Fas'ın İsrail'le ilişkilerini normalleştirmesini içeren bir düzenlemenin parçası olarak tanıdı. Bir yol, bu beş konumun hiçbiri değiştirilmeden hepsinin içinden bir adı taşıyabilir. Değişen şey, Fas iddiasının hangi kayıtta öne sürüldüğüdür: yenilenmesi gereken bir diplomatik metinden, geri alınması için yeniden adlandırılması gereken fiziksel bir nesneye."}, {"en": "The disanalogy with 2020 is what makes this worth watching rather than filing. That recognition was an exchange, and its price — normalisation with Israel — was visible to everyone, including the states that declined to follow. This time nothing is asked in return, which removes the transaction that made the earlier step legible to third parties and leaves only a proper noun on a map. So the test is whether the name travels. If a European government that backs the autonomy plan uses the new designation in its own official correspondence within a year, rather than only quoting Moroccan usage, the naming will have done what the 2020 text could not: made a contested claim ordinary. If it never appears outside Moroccan and US documents, it will remain what it looks like today — a bilateral courtesy pointed at a fifty-year-old question.", "refs": ["morocco-highway"], "tr": "Bunu dosyalamak yerine izlemeye değer kılan şey, 2020 ile arasındaki farktır. O tanıma bir mübadeleydi ve bedeli — İsrail'le normalleşme — aynı adımı atmaktan kaçınan devletler de dâhil herkesin gözü önündeydi. Bu kez karşılığında bir şey istenmiyor; bu da önceki adımı üçüncü taraflar için okunabilir kılan alışverişi ortadan kaldırıyor ve geriye haritada bir özel ad bırakıyor. Dolayısıyla sınav, adın yol alıp almadığıdır. Özerklik planını destekleyen bir Avrupa hükûmeti yeni adı bir yıl içinde yalnızca Fas kullanımını aktararak değil kendi resmî yazışmasında kullanırsa, adlandırma 2020 metninin yapamadığını yapmış, ihtilaflı bir iddiayı sıradanlaştırmış olur. Fas ve ABD belgelerinin dışına hiç çıkmazsa, bugün göründüğü şey olarak kalır: elli yıllık bir soruya çevrilmiş ikili bir nezaket."}]}], "sources": [{"key": "morocco-highway", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c3r0vg88zr2o", "title": {"tr": "Kraliyet mektubu, Fas'ın bir otoyola Trump'ın adını verdiğini doğruladı", "en": "A royal letter confirms Morocco has renamed a highway after Trump"}, "publishedDate": "2026-08-03"}], "title": {"en": "Fifty years of dispute, and now a road sign", "tr": "Elli yıllık ihtilaf, şimdi bir yol tabelası"}, "writer": "geo-06", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"writer": "geo-01", "title": {"tr": "Salı günkü toplantının elindeki tek araç kendi iç sınırları", "en": "The only instrument Tuesday's meeting holds is its own internal borders"}, "excerpt": {"tr": "22 üye devletin imzaladığı mektup olağanüstü bir konsey topluyor. Ancak metnin adını andığı tek somut önlem, Ceuta'da değil, imzacıların kendi sınırlarında uygulanıyor.", "en": "A letter signed by 22 member states convenes an extraordinary council. Yet the one concrete measure the text names is applied not at Ceuta but at the signatories' own frontiers."}, "sections": [{"h": {"tr": "Mektubun çağırdığı organ", "en": "The body the letter convenes"}, "ps": [{"tr": "Yirmi iki üye devlet, İtalya ile Danimarka'nın başlattığı bir mektuba imza attı; Fransa, Portekiz ve Lüksemburg atmadı. Dönem başkanlığını temmuzda devralan İrlanda, Adalet ve İçişleri Konseyi'ni salı günü olağanüstü bir video konferansla topluyor. Metnin gerekçesi, denetimsiz kitlesel geçişlerin ve göçün araçsallaştırılmasının Avrupa Birliği'ne yasa dışı girişin mümkün olduğu algısını yaratması tehlikesi.", "en": "Twenty-two member states signed a letter initiated by Italy and Denmark; France, Portugal and Luxembourg did not. Ireland, which took over the rotating presidency in July, is convening the Justice and Home Affairs Council on Tuesday in an extraordinary videoconference. The stated reason is the danger that uncontrolled mass crossings and the instrumentalisation of migration create the perception that illegal entry into the European Union is possible.", "refs": ["ceuta-council"]}, {"tr": "Mektubun bağlayıcı bir yaptırımı yok; hukuken bağlayıcı olan, imzacıların saklı tuttuğu seçenek. O seçenek geçici iç sınır denetimlerini güçlendirmek ya da yeniden uygulamaya koymak. Bu yetki, her üye devletin kendi sınırında kullandığı bir yetki; Ceuta'daki dış sınırda kullanılan bir yetki değil. Alternatif okuma da mümkün: metin bir operasyon planından çok, iç kamuoyuna dönük bir konum bildirimi olabilir. İki okumayı ayıracak olan, salı günü hangi aracın ve hangi takvimin adının konacağı.", "en": "The letter carries no enforcement of its own; what is legally operative is the option the signatories reserve. That option is to reinforce or reintroduce temporary internal border controls. It is a power each member state exercises at its own frontier, not at the external border in Ceuta. A second reading is available: the text may be a position taken for domestic audiences rather than an operational plan. What separates the two readings is whether Tuesday names an instrument and a date.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "İki sınırda iki ayrı yetki", "en": "Two borders, two authorities"}, "ps": [{"tr": "Madrid'in verdiği rakamlara göre perşembe günü yaklaşık 50.000 kişi Ceuta'ya geçti, neredeyse tamamı geri gönderildi ve 67 kişi hayatını kaybetti. Komisyon Başkanı Ursula von der Leyen tek bir kişinin bile İspanya anakarasına ya da Birliğin geri kalanına ulaşmadığını söyledi. İç sınır denetimi, tam da bu ulaşmanın önlenmesi için düşünülmüş bir araç.", "en": "On Madrid's figures about 50,000 people crossed into Ceuta on Thursday, almost all were returned and 67 died. Commission President Ursula von der Leyen said not a single person reached mainland Spain or the rest of the Union. Internal border control is an instrument designed to prevent exactly that onward movement.", "refs": ["ceuta-council"]}, {"tr": "Uygulama maliyetini kimin taşıdığı da buradan çıkıyor. Başbakan Pedro Sánchez, üye devletlerin bir bölümünün dayanışma gösterdiğini, bir bölümününse İspanya'yı hedef alıp ülkenin Schengen alanından geçici olarak çıkarılmasını istediğini söyledi. Gündemi kuran taraf ise mektubu kaleme alan Roma ile Kopenhag; Paris, Lizbon ve Lüksemburg imzadan uzak durarak aynı gündemin dışında kaldı.", "en": "That is also where the compliance cost lands. Prime Minister Pedro Sánchez said some member states had shown solidarity while others had chosen to attack Spain and to call for its temporary exclusion from the Schengen area. The agenda-setters are Rome and Copenhagen, who drafted the letter; Paris, Lisbon and Luxembourg stayed outside it by withholding their signatures.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "Salı günü ölçülebilecek şey", "en": "What Tuesday will make measurable"}, "ps": [{"tr": "Bir konsey toplantısının çıktısı sonuç bildirgesi olabilir, tarifeli bir yükümlülük de olabilir. Eylül sonuna kadar herhangi bir imzacı, Ceuta'yı gerekçe göstererek geçici iç sınır denetimi bildiriminde bulunmazsa, salı günkü metnin bağladığı şey davranış değil, gündem olacak. Bildirim gelirse, mektubun saklı tuttuğu araç kullanılmış olur ve maliyeti ilk elde sınırdan geçen kişiler ve taşımacılar taşır.", "en": "A council meeting can produce conclusions, or it can produce a dated obligation. If no signatory notifies temporary internal border controls citing Ceuta before the end of September, what Tuesday's text binds is the agenda rather than behaviour. If a notification does come, the reserved instrument has been used, and the first cost falls on the people and hauliers who cross those frontiers.", "refs": ["ceuta-council"]}]}], "sources": [{"key": "ceuta-council", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/22-eu-leaders-call-for-emergency-talks-over-ceuta-migrant-crisis", "title": {"tr": "Yirmi iki AB üyesi Ceuta için olağanüstü bakanlar toplantısı istedi", "en": "Twenty-two EU members call for emergency ministerial talks on Ceuta"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Bir komutanlığın devri neyi devrediyor?", "en": "What does handing over a command actually transfer?"}, "excerpt": {"tr": "Wiesbaden'daki komutanlığın başına Avrupalı ya da Kanadalı bir general geçecek, Amerika Birleşik Devletleri yardımcı komutanlıkta kalacak. Yer değiştiren şey koordinasyon; koordine edilen kabiliyetlerin kaynağı olduğu yerde duruyor.", "en": "A European or Canadian general is to take the Wiesbaden command while the United States keeps the deputy's chair. What changes hands is the coordination; the source of the capabilities being coordinated stays where it is."}, "sections": [{"h": {"tr": "Devrin şekli", "en": "The shape of the handover"}, "ps": [{"tr": "Politico'ya dayandırılan habere göre Pentagon, Almanya'nın Wiesbaden kentindeki Ukrayna Güvenlik Yardım Grubu'nun komutasını başka bir NATO üyesine bırakıyor. Komutanlık teçhizat sevkiyatını koordine ediyor, eğitimi ve lojistik desteği yürütüyor. Geçiş bir yıla kadar sürebilecek; komutayı Avrupalı ya da Kanadalı bir general üstlenecek, ABD Avrupa Komutanlığı yardımcı komutan düzeyinde kalacak. Bir NATO yetkilisi bunu müttefiklerin daha fazla sorumluluk üstlenmesinin bir örneği daha olarak tanımladı.", "en": "According to a report sourced to Politico, the Pentagon is relinquishing command of the Security Assistance Group-Ukraine in Wiesbaden, Germany, to another NATO member. The command coordinates equipment deliveries and runs training and logistical support. The transition may take up to a year; a European or Canadian general takes command while US European Command remains at deputy level. A NATO official described this as another example of allies taking on greater responsibility.", "refs": ["sagu-handover"]}, {"tr": "Bir kefede bir koltuk değişiyor: personel, karargâh düzeni ve gündem sırası artık başka bir başkentin sorumluluğunda. Öbür kefede taahhüt değişmiyor. Yetkililerin verdiği bilgi, çalışmanın kesintiye uğramayacağı yönünde; yani devredilen şey yürütmenin sorumluluğu, kaynağın kendisi değil. Bir masanın başına kimin oturduğu ile masaya neyin konduğu ayrı sorular.", "en": "In one pan a chair changes hands: staffing, headquarters routine and the order of business now belong to another capital. In the other pan the commitment does not change. Officials describe the work as continuing uninterrupted, which means what moves is responsibility for execution rather than the resource itself. Who sits at the head of a table and what is placed on it are separate questions.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Aynı hattın öbür ucu", "en": "The other end of the same line"}, "ps": [{"tr": "Devrin karşılaştığı kısıt, aynı hafta Kiev'de görünür oldu. Cumhurbaşkanı Volodimir Zelenskiy 27 balistik füzenin atıldığını, bunlardan yalnızca birinin bir Patriot sistemiyle düşürüldüğünü açıkladı; acil servisler en az dokuz ölü ve 33 yaralı bildirdi. Koordinasyonun konusu olan tedarik akışının darboğazı, komutanlığın kimde olduğuyla değil, akıtılacak stokla ilgili.", "en": "The constraint the handover meets became visible in Kyiv the same week. President Volodymyr Zelenskyy said 27 ballistic missiles were launched and only one was brought down by a Patriot system; emergency services reported at least nine dead and 33 wounded. The bottleneck in the supply flow that coordination exists to manage is a question of stock, not of who holds the command.", "refs": ["sagu-handover", "kyiv-salvo"]}, {"tr": "Karşı sav güçlü: bir yıla yayılan ve ABD Avrupa Komutanlığı'nı yardımcı komutan düzeyinde tutan devir, tam da akışın değişken hâline gelmemesi için tasarlanmış olabilir. İttifak içi yük paylaşımı, öncelikleri kayan bir lider devletin görevi tümüyle bırakmasındansa görevin sürmesini sağlayan en az sarsıcı yol da olabilir. Bu okumada devir bir geri çekilme değil, bir sigorta.", "en": "The countercase is strong: a transfer spread over a year that keeps US European Command at deputy level may be designed precisely so that the flow does not become the variable. Burden-sharing inside an alliance can also be the least disruptive way of keeping a mission alive when the lead nation's priorities move, rather than of ending it. On that reading the handover is an insurance policy, not a withdrawal.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Devir tamamlandığında sorulacak soru", "en": "The question when the transfer completes"}, "ps": [{"tr": "Geriye tek bir açık soru kalıyor: komutayı devralan devlet, kendi bütçesiyle ve kendi personeliyle aynı akışı sürdürebilir mi, yoksa koltuğun yeni sahibi karar yetkisi olmadan sorumluluk mu üstlenir? Bu sorunun cevabı duyuruyla birlikte gelmiyor; devir takviminin sonunda, sevkiyatın sürekliliğine bakılarak veriliyor.", "en": "One open question remains: can the state that takes command sustain the same flow with its own budget and its own staff, or does the new occupant of the chair assume responsibility without the power of decision? The answer does not arrive with the announcement; it arrives at the end of the transition timetable, and the measure is the continuity of deliveries.", "refs": ["sagu-handover"]}]}], "sources": [{"key": "sagu-handover", "kind": "news", "name": "Interfax-Ukraine", "url": "https://en.interfax.com.ua/news/general/1189917.html", "title": {"tr": "Pentagon, Ukrayna'ya yardımı koordine eden komutanlığın başını bir NATO müttefikine bırakıyor", "en": "The Pentagon is handing leadership of the Ukraine aid command to a NATO ally"}, "publishedDate": "2026-08-01"}, {"key": "kyiv-salvo", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "Bir konteyner gemisi savaşı sürdüren tesis sayıldı", "en": "A container ship was counted as a facility that sustains the war"}, "excerpt": {"tr": "Yanina, Novorossiysk'in 130 deniz mili açığında iki insansız deniz aracıyla vuruldu. Hedef seçimini belirleyen ölçü mesafe değil, geminin hangi zincirin parçası sayıldığı.", "en": "The Yanina was struck by two naval drones 130 nautical miles off Novorossiysk. What sets the target is the chain the ship is counted as part of, rather than the distance to it."}, "sections": [{"h": {"tr": "Menzil ve hedef", "en": "Range and target"}, "ps": [{"tr": "Volodimir Zelenskiy, yaptırım listesindeki Rus bayraklı Yanina'nın iki insansız deniz aracıyla batırıldığını açıkladı. Gemi 100.000 tonun üzerinde kapasiteli; saldırı Novorossiysk limanının yaklaşık 130 deniz mili açığında, uluslararası sularda gerçekleşti. Zelenskiy hedeflerin savaş çabasını ayakta tutan tesisler arasından seçildiğini söyledi. Rosatom Genel Müdürü Aleksey Lihaçev geminin dondurulmuş gıda ve inşaat malzemesi taşıdığını öne sürdü, saldırıyı korsanlık olarak niteledi ve 17 mürettebatın kurtarıldığını bildirdi.", "en": "Volodymyr Zelensky said the sanctioned Russian-flagged Yanina had been sunk by two naval drones. The vessel has a capacity of more than 100,000 tonnes; the strike took place in international waters about 130 nautical miles off the port of Novorossiysk. Zelensky said targets were chosen from among facilities that sustain the war effort. Rosatom's chief executive Alexey Likhachev said the ship was carrying frozen food and construction materials, called the attack piracy and said all 17 crew had been rescued.", "refs": ["yanina-strike"]}, {"tr": "130 deniz mili bir niyet beyanı değil, bir dayanıklılık ve hedefleme ölçüsüdür. Kıyıdan çıkan insansız yüzey araçları, bu mesafede bir ticari tekneyi tehdit altında tutabiliyorsa, kıyı savunmasına bağlı bir kuvvet açık denizde risk üretebilen bir kuvvete dönüşmüş demektir. Karşı sav da geçerli: tek bir başarılı vuruş, sürdürülebilir bir tempo kanıtlamaz. Hava, seyir koşulları ve hedefin manevra yapmaması da sonucu açıklayabilir.", "en": "130 nautical miles measures endurance and targeting rather than intent. If uncrewed surface vessels launched from shore can hold a commercial hull at risk at that distance, a force tied to coastal defence has become one that can generate risk in open water. The countercase holds too: a single successful strike does not establish a sustainable rate. Weather, sea state and a target that did not manoeuvre could equally explain the outcome.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Sınıflandırma sorunu", "en": "The classification problem"}, "ps": [{"tr": "Aynı gövde için iki bağdaşmaz tanım ortaya kondu: savaş çabasını ayakta tutan bir tesis ve sivil yük taşıyan bir ticaret gemisi. Kyiv Independent, Rus tarafının iddialarını bağımsız olarak doğrulayamadığını yazdı. Doğrulanabilir olan yalnızca üç şey: geminin yaptırım listesinde bulunması, Rosatom'un olayı sahiplenerek açıklama yapması ve saldırının gerçekleşmiş olması. Kimin ne taşıdığı bu bilgiyle henüz kapanmıyor.", "en": "Two incompatible descriptions were offered for one hull: a facility sustaining the war effort, and a merchant ship carrying civilian cargo. The Kyiv Independent said it could not independently verify the Russian claims. Only three things are verifiable: that the ship was under sanctions, that Rosatom spoke for it, and that the strike happened. What was on board is not settled by this evidence.", "refs": ["yanina-strike"]}, {"tr": "Askerî olarak önemli olan, sınıflandırmanın sonucu değil, sınıflandırmanın kendisinin bir kabiliyet gerektirmesi. Bir gemiyi yaptırım listesiyle, sahiplik zinciriyle ve rotasıyla eşleştirip vurulabilir hâle getirmek, füzeden çok istihbarat ve hedefleme işidir. Ukrayna aynı gün Rusya'nın derinliklerindeki üç rafineriyi ve dört radar sistemini de vurduğunu açıkladı; bu, hedef üretiminin tek bir alana bağlı olmadığını gösteriyor.", "en": "What matters militarily is that classifying at all requires a capability, whatever the classification concludes. Matching a hull to a sanctions listing, an ownership chain and a sailing route until it becomes strikeable is a task of intelligence and targeting more than of munitions. Ukraine said it had also struck three refineries and four radar systems deep inside Russia the same day, which suggests target generation is not confined to one domain.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Tekrar olursa ne görünür", "en": "What becomes visible if it repeats"}, "ps": [{"tr": "Bu vuruş bir kereye mahsus mu, yoksa bir tempo mu, ekim sonuna kadar anlaşılır. Benzer mesafelerde ticari gövdelere yönelik ikinci ve üçüncü bir vuruş gelirse, gözlenecek karşılık refakat ve konvoy düzeni ya da Novorossiysk trafiğinin başka limanlara kayması olacaktır. Bu tedbirlerden hiçbiri görülmezse, olay bir kabiliyet gösterisi olarak kalır ve tempo iddiası düşer.", "en": "Whether this was a one-off or a tempo will be clear by the end of October. If a second and third strike on commercial hulls follow at comparable distances, the response to watch is escort and convoy practice, or a shift of Novorossiysk traffic to other ports. If none of those measures appears, the event stands as a demonstration of capability and the claim of tempo falls.", "refs": ["yanina-strike"]}]}], "sources": [{"key": "yanina-strike", "kind": "news", "name": "The Kyiv Independent", "url": "https://kyivindependent.com/ukraine-strikes-3-russian-oil-refineries-sinks-sanctioned-ship-zelensky-says/", "title": {"tr": "Ukrayna, yaptırım listesindeki Rus konteyner gemisi Yanina'yı batırdığını açıkladı", "en": "Ukraine says it sank the sanctioned Russian container ship Yanina"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Günlük 170.000 varil akan hatta 750.000 varil taahhüdü", "en": "A 750,000-barrel commitment on a line carrying 170,000"}, "excerpt": {"tr": "BOTAŞ ile SOMO ve NOC'un imzaladığı bir yıllık transit düzenlemesi günlük en az 750.000 varil öngörüyor. Hattın bugünkü akışı yaklaşık 170.000 varil; aradaki fark bir söz meselesi değil, bir yükleme meselesi.", "en": "The one-year transit arrangement BOTAŞ signed with SOMO and NOC sets a floor of 750,000 barrels a day. The line currently moves about 170,000; the gap is a loading problem rather than a promise."}, "sections": [{"h": {"tr": "Üç sayı ve bir süre", "en": "Three numbers and a term"}, "ps": [{"tr": "Cumartesi imzalanan düzenleme günlük en az 750.000 varil öngörüyor. Hattın tasarım kapasitesi 1,5 milyon varil, bugünkü akışı ise yaklaşık 170.000 varil ve bunun büyük bölümü Irak'ın Kürdistan bölgesindeki sahalardan geliyor. Anlaşma bir yıl yürürlükte kalacak; petrol, elektrik ve su kaynaklarını kapsayan geniş çerçeve ise hâlâ görüşülüyor.", "en": "The arrangement signed on Saturday sets a floor of 750,000 barrels a day. The line's design capacity is 1.5 million barrels and its current flow is about 170,000, most of it from fields in Iraq's Kurdistan region. The agreement runs for a year; the broader framework covering oil, electricity and water resources is still under negotiation.", "refs": ["ceyhan-transit"]}, {"tr": "Taban rakamı bir taahhüt, bir akış değil. Bugünkü hacmin ağırlığı kuzeydeki bir kaynak grubundan geliyorsa, 170.000'den 750.000'e çıkmak aynı sahaların daha çok üretmesiyle değil, federal denetimdeki üretimin bu hatta yönlendirilmesiyle olur. Bu bir tahsis kararı, bir boru kararı değil. Alternatif de var: taban rakamı çerçeve müzakeresinde tarafların birbirine gösterdiği bir referans olabilir ve fiilî akışın hiç değişmemesi de anlaşmanın ihlali sayılmayabilir.", "en": "A floor is a commitment, not a flow. If the bulk of today's volume comes from one group of northern fields, moving from 170,000 to 750,000 happens not by those fields producing more but by output under federal control being routed onto this line. That is an allocation decision, not a pipeline decision. There is an alternative: the floor may be a reference point the two sides hold up during the framework talks, and actual flow never changing may not amount to a breach.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Sayılar Hürmüz'de başlıyor. Irak'ın petrol ihracatı, şubat sonunda Amerika Birleşik Devletleri ile İsrail'in İran'a düzenlediği saldırıların ardından yüzde 80'in üzerinde geriledi; aylık gelirler yaklaşık 6 milyar dolar düzeyinden 2 milyar dolar altına indi. Boğaz kapalıyken Ceyhan, Irak ham petrolü için boğazdan geçmeyen tek yüksek kapasiteli çıkış.", "en": "The numbers begin at Hormuz. Iraq's oil exports fell by more than 80 percent after the United States and Israel struck Iran in late February, and monthly revenues dropped from about $6bn to under $2bn. For Iraqi crude, Ceyhan is the only high-capacity outlet that avoids the Strait of Hormuz while it stays closed.", "refs": ["ceyhan-transit"]}, {"tr": "Yükü kimin taşıdığı da buradan okunuyor. Bekleyebilecek durumda olmayan taraf Bağdat: gelir açığı aylık ve bütçesel. Türkiye tarafında kazanç transit ücreti ve boş kapasitenin doldurulması. Alıcılar içinse Ceyhan, Basra'ya göre farklı bir sigorta ve navlun profiline sahip bir yükleme noktası. Enerji ve Tabii Kaynaklar Bakanı Alparslan Bayraktar düzenlemenin uzun vadeli anlaşma çabaları sürerken uygulamaya konduğunu söyledi; Irak Başbakanı Ali el-Zeydi ise anlaşmayı önemli bir stratejik dönüm noktası olarak nitelendirdi.", "en": "Incidence can be read from the same place. The party that cannot wait is Baghdad: the revenue gap is monthly and budgetary. On the Turkish side the gain is transit revenue and the filling of idle capacity. For buyers, Ceyhan is a loading point with a different insurance and freight profile from Basra. Energy Minister Alparslan Bayraktar said the arrangement had been put in place while work continued towards a long-term agreement; Iraq's Prime Minister Ali al-Zaidi called it an important strategic milestone.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Bir yılın fiyatladığı şey", "en": "What a one-year term prices"}, "ps": [{"tr": "Sürenin kendisi bir bilgi taşıyor. Onlarca yıllık eski düzenlemenin yerine kalıcı bir metin değil, on iki aylık bir köprü konmuş. Bir köprünün fiyatlanması, iki tarafın da uzun vadeli çerçeveyi bu süre içinde bağlamayı taahhüt etmemesi anlamına gelir; aynı zamanda boğaz sorununun bir yıl içinde çözüleceğine dair bir varsayımın da satın alınmadığını gösterir. Taban rakamının anlamı, Ceyhan'daki aylık yükleme verilerinde görünecek.", "en": "The term itself carries information. What replaced a decades-old arrangement is a twelve-month bridge rather than a permanent text. Pricing a bridge means neither side has undertaken to bind the long-term framework within that period; it also shows that no assumption about the strait being resolved inside a year has been bought. The meaning of the floor shows up in monthly loading data at Ceyhan.", "refs": ["ceyhan-transit"]}]}], "sources": [{"key": "ceyhan-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/turkiye-and-iraq-sign-one-year-oil-pipeline-deal-amid-global-shift", "title": {"tr": "Türkiye ile Irak, Kerkük-Ceyhan hattı için bir yıllık transit anlaşması imzaladı", "en": "Türkiye and Iraq sign a one-year transit deal for the Kirkuk-Ceyhan pipeline"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Arakçi'nin arama listesinde bir genelkurmay başkanı da var", "en": "An army chief is on Araghchi's call list"}, "excerpt": {"tr": "İran cumartesi günü Pakistan, Türkiye ve Suudi Arabistan'a ayrı ayrı telefon açtı. Pakistan'daki muhatap dışişleri bakanı değil, Genelkurmay Başkanı Asım Münir'di ve üç görüşmenin metni aynı değil.", "en": "Iran placed separate calls to Pakistan, Türkiye and Saudi Arabia on Saturday. In Pakistan the counterpart was the army chief, Asim Munir, not the foreign minister, and the three readouts are not identical."}, "sections": [{"h": {"tr": "Kime ne söylendi", "en": "Who was told what"}, "ps": [{"tr": "İran'ın yarı resmî Mehr ajansına dayandırılan aktarıma göre Dışişleri Bakanı Seyyid Abbas Arakçi cumartesi günü üç ayrı telefon görüşmesi yaptı: Pakistan Genelkurmay Başkanı Asım Münir, Türkiye Dışişleri Bakanı Hakan Fidan ve Suudi Arabistan Dışişleri Bakanı Prens Faysal bin Ferhan. Münir ve Fidan'a söylenen, İran'ın egemenliğini, toprak bütünlüğünü ve ulusal güvenliğini korumaya hazır olduğu ve her saldırıya kararlılıkla karşılık vereceğiydi.", "en": "According to an account sourced to Iran's semi-official Mehr news agency, Foreign Minister Seyed Abbas Araghchi made three separate calls on Saturday: to Pakistan's Chief of Army Staff Asim Munir, Turkish Foreign Minister Hakan Fidan and Saudi Foreign Minister Prince Faisal bin Farhan. What Munir and Fidan were told was that Iran is prepared to safeguard its sovereignty, territorial integrity and national security and would respond decisively to any aggression.", "refs": ["araghchi-calls"]}, {"tr": "Riyad'a söylenen bir cümle uzun. Suudi mevkidaşına yapılan uyarıda yalnızca Amerika Birleşik Devletleri ya da İsrail kaynaklı düşmanca bir eylem değil, bu eyleme verilecek bölgesel destek de kararlı ve orantılı bir yanıtın gerekçesi olarak sayıldı. Farkın kaynağı iki türlü açıklanabilir: ya üç muhatap gerçekten farklı bir eşikle muhatap edildi, ya da fark görüşmelerde değil, bakanlığın kamuoyuna yazdığı metinde oluştu. Elimizdeki kanıt ikisini ayırmaya yetmiyor.", "en": "What Riyadh was told runs one clause longer. In the warning to the Saudi counterpart it was not only hostile action by the United States or Israel that was named as grounds for a firm and proportionate response, but regional support for such action as well. The difference admits two explanations: either the three counterparts really were addressed with different thresholds, or the difference arose in the ministry's public text rather than in the conversations. The available evidence does not separate them.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Üç muhatap, üç ayrı kısıt", "en": "Three counterparts, three constraints"}, "ps": [{"tr": "Belgelenmiş olan yalnızca kiminle konuşulduğu ve o kişinin makamı. Pakistan'da kanal askerî; muhatap ordunun başındaki isim. Türkiye'de kanal diplomatik; muhatap NATO üyesi bir devletin dışişleri bakanı. Suudi Arabistan'da da kanal diplomatik, ama metnin en açık uyarısı oraya yöneltilmiş. Muhatap seçimi, İran'ın her başkentte hangi kurumun karar verdiğine dair kendi değerlendirmesini gösteriyor; bu değerlendirmenin doğru olup olmadığı ayrı bir soru.", "en": "What is documented is only who was spoken to and in what office. In Pakistan the channel is military; the counterpart heads the army. In Türkiye the channel is diplomatic; the counterpart is the foreign minister of a NATO member state. In Saudi Arabia the channel is diplomatic too, yet the text's most explicit warning was directed there. The choice of interlocutor shows Iran's own assessment of which institution decides in each capital; whether that assessment is correct is a separate question.", "refs": ["araghchi-calls"]}, {"tr": "Üç devletin önüne konan talep, taraf olmadıkları bir metin üzerinden geliyor. İran Dışişleri Bakanlığı aynı gün Washington'u haziran ortasında varılan mutabakatı ihlal etmekle suçladı; gerekçe olarak süren saldırıları, limanlara ve ticari denizciliğe uygulanan ablukayı ve artan ekonomik baskıyı gösterdi. İslamabad, Ankara ve Riyad'dan istenen, imzacısı olmadıkları bir mutabakatın ihlali konusunda tavır almak. Karşı okuma da mümkün: görüşmeler dış politikadan çok iç kamuoyuna dönük bir kararlılık gösterisi olabilir.", "en": "The demand placed before the three states arrives through a text they are not party to. Iran's foreign ministry accused Washington the same day of breaching the memorandum agreed in mid-June, citing continuing strikes, a blockade of ports and commercial shipping and increased economic pressure. What is asked of Islamabad, Ankara and Riyadh is to take a position on the breach of an understanding they did not sign. A contrary reading is available: the calls may be a display of resolve aimed at domestic audiences rather than at foreign policy.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Elde tek bir taraf var", "en": "Only one side has spoken"}, "ps": [{"tr": "Bu üç görüşmeye dair elimizdeki tek anlatı İran'ın kendi anlatısı. Pakistan, Türkiye ve Suudi Arabistan kendi özetlerini yayımladıklarında asıl bilgi, İran'ın metninde bulunup onlarınkinde bulunmayan cümlelerde bulunuyor. Özellikle bölgesel desteğin bir yanıt gerekçesi sayılması, üç hükümetin de sessiz kalmayı ya da farklı bir dille cevap vermeyi seçebileceği bir yer. İzlenecek somut işaret şu: bu üç dışişleri bakanlığından herhangi biri kendi özetinde bölgesel destek ifadesini tekrarlarsa, uyarının kabul edildiği doğrulanır; ifadeyi atlarlarsa, çağrının karşılıksız kaldığı anlaşılır.", "en": "The only account of these three conversations that exists is Iran's own. When Pakistan, Türkiye and Saudi Arabia publish their own summaries, the real information lies in the sentences present in Iran's text and absent from theirs. The clause treating regional support as grounds for a response is precisely the point at which all three governments may choose silence or a different formulation. The concrete signal to watch is this: if any of the three foreign ministries repeats the regional-support wording in its own summary, the warning was accepted; if they omit it, the approach went unanswered.", "refs": ["araghchi-calls"]}]}], "sources": [{"key": "araghchi-calls", "kind": "news", "name": "Xinhua", "url": "https://english.news.cn/20260802/e50cf362c21a4efdb0ff77ef0f413399/c.html", "title": {"tr": "Arakçi, Pakistan, Türkiye ve Suudi Arabistan'a bölgesel destek uyarısı yaptı", "en": "Araghchi warns Pakistan, Türkiye and Saudi Arabia against backing US action"}, "publishedDate": "2026-08-02"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "Sheraro'daki çatışma 2022'de ertelenen maddelerin üzerinde duruyor", "en": "The fighting at Sheraro stands on the clauses postponed in 2022"}, "excerpt": {"tr": "Batı Tigray'da cumartesi şafağında başlayan çatışma, Kasım 2022 anlaşmasının çözdüğü değil ileriye bıraktığı iki başlığın üzerinde: silahsızlanma ve TPLF'nin hukuki statüsü.", "en": "The fighting that began at dawn on Saturday in western Tigray rests on the two items the November 2022 agreement postponed rather than settled: disarmament and the TPLF's legal status."}, "sections": [{"h": {"tr": "Yer ve tarih birlikte okunduğunda", "en": "Reading the place and the date together"}, "ps": [{"tr": "Çatışma, Sudan sınırına yakın Sheraro çevresinde cumartesi şafağında başladı. Tigray bölge yönetimi saldırıyı federal kuvvetlere yükledi; federal bakan Abraham Belay ise TPLF başkanı Debretsion Gebremichael'e bağlı güçlerin başlattığını söyledi ve savaşın yeterince sürdüğünü, anlaşmazlıkların diyalogla çözülmesi gerektiğini ekledi. Etiyopya uzmanı Kjetil Tronvoll olayı 2022 anlaşmasından bu yana yaşanan en ciddi olay olarak niteledi. İki anlatının hiçbiri bağımsız doğrulanmış değil ve can kaybı bildirilmedi.", "en": "The fighting began at dawn on Saturday around Sheraro, close to the Sudanese border. Tigray's regional government attributed the assault to federal forces; the federal minister Abraham Belay said forces loyal to TPLF chairman Debretsion Gebremichael had started it, adding that the war had gone on long enough and that differences should be settled through dialogue. Kjetil Tronvoll, a specialist on Ethiopia, called it the most serious incident since the 2022 agreement. Neither account is independently verified and no casualty figures were reported.", "refs": ["tigray-sheraro"]}, {"tr": "Kasım 2022'de imzalanan Pretoria anlaşması, 2020'de başlayan ve yüz binlerce kişinin ölümüne yol açan savaşı bitirdi. Bitirmediği iki şey vardı: silahların kimin elinde kalacağı ve TPLF'nin hangi hukuki sıfatla var olacağı. Bu iki başlık dört yıl boyunca askıda kaldı; TPLF temmuz ortasında anlaşmanın fiilen sona erdiğini açıkladı. Devralınan düzenleme burada tamamlanmamış bir silah ve statü tasfiyesi olarak duruyor.", "en": "The Pretoria agreement signed in November 2022 ended a war that began in 2020 and killed hundreds of thousands. Two things it did not end were the question of who would keep the weapons and under what legal standing the TPLF would exist. Those two items hung unresolved for four years; in mid-July the TPLF said the agreement was effectively dead. The inherited arrangement here is an unfinished disposition of arms and standing rather than a boundary line.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Neden bugün ve neden burada", "en": "Why today, and why here"}, "ps": [{"tr": "Tetiği çeken şey, o metni imzalayan tarafın kendi içindeki yarılma. Başbakan Abiy Ahmed'in danışmanı Getachew Reda, Debretsion'un Eritre'ye ve Amhara milislerine yaslanarak iktidarı ele geçirmeye çalıştığını öne sürdü. Suçlama dışarıdan değil, anlaşmanın Tigray tarafını temsil eden yapının içinden geliyor. Bir uzlaşma metni tek bir muhatap varsayarak yazıldığında, o muhatabın ikiye ayrılması metnin öngörmediği bir durumdur.", "en": "What pulled the trigger is a split inside the party that signed the old text. Getachew Reda, an adviser to Prime Minister Abiy Ahmed, said Debretsion was leaning on Eritrea and on Amhara militias in a bid to seize power. The accusation comes not from outside but from within the structure that represented the Tigrayan side of the agreement. When a settlement is drafted on the assumption of a single counterparty, that counterparty splitting in two is a case the text does not provide for.", "refs": ["tigray-sheraro"]}, {"tr": "Dışarıdan uygulanan araçlar da aynı boşluğa çarpıyor. Amerika Birleşik Devletleri haziranda TPLF içindeki sertlik yanlılarına vize kısıtlaması getirdi ve Büyükelçi Ervin Massinga anlaşmayı korumak için Mekelle'ye gitti. Hukuki statüsü hiçbir zaman sabitlenmemiş bir yapı içinde kimin sertlik yanlısı sayılacağını belirlemek, ancak o yapının bir muhatap olarak tanınmasıyla mümkün. Bölge analisti Faisal Roble güçlü bir uluslararası müdahale olmadan çok daha büyük bir savaşa gidilebileceği uyarısında bulundu.", "en": "Instruments applied from outside run into the same gap. The United States imposed visa restrictions on hardliners within the TPLF in June, and Ambassador Ervin Massinga travelled to Mekelle to preserve the agreement. Deciding who counts as a hardliner inside a structure whose legal status was never fixed is possible only by recognising that structure as a counterparty. The regional analyst Faisal Roble warned that without strong international intervention the situation could move towards a much larger war.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Benzemeyen yan", "en": "Where the resemblance breaks"}, "ps": [{"tr": "2020'yi hatırlatan bir sahne var, ama fay hattı aynı yerde değil. O savaşta çizgi Mekelle ile Addis Ababa arasından geçiyordu. Cumartesi tarif edilen hizalanmalar bu çizgiyi kesiyor: diyalog çağrısı yapan bir federal bakan, başbakana danışmanlık yapan eski bir TPLF ismi ve bir Tigray hizbinin son savaşın dışarıdaki ordusu Eritre'ye yaslandığı iddiası. İki blok varsayan bir emsal, burada açıklama gücünü yitiriyor; bu yüzden mesele savaşın yeniden başlayıp başlamayacağından çok, hukuki statüsü belirlenmemiş bir tarafla nasıl bir geçici yönetim kurulacağı.", "en": "There is a scene here that recalls 2020, but the fault line does not run in the same place. In that war the line lay between Mekelle and Addis Ababa. The alignments described on Saturday cut across it: a federal minister calling for dialogue, a former TPLF figure advising the prime minister, and the claim that a Tigrayan faction is leaning on Eritrea, the outside army of the last war. A precedent that assumes two blocs loses its explanatory power here; the question is therefore less whether the war resumes than what kind of interim administration can be built with a party whose legal standing was never fixed.", "refs": ["tigray-sheraro"]}]}], "sources": [{"key": "tigray-sheraro", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/fighting-breaks-out-in-western-tigray-as-ethiopia-and-tplf-trade-blame", "title": {"tr": "Batı Tigray'da çatışma çıktı, Addis Ababa ile TPLF birbirini suçluyor", "en": "Fighting erupts in western Tigray as Addis Ababa and the TPLF trade blame"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Şubat'ta tebliğ edildi, ağustosta duyuruldu", "en": "Served in February, made public in August"}, "excerpt": {"tr": "Celbin muhatabı sızdıran kişi değil, haberi yayımlayan gazeteci. Zorlayıcı gücü, sızıntıya ilişkin bir bulgudan değil, uyulmadığında devreye giren yaptırımdan geliyor; altı ay boyunca kamuya açılmamış olması da aracın nasıl çalıştığına dair ayrı bir bilgi.", "en": "The subpoena is addressed to the journalist who published, rather than to whoever leaked. Its compelling force comes from the sanction that follows non-compliance, not from any finding about the leak, and the six months it spent out of public view are separate information about how the instrument works."}, "sections": [{"h": {"tr": "Aracın kimliği", "en": "Identifying the instrument"}, "ps": [{"tr": "New York Times, 1 Ağustos'ta Adalet Bakanlığı'nın bağımsız muhabir Matthew Cole'a bir celp gönderdiğini açıkladı. Celp, şubat 2026'da FBI ajanları tarafından Cole'un New York'taki evinde tebliğ edilmiş ve Kuzey Kore'deki gizli bir askerî operasyona ilişkin haberinin kaynaklarını açıklaması istenmişti. Söz konusu araştırma eylül 2025'te Times'ın ulusal muhabiri Dave Philipps ile birlikte yayımlanmış, 2019'da Kuzey Kore kıyılarına elektronik dinleme donanımı yerleştirmeyi amaçlayan gizlilik dereceli bir Deniz Kuvvetleri SEAL görevini anlatmıştı.", "en": "On 1 August the New York Times disclosed that the Justice Department had sent a subpoena to the freelance reporter Matthew Cole. FBI agents delivered it at his New York home in February 2026, demanding that he identify the sources for his reporting on a secret military operation in North Korea. That investigation, published in September 2025 with the paper's national correspondent Dave Philipps, described a classified 2019 Navy SEAL mission to place electronic surveillance equipment on North Korean shores.", "refs": ["nyt-subpoena"]}, {"tr": "Celp, muhatabından ifade ya da belge talep eden zorlayıcı bir araçtır. Bir açıklamanın hukuka aykırı olduğunu saptamaz ve bir sanık göstermez; yalnızca elindeki bilgiyi vermesi istenen kişiye yönelir. Bu tercihin somut ölçüsü, olayda adı geçen hukukçularda görülüyor: Cole'u David A. O'Neill temsil ediyor, gazete tarafında baş hukuk müşaviri David McCraw ile avukat Douglas Zolkind yer alıyor. Uyulmama kararının bedelini üstlenecek taraf, kaynağı koruyan gazeteci ve onun arkasındaki yayın kurumudur.", "en": "A subpoena is a compulsory demand for testimony or material addressed to its recipient. It settles nothing about whether a disclosure was unlawful and identifies no defendant; it runs only to the person asked to hand over what he holds. The concrete measure of that choice is visible in the lawyers named: Cole is represented by David A. O'Neill, while the paper fields general counsel David McCraw and the lawyer Douglas Zolkind. Whoever decides not to comply carries the cost, and that is the journalist protecting a source together with the publisher behind him.", "refs": ["nyt-subpoena"]}]}, {"h": {"tr": "Altı ayın anlamı", "en": "What the six months mean"}, "ps": [{"tr": "Belge şubatta tebliğ edildi, gazete ise 1 Ağustos'ta duyurdu. Bu tür bir araç muhatabını tebliğ anından itibaren bağlar; aradaki süre, hiçbir kamusal itirazla karşılaşmadan işlediği dönemdir. Sürenin uzunluğu, aracın tasarımıyla tutarlı bir okuma sunuyor: zorlama muhatabın üzerinde çalışır, kamuoyuna açmak ise onu gönderenin değil, alanın tercihidir. Bunun daha sade bir açıklaması da mümkün: avukatların hazırlık ya da bakanlıkla yürütülen bir görüşme nedeniyle erken duyuruyu sakıncalı bulması. O hâlde altı ay, aracın niteliğinden çok gazetenin hukuk stratejisini anlatıyor olabilir.", "en": "The document was served in February and the paper made it public on 1 August. An instrument of this kind binds its recipient from the moment of service, so the interval is the stretch in which it operated without any public challenge. Its length reads consistently with the instrument's design: compulsion works on the recipient, and going public is the choice of the party receiving it rather than an obligation of the party issuing it. A plainer explanation is available too — counsel may have judged early disclosure unwise while preparing a response or talking to the department — in which case the six months describe the paper's legal strategy more than the instrument's character.", "refs": ["nyt-subpoena"]}, {"tr": "Bundan sonrasında izlenecek adım, bakanlığın uymaya zorlamak için mahkemeye başvurup başvurmadığıdır. Hiç zorlanmayan bir celp, sınırları hiç sınanmadan bir maliyet yükler; mahkemeye taşınan bir celp ise bu muhabirin ötesine geçen bir yorum üretir. Ölçülebilir eşik şu: 31 Ekim 2026'ya kadar dosyada uymaya zorlama ya da iptal talebi görünürse, soru gazetenin masasından çıkıp yargısal bir zemine taşınmış olur. Görünmezse talep, ne kadar ileri gidebileceği hiç test edilmemiş bir baskı olarak yerinde kalır.", "en": "The step to watch is whether the department goes to court to compel compliance. A subpoena that is never enforced imposes a cost while its limits stay untested; one taken before a judge produces an interpretation that reaches past this reporter. The measurable threshold is this: if a motion to compel or to quash appears on the docket by 31 October 2026, the question has moved off the newspaper's desk onto judicial ground. If none appears, the demand sits where it is, as pressure whose reach has never been tried.", "refs": ["nyt-subpoena"]}]}], "sources": [{"key": "nyt-subpoena", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/new-york-times-reveals-trump-administration-subpoena-over-north-korea-story", "title": {"tr": "New York Times, Adalet Bakanlığı'nın Kuzey Kore operasyonu haberi nedeniyle bir muhabire celp gönderdiğini açıkladı", "en": "The New York Times says the Justice Department subpoenaed a reporter over a North Korea operation"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Çerçeveyi kim kabul etti, nerede yazılı?", "en": "Who agreed to the perimeters, and where is that written?"}, "excerpt": {"tr": "Trump'ın paylaşımı, Washington'ın ne elde ettiğini söylediğini aktarıyor. Duyuru anlaşmanın iki unsurunu sayıyor; Tahran da İsrail de bu iki unsur hakkında sessiz kaldı. Elde bir mutabakat metni değil, tek taraflı bir özet var.", "en": "Trump's post conveys what Washington says it has obtained. The announcement names two elements of an agreement; both Tehran and Israel have stayed silent on those two elements. What exists is a one-sided summary rather than an agreed text."}, "sections": [{"h": {"tr": "Duyuruda ne var", "en": "What the announcement contains"}, "ps": [{"tr": "Trump, Truth Social'daki paylaşımında ABD'nin \"hedefi kilitlemiş ve hazır\" olduğunu, ardından İran'ın ve diğer Orta Doğu ülkelerinin kendisinden beklemesini istediğini yazdı ve saldırıyı \"hızla bir ANLAŞMAYA varılabilmesi şartıyla\" iptal ettiğini duyurdu. Anlaşmanın iki unsuru sayılıyor: Hürmüz Boğazı'nın tümüyle açılması ve İran'ın nükleer tehdidinin sona ermesi. Paylaşımda \"İsrail de bu taahhütte bana katılıyor\" deniyor; ancak İsrail hükümeti hemen kamuya açık bir açıklama yapmadı, Tahran'dan da resmî bir yanıt gelmedi. Al Jazeera, Axios'a dayanarak Suudi Veliaht Prensi Muhammed bin Selman'ın cumartesi günü telefonla iptali istediğini aktardı.", "en": "In his Truth Social post Trump wrote that the United States was \"locked and loaded\", then said Iran and other Middle Eastern countries had asked him to hold off, and announced that he had cancelled the attack \"subject to being able to rapidly make a DEAL\". Two elements of the agreement are named: the complete opening of the Strait of Hormuz and an end to Iran's nuclear threat. The post says \"The country of Israel joins me in this commitment\", yet the Israeli government issued no immediate public statement and no official response came from Tehran. Al Jazeera, citing Axios, reported that Saudi Crown Prince Mohammed bin Salman telephoned on Saturday to ask for the cancellation.", "refs": ["iran-cancel"]}, {"tr": "Temas, gündem, çerçeve ve imzalanmış taahhüt ayrı aşamalardır. Burada belgelenen şey temastır: beklemeye dönük bir talep ve bir telefon görüşmesi, ardından çerçevenin tek taraflı biçimde anlatılması. Metindeki kritik fiil \"istendi\": duyuru inisiyatifi karşı tarafa yükleyerek tavizi henüz konuşmamış olan tarafın hanesine yazıyor. Bir kefede gerçek bir eylem var; saldırı yapılmadı ve bunun gözlenebilir bir karşılığı var. Öbür kefede çerçeveyi imzalayan ikinci bir el yok.", "en": "Contact, agenda, framework and signed commitment are separate stages. What is documented here is contact: a request to hold off, a telephone call, and then a one-sided account of the framework. The decisive verb in the text is \"asked\" — the announcement assigns the initiative to the other side and thereby books the concession to a party that has not yet spoken. In one pan sits a real act: no strike took place, and that has an observable referent. In the other pan there is no second hand on the framework.", "refs": ["iran-cancel"]}]}, {"h": {"tr": "Kim onaylayacak, kim bozabilir", "en": "Who ratifies, who can spoil"}, "ps": [{"tr": "Çerçeveyi onaylaması gereken taraf tek bir aktör değil. Amir-Hussein Radjy ve Lee Keath imzalı haber, Paydari hareketinden Said Celili çevresindeki aşırı sertlik yanlılarının tam zafer istediğini, Cumhurbaşkanı Mesud Pezeşkiyan ile baş müzakereci konumundaki Meclis Başkanı Muhammed Bakır Kalibaf'ın ise askerî baskıyı pazarlık kozu saydığını aktarıyor. Aynı haberde nisan ateşkesinin Yüksek Ulusal Güvenlik Konseyi'nde 13 üyeden 12'sinin desteğiyle geçtiği, tek karşı oyun Celili'ye ait olduğu; devlet televizyonunun ise hem Pezeşkiyan'ın hem Kalibaf'ın müzakereleri anlattığı yayınları kestiği yazılı. Washington'dan duyurulan bir çerçevenin karşısında onay üretebilecek bir merci gerekir: 12'ye 1'lik oy bu kapasitenin var olduğunu, kesilen yayınlar ise kullanılmasının bedeli olduğunu gösteriyor. Tahran'ın sessizliği pekâlâ kasıtlı bir sıralama da olabilir; müzakere eden taraf metin oturmadan teyidi bekletir, o hâlde sessizlik anlaşmanın yokluğunun değil taktiğin işareti sayılır.", "en": "The party that must ratify the framework is not a single actor. A report by Amir-Hussein Radjy and Lee Keath describes ultra-hardliners around Saeed Jalili of the Paydari movement pressing for total victory, while President Masoud Pezeshkian and Parliament Speaker Mohammad Bagher Ghalibaf, who serves as chief negotiator, treat military pressure as bargaining leverage. The same report says the April ceasefire passed the Supreme National Security Council with 12 of 13 members in favour and Jalili casting the only vote against, and that state television interrupted broadcasts in which both Pezeshkian and Ghalibaf discussed negotiations. A framework announced from Washington needs a body on the other side capable of producing ratification: the 12-to-1 vote shows that capacity exists, and the interrupted broadcasts show what using it costs. Tehran's silence may equally be deliberate sequencing — a negotiating party withholds confirmation until the text has settled — in which case the silence marks tactics rather than the absence of an agreement.", "refs": ["iran-cancel", "iran-factions"]}, {"tr": "Aynı hafta sonu, on bir ülkedeki ABD büyükelçilikleri Amerikalılara ayrılmayı değerlendirmelerini ya da bir tırmanma hâlinde ayrılmaya hazır olmalarını bildirdi; uyarılar Bahreyn'den Birleşik Arap Emirlikleri'ne uzanıyor. Aynı pencerede çıkan iki resmî işlem birbirinden farklı yönleri gösteriyor: biri bir anlaşmayı anlatıyor, öteki o anlaşmanın tutmaması ihtimaline hazırlanıyor. Duyurulan çerçeve ile kurumların fiilen davrandığı varsayım arasındaki mesafe budur ve ölçülebilir. Eşik şu: 16 Ağustos 2026'ya kadar ne İran dışişlerinden ne İsrail başbakanlığından gelen resmî bir açıklama iki unsuru da adıyla teyit ederse, duyuru tek taraflı bir konum olarak kalır.", "en": "That same weekend, US embassies in eleven countries told Americans to consider departing or to be ready to depart should there be escalation, in alerts running from Bahrain to the United Arab Emirates. Two official acts issued in the same window point in different directions: one describes an agreement, the other prepares for its failure. That distance between an announced framework and the assumption institutions actually act on is the measurable quantity here. The threshold: if by 16 August 2026 no official statement from Iran's foreign ministry or Israel's prime minister's office confirms both named elements, the announcement stands as a one-sided position.", "refs": ["iran-cancel", "us-alerts"]}]}], "sources": [{"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}, {"key": "iran-factions", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/irans-leadership-vacuum-leaves-two-factions-battling-for-control-over-wars-aim/", "title": {"tr": "İran'da aşırı sertlik yanlıları ile müzakerecilerin savaşın amacı konusunda bölündüğü aktarıldı", "en": "Iran's ultra-hardliners and negotiators are described as split over the war's aim"}, "publishedDate": "2026-08-02"}, {"key": "us-alerts", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020047/us-govt-advises-americans-to-leave-mideast", "title": {"tr": "ABD büyükelçilikleri on bir Orta Doğu ülkesindeki Amerikalılara ülkeden ayrılmayı değerlendirmelerini bildirdi", "en": "US embassies tell Americans in eleven Middle Eastern countries to consider leaving"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "THAAD envanterinin yaklaşık yarısı çoktan ateşlendi", "en": "About half the THAAD inventory is already spent"}, "excerpt": {"tr": "Siyasi bir duyuru saldırıyı iptal edebilir. Bir önleyiciyi yerine koymak üretim hattı ister ve aktarılan oranlar doğruysa, iki hızdan yavaş olanı üretim tarafında.", "en": "A political announcement can cancel a strike. Replacing an interceptor takes a production line, and on the figures reported, that line is the slower of the two."}, "sections": [{"h": {"tr": "Sayılabilir olan", "en": "What can be counted"}, "ps": [{"tr": "Dawn'ın haberine göre ABD Avrupa Komutanlığı Komutanı Orgeneral Alexus Grynkewich, bölgedeki deniz unsurlarının gerildiğini Pentagon yetkililerine kapalı biçimde iletti. Aktarılan rakamlar şöyle: 200'den fazla THAAD önleyicisi ateşlendi, bu envanterin kabaca yarısı; bunların 100'den fazlası donanma gemilerinden fırlatıldı. Hassas Vuruş Füzeleri'nin yaklaşık yüzde 45'i, Patriot önleyicilerinin yaklaşık yarısı, Tomahawk seyir füzelerinin yaklaşık yüzde 30'u, Havadan Karaya Ortak Menzil Dışı Füzeler'in yüzde 20'den fazlası ve SM-3 ile SM-6 önleyicilerinin yaklaşık yüzde 20'si kullanıldı. Değerlendirme kapalı olarak niteleniyor; Pentagon bu oranları yayımlamadı ve rakamlar bağımsız olarak doğrulanamadı.", "en": "Dawn reported that General Alexus Grynkewich, commander of US European Command, privately told Pentagon officials that naval assets in the region are stretched. The figures given run as follows: more than 200 THAAD interceptors fired, roughly half the inventory, of which more than 100 were launched from navy ships. About 45 percent of Precision Strike Missiles, around half of Patriot interceptors, roughly 30 percent of Tomahawk cruise missiles, more than 20 percent of Joint Air-to-Surface Standoff Missiles and about 20 percent of SM-3 and SM-6 interceptors have been used. The assessment is characterised as private; the Pentagon has not published these ratios and they could not be independently verified.", "refs": ["interceptors"]}, {"tr": "Kabiliyet niyetten daha dürüsttür, ama yalnızca doğru sayıldığında. Listedeki kalemler iki farklı şeyi anlatıyor. THAAD ve Patriot savunma önleyicileridir; tüketim hızını karşı tarafın fırlatma temposu belirler. Tomahawk, Hassas Vuruş Füzesi ve Menzil Dışı Füze ise taarruz mühimmatıdır; onları harcayan kendi kararlarındır. Birinci küme stok sahibinin denetiminde değil. Bildirilen kısıtın taarruz seçeneklerine değil füze savunmasına oturmasının nedeni bu asimetri. Oranların hangi paydaya göre verildiği ise belirsiz: yüzdeler küresel envanteri mi yoksa yalnızca bu harekât alanına tahsis edilen payı mı anlatıyor, haber bunu söylemiyor. Önceden konuşlandırılmış stoklar ya da müttefik envanterleri aritmetiği değiştirebilir.", "en": "Capability is more honest than intent, but only when it is counted correctly. The items on the list describe two different things. THAAD and Patriot are defensive interceptors whose consumption rate is set by the adversary's launch tempo. Tomahawk, the Precision Strike Missile and the standoff missile are offensive rounds, spent by one's own decisions. The first group is not under the holder's control, and that asymmetry is why the reported constraint lands on missile defence rather than on strike options. Which denominator the ratios use is left open: the report does not say whether the percentages describe global inventory or only the share allocated to this theatre. Pre-positioned stocks or allied inventories could change the arithmetic.", "refs": ["interceptors"]}]}, {"h": {"tr": "Seçimin biçimi", "en": "The shape of the choice"}, "ps": [{"tr": "Aktarılan formülasyon neyin önce tükendiği konusunda kesin: bölgeye bir muhrip daha görevlendirilmezse komutanların \"eninde sonunda Amerikan güçlerini korumakla İsrail için füze savunma harekâtını sürdürmek arasında zor bir seçimle karşılaşabileceği\" aktarılıyor. Bu, kabiliyetten çok idameye dair bir ifade; sistemler duruyor, soru kaç angajman boyunca destekleyebilecekleri. Gelişmiş önleyicilerin üretilebildiğinden hızlı tüketilmesi, bir savunma taahhüdünü tayınlama sorununa çevirir; taahhüdün inandırıcılığı o noktadan sonra beyanlara değil üretim hattına bağlanır. Bunun karşı okuması da açık: karşı tarafın fırlatma temposu kendi nedenleriyle düşerse, üretimde hiçbir şey değişmeden kısıt gevşer.", "en": "The formulation quoted is precise about what runs out first: without another destroyer assigned to the region, commanders \"could eventually face a difficult choice between protecting American forces and continuing missile-defence operations for Israel\". That is a statement about sustainment rather than capability; the systems are there, and the question is how many engagements they can support. Advanced interceptors consumed faster than they can be built turn a defensive commitment into a rationing problem, and from that point the commitment's credibility rests on a production line rather than on declarations. The counter-reading is equally plain: if the adversary's launch tempo falls for reasons of its own, the constraint eases with nothing changing in production.", "refs": ["interceptors"]}, {"tr": "Bu hafta sonu duyurulan iptal bu tabloyu çözmüyor. Ölçülebilir eşik şu: 30 Eylül 2026'ya kadar bölgeye ek bir ABD donanma muhribi kamuya açık biçimde görevlendirilirse, anlatılan ödünleşim çözülmemiş ama ertelenmiş olur; işaret, Savunma Bakanlığı'nın konuşlanma duyurusunda adı geçen ilave bir muhriptir. Güçten gelen itidal ile derinliği azalmış bir stoktan gelen itidal dışarıdan aynı görünür. İkisini ayıran tek büyüklük yeniden doldurma hızıdır ve o rakam kamuya açık değil.", "en": "The cancellation announced this weekend does not resolve any of this. The measurable threshold: if an additional US Navy destroyer is publicly assigned to the region by 30 September 2026, the trade-off described is deferred rather than solved, and the signal is a named additional destroyer in a Defense Department deployment announcement. Restraint that comes from strength and restraint that comes from a thinning magazine look identical from outside. The one quantity that separates them is the replacement rate, and that figure is not public.", "refs": ["interceptors", "iran-cancel"]}]}], "sources": [{"key": "interceptors", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020037/us-may-not-have-enough-forces-to-defend-israel-against-iran", "title": {"tr": "Habere göre ABD'nin THAAD önleyici füze stokunun yaklaşık yarısı harcandı", "en": "Report says about half the US THAAD interceptor inventory has been fired"}, "publishedDate": "2026-08-02"}, {"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Sigortacı, duyurudan önce ihbarı okur", "en": "The underwriter reads the advisory before the announcement"}, "excerpt": {"tr": "Boğazın tümüyle açılacağı duyurulmadan bir gün önce, aynı boğazın ağzında iki tekne vuruldu. Geçişi belirleyen büyüklük, kaptanların ve sigortacıların bu iki ihbarı nasıl fiyatladığıdır.", "en": "A day before the strait was announced as due to open completely, two hulls were struck at its mouth. The quantity that governs passage is how masters and underwriters price those two advisories."}, "sections": [{"h": {"tr": "İki ihbar, üç saat", "en": "Two advisories, three hours"}, "ps": [{"tr": "İngiltere Deniz Ticareti Operasyonları birimi UKMTO, 1 Ağustos'ta iki olay bildirdi. Umman'ın Musandam yarımadasındaki Lima açıklarının kuzeydoğusunda bir tanker kimliği belirsiz bir mermiyle vuruldu; makine dairesi hasar gördü, gemi manevra kabiliyetini yitirdi, yaralanma olmadı. Yaklaşık üç saat sonra Hasab'ın kuzeydoğusunda ikinci bir tankerin kaptanı, gemisinin çok yakınında büyük bir su sıçraması ve patlama gördüğünü bildirdi; o aşamada hasar aktarılmadı. Hiçbir grup olayları üstlenmedi. Boğazdan deniz yoluyla taşınan petrolün yaklaşık dörtte biri geçiyor.", "en": "The UK Maritime Trade Operations body, UKMTO, reported two incidents on 1 August. Northeast of Lima on Oman's Musandam peninsula a tanker was struck by an unknown projectile; its engine room was damaged, the vessel lost the ability to manoeuvre, and there were no injuries. About three hours later, northeast of Khasab, the master of a second tanker reported a large splash and an explosion very close to his ship, with no damage reported at that stage. No group claimed either incident. About a quarter of seaborne oil trade passes through the strait.", "refs": ["hormuz-tankers"]}, {"tr": "Lima ile Hasab aynı yarımadanın üzerinde, yani boğazın dış yaklaşma sularında; iki ihbarın arası üç saat. Bir darboğazda işleyen değişken, rotanın kullanılma maliyetidir. Makine dairesinden yara alan bir geminin rotanın en dar suyunda manevra kabiliyetini yitirmesi, kurtarma, refakat ve savaş riski primini besleyen türden bir olaydır. Bir darboğaz şokunu genellikle rota değişikliği emer; buradaki kaynak ise tek bir büyüklük veriyor, boğazın deniz yoluyla taşınan petroldeki yaklaşık dörtte birlik payı, ve başka hiçbir yerde yedek kapasite için rakam
