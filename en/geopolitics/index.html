: "Durduran taraf Tahran değildi"}, "ps": [{"en": "By Trump's own account the request to drop the strike came from Saudi Arabia, the United Arab Emirates and Qatar, and Crown Prince Mohammed bin Salman warned of unintended consequences. The plainest conclusion is that the US decision to halt the strike protected those three countries from the second-order effects of an attack rather than buying any change in Iranian behaviour. Another reading is available: talks on the Oman channel over a new route through the strait are described as near completion, and the request from the three capitals may be the presentable face of a concession made in Tehran.", "refs": ["iran-talks"], "tr": "Kendi anlatımına göre Trump'a vazgeçme talebi Suudi Arabistan, Birleşik Arap Emirlikleri ve Katar'dan geldi; Veliaht Prens Muhammed bin Selman istenmeyen sonuçlara karşı uyardı. Buradan çıkan en yalın sonuç, ABD'nin saldırıyı durdurmasının bu üç devleti bir saldırının ikinci halka etkilerinden koruduğu, İran'ın davranışında bir değişiklik satın almadığıdır. Başka bir okuma da mümkün: Umman kanalında boğazdan geçecek yeni bir güzergâh üzerindeki görüşmeler sona yaklaşıyor; üç başkentin talebi, Tahran'ın verdiği bir tavizin sunulabilir yüzü olabilir."}, {"en": "The oil move measures expectation, not posture. Brent fell $4.08 to $83.85 and WTI fell $4.01 to $80.66. Prices dropped because a strike did not happen. They show no change in the status of the strait; since the war began on 28 February, Iran has tightened its control of the waterway and an earlier ceasefire that included reopening it did not hold.", "refs": ["iran-talks"], "tr": "Petrolün hareketi bir beklenti ölçüsüdür, duruş ölçüsü değil. Brent 4,08 dolar düşerek 83,85 dolar düzeyine, WTI 4,01 dolar düşerek 80,66 dolar düzeyine indi. Fiyat, bir saldırı olmadığı için geriledi. Boğazın statüsünde bir değişiklik olduğunu göstermiyor; savaşın 28 Şubat'ta başlamasından bu yana İran suyolu üzerindeki denetimini sıkılaştırdı ve boğazın yeniden açılmasını içeren önceki ateşkes yürümedi."}]}, {"h": {"en": "Monday's narrow test", "tr": "Pazartesinin dar sınavı"}, "ps": [{"en": "The test on Monday afternoon should therefore be kept narrow. Iranian foreign ministry spokesperson Esmaeil Baghaei said the talks with Oman concern a new route and are separate from the question of the strait being opened or closed. The measurable outcome is whether a text appears that sets out the route's coordinates, who operates it and the date it opens. If no such text emerges by the end of August, the attack that was called off remains a deferred option rather than a negotiating gain.", "refs": ["iran-talks"], "tr": "Bu yüzden pazartesi öğleden sonrasının sınavı dar tutulmalı. İran Dışişleri sözcüsü İsmail Bakai, Umman'la yürütülen görüşmelerin boğazın açılması ya da kapatılması tartışmasından ayrı, yeni bir güzergâh üzerinde olduğunu söyledi. Ölçülebilir sonuç, güzergâhın koordinatlarını, kimin işleteceğini ve hangi tarihte açılacağını yazan bir metnin ortaya çıkıp çıkmadığıdır. Ağustos sonuna kadar böyle bir metin görünmezse, geri alınan saldırı bir müzakere kazanımı değil, ertelenmiş bir seçenek olarak kalır."}]}], "sources": [{"key": "iran-talks", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-says-new-round-of-iran-talks-will-begin-monday", "title": {"tr": "Trump, İran'la müzakerelerin pazartesi öğleden sonra başlayacağını söyledi", "en": "Trump says talks with Iran will open on Monday afternoon"}, "publishedDate": "2026-08-02"}], "title": {"en": "Calling off an attack is not the same as imposing a cost", "tr": "Bir saldırının geri alınması bir bedel değildir"}, "writer": "geo-03", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The Federal Register notice of 3 August adds 43 entities to the forced-labour list. Four of them go onto the sub-list for entities that move workers, and forty-one onto the sub-list for facilities sourcing inputs from Xinjiang. The point where the instrument bites shifts from the factory to the customs entry.", "tr": "Federal Register'ın 3 Ağustos tarihli bildirimi, zorla çalıştırma listesine 43 kuruluş ekliyor. Bunların dördü işçi taşıyan kuruluşları, kırk biri Sincan'dan girdi temin eden tesisleri kapsayan alt listeye giriyor. Aracın değdiği yer fabrikadan gümrük beyanına kayıyor."}, "sections": [{"h": {"en": "Which part of the list they were written onto", "tr": "Listenin hangi bölümüne yazıldılar"}, "ps": [{"en": "The notice (Volume 91, Number 147, pages 48913-48920) writes four entities onto the section 2(d)(2)(B)(ii) sub-list, which identifies entities working with the government of the Xinjiang Uyghur Autonomous Region to recruit, transport or receive workers. Forty-one go onto the section 2(d)(2)(B)(v) sub-list, which covers facilities sourcing inputs from Xinjiang, or from persons working with the Xinjiang government or the Xinjiang Production and Construction Corps under the poverty alleviation and pairing-assistance schemes. Two entities appear on both sub-lists, and two existing entries are technically corrected.", "refs": ["uflpa-notice"], "tr": "Bildirim (Cilt 91, Sayı 147, sayfa 48913-48920) dört kuruluşu, Sincan Uygur Özerk Bölgesi yönetimiyle çalışarak işçi toplayan, taşıyan ya da devralan kuruluşları tanımlayan 2(d)(2)(B)(ii) alt listesine yazıyor. Kırk bir kuruluş ise Sincan'dan ya da Sincan yönetimiyle veya Sincan Üretim ve İnşaat Kolordusu ile çalışan kişilerden yoksullukla mücadele ve eşleştirilmiş yardım programları kapsamında girdi temin eden tesisleri kapsayan 2(d)(2)(B)(v) alt listesine giriyor. İki kuruluş her iki alt listede birden yer alıyor; ayrıca listedeki mevcut iki girişte teknik düzeltme yapılıyor."}, {"en": "The ratio is the real information in this round. Forty-one of the forty-five placements were made in the section that looks at where an input came from rather than where labour was used. What is covered stops being a workforce and becomes a material, and a material is defined not at the factory but several tiers up the supply chain.", "refs": ["uflpa-notice"], "tr": "Oran bu turun asıl bilgisidir. Kırk beş yerleştirmenin kırk biri, işçinin nerede çalıştırıldığına değil, girdinin nereden geldiğine bakan bölüme yapılmış. Kapsanan şey bir işgücü olmaktan çıkıp bir malzeme hâline geliyor; malzeme ise fabrikada değil, tedarik zincirinin birkaç kat yukarısında tanımlanıyor."}]}, {"h": {"en": "The point of payment is the customs entry", "tr": "Ödemenin yapıldığı nokta gümrük beyanı"}, "ps": [{"en": "Under section 3(a) of the act and 19 U.S.C. 1307, since 21 June 2022 the Commissioner of Customs and Border Protection presumes that goods mined, produced or manufactured by listed entities are made with forced labour and bars them from entry. The burden of rebutting that presumption sits with the importer. The point of enforcement therefore moves from the facility in China to the declaration at the US border, and the party that must produce documents becomes the company buying the goods rather than the listed supplier.", "refs": ["uflpa-notice"], "tr": "Yasanın 3(a) maddesi ve 19 U.S.C. 1307 uyarınca, 21 Haziran 2022'den bu yana Gümrük ve Sınır Koruma Komiserliği listedeki kuruluşların çıkardığı, ürettiği ya da imal ettiği malların zorla çalıştırmayla üretildiğini varsayıyor ve girişini yasaklıyor. Varsayımın aksini kanıtlama yükü ithalatçıda. Uygulama noktası bu nedenle Çin'deki tesis yerine ABD sınırındaki beyan oluyor. Belgeyi üretmesi gereken taraf da listelenen tedarikçi yerine malı satın alan şirket."}, {"en": "Because the burden sits with the buyer and the new placements were made upstream, the cost of this round shows up as traceability rather than volume: a firm can change supplier, but it must be able to document the change several tiers up. There is an alternative: for large importers that have run supplier audits for years, the marginal cost of the additions may be close to zero, in which case the effect concentrates not on trade totals but on small importers who cannot see the upper tiers of the chain.", "refs": ["uflpa-notice"], "tr": "Yük alıcıda olduğu ve yeni yerleştirmeler zincirin yukarısına yapıldığı için bu turun maliyeti hacimden çok izlenebilirlikte ortaya çıkıyor: bir firma tedarikçi değiştirebilir, ama değiştirdiğini birkaç kat yukarıya kadar belgeleyebilmek zorunda. Bunun bir alternatifi var: uzun süredir tedarikçi denetimi yürüten büyük ithalatçılar için ek yerleştirmelerin getirdiği ek maliyet sıfıra yakın olabilir; o durumda etki ticaret hacminde değil, zincirin üst katlarını göremeyen küçük ithalatçılarda yoğunlaşır."}]}, {"h": {"en": "Where this addition will be measured", "tr": "Bu ekin ölçüleceği yer"}, "ps": [{"en": "The task force that manages the list was established by section 741 of the United States-Mexico-Canada Agreement Implementation Act; the Department of Homeland Security chairs it, with the Office of the US Trade Representative and the Departments of Labor, State, Justice, the Treasury and Commerce as members. That two entries were technically corrected in this same notice shows where removal and correction become visible. The measure is this: will the next notice published before the end of the year carry only additions, or removals as well? If it carries only additions, the instrument is operating as a one-way list rather than as a compliance gate.", "refs": ["uflpa-notice"], "tr": "Listeyi yöneten görev gücü, ABD-Meksika-Kanada Anlaşması Uygulama Yasası'nın 741. maddesiyle kuruldu; başkanlığını İç Güvenlik Bakanlığı yürütüyor, Ticaret Temsilciliği ile Çalışma, Dışişleri, Adalet, Hazine ve Ticaret bakanlıkları üye. Aynı bildirimde iki girişin teknik olarak düzeltilmiş olması, listeden çıkışın ve düzeltmenin görünür yolu olduğunu gösteriyor. Ölçü şu: yıl sonuna kadar yayımlanacak bir sonraki bildirim yalnızca ekleme mi taşıyacak, yoksa çıkarma da mı? Yalnızca ekleme taşırsa, araç bir uyum kapısı yerine tek yönlü bir liste olarak işliyor demektir."}]}], "sources": [{"key": "uflpa-notice", "kind": "news", "name": "Federal Register", "url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15628.txt", "title": {"tr": "Zorla çalıştırma listesine 43 şirket eklendi, 41'i tedarik alt listesine girdi", "en": "Forty-three firms join the forced-labour list, 41 of them on the sourcing sub-list"}, "publishedDate": "2026-08-03"}], "title": {"en": "Forty-one of the forty-three entities were written onto the sourcing sub-list", "tr": "Kırk üç kuruluşun kırk biri tedarik alt listesine yazıldı"}, "writer": "geo-04", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "At the convention in Sao Paulo the names listed over rare earths were China, the United States and France. A state that names one rival is picking a side; a state that names all of them is keeping its options open. In a possible runoff in October the gap is five points.", "tr": "Sao Paulo'daki kurultayda ender toprak elementleri için sıralanan isimler Çin, ABD ve Fransa'ydı. Tek bir rakip anan devlet taraf seçer; hepsini anan devlet seçeneklerini açık tutar. Ekimdeki ikinci turda aradaki fark beş puan."}, "sections": [{"h": {"en": "The list that came out of the convention hall", "tr": "Kurultay salonundan çıkan liste"}, "ps": [{"en": "Luiz Inacio Lula da Silva told the Workers' Party convention in Sao Paulo that he was running for the presidency for a seventh time and that a win in October would be his last term. The weight of the speech lay not on his domestic record but on two demands: higher defence spending, and keeping rare earths and other critical minerals out of foreign control. China, the United States and France, he said, would not reach those resources without respecting the country's sovereignty.", "refs": ["lula-campaign"], "tr": "Luiz Inacio Lula da Silva, İşçi Partisi'nin Sao Paulo'daki kurultayında yedinci kez başkanlığa aday olduğunu açıkladı ve ekim seçimini kazanırsa bunun son dönemi olacağını söyledi. Konuşmasının ağırlığı iç siyaset sicilinde değil, savunma harcamalarının artırılması ile ender toprak elementleri ve diğer kritik minerallerin yabancı denetimine geçmemesi taleplerindeydi. Çin'in, ABD'nin ve Fransa'nın bu kaynaklara ülkenin egemenliğine saygı göstermeden erişemeyeceğini söyledi."}, {"en": "The number of capitals named says more than the sentence does. A state that intends to sell access to one bloc sets a single rival against itself. A state that names all three has priced the resource for no one yet and has kept the order of play in its own hands. What Brazil is doing here amounts to attaching the moment of choice to its own calendar rather than declining to choose.", "refs": ["lula-campaign"], "tr": "Anılan başkentlerin sayısı, cümlenin kendisinden daha çok şey söylüyor. Erişimi bir bloka satmayı düşünen bir devlet karşısına bir rakip koyar. Üçünü birden sayan devlet ise kaynağı henüz kimseye fiyatlamamış, sırayı kendinde tutmuş oluyor. Brezilya'nın burada yaptığı şey taraf seçmemek sayılmaz; yaptığı, seçme anını kendi takvimine bağlamak."}]}, {"h": {"en": "The work the same sentence does at home", "tr": "Aynı cümlenin içeride gördüğü iş"}, "ps": [{"en": "The sentence also has an audience at home. The United States imposed two rounds of tariffs on Brazilian goods in July, and the Brazilian government rejected the unfair-trade grounds. Lula's main challenger is Senator Flavio Bolsonaro, 45, who became the right's leading candidate after his father was convicted of plotting to overturn the 2022 election result. Datafolha puts Lula ahead 48 percent to 43 in a possible runoff. Leonardo Paz, a political scientist at the Getulio Vargas Foundation, told AFP that the sovereignty message lets the president name an adversary outside the country.", "refs": ["lula-campaign"], "tr": "Bu cümlenin bir de iç muhatabı var. ABD temmuzda Brezilya mallarına iki tur gümrük vergisi uyguladı ve Brezilya hükümeti haksız ticaret gerekçesini reddetti. Lula'nın başlıca rakibi, babası 2022 seçim sonucunu bozmayı planlamaktan hüküm giydikten sonra sağın önde gelen adayı hâline gelen 45 yaşındaki Senatör Flavio Bolsonaro. Datafolha, olası ikinci turda Lula'yı yüzde 48'e 43 önde gösteriyor. Getulio Vargas Vakfı'ndan siyaset bilimci Leonardo Paz, AFP'ye egemenlik söyleminin başkana dışarıda bir hasım tarif etme olanağı verdiğini söyledi."}, {"en": "At a five-point margin most of the load this message carries belongs to domestic politics: it converts external pressure into a question on the ballot. Another reading is available. The position on critical minerals may reflect an industrial-policy choice that predates the tariffs, in which case the campaign is describing a policy rather than carrying it. What will separate the two is whether the position survives past October.", "refs": ["lula-campaign"], "tr": "Beş puanlık bir farkta bu söylemin taşıdığı yükün büyük bölümü iç siyasete ait: dışarıdan gelen bir baskıyı sandık sorusuna çeviriyor. Başka bir okuma da var. Kritik mineraller üzerindeki tutum, gümrük vergilerinden önce başlamış bir sanayi politikası tercihini yansıtıyor olabilir; o zaman kampanya politikayı taşımıyor, politikayı anlatıyordur. İkisini ayıracak olan, tutumun ekimden sonra da sürüp sürmediği."}]}, {"h": {"en": "The measurable part of the promise", "tr": "Vaadin ölçülebilir kısmı"}, "ps": [{"en": "For now there is a demand rather than a commitment. A call for higher defence spending is not a budget line, and a promise to protect minerals is not a licence condition. For it to become measurable, one of three things has to appear: an export restriction, a condition added to mining licences, or money set aside in the defence budget. Meanwhile the government's weak points remain where they were; rising living costs, the public deficit and crime are the areas the sovereignty message does not cover.", "refs": ["lula-campaign"], "tr": "Şimdilik ortada bir taahhüt yerine bir talep var. Savunma harcamalarının artırılması çağrısı bir bütçe kalemi anlamına gelmiyor, minerallerin korunacağı söz de bir ruhsat koşulu sayılmıyor. Ölçülebilir hâle gelmesi için üçünden birinin görünmesi gerekiyor: bir ihracat kısıtı, madencilik ruhsatlarına eklenen bir şart ya da savunma bütçesinde ayrılmış bir kaynak. Bu arada hükümetin zayıf başlıkları yerinde duruyor; artan yaşam maliyeti, kamu açığı ve suç, egemenlik söyleminin kapatmadığı alanlar."}]}], "sources": [{"key": "lula-campaign", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/brazils-lula-launches-fourth-term-bid-focuses-on-national-sovereignty", "title": {"tr": "Lula, dördüncü dönem adaylığını egemenlik vurgusuyla açıkladı", "en": "Lula launches a fourth-term bid built on sovereignty"}, "publishedDate": "2026-08-02"}], "title": {"en": "Lula named three capitals at once", "tr": "Lula üç başkenti birden saydı"}, "writer": "geo-05", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "At the centre of two months of protest in Rawalakot lies not a list of demands but an arrangement said never to have been carried out. Bargains between a centre and a periphery usually survive not on the signature but on the mechanism that follows it.", "tr": "Rawalakot'ta iki aydır süren gösterilerin merkezinde bir talep listesi değil, uygulanmadığı söylenen bir düzenleme var. Merkez ile çevre arasındaki pazarlıklar çoğu zaman imzayla değil, imzanın izlendiği mekanizmayla ayakta kalır."}, "sections": [{"h": {"en": "What happened after the signature", "tr": "İmzadan sonra ne oldu"}, "ps": [{"en": "The BBC said it was the first news organisation to enter Rawalakot in Pakistan-administered Kashmir. In a region of about 4.5 million people, dozens have been killed in clashes over two months; a doctor whose name was changed said he had treated 50 to 60 critically injured people since 27 July, 15 to 20 of them with gunshot wounds. The Joint Awami Action Committee's demands gather under affordable flour, electricity and basic rights, and the committee says an arrangement signed with the Pakistani and regional governments in October has not been carried out. The regional government rejects that.", "refs": ["rawalakot"], "tr": "BBC, Pakistan yönetimindeki Keşmir'in Rawalakot kentine giren ilk haber kuruluşu olduğunu bildirdi. Yaklaşık 4,5 milyon nüfuslu bölgede iki ayda onlarca kişi çatışmalarda öldü; adı değiştirilen bir hekim 27 Temmuz'dan bu yana 50 ila 60 ağır yaralıya baktığını, bunların 15 ila 20'sinin ateşli silah yarası taşıdığını söyledi. Ortak Awami Eylem Komitesi'nin talepleri ucuz un, elektrik ve temel haklar başlıklarında toplanıyor; komite, ekim ayında Pakistan ve bölge hükümetleriyle imzalanan düzenlemenin uygulanmadığını savunuyor, bölge hükümeti bunu reddediyor."}, {"en": "Arrangements signed between a centre and a periphery rest not on the paper but on the machinery built after it: who sets the price, which budget line the money comes from, who inspects delivery. When those three are not written down, a signature becomes a date rather than an institution. Ten months on, the argument in Rawalakot turns on whether the arrangement was carried out at all rather than on what it contained.", "refs": ["rawalakot"], "tr": "Bir merkez ile bir çevre arasında imzalanan düzenlemeler kâğıttan çok, kâğıdın ardından kurulan mekanizmaya dayanır: fiyatı kimin belirlediği, bütçenin hangi kalemden çıktığı, uygulamayı kimin denetlediği. Bu üçü yazılmadığında imza bir tarih olur, bir kurum olmaz. Rawalakot'ta on ay sonra tartışılan şey de düzenlemenin içeriği değil, uygulanıp uygulanmadığı."}]}, {"h": {"en": "Why now", "tr": "Neden şimdi"}, "ps": [{"en": "The nearest factor explaining the timing is that local elections are under way in the region. An election reopens an uncarried arrangement for bargaining, because the ballot is one of the few calendars on which a periphery can reach a centre. The alternative explanation is also available: the regional government says the committee is armed and set on disrupting the polls, and the committee was banned in June and labelled a foreign-funded terrorist organisation, which it rejects. On that reading the election is a target rather than an opportunity. What will separate the two is whether the protests continue after the polls close.", "refs": ["rawalakot"], "tr": "Zamanlamayı açıklayan en yakın etken, bölgede yerel seçimlerin sürüyor olması. Bir seçim, uygulanmamış bir düzenlemeyi yeniden pazarlık konusu hâline getirir; çünkü sandık, çevrenin merkeze ulaşabildiği ender takvimlerden biridir. Alternatif açıklama da elde: bölge hükümeti komitenin silahlı olduğunu ve seçimleri aksatmayı amaçladığını söylüyor, komite haziranda yasaklandı ve dışarıdan finanse edilen bir terör örgütü olarak nitelendi; bu okumada seçim bir fırsat sayılmaz, bir hedeftir. İki açıklamayı ayıracak olan, gösterilerin sandık kapandıktan sonra sürüp sürmediği."}, {"en": "It should also be said where the comparison breaks. The classic course of an uncarried centre-periphery bargain is that the parties keep treating each other as counterparts. Here that recognition looks suspended: the committee is banned, roads are blocked, shops are shuttered and the entry of food is itself disputed. The regional government rejects allegations that security forces fired indiscriminately on peaceful protesters and says it is not preventing food or medical supplies from entering; the BBC said it saw no weapons at the protests it attended and that the source of gunfire heard overnight was unclear. In a bargain where the counterpart has been legally removed, there is no route left by which an uncarried text can be carried out.", "refs": ["rawalakot"], "tr": "Benzetmenin bir yerde kırıldığını da söylemek gerekiyor. Uygulanmamış bir merkez-çevre pazarlığının klasik seyri, tarafların birbirini muhatap saymayı sürdürmesidir. Burada muhataplık askıya alınmış görünüyor: komite yasaklı, yollar kapalı, dükkânlar kepenkli, gıda girişi tartışma konusu. Bölge hükümeti güvenlik güçlerinin barışçıl göstericilere gelişigüzel ateş açtığı iddialarını reddediyor ve gıda ile tıbbi malzeme girişini engellemediğini bildiriyor; BBC katıldığı gösterilerde silah görmediğini, gece duyulan silah seslerinin kaynağının belirsiz kaldığını aktarıyor. Muhatabın hukuken ortadan kalktığı bir pazarlıkta, uygulanmamış bir metnin uygulanması için bir yol kalmaz."}]}, {"h": {"en": "What follows", "tr": "Bundan sonrası"}, "ps": [{"en": "What is worth watching is therefore not the death toll but whether recognition returns. Umar Nazir of the committee's core body says they are willing to talk, while more protests are planned. If the ban is not lifted or a named channel for talks is not opened before the end of the year, October's arrangement will remain an uncarried text and the argument will pass to the next electoral calendar. Paper does not age; what ages is the absence of an institution to carry it.", "refs": ["rawalakot"], "tr": "Bu yüzden izlenecek şey ölü sayısı yerine muhataplığın geri gelip gelmediği olmalı. Komitenin çekirdek kadrosundan Umar Nazir görüşmeye açık olduklarını söylüyor, ama yeni gösteriler planlanıyor. Yıl sonuna kadar yasak kaldırılmaz ya da adı konmuş bir görüşme kanalı açılmazsa, ekimdeki düzenleme uygulanmamış bir metin olarak kalacak ve tartışma bir sonraki seçim takvimine devredilecek. Kâğıt eskimez; eskiyen, onu uygulayacak kurumun yokluğudur."}]}], "sources": [{"key": "rawalakot", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c5yvqk69enko", "title": {"tr": "BBC, Pakistan yönetimindeki Keşmir'de gösterilerin merkezine ulaşan ilk haber kuruluşu oldu", "en": "The BBC becomes the first news organisation to reach the centre of the Kashmir protests"}, "publishedDate": "2026-08-03"}], "title": {"en": "A text signed in October is being tested in the street in August", "tr": "Ekimde imzalanan metin, ağustosta sokakta sınanıyor"}, "writer": "geo-06", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Washington announces a negotiating date while Tehran says on the same day that no such process exists. The only live channel is the one with Oman, and it covers a route rather than the opening of the strait.", "tr": "Washington bir müzakere takvimi duyururken Tahran aynı gün böyle bir sürecin bulunmadığını söylüyor. Yürürlükte olan tek kanal, Umman'la görüşülen ve boğazın açılıp kapanmasını değil bir güzergâhı konu alan metin."}, "sections": [{"h": {"en": "Two accounts, one live channel", "tr": "İki anlatım, tek yürürlükteki kanal"}, "ps": [{"en": "Iran's foreign ministry spokesperson Esmail Baghaei said on Monday that Tehran was not holding talks with the United States at that moment. The same live page carried Trump saying an agreement was imminent and that negotiations would open on Monday, alongside Tehran's call for the memorandum of understanding signed on 17 June to be honoured. The two accounts have not been reconciled, and the gap between them is not a matter of tone: one announces a schedule, the other announces its absence.", "refs": ["iran-live"], "tr": "İran Dışişleri sözcüsü İsmail Bakai pazartesi günü Tahran'ın ABD ile o an için görüşme yürütmediğini söyledi. Aynı canlı yayın sayfası, Trump'ın anlaşmanın yakın olduğunu ve müzakerelerin pazartesi başlayacağını belirttiğini ve Tahran'ın 17 Haziran'da imzalanan mutabakat metnine uyulması çağrısını aktardı. İki anlatım birbiriyle uzlaştırılmış değil ve aralarındaki fark bir üslup farkı da değil: biri bir takvim, diğeri bir yokluk bildiriyor."}, {"en": "The channel the spokesperson does describe sits somewhere else. The talks with Oman cover a new route through the Strait of Hormuz with separate entry and exit lanes; Foreign Minister Abbas Araghchi said they were on the way to being finalised, and officials pointed to a third line distinct from the existing northern and southern corridors. What is approaching completion is a navigation arrangement, not an instrument that decides whether the strait is open. The opposite reading is available too: Muscat may also be the venue for indirect contact that is not announced, in which case the two accounts describe one process at different levels of publicity.", "refs": ["iran-live", "hormuz-route"], "tr": "Sözcünün tarif ettiği kanal ise başka bir yerde duruyor. Umman'la yürütülen görüşmeler Hürmüz Boğazı'nda giriş ve çıkış şeritleri bulunan yeni bir güzergâhı konu alıyor; Dışişleri Bakanı Abbas Arakçi bu görüşmelerin sonuçlandırılma yolunda olduğunu söyledi ve yetkililer mevcut kuzey ile güney koridorlarından farklı üçüncü bir hattan söz etti. Tamamlanmaya yaklaşan şey bir seyir düzenlemesi; boğazın açık olup olmayacağına karar veren bir araç değil. Bunun tersi de mümkün: Maskat, kamuoyuna açıklanmayan dolaylı temasın da mekânı olabilir, o durumda iki anlatım tek sürecin farklı görünürlük düzeylerini tarif ediyor olur."}]}, {"h": {"en": "What a demand needs before it binds", "tr": "Bir talebin bağlayıcı olması için gerekenler"}, "ps": [{"en": "Trump's condition describes an outcome: any agreement must include the immediate and complete opening of the strait. President Masoud Pezeshkian called that same memorandum the cornerstone of Tehran's future foreign policy. For an arrangement built on a text that one side treats as a foundation and the other as a condition, the operative question is who certifies that passage has taken place, and what follows if nobody can. The route text under discussion with Oman can describe lanes; describing lanes does not create an authority able to attest a right to use them.", "refs": ["hormuz-route"], "tr": "Trump'ın koşulu bir sonuç tarif ediyor: herhangi bir anlaşma boğazın derhal ve tümüyle açılmasını içermeli. Cumhurbaşkanı Mesud Pezeşkiyan ise aynı mutabakat metnini Tahran'ın gelecekteki dış politikasının temel taşı olarak niteledi. Bir tarafın dayanak, diğerinin koşul saydığı bir metnin üzerine kurulacak düzenlemede kritik olan soru şudur: geçişin gerçekleştiğini kim tespit edecek ve tespit edemezse ne olacak? Umman'la görüşülen güzergâh metni şeritleri tarif edebilir; şeritleri tarif etmek, onları kullanma hakkını belgeleyecek bir merci yaratmaz."}, {"en": "What is worth following is therefore not another statement but the content of whatever text is published. If the understanding reached with Oman is made public and names, alongside the entry and exit lanes, an authority that certifies passage and a period for which it holds, the demand will have become an enforceable obligation for the first time. If the text describes only coordinates and lanes, the outcome Washington wants and the arrangement Tehran signs will continue to sit on separate planes.", "refs": ["hormuz-route", "iran-live"], "tr": "Bu yüzden takip edilecek şey bir açıklama değil, yayımlanacak metnin içeriğidir. Umman'la varılan anlayış kamuoyuna açıklanır ve giriş ile çıkış şeritlerinin yanında geçişi onaylayacak bir makam ile bunun süresi de yazılırsa, talep ilk kez uygulanabilir bir yükümlülüğe dönüşmüş olur. Metin yalnızca koordinat ve şerit tarif ediyorsa, Washington'un istediği sonuç ile Tahran'ın imzaladığı düzenleme ayrı düzlemlerde kalmayı sürdürür."}]}], "sources": [{"key": "iran-live", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/liveblog/2026/8/3/iran-war-live-trump-says-talks-set-to-begin-tehran-urges-us-to-honour-mou", "title": {"tr": "İran Dışişleri, ABD ile şu anda görüşme yürütülmediğini bildirdi", "en": "Iran's foreign ministry says no talks with the US are under way"}, "publishedDate": "2026-08-03"}, {"key": "hormuz-route", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "İran, Umman'la Hürmüz güzergâhı görüşmelerinin son aşamada olduğunu açıkladı", "en": "Iran says talks with Oman on a new Hormuz shipping route are in their final stages"}, "publishedDate": "2026-08-02"}], "title": {"en": "Only one of the two tracks has a text behind it", "tr": "İki kanaldan yalnızca birinin arkasında bir metin var"}, "writer": "geo-01", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Twenty-two member states asked for an emergency meeting. The party that actually halts the crossings and carries out the returns is not a member of it.", "tr": "Yirmi iki üye devlet olağanüstü bir toplantı istedi. Geçişin durdurulmasını ve geri dönüşü fiilen yürüten taraf ise o toplantının üyesi değil."}, "sections": [{"h": {"en": "Who signed the letter", "tr": "Mektubu kimler imzaladı"}, "ps": [{"en": "After the crossings at Ceuta, 22 of the 27 member states signed a joint letter calling for coordinated action and the strengthening of external borders, and Ireland, holding the presidency, said interior ministers would meet by videoconference on Tuesday. The letter's language is outcome-oriented: the signatories wrote that they cannot allow uncontrolled mass crossings, or allow an illegal entry to turn into legal stay. What decision-making powers the meeting will convene under, and which external-border instruments it will take up, were not stated.", "refs": ["eu-ceuta"], "tr": "Fas'tan Ceuta'ya yapılan geçişlerin ardından 27 üyeden 22'si, eşgüdümlü hareket ve dış sınırların güçlendirilmesi çağrısı yapan ortak bir mektuba imza attı; dönem başkanlığını yürüten İrlanda, içişleri bakanlarının salı günü video konferansla toplanacağını bildirdi. Mektubun dili sonuç odaklı: imzacılar denetimsiz kitlesel geçişlere ve yasa dışı girişin yasal kalışa dönüşmesine izin veremeyeceklerini yazdı. Toplantının hangi karar yetkisiyle toplanacağı ve dış sınıra ilişkin hangi araçları ele alacağı açıklanmadı."}, {"en": "A number of members, meanwhile, moved before the meeting. Italy suspended its Schengen open-border arrangement with Spain, France increased police numbers at the Spanish border fivefold and Portugal tightened controls on its southern land and maritime borders, while Manfred Weber, leader of the European People's Party, put the responsibility directly on Madrid. What arrives in front of Tuesday's videoconference is less a set of options to be decided than a list of measures already applied. Another reading is available: the extraordinary format under the Irish presidency may be the only instrument capable of preventing further unilateral suspensions, in which case the meeting works as a brake rather than a rubber stamp.", "refs": ["eu-ceuta"], "tr": "Buna karşılık üyelerin bir bölümü toplantıyı beklemeden kendi adımlarını attı. İtalya İspanya ile arasındaki Schengen açık sınır uygulamasını askıya aldı, Fransa İspanya sınırındaki polis sayısını beş katına çıkardı, Portekiz güneydeki kara ve deniz sınırlarında denetimleri sıkılaştırdı; Avrupa Halk Partisi lideri Manfred Weber ise sorumluluğu doğrudan Madrid'e yükledi. Salı günkü video konferansın önüne, kararlaştırılacak bir seçenekler kümesinden çok, hâlihazırda uygulanmış önlemlerin listesi geliyor. Bunun bir başka okuması da mümkün: İrlanda başkanlığındaki olağanüstü format, yeni tek taraflı askıya almaları önleyebilecek tek araç olabilir ve o zaman toplantı onaylama değil sınırlama işlevi görür."}]}, {"h": {"en": "The party that is not in the room", "tr": "Toplantıda bulunmayan taraf"}, "ps": [{"en": "On the other side of the crisis stands Morocco. Its interior ministry reported 11 deaths on its own territory and attributed the surge to misinformation on social media, to trafficking networks and to a misreading of a Spanish ruling banning immediate returns of people intercepted at sea. More to the point, of the roughly 60,000 who crossed into Ceuta between Thursday and Sunday, more than 48,000 returned to Morocco within 48 hours. Accepting and carrying out a return on that scale is not a transaction EU interior ministers can settle among themselves.", "refs": ["ceuta-toll"], "tr": "Krizin diğer yakasında Fas var. Fas İçişleri Bakanlığı kendi tarafında 11 ölüm bildirdi ve geçiş dalgasını sosyal medyadaki yanlış bilgiye, kaçakçılık ağlarına ve denizde yakalananların anında geri gönderilmesini yasaklayan bir İspanyol kararının yanlış yorumlanmasına bağladı. Daha önemlisi, perşembe ile pazar arasında Ceuta'ya geçen yaklaşık 60.000 kişinin 48.000'den fazlası 48 saat içinde Fas'a döndü. Bu ölçekte bir geri dönüşü kabul etmek ve yürütmek, AB içişleri bakanlarının kendi aralarında karar verebileceği bir işlem değildir."}, {"en": "That is where the balance question actually sits. The signatories are asking for a stronger external border while the instruments genuinely in their hands are internal, and the government that administers the far side of that border and performs the readmissions is neither an addressee of the letter nor a participant in the meeting. In an arrangement of that shape, any agreed text depends for its execution on the consent of a third party, and that consent is the subject of a separate bargain.", "refs": ["ceuta-toll", "eu-ceuta"], "tr": "Denge tartışmasında asıl mesele budur. İmzacılar dış sınırın güçlendirilmesini isterken ellerindeki fiilî araçlar iç sınırlarda; sınırın öbür yakasını yöneten ve geri kabulü uygulayan hükümet ise ne mektubun muhatabı ne de toplantının katılımcısı. Böyle bir yapıda üzerinde uzlaşılan her metin, uygulaması bir üçüncü tarafın rızasına bağlı kalır ve o rıza da ayrı bir pazarlığın konusudur."}]}], "sources": [{"key": "eu-ceuta", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "title": {"tr": "22 AB hükümeti Ceuta için olağanüstü içişleri bakanları toplantısı istedi", "en": "22 EU governments call for an emergency interior ministers' meeting over Ceuta"}, "publishedDate": "2026-08-02"}, {"key": "ceuta-toll", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/migrant-deaths-in-ceuta-rise-to-72-after-border-surge-from-morocco", "title": {"tr": "Ceuta'daki can kaybı 72'ye çıktı, 48.000'den fazla kişi Fas'a döndü", "en": "Ceuta death toll reaches 72 as more than 48,000 return to Morocco"}, "publishedDate": "2026-08-02"}], "title": {"en": "Morocco is absent from the Ceuta table", "tr": "Ceuta masasında Fas yok"}, "writer": "geo-02", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The roadmap announced on Friday sets out an order of steps. The condition Israel has stated reverses that order, and air strikes fill the space in between.", "tr": "Cuma günü duyurulan yol haritası bir sıralama öngörüyor. İsrail'in açıkladığı koşul ise o sıralamayı tersine çeviriyor ve arada kalan boşluğu hava saldırıları dolduruyor."}, "sections": [{"h": {"en": "The announced order", "tr": "Duyurulan sıra"}, "ps": [{"en": "The Board of Peace and the International Stabilisation Force announced on Friday that agreement had been reached on implementing the next phase of the ceasefire. Hamas was reported to have accepted the roadmap. Israel made no official statement. In an implementation arrangement, the order in which the parties discharge their obligations is as decisive as the arrangement itself; here that order was announced by third parties, and one of the parties did not bind itself to the announcement.", "refs": ["gaza-19"], "tr": "Barış Kurulu ile Uluslararası İstikrar Gücü cuma günü ateşkesin bir sonraki aşamasının uygulanması konusunda anlaşmaya varıldığını duyurdu. Hamas'ın yol haritasını kabul ettiği bildirildi. İsrail resmi bir açıklama yapmadı. Bir uygulama düzenlemesinde tarafların yükümlülüklerini hangi sırayla yerine getireceği, düzenlemenin kendisi kadar belirleyicidir; burada o sıra üçüncü taraflarca duyuruldu, taraflardan biri ise duyuruya bağlanmadı."}, {"en": "Doron Spielman, a spokesperson for Netanyahu, said Israel would not withdraw its forces before Hamas had fully surrendered its weapons. A condition that places completed disarmament ahead of a military withdrawal and an approach that treats withdrawal as the precondition for disarmament are two opposite operating orders for the same text. When it is unclear who moves first in stopping a war, the ambiguity does not resolve itself; it requires one side to drop its condition, or a third party to take on the authority to impose the order.", "refs": ["gaza-19"], "tr": "Netanyahu'nun sözcüsü Doron Spielman, Hamas silahlarını tümüyle teslim etmeden İsrail'in güçlerini geri çekmeyeceğini söyledi. Silahsızlanmanın tamamlanmasını askeri çekilmenin önüne koyan bir koşul ile çekilmeyi silahsızlanmanın önkoşulu sayan bir yaklaşım, aynı metnin iki karşıt işletim sırasıdır. Bir savaşın durdurulmasında ilk adımı kimin atacağı belirsizse belirsizlik kendiliğinden çözülmez; bir tarafın koşulundan vazgeçmesini ya da bir üçüncü tarafın sırayı dayatacak yetkiyi üstlenmesini gerektirir."}]}, {"h": {"en": "What fills the space in between", "tr": "Aradaki boşluğu ne dolduruyor"}, "ps": [{"en": "That space did not stay empty. According to Palestinian health officials and medical sources at al-Shifa and Nasser hospitals, at least 19 people were killed on Sunday, the highest daily figure reported in weeks. Among the dead were a family at al-Sousi Tower in western Gaza City and a family in al-Qarara near Khan Younis. Al Jazeera correspondent Nour Khaled reported that the strikes came without warning or evacuation orders in the areas that were hit.", "refs": ["gaza-19"], "tr": "O boşluk boş kalmadı. Filistinli sağlık yetkilileri ile Şifa ve Nasır hastanelerindeki tıbbi kaynaklara göre pazar günü en az 19 kişi öldü; bu, haftalardır bildirilen en yüksek günlük sayı. Ölenler arasında Gazze kentinin batısındaki Sousi Kulesi'nde bir aile ile Han Yunus'a bağlı el-Karara'da bir aile bulunuyor. Al Jazeera muhabiri Nur Halid, saldırıların hedef alınan bölgelerde uyarı ya da tahliye çağrısı yapılmadan gerçekleştiğini aktardı."}, {"en": "A pattern of strikes without warning or evacuation sits awkwardly with a narrow, target-specific coercive posture; keeping preparation invisible is not a feature such a military posture usually wants. Other explanations are available: warnings may have been passed through channels the correspondent could not observe, or the targets hit may come from a list assembled before Friday's announcement. What would separate those possibilities is whether the daily toll returns over the next fortnight to the level of previous weeks, and whether a verification body named in the security arrangement begins work.", "refs": ["gaza-19"], "tr": "Uyarısız ve tahliyesiz bir saldırı örüntüsü, dar kapsamlı ve belirli hedeflere yönelen bir zorlama duruşuyla güç bağdaşır; hazırlığı görünür kılmamak bu tür bir askeri duruşun beklenen bir özelliği değildir. Başka açıklamalar da mümkündür: uyarılar muhabirin gözlemleyemediği kanallardan iletilmiş olabilir ya da vurulan hedefler cuma günkü duyurudan önce oluşturulmuş bir listeden gelmiş olabilir. Bu iki ihtimali ayırt edecek olan, önümüzdeki iki hafta boyunca günlük bilançonun önceki haftaların düzeyine dönüp dönmediği ve güvenlik düzenlemesinde adı geçen bir doğrulama makamının çalışmaya başlayıp başlamadığıdır."}]}], "sources": [{"key": "gaza-19", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/israel-kills-five-in-gaza-despite-trumps-hamas-disarmament-plan", "title": {"tr": "Gazze genelindeki İsrail saldırılarında 19 kişi öldü", "en": "Israeli strikes across Gaza kill 19 on the deadliest day in weeks"}, "publishedDate": "2026-08-02"}], "title": {"en": "Two conditions, each waiting on the other", "tr": "Birbirini bekleyen iki koşul"}, "writer": "geo-03", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Cuba's grid failures are narrated as an infrastructure story. The July sequence suggests the binding constraint is fuel rather than switching faults.", "tr": "Küba'nın şebeke çöküşleri bir altyapı hikâyesi gibi anlatılıyor. Temmuz ayındaki olay dizisi, bağlayıcı kısıtın anahtarlama arızası değil yakıt olduğunu gösteriyor."}, "sections": [{"h": {"en": "The fault notice and the ledger behind it", "tr": "Arıza bildirimi ve arkasındaki hesap"}, "ps": [{"en": "The state utility UNE announced late on Sunday that the grid had collapsed, without giving a cause, the extent of the disruption or a restoration time. Before the collapse, Havana's electricity company had reported damaged transformers, circuit failures and planned cuts tied to insufficient generating capacity. According to Reuters, dozens of unresolved complaints had been logged early on Sunday in municipalities including Guanabacoa, Habana del Este, La Lisa and Marianao. Those two kinds of problem draw on different budget lines: one is equipment and maintenance, the other is fuel.", "refs": ["cuba-grid"], "tr": "Devlet elektrik kuruluşu UNE pazar günü geç saatlerde şebekenin çöktüğünü duyurdu; nedeni, etkilenen alanı ve elektriğin ne zaman geleceğini bildirmedi. Çöküşten önce Havana'nın elektrik şirketi hasarlı transformatörler, devre arızaları ve yetersiz üretim kapasitesine bağlı planlı kesintiler bildirmişti. Reuters'a göre pazar sabahı Guanabacoa, Habana del Este, La Lisa ve Marianao gibi belediyelerde çözülmemiş onlarca şikâyet kaydedilmişti. Bu iki tür sorun ayrı bütçe kalemlerine bakar: biri ekipman ve bakım, diğeri yakıt."}, {"en": "The July sequence indicates which of them binds. The grid collapsed three times within nine days, one of those outages leaving about 10 million people without electricity, and generation still could not meet demand after the network was reconnected. A switching fault closes when the line is reconnected; a shortfall that survives reconnection means there is nothing to burn. The counter-reading is in the same record: some plants are more than 30 years old and have had limited maintenance, and others point to decades of underinvestment in the energy sector.", "refs": ["cuba-grid"], "tr": "Temmuz ayındaki olay dizisi hangisinin bağladığını gösteriyor. Şebeke dokuz gün içinde üç kez çöktü ve bunlardan biri yaklaşık 10 milyon kişiyi elektriksiz bıraktı; şebeke yeniden devreye alındıktan sonra bile talebi karşılayacak üretim sağlanamadı. Anahtarlama arızası şebeke yeniden devreye alınınca kapanır; devreye alma sonrasında da süren açık, yakılacak yakıt bulunmadığı anlamına gelir. Karşı okuma da aynı haberde yer alıyor: bazı santraller 30 yılı aşkın ve sınırlı bakım görmüş durumda, kimileri de enerji sektöründeki onlarca yıllık yatırım eksikliğine işaret ediyor."}]}, {"h": {"en": "Two suppliers, one route", "tr": "İki tedarikçi, tek güzergâh"}, "ps": [{"en": "On the fuel side the picture is this. Venezuela had long been the island's primary oil supplier. Al Jazeera reported that Cuba lost that source after Trump imposed an oil blockade following the United States' seizure of Venezuelan President Nicolás Maduro on 3 January, and that shipments from Mexico also stopped under pressure from Washington. For an importer, losing one supplier is a price problem; losing the second is a routing problem. Restrictions on access to financing and equipment over the same period narrow the credit and the spare parts that would carry any search for a substitute.", "refs": ["cuba-grid"], "tr": "Yakıt tarafında olan şu: Venezuela uzun süredir adanın başlıca petrol tedarikçisiydi. Al Jazeera'ya göre Küba, ABD'nin 3 Ocak'ta Venezuela Devlet Başkanı Nicolás Maduro'yu alıkoymasının ardından Trump'ın uyguladığı petrol ablukasıyla bu kaynağı kaybetti; Meksika'dan gelen sevkiyatlar da Washington'un baskısıyla durdu. Bir ithalatçı için tek tedarikçinin kesilmesi fiyat sorunudur, ikinci tedarikçinin de kesilmesi güzergâh sorunudur. Aynı dönemde finansmana ve ekipmana erişimin kısıtlanması, ikame arayışını taşımaya yarayacak krediyi ve yedek parçayı da daraltıyor."}, {"en": "The next step will therefore appear in a shipment rather than in a statement. If a third supplier comes in, the first evidence will be cargo discharged on the island; the second will be restored generation holding above demand for a full week. If neither happens, the pattern of July should be expected to continue through August, and the outages should then be read as the result of a supply line rather than of a maintenance schedule.", "refs": ["cuba-grid"], "tr": "Bu yüzden bir sonraki adım bir açıklamada değil bir sevkiyatta görünür. Üçüncü bir tedarikçi devreye girerse bunun ilk kanıtı adaya boşaltılan kargo olur; ikinci kanıtı ise yeniden devreye alınan üretimin bir hafta boyunca talebin üzerinde kalmasıdır. İkisi de gerçekleşmezse temmuzdaki örüntünün ağustos boyunca sürmesini beklemek gerekir ve o zaman kesintiler bir bakım programının değil bir tedarik hattının sonucu olarak okunmalıdır."}]}], "sources": [{"key": "cuba-grid", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/3/grid-failure-plunges-cuba-into-nationwide-blackout", "title": {"tr": "Küba'nın ulusal elektrik şebekesi yeniden çöktü", "en": "Cuba's national grid collapses again, cutting power across the island"}, "publishedDate": "2026-08-03"}], "title": {"en": "Havana lost both suppliers in the same seven months", "tr": "Havana yedi ay içinde iki tedarikçisini de kaybetti"}, "writer": "geo-04", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The election office opened in Torit turns South Sudan's December date into an administrative task list for the first time. The first item on that list is not voting but reaching eight counties.", "tr": "Torit'te açılan seçim ofisi, Güney Sudan'ın aralık tarihini ilk kez bir idari görev listesine çeviriyor. Listenin ilk maddesi oy verme değil, sekiz ilçeye ulaşmak."}, "sections": [{"h": {"en": "What opened in Torit", "tr": "Torit'te açılan şey"}, "ps": [{"en": "Eastern Equatoria's governor, Louis Lobong Lojore, inaugurated the State High Election Committee's office in Torit. The country plans to hold its first general election since independence in 2011 on 22 December 2026. The opening is the first concrete step at which the national timetable acquires an address and a staff at state level; until then the date existed as a decree, and now it has a building.", "refs": ["south-sudan-office"], "tr": "Doğu Ekvatorya Valisi Louis Lobong Lojore, Torit'te Eyalet Yüksek Seçim Komitesi'nin ofisini hizmete açtı. Ülke 22 Aralık 2026'da, 2011'deki bağımsızlığından bu yana ilk genel seçimini yapmayı planlıyor. Açılış, ulusal takvimin eyalet düzeyinde bir adres ve bir kadro kazandığı ilk somut adım; o güne kadar tarih bir kararname olarak vardı, artık bir binası var."}, {"en": "Who was in the room is also a choice. The inauguration was attended by SPLM state deputy chairperson Margret Itoo Leonardo and SPLM-IO representative Ochola Bosco Oringa, with Deputy Governor Karlo Andrew Akwo Ajerry also present. The two sides of the power-sharing arrangement each sent a name into the room at the moment the machinery was set up. The weight of that should not be overstated: attending an opening is cheap and can be explained by protocol. Even so, the fact that the first objection to the process did not arrive at this stage is worth recording.", "refs": ["south-sudan-office"], "tr": "Salonda kimlerin bulunduğu da bir tercih. Açılışa SPLM eyalet başkan yardımcısı Margret Itoo Leonardo ile SPLM-IO temsilcisi Ochola Bosco Oringa katıldı; Vali Yardımcısı Karlo Andrew Akwo Ajerry de oradaydı. Güç paylaşımının iki tarafı, mekanizmanın kurulduğu anda aynı odaya birer isim gönderdi. Bunun ağırlığını abartmamak gerekir: bir açılışa katılmak ucuzdur ve protokolle de açıklanabilir. Yine de sürecin ilk itirazının bu aşamada gelmemiş olması dikkate değer bir veridir."}]}, {"h": {"en": "The administration that has to carry the timetable", "tr": "Takvimi taşıyacak olan idare"}, "ps": [{"en": "The committee's chairperson, Abdalla Hassan Famai, said they would visit the eight counties and administrative areas to explain to people how they can take part, because an election is an inclusive activity. Governor Lojore directed the committee to begin civic and voter education campaigns immediately across all counties, payams and bomas. The scope of that instruction is notable: the education is to reach not only county centres but the smallest administrative unit.", "refs": ["south-sudan-office"], "tr": "Komite başkanı Abdalla Hassan Famai, sekiz ilçeyi ve idari bölgeleri ziyaret ederek halka seçime nasıl katılacağını anlatacaklarını, çünkü seçimin kapsayıcı bir faaliyet olduğunu söyledi. Vali Lojore ise komiteye tüm ilçelerde, payamlarda ve bomalarda yurttaşlık ve seçmen eğitimi kampanyalarına derhal başlaması talimatını verdi. Talimatın kapsamı dikkat çekici: eğitim yalnızca ilçe merkezlerine değil, en küçük idari birime kadar indirilecek."}, {"en": "What the announcement provides and what it does not part company here. There is a task, a scope and a closing date; no schedule was published for which weeks the visits and the education will take place. The measure to follow in the coming period is therefore not December but registration: voter registration opening in all eight counties, and the committee announcing a date for it, would be the first concrete evidence that the timetable can be carried.", "refs": ["south-sudan-office"], "tr": "Duyurunun verdiği ve vermediği şeyler burada ayrışıyor. Ortada bir görev, bir kapsam ve bir bitiş tarihi var; ziyaretlerin ve eğitimin hangi haftalarda yapılacağına dair bir program açıklanmadı. Bu nedenle önümüzdeki dönemde izlenecek ölçüt aralık ayı değil, kayıt aşamasıdır: sekiz ilçenin tamamında seçmen kaydının açılması ve komitenin bu iş için bir tarih ilan etmesi, takvimin taşınabildiğini gösterecek ilk somut kanıt olur."}]}], "sources": [{"key": "south-sudan-office", "kind": "news", "name": "Radio Tamazuj", "url": "https://www.radiotamazuj.org/en/news/article/eastern-equatoria-launches-election-office", "title": {"tr": "Güney Sudan'ın Doğu Ekvatorya eyaletinde seçim ofisi açıldı", "en": "South Sudan's Eastern Equatoria opens a state election office"}, "publishedDate": "2026-08-03"}], "title": {"en": "Eight counties, one office, and a date in December", "tr": "Sekiz ilçe, bir ofis ve aralıkta bir tarih"}, "writer": "geo-05", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "A military offensive ended one group's presence in the Swat valley seventeen years ago. What was attacked on Sunday was the everyday protective arrangement that offensive left behind.", "tr": "Swat vadisinde bir askerî harekât, on yedi yıl önce bir grubun varlığını sona erdirmişti. Pazar günü saldırıya uğrayan, o harekâtın ardından geriye kalan gündelik koruma düzeniydi."}, "sections": [{"h": {"en": "The present-day explanation first", "tr": "Önce bugünün açıklaması"}, "ps": [{"en": "In the Kabal area of Khyber Pakhtunkhwa, an attacker detonated explosives at the entrance to a police station and at least 14 people were killed. Al Jazeera reported that Swat district police officer Umar Khan said the explosion followed an attempt by officers to stop and search the man; according to Arab News, assistant commissioner Ayesha Nasir said the apparent target of the attack was the police. Reported injury tolls differ between sources, and no group claimed responsibility.", "refs": ["swat-bombing"], "tr": "Hayber Pahtunhva'nın Kabal ilçesinde, polis merkezinin girişinde bir saldırgan üzerindeki patlayıcıyı ateşledi ve en az 14 kişi öldü. Al Jazeera'ya göre Swat İlçe Polis Müdürü Umar Han, patlamanın polislerin saldırganı durdurup arama yapmak istemesi üzerine gerçekleştiğini söyledi; Arab News'a göre Kaymakam Ayşe Nasır saldırının hedefinin polis olduğunun anlaşıldığını belirtti. Yaralı sayısına ilişkin bildirimler kaynaklar arasında farklılık gösteriyor ve saldırıyı üstlenen olmadı."}, {"en": "The strongest current explanation of the event is the resurgence of attacks in the area. That is precisely what the crowd at the nearby intersection had gathered to protest; Arab News named the rally the Swat People's Peace Uprising, organised by local residents and civil society groups. The demand, in other words, was addressed to a security institution, and the physical form that institution took at that moment was a police station gate and a search conducted at it.", "refs": ["swat-bombing"], "tr": "Bu olayın en güçlü güncel açıklaması, bölgede yeniden yükselen saldırılardır. Yakındaki kavşakta toplananlar da tam bunu protesto ediyordu; Arab News mitingi, yerel halk ve sivil toplum gruplarınca düzenlenen Swat Halkının Barış Ayaklanması olarak adlandırdı. Yani talep bir güvenlik kurumuna yöneltilmişti ve o kurumun o andaki fiziksel karşılığı bir karakol kapısı ile orada yapılan bir aramaydı."}]}, {"h": {"en": "What was inherited from 2009", "tr": "2009'dan devralınan düzen"}, "ps": [{"en": "The valley's present protective arrangement was inherited from somewhere. According to the same reporting, Swat was the centre of the Pakistan Taliban's presence until a 2009 military offensive drove the group out. What that offensive settled was a presence: an armed structure's control of the terrain was ended. What it handed on was everyday protection; where an army operation had been, there remained a district police force, a station and a search at its gate. It was that second arrangement that was attacked on Sunday.", "refs": ["swat-bombing"], "tr": "Vadinin bugünkü koruma düzeni bir yerden devralındı. Aynı habere göre Swat, 2009'daki askerî harekât grubu bölgeden çıkarana kadar Pakistan Talibanı'nın merkezi konumundaydı. O harekâtın çözdüğü şey bir varlıktı: silahlı bir yapının araziyi denetlemesi sona erdirildi. Devrettiği şey ise gündelik korumaydı; bir ordu operasyonunun bıraktığı yerde ilçe polisi, bir karakol ve girişte yapılan bir arama kaldı. Pazar günü saldırıya uğrayan da bu ikinci düzendi."}, {"en": "That is also where the analogy breaks, and the break matters. In 2009 the instrument used in Swat was a military offensive; the demand voiced on Sunday was addressed to civil administration and to a district police force, and the attack was aimed directly at that force. Statements from the top of the government, by contrast, preserve the language of 2009 in saying the fight will continue until it is eradicated. Which institution the answer comes from will also determine whether the arrangement the valley inherited is renewed: a reinforced police service and a newly declared military offensive mean two different futures for the same valley.", "refs": ["swat-bombing"], "tr": "Benzetmenin kırıldığı nokta da burasıdır ve önemlidir. 2009'da Swat'ta başvurulan araç bir askeri harekâttı; pazar günü dile getirilen talep ise sivil idareye ve ilçe polisine yöneltildi, saldırı da doğrudan o gücü hedef aldı. Buna karşılık hükümetin en üst düzeyinden gelen açıklamalar, mücadelenin kökü kazınana kadar süreceğini söyleyerek 2009'un dilini koruyor. Cevabın hangi kurumdan geleceği, vadinin devraldığı düzenin yenilenip yenilenmeyeceğini de belirleyecek: takviye edilen bir polis teşkilatı ile yeniden ilan edilen bir askeri harekât, aynı vadide farklı iki gelecek anlamına gelir."}]}], "sources": [{"key": "swat-bombing", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/suicide-bomber-kills-14-outside-police-station-in-pakistans-swat", "title": {"tr": "Swat'ta karakol kapısındaki intihar saldırısında 14 kişi öldü", "en": "A suicide bombing at a Swat police station gate kills 14"}, "publishedDate": "2026-08-02"}], "title": {"en": "Kabal's gate is what the 2009 offensive left behind", "tr": "Kabal'daki kapı, 2009 harekâtından geriye kalan"}, "writer": "geo-06", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The multiples will be quoted: PAC-3 output tripled, THAAD output quadrupled. The change that actually binds anyone is the length of the paper they are written on.", "tr": "Alıntılanacak olan katsayılar: PAC-3 üretimi üç, THAAD üretimi dört katına. Oysa tarafları asıl bağlayan değişiklik, bu katsayıların yazıldığı metnin süresi."}, "sections": [{"h": {"en": "What changed in the instrument", "tr": "Metinde değişen ne"}, "ps": [{"en": "The US defence department replaced a $4.7bn one-year agreement with Lockheed Martin with a seven-year contract valued at $58bn, and awarded Northrop Grumman more than $3bn, while stating that PAC-3 interceptor output would triple and THAAD output quadruple. Two of those four numbers describe quantities of missiles. The other two describe how long the buyer has agreed to keep buying them.", "refs": ["interceptor-contract"], "tr": "ABD savunma bakanlığı, Lockheed Martin'le yapılmış 4,7 milyar dolar değerindeki bir yıllık anlaşmanın yerine 58 milyar dolar değerinde yedi yıllık bir sözleşme koydu; Northrop Grumman'a da 3 milyar dolar üzerinde bir iş verdi. Aynı duyuruda PAC-3 önleyici füze üretiminin üç, THAAD üretiminin dört katına çıkacağı belirtildi. Bu dört sayının ikisi füze adedini anlatıyor. Diğer ikisi, alıcının ne kadar süre boyunca almayı taahhüt ettiğini."}, {"en": "A one-year agreement leaves the cost of expansion with the supplier: new tooling, a second line, hires and long-lead components all have to be recovered before the next annual decision, so the rational supplier expands slowly. A seven-year contract moves that horizon onto the buyer's side of the table, which is the condition under which a tripling can be planned rather than promised. It is also the reason a later administration will find the commitment expensive to unwind. The alternative reading is duller and cannot be excluded: multiyear conversions are a familiar budgeting device at the end of a bridge year, and this one may be ordinary procurement housekeeping that the production multiples were attached to afterwards.", "refs": ["interceptor-contract"], "tr": "Bir yıllık anlaşma, genişlemenin maliyetini tedarikçinin sırtında bırakır: yeni tezgâh, ikinci hat, istihdam ve uzun tedarik süreli parçaların tamamı bir sonraki yıllık karardan önce geri kazanılmak zorundadır, dolayısıyla aklı başında bir tedarikçi yavaş büyür. Yedi yıllık sözleşme bu ufku masanın alıcı tarafına taşır; üretimin üçe katlanmasının vaat edilmek yerine planlanabilmesinin koşulu da budur. Aynı özellik, taahhüdün ileride bir başka yönetim tarafından geri alınmasını pahalı kılar. Daha sıradan bir okuma da mümkün ve dışlanamaz: çok yıllı sözleşmeye geçiş, köprü yılının sonunda sık başvurulan bir bütçeleme yöntemidir ve bu iş, üretim katsayılarının sonradan iliştirildiği alışılmış bir tedarik işlemi olabilir."}]}, {"h": {"en": "Where the obligation can fail", "tr": "Yükümlülüğün kırılabileceği yer"}, "ps": [{"en": "Michael P. Duffey, the under-secretary for acquisition and sustainment, said that building what he called the Arsenal of Freedom \"requires robust, dynamic supply chains at every level\". Read as an official naming the weak point rather than as a slogan, that sentence identifies the layer the contract cannot reach. Washington can bind itself to seven years of orders; it cannot bind a fourth-tier supplier of solid rocket motors or seeker components to the same schedule, and the sub-tier is where an interceptor programme usually loses its year. A production multiple is an authority to buy at a rate. Depleted Patriot stocks in Ukraine are consumed at a rate. The two rates are set in different places.", "refs": ["interceptor-contract"], "tr": "Tedarik ve idameden sorumlu müsteşar Michael P. Duffey, \"Özgürlüğün Cephaneliği'ni kurmak her düzeyde sağlam ve devingen tedarik zincirleri gerektirir\" dedi. Bu cümleyi bir slogan olarak değil, bir yetkilinin zayıf halkayı işaret etmesi olarak okumak gerekir: sözleşmenin ulaşamadığı katman tam olarak orasıdır. Washington kendisini yedi yıllık siparişe bağlayabilir; katı yakıtlı roket motoru ya da arayıcı başlık üreten dördüncü kademe bir tedarikçiyi aynı takvime bağlayamaz ve önleyici füze programları yılını genellikle bu alt kademede kaybeder. Üretim katsayısı, belirli bir hızda satın alma yetkisidir. Ukrayna'da tükenen Patriot stokları ise belirli bir hızda harcanır. Bu iki hız ayrı yerlerde belirlenir."}, {"en": "The market read the announcement quickly — Northrop Grumman up about 1 percent, Lockheed Martin about 0.7 percent in early trading — which is roughly what a seven-year revenue floor is worth to an equity holder and tells us nothing about deliveries. If the department publishes annual delivery quantities for the first contract year, the multiple becomes testable within twelve months rather than seven: a first-year PAC-3 delivery figure at or above three times the last single-year rate would show the sub-tier moved with the contract, and anything materially below it would show that the instrument bought time rather than missiles.", "refs": ["interceptor-contract"], "tr": "Piyasa duyuruyu hızla fiyatladı: açılışta Northrop Grumman yaklaşık yüzde 1, Lockheed Martin yaklaşık yüzde 0,7 yükseldi. Bu, yedi yıllık bir gelir tabanının hissedar için kabaca ne ettiğini gösterir, teslimat hakkında ise hiçbir şey söylemez. Bakanlık sözleşmenin ilk yılına ait yıllık teslimat adetlerini yayımlarsa katsayı yedi yılda değil on iki ayda sınanabilir hâle gelir: ilk yıl PAC-3 teslimatının son tek yıllık üretimin üç katına ulaşması alt kademenin sözleşmeyle birlikte hareket ettiğini gösterir, belirgin biçimde altında kalması ise metnin füze değil zaman satın aldığını."}]}], "sources": [{"key": "interceptor-contract", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/8/3/pentagon-boosts-patriot-thaad-interceptor-output-amid-stockpile-strain", "title": {"tr": "Pentagon bir yıllık önleyici füze anlaşmasını yedi yıllık sözleşmeye çevirdi", "en": "The Pentagon turns a one-year interceptor agreement into a seven-year contract"}, "publishedDate": "2026-08-03"}], "title": {"en": "A one-year agreement was rewritten as a seven-year contract", "tr": "Bir yıllık anlaşma yedi yıllık sözleşme olarak yeniden yazıldı"}, "writer": "geo-01", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Two capitals appear in the exercise plan as framework nations. The rest of the coalition appears in a sentence about talks that are still under way, and the difference between those two sentences is the coalition's real shape.", "tr": "Tatbikat planında iki başkent çerçeve ülke olarak yer alıyor. Koalisyonun geri kalanı ise hâlâ süren görüşmelere ilişkin bir cümlede geçiyor; koalisyonun gerçek biçimi de bu iki cümle arasındaki farkta."}, "sections": [{"h": {"en": "Named, and not yet named", "tr": "Adı geçenler ve henüz geçmeyenler"}, "ps": [{"en": "A Polish defence ministry spokesperson set out what the autumn exercise is for: testing the command-and-control system, the organisation of logistical support and the deployment of troops, \"thereby confirming the force's ability to operate once hostilities have ended\". France and the United Kingdom will be the core participants as the coalition's framework nations, and Poland was chosen because it is the logistical and infrastructure hub for the Multinational Force Ukraine. Then comes the other sentence: military-to-military discussions are under way regarding the participation of other member countries.", "refs": ["poland-drills"], "tr": "Polonya Millî Savunma Bakanlığı sözcüsü, sonbahardaki tatbikatın ne işe yarayacağını sıraladı: komuta kontrol sisteminin sınanması, lojistik desteğin örgütlenmesi ve birliklerin konuşlandırılması, \"böylece kuvvetin çatışmalar sona erdiğinde harekât yeteneğinin doğrulanması\". Koalisyonun çerçeve ülkeleri olarak Fransa ve Birleşik Krallık çekirdek katılımcı olacak; Polonya ise Çokuluslu Ukrayna Kuvveti'nin lojistik ve altyapı merkezi olduğu için seçildi. Ardından öteki cümle geliyor: koalisyon üyesi diğer ülkelerin katılımı için ordular arası görüşmeler sürüyor."}, {"en": "Those are two different grammatical moods for two different levels of commitment. On one side of the scale, London and Paris have accepted a role with a name attached to it and a set of tasks that can be graded after the exercise. On the other, the remaining members are the subject of a negotiation whose outcome is not yet a fact, with the exercise only months away. A coalition assembled in 2025 to coordinate support for Kyiv is discovering that coordinating support and contributing units to a post-war force are separate decisions, taken by separate domestic majorities. It may also be nothing more than sequencing: framework nations plan first everywhere, and invitations follow a planning calendar rather than a hierarchy of willingness.", "refs": ["poland-drills"], "tr": "Bunlar iki farklı taahhüt düzeyine ait iki farklı kip. Terazinin bir kefesinde, Londra ve Paris adı konmuş bir rolü ve tatbikattan sonra değerlendirilebilecek görevleri kabul etmiş durumda. Öbür kefede, kalan üyeler sonucu henüz olgu olmayan bir müzakerenin konusu ve tatbikata yalnızca birkaç ay kaldı. Kyiv'e desteği eşgüdümlemek için 2025'te kurulan bir koalisyon, desteği eşgüdümlemek ile savaş sonrası bir kuvvete birlik vermenin ayrı kararlar olduğunu, üstelik ayrı iç çoğunluklarca alındığını görüyor. Bunun sıralamadan ibaret olması da mümkün: çerçeve ülkeler her yerde önce planlar, davetler ise isteklilik sıralamasını değil planlama takvimini izler."}]}, {"h": {"en": "The host's second request", "tr": "Ev sahibinin ikinci talebi"}, "ps": [{"en": "Warsaw brought a second item to the same table. Its 10 billion zloty East Shield programme along roughly 800km of border with Kaliningrad and Belarus — logistics hubs, storage, fortifications, shelters, and drone detection using radar, thermal imaging and acoustic sensors — is a national budget line that Poland wants treated as a NATO priority project. The cooperation established with Germany's Bundeswehr and the talks with US, French and British forces are the same request in a quieter register: turn a Polish expenditure into an allied one. Hosting the coalition's first exercise is the strongest argument available for making that case, and it is being made in the same week.", "refs": ["poland-drills"], "tr": "Varşova aynı masaya ikinci bir başlık getirdi. Kaliningrad ve Belarus sınırı boyunca yaklaşık 800 km uzunluğundaki hatta yürütülen 10 milyar zloti tutarındaki Doğu Kalkanı programı — lojistik merkezleri, depolar, tahkimatlar, sığınaklar ve radar, termal görüntüleme ile akustik algılayıcılara dayalı insansız hava aracı tespiti — ulusal bir bütçe kalemi ve Polonya bunun NATO öncelikli projesi sayılmasını istiyor. Almanya'nın Bundeswehr'iyle kurulan iş birliği ile ABD, Fransa ve Birleşik Krallık kuvvetleriyle yürütülen görüşmeler, aynı talebin daha alçak perdeden dile getirilmiş hâli: Polonya harcamasını ittifak harcamasına dönüştürmek. Koalisyonun ilk tatbikatına ev sahipliği yapmak, bu savı desteklemek için elde bulunan en güçlü gerekçe; gerekçe de aynı hafta öne sürülüyor."}, {"en": "Whether the coalition is a force or a letterhead is therefore answerable, and fairly soon. If the exercise takes place this autumn as planned, count the member states that put units on Polish soil beyond France and the United Kingdom, rather than the total number of troops; and afterwards, watch for East Shield in an alliance planning document rather than only in Polish ones. Two states doing the work of eleven would still be a coalition. It would still fall short of a guarantee.", "refs": ["poland-drills"], "tr": "Bu koalisyonun bir kuvvet mi yoksa bir antetli kâğıt mı olduğu, dolayısıyla yanıtlanabilir bir soru ve yanıtı da uzak değil. Tatbikat planlandığı gibi bu sonbaharda yapılırsa, toplam asker mevcudu yerine Fransa ve Birleşik Krallık dışında Polonya topraklarına birlik gönderen üye devletlerin sayısını saymak gerekir; sonrasında ise Doğu Kalkanı'nın yalnızca Polonya belgelerinde mi kaldığına, yoksa bir ittifak planlama belgesinde de göründüğüne bakmak gerekir. On bir devletin işini iki devletin yapması yine bir koalisyon olur. Bir güvence olmaya ise yetmez."}]}], "sources": [{"key": "poland-drills", "kind": "news", "name": "Defense News", "url": "https://www.defensenews.com/global/europe/2026/08/03/poland-readies-ukraine-coalition-of-willing-drills-eyes-nato-support-for-border-defense", "title": {"tr": "Polonya, İstekliler Koalisyonu'nun ilk tatbikatına ev sahipliğine hazırlanıyor", "en": "Poland is preparing to host the first Coalition of the Willing exercise"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who is a framework nation, and who is still being asked?", "tr": "Kim çerçeve ülke, kim hâlâ davet ediliyor?"}, "writer": "geo-02", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Heavy artillery and drones at Shererina on the first morning, hundreds of people across the Sudanese border by Sunday, and no figure from either side that would let anyone price the exchange.", "tr": "Shererina'da daha ilk sabah ağır topçu ve insansız hava araçları, pazar günü Sudan sınırının öte yanında yüzlerce insan; iki taraftan da bu çatışmanın bedelini hesaplatacak tek bir sayı yok."}, "sections": [{"h": {"en": "What was used on the first morning", "tr": "İlk sabah ne kullanıldı"}, "ps": [{"en": "Fighting began on Saturday morning at Shererina, a locality in western Tigray close to the Sudanese border, and ran into Sunday. A member of the Tigray People's Liberation Front told the BBC that heavy artillery and drones were used. Witnesses reported explosions, heavy gunfire and aircraft throughout Saturday, and by Sunday hundreds of people had crossed into Sudan, among them wounded fighters, according to Sudanese medical and local sources speaking to AFP.", "refs": ["tigray-fighting"], "tr": "Çatışma cumartesi sabahı, Sudan sınırına yakın batı Tigray'daki Shererina yerleşiminde başladı ve pazar gününe sarktı. Tigray Halk Kurtuluş Cephesi'nden bir üye BBC'ye ağır topçu ve insansız hava aracı kullanıldığını söyledi. Görgü tanıkları cumartesi boyunca patlama, yoğun silah sesi ve uçak sesi bildirdi; pazar gününe gelindiğinde, AFP'ye konuşan Sudanlı sağlık ve yerel kaynaklara göre aralarında yaralı savaşçıların da bulunduğu yüzlerce kişi Sudan'a geçmişti."}, {"en": "Tube artillery and armed drones on day one are not what an improvised clash looks like. Guns have to be emplaced, surveyed and supplied; drone crews need launch sites, links and a maintenance chain within range. Their presence on the first morning means the distance between peacetime posture and effective fire had already been closed, and that whatever warning either capital had, it was measured in hours rather than in the months a mobilisation would take. The competing explanation deserves equal weight: units that have faced each other for a long time can also generate a two-day exchange on their own, in which case the systems were simply what was already there and no decision was taken above them.", "refs": ["tigray-fighting"], "tr": "İlk gün namlulu topçu ve silahlı insansız hava aracı, doğaçlama bir çarpışmanın görüntüsü değildir. Toplar mevzilendirilmek, ölçülendirilmek ve ikmal edilmek zorundadır; insansız hava aracı ekipleri menzil içinde kalkış sahası, bağlantı ve bakım zinciri ister. Bunların ilk sabah orada olması, barış zamanı düzeni ile etkili ateş arasındaki mesafenin çoktan kapatıldığı anlamına gelir; iki başkentin eline geçen uyarı süresi de bir seferberliğin gerektireceği aylarla değil saatlerle ölçülür. Karşı açıklama da aynı ağırlığı hak ediyor: uzun süredir karşı karşıya duran birlikler iki günlük bir çarpışmayı kendi başlarına da çıkarabilir; o hâlde kullanılan sistemler yalnızca zaten orada olanlardır ve üstlerinde bir karar alınmamıştır."}]}, {"h": {"en": "Two claims and one silence", "tr": "İki iddia, bir sessizlik"}, "ps": [{"en": "The regional administration led by the TPLF called it an \"open war\" launched by the federal government in violation of the 2022 African Union-brokered agreement. From the federal side there was no statement by the government or the army; what exists is a social-media post by minister Abraham Belay confirming that clashes occurred, blaming the \"TPLF clique\", warning of \"worse consequences\" and calling for negotiation. A minister posting is a political signal with deniability built in. An army that declares nothing has declared neither an objective nor a condition on which it stops, and an adversary reading the same silence has to plan against the widest version of both.", "refs": ["tigray-fighting"], "tr": "TPLF yönetimindeki bölge idaresi olanı, federal hükûmetin 2022'de Afrika Birliği arabuluculuğunda imzalanan anlaşmayı çiğneyerek başlattığı bir \"açık savaş\" olarak niteledi. Federal tarafta ne hükûmetten ne de ordudan açıklama geldi; ortada bakan Abraham Belay'in çatışmaların yaşandığını doğrulayan, \"TPLF kliğini\" suçlayan, \"daha ağır sonuçlar\" konusunda uyaran ve müzakere çağrısı yapan sosyal medya paylaşımı var. Bir bakanın paylaşımı, içine inkâr payı yerleştirilmiş siyasi bir işarettir. Hiçbir şey ilan etmeyen bir ordu ne bir hedef ne de durma koşulu ilan etmiş olur; aynı sessizliği okuyan karşı taraf da ikisinin en geniş sürümüne göre plan yapmak zorunda kalır."}, {"en": "Western Tigray is disputed between Tigray and Amhara, which is why Shererina is worth artillery to both sides and why the 2022 agreement left it unresolved. The measurable question over the next month is not who advanced. If fighting resumes at Shererina before the start of September, watch whether either the federal army or the regional administration publishes a casualty figure of its own, or whether the African Union monitoring mechanism issues a statement on the agreement. A party that publishes a number has accepted a cost it can be held to; four years of parties that publish nothing is how a peace deal becomes a pause.", "refs": ["tigray-fighting"], "tr": "Batı Tigray, Tigray ile Amhara arasında ihtilaflı; Shererina'nın iki taraf için de topçu harcamaya değmesinin ve 2022 anlaşmasının burayı çözümsüz bırakmasının nedeni bu. Önümüzdeki ay ölçülebilir soru, kimin ilerlediği değil. Eylül başlamadan Shererina'da çatışma yeniden başlarsa, federal ordunun ya da bölge idaresinin kendi kayıp sayısını açıklayıp açıklamadığına, ya da Afrika Birliği izleme mekanizmasının anlaşmaya ilişkin bir açıklama yapıp yapmadığına bakmak gerekir. Bir sayı açıklayan taraf, hesabı sorulabilecek bir bedeli kabul etmiş olur; dört yıl boyunca hiçbir sayı açıklamayan taraflar ise bir barış anlaşmasını yalnızca bir ara vermeye dönüştürür."}]}], "sources": [{"key": "tigray-fighting", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cdrv6r3xgyeo", "title": {"tr": "Batı Tigray'da çatışma yeniden başlayınca yüzlerce kişi Sudan'a geçti", "en": "Hundreds cross into Sudan after fighting resumes in western Tigray"}, "publishedDate": "2026-08-03"}], "title": {"en": "The artillery returned to a border the armies had never left", "tr": "Toplar, orduların hiç terk etmediği bir sınıra geri döndü"}, "writer": "geo-03", "n": 3, "radarPublishedAt": "2026-08-03T20:33:08+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "When a chokepoint closes, cargo takes the long way round and pays for it. The long way round in this trade was the Red Sea, and since 20 July it has had a toll of its own.", "tr": "Bir boğaz kapandığında yük uzun yoldan dolaşır ve bunun bedelini öder. Bu ticarette uzun yol Kızıldeniz'di; 20 Temmuz'dan bu yana onun da kendi bedeli var."}, "sections": [{"h": {"en": "The count", "tr": "Sayım"}, "ps": [{"en": "11 ships crossed the Strait of Hormuz on Saturday and 8 on Sunday, against more than a hundred a day before the war, according to the ship-tracking firm Kpler. About 20 percent of the world's oil and gas used to move through that water. The temporary deal with the United States in early June lifted the count again; the resumption of strikes about a month later pushed it back down. Many of the ships still sailing switch off their position transmitters while crossing.", "refs": ["hormuz-traffic"], "tr": "Gemi takip şirketi Kpler'e göre Hürmüz Boğazı'ndan cumartesi 11, pazar 8 gemi geçti; savaştan önce günlük geçiş sayısı yüzün üzerindeydi. Dünya petrol ve doğal gazının yaklaşık yüzde 20'si bu sudan geçerdi. Haziran başında ABD ile varılan geçici anlaşma sayıyı yeniden yükseltmiş, yaklaşık bir ay sonra saldırıların başlaması yine aşağı itmişti. Hâlâ sefer yapan gemilerin çoğu geçiş sırasında konum vericilerini kapatıyor."}, {"en": "Switching off the transmitter is the clearest price in the whole dataset. An invisible ship is harder to charter, harder to insure and harder to sell a cargo from, and an owner who accepts those costs has decided that the discount for invisibility is smaller than the premium for being seen. That is a market pricing military risk directly, without waiting for a freight index to catch up. The obvious caveat is that going dark is also long-standing practice in sanctioned trades, so part of what the counter registers may be a change in who is still sailing rather than a change in how dangerous the crossing is.", "refs": ["hormuz-traffic"], "tr": "Vericiyi kapatmak, bütün veri kümesindeki en açık fiyat. Görünmeyen gemiyi kiralamak, sigortalamak ve yükünü satmak zorlaşır; bu maliyetleri kabul eden bir armatör, görünmezliğin indiriminin görünürlüğün priminden küçük olduğuna karar vermiş demektir. Bu, bir navlun endeksinin yetişmesini beklemeden askerî riski doğrudan fiyatlayan bir piyasadır. Bariz çekince şu: verici kapatmak yaptırım altındaki taşımacılıkta da eskiden beri başvurulan bir yöntem; dolayısıyla sayacın kaydettiğinin bir bölümü geçişin ne kadar tehlikeli olduğundaki değil, hâlâ kimin sefer yaptığındaki değişimi yan
