he route discussion with Oman, seeking an understanding on commercial passage through Hormuz. I drew the same distinction in this column yesterday: the Red Sea was the detour absorbing the traffic Hormuz had lost, and that detour now carried a price of its own (Eight ships on Sunday, and the detour now has a price too, August 3). What today adds is what the product of that bargaining is called. A temporary route is a capacity arrangement; it is not the reopening of the strait. The difference between them is how many vessels one corridor will carry, and on what insurance terms.", "refs": ["iran-talks", "history-hormuz"], "tr": "Duyurunun arkasındaki belgeye bakmak gerekiyor. İran, ABD'yle müzakere etmediğini ve buna dair bir planı bulunmadığını bildirdi; kabul ettiği tek kanal, Hürmüz'den ticari geçiş için Umman'la yürütülen ve bir mutabakat arayan güzergâh görüşmesi. Bu ayrımı dün de aynı köşede kurmuştum: Kızıldeniz, Hürmüz'ün kaybettiği trafiği soğuran sapaktı ve o sapağın da artık bir fiyatı vardı (Pazar günü sekiz gemi, artık sapağın da bir fiyatı var, 3 Ağustos). Bugün eklenen şey, o pazarlığın ürününün nasıl adlandırıldığı. Geçici bir güzergâh, bir kapasite düzenlemesidir; boğazın yeniden açılması değildir. İkisi arasındaki fark, tek bir koridorun kaç gemi ve hangi sigorta koşuluyla taşıyacağıdır."}, {"en": "What follows is this. Monday's price move measures the monetisation of a statement, not a change in flow. The counterargument deserves weight: a route understanding could produce a concrete easing in insurance premiums and voyage planning, in which case the price will have read correctly something the count has yet to show. The test is straightforward. If the understanding with Oman becomes a text and is implemented, the thing to watch is Kpler's four-day crossing count rather than the headline. If that count does not stand at 71 or more during August, what exists is a priced sentence rather than a reopened strait.", "refs": ["iran-talks"], "tr": "Buradan çıkan sonuç şu: Pazartesi günkü fiyat hareketi bir akış değişikliğini değil, bir açıklamanın ticarileşmesini ölçüyor. Karşı sav ciddiye alınmalı — bir güzergâh mutabakatı sigorta priminde ve sefer planlamasında somut bir gevşemeye yol açabilir ve o durumda fiyat, sayının henüz göstermediği bir şeyi doğru okumuş olur. Testi de kolay. Umman'la varılan mutabakat bir metne dönüşür ve uygulanırsa, izlenecek şey, manşet yerine Kpler'in dört günlük geçiş sayısıdır. O sayı ağustos boyunca 71 ve üzeri bir düzeyde durmuyorsa, ortada yeniden açılmış bir boğaz değil, fiyatlanmış bir cümle vardır."}]}], "sources": [{"key": "iran-talks", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c23579jzv08o", "title": {"tr": "Tahran, ABD ile değil Umman'la görüştüğünü bildirdi", "en": "Tehran says it is negotiating with Oman, not the United States"}, "publishedDate": "2026-08-03"}, {"key": "history-hormuz", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-04/2026-08-03/3/", "title": {"tr": "Pazar günü sekiz gemi, artık sapağın da bir fiyatı var", "en": "Eight ships on Sunday, and the detour now has a price too"}, "publishedDate": "2026-08-03"}], "title": {"en": "When the deal was announced, the only thing measured was the price", "tr": "Anlaşma duyurulduğunda ölçülen tek şey fiyattı"}, "writer": "geo-04", "date": "2026-08-04"}, {"excerpt": {"en": "The UN's personal envoy for Sudan is continuing his contacts with a Quintet of four institutions, three of which are organisations of the region itself. The same briefing shows the constraint is money rather than recognition: the humanitarian appeal is just over 40 percent funded.", "tr": "BM'nin Sudan özel temsilcisi, dört kurumdan oluşan Beşli grubuyla temaslarını sürdürüyor ve bunların üçü bölgenin kendi örgütleri. Aynı brifing, kısıtın tanınmadan çok para olduğunu gösteriyor: İnsani yardım çağrısının karşılanan bölümü yüzde 40'ın biraz üzerinde."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The composition of the table", "tr": "Masanın bileşimi"}, "ps": [{"en": "The United Nations noon briefing of August 3 reported that Personal Envoy Pekka Haavisto is continuing his engagement with the parties and with the Quintet. The four institutions that make it up are the African Union, IGAD, the League of Arab States and the European Union. The first thing to notice about that composition is arithmetic: three of the four are regional organisations of Sudan's own neighbourhood, and the only body from outside is the European Union.", "refs": ["un-sudan"], "tr": "Birleşmiş Milletler'in 3 Ağustos tarihli öğle brifinginde, Sudan dosyasında Özel Temsilci Pekka Haavisto'nun taraflarla ve Beşli grubuyla temaslarını sürdürdüğü bildirildi. Grubu oluşturan dört kurum Afrika Birliği, IGAD, Arap Ligi ve Avrupa Birliği. Bu bileşimin ilk özelliği aritmetik: Dört kurumun üçü Sudan'ın kendi çevresindeki bölgesel örgütler, dışarıdan olan tek kurum Avrupa Birliği."}, {"en": "That does not match the description under which Sudan's file has long been discussed, as something managed from outside. Having regional organisations at the table as sponsors changes whom the envoy answers to and which doors can be opened; contact between the African Union or IGAD and the parties is a reach that Brussels or New York cannot establish on its own. But sponsorship buys one thing and not another. A seat at the table confers the standing to make an appeal; it does not confer an obligation to fund what the appeal asks for.", "refs": ["un-sudan"], "tr": "Bu, Sudan dosyasının uzunca bir süredir dışarıdan yönetildiği yolundaki tarifle uyuşmuyor. Bölgesel örgütlerin sponsor sıfatıyla masada bulunması, arabulucunun kime hesap verdiğini ve hangi kapıların açılabileceğini değiştirir; Afrika Birliği'nin ve IGAD'ın taraflarla teması, Brüksel'in ya da New York'un tek başına kuramayacağı bir erişimdir. Ama sponsorluk bir şey satın alır, başka bir şeyi satın almaz. Masada oturmak çağrı yapma yetkisi verir; çağrının gereğini finanse etme yükümlülüğü vermez."}]}, {"h": {"en": "The measure of delivery", "tr": "Teslimatın ölçüsü"}, "ps": [{"en": "The same briefing supplies that measure. The humanitarian appeal for Sudan is just over 40 percent funded, with about $1.2 billion received against the nearly $2.9 billion required. The briefing also reported that clashes in South Kivu in the Democratic Republic of the Congo have displaced more than 48,000 people since mid-July, and that the country's Ebola outbreak had reached 3,748 confirmed cases as of August 1. Those figures describe a separate emergency leaning on the same financing architecture and carry no verdict on Sudan's own file; what they show is how many files that architecture is carrying at once.", "refs": ["un-sudan"], "tr": "Aynı brifing o ölçüyü veriyor. Sudan için yapılan insani yardım çağrısı, gereken yaklaşık 2,9 milyar dolar karşısında yaklaşık 1,2 milyar dolar toplanarak yüzde 40'ın biraz üzerinde karşılandı. Brifingde ayrıca Demokratik Kongo Cumhuriyeti'nin Güney Kivu bölgesindeki çatışmaların temmuz ortasından bu yana 48.000'den fazla kişiyi yerinden ettiği, ülkedeki Ebola salgınında 1 Ağustos itibarıyla doğrulanmış vaka sayısının 3.748'e ulaştığı aktarıldı. Bu rakamlar, aynı finansman mimarisine yaslanan ayrı bir acil durumu anlatıyor ve Sudan'ın kendi dosyası hakkında bir hüküm taşımıyor; gösterdikleri şey, o mimarinin aynı anda kaç dosya taşıdığı."}, {"en": "The reading that follows is this. What the African Union, IGAD and the League of Arab States have gained in Sudan's mediation is representation; what they have not yet gained is resources. The counterargument is strong and belongs on the page: how much of a humanitarian appeal is met is decided by donor governments' budget choices, not by the Quintet's performance as a mediator, and a figure of 40 percent therefore passes no verdict on the group by itself. Even so, the gap between representation and delivery is the present shape of the problem of converting regional voice into outcome. The resource the Quintet holds today is the capacity to keep the parties in one room; the ability to pay sits at other tables. There is a measurable test of that: if the appeal's funded share does not pass 40 percent while Haavisto continues his engagement, the case that sponsorship has not brought resources will be confirmed.", "refs": ["un-sudan"], "tr": "Buradan çıkan okuma şu: Afrika Birliği, IGAD ve Arap Ligi'nin Sudan dosyasında kazandığı şey temsil, henüz kazanmadığı şey ise kaynak. Karşı sav güçlü ve yazılmayı hak ediyor: Bir insani yardım çağrısının ne kadarının karşılanacağını, Beşli'nin arabuluculuk performansı değil bağışçı hükümetlerin bütçe kararları belirler. Yüzde 40'lık bir rakam bu nedenle grubun başarısı hakkında tek başına hüküm vermez. Yine de temsil ile teslimat arasındaki bu boşluk, bölgesel örgütlerin sesini sonuca çevirme sorununun bugünkü hâlidir. Beşli'nin şu an elinde bulunan kaynak, tarafları bir odada tutma kapasitesidir; ödeme gücü başka masalarda duruyor. Bunun ölçülebilir bir sınaması var: Haavisto'nun temaslarını sürdürdüğü bu dönemde çağrının karşılanma oranı yüzde 40'ın üzerine çıkmazsa, sponsorluğun kaynak getirmediği doğrulanmış olacaktır."}]}], "sources": [{"key": "un-sudan", "kind": "news", "name": "United Nations", "url": "https://press.un.org/en/2026/db260803.doc.htm", "title": {"tr": "BM, Sudan insani yardım çağrısının yüzde 40'ının karşılandığını bildirdi", "en": "The UN says Sudan's humanitarian appeal is just over 40 percent funded"}, "publishedDate": "2026-08-03"}], "title": {"en": "Four sponsors for Sudan's mediation and a budget at forty percent", "tr": "Sudan arabuluculuğunun dört sponsoru ve yüzde kırklık bir bütçe"}, "writer": "geo-05", "date": "2026-08-04"}, {"excerpt": {"en": "Reform UK presented its plan as the largest military operation in the Channel since World War II, and in doing so chose its own precedent. The nearer and more instructive year is 2020, and the difference between them sits in a payment agreement signed in April.", "tr": "Reform UK planını, İkinci Dünya Savaşı'ndan bu yana Manş'taki en büyük askerî operasyon diye tanıttı ve böylece emsali kendisi seçti. Daha yakın ve daha öğretici olan yıl 2020; aradaki fark ise nisanda imzalanan bir ödeme anlaşmasında duruyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The precedent the party chose", "tr": "Partinin seçtiği emsal"}, "ps": [{"en": "France 24 reported that Reform UK announced on Monday it would task the Royal Navy with returning small boats to France if it came to power. The party's home affairs spokesman, Zia Yusuf, described the plan as the largest military operation in the English Channel since World War II. The French interior ministry told AFP that the plan would be a violation of French sovereignty as well as a violation of maritime law and international law. Reform UK leader Nigel Farage tied the reasoning not to history but to the weekend: what happened in Ceuta, he said, showed just how serious the situation was.", "refs": ["reform-channel"], "tr": "France 24'ün aktardığına göre Reform UK pazartesi günü, iktidara gelmesi hâlinde küçük tekneleri Fransa'ya geri götürmek üzere Kraliyet Donanması'nı görevlendireceğini açıkladı. Partinin içişleri sözcüsü Zia Yusuf planı, Manş'ta İkinci Dünya Savaşı'ndan bu yana yapılacak en büyük askerî operasyon olarak tanımladı. Fransa İçişleri Bakanlığı AFP'ye planın Fransız egemenliğinin olduğu kadar deniz hukukunun ve uluslararası hukukun da ihlali olacağını bildirdi. Reform UK lideri Nigel Farage ise gerekçeyi tarihe değil, hafta sonuna bağladı: Ona göre Ceuta'da yaşananlar durumun ne kadar ciddi olduğunu gösteriyordu."}, {"en": "Before reaching for history one should try the present-day explanation, because it is usually enough. Reform led national polls for roughly eighteen months and that lead has disappeared in recent weeks. On Monday the parliamentary standards commissioner announced that he had opened an investigation a week earlier into an alleged failure by deputy leader Richard Tice to declare a financial interest; the separate inquiry into Farage was suspended when he resigned as an MP to trigger a by-election he is contesting; and London police are pursuing a probe into donations before the 2024 election. Implementing the plan, meanwhile, would require winning an election not due until 2029. With that picture, no historical mechanism is needed to explain the timing of the announcement.", "refs": ["reform-channel"], "tr": "Tarihe gitmeden önce bugünün açıklamasını denemek gerekir, çünkü çoğu zaman yeter. Reform yaklaşık on sekiz ay boyunca anketlerde önde gitti ve bu üstünlük son haftalarda kayboldu. Parlamento standartlar komiseri pazartesi günü, parti başkan yardımcısı Richard Tice hakkında bir mali çıkarı beyan etmediği iddiasıyla bir hafta önce soruşturma açtığını duyurdu; Farage hakkındaki ayrı soruşturma, kendisi bir ara seçimi tetiklemek için milletvekilliğinden istifa edince askıya alındı; Londra polisi de 2024 seçimi öncesi bağışlara ilişkin bir soruşturma yürütüyor. Planın hayata geçmesi içinse partinin, 2029'dan önce yapılması zorunlu olmayan bir seçimi kazanması şart. Bu tabloyla, duyurunun tarihini açıklamak için hiçbir tarihsel mekanizmaya ihtiyaç yok."}]}, {"h": {"en": "The nearer and more instructive year", "tr": "Daha yakın ve daha öğretici olan yıl"}, "ps": [{"en": "Even so, the precedent the party chose puts itself to the test. The same instrument was already proposed six years ago: in 2020 the Conservative government proposed such a policy and swiftly abandoned it. Since then the arrangement for interception in the Channel has become one of cooperation and payment; in April London signed a new three-year deal with Paris, agreeing to pay up to 766 million euros to strengthen French law enforcement. The British government says small-boat arrivals in the first half of 2026 fell by more than 42 percent year on year to just over 14,000, and yet July 29 brought the year's highest daily figure at 752. The answer to the why-now question lies between those two numbers: a falling annual trend and a single day that reopens the argument about it.", "refs": ["reform-channel"], "tr": "Yine de partinin seçtiği emsal kendi kendini sınıyor. Aynı araç altı yıl önce zaten önerilmişti: Muhafazakâr hükümet 2020'de böyle bir politikayı önerdi ve kısa sürede terk etti. O tarihten bu yana Manş'taki müdahale düzeni bir işbirliği ve ödeme düzenine dönüştü; Londra nisanda Paris'le üç yıllık yeni bir anlaşma imzalayarak Fransız kolluk kuvvetlerinin güçlendirilmesi için en fazla 766 milyon avro ödemeyi kabul etti. İngiliz hükümetine göre 2026'nın ilk yarısında küçük teknelerle gelenlerin sayısı yıllık bazda yüzde 42'den fazla azalarak 14.000'i biraz aştı; buna karşın 29 Temmuz'da 752 kişiyle yılın günlük en yüksek sayısına ulaşıldı. Sorunun neden şimdi kısmının cevabı bu iki rakamın arasında: Düşen bir yıllık eğilim ile onu tartışmaya açan tek bir gün."}, {"en": "The condition that breaks the analogy is here. When the instrument was proposed in 2020 there was no April agreement to be broken; today the same instrument is proposed against a partner already being paid up to 766 million euros to do the same job. That detail widens the difference rather than the resemblance: an idea abandoned in 2020 would, if abandoned in 2026, carry more than a political cost. What Ceuta recalls is the fragility of this arrangement — after tens of thousands crossed, European Commission President Ursula von der Leyen called for united action on border security, and EU interior ministers meet in emergency session on Tuesday. When one coastal arrangement collapses, the one next door built on payment becomes easier to question too. Which year supplies the precedent is therefore not a rhetorical question.", "refs": ["reform-channel", "ceuta-eu"], "tr": "Emsali çürüten koşul da burada. 2020'de bu araç önerildiğinde ortada bozulacak nisan anlaşması yoktu; bugün aynı araç, aynı işi yapması için halihazırda en fazla 766 milyon avro ödenen bir ortağa karşı öneriliyor. Bu, benzerliği değil farkı büyüten ayrıntıdır: 2020'de terk edilen bir fikir, 2026'da terk edilirse maliyeti yalnızca siyasi olmayacak. Ceuta'nın hatırlattığı şey de bu düzenin kırılganlığı — Avrupa Komisyonu Başkanı Ursula von der Leyen, on binlerce kişinin geçişinin ardından sınır güvenliğinde ortak hareket çağrısı yaptı ve AB içişleri bakanları salı günü acil olarak toplanacak. Bir kıyı düzeninin çökmesi, komşusunda ödeme yoluyla kurulmuş düzenin de sorgulanmasını kolaylaştırıyor. Emsalin hangi yıl olduğu, bu yüzden retorik bir soru değil."}]}], "sources": [{"key": "reform-channel", "kind": "news", "name": "France 24", "url": "https://www.france24.com/en/europe/20260803-hard-right-reform-uk-proposes-navy-led-operation-to-stop-small-migrant-boats", "title": {"tr": "Fransa, Reform UK'in Manş'ta donanma planını egemenlik ihlali saydı", "en": "France calls Reform UK's Channel navy plan a violation of its sovereignty"}, "publishedDate": "2026-08-03"}, {"key": "ceuta-eu", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cyvl84zmgyro", "title": {"tr": "Von der Leyen, Ceuta'nın ardından sınır güvenliğinde \"ortak hareket\" istedi", "en": "Von der Leyen calls for \"united action\" on border security after Ceuta"}, "publishedDate": "2026-08-03"}], "title": {"en": "Which year is the precedent in the Channel, 1940 or 2020?", "tr": "Manş'ta hangi yıl emsal, 1940 mı 2020 mi?"}, "writer": "geo-06", "date": "2026-08-04"}, {"excerpt": {"en": "The Board of Peace published a fifteen-point implementation plan on Friday. Two days later its representative for Gaza wrote that the strikes had killed civilians and destroyed the medicines people rely on. The plan assigns obligations to both sides. It does not say who checks that they are met.", "tr": "Barış Kurulu cuma günü on beş maddelik bir uygulama planı yayımladı. İki gün sonra kurulun Gazze temsilcisi, saldırıların sivilleri öldürdüğünü ve ilaç stoklarını yok ettiğini yazdı. Plan iki tarafa da yükümlülük veriyor; bu yükümlülüğü kimin denetleyeceğini yazmıyor."}, "sections": [{"h": {"en": "The plan published on Friday", "tr": "Cuma günü yayımlanan plan"}, "ps": [{"en": "The fifteen-point roadmap the Board of Peace published on Friday divides the last stage of the ceasefire between the two sides: Hamas is to hand its weapons gradually to a Palestinian administration, and Israel is to begin withdrawing from Gaza before Hamas has fully disarmed. Nickolay Mladenov, the Board's High Representative for Gaza, named Egypt, Turkey, Qatar and the United States as the mediators and said both parties carry obligations under the comprehensive plan and the Sharm El Sheikh arrangement. Two days later the same representative wrote that strikes across Gaza had killed civilians and destroyed the medical supplies people depend on.", "refs": ["bop-envoy", "gaza-strikes"], "tr": "Barış Kurulu'nun cuma günü yayımladığı on beş maddelik yol haritası, ateşkesin son aşamasını iki tarafa bölüştürüyor: Hamas silahlarını kademeli olarak bir Filistin yönetimine devredecek, İsrail ise Hamas tümüyle silahsızlanmadan önce Gazze'den çekilmeye başlayacak. Kurulun Gazze Yüksek Temsilcisi Nickolay Mladenov, arabulucular olarak Mısır, Türkiye, Katar ve ABD'yi andı ve iki tarafın da kapsamlı plan ile Şarm El-Şeyh düzenlemesi altında yükümlülük taşıdığını belirtti. İki gün sonra aynı temsilci, Gazze genelindeki saldırıların sivilleri öldürdüğünü ve insanların bağımlı olduğu ilaç stoklarını yok ettiğini yazdı."}, {"en": "What kind of document is this? It distributes obligations, but it defines no body to inspect them, no penalty that operates on breach and no timetable showing by when a step must have been taken. The office set up to carry it holds a single instrument: a public account of what happened. Binding instruments look different from that; a monitoring team with a right of access, a permit that can be withdrawn, a payment that can be stopped.", "refs": ["bop-envoy"], "tr": "Bu ne tür bir belgedir? Yükümlülük dağıtıyor, ama denetleyecek bir organ, ihlal hâlinde işleyecek bir yaptırım ya da bir adımın hangi tarihe kadar atılmış olması gerektiğini gösteren bir takvim tanımlamıyor. Onu yürütmek üzere kurulan makamın elinde tek bir araç var: olan bitenin kamuya anlatılması. Bağlayıcı araçlar bundan farklı görünür; erişim yetkisi olan bir gözlemci heyeti, geri alınabilen bir izin, kesilebilen bir ödeme gibi."}]}, {"h": {"en": "The order each side reads", "tr": "İki tarafın okuduğu sıra"}, "ps": [{"en": "On the Israeli side, Netanyahu's spokesman Doron Spielman said disarming means physically handing over the weapons and that nothing less would do, repeating that Israel would not withdraw until Hamas had fully disarmed; Energy Minister Eli Cohen told Army Radio there was no deal to halt the attacks. Senior Hamas official Basem Naim said the group had shown considerable flexibility and tied any handover to Israel stopping its operations and pulling back. The same text is being read in the two capitals in opposite orders.", "refs": ["gaza-strikes", "bop-envoy"], "tr": "İsrail tarafında Netanyahu'nun sözcüsü Doron Spielman, silahsızlanmanın silahların fiilen teslim edilmesi anlamına geldiğini, bundan azının kabul edilmeyeceğini söyledi ve İsrail'in Hamas tümüyle silah bırakmadan çekilmeyeceğini yineledi; Enerji Bakanı Eli Cohen ordu radyosuna saldırıları durduran bir anlaşma bulunmadığını söyledi. Hamas'ın üst düzey yetkilisi Basem Naim ise örgütün önemli ölçüde esneklik gösterdiğini savundu ve teslimi İsrail'in operasyonları durdurmasına ve geri çekilmesine bağladı. Aynı metin, iki başkentte birbirinin tersi sırayla okunuyor."}, {"en": "With no agreed first move and no body to certify it, the only instrument the implementing office can use is a public statement. There is another possible explanation: the Board may hold leverage that does not become public, exercised through Washington and the three mediators, in which case the post is an opening move rather than the ceiling of its authority. The way to tell them apart is to watch for a mechanism with a name.", "refs": ["bop-envoy"], "tr": "Üzerinde uzlaşılmış bir ilk adım da, o adımı doğrulayacak bir merci de yoksa, uygulamayı yürüten makamın kullanabildiği tek araç kamuoyuna açıklama olarak kalıyor. Bunun bir başka açıklaması da mümkün: Kurul, Washington ve üç arabulucu üzerinden kamuya yansımayan bir baskı gücü taşıyor olabilir; o durumda paylaşım yetkinin sınırı değil, bir açılış hamlesidir. İkisini ayırmanın yolu, adı konmuş bir mekanizmanın ortaya çıkıp çıkmadığına bakmak."}]}, {"h": {"en": "Where the authority would become visible", "tr": "Yetkinin görünür hâle geleceği yer"}, "ps": [{"en": "The next real indicator will therefore not be a statement but a named arrangement: a monitoring team with defined access, a first step with a date attached, or one of the parties publicly accepting a sequence it had rejected. If none of these appears by 30 September, there is no ground for expecting the Hamas handover of weapons to begin while the strikes continue. In the meantime the counts accumulate: Palestinian medics reported at least 18 killed on Sunday, and Gaza health authorities say more than 1,230 Palestinians have died since the October ceasefire, alongside four Israeli soldiers in the same period.", "refs": ["gaza-strikes", "bop-envoy"], "tr": "Bu yüzden sıradaki asıl gösterge bir açıklama değil, adı konmuş bir düzenek olacak: erişim yetkisi tanımlanmış bir gözlem heyeti, tarihi belirlenmiş bir ilk adım ya da taraflardan birinin daha önce reddettiği sıralamayı açıkça kabul etmesi. Bunlardan biri 30 Eylül'e kadar ortaya çıkmazsa, saldırılar sürerken Hamas'ın silah devrini beklemek için bir dayanak kalmıyor. Arada sayılar birikiyor: Filistinli sağlık görevlilerine göre pazar günü en az 18 kişi öldü, Gazze sağlık makamlarına göre ekimdeki ateşkesten bu yana 1.230'dan fazla Filistinli, aynı dönemde dört İsrail askeri hayatını kaybetti."}]}], "sources": [{"key": "bop-envoy", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/board-of-peace-envoy-laments-recent-gaza-strikes-amid-effort-to-implement-trump-plan/", "title": {"tr": "Barış Kurulu'nun Gazze temsilcisi, saldırıların ilaç stoklarını yok ettiğini söyledi", "en": "The Board of Peace representative for Gaza says the strikes destroyed medical supplies"}, "publishedDate": "2026-08-03"}, {"key": "gaza-strikes", "kind": "news", "name": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/08/israeli-strikes-kill-18-gaza-minister-says-no-deal-halt-attacks", "title": {"tr": "Gazze'de en az 18 kişi öldü, İsrailli bakan saldırıları durduran bir anlaşma olmadığını söyledi", "en": "At least 18 killed in Gaza as an Israeli minister says no deal halts the attacks"}, "publishedDate": "2026-08-02"}], "title": {"en": "Which authority is meant to enforce the roadmap?", "tr": "Yol haritasını hangi makam uygulatacak?"}, "writer": "geo-01", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Flights and consular services between Caracas and Santo Domingo resumed six months ago. What was announced on Sunday is a roadmap, to be drawn up by mutual agreement, for talking about normalisation rather than the thing itself. The question that severed the relationship remains deferred.", "tr": "Caracas ile Santo Domingo arasında uçuşlar ve konsolosluk hizmetleri altı ay önce yeniden başlamıştı. Pazar günü açıklanan şey normalleşmenin kendisi yerine, onu görüşmek için ortak mutabakatla hazırlanacak bir yol haritası. İlişkiyi kesen soru ise hâlâ ertelenmiş durumda."}, "sections": [{"h": {"en": "The practical layer first, the political layer after", "tr": "Önce pratik katman, sonra siyasi katman"}, "ps": [{"en": "The sequence is worth noticing. Flights between the two capitals and consular services resumed in February 2026. The step announced by Venezuela's foreign ministry on Sunday is a roadmap, to be drawn up by mutual agreement, for talks on the gradual normalisation of diplomatic and consular relations. The movement of people, in other words, was restored before anyone addressed the recognition dispute that broke the relationship.", "refs": ["caracas-santodomingo"], "tr": "Sıralamaya dikkat etmek gerekiyor. İki başkent arasındaki uçuşlar ve konsolosluk hizmetleri şubat 2026'da yeniden başladı. Pazar günü Venezuela Dışişleri Bakanlığı'nın duyurduğu adım ise diplomatik ve konsolosluk ilişkilerinin kademeli olarak normalleşmesine dönük görüşmeler için ortak mutabakatla hazırlanacak bir yol haritası. Yani insanların hareketi, ilişkiyi kesen tanıma sorunu ele alınmadan önce yeniden kuruldu."}, {"en": "In one pan Caracas recovers a channel it had lost. In the other Santo Domingo gives up nothing it would have to defend at home, because a roadmap for talks commits no one to any act of recognition. What is deferred is precisely the question that cut the relationship: the Dominican Republic joining dozens of states in refusing to recognise the 2024 election result, which it treated as fraudulent.", "refs": ["caracas-santodomingo"], "tr": "Bir kefede Caracas kaybettiği bir kanalı geri kazanıyor. Öbür kefede Santo Domingo, iç kamuoyuna karşı savunmak zorunda kalacağı bir şeyden vazgeçmiş olmuyor; görüşme yol haritası kimseyi bir tanıma işlemine bağlamıyor. Ertelenen şey tam da ilişkiyi kesen sorunun kendisi: Dominik Cumhuriyeti'nin 2024 seçim sonucunu hileli sayarak tanımayan onlarca ülkeye katılması."}]}, {"h": {"en": "A text issued from one capital", "tr": "Tek başkentten çıkan metin"}, "ps": [{"en": "The statement that was published is Venezuela's. One party's announcement establishes that party's position, not a mutual commitment, and no Dominican statement appeared in the report. The nearest explanation for the political layer moving now is that the interlocutor has changed rather than the dispute: Delcy Rodriguez is serving as Venezuela's interim president. There is an alternative: Santo Domingo may simply have judged the practical value of consular traffic to outweigh the symbolic cost, in which case the party that moved is the Dominican Republic rather than Caracas.", "refs": ["caracas-santodomingo"], "tr": "Yayımlanan açıklama Venezuela'nın açıklaması. Tek tarafın duyurusu o tarafın konumunu belgeler, karşılıklı bir taahhüdü belgelemez. Habere Dominik Cumhuriyeti'nden bir açıklama yansımadı. Siyasi katmanın şimdi hareket etmesinin en yakın açıklaması, anlaşmazlığın değil muhatabın değişmiş olması: Venezuela'da geçiş dönemi devlet başkanlığını Delcy Rodriguez yürütüyor. Bunun bir alternatifi de var: Santo Domingo, konsolosluk pratiğinin faydasını simgesel maliyetten ağır bulmuş olabilir; o zaman değişen taraf Caracas değil, Dominik Cumhuriyeti'dir."}, {"en": "A rebuilt relationship has countable markers: ambassadors appointed on both sides, a text carrying two signatures, a date attached to implementation. Sunday's announcement contains none of them. That is not a failure; it simply shows that opening a channel and restoring recognition are separate transactions.", "refs": ["caracas-santodomingo"], "tr": "Yeniden kurulmuş bir ilişkinin sayılabilir işaretleri bellidir: karşılıklı atanan büyükelçiler, iki imzalı bir metin, uygulamaya bağlanmış bir tarih. Pazar günkü duyuruda bunların hiçbiri yok. Bu bir başarısızlık sayılmaz. Yalnızca bir kanalın açılması ile bir tanımanın geri verilmesinin ayrı işlemler olduğunu gösteriyor."}]}, {"h": {"en": "What comes next", "tr": "Sırada ne var"}, "ps": [{"en": "The rest is easy to measure. If no text carrying two signatures is published and no heads of mission are appointed on both sides by the end of October, Sunday's step will have been a channel of communication rather than a normalisation. The channel is not nothing; two governments being able to reach each other is a gain independent of whether the dispute is settled. But it is early to say a balance has been struck.", "refs": ["caracas-santodomingo"], "tr": "Bundan sonrasını ölçmek kolay. Ekim sonuna kadar iki imzalı bir metin yayımlanmaz ya da misyon şefleri karşılıklı olarak atanmazsa, pazar günkü adım bir normalleşme yerine bir iletişim kanalı olarak kalacak. Kanalın kendisi de küçümsenecek bir şey sayılmaz. İki hükümetin birbirine ulaşabilmesi, anlaşmazlığın çözülmesinden bağımsız bir kazanç. Ama denge kuruldu demek için erken."}]}], "sources": [{"key": "caracas-santodomingo", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/venezuela-and-the-dominican-republic-say-they-will-work-to-restore-ties", "title": {"tr": "Venezuela ile Dominik Cumhuriyeti, ilişkileri kademeli olarak normalleştirmek için yol haritasında anlaştı", "en": "Venezuela and the Dominican Republic agree a roadmap for gradual normalisation"}, "publishedDate": "2026-08-02"}], "title": {"en": "The flights came back in February and the ambassadors still have not", "tr": "Uçuşlar şubatta döndü, büyükelçiler hâlâ dönmedi"}, "writer": "geo-02", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "What Tehran saw was the force assembling. What it did not see was what it was being asked to do in return. The parties Trump named in the announcement were Saudi Arabia, the United Arab Emirates and Qatar; the concrete step the US wants from Tehran went unmentioned.", "tr": "Tahran'ın gördüğü şey kuvvetin toplanmasıydı. Görmediği şey, karşılığında ne yapması istendiği. Duyuruda Trump'ın andığı taraflar Suudi Arabistan, Birleşik Arap Emirlikleri ve Katar'dı; ABD'nin Tahran'dan istediği somut adım anılmadı."}, "sections": [{"h": {"en": "What was seen was the force assembling", "tr": "Görülen şey kuvvetin toplanmasıydı"}, "ps": [{"en": "Trump said the plan was for the biggest attack since the Second World War and that Tehran knew its scale because it had watched the preparation take shape. That is an observable: the other side can count aircraft, ships and munitions on the move. He then stopped the operation and announced that negotiations would open on Monday afternoon, without naming a venue or the participants.", "refs": ["iran-talks"], "tr": "Trump, planın İkinci Dünya Savaşı'ndan bu yana en büyük saldırı olduğunu, Tahran'ın kapsamını bildiğini, çünkü hazırlığı oluşurken gördüğünü söyledi. Bu bir gözlenebilir veridir: karşı taraf uçak, gemi ve mühimmat hareketini sayabilir. Ardından harekâtı durdurdu ve müzakerelerin pazartesi öğleden sonra başlayacağını duyurdu; görüşmenin yerini ve katılımcılarını bildirmedi."}, {"en": "Capability is the honest half of a signal. The other half, the demand, was left open. The announcement said a deal on Hormuz was expected first and a nuclear deal after it, but not which behaviour Tehran must stop or by what date it must act. A threat with no condition attached does not tell the other side what to give up. Deterrence requires the protected interest, the cost to be imposed and the behaviour that triggers it to be described together.", "refs": ["iran-talks"], "tr": "Kabiliyet, sinyalin dürüst yarısıdır. Öteki yarısı talep, bu kez açık bırakıldı. Duyuruda önce Hürmüz'de, ardından nükleer başlıkta bir anlaşma beklendiği söylendi; Tahran'ın hangi davranışı durdurması ya da hangi tarihe kadar ne yapması gerektiği söylenmedi. Koşula bağlanmamış bir tehdit, karşı tarafa neyi bırakması gerektiğini anlatmaz. Caydırıcılık ise korunan çıkarın, yüklenecek maliyetin ve maliyeti tetikleyecek davranışın birlikte tarif edilmesini gerektirir."}]}, {"h": {"en": "It was not Tehran that stopped it", "tr": "Durduran taraf Tahran değildi"}, "ps": [{"en": "By Trump's own account the request to drop the strike came from Saudi Arabia, the United Arab Emirates and Qatar, and Crown Prince Mohammed bin Salman warned of unintended consequences. The plainest conclusion is that the US decision to halt the strike protected those three countries from the second-order effects of an attack rather than buying any change in Iranian behaviour. Another reading is available: talks on the Oman channel over a new route through the strait are described as near completion, and the request from the three capitals may be the presentable face of a concession made in Tehran.", "refs": ["iran-talks"], "tr": "Kendi anlatımına göre Trump'a vazgeçme talebi Suudi Arabistan, Birleşik Arap Emirlikleri ve Katar'dan geldi; Veliaht Prens Muhammed bin Selman istenmeyen sonuçlara karşı uyardı. Buradan çıkan en yalın sonuç, ABD'nin saldırıyı durdurmasının bu üç devleti bir saldırının ikinci halka etkilerinden koruduğu, İran'ın davranışında bir değişiklik satın almadığıdır. Başka bir okuma da mümkün: Umman kanalında boğazdan geçecek yeni bir güzergâh üzerindeki görüşmeler sona yaklaşıyor; üç başkentin talebi, Tahran'ın verdiği bir tavizin sunulabilir yüzü olabilir."}, {"en": "The oil move measures expectation, not posture. Brent fell $4.08 to $83.85 and WTI fell $4.01 to $80.66. Prices dropped because a strike did not happen. They show no change in the status of the strait; since the war began on 28 February, Iran has tightened its control of the waterway and an earlier ceasefire that included reopening it did not hold.", "refs": ["iran-talks"], "tr": "Petrolün hareketi bir beklenti ölçüsüdür, duruş ölçüsü değil. Brent 4,08 dolar düşerek 83,85 dolar düzeyine, WTI 4,01 dolar düşerek 80,66 dolar düzeyine indi. Fiyat, bir saldırı olmadığı için geriledi. Boğazın statüsünde bir değişiklik olduğunu göstermiyor; savaşın 28 Şubat'ta başlamasından bu yana İran suyolu üzerindeki denetimini sıkılaştırdı ve boğazın yeniden açılmasını içeren önceki ateşkes yürümedi."}]}, {"h": {"en": "Monday's narrow test", "tr": "Pazartesinin dar sınavı"}, "ps": [{"en": "The test on Monday afternoon should therefore be kept narrow. Iranian foreign ministry spokesperson Esmaeil Baghaei said the talks with Oman concern a new route and are separate from the question of the strait being opened or closed. The measurable outcome is whether a text appears that sets out the route's coordinates, who operates it and the date it opens. If no such text emerges by the end of August, the attack that was called off remains a deferred option rather than a negotiating gain.", "refs": ["iran-talks"], "tr": "Bu yüzden pazartesi öğleden sonrasının sınavı dar tutulmalı. İran Dışişleri sözcüsü İsmail Bakai, Umman'la yürütülen görüşmelerin boğazın açılması ya da kapatılması tartışmasından ayrı, yeni bir güzergâh üzerinde olduğunu söyledi. Ölçülebilir sonuç, güzergâhın koordinatlarını, kimin işleteceğini ve hangi tarihte açılacağını yazan bir metnin ortaya çıkıp çıkmadığıdır. Ağustos sonuna kadar böyle bir metin görünmezse, geri alınan saldırı bir müzakere kazanımı değil, ertelenmiş bir seçenek olarak kalır."}]}], "sources": [{"key": "iran-talks", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-says-new-round-of-iran-talks-will-begin-monday", "title": {"tr": "Trump, İran'la müzakerelerin pazartesi öğleden sonra başlayacağını söyledi", "en": "Trump says talks with Iran will open on Monday afternoon"}, "publishedDate": "2026-08-02"}], "title": {"en": "Calling off an attack is not the same as imposing a cost", "tr": "Bir saldırının geri alınması bir bedel değildir"}, "writer": "geo-03", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The Federal Register notice of 3 August adds 43 entities to the forced-labour list. Four of them go onto the sub-list for entities that move workers, and forty-one onto the sub-list for facilities sourcing inputs from Xinjiang. The point where the instrument bites shifts from the factory to the customs entry.", "tr": "Federal Register'ın 3 Ağustos tarihli bildirimi, zorla çalıştırma listesine 43 kuruluş ekliyor. Bunların dördü işçi taşıyan kuruluşları, kırk biri Sincan'dan girdi temin eden tesisleri kapsayan alt listeye giriyor. Aracın değdiği yer fabrikadan gümrük beyanına kayıyor."}, "sections": [{"h": {"en": "Which part of the list they were written onto", "tr": "Listenin hangi bölümüne yazıldılar"}, "ps": [{"en": "The notice (Volume 91, Number 147, pages 48913-48920) writes four entities onto the section 2(d)(2)(B)(ii) sub-list, which identifies entities working with the government of the Xinjiang Uyghur Autonomous Region to recruit, transport or receive workers. Forty-one go onto the section 2(d)(2)(B)(v) sub-list, which covers facilities sourcing inputs from Xinjiang, or from persons working with the Xinjiang government or the Xinjiang Production and Construction Corps under the poverty alleviation and pairing-assistance schemes. Two entities appear on both sub-lists, and two existing entries are technically corrected.", "refs": ["uflpa-notice"], "tr": "Bildirim (Cilt 91, Sayı 147, sayfa 48913-48920) dört kuruluşu, Sincan Uygur Özerk Bölgesi yönetimiyle çalışarak işçi toplayan, taşıyan ya da devralan kuruluşları tanımlayan 2(d)(2)(B)(ii) alt listesine yazıyor. Kırk bir kuruluş ise Sincan'dan ya da Sincan yönetimiyle veya Sincan Üretim ve İnşaat Kolordusu ile çalışan kişilerden yoksullukla mücadele ve eşleştirilmiş yardım programları kapsamında girdi temin eden tesisleri kapsayan 2(d)(2)(B)(v) alt listesine giriyor. İki kuruluş her iki alt listede birden yer alıyor; ayrıca listedeki mevcut iki girişte teknik düzeltme yapılıyor."}, {"en": "The ratio is the real information in this round. Forty-one of the forty-five placements were made in the section that looks at where an input came from rather than where labour was used. What is covered stops being a workforce and becomes a material, and a material is defined not at the factory but several tiers up the supply chain.", "refs": ["uflpa-notice"], "tr": "Oran bu turun asıl bilgisidir. Kırk beş yerleştirmenin kırk biri, işçinin nerede çalıştırıldığına değil, girdinin nereden geldiğine bakan bölüme yapılmış. Kapsanan şey bir işgücü olmaktan çıkıp bir malzeme hâline geliyor; malzeme ise fabrikada değil, tedarik zincirinin birkaç kat yukarısında tanımlanıyor."}]}, {"h": {"en": "The point of payment is the customs entry", "tr": "Ödemenin yapıldığı nokta gümrük beyanı"}, "ps": [{"en": "Under section 3(a) of the act and 19 U.S.C. 1307, since 21 June 2022 the Commissioner of Customs and Border Protection presumes that goods mined, produced or manufactured by listed entities are made with forced labour and bars them from entry. The burden of rebutting that presumption sits with the importer. The point of enforcement therefore moves from the facility in China to the declaration at the US border, and the party that must produce documents becomes the company buying the goods rather than the listed supplier.", "refs": ["uflpa-notice"], "tr": "Yasanın 3(a) maddesi ve 19 U.S.C. 1307 uyarınca, 21 Haziran 2022'den bu yana Gümrük ve Sınır Koruma Komiserliği listedeki kuruluşların çıkardığı, ürettiği ya da imal ettiği malların zorla çalıştırmayla üretildiğini varsayıyor ve girişini yasaklıyor. Varsayımın aksini kanıtlama yükü ithalatçıda. Uygulama noktası bu nedenle Çin'deki tesis yerine ABD sınırındaki beyan oluyor. Belgeyi üretmesi gereken taraf da listelenen tedarikçi yerine malı satın alan şirket."}, {"en": "Because the burden sits with the buyer and the new placements were made upstream, the cost of this round shows up as traceability rather than volume: a firm can change supplier, but it must be able to document the change several tiers up. There is an alternative: for large importers that have run supplier audits for years, the marginal cost of the additions may be close to zero, in which case the effect concentrates not on trade totals but on small importers who cannot see the upper tiers of the chain.", "refs": ["uflpa-notice"], "tr": "Yük alıcıda olduğu ve yeni yerleştirmeler zincirin yukarısına yapıldığı için bu turun maliyeti hacimden çok izlenebilirlikte ortaya çıkıyor: bir firma tedarikçi değiştirebilir, ama değiştirdiğini birkaç kat yukarıya kadar belgeleyebilmek zorunda. Bunun bir alternatifi var: uzun süredir tedarikçi denetimi yürüten büyük ithalatçılar için ek yerleştirmelerin getirdiği ek maliyet sıfıra yakın olabilir; o durumda etki ticaret hacminde değil, zincirin üst katlarını göremeyen küçük ithalatçılarda yoğunlaşır."}]}, {"h": {"en": "Where this addition will be measured", "tr": "Bu ekin ölçüleceği yer"}, "ps": [{"en": "The task force that manages the list was established by section 741 of the United States-Mexico-Canada Agreement Implementation Act; the Department of Homeland Security chairs it, with the Office of the US Trade Representative and the Departments of Labor, State, Justice, the Treasury and Commerce as members. That two entries were technically corrected in this same notice shows where removal and correction become visible. The measure is this: will the next notice published before the end of the year carry only additions, or removals as well? If it carries only additions, the instrument is operating as a one-way list rather than as a compliance gate.", "refs": ["uflpa-notice"], "tr": "Listeyi yöneten görev gücü, ABD-Meksika-Kanada Anlaşması Uygulama Yasası'nın 741. maddesiyle kuruldu; başkanlığını İç Güvenlik Bakanlığı yürütüyor, Ticaret Temsilciliği ile Çalışma, Dışişleri, Adalet, Hazine ve Ticaret bakanlıkları üye. Aynı bildirimde iki girişin teknik olarak düzeltilmiş olması, listeden çıkışın ve düzeltmenin görünür yolu olduğunu gösteriyor. Ölçü şu: yıl sonuna kadar yayımlanacak bir sonraki bildirim yalnızca ekleme mi taşıyacak, yoksa çıkarma da mı? Yalnızca ekleme taşırsa, araç bir uyum kapısı yerine tek yönlü bir liste olarak işliyor demektir."}]}], "sources": [{"key": "uflpa-notice", "kind": "news", "name": "Federal Register", "url": "https://www.federalregister.gov/documents/full_text/text/2026/08/03/2026-15628.txt", "title": {"tr": "Zorla çalıştırma listesine 43 şirket eklendi, 41'i tedarik alt listesine girdi", "en": "Forty-three firms join the forced-labour list, 41 of them on the sourcing sub-list"}, "publishedDate": "2026-08-03"}], "title": {"en": "Forty-one of the forty-three entities were written onto the sourcing sub-list", "tr": "Kırk üç kuruluşun kırk biri tedarik alt listesine yazıldı"}, "writer": "geo-04", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "At the convention in Sao Paulo the names listed over rare earths were China, the United States and France. A state that names one rival is picking a side; a state that names all of them is keeping its options open. In a possible runoff in October the gap is five points.", "tr": "Sao Paulo'daki kurultayda ender toprak elementleri için sıralanan isimler Çin, ABD ve Fransa'ydı. Tek bir rakip anan devlet taraf seçer; hepsini anan devlet seçeneklerini açık tutar. Ekimdeki ikinci turda aradaki fark beş puan."}, "sections": [{"h": {"en": "The list that came out of the convention hall", "tr": "Kurultay salonundan çıkan liste"}, "ps": [{"en": "Luiz Inacio Lula da Silva told the Workers' Party convention in Sao Paulo that he was running for the presidency for a seventh time and that a win in October would be his last term. The weight of the speech lay not on his domestic record but on two demands: higher defence spending, and keeping rare earths and other critical minerals out of foreign control. China, the United States and France, he said, would not reach those resources without respecting the country's sovereignty.", "refs": ["lula-campaign"], "tr": "Luiz Inacio Lula da Silva, İşçi Partisi'nin Sao Paulo'daki kurultayında yedinci kez başkanlığa aday olduğunu açıkladı ve ekim seçimini kazanırsa bunun son dönemi olacağını söyledi. Konuşmasının ağırlığı iç siyaset sicilinde değil, savunma harcamalarının artırılması ile ender toprak elementleri ve diğer kritik minerallerin yabancı denetimine geçmemesi taleplerindeydi. Çin'in, ABD'nin ve Fransa'nın bu kaynaklara ülkenin egemenliğine saygı göstermeden erişemeyeceğini söyledi."}, {"en": "The number of capitals named says more than the sentence does. A state that intends to sell access to one bloc sets a single rival against itself. A state that names all three has priced the resource for no one yet and has kept the order of play in its own hands. What Brazil is doing here amounts to attaching the moment of choice to its own calendar rather than declining to choose.", "refs": ["lula-campaign"], "tr": "Anılan başkentlerin sayısı, cümlenin kendisinden daha çok şey söylüyor. Erişimi bir bloka satmayı düşünen bir devlet karşısına bir rakip koyar. Üçünü birden sayan devlet ise kaynağı henüz kimseye fiyatlamamış, sırayı kendinde tutmuş oluyor. Brezilya'nın burada yaptığı şey taraf seçmemek sayılmaz; yaptığı, seçme anını kendi takvimine bağlamak."}]}, {"h": {"en": "The work the same sentence does at home", "tr": "Aynı cümlenin içeride gördüğü iş"}, "ps": [{"en": "The sentence also has an audience at home. The United States imposed two rounds of tariffs on Brazilian goods in July, and the Brazilian government rejected the unfair-trade grounds. Lula's main challenger is Senator Flavio Bolsonaro, 45, who became the right's leading candidate after his father was convicted of plotting to overturn the 2022 election result. Datafolha puts Lula ahead 48 percent to 43 in a possible runoff. Leonardo Paz, a political scientist at the Getulio Vargas Foundation, told AFP that the sovereignty message lets the president name an adversary outside the country.", "refs": ["lula-campaign"], "tr": "Bu cümlenin bir de iç muhatabı var. ABD temmuzda Brezilya mallarına iki tur gümrük vergisi uyguladı ve Brezilya hükümeti haksız ticaret gerekçesini reddetti. Lula'nın başlıca rakibi, babası 2022 seçim sonucunu bozmayı planlamaktan hüküm giydikten sonra sağın önde gelen adayı hâline gelen 45 yaşındaki Senatör Flavio Bolsonaro. Datafolha, olası ikinci turda Lula'yı yüzde 48'e 43 önde gösteriyor. Getulio Vargas Vakfı'ndan siyaset bilimci Leonardo Paz, AFP'ye egemenlik söyleminin başkana dışarıda bir hasım tarif etme olanağı verdiğini söyledi."}, {"en": "At a five-point margin most of the load this message carries belongs to domestic politics: it converts external pressure into a question on the ballot. Another reading is available. The position on critical minerals may reflect an industrial-policy choice that predates the tariffs, in which case the campaign is describing a policy rather than carrying it. What will separate the two is whether the position survives past October.", "refs": ["lula-campaign"], "tr": "Beş puanlık bir farkta bu söylemin taşıdığı yükün büyük bölümü iç siyasete ait: dışarıdan gelen bir baskıyı sandık sorusuna çeviriyor. Başka bir okuma da var. Kritik mineraller üzerindeki tutum, gümrük vergilerinden önce başlamış bir sanayi politikası tercihini yansıtıyor olabilir; o zaman kampanya politikayı taşımıyor, politikayı anlatıyordur. İkisini ayıracak olan, tutumun ekimden sonra da sürüp sürmediği."}]}, {"h": {"en": "The measurable part of the promise", "tr": "Vaadin ölçülebilir kısmı"}, "ps": [{"en": "For now there is a demand rather than a commitment. A call for higher defence spending is not a budget line, and a promise to protect minerals is not a licence condition. For it to become measurable, one of three things has to appear: an export restriction, a condition added to mining licences, or money set aside in the defence budget. Meanwhile the government's weak points remain where they were; rising living costs, the public deficit and crime are the areas the sovereignty message does not cover.", "refs": ["lula-campaign"], "tr": "Şimdilik ortada bir taahhüt yerine bir talep var. Savunma harcamalarının artırılması çağrısı bir bütçe kalemi anlamına gelmiyor, minerallerin korunacağı söz de bir ruhsat koşulu sayılmıyor. Ölçülebilir hâle gelmesi için üçünden birinin görünmesi gerekiyor: bir ihracat kısıtı, madencilik ruhsatlarına eklenen bir şart ya da savunma bütçesinde ayrılmış bir kaynak. Bu arada hükümetin zayıf başlıkları yerinde duruyor; artan yaşam maliyeti, kamu açığı ve suç, egemenlik söyleminin kapatmadığı alanlar."}]}], "sources": [{"key": "lula-campaign", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/brazils-lula-launches-fourth-term-bid-focuses-on-national-sovereignty", "title": {"tr": "Lula, dördüncü dönem adaylığını egemenlik vurgusuyla açıkladı", "en": "Lula launches a fourth-term bid built on sovereignty"}, "publishedDate": "2026-08-02"}], "title": {"en": "Lula named three capitals at once", "tr": "Lula üç başkenti birden saydı"}, "writer": "geo-05", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "At the centre of two months of protest in Rawalakot lies not a list of demands but an arrangement said never to have been carried out. Bargains between a centre and a periphery usually survive not on the signature but on the mechanism that follows it.", "tr": "Rawalakot'ta iki aydır süren gösterilerin merkezinde bir talep listesi değil, uygulanmadığı söylenen bir düzenleme var. Merkez ile çevre arasındaki pazarlıklar çoğu zaman imzayla değil, imzanın izlendiği mekanizmayla ayakta kalır."}, "sections": [{"h": {"en": "What happened after the signature", "tr": "İmzadan sonra ne oldu"}, "ps": [{"en": "The BBC said it was the first news organisation to enter Rawalakot in Pakistan-administered Kashmir. In a region of about 4.5 million people, dozens have been killed in clashes over two months; a doctor whose name was changed said he had treated 50 to 60 critically injured people since 27 July, 15 to 20 of them with gunshot wounds. The Joint Awami Action Committee's demands gather under affordable flour, electricity and basic rights, and the committee says an arrangement signed with the Pakistani and regional governments in October has not been carried out. The regional government rejects that.", "refs": ["rawalakot"], "tr": "BBC, Pakistan yönetimindeki Keşmir'in Rawalakot kentine giren ilk haber kuruluşu olduğunu bildirdi. Yaklaşık 4,5 milyon nüfuslu bölgede iki ayda onlarca kişi çatışmalarda öldü; adı değiştirilen bir hekim 27 Temmuz'dan bu yana 50 ila 60 ağır yaralıya baktığını, bunların 15 ila 20'sinin ateşli silah yarası taşıdığını söyledi. Ortak Awami Eylem Komitesi'nin talepleri ucuz un, elektrik ve temel haklar başlıklarında toplanıyor; komite, ekim ayında Pakistan ve bölge hükümetleriyle imzalanan düzenlemenin uygulanmadığını savunuyor, bölge hükümeti bunu reddediyor."}, {"en": "Arrangements signed between a centre and a periphery rest not on the paper but on the machinery built after it: who sets the price, which budget line the money comes from, who inspects delivery. When those three are not written down, a signature becomes a date rather than an institution. Ten months on, the argument in Rawalakot turns on whether the arrangement was carried out at all rather than on what it contained.", "refs": ["rawalakot"], "tr": "Bir merkez ile bir çevre arasında imzalanan düzenlemeler kâğıttan çok, kâğıdın ardından kurulan mekanizmaya dayanır: fiyatı kimin belirlediği, bütçenin hangi kalemden çıktığı, uygulamayı kimin denetlediği. Bu üçü yazılmadığında imza bir tarih olur, bir kurum olmaz. Rawalakot'ta on ay sonra tartışılan şey de düzenlemenin içeriği değil, uygulanıp uygulanmadığı."}]}, {"h": {"en": "Why now", "tr": "Neden şimdi"}, "ps": [{"en": "The nearest factor explaining the timing is that local elections are under way in the region. An election reopens an uncarried arrangement for bargaining, because the ballot is one of the few calendars on which a periphery can reach a centre. The alternative explanation is also available: the regional government says the committee is armed and set on disrupting the polls, and the committee was banned in June and labelled a foreign-funded terrorist organisation, which it rejects. On that reading the election is a target rather than an opportunity. What will separate the two is whether the protests continue after the polls close.", "refs": ["rawalakot"], "tr": "Zamanlamayı açıklayan en yakın etken, bölgede yerel seçimlerin sürüyor olması. Bir seçim, uygulanmamış bir düzenlemeyi yeniden pazarlık konusu hâline getirir; çünkü sandık, çevrenin merkeze ulaşabildiği ender takvimlerden biridir. Alternatif açıklama da elde: bölge hükümeti komitenin silahlı olduğunu ve seçimleri aksatmayı amaçladığını söylüyor, komite haziranda yasaklandı ve dışarıdan finanse edilen bir terör örgütü olarak nitelendi; bu okumada seçim bir fırsat sayılmaz, bir hedeftir. İki açıklamayı ayıracak olan, gösterilerin sandık kapandıktan sonra sürüp sürmediği."}, {"en": "It should also be said where the comparison breaks. The classic course of an uncarried centre-periphery bargain is that the parties keep treating each other as counterparts. Here that recognition looks suspended: the committee is banned, roads are blocked, shops are shuttered and the entry of food is itself disputed. The regional government rejects allegations that security forces fired indiscriminately on peaceful protesters and says it is not preventing food or medical supplies from entering; the BBC said it saw no weapons at the protests it attended and that the source of gunfire heard overnight was unclear. In a bargain where the counterpart has been legally removed, there is no route left by which an uncarried text can be carried out.", "refs": ["rawalakot"], "tr": "Benzetmenin bir yerde kırıldığını da söylemek gerekiyor. Uygulanmamış bir merkez-çevre pazarlığının klasik seyri, tarafların birbirini muhatap saymayı sürdürmesidir. Burada muhataplık askıya alınmış görünüyor: komite yasaklı, yollar kapalı, dükkânlar kepenkli, gıda girişi tartışma konusu. Bölge hükümeti güvenlik güçlerinin barışçıl göstericilere gelişigüzel ateş açtığı iddialarını reddediyor ve gıda ile tıbbi malzeme girişini engellemediğini bildiriyor; BBC katıldığı gösterilerde silah görmediğini, gece duyulan silah seslerinin kaynağının belirsiz kaldığını aktarıyor. Muhatabın hukuken ortadan kalktığı bir pazarlıkta, uygulanmamış bir metnin uygulanması için bir yol kalmaz."}]}, {"h": {"en": "What follows", "tr": "Bundan sonrası"}, "ps": [{"en": "What is worth watching is therefore not the death toll but whether recognition returns. Umar Nazir of the committee's core body says they are willing to talk, while more protests are planned. If the ban is not lifted or a named channel for talks is not opened before the end of the year, October's arrangement will remain an uncarried text and the argument will pass to the next electoral calendar. Paper does not age; what ages is the absence of an institution to carry it.", "refs": ["rawalakot"], "tr": "Bu yüzden izlenecek şey ölü sayısı yerine muhataplığın geri gelip gelmediği olmalı. Komitenin çekirdek kadrosundan Umar Nazir görüşmeye açık olduklarını söylüyor, ama yeni gösteriler planlanıyor. Yıl sonuna kadar yasak kaldırılmaz ya da adı konmuş bir görüşme kanalı açılmazsa, ekimdeki düzenleme uygulanmamış bir metin olarak kalacak ve tartışma bir sonraki seçim takvimine devredilecek. Kâğıt eskimez; eskiyen, onu uygulayacak kurumun yokluğudur."}]}], "sources": [{"key": "rawalakot", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c5yvqk69enko", "title": {"tr": "BBC, Pakistan yönetimindeki Keşmir'de gösterilerin merkezine ulaşan ilk haber kuruluşu oldu", "en": "The BBC becomes the first news organisation to reach the centre of the Kashmir protests"}, "publishedDate": "2026-08-03"}], "title": {"en": "A text signed in October is being tested in the street in August", "tr": "Ekimde imzalanan metin, ağustosta sokakta sınanıyor"}, "writer": "geo-06", "radarPublishedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Washington announces a negotiating date while Tehran says on the same day that no such process exists. The only live channel is the one with Oman, and it covers a route rather than the opening of the strait.", "tr": "Washington bir müzakere takvimi duyururken Tahran aynı gün böyle bir sürecin bulunmadığını söylüyor. Yürürlükte olan tek kanal, Umman'la görüşülen ve boğazın açılıp kapanmasını değil bir güzergâhı konu alan metin."}, "sections": [{"h": {"en": "Two accounts, one live channel", "tr": "İki anlatım, tek yürürlükteki kanal"}, "ps": [{"en": "Iran's foreign ministry spokesperson Esmail Baghaei said on Monday that Tehran was not holding talks with the United States at that moment. The same live page carried Trump saying an agreement was imminent and that negotiations would open on Monday, alongside Tehran's call for the memorandum of understanding signed on 17 June to be honoured. The two accounts have not been reconciled, and the gap between them is not a matter of tone: one announces a schedule, the other announces its absence.", "refs": ["iran-live"], "tr": "İran Dışişleri sözcüsü İsmail Bakai pazartesi günü Tahran'ın ABD ile o an için görüşme yürütmediğini söyledi. Aynı canlı yayın sayfası, Trump'ın anlaşmanın yakın olduğunu ve müzakerelerin pazartesi başlayacağını belirttiğini ve Tahran'ın 17 Haziran'da imzalanan mutabakat metnine uyulması çağrısını aktardı. İki anlatım birbiriyle uzlaştırılmış değil ve aralarındaki fark bir üslup farkı da değil: biri bir takvim, diğeri bir yokluk bildiriyor."}, {"en": "The channel the spokesperson does describe sits somewhere else. The talks with Oman cover a new route through the Strait of Hormuz with separate entry and exit lanes; Foreign Minister Abbas Araghchi said they were on the way to being finalised, and officials pointed to a third line distinct from the existing northern and southern corridors. What is approaching completion is a navigation arrangement, not an instrument that decides whether the strait is open. The opposite reading is available too: Muscat may also be the venue for indirect contact that is not announced, in which case the two accounts describe one process at different levels of publicity.", "refs": ["iran-live", "hormuz-route"], "tr": "Sözcünün tarif ettiği kanal ise başka bir yerde duruyor. Umman'la yürütülen görüşmeler Hürmüz Boğazı'nda giriş ve çıkış şeritleri bulunan yeni bir güzergâhı konu alıyor; Dışişleri Bakanı Abbas Arakçi bu görüşmelerin sonuçlandırılma yolunda olduğunu söyledi ve yetkililer mevcut kuzey ile güney koridorlarından farklı üçüncü bir hattan söz etti. Tamamlanmaya yaklaşan şey bir seyir düzenlemesi; boğazın açık olup olmayacağına karar veren bir araç değil. Bunun tersi de mümkün: Maskat, kamuoyuna açıklanmayan dolaylı temasın da mekânı olabilir, o durumda iki anlatım tek sürecin farklı görünürlük düzeylerini tarif ediyor olur."}]}, {"h": {"en": "What a demand needs before it binds", "tr": "Bir talebin bağlayıcı olması için gerekenler"}, "ps": [{"en": "Trump's condition describes an outcome: any agreement must include the immediate and complete opening of the strait. President Masoud Pezeshkian called that same memorandum the cornerstone of Tehran's future foreign policy. For an arrangement built on a text that one side treats as a foundation and the other as a condition, the operative question is who certifies that passage has taken place, and what follows if nobody can. The route text under discussion with Oman can describe lanes; describing lanes does not create an authority able to attest a right to use them.", "refs": ["hormuz-route"], "tr": "Trump'ın koşulu bir sonuç tarif ediyor: herhangi bir anlaşma boğazın derhal ve tümüyle açılmasını içermeli. Cumhurbaşkanı Mesud Pezeşkiyan ise aynı mutabakat metnini Tahran'ın gelecekteki dış politikasının temel taşı olarak niteledi. Bir tarafın dayanak, diğerinin koşul saydığı bir metnin üzerine kurulacak düzenlemede kritik olan soru şudur: geçişin gerçekleştiğini kim tespit edecek ve tespit edemezse ne olacak? Umman'la görüşülen güzergâh metni şeritleri tarif edebilir; şeritleri tarif etmek, onları kullanma hakkını belgeleyecek bir merci yaratmaz."}, {"en": "What is worth following is therefore not another statement but the content of whatever text is published. If the understanding reached with Oman is made public and names, alongside the entry and exit lanes, an authority that certifies passage and a period for which it holds, the demand will have become an enforceable obligation for the first time. If the text describes only coordinates and lanes, the outcome Washington wants and the arrangement Tehran signs will continue to sit on separate planes.", "refs": ["hormuz-route", "iran-live"], "tr": "Bu yüzden takip edilecek şey bir açıklama değil, yayımlanacak metnin içeriğidir. Umman'la varılan anlayış kamuoyuna açıklanır ve giriş ile çıkış şeritlerinin yanında geçişi onaylayacak bir makam ile bunun süresi de yazılırsa, talep ilk kez uygulanabilir bir yükümlülüğe dönüşmüş olur. Metin yalnızca koordinat ve şerit tarif ediyorsa, Washington'un istediği sonuç ile Tahran'ın imzaladığı düzenleme ayrı düzlemlerde kalmayı sürdürür."}]}], "sources": [{"key": "iran-live", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/liveblog/2026/8/3/iran-war-live-trump-says-talks-set-to-begin-tehran-urges-us-to-honour-mou", "title": {"tr": "İran Dışişleri, ABD ile şu anda görüşme yürütülmediğini bildirdi", "en": "Iran's foreign ministry says no talks with the US are under way"}, "publishedDate": "2026-08-03"}, {"key": "hormuz-route", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "İran, Umman'la Hürmüz güzergâhı görüşmelerinin son aşamada olduğunu açıkladı", "en": "Iran says talks with Oman on a new Hormuz shipping route are in their final stages"}, "publishedDate": "2026-08-02"}], "title": {"en": "Only one of the two tracks has a text behind it", "tr": "İki kanaldan yalnızca birinin arkasında bir metin var"}, "writer": "geo-01", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Twenty-two member states asked for an emergency meeting. The party that actually halts the crossings and carries out the returns is not a member of it.", "tr": "Yirmi iki üye devlet olağanüstü bir toplantı istedi. Geçişin durdurulmasını ve geri dönüşü fiilen yürüten taraf ise o toplantının üyesi değil."}, "sections": [{"h": {"en": "Who signed the letter", "tr": "Mektubu kimler imzaladı"}, "ps": [{"en": "After the crossings at Ceuta, 22 of the 27 member states signed a joint letter calling for coordinated action and the strengthening of external borders, and Ireland, holding the presidency, said interior ministers would meet by videoconference on Tuesday. The letter's language is outcome-oriented: the signatories wrote that they cannot allow uncontrolled mass crossings, or allow an illegal entry to turn into legal stay. What decision-making powers the meeting will convene under, and which external-border instruments it will take up, were not stated.", "refs": ["eu-ceuta"], "tr": "Fas'tan Ceuta'ya yapılan geçişlerin ardından 27 üyeden 22'si, eşgüdümlü hareket ve dış sınırların güçlendirilmesi çağrısı yapan ortak bir mektuba imza attı; dönem başkanlığını yürüten İrlanda, içişleri bakanlarının salı günü video konferansla toplanacağını bildirdi. Mektubun dili sonuç odaklı: imzacılar denetimsiz kitlesel geçişlere ve yasa dışı girişin yasal kalışa dönüşmesine izin veremeyeceklerini yazdı. Toplantının hangi karar yetkisiyle toplanacağı ve dış sınıra ilişkin hangi araçları ele alacağı açıklanmadı."}, {"en": "A number of members, meanwhile, moved before the meeting. Italy suspended its Schengen open-border arrangement with Spain, France increased police numbers at the Spanish border fivefold and Portugal tightened controls on its southern land and maritime borders, while Manfred Weber, leader of the European People's Party, put the responsibility directly on Madrid. What arrives in front of Tuesday's videoconference is less a set of options to be decided than a list of measures already applied. Another reading is available: the extraordinary format under the Irish presidency may be the only instrument capable of preventing further unilateral suspensions, in which case the meeting works as a brake rather than a rubber stamp.", "refs": ["eu-ceuta"], "tr": "Buna karşılık üyelerin bir bölümü toplantıyı beklemeden kendi adımlarını attı. İtalya İspanya ile arasındaki Schengen açık sınır uygulamasını askıya aldı, Fransa İspanya sınırındaki polis sayısını beş katına çıkardı, Portekiz güneydeki kara ve deniz sınırlarında denetimleri sıkılaştırdı; Avrupa Halk Partisi lideri Manfred Weber ise sorumluluğu doğrudan Madrid'e yükledi. Salı günkü video konferansın önüne, kararlaştırılacak bir seçenekler kümesinden çok, hâlihazırda uygulanmış önlemlerin listesi geliyor. Bunun bir başka okuması da mümkün: İrlanda başkanlığındaki olağanüstü format, yeni tek taraflı askıya almaları önleyebilecek tek araç olabilir ve o zaman toplantı onaylama değil sınırlama işlevi görür."}]}, {"h": {"en": "The party that is not in the room", "tr": "Toplantıda bulunmayan taraf"}, "ps": [{"en": "On the other side of the crisis stands Morocco. Its interior ministry reported 11 deaths on its own territory and attributed the surge to misinformation on social media, to trafficking networks and to a misreading of a Spanish ruling banning immediate returns of people intercepted at sea. More to the point, of the roughly 60,000 who crossed into Ceuta between Thursday and Sunday, more than 48,000 returned to Morocco within 48 hours. Accepting and carrying out a return on that scale is not a transaction EU interior ministers can settle among themselves.", "refs": ["ceuta-toll"], "tr": "Krizin diğer yakasında Fas var. Fas İçişleri Bakanlığı kendi tarafında 11 ölüm bildirdi ve geçiş dalgasını sosyal medyadaki yanlış bilgiye, kaçakçılık ağlarına ve denizde yakalananların anında geri gönderilmesini yasaklayan bir İspanyol kararının yanlış yorumlanmasına bağladı. Daha önemlisi, perşembe ile pazar arasında Ceuta'ya geçen yaklaşık 60.000 kişinin 48.000'den fazlası 48 saat içinde Fas'a döndü. Bu ölçekte bir geri dönüşü kabul etmek ve yürütmek, AB içişleri bakanlarının kendi aralarında karar verebileceği bir işlem değildir."}, {"en": "That is where the balance question actually sits. The signatories are asking for a stronger external border while the instruments genuinely in their hands are internal, and the government that administers the far side of that border and performs the readmissions is neither an addressee of the letter nor a participant in the meeting. In an arrangement of that shape, any agreed text depends for its execution on the consent of a third party, and that consent is the subject of a separate bargain.", "refs": ["ceuta-toll", "eu-ceuta"], "tr": "Denge tartışmasında asıl mesele budur. İmzacılar dış sınırın güçlendirilmesini isterken ellerindeki fiilî araçlar iç sınırlarda; sınırın öbür yakasını yöneten ve geri kabulü uygulayan hükümet ise ne mektubun muhatabı ne de toplantının katılımcısı. Böyle bir yapıda üzerinde uzlaşılan her metin, uygulaması bir üçüncü tarafın rızasına bağlı kalır ve o rıza da ayrı bir pazarlığın konusudur."}]}], "sources": [{"key": "eu-ceuta", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "title": {"tr": "22 AB hükümeti Ceuta için olağanüstü içişleri bakanları toplantısı istedi", "en": "22 EU governments call for an emergency interior ministers' meeting over Ceuta"}, "publishedDate": "2026-08-02"}, {"key": "ceuta-toll", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/migrant-deaths-in-ceuta-rise-to-72-after-border-surge-from-morocco", "title": {"tr": "Ceuta'daki can kaybı 72'ye çıktı, 48.000'den fazla kişi Fas'a döndü", "en": "Ceuta death toll reaches 72 as more than 48,000 return to Morocco"}, "publishedDate": "2026-08-02"}], "title": {"en": "Morocco is absent from the Ceuta table", "tr": "Ceuta masasında Fas yok"}, "writer": "geo-02", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The roadmap announced on Friday sets out an order of steps. The condition Israel has stated reverses that order, and air strikes fill the space in between.", "tr": "Cuma günü duyurulan yol haritası bir sıralama öngörüyor. İsrail'in açıkladığı koşul ise o sıralamayı tersine çeviriyor ve arada kalan boşluğu hava saldırıları dolduruyor."}, "sections": [{"h": {"en": "The announced order", "tr": "Duyurulan sıra"}, "ps": [{"en": "The Board of Peace and the International Stabilisation Force announced on Friday that agreement had been reached on implementing the next phase of the ceasefire. Hamas was reported to have accepted the roadmap. Israel made no official statement. In an implementation arrangement, the order in which the parties discharge their obligations is as decisive as the arrangement itself; here that order was announced by third parties, and one of the parties did not bind itself to the announcement.", "refs": ["gaza-19"], "tr": "Barış Kurulu ile Uluslararası İstikrar Gücü cuma günü ateşkesin bir sonraki aşamasının uygulanması konusunda anlaşmaya varıldığını duyurdu. Hamas'ın yol haritasını kabul ettiği bildirildi. İsrail resmi bir açıklama yapmadı. Bir uygulama düzenlemesinde tarafların yükümlülüklerini hangi sırayla yerine getireceği, düzenlemenin kendisi kadar belirleyicidir; burada o sıra üçüncü taraflarca duyuruldu, taraflardan biri ise duyuruya bağlanmadı."}, {"en": "Doron Spielman, a spokesperson for Netanyahu, said Israel would not withdraw its forces before Hamas had fully surrendered its weapons. A condition that places completed disarmament ahead of a military withdrawal and an approach that treats withdrawal as the precondition for disarmament are two opposite operating orders for the same text. When it is unclear who moves first in stopping a war, the ambiguity does not resolve itself; it requires one side to drop its condition, or a third party to take on the authority to impose the order.", "refs": ["gaza-19"], "tr": "Netanyahu'nun sözcüsü Doron Spielman, Hamas silahlarını tümüyle teslim etmeden İsrail'in güçlerini geri çekmeyeceğini söyledi. Silahsızlanmanın tamamlanmasını askeri çekilmenin önüne koyan bir koşul ile çekilmeyi silahsızlanmanın önkoşulu sayan bir yaklaşım, aynı metnin iki karşıt işletim sırasıdır. Bir savaşın durdurulmasında ilk adımı kimin atacağı belirsizse belirsizlik kendiliğinden çözülmez; bir tarafın koşulundan vazgeçmesini ya da bir üçüncü tarafın sırayı dayatacak yetkiyi üstlenmesini gerektirir."}]}, {"h": {"en": "What fills the space in between", "tr": "Aradaki boşluğu ne dolduruyor"}, "ps": [{"en": "That space did not stay empty. According to Palestinian health officials and medical sources at al-Shifa and Nasser hospitals, at least 19 people were killed on Sunday, the highest daily figure reported in weeks. Among the dead were a family at al-Sousi Tower in western Gaza City and a family in al-Qarara near Khan Younis. Al Jazeera correspondent Nour Khaled reported that the strikes came without warning or evacuation orders in the areas that were hit.", "refs": ["gaza-19"], "tr": "O boşluk boş kalmadı. Filistinli sağlık yetkilileri ile Şifa ve Nasır hastanelerindeki tıbbi kaynaklara göre pazar günü en az 19 kişi öldü; bu, haftalardır bildirilen en yüksek günlük sayı. Ölenler arasında Gazze kentinin batısındaki Sousi Kulesi'nde bir aile ile Han Yunus'a bağlı el-Karara'da bir aile bulunuyor. Al Jazeera muhabiri Nur Halid, saldırıların hedef alınan bölgelerde uyarı ya da tahliye çağrısı yapılmadan gerçekleştiğini aktardı."}, {"en": "A pattern of strikes without warning or evacuation sits awkwardly with a narrow, target-specific coercive posture; keeping preparation invisible is not a feature such a military posture usually wants. Other explanations are available: warnings may have been passed through channels the correspondent could not observe, or the targets hit may come from a list assembled before Friday's announcement. What would separate those possibilities is whether the daily toll returns over the next fortnight to the level of previous weeks, and whether a verification body named in the security arrangement begins work.", "refs": ["gaza-19"], "tr": "Uyarısız ve tahliyesiz bir saldırı örüntüsü, dar kapsamlı ve belirli hedeflere yönelen bir zorlama duruşuyla güç bağdaşır; hazırlığı görünür kılmamak bu tür bir askeri duruşun beklenen bir özelliği değildir. Başka açıklamalar da mümkündür: uyarılar muhabirin gözlemleyemediği kanallardan iletilmiş olabilir ya da vurulan hedefler cuma günkü duyurudan önce oluşturulmuş bir listeden gelmiş olabilir. Bu iki ihtimali ayırt edecek olan, önümüzdeki iki hafta boyunca günlük bilançonun önceki haftaların düzeyine dönüp dönmediği ve güvenlik düzenlemesinde adı geçen bir doğrulama makamının çalışmaya başlayıp başlamadığıdır."}]}], "sources": [{"key": "gaza-19", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/israel-kills-five-in-gaza-despite-trumps-hamas-disarmament-plan", "title": {"tr": "Gazze genelindeki İsrail saldırılarında 19 kişi öldü", "en": "Israeli strikes across Gaza kill 19 on the deadliest day in weeks"}, "publishedDate": "2026-08-02"}], "title": {"en": "Two conditions, each waiting on the other", "tr": "Birbirini bekleyen iki koşul"}, "writer": "geo-03", "n": 2, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Cuba's grid failures are narrated as an infrastructure story. The July sequence suggests the binding constraint is fuel rather than switching faults.", "tr": "Küba'nın şebeke çöküşleri bir altyapı hikâyesi gibi anlatılıyor. Temmuz ayındaki olay dizisi, bağlayıcı kısıtın anahtarlama arızası değil yakıt olduğunu gösteriyor."}, "sections": [{"h": {"en": "The fault notice and the ledger behind it", "tr": "Arıza bildirimi ve arkasındaki hesap"}, "ps": [{"en": "The state utility UNE announced late on Sunday that the grid had collapsed, without giving a cause, the extent of the disruption or a restoration time. Before the collapse, Havana's electricity company had reported damaged transformers, circuit failures and planned cuts tied to insufficient generating capacity. According to Reuters, dozens of unresolved complaints had been logged early on Sunday in municipalities including Guanabacoa, Habana del Este, La Lisa and Marianao. Those two kinds of problem draw on different budget lines: one is equipment and maintenance, the other is fuel.", "refs": ["cuba-grid"], "tr": "Devlet elektrik kuruluşu UNE pazar günü geç saatlerde şebekenin çöktüğünü duyurdu; nedeni, etkilenen alanı ve elektriğin ne zaman geleceğini bildirmedi. Çöküşten önce Havana'nın elektrik şirketi hasarlı transformatörler, devre arızaları ve yetersiz üretim kapasitesine bağlı planlı kesintiler bildirmişti. Reuters'a göre pazar sabahı Guanabacoa, Habana del Este, La Lisa ve Marianao gibi belediyelerde çözülmemiş onlarca şikâyet kaydedilmişti. Bu iki tür sorun ayrı bütçe kalemlerine bakar: biri ekipman ve bakım, diğeri yakıt."}, {"en": "The July sequence indicates which of them binds. The grid collapsed three times within nine days, one of those outages leaving about 10 million people without electricity, and generation still could not meet demand after the network was reconnected. A switching fault closes when the line is reconnected; a shortfall that survives reconnection means there is nothing to burn. The counter-reading is in the same record: some plants are more than 30 years old and have had limited maintenance, and others point to decades of underinvestment in the energy sector.", "refs": ["cuba-grid"], "tr": "Temmuz ayındaki olay dizisi hangisinin bağladığını gösteriyor. Şebeke dokuz gün içinde üç kez çöktü ve bunlardan biri yaklaşık 10 milyon kişiyi elektriksiz bıraktı; şebeke yeniden devreye alındıktan sonra bile talebi karşılayacak üretim sağlanamadı. Anahtarlama arızası şebeke yeniden devreye alınınca kapanır; devreye alma sonrasında da süren açık, yakılacak yakıt bulunmadığı anlamına gelir. Karşı okuma da aynı haberde yer alıyor: bazı santraller 30 yılı aşkın ve sınırlı bakım görmüş durumda, kimileri de enerji sektöründeki onlarca yıllık yatırım eksikliğine işaret ediyor."}]}, {"h": {"en": "Two suppliers, one route", "tr": "İki tedarikçi, tek güzergâh"}, "ps": [{"en": "On the fuel side the picture is this. Venezuela had long been the island's primary oil supplier. Al Jazeera reported that Cuba lost that source after Trump imposed an oil blockade following the United States' seizure of Venezuelan President Nicolás Maduro on 3 January, and that shipments from Mexico also stopped under pressure from Washington. For an importer, losing one supplier is a price problem; losing the second is a routing problem. Restrictions on access to financing and equipment over the same period narrow the credit and the spare parts that would carry any search for a substitute.", "refs": ["cuba-grid"], "tr": "Yakıt tarafında olan şu: Venezuela uzun süredir adanın başlıca petrol tedarikçisiydi. Al Jazeera'ya göre Küba, ABD'nin 3 Ocak'ta Venezuela Devlet Başkanı Nicolás Maduro'yu alıkoymasının ardından Trump'ın uyguladığı petrol ablukasıyla bu kaynağı kaybetti; Meksika'dan gelen sevkiyatlar da Washington'un baskısıyla durdu. Bir ithalatçı için tek tedarikçinin kesilmesi fiyat sorunudur, ikinci tedarikçinin de kesilmesi güzergâh sorunudur. Aynı dönemde finansmana ve ekipmana erişimin kısıtlanması, ikame arayışını taşımaya yarayacak krediyi ve yedek parçayı da daraltıyor."}, {"en": "The next step will therefore appear in a shipment rather than in a statement. If a third supplier comes in, the first evidence will be cargo discharged on the island; the second will be restored generation holding above demand for a full week. If neither
