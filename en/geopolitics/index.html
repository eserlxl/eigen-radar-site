:49+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/palestinian-children-among-those-detained-in-israeli-west-bank-raids", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "İsrail'in Batı Şeria baskınlarında gözaltına alınanlar arasında çocuklar var", "en": "Children among Palestinians detained in Israeli raids across the West Bank"}, "summary": {"tr": "Filistin haber ajansı Wafa ile yerel kaynaklara göre gece ve sabaha karşı düzenlenen baskınlarda ikisi 16 yaşında olmak üzere yedi Filistinli gözaltına alındı. Baskınlar Tubas, Nablus, Beytüllahim, Ramallah ve El Halil bölgelerinde yapıldı.", "en": "Seven Palestinians, two of them 16 years old, were detained in overnight and predawn raids, according to the Palestinian news agency Wafa and local sources. The raids covered the Tubas, Nablus, Bethlehem, Ramallah and Hebron governorates."}, "detail": {"tr": "Tubas'a bağlı Tammun'da ve Beytüllahim'e bağlı Vadi Fukin'de birer 16 yaşındaki genç gözaltına alındı; Nablus'a bağlı Urif, Aynabus ve Burka köylerinde dört Filistinli, Container kontrol noktasında bir kişi tutuldu. El Halil yakınlarındaki Haşem ed-Darac'ta 11 işçi gözaltına alındı. Aynı dönemde yerleşimci saldırıları da bildirildi: Ramallah'ın kuzeybatısındaki Beytillu'ya bağlı Zerka bölgesinde bir Filistinli çift darbedildi, El Halil yakınlarındaki Surif'te bir araç ateşe verildi ve ırkçı yazılar yazıldı, El Muğayyir yakınında üç kişiye biber gazı sıkıldı. Son yedi günde 12 kaçak yerleşim karakolu kurulduğu bildirildi. Haberde İsrail ordusunun bir açıklamasına yer verilmedi.", "en": "A 16-year-old was detained in Tammun in Tubas and another in Wadi Fukin near Bethlehem; four Palestinians were taken in the Nablus villages of Urif, Einabus and Burqa, and one man was held at the Container checkpoint. 11 labourers were detained at Khashem al-Daraj near Hebron. S onto’daki ABD başkonsolosluğuna ikinci kez ateş açılması, diplomatik hareket ile mekânların farklı güvenlik baskıları altında işlediğini gösteriyor.", "en": "Netanyahu’s unannounced departure from a military base and a second shooting at the US consulate in Toronto show diplomatic travel and sites operating under different kinds of security pressure."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-28/geopolitics-diplomacy-security-perimeter-1280.e0f850c5a980.webp", "variants": [{"src": "/assets/briefs/2026-07-28/geopolitics-diplomacy-security-perimeter-640.2e639c5861ab.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/geopolitics-diplomacy-security-perimeter-1280.e0f850c5a980.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Tam ölçekli pistten havalanan işaretsiz uçak ile terminal önündeki amber ışıklı ayrı adli inceleme düzeneği aynı güvenlik çevresinde", "en": "An unmarked aircraft lifts from a full-scale runway as a distinct amber-lit forensic enclosure occupies the terminal foreground"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "n": 1, "hasAnalysis": true}, {"id": "regional-pauses-and-handover", "topic": "geopolitics", "title": {"tr": "Bölgesel duraklamanın iki sahası", "en": "Two arenas of a regional pause"}, "summary": {"tr": "ABD ile İran saldırılara ikinci gece ara verirken Lübnan ordusu, güneydeki güvenlik devrinin bombardıman ve temizleme faaliyetleri nedeniyle tamamlanamadığını bildirdi.", "en": "The United States and Iran paused attacks for a second night, while Lebanon's army said shelling and clearance operations were preventing a planned security handover in the south."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/regional-pauses-and-handover-1280.7c1578cea8b8.webp", "variants": [{"src": "/assets/briefs/2026-07-27/regional-pauses-and-handover-640.393a1937d962.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/regional-pauses-and-handover-1280.7c1578cea8b8.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Karanlık deniz ötesindeki suskun mevzileri, güneydeki gözetleme zincirini ve enkazla kesilen güvenlik devri yolunu birleştiren jeopolitik illüstrasyon", "en": "Geopolitical illustration linking dormant positions across dark water, a southern watch-post chain and a security handover route blocked by debris"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}, {"id": "gaza-syria-control-lines", "topic": "geopolitics", "title": {"tr": "Gazze ve Suriye'de denetim çizgileri", "en": "Lines of control in Gaza and Syria"}, "summary": {"tr": "Gazze'ye girecek uluslararası gücün görev alanını İsrail denetimi belirlerken Suriye'deki yeni ilerleme, Birleşmiş Milletler'in 1974 ayrışma düzenine ilişkin itirazını yeniden gündeme taşıdı.", "en": "Israeli control will delimit an international force's work in Gaza, while a new advance in Syria renewed the United Nations' objection under the 1974 disengagement arrangement."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/gaza-syria-control-lines-1280.8fc8f522795f.webp", "variants": [{"src": "/assets/briefs/2026-07-27/gaza-syria-control-lines-640.f13ea6d239ee.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/gaza-syria-control-lines-1280.8fc8f522795f.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Daralan kıyı koridorunu, eski ayrışma hattını ve hattın ötesine geçen yeni araç izlerini gösteren jeopolitik illüstrasyon", "en": "Geopolitical illustration showing a narrowed coastal corridor, an older disengagement line and fresh vehicle tracks extending beyond it"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}, {"id": "ukraine-romania-eastern-flank", "topic": "geopolitics", "title": {"tr": "Doğu kanadında üretim ve müdahale", "en": "Production and interception on the eastern flank"}, "summary": {"tr": "Britanya, Stone Cloak sisteminin yerel üretimini sağlayacak fikrî mülkiyeti paylaşmaya hazırlanırken bir F-16, üç günde bildirilen üçüncü hava sahası ihlalinde insansız aracı düşürdü.", "en": "Britain is preparing to share intellectual property for local production of Stone Cloak, while an F-16 downed a drone during the third reported airspace intrusion in three days."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/ukraine-romania-eastern-flank-1280.fc45add375b6.webp", "variants": [{"src": "/assets/briefs/2026-07-27/ukraine-romania-eastern-flank-640.0c193e2ca421.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/ukraine-romania-eastern-flank-1280.fc45add375b6.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Şeffaf ana modülü yerel elektronik harp birimlerine kopyalayan üretim hattını ve uzakta bir insansız aracı kesen sahayı birleştiren illüstrasyon", "en": "Illustration linking a production line that copies a transparent master into local electronic-warfare units with a distant field intercepting a drone"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}], "articles": [{"writer": "geo-01", "title": {"tr": "Salı günkü toplantının elindeki tek araç kendi iç sınırları", "en": "The only instrument Tuesday's meeting holds is its own internal borders"}, "excerpt": {"tr": "22 üye devletin imzaladığı mektup olağanüstü bir konsey topluyor. Ancak metnin adını andığı tek somut önlem, Ceuta'da değil, imzacıların kendi sınırlarında uygulanıyor.", "en": "A letter signed by 22 member states convenes an extraordinary council. Yet the one concrete measure the text names is applied not at Ceuta but at the signatories' own frontiers."}, "sections": [{"h": {"tr": "Mektubun çağırdığı organ", "en": "The body the letter convenes"}, "ps": [{"tr": "Yirmi iki üye devlet, İtalya ile Danimarka'nın başlattığı bir mektuba imza attı; Fransa, Portekiz ve Lüksemburg atmadı. Dönem başkanlığını temmuzda devralan İrlanda, Adalet ve İçişleri Konseyi'ni salı günü olağanüstü bir video konferansla topluyor. Metnin gerekçesi, denetimsiz kitlesel geçişlerin ve göçün araçsallaştırılmasının Avrupa Birliği'ne yasa dışı girişin mümkün olduğu algısını yaratması tehlikesi.", "en": "Twenty-two member states signed a letter initiated by Italy and Denmark; France, Portugal and Luxembourg did not. Ireland, which took over the rotating presidency in July, is convening the Justice and Home Affairs Council on Tuesday in an extraordinary videoconference. The stated reason is the danger that uncontrolled mass crossings and the instrumentalisation of migration create the perception that illegal entry into the European Union is possible.", "refs": ["ceuta-council"]}, {"tr": "Mektubun bağlayıcı bir yaptırımı yok; hukuken bağlayıcı olan, imzacıların saklı tuttuğu seçenek. O seçenek geçici iç sınır denetimlerini güçlendirmek ya da yeniden uygulamaya koymak. Bu yetki, her üye devletin kendi sınırında kullandığı bir yetki; Ceuta'daki dış sınırda kullanılan bir yetki değil. Alternatif okuma da mümkün: metin bir operasyon planından çok, iç kamuoyuna dönük bir konum bildirimi olabilir. İki okumayı ayıracak olan, salı günü hangi aracın ve hangi takvimin adının konacağı.", "en": "The letter carries no enforcement of its own; what is legally operative is the option the signatories reserve. That option is to reinforce or reintroduce temporary internal border controls. It is a power each member state exercises at its own frontier, not at the external border in Ceuta. A second reading is available: the text may be a position taken for domestic audiences rather than an operational plan. What separates the two readings is whether Tuesday names an instrument and a date.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "İki sınırda iki ayrı yetki", "en": "Two borders, two authorities"}, "ps": [{"tr": "Madrid'in verdiği rakamlara göre perşembe günü yaklaşık 50.000 kişi Ceuta'ya geçti, neredeyse tamamı geri gönderildi ve 67 kişi hayatını kaybetti. Komisyon Başkanı Ursula von der Leyen tek bir kişinin bile İspanya anakarasına ya da Birliğin geri kalanına ulaşmadığını söyledi. İç sınır denetimi, tam da bu ulaşmanın önlenmesi için düşünülmüş bir araç.", "en": "On Madrid's figures about 50,000 people crossed into Ceuta on Thursday, almost all were returned and 67 died. Commission President Ursula von der Leyen said not a single person reached mainland Spain or the rest of the Union. Internal border control is an instrument designed to prevent exactly that onward movement.", "refs": ["ceuta-council"]}, {"tr": "Uygulama maliyetini kimin taşıdığı da buradan çıkıyor. Başbakan Pedro Sánchez, üye devletlerin bir bölümünün dayanışma gösterdiğini, bir bölümününse İspanya'yı hedef alıp ülkenin Schengen alanından geçici olarak çıkarılmasını istediğini söyledi. Gündemi kuran taraf ise mektubu kaleme alan Roma ile Kopenhag; Paris, Lizbon ve Lüksemburg imzadan uzak durarak aynı gündemin dışında kaldı.", "en": "That is also where the compliance cost lands. Prime Minister Pedro Sánchez said some member states had shown solidarity while others had chosen to attack Spain and to call for its temporary exclusion from the Schengen area. The agenda-setters are Rome and Copenhagen, who drafted the letter; Paris, Lisbon and Luxembourg stayed outside it by withholding their signatures.", "refs": ["ceuta-council"]}]}, {"h": {"tr": "Salı günü ölçülebilecek şey", "en": "What Tuesday will make measurable"}, "ps": [{"tr": "Bir konsey toplantısının çıktısı sonuç bildirgesi olabilir, tarifeli bir yükümlülük de olabilir. Eylül sonuna kadar herhangi bir imzacı, Ceuta'yı gerekçe göstererek geçici iç sınır denetimi bildiriminde bulunmazsa, salı günkü metnin bağladığı şey davranış değil, gündem olacak. Bildirim gelirse, mektubun saklı tuttuğu araç kullanılmış olur ve maliyeti ilk elde sınırdan geçen kişiler ve taşımacılar taşır.", "en": "A council meeting can produce conclusions, or it can produce a dated obligation. If no signatory notifies temporary internal border controls citing Ceuta before the end of September, what Tuesday's text binds is the agenda rather than behaviour. If a notification does come, the reserved instrument has been used, and the first cost falls on the people and hauliers who cross those frontiers.", "refs": ["ceuta-council"]}]}], "sources": [{"key": "ceuta-council", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/22-eu-leaders-call-for-emergency-talks-over-ceuta-migrant-crisis", "title": {"tr": "Yirmi iki AB üyesi Ceuta için olağanüstü bakanlar toplantısı istedi", "en": "Twenty-two EU members call for emergency ministerial talks on Ceuta"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Bir komutanlığın devri neyi devrediyor?", "en": "What does handing over a command actually transfer?"}, "excerpt": {"tr": "Wiesbaden'daki komutanlığın başına Avrupalı ya da Kanadalı bir general geçecek, Amerika Birleşik Devletleri yardımcı komutanlıkta kalacak. Yer değiştiren şey koordinasyon; koordine edilen kabiliyetlerin kaynağı olduğu yerde duruyor.", "en": "A European or Canadian general is to take the Wiesbaden command while the United States keeps the deputy's chair. What changes hands is the coordination; the source of the capabilities being coordinated stays where it is."}, "sections": [{"h": {"tr": "Devrin şekli", "en": "The shape of the handover"}, "ps": [{"tr": "Politico'ya dayandırılan habere göre Pentagon, Almanya'nın Wiesbaden kentindeki Ukrayna Güvenlik Yardım Grubu'nun komutasını başka bir NATO üyesine bırakıyor. Komutanlık teçhizat sevkiyatını koordine ediyor, eğitimi ve lojistik desteği yürütüyor. Geçiş bir yıla kadar sürebilecek; komutayı Avrupalı ya da Kanadalı bir general üstlenecek, ABD Avrupa Komutanlığı yardımcı komutan düzeyinde kalacak. Bir NATO yetkilisi bunu müttefiklerin daha fazla sorumluluk üstlenmesinin bir örneği daha olarak tanımladı.", "en": "According to a report sourced to Politico, the Pentagon is relinquishing command of the Security Assistance Group-Ukraine in Wiesbaden, Germany, to another NATO member. The command coordinates equipment deliveries and runs training and logistical support. The transition may take up to a year; a European or Canadian general takes command while US European Command remains at deputy level. A NATO official described this as another example of allies taking on greater responsibility.", "refs": ["sagu-handover"]}, {"tr": "Bir kefede bir koltuk değişiyor: personel, karargâh düzeni ve gündem sırası artık başka bir başkentin sorumluluğunda. Öbür kefede taahhüt değişmiyor. Yetkililerin verdiği bilgi, çalışmanın kesintiye uğramayacağı yönünde; yani devredilen şey yürütmenin sorumluluğu, kaynağın kendisi değil. Bir masanın başına kimin oturduğu ile masaya neyin konduğu ayrı sorular.", "en": "In one pan a chair changes hands: staffing, headquarters routine and the order of business now belong to another capital. In the other pan the commitment does not change. Officials describe the work as continuing uninterrupted, which means what moves is responsibility for execution rather than the resource itself. Who sits at the head of a table and what is placed on it are separate questions.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Aynı hattın öbür ucu", "en": "The other end of the same line"}, "ps": [{"tr": "Devrin karşılaştığı kısıt, aynı hafta Kiev'de görünür oldu. Cumhurbaşkanı Volodimir Zelenskiy 27 balistik füzenin atıldığını, bunlardan yalnızca birinin bir Patriot sistemiyle düşürüldüğünü açıkladı; acil servisler en az dokuz ölü ve 33 yaralı bildirdi. Koordinasyonun konusu olan tedarik akışının darboğazı, komutanlığın kimde olduğuyla değil, akıtılacak stokla ilgili.", "en": "The constraint the handover meets became visible in Kyiv the same week. President Volodymyr Zelenskyy said 27 ballistic missiles were launched and only one was brought down by a Patriot system; emergency services reported at least nine dead and 33 wounded. The bottleneck in the supply flow that coordination exists to manage is a question of stock, not of who holds the command.", "refs": ["sagu-handover", "kyiv-salvo"]}, {"tr": "Karşı sav güçlü: bir yıla yayılan ve ABD Avrupa Komutanlığı'nı yardımcı komutan düzeyinde tutan devir, tam da akışın değişken hâline gelmemesi için tasarlanmış olabilir. İttifak içi yük paylaşımı, öncelikleri kayan bir lider devletin görevi tümüyle bırakmasındansa görevin sürmesini sağlayan en az sarsıcı yol da olabilir. Bu okumada devir bir geri çekilme değil, bir sigorta.", "en": "The countercase is strong: a transfer spread over a year that keeps US European Command at deputy level may be designed precisely so that the flow does not become the variable. Burden-sharing inside an alliance can also be the least disruptive way of keeping a mission alive when the lead nation's priorities move, rather than of ending it. On that reading the handover is an insurance policy, not a withdrawal.", "refs": ["sagu-handover"]}]}, {"h": {"tr": "Devir tamamlandığında sorulacak soru", "en": "The question when the transfer completes"}, "ps": [{"tr": "Geriye tek bir açık soru kalıyor: komutayı devralan devlet, kendi bütçesiyle ve kendi personeliyle aynı akışı sürdürebilir mi, yoksa koltuğun yeni sahibi karar yetkisi olmadan sorumluluk mu üstlenir? Bu sorunun cevabı duyuruyla birlikte gelmiyor; devir takviminin sonunda, sevkiyatın sürekliliğine bakılarak veriliyor.", "en": "One open question remains: can the state that takes command sustain the same flow with its own budget and its own staff, or does the new occupant of the chair assume responsibility without the power of decision? The answer does not arrive with the announcement; it arrives at the end of the transition timetable, and the measure is the continuity of deliveries.", "refs": ["sagu-handover"]}]}], "sources": [{"key": "sagu-handover", "kind": "news", "name": "Interfax-Ukraine", "url": "https://en.interfax.com.ua/news/general/1189917.html", "title": {"tr": "Pentagon, Ukrayna'ya yardımı koordine eden komutanlığın başını bir NATO müttefikine bırakıyor", "en": "The Pentagon is handing leadership of the Ukraine aid command to a NATO ally"}, "publishedDate": "2026-08-01"}, {"key": "kyiv-salvo", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "Bir konteyner gemisi savaşı sürdüren tesis sayıldı", "en": "A container ship was counted as a facility that sustains the war"}, "excerpt": {"tr": "Yanina, Novorossiysk'in 130 deniz mili açığında iki insansız deniz aracıyla vuruldu. Hedef seçimini belirleyen ölçü mesafe değil, geminin hangi zincirin parçası sayıldığı.", "en": "The Yanina was struck by two naval drones 130 nautical miles off Novorossiysk. What sets the target is the chain the ship is counted as part of, rather than the distance to it."}, "sections": [{"h": {"tr": "Menzil ve hedef", "en": "Range and target"}, "ps": [{"tr": "Volodimir Zelenskiy, yaptırım listesindeki Rus bayraklı Yanina'nın iki insansız deniz aracıyla batırıldığını açıkladı. Gemi 100.000 tonun üzerinde kapasiteli; saldırı Novorossiysk limanının yaklaşık 130 deniz mili açığında, uluslararası sularda gerçekleşti. Zelenskiy hedeflerin savaş çabasını ayakta tutan tesisler arasından seçildiğini söyledi. Rosatom Genel Müdürü Aleksey Lihaçev geminin dondurulmuş gıda ve inşaat malzemesi taşıdığını öne sürdü, saldırıyı korsanlık olarak niteledi ve 17 mürettebatın kurtarıldığını bildirdi.", "en": "Volodymyr Zelensky said the sanctioned Russian-flagged Yanina had been sunk by two naval drones. The vessel has a capacity of more than 100,000 tonnes; the strike took place in international waters about 130 nautical miles off the port of Novorossiysk. Zelensky said targets were chosen from among facilities that sustain the war effort. Rosatom's chief executive Alexey Likhachev said the ship was carrying frozen food and construction materials, called the attack piracy and said all 17 crew had been rescued.", "refs": ["yanina-strike"]}, {"tr": "130 deniz mili bir niyet beyanı değil, bir dayanıklılık ve hedefleme ölçüsüdür. Kıyıdan çıkan insansız yüzey araçları, bu mesafede bir ticari tekneyi tehdit altında tutabiliyorsa, kıyı savunmasına bağlı bir kuvvet açık denizde risk üretebilen bir kuvvete dönüşmüş demektir. Karşı sav da geçerli: tek bir başarılı vuruş, sürdürülebilir bir tempo kanıtlamaz. Hava, seyir koşulları ve hedefin manevra yapmaması da sonucu açıklayabilir.", "en": "130 nautical miles measures endurance and targeting rather than intent. If uncrewed surface vessels launched from shore can hold a commercial hull at risk at that distance, a force tied to coastal defence has become one that can generate risk in open water. The countercase holds too: a single successful strike does not establish a sustainable rate. Weather, sea state and a target that did not manoeuvre could equally explain the outcome.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Sınıflandırma sorunu", "en": "The classification problem"}, "ps": [{"tr": "Aynı gövde için iki bağdaşmaz tanım ortaya kondu: savaş çabasını ayakta tutan bir tesis ve sivil yük taşıyan bir ticaret gemisi. Kyiv Independent, Rus tarafının iddialarını bağımsız olarak doğrulayamadığını yazdı. Doğrulanabilir olan yalnızca üç şey: geminin yaptırım listesinde bulunması, Rosatom'un olayı sahiplenerek açıklama yapması ve saldırının gerçekleşmiş olması. Kimin ne taşıdığı bu bilgiyle henüz kapanmıyor.", "en": "Two incompatible descriptions were offered for one hull: a facility sustaining the war effort, and a merchant ship carrying civilian cargo. The Kyiv Independent said it could not independently verify the Russian claims. Only three things are verifiable: that the ship was under sanctions, that Rosatom spoke for it, and that the strike happened. What was on board is not settled by this evidence.", "refs": ["yanina-strike"]}, {"tr": "Askerî olarak önemli olan, sınıflandırmanın sonucu değil, sınıflandırmanın kendisinin bir kabiliyet gerektirmesi. Bir gemiyi yaptırım listesiyle, sahiplik zinciriyle ve rotasıyla eşleştirip vurulabilir hâle getirmek, füzeden çok istihbarat ve hedefleme işidir. Ukrayna aynı gün Rusya'nın derinliklerindeki üç rafineriyi ve dört radar sistemini de vurduğunu açıkladı; bu, hedef üretiminin tek bir alana bağlı olmadığını gösteriyor.", "en": "What matters militarily is that classifying at all requires a capability, whatever the classification concludes. Matching a hull to a sanctions listing, an ownership chain and a sailing route until it becomes strikeable is a task of intelligence and targeting more than of munitions. Ukraine said it had also struck three refineries and four radar systems deep inside Russia the same day, which suggests target generation is not confined to one domain.", "refs": ["yanina-strike"]}]}, {"h": {"tr": "Tekrar olursa ne görünür", "en": "What becomes visible if it repeats"}, "ps": [{"tr": "Bu vuruş bir kereye mahsus mu, yoksa bir tempo mu, ekim sonuna kadar anlaşılır. Benzer mesafelerde ticari gövdelere yönelik ikinci ve üçüncü bir vuruş gelirse, gözlenecek karşılık refakat ve konvoy düzeni ya da Novorossiysk trafiğinin başka limanlara kayması olacaktır. Bu tedbirlerden hiçbiri görülmezse, olay bir kabiliyet gösterisi olarak kalır ve tempo iddiası düşer.", "en": "Whether this was a one-off or a tempo will be clear by the end of October. If a second and third strike on commercial hulls follow at comparable distances, the response to watch is escort and convoy practice, or a shift of Novorossiysk traffic to other ports. If none of those measures appears, the event stands as a demonstration of capability and the claim of tempo falls.", "refs": ["yanina-strike"]}]}], "sources": [{"key": "yanina-strike", "kind": "news", "name": "The Kyiv Independent", "url": "https://kyivindependent.com/ukraine-strikes-3-russian-oil-refineries-sinks-sanctioned-ship-zelensky-says/", "title": {"tr": "Ukrayna, yaptırım listesindeki Rus konteyner gemisi Yanina'yı batırdığını açıkladı", "en": "Ukraine says it sank the sanctioned Russian container ship Yanina"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Günlük 170.000 varil akan hatta 750.000 varil taahhüdü", "en": "A 750,000-barrel commitment on a line carrying 170,000"}, "excerpt": {"tr": "BOTAŞ ile SOMO ve NOC'un imzaladığı bir yıllık transit düzenlemesi günlük en az 750.000 varil öngörüyor. Hattın bugünkü akışı yaklaşık 170.000 varil; aradaki fark bir söz meselesi değil, bir yükleme meselesi.", "en": "The one-year transit arrangement BOTAŞ signed with SOMO and NOC sets a floor of 750,000 barrels a day. The line currently moves about 170,000; the gap is a loading problem rather than a promise."}, "sections": [{"h": {"tr": "Üç sayı ve bir süre", "en": "Three numbers and a term"}, "ps": [{"tr": "Cumartesi imzalanan düzenleme günlük en az 750.000 varil öngörüyor. Hattın tasarım kapasitesi 1,5 milyon varil, bugünkü akışı ise yaklaşık 170.000 varil ve bunun büyük bölümü Irak'ın Kürdistan bölgesindeki sahalardan geliyor. Anlaşma bir yıl yürürlükte kalacak; petrol, elektrik ve su kaynaklarını kapsayan geniş çerçeve ise hâlâ görüşülüyor.", "en": "The arrangement signed on Saturday sets a floor of 750,000 barrels a day. The line's design capacity is 1.5 million barrels and its current flow is about 170,000, most of it from fields in Iraq's Kurdistan region. The agreement runs for a year; the broader framework covering oil, electricity and water resources is still under negotiation.", "refs": ["ceyhan-transit"]}, {"tr": "Taban rakamı bir taahhüt, bir akış değil. Bugünkü hacmin ağırlığı kuzeydeki bir kaynak grubundan geliyorsa, 170.000'den 750.000'e çıkmak aynı sahaların daha çok üretmesiyle değil, federal denetimdeki üretimin bu hatta yönlendirilmesiyle olur. Bu bir tahsis kararı, bir boru kararı değil. Alternatif de var: taban rakamı çerçeve müzakeresinde tarafların birbirine gösterdiği bir referans olabilir ve fiilî akışın hiç değişmemesi de anlaşmanın ihlali sayılmayabilir.", "en": "A floor is a commitment, not a flow. If the bulk of today's volume comes from one group of northern fields, moving from 170,000 to 750,000 happens not by those fields producing more but by output under federal control being routed onto this line. That is an allocation decision, not a pipeline decision. There is an alternative: the floor may be a reference point the two sides hold up during the framework talks, and actual flow never changing may not amount to a breach.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Sayılar Hürmüz'de başlıyor. Irak'ın petrol ihracatı, şubat sonunda Amerika Birleşik Devletleri ile İsrail'in İran'a düzenlediği saldırıların ardından yüzde 80'in üzerinde geriledi; aylık gelirler yaklaşık 6 milyar dolar düzeyinden 2 milyar dolar altına indi. Boğaz kapalıyken Ceyhan, Irak ham petrolü için boğazdan geçmeyen tek yüksek kapasiteli çıkış.", "en": "The numbers begin at Hormuz. Iraq's oil exports fell by more than 80 percent after the United States and Israel struck Iran in late February, and monthly revenues dropped from about $6bn to under $2bn. For Iraqi crude, Ceyhan is the only high-capacity outlet that avoids the Strait of Hormuz while it stays closed.", "refs": ["ceyhan-transit"]}, {"tr": "Yükü kimin taşıdığı da buradan okunuyor. Bekleyebilecek durumda olmayan taraf Bağdat: gelir açığı aylık ve bütçesel. Türkiye tarafında kazanç transit ücreti ve boş kapasitenin doldurulması. Alıcılar içinse Ceyhan, Basra'ya göre farklı bir sigorta ve navlun profiline sahip bir yükleme noktası. Enerji ve Tabii Kaynaklar Bakanı Alparslan Bayraktar düzenlemenin uzun vadeli anlaşma çabaları sürerken uygulamaya konduğunu söyledi; Irak Başbakanı Ali el-Zeydi ise anlaşmayı önemli bir stratejik dönüm noktası olarak nitelendirdi.", "en": "Incidence can be read from the same place. The party that cannot wait is Baghdad: the revenue gap is monthly and budgetary. On the Turkish side the gain is transit revenue and the filling of idle capacity. For buyers, Ceyhan is a loading point with a different insurance and freight profile from Basra. Energy Minister Alparslan Bayraktar said the arrangement had been put in place while work continued towards a long-term agreement; Iraq's Prime Minister Ali al-Zaidi called it an important strategic milestone.", "refs": ["ceyhan-transit"]}]}, {"h": {"tr": "Bir yılın fiyatladığı şey", "en": "What a one-year term prices"}, "ps": [{"tr": "Sürenin kendisi bir bilgi taşıyor. Onlarca yıllık eski düzenlemenin yerine kalıcı bir metin değil, on iki aylık bir köprü konmuş. Bir köprünün fiyatlanması, iki tarafın da uzun vadeli çerçeveyi bu süre içinde bağlamayı taahhüt etmemesi anlamına gelir; aynı zamanda boğaz sorununun bir yıl içinde çözüleceğine dair bir varsayımın da satın alınmadığını gösterir. Taban rakamının anlamı, Ceyhan'daki aylık yükleme verilerinde görünecek.", "en": "The term itself carries information. What replaced a decades-old arrangement is a twelve-month bridge rather than a permanent text. Pricing a bridge means neither side has undertaken to bind the long-term framework within that period; it also shows that no assumption about the strait being resolved inside a year has been bought. The meaning of the floor shows up in monthly loading data at Ceyhan.", "refs": ["ceyhan-transit"]}]}], "sources": [{"key": "ceyhan-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/turkiye-and-iraq-sign-one-year-oil-pipeline-deal-amid-global-shift", "title": {"tr": "Türkiye ile Irak, Kerkük-Ceyhan hattı için bir yıllık transit anlaşması imzaladı", "en": "Türkiye and Iraq sign a one-year transit deal for the Kirkuk-Ceyhan pipeline"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Arakçi'nin arama listesinde bir genelkurmay başkanı da var", "en": "An army chief is on Araghchi's call list"}, "excerpt": {"tr": "İran cumartesi günü Pakistan, Türkiye ve Suudi Arabistan'a ayrı ayrı telefon açtı. Pakistan'daki muhatap dışişleri bakanı değil, Genelkurmay Başkanı Asım Münir'di ve üç görüşmenin metni aynı değil.", "en": "Iran placed separate calls to Pakistan, Türkiye and Saudi Arabia on Saturday. In Pakistan the counterpart was the army chief, Asim Munir, not the foreign minister, and the three readouts are not identical."}, "sections": [{"h": {"tr": "Kime ne söylendi", "en": "Who was told what"}, "ps": [{"tr": "İran'ın yarı resmî Mehr ajansına dayandırılan aktarıma göre Dışişleri Bakanı Seyyid Abbas Arakçi cumartesi günü üç ayrı telefon görüşmesi yaptı: Pakistan Genelkurmay Başkanı Asım Münir, Türkiye Dışişleri Bakanı Hakan Fidan ve Suudi Arabistan Dışişleri Bakanı Prens Faysal bin Ferhan. Münir ve Fidan'a söylenen, İran'ın egemenliğini, toprak bütünlüğünü ve ulusal güvenliğini korumaya hazır olduğu ve her saldırıya kararlılıkla karşılık vereceğiydi.", "en": "According to an account sourced to Iran's semi-official Mehr news agency, Foreign Minister Seyed Abbas Araghchi made three separate calls on Saturday: to Pakistan's Chief of Army Staff Asim Munir, Turkish Foreign Minister Hakan Fidan and Saudi Foreign Minister Prince Faisal bin Farhan. What Munir and Fidan were told was that Iran is prepared to safeguard its sovereignty, territorial integrity and national security and would respond decisively to any aggression.", "refs": ["araghchi-calls"]}, {"tr": "Riyad'a söylenen bir cümle uzun. Suudi mevkidaşına yapılan uyarıda yalnızca Amerika Birleşik Devletleri ya da İsrail kaynaklı düşmanca bir eylem değil, bu eyleme verilecek bölgesel destek de kararlı ve orantılı bir yanıtın gerekçesi olarak sayıldı. Farkın kaynağı iki türlü açıklanabilir: ya üç muhatap gerçekten farklı bir eşikle muhatap edildi, ya da fark görüşmelerde değil, bakanlığın kamuoyuna yazdığı metinde oluştu. Elimizdeki kanıt ikisini ayırmaya yetmiyor.", "en": "What Riyadh was told runs one clause longer. In the warning to the Saudi counterpart it was not only hostile action by the United States or Israel that was named as grounds for a firm and proportionate response, but regional support for such action as well. The difference admits two explanations: either the three counterparts really were addressed with different thresholds, or the difference arose in the ministry's public text rather than in the conversations. The available evidence does not separate them.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Üç muhatap, üç ayrı kısıt", "en": "Three counterparts, three constraints"}, "ps": [{"tr": "Belgelenmiş olan yalnızca kiminle konuşulduğu ve o kişinin makamı. Pakistan'da kanal askerî; muhatap ordunun başındaki isim. Türkiye'de kanal diplomatik; muhatap NATO üyesi bir devletin dışişleri bakanı. Suudi Arabistan'da da kanal diplomatik, ama metnin en açık uyarısı oraya yöneltilmiş. Muhatap seçimi, İran'ın her başkentte hangi kurumun karar verdiğine dair kendi değerlendirmesini gösteriyor; bu değerlendirmenin doğru olup olmadığı ayrı bir soru.", "en": "What is documented is only who was spoken to and in what office. In Pakistan the channel is military; the counterpart heads the army. In Türkiye the channel is diplomatic; the counterpart is the foreign minister of a NATO member state. In Saudi Arabia the channel is diplomatic too, yet the text's most explicit warning was directed there. The choice of interlocutor shows Iran's own assessment of which institution decides in each capital; whether that assessment is correct is a separate question.", "refs": ["araghchi-calls"]}, {"tr": "Üç devletin önüne konan talep, taraf olmadıkları bir metin üzerinden geliyor. İran Dışişleri Bakanlığı aynı gün Washington'u haziran ortasında varılan mutabakatı ihlal etmekle suçladı; gerekçe olarak süren saldırıları, limanlara ve ticari denizciliğe uygulanan ablukayı ve artan ekonomik baskıyı gösterdi. İslamabad, Ankara ve Riyad'dan istenen, imzacısı olmadıkları bir mutabakatın ihlali konusunda tavır almak. Karşı okuma da mümkün: görüşmeler dış politikadan çok iç kamuoyuna dönük bir kararlılık gösterisi olabilir.", "en": "The demand placed before the three states arrives through a text they are not party to. Iran's foreign ministry accused Washington the same day of breaching the memorandum agreed in mid-June, citing continuing strikes, a blockade of ports and commercial shipping and increased economic pressure. What is asked of Islamabad, Ankara and Riyadh is to take a position on the breach of an understanding they did not sign. A contrary reading is available: the calls may be a display of resolve aimed at domestic audiences rather than at foreign policy.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Elde tek bir taraf var", "en": "Only one side has spoken"}, "ps": [{"tr": "Bu üç görüşmeye dair elimizdeki tek anlatı İran'ın kendi anlatısı. Pakistan, Türkiye ve Suudi Arabistan kendi özetlerini yayımladıklarında asıl bilgi, İran'ın metninde bulunup onlarınkinde bulunmayan cümlelerde bulunuyor. Özellikle bölgesel desteğin bir yanıt gerekçesi sayılması, üç hükümetin de sessiz kalmayı ya da farklı bir dille cevap vermeyi seçebileceği bir yer. İzlenecek somut işaret şu: bu üç dışişleri bakanlığından herhangi biri kendi özetinde bölgesel destek ifadesini tekrarlarsa, uyarının kabul edildiği doğrulanır; ifadeyi atlarlarsa, çağrının karşılıksız kaldığı anlaşılır.", "en": "The only account of these three conversations that exists is Iran's own. When Pakistan, Türkiye and Saudi Arabia publish their own summaries, the real information lies in the sentences present in Iran's text and absent from theirs. The clause treating regional support as grounds for a response is precisely the point at which all three governments may choose silence or a different formulation. The concrete signal to watch is this: if any of the three foreign ministries repeats the regional-support wording in its own summary, the warning was accepted; if they omit it, the approach went unanswered.", "refs": ["araghchi-calls"]}]}], "sources": [{"key": "araghchi-calls", "kind": "news", "name": "Xinhua", "url": "https://english.news.cn/20260802/e50cf362c21a4efdb0ff77ef0f413399/c.html", "title": {"tr": "Arakçi, Pakistan, Türkiye ve Suudi Arabistan'a bölgesel destek uyarısı yaptı", "en": "Araghchi warns Pakistan, Türkiye and Saudi Arabia against backing US action"}, "publishedDate": "2026-08-02"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "Sheraro'daki çatışma 2022'de ertelenen maddelerin üzerinde duruyor", "en": "The fighting at Sheraro stands on the clauses postponed in 2022"}, "excerpt": {"tr": "Batı Tigray'da cumartesi şafağında başlayan çatışma, Kasım 2022 anlaşmasının çözdüğü değil ileriye bıraktığı iki başlığın üzerinde: silahsızlanma ve TPLF'nin hukuki statüsü.", "en": "The fighting that began at dawn on Saturday in western Tigray rests on the two items the November 2022 agreement postponed rather than settled: disarmament and the TPLF's legal status."}, "sections": [{"h": {"tr": "Yer ve tarih birlikte okunduğunda", "en": "Reading the place and the date together"}, "ps": [{"tr": "Çatışma, Sudan sınırına yakın Sheraro çevresinde cumartesi şafağında başladı. Tigray bölge yönetimi saldırıyı federal kuvvetlere yükledi; federal bakan Abraham Belay ise TPLF başkanı Debretsion Gebremichael'e bağlı güçlerin başlattığını söyledi ve savaşın yeterince sürdüğünü, anlaşmazlıkların diyalogla çözülmesi gerektiğini ekledi. Etiyopya uzmanı Kjetil Tronvoll olayı 2022 anlaşmasından bu yana yaşanan en ciddi olay olarak niteledi. İki anlatının hiçbiri bağımsız doğrulanmış değil ve can kaybı bildirilmedi.", "en": "The fighting began at dawn on Saturday around Sheraro, close to the Sudanese border. Tigray's regional government attributed the assault to federal forces; the federal minister Abraham Belay said forces loyal to TPLF chairman Debretsion Gebremichael had started it, adding that the war had gone on long enough and that differences should be settled through dialogue. Kjetil Tronvoll, a specialist on Ethiopia, called it the most serious incident since the 2022 agreement. Neither account is independently verified and no casualty figures were reported.", "refs": ["tigray-sheraro"]}, {"tr": "Kasım 2022'de imzalanan Pretoria anlaşması, 2020'de başlayan ve yüz binlerce kişinin ölümüne yol açan savaşı bitirdi. Bitirmediği iki şey vardı: silahların kimin elinde kalacağı ve TPLF'nin hangi hukuki sıfatla var olacağı. Bu iki başlık dört yıl boyunca askıda kaldı; TPLF temmuz ortasında anlaşmanın fiilen sona erdiğini açıkladı. Devralınan düzenleme burada tamamlanmamış bir silah ve statü tasfiyesi olarak duruyor.", "en": "The Pretoria agreement signed in November 2022 ended a war that began in 2020 and killed hundreds of thousands. Two things it did not end were the question of who would keep the weapons and under what legal standing the TPLF would exist. Those two items hung unresolved for four years; in mid-July the TPLF said the agreement was effectively dead. The inherited arrangement here is an unfinished disposition of arms and standing rather than a boundary line.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Neden bugün ve neden burada", "en": "Why today, and why here"}, "ps": [{"tr": "Tetiği çeken şey, o metni imzalayan tarafın kendi içindeki yarılma. Başbakan Abiy Ahmed'in danışmanı Getachew Reda, Debretsion'un Eritre'ye ve Amhara milislerine yaslanarak iktidarı ele geçirmeye çalıştığını öne sürdü. Suçlama dışarıdan değil, anlaşmanın Tigray tarafını temsil eden yapının içinden geliyor. Bir uzlaşma metni tek bir muhatap varsayarak yazıldığında, o muhatabın ikiye ayrılması metnin öngörmediği bir durumdur.", "en": "What pulled the trigger is a split inside the party that signed the old text. Getachew Reda, an adviser to Prime Minister Abiy Ahmed, said Debretsion was leaning on Eritrea and on Amhara militias in a bid to seize power. The accusation comes not from outside but from within the structure that represented the Tigrayan side of the agreement. When a settlement is drafted on the assumption of a single counterparty, that counterparty splitting in two is a case the text does not provide for.", "refs": ["tigray-sheraro"]}, {"tr": "Dışarıdan uygulanan araçlar da aynı boşluğa çarpıyor. Amerika Birleşik Devletleri haziranda TPLF içindeki sertlik yanlılarına vize kısıtlaması getirdi ve Büyükelçi Ervin Massinga anlaşmayı korumak için Mekelle'ye gitti. Hukuki statüsü hiçbir zaman sabitlenmemiş bir yapı içinde kimin sertlik yanlısı sayılacağını belirlemek, ancak o yapının bir muhatap olarak tanınmasıyla mümkün. Bölge analisti Faisal Roble güçlü bir uluslararası müdahale olmadan çok daha büyük bir savaşa gidilebileceği uyarısında bulundu.", "en": "Instruments applied from outside run into the same gap. The United States imposed visa restrictions on hardliners within the TPLF in June, and Ambassador Ervin Massinga travelled to Mekelle to preserve the agreement. Deciding who counts as a hardliner inside a structure whose legal status was never fixed is possible only by recognising that structure as a counterparty. The regional analyst Faisal Roble warned that without strong international intervention the situation could move towards a much larger war.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Benzemeyen yan", "en": "Where the resemblance breaks"}, "ps": [{"tr": "2020'yi hatırlatan bir sahne var, ama fay hattı aynı yerde değil. O savaşta çizgi Mekelle ile Addis Ababa arasından geçiyordu. Cumartesi tarif edilen hizalanmalar bu çizgiyi kesiyor: diyalog çağrısı yapan bir federal bakan, başbakana danışmanlık yapan eski bir TPLF ismi ve bir Tigray hizbinin son savaşın dışarıdaki ordusu Eritre'ye yaslandığı iddiası. İki blok varsayan bir emsal, burada açıklama gücünü yitiriyor; bu yüzden mesele savaşın yeniden başlayıp başlamayacağından çok, hukuki statüsü belirlenmemiş bir tarafla nasıl bir geçici yönetim kurulacağı.", "en": "There is a scene here that recalls 2020, but the fault line does not run in the same place. In that war the line lay between Mekelle and Addis Ababa. The alignments described on Saturday cut across it: a federal minister calling for dialogue, a former TPLF figure advising the prime minister, and the claim that a Tigrayan faction is leaning on Eritrea, the outside army of the last war. A precedent that assumes two blocs loses its explanatory power here; the question is therefore less whether the war resumes than what kind of interim administration can be built with a party whose legal standing was never fixed.", "refs": ["tigray-sheraro"]}]}], "sources": [{"key": "tigray-sheraro", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/fighting-breaks-out-in-western-tigray-as-ethiopia-and-tplf-trade-blame", "title": {"tr": "Batı Tigray'da çatışma çıktı, Addis Ababa ile TPLF birbirini suçluyor", "en": "Fighting erupts in western Tigray as Addis Ababa and the TPLF trade blame"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Şubat'ta tebliğ edildi, ağustosta duyuruldu", "en": "Served in February, made public in August"}, "excerpt": {"tr": "Celbin muhatabı sızdıran kişi değil, haberi yayımlayan gazeteci. Zorlayıcı gücü, sızıntıya ilişkin bir bulgudan değil, uyulmadığında devreye giren yaptırımdan geliyor; altı ay boyunca kamuya açılmamış olması da aracın nasıl çalıştığına dair ayrı bir bilgi.", "en": "The subpoena is addressed to the journalist who published, rather than to whoever leaked. Its compelling force comes from the sanction that follows non-compliance, not from any finding about the leak, and the six months it spent out of public view are separate information about how the instrument works."}, "sections": [{"h": {"tr": "Aracın kimliği", "en": "Identifying the instrument"}, "ps": [{"tr": "New York Times, 1 Ağustos'ta Adalet Bakanlığı'nın bağımsız muhabir Matthew Cole'a bir celp gönderdiğini açıkladı. Celp, şubat 2026'da FBI ajanları tarafından Cole'un New York'taki evinde tebliğ edilmiş ve Kuzey Kore'deki gizli bir askerî operasyona ilişkin haberinin kaynaklarını açıklaması istenmişti. Söz konusu araştırma eylül 2025'te Times'ın ulusal muhabiri Dave Philipps ile birlikte yayımlanmış, 2019'da Kuzey Kore kıyılarına elektronik dinleme donanımı yerleştirmeyi amaçlayan gizlilik dereceli bir Deniz Kuvvetleri SEAL görevini anlatmıştı.", "en": "On 1 August the New York Times disclosed that the Justice Department had sent a subpoena to the freelance reporter Matthew Cole. FBI agents delivered it at his New York home in February 2026, demanding that he identify the sources for his reporting on a secret military operation in North Korea. That investigation, published in September 2025 with the paper's national correspondent Dave Philipps, described a classified 2019 Navy SEAL mission to place electronic surveillance equipment on North Korean shores.", "refs": ["nyt-subpoena"]}, {"tr": "Celp, muhatabından ifade ya da belge talep eden zorlayıcı bir araçtır. Bir açıklamanın hukuka aykırı olduğunu saptamaz ve bir sanık göstermez; yalnızca elindeki bilgiyi vermesi istenen kişiye yönelir. Bu tercihin somut ölçüsü, olayda adı geçen hukukçularda görülüyor: Cole'u David A. O'Neill temsil ediyor, gazete tarafında baş hukuk müşaviri David McCraw ile avukat Douglas Zolkind yer alıyor. Uyulmama kararının bedelini üstlenecek taraf, kaynağı koruyan gazeteci ve onun arkasındaki yayın kurumudur.", "en": "A subpoena is a compulsory demand for testimony or material addressed to its recipient. It settles nothing about whether a disclosure was unlawful and identifies no defendant; it runs only to the person asked to hand over what he holds. The concrete measure of that choice is visible in the lawyers named: Cole is represented by David A. O'Neill, while the paper fields general counsel David McCraw and the lawyer Douglas Zolkind. Whoever decides not to comply carries the cost, and that is the journalist protecting a source together with the publisher behind him.", "refs": ["nyt-subpoena"]}]}, {"h": {"tr": "Altı ayın anlamı", "en": "What the six months mean"}, "ps": [{"tr": "Belge şubatta tebliğ edildi, gazete ise 1 Ağustos'ta duyurdu. Bu tür bir araç muhatabını tebliğ anından itibaren bağlar; aradaki süre, hiçbir kamusal itirazla karşılaşmadan işlediği dönemdir. Sürenin uzunluğu, aracın tasarımıyla tutarlı bir okuma sunuyor: zorlama muhatabın üzerinde çalışır, kamuoyuna açmak ise onu gönderenin değil, alanın tercihidir. Bunun daha sade bir açıklaması da mümkün: avukatların hazırlık ya da bakanlıkla yürütülen bir görüşme nedeniyle erken duyuruyu sakıncalı bulması. O hâlde altı ay, aracın niteliğinden çok gazetenin hukuk stratejisini anlatıyor olabilir.", "en": "The document was served in February and the paper made it public on 1 August. An instrument of this kind binds its recipient from the moment of service, so the interval is the stretch in which it operated without any public challenge. Its length reads consistently with the instrument's design: compulsion works on the recipient, and going public is the choice of the party receiving it rather than an obligation of the party issuing it. A plainer explanation is available too — counsel may have judged early disclosure unwise while preparing a response or talking to the department — in which case the six months describe the paper's legal strategy more than the instrument's character.", "refs": ["nyt-subpoena"]}, {"tr": "Bundan sonrasında izlenecek adım, bakanlığın uymaya zorlamak için mahkemeye başvurup başvurmadığıdır. Hiç zorlanmayan bir celp, sınırları hiç sınanmadan bir maliyet yükler; mahkemeye taşınan bir celp ise bu muhabirin ötesine geçen bir yorum üretir. Ölçülebilir eşik şu: 31 Ekim 2026'ya kadar dosyada uymaya zorlama ya da iptal talebi görünürse, soru gazetenin masasından çıkıp yargısal bir zemine taşınmış olur. Görünmezse talep, ne kadar ileri gidebileceği hiç test edilmemiş bir baskı olarak yerinde kalır.", "en": "The step to watch is whether the department goes to court to compel compliance. A subpoena that is never enforced imposes a cost while its limits stay untested; one taken before a judge produces an interpretation that reaches past this reporter. The measurable threshold is this: if a motion to compel or to quash appears on the docket by 31 October 2026, the question has moved off the newspaper's desk onto judicial ground. If none appears, the demand sits where it is, as pressure whose reach has never been tried.", "refs": ["nyt-subpoena"]}]}], "sources": [{"key": "nyt-subpoena", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/new-york-times-reveals-trump-administration-subpoena-over-north-korea-story", "title": {"tr": "New York Times, Adalet Bakanlığı'nın Kuzey Kore operasyonu haberi nedeniyle bir muhabire celp gönderdiğini açıkladı", "en": "The New York Times says the Justice Department subpoenaed a reporter over a North Korea operation"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Çerçeveyi kim kabul etti, nerede yazılı?", "en": "Who agreed to the perimeters, and where is that written?"}, "excerpt": {"tr": "Trump'ın paylaşımı, Washington'ın ne elde ettiğini söylediğini aktarıyor. Duyuru anlaşmanın iki unsurunu sayıyor; Tahran da İsrail de bu iki unsur hakkında sessiz kaldı. Elde bir mutabakat metni değil, tek taraflı bir özet var.", "en": "Trump's post conveys what Washington says it has obtained. The announcement names two elements of an agreement; both Tehran and Israel have stayed silent on those two elements. What exists is a one-sided summary rather than an agreed text."}, "sections": [{"h": {"tr": "Duyuruda ne var", "en": "What the announcement contains"}, "ps": [{"tr": "Trump, Truth Social'daki paylaşımında ABD'nin \"hedefi kilitlemiş ve hazır\" olduğunu, ardından İran'ın ve diğer Orta Doğu ülkelerinin kendisinden beklemesini istediğini yazdı ve saldırıyı \"hızla bir ANLAŞMAYA varılabilmesi şartıyla\" iptal ettiğini duyurdu. Anlaşmanın iki unsuru sayılıyor: Hürmüz Boğazı'nın tümüyle açılması ve İran'ın nükleer tehdidinin sona ermesi. Paylaşımda \"İsrail de bu taahhütte bana katılıyor\" deniyor; ancak İsrail hükümeti hemen kamuya açık bir açıklama yapmadı, Tahran'dan da resmî bir yanıt gelmedi. Al Jazeera, Axios'a dayanarak Suudi Veliaht Prensi Muhammed bin Selman'ın cumartesi günü telefonla iptali istediğini aktardı.", "en": "In his Truth Social post Trump wrote that the United States was \"locked and loaded\", then said Iran and other Middle Eastern countries had asked him to hold off, and announced that he had cancelled the attack \"subject to being able to rapidly make a DEAL\". Two elements of the agreement are named: the complete opening of the Strait of Hormuz and an end to Iran's nuclear threat. The post says \"The country of Israel joins me in this commitment\", yet the Israeli government issued no immediate public statement and no official response came from Tehran. Al Jazeera, citing Axios, reported that Saudi Crown Prince Mohammed bin Salman telephoned on Saturday to ask for the cancellation.", "refs": ["iran-cancel"]}, {"tr": "Temas, gündem, çerçeve ve imzalanmış taahhüt ayrı aşamalardır. Burada belgelenen şey temastır: beklemeye dönük bir talep ve bir telefon görüşmesi, ardından çerçevenin tek taraflı biçimde anlatılması. Metindeki kritik fiil \"istendi\": duyuru inisiyatifi karşı tarafa yükleyerek tavizi henüz konuşmamış olan tarafın hanesine yazıyor. Bir kefede gerçek bir eylem var; saldırı yapılmadı ve bunun gözlenebilir bir karşılığı var. Öbür kefede çerçeveyi imzalayan ikinci bir el yok.", "en": "Contact, agenda, framework and signed commitment are separate stages. What is documented here is contact: a request to hold off, a telephone call, and then a one-sided account of the framework. The decisive verb in the text is \"asked\" — the announcement assigns the initiative to the other side and thereby books the concession to a party that has not yet spoken. In one pan sits a real act: no strike took place, and that has an observable referent. In the other pan there is no second hand on the framework.", "refs": ["iran-cancel"]}]}, {"h": {"tr": "Kim onaylayacak, kim bozabilir", "en": "Who ratifies, who can spoil"}, "ps": [{"tr": "Çerçeveyi onaylaması gereken taraf tek bir aktör değil. Amir-Hussein Radjy ve Lee Keath imzalı haber, Paydari hareketinden Said Celili çevresindeki aşırı sertlik yanlılarının tam zafer istediğini, Cumhurbaşkanı Mesud Pezeşkiyan ile baş müzakereci konumundaki Meclis Başkanı Muhammed Bakır Kalibaf'ın ise askerî baskıyı pazarlık kozu saydığını aktarıyor. Aynı haberde nisan ateşkesinin Yüksek Ulusal Güvenlik Konseyi'nde 13 üyeden 12'sinin desteğiyle geçtiği, tek karşı oyun Celili'ye ait olduğu; devlet televizyonunun ise hem Pezeşkiyan'ın hem Kalibaf'ın müzakereleri anlattığı yayınları kestiği yazılı. Washington'dan duyurulan bir çerçevenin karşısında onay üretebilecek bir merci gerekir: 12'ye 1'lik oy bu kapasitenin var olduğunu, kesilen yayınlar ise kullanılmasının bedeli olduğunu gösteriyor. Tahran'ın sessizliği pekâlâ kasıtlı bir sıralama da olabilir; müzakere eden taraf metin oturmadan teyidi bekletir, o hâlde sessizlik anlaşmanın yokluğunun değil taktiğin işareti sayılır.", "en": "The party that must ratify the framework is not a single actor. A report by Amir-Hussein Radjy and Lee Keath describes ultra-hardliners around Saeed Jalili of the Paydari movement pressing for total victory, while President Masoud Pezeshkian and Parliament Speaker Mohammad Bagher Ghalibaf, who serves as chief negotiator, treat military pressure as bargaining leverage. The same report says the April ceasefire passed the Supreme National Security Council with 12 of 13 members in favour and Jalili casting the only vote against, and that state television interrupted broadcasts in which both Pezeshkian and Ghalibaf discussed negotiations. A framework announced from Washington needs a body on the other side capable of producing ratification: the 12-to-1 vote shows that capacity exists, and the interrupted broadcasts show what using it costs. Tehran's silence may equally be deliberate sequencing — a negotiating party withholds confirmation until the text has settled — in which case the silence marks tactics rather than the absence of an agreement.", "refs": ["iran-cancel", "iran-factions"]}, {"tr": "Aynı hafta sonu, on bir ülkedeki ABD büyükelçilikleri Amerikalılara ayrılmayı değerlendirmelerini ya da bir tırmanma hâlinde ayrılmaya hazır olmalarını bildirdi; uyarılar Bahreyn'den Birleşik Arap Emirlikleri'ne uzanıyor. Aynı pencerede çıkan iki resmî işlem birbirinden farklı yönleri gösteriyor: biri bir anlaşmayı anlatıyor, öteki o anlaşmanın tutmaması ihtimaline hazırlanıyor. Duyurulan çerçeve ile kurumların fiilen davrandığı varsayım arasındaki mesafe budur ve ölçülebilir. Eşik şu: 16 Ağustos 2026'ya kadar ne İran dışişlerinden ne İsrail başbakanlığından gelen resmî bir açıklama iki unsuru da adıyla teyit ederse, duyuru tek taraflı bir konum olarak kalır.", "en": "That same weekend, US embassies in eleven countries told Americans to consider departing or to be ready to depart should there be escalation, in alerts running from Bahrain to the United Arab Emirates. Two official acts issued in the same window point in different directions: one describes an agreement, the other prepares for its failure. That distance between an announced framework and the assumption institutions actually act on is the measurable quantity here. The threshold: if by 16 August 2026 no official statement from Iran's foreign ministry or Israel's prime minister's office confirms both named elements, the announcement stands as a one-sided position.", "refs": ["iran-cancel", "us-alerts"]}]}], "sources": [{"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}, {"key": "iran-factions", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/irans-leadership-vacuum-leaves-two-factions-battling-for-control-over-wars-aim/", "title": {"tr": "İran'da aşırı sertlik yanlıları ile müzakerecilerin savaşın amacı konusunda bölündüğü aktarıldı", "en": "Iran's ultra-hardliners and negotiators are described as split over the war's aim"}, "publishedDate": "2026-08-02"}, {"key": "us-alerts", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020047/us-govt-advises-americans-to-leave-mideast", "title": {"tr": "ABD büyükelçilikleri on bir Orta Doğu ülkesindeki Amerikalılara ülkeden ayrılmayı değerlendirmelerini bildirdi", "en": "US embassies tell Americans in eleven Middle Eastern countries to consider leaving"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "THAAD envanterinin yaklaşık yarısı çoktan ateşlendi", "en": "About half the THAAD inventory is already spent"}, "excerpt": {"tr": "Siyasi bir duyuru saldırıyı iptal edebilir. Bir önleyiciyi yerine koymak üretim hattı ister ve aktarılan oranlar doğruysa, iki hızdan yavaş olanı üretim tarafında.", "en": "A political announcement can cancel a strike. Replacing an interceptor takes a production line, and on the figures reported, that line is the slower of the two."}, "sections": [{"h": {"tr": "Sayılabilir olan", "en": "What can be counted"}, "ps": [{"tr": "Dawn'ın haberine göre ABD Avrupa Komutanlığı Komutanı Orgeneral Alexus Grynkewich, bölgedeki deniz unsurlarının gerildiğini Pentagon yetkililerine kapalı biçimde iletti. Aktarılan rakamlar şöyle: 200'den fazla THAAD önleyicisi ateşlendi, bu envanterin kabaca yarısı; bunların 100'den fazlası donanma gemilerinden fırlatıldı. Hassas Vuruş Füzeleri'nin yaklaşık yüzde 45'i, Patriot önleyicilerinin yaklaşık yarısı, Tomahawk seyir füzelerinin yaklaşık yüzde 30'u, Havadan Karaya Ortak Menzil Dışı Füzeler'in yüzde 20'den fazlası ve SM-3 ile SM-6 önleyicilerinin yaklaşık yüzde 20'si kullanıldı. Değerlendirme kapalı olarak niteleniyor; Pentagon bu oranları yayımlamadı ve rakamlar bağımsız olarak doğrulanamadı.", "en": "Dawn reported that General Alexus Grynkewich, commander of US European Command, privately told Pentagon officials that naval assets in the region are stretched. The figures given run as follows: more than 200 THAAD interceptors fired, roughly half the inventory, of which more than 100 were launched from navy ships. About 45 percent of Precision Strike Missiles, around half of Patriot interceptors, roughly 30 percent of Tomahawk cruise missiles, more than 20 percent of Joint Air-to-Surface Standoff Missiles and about 20 percent of SM-3 and SM-6 interceptors have been used. The assessment is characterised as private; the Pentagon has not published these ratios and they could not be independently verified.", "refs": ["interceptors"]}, {"tr": "Kabiliyet niyetten daha dürüsttür, ama yalnızca doğru sayıldığında. Listedeki kalemler iki farklı şeyi anlatıyor. THAAD ve Patriot savunma önleyicileridir; tüketim hızını karşı tarafın fırlatma temposu belirler. Tomahawk, Hassas Vuruş Füzesi ve Menzil Dışı Füze ise taarruz mühimmatıdır; onları harcayan kendi kararlarındır. Birinci küme stok sahibinin denetiminde değil. Bildirilen kısıtın taarruz seçeneklerine değil füze savunmasına oturmasının nedeni bu asimetri. Oranların hangi paydaya göre verildiği ise belirsiz: yüzdeler küresel envanteri mi yoksa yalnızca bu harekât alanına tahsis edilen payı mı anlatıyor, haber bunu söylemiyor. Önceden konuşlandırılmış stoklar ya da müttefik envanterleri aritmetiği değiştirebilir.", "en": "Capability is more honest than intent, but only when it is counted correctly. The items on the list describe two different things. THAAD and Patriot are defensive interceptors whose consumption rate is set by the adversary's launch tempo. Tomahawk, the Precision Strike Missile and the standoff missile are offensive rounds, spent by one's own decisions. The first group is not under the holder's control, and that asymmetry is why the reported constraint lands on missile defence rather than on strike options. Which denominator the ratios use is left open: the report does not say whether the percentages describe global inventory or only the share allocated to this theatre. Pre-positioned stocks or allied inventories could change the arithmetic.", "refs": ["interceptors"]}]}, {"h": {"tr": "Seçimin biçimi", "en": "The shape of the choice"}, "ps": [{"tr": "Aktarılan formülasyon neyin önce tükendiği konusunda kesin: bölgeye bir muhrip daha görevlendirilmezse komutanların \"eninde sonunda Amerikan güçlerini korumakla İsrail için füze savunma harekâtını sürdürmek arasında zor bir seçimle karşılaşabileceği\" aktarılıyor. Bu, kabiliyetten çok idameye dair bir ifade; sistemler duruyor, soru kaç angajman boyunca destekleyebilecekleri. Gelişmiş önleyicilerin üretilebildiğinden hızlı tüketilmesi, bir savunma taahhüdünü tayınlama sorununa çevirir; taahhüdün inandırıcılığı o noktadan sonra beyanlara değil üretim hattına bağlanır. Bunun karşı okuması da açık: karşı tarafın fırlatma temposu kendi nedenleriyle düşerse, üretimde hiçbir şey değişmeden kısıt gevşer.", "en": "The formulation quoted is precise about what runs out first: without another destroyer assigned to the region, commanders \"could eventually face a difficult choice between protecting American forces and continuing missile-defence operations for Israel\". That is a statement about sustainment rather than capability; the systems are there, and the question is how many engagements they can support. Advanced interceptors consumed faster than they can be built turn a defensive commitment into a rationing problem, and from that point the commitment's credibility rests on a production line rather than on declarations. The counter-reading is equally plain: if the adversary's launch tempo falls for reasons of its own, the constraint eases with nothing changing in production.", "refs": ["interceptors"]}, {"tr": "Bu hafta sonu duyurulan iptal bu tabloyu çözmüyor. Ölçülebilir eşik şu: 30 Eylül 2026'ya kadar bölgeye ek bir ABD donanma muhribi kamuya açık biçimde görevlendirilirse, anlatılan ödünleşim çözülmemiş ama ertelenmiş olur; işaret, Savunma Bakanlığı'nın konuşlanma duyurusunda adı geçen ilave bir muhriptir. Güçten gelen itidal ile derinliği azalmış bir stoktan gelen itidal dışarıdan aynı görünür. İkisini ayıran tek büyüklük yeniden doldurma hızıdır ve o rakam kamuya açık değil.", "en": "The cancellation announced this weekend does not resolve any of this. The measurable threshold: if an additional US Navy destroyer is publicly assigned to the region by 30 September 2026, the trade-off described is deferred rather than solved, and the signal is a named additional destroyer in a Defense Department deployment announcement. Restraint that comes from strength and restraint that comes from a thinning magazine look identical from outside. The one quantity that separates them is the replacement rate, and that figure is not public.", "refs": ["interceptors", "iran-cancel"]}]}], "sources": [{"key": "interceptors", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020037/us-may-not-have-enough-forces-to-defend-israel-against-iran", "title": {"tr": "Habere göre ABD'nin THAAD önleyici füze stokunun yaklaşık yarısı harcandı", "en": "Report says about half the US THAAD interceptor inventory has been fired"}, "publishedDate": "2026-08-02"}, {"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Sigortacı, duyurudan önce ihbarı okur", "en": "The underwriter reads the advisory before the announcement"}, "excerpt": {"tr": "Boğazın tümüyle açılacağı duyurulmadan bir gün önce, aynı boğazın ağzında iki tekne vuruldu. Geçişi belirleyen büyüklük, kaptanların ve sigortacıların bu iki ihbarı nasıl fiyatladığıdır.", "en": "A day before the strait was announced as due to open completely, two hulls were struck at its mouth. The quantity that governs passage is how masters and underwriters price those two advisories."}, "sections": [{"h": {"tr": "İki ihbar, üç saat", "en": "Two advisories, three hours"}, "ps": [{"tr": "İngiltere Deniz Ticareti Operasyonları birimi UKMTO, 1 Ağustos'ta iki olay bildirdi. Umman'ın Musandam yarımadasındaki Lima açıklarının kuzeydoğusunda bir tanker kimliği belirsiz bir mermiyle vuruldu; makine dairesi hasar gördü, gemi manevra kabiliyetini yitirdi, yaralanma olmadı. Yaklaşık üç saat sonra Hasab'ın kuzeydoğusunda ikinci bir tankerin kaptanı, gemisinin çok yakınında büyük bir su sıçraması ve patlama gördüğünü bildirdi; o aşamada hasar aktarılmadı. Hiçbir grup olayları üstlenmedi. Boğazdan deniz yoluyla taşınan petrolün yaklaşık dörtte biri geçiyor.", "en": "The UK Maritime Trade Operations body, UKMTO, reported two incidents on 1 August. Northeast of Lima on Oman's Musandam peninsula a tanker was struck by an unknown projectile; its engine room was damaged, the vessel lost the ability to manoeuvre, and there were no injuries. About three hours later, northeast of Khasab, the master of a second tanker reported a large splash and an explosion very close to his ship, with no damage reported at that stage. No group claimed either incident. About a quarter of seaborne oil trade passes through the strait.", "refs": ["hormuz-tankers"]}, {"tr": "Lima ile Hasab aynı yarımadanın üzerinde, yani boğazın dış yaklaşma sularında; iki ihbarın arası üç saat. Bir darboğazda işleyen değişken, rotanın kullanılma maliyetidir. Makine dairesinden yara alan bir geminin rotanın en dar suyunda manevra kabiliyetini yitirmesi, kurtarma, refakat ve savaş riski primini besleyen türden bir olaydır. Bir darboğaz şokunu genellikle rota değişikliği emer; buradaki kaynak ise tek bir büyüklük veriyor, boğazın deniz yoluyla taşınan petroldeki yaklaşık dörtte birlik payı, ve başka hiçbir yerde yedek kapasite için rakam sunmuyor. Bu eksiklik, duyurulan bir açılışın tek başına duyurudan fiyatlanamamasının nedenidir.", "en": "Lima and Khasab sit on the same peninsula, in the strait's outer approaches, and the two advisories are three hours apart. In a chokepoint the operative variable is the cost of using a route rather than the fact that one exists. A ship taking damage in its engine room and losing the ability to manoeuvre in the narrowest water on the route is exactly the kind of event that feeds salvage, escort and war-risk pricing. A chokepoint shock is usually absorbed by rerouting; this source offers one quantity, the strait's share of about a quarter of seaborne oil trade, and no figure for spare capacity anywhere else. That gap is why an announced opening cannot be priced from the announcement alone.", "refs": ["hormuz-tankers"]}]}, {"h": {"tr": "Vaadin ölçülebilir kısmı", "en": "The measurable part of the promise"}, "ps": [{"tr": "Duyuru, anlaşmanın unsurlarından biri olarak Hürmüz Boğazı'nın tümüyle açılmasını sayıyor. Açıklık, geçiş yapan gemilerin gözlediği bir işletme koşuludur ve bir paylaşımın verebileceği hukuki bir statü değildir. İki ihbar duyurudan bir gün öncesine ait ve bu, kesin bir iddianın önüne ölçülebilir bir soru koyuyor. Bir darboğazda bağlayıcı kısıt, kaptanların ve onların sigortacılarının geçişi kabul etme isteğidir; bu istek ihbarlara tepki verir, bildirilere değil. Olayların boğazın siyasi durumuyla ilgisiz olması da mümkün: artık mühimmat, münferit bir saldırı ya da yanlış okunan bir gözlem olabilir; o hâlde tekrar etmedikleri sürece açılış yürür ve fiyat etkisi hızla söner.", "en": "The announcement lists the complete opening of the Strait of Hormuz among the elements of an agreement. Openness is an operating condition observed by the vessels that transit, and no post can confer it as a legal status. The two advisories are dated the day before the announcement, which places a measurable question in front of a categorical claim. In a chokepoint the binding constraint is the willingness of masters and their underwriters to accept the passage, and that willingness responds to advisories rather than to communiqués. It is also possible the incidents have nothing to do with the strait's political status — residual ordnance, an isolated attack, or a misread observation — in which case, absent repetition, an opening proceeds and the pricing effect decays quickly.", "refs": ["hormuz-tankers", "iran-cancel"]}, {"tr": "Sınama ucuz ve kamuya açık. İzlenecek işaret, önümüzdeki haftalarda aynı yaklaşma sularında yeni UKMTO ihbarlarının çıkıp çıkmadığıdır. 15 Eylül 2026'ya kadar yeni bir ihbar gelmezse, iki bildirim münferit bir çift olarak kalır ve duyurudaki açılış yaklaşma sularında fiziksel bir engelle karşılaşmaz. İhbarlar sürerse, vaat maliyeti hâlâ başka bir yerde belirlenen bir rota hakkında verilmiş olur. Burada ne prim serisi ne geçiş sayısı serisi aktarılıyor; bu yüzden yargı, elde bulunan tek gözlenebilir büyüklükle sınırlı tutuluyor.", "en": "The test is cheap and public. The signal to watch is whether fresh UKMTO advisories appear in the same approaches over the coming weeks. If none appears by 15 September 2026, the two reports stand as an isolated pair and the opening named in the announcement meets no physical obstacle in the approaches. If advisories continue, the promise has been made about a route whose cost is still being set elsewhere. Neither a premium series nor a transit-count series is cited here, so the judgement stays inside the one observable quantity available.", "refs": ["hormuz-tankers"]}]}], "sources": [{"key": "hormuz-tankers", "kind": "news", "name": "Euronews", "url": "http://www.euronews.com/2026/08/01/two-reported-attacks-on-tankers-near-strait-of-hormuz", "title": {"tr": "Hürmüz Boğazı yakınında iki tankerin ayrı olaylarda vurulduğu bildirildi", "en": "Two tankers reported hit in separate incidents near the Strait of Hormuz"}, "publishedDate": "2026-08-01"}, {"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Hiçbir ilçeye ait olmayan on iki sandalye", "en": "Twelve seats that belong to no district"}, "excerpt": {"tr": "Azad Cammu ve Keşmir'de pazar günü oylanan sandalyelerin on ikisi bir coğrafyaya değil, Pakistan geneline dağılmış mültecilere ait. Bu düzenleme seçim gününün lojistiğinden ibaret değil; yasama meclisinin kimlerden oluşacağına dair bir tercih.", "en": "Twelve of the seats voted on Sunday in Azad Jammu and Kashmir belong to no territory but to refugees dispersed across Pakistan. The arrangement is more than election-day logistics; it is a choice about who the legislature is made of."}, "sections": [{"h": {"tr": "İki farklı seçmen ölçeği", "en": "Two different scales of electorate"}, "ps": [{"tr": "Oy verme sabah 8 ile akşam 5 arasında yapıldı. Azad Cammu ve Keşmir Seçim Komisyonu'nun verdiği rakamlara göre Muzaffarabad bölgesindeki dokuz sandalye için 809.621 kayıtlı seçmen bulunuyor; sandalyelerin beşi Muzaffarabad ilçesine, ikişeri Neelum ve Celum Vadisi ilçelerine ayrılmış. Pakistan genelinde yaşayan mültecilere ayrılan on iki seçim bölgesinde ise 438.834 kayıtlı seçmen var; bunların altısı Keşmir Vadisi'nden, altısı Cammu'dan gelenleri temsil ediyor. Dokuz sandalye için 207, on iki mülteci sandalyesi için 137 aday yarıştı.", "en": "Polling ran from 8 in the morning to 5 in the afternoon. On the figures published by the Azad Jammu and Kashmir Election Commission, the nine seats in Muzaffarabad division draw on 809,621 registered voters, five of those seats belonging to Muzaffarabad district and two each to Neelum and Jhelum Valley. The twelve constituencies reserved for refugees living across Pakistan hold 438,834 registered voters, six representing people from the Kashmir Valley and six from Jammu. There were 207 candidates for the nine seats and 137 for the twelve refugee seats.", "refs": ["ajk-polls"]}, {"tr": "Komisyonun kendi rakamları bölündüğünde iki seçmen kütlesinin sandalye başına ağırlığı eşit çıkmıyor. Her mülteci sandalyesinin arkasında kabaca 36.600 kayıtlı seçmen var; Muzaffarabad bölgesindeki her sandalyenin arkasında ise yaklaşık 90.000. Yani mülteci seçim bölgesindeki bir oy, bölgedeki bir oyun yaklaşık iki buçuk katı ağırlık taşıyor. Aday yoğunluğu da bu farkı yansıtıyor: bölge sandalyesi başına yaklaşık 23 aday, mülteci sandalyesi başına yaklaşık 11. Bu oran, yerinden edilmiş seçmen kütlelerini orantılı değil yapısal olarak temsil eden bir tasarımı gösteriyor. Aynı fark kayıt kapsamından da doğabilir: Pakistan geneline yayılmış mülteci listeleri, seçme hakkı olanların yerleşik listelere göre daha küçük bir bölümünü kapsıyor olabilir; o durumda ağırlık farkı bir sayım sonucudur, bir tercih değil.", "en": "Divide the commission's own figures and the two electorates do not carry equal weight per seat. Roughly 36,600 registered voters stand behind each refugee seat, against about 90,000 behind each seat in Muzaffarabad division. A vote in a refugee constituency therefore carries about two and a half times the weight of one in the division. The density of candidates tracks the same gap: about 23 candidates per division seat against about 11 per refugee seat. The ratio points to a design that represents displaced electorates structurally rather than proportionally. The same difference could equally arise from registration coverage: refugee rolls compiled across Pakistan may capture a smaller share of those eligible than resident rolls do, in which case the weighting is an artefact of enumeration rather than a choice.", "refs": ["ajk-polls"]}]}, {"h": {"tr": "Sandıkların sınıflandırılması", "en": "How the ballot boxes were classified"}, "ps": [{"tr": "Bölgede kurulan 1.483 sandığın 533'ü çok hassas, 741'i hassas, 209'u normal olarak sınıflandırıldı; mülteci seçim bölgeleri için 1.057 sandık daha açıldı. Yani her yedi sandıktan yalnızca biri sıradan sayıldı ve üçte birden fazlası en yüksek kategoriye yerleştirildi. Bu sınıflandırma seçim otoritesinin idari bir değerlendirmesi ve oyun nerede korunması gerektiğine dair yayımlanmış en açık ölçü. Aday sayısı ile birlikte okunduğunda, bölge sandalyeleri hem daha kalabalık bir yarışa hem de daha yoğun bir güvenlik derecelendirmesine konu oluyor.", "en": "Of the 1,483 polling stations set up in the division, 533 were classed highly sensitive, 741 sensitive and 209 normal, with a further 1,057 stations serving the refugee constituencies. Only about one station in seven was treated as ordinary, and more than a third were placed in the highest category. The classification is an administrative judgement by the election authority and the clearest published measure of where it thinks the vote needs protecting. Read alongside the candidate counts, the division seats attract both a more crowded contest and a heavier security grading.", "refs": ["ajk-polls"]}, {"tr": "Bundan sonra yayımlanacak veri, komisyonun sandalye türüne göre katılım oranları. Ölçülebilir eşik şu: 30 Eylül 2026'ya kadar açıklanan rakamlarda on iki mülteci seçim bölgesinin katılımı Muzaffarabad bölgesinin belirgin biçimde altında kalırsa, sandalye başına ağırlık farkı tam da korunmak üzere tasarlanmış sandalyelerde daha da açılır ve meclisin bileşimi kendisini üreten seçmen kütlesinden uzaklaşır. Bu, seçim otoritesinin kendi tablolarından okunabilecek bir sonuç; başka bir kaynağa ihtiyaç duymuyor. Yükselen bir orta güç hikâyesi olarak okunduğunda tasarım, Pakistan'daki yerel seçim otoritesine ait: dış diplomasinin ürünü olmaktan çok iç kurumsal siyaset ve göçü, yerinden edilmeyi temsilin kalıcı bir unsuru sayıyor.", "en": "The next data to be published are the commission's turnout figures by class of seat. The measurable threshold: if figures released by 30 September 2026 show turnout in the twelve refugee constituencies falling clearly below that of Muzaffarabad division, the per-seat weighting widens precisely in the seats designed to be protected, and the assembly's composition drifts from the electorate that produced it. That conclusion can be read from the election authority's own tables and needs no other source. Read as an emerging middle power's own story, the design belongs to a local election authority in Pakistan: it is domestic institutional politics rather than the product of outside diplomacy, and it treats migration and displacement as a standing feature of representation.", "refs": ["ajk-polls"]}]}], "sources": [{"key": "ajk-polls", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020095/second-phase-of-ajk-polls-begins-in-muzaffarabad-division", "title": {"tr": "Azad Cammu ve Keşmir'de ikinci tur oylaması dokuz sandalye ve on iki mülteci seçim bölgesini kapsadı", "en": "Azad Jammu and Kashmir's second polling phase covers nine seats and twelve refugee constituencies"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "1965, 1971 ve 1999'u atlatan antlaşma 2025'te durdu", "en": "The treaty that survived 1965, 1971 and 1999 stopped in 2025"}, "excerpt": {"tr": "Kwatra'nın sıraladığı kronoloji, savunduğu sonucun aleyhine çalışıyor: andığı üç savaş boyunca su düzeni işlemeyi sürdürdü. Sorulacak şey, antlaşmayı 2025'te durdurulabilir kılan değişkenin ne olduğu.", "en": "The chronology Kwatra sets out works against the conclusion it is meant to support: through the three wars he names, the water arrangement kept running. The question is what made the treaty stoppable in 2025."}, "sections": [{"h": {"tr": "Listenin içindeki kronoloji", "en": "The chronology inside the list"}, "ps": [{"tr": "Hindistan'ın Washington büyükelçisi Vinay Mohan Kwatra, Newsweek'te yazdığı yazıda 1960 tarihli İndus Suları Antlaşması'nı askıya alma kararının \"Pakistan'ın davranışının zaten yok ettiği şeyi yalnızca kabul ettiğini\" savundu. Hindistan antlaşmayı 23 Nisan 2025'te, Cammu Keşmir'in Pahalgam beldesinde 26 kişinin öldürüldüğü saldırının ardından askıya almıştı. Kwatra, Pakistan'ın antlaşmanın imzalandığı iyi niyeti yarım yüzyıl boyunca söktüğünü öne sürerek 1965, 1971 ve 1999 savaşlarını; 2001'deki parlamento baskınını, 2
