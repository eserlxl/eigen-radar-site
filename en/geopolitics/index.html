", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "The talks ran on political and military tracks and covered Israel's withdrawal from southern Lebanon, security arrangements and verification, pilot zones where the Lebanese army would take over security, and Israeli demolitions in the south. Israel wants Lebanese forces to secure Ali Taher Hill, which it says holds Hezbollah command centres, and to dismantle the group's infrastructure. Hezbollah leader Naim Qassem urged the government to stop making concessions. US State Department spokesman Tommy Pigott said the talks focused on \"strengthening implementation of the framework accord\".", "tr": "Görüşmeler siyasi ve askerî iki hat üzerinden yürüdü; gündemde İsrail'in Güney Lübnan'dan çekilmesi, güvenlik düzenlemeleri ve doğrulama yöntemleri, Lübnan ordusunun güvenliği devralacağı pilot bölgeler ve güneydeki İsrail yıkımları vardı. İsrail, Hizbullah'ın komuta merkezlerini barındırdığını söylediği Ali Taher Tepesi'nin Lübnan güçlerince güvenliğe alınmasını ve örgütün altyapısının dağıtılmasını istiyor. Hizbullah lideri Naim Kasım hükümete tavizleri durdurma çağrısı yaptı. ABD Dışişleri Bakanlığı Sözcüsü Tommy Pigott, görüşmelerin \"çerçeve mutabakatının uygulanmasının güçlendirilmesine\" odaklandığını söyledi."}, "featured": true, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "Lebanese and Israeli delegations held a second day of US-brokered talks in Rome, the seventh round overall since a framework accord in June. Lebanese officials said the Israeli delegation for the first time stepped back from insisting that Hezbollah's disarmament be settled before the border file. The two sides remain apart on the weapons themselves and on Ali Taher Hill.", "tr": "Lübnan ve İsrail heyetleri, haziranda varılan çerçeve mutabakatından bu yana yedinci tur sayılan görüşmelerin ikinci gününü Roma'da ABD arabuluculuğunda geçirdi. Lübnanlı yetkililere göre İsrail heyeti ilk kez, Hizbullah'ın silahsızlanmasının sınır dosyasından önce görüşülmesi ısrarından geri adım attı. Taraflar silahların kendisinde ve Ali Taher Tepesi'nde hâlâ ayrışıyor."}, "tag": "diplomacy", "title": {"en": "Israel eases its sequencing demand as Ali Taher Hill stalls the Rome talks", "tr": "İsrail sıralama talebini gevşetti, Roma görüşmelerini Ali Taher Tepesi kilitledi"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/lebanon-and-israel-still-split-over-disarming-hezbollah-at-rome-talks", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "A senior defence official said \"we've constantly emphasized that the Han Kuang exercise must be closer to real combat scenarios\" so that units \"test their real operational capabilities\". Defence Minister Wellington Koo said the military would \"continue to train diligently and intensively, so that we are fully prepared in peacetime\". This year's programme includes decentralised command that pushes decisions to the field, combined reconnaissance and strike drone operations, naval and coast guard supply-escort simulations, wartime production checks at factories, urban resilience drills in central and northern regions, and a 30 minute slowdown of mobile internet during air raid drills. Chinese fighter jets and warships operate around the island on an almost daily basis.", "tr": "Üst düzey bir savunma yetkilisi, \"Han Kuang tatbikatının gerçek muharebe senaryolarına daha yakın olması gerektiğini sürekli vurguladık\" dedi; amaç birliklerin \"gerçek harekât kabiliyetlerini sınaması\". Savunma Bakanı Wellington Koo, ordunun \"barış zamanında tam hazır olmak için özenle ve yoğun biçimde eğitim almayı sürdüreceğini\" söyledi. Bu yılki program, kararı sahaya bırakan merkezsiz komuta yapısını, keşif ve saldırı insansız hava araçlarını birleştiren harekâtı, deniz kuvvetleri ile sahil güvenliğin ikmal refakati provalarını, fabrikalarda savaş dönemi üretim denetimlerini, orta ve kuzey bölgelerde kentsel dayanıklılık tatbikatlarını ve hava saldırısı provaları sırasında mobil internetin 30 dakika yavaşlatılmasını içeriyor. Çin savaş uçakları ve savaş gemileri ada çevresinde neredeyse her gün faaliyet gösteriyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Arab News", "summary": {"en": "Taiwan began its annual Han Kuang exercise on Wednesday, running to August 14. Troops and reservists practise responses to an attack on the island, and the drills test the army's ability to sustain round-the-clock defence and to counter what Taipei calls China's gray-zone tactics.", "tr": "Tayvan, yıllık Han Kuang tatbikatını çarşamba günü başlattı; tatbikat 14 Ağustos'a kadar sürecek. Askerler ve yedekler adaya yönelik bir saldırıya karşı senaryolar uyguluyor. Provalar, ordunun kesintisiz savunmayı sürdürme ve Taipei'nin gri bölge taktikleri dediği Çin uygulamalarına karşı koyma kabiliyetini sınıyor."}, "tag": "security", "title": {"en": "Taiwan's Han Kuang exercise opens for 10 days of combat-realistic scenarios", "tr": "Tayvan'ın Han Kuang tatbikatı 10 gün boyunca gerçek muharebeye yakın senaryolarla başladı"}, "topic": "geopolitics", "url": "https://www.arabnews.com/node/2653452/world", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "President Donald Trump directed the commerce department to draft the restrictions, citing an \"inadequate supply\" of certain metals that \"poses an increasing risk to our national defense and security\". Black mass carries lithium, cobalt, nickel, manganese and graphite. The United States has no active tungsten mines, and processing of black mass takes place largely in Asia. The European Union plans comparable restrictions on black mass exports from November 2026. The pricing agency Argus described the measures as unprecedented in recent US history.", "tr": "Başkan Donald Trump, belirli metallerdeki \"yetersiz arzın\" \"ulusal savunmamız ve güvenliğimiz için artan bir risk oluşturduğunu\" belirterek ticaret bakanlığına kısıtlamaları hazırlaması talimatını verdi. Söz konusu karışım lityum, kobalt, nikel, manganez ve grafit taşıyor. Amerika Birleşik Devletleri'nde faal tungsten madeni yok; karışımın işlenmesi de büyük ölçüde Asya'da yapılıyor. Avrupa Birliği, Kasım 2026'dan itibaren benzer bir ihracat kısıtlaması uygulamayı planlıyor. Fiyatlandırma kuruluşu Argus, bu adımları ABD'nin yakın tarihinde eşi görülmemiş diye niteledi."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Miningmx", "summary": {"en": "The Bureau of Industry and Security has announced a one-year ban on exports of black mass, the shredded output of used lithium-ion batteries, and of tungsten scrap used in defence applications. Sellers must supply domestic buyers unless they obtain an exception, and the restriction takes effect later this month.", "tr": "Sanayi ve Güvenlik Bürosu, kullanılmış lityum iyon pillerin öğütülmesiyle elde edilen ve sektörde \"black mass\" denen karışımın ve savunma sanayisinde kullanılan tungsten hurdasının ihracatına bir yıllık yasak getirdi. Satıcılar, istisna almadıkları sürece yurt içindeki alıcılara satmak zorunda; kısıtlama bu ayın ilerleyen günlerinde yürürlüğe girecek."}, "tag": "trade", "title": {"en": "US bars exports of battery black mass and tungsten scrap for one year", "tr": "ABD, öğütülmüş pil karışımı ve tungsten hurdası ihracatını bir yıl süreyle yasakladı"}, "topic": "geopolitics", "url": "https://www.miningmx.com/trending/66151-us-bans-critical-mineral-exports-in-bid-to-boost-defence/", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Harakat al-Nujaba argued that the government should target illegal weapons causing chaos and leave out those held by fighters who defended Iraq, its holy sites and its people. Political analyst Omar al-Nasser said the government might be forced to push the timeline back, possibly into December. Oil revenues make up more than 90 percent of Iraq's state budget, and exports fell to about 600,000 barrels per day in March from 3.3 million barrels per day, partly because of the closure of the Strait of Hormuz. The disarmament push follows US pressure and Iraq's need to attract foreign investment.", "tr": "Harekat en-Nüceba, hükümetin kaos yaratan yasa dışı silahları hedef alması gerektiğini, Irak'ı, kutsal mekânlarını ve halkını savunan savaşçıların elindekileri ise kapsam dışında bırakması gerektiğini savundu. Siyasi analist Ömer en-Nasır, hükümetin takvimi ertelemek zorunda kalabileceğini, sürenin aralık ayına kadar uzayabileceğini söyledi. Petrol gelirleri Irak devlet bütçesinin yüzde 90'ından fazlasını oluşturuyor; ihracat, kısmen Hürmüz Boğazı'nın kapanması nedeniyle mart ayında günde 3,3 milyon varilden yaklaşık 600.000 varile geriledi. Silahsızlanma adımının arkasında ABD baskısı ve Irak'ın yabancı yatırım çekme ihtiyacı bulunuyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "Iraqi Prime Minister Ali al-Zaidi faces a September 30 deadline for placing all weapons under state control. Saraya al-Salam, Asaib Ahl al-Haq and Kataib al-Imam Ali have accepted integration into state forces. The Iran-aligned Kataib Hezbollah has rejected the mandate and said it will keep and expand what it calls resistance weapons.", "tr": "Irak Başbakanı Ali el-Zeydi, tüm silahların devlet denetimine alınması için 30 Eylül tarihli bir süreyle karşı karşıya. Serayaüs-Selam, Asaib Ehl-i Hak ve Kataib el-İmam Ali devlet güçlerine katılmayı kabul etti. İran'a yakın Kataib Hizbullah ise kararı reddetti ve \"direniş silahları\" dediği stoku koruyup genişleteceğini bildirdi."}, "tag": "security", "title": {"en": "Iraq's September 30 weapons deadline runs into Kataib Hezbollah's refusal", "tr": "Irak'ın 30 Eylül silah süresi Kataib Hizbullah'ın reddiyle karşılaştı"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/iraq-faces-crisis-as-shia-armed-groups-defy-disarmament", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Türk urged Iran to halt all executions and move towards abolition, saying such punishment \"has no place in our world\". He called the persistent lack of fair trial and due process guarantees \"deeply troubling\", relayed allegations that confessions were obtained under torture and other ill-treatment, and added that \"several executions have reportedly been carried out in public\" and some \"only weeks after arrest\". He said 12 defendants were reportedly sentenced to death after a single three-hour closed-door hearing. There was no immediate comment from the Iranian government, which has previously said the death penalty is limited to the most severe crimes. Amnesty International counted at least 2,159 executions in Iran last year and called it the highest figure since 1981.", "tr": "Türk, İran'ı bütün infazları durdurmaya ve idam cezasını kaldırmaya yönelmeye çağırdı; bu cezanın \"dünyamızda yeri olmadığını\" söyledi. Adil yargılanma ve usul güvencelerinin sürekli eksikliğini \"derin kaygı verici\" diye niteledi, itirafların işkence ve diğer kötü muamele altında alındığı iddialarını aktardı ve \"birçok infazın açık alanda yapıldığının bildirildiğini\", bazılarının ise \"tutuklamadan yalnızca haftalar sonra\" gerçekleştiğini ekledi. Türk'e göre 12 sanığın, üç saatlik tek bir kapalı duruşmanın ardından ölüm cezasına çarptırıldığı bildirildi. İran hükümetinden anında bir açıklama gelmedi; Tahran daha önce idam cezasının yalnızca en ağır suçlarla sınırlı olduğunu savunmuştu. Uluslararası Af Örgütü geçen yıl İran'da en az 2.159 infaz saptadı ve bunu 1981'den bu yana en yüksek sayı olarak nitelendirdi."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "BBC News", "summary": {"en": "Volker Türk said at least 56 people had been executed on national security-related charges since 19 March, including 27 in cases linked to January's nationwide anti-government protests. More than 100 others are at risk of execution on similar charges, and executions for drug-related offences are continuing.", "tr": "Volker Türk, 19 marttan bu yana ulusal güvenlikle bağlantılı suçlamalarla en az 56 kişinin idam edildiğini, bunların 27'sinin ocak ayındaki ülke çapındaki hükümet karşıtı gösterilerle ilişkili davalarda olduğunu açıkladı. Benzer suçlamalarla 100'den fazla kişi daha idam tehlikesi altında; uyuşturucu suçlarından infazlar da sürüyor."}, "tag": "security", "title": {"en": "UN rights chief Volker Türk reports at least 56 executions in Iran since March", "tr": "BM İnsan Hakları Yüksek Komiseri Volker Türk, İran'da marttan bu yana en az 56 idam bildirdi"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/c75gvzxrz49o", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Tkachuk was described as a small-scale entrepreneur who put together the engineering team that developed the drones. Bolshoy Istok lies outside Yekaterinburg, 1,400 kilometres east of Moscow. The blast followed a bombing on Saturday at the Balzi Rossi restaurant in Moscow, which the Russian Embassy blamed on Ukraine and said killed five and injured 19. Moscow's mayor called it a brutal terrorist act without identifying who carried it out. Some outlets speculated that the restaurant bombing targeted Colonel-General Alexander Chaiko, a claim that remains unverified. Russian authorities have blamed Kyiv for a series of bombings and attacks on senior military figures since the February 2022 invasion.", "tr": "Tkaçuk'un, söz konusu araçları geliştiren mühendislik ekibini kuran küçük ölçekli bir girişimci olduğu belirtiliyor. Bolşoy İstok, Moskova'nın 1.400 kilometre doğusundaki Yekaterinburg'un dışında yer alıyor. Patlama, cumartesi günü Moskova'daki Balzi Rossi lokantasında düzenlenen bombalamanın ardından geldi; Rusya Büyükelçiliği bu saldırıyı Ukrayna'ya yükledi ve beş kişinin ölümüne, 19 kişinin yaralanmasına yol açtığını bildirdi. Moskova Belediye Başkanı olayı fail belirtmeden vahşi bir terör eylemi diye niteledi. Bazı yayın organları lokantadaki bombalamanın hedefinin Orgeneral Aleksandr Çayko olduğunu öne sürdü; bu iddia doğrulanmadı. Rus makamları, şubat 2022'deki işgalden bu yana üst düzey askerî isimlere yönelik bir dizi bombalama ve saldırıdan Kiev'i sorumlu tutuyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "NBC News", "summary": {"en": "Vladimir Tkachuk, who heads the Uraldronzavod factory making Upyr drones for Russian forces, was hospitalised in grave condition after an explosion late Tuesday in Bolshoy Istok outside Yekaterinburg. There was no immediate comment from the authorities and no claim of responsibility.", "tr": "Rus ordusu için Upyr insansız hava araçları üreten Uraldronzavod fabrikasının başındaki Vladimir Tkaçuk, salı gecesi Yekaterinburg yakınlarındaki Bolşoy İstok'ta meydana gelen patlamanın ardından ağır durumda hastaneye kaldırıldı. Yetkililerden anında bir açıklama gelmedi ve saldırıyı üstlenen olmadı."}, "tag": "conflict", "title": {"en": "A car blast near Yekaterinburg badly injures the director of the Uraldronzavod plant", "tr": "Yekaterinburg yakınındaki araç patlaması Uraldronzavod fabrikasının müdürünü ağır yaraladı"}, "topic": "geopolitics", "url": "https://www.nbcnews.com/world/russia/russian-drone-factory-director-badly-injured-car-explosion-rcna590938", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Authorities described the device as \"an unknown explosive device\" and gave no detail on its composition. The airport's north runway closed for about two hours and reopened on Wednesday; the south runway was already closed for scheduled maintenance. Authorities said there was no danger to travellers or airport employees and that flights were operating normally on Wednesday. A second flying object collided with a freight aircraft that had diverted to Hannover airport and caused slight damage; the authorities have not confirmed whether that object was connected to the drone.", "tr": "Yetkililer düzeneği \"bilinmeyen bir patlayıcı\" diye tanımladı ve bileşimine ilişkin ayrıntı vermedi. Havalimanının kuzey pisti yaklaşık iki saat kapalı kaldı ve çarşamba günü yeniden açıldı; güney pisti ise planlı bakım nedeniyle zaten kapalıydı. Yetkililere göre yolcular ve havalimanı çalışanları için tehlike oluşmadı, uçuşlar çarşamba günü olağan biçimde sürdü. İkinci bir uçan cisim, Hannover Havalimanı'na yönlendirilen bir kargo uçağına çarparak hafif hasar verdi; yetkililer bu cismin söz konusu araçla bağlantılı olup olmadığını doğrulamadı."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "An airport employee spotted the drone near the runway shortly before midnight, and police used an explosives-disposal robot to examine it and removed the detonator. Prosecutors in Saxony, who handle politically motivated and extremist crime, are leading the investigation. No suspects have been identified and responsibility has not been attributed.", "tr": "Bir havalimanı çalışanı, aracı gece yarısından kısa süre önce pistin yakınında fark etti; polis düzeneği bomba imha robotuyla inceledi ve fünyeyi söktü. Soruşturmayı, siyasi saikli ve aşırılıkçı suçlara bakan Saksonya savcılığı yürütüyor. Şüpheli belirlenmedi ve sorumluluk kimseye atfedilmedi."}, "tag": "security", "title": {"en": "An explosive device attached to a drone is found by the runway at Leipzig/Halle airport", "tr": "Leipzig/Halle Havalimanı'nda pistin yakınında bir insansız hava aracına bağlı patlayıcı bulundu"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/germany-investigates-explosive-device-attached-to-drone-at-leipzig-airport", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Hasina was convicted in Dhaka of incitement, ordering killings and failing to prevent atrocities, and sentenced to death for crimes against humanity in a trial held in absentia that she refused to attend. She fled to New Delhi by helicopter after the 2024 student-led uprising that toppled her government following a crackdown on protesters. India's foreign ministry spokesman Randhir Jaiswal said the government had \"no involvement whatsoever in it, neither does it endorse any views that may be expressed at the forum\". Bangladesh has sought her extradition, and India says the request is \"being examined through the legal process\".", "tr": "Hasina, Dakka'da tahrik, öldürme emri verme ve vahşetleri önlememe suçlarından mahkûm edildi ve insanlığa karşı suçlardan ölüm cezasına çarptırıldı; katılmayı reddettiği yargılama gıyabında görüldü. Göstericilere yönelik sert müdahalenin ardından hükümetini deviren 2024'teki öğrenci ayaklanmasının ardından helikopterle Yeni Delhi'ye gitmişti. Hindistan Dışişleri Bakanlığı Sözcüsü Randhir Jaiswal, hükümetin \"bu işte hiçbir dahlinin olmadığını, o platformda dile getirilebilecek görüşleri de benimsemediğini\" belirtti. Bangladeş iadesini talep etti; Hindistan, talebin \"hukuki süreç içinde incelendiğini\" bildiriyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "Speaking by video link to the Foreign Correspondents' Club of South Asia, the 78-year-old former prime minister said she would return to Bangladesh in December after two years in exile in India, with the exact date to be announced later. She said: \"I may be detained, I may be sent to prison. But fear cannot decide my duty to the people.\"", "tr": "Güney Asya Yabancı Muhabirler Kulübü'ne görüntülü bağlantıyla konuşan 78 yaşındaki eski başbakan, Hindistan'daki iki yıllık sürgünün ardından aralık ayında Bangladeş'e döneceğini, kesin tarihin sonra açıklanacağını söyledi. \"Gözaltına alınabilirim, hapse gönderilebilirim. Ama korku, halkıma karşı görevimi belirleyemez\" dedi."}, "tag": "elections", "title": {"en": "Sheikh Hasina restates a December return to Bangladesh, and New Delhi distances itself from the forum", "tr": "Şeyh Hasina aralıkta Bangladeş'e döneceğini yineledi, Yeni Delhi konuşmanın yapıldığı platformdan uzak durdu"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/ex-pm-sheikh-hasina-announces-her-plan-to-return-to-bangladesh", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Al Jazeera reported that a journalist was severely beaten by Israeli soldiers and that a young man was run over by a military vehicle, his condition unknown. Footage showed soldiers confronting a Palestinian man who appears to be unarmed before tackling him to the ground while pointing assault rifles at him. Al Jazeera correspondent Nida Ibrahim said an average of 50 raids have taken place daily across the West Bank in recent weeks and that forces used stun grenades to disperse journalists. The Palestinian agency Quds News Network documented the operation. No statement from the Israeli military was relayed.", "tr": "Al Jazeera, bir gazetecinin İsrail askerlerince ağır biçimde dövüldüğünü ve bir gencin askerî bir aracın altında kaldığını, durumunun bilinmediğini bildirdi. Görüntülerde askerlerin, silahsız olduğu anlaşılan bir Filistinliyi saldırı tüfekleriyle nişan alarak yere yatırdığı görülüyor. Al Jazeera muhabiri Nida İbrahim, son haftalarda Batı Şeria genelinde günde ortalama 50 baskın yapıldığını ve güçlerin gazetecileri dağıtmak için ses bombası kullandığını aktardı. Filistin ajansı Quds News Network harekâtı belgeledi. İsrail ordusundan konuya ilişkin bir açıklama aktarılmadı."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "Several Palestinians were detained during the operation in the camp on Wednesday, and soldiers distributed leaflets announcing a large-scale operation. A carwash was demolished, camp entrances were blocked with rocks and local mosques were prevented from holding dawn prayers.", "tr": "Çarşamba günü kamptaki harekât sırasında birçok Filistinli gözaltına alındı; askerler geniş çaplı bir harekât duyuran bildiriler dağıttı. Bir oto yıkama tesisi yıkıldı, kampın girişleri taşlarla kapatıldı ve yerel camilerde sabah namazının kılınması engellendi."}, "tag": "conflict", "title": {"en": "Israeli forces raid the Qalandiya camp south of Ramallah and announce a large-scale operation", "tr": "İsrail güçleri Ramallah'ın güneyindeki Kalandiya kampına girdi ve geniş çaplı bir harekât duyurdu"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/israeli-forces-detain-palestinians-during-raid-in-occupied-west-bank", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "The recommendation follows former president Jacob Zuma's visit to India last month, where he was photographed at a temple with Ajay Gupta, one of the businessmen at the centre of the state capture allegations. South Africa's high commissioner to India, Anil Sooklal, was also pictured with the pair and has since been recalled; he denies wrongdoing. A judicial commission concluded in 2022 that Zuma had hired and fired ministers central to the running of the country's economy at the behest of the Gupta family. The family left South Africa in 2018, and a court in the United Arab Emirates refused an extradition request for Atul and Rajesh Gupta in 2023. Zuma, now 84, has been expelled from the African National Congress and leads the opposition uMkhonto we Sizwe. Last year he visited Morocco and spoke in support of Rabat's claim over Western Sahara; South Africa condemned the visit and lodged a formal diplomatic protest with Morocco.", "tr": "Öneri, eski Cumhurbaşkanı Jacob Zuma'nın geçen ay Hindistan'a yaptığı ziyaretin ardından geldi; Zuma orada bir tapınakta, devlet kaynaklarının ele geçirilmesi iddialarının merkezindeki iş insanlarından Ajay Gupta ile fotoğraflandı. Güney Afrika'nın Hindistan Yüksek Komiseri Anil Sooklal da ikiliyle birlikte görüntülendi ve geri çağrıldı; Sooklal bir usulsüzlük yapmadığını söylüyor. Bir yargı komisyonu 2022'de, Zuma'nın ülke ekonomisinin işleyişinde kilit bakanları Gupta ailesinin isteğiyle atayıp görevden aldığı sonucuna varmıştı. Aile 2018'de Güney Afrika'dan ayrıldı; Birleşik Arap Emirlikleri'ndeki bir mahkeme 2023'te Atul ve Rajesh Gupta için yapılan iade talebini reddetti. Bugün 84 yaşındaki Zuma, Afrika Ulusal Kongresi'nden ihraç edildi ve muhalefetteki uMkhonto we Sizwe'nin başında. Zuma geçen yıl Fas'a gitmiş ve Batı Sahra konusunda Rabat'ın iddiasını desteklediğini söylemişti; Güney Afrika bu ziyareti kınamış ve Fas'a resmi bir protesto iletmişti."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "BBC News", "summary": {"en": "Foreign Affairs Minister Ronald Lamola said on Wednesday that his department had sent parliament and the president's office a recommendation for new protocols covering former heads of state on foreign trips. Under it they would have to \"provide full details\" of an upcoming trip so the state can make \"an informed assessment of the appropriate level of support required and any associated reputational, political, diplomatic or security risks\".", "tr": "Dışişleri Bakanı Ronald Lamola çarşamba günü, bakanlığının eski devlet başkanlarının yurt dışı gezilerine ilişkin yeni kurallar önerisini parlamentoya ve cumhurbaşkanlığı ofisine gönderdiğini açıkladı. Öneriye göre eski devlet başkanları planladıkları gezinin \"tüm ayrıntılarını\" bildirecek; böylece devlet, gereken destek düzeyini ve itibara, siyasete, diplomasiye veya güvenliğe ilişkin riskleri değerlendirebilecek."}, "tag": "diplomacy", "title": {"en": "Pretoria proposes travel protocols for former heads of state after Zuma's India visit", "tr": "Pretoria, Zuma'nın Hindistan ziyaretinin ardından eski devlet başkanları için seyahat kuralları öneriyor"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/c1e14lj7vg7o", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Isabelle Lassee, Amnesty's acting regional director for South Asia, said Pakistan's authorities had \"systematically denied Imran Khan the right to a fair trial, subjected him to prolonged solitary confinement, and limited his access to medical care\", and that Khan \"has not seen his family for more than eight months and has had no meaningful access to his lawyers since December\". Minister of State for Interior Tallal Chaudhry told Al Jazeera that \"any alleged violation is subject to judicial review\", rejected claims that court orders had been ignored, and said Khan receives dedicated accommodation and amenities beyond what is ordinarily available to prisoners. The UN Working Group on Arbitrary Detention found his detention arbitrary in July 2024, and the UN Special Rapporteur on Torture warned in December that the conditions of his solitary confinement could amount to torture.", "tr": "Uluslararası Af Örgütü'nün Güney Asya vekil bölge direktörü Isabelle Lassee, Pakistan makamlarının \"Imran Khan'ı sistematik biçimde adil yargılanma hakkından yoksun bıraktığını, uzun süreli tecride tabi tuttuğunu ve sağlık hizmetine erişimini kısıtladığını\", ayrıca Khan'ın \"sekiz aydan uzun süredir ailesini görmediğini ve aralıktan bu yana avukatlarıyla anlamlı bir görüşme yapamadığını\" söyledi. İçişleri Devlet Bakanı Tallal Chaudhry, Al Jazeera'ya \"öne sürülen her aykırılığın yargı denetimine tabi olduğunu\" belirtti, mahkeme kararlarının yok sayıldığı iddialarını reddetti ve Khan'a ayrılmış bir konaklama ile mahkûmlara olağan olarak sağlananın ötesinde olanaklar sunulduğunu söyledi. BM Keyfi Tutuklamalar Çalışma Grubu temmuz 2024'te tutukluluğu keyfi buldu; BM İşkence Özel Raportörü ise aralık ayında tecrit koşullarının işkence düzeyine varabileceği uyarısında bulundu."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T17:17:52.722172+00:00", "src": "Al Jazeera", "summary": {"en": "The former prime minister, 73, has been held for three years as of Wednesday. He is serving a 14-year corruption sentence, his wife Bushra Bibi seven years in the same case, and in December 2025 both received an additional 17 years in a state gifts case.", "tr": "73 yaşındaki eski başbakan, çarşamba itibarıyla üç yıldır tutuluyor. Yolsuzluk davasında 14 yıl hapis cezasını çekiyor; eşi Bushra Bibi aynı davada yedi yıl aldı ve aralık 2025'te ikisine devlet hediyeleri davasında 17 yıl daha verildi."}, "tag": "security", "title": {"en": "Imran Khan reaches three years in prison as Amnesty International details his isolation", "tr": "Imran Khan'ın hapisliği üç yılı buldu, Uluslararası Af Örgütü tecrit koşullarını anlattı"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/pakistans-khan-in-jail-for-3-years-pti-amnesty-slam-solitary-confinement", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Zelensky said delays in receiving anti-ballistic systems from partners lead to \"horrific casualties and destruction\". Kyiv Mayor Vitali Klitschko said there were fears people were trapped under rubble. Russia's defence ministry said it had struck logistics hubs in and around Kyiv used for storing and distributing weapons and military supplies, and had also hit three cargo vessels near Odesa that it said were carrying weapons. Tula governor Dmitry Milyaev said a drone crashed into a Wildberries warehouse in his region and injured one person. Both sides deny deliberately targeting civilians.", "tr": "Zelenski, ortaklardan balistik füze savunma sistemlerinin geç gelmesinin \"korkunç kayıplara ve yıkıma\" yol açtığını söyledi. Kiev Belediye Başkanı Vitali Kliçko enkaz altında insanların kalmış olabileceği endişesini dile getirdi. Rusya Savunma Bakanlığı, Kiev ve çevresinde silah ile askeri malzemenin depolanması ve dağıtımında kullanılan lojistik merkezlerini vurduğunu, ayrıca Odesa yakınlarında silah taşıdığını öne sürdüğü üç yük gemisini hedef aldığını açıkladı. Tula valisi Dmitri Milyayev, bölgesinde bir insansız hava aracının Wildberries deposuna düştüğünü ve bir kişinin yaralandığını bildirdi. İki taraf da sivilleri kasten hedef aldığını reddediyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "BBC News", "summary": {"en": "Zelensky said at least 17 people were killed and 44 injured in the attack that began after midnight, with homes, a railway station and warehouses hit. Ukraine's air force reported 24 ballistic and 4 anti-ship missiles alongside 115 drones, of which 98 were shot down. No interception of any of the ballistic missiles was reported.", "tr": "Zelenski'ye göre gece yarısından sonra başlayan saldırıda en az 17 kişi öldü, 44 kişi yaralandı; konutlar, bir tren istasyonu ve depolar vuruldu. Ukrayna hava kuvvetleri 24 balistik ve 4 gemisavar füzesiyle 115 insansız hava aracının fırlatıldığını, bunlardan 98'inin düşürüldüğünü bildirdi. Balistik füzelerden herhangi birinin önlendiği bildirilmedi."}, "tag": "conflict", "title": {"en": "At least 17 die in the strike on Kyiv, and Zelensky points to the shortage of interceptors", "tr": "Kiev'e yapılan saldırıda en az 17 kişi öldü, Zelenski önleyici füze eksikliğine işaret etti"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/c330pxyvzzyo", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Al Jazeera reported that the Knesset's Finance Committee separately approved close to 300 million shekels, of which 157 million shekels go directly to the Settlements Ministry and 142 million shekels take the form of commitment authorisations. The sites in the programme include Solomon's Pools near Bethlehem. Israeli settlements are considered illegal under international law.", "tr": "Al Jazeera'nın aktardığına göre Knesset Maliye Komisyonu ayrıca 300 milyon şekele yakın bir tutarı onayladı; bunun 157 milyon şekeli Yerleşimler Bakanlığı'na doğrudan aktarılacak, 142 milyon şekeli ise taahhüt yetkisi olarak verildi. Program kapsamındaki alanlar arasında Beytüllahim yakınlarındaki Süleyman Havuzları da bulunuyor. İsrail yerleşimleri uluslararası hukuka göre yasa dışı sayılıyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Al Jazeera", "summary": {"en": "A government steering committee approved 113 million shekels, about 37 million dollars, on Tuesday for more than 70 historical sites in the occupied West Bank. Finance Minister Bezalel Smotrich called the decision \"a Zionist act of the highest order\". It is added on top of a 250 million shekel plan, about 83 million dollars, adopted in May.", "tr": "Bir hükümet yönlendirme komitesi salı günü, işgal altındaki Batı Şeria'da 70'ten fazla tarihi alan için 113 milyon şekel (37 milyon dolar) onayladı. Maliye Bakanı Bezalel Smotriç kararı \"en üst düzeyde bir Siyonist eylem\" diye nitelendirdi. Karar, mayıs ayında kabul edilen 250 milyon şekellik (83 milyon dolar) planın üzerine ekleniyor."}, "tag": "conflict", "title": {"en": "Israel allocates 113 million shekels for more than 70 sites in the occupied West Bank", "tr": "İsrail, işgal altındaki Batı Şeria'da 70'ten fazla alan için 113 milyon şekel ayırdı"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/israel-approves-37m-to-seize-more-than-70-occupied-west-bank-sites", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "In her statement carried by KCNA, Kim Yo Jong said Japan's military was \"moving away from a defensive posture\" and that North Korea would respond so that Japan \"feels that its security has been exposed to greater danger\". \"We should make it regret,\" she said, and added that \"the US is behind such dangerous military moves of Japan\". The statement also listed Japan's participation in US-led joint drills in the Philippines in May. Yang Moo-jin of the University of North Korean Studies and Lim Eul-chul of Kyungnam University said the language could prepare the ground for future military demonstrations and missile tests.", "tr": "Kim Yo Jong'un KCNA aracılığıyla yayımlanan açıklamasında Japonya ordusunun \"savunma duruşundan uzaklaştığı\" öne sürüldü ve Kuzey Kore'nin Japonya'ya \"güvenliğinin daha büyük tehlikeye açıldığını hissettirecek\" biçimde karşılık vereceği belirtildi. \"Buna pişman olmasını sağlamalıyız\" diyen Kim Yo Jong, \"Japonya'nın bu tehlikeli askeri hamlelerinin arkasında ABD var\" ifadesini kullandı. Açıklamada Japonya'nın mayıs ayında Filipinler'de ABD önderliğindeki ortak tatbikatlara katılması da sayıldı. Kuzey Kore Çalışmaları Üniversitesi'nden Yang Moo-jin ile Kyungnam Üniversitesi'nden Lim Eul-chul, bu dilin ilerideki askeri gösterilere ve füze denemelerine gerekçe hazırlayabileceğini söyledi."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Al Jazeera", "summary": {"en": "Kim Yo Jong, the sister of North Korean leader Kim Jong Un, said Pyongyang would set up \"additional military options\" after Japan tested a US-supplied Tomahawk cruise missile. Japan fired the missile from the Aegis destroyer Chokai in the Pacific Ocean.", "tr": "Kuzey Kore lideri Kim Jong Un'un kız kardeşi Kim Yo Jong, Japonya'nın ABD'den aldığı bir Tomahawk seyir füzesini denemesinin ardından Pyongyang'ın \"ek askeri seçenekler\" oluşturacağını açıkladı. Japonya füzeyi Pasifik'te Chokai adlı Aegis muhribinden fırlatmıştı."}, "tag": "security", "title": {"en": "Kim Yo Jong warns of \"additional military options\" after Japan's Tomahawk test", "tr": "Kim Yo Jong, Japonya'nın Tomahawk denemesinin ardından \"ek askeri seçenekler\" uyarısı yaptı"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/north-koreas-kim-yo-jong-issues-military-threat-over-japan-missile-test", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "Al Jazeera reported that more than 60 million dollars in campaign spending was directed against El-Sayed, mostly by pro-Israel groups, with AIPAC spending more than 30 million dollars for his rival, Congresswoman Haley Stevens. Stevens polled above expectations and finished strongly in Detroit. In his victory speech El-Sayed addressed Rogers directly: \"Mike, and I know you're listening, Mike, we are coming for you.\" If elected he would be the first Muslim senator in the United States. The contest is counted among the races that could decide control of the Senate.", "tr": "Al Jazeera'ya göre El-Sayed'in karşısında, ağırlıkla İsrail yanlısı gruplardan gelen 60 milyon doları aşan bir kampanya harcaması yer aldı; AIPAC rakibi milletvekili Haley Stevens için 30 milyon doların üzerinde harcama yaptı. Stevens beklentilerin üzerinde oy aldı ve Detroit'te güçlü bir sonuç çıkardı. El-Sayed zafer konuşmasında Rogers'a seslenerek \"Mike, dinlediğini biliyorum, senin için geliyoruz\" dedi. Seçilmesi hâlinde ABD Senatosu'ndaki ilk Müslüman senatör olacak. Yarış, Senato'daki çoğunluğu belirleyebilecek kritik yarışlar arasında sayılıyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Al Jazeera", "summary": {"en": "NBC News projected that Abdul El-Sayed, a public health specialist, won the Democratic Senate nomination in Michigan. El-Sayed will run against former Republican congressman Mike Rogers in November. The result became clear hours after the polls closed.", "tr": "NBC News'in öngörüsüne göre Demokrat Parti'nin Michigan Senato adaylığını halk sağlığı uzmanı Abdul El-Sayed kazandı. El-Sayed kasımda eski Cumhuriyetçi milletvekili Mike Rogers'la yarışacak. Sonuç, sandıklar kapandıktan saatler sonra netleşti."}, "tag": "elections", "title": {"en": "Abdul El-Sayed wins the Senate primary in Michigan", "tr": "Michigan'da Senato ön seçimini Abdul El-Sayed kazandı"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/5/abdul-el-sayed-wins-michigan-democratic-primary-for-senate-in-blow-to-aipac", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "The report says at least nine people were killed in the clashes. Al Jazeera's text does not specify which stretch of the border is meant, does not name the criminal groups, and carries no statement from the Brazilian government. It also quotes no Bolivian official directly.", "tr": "Habere göre çatışmalarda en az dokuz kişi hayatını kaybetti. Al Jazeera'nın metninde sınırın hangi kesiminin kastedildiği belirtilmiyor, suç örgütlerinin adları verilmiyor ve Brezilya hükümetinin konuya ilişkin bir açıklamasına yer verilmiyor. Bolivyalı yetkililerden doğrudan alıntı da aktarılmıyor."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Al Jazeera", "summary": {"en": "Al Jazeera reported that Bolivia deployed more than 200 police and military personnel to patrol the border line with Brazil. The stated reason for the deployment was violence linked to Brazilian criminal groups fighting for control of drug trafficking routes.", "tr": "Al Jazeera'ya göre Bolivya, Brezilya sınır hattında devriye görevi için 200'ü aşkın polis ve askeri görevlendirdi. Görevlendirmenin gerekçesi, uyuşturucu kaçakçılığı güzergâhlarının denetimi için çarpışan Brezilyalı suç örgütleriyle bağlantılı şiddet olarak açıklandı."}, "tag": "security", "title": {"en": "Bolivia sends more than 200 police and soldiers to the Brazilian border", "tr": "Bolivya, Brezilya sınırına 200'den fazla polis ve asker gönderdi"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/5/bolivia-sends-troops-to-stop-brazilian-gang-violence-along-border", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 5", "tr": "5 Ağu"}, "detail": {"en": "A Police Scotland spokesperson said: \"Enquiries are ongoing to assess the circumstances, and early engagement is taking place with the Home Office.\" One athlete told Uganda's NBS Sport that they planned to seek asylum. The games were held in Glasgow and the closing ceremony took place last Sunday, with athletes from 74 nations competing over 11 days. Al Jazeera noted that athletes going missing after the games has recurred since the 2014 Glasgow edition, and that after the 2018 Gold Coast games the authorities were searching for 50 athletes and officials a month later, while 190 people had sought asylum.", "tr": "İskoçya Polisi sözcüsü, \"Soruşturma sürüyor ve İçişleri Bakanlığı ile erken temas kuruldu\" dedi. Uganda'nın NBS Sport kanalına konuşan bir sporcu iltica başvurusunda bulunmayı planladığını söyledi. Oyunlar Glasgow'da düzenlendi ve kapanış töreni geçen pazar yapıldı; 74 ülkeden sporcular 11 gün boyunca yarıştı. Al Jazeera, oyunların ardından sporcuların kaybolmasının 2014 Glasgow organizasyonundan bu yana tekrarlandığını, 2018 Gold Coast oyunlarında ise yetkililerin bir ay sonra 50 sporcu ve görevliyi aradığını, 190 kişinin iltica başvurusu yaptığını aktardı."}, "featured": false, "publishedDate": "2026-08-05", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Al Jazeera", "summary": {"en": "Police Scotland said several athletes had been reported unaccounted for after the Commonwealth Games. Four of Uganda's six-member boxing team went missing before Tuesday's return flight, and a Pakistani boxer did not board the plane.", "tr": "İskoçya Polisi, İngiliz Milletler Topluluğu Oyunları'nın ardından birden fazla sporcunun kayıp bildirildiğini açıkladı. Uganda'nın altı kişilik boks takımından dördü salı günkü dönüş uçuşundan önce ortadan kayboldu; bir Pakistanlı boksör de uçağa binmedi."}, "tag": "diplomacy", "title": {"en": "Athletes from Uganda and Pakistan reported missing after the Glasgow games", "tr": "Glasgow'daki oyunların ardından Uganda ve Pakistanlı sporcular kayıp bildirildi"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/sports/2026/8/5/pakistan-and-uganda-athletes-missing-after-commonwealth-games", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "According to the maritime prefecture the boat left France on Monday night; five people on board were rescued overnight and the rest refused assistance offered by French patrol boats. The prefecture said it did not intervene further at that stage because of the \"structural fragility\" of such boats. When the engine caught fire in the morning, two French ships rescued 105 people and British vessels 63, in addition to the first five; 40 firefighters, 13 police officers, seven interpreters and medical personnel took part. French prosecutors opened an investigation and an Egyptian national was taken into custody in connection with the incident. Border Security Minister Anna Turley pointed to the dangers of the crossings and \"the ruthless gangs behind them\". The total on board passed the previous highest figure of 165 people recorded last month.", "tr": "Deniz valiliğine göre bot pazartesi gecesi Fransa'dan ayrıldı; gece boyunca bottaki beş kişi kurtarıldı, kalanlar Fransız devriye botlarının yardımını kabul etmedi. Valilik, bu tip botların \"yapısal kırılganlığı\" nedeniyle o aşamada daha ileri müdahaleye gitmediğini bildirdi. Sabah motor tutuşunca ilk beş kişiye ek olarak iki Fransız gemisi 105, İngiliz gemileri 63 kişiyi kurtardı; operasyona 40 itfaiyeci, 13 polis, yedi tercüman ve sağlık ekipleri katıldı. Fransız savcılığı soruşturma başlattı ve olayla bağlantılı olarak bir Mısır vatandaşı gözaltına alındı. Sınır Güvenliği Bakanı Anna Turley geçişlerin tehlikesine ve \"arkalarındaki acımasız çetelere\" dikkat çekti. Bottaki toplam sayı, geçen ay 165 kişiyle ulaşılan önceki en yüksek sayıyı geçti."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "BBC News", "summary": {"en": "The French maritime prefecture of the Channel and North Sea revised the number rescued from the boat whose engine caught fire on Tuesday morning from 157 to 173. All were taken to Boulogne-sur-Mer and 11 suffered minor injuries. The UK government said \"all will be returned\" to France.", "tr": "Fransız Manş ve Kuzey Denizi deniz valiliği, salı sabahı motoru tutuşan bottan kurtarılanların sayısını 157'den 173'e çıkardı. Kurtarılanların tamamı Boulogne-sur-Mer'e götürüldü ve 11 kişi hafif yaralandı. Birleşik Krallık hükümeti \"hepsi Fransa'ya iade edilecek\" açıklamasını yaptı."}, "tag": "diplomacy", "title": {"en": "The Channel rescue count is revised up to 173, and London says all will be returned", "tr": "Manş'ta kurtarılan kişi sayısı 173'e yükseltildi, Londra hepsinin iade edileceğini bildirdi"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/c4gkpeppjyqo", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "RSF sources described Bir Saliba as the Joint Force's last remaining stronghold in north-western West Darfur and a strategic base for military operations along the mountainous border with Chad. The fighting caused deaths on both sides, and Mahdi Jabal Moon, described as one of the RSF's most prominent commanders in north-western Darfur, was reported killed. No exact casualty figures were given. RSF fighters circulated social media videos they said showed their presence in the area, with smoke visible; Darfur24 notes that such posts do not stand in for verification. The Joint Force had not commented on the developments at the time of publication.", "tr": "HDK kaynakları Bir Saliba'yı, Ortak Güç'ün kuzeybatı Batı Darfur'da elinde kalan son mevzisi ve Çad sınırındaki dağlık hat boyunca yürütülen askeri operasyonlar için stratejik bir üs diye tanımladı. Çatışmalarda her iki tarafta ölümler yaşandı; kuzeybatı Darfur'daki en tanınmış HDK komutanlarından Mehdi Cebel Mun'un da öldüğü bildirildi. Kesin kayıp sayısı verilmedi. HDK'ye bağlı savaşçılar bölgede bulunduklarını gösterdiğini söyledikleri, dumanın görüldüğü görüntüleri sosyal medyada dolaştırdı; Darfur24 bu tür paylaşımların doğrulama yerine geçmediğini belirtiyor. Ortak Güç haberin yayımlandığı sırada gelişmelere ilişkin açıklama yapmamıştı."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T08:49:50.398724+00:00", "src": "Darfur24", "summary": {"en": "Field sources close to the Rapid Support Forces said Bir Saliba in the Serba locality of West Darfur had been taken after clashes with the Joint Force allied to the Sudanese army. Darfur24 wrote that it could not independently verify the claim of control.", "tr": "Hızlı Destek Kuvvetleri'ne (HDK) yakın saha kaynakları, Batı Darfur'un Serba bölgesindeki Bir Saliba'nın Sudan ordusuyla müttefik Ortak Güç'e karşı çarpışmaların ardından ele geçirildiğini ileri sürdü. Darfur24 bu denetim iddiasını bağımsız olarak doğrulayamadığını yazdı."}, "tag": "conflict", "title": {"en": "The Rapid Support Forces claim they have taken Bir Saliba in West Darfur", "tr": "Hızlı Destek Kuvvetleri, Batı Darfur'daki Bir Saliba'yı ele geçirdiğini öne sürdü"}, "topic": "geopolitics", "url": "https://darfur24.com/en/2026/08/04/rsf-claims-capture-of-bir-saliba-in-west-darfur/", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The talks centre on establishing safe shipping lanes through the Strait of Hormuz. Al Jazeera reports that the unresolved items are the mechanism for reopening the waterway, maritime service fees and security arrangements. Rubio said the Hormuz arrangement would address short-term shipping safety before moving toward what he called the ultimate deal, Iran's denuclearisation. Oman is acting as mediator. On the same day, a separate US-mediated negotiation between Israel and Lebanon was held in Rome. Regional tension continued: an Indian cargo vessel was struck by a projectile off Yemen, and Saudi Arabia's Najran airport suspended operations after a Houthi drone strike.", "tr": "Görüşmelerin konusu, Hürmüz Boğazı'ndan güvenli geçiş şeritlerinin kurulması. Al Jazeera'ya göre çözülmemiş başlıklar boğazın yeniden açılma mekanizması, denizcilik hizmet ücretleri ve güvenlik düzenlemeleri. Rubio, Hürmüz düzenlemesinin kısa vadede gemi güvenliğini ele alacağını, ardından kendisinin İran'ın nükleer silahlanmadan arındırılması olarak tanımladığı nihai anlaşmaya geçileceğini söyledi. Umman arabulucu konumunda. Aynı gün İsrail ile Lübnan arasında ABD arabuluculuğunda ayrı bir görüşme Roma'da yürütüldü. Bölgede gerilim sürüyor: Hindistan bayraklı bir yük gemisi Yemen açıklarında bir mermiyle vuruldu ve Suudi Arabistan'ın Necran Havalimanı bir Husi insansız hava aracı saldırısının ardından uçuşları durdurdu."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "Secretary of State Marco Rubio said progress had been made in talks between Oman and Iran but that no final agreement had been reached. Treasury Secretary Scott Bessent said a deal could come \"today or tomorrow\". Iranian Foreign Ministry spokesperson Esmaeil Baghaei described the talks as positive and continuing.", "tr": "Dışişleri Bakanı Marco Rubio, Umman ile İran arasındaki görüşmelerde ilerleme kaydedildiğini ancak nihai bir anlaşmaya varılmadığını söyledi. Hazine Bakanı Scott Bessent anlaşmanın \"bugün ya da yarın\" gelebileceğini belirtti. İran Dışişleri Bakanlığı sözcüsü İsmail Bakayi görüşmeleri olumlu diye niteledi."}, "tag": "diplomacy", "title": {"en": "US says a Hormuz deal is close, while Tehran says it is talking only to Oman", "tr": "ABD Hürmüz anlaşmasının yakın olduğunu söylüyor, Tahran yalnızca Umman'la görüştüğünü bildiriyor"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/4/us-says-deal-on-reopening-hormuz-close-as-iran-oman-hold-positive-talks", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "India's Shipping Minister Sarbananda Sonowal condemned the attack and said steps would be taken to ensure the safety of seafarers in the region. India's Ministry of External Affairs called attacks on commercial shipping in the region deeply worrisome and said free and unimpeded navigation through international waterways must be restored at the earliest. Yemen's transport ministry, part of the Saudi-backed and internationally recognised government, accused the Iran-backed Houthis of carrying out the attack using a boat laden with explosives, Reuters reported; the group has not commented. The Houthis announced a blockade of Saudi Arabia's Red Sea ports on 20 July. The UK Maritime Trade Operations agency has reported several attacks on ships in the region over the past week. Since the US and Israeli strikes of late February, Iran has blocked the Strait of Hormuz, and some tankers had shifted to carrying Saudi oil through the Red Sea instead.", "tr": "Hindistan Denizcilik Bakanı Sarbananda Sonowal saldırıyı kınadı ve bölgedeki denizcilerin güvenliği için adım atılacağını söyledi. Hindistan Dışişleri Bakanlığı, bölgedeki ticari gemilere yönelik saldırıları kaygı verici bulduğunu açıkladı ve uluslararası su yollarında serbest seyrüseferin bir an önce yeniden sağlanmasını istedi. Yemen'in Suudi destekli ve uluslararası tanınan hükümetine bağlı ulaştırma bakanlığı, Reuters'a göre saldırıyı patlayıcı yüklü bir tekne kullanan İran destekli Husilerin düzenlediğini öne sürdü; Husiler olayla ilgili açıklama yapmadı. Husiler 20 Temmuz'da Suudi Arabistan'ın Kızıldeniz limanlarına abluka ilan etmişti. Birleşik Krallık Deniz Ticareti Operasyonları kurumu son bir hafta içinde bölgedeki gemilere yönelik birkaç saldırı bildirdi. Şubat sonundaki ABD ve İsrail saldırılarından bu yana İran Hürmüz Boğazı'nı kapattı; bazı tankerler Suudi petrolünü Kızıldeniz üzerinden taşımaya yönelmişti."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "BBC News", "summary": {"en": "The MSV Faize Noore Oliya, an Indian-flagged vessel, capsized and sank after being hit by a projectile off the coast of Yemen. All 14 people on board were rescued, 13 of them Indian nationals. It is not clear who struck the ship.", "tr": "MSV Faize Noore Oliya adlı Hindistan bayraklı tekne, Yemen açıklarında bir mermiyle vurulduktan sonra alabora olup battı. Gemideki 14 kişinin tamamı kurtarıldı; bunların 13'ü Hindistan vatandaşı. Saldırıyı kimin düzenlediği belirlenemedi."}, "tag": "conflict", "title": {"en": "Indian-flagged ship sinks after being hit by a projectile off Yemen", "tr": "Yemen açıklarında bir mermiyle vurulan Hindistan bayraklı gemi battı"}, "topic": "geopolitics", "url": "https://www.bbc.co.uk/news/articles/cly84we1y37o", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Jordanian officials said that on 23 July more than 2,000 Israelis from the religious right, including National Security Minister Itamar Ben Gvir, entered the al-Aqsa compound and performed prayers and religious rituals, and described this as the worst violation in modern history of the arrangement that permits only Muslim prayer at the site. Safadi said this was a constant and dangerous threat that Jordan was trying to counter with every tool available to it. The Hashemite monarchy's custodianship of the holy sites in Jerusalem was reaffirmed in the 1994 Israeli-Jordanian peace treaty. The report carries no response from the Israeli government to these claims.", "tr": "Ürdünlü yetkililer, 23 Temmuz'da aralarında Ulusal Güvenlik Bakanı Itamar Ben Gvir'in de bulunduğu 2.000'den fazla İsraillinin Mescid-i Aksa avlusuna girip namaz kıldığını ve dinî ayinler düzenlediğini bildirdi ve bunu, alanda yalnızca Müslümanların ibadetine izin veren mevcut düzenlemenin modern tarihteki en ağır çiğnenmesi olarak nitelendirdi. Safedi bunun sürekli ve tehlikeli bir tehdit olduğunu, Ürdün'ün elindeki her araçla karşı koymaya çalıştığını söyledi. Ürdün Haşimi hanedanının Kudüs'teki kutsal mekânlar üzerindeki koruyuculuğu, 1994 İsrail-Ürdün barış antlaşmasında yeniden teyit edilmişti. Haberde İsrail hükümetinin bu iddialara yanıtı yer almıyor."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "The Irish Times", "summary": {"en": "Jordan's Foreign Minister Ayman Safadi is convening an emergency meeting in Amman on Wednesday over what he describes as a threat to the al-Aqsa mosque and the Dome of the Rock in Jerusalem. Arab League foreign ministers are attending alongside Turkey, Indonesia, Malaysia and Pakistan.", "tr": "Ürdün Dışişleri Bakanı Eyman Safedi, Kudüs'teki Mescid-i Aksa ve Kubbetü's-Sahra çevresinde oluştuğunu söylediği tehdide karşı çarşamba günü Amman'da acil bir toplantı düzenliyor. Toplantıya Arap Ligi dışişleri bakanlarının yanı sıra Türkiye, Endonezya, Malezya ve Pakistan katılıyor."}, "tag": "diplomacy", "title": {"en": "Jordan convenes an emergency ministerial meeting in Amman over al-Aqsa", "tr": "Ürdün, Mescid-i Aksa için acil bakanlar toplantısını Amman'da topluyor"}, "topic": "geopolitics", "url": "https://www.irishtimes.com/world/middle-east/2026/08/04/jerusalems-al-asqa-mosque-facing-imminent-threat-of-israeli-takeover-says-jordan", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The official said that revoking the visa of a senior diplomat was not the same thing as removing that person from the country. Washington's stated reason is Brasília's withholding of approval for Danny Perez, Trump's nominee as ambassador to Brazil. Perez is a Florida state representative and a Republican ally of Secretary of State Marco Rubio; he was nominated in June. Sources close to the Brazilian government said the nomination broke protocol because Trump announced it publicly before consulting Brasília, and that Brazil intended to examine Perez's background before granting formal approval. Last month Brazil denied visas to US State Department officials from the Democracy, Human Rights and Labor Bureau. In July the US announced 25 percent tariffs on Brazilian imports, accusing Brazil of unfair trade practices; earlier tariffs on Brazil had been lifted. Brazil's presidential election is scheduled for October, with President Lula seeking a fourth term against right-wing Senator Flavio Bolsonaro.", "tr": "Yetkili, kıdemli bir diplomatın vizesinin iptal edilmesinin o kişiyi ülkeden çıkarmakla aynı şey olmadığını söyledi. Washington'ın gerekçesi, Brasília'nın Trump'ın Brezilya büyükelçiliğine aday gösterdiği Danny Perez için onay vermemesi. Perez, Florida eyalet meclisi üyesi ve Dışişleri Bakanı Marco Rubio'nun Cumhuriyetçi müttefiki; adaylığı haziranda açıklandı. Brezilya hükümetine yakın kaynaklar, Trump'ın adaylığı Brasília'ya danışmadan kamuoyuna duyurmasının teamüle aykırı olduğunu, Brezilya'nın resmî onay vermeden önce Perez'in geçmişini inceleyeceğini bildirdi. Geçen ay Brezilya, ABD Dışişleri Bakanlığı'nın Demokrasi, İnsan Hakları ve Çalışma Bürosu'ndan gelen yetkililere vize vermemişti. Temmuzda ABD, haksız ticaret uygulamaları gerekçesiyle Brezilya'dan yapılan ithalata yüzde 25 gümrük vergisi ilan etti; Brezilya'ya daha önce konulan vergiler kaldırılmıştı. Brezilya'da devlet başkanlığı seçimi ekimde yapılacak; Lula dördüncü dönem için aday, karşısında sağcı senatör Flavio Bolsonaro var."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "The Trump administration revoked the visa of Brazil's ambassador in Washington, Maria Luiza Ribeiro Viotti. A State Department official who was not named said the revocation did not amount to expelling her from the country.", "tr": "Trump yönetimi, Brezilya'nın Washington Büyükelçisi Maria Luiza Ribeiro Viotti'nin vizesini iptal etti. Adının açıklanmasını istemeyen bir Dışişleri Bakanlığı yetkilisi, iptalin büyükelçinin sınır dışı edilmesi anlamına gelmediğini belirtti."}, "tag": "diplomacy", "title": {"en": "US revokes the visa of Brazil's ambassador in Washington", "tr": "ABD, Brezilya'nın Washington büyükelçisinin vizesini iptal etti"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/4/us-revokes-visa-of-brazilian-ambassador-amid-deepening-diplomatic-spat", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Kyiv Mayor Vitali Klitschko said on Telegram that air defence units had been in action to repel the assault and that people might be trapped under rubble. A private house in the capital was also damaged. Ukraine's President Volodymyr Zelenskyy said the lack of ballistic missile interceptors only encourages Russia to launch such attacks that take human lives. Al Jazeera reported that at least 27 people had been killed in attacks across Russia and Ukraine earlier in the week. United Nations human rights monitors noted that civilian casualties were at their highest level since the invasion of February 2022.", "tr": "Kiev Belediye Başkanı Vitali Klitschko, Telegram üzerinden hava savunma birimlerinin saldırıyı püskürtmek üzere devreye girdiğini ve enkaz altında kişilerin bulunabileceğini duyurdu. Başkentte bir müstakil ev de hasar gördü. Ukrayna Devlet Başkanı Volodimir Zelenskiy, balistik füze önleyicilerinin eksikliğinin Rusya'yı can alan bu tür saldırılar düzenlemeye teşvik ettiğini söyledi. Al Jazeera'ya göre bu hafta Rusya ve Ukrayna'da yapılan saldırılarda en az 27 kişi ölmüştü. Birleşmiş Milletler insan hakları gözlemcileri sivil kayıpların Şubat 2022'deki işgalden bu yana en yüksek düzeye çıktığını kaydetti."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "According to the Kyiv military administration, one person was killed and five injured in a Russian ballistic missile attack on the capital. The administration said warehouse buildings had been set ablaze in two districts and that the danger remained high.", "tr": "Kiev askerî yönetimine göre Rusya'nın başkente düzenlediği balistik füze saldırısında bir kişi öldü, beş kişi yaralandı. Yönetim iki ilçede depo binalarının alev aldığını ve tehlikenin yüksek olduğunu bildirdi."}, "tag": "conflict", "title": {"en": "Kyiv military administration reports one killed in a ballistic missile attack", "tr": "Kiev askerî yönetimi balistik füze saldırısında bir kişinin öldüğünü bildirdi"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/4/russia-strikes-ukrainian-capital-kyiv-with-ballistic-missiles", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Saree said the strike was a response to Saudi drone incursions into Yemeni airspace over the Saada and Hajjah governorates, and stated that any violation of that airspace would not go unanswered. The results of the strike have not been independently verified; the account rests on the group's own statement. On 20 July the Houthis announced a maritime embargo on Saudi Arabia, framing it as a response to a Saudi blockade of Yemen. The National reports that the announcement carried the risk of worsening the regional conflict and shutting off a critical route that bypasses the Strait of Hormuz.", "tr": "Sari, saldırının Suudi insansız hava araçlarının Saada ve Hacce vilayetleri üzerindeki Yemen hava sahasına girmesine karşılık düzenlendiğini söyledi ve hava sahasına her izinsiz girişin karşılıksız kalmayacağını bildirdi. Saldırının sonuçları bağımsız olarak doğrulanmadı; anlatılanlar grubun kendi beyanına dayanıyor. Husiler 20 Temmuz'da Suudi Arabistan'a yönelik bir deniz ablukası ilan etmiş ve bunu Yemen'e uygulanan Suudi ablukasına yanıt olarak tanımlamıştı. The National'a göre bu ilan, bölgesel çatışmayı ağırlaştırma ve Hürmüz Boğazı'nı devre dışı bırakan alternatif deniz yolunu kapatma riski taşıyor."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "The National", "summary": {"en": "The Houthi military spokesman Yahya Saree said the group had struck what it called a sensitive target at Najran Airport in southern Saudi Arabia with a drone and had achieved a precise hit. There was no immediate confirmation from Saudi officials.", "tr": "Husi askerî sözcüsü Yahya Sari, grubun güney Suudi Arabistan'daki Necran Havalimanı'nda hassas diye nitelendirdiği bir hedefi insansız hava aracıyla vurduğunu ve isabetli bir sonuç alındığını bildirdi. Suudi yetkililerden olayla ilgili anında bir doğrulama gelmedi."}, "tag": "conflict", "title": {"en": "Houthis say they struck a target at Najran Airport with a drone", "tr": "Husiler Necran Havalimanı'ndaki bir hedefe insansız hava aracı saldırısı düzenlediklerini açıkladı"}, "topic": "geopolitics", "url": "https://www.thenationalnews.com/news/2026/08/04/yemens-houthis-claim-drone-strike-on-saudi-target-at-najran-airport/", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Acting Defence Minister Majid Ebn-e Reza asserted that missile and drone production had not stopped for a single day and that drone production had reached three times pre-war levels, without providing figures for that claim. IRGC spokesman Hossein Mohebbi said last month that Iran's missile production rate had increased during the ceasefire and that battlefield knowledge had improved accuracy. Former senior IRGC commander Hossein Kanani Moghaddam said domestic production and quality had been improved, that existing missiles had gained range and warhead power, and that stockpiles were held in underground missile and drone cities. A US media assessment in June put Iran's retained holdings at about 70 percent of its pre-war missile stockpile and about 40 percent of its pre-war drone arsenal. The memorandum of understanding was signed in June 2026 and is now suspended; the war began on 28 February 2026.", "tr": "Vekâleten savunma bakanı Mecid İbn-i Rıza, füze ve insansız hava aracı üretiminin tek gün bile durmadığını, insansız hava aracı üretiminin savaş öncesi düzeyin üç katına ulaştığını öne sürdü; bu iddia için rakam vermedi. Devrim Muhafızları sözcüsü Hüseyin Muhibbi geçen ay füze üretim hızının ateşkes boyunca arttığını, muharebe deneyiminin isabeti iyileştirdiğini söylemişti. Devrim Muhafızları'nın eski üst düzey komutanı Hüseyin Kanani Mukaddem yerli üretimin ve kalitenin geliştirildiğini, mevcut füzelerin menzil ve harp başlığı gücünün artırıldığını, stokların yeraltı füze ve insansız hava aracı şehirlerinde tutulduğunu belirtti. Haziranda ABD basınında yer alan bir değerlendirmeye göre İran savaş öncesi füze stokunun yaklaşık yüzde 70'ini, insansız hava aracı envanterinin yaklaşık yüzde 40'ını koruyor. Mutabakat zaptı haziran 2026'da imzalanmıştı ve şu anda askıya alınmış durumda; savaş 28 Şubat 2026'da başlamıştı."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "Iran's army spokesman Mohammad Akraminia said the country had made maximum use of the period the memorandum of understanding provided, inducting equipment, importing new gear and repairing damaged systems. The statements have not been independently verified.", "tr": "İran ordusu sözcüsü Muhammed Ekraminia, mutabakat zaptının sağladığı dönemden azami ölçüde yararlandıklarını; teçhizat teslim aldıklarını, yeni ekipman ithal ettiklerini ve hasarlı sistemleri onardıklarını söyledi. Beyanlar bağımsız olarak doğrulanmadı."}, "tag": "security", "title": {"en": "Iranian commanders say missile and drone production rose during the ceasefire", "tr": "İranlı komutanlar ateşkes döneminde füze ve insansız hava aracı üretiminin arttığını söylüyor"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/4/maximum-use-iran-boosts-military-strength-during-ceasefire-with-us", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Excavation began on 28 July in the village of Kalluder e Vogel/Mala Kaludra in the municipality of Zubin Potok, after the prosecution sought a court order. On 2 August a second burial site was identified at the village of Jabuke in the same municipality; the government's Commission on Missing Persons said the terrain had concentrated work at Jabuke, where the remains of four individuals were exhumed and transferred to the Institute of Forensic Medicine for examination and DNA identification. The Pristina Basic Court on Monday ordered one month's pre-trial detention for a suspect identified only as J.R., a Serbian citizen arrested on 2 August, on the ground that he could flee or influence witnesses or evidence. Two others, M.J. and M.B., detained when excavation began on 28 July, remain in custody. The prosecution said there is evidence that one of the suspects had been mobilised and served actively in the former Yugoslav Army during the war. Acting Prime Minister Albin Kurti said on 29 July that the remains might belong to a group of Albanian civilians, including doctors, professors and lawyers, who disappeared on 19 April 1999, while adding that this could not be confirmed. Acting Interior Minister Xhelal Svecla said the victims were thrown into a lime pit after being executed, and accused Serbia of refusing to provide information about the disappeared while imprisoning its own citizens who cooperate with investigations. A report published on 29 July by Kosovo's Institute of Crimes Committed During the War said 1,578 people remain missing from the 1998-99 war.", "tr": "Kazı, Zubin Potok belediyesindeki Kalluder e Vogel/Mala Kaludra köyünde, savcılığın mahkeme kararı talep etmesinin ardından 28 Temmuz'da başladı. 2 Ağustos'ta aynı belediyedeki Jabuke köyünde ikinci bir gömü alanı belirlendi; hükümetin Kayıp Kişiler Komisyonu, arazi koşulları nedeniyle çalışmanın Jabuke'de yoğunlaştığını ve burada dört kişinin kalıntılarının çıkarıldığını, kalıntıların inceleme ve DNA tespiti için Adli Tıp Enstitüsü'ne gönderildiğini bildirdi. Priştine Temel Mahkemesi pazartesi günü, 2 Ağustos'ta yakalanan ve yalnızca J.R. olarak tanımlanan Sırbistan vatandaşı şüpheli için bir ay tutukluluk kararı verdi; gerekçe kaçma ile tanıklara veya delillere etki etme riskiydi. Kazının başladığı 28 Temmuz'da yakalanan M.J. ve M.B. de tutuklu. Savcılık, şüphelilerden birinin savaş sırasında eski Yugoslav ordusunda seferber edilip fiilen görev yaptığına dair delil bulunduğunu bildirdi. Vekâleten Başbakan Albin Kurti 29 Temmuz'da kalıntıların, 19 Nisan 1999'da kaybolan ve aralarında doktor, profesör ve avukatların bulunduğu Arnavut sivillerden oluşan gruba ait olabileceğini söyledi, ancak bunun doğrulanamadığını ekledi. Vekâleten İçişleri Bakanı Xhelal Svecla kurbanların infaz edildikten sonra bir kireç çukuruna atıldığını söyledi ve Sırbistan'ı kayıp kişiler hakkında bilgi vermemekle, soruşturmaya yardım eden kendi vatandaşlarını ise hapsetmekle suçladı. Kosova'nın Savaş Sırasında İşlenen Suçlar Enstitüsü'nün 29 Temmuz'da yayımladığı raporda 1998-99 savaşından geriye 1.578 kişinin kayıp olduğu belirtiliyor."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Balkan Insight", "summary": {"en": "The Kosovo Special Prosecution said investigations into the remains of missing persons from the 1998-99 war are also under way at a third location in the municipality of Zubin Potok in the Serb-majority north of the country, and that three people have been detained on suspicion of war crimes against the civilian population.", "tr": "Kosova Özel Savcılığı, 1998-99 savaşından kalan kayıp kişilere ilişkin soruşturmaların ülkenin Sırp çoğunluklu kuzeyinde, Zubin Potok belediyesindeki üçüncü bir noktada da yürütüldüğünü ve sivil halka karşı savaş suçu şüphesiyle üç kişinin tutuklandığını açıkladı."}, "tag": "conflict", "title": {"en": "Kosovo's mass grave investigation widens to a third site and a third suspect is detained", "tr": "Kosova'da toplu mezar soruşturması üçüncü noktaya genişledi, üçüncü şüpheli tutuklandı"}, "topic": "geopolitics", "url": "https://balkaninsight.com/2026/08/04/kosovo-detains-third-suspect-as-mass-grave-probe-expands-in-north/bi/", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The decree was signed by President Javier Milei and Deregulation Minister Federico Sturzenegger. According to MercoPress, the text creates an open register of pilots administered by the coast guard with no quotas; allows users to contract freely and agree on fees, with maximum rates set by the National Ports and Navigation Agency; removes the geographic segmentation that required changing pilots during a single voyage; and broadens exemptions for captains with certified local experience. The rules it replaces had been in force since 1991. The berths affected include Greater Rosario, Campana, Dock Sud, Arroyo Seco, Bahía Blanca, San Lorenzo, Santa Cruz, Caleta Córdova and the facilities of the Vaca Muerta Oil Sur project.", "tr": "Kararnameyi Devlet Başkanı Javier Milei ve Kuralsızlaştırma Bakanı Federico Sturzenegger imzaladı. MercoPress'e göre metin, sahil güvenlik tarafından yönetilen ve kota içermeyen açık bir kılavuz kaptan sicili kuruyor; kullanıcıların serbestçe sözleşme yapıp ücret üzerinde anlaşmasına izin veriyor ve azami ücretleri Ulusal Limanlar ve Seyrüsefer Kurumu'nun belirlemesini öngörüyor; tek bir sefer sırasında kılavuz kaptan değiştirmeyi zorunlu kılan coğrafi bölünmeyi kaldırıyor; belgelenmiş yerel deneyime sahip kaptanlar için muafiyetleri genişletiyor. Yerini aldığı kurallar 1991'den beri yürürlükteydi. Beklemenin etkilediği noktalar arasında Büyük Rosario, Campana, Dock Sud, Arroyo Seco, Bahía Blanca, San Lorenzo, Santa Cruz, Caleta Córdova ve Vaca Muerta Oil Sur projesinin tesisleri bulunuyor."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "MercoPress", "summary": {"en": "Decree 690/2026 was published on 31 July 2026 and rewrote the pilotage regime. After maritime pilots stopped accepting new assignments, around 140 vessels were stranded as of Monday, with some reports putting the number above 150.", "tr": "690/2026 sayılı kararname 31 Temmuz 2026'da yayımlandı ve kılavuz kaptanlık düzenini yeniden yazdı. Kılavuz kaptanların yeni görev almayı bırakmasının ardından pazartesi itibarıyla yaklaşık 140 gemi bekliyordu; bazı haberler sayıyı 150'nin üzerine koyuyor."}, "tag": "trade", "title": {"en": "Around 140 vessels are stranded at Argentine ports after the pilotage decree", "tr": "Kılavuzluk kararnamesinin ardından Arjantin limanlarında yaklaşık 140 gemi bekliyor"}, "topic": "geopolitics", "url": "https://en.mercopress.com/2026/08/04/around-140-vessels-stranded-at-argentine-ports-after-government-deregulation-decree", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "According to Al Jazeera, the department has for decades run an election monitoring programme to ensure compliance with federal civil rights laws, and it described this deployment as routine and non-partisan. In a letter dated Monday, 10 Democratic senators asked for assurances that FBI monitors deployed across the country will not target jurisdictions in a partisan manner, discourage voter participation or interfere with the voting process, or pressure, harass or interfere with state and local election officials as they do their jobs. On fraud allegations in Muskegon, state officials presented the situation as proof that their election security practices work.", "tr": "Al Jazeera'ya göre bakanlık onlarca yıldır federal sivil haklar yasalarına uyumu denetlemek üzere bir seçim gözlem programı yürütüyor ve bu görevlendirmeyi olağan ve tarafsız diye tanımladı. Pazartesi tarihli bir mektupta 10 Demokrat senatör, ülke genelinde görevlendirilen FBI gözlemcilerinin yargı çevrelerini partizan biçimde hedef almayacağına, seçmen katılımını caydırmayacağına veya oy verme sürecine müdahale etmeyeceğine, eyalet ve yerel seçim görevlilerine baskı yapmayacağına ve işlerini yaparken onları taciz etmeyeceğine dair güvence istedi. Muskegon'daki sahtecilik iddialarına ilişkin olarak eyalet yetkilileri durumu kendi seçim güvenliği uygulamalarının işlediğinin kanıtı diye sundu."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "The Justice Department announced federal monitors at polling places in Detroit, Hamtramck, Lansing and East Lansing during Tuesday's primary vote. All four cities lean Democratic.", "tr": "Adalet Bakanlığı, salı günkü ön seçim sırasında Detroit, Hamtramck, Lansing ve East Lansing'de sandıklara federal gözlemci görevlendirdiğini duyurdu. Dört şehir de Demokratların ağırlıklı olduğu yerler."}, "tag": "elections", "title": {"en": "The Justice Department sent federal monitors to polling places in four Michigan cities", "tr": "Adalet Bakanlığı dört Michigan şehrinin sandıklarına federal gözlemci gönderdi"}, "topic": "geopolitics", "url": "https://www.aljazeera.com/news/2026/8/4/doj-sends-monitors-to-michigan-poll-sites-as-lawmakers-warn-of-partisan-aim", "editionDate": "2026-08-05"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The deployment began in the summer of 2025 following President Donald Trump's emergency order and was extended through 20 January 2029, or until terminated by the president. Numbers swelled to 5,000 troops in the summer of 2026 for Independence Day celebrations. As of late July 2026, 4,600 personnel from the District and 23 states and territories were deployed. Georgia contributed about 800 and Louisiana about 150 Guard members through January 2027; Hawaii's 27 members were due to be withdrawn later that month. US courts have restricted the use of the National Guard elsewhere, but the president is the direct commander of the District's Guard forces. Senator Elizabeth Warren said the National Guard are not pawns and that taxpayer dollars are not a piggy bank for Trump's political stunts.", "tr": "Görevlendirme, Devlet Başkanı Donald Trump'ın olağanüstü hâl emrinin ardından 2025 yazında başladı ve 20 Ocak 2029'a ya da başkanın sona erdirmesine kadar uzatıldı. Sayı, 2026 yazında Bağımsızlık Günü kutlamaları için 5.000 askere çıktı. Temmuz 2026 sonu itibarıyla başkentten ve 23 eyalet ile bölgeden 4.600 personel görevdeydi. Georgia yaklaşık 800, Louisiana Ocak 2027'ye kadar yaklaşık 150 muhafız gönderdi; Hawaii'nin gönderdiği 27 kişinin ay içinde çekilmesi planlanıyordu. ABD mahkemeleri Ulusal Muhafız'ın başka yerlerde kullanılmasını sınırladı, ancak başkent muhafız birliklerinin doğrudan komutanı devlet başkanı. Senatör Elizabeth Warren, Ulusal Muhafız'ın piyon olmadığını ve vergi mükelleflerinin parasının Trump'ın siyasi gösterileri için kumbara sayılamayacağını söyledi."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-05T00:35:29+00:00", "src": "Al Jazeera", "summary": {"en": "The Defense Department estimates that the National Guard deployment in the capital will cost roughly 1.4 billion dollars across fiscal years 2027-2029, through January 2029. The estimate assumes an average of 2,500 Guard members remaining in the city.", "tr": "Savunma Bakanlığı, başkentteki Ulusal itionDate": "2026-07-30", "n": 1, "hasAnalysis": true}], "articles": [{"excerpt": {"en": "The Justice Department sent federal monitors to polling places in four Michigan cities for Tuesday's primary. In a letter dated Monday, 10 senators asked for assurances; the authority that would make those assurances binding does not sit with the people who wrote it.", "tr": "Adalet Bakanlığı, salı günkü ön seçimde dört Michigan şehrinin sandıklarına federal gözlemci gönderdi. Pazartesi tarihli bir mektupta 10 senatör güvence istedi; istenen güvenceyi bağlayıcı kılacak yetki ise mektubu yazanların elinde durmuyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The programme's basis and this week's use", "tr": "Programın dayanağı ve bu haftaki kullanımı"}, "ps": [{"en": "The Justice Department announced federal monitors at polling places in Detroit, Hamtramck, Lansing and East Lansing during Tuesday's primary. The department has for decades run an election monitoring programme that checks compliance with federal civil rights laws, and it described this deployment as routine and non-partisan. What the four cities have in common is that they all lean Democratic.", "refs": ["michigan-monitors"], "tr": "Adalet Bakanlığı salı günkü ön seçim sırasında Detroit, Hamtramck, Lansing ve East Lansing'de sandıklara federal gözlemci görevlendirdiğini duyurdu. Bakanlık onlarca yıldır federal sivil haklar yasalarına uyumu denetleyen bir seçim gözlem programı yürütüyor ve bu görevlendirmeyi olağan ve tarafsız diye tanımladı. Dört şehrin ortak özelliği ise Demokratların ağırlıklı olduğu yerler olmaları."}, {"en": "The instrument here is an administrative compliance programme. There is no court order and no statute written for this election. That distinction also sets what the instrument can do: a monitor observes and reports, and the remedy for what it finds is a civil rights enforcement action brought later. The discretionary part of the programme is deciding whic
