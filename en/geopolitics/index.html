h jurisdictions to observe, and the four named cities are that discretion exercised.", "refs": ["michigan-monitors"], "tr": "Buradaki araç bir idari uyum programı. Ortada ne bir mahkeme kararı var ne de bu seçim için çıkarılmış bir yasa. Bu ayrım aracın yapabileceklerini de belirliyor: gözlemci izler ve rapor eder, bulduğu şeyin karşılığı ise sonradan açılacak bir sivil haklar davasıdır. Programın takdire bağlı kısmı hangi yargı çevrelerinin izleneceğine karar vermek; adı geçen dört şehir de bu takdirin kullanılmış hâli."}]}, {"h": {"en": "What the letter can and cannot ask", "tr": "Mektubun sorabildiği ve soramadığı"}, "ps": [{"en": "In the letter dated Monday, 10 Democratic senators asked for assurances that FBI monitors deployed across the country would not target jurisdictions in a partisan manner, would not discourage voter participation, and would not pressure state and local election officials. The request describes the risk accurately. The text itself carries no power to withdraw a monitor or to attach conditions to the deployment.", "refs": ["michigan-monitors"], "tr": "Pazartesi tarihli mektupta 10 Demokrat senatör, ülke genelinde görevlendirilen FBI gözlemcilerinin yargı çevrelerini partizan biçimde hedef almayacağına, seçmen katılımını caydırmayacağına ve eyalet ile yerel seçim görevlilerine baskı yapmayacağına dair güvence istedi. Talep riski yerinde tarif ediyor. Metnin kendisi bir gözlemciyi geri çektirme ya da görevlendirmeye koşul bağlama gücü taşımıyor."}, {"en": "Two readings are available. In the first, the letter is the opening step in a sequence that runs toward a place where the Senate does hold leverage: an oversight hearing or an appropriations condition. In the second, the correspondence is the only remedy left before polling day, and the working check runs instead through state election officials and the courts. That state officials answered the fraud allegations in Muskegon by pointing to their own election security practices suggests the second channel is in working order.", "refs": ["michigan-monitors"], "tr": "İki okuma mümkün. Birincisinde mektup, senatonun gerçekten kaldıraç sahibi olduğu bir yere, bir denetim oturumuna veya ödenek koşuluna doğru giden dizinin ilk adımıdır. İkincisinde yazışma, oy verme gününden önce elde kalan tek çaredir; işleyen denetim ise eyalet seçim görevlileri ile mahkemeler üzerinden yürür. Muskegon'daki sahtecilik iddialarına eyalet yetkililerinin kendi seçim güvenliği uygulamalarını göstererek karşılık vermesi, bu ikinci kanalın çalışır durumda olduğuna işaret ediyor."}]}, {"h": {"en": "Where to look after the vote", "tr": "Seçimden sonra bakılacak yer"}, "ps": [{"en": "The observable that separates the two readings is this: will the programme publish a public post-election account naming the jurisdictions observed and the findings, as a compliance programme would, or will the deployment end leaving no such document? A programme said to check compliance with civil rights laws is expected to write down both what it found and what it did not, and the absence of that writing leaves open the question of whether the discretion served a purpose other than observation.", "refs": ["michigan-monitors"], "tr": "İki okumayı ayıracak gözlemlenebilir nokta şu: bir uyum programının yapacağı gibi, seçimden sonra izlenen yargı çevrelerini ve bulguları adlarıyla açıklayan kamuya açık bir sonuç yayımlanacak mı, yoksa görevlendirme böyle bir belge bırakmadan mı sona erecek? Sivil haklar yasalarına uyumu denetlediği söylenen bir programın uyumsuzluk bulmadığını da bulduğunu da yazması beklenir; bu yazının yokluğu, takdirin izleme dışında bir amaca hizmet ettiği yönündeki soruyu açık bırakır."}]}], "sources": [{"key": "michigan-monitors", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/doj-sends-monitors-to-michigan-poll-sites-as-lawmakers-warn-of-partisan-aim", "title": {"tr": "Adalet Bakanlığı dört Michigan şehrinin sandıklarına federal gözlemci gönderdi", "en": "The Justice Department sent federal monitors to polling places in four Michigan cities"}, "publishedDate": "2026-08-04"}], "title": {"en": "Who can recall the monitor?", "tr": "Gözlemciyi kim geri çağırabilir?"}, "writer": "geo-01", "date": "2026-08-05"}, {"excerpt": {"en": "Jordan brings Arab League foreign ministers together in Amman on Wednesday alongside Turkey, Indonesia, Malaysia and Pakistan. The subject is the erosion of the arrangement in Jerusalem, and the text that binds that arrangement today is the 1994 Israeli-Jordanian peace treaty.", "tr": "Ürdün çarşamba günü Amman'da Arap Ligi dışişleri bakanlarını Türkiye, Endonezya, Malezya ve Pakistan'la bir araya getiriyor. Toplantının konusu Kudüs'teki düzenlemenin aşınması; o düzenlemeyi bugün bağlayan metin ise 1994 İsrail-Ürdün barış antlaşması."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "Who was called, and for what", "tr": "Kimler çağrıldı ve ne için"}, "ps": [{"en": "Jordan's Foreign Minister Ayman Safadi is holding an emergency ministerial meeting in Amman on Wednesday over what he calls a threat to the al-Aqsa mosque and the Dome of the Rock. The participants are not limited to Arab League foreign ministers: Turkey, Indonesia, Malaysia and Pakistan are at the table as well. The event Jordanian officials point to occurred on 23 July, when more than 2,000 Israelis, among them National Security Minister Itamar Ben Gvir, entered the compound and performed prayers and religious rituals.", "refs": ["alaqsa-amman"], "tr": "Ürdün Dışişleri Bakanı Eyman Safedi, Mescid-i Aksa ve Kubbetü's-Sahra çevresinde oluştuğunu söylediği tehdit üzerine çarşamba günü Amman'da acil bir bakanlar toplantısı düzenliyor. Katılımcılar Arap Ligi dışişleri bakanlarıyla sınırlı değil: Türkiye, Endonezya, Malezya ve Pakistan da masada. Ürdünlü yetkililerin dayandığı olay 23 Temmuz'da yaşandı; aralarında Ulusal Güvenlik Bakanı Itamar Ben Gvir'in de bulunduğu 2.000'den fazla İsrailli avluya girip namaz kıldı ve dinî ayinler düzenledi."}, {"en": "The list of participants is the first thing to read. Calling four states from outside the Arab League to Amman widens the declaratory coalition that takes ownership of the issue. It does not add a party to the treaty that governs the site. Keeping those two apart sets, in advance, the limit on what the meeting can produce.", "refs": ["alaqsa-amman"], "tr": "Katılımcı listesi ilk okunacak şey. Arap Ligi dışından dört devletin Amman'a çağrılması, konuyu sahiplenen beyan koalisyonunu genişletiyor. Alanı düzenleyen antlaşmaya taraf eklemiyor. Bu iki şeyin karıştırılmaması, toplantıdan ne çıkabileceğini baştan sınırlar."}]}, {"h": {"en": "The weight a communiqué can carry", "tr": "Bir bildirinin taşıyabileceği yük"}, "ps": [{"en": "Safadi described the threat as constant and dangerous and said Jordan was trying to counter it with every tool available. The report carries no response from the Israeli government to the event Jordan calls the worst violation in modern history of the arrangement that permits only Muslim prayer at the site. So there is no two-sided understanding on the table: one party's characterisation stands alongside the other's silence.", "refs": ["alaqsa-amman"], "tr": "Safedi tehdidi sürekli ve tehlikeli diye tanımladı ve Ürdün'ün elindeki her araçla karşı koymaya çalıştığını söyledi. Ürdün'ün yalnızca Müslümanların ibadetine izin veren düzenlemenin modern tarihteki en ağır çiğnenmesi dediği olayla ilgili İsrail hükümetinin yanıtı haberde yer almıyor. Yani elde iki taraflı bir uzlaşı yok; bir tarafın nitelemesi ve karşı tarafın sessizliği var."}, {"en": "The Hashemite monarchy's custodianship of the holy sites in Jerusalem was reaffirmed in the 1994 peace treaty, making it a bilateral obligation Israel owes Jordan. The ministers gathering in Amman can raise the political cost of a change, but the enforcement channel stays inside the treaty relationship between two governments. The opposite reading is available too: states that hold normalisation or security relationships standing together may shift Israel's calculation, in which case the mechanism is the breadth of the coalition rather than the treaty.", "refs": ["alaqsa-amman"], "tr": "Haşimi hanedanının Kudüs'teki kutsal mekânlar üzerindeki koruyuculuğu 1994 barış antlaşmasında yeniden teyit edilmişti; bu, İsrail'in Ürdün'e karşı üstlendiği ikili bir yükümlülük. Bu yüzden Amman'da toplanan bakanlar bir değişikliğin siyasi bedelini yükseltebilir, ama uygulama kanalı iki hükümet arasındaki antlaşma ilişkisinde kalıyor. Karşı okuma da mümkün: normalleşme veya güvenlik ilişkisi taşıyan devletlerin bir arada durması İsrail'in hesabını değiştirebilir, o hâlde mekanizma antlaşma değil koalisyonun genişliği olur."}]}, {"h": {"en": "What would be measurable", "tr": "Ölçülebilir olan"}, "ps": [{"en": "What can be measured is whether the closing text names a mechanism. A monitoring arrangement, a delegation to visit the site, a date: any one of them counts as an outcome beyond the number of participants. If a position is merely restated, what happened in Amman on Wednesday amounts to the widening of a coalition, and the text binding the arrangement in Jerusalem remains the bilateral obligation left from 1994.", "refs": ["alaqsa-amman"], "tr": "Toplantıdan çıkacak metnin adı konmuş bir mekanizma içerip içermediği ölçülebilir. Bir izleme düzenlemesi, alana gidecek bir heyet, bir tarih: bunların herhangi biri, katılımcı sayısının ötesinde bir sonuç sayılır. Yalnızca bir tutum tekrarlanıyorsa, çarşamba günü Amman'da olan şey koalisyonun genişlemesinden ibaret kalır ve Kudüs'teki düzenlemeyi bağlayan metin yine 1994'ten kalan ikili yükümlülük olur."}]}], "sources": [{"key": "alaqsa-amman", "kind": "news", "name": "The Irish Times", "url": "https://www.irishtimes.com/world/middle-east/2026/08/04/jerusalems-al-asqa-mosque-facing-imminent-threat-of-israeli-takeover-says-jordan", "title": {"tr": "Ürdün, Mescid-i Aksa için acil bakanlar toplantısını Amman'da topluyor", "en": "Jordan convenes an emergency ministerial meeting in Amman over al-Aqsa"}, "publishedDate": "2026-08-04"}], "title": {"en": "Four more states were called to the table, and the binding text is still bilateral", "tr": "Masaya dört ülke daha çağrıldı, bağlayıcı metin hâlâ ikili"}, "writer": "geo-02", "date": "2026-08-05"}, {"excerpt": {"en": "The Houthi military spokesman announced a drone strike on Najran Airport and named its justification. No claim followed for the Indian-flagged vessel that sank off Yemen the same day. The gap between the two behaviours shows how far the announced blockade is actually being applied.", "tr": "Husi askerî sözcüsü Necran Havalimanı'na yapılan insansız hava aracı saldırısını duyurdu ve gerekçesini adıyla verdi. Aynı gün Yemen açıklarında batan Hindistan bayraklı gemi için hiçbir üstlenme gelmedi. İki davranış arasındaki fark, ilan edilen ablukanın fiilen nereye kadar uygulandığını gösteriyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The strike that was announced", "tr": "Duyurulan vuruş"}, "ps": [{"en": "The Houthi military spokesman Yahya Saree said the group had hit what it called a sensitive target at Najran Airport in southern Saudi Arabia with a drone and had achieved a precise result. No immediate confirmation came from Saudi officials. What is established is the claim itself and the justification announced with it; the effect on the ground lies outside that.", "refs": ["najran-drone"], "tr": "Husi askerî sözcüsü Yahya Sari, grubun güney Suudi Arabistan'daki Necran Havalimanı'nda hassas diye nitelendirdiği bir hedefi insansız hava aracıyla vurduğunu ve isabetli bir sonuç alındığını bildirdi. Suudi yetkililerden anında bir doğrulama gelmedi. Elde kesin olan şey, iddianın kendisi ve ilan edilen gerekçesi; sahadaki etki bunların dışında kalıyor."}, {"en": "A statement of this shape is a message before it is a military result. It names the violation it answers: Saudi drones over the Saada and Hajjah governorates. It names the place where it answers. And it names the rule it treats as applying from now on: any violation of that airspace will not go unanswered. Announcing all three at once makes the event a deterrent statement rather than an operation. Capability has not been measured here; what has been measured is the group's willingness to say which rule it is standing behind.", "refs": ["najran-drone"], "tr": "Bu biçimdeki bir açıklama, askerî sonuçtan önce bir mesajdır. Karşılık verdiği izinsiz girişi adlandırır: Saada ve Hacce vilayetleri üzerindeki Suudi insansız hava araçları. Karşılığı verdiği yeri adlandırır. Ve bundan sonrası için geçerli saydığı kuralı adlandırır: hava sahasına her izinsiz giriş karşılıksız kalmayacak. Üç unsurun birden duyurulması, olayı bir harekâttan çok bir caydırma beyanı hâline getirir. Kabiliyet burada ölçülmemiştir; ölçülen şey, grubun hangi kuralın arkasında durduğunu söylemeye razı olmasıdır."}]}, {"h": {"en": "The sinking nobody claimed", "tr": "Üstlenilmeyen batış"}, "ps": [{"en": "The same day the MSV Faize Noore Oliya, an Indian-flagged vessel, capsized and sank off Yemen after being hit by a projectile; all 14 people on board were rescued, 13 of them Indian nationals. Yemen's transport ministry, under the Saudi-backed government, accused the Houthis of carrying out the attack with a boat laden with explosives, Reuters reported. The group has made no statement. India's Shipping Minister Sarbananda Sonowal condemned the attack.", "refs": ["yemen-ship-sunk"], "tr": "Aynı gün MSV Faize Noore Oliya adlı Hindistan bayraklı tekne, Yemen açıklarında bir mermiyle vurulduktan sonra alabora olup battı; gemideki 14 kişinin tamamı kurtarıldı, 13'ü Hindistan vatandaşıydı. Yemen'in Suudi destekli hükümetine bağlı ulaştırma bakanlığı, Reuters'a göre saldırıyı patlayıcı yüklü bir tekneyle Husilerin düzenlediğini öne sürdü. Grup olayla ilgili açıklama yapmadı. Hindistan Denizcilik Bakanı Sarbananda Sonowal saldırıyı kınadı."}, {"en": "Set beside the Najran statement, that silence carries information. The blockade the Houthis announced on 20 July was directed at Saudi Arabia's Red Sea ports. An Indian-flagged vessel does not clearly fall within that declaration, and a claim would extend the announced rule to traffic the group has not said it covers. The opposite reading is available: withholding attribution while the Hormuz talks run would make the silence a tactic rather than a boundary. What separates the two will be which ships the group's later claims turn out to cover.", "refs": ["najran-drone", "yemen-ship-sunk"], "tr": "Necran açıklamasının yanında bu sessizlik bilgi taşıyor. Husilerin 20 Temmuz'da ilan ettiği abluka Suudi Arabistan'ın Kızıldeniz limanlarına yönelikti. Hindistan bayraklı bir tekne o ilanın kapsamına açıkça girmiyor; bir üstlenme, ilan edilen kuralı grubun kapsadığını söylemediği trafiğe genişletirdi. Karşı okuma da var: Hürmüz görüşmeleri sürerken üstlenmenin bilinçli olarak geciktirilmesi, sessizliği bir sınırdan çok bir taktik hâline getirir. Bu ikisini ayıracak olan, grubun sonraki üstlenmelerinin hangi gemileri kapsadığıdır."}]}, {"h": {"en": "Where the limit gets tested", "tr": "Sınırın test edileceği yer"}, "ps": [{"en": "Whether the announced blockade has widened will show in a single observation. If the group claims by name an attack on a ship not calling at a Saudi Red Sea port, the rule will have moved from a blockade of ports to maritime traffic generally, and the airspace rule stated at Najran will no longer stand alone. If no such claim comes, the declaration of 20 July has held inside its own limits, and the sunken ship and the announced strike are counted separately.", "refs": ["najran-drone", "yemen-ship-sunk"], "tr": "İlan edilen ablukanın genişleyip genişlemediği tek bir gözlemle anlaşılır. Grup, Suudi Kızıldeniz limanlarına uğramayan bir gemiye yapılan saldırıyı adıyla üstlenirse, kural liman ablukasından deniz trafiğinin geneline taşınmış olur; Necran'daki gibi hava sahasına izinsiz girişe karşılık verme kuralı da o zaman tek başına durmaz. Böyle bir üstlenme gelmezse, 20 Temmuz'daki ilan kendi sınırları içinde kalmış sayılır ve batan gemi ile duyurulan saldırı ayrı ayrı sayılır."}]}], "sources": [{"key": "najran-drone", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/news/2026/08/04/yemens-houthis-claim-drone-strike-on-saudi-target-at-najran-airport/", "title": {"tr": "Husiler Necran Havalimanı'ndaki bir hedefe insansız hava aracı saldırısı düzenlediklerini açıkladı", "en": "Houthis say they struck a target at Najran Airport with a drone"}, "publishedDate": "2026-08-04"}, {"key": "yemen-ship-sunk", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cly84we1y37o", "title": {"tr": "Yemen açıklarında bir mermiyle vurulan Hindistan bayraklı gemi battı", "en": "Indian-flagged ship sinks after being hit by a projectile off Yemen"}, "publishedDate": "2026-08-04"}], "title": {"en": "The difference between the attack that was claimed and the one that was not", "tr": "Üstlenilen saldırı ile üstlenilmeyen saldırı arasındaki fark"}, "writer": "geo-03", "date": "2026-08-05"}, {"excerpt": {"en": "Decree 690/2026 was published on 31 July and changed the pilotage regime in force since 1991 at four separate points. Pilots stopped accepting new assignments, and around 140 vessels were waiting as of Monday. There is no second channel on the river, so this queue does not shift onto another route.", "tr": "690/2026 sayılı kararname 31 Temmuz'da yayımlandı ve 1991'den beri yürürlükte olan kılavuzluk düzenini dört ayrı yerinden değiştirdi. Kılavuz kaptanlar yeni görev almayı bıraktı; pazartesi itibarıyla yaklaşık 140 gemi bekliyordu. Nehirde ikinci bir kanal olmadığı için bu bekleme başka bir güzergâha kaymıyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The four items the decree changed", "tr": "Kararnamenin değiştirdiği dört kalem"}, "ps": [{"en": "Decree 690/2026, signed by President Javier Milei and Deregulation Minister Federico Sturzenegger, was published on 31 July 2026, and the rules it replaces had been in force since 1991. The text creates an open register of pilots administered by the coast guard with no quotas; it allows users to contract freely and agree on fees while leaving maximum rates to the National Ports and Navigation Agency; it removes the geographic segmentation that required changing pilots during a single voyage; and it broadens exemptions for captains with certified local experience.", "refs": ["argentina-pilots"], "tr": "Devlet Başkanı Javier Milei ve Kuralsızlaştırma Bakanı Federico Sturzenegger'in imzaladığı 690/2026 sayılı kararname 31 Temmuz 2026'da yayımlandı ve yerini aldığı kurallar 1991'den beri yürürlükteydi. Metin, sahil güvenlik tarafından yönetilen ve kota içermeyen açık bir kılavuz kaptan sicili kuruyor; kullanıcıların serbestçe sözleşme yapıp ücret üzerinde anlaşmasına izin verirken azami ücretleri Ulusal Limanlar ve Seyrüsefer Kurumu'na bırakıyor; tek bir sefer sırasında kılavuz kaptan değiştirmeyi zorunlu kılan coğrafi bölünmeyi kaldırıyor; belgelenmiş yerel deneyime sahip kaptanlar için muafiyetleri genişletiyor."}, {"en": "Each of the four changes targets a different stream of income. The quota determined who could sell the service. The maximum fee determines the price at which it can be sold. The geographic segmentation determined how many times the service had to be bought over one voyage. The exemption decides whether it has to be bought at all. Taken together, the four set from outside the price of a service that could previously set its own.", "refs": ["argentina-pilots"], "tr": "Dört değişikliğin her biri farklı bir geliri hedefliyor. Kota, hizmeti kimin satabileceğini belirliyordu. Azami ücret, hangi fiyattan satılabileceğini belirliyor. Coğrafi bölünme, aynı sefer boyunca hizmetin kaç kez satın alınacağını belirliyordu. Muafiyet ise hizmetin hiç satın alınıp alınmayacağına karar veriyor. Dördü birlikte, daha önce kendi fiyatını kendisi koyabilen bir hizmetin fiyatını dışarıdan koyuyor."}]}, {"h": {"en": "The size of the queue and where it sits", "tr": "Kuyruğun büyüklüğü ve durduğu yer"}, "ps": [{"en": "After pilots stopped accepting new assignments, around 140 vessels were waiting as of Monday, with some reports putting the number above 150. The affected points run along the river from Greater Rosario, San Lorenzo, Arroyo Seco and Campana down to Dock Sud and Bahía Blanca, and out to Santa Cruz, Caleta Córdova and the facilities of the Vaca Muerta Oil Sur project.", "refs": ["argentina-pilots"], "tr": "Kılavuz kaptanların yeni görev almayı bırakmasının ardından pazartesi itibarıyla yaklaşık 140 gemi bekliyordu; bazı haberler sayıyı 150'nin üzerine koyuyor. Etkilenen noktalar nehir üzerinde Büyük Rosario, San Lorenzo, Arroyo Seco ve Campana'dan başlayıp Dock Sud ile Bahía Blanca'ya, oradan Santa Cruz, Caleta Córdova ve Vaca Muerta Oil Sur projesinin tesislerine kadar uzanıyor."}, {"en": "The leverage sits in that list. Pilotage works as the same compulsory step becoming mandatory again at every berth on a river system, so a stoppage does not divert traffic; there is no second channel to the same terminals. The decree also carries its own measure: because exemptions for captains with certified local experience have been broadened, a share of the vessels can move without hiring a pilot. The number of ships using that exemption sets a ceiling on how far the queue can grow.", "refs": ["argentina-pilots"], "tr": "Kaldıraç bu listede duruyor. Kılavuzluk, bir nehir sisteminde her rıhtımda yeniden zorunlu hâle gelen aynı adım; bu yüzden iş bırakma trafiği başka yöne çevirmiyor, aynı terminallere giden ikinci bir kanal yok. Kararnamenin kendi içinde bir ölçüsü de var: belgelenmiş yerel deneyime sahip kaptanların muafiyeti genişletildiği için gemilerin bir bölümü kılavuz kaptan almadan hareket edebilir. Muafiyetten yararlanan gemi sayısı, kuyruğun ne kadar büyüyebileceğine tavan koyar."}]}, {"h": {"en": "What to measure", "tr": "Ölçülecek şey"}, "ps": [{"en": "The decree's lasting effect will show not in how many names are entered on the register but in the maximum tariff the National Ports and Navigation Agency publishes. Removing the quota clears an obstacle in front of supply; what binds the price is the ceiling. Once the schedule is published, the pilotage cost of a voyage on the Paraná becomes comparable independently of how long the queue is. Until that figure appears, what exists is a count of waiting vessels, and that count measures a work stoppage rather than a regulation.", "refs": ["argentina-pilots"], "tr": "Kararnamenin kalıcı etkisi sicile kaç kişinin yazıldığıyla değil, Ulusal Limanlar ve Seyrüsefer Kurumu'nun ilan edeceği azami tarifeyle görülecek. Kotayı kaldırmak arzın önündeki engeli kaldırır; fiyatı bağlayan şey ise tavan. Tarife yayımlandığında Paraná'daki bir seferin kılavuzluk gideri, kuyruğun uzunluğundan bağımsız olarak karşılaştırılabilir hâle gelir. O rakam açıklanana kadar elde yalnızca bir bekleyen gemi sayısı var ve o sayı bir düzenlemenin değil bir iş bırakmanın ölçüsü."}]}], "sources": [{"key": "argentina-pilots", "kind": "news", "name": "MercoPress", "url": "https://en.mercopress.com/2026/08/04/around-140-vessels-stranded-at-argentine-ports-after-government-deregulation-decree", "title": {"tr": "Kılavuzluk kararnamesinin ardından Arjantin limanlarında yaklaşık 140 gemi bekliyor", "en": "Around 140 vessels are stranded at Argentine ports after the pilotage decree"}, "publishedDate": "2026-08-04"}], "title": {"en": "Pilots stopped work on the Paraná once the state set the maximum fee", "tr": "Paraná'da azami ücreti devlet belirleyince kılavuz kaptanlar işi bıraktı"}, "writer": "geo-04", "date": "2026-08-05"}, {"excerpt": {"en": "The United States cancelled the visa of Brazil's ambassador in Washington, Maria Luiza Ribeiro Viotti. The stated reason is Brasília's withholding of agrément from Trump's nominee. Brazil says the nomination was announced without consulting it and that it will examine the nominee's background; the delay is the one instrument it holds.", "tr": "ABD, Brezilya'nın Washington Büyükelçisi Maria Luiza Ribeiro Viotti'nin vizesini iptal etti. Gerekçe, Brasília'nın Trump'ın büyükelçi adayına agreman vermemesi. Brezilya adaylığın kendisine danışılmadan açıklandığını ve adayın geçmişini inceleyeceğini söylüyor; elindeki tek araç bu gecikme."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "The one approval Brazil holds", "tr": "Brezilya'nın elindeki tek onay"}, "ps": [{"en": "The Trump administration cancelled the visa of Ambassador Maria Luiza Ribeiro Viotti. A State Department official who was not named said that cancelling the visa of a senior diplomat is not the same as removing that person from the country. The step followed Brasília's withholding of agrément from Danny Perez, Trump's nominee as ambassador to Brazil. Perez is a Florida state representative and a Republican ally of Secretary of State Marco Rubio; his nomination was announced in June.", "refs": ["brazil-visa"], "tr": "Trump yönetimi Büyükelçi Maria Luiza Ribeiro Viotti'nin vizesini iptal etti. Adının açıklanmasını istemeyen bir Dışişleri Bakanlığı yetkilisi, kıdemli bir diplomatın vizesinin iptal edilmesinin o kişiyi ülkeden çıkarmakla aynı şey olmadığını belirtti. Adım, Brasília'nın Trump'ın Brezilya büyükelçiliğine aday gösterdiği Danny Perez'e agreman vermemesinin ardından geldi. Perez, Florida eyalet meclisi üyesi ve Dışişleri Bakanı Marco Rubio'nun Cumhuriyetçi müttefiki; adaylığı haziranda açıklandı."}, {"en": "The smallest instrument a receiving state holds is agrément, the consent a receiving state gives to a nominated ambassador, and it is also one of the few that cannot be taken away from it. Sources close to the Brazilian government said Trump's public announcement of the nomination without consulting Brasília broke protocol, and that Brazil would examine Perez's background before granting formal agrément. The choice was to grant agrément quickly or to use the delay. Brazil used the delay.", "refs": ["brazil-visa"], "tr": "Kabul eden devletin elindeki en küçük araç agremandır, yani bir büyükelçi adayına verilen kabul yazısı; aynı zamanda o devletten alınamayacak birkaç araçtan biridir. Brezilya hükümetine yakın kaynaklar, Trump'ın adaylığı Brasília'ya danışmadan kamuoyuna duyurmasının teamüle aykırı olduğunu, Brezilya'nın resmî agreman vermeden önce Perez'in geçmişini inceleyeceğini söyledi. Seçenek, agremanı hızla vermek ya da gecikmeyi kullanmaktı. Brezilya gecikmeyi kullandı."}]}, {"h": {"en": "Where the cost sits", "tr": "Bedelin durduğu yer"}, "ps": [{"en": "The cost is not hypothetical. A month earlier Brazil denied visas to US State Department officials from the Democracy, Human Rights and Labor Bureau. In July Washington announced 25 percent tariffs on Brazilian imports, citing unfair trade practices; earlier tariffs had been lifted. Reciprocity runs in both directions here, but the two directions do not carry equal weight: a visa revocation touches one person, a tariff touches an entire export line.", "refs": ["brazil-visa"], "tr": "Bedel varsayımsal değil. Bir ay önce Brezilya, ABD Dışişleri Bakanlığı'nın Demokrasi, İnsan Hakları ve Çalışma Bürosu'ndan gelen yetkililere vize vermemişti. Temmuzda Washington, haksız ticaret uygulamaları gerekçesiyle Brezilya'dan yapılan ithalata yüzde 25 gümrük vergisi ilan etti; daha önce konulan vergiler kaldırılmıştı. Karşılıklılık burada iki yöne de işliyor, ancak iki yönün ağırlığı eşit değil: bir vize iptali bir kişiyi etkiler, bir vergi bütün bir ihracat kalemini."}, {"en": "The timing looks toward the October election. President Lula is standing for a fourth term against right-wing Senator Flavio Bolsonaro. A dispute with Washington that drags on gives an incumbent a counterpart to campaign against, and gives the opposition a cost it can attribute to him. The competing explanation is that this is ordinary consular reciprocity, the kind that follows a withheld approval whatever the calendar says. What will separate the two is whether the nomination is settled before the vote or after it.", "refs": ["brazil-visa"], "tr": "Zamanlama ekimdeki seçime bakıyor. Devlet Başkanı Lula dördüncü dönem için aday, karşısında sağcı senatör Flavio Bolsonaro var. Washington'la uzayan bir anlaşmazlık, görevdeki adaya karşısına alacağı bir muhatap verir; muhalefete de seçmene gösterebileceği bir gider kalemi. Bunun karşısındaki açıklama şu: söz konusu olan, onay bekletildiğinde takvimden bağımsız olarak gelecek sıradan bir konsolosluk karşılığıdır. İkisini ayıracak şey, adaylığın seçimden önce mi sonra mı sonuçlandırılacağıdır."}]}, {"h": {"en": "The next observable step", "tr": "Sıradaki gözlemlenebilir adım"}, "ps": [{"en": "What to watch is whether Brasília grants agrément before the October vote. Granting it after the visa cancellation would show that the delay had a price. Withholding it will leave both capitals without an ambassador in post through the election and will pass the next turn in the exchange to Washington. In either case the instrument Brazil is using stays the same: a consent whose granting is its own to decide.", "refs": ["brazil-visa"], "tr": "Gözlemlenecek şey, Brasília'nın ekimdeki oylamadan önce agremanı verip vermediği. Vize iptalinden sonra agremanı vermek, gecikmenin bir fiyatı olduğunu göstermek anlamına gelir. Vermemek ise iki başkenti seçim boyunca göreve başlamış bir büyükelçi olmadan bırakacak ve bir sonraki karşılık sırasını Washington'a geçirecek. Her iki durumda da Brezilya'nın kullandığı araç aynı kalıyor: verilmesi kendi takdirinde olan bir yazı."}]}], "sources": [{"key": "brazil-visa", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/us-revokes-visa-of-brazilian-ambassador-amid-deepening-diplomatic-spat", "title": {"tr": "ABD, Brezilya'nın Washington büyükelçisinin vizesini iptal etti", "en": "US revokes the visa of Brazil's ambassador in Washington"}, "publishedDate": "2026-08-04"}], "title": {"en": "Brasília held the agrément back, Washington cancelled the visa", "tr": "Brasília agremanı bekletti, Washington vizeyi iptal etti"}, "writer": "geo-05", "date": "2026-08-05"}, {"excerpt": {"en": "An excavation that began at Zubin Potok on 28 July reached three separate locations within a week, and three people were detained. The missing-persons file left by the 1998-99 war is advancing at the pace of an investigation opened by court order rather than that of information exchange between two states.", "tr": "Zubin Potok'ta 28 Temmuz'da başlayan kazı bir hafta içinde üç ayrı noktaya ulaştı ve üç kişi tutuklandı. 1998-99 savaşından kalan kayıp dosyası, iki devlet arasındaki bilgi alışverişinin değil, mahkeme kararıyla açılan bir soruşturmanın hızıyla ilerliyor."}, "radarPublishedAt": "2026-08-05T01:30:38+00:00", "sections": [{"h": {"en": "Three locations in one week", "tr": "Bir haftada üç nokta"}, "ps": [{"en": "The Kosovo Special Prosecution said on Tuesday that investigations into the remains of missing persons from the 1998-99 war are also under way at a third location in the Serb-majority north of the country, and that three people have been detained on suspicion of war crimes against the civilian population. Excavation at the village of Kalluder e Vogel/Mala Kaludra had begun on 28 July after the prosecution sought a court order. On 2 August a second burial site was identified at the village of Jabuke in the same municipality; the Commission on Missing Persons said the terrain had concentrated work there, and that the remains of four individuals had been exhumed and sent to the Institute of Forensic Medicine.", "refs": ["kosovo-graves"], "tr": "Kosova Özel Savcılığı salı günü, 1998-99 savaşından kalan kayıp kişilere ilişkin soruşturmaların ülkenin Sırp çoğunluklu kuzeyinde üçüncü bir noktada da yürütüldüğünü ve sivil halka karşı savaş suçu şüphesiyle üç kişinin tutuklandığını bildirdi. Kalluder e Vogel/Mala Kaludra köyündeki kazı, savcılığın mahkeme kararı talep etmesinin ardından 28 Temmuz'da başlamıştı. 2 Ağustos'ta aynı belediyedeki Jabuke köyünde ikinci bir gömü alanı belirlendi; Kayıp Kişiler Komisyonu arazi koşulları nedeniyle çalışmanın burada yoğunlaştığını ve dört kişinin kalıntılarının çıkarılıp Adli Tıp Enstitüsü'ne gönderildiğini açıkladı."}, {"en": "The Pristina Basic Court on Monday ordered one month's pre-trial detention for a suspect identified only as J.R., a Serbian citizen arrested on 2 August, on the ground that he could flee or influence witnesses or evidence. Two others, M.J. and M.B., detained on 28 July when the excavation began, remain in custody. Acting Prime Minister Albin Kurti said on 29 July that the remains might belong to a group of Albanian civilians, among them doctors, professors and lawyers, who disappeared on 19 April 1999, while adding that this could not be confirmed. That caveat matters: no identification has yet been made.", "refs": ["kosovo-graves"], "tr": "Priştine Temel Mahkemesi pazartesi günü, 2 Ağustos'ta yakalanan ve yalnızca J.R. olarak tanımlanan Sırbistan vatandaşı şüpheli için bir ay tutukluluk kararı verdi; gerekçe kaçma ile tanıklara veya delillere etki etme riskiydi. Kazının başladığı 28 Temmuz'da yakalanan M.J. ve M.B. de tutuklu. Vekâleten Başbakan Albin Kurti 29 Temmuz'da kalıntıların, 19 Nisan 1999'da kaybolan ve aralarında doktor, profesör ve avukatların bulunduğu Arnavut sivillerden oluşan gruba ait olabileceğini söyledi, ancak bunun doğrulanamadığını ekledi. Bu ihtiyat kaydı önemli: kimlik tespiti henüz yapılmadı."}]}, {"h": {"en": "Why the file's clock runs on excavation", "tr": "Dosyanın saati neden kazıya bağlı"}, "ps": [{"en": "A report published on 29 July by Kosovo's Institute of Crimes Committed During the War puts the number still missing from the 1998-99 war at 1,578. There is a reason that figure moves slowly: determining what happened to a person first requires finding a burial site, and finding a burial site requires either the administrative documents held by the other state or a witness willing to speak. Acting Interior Minister Xhelal Svecla accused Serbia of refusing to provide information about the disappeared and of imprisoning its own citizens who help investigations.", "refs": ["kosovo-graves"], "tr": "Kosova'nın Savaş Sırasında İşlenen Suçlar Enstitüsü'nün 29 Temmuz'da yayımladığı rapora göre 1998-99 savaşından geriye 1.578 kişi kayıp. Bu sayının yavaş hareket etmesinin bir nedeni var: bir kişinin akıbetinin belirlenmesi önce bir gömü alanının bulunmasını gerektirir, gömü alanının bulunması ise ya karşı devletin elindeki idari belgeleri ya da konuşmaya razı bir tanığı. Vekâleten İçişleri Bakanı Xhelal Svecla, Sırbistan'ı kayıp kişiler hakkında bilgi vermemekle ve soruşturmaya yardım eden kendi vatandaşlarını hapsetmekle suçladı."}, {"en": "So the answer to \"why now\" sits in procedure. A domestic criminal investigation running on a court order, arrests and a detention ruling produced in one week the access that information exchange between two states had not produced in thirty years. The opposite reading is available: a witness or a document that surfaced for its own reasons may have set the timing, with the criminal investigation as the consequence rather than the cause. The prosecution's statement that it has evidence one suspect was mobilised and served actively in the former Yugoslav Army during the war leaves room for that second reading too.", "refs": ["kosovo-graves"], "tr": "Yani \"neden şimdi\" sorusunun cevabı usulde duruyor. Mahkeme kararı, tutuklamalar ve bir tutukluluk kararıyla yürüyen yerel bir ceza soruşturması, iki devlet arasındaki bilgi alışverişinin otuz yılda sağlayamadığı erişimi bir haftada sağladı. Karşı okuma da mümkün: kendi nedenleriyle ortaya çıkan bir tanık veya bir belge zamanlamayı belirlemiş, ceza soruşturması ise bunun nedeni değil sonucu olmuş olabilir. Savcılığın şüphelilerden birinin savaş sırasında eski Yugoslav ordusunda seferber edilip fiilen görev yaptığına dair delil bulunduğunu bildirmesi, ikinci okumaya da yer bırakıyor."}]}, {"h": {"en": "What separates this round is in the paperwork", "tr": "Bu turu ayıran şey evrakta"}, "ps": [{"en": "What separates this round shows in the paperwork more than in the ground. When a file is worked as identification, it ends with a name returned to a family; when it is worked as a criminal investigation, it ends with a defendant, a bench and a hearing calendar. At Zubin Potok both are now present: remains sent to the Institute of Forensic Medicine and a one-month detention order. The difference carries no verdict about which side is right; what it carries is that the file is now attached to an institution with a calendar of its own. When identification yields nothing, a family is left waiting. When a criminal file yields nothing, a ruling is left, and a ruling gets written down.", "refs": ["kosovo-graves"], "tr": "Bu turu ayıran şey topraktan çok evrakta görünüyor. Bir dosya kimlik tespiti olarak yürütüldüğünde sonu bir aileye teslim edilen bir isimdir; ceza soruşturması olarak yürütüldüğünde sonu bir sanık, bir mahkeme heyeti ve bir duruşma takvimidir. Zubin Potok'ta şimdi ikisi birden var: Adli Tıp Enstitüsü'ne gönderilmiş kalıntılar ve bir aylık tutukluluk kararı. Buradaki fark hangi tarafın haklı olduğuna dair bir hüküm taşımıyor; taşıdığı şey, dosyanın artık kendi takvimi olan bir kuruma bağlanmış olması. Kimlik tespiti bir sonuç vermediğinde geriye bekleyen bir aile kalır. Bir ceza dosyası sonuç vermediğinde geriye bir karar kalır ve karar yazılır."}]}], "sources": [{"key": "kosovo-graves", "kind": "news", "name": "Balkan Insight", "url": "https://balkaninsight.com/2026/08/04/kosovo-detains-third-suspect-as-mass-grave-probe-expands-in-north/bi/", "title": {"tr": "Kosova'da toplu mezar soruşturması üçüncü noktaya genişledi, üçüncü şüpheli tutuklandı", "en": "Kosovo's mass grave investigation widens to a third site and a third suspect is detained"}, "publishedDate": "2026-08-04"}], "title": {"en": "Why three grave sites now?", "tr": "Neden şimdi üç mezar birden?"}, "writer": "geo-06", "date": "2026-08-05"}, {"excerpt": {"en": "The 113 million shekels approved for the West Bank sites sit in a single year's spending line; what makes the decision durable is the 142 million shekels of commitment authorisation granted to the Settlements Ministry.", "tr": "Batı Şeria'daki alanlar için onaylanan 113 milyon şekel tek yıllık bir harcama kalemi olarak duruyor; kararı süreklileştiren unsur, Yerleşimler Bakanlığı'na tanınan 142 milyon şekellik taahhüt yetkisi."}, "sections": [{"h": {"en": "Which body approved it, and what it approved", "tr": "Onayı veren makam ve onayladığı şey"}, "ps": [{"en": "A government steering committee approved 113 million shekels, about 37 million dollars, on Tuesday for more than 70 historical sites in the occupied West Bank. Over the same period the Knesset's Finance Committee passed close to 300 million shekels, of which 157 million shekels go directly to the Settlements Ministry and 142 million shekels take the form of commitment authorisations. The allocation sits on top of a 250 million shekel plan, about 83 million dollars, adopted in May.", "refs": ["miras"], "tr": "Bir hükümet yönlendirme komitesi salı günü işgal altındaki Batı Şeria'da 70'ten fazla tarihi alan için 113 milyon şekel (37 milyon dolar) onayladı. Knesset Maliye Komisyonu aynı dönemde 300 milyon şekele yakın bir tutarı geçirdi; bunun 157 milyon şekeli Yerleşimler Bakanlığı'na doğrudan aktarılıyor, 142 milyon şekeli taahhüt yetkisi biçiminde veriliyor. Tahsisat, mayısta kabul edilen 250 milyon şekellik (83 milyon dolar) planın üzerine biniyor."}, {"en": "The instrument determines the money and the ministry that will spend it. The legal standing of the sites lies outside that line: Israeli settlements are considered illegal under international law, and a budget approval does not alter that assessment. Finance Minister Bezalel Smotrich presented the decision as a Zionist act; the description states a political position and leaves the reach of administrative authority undefined.", "refs": ["miras"], "tr": "Bu araç, parayı ve onu harcayacak bakanlığı belirler. Alanların hukuki durumu bu kalemin dışında kalıyor: İsrail yerleşimleri uluslararası hukuka göre yasa dışı sayılıyor ve bir bütçe onayı bu değerlendirmeyi değiştirmiyor. Maliye Bakanı Bezalel Smotriç kararı Siyonist bir eylem diye sundu; bu niteleme siyasi bir konum bildirir, idari yetkinin kapsamını belirlemez."}]}, {"h": {"en": "Commitment authority carries into the next budget", "tr": "Taahhüt yetkisi bir sonraki bütçeye geçiyor"}, "ps": [{"en": "The 157 million shekels transferred directly are this year's business. The 142 million shekels of commitment authorisation are used to create obligations that later budgets must carry, which lets the ministry enter multi-year contracts now. That is the line which supplies permanence. The counter-case remains open: if a later finance committee declines to fund the matching appropriation, the authority goes unused and the list of sites stays at the level of a declaration of intent.", "refs": ["miras"], "tr": "Doğrudan aktarılan 157 milyon şekel cari yılın işidir. Taahhüt yetkisi olarak verilen 142 milyon şekel ise gelecek yılların bütçelerine yazılacak yükümlülükler doğurmak için kullanılır; bakanlık çok yıllı sözleşmeye bugünden girebilir. Kalıcılığı sağlayan kalem budur. Karşı ihtimal açık duruyor: sonraki bir maliye komisyonu karşılığı ödenek açmazsa yetki kullanılmadan kalır ve alan listesi niyet beyanı düzeyinde kalır."}, {"en": "The distinction is observable. If tender and contract notices are published before the end of 2026 for sites brought into the programme, such as Solomon's Pools near Bethlehem, the allocation turns from an announcement into an administrative programme under way. If no notice appears, what remains is two budget approvals.", "refs": ["miras"], "tr": "Ayrım gözlenebilir. Beytüllahim yakınlarındaki Süleyman Havuzları gibi programa alınan alanlar için ihale ve sözleşme duyuruları 2026 sonuna kadar yayımlanırsa, tahsisat bir açıklamadan çıkıp yürütülen bir idari programa dönüşür. Duyuru çıkmazsa, elde yalnızca iki bütçe onayı kalır."}]}], "sources": [{"key": "miras", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/5/israel-approves-37m-to-seize-more-than-70-occupied-west-bank-sites", "title": {"tr": "İsrail, işgal altındaki Batı Şeria'da 70'ten fazla alan için 113 milyon şekel ayırdı", "en": "Israel allocates 113 million shekels for more than 70 sites in the occupied West Bank"}, "publishedDate": "2026-08-05"}], "title": {"en": "A steering committee spread 113 million shekels across 70 sites", "tr": "Bir yönlendirme komitesi 113 milyon şekeli 70 alana dağıttı"}, "writer": "geo-01", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "Which vessel performs the rescue and where responsibility lands are settled separately: British ships took 63 people aboard, and everyone rescued came ashore at Boulogne-sur-Mer.", "tr": "Kurtarmayı hangi geminin yaptığı ile sorumluluğun nereye düştüğü ayrı ayrı belirleniyor: İngiliz gemileri 63 kişiyi aldı, kurtarılanların tamamı Boulogne-sur-Mer'e çıkarıldı."}, "sections": [{"h": {"en": "Two separate decisions in one night", "tr": "Bir gecede iki ayrı karar"}, "ps": [{"en": "According to the French maritime prefecture the boat left France on Monday night. Five people on board were rescued overnight, and the rest turned down the assistance offered by French patrol boats. The prefecture said it did not go further at that stage because of the structural fragility of such boats. Consent sets the limit here: faced with a group that refuses help, observation is the option a patrol boat has left.", "refs": ["mans"], "tr": "Fransız deniz valiliğine göre bot pazartesi gecesi Fransa'dan ayrıldı. Gece boyunca bottaki beş kişi kurtarıldı; geri kalanlar Fransız devriye botlarının yardım teklifini geri çevirdi. Valilik, bu tip botların yapısal kırılganlığı nedeniyle o aşamada daha ileri bir müdahaleye gitmediğini bildirdi. Buradaki sınırı belirleyen unsur rıza: yardımı reddeden bir grubun karşısında devriye botunun elinde kalan seçenek gözlem oluyor."}, {"en": "The picture changed when the engine caught fire in the morning. In addition to the first five, two French ships rescued 105 people and British vessels 63; 40 firefighters, 13 police officers, seven interpreters and medical teams took part. Everyone rescued came ashore at Boulogne-sur-Mer and 11 suffered minor injuries. The prefecture raised its initial figure from 157 to 173; this column wrote yesterday evening on the basis of the 157 people brought ashore at Boulogne. The total on board passed the previous high of 165 people reached last month.", "refs": ["mans", "gecmis-mans"], "tr": "Sabah motor tutuşunca durum değişti. İlk beş kişiye ek olarak iki Fransız gemisi 105, İngiliz gemileri 63 kişiyi kurtardı; 40 itfaiyeci, 13 polis, yedi tercüman ve sağlık ekipleri görev aldı. Kurtarılanların tamamı Boulogne-sur-Mer'e çıkarıldı ve 11 kişi hafif yaralandı. Valilik ilk açıkladığı sayıyı 157'den 173'e yükseltti; bu köşede dün akşam Boulogne'a çıkarılan 157 kişi üzerinden yazılmıştı. Bottaki toplam, geçen ay 165 kişiyle ulaşılan önceki en yüksek sayının üzerine çıktı."}]}, {"h": {"en": "Whom the return pledge binds", "tr": "İade taahhüdü kimi bağlıyor"}, "ps": [{"en": "The UK government said all those rescued would be returned to France, and Border Security Minister Anna Turley pointed to the dangers of the crossings and the gangs behind them. In the same incident French prosecutors opened the criminal investigation and an Egyptian national was taken into custody. The political pledge is therefore announced in London while the case proceeds in France.", "refs": ["mans"], "tr": "Birleşik Krallık hükümeti kurtarılanların tamamının Fransa'ya iade edileceğini açıkladı; Sınır Güvenliği Bakanı Anna Turley geçişlerin tehlikesine ve arkalarındaki çetelere dikkat çekti. Aynı olayda ceza soruşturmasını Fransız savcılığı açtı ve olayla bağlantılı olarak bir Mısır vatandaşı gözaltına alındı. Böylece siyasi taahhüt Londra'da açıklanırken, dosya Fransa'da yürüyor."}, {"en": "This is where the flag on the rescue and the jurisdiction come apart: British vessels took 63 people out of the water, yet all of them were landed at a French port and the investigation was opened by French prosecutors. Proximity and the need for medical transfer may have produced the same result; the observation that would separate the two explanations is which port receives people rescued by British vessels in a comparable incident. The second measure that tests the arrangement is the publication of the number of people actually returned.", "refs": ["mans"], "tr": "Kurtarma bayrağı ile yargı yetkisinin ayrıştığı nokta burada görünüyor: İngiliz gemileri 63 kişiyi denizden aldı, buna karşın hepsi Fransız limanına çıkarıldı ve soruşturma Fransız savcılığında açıldı. Yakınlık ve tıbbi sevk zorunluluğu da aynı sonucu doğurmuş olabilir; iki açıklamayı ayırt edecek gözlem, benzer bir olayda İngiliz gemilerinin kurtardığı kişilerin hangi limana çıkarıldığıdır. Düzenlemenin sınandığı ikinci ölçü, iade edilen kişi sayısının açıklanmasıdır."}]}], "sources": [{"key": "mans", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c4gkpeppjyqo", "title": {"tr": "Manş'ta kurtarılan kişi sayısı 173'e yükseltildi, Londra hepsinin iade edileceğini bildirdi", "en": "The Channel rescue count is revised up to 173, and London says all will be returned"}, "publishedDate": "2026-08-04"}, {"key": "gecmis-mans", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-08-04/2/", "title": {"tr": "Kurtarılan 157 kişinin tamamı Boulogne'a çıkarıldı", "en": "All 157 of the rescued came ashore at Boulogne"}, "publishedDate": "2026-08-04"}], "title": {"en": "The count rose from 157 to 173, and the return pledge stayed the same", "tr": "Sayı 157'den 173'e çıktı, iade taahhüdü aynı kaldı"}, "writer": "geo-02", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "Ukraine's air force reported shooting down 98 of 115 drones. For the 24 ballistic missiles launched the same night, no corresponding figure was given.", "tr": "Ukrayna hava kuvvetleri 115 insansız hava aracından 98'ini düşürdüğünü bildirdi. Aynı gece fırlatılan 24 balistik füze için karşılık gelen bir sayı verilmedi."}, "sections": [{"h": {"en": "Two layers, two different outcomes", "tr": "İki katman, iki ayrı sonuç"}, "ps": [{"en": "Ukraine's air force reported that 24 ballistic and 4 anti-ship missiles and 115 drones were directed at the capital, and that air defences shot down 98 of the drones. No report was issued of any of the ballistic missiles being intercepted. The same inventory holds two layers, and the night's outcomes diverge between them.", "refs": ["kiev"], "tr": "Ukrayna hava kuvvetlerinin bildirimine göre saldırıda başkente 24 balistik ve 4 gemisavar füzesi ile 115 insansız hava aracı yöneltildi; hava savunması insansız hava araçlarının 98'ini düşürdü. Balistik füzelerin herhangi birinin önlendiğine ilişkin bir bildirim yapılmadı. Aynı envanterde iki katman var ve gecenin sonuçları bu iki katmanda birbirinden ayrışıyor."}, {"en": "The result on the ground is this: Zelensky said at least 17 people were killed and 44 injured, with homes, a railway station and warehouses hit. Kyiv Mayor Vitali Klitschko said people might be under the rubble. Russia's defence ministry said it had struck logistics hubs for weapons and military supplies. Both sides deny deliberately targeting civilians, and that disagreement over what was targeted has not been settled independently.", "refs": ["kiev"], "tr": "Yer tarafındaki sonuç şu: Zelenski'ye göre en az 17 kişi öldü, 44 kişi yaralandı; konutlar, bir tren istasyonu ve depolar vuruldu. Kiev Belediye Başkanı Vitali Kliçko enkaz altında insanların bulunabileceğini söyledi. Rusya Savunma Bakanlığı silah ve askeri malzeme lojistik merkezlerini vurduğunu açıkladı. İki taraf da sivilleri kasten hedef aldığını reddediyor; hedef tanımı üzerindeki bu ayrışma bağımsız bir doğrulamaya kavuşmadı."}]}, {"h": {"en": "Whether the gap is in detection or in stock", "tr": "Eksik olan algılama mı, stok mu"}, "ps": [{"en": "Since most of the drones over the same airspace on the same night were brought down, the detection and tracking chain worked. The absence of a corresponding interception report in the ballistic layer points away from sensing as the bottleneck, and Zelensky attributes the shortfall to delays in anti-ballistic systems from partners. The competing explanation also holds: a salvo of 24 ballistic missiles in a short window can exceed the firing rate and ready rounds of a well-supplied battery too. One night's data does not separate stock from salvo size.", "refs": ["kiev"], "tr": "Aynı gece aynı hava sahasında insansız hava araçlarının büyük bölümü düşürüldüğüne göre tespit ve takip zinciri çalıştı. Balistik katmanda karşılık gelen bir düşürme bildirimi çıkmaması, darboğazın algılama tarafında olmadığına işaret ediyor; Zelenski de eksikliği ortaklardan gelen balistik savunma sistemlerinin gecikmesine bağlıyor. Karşı açıklama da mümkün: kısa bir pencerede 24 balistik füzelik bir salvo, iyi ikmal edilmiş bir bataryanın atış hızını ve hazır mermi sayısını da aşabilir. Tek gecelik veri stok ile salvo büyüklüğünü birbirinden ayırmaya yetmiyor."}, {"en": "The observation that would test the distinction is specific. If the air force publishes a ballistic interception count for a salvo of comparable size after a new delivery of anti-ballistic systems from partners is announced, the constraint lies with supply. If the interception count remains empty even though a delivery was announced, the explanation has to be sought in the battery's firing rate and positioning. That distinction can be followed in salvos reported up to 31 October 2026.", "refs": ["kiev"], "tr": "Ayrımı sınayacak gözlem belirli. Ortaklardan yeni bir balistik savunma teslimatı duyurulduktan sonra benzer büyüklükte bir salvoda hava kuvvetleri balistik önleme sayısı açıklarsa, kısıt ikmal tarafındadır. Teslimat duyurulmasına karşın önleme sayısı yine boş kalırsa, açıklamayı bataryanın atış hızında ve konuşlanmasında aramak gerekir. Bu ayrım 31 Ekim 2026'ya kadar bildirilen salvolarda izlenebilir."}]}], "sources": [{"key": "kiev", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c330pxyvzzyo", "title": {"tr": "Kiev'e yapılan saldırıda en az 17 kişi öldü, Zelenski önleyici füze eksikliğine işaret etti", "en": "At least 17 die in the strike on Kyiv, and Zelensky points to the shortage of interceptors"}, "publishedDate": "2026-08-05"}], "title": {"en": "How many of the twenty-four ballistic missiles were stopped?", "tr": "Yirmi dört balistik füzenin kaçı önlendi?"}, "writer": "geo-03", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "Hormuz has been closed since late February and part of Saudi oil moved to the Red Sea. The Houthis declared a blockade of those ports on 20 July, and an Indian-flagged vessel sank off Yemen.", "tr": "Şubat sonundan bu yana Hürmüz kapalı ve Suudi petrolünün bir bölümü Kızıldeniz'e kaydı. Husiler 20 Temmuz'da bu limanlara abluka ilan etti; Yemen açıklarında Hindistan bayraklı bir tekne battı."}, "sections": [{"h": {"en": "The substitute route's own ceiling", "tr": "İkame güzergâhın kendi tavanı"}, "ps": [{"en": "The Indian-flagged MSV Faize Noore Oliya capsized and sank after being hit by a projectile off Yemen; all 14 people on board were rescued and 13 of them were Indian nationals. Who struck the ship could not be established. The transport ministry of Yemen's internationally recognised government held the Houthis responsible, saying they used a boat laden with explosives, according to Reuters; the Houthis made no comment. That is one party's claim and it carries no independent verification.", "refs": ["gemi"], "tr": "MSV Faize Noore Oliya adlı Hindistan bayraklı tekne, Yemen açıklarında bir mermiyle vurulduktan sonra alabora olup battı; gemideki 14 kişinin tamamı kurtarıldı ve bunların 13'ü Hindistan vatandaşıydı. Saldırıyı kimin düzenlediği belirlenemedi. Yemen'in uluslararası tanınan hükümetine bağlı ulaştırma bakanlığı, Reuters'a göre patlayıcı yüklü bir tekne kullanan Husileri sorumlu tuttu; Husiler açıklama yapmadı. Bu bir taraf iddiasıdır ve bağımsız doğrulaması yoktur."}, {"en": "The route's story is short. After the strikes of late February Iran closed the Strait of Hormuz and some ships carrying Saudi oil moved onto the Red Sea lane. On 20 July the Houthis declared a blockade of Saudi Arabia's Red Sea ports. The UK Maritime Trade Operations agency has reported several attacks on ships in the region over the past week. The substitute lane absorbed the cargo and left the risk behind.", "refs": ["gemi"], "tr": "Güzergâhın hikâyesi kısa. Şubat sonundaki saldırıların ardından İran Hürmüz Boğazı'nı kapattı ve Suudi petrolü taşıyan bazı gemiler Kızıldeniz hattına kaydı. Husiler 20 Temmuz'da Suudi Arabistan'ın Kızıldeniz limanlarına abluka ilan etti. Birleşik Krallık Deniz Ticareti Operasyonları kurumu son bir hafta içinde bölgedeki gemilere yönelik birkaç saldırı bildirdi. İkame hat yükü aldı, riski almadı."}]}, {"h": {"en": "The fee and the mechanism sit on the same table", "tr": "Ücret ve mekanizma aynı masada"}, "ps": [{"en": "The items awaiting resolution in the Hormuz talks are, according to Al Jazeera, the mechanism for reopening the strait, maritime service fees and security arrangements. Secretary of State Marco Rubio said progress had been made but no final outcome reached; Treasury Secretary Scott Bessent said a deal could come today or tomorrow. Tehran says it is talking only to Oman. One of the items on the table is therefore the price of the right of transit.", "refs": ["hurmuz"], "tr": "Hürmüz görüşmelerinde çözülmeyi bekleyen başlıklar Al Jazeera'ya göre boğazın yeniden açılma mekanizması, denizcilik hizmet ücretleri ve güvenlik düzenlemeleri. Dışişleri Bakanı Marco Rubio ilerleme kaydedildiğini ancak nihai bir sonuca varılmadığını söyledi; Hazine Bakanı Scott Bessent anlaşmanın bugün ya da yarın gelebileceğini belirtti. Tahran ise yalnızca Umman'la görüştüğünü bildiriyor. Yani masadaki kalemlerden biri, geçiş hakkının fiyatıdır."}, {"en": "Because the two routes share the same cargo, a comparison becomes possible. What is being negotiated for Hormuz is an explicit fee, while what the Red Sea carries is an unpriced risk, and that risk sank a vessel. A signed Hormuz mechanism could pull the cargo back, on condition that the service fee stays below the insurance and delay cost of the Red Sea. The counter-case also holds: because charter contracts and policies are tied for a period, ships may stay on the Red Sea for a while even if the fee is low. The observation that would show the difference is the number of transits reported through Hormuz after a mechanism is signed.", "refs": ["gemi", "hurmuz"], "tr": "İki güzergâh aynı yükü paylaştığı için karşılaştırma yapılabilir hale geliyor. Hürmüz için müzakere edilen şey açık bir ücret; Kızıldeniz'de taşınan şey ise fiyatlanmamış bir risk ve o risk bir tekneyi batırdı. İmzalanacak bir Hürmüz mekanizması yükü geri çekebilir, bunun koşulu hizmet ücretinin Kızıldeniz'in sigorta ve gecikme maliyetinin altında kalmasıdır. Karşı ihtimal de var: navlun sözleşmeleri ve poliçeler dönem boyunca bağlı olduğu için, ücret düşük kalsa bile gemiler bir süre Kızıldeniz'de kalabilir. Ayrımı gösterecek gözlem, mekanizma imzalandıktan sonra Hürmüz'den bildirilen geçiş sayısıdır."}]}], "sources": [{"key": "gemi", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cly84we1y37o", "title": {"tr": "Yemen açıklarında bir mermiyle vurulan Hindistan bayraklı gemi battı", "en": "Indian-flagged ship sinks after being hit by a projectile off Yemen"}, "publishedDate": "2026-08-04"}, {"key": "hurmuz", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/us-says-deal-on-reopening-hormuz-close-as-iran-oman-hold-positive-talks", "title": {"tr": "ABD Hürmüz anlaşmasının yakın olduğunu söylüyor, Tahran yalnızca Umman'la görüştüğünü bildiriyor", "en": "US says a Hormuz deal is close, while Tehran says it is talking only to Oman"}, "publishedDate": "2026-08-04"}], "title": {"en": "Once Hormuz closed, the chosen alternative started taking hits", "tr": "Hürmüz kapanınca seçilen yol da vurulmaya başladı"}, "writer": "geo-04", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "AfriForum's counsel narrowed the case to method by accepting that land reform is a constitutional imperative. The Democratic Alliance took a separate route and targeted the way the Act was passed.", "tr": "AfriForum adına konuşan avukat toprak reformunun anayasal bir zorunluluk olduğunu kabul ederek davayı yönteme daralttı. Demokratik İttifak ayrı bir yoldan yasanın yapılış sürecini hedef aldı."}, "sections": [{"h": {"en": "The sections before the court", "tr": "Mahkemenin önündeki maddeler"}, "ps": [{"en": "A consolidated case is before the Western Cape High Court. The applicants include AfriForum, the Vaderland Stigting and the Democratic Alliance, while the president, Cyril Ramaphosa, parliament, the Minister of Public Works and Infrastructure and the Economic Freedom Fighters are among the respondents. AfriForum concentrated its challenge on sections 12(3) and 12(4), which set out when it may be just and equitable for no compensation to be paid for an expropriation in the public interest.", "refs": ["dava"], "tr": "Batı Cape Yüksek Mahkemesi'nde birleştirilmiş bir dava görülüyor. Başvurucular arasında AfriForum, Vaderland Stigting ve Demokratik İttifak var; karşı tarafta Devlet Başkanı Cyril Ramaphosa, parlamento, Bayındırlık ve Altyapı Bakanı ile Ekonomik Özgürlük Savaşçıları yer alıyor. AfriForum itirazını, kamu yararına yapılan kamulaştırmada bedel ödenmemesinin hangi koşullarda adil ve hakkaniyetli sayılacağını düzenleyen 12(3) ve 12(4). maddelerde yoğunlaştırdı."}, {"en": "Advocate Hank Havengaar, appearing for AfriForum, argued that section 25 of the constitution already strikes the balance between property rights and land reform through the requirement of just and equitable compensation. On his account parliament went beyond what the constitution permits by creating categories of uncompensated expropriation. In the same hearing Havengaar said the organisation was not contesting land reform and described it as a constitutional imperative.", "refs": ["dava"], "tr": "Avukat Hank Havengaar, AfriForum adına, anayasanın 25. maddesinin mülkiyet hakları ile toprak reformu arasındaki dengeyi adil ve hakkaniyetli bedel koşuluyla zaten kurduğunu savundu. Ona göre parlamento, bedelsiz kamulaştırma kategorileri yaratarak anayasanın izin verdiği alanı aştı. Havengaar aynı duruşmada toprak reformunun kendisine itiraz etmediklerini ve reformun anayasal bir zorunluluk olduğunu söyledi."}]}, {"h": {"en": "Two separate routes to a remedy", "tr": "İki ayrı çare yolu"}, "ps": [{"en": "An applicant who accepts that the purpose is constitutional moves the argument from whether land reform is necessary to how it is carried out. That narrowing also shrinks the question the court will decide: the case will settle where compensation is defined rather than whether reform continues. Another reading is available; the concession may be framing addressed to the courtroom and may leave the political position outside the case untouched.", "refs": ["dava"], "tr": "Amacın anayasal olduğunu kabul eden bir başvurucu, tartışmayı toprak reformunun gerekliliğinden onun yürütülme yöntemine taşır. Bu daraltma mahkemenin karara bağlayacağı soruyu da küçültüyor: dava, reformun sürüp sürmeyeceğini karara bağlamayacak; belirleyeceği şey, bedelin hangi metinde tanımlanacağıdır. Başka bir okuma da mümkün; bu kabul, mahkeme salonuna dönük bir çerçeveleme olabilir ve dava dışındaki siyasi konumu bağlamayabilir."}, {"en": "The Democratic Alliance's route produces a different outcome. The party raised separate constitutional objections to the drafting of the Act and to the parliamentary process by which it passed. An annulment on procedural grounds would send the Act back to parliament without addressing the meaning of section 25, leaving the compensation question open, and for those waiting on the land reform programme the delay could run longer than a ruling on the substance. What to watch in the hearing is whether the court separates the section 12 question from the process question.", "refs": ["dava"], "tr": "Demokratik İttifak'ın yolu farklı sonuç verir. Parti, yasanın kaleme alınışına ve parlamentodaki geçiş sürecine ayrı anayasal itirazlar yöneltti. Usule dayalı bir iptal, 25. maddenin anlamını tartışmadan yasayı parlamentoya geri gönderir; bu durumda bedel sorusu açık kalır ve toprak reformu programını bekleyenler için gecikme, esasa ilişkin bir karardan daha uzun sürebilir. Duruşmada izlenecek nokta, mahkemenin madde 12 sorusunu usul sorusundan ayırıp ayırmayacağıdır."}]}], "sources": [{"key": "dava", "kind": "news", "name": "Sowetan", "url": "https://www.sowetan.co.za/news/2026-08-04-afriforum-argues-expropriation-acts-nil-compensation-provisions-undermine-constitution/", "title": {"tr": "AfriForum, kamulaştırma yasasının bedelsiz el koyma hükümlerini anayasaya aykırı buluyor", "en": "AfriForum argues the Expropriation Act's nil-compensation provisions breach the constitution"}, "publishedDate": "2026-08-04"}], "title": {"en": "Does the statute or the constitution define expropriation without compensation?", "tr": "Bedelsiz kamulaştırmayı yasa mı, anayasa mı tanımlar?"}, "writer": "geo-05", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "The statement rests its claim that Japan is moving away from a defensive posture on two events: the joint drill in the Philippines in May and the Tomahawk test from the Chokai. It cites no doctrinal text.", "tr": "Açıklama, Japonya'nın savunma duruşundan uzaklaştığı iddiasını iki olaya dayandırıyor: mayısta Filipinler'deki ortak tatbikat ve Chokai'den yapılan Tomahawk denemesi. Bir doktrin metnine atıf yapılmıyor."}, "sections": [{"h": {"en": "The two events the claim rests on", "tr": "İddianın dayandığı iki olay"}, "ps": [{"en": "Kim Yo Jong's statement, issued through KCNA, asserts that Japan's military is moving away from a defensive posture and says Pyongyang will set up additional military options. It promises a response that would make Japan feel its security has been exposed to greater danger, and it points to the United States as standing behind those moves. Two events are cited as grounds: the Tomahawk test from the Aegis destroyer Chokai in the Pacific, and participation in US-led joint drills in the Philippines in May.", "refs": ["kore"], "tr": "Kim Yo Jong, KCNA aracılığıyla yayımladığı açıklamada Japonya ordusunun savunma duruşundan uzaklaştığını öne sürdü ve Pyongyang'ın ek askeri seçenekler oluşturacağını bildirdi. Açıklama Japonya'ya güvenliğinin daha büyük tehlikeye açıldığını hissettirecek bir karşılık vaat ediyor ve bu hamlelerin arkasında ABD'yi gösteriyor. Dayanak olarak iki olay sayılıyor: Pasifik'te Chokai adlı Aegis muhribinden yapılan Tomahawk denemesi ve mayısta Filipinler'de ABD önderliğindeki ortak tatbikatlara katılım."}, {"en": "Dating a change of posture requires a dated change in a governing text or in a declared mission, since single acts can only be read against such a text. What the statement supplies is two acts and a characterisation. This says nothing about whether Japan's posture has changed; it records only that the document opening the period is not identified here.", "refs": ["kore"], "tr": "Bir duruş değişikliğini tarihlendirmek için gereken şey, yönetici bir metinde ya da ilan edilmiş bir görev tanımında tarihli bir değişikliktir; tekil eylemler ancak böyle bir metnin karşısında okunabilir. Açıklamada aktarılan malzeme iki eylem ve bir niteleme. Bu, Japonya'nın duruşunun değişmediği anlamına gelmez; yalnızca dönemi başlatan belgenin bu metinde gösterilmediğini söyler."}]}, {"h": {"en": "Why now, and waiting for what", "tr": "Neden şimdi ve neyi bekleyerek"}, "ps": [{"en": "Yang Moo-jin of the University of North Korean Studies and Lim Eul-chul of Kyungnam University say the language could prepare the ground for later military demonstrations and missile tests. If that reading holds, the statement's function is to fix a starting date, so that a subsequent launch can be attached to a rationale declared before it. The opposing reading is also available; the text may be ordinary deterrent language with no programme behind it, and may count as this year's instance of a pattern Pyongyang has repeated for years.", "refs": ["kore"], "tr": "Kuzey Kore Çalışmaları Üniversitesi'nden Yang Moo-jin ile Kyungnam Üniversitesi'nden Lim Eul-chul, bu dilin ilerideki askeri gösterilere ve füze denemelerine gerekçe hazırlayabileceğini söylüyor. Bu okuma doğruysa açıklamanın işlevi bir başlangıç tarihi sabitlemektir: sonraki bir fırlatma, kendisinden önce ilan edilmiş bir gerekçeye bağlanabilir hale gelir. Karşı okuma da mümkün; metin, arkasında bir program bulunmayan olağan bir caydırıcılık dili olabilir ve Pyongyang'ın yıllardır yinelediği kalıbın bu yılki örneği sayılabilir."}, {"en": "The observation that would resolve the distinction sits outside the statement itself. A published revision in Japan's defence documents, or a change in the declared mission of the Aegis vessels, would tie the periodisation to a document. Until such a text appears, what remains is two dated acts and a characterisation attached to them, and Pyongyang's next step will be read according to which of the two it rests on.", "refs": ["kore"], "tr": "Ayrımı çözecek gözlem, açıklamanın kendisinin dışında duruyor. Japonya'nın savunma belgelerinde yayımlanmış bir revizyon ya da Aegis gemilerinin ilan edilmiş görev tanımında bir değişiklik, dönemlendirmeyi belgeye bağlar. Böyle bir metin çıkmadığı sürece elde iki tarihli eylem ve onlara iliştirilmiş bir niteleme kalır; Pyongyang'ın sonraki adımı da bu ikisinden hangisine dayandığına göre okunacak."}]}], "sources": [{"key": "kore", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/5/north-koreas-kim-yo-jong-issues-military-threat-over-japan-missile-test", "title": {"tr": "Kim Yo Jong, Japonya'nın Tomahawk denemesinin ardından \"ek askeri seçenekler\" uyarısı yaptı", "en": "Kim Yo Jong warns of \"additional military options\" after Japan's Tomahawk test"}, "publishedDate": "2026-08-05"}], "title": {"en": "Pyongyang dates the change of posture to one drill and one test", "tr": "Pyongyang, duruş değişikliğini bir tatbikata ve bir denemeye tarihliyor"}, "writer": "geo-06", "n": 2, "radarPublishedAt": "2026-08-05T09:04:36+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "The package Beijing announced on Wednesday carries three separate instruments: an entity ban, an export licence and a certification audit. The first two decide who may trade; the third decides who performs the inspection a product needs in order to reach the Chinese market.", "tr": "Pekin'in çarşamba günü açıkladığı paket üç ayrı araç taşıyor: kuruluş yasağı, ihracat izni ve belgelendirme denetimi. İlk ikisi kimin ticaret yapabileceğini belirliyor; üçüncüsü, bir ürünün Çin pazarına girebilmesi için denetimi kimin yapacağını belirliyor."}, "sections": [{"h": {"en": "Who gets to appoint the inspector?", "tr": "Denetçiyi kim atayacak?"}, "ps": [{"en": "Under the decision the State Administration for Market Regulation took on Wednesday, companies in the US may no longer carry out follow-up factory inspections for CCC certification on behalf of Chinese entities. The decision pushes makers of certified electronics towards auditors designated outside the United States. CCC certification is meant to show that electronic products meet a basic safety standard.", "refs": ["cin"], "tr": "Piyasa Düzenleme İdaresi'nin çarşamba günkü kararına göre ABD'deki şirketler, Çinli kuruluşlar adına CCC belgelendirmesine ilişkin izleyen fabrika denetimlerini artık yürütemeyecek. Karar, belgeli elektronik üreticilerini Amerika Birleşik Devletleri dışında yetkilendirilmiş denetçilere yöneltiyor. CCC belgesi, elektronik ürünlerin temel bir güvenlik ölçütünü karşıladığını gösteriyor."}, {"en": "The same day the Commerce Ministry announced two further instruments. Exports of unmanned aerial vehicles, their key components and related technologies classified as export-controlled dual-use items will now be reviewed case by case. Six US entities were barred from trade and other dealings with entities in China; the named ones include Applied DNA Sciences, Inc., the non-governmental group Human Rights in China and Compliance Testing LLC.", "refs": ["cin"], "tr": "Aynı gün Ticaret Bakanlığı iki araç daha duyurdu. İhracat denetimine tabi çift kullanımlı kalem sayılan insansız hava araçlarının, kilit bileşenlerinin ve ilgili teknolojilerin ihracatı bundan böyle tek tek incelenecek. Altı ABD kuruluşunun Çin'deki kuruluşlarla ticareti ve diğer işlemleri yasaklandı; adı açıklananlar arasında Applied DNA Sciences, Inc., sivil toplum kuruluşu Human Rights in China ve Compliance Testing LLC bulunuyor."}]}, {"h": {"en": "Which instrument changes whose behaviour?", "tr": "Hangi araç kimin davranışını değiştiriyor?"}, "ps": [{"en": "The entity ban and the export licence set what named parties may do: six entities are removed from trade, and drone exports go under case-by-case review. The certification decision works somewhere else. It leaves the sale itself untouched and regulates which auditor a manufacturer must use to reach the Chinese market. The compliance burden therefore also lands on US electronics makers whose names appear on no list.", "refs": ["cin"], "tr": "Kuruluş yasağı ile ihracat izni, adı geçen tarafların ne yapabileceğini belirliyor: altı kuruluş ticaretten çıkarılıyor, insansız hava aracı ihracatı tek tek incelemeye tabi tutuluyor. Belgelendirme kararı başka bir yerde işliyor. Satışın kendisine dokunmuyor; Çin pazarına girmek isteyen bir üreticinin hangi denetçiyle çalışacağını düzenliyor. Böylece uyum yükü, adı hiçbir listede geçmeyen ABD'li elektronik üreticilerine de biniyor."}, {"en": "The ministry presents the package as an answer to Washington's steps: the FCC ban on imports of Chinese drones and the Department of Homeland Security's addition of 43 Chinese companies to the Uyghur Forced Labor Prevention Act entity list. The ministry said those steps \"seriously violate the important consensus reached by the two heads of state and severely damage China's legitimate rights and interests\". It also said it was investigating the possible national-security impact of imported printing software and office equipment; that investigation imposes no obligation on anyone yet.", "refs": ["cin"], "tr": "Bakanlık paketi Washington'ın adımlarına karşılık olarak sunuyor: FCC'nin Çin yapımı insansız hava araçlarının ithalatına getirdiği yasak ve İç Güvenlik Bakanlığı'nın 43 Çinli şirketi Zorla Çalıştırmayı Önleme Yasası listesine eklemesi. Bakanlığa göre bu adımlar \"iki devlet başkanının vardığı önemli mutabakatı ciddi biçimde çiğniyor ve Çin'in meşru hak ve çıkarlarına ağır zarar veriyor\". Bakanlık ayrıca ithal baskı yazılımlarının ve büro ekipmanlarının ulusal güvenliğe olası etkisini incelediğini bildirdi; bu inceleme henüz kimseye yükümlülük getirmiyor."}]}, {"h": {"en": "Where the decision's force becomes visible", "tr": "Kararın bağlayıcılığı nerede görünür?"}, "ps": [{"en": "How much the certification decision binds will be read from whether manufacturers change auditors. If US makers of certified electronics announce before the year ends that they have moved to bodies designated outside the United States, the decision has become a condition of market entry in practice. If no such move is announced, the measure will not have reached beyond the six named entities.", "refs": ["cin"], "tr": "Belgelendirme kararının ne kadar bağladığı, üreticilerin denetçi değiştirip değiştirmediğinden okunacak. ABD'li belgeli elektronik üreticileri yıl bitmeden Amerika Birleşik Devletleri dışında yetkilendirilmiş kuruluşlarla çalışmaya geçtiklerini duyurursa, karar fiilen pazara giriş koşulu hâline gelmiş demektir. Böyle bir geçiş duyurulmazsa, önlem adı listede geçen altı kuruluşun ötesine ulaşmamış olacak."}]}], "sources": [{"key": "cin", "kind": "news", "name": "NBC News", "url": "https://www.nbcnews.com/world/china/china-announces-countermeasures-washington-sanctions-drone-exports-us-rcna590924", "title": {"tr": "Çin, insansız hava aracı ihracatını tek tek izne bağladı ve altı ABD kuruluşuna kapıyı kapattı", "en": "China puts drone exports under case-by-case licensing and bars six US entities"}, "publishedDate": "2026-08-05"}], "title": {"en": "Only one of the three measures changes what happens at the factory gate", "tr": "Üç önlemden yalnızca biri fabrikanın kapısını değiştiriyor"}, "writer": "geo-01", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "The meeting in Amman brought Turkiye, Pakistan, Indonesia and Malaysia alongside the Arab ministerial committee. The text it produced sets up a documentation mechanism and a media platform, and leaves binding authority where it already sat.", "tr": "Amman'daki toplantıya Arap bakanlar komitesinin yanı sıra Türkiye, Pakistan, Endonezya ve Malezya katıldı. Ortaya çıkan metin bir belgeleme düzeneği ile bir medya platformu kuruyor ve bağlayıcı yetkiyi bulunduğu yerde bırakıyor."}, "sections": [{"h": {"en": "Who was at the table, and what the text set up", "tr": "Masada kim vardı, metin neyi kurdu"}, "ps": [{"en": "Members of the Arab ministerial committee on Jerusalem met in Jordan on Wednesday with the Arab League secretary-general and representatives of Turkiye, Pakistan, Indonesia and Malaysia. Their joint declaration sets up a permanent mechanism to document Israeli measures at the city's holy sites and a media platform to carry that documentation to international organisations. Arab League Secretary-General Ahmed Aboul Gheit attended.", "refs": ["amman"], "tr": "Kudüs'e ilişkin Arap bakanlar komitesinin üyeleri çarşamba günü Ürdün'de, Arap Birliği genel sekreteri ile Türkiye, Pakistan, Endonezya ve Malezya temsilcilerini bir araya getirdi. Ortak bildiri, kentteki kutsal mekânlara yönelik İsrail uygulamalarını belgeleyecek kalıcı bir düzenek ve bu belgeleri uluslararası kuruluşların gündemine taşıyacak bir medya platformu öngörüyor. Toplantıya Arap Birliği Genel Sekreteri Ahmed Ebul Gayt katıldı."}, {"en": "The declaration said Jerusalem is \"in escalating danger, and its Islamic and Christian sanctuaries are threatened as never before\", and called for international action to halt the Israeli measures. The ministers also scheduled a joint ministerial meeting on Jerusalem during the UN General Assembly session in New York in September.", "refs": ["amman"], "tr": "Bildiride Kudüs'ün \"artan bir tehlike\" altında olduğu, İslam ve Hristiyan kutsal mekânlarının \"daha önce hiç olmadığı kadar\" tehdit edildiği belirtildi ve İsrail uygulamalarının durdurulması için uluslararası adım istendi. Bakanlar ayrıca eylülde New York'ta toplanacak BM Genel Kurulu oturumu sırasında Kudüs gündemli ortak bir bakanlar toplantısı yapılmasını kararlaştırdı."}]}, {"h": {"en": "Does documentation create an obligation?", "tr": "Belgeleme bir yükümlülük doğurur mu?"}, "ps": [{"en": "In the column published this morning I argued that calling four more states to the table had not widened the binding text. The meeting's output supports that reading: the instruments it establishes are instruments of documentation and publication. Neither places an obligation on any party; both raise the visibility, and therefore the political cost, of a practice. The text does not touch the question of who holds the power to decide.", "refs": ["amman", "gecmis-kudus"], "tr": "Sabah yayımlanan sütunda, masaya dört ülkenin daha çağrılmasının bağlayıcı metni genişletmediğini savunmuştum. Toplantının çıktısı bu okumayı destekliyor: kurulan araçlar belgeleme ve yayımlama araçları. İkisi de bir tarafa yükümlülük getirmiyor, bir uygulamanın görünürlüğünü ve dolayısıyla siyasi gideri artırıyor. Karar verme yetkisinin kimde olduğu sorusuna metin dokunmuyor."}, {"en": "There is a case to be read against that. Although the documentation mechanism produces no sanction by itself, it creates a shared file to carry into the September meeting. Whether the mechanism has become an instrument will be seen in September: if the joint ministerial meeting the declaration provides for submits documents to a named international body, the mechanism has begun to work; if the meeting only repeats the declaration, it has not.", "refs": ["amman"], "tr": "Buna karşı okunabilecek bir gerekçe var. Belgeleme düzeneği tek başına yaptırım üretmese de eylül toplantısına taşınacak ortak bir dosya oluşturuyor. Düzeneğin bir araca dönüşüp dönüşmediği eylülde görülecek: bildirinin öngördüğü ortak bakanlar toplantısında belgeler adı belirtilen bir uluslararası kuruma sunulursa düzenek işlemeye başlamış olur; toplantı yalnızca bildiriyi yinelerse başlamamış olur."}]}, {"h": {"en": "The question the Septem
