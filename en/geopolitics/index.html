ocumented is only who was spoken to and in what office. In Pakistan the channel is military; the counterpart heads the army. In Türkiye the channel is diplomatic; the counterpart is the foreign minister of a NATO member state. In Saudi Arabia the channel is diplomatic too, yet the text's most explicit warning was directed there. The choice of interlocutor shows Iran's own assessment of which institution decides in each capital; whether that assessment is correct is a separate question.", "refs": ["araghchi-calls"]}, {"tr": "Üç devletin önüne konan talep, taraf olmadıkları bir metin üzerinden geliyor. İran Dışişleri Bakanlığı aynı gün Washington'u haziran ortasında varılan mutabakatı ihlal etmekle suçladı; gerekçe olarak süren saldırıları, limanlara ve ticari denizciliğe uygulanan ablukayı ve artan ekonomik baskıyı gösterdi. İslamabad, Ankara ve Riyad'dan istenen, imzacısı olmadıkları bir mutabakatın ihlali konusunda tavır almak. Karşı okuma da mümkün: görüşmeler dış politikadan çok iç kamuoyuna dönük bir kararlılık gösterisi olabilir.", "en": "The demand placed before the three states arrives through a text they are not party to. Iran's foreign ministry accused Washington the same day of breaching the memorandum agreed in mid-June, citing continuing strikes, a blockade of ports and commercial shipping and increased economic pressure. What is asked of Islamabad, Ankara and Riyadh is to take a position on the breach of an understanding they did not sign. A contrary reading is available: the calls may be a display of resolve aimed at domestic audiences rather than at foreign policy.", "refs": ["araghchi-calls"]}]}, {"h": {"tr": "Elde tek bir taraf var", "en": "Only one side has spoken"}, "ps": [{"tr": "Bu üç görüşmeye dair elimizdeki tek anlatı İran'ın kendi anlatısı. Pakistan, Türkiye ve Suudi Arabistan kendi özetlerini yayımladıklarında asıl bilgi, İran'ın metninde bulunup onlarınkinde bulunmayan cümlelerde bulunuyor. Özellikle bölgesel desteğin bir yanıt gerekçesi sayılması, üç hükümetin de sessiz kalmayı ya da farklı bir dille cevap vermeyi seçebileceği bir yer. İzlenecek somut işaret şu: bu üç dışişleri bakanlığından herhangi biri kendi özetinde bölgesel destek ifadesini tekrarlarsa, uyarının kabul edildiği doğrulanır; ifadeyi atlarlarsa, çağrının karşılıksız kaldığı anlaşılır.", "en": "The only account of these three conversations that exists is Iran's own. When Pakistan, Türkiye and Saudi Arabia publish their own summaries, the real information lies in the sentences present in Iran's text and absent from theirs. The clause treating regional support as grounds for a response is precisely the point at which all three governments may choose silence or a different formulation. The concrete signal to watch is this: if any of the three foreign ministries repeats the regional-support wording in its own summary, the warning was accepted; if they omit it, the approach went unanswered.", "refs": ["araghchi-calls"]}]}], "sources": [{"key": "araghchi-calls", "kind": "news", "name": "Xinhua", "url": "https://english.news.cn/20260802/e50cf362c21a4efdb0ff77ef0f413399/c.html", "title": {"tr": "Arakçi, Pakistan, Türkiye ve Suudi Arabistan'a bölgesel destek uyarısı yaptı", "en": "Araghchi warns Pakistan, Türkiye and Saudi Arabia against backing US action"}, "publishedDate": "2026-08-02"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "Sheraro'daki çatışma 2022'de ertelenen maddelerin üzerinde duruyor", "en": "The fighting at Sheraro stands on the clauses postponed in 2022"}, "excerpt": {"tr": "Batı Tigray'da cumartesi şafağında başlayan çatışma, Kasım 2022 anlaşmasının çözdüğü değil ileriye bıraktığı iki başlığın üzerinde: silahsızlanma ve TPLF'nin hukuki statüsü.", "en": "The fighting that began at dawn on Saturday in western Tigray rests on the two items the November 2022 agreement postponed rather than settled: disarmament and the TPLF's legal status."}, "sections": [{"h": {"tr": "Yer ve tarih birlikte okunduğunda", "en": "Reading the place and the date together"}, "ps": [{"tr": "Çatışma, Sudan sınırına yakın Sheraro çevresinde cumartesi şafağında başladı. Tigray bölge yönetimi saldırıyı federal kuvvetlere yükledi; federal bakan Abraham Belay ise TPLF başkanı Debretsion Gebremichael'e bağlı güçlerin başlattığını söyledi ve savaşın yeterince sürdüğünü, anlaşmazlıkların diyalogla çözülmesi gerektiğini ekledi. Etiyopya uzmanı Kjetil Tronvoll olayı 2022 anlaşmasından bu yana yaşanan en ciddi olay olarak niteledi. İki anlatının hiçbiri bağımsız doğrulanmış değil ve can kaybı bildirilmedi.", "en": "The fighting began at dawn on Saturday around Sheraro, close to the Sudanese border. Tigray's regional government attributed the assault to federal forces; the federal minister Abraham Belay said forces loyal to TPLF chairman Debretsion Gebremichael had started it, adding that the war had gone on long enough and that differences should be settled through dialogue. Kjetil Tronvoll, a specialist on Ethiopia, called it the most serious incident since the 2022 agreement. Neither account is independently verified and no casualty figures were reported.", "refs": ["tigray-sheraro"]}, {"tr": "Kasım 2022'de imzalanan Pretoria anlaşması, 2020'de başlayan ve yüz binlerce kişinin ölümüne yol açan savaşı bitirdi. Bitirmediği iki şey vardı: silahların kimin elinde kalacağı ve TPLF'nin hangi hukuki sıfatla var olacağı. Bu iki başlık dört yıl boyunca askıda kaldı; TPLF temmuz ortasında anlaşmanın fiilen sona erdiğini açıkladı. Devralınan düzenleme burada tamamlanmamış bir silah ve statü tasfiyesi olarak duruyor.", "en": "The Pretoria agreement signed in November 2022 ended a war that began in 2020 and killed hundreds of thousands. Two things it did not end were the question of who would keep the weapons and under what legal standing the TPLF would exist. Those two items hung unresolved for four years; in mid-July the TPLF said the agreement was effectively dead. The inherited arrangement here is an unfinished disposition of arms and standing rather than a boundary line.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Neden bugün ve neden burada", "en": "Why today, and why here"}, "ps": [{"tr": "Tetiği çeken şey, o metni imzalayan tarafın kendi içindeki yarılma. Başbakan Abiy Ahmed'in danışmanı Getachew Reda, Debretsion'un Eritre'ye ve Amhara milislerine yaslanarak iktidarı ele geçirmeye çalıştığını öne sürdü. Suçlama dışarıdan değil, anlaşmanın Tigray tarafını temsil eden yapının içinden geliyor. Bir uzlaşma metni tek bir muhatap varsayarak yazıldığında, o muhatabın ikiye ayrılması metnin öngörmediği bir durumdur.", "en": "What pulled the trigger is a split inside the party that signed the old text. Getachew Reda, an adviser to Prime Minister Abiy Ahmed, said Debretsion was leaning on Eritrea and on Amhara militias in a bid to seize power. The accusation comes not from outside but from within the structure that represented the Tigrayan side of the agreement. When a settlement is drafted on the assumption of a single counterparty, that counterparty splitting in two is a case the text does not provide for.", "refs": ["tigray-sheraro"]}, {"tr": "Dışarıdan uygulanan araçlar da aynı boşluğa çarpıyor. Amerika Birleşik Devletleri haziranda TPLF içindeki sertlik yanlılarına vize kısıtlaması getirdi ve Büyükelçi Ervin Massinga anlaşmayı korumak için Mekelle'ye gitti. Hukuki statüsü hiçbir zaman sabitlenmemiş bir yapı içinde kimin sertlik yanlısı sayılacağını belirlemek, ancak o yapının bir muhatap olarak tanınmasıyla mümkün. Bölge analisti Faisal Roble güçlü bir uluslararası müdahale olmadan çok daha büyük bir savaşa gidilebileceği uyarısında bulundu.", "en": "Instruments applied from outside run into the same gap. The United States imposed visa restrictions on hardliners within the TPLF in June, and Ambassador Ervin Massinga travelled to Mekelle to preserve the agreement. Deciding who counts as a hardliner inside a structure whose legal status was never fixed is possible only by recognising that structure as a counterparty. The regional analyst Faisal Roble warned that without strong international intervention the situation could move towards a much larger war.", "refs": ["tigray-sheraro"]}]}, {"h": {"tr": "Benzemeyen yan", "en": "Where the resemblance breaks"}, "ps": [{"tr": "2020'yi hatırlatan bir sahne var, ama fay hattı aynı yerde değil. O savaşta çizgi Mekelle ile Addis Ababa arasından geçiyordu. Cumartesi tarif edilen hizalanmalar bu çizgiyi kesiyor: diyalog çağrısı yapan bir federal bakan, başbakana danışmanlık yapan eski bir TPLF ismi ve bir Tigray hizbinin son savaşın dışarıdaki ordusu Eritre'ye yaslandığı iddiası. İki blok varsayan bir emsal, burada açıklama gücünü yitiriyor; bu yüzden mesele savaşın yeniden başlayıp başlamayacağından çok, hukuki statüsü belirlenmemiş bir tarafla nasıl bir geçici yönetim kurulacağı.", "en": "There is a scene here that recalls 2020, but the fault line does not run in the same place. In that war the line lay between Mekelle and Addis Ababa. The alignments described on Saturday cut across it: a federal minister calling for dialogue, a former TPLF figure advising the prime minister, and the claim that a Tigrayan faction is leaning on Eritrea, the outside army of the last war. A precedent that assumes two blocs loses its explanatory power here; the question is therefore less whether the war resumes than what kind of interim administration can be built with a party whose legal standing was never fixed.", "refs": ["tigray-sheraro"]}]}], "sources": [{"key": "tigray-sheraro", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/fighting-breaks-out-in-western-tigray-as-ethiopia-and-tplf-trade-blame", "title": {"tr": "Batı Tigray'da çatışma çıktı, Addis Ababa ile TPLF birbirini suçluyor", "en": "Fighting erupts in western Tigray as Addis Ababa and the TPLF trade blame"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T22:08:49+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Şubat'ta tebliğ edildi, ağustosta duyuruldu", "en": "Served in February, made public in August"}, "excerpt": {"tr": "Celbin muhatabı sızdıran kişi değil, haberi yayımlayan gazeteci. Zorlayıcı gücü, sızıntıya ilişkin bir bulgudan değil, uyulmadığında devreye giren yaptırımdan geliyor; altı ay boyunca kamuya açılmamış olması da aracın nasıl çalıştığına dair ayrı bir bilgi.", "en": "The subpoena is addressed to the journalist who published, rather than to whoever leaked. Its compelling force comes from the sanction that follows non-compliance, not from any finding about the leak, and the six months it spent out of public view are separate information about how the instrument works."}, "sections": [{"h": {"tr": "Aracın kimliği", "en": "Identifying the instrument"}, "ps": [{"tr": "New York Times, 1 Ağustos'ta Adalet Bakanlığı'nın bağımsız muhabir Matthew Cole'a bir celp gönderdiğini açıkladı. Celp, şubat 2026'da FBI ajanları tarafından Cole'un New York'taki evinde tebliğ edilmiş ve Kuzey Kore'deki gizli bir askerî operasyona ilişkin haberinin kaynaklarını açıklaması istenmişti. Söz konusu araştırma eylül 2025'te Times'ın ulusal muhabiri Dave Philipps ile birlikte yayımlanmış, 2019'da Kuzey Kore kıyılarına elektronik dinleme donanımı yerleştirmeyi amaçlayan gizlilik dereceli bir Deniz Kuvvetleri SEAL görevini anlatmıştı.", "en": "On 1 August the New York Times disclosed that the Justice Department had sent a subpoena to the freelance reporter Matthew Cole. FBI agents delivered it at his New York home in February 2026, demanding that he identify the sources for his reporting on a secret military operation in North Korea. That investigation, published in September 2025 with the paper's national correspondent Dave Philipps, described a classified 2019 Navy SEAL mission to place electronic surveillance equipment on North Korean shores.", "refs": ["nyt-subpoena"]}, {"tr": "Celp, muhatabından ifade ya da belge talep eden zorlayıcı bir araçtır. Bir açıklamanın hukuka aykırı olduğunu saptamaz ve bir sanık göstermez; yalnızca elindeki bilgiyi vermesi istenen kişiye yönelir. Bu tercihin somut ölçüsü, olayda adı geçen hukukçularda görülüyor: Cole'u David A. O'Neill temsil ediyor, gazete tarafında baş hukuk müşaviri David McCraw ile avukat Douglas Zolkind yer alıyor. Uyulmama kararının bedelini üstlenecek taraf, kaynağı koruyan gazeteci ve onun arkasındaki yayın kurumudur.", "en": "A subpoena is a compulsory demand for testimony or material addressed to its recipient. It settles nothing about whether a disclosure was unlawful and identifies no defendant; it runs only to the person asked to hand over what he holds. The concrete measure of that choice is visible in the lawyers named: Cole is represented by David A. O'Neill, while the paper fields general counsel David McCraw and the lawyer Douglas Zolkind. Whoever decides not to comply carries the cost, and that is the journalist protecting a source together with the publisher behind him.", "refs": ["nyt-subpoena"]}]}, {"h": {"tr": "Altı ayın anlamı", "en": "What the six months mean"}, "ps": [{"tr": "Belge şubatta tebliğ edildi, gazete ise 1 Ağustos'ta duyurdu. Bu tür bir araç muhatabını tebliğ anından itibaren bağlar; aradaki süre, hiçbir kamusal itirazla karşılaşmadan işlediği dönemdir. Sürenin uzunluğu, aracın tasarımıyla tutarlı bir okuma sunuyor: zorlama muhatabın üzerinde çalışır, kamuoyuna açmak ise onu gönderenin değil, alanın tercihidir. Bunun daha sade bir açıklaması da mümkün: avukatların hazırlık ya da bakanlıkla yürütülen bir görüşme nedeniyle erken duyuruyu sakıncalı bulması. O hâlde altı ay, aracın niteliğinden çok gazetenin hukuk stratejisini anlatıyor olabilir.", "en": "The document was served in February and the paper made it public on 1 August. An instrument of this kind binds its recipient from the moment of service, so the interval is the stretch in which it operated without any public challenge. Its length reads consistently with the instrument's design: compulsion works on the recipient, and going public is the choice of the party receiving it rather than an obligation of the party issuing it. A plainer explanation is available too — counsel may have judged early disclosure unwise while preparing a response or talking to the department — in which case the six months describe the paper's legal strategy more than the instrument's character.", "refs": ["nyt-subpoena"]}, {"tr": "Bundan sonrasında izlenecek adım, bakanlığın uymaya zorlamak için mahkemeye başvurup başvurmadığıdır. Hiç zorlanmayan bir celp, sınırları hiç sınanmadan bir maliyet yükler; mahkemeye taşınan bir celp ise bu muhabirin ötesine geçen bir yorum üretir. Ölçülebilir eşik şu: 31 Ekim 2026'ya kadar dosyada uymaya zorlama ya da iptal talebi görünürse, soru gazetenin masasından çıkıp yargısal bir zemine taşınmış olur. Görünmezse talep, ne kadar ileri gidebileceği hiç test edilmemiş bir baskı olarak yerinde kalır.", "en": "The step to watch is whether the department goes to court to compel compliance. A subpoena that is never enforced imposes a cost while its limits stay untested; one taken before a judge produces an interpretation that reaches past this reporter. The measurable threshold is this: if a motion to compel or to quash appears on the docket by 31 October 2026, the question has moved off the newspaper's desk onto judicial ground. If none appears, the demand sits where it is, as pressure whose reach has never been tried.", "refs": ["nyt-subpoena"]}]}], "sources": [{"key": "nyt-subpoena", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/new-york-times-reveals-trump-administration-subpoena-over-north-korea-story", "title": {"tr": "New York Times, Adalet Bakanlığı'nın Kuzey Kore operasyonu haberi nedeniyle bir muhabire celp gönderdiğini açıkladı", "en": "The New York Times says the Justice Department subpoenaed a reporter over a North Korea operation"}, "publishedDate": "2026-08-01"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Çerçeveyi kim kabul etti, nerede yazılı?", "en": "Who agreed to the perimeters, and where is that written?"}, "excerpt": {"tr": "Trump'ın paylaşımı, Washington'ın ne elde ettiğini söylediğini aktarıyor. Duyuru anlaşmanın iki unsurunu sayıyor; Tahran da İsrail de bu iki unsur hakkında sessiz kaldı. Elde bir mutabakat metni değil, tek taraflı bir özet var.", "en": "Trump's post conveys what Washington says it has obtained. The announcement names two elements of an agreement; both Tehran and Israel have stayed silent on those two elements. What exists is a one-sided summary rather than an agreed text."}, "sections": [{"h": {"tr": "Duyuruda ne var", "en": "What the announcement contains"}, "ps": [{"tr": "Trump, Truth Social'daki paylaşımında ABD'nin \"hedefi kilitlemiş ve hazır\" olduğunu, ardından İran'ın ve diğer Orta Doğu ülkelerinin kendisinden beklemesini istediğini yazdı ve saldırıyı \"hızla bir ANLAŞMAYA varılabilmesi şartıyla\" iptal ettiğini duyurdu. Anlaşmanın iki unsuru sayılıyor: Hürmüz Boğazı'nın tümüyle açılması ve İran'ın nükleer tehdidinin sona ermesi. Paylaşımda \"İsrail de bu taahhütte bana katılıyor\" deniyor; ancak İsrail hükümeti hemen kamuya açık bir açıklama yapmadı, Tahran'dan da resmî bir yanıt gelmedi. Al Jazeera, Axios'a dayanarak Suudi Veliaht Prensi Muhammed bin Selman'ın cumartesi günü telefonla iptali istediğini aktardı.", "en": "In his Truth Social post Trump wrote that the United States was \"locked and loaded\", then said Iran and other Middle Eastern countries had asked him to hold off, and announced that he had cancelled the attack \"subject to being able to rapidly make a DEAL\". Two elements of the agreement are named: the complete opening of the Strait of Hormuz and an end to Iran's nuclear threat. The post says \"The country of Israel joins me in this commitment\", yet the Israeli government issued no immediate public statement and no official response came from Tehran. Al Jazeera, citing Axios, reported that Saudi Crown Prince Mohammed bin Salman telephoned on Saturday to ask for the cancellation.", "refs": ["iran-cancel"]}, {"tr": "Temas, gündem, çerçeve ve imzalanmış taahhüt ayrı aşamalardır. Burada belgelenen şey temastır: beklemeye dönük bir talep ve bir telefon görüşmesi, ardından çerçevenin tek taraflı biçimde anlatılması. Metindeki kritik fiil \"istendi\": duyuru inisiyatifi karşı tarafa yükleyerek tavizi henüz konuşmamış olan tarafın hanesine yazıyor. Bir kefede gerçek bir eylem var; saldırı yapılmadı ve bunun gözlenebilir bir karşılığı var. Öbür kefede çerçeveyi imzalayan ikinci bir el yok.", "en": "Contact, agenda, framework and signed commitment are separate stages. What is documented here is contact: a request to hold off, a telephone call, and then a one-sided account of the framework. The decisive verb in the text is \"asked\" — the announcement assigns the initiative to the other side and thereby books the concession to a party that has not yet spoken. In one pan sits a real act: no strike took place, and that has an observable referent. In the other pan there is no second hand on the framework.", "refs": ["iran-cancel"]}]}, {"h": {"tr": "Kim onaylayacak, kim bozabilir", "en": "Who ratifies, who can spoil"}, "ps": [{"tr": "Çerçeveyi onaylaması gereken taraf tek bir aktör değil. Amir-Hussein Radjy ve Lee Keath imzalı haber, Paydari hareketinden Said Celili çevresindeki aşırı sertlik yanlılarının tam zafer istediğini, Cumhurbaşkanı Mesud Pezeşkiyan ile baş müzakereci konumundaki Meclis Başkanı Muhammed Bakır Kalibaf'ın ise askerî baskıyı pazarlık kozu saydığını aktarıyor. Aynı haberde nisan ateşkesinin Yüksek Ulusal Güvenlik Konseyi'nde 13 üyeden 12'sinin desteğiyle geçtiği, tek karşı oyun Celili'ye ait olduğu; devlet televizyonunun ise hem Pezeşkiyan'ın hem Kalibaf'ın müzakereleri anlattığı yayınları kestiği yazılı. Washington'dan duyurulan bir çerçevenin karşısında onay üretebilecek bir merci gerekir: 12'ye 1'lik oy bu kapasitenin var olduğunu, kesilen yayınlar ise kullanılmasının bedeli olduğunu gösteriyor. Tahran'ın sessizliği pekâlâ kasıtlı bir sıralama da olabilir; müzakere eden taraf metin oturmadan teyidi bekletir, o hâlde sessizlik anlaşmanın yokluğunun değil taktiğin işareti sayılır.", "en": "The party that must ratify the framework is not a single actor. A report by Amir-Hussein Radjy and Lee Keath describes ultra-hardliners around Saeed Jalili of the Paydari movement pressing for total victory, while President Masoud Pezeshkian and Parliament Speaker Mohammad Bagher Ghalibaf, who serves as chief negotiator, treat military pressure as bargaining leverage. The same report says the April ceasefire passed the Supreme National Security Council with 12 of 13 members in favour and Jalili casting the only vote against, and that state television interrupted broadcasts in which both Pezeshkian and Ghalibaf discussed negotiations. A framework announced from Washington needs a body on the other side capable of producing ratification: the 12-to-1 vote shows that capacity exists, and the interrupted broadcasts show what using it costs. Tehran's silence may equally be deliberate sequencing — a negotiating party withholds confirmation until the text has settled — in which case the silence marks tactics rather than the absence of an agreement.", "refs": ["iran-cancel", "iran-factions"]}, {"tr": "Aynı hafta sonu, on bir ülkedeki ABD büyükelçilikleri Amerikalılara ayrılmayı değerlendirmelerini ya da bir tırmanma hâlinde ayrılmaya hazır olmalarını bildirdi; uyarılar Bahreyn'den Birleşik Arap Emirlikleri'ne uzanıyor. Aynı pencerede çıkan iki resmî işlem birbirinden farklı yönleri gösteriyor: biri bir anlaşmayı anlatıyor, öteki o anlaşmanın tutmaması ihtimaline hazırlanıyor. Duyurulan çerçeve ile kurumların fiilen davrandığı varsayım arasındaki mesafe budur ve ölçülebilir. Eşik şu: 16 Ağustos 2026'ya kadar ne İran dışişlerinden ne İsrail başbakanlığından gelen resmî bir açıklama iki unsuru da adıyla teyit ederse, duyuru tek taraflı bir konum olarak kalır.", "en": "That same weekend, US embassies in eleven countries told Americans to consider departing or to be ready to depart should there be escalation, in alerts running from Bahrain to the United Arab Emirates. Two official acts issued in the same window point in different directions: one describes an agreement, the other prepares for its failure. That distance between an announced framework and the assumption institutions actually act on is the measurable quantity here. The threshold: if by 16 August 2026 no official statement from Iran's foreign ministry or Israel's prime minister's office confirms both named elements, the announcement stands as a one-sided position.", "refs": ["iran-cancel", "us-alerts"]}]}], "sources": [{"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}, {"key": "iran-factions", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/irans-leadership-vacuum-leaves-two-factions-battling-for-control-over-wars-aim/", "title": {"tr": "İran'da aşırı sertlik yanlıları ile müzakerecilerin savaşın amacı konusunda bölündüğü aktarıldı", "en": "Iran's ultra-hardliners and negotiators are described as split over the war's aim"}, "publishedDate": "2026-08-02"}, {"key": "us-alerts", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020047/us-govt-advises-americans-to-leave-mideast", "title": {"tr": "ABD büyükelçilikleri on bir Orta Doğu ülkesindeki Amerikalılara ülkeden ayrılmayı değerlendirmelerini bildirdi", "en": "US embassies tell Americans in eleven Middle Eastern countries to consider leaving"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "THAAD envanterinin yaklaşık yarısı çoktan ateşlendi", "en": "About half the THAAD inventory is already spent"}, "excerpt": {"tr": "Siyasi bir duyuru saldırıyı iptal edebilir. Bir önleyiciyi yerine koymak üretim hattı ister ve aktarılan oranlar doğruysa, iki hızdan yavaş olanı üretim tarafında.", "en": "A political announcement can cancel a strike. Replacing an interceptor takes a production line, and on the figures reported, that line is the slower of the two."}, "sections": [{"h": {"tr": "Sayılabilir olan", "en": "What can be counted"}, "ps": [{"tr": "Dawn'ın haberine göre ABD Avrupa Komutanlığı Komutanı Orgeneral Alexus Grynkewich, bölgedeki deniz unsurlarının gerildiğini Pentagon yetkililerine kapalı biçimde iletti. Aktarılan rakamlar şöyle: 200'den fazla THAAD önleyicisi ateşlendi, bu envanterin kabaca yarısı; bunların 100'den fazlası donanma gemilerinden fırlatıldı. Hassas Vuruş Füzeleri'nin yaklaşık yüzde 45'i, Patriot önleyicilerinin yaklaşık yarısı, Tomahawk seyir füzelerinin yaklaşık yüzde 30'u, Havadan Karaya Ortak Menzil Dışı Füzeler'in yüzde 20'den fazlası ve SM-3 ile SM-6 önleyicilerinin yaklaşık yüzde 20'si kullanıldı. Değerlendirme kapalı olarak niteleniyor; Pentagon bu oranları yayımlamadı ve rakamlar bağımsız olarak doğrulanamadı.", "en": "Dawn reported that General Alexus Grynkewich, commander of US European Command, privately told Pentagon officials that naval assets in the region are stretched. The figures given run as follows: more than 200 THAAD interceptors fired, roughly half the inventory, of which more than 100 were launched from navy ships. About 45 percent of Precision Strike Missiles, around half of Patriot interceptors, roughly 30 percent of Tomahawk cruise missiles, more than 20 percent of Joint Air-to-Surface Standoff Missiles and about 20 percent of SM-3 and SM-6 interceptors have been used. The assessment is characterised as private; the Pentagon has not published these ratios and they could not be independently verified.", "refs": ["interceptors"]}, {"tr": "Kabiliyet niyetten daha dürüsttür, ama yalnızca doğru sayıldığında. Listedeki kalemler iki farklı şeyi anlatıyor. THAAD ve Patriot savunma önleyicileridir; tüketim hızını karşı tarafın fırlatma temposu belirler. Tomahawk, Hassas Vuruş Füzesi ve Menzil Dışı Füze ise taarruz mühimmatıdır; onları harcayan kendi kararlarındır. Birinci küme stok sahibinin denetiminde değil. Bildirilen kısıtın taarruz seçeneklerine değil füze savunmasına oturmasının nedeni bu asimetri. Oranların hangi paydaya göre verildiği ise belirsiz: yüzdeler küresel envanteri mi yoksa yalnızca bu harekât alanına tahsis edilen payı mı anlatıyor, haber bunu söylemiyor. Önceden konuşlandırılmış stoklar ya da müttefik envanterleri aritmetiği değiştirebilir.", "en": "Capability is more honest than intent, but only when it is counted correctly. The items on the list describe two different things. THAAD and Patriot are defensive interceptors whose consumption rate is set by the adversary's launch tempo. Tomahawk, the Precision Strike Missile and the standoff missile are offensive rounds, spent by one's own decisions. The first group is not under the holder's control, and that asymmetry is why the reported constraint lands on missile defence rather than on strike options. Which denominator the ratios use is left open: the report does not say whether the percentages describe global inventory or only the share allocated to this theatre. Pre-positioned stocks or allied inventories could change the arithmetic.", "refs": ["interceptors"]}]}, {"h": {"tr": "Seçimin biçimi", "en": "The shape of the choice"}, "ps": [{"tr": "Aktarılan formülasyon neyin önce tükendiği konusunda kesin: bölgeye bir muhrip daha görevlendirilmezse komutanların \"eninde sonunda Amerikan güçlerini korumakla İsrail için füze savunma harekâtını sürdürmek arasında zor bir seçimle karşılaşabileceği\" aktarılıyor. Bu, kabiliyetten çok idameye dair bir ifade; sistemler duruyor, soru kaç angajman boyunca destekleyebilecekleri. Gelişmiş önleyicilerin üretilebildiğinden hızlı tüketilmesi, bir savunma taahhüdünü tayınlama sorununa çevirir; taahhüdün inandırıcılığı o noktadan sonra beyanlara değil üretim hattına bağlanır. Bunun karşı okuması da açık: karşı tarafın fırlatma temposu kendi nedenleriyle düşerse, üretimde hiçbir şey değişmeden kısıt gevşer.", "en": "The formulation quoted is precise about what runs out first: without another destroyer assigned to the region, commanders \"could eventually face a difficult choice between protecting American forces and continuing missile-defence operations for Israel\". That is a statement about sustainment rather than capability; the systems are there, and the question is how many engagements they can support. Advanced interceptors consumed faster than they can be built turn a defensive commitment into a rationing problem, and from that point the commitment's credibility rests on a production line rather than on declarations. The counter-reading is equally plain: if the adversary's launch tempo falls for reasons of its own, the constraint eases with nothing changing in production.", "refs": ["interceptors"]}, {"tr": "Bu hafta sonu duyurulan iptal bu tabloyu çözmüyor. Ölçülebilir eşik şu: 30 Eylül 2026'ya kadar bölgeye ek bir ABD donanma muhribi kamuya açık biçimde görevlendirilirse, anlatılan ödünleşim çözülmemiş ama ertelenmiş olur; işaret, Savunma Bakanlığı'nın konuşlanma duyurusunda adı geçen ilave bir muhriptir. Güçten gelen itidal ile derinliği azalmış bir stoktan gelen itidal dışarıdan aynı görünür. İkisini ayıran tek büyüklük yeniden doldurma hızıdır ve o rakam kamuya açık değil.", "en": "The cancellation announced this weekend does not resolve any of this. The measurable threshold: if an additional US Navy destroyer is publicly assigned to the region by 30 September 2026, the trade-off described is deferred rather than solved, and the signal is a named additional destroyer in a Defense Department deployment announcement. Restraint that comes from strength and restraint that comes from a thinning magazine look identical from outside. The one quantity that separates them is the replacement rate, and that figure is not public.", "refs": ["interceptors", "iran-cancel"]}]}], "sources": [{"key": "interceptors", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020037/us-may-not-have-enough-forces-to-defend-israel-against-iran", "title": {"tr": "Habere göre ABD'nin THAAD önleyici füze stokunun yaklaşık yarısı harcandı", "en": "Report says about half the US THAAD interceptor inventory has been fired"}, "publishedDate": "2026-08-02"}, {"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Sigortacı, duyurudan önce ihbarı okur", "en": "The underwriter reads the advisory before the announcement"}, "excerpt": {"tr": "Boğazın tümüyle açılacağı duyurulmadan bir gün önce, aynı boğazın ağzında iki tekne vuruldu. Geçişi belirleyen büyüklük, kaptanların ve sigortacıların bu iki ihbarı nasıl fiyatladığıdır.", "en": "A day before the strait was announced as due to open completely, two hulls were struck at its mouth. The quantity that governs passage is how masters and underwriters price those two advisories."}, "sections": [{"h": {"tr": "İki ihbar, üç saat", "en": "Two advisories, three hours"}, "ps": [{"tr": "İngiltere Deniz Ticareti Operasyonları birimi UKMTO, 1 Ağustos'ta iki olay bildirdi. Umman'ın Musandam yarımadasındaki Lima açıklarının kuzeydoğusunda bir tanker kimliği belirsiz bir mermiyle vuruldu; makine dairesi hasar gördü, gemi manevra kabiliyetini yitirdi, yaralanma olmadı. Yaklaşık üç saat sonra Hasab'ın kuzeydoğusunda ikinci bir tankerin kaptanı, gemisinin çok yakınında büyük bir su sıçraması ve patlama gördüğünü bildirdi; o aşamada hasar aktarılmadı. Hiçbir grup olayları üstlenmedi. Boğazdan deniz yoluyla taşınan petrolün yaklaşık dörtte biri geçiyor.", "en": "The UK Maritime Trade Operations body, UKMTO, reported two incidents on 1 August. Northeast of Lima on Oman's Musandam peninsula a tanker was struck by an unknown projectile; its engine room was damaged, the vessel lost the ability to manoeuvre, and there were no injuries. About three hours later, northeast of Khasab, the master of a second tanker reported a large splash and an explosion very close to his ship, with no damage reported at that stage. No group claimed either incident. About a quarter of seaborne oil trade passes through the strait.", "refs": ["hormuz-tankers"]}, {"tr": "Lima ile Hasab aynı yarımadanın üzerinde, yani boğazın dış yaklaşma sularında; iki ihbarın arası üç saat. Bir darboğazda işleyen değişken, rotanın kullanılma maliyetidir. Makine dairesinden yara alan bir geminin rotanın en dar suyunda manevra kabiliyetini yitirmesi, kurtarma, refakat ve savaş riski primini besleyen türden bir olaydır. Bir darboğaz şokunu genellikle rota değişikliği emer; buradaki kaynak ise tek bir büyüklük veriyor, boğazın deniz yoluyla taşınan petroldeki yaklaşık dörtte birlik payı, ve başka hiçbir yerde yedek kapasite için rakam sunmuyor. Bu eksiklik, duyurulan bir açılışın tek başına duyurudan fiyatlanamamasının nedenidir.", "en": "Lima and Khasab sit on the same peninsula, in the strait's outer approaches, and the two advisories are three hours apart. In a chokepoint the operative variable is the cost of using a route rather than the fact that one exists. A ship taking damage in its engine room and losing the ability to manoeuvre in the narrowest water on the route is exactly the kind of event that feeds salvage, escort and war-risk pricing. A chokepoint shock is usually absorbed by rerouting; this source offers one quantity, the strait's share of about a quarter of seaborne oil trade, and no figure for spare capacity anywhere else. That gap is why an announced opening cannot be priced from the announcement alone.", "refs": ["hormuz-tankers"]}]}, {"h": {"tr": "Vaadin ölçülebilir kısmı", "en": "The measurable part of the promise"}, "ps": [{"tr": "Duyuru, anlaşmanın unsurlarından biri olarak Hürmüz Boğazı'nın tümüyle açılmasını sayıyor. Açıklık, geçiş yapan gemilerin gözlediği bir işletme koşuludur ve bir paylaşımın verebileceği hukuki bir statü değildir. İki ihbar duyurudan bir gün öncesine ait ve bu, kesin bir iddianın önüne ölçülebilir bir soru koyuyor. Bir darboğazda bağlayıcı kısıt, kaptanların ve onların sigortacılarının geçişi kabul etme isteğidir; bu istek ihbarlara tepki verir, bildirilere değil. Olayların boğazın siyasi durumuyla ilgisiz olması da mümkün: artık mühimmat, münferit bir saldırı ya da yanlış okunan bir gözlem olabilir; o hâlde tekrar etmedikleri sürece açılış yürür ve fiyat etkisi hızla söner.", "en": "The announcement lists the complete opening of the Strait of Hormuz among the elements of an agreement. Openness is an operating condition observed by the vessels that transit, and no post can confer it as a legal status. The two advisories are dated the day before the announcement, which places a measurable question in front of a categorical claim. In a chokepoint the binding constraint is the willingness of masters and their underwriters to accept the passage, and that willingness responds to advisories rather than to communiqués. It is also possible the incidents have nothing to do with the strait's political status — residual ordnance, an isolated attack, or a misread observation — in which case, absent repetition, an opening proceeds and the pricing effect decays quickly.", "refs": ["hormuz-tankers", "iran-cancel"]}, {"tr": "Sınama ucuz ve kamuya açık. İzlenecek işaret, önümüzdeki haftalarda aynı yaklaşma sularında yeni UKMTO ihbarlarının çıkıp çıkmadığıdır. 15 Eylül 2026'ya kadar yeni bir ihbar gelmezse, iki bildirim münferit bir çift olarak kalır ve duyurudaki açılış yaklaşma sularında fiziksel bir engelle karşılaşmaz. İhbarlar sürerse, vaat maliyeti hâlâ başka bir yerde belirlenen bir rota hakkında verilmiş olur. Burada ne prim serisi ne geçiş sayısı serisi aktarılıyor; bu yüzden yargı, elde bulunan tek gözlenebilir büyüklükle sınırlı tutuluyor.", "en": "The test is cheap and public. The signal to watch is whether fresh UKMTO advisories appear in the same approaches over the coming weeks. If none appears by 15 September 2026, the two reports stand as an isolated pair and the opening named in the announcement meets no physical obstacle in the approaches. If advisories continue, the promise has been made about a route whose cost is still being set elsewhere. Neither a premium series nor a transit-count series is cited here, so the judgement stays inside the one observable quantity available.", "refs": ["hormuz-tankers"]}]}], "sources": [{"key": "hormuz-tankers", "kind": "news", "name": "Euronews", "url": "http://www.euronews.com/2026/08/01/two-reported-attacks-on-tankers-near-strait-of-hormuz", "title": {"tr": "Hürmüz Boğazı yakınında iki tankerin ayrı olaylarda vurulduğu bildirildi", "en": "Two tankers reported hit in separate incidents near the Strait of Hormuz"}, "publishedDate": "2026-08-01"}, {"key": "iran-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Hiçbir ilçeye ait olmayan on iki sandalye", "en": "Twelve seats that belong to no district"}, "excerpt": {"tr": "Azad Cammu ve Keşmir'de pazar günü oylanan sandalyelerin on ikisi bir coğrafyaya değil, Pakistan geneline dağılmış mültecilere ait. Bu düzenleme seçim gününün lojistiğinden ibaret değil; yasama meclisinin kimlerden oluşacağına dair bir tercih.", "en": "Twelve of the seats voted on Sunday in Azad Jammu and Kashmir belong to no territory but to refugees dispersed across Pakistan. The arrangement is more than election-day logistics; it is a choice about who the legislature is made of."}, "sections": [{"h": {"tr": "İki farklı seçmen ölçeği", "en": "Two different scales of electorate"}, "ps": [{"tr": "Oy verme sabah 8 ile akşam 5 arasında yapıldı. Azad Cammu ve Keşmir Seçim Komisyonu'nun verdiği rakamlara göre Muzaffarabad bölgesindeki dokuz sandalye için 809.621 kayıtlı seçmen bulunuyor; sandalyelerin beşi Muzaffarabad ilçesine, ikişeri Neelum ve Celum Vadisi ilçelerine ayrılmış. Pakistan genelinde yaşayan mültecilere ayrılan on iki seçim bölgesinde ise 438.834 kayıtlı seçmen var; bunların altısı Keşmir Vadisi'nden, altısı Cammu'dan gelenleri temsil ediyor. Dokuz sandalye için 207, on iki mülteci sandalyesi için 137 aday yarıştı.", "en": "Polling ran from 8 in the morning to 5 in the afternoon. On the figures published by the Azad Jammu and Kashmir Election Commission, the nine seats in Muzaffarabad division draw on 809,621 registered voters, five of those seats belonging to Muzaffarabad district and two each to Neelum and Jhelum Valley. The twelve constituencies reserved for refugees living across Pakistan hold 438,834 registered voters, six representing people from the Kashmir Valley and six from Jammu. There were 207 candidates for the nine seats and 137 for the twelve refugee seats.", "refs": ["ajk-polls"]}, {"tr": "Komisyonun kendi rakamları bölündüğünde iki seçmen kütlesinin sandalye başına ağırlığı eşit çıkmıyor. Her mülteci sandalyesinin arkasında kabaca 36.600 kayıtlı seçmen var; Muzaffarabad bölgesindeki her sandalyenin arkasında ise yaklaşık 90.000. Yani mülteci seçim bölgesindeki bir oy, bölgedeki bir oyun yaklaşık iki buçuk katı ağırlık taşıyor. Aday yoğunluğu da bu farkı yansıtıyor: bölge sandalyesi başına yaklaşık 23 aday, mülteci sandalyesi başına yaklaşık 11. Bu oran, yerinden edilmiş seçmen kütlelerini orantılı değil yapısal olarak temsil eden bir tasarımı gösteriyor. Aynı fark kayıt kapsamından da doğabilir: Pakistan geneline yayılmış mülteci listeleri, seçme hakkı olanların yerleşik listelere göre daha küçük bir bölümünü kapsıyor olabilir; o durumda ağırlık farkı bir sayım sonucudur, bir tercih değil.", "en": "Divide the commission's own figures and the two electorates do not carry equal weight per seat. Roughly 36,600 registered voters stand behind each refugee seat, against about 90,000 behind each seat in Muzaffarabad division. A vote in a refugee constituency therefore carries about two and a half times the weight of one in the division. The density of candidates tracks the same gap: about 23 candidates per division seat against about 11 per refugee seat. The ratio points to a design that represents displaced electorates structurally rather than proportionally. The same difference could equally arise from registration coverage: refugee rolls compiled across Pakistan may capture a smaller share of those eligible than resident rolls do, in which case the weighting is an artefact of enumeration rather than a choice.", "refs": ["ajk-polls"]}]}, {"h": {"tr": "Sandıkların sınıflandırılması", "en": "How the ballot boxes were classified"}, "ps": [{"tr": "Bölgede kurulan 1.483 sandığın 533'ü çok hassas, 741'i hassas, 209'u normal olarak sınıflandırıldı; mülteci seçim bölgeleri için 1.057 sandık daha açıldı. Yani her yedi sandıktan yalnızca biri sıradan sayıldı ve üçte birden fazlası en yüksek kategoriye yerleştirildi. Bu sınıflandırma seçim otoritesinin idari bir değerlendirmesi ve oyun nerede korunması gerektiğine dair yayımlanmış en açık ölçü. Aday sayısı ile birlikte okunduğunda, bölge sandalyeleri hem daha kalabalık bir yarışa hem de daha yoğun bir güvenlik derecelendirmesine konu oluyor.", "en": "Of the 1,483 polling stations set up in the division, 533 were classed highly sensitive, 741 sensitive and 209 normal, with a further 1,057 stations serving the refugee constituencies. Only about one station in seven was treated as ordinary, and more than a third were placed in the highest category. The classification is an administrative judgement by the election authority and the clearest published measure of where it thinks the vote needs protecting. Read alongside the candidate counts, the division seats attract both a more crowded contest and a heavier security grading.", "refs": ["ajk-polls"]}, {"tr": "Bundan sonra yayımlanacak veri, komisyonun sandalye türüne göre katılım oranları. Ölçülebilir eşik şu: 30 Eylül 2026'ya kadar açıklanan rakamlarda on iki mülteci seçim bölgesinin katılımı Muzaffarabad bölgesinin belirgin biçimde altında kalırsa, sandalye başına ağırlık farkı tam da korunmak üzere tasarlanmış sandalyelerde daha da açılır ve meclisin bileşimi kendisini üreten seçmen kütlesinden uzaklaşır. Bu, seçim otoritesinin kendi tablolarından okunabilecek bir sonuç; başka bir kaynağa ihtiyaç duymuyor. Yükselen bir orta güç hikâyesi olarak okunduğunda tasarım, Pakistan'daki yerel seçim otoritesine ait: dış diplomasinin ürünü olmaktan çok iç kurumsal siyaset ve göçü, yerinden edilmeyi temsilin kalıcı bir unsuru sayıyor.", "en": "The next data to be published are the commission's turnout figures by class of seat. The measurable threshold: if figures released by 30 September 2026 show turnout in the twelve refugee constituencies falling clearly below that of Muzaffarabad division, the per-seat weighting widens precisely in the seats designed to be protected, and the assembly's composition drifts from the electorate that produced it. That conclusion can be read from the election authority's own tables and needs no other source. Read as an emerging middle power's own story, the design belongs to a local election authority in Pakistan: it is domestic institutional politics rather than the product of outside diplomacy, and it treats migration and displacement as a standing feature of representation.", "refs": ["ajk-polls"]}]}], "sources": [{"key": "ajk-polls", "kind": "news", "name": "Dawn", "url": "https://www.dawn.com/news/2020095/second-phase-of-ajk-polls-begins-in-muzaffarabad-division", "title": {"tr": "Azad Cammu ve Keşmir'de ikinci tur oylaması dokuz sandalye ve on iki mülteci seçim bölgesini kapsadı", "en": "Azad Jammu and Kashmir's second polling phase covers nine seats and twelve refugee constituencies"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-06", "title": {"tr": "1965, 1971 ve 1999'u atlatan antlaşma 2025'te durdu", "en": "The treaty that survived 1965, 1971 and 1999 stopped in 2025"}, "excerpt": {"tr": "Kwatra'nın sıraladığı kronoloji, savunduğu sonucun aleyhine çalışıyor: andığı üç savaş boyunca su düzeni işlemeyi sürdürdü. Sorulacak şey, antlaşmayı 2025'te durdurulabilir kılan değişkenin ne olduğu.", "en": "The chronology Kwatra sets out works against the conclusion it is meant to support: through the three wars he names, the water arrangement kept running. The question is what made the treaty stoppable in 2025."}, "sections": [{"h": {"tr": "Listenin içindeki kronoloji", "en": "The chronology inside the list"}, "ps": [{"tr": "Hindistan'ın Washington büyükelçisi Vinay Mohan Kwatra, Newsweek'te yazdığı yazıda 1960 tarihli İndus Suları Antlaşması'nı askıya alma kararının \"Pakistan'ın davranışının zaten yok ettiği şeyi yalnızca kabul ettiğini\" savundu. Hindistan antlaşmayı 23 Nisan 2025'te, Cammu Keşmir'in Pahalgam beldesinde 26 kişinin öldürüldüğü saldırının ardından askıya almıştı. Kwatra, Pakistan'ın antlaşmanın imzalandığı iyi niyeti yarım yüzyıl boyunca söktüğünü öne sürerek 1965, 1971 ve 1999 savaşlarını; 2001'deki parlamento baskınını, 2008 Mumbai saldırılarını, 2016'daki Uri ve Pathankot saldırılarını, 2019 Pulvama saldırısını ve 2025 Pahalgam saldırısını sıraladı.", "en": "India's ambassador to Washington, Vinay Mohan Kwatra, argued in Newsweek that the decision to hold the 1960 Indus Waters Treaty in abeyance \"merely acknowledges what Pakistan's conduct had already destroyed\". India suspended the treaty on 23 April 2025, after the attack at Pahalgam in Jammu and Kashmir that killed 26 people. Kwatra maintained that Pakistan had spent half a century dismantling the goodwill in which the treaty was signed, listing the wars of 1965, 1971 and 1999 alongside the 2001 Parliament attack, the 2008 Mumbai attacks, the 2016 Uri and Pathankot attacks, the 2019 Pulwama attack and the 2025 Pahalgam attack.", "refs": ["indus"]}, {"tr": "Liste yarım yüzyıllık bir aşınmanın kanıtı olarak sunuluyor ve aynı zamanda düzenlemenin sondan bir öncekine kadar her maddeyi atlattığını gösteriyor. Üç savaş, dört adı geçen saldırı ve su düzeni yürümeye devam etti. Böyle bir sicili taşıyan bir yapı kırılgan değil, yalıtılmıştır. Bugünün en güçlü açıklaması önce söylenmeli: bir hükümet, çok sayıda sivilin öldüğü bir saldırının ardından bir karar aldı ve bir kararı açıklamak için tarihsel bir mekanizma gerekmez. Kronolojinin eklediği şey başka bir soru: aynı karar neden 1965'te, 1971'de, 1999'da, 2002'de ya da 2019'da değil de 2025'te elverişli hâle geldi.", "en": "The list is offered as evidence of half a century of erosion, and it simultaneously shows the arrangement outlasting every entry on it until the last. Three wars, four named attacks, and the water arrangement kept working. A structure carrying that history looks insulated rather than fragile. The strongest present-day explanation should come first: a government took a decision after a mass-casualty attack, and no historical mechanism is required to explain a decision. What the chronology adds is a different question — why the same decision became available in 2025 rather than in 1965, 1971, 1999, 2002 or 2019.", "refs": ["indus"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Kwatra'nın kendi metninde adı geçen değişiklik antlaşmada değil, ona iliştirilen doktrinde. Başbakan Narendra Modi'nin aktardığı formül suyu müzakere ve ticaretle aynı cümleye yerleştiriyor: \"Terör ve müzakere bir arada yürüyemez... Terör ve ticaret bir arada yürüyemez... Su ile kan birlikte akamaz.\" Bu cümle nehri, yalıtılmış teknik bir düzenleme kategorisinden çıkarıp esirgenebilir araçlar kategorisine taşıyor. Kwatra'nın çerçevesi hamleyi tamamlıyor: askıya alma bir eylem olarak değil, bir olgunun kabulü olarak sunuluyor; devletler geçmişle sürekli görünmesini istedikleri adımları böyle anlatır. Antlaşmanın yalıtımı hiçbir zaman yalnızca metninde değildi; iki hükümetin de suyu kavganın dışında tutmasındaydı. Biri bunu bırakınca yalıtım, tek bir madde değişmeden sona eriyor. Belirleyici değişken çok daha dar ve yakın da olabilir: Pahalgam saldırısının ölçeği ve niteliği ya da görünür bir karşılık verme yönündeki iç siyasi zorunluluk; o hâlde 2025 bir kategorinin sonunu değil belirli bir krizi işaretler.", "en": "The change named in Kwatra's own text lies not in the treaty but in the doctrine attached to it. The formula he quotes from Prime Minister Narendra Modi places water in the same sentence as talks and trade: \"Terror and talks cannot go together... Terror and trade cannot go together... Water and blood cannot flow together.\" That sentence moves the river out of the category of an insulated technical arrangement and into the category of instruments that can be withheld. Kwatra's framing completes the move: abeyance is presented as the recognition of a fact rather than as an act, which is how states describe a step they want read as continuous with the past. The treaty's insulation never rested on its text alone but on both governments keeping water outside the quarrel. Once one stops doing so, the insulation ends without a single clause changing. The decisive variable may also be far narrower and more recent — the scale and character of the Pahalgam attack, or a domestic requirement to respond visibly — in which case 2025 marks a particular crisis rather than the end of a category.", "refs": ["indus"]}, {"tr": "Analojinin kırıldığı yer burası. 1965, 1971 ve 1999, iki ordunun devletlerarası savaşlarıydı; Kwatra'nın andığı 2025 tetikleyicisi ise devlet dışı aktörlere atfedilen, sivillere yönelik bir saldırı. Devletlerarası savaşı atlatmak üzere kurulmuş bir düzenleme, suçlanan tarafın sorumluluğu reddettiği ve hiçbir ateşkesin tartışmayı kapatmadığı bir atıf kavgası için tasarlanmamıştı. Eski benzetmeyi geçersiz kılan maddi koşul budur. İzlenecek şey, askıya almanın antlaşmanın tanıdığı bir biçime kavuşup kavuşmayacağı: bildirilmiş bir değişiklik ya da müzakere edilmiş bir belge mi olacak, yoksa tek tarafın öne sürdüğü bir statü olarak mı kalacak.", "en": "This is where the analogy breaks. The years 1965, 1971 and 1999 were interstate wars between two armies, while the 2025 trigger Kwatra names is an attack on civilians attributed to non-state actors. An arrangement built to survive war between states was not designed for a quarrel over attribution, in which the accused party denies responsibility and no ceasefire closes the argument. That is the material condition under which the old comparison fails. What remains to be watched is whether the abeyance ever takes a form the treaty recognises — a notified modification or a negotiated instrument — or stays a status asserted by one party.", "refs": ["indus"]}]}], "sources": [{"key": "indus", "kind": "news", "name": "The Tribune", "url": "https://www.tribuneindia.com/news/india/pakistan-made-every-effort-to-dismantle-goodwill-under-indus-water-treaty-vinay-kwatra/", "title": {"tr": "Hindistan'ın Washington büyükelçisi İndus Suları Antlaşması'nın askıda kalacağını yazdı", "en": "India's envoy to Washington writes that the Indus Waters Treaty stays in abeyance"}, "publishedDate": "2026-08-02"}], "n": 2, "radarPublishedAt": "2026-08-02T06:13:11+00:00", "date": "2026-08-02"}, {"writer": "geo-01", "title": {"tr": "Yerleşkenin dışında bir krater, Dışişleri'nde bir çağrı", "en": "A crater outside the compound, a summons inside the ministry"}, "excerpt": {"tr": "Litvanya'nın elindeki araç, Rusya'nın temsilcisini kendi bakanlığına çağırmaktan ibaret. Bu araç, kendisini kullanan kapının ötesine geçmiyor.", "en": "The instrument Lithuania holds is a summons of Russia's representative to its own ministry. That instrument does not travel past the door that uses it."}, "sections": [{"h": {"tr": "Gecenin bıraktığı", "en": "What the night left"}, "ps": [{"tr": "Kiev'deki Litvanya elçiliğinin yerleşkesinin hemen dışında bir füze krateri var. Dışişleri Bakanı Kestutis Budrys elçiliğin hasar gördüğünü açıkladı; füzeler binadan yalnızca metrelerce ötede patladı ve elçilik personelinden yaralanan olmadı. Ukrayna Dışişleri Bakanı Andrii Sibiha hasarı sınırlı diye tanımladı.", "en": "A missile crater sits just outside the compound of Lithuania's embassy in Kyiv. Foreign Minister Kestutis Budrys said the embassy had been damaged; the missiles came down only metres from the building, and no embassy staff were injured. Ukraine's foreign minister, Andrii Sybiha, called the damage limited.", "refs": ["lt-embassy"]}, {"tr": "Aynı gece kentin geri kalanında bilanço başkaydı: Kiev'e yönelik balistik füze saldırısında en az dokuz kişi öldü ve 33 kişi yaralandı. Atılan 27 balistik füzeden yalnızca biri düşürüldü. Elçiliğin aldığı hasar, o gecenin en küçük kalemiydi.", "en": "In the rest of the city that same night the ledger read differently: at least nine people were killed and 33 wounded in the ballistic missile attack on Kyiv. Of the 27 ballistic missiles fired, only one was brought down. The damage to the embassy was the smallest item of the night.", "refs": ["kyiv-strike"]}]}, {"h": {"tr": "Bir çağrının menzili", "en": "The reach of a summons"}, "ps": [{"tr": "Litvanya'nın seçtiği araç belli: Dışişleri Bakanlığı, Rusya'nın Vilnius'taki diplomatik temsilcisini cumartesi günü bakanlığa çağıracağını duyurdu. Bu aracın ürettiği şey, Litvanya'nın kendi binasında iletilen resmî bir itirazdır. Bir yaptırım kararı, bir denetim yetkisi ya da bir süre sınırı içermez.", "en": "The instrument Lithuania chose is plain: the foreign ministry announced it would summon Russia's diplomatic representative in Vilnius to the ministry on Saturday. What that instrument produces is a formal protest delivered inside Lithuania's own building. It carries no designation, no inspection power and no deadline.", "refs": ["lt-embassy"]}, {"tr": "Bu tercihin iki okuması var. Litvanya Dışişleri Bakanlığı somut bir tedbiri AB ortaklarıyla eşgüdüme saklıyor olabilir ve dar adım bilinçli olabilir. Daha yalın ihtimal ise, tek başına hareket eden bir devletin elindeki araçların gerçekten bundan ibaret olmasıdır. İkisini ayırt edecek şey, çağrının ardından adı konmuş bir tedbirin gelip gelmediğidir.", "en": "There are two readings of that choice. Lithuania's foreign ministry may be holding a concrete measure back for coordination with EU partners, in which case the narrow step is deliberate. The plainer possibility is that this is genuinely the extent of what a state acting alone holds. What separates the two is whether a named measure follows the summons.", "refs": ["lt-embassy"]}]}, {"h": {"tr": "Neyin karşılığı var", "en": "What has a counterpart"}, "ps": [{"tr": "Bir itirazın değeri, sonradan başka bir aracın ona dayanıp dayanmadığına bağlıdır. Diplomatik dosyaya giren bir protesto, tazminat talebine, listeye alma kararına ya da bir izleme mekanizmasına gerekçe olabilir; olmazsa tek bir geceye ait bir belge olarak kalır. Aynı gece Kiev'de sonucu belirleyen araç fizikseldi: 27 balistik füzeden yalnızca birinin düşürülmüş olması.", "en": "A protest is worth what some later instrument makes of it. A protest entered into the diplomatic file can become the basis for a claim, a listing decision or a monitoring mechanism; if it does not, it stays a document about one night. In Kyiv the instrument that decided the outcome that night was physical: only one of 27 ballistic missiles was brought down.", "refs": ["lt-embassy", "kyiv-strike"]}, {"tr": "Buradan izlenebilir bir sınama çıkıyor. Litvanya ya da AB tarafından yayımlanan resmî bir belgede elçiliğin gördüğü hasar bir listeye alma ya da tazminat talebinin gerekçesi olarak anılmazsa, yanıtın tamamı temsilcinin bakanlığa çağrılmasından ibaret kalmış olacaktır.", "en": "That yields an observable test. If no official Lithuanian or EU document cites the damage the embassy took as grounds for a listing or a claim, then the whole of the response will have been the summoning of a representative to a ministry.", "refs": ["lt-embassy"]}]}], "sources": [{"key": "lt-embassy", "kind": "news", "name": "LRT", "url": "https://www.lrt.lt/en/news-in-english/19/3008045/lithuanian-embassy-in-kyiv-damaged-in-russian-missile-attack", "title": {"tr": "Litvanya, Kiev'deki elçiliği hasar görünce Rusya'nın temsilcisini Dışişleri'ne çağırdı", "en": "Lithuania summons Russia's representative after missiles damage its embassy in Kyiv"}, "publishedDate": "2026-08-01"}, {"key": "kyiv-strike", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-02", "title": {"tr": "Tahran Maskat hattını kabul ediyor, ötekini reddediyor", "en": "Tehran acknowledges the Muscat track and denies the other one"}, "excerpt": {"tr": "Tek bir duyurunun içinde iki ayrı müzakere hattı var. Tahran bunlardan yalnızca birini sahipleniyor; saldırıların durdurulması ise öbürüne dayandırıldı.", "en": "One announcement contains two separate negotiating tracks. Tehran claims only one of them, while the halt in strikes was attributed to the other."}, "sections": [{"h": {"tr": "İki hat, tek duyuru", "en": "Two tracks, one announcement"}, "ps": [{"tr": "Başkan Donald Trump, planlanan saldırıyı bir anlaşmanın çerçevesi üzerinde uzlaşıldığı gerekçesiyle durdurduğunu ve bunun Hürmüz Boğazı'nın açılmasını kapsadığını bildirdi. Duyuru bir sosyal medya paylaşımıyla yapıldı; taraflarca imzalanmış bir metin ortaya konmadı.", "en": "President Donald Trump said he had halted the planned strike on the grounds that the perimeters of a deal had been agreed, and that this included the opening of the Strait of Hormuz. The announcement was made in a social media post; no text signed by the parties was produced.", "refs": ["trump-cancel"]}, {"tr": "Tahran'dan gelen ilk açıklama bu duyuruyu doğrulamıyor, ama başka bir masayı doğruluyor. Dışişleri Bakanı Abbas Arakçi, Umman'la Hürmüz Boğazı'na ilişkin müzakerelerin sonuçlandırılma yolunda olduğunu söyledi; Sözcü İsmail Bakai iki tarafın \"her iki tarafça kabul edilebilir bir güzergâh üzerinde bir mutabakata\" doğru ilerlediğini belirtti. Bu hattın da yayımlanmış bir metni yok.", "en": "The first statement out of Tehran does not confirm that announcement, but it does confirm a different table. Foreign Minister Abbas Araghchi said negotiations with Oman over the Strait of Hormuz were on the way to being finalised, and spokesperson Esmail Baghaei said the two sides were moving toward \"an understanding on a route acceptable to both sides\". That track has no published text either.", "refs": ["oman-talks"]}, {"tr": "İkinci açıklama ise doğrudan bir yalanlama. Mehr ajansı, askerî yetkililere dayanarak İran'ın saldırıların durdurulmasını istediği iddiasını \"yeni bir yalandan başka bir şey değil\" diye nitelendirdi. Fars ajansı, müzakere heyetinden bir üyeye dayanarak Hürmüz'de uzlaşı sağlandığı haberini asılsız buldu ve ABD'nin eylemleri sürdükçe boğazın kapalı kalacağını aktardı. Bu yalanlamalar bağımsız biçimde doğrulanmadı.", "en": "The second statement is a flat denial. The Mehr agency, citing military officials, called the claim that Iran had asked for the strikes to be halted \"nothing but a new lie\". The Fars agency, citing a member of the negotiating team, dismissed the report of a compromise over Hormuz as false and carried a statement that the strait would stay closed while US actions continued. These denials have not been independently verified.", "refs": ["iran-denial"]}]}, {"h": {"tr": "Kimin neyi kabul ettiği", "en": "What each side has accepted"}, "ps": [{"tr": "Bu soru bugünün erken saatlerinde bu köşede zaten sorulmuştu: çerçeveyi kim kabul etti ve nerede yazılı? İran tarafı o soruyu, çerçeveyi reddederek yanıtladı. Bir anlaşmanın varlığı için iki tarafın da onu tanıması gerekir; şu ana kadar tanıyan bir taraf var.", "en": "That question was already put in this column earlier today: who accepted the perimeters, and where is that written? The Iranian side answered that question by rejecting the framework. An agreement exists when both parties acknowledge it; so far one party does.", "refs": ["history-one", "iran-denial"]}, {"tr": "Tahran'ın iki açıklaması birbiriyle çelişmek zorunda değil; farklı hatları tarif ediyor olabilirler. Umman arabuluculuğundaki geçiş düzenlemesi Tahran'ın sahiplendiği hat, Washington'un tarif ettiği ikili pazarlık ise reddettiği hattır. Daha zayıf ama mümkün bir okuma da var: yalanlamalar iç kamuoyuna dönük bir duruş olabilir ve aynı mutabakat sessizce yürüyor olabilir.", "en": "Tehran's two statements need not contradict each other; they may describe different tracks. The transit arrangement mediated by Oman is the track Tehran claims, while the bilateral bargain Washington describes is the track it denies. A weaker but possible reading also exists: the denials may be a posture for a domestic audience while the same understanding proceeds quietly.", "refs": ["iran-denial", "oman-talks"]}, {"tr": "Bu iki okumayı ayıracak olan şey bir güzergâhtır. Maskat ya da Tahran, önümüzdeki altı hafta içinde geçişin hangi hattan ve kimin izniyle yapılacağını adıyla açıklarsa, sahiplenilen hattın gerçekten var olduğu görülebilir. Böyle bir açıklama gelmezse elde yalnızca duyuru kalır ve bunun bir denge sayılması güçleşir. Dengenin kurulduğunu söylemek için henüz erken olabilir.", "en": "What separates those two readings is a route. If Muscat or Tehran names, within the next six weeks, the line on which transit will run and the authority that clears it, then the acknowledged track may be seen to have been real. If no such statement comes, the announcement is all that remains, and calling it a balance becomes difficult. It may still be too early to say a balance has been struck.", "refs": ["oman-talks", "trump-cancel"]}]}], "sources": [{"key": "iran-denial", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/iran-denies-it-asked-trump-not-to-strike-or-agreed-to-deal-to-split-control-of-hormuz/", "title": {"tr": "İran ajansları, Tahran'ın saldırıların durdurulmasını istediğini ve Hürmüz'de uzlaşıldığını yalanladı", "en": "Iranian agencies deny that Tehran asked for a halt to US strikes or agreed a Hormuz deal"}, "publishedDate": "2026-08-02"}, {"key": "oman-talks", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "title": {"tr": "Arakçi, İran'ın Umman'la Hürmüz görüşmelerinin son aşamada olduğunu söyledi", "en": "Araghchi says Iran's talks with Oman on the Strait of Hormuz are in their final stages"}, "publishedDate": "2026-08-02"}, {"key": "trump-cancel", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/trump-cancels-iran-strike-says-deal-perimeters-reached", "title": {"tr": "Trump, anlaşmanın çerçevesinde uzlaşıldığını söyleyerek İran'a saldırıyı iptal ettiğini açıkladı", "en": "Trump says he has cancelled the strike on Iran, citing agreed 'perimeters of a deal'"}, "publishedDate": "2026-08-02"}, {"key": "history-one", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-08-02/2/", "title": {"tr": "Çerçeveyi kim kabul etti, nerede yazılı?", "en": "Who agreed to the perimeters, and where is that written?"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-03", "title": {"tr": "Bombardıman uçaklarının üssü menzilde; attıkları füzeler değil", "en": "The bombers' base is in range; the missiles they fired are not"}, "excerpt": {"tr": "Ukrayna 600 kilometre öteye vurabiliyor. Kiev üzerindeki 27 balistik füzeden yalnızca birini düşürebildi. Bu iki sayı aynı savaşın iki ayrı defterinde duruyor.", "en": "Ukraine can strike 600km away. It brought down one of the 27 ballistic missiles over Kyiv. Those two numbers sit in two different ledgers of the same war."}, "sections": [{"h": {"tr": "Menzil", "en": "Reach"}, "ps": [{"tr": "Zelenskiy, gece boyunca yapılan saldırılarda Saratov bölgesindeki Engels havaalanının ve bir petrol rafinerisinin vurulduğunu söyledi; her ikisi de Ukrayna sınırından yaklaşık 600 kilometre uzakta. Kaluga bölgesinde bir petrol deposu da hedef alındı. Ukrayna ordusu havaalanında yangın çıktığını bildirdi.", "en": "Zelensky said overnight strikes hit the Engels airfield and an oil refinery in the Saratov region, both about 600km from the Ukrainian border. An oil depot in the Kaluga region was also struck. The Ukrainian military said a fire broke out at the airfield.", "refs": ["engels"]}, {"tr": "Hedefin niteliği önemli. Ukrayna ordusuna göre Engels, Rusya'nın stratejik havacılığının ana üslerinden biri ve Tu-95MC ile Tu-160 bombardıman uçakları Ukrayna'ya füze atmak için burayı düzenli olarak kullanıyor. Rusya sekiz kişinin öldüğünü ve 635 insansız hava aracının düşürüldüğünü açıkladı; bu sayılar Rusya'nın kendi beyanıdır. Saratov Valisi Roman Busargin, Saratov ve Engels'te sivil altyapının zarar gördüğünü kabul etti ve iki kişinin öldüğünü söyledi.", "en": "The nature of the target matters. According to the Ukrainian military, Engels is one of the main bases of Russia's strategic aviation and Tu-95MC and Tu-160 bombers regularly use it to launch missiles at Ukraine. Russia said eight people were killed and 635 drones were shot down; those counts are Russia's own statement. Saratov's governor, Roman Busargin, admitted damage to civilian infrastructure in Saratov and Engels and said two people had been killed.", "refs": ["engels"]}]}, {"h": {"tr": "Aynı savaşın öbür defteri", "en": "The other ledger of the same war"}, "ps": [{"tr": "Savunma tarafındaki sayı başka bir şey söylüyor. Kiev'e yönelik saldırıda 27 balistik füze atıldı ve bunlardan yalnızca biri düşürüldü; en az dokuz kişi öldü, 33 kişi yaralandı. Bir üssü vurmak, o üsten daha önce kalkmış bir salvoyu durdurmaz.", "en": "The number on the defensive side says something else. 27 ballistic missiles were fired at Kyiv and only one of them was brought down; at least nine people were killed and 33 wounded. Striking a base does not stop a salvo that has already left it.", "refs": ["kyiv-strike"]}, {"tr": "Engels'e yapılan saldırı, füze üretim ve fırlatma döngüsüne maliyet yükler; Kiev'in üzerindeki füzeleri etkilemez. Bunun en olası açıklaması, iki tarafın birbirinden bağımsız iki kabiliyeti tüketmesidir: biri uzun menzilli taarruz, öbürü önleme stoku. Daha zayıf ama ihmal edilemez bir açıklama daha var: düşük önleme oranı stok darlığından çok salvonun profilinden ve hedef seçiminden kaynaklanıyor olabilir.", "en": "The strike on Engels imposes cost on the cycle that produces and launches missiles; it does not touch the missiles already over Kyiv. The most likely explanation is that the two sides are consuming two independent capabilities: long-range strike on one side, interceptor stock on the other. A weaker but not negligible explanation exists too: the low interception rate may come more from the salvo's profile and aim points than from a shortage of stock.", "refs": ["kyiv-strike", "engels"]}]}, {"h": {"tr": "Önce hangisi tükenir", "en": "Which one runs out first"}, "ps": [{"tr": "Bu karşılıklı vuruşmayı kazanacak taraf, deposu önce boşalmayan taraftır. Ukrayna'nın taarruz kabiliyeti kendi ürettiği araçlara dayanıyor, önleme kabiliyeti ise dışarıdan gelen tedariğe. İki depodan yalnızca biri ülke içinde doldurulabiliyor; öbürü azaldığında bedeli şehirler ödüyor.", "en": "The side that wins this exchange is the side whose magazine does not empty first. Ukraine's strike capability rests on what it builds itself, while its interception capability rests on supply from outside. Only one of those two magazines can be refilled at home, and when the other runs low the cost is paid by cities.", "refs": ["engels", "kyiv-strike"]}, {"tr": "Sınama açık. Önleyici tedariğinde bir değişiklik olmazsa, benzer büyüklükteki bir sonraki salvoda Kiev üzerindeki balistik önleme oranı sıfıra yakın kalacaktır. İzlenecek gösterge, 25 ve üzeri balistik füzeyle yapılan bir sonraki saldırı için Ukrayna'nın açıkladığı önleme oranıdır.", "en": "The test is plain. If nothing changes in interceptor supply, the ballistic interception rate over Kyiv will stay near zero in the next salvo of comparable size. The indicator to watch is the interception rate Ukraine publishes for the next attack involving 25 or more ballistic missiles.", "refs": ["kyiv-strike"]}]}], "sources": [{"key": "engels", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c998gg5pe09o", "title": {"tr": "Ukrayna, Engels havaalanı ile Saratov rafinerisini vurduğunu bildirdi; Rusya sekiz ölü açıkladı", "en": "Ukraine says it hit the Engels airfield and a Saratov refinery; Russia reports eight deaths"}, "publishedDate": "2026-08-02"}, {"key": "kyiv-strike", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "title": {"tr": "Kiev'e düzenlenen balistik füze saldırısında en az dokuz kişi öldü", "en": "At least nine killed in a ballistic missile attack on Kyiv"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-04", "title": {"tr": "Bir hafta önce değişen sicil, iki saat süren bir arama", "en": "A registry changed a week earlier, a boarding that lasted two hours"}, "excerpt": {"tr": "Toa Payoh'un beyan ettiği bayrak Kamerun'du. Pantelleria açıklarındaki arama iki saat sürdü ve geriye incelenecek belgeler bıraktı.", "en": "The flag the Toa Payoh declared was Cameroon's. The boarding off Pantelleria took two hours and left documentation to be reviewed."}, "sections": [{"h": {"tr": "Sicil, güzergâh, saat", "en": "Registry, route, clock"}, "ps": [{"tr": "Tanker 16 Temmuz'da Benin'in Cotonou limanından ayrıldı ve İstanbul'a gidiyordu. Pazar sabahı, Sicilya ile Tunus arasındaki Pantelleria'nın batısında, uluslararası sularda durduruldu. Beyan ettiği bayrak Kamerun'du.", "en": "The tanker left Cotonou in Benin on 16 July, bound for Istanbul. On Sunday morning it was stopped in international waters west of Pantelleria, the island between Sicily and Tunisia. The flag it declared was Cameroon's.", "refs": ["toa-payoh"]}, {"tr": "Operasyonun mekaniği şöyle: arama ekibi İtalyan savaş gemisi Thaon di Revel'den helikopterle indi, bir Yunan gemisi ile bir Polonya devriye uçağı destek verdi, iş yaklaşık iki saat sürdü. İtalya Savunma Bakanlığı'na göre tankerin kaptanı başlangıçta istenen iş birliğini göstermedi. Dayanak, bir savaş gemisinin ticaret gemisinin tabiiyetini denetlemesine izin veren BM Deniz Hukuku Sözleşmesi'nin 110. maddesiydi.", "en": "The mechanics ran like this: the boarding party came down by helicopter from the Italian warship Thaon di Revel, a Greek vessel and a Polish patrol aircraft gave support, and the work took about two hours. According to Italy's defence ministry the tanker's master initially did not provide the cooperation requested. The basis was Article 110 of the UN Convention on the Law of the Sea, which allows a warship to check a merchant ship's nationality.", "refs": ["toa-payoh"]}, {"tr": "Operasyonun ürettiği şey bilgi ve belge; İtalyan makamları bunları hâlâ inceliyor. Savunma Bakanı Guido Crosetto aramayı \"İtalya'nın Akdeniz güvenliğine ve Avrupa Birliği'nin eylemine katkısının somut bir göstergesi\" diye nitelendirdi. Irini'nin kendisi 2020'de Libya silah ambargosu için kurulmuştu; doğrulama aramaları görev alanına sonradan eklendi.", "en": "What the operation produced is information and documentation, and Italian authorities are still reviewing it. Defence Minister Guido Crosetto called it \"a concrete demonstration of Italy's contribution to the security of the Mediterranean and to the European Union's action\". Irini itself was set up in 2020 for the Libya arms embargo; verification boardings were added to its remit later.", "refs": ["toa-payoh"]}]}, {"h": {"tr": "Bayrağın fiyatı", "en": "What a flag costs"}, "ps": [{"tr": "Sayıları yan yana koyunca darboğazın yeri görünür hâle geliyor: bir sicil kısa sürede değiştirilebiliyor, bir arama iki saat sürüyor ve sonunda elde belge kalıyor. Kısıtlanan şey deniz yolundan çok geminin hangi devletin defterine yazıldığıdır. Bunun makul bir karşı okuması var: arama baştan delil toplamak için tasarlanmış olabilir ve geminin yoluna devam etmesi bir sınır değil, planın kendisi olabilir.", "en": "Set the numbers side by side and the place of the bottleneck becomes visible: a registry can be changed quickly, a boarding takes two hours, and what is left at the end is documentation. What is being restricted is less the sea lane than which state's books the ship is written into. There is a reasonable counter-reading: the boarding may have been designed from the outset to gather evidence, and the ship carrying on may be the plan rather than a limit.", "refs": ["toa-payoh"]}, {"tr": "Kamerun bayrağı, Umman'ın güney kıyısı açıklarında haziran ayından beri mahsur duran Caroline Bezengi'nin de üzerinde. AP'nin incelediği uydu görüntülerine göre gemiden yaklaşık 20 kilometrekarelik bir petrol tabakası yayıldı ve 31 Temmuz itibarıyla ham petrol kıyıya ulaştı. Umman geminin ve yükünün 23 Temmuz'a kadar kaldırılmasını istemişti; bu talimata uyulup uyulmadığı belirsiz. İki gemide de ortak kısıt aynı: yetkisi olanın elinde gemi yok.", "en": "The Cameroon flag is also on the Caroline Bezengi, stranded off Oman's southern coast since June. Satellite images reviewed by the AP show an oil sheen of roughly 20 square kilometres spreading from the ship, with crude reaching the shore as of 31 July. Oman ordered the vessel and its cargo removed by 23 July; whether that order was met is not clear. On both ships the shared constraint is the same: whoever holds the authority does not hold the vessel.", "refs": ["bezengi"]}, {"tr": "Bu yüzden rejimin maliyeti tutulan tonajda değil, yeniden bayraklandırmada görünür. Sınama da basit: İtalyan makamları Toa Payoh'tan alınan belgeleri eylül sonuna kadar ulusal bir el koyma işlemine dönüştürürse, doğrulama aramasının arkasında bir yaptırım var demektir. Dönüştürmezse, kalıcı olan tek maliyet geminin sicil değiştirmesidir.", "en": "So the cost of the regime shows up in re-registration rather than in detained tonnage. The test is simple enough: if Italian authorities turn the documentation taken from the Toa Payoh into a national seizure by the end of September, then there is enforcement behind the verification boarding. If they do not, the only lasting cost is the ship changing its registry.", "refs": ["toa-payoh", "bezengi"]}]}], "sources": [{"key": "toa-payoh", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/02/italian-navy-boards-tanker-from-russian-shadow-fleet", "title": {"tr": "AB deniz görev gücü, yaptırım listesindeki Toa Payoh tankerine Pantelleria açıklarında çıktı", "en": "An EU naval mission boards the sanctioned tanker Toa Payoh off Pantelleria"}, "publishedDate": "2026-08-02"}, {"key": "bezengi", "kind": "news", "name": "Fox News", "url": "https://www.foxnews.com/world/satellite-images-show-evidence-oil-leak-spreading-sanctioned-vessel-near-oman", "title": {"tr": "Uydu görüntüleri, Umman açıklarındaki yaptırımlı tankerden yayılan petrol tabakasını gösteriyor", "en": "Satellite images reviewed by AP show a spreading oil sheen from a sanctioned tanker off Oman"}, "publishedDate": "2026-08-02"}], "n": 3, "radarPublishedAt": "2026-08-02T20:16:52+00:00", "date": "2026-08-02"}, {"writer": "geo-05", "title": {"tr": "Kavşaktaki kalabalık korunma istemeye gelmişti", "en": "The crowd at the intersection had come to ask for protection"}, "excerpt": {"tr": "Kabal'da bomba patladığında yakındaki kavşakta yüzlerce kişi hükümetten şiddete karşı adım istiyordu. Talep de saldırı da aynı kuruma yöneldi.", "en": "When the bomb went off in Kabal, hundreds of people at a nearby intersection were asking the government to act against the violence. The demand and the attack landed on the same institution."}, "sections": [{"h": {"tr": "Kavşak", "en": "The intersection"}, "ps": [{"tr": "Pazar akşamı Hayber Pahtunhva'nın Kabal ilçesinde patlama olduğunda, yakındaki kavşakta yüzlerce gösterici toplanmıştı. Talepleri açıktı: hükümet bölgede tırmanan şiddete karşı adım atsın. Bomba bu kalabalığın hemen yanında patladı.", "en": "When the explosion happened on Sunday evening in the Kabal area of Khyber Pakhtunkhwa, hundreds of demonstrators had gathered at a nearby intersection. Their demand was plain: that the government act against the escalating violence in the region. The bomb went off right beside that crowd.", "refs": ["swat"]}, {"tr": "Swat Emniyet Müdür Yardımcısı Fida Hüseyin en az 14 kişinin öldüğünü ve 22 kişinin yaralandığını bildirdi. İlçe Emniyet Amiri Ömer Han'a göre saldırgan karakolun girişindeydi ve polisler onu aramaya çalışırken bombayı patlattı. Saldırıyı üstlenen çıkmadı.", "en": "Swat Deputy Inspector General Fida Hussain said at least 14 people were killed and 22 wounded. According to District Police Officer Umar Khan, the attacker was at the entrance of the police station and detonated as officers tried to search him. No group claimed responsibility.", "refs": ["swat"]}]}, {"h": {"tr": "Eyaletin kendi sayısı", "en": "The province's own count"}, "ps": [{"tr": "Kalabalığın neden orada olduğunu eyaletin kendi rakamları anlatıyor. Pakistan Çatışma ve Güvenlik Çalışmaları Enstitüsü araştırmacıları, temmuz ayında eyalette terörle bağlantılı olarak sınıflandırdıkları 154 ölüm saptadı; bu, haziran rakamının iki katından fazla.", "en": "Why the crowd was there is told by the province's own figures. Researchers at the Pakistan Institute for Conflict and Security Studies recorded 154 deaths in the province during July that they classify as terrorism-related, more than double the June figure.", "refs": ["swat"]}, {"tr": "Talebin muhatabı ile saldırının hedefi aynı kurumdu. Kavşaktakiler eyalet güvenlik aygıtından korunma isterken, o aygıt kendi kapısında bir kişiyi ararken vuruldu. Bu örtüşmenin başka bir açıklaması da mümkün: göstericilerin yakınlığı saldırganın yer seçiminin nedeni olmayabilir ve hedef baştan karakolun kendisi olabilir.", "en": "The institution the demand was addressed to and the institution the attack hit were the same one. The people at the intersection were asking the provinc
