ber meeting has to answer", "tr": "Eylül toplantısının cevaplaması gereken soru"}, "ps": [{"en": "The declaration also wrote its own test: a joint ministerial meeting on Jerusalem will be held in New York in September. The question to be answered there is not merely whether the mechanism has produced documents. To which body, in what capacity and with what request the documents are submitted will also be settled there. Today's text does not answer that, and its silence is not a failing; what a widening table can agree on in a first round is usually procedure.", "refs": ["amman"], "tr": "Bildiri kendi sınavını da yazdı: eylülde New York'ta Kudüs gündemli ortak bir bakanlar toplantısı yapılacak. O toplantıda cevaplanacak soru, düzeneğin belge üretip üretmediğinden ibaret değil. Üretilen belgenin hangi kuruma, hangi sıfatla ve hangi talep ile sunulacağı da orada belli olacak. Bu sorunun cevabı bugünkü metinde yok ve bulunmaması bildirinin bir eksiği sayılmaz; genişleyen bir masanın ilk turda üzerinde anlaşabildiği şey genellikle usuldür."}]}], "sources": [{"key": "amman", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/5/arab-and-muslim-ministers-launch-plan-to-protect-jerusalem-religious-sites", "title": {"tr": "Arap ve Müslüman ülkelerin dışişleri bakanları Amman'da Kudüs için kalıcı bir belgeleme düzeneği kurdu", "en": "Arab and Muslim foreign ministers set up a standing mechanism in Amman to document Jerusalem measures"}, "publishedDate": "2026-08-05"}, {"key": "gecmis-kudus", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-08-05/", "title": {"tr": "Masaya dört ülke daha çağrıldı, bağlayıcı metin hâlâ ikili", "en": "Four more states were called to the table, and the binding text is still bilateral"}, "publishedDate": "2026-08-05"}], "title": {"en": "Why did a wider table leave the claim of jurisdiction as narrow as before?", "tr": "Masa genişlerken yetki iddiası neden aynı dar çerçevede kaldı?"}, "writer": "geo-02", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "Wartime production checks at factories, a supply-escort drill run by the navy and the coast guard, and a measure of round-the-clock defence sit in the same programme. Those three items show which problem the exercise was designed around.", "tr": "Fabrikalarda savaş dönemi üretim denetimi, deniz kuvvetleri ile sahil güvenliğin ikmal refakati provası ve kesintisiz savunma ölçütü aynı programda duruyor. Bu üç kalem, tatbikatın hangi soruna göre kurgulandığını gösteriyor."}, "sections": [{"h": {"en": "What the programme contains", "tr": "Programda ne var"}, "ps": [{"en": "Taiwan's annual Han Kuang exercise began on Wednesday and runs to August 14. This year's programme includes decentralised command that pushes decisions to the field, combined reconnaissance and strike drone operations, naval and coast guard supply-escort simulations, wartime production checks at factories, urban resilience drills in central and northern regions, and a 30 minute slowdown of mobile internet during air raid drills.", "refs": ["hankuang"], "tr": "Tayvan'ın yıllık Han Kuang tatbikatı çarşamba günü başladı ve 14 Ağustos'a kadar sürecek. Bu yılki program, kararı sahaya bırakan merkezsiz komuta yapısını, keşif ve saldırı insansız hava araçlarını birleştiren harekâtı, deniz kuvvetleri ile sahil güvenliğin ikmal refakati provalarını, fabrikalarda savaş dönemi üretim denetimlerini, orta ve kuzey bölgelerde kentsel dayanıklılık tatbikatlarını ve hava saldırısı provaları sırasında mobil internetin 30 dakika yavaşlatılmasını içeriyor."}, {"en": "Troops and reservists practise responses to an attack on the island, and the drills test the army's ability to sustain round-the-clock defence and to counter what Taipei calls China's gray-zone tactics. A senior defence official said it had been constantly emphasised that the exercise must be \"closer to real combat scenarios\". Chinese fighter jets and warships operate around the island on an almost daily basis.", "refs": ["hankuang"], "tr": "Askerler ve yedekler adaya yönelik bir saldırıya karşı senaryolar uyguluyor; provalar ordunun kesintisiz savunmayı sürdürme ve Taipei'nin gri bölge taktikleri dediği Çin uygulamalarına karşı koyma kabiliyetini sınıyor. Üst düzey bir savunma yetkilisi, tatbikatın \"gerçek muharebe senaryolarına daha yakın\" olması gerektiğinin sürekli vurgulandığını söyledi. Çin savaş uçakları ve savaş gemileri ada çevresinde neredeyse her gün faaliyet gösteriyor."}]}, {"h": {"en": "Which problem the chosen items point to", "tr": "Seçilen kalemler hangi sorunu işaret ediyor"}, "ps": [{"en": "The components of an exercise usually show which problem an army is trying to solve more clearly than its statements do. Supply escort, factory production checks and the measure of round-the-clock defence sit on the same axis: the problem of getting something to the island and keeping it coming. That combination gives priority to making an engagement sustainable rather than to winning the first one.", "refs": ["hankuang"], "tr": "Bir tatbikatın bileşenleri, ordunun hangi soruyu çözmeye çalıştığını genellikle açıklamalarından daha açık gösterir. İkmal refakati, fabrika üretim denetimi ve kesintisiz savunma ölçütü aynı eksende duruyor: adaya bir şey ulaştırma ve ulaştırmayı sürdürme sorunu. Bu bileşim, ilk çarpışmayı kazanmaktan çok, çarpışmayı sürdürülebilir kılmayı önceliyor."}, {"en": "Decentralised command and the internet slowdown drill build the same assumption twice: that connectivity will be cut or degraded. Pushing the decision to the field is preparation for a loss scenario rather than a gain in capability. The measure of a defence conducted under degraded communications is duration, not tempo.", "refs": ["hankuang"], "tr": "Merkezsiz komuta ile internet yavaşlatma provası aynı varsayımı iki kez kuruyor: bağlantının kesileceği veya bozulacağı varsayımı. Kararı sahaya bırakmak, bir kabiliyet kazanımından çok bir kayıp senaryosuna hazırlıktır. Kesintili haberleşme altında yürütülen bir savunmanın ölçüsü de tempo değil, süredir."}]}, {"h": {"en": "What becomes testable when the exercise closes", "tr": "Tatbikat kapandığında sınanabilir olan"}, "ps": [{"en": "Defence Minister Wellington Koo said the military would \"continue to train diligently and intensively, so that we are fully prepared in peacetime\". What that sentence is worth can be measured on August 14. If the ministry publishes how long units sustained the defence without central direction, the sustainment claim rests on testable data. If only participation figures are released, the exercise will not have produced its own measure.", "refs": ["hankuang"], "tr": "Savunma Bakanı Wellington Koo, ordunun \"barış zamanında tam hazır olmak için özenle ve yoğun biçimde eğitim almayı\" sürdüreceğini söyledi. Bu cümlenin karşılığı 14 Ağustos'ta ölçülebilir. Bakanlık, birliklerin merkezî yönlendirme olmadan savunmayı ne kadar süre sürdürdüğünü yayımlarsa, sürdürülebilirlik iddiası sınanabilir bir veriye dayanır. Yalnızca katılım sayıları açıklanırsa, tatbikat kendi ölçütünü üretmemiş olur."}]}], "sources": [{"key": "hankuang", "kind": "news", "name": "Arab News", "url": "https://www.arabnews.com/node/2653452/world", "title": {"tr": "Tayvan'ın Han Kuang tatbikatı 10 gün boyunca gerçek muharebeye yakın senaryolarla başladı", "en": "Taiwan's Han Kuang exercise opens for 10 days of combat-realistic scenarios"}, "publishedDate": "2026-08-05"}], "title": {"en": "The real test of the ten-day exercise sits in the supply line", "tr": "On günlük tatbikatın asıl sınavı ikmal hattında"}, "writer": "geo-03", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "The United States has no active tungsten mines, and the processing of black mass takes place largely in Asia. The obligation to sell at home lands squarely between those two facts.", "tr": "Amerika Birleşik Devletleri'nde faal tungsten madeni yok ve öğütülmüş pil karışımının işlenmesi büyük ölçüde Asya'da yapılıyor. Yurt içi satış zorunluluğu tam da bu iki olgunun arasına düşüyor."}, "sections": [{"h": {"en": "What the rule covers", "tr": "Kural ne kapsıyor"}, "ps": [{"en": "The Bureau of Industry and Security has announced a one-year ban on exports of black mass, the shredded output of used lithium-ion batteries, and of tungsten scrap used in defence applications. Sellers must supply domestic buyers unless they obtain an exception, and the restriction takes effect later this month. The material carries lithium, cobalt, nickel, manganese and graphite.", "refs": ["hurda"], "tr": "Sanayi ve Güvenlik Bürosu, kullanılmış lityum iyon pillerin öğütülmesiyle elde edilen ve sektörde \"black mass\" denen karışımın ve savunma sanayisinde kullanılan tungsten hurdasının ihracatına bir yıllık yasak getirdi. Satıcılar, istisna almadıkları sürece yurt içindeki alıcılara satmak zorunda; kısıtlama bu ayın ilerleyen günlerinde yürürlüğe girecek. Söz konusu karışım lityum, kobalt, nikel, manganez ve grafit taşıyor."}, {"en": "President Donald Trump directed the commerce department to draft the restrictions, citing an \"inadequate supply\" of certain metals that \"poses an increasing risk to our national defense and security\". The European Union plans comparable restrictions on black mass exports from November 2026. The pricing agency Argus described the measures as unprecedented in recent US history.", "refs": ["hurda"], "tr": "Başkan Donald Trump, belirli metallerdeki \"yetersiz arzın\" \"ulusal savunmamız ve güvenliğimiz için artan bir risk oluşturduğunu\" belirterek ticaret bakanlığına kısıtlamaları hazırlaması talimatını verdi. Avrupa Birliği, Kasım 2026'dan itibaren benzer bir ihracat kısıtlaması uygulamayı planlıyor. Fiyatlandırma kuruluşu Argus, bu adımları ABD'nin yakın tarihinde eşi görülmemiş diye niteledi."}]}, {"h": {"en": "The gap between the obligation and the capacity", "tr": "Zorunluluk ile kapasite arasındaki aralık"}, "ps": [{"en": "The first effect of an export ban shows up not in where the material goes but in whose hands it stays. If the processing takes place largely in Asia, an obligation to sell at home redirects ownership first and treatment later. What can be expected in the short run is inventory accumulating in front of the domestic buyer, and the price of that inventory, rather than a rise in refined tungsten output.", "refs": ["hurda"], "tr": "Bir ihracat yasağının ilk etkisi malın nereye gittiğinde değil, kimin elinde kaldığında görünür. Karışımın işlenmesi büyük ölçüde Asya'da yapılıyorsa, yurt içi satış zorunluluğu önce mülkiyeti yönlendirir, işlemeyi sonra. Kısa vadede beklenebilecek sonuç, rafine tungsten üretiminin artması değil, yurt içi alıcının önünde biriken stok ve bu stokun fiyatıdır."}, {"en": "One condition makes the opposite possible. If unused processing capacity is standing idle at home, the redirection does not stall at ownership and reaches treatment quickly. The report gives no measure of that capacity, so the difference between the two scenarios will be read from the processing investments announced in the first months rather than from the rule itself.", "refs": ["hurda"], "tr": "Bunun tersini mümkün kılan bir koşul var. Yurt içinde kullanılmayan işleme kapasitesi hazır bekliyorsa, yönlendirme mülkiyette takılmaz ve işlemeye hızla ulaşır. Haber bu kapasiteye ilişkin bir ölçü vermiyor; dolayısıyla iki senaryo arasındaki fark, kuralın kendisinden değil, ilk aylarda açıklanacak işleme yatırımlarından okunacak."}]}, {"h": {"en": "The exception is where the rule is actually written", "tr": "İstisna, kuralın asıl metnidir"}, "ps": [{"en": "Because the ban is open to applications for an exception, it does not amount to an absolute closure. A seller must sell at home yet can obtain an exception, and that structure builds a licensing regime more than an export ban. The restriction's real scope will be settled in the number of exceptions granted and in which buyers they are granted for, not in the published text. That is what has to be measured over the one-year term: how many applications were accepted, and whether shipments of black mass and tungsten scrap to Asia keep appearing in the monthly trade data.", "refs": ["hurda"], "tr": "Yasak, istisna başvurusuna açık olduğu için mutlak bir kapanma sayılmaz. Satıcı yurt içine satmak zorunda, ancak istisna alabiliyor; bu yapı, bir ihracat yasağından çok bir izin rejimi kurar. Kısıtlamanın gerçek kapsamı, yayımlanan metinde değil, verilen istisnaların sayısında ve hangi alıcılar için verildiğinde belirlenecek. Bir yıllık süre boyunca ölçülmesi gereken de bu: kaç başvuru kabul edildi ve karışım ile tungsten hurdasının Asya'ya sevkiyatı aylık ticaret verisinde görünmeye devam ediyor mu."}]}], "sources": [{"key": "hurda", "kind": "news", "name": "Miningmx", "url": "https://www.miningmx.com/trending/66151-us-bans-critical-mineral-exports-in-bid-to-boost-defence/", "title": {"tr": "ABD, öğütülmüş pil karışımı ve tungsten hurdası ihracatını bir yıl süreyle yasakladı", "en": "US bars exports of battery black mass and tungsten scrap for one year"}, "publishedDate": "2026-08-05"}], "title": {"en": "Where does the scrap go when it cannot be sold abroad?", "tr": "Hurda satılamayınca nereye gider?"}, "writer": "geo-04", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "New Delhi produced two separate sentences: it said it had no involvement in the forum where the speech was made, and it said Dhaka's extradition request was being examined through the legal process. The two sentences do two different jobs.", "tr": "Yeni Delhi iki ayrı cümle kurdu: konuşmanın yapıldığı platformda hiçbir dahlinin olmadığını söyledi ve Dakka'nın iade talebinin hukuki süreç içinde incelendiğini bildirdi. İki cümle iki ayrı işi görüyor."}, "sections": [{"h": {"en": "One video link and two official sentences", "tr": "Bir görüntülü bağlantı ve iki resmî cümle"}, "ps": [{"en": "India's foreign ministry spokesman Randhir Jaiswal said the government had \"no involvement whatsoever in it, neither does it endorse any views that may be expressed at the forum\". Bangladesh has sought her extradition, and India says the request is \"being examined through the legal process\".", "refs": ["hasina"], "tr": "Hindistan Dışişleri Bakanlığı Sözcüsü Randhir Jaiswal, hükümetin \"bu işte hiçbir dahlinin olmadığını, o platformda dile getirilebilecek görüşleri de benimsemediğini\" belirtti. Bangladeş iadesini talep etti; Hindistan, talebin \"hukuki süreç içinde incelendiğini\" bildiriyor."}, {"en": "The event that made those sentences necessary was this: speaking by video link to the Foreign Correspondents' Club of South Asia, the 78-year-old former prime minister Sheikh Hasina said she would return to Bangladesh in December after two years in exile in India, with the exact date to be announced later. She said: \"I may be detained, I may be sent to prison. But fear cannot decide my duty to the people.\" Hasina had been convicted in absentia in Dhaka of incitement, ordering killings and failing to prevent atrocities, and sentenced to death for crimes against humanity.", "refs": ["hasina"], "tr": "Cümleleri gerektiren olay şuydu: Güney Asya Yabancı Muhabirler Kulübü'ne görüntülü bağlantıyla konuşan 78 yaşındaki eski başbakan Şeyh Hasina, Hindistan'daki iki yıllık sürgünün ardından aralık ayında Bangladeş'e döneceğini, kesin tarihin sonra açıklanacağını söyledi. \"Gözaltına alınabilirim, hapse gönderilebilirim. Ama korku, halkıma karşı görevimi belirleyemez\" dedi. Hasina, Dakka'da tahrik, öldürme emri verme ve vahşetleri önlememe suçlarından gıyabında mahkûm edilmiş ve insanlığa karşı suçlardan ölüm cezasına çarptırılmıştı."}]}, {"h": {"en": "The two jobs the two sentences do", "tr": "İki cümlenin gördüğü iki iş"}, "ps": [{"en": "The first sentence is about content: the words belong to the guest, not to the host. The second is about a decision and does not make one. The formula that hands the request to a legal process refuses Dhaka nothing and grants Dhaka nothing; it leaves the decision to an institution and to an unstated timetable. Together they leave India room between going on hosting Hasina and having to say a clear no to Dhaka.", "refs": ["hasina"], "tr": "Birinci cümle içeriğe ilişkin: sözlerin sahibi konuk, ev sahibi değil. İkinci cümle karara ilişkin ve kararı vermiyor. Talebi hukuki sürece havale eden ifade Dakka'yı reddetmiyor, kabul de etmiyor; kararı bir kuruma ve belirsiz bir takvime bırakıyor. İkisi bir arada Hindistan'a, Hasina'yı ağırlamayı sürdürmekle Dakka'ya açık bir hayır demek arasında bir aralık bırakıyor."}, {"en": "That room has a cost, and the cost rises with the guest's visibility. Hasina had flown by helicopter to New Delhi after the 2024 student-led uprising; since then a quiet residence was something Dhaka could raise but could hardly press. A video appearance changes that: the quiet residence becomes a dated event that Bangladesh can point to in an official exchange. That is precisely why the ministry's distance from the forum becomes necessary. The announced date is where the limit will show: if a December date is set and the departure is made from Indian territory, the extradition file closes itself; if the date is set and no departure follows, the limit is New Delhi's.", "refs": ["hasina"], "tr": "Bu aralığın bir gideri var ve gider konuğun görünürlüğüyle birlikte artıyor. Hasina, 2024'teki öğrenci ayaklanmasının ardından helikopterle Yeni Delhi'ye gitmişti; o günden bu yana sessiz bir ikamet, Dakka için üzerinde durulabilir ama üzerine gidilmesi zor bir konuydu. Görüntülü bir konuşma bunu değiştiriyor: sessiz ikamet, Bangladeş'in resmî yazışmasında gösterebileceği tarihli bir olaya dönüşüyor. Bakanlığın platformdan uzak durması da tam olarak bu yüzden gerekli hâle geliyor. Sınırın nerede olduğu, açıklanacak tarihte görünecek: aralık için bir tarih belirlenir ve kalkış Hindistan topraklarından yapılırsa iade dosyası kendiliğinden kapanır; tarih belirlendiği hâlde kalkış gerçekleşmezse sınır Yeni Delhi'de demektir."}]}], "sources": [{"key": "hasina", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/5/ex-pm-sheikh-hasina-announces-her-plan-to-return-to-bangladesh", "title": {"tr": "Şeyh Hasina aralıkta Bangladeş'e döneceğini yineledi, Yeni Delhi konuşmanın yapıldığı platformdan uzak durdu", "en": "Sheikh Hasina restates a December return to Bangladesh, and New Delhi distances itself from the forum"}, "publishedDate": "2026-08-05"}], "title": {"en": "India hosts its guest and disowns the speech", "tr": "Hindistan konuğunu ağırlıyor, konuşmasını sahiplenmiyor"}, "writer": "geo-05", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "The state capture file has been open for more than a decade. A written procedure for whom a former president may be seen with abroad is being proposed for the first time.", "tr": "Devlet kaynaklarının ele geçirilmesi dosyası on yılı aşkın süredir açık. Eski bir cumhurbaşkanının yurt dışında kiminle görüneceğine ilişkin yazılı bir usul ise ilk kez öneriliyor."}, "sections": [{"h": {"en": "What the proposed procedure says", "tr": "Önerilen usul ne diyor"}, "ps": [{"en": "Zuma travelled to India last month and was photographed there at a temple with Ajay Gupta, one of the businessmen at the centre of the state capture allegations. South Africa's high commissioner to India, Anil Sooklal, was also pictured with the pair and has since been recalled; Sooklal denies wrongdoing.", "refs": ["zuma"], "tr": "Zuma bir ay önce Hindistan'a gitti ve orada bir tapınakta, devlet kaynaklarının ele geçirilmesi iddialarının merkezindeki iş insanlarından Ajay Gupta ile fotoğraflandı. Güney Afrika'nın Hindistan Yüksek Komiseri Anil Sooklal da ikiliyle birlikte görüntülendi ve geri çağrıldı; Sooklal bir usulsüzlük yapmadığını söylüyor."}, {"en": "Foreign Affairs Minister Ronald Lamola said on Wednesday that his department had sent parliament and the president's office a recommendation for new protocols covering former heads of state on foreign trips. Under it they would have to \"provide full details\" of an upcoming trip so the state can make \"an informed assessment of the appropriate level of support required and any associated reputational, political, diplomatic or security risks\".", "refs": ["zuma"], "tr": "Dışişleri Bakanı Ronald Lamola çarşamba günü, bakanlığının eski devlet başkanlarının yurt dışı gezilerine ilişkin yeni kurallar önerisini parlamentoya ve cumhurbaşkanlığı ofisine gönderdiğini açıkladı. Öneriye göre eski devlet başkanları planladıkları gezinin \"tüm ayrıntılarını\" bildirecek; böylece devlet, gereken destek düzeyini ve itibara, siyasete, diplomasiye veya güvenliğe ilişkin riskleri değerlendirebilecek."}]}, {"h": {"en": "The file the decision rests on", "tr": "Kararın dayandığı dosya"}, "ps": [{"en": "A judicial commission concluded in 2022 that Zuma had hired and fired ministers central to the running of the country's economy at the behest of the Gupta family. The family left South Africa in 2018, and a court in the United Arab Emirates refused an extradition request for Atul and Rajesh Gupta in 2023. Zuma, now 84, has been expelled from the African National Congress and leads the opposition uMkhonto we Sizwe.", "refs": ["zuma"], "tr": "Bir yargı komisyonu 2022'de, Zuma'nın ülke ekonomisinin işleyişinde kilit bakanları Gupta ailesinin isteğiyle atayıp görevden aldığı sonucuna varmıştı. Aile 2018'de Güney Afrika'dan ayrıldı; Birleşik Arap Emirlikleri'ndeki bir mahkeme 2023'te Atul ve Rajesh Gupta için yapılan iade talebini reddetti. Bugün 84 yaşındaki Zuma, Afrika Ulusal Kongresi'nden ihraç edildi ve muhalefetteki uMkhonto we Sizwe'nin başında."}, {"en": "That sequence shows how the state's instruments against the people at the centre of the file ran out: a family left the country, an extradition request was refused in another jurisdiction, an arrest warrant was cancelled. What stayed under Pretoria's own control is the support and protocol it extends to former presidents. The new instrument lands exactly there, and its scope is the scope of the authority that remained.", "refs": ["zuma"], "tr": "Bu sıralama, devletin dosyanın merkezindeki kişilere karşı elindeki araçların nasıl tükendiğini gösteriyor: bir aile ülke dışına çıktı, bir iade talebi başka bir yargı düzeninde reddedildi, bir yakalama kararı iptal edildi. Pretoria'nın kendi denetiminde kalan şey, eski cumhurbaşkanlarına sunduğu destek ve protokoldür. Yeni araç da tam oraya iniyor; kapsamı, elde kalan yetkinin kapsamıdır."}]}, {"h": {"en": "Why now, and what it does not settle", "tr": "Neden şimdi ve neyi karara bağlamıyor"}, "ps": [{"en": "The precedent came last year. Zuma had travelled to Morocco and spoken in support of Rabat's claim over Western Sahara; South Africa condemned the visit and lodged a formal diplomatic protest with Morocco. That trip and the India trip do not sit under the same rule. In Morocco the problem was that someone travelling as a party leader voiced a position contrary to the state's foreign policy; in India the problem was whom he was seen beside. A notification duty can price the second before departure.", "refs": ["zuma"], "tr": "Emsal geçen yıl yaşandı. Zuma Fas'a gitmiş, Batı Sahra konusunda Rabat'ın iddiasını desteklediğini söylemişti; Güney Afrika ziyareti kınamış ve Fas'a resmî bir protesto iletmişti. O gezi ile Hindistan gezisi aynı kurala oturmuyor. Fas'ta sorun, parti lideri sıfatıyla giden birinin devletin dış politikasına aykırı bir pozisyon dile getirmesiydi; Hindistan'da sorun, kimin yanında görüldüğüydü. Bildirim yükümlülüğü ikincisini kalkıştan önce fiyatlandırabilir."}, {"en": "It cannot price the first. In what capacity a former head of state speaks abroad has stood open since the Morocco trip, and the recommendation does not touch it. Whether the procedure becomes an instrument will be seen in whether parliament writes into the text what follows from a failure to notify. A procedure with no consequence written into it remains a request.", "refs": ["zuma"], "tr": "Birincisini ise fiyatlandıramaz. Bir eski devlet başkanının yurt dışında hangi sıfatla konuştuğu sorusu Fas gezisinden bu yana ortada duruyor ve öneri bu soruya dokunmuyor. Usulün araç hâline gelip gelmediği, parlamentonun metne bildirimde bulunmamanın karşılığını yazıp yazmadığından anlaşılacak. Karşılığı yazılmamış bir usul, yalnızca bir rica olarak kalır."}]}], "sources": [{"key": "zuma", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c1e14lj7vg7o", "title": {"tr": "Pretoria, Zuma'nın Hindistan ziyaretinin ardından eski devlet başkanları için seyahat kuralları öneriyor", "en": "Pretoria proposes travel protocols for former heads of state after Zuma's India visit"}, "publishedDate": "2026-08-05"}], "title": {"en": "A photograph turns custom into a written rule", "tr": "Bir fotoğraf, teamülü yazılı kurala çeviriyor"}, "writer": "geo-06", "n": 3, "radarPublishedAt": "2026-08-05T17:22:00+00:00", "date": "2026-08-05"}, {"excerpt": {"en": "Israel's Supreme Court heard a challenge on Monday to the legislation barring UNRWA from operating in the country. What the court will settle is the footing UNRWA's mandate can hold inside Israel's jurisdiction, a narrower question than the mandate itself. The place where aid actually runs into trouble is elsewhere.", "tr": "İsrail Yüksek Mahkemesi pazartesi günü UNRWA'yı ülkede faaliyetten meneden mevzuata yapılan itirazı dinledi. Mahkemenin karara bağlayacağı şey, UNRWA'nın görevinin İsrail'in yargı yetkisi içinde hangi dayanağa tutunabileceği; bu, görevin kendisinden daha dar bir soru. Yardımın fiilen zorlandığı yer ise başka."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The instrument in front of the court", "tr": "Mahkemenin önünde duran araç"}, "ps": [{"en": "Al Jazeera reported that Israel's Supreme Court on Monday heard arguments against the legislation barring UNRWA from operating in Israel. Supporters of the ban said the laws were necessary for national security. Rights advocates said the ban would jeopardise access to aid and basic services for millions of Palestinians. That same report does not name the petitioning organisation, set out the justices' assessments, or give a timetable for a ruling.", "refs": ["unrwa-court"], "tr": "Al Jazeera'nın aktardığına göre İsrail Yüksek Mahkemesi pazartesi günü, UNRWA'nın İsrail'de faaliyet göstermesini yasaklayan mevzuata karşı ileri sürülen savları dinledi. Yasağı destekleyenler mevzuatı ulusal güvenlik bakımından gerekli gördüklerini söyledi. Hak savunucuları ise yasağın milyonlarca Filistinlinin yardıma ve temel hizmetlere erişimini tehlikeye attığını savundu. Aynı haberde başvurucu kuruluşun adı, yargıçların değerlendirmeleri ve karar takvimi yer almıyor."}, {"en": "In the UNRWA case the two arguments are not measuring the same thing. The national-security case rests on a state's authority to decide which body may hold legal presence on its own territory, and inside Israel's jurisdiction that authority operates without dispute. The access case measures the services the agency delivers to Palestinians, and the weight of those services sits outside Israel's borders. The instrument before the court is a domestic law governing an organisation's presence within the country. It is not a text that governs delivery, and that is where the limit of any ruling is drawn.", "refs": ["unrwa-court"], "tr": "UNRWA davasında iki savın ölçtüğü şey aynı değil. Ulusal güvenlik gerekçesi, bir devletin kendi ülkesinde hangi kuruluşun tüzel varlık taşıyacağına karar verme yetkisine dayanıyor ve bu yetki İsrail'in yargı alanı içinde tartışmasız işliyor. Erişim gerekçesi ise ajansın Filistinlilere ulaştırdığı hizmetleri ölçüyor; o hizmetlerin ağırlığı İsrail sınırlarının dışında duruyor. Mahkemenin önündeki araç, bir kuruluşun ülke içindeki varlığını düzenleyen bir iç hukuk metni. Erişimi doğrudan düzenleyen bir metin değil ve kararın ne yapabileceğinin sınırı da burada çiziliyor."}]}, {"h": {"en": "Where the service actually runs into trouble", "tr": "Hizmetin fiilen zorlandığı yer"}, "ps": [{"en": "The United Nations noon briefing given the same day shows where the service in question is under strain. Deputy Spokesman Farhan Haq said air strikes, shelling and shooting continued across Gaza over the weekend. The Ministry of Health documented more than 150 fatalities in July, the highest monthly toll reported since the beginning of the year.", "refs": ["un-gaza"], "tr": "Birleşmiş Milletler'in aynı gün yaptığı öğle brifingi, tartışılan hizmetin nerede zorlandığını gösteriyor. Sözcü Yardımcısı Farhan Haq'ın aktardığına göre Gazze'de hafta sonu boyunca hava saldırıları, top ateşi ve silahlı saldırılar sürdü. Sağlık Bakanlığı temmuz ayında 150'den fazla ölüm bildirdi ve bu, yılbaşından bu yana bildirilen en yüksek aylık sayı oldu."}, {"en": "What follows is this. A ruling will be decisive for the agency's legal presence in Israel and for the contact points that depend on it, while what determines whether aid reaches Gaza is the continuation of strikes and the arrangements for entry. The counterargument deserves its weight. If UNRWA's logistics depend on registration, coordination and movement permits inside Israel, then upholding the ban could narrow access even so, with a lag. There is a signal that would test the distinction. If the court upholds the ban without interim relief, the thing to watch is whether UNRWA's share of distribution shifts in subsequent UN humanitarian reporting, rather than the language of the judgment.", "refs": ["unrwa-court", "un-gaza"], "tr": "Buradan şu çıkıyor: Karar, ajansın İsrail'deki tüzel varlığı ve buna bağlı temas noktaları üzerinde belirleyici olacak; yardımın Gazze'ye ulaşıp ulaşmadığını belirleyen değişkenler ise saldırıların sürmesi ve giriş düzenlemeleri. Karşı sav ihmal edilmemeli. UNRWA'nın lojistiği İsrail'deki tescil, koordinasyon ve geçiş izinlerine bağlıysa, yasağın onaylanması erişimi gecikmeli biçimde daraltıyor olabilir. Bu ayrımı sınayacak bir işaret var. Mahkeme yasağı geçici tedbir koymadan onaylarsa, izlenecek şey, kararın dili yerine sonraki BM insani raporlarında UNRWA'nın dağıtımdaki payının değişip değişmediği olacak."}]}], "sources": [{"key": "unrwa-court", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/3/israel-top-court-hears-challenge-to-unrwa-ban", "title": {"tr": "İsrail Yüksek Mahkemesi, UNRWA yasağına yapılan itirazı dinledi", "en": "Israel's top court hears the challenge to the UNRWA ban"}, "publishedDate": "2026-08-03"}, {"key": "un-gaza", "kind": "news", "name": "United Nations", "url": "https://press.un.org/en/2026/db260803.doc.htm", "title": {"tr": "BM, Sudan insani yardım çağrısının yüzde 40'ının karşılandığını bildirdi", "en": "The UN says Sudan's humanitarian appeal is just over 40 percent funded"}, "publishedDate": "2026-08-03"}], "title": {"en": "A statute can halt the service without altering the mandate", "tr": "Bir yasa hizmeti durdurabilir ama görev tanımını değiştiremez"}, "writer": "geo-01", "date": "2026-08-04"}, {"excerpt": {"en": "The Board of Peace's high representative met Netanyahu on Monday. The published text restates an aim both sides already profess, while the meeting's operative request appears not in the board's statement but in two unnamed sources.", "tr": "Barış Kurulu'nun yüksek temsilcisi pazartesi günü Netanyahu ile görüştü. Yayımlanan metin iki tarafın da zaten savunduğu bir amacı tekrar ediyor; görüşmenin asıl talebi ise kurulun açıklamasında değil, adı verilmeyen iki kaynakta duruyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "What the statement says and does not say", "tr": "Açıklamanın yazdığı ve yazmadığı"}, "ps": [{"en": "The Associated Press reported that Nikolay Mladenov, high representative of the Board of Peace overseeing Gaza's postwar transition, met Benjamin Netanyahu and his team on Monday. The board called the talks constructive and detailed, and set out the aim as the complete decommissioning of weapons in the Strip and a transition away from rule by the gun to civilian governance, adding that this goal was not in question.", "refs": ["bop-netanyahu"], "tr": "Associated Press'in haberine göre Gazze'nin savaş sonrası geçişini yürüten Barış Kurulu'nun yüksek temsilcisi Nikolay Mladenov, pazartesi günü Binyamin Netanyahu ve ekibiyle görüştü. Kurul görüşmeleri yapıcı ve ayrıntılı olarak nitelendirdi ve amacı, Şerit'teki silahların tümüyle etkisizleştirilmesi ve silah zoruyla yönetimden sivil yönetime geçiş olarak tanımladı; açıklamada bu amacın tartışma konusu olmadığı da belirtildi."}, {"en": "In one pan sits that sentence, carrying the board's signature. In the other sits the concrete request reported to have been made at the same meeting. That Mladenov asked Netanyahu to stop the strikes in Gaza comes not from the board's text but from two people familiar with the meeting. In diplomatic documents this difference is not trivial. The published sentence is a declaration of aim and commits neither party to anything today; the unpublished request is the only ask with a clock attached, and no institutional signature stands behind it. What exists is contact, not commitment.", "refs": ["bop-netanyahu"], "tr": "Bir kefede kurulun imzasını taşıyan bu cümle var; öbür kefede, aynı görüşmede dile getirildiği bildirilen somut talep. Mladenov'un Netanyahu'dan Gazze'deki saldırıları durdurmasını istediği bilgisi kurulun metninden değil, görüşmeye vâkıf iki kişiden geliyor. Diplomatik metinlerde bu fark önemsiz değil. Yayımlanan cümle bir amaç beyanı ve tarafların hiçbirini bugün bir şey yapmaya bağlamıyor; yayımlanmayan talep ise takvimi olan tek istek ve arkasında kurumsal bir imza yok. Elimizdeki, bir taahhüt değil bir temas."}]}, {"h": {"en": "The one observable that changed", "tr": "Değişen tek gözlenebilir"}, "ps": [{"en": "Donald Trump announced the agreement late on Thursday. The text called for Israel to cease its military operations and for Hamas and its allies to halt all militant activity. After it was released Israel said it had serious security concerns and had shared them with Washington, and it stepped up its strikes: local health officials said 17 people were killed overnight from Saturday into Sunday. On Monday no airstrikes were reported in Gaza. Israeli attacks have killed 1,250 people since the ceasefire reached in October.", "refs": ["bop-netanyahu"], "tr": "Anlaşmayı perşembe akşamı Donald Trump duyurmuştu. Metin İsrail'in askerî operasyonlarını durdurmasını, Hamas ile müttefiklerinin silahlı faaliyeti sonlandırmasını öngörüyordu. Metin yayımlandıktan sonra İsrail ciddi güvenlik endişeleri bulunduğunu ve bunları Washington'la paylaştığını bildirdi, saldırılarını da artırdı: Yerel sağlık yetkililerine göre cumartesiyi pazara bağlayan gece 17 kişi öldü. Pazartesi günü Gazze'de hava saldırısı bildirilmedi. Ekimdeki ateşkesten bu yana İsrail saldırılarında ölenlerin sayısı 1.250."}, {"en": "The one measurable thing that changed after the meeting is that single quiet day. It is early to call it an outcome. The same observation reads at least two ways: the board's request may have been met, or the day may simply have fallen into an ordinary gap between target lists and weather, and Israel's failure to withdraw its stated security concerns does not weaken that second reading. What separates the two is repetition, not rhetoric. If the next two days pass without strikes and Mladenov's request is this time written down under the board's own name, then something has been exchanged. A one-day gap remains a gap.", "refs": ["bop-netanyahu"], "tr": "Görüşmenin ardından değişen ölçülebilir tek şey bu tek günlük sessizlik. Bunu bir sonuç saymak için erken. Aynı gözlem en az iki biçimde okunabilir: Kurulun talebi karşılık bulmuş olabilir ya da hedef listesi ile hava durumu arasında sıradan bir aralığa denk gelinmiş olabilir; İsrail'in güvenlik endişelerine dair ifadesini geri almamış olması ikinci ihtimali zayıflatmıyor. Ayrımı yapacak olan da retorik değil, tekrar. Önümüzdeki iki gün saldırısız geçer ve Mladenov'un talebi bu kez kurulun kendi imzasıyla yazılırsa, ortada bir teati var demektir. Tek günlük bir aralık ise yalnızca bir aralıktır."}]}], "sources": [{"key": "bop-netanyahu", "kind": "news", "name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/board-of-peace-envoy-meets-with-netanyahu-on-gaza-disarmament-deal-urges-halt-to-strikes", "title": {"tr": "Barış Kurulu temsilcisi Mladenov, Netanyahu ile silahsızlandırmayı görüştü", "en": "Board of Peace representative Mladenov meets Netanyahu on disarmament"}, "publishedDate": "2026-08-03"}], "title": {"en": "The board's statement names the goal, and leaves out the actual request", "tr": "Kurulun açıklaması hedefi yazıyor, asıl talep açıklamada yok"}, "writer": "geo-02", "date": "2026-08-04"}, {"excerpt": {"en": "A drone that came down on a Black Sea beach killed seven people. Three observations — no warning, gunfire before the explosion, and no identifiable aimpoint — point to the terminal phase of a defensive engagement rather than to a chosen target.", "tr": "Karadeniz kıyısındaki bir sahile düşen insansız hava aracı yedi kişiyi öldürdü. Elimizdeki üç gözlem — uyarı yokluğu, patlamadan önceki silah sesi ve belirsiz hedef — bir nişan noktasına değil, savunma temasının son safhasına işaret ediyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "What is actually observable", "tr": "Elde ne var"}, "ps": [{"en": "The BBC reported that Krasnodar governor Veniamin Kondratyev said seven people, three of them children, were killed on the beach near Arkhipo-Osipovka, that the number of injured reached 40, and that 17 were taken to hospital. Krasnodar governor Veniamin Kondratyev accused Ukraine of a deliberate strike on civilians. Kyiv made no comment. Both sides deny deliberately targeting civilians.", "refs": ["beach-strike"], "tr": "BBC'nin haberine göre Krasnodar Valisi Veniamin Kondratyev, Arhipo-Osipovka yakınlarındaki sahilde üçü çocuk yedi kişinin öldüğünü, yaralı sayısının 40'a ulaştığını ve 17 kişinin hastaneye kaldırıldığını bildirdi. Vali, Ukrayna'yı sivillere yönelik kasıtlı bir saldırıyla suçladı. Kiev konuya ilişkin açıklama yapmadı. İki taraf da sivilleri kasten hedef aldığını reddediyor."}, {"en": "Three things can be counted. In footage verified by the BBC the drone travels towards a cliffside and then comes down on the beach below. Eyewitnesses quoted by Russian media say they heard gunfire before the explosion, which may indicate that air defences tried to bring it down. Residents and tourists told local outlets that no siren sounded beforehand. What the drone was aimed at is unclear. Some Ukrainian Telegram channels claim it fell because electronic warfare jammed its signal.", "refs": ["beach-strike"], "tr": "Sayılabilir olan üç şey var. BBC'nin doğruladığı görüntülerde araç bir yamaca doğru ilerledikten sonra aşağıdaki sahile düşüyor. Rus basınına konuşan görgü tanıkları patlamadan önce silah sesi duyduklarını söylüyor; bu, hava savunmasının aracı düşürmeye çalıştığına işaret edebilir. Sakinler ve turistler yerel yayın organlarına saldırı öncesinde siren çalmadığını aktarıyor. Aracın neyi hedeflediği ise belirsiz. Bazı Ukrayna Telegram kanalları aracın, sinyalini bozan elektronik harp nedeniyle düştüğünü ileri sürüyor."}]}, {"h": {"en": "What these do not establish", "tr": "Bunlar neyi kanıtlamaz"}, "ps": [{"en": "That trio does not show that a stretch of coastline was aimed at. The absence of warning suggests the defence detected the drone late; the fire before the explosion suggests the engagement was joined on the approach rather than over a target; and the unclear aimpoint suggests the drone may have lost its heading in the terminal phase. The competing explanation has to be written down too: the drone may have been aimed at a nearby facility and missed through an ordinary guidance failure, in which case the defence's role is secondary. Nor is the source of the electronic-warfare claim neutral — an account that lightens its own side's responsibility is not verified merely by being plausible.", "refs": ["beach-strike"], "tr": "Bu üçlü, bir kıyı şeridinin nişan alındığını göstermez. Uyarı verilmemesi, savunmanın aracı geç fark ettiğine; patlamadan önceki ateş, temasın hedefin üzerinde değil yaklaşma hattında kurulduğunu düşündürür. Hedefin belirsizliği ise aracın son safhada yönünü koruyamamış olabileceğine işaret eder. Bu okumanın karşısında duran açıklamayı da yazmak gerekir: Araç yakındaki bir tesise nişan alınmış ve isabetsizlik sıradan bir güdüm hatasından doğmuş olabilir; o durumda savunmanın rolü ikincil kalır. Elektronik harp iddiasının kaynağı da tarafsız değil — kendi tarafının sorumluluğunu hafifleten bir açıklama, doğru olsa bile doğrulanmış sayılmaz."}, {"en": "For the campaign the consequence is this. Ukraine's deep strikes, increasingly successful over the past year, hit energy infrastructure and commercial warehouses it says are used for military purposes, and eight people were killed in such strikes in different Russian cities at the weekend. In Saturday's ballistic missile attacks on Kyiv, Zelensky said at least nine people were killed. As volume grows, civilian harm arises not only from impact but from the defensive engagement itself, and neither side's statement closes that cost. On the present evidence that is as far as it goes. Capability can be counted, intent cannot, and the footage anyone holds does not make intent legible.", "refs": ["beach-strike"], "tr": "Kampanya açısından sonuç şu: Ukrayna'nın bir yıldır artan derinlik saldırıları enerji altyapısını ve askerî amaçla kullanıldığını söylediği ticari depoları vuruyor, hafta sonu farklı Rus kentlerinde sekiz kişi bu saldırılarda öldü. Cumartesi Kiev'e yapılan balistik füze saldırılarında ise Zelenski'ye göre en az dokuz kişi öldü. Hacim büyüdükçe sivil zarar yalnızca isabetten değil, savunma temasının kendisinden de doğuyor ve bu maliyet iki tarafın da beyanıyla kapatılamıyor. Bugünkü kanıtla söylenebilecek olan bu kadar. Kabiliyet sayılabilir, niyet sayılamaz; kimsenin elindeki görüntü niyeti okutmuyor."}]}], "sources": [{"key": "beach-strike", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cr7kmnyrdn7o", "title": {"tr": "Krasnodar valisi, kalabalık bir sahile düşen insansız hava aracında 7 kişinin öldüğünü bildirdi", "en": "Krasnodar governor says seven died when a drone came down on a crowded beach"}, "publishedDate": "2026-08-03"}], "title": {"en": "The gunfire was heard before any siren sounded", "tr": "Sirenler çalmadan önce silah sesi duyuldu"}, "writer": "geo-03", "date": "2026-08-04"}, {"excerpt": {"en": "The perimeters of a deal on Hormuz were said to be agreed and Brent fell 4.5 percent on Monday. The only series that measures actual crossings of the same strait points the other way: 51 between July 30 and August 2, against 71 in the four days before.", "tr": "Hürmüz'de bir anlaşmanın çerçevesi üzerinde uzlaşıldığı duyuruldu ve Brent pazartesi yüzde 4,5 düştü. Aynı boğazdan yapılan geçişleri ölçen tek seri ise ters yöne bakıyor: 30 Temmuz–2 Ağustos arasında 51 geçiş, önceki dört günde 71."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "Two series, two directions", "tr": "İki seri, iki yön"}, "ps": [{"en": "The BBC reported that in Monday Asia trading Brent fell 4.5 percent to $83.98 and US-traded crude fell 4.6 percent to $80.74. What moved the price was not a loading, a sailing clearance or an insurance binder; it was Trump saying the perimeters of a deal had been agreed and that these covered reopening Hormuz. Around 20 percent of the world's crude oil and liquefied natural gas normally passes through the strait, and that share explains why a spoken announcement produced a price response of this size.", "refs": ["iran-talks"], "tr": "BBC'nin aktardığına göre pazartesi Asya işlemlerinde Brent yüzde 4,5 düşüşle 83,98 dolar, ABD'de işlem gören ham petrol yüzde 4,6 düşüşle 80,74 dolar seviyesine geriledi. Fiyatı hareket ettiren şey bir yükleme, bir sefer izni ya da bir sigorta teminatı değil; Trump'ın bir anlaşmanın çerçevesi üzerinde uzlaşıldığını ve bunun Hürmüz'ün yeniden açılmasını kapsadığını söylemesiydi. Boğazdan normalde dünya ham petrolünün ve sıvılaştırılmış doğal gazının yaklaşık yüzde 20'si geçiyor; bu pay, sözlü bir duyurunun neden bu büyüklükte bir fiyat tepkisi ürettiğini açıklıyor."}, {"en": "The physical series does not point the same way. Kpler's vessel-tracking data show 51 crossings of the strait between July 30 and August 2, against 71 in the previous four days, roughly 28 percent fewer. Using the two measures in one sentence requires stating the lag: the price belongs to Monday, the crossing count to the four days before the announcement. The series therefore do not contradict each other; they measure different things. The price reflects an expectation, the crossing count the risk an owner and an underwriter actually took, and the second had gone on narrowing right up to the announcement.", "refs": ["iran-talks"], "tr": "Fiziksel seri aynı yöne bakmıyor. Kpler'in gemi takip verilerine göre boğazdan 30 Temmuz–2 Ağustos arasında 51 geçiş yapıldı; önceki dört günde bu sayı 71'di, yani yaklaşık yüzde 28 daha az. Bu iki ölçüyü aynı cümlede kullanırken gecikmeyi yazmak gerekir: Fiyat pazartesiye ait, geçiş sayısı ise duyurudan önceki dört güne. Dolayısıyla seriler birbirini yalanlamıyor; farklı şeyleri ölçüyorlar. Fiyat bir beklentiyi, geçiş sayısı ise armatörün ve sigortacının fiilen aldığı riski gösteriyor ve ikincisi duyuruya kadar daralmaya devam etmişti."}]}, {"h": {"en": "Which text actually exists", "tr": "Ortada hangi metin var"}, "ps": [{"en": "The document behind the announcement is what matters. Iran said it was not negotiating with the United States and had no plans to do so; the only channel it acknowledged is the route discussion with Oman, seeking an understanding on commercial passage through Hormuz. I drew the same distinction in this column yesterday: the Red Sea was the detour absorbing the traffic Hormuz had lost, and that detour now carried a price of its own (Eight ships on Sunday, and the detour now has a price too, August 3). What today adds is what the product of that bargaining is called. A temporary route is a capacity arrangement; it is not the reopening of the strait. The difference between them is how many vessels one corridor will carry, and on what insurance terms.", "refs": ["iran-talks", "history-hormuz"], "tr": "Duyurunun arkasındaki belgeye bakmak gerekiyor. İran, ABD'yle müzakere etmediğini ve buna dair bir planı bulunmadığını bildirdi; kabul ettiği tek kanal, Hürmüz'den ticari geçiş için Umman'la yürütülen ve bir mutabakat arayan güzergâh görüşmesi. Bu ayrımı dün de aynı köşede kurmuştum: Kızıldeniz, Hürmüz'ün kaybettiği trafiği soğuran sapaktı ve o sapağın da artık bir fiyatı vardı (Pazar günü sekiz gemi, artık sapağın da bir fiyatı var, 3 Ağustos). Bugün eklenen şey, o pazarlığın ürününün nasıl adlandırıldığı. Geçici bir güzergâh, bir kapasite düzenlemesidir; boğazın yeniden açılması değildir. İkisi arasındaki fark, tek bir koridorun kaç gemi ve hangi sigorta koşuluyla taşıyacağıdır."}, {"en": "What follows is this. Monday's price move measures the monetisation of a statement, not a change in flow. The counterargument deserves weight: a route understanding could produce a concrete easing in insurance premiums and voyage planning, in which case the price will have read correctly something the count has yet to show. The test is straightforward. If the understanding with Oman becomes a text and is implemented, the thing to watch is Kpler's four-day crossing count rather than the headline. If that count does not stand at 71 or more during August, what exists is a priced sentence rather than a reopened strait.", "refs": ["iran-talks"], "tr": "Buradan çıkan sonuç şu: Pazartesi günkü fiyat hareketi bir akış değişikliğini değil, bir açıklamanın ticarileşmesini ölçüyor. Karşı sav ciddiye alınmalı — bir güzergâh mutabakatı sigorta priminde ve sefer planlamasında somut bir gevşemeye yol açabilir ve o durumda fiyat, sayının henüz göstermediği bir şeyi doğru okumuş olur. Testi de kolay. Umman'la varılan mutabakat bir metne dönüşür ve uygulanırsa, izlenecek şey, manşet yerine Kpler'in dört günlük geçiş sayısıdır. O sayı ağustos boyunca 71 ve üzeri bir düzeyde durmuyorsa, ortada yeniden açılmış bir boğaz değil, fiyatlanmış bir cümle vardır."}]}], "sources": [{"key": "iran-talks", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/c23579jzv08o", "title": {"tr": "Tahran, ABD ile değil Umman'la görüştüğünü bildirdi", "en": "Tehran says it is negotiating with Oman, not the United States"}, "publishedDate": "2026-08-03"}, {"key": "history-hormuz", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-04/2026-08-03/3/", "title": {"tr": "Pazar günü sekiz gemi, artık sapağın da bir fiyatı var", "en": "Eight ships on Sunday, and the detour now has a price too"}, "publishedDate": "2026-08-03"}], "title": {"en": "When the deal was announced, the only thing measured was the price", "tr": "Anlaşma duyurulduğunda ölçülen tek şey fiyattı"}, "writer": "geo-04", "date": "2026-08-04"}, {"excerpt": {"en": "The UN's personal envoy for Sudan is continuing his contacts with a Quintet of four institutions, three of which are organisations of the region itself. The same briefing shows the constraint is money rather than recognition: the humanitarian appeal is just over 40 percent funded.", "tr": "BM'nin Sudan özel temsilcisi, dört kurumdan oluşan Beşli grubuyla temaslarını sürdürüyor ve bunların üçü bölgenin kendi örgütleri. Aynı brifing, kısıtın tanınmadan çok para olduğunu gösteriyor: İnsani yardım çağrısının karşılanan bölümü yüzde 40'ın biraz üzerinde."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The composition of the table", "tr": "Masanın bileşimi"}, "ps": [{"en": "The United Nations noon briefing of August 3 reported that Personal Envoy Pekka Haavisto is continuing his engagement with the parties and with the Quintet. The four institutions that make it up are the African Union, IGAD, the League of Arab States and the European Union. The first thing to notice about that composition is arithmetic: three of the four are regional organisations of Sudan's own neighbourhood, and the only body from outside is the European Union.", "refs": ["un-sudan"], "tr": "Birleşmiş Milletler'in 3 Ağustos tarihli öğle brifinginde, Sudan dosyasında Özel Temsilci Pekka Haavisto'nun taraflarla ve Beşli grubuyla temaslarını sürdürdüğü bildirildi. Grubu oluşturan dört kurum Afrika Birliği, IGAD, Arap Ligi ve Avrupa Birliği. Bu bileşimin ilk özelliği aritmetik: Dört kurumun üçü Sudan'ın kendi çevresindeki bölgesel örgütler, dışarıdan olan tek kurum Avrupa Birliği."}, {"en": "That does not match the description under which Sudan's file has long been discussed, as something managed from outside. Having regional organisations at the table as sponsors changes whom the envoy answers to and which doors can be opened; contact between the African Union or IGAD and the parties is a reach that Brussels or New York cannot establish on its own. But sponsorship buys one thing and not another. A seat at the table confers the standing to make an appeal; it does not confer an obligation to fund what the appeal asks for.", "refs": ["un-sudan"], "tr": "Bu, Sudan dosyasının uzunca bir süredir dışarıdan yönetildiği yolundaki tarifle uyuşmuyor. Bölgesel örgütlerin sponsor sıfatıyla masada bulunması, arabulucunun kime hesap verdiğini ve hangi kapıların açılabileceğini değiştirir; Afrika Birliği'nin ve IGAD'ın taraflarla teması, Brüksel'in ya da New York'un tek başına kuramayacağı bir erişimdir. Ama sponsorluk bir şey satın alır, başka bir şeyi satın almaz. Masada oturmak çağrı yapma yetkisi verir; çağrının gereğini finanse etme yükümlülüğü vermez."}]}, {"h": {"en": "The measure of delivery", "tr": "Teslimatın ölçüsü"}, "ps": [{"en": "The same briefing supplies that measure. The humanitarian appeal for Sudan is just over 40 percent funded, with about $1.2 billion received against the nearly $2.9 billion required. The briefing also reported that clashes in South Kivu in the Democratic Republic of the Congo have displaced more than 48,000 people since mid-July, and that the country's Ebola outbreak had reached 3,748 confirmed cases as of August 1. Those figures describe a separate emergency leaning on the same financing architecture and carry no verdict on Sudan's own file; what they show is how many files that architecture is carrying at once.", "refs": ["un-sudan"], "tr": "Aynı brifing o ölçüyü veriyor. Sudan için yapılan insani yardım çağrısı, gereken yaklaşık 2,9 milyar dolar karşısında yaklaşık 1,2 milyar dolar toplanarak yüzde 40'ın biraz üzerinde karşılandı. Brifingde ayrıca Demokratik Kongo Cumhuriyeti'nin Güney Kivu bölgesindeki çatışmaların temmuz ortasından bu yana 48.000'den fazla kişiyi yerinden ettiği, ülkedeki Ebola salgınında 1 Ağustos itibarıyla doğrulanmış vaka sayısının 3.748'e ulaştığı aktarıldı. Bu rakamlar, aynı finansman mimarisine yaslanan ayrı bir acil durumu anlatıyor ve Sudan'ın kendi dosyası hakkında bir hüküm taşımıyor; gösterdikleri şey, o mimarinin aynı anda kaç dosya taşıdığı."}, {"en": "The reading that follows is this. What the African Union, IGAD and the League of Arab States have gained in Sudan's mediation is representation; what they have not yet gained is resources. The counterargument is strong and belongs on the page: how much of a humanitarian appeal is met is decided by donor governments' budget choices, not by the Quintet's performance as a mediator, and a figure of 40 percent therefore passes no verdict on the group by itself. Even so, the gap between representation and delivery is the present shape of the problem of converting regional voice into outcome. The resource the Quintet holds today is the capacity to keep the parties in one room; the ability to pay sits at other tables. There is a measurable test of that: if the appeal's funded share does not pass 40 percent while Haavisto continues his engagement, the case that sponsorship has not brought resources will be confirmed.", "refs": ["un-sudan"], "tr": "Buradan çıkan okuma şu: Afrika Birliği, IGAD ve Arap Ligi'nin Sudan dosyasında kazandığı şey temsil, henüz kazanmadığı şey ise kaynak. Karşı sav güçlü ve yazılmayı hak ediyor: Bir insani yardım çağrısının ne kadarının karşılanacağını, Beşli'nin arabuluculuk performansı değil bağışçı hükümetlerin bütçe kararları belirler. Yüzde 40'lık bir rakam bu nedenle grubun başarısı hakkında tek başına hüküm vermez. Yine de temsil ile teslimat arasındaki bu boşluk, bölgesel örgütlerin sesini sonuca çevirme sorununun bugünkü hâlidir. Beşli'nin şu an elinde bulunan kaynak, tarafları bir odada tutma kapasitesidir; ödeme gücü başka masalarda duruyor. Bunun ölçülebilir bir sınaması var: Haavisto'nun temaslarını sürdürdüğü bu dönemde çağrının karşılanma oranı yüzde 40'ın üzerine çıkmazsa, sponsorluğun kaynak getirmediği doğrulanmış olacaktır."}]}], "sources": [{"key": "un-sudan", "kind": "news", "name": "United Nations", "url": "https://press.un.org/en/2026/db260803.doc.htm", "title": {"tr": "BM, Sudan insani yardım çağrısının yüzde 40'ının karşılandığını bildirdi", "en": "The UN says Sudan's humanitarian appeal is just over 40 percent funded"}, "publishedDate": "2026-08-03"}], "title": {"en": "Four sponsors for Sudan's mediation and a budget at forty percent", "tr": "Sudan arabuluculuğunun dört sponsoru ve yüzde kırklık bir bütçe"}, "writer": "geo-05", "date": "2026-08-04"}, {"excerpt": {"en": "Reform UK presented its plan as the largest military operation in the Channel since World War II, and in doing so chose its own precedent. The nearer and more instructive year is 2020, and the difference between them sits in a payment agreement signed in April.", "tr": "Reform UK planını, İkinci Dünya Savaşı'ndan bu yana Manş'taki en büyük askerî operasyon diye tanıttı ve böylece emsali kendisi seçti. Daha yakın ve daha öğretici olan yıl 2020; aradaki fark ise nisanda imzalanan bir ödeme anlaşmasında duruyor."}, "radarPublishedAt": "2026-08-04T08:11:06+00:00", "sections": [{"h": {"en": "The precedent the party chose", "tr": "Partinin seçtiği emsal"}, "ps": [{"en": "France 24 reported that Reform UK announced on Monday it would task the Royal Navy with returning small boats to France if it came to power. The party's home affairs spokesman, Zia Yusuf, described the plan as the largest military operation in the English Channel since World War II. The French interior ministry told AFP that the plan would be a violation of French sovereignty as well as a violation of maritime law and international law. Reform UK leader Nigel Farage tied the reasoning not to history but to the weekend: what happened in Ceuta, he said, showed just how serious the situation was.", "refs": ["reform-channel"], "tr": "France 24'ün aktardığına göre Reform UK pazartesi günü, iktidara gelmesi hâlinde küçük tekneleri Fransa'ya geri götürmek üzere Kraliyet Donanması'nı görevlendireceğini açıkladı. Partinin içişleri sözcüsü Zia Yusuf planı, Manş'ta İkinci Dünya Savaşı'ndan bu yana yapılacak en büyük askerî operasyon olarak tanımladı. Fransa İçişleri Bakanlığı AFP'ye planın Fransız egemenliğinin olduğu kadar deniz hukukunun ve uluslararası hukukun da ihlali olacağını bildirdi. Reform UK lideri Nigel Farage ise gerekçeyi tarihe değil, hafta sonuna bağladı: Ona göre Ceuta'da yaşananlar durumun ne kadar ciddi olduğunu gösteriyordu."}, {"en": "Before reaching for history one should try the present-day explanation, because it is usually enough. Reform led national polls for roughly eighteen months and that lead has disappeared in recent weeks. On Monday the parliamentary standards commissioner announced that he had opened an investigation a week earlier into an alleged failure by deputy leader Richard Tice to declare a financial interest; the separate inquiry into Farage was suspended when he resigned as an MP to trigger a by-election he is contesting; and London police are pursuing a probe into donations before the 2024 election. Implementing the plan, meanwhile, would require winning an election not due until 2029. With that picture, no historical mechanism is needed to explain the timing of the announcement.", "refs": ["reform-channel"], "tr": "Tarihe gitmeden önce bugünün açıklamasını denemek gerekir, çünkü çoğu zaman yeter. Reform yaklaşık on sekiz ay boyunca anketlerde önde gitti ve bu üstünlük son haftalarda kayboldu. Parlamento standartlar komiseri pazartesi günü, parti başkan yardımcısı Richard Tice hakkında bir mali çıkarı beyan etmediği iddiasıyla bir hafta önce soruşturma açtığını duyurdu; Farage hakkındaki ayrı soruşturma, kendisi bir ara seçimi tetiklemek için milletvekilliğinden istifa edince askıya alındı; Londra polisi de 2024 seçimi öncesi bağışlara ilişkin bir soruşturma yürütüyor. Planın hayata geçmesi içinse partinin, 2029'dan önce yapılması zorunlu olmayan bir seçimi kazanması şart. Bu tabloyla, duyurunun tarihini açıklamak için hiçbir tarihsel mekanizmaya ihtiyaç yok."}]}, {"h": {"en": "The nearer and more instructive year", "tr": "Daha yakın ve daha öğretici olan yıl"}, "ps": [{"en": "Even so, the precedent the party chose puts itself to the test. The same instrument was already proposed six years ago: in 2020 the Conservative government proposed such a policy and swiftly abandoned it. Since then the arrangement for interception in the Channel has become one of cooperation and payment; in April London signed a new three-year deal with Paris, agreeing to pay up to 766 million euros to strengthen French law enforcement. The British government says small-boat arrivals in the first half of 2026 fell by more than 42 percent year on year to just over 14,000, and yet July 29 brought the year's highest daily figure at 752. The answer to the why-now question lies between those two numbers: a falling annual trend and a single day that reopens the argument about it.", "refs": ["reform-channel"], "tr": "Yine de partinin seçtiği emsal kendi kendini sınıyor. Aynı araç altı yıl önce zaten önerilmişti: Muhafazakâr hükümet 2020'de böyle bir politikayı önerdi ve kısa sürede terk etti. O tarihten bu yana Manş'taki müdahale düzeni bir işbirliği ve ödeme düzenine dönüştü; Londra nisanda Paris'le üç yıllık yeni bir anlaşma imzalayarak Fransız kolluk kuvvetlerinin güçlendirilmesi için en fazla 766 milyon avro ödemeyi kabul etti. İngiliz hükümetine göre 2026'nın ilk yarısında küçük teknelerle gelenlerin sayısı yıllık bazda yüzde 42'den fazla azalarak 14.000'i biraz aştı; buna karşın 29 Temmuz'da 752 kişiyle yılın günlük en yüksek sayısına ulaşıldı. Sorunun neden şimdi kısmının cevabı bu iki rakamın arasında: Düşen bir yıllık eğilim ile onu tartışmaya açan tek bir gün."}, {"en": "The condition that breaks the analogy is here. When the instrument was proposed in 2020 there was no April agreement to be broken; today the same instrument is proposed against a partner already being paid up to 766 million euros to do the same job. That detail widens the difference rather than the resemblance: an idea abandoned in 2020 would, if abandoned in 2026, carry more than a political cost. What Ceuta recalls is the fragility of this arrangement — after tens of thousands crossed, European Commission President Ursula von der Leyen called for united action on border security, and EU interior ministers meet in emergency session on Tuesday. When one coastal arrangement collapses, the one next door built on payment becomes easier to question too. Which year supplies the precedent is therefore not a rhetorical question.", "refs": ["reform-channel", "ceuta-eu"], "tr": "Emsali çürüten koşul da burada. 2020'de bu araç önerildiğinde ortada bozulacak nisan anlaşması yoktu; bugün aynı araç, aynı işi yapması için halihazırda en fazla 766 milyon avro ödenen bir ortağa karşı öneriliyor. Bu, benzerliği değil farkı büyüten ayrıntıdır: 2020'de terk edilen bir fikir, 2026'da terk edilirse maliyeti yalnızca siyasi olmayacak. Ceuta'nın hatırlattığı şey de bu düzenin kırılganlığı — Avrupa Komisyonu Başkanı Ursula von der Leyen, on binlerce kişinin geçişinin ardından sınır güvenliğinde ortak hareket çağrısı yaptı ve AB içişleri bakanları salı günü acil olarak toplanacak. Bir kıyı düzeninin çökmesi, komşusunda ödeme yoluyla kurulmuş düzenin de sorgulanmasını kolaylaştırıyor. Emsalin hangi yıl olduğu, bu yüzden retorik bir soru değil."}]}], "sources": [{"key": "reform-channel", "kind": "news", "name": "France 24", "url": "https://www.france24.com/en/europe/20260803-hard-right-reform-uk-proposes-navy-led-operation-to-stop-small-migrant-boats", "title": {"tr": "Fransa, Reform UK'in Manş'ta donanma planını egemenlik ihlali saydı", "en": "France calls Reform UK's Channel navy plan a violation of its sovereignty"}, "publishedDate": "2026-08-03"}, {"key": "ceuta-eu", "kind": "news", "name": "BBC News", "url": "https://www.bbc.co.uk/news/articles/cyvl84zmgyro", "title": {"tr": "Von der Leyen, Ceuta'nın ardından sınır güvenliğinde \"ortak hareket\" istedi", "en": "Von der Leyen calls for \"united action\" on border security after Ceuta"}, "publishedDate": "2026-08-03"}], "title": {"en": "Which year is the precedent in the Channel, 1940 or 2020?", "tr": "Manş'ta hangi yıl emsal, 1940 mı 2020 mi?"}, "writer": "geo-06", "date": "2026-08-04"}, {"excerpt": {"en": "The suit 25 states filed on Monday does not ask whether the tariff is too high. It asks which text can carry it. The administration has reached for three different authorities inside a year, and the latest one has been used before and has survived review. Its peculiarity is that it grants a power and imposes a procedure in the same breath.", "tr": "25 eyaletin pazartesi açtığı dava, gümrük vergisinin yüksek olup olmadığını değil hangi metnin onu taşıyabileceğini soruyor. Yönetim bir yıl içinde üç ayrı yetkiye başvurdu; sonuncusu daha önce kullanılmış ve mahkemede ayakta kalmış bir madde. Farkı, başkana yetki verirken bir yandan da usul yüklemesi."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "Which text carries it", "tr": "Hangi metin taşıyor"}, "ps": [{"en": "Twenty-five states went to court on Monday against the double-digit tariffs imposed in July on 59 countries and the European Union. The rates run from 10 percent to 12.5 percent and reach countries that supply 99 percent of US imports, on the stated ground that they have not done enough to block imports made with forced labour. The authority invoked is Section 301 of the Trade Act of 1974. The states call it a pretext for replacing the tariffs the Supreme Court struck down in February.", "refs": ["tariff-suit"], "tr": "Yirmi beş eyalet pazartesi günü, temmuzda 59 ülke ve Avrupa Birliği'ne getirilen çift haneli gümrük vergilerine karşı dava açtı. Oranlar yüzde 10 ile yüzde 12,5 arasında değişiyor ve ABD ithalatının yüzde 99'unu sağlayan ülkeleri kapsıyor; gerekçe, bu ülkelerin zorla çalıştırmayla üretilen malların ithalatını yeterince engellememesi. Dayanak, 1974 tarihli Ticaret Yasası'nın 301. maddesi. Eyaletlere göre bu, şubatta Yüksek Mahkeme'nin iptal ettiği vergilerin yerine yenisini koymanın bahanesi."}, {"en": "The provision is a finding-based instrument. It confers no general taxing power. It attaches a tariff to a determination that a particular country's practices are unreasonable and burden US commerce. The White House defence is built in exactly that shape: a country's failure to enforce a prohibition on goods produced with forced labour cannot be called reasonable. That is a claim about another state's own enforcement rather than about a trade deficit, and it moves the argument from presidential discretion to the file assembled for each country.", "refs": ["tariff-suit"], "tr": "Bu madde tespite bağlı bir araçtır; genel bir vergilendirme yetkisi vermez. Vergiyi, belirli bir ülkenin uygulamalarının makul olmadığı ve ABD ticaretine yük getirdiği yolundaki bir bulguya bağlıyor. Beyaz Saray'ın savunması da tam olarak bu biçimde kuruluyor: bir ülkenin zorla çalıştırmayla üretilen mallara ilişkin yasağı uygulamaması makul sayılamaz. Bu, ticaret açığına değil karşı devletin kendi mevzuatını nasıl uyguladığına dair bir iddia; tartışmayı başkanın takdirinden her ülke için tutulan dosyaya taşıyor."}]}, {"h": {"en": "The limits Congress built in", "tr": "Kongre'nin koyduğu sınırlar"}, "ps": [{"en": "The sequence matters. In February the Supreme Court held that the 1977 emergency economic powers act did not authorise tariffs, and the ruling forced refunds to importers. The temporary 10 percent tariffs the administration then used expired at midnight on July 24, and the new ones stepped into precisely that gap. Two suits brought by small businesses in the same court in July are still being heard.", "refs": ["tariff-suit"], "tr": "Sıralama önemli. Yüksek Mahkeme şubatta 1977 tarihli acil ekonomik yetkiler yasasının vergi koymaya izin vermediğine hükmetti ve karar ithalatçılara iade yapılmasını gerektirdi. Yönetimin ardından başvurduğu geçici yüzde 10'luk vergiler 24 Temmuz gece yarısı sona erdi; yeni vergiler tam o boşluğa girdi. Aynı mahkemede temmuzdan beri küçük işletmelerin açtığı iki dava da görülüyor."}, {"en": "Barry Appleton of New York Law School says Section 301 has been used for decades and that Congress built it with real limits — investigation, consultation, a public file — so the case will turn not on whether the power exists but on whether the administration stayed within them. The implication is that the legal risk sits in the file rather than in the rate. The counter-possibility is equally plain: the 301 tariffs on China in the first term survived challenge, and a court may find the same procedural form sufficient here without treating the sheer breadth of the measure as a distinguishing fact.", "refs": ["tariff-suit"], "tr": "New York Hukuk Fakültesi'nden Barry Appleton'a göre 301. madde onlarca yıldır kullanılıyor ve Kongre onu soruşturma, istişare ve kamuya açık dosya gibi gerçek sınırlarla kurdu; dava da yetkinin varlığı üzerinde değil, bu sınırların içinde kalınıp kalınmadığı üzerinde dönecek. Buradan çıkan sonuç, hukuki riskin oranda değil dosyada durduğu. Karşı ihtimal de açık: 301 vergileri ilk dönemde Çin'e karşı uygulandığında mahkemede ayakta kalmıştı; bir mahkeme aynı usuli biçimi bu kez de yeterli bulabilir ve ölçeğin genişliğini tek başına ayırt edici saymayabilir."}]}, {"h": {"en": "Who carries the adjustment", "tr": "Uyum yükü kimin üzerinde"}, "ps": [{"en": "For an exporter what binds is the rate and the date it takes effect. For governments the demand is different: the measure asks them to enforce their own forced-labour prohibitions to a level the United States will accept as reasonable. A trade measure built this way exports a single compliance standard to some 60 jurisdictions at once. The money is collected at the border, but the demand is aimed at another state's inspection capacity.", "refs": ["tariff-suit"], "tr": "İhracatçı için bağlayıcı olan oran ve yürürlük tarihi. Devletler için talep başka: ölçüt, kendi zorla çalıştırma yasaklarını ABD'nin makul saydığı düzeyde uygulamak. Bu biçimdeki bir ticaret önlemi, aynı anda 60 yargı düzenine tek bir uyum ölçütü ihraç ediyor; vergi tahsil edilen yer sınır kapısı olsa da asıl talep karşı ülkenin denetim kapasitesine yönelik."}, {"en": "The test is identifiable. If the Court of International Trade reaches the merits of the states' claim, the thing to watch is the axis on which the ruling is built: the adequacy of the investigation and public file for each country, or the president's authority. A decision that draws that line before the end of the year would also make the cost of any future use of Section 301 measurable.", "refs": ["tariff-suit"], "tr": "Sınanacak nokta belli. Uluslararası Ticaret Mahkemesi eyaletlerin iddiasının esasına girerse, kararın hangi eksende kurulduğuna bakmak gerekiyor: her ülke için yürütülen soruşturmanın ve kamuya açık dosyanın yeterliliği mi, yoksa başkanın yetkisi mi. Yıl sonuna kadar bu ayrımı gösteren bir karar çıkarsa, 301. maddenin bundan sonraki kullanımının maliyeti de ölçülebilir hale gelir."}]}], "sources": [{"key": "tariff-suit", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/tariffs-25-supreme-court-import-taxes-120895adbee7ae06157cd5f4bf5c7583", "title": {"tr": "Yirmi beş eyalet, zorla çalıştırma gerekçeli yeni gümrük vergilerini dava etti", "en": "Twenty-five states sue over the new tariffs justified by forced-labour findings"}, "publishedDate": "2026-08-03"}], "title": {"en": "The same tariff, now on its third legal basis", "tr": "Aynı vergi, üçüncü yasal dayanak"}, "writer": "geo-01", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "A boat's engine caught fire in the Channel on Tuesday morning and the rescue was carried out with vessels from two countries. Counting the ships does not show where the cooperation was shared; the port where the rescued were landed does. On this crossing both questions had the same answer.", "tr": "Salı sabahı Manş'ta bir botun motoru tutuştu ve kurtarma iki ülkenin araçlarıyla yürütüldü. Gemileri saymak işbirliğinin nerede paylaşıldığını göstermeye yetmiyor; kurtarılanların hangi limana çıkarıldığına bakmak gerekiyor. Bu geçişte iki soruya da aynı cevap verildi."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The arithmetic of the operation", "tr": "Operasyonun aritmetiği"}, "ps": [{"en": "According to the statement from the maritime prefecture for the Channel and the North Sea, the boat's engine caught fire close to British waters but still inside France's search-and-rescue zone, and the vessel rapidly began to break apart. France deployed two rescue ships, a Navy helicopter and medical personnel, while Britain's Royal National Lifeboat Institution and Border Force joined the response.", "refs": ["channel-rescue"], "tr": "Manş ve Kuzey Denizi Deniz Valiliği'nin açıklamasına göre bot, İngiltere sularına yakın bir noktada ama hâlâ Fransa'nın arama kurtarma bölgesindeyken motoru tutuştu ve hızla dağılmaya başladı. Fransa iki kurtarma gemisi, bir deniz kuvvetleri helikopteri ve sağlık ekibi görevlendirdi; İngiltere tarafından Kraliyet Ulusal Cankurtarma Kurumu ile Sınır Gücü müdahaleye katıldı."}, {"en": "Of the 157 people rescued, 103 were taken aboard French vessels and 54 aboard British ones. All of them were landed at the port of Boulogne-sur-Mer for medical assessment and assistance.", "refs": ["channel-rescue"], "tr": "Kurtarılan 157 kişinin 103'ünü Fransız, 54'ünü İngiliz tekneleri aldı. Hepsi tıbbi değerlendirme ve yardım için Boulogne-sur-Mer limanına çıkarıldı."}, {"en": "On one side of the scale sits the shared response: British crews took nearly a third of those rescued. On the other sits everything that comes afterwards. The zone determines who directs the operation and the port determines who takes on shelter, medical care and paperwork, and on this crossing both pointed to France.", "refs": ["channel-rescue"], "tr": "Bir kefede müdahalenin paylaşımı var: kurtarılanların üçte birine yakınını İngiliz ekipleri aldı. Öbür kefede sonrasının tamamı duruyor. Bölge kimin sevk ve idare edeceğini, liman ise kimin barındırma, sağlık ve idari işlemleri üstleneceğini belirliyor; bu geçişte iki ölçüt de Fransa'yı işaret etti."}]}, {"h": {"en": "Where the agreement reaches", "tr": "Anlaşmanın değdiği yer"}, "ps": [{"en": "The boat had left the Normandy shore on Monday and was being monitored by French rescue vessels. Five people asked for help during the night and were brought ashore, while the rest refused assistance and carried on. The prefecture says people in overloaded makeshift boats often accept rescue only in the face of immediate danger, and that crews do not force anyone off because of the risk of capsizing. Four people died a week ago in two separate attempts.", "refs": ["channel-rescue"], "tr": "Bot pazartesi Normandiya kıyısından hareket etmiş ve Fransız kurtarma gemilerince izlenmişti. Gece boyunca beş kişi yardım isteyip karaya çıkarıldı; geri kalan yolcular yardımı reddederek yola devam etti. Valiliğe göre aşırı yüklü derme çatma botlardaki insanlar çoğu kez ancak doğrudan tehlike anında yardımı kabul ediyor ve ekipler alabora riski nedeniyle kimseyi zorla tekneden almıyor. Bir hafta önce iki ayrı denemede dört kişi ölmüştü."}, {"en": "The multimillion-euro agreement France and Britain signed earlier this year is aimed at departures: more patrols, enhanced surveillance and new technology against the small inflatable boats smugglers use. What decided Tuesday morning was a refusal after departure. The distance between what the agreement covers and the moment the incident occurred is also a measure of where the cooperation actually works. Another reading is available: departures may already be under pressure, and a night-time refusal of help may follow smugglers' instructions to passengers rather than any flaw in the agreement's design.", "refs": ["channel-rescue"], "tr": "Fransa ile Birleşik Krallık'ın bu yılın başında imzaladığı milyonlarca euroluk anlaşma kalkışları hedefliyor: daha fazla devriye, artırılmış gözetim ve kaçakçıların kullandığı küçük şişme botlara karşı yeni teknoloji. Salı sabahındaki olayı belirleyen ise kalkıştan sonraki ret oldu. Anlaşmanın kapsamı ile olayın gerçekleştiği an arasındaki bu boşluk, işbirliğinin nerede işlediğini de gösteriyor. Başka bir okuma da mümkün: kalkışlar zaten baskı altında olabilir ve gece yardımı reddetmek, anlaşmanın tasarım eksiğinden çok kaçakçıların yolcuya verdiği talimatın sonucu olabilir."}, {"en": "It is early to say a balance has been struck. The measure to watch in prefecture statements over the coming months is whether the share of attempts halted before departure rises relative to those rescued at sea. If that share does not move, the agreement is shifting the scene rather than the outcome.", "refs": ["channel-rescue"], "tr": "Denge kuruldu demek için erken. Önümüzdeki aylarda valilik açıklamalarında izlenecek ölçü, kalkıştan önce durdurulan denemelerin payının denizde kurtarılanlara göre artıp artmadığı olacak. Bu pay değişmiyorsa anlaşma, sonucu değil yalnızca sahneyi kaydırıyor demektir."}]}], "sources": [{"key": "channel-rescue", "kind": "news", "name": "AP News", "url": "https://apnews.com/article/france-britain-crossings-migrants-rescued-24e0fcc2d9123875a8e86ad4fb887adc", "title": {"tr": "Manş'ta motoru tutuşan bottaki 157 kişi Fransız ve İngiliz ekiplerce kurtarıldı", "en": "French and British crews rescue 157 people after a boat's engine catches fire in the Channel"}, "publishedDate": "2026-08-04"}], "title": {"en": "All 157 of the rescued came ashore at Boulogne", "tr": "Kurtarılan 157 kişinin tamamı Boulogne'a çıkarıldı"}, "writer": "geo-02", "n": 2, "date": "2026-08-04"}, {"excerpt": {"en": "Japan's annual defence paper was approved by the cabinet on Tuesday. The part that states intent is long; the part that can be counted is short. What can be counted is this: four makers, a naval test in early August, and a selection after it.", "tr": "Japonya'nın yıllık savunma raporu salı günü kabinede onaylandı. Belgenin niyet bildiren kısmı uzun; sayılabilen kısmı kısa. Sayılabilen kısım şu: dört üretici, ağustos başında bir deniz denemesi ve ardından yapılacak bir seçim."}, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "sections": [{"h": {"en": "The countable part of the document", "tr": "Belgede sayılabilen kısım"}, "ps": [{"en": "The 598-page paper again names China as Japan's biggest strategic challenge and treats adaptation to the forms of warfare seen in Ukraine and the Middle East as necessary. The priority is stated plainly: domestically developed drones for coastal defence, in combination with long-range missiles.", "refs": ["japan-paper"], "tr": "598 sayfalık rapor Çin'i yeniden Japonya'nın en büyük stratejik meydan okuması olarak tanımladı ve Ukrayna ile Orta Doğu'da görülen savaş biçimlerine uyumu zorunlu saydı. Öncelik açık: kıyı savunması için ülke içinde geliştirilecek insansız hava araçları, uzun menzilli füzelerle birlikte."}, {"en": "The schedule is more concrete. The Acquisition, Technology and Logistics Agency selected four makers from 38 applicants for a rapid programme; they enter testing by Japan's navy in early August, with a final selection to follow. Toshiba announced on Friday that it would develop combat drones jointly with the startup Pro Drone.", "refs": ["japan-paper"], "tr": "Takvim tarafı daha somut. Satın Alma, Teknoloji ve Lojistik Ajansı hızlandırılmış bir program için 38 başvuru arasından dört üretici seçti; bu üreticiler ağustos başında deniz kuvvetlerinin denemelerine girecek, nihai seçim sonra yapılacak. Toshiba da cuma günü Pro Drone adlı girişimle ortak geliştirme planını duyurdu."}, {"en": "A defence paper is a statement of intent. Capability starts to count on the day the test happens, the day the selection is announced and the day a production line exists. Of those three dates, only the first is currently in hand.", "refs": ["japan-paper"], "tr": "Bir savunma raporu niyet beyanıdır. Kabiliyet, denemenin yapıldığı gün, seçimin açıklandığı gün ve üretim hattının kurulduğu gün sayılmaya başlar. Şu an elde bu üç tarihten yalnızca ilki var."}]}, {"h": {"en": "What stands i
