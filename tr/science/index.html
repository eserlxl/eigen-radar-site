generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/science-preclinical-local-environments-1280.d2739ba09137.webp", "variants": [{"src": "/assets/briefs/2026-07-27/science-preclinical-local-environments-640.b26aaf7fb7b0.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/science-preclinical-local-environments-1280.d2739ba09137.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Bağırsak bakterileri ve tümör benzeri hücrelerden enfekte doku kanalına ve jel lifleriyle köprülenen gözenekli kemiğe uzanan biyomedikal illüstrasyon", "en": "Biomedical illustration flowing from gut bacteria and tumour-like cells through an infected tissue channel to porous bone bridged by gel fibres"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}, {"id": "science-nutrition-meeting-snapshots", "topic": "science", "title": {"tr": "Beslenme kongresinden üç ön bulgu", "en": "Three preliminary findings from a nutrition meeting"}, "summary": {"tr": "NUTRITION 2026'da sunulan üç çalışma; yeme saatleri ile bilişsel testleri, küçük çocuk ürünlerinin besin profilini ve gazlı içeceklerden sonra ağız asitliğini inceliyor.", "en": "Three studies presented at NUTRITION 2026 examine eating hours and cognitive tests, the nutrient profile of toddler foods, and oral acidity after carbonated drinks."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/science-nutrition-meeting-snapshots-1280.72a50fdfd785.webp", "variants": [{"src": "/assets/briefs/2026-07-27/science-nutrition-meeting-snapshots-640.60527c9540cd.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/science-nutrition-meeting-snapshots-1280.72a50fdfd785.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Dar bir açıklıktan labirente ilerleyen pulları, etiketsiz gıda kaplarıyla işlenmiş taneleri ve kabarcıklar altındaki mine benzeri yüzeyi gösteren editoryal illüstrasyon", "en": "Editorial illustration showing tokens moving through a narrow opening into a maze, unlabelled food containers with processed pellets, and an enamel-like surface beneath bubbles"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}], "articles": [{"writer": "sci-01", "title": {"tr": "Işık hızının yüzde otuzundan saniyelerce duruşa", "en": "From thirty percent of light speed to a few seconds of standing still"}, "excerpt": {"tr": "Hızlandırıcıdan çıkan çıplak argon çekirdekleri on binde bire yavaşlatılıp bir Penning tuzağında elektronlarla soğutuldu. Elde edilen şey bir ölçüm yeteneği; karşılığı ancak ilk duyarlı ölçümün belirsizliğinde görünüyor.", "en": "Bare argon nuclei from an accelerator were slowed by a factor of ten thousand and cooled with electrons inside a Penning trap. What was gained is a measurement capability, and its worth shows only in the uncertainty of the first precision measurement."}, "sections": [{"h": {"tr": "Yavaşlatma zinciri", "en": "The deceleration chain"}, "ps": [{"tr": "Darmstadt Teknik Üniversitesi ile GSI Ağır İyon Araştırma Merkezi'nin bildirdiği deneyde kullanılan parçacık, tüm elektronları sıyrılmış bir argon çekirdeği. Hızlandırıcıda ışık hızının yaklaşık yüzde 30'una çıkarılıyor; tuzaklanabilmesi için kinetik enerjisinin yaklaşık 10.000 kat düşürülmesi gerekiyor. Ardından 387 milimetre uzunluğundaki HITRAP soğutma tuzağında birkaç saniye tutuluyor ve orada elektronlarla soğutuluyor. Simon Rausch'a göre hızlandırıcıdan tuzağa uzanan bu yolun tümü ilk kez baştan sona gösterildi.", "en": "The particle in the experiment reported by the Technical University of Darmstadt and the GSI heavy-ion research centre is an argon nucleus stripped of every electron. The accelerator brings it to about 30% of the speed of light; to be trapped at all, its kinetic energy has to come down by a factor of about 10,000. It is then held for several seconds in the 387 mm HITRAP Cooling Trap and cooled there with electrons. According to Simon Rausch, the whole path from accelerator to trap was demonstrated end to end for the first time.", "refs": ["source-hitrap"]}, {"tr": "Bu sayıların sırası, sonucun neden bir yavaşlatma başarısı olarak okunması gerektiğini anlatıyor. Hızlı bir çekirdekle çalışmak, ona bakmak için çok kısa bir süreniz olması demek; enerjiyi almak, o süreyi uzatmak demek. Duyuruda yeni bir fiziksel büyüklük ölçümü ya da kuram sınaması yer almıyor; sunulan şey, yavaş ve yüksek yüklü ağır iyonlarla yapılacak duyarlı deneyler için kurulan teknolojik temel. Bu, kazanımın adının yetenek olduğu anlamına geliyor.", "en": "The order of those numbers is what makes the result read as an achievement in slowing things down. Working with a fast nucleus means having very little time to look at it; taking energy out means buying that time back. The announcement carries no new measurement of a physical quantity and no test of theory; what it presents is a technological foundation for precision experiments with slow, highly charged heavy ions. The right name for the gain, then, is capability.", "refs": ["source-hitrap"]}]}, {"h": {"tr": "Soğutmanın açtığı alan", "en": "The space that cooling opens"}, "ps": [{"tr": "Elektron soğutması, tuzakta bekleyen soğuk elektronların iyonların hareket enerjisini yavaş yavaş üzerlerine almasına dayanır. Yüksek yüklü iyonlara böyle bir Penning tuzağında ilk kez uygulandığı bildiriliyor. Duyuruda tesisin ilk kullanıcı deneyinin malzeme bilimi araştırması için yavaş altın iyonlarıyla yapıldığı da belirtiliyor; düzenek, bir gösteriden çıkıp başka ekiplerin kullandığı bir kaynak hâline gelmiş.", "en": "Electron cooling works by letting cold electrons waiting in the trap take up the ions' motion energy little by little. It is reported as applied to highly charged ions in such a Penning trap for the first time. The announcement also notes that the facility's first user experiment used slow gold ions for materials science research; the setup has moved from being a demonstration to being a resource other teams draw on.", "refs": ["source-hitrap"]}, {"tr": "Çıplak ve hidrojen benzeri ağır çekirdekler, elektrik alanların doğada ulaşabileceği en şiddetli değerlere yaklaştığı yerlerdir; bu yüzden kuantum elektrodinamiğinin en zorlu sınamaları oraya bakar. Yüksek yüklü ağır iyonlarla yapılacak duyarlı deneylerin kesinliği, çekirdeğin ne kadar soğuk ve ne kadar uzun tutulabildiğine bağlıdır. Saniyeler ölçeğindeki bir depolama süresi bu sınırı nereye taşıyor, eldeki duyuru söylemiyor. Yanıt, bu tuzakta yapılan ilk spektroskopi ölçümünün bildirdiği belirsizlikte duruyor; yetenek ancak o belirsizlik önceki sınırların altına inerse karşılığını veriyor.", "en": "Bare and hydrogen-like heavy nuclei are where electric fields come closest to the most violent values nature allows, which is why the hardest tests of quantum electrodynamics look there. The precision of experiments with slow, highly charged heavy ions depends on how cold the nucleus can be kept and for how long. Where a storage time measured in seconds moves that bound, the announcement in hand does not say. The answer sits in the uncertainty reported by the first spectroscopy measurement made in this trap; only if that uncertainty falls below the earlier limits does the capability pay for itself.", "refs": ["source-hitrap"]}]}], "sources": [{"key": "source-hitrap", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-electron-cooling-highly-ions-penning.html", "title": {"tr": "Hızlandırıcıdan çıkan çıplak argon çekirdekleri ilk kez bir Penning tuzağında elektronlarla soğutuldu", "en": "Bare argon nuclei from an accelerator were cooled with electrons in a Penning trap for the first time"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-02", "title": {"tr": "Sıçan pankreası farede büyüdü, insan hücresi hâlâ kapıda", "en": "A rat pancreas grew in a mouse, and human cells are still at the door"}, "excerpt": {"tr": "Türler arası organ üretiminin önündeki engel genetik uzaklık yerine konak embriyonun doğuştan gelen bağışıklığı çıktı. Üç ayrı müdahale yolu var ve her birinin bedeli farklı yere yazılıyor.", "en": "The barrier to growing organs across species turns out to be the host embryo's innate immunity rather than genetic distance. Three separate routes of intervention exist, and each charges its cost somewhere different."}, "sections": [{"h": {"tr": "Engelin adı", "en": "Naming the barrier"}, "ps": [{"tr": "Institute of Science Tokyo ekibinin Cell dergisinde yayımladığı çalışma, yabancı bir embriyoda baskı altına giren verici hücrelerin yüzeyinde fosfatidilserin açığa çıktığını ve konak makrofajlardaki Axl reseptörünün bunu bir 'beni ye' işareti gibi okuduğunu bildiriyor. Ekip süreci ksenofagositoz olarak adlandırıyor. Verici hücreler yerleşemedikleri için değil, tanındıkları için ortadan kalkıyor.", "en": "The study published in Cell by the Institute of Science Tokyo team reports that when donor cells come under stress inside a foreign embryo, phosphatidylserine appears on their surface, and the Axl receptor on host macrophages reads it as an eat-me cue. The team names the process xenophagocytosis. Donor cells disappear because they are recognised, and not because they fail to settle.", "refs": ["source-chimera"]}, {"tr": "Bu, sorunun türünü değiştiriyor. Türler arası uyumsuzluk uzun süre bir genetik mesafe sorunu gibi ele alındı; burada tarif edilen ise doğuştan gelen bağışıklığın bir tanıma adımı. Fark pratik: genetik mesafeyi kısaltmak elinizde değil, bir tanıma adımını hedeflemek ise ilaç ve gen düzenleme araçlarının bildiği bir iş. Bununla birlikte alternatif bir okuma da açık: ksenofagositoz paralel engellerden yalnızca biri olabilir ve ortadan kaldırılması sıradaki engeli görünür kılabilir.", "en": "That changes the kind of problem this is. Cross-species incompatibility has long been treated as a matter of genetic distance; what is described here is a recognition step in innate immunity. The difference is practical: you cannot shorten genetic distance, but targeting a recognition step is work that drugs and gene-editing tools already know how to do. However, an alternative reading stays open: xenophagocytosis may be only one of several parallel barriers, and clearing it could bring the next one into view.", "refs": ["source-chimera"]}]}, {"h": {"tr": "Üç kaldıraç, üç farklı bedel", "en": "Three levers, three different costs"}, "ps": [{"tr": "Ekip üç müdahale denedi: konak makrofajlarını azaltmak ya da Axl reseptörünü devre dışı bırakmak, verici hücrelere CD47 üretimi eklemek ve ATP11C etkinliğini artırarak fosfatidilserini zarın iç yüzünde tutmak. Bildirilene göre sıçandan fareye pankreas oluşturmanın başarı oranı arttı; insan hücreleriyle kurulan fare kimeralarında verici hücrelerin sağkalımı belirgin biçimde iyileşti.", "en": "The team tried three interventions: depleting host macrophages or disrupting the Axl receptor, engineering donor cells to express CD47, and raising ATP11C activity so phosphatidylserine stays on the inner face of the membrane. As reported, the success rate for generating a rat pancreas in mice increased; in human-to-mouse chimeras, the survival of donor cells markedly improved.", "refs": ["source-chimera"]}, {"tr": "Bu üç yol aynı şey değil. İlk ikisi konağı hedefliyor: konak makrofajlarına dokunmak, embriyonun kendi savunmasını zayıflatmak anlamına gelir ve bedeli hem hayvanda hem ileride herhangi bir uygulamada konağa yazılır. Son ikisi ise değişikliği verici hücreye taşıyor; CD47 ya da ATP11C üzerinden yapılan bir düzenleme hücreyle birlikte gider ve konağın bağışıklığını olduğu gibi bırakır. Yolların ayrımı bir verim sorusundan çok, kimin savunmasının feda edileceği sorusudur.", "en": "These three routes are not alike. The first two target the host: touching host macrophages means weakening the embryo's own defence, and that cost is charged to the host, in the animal now and in any application later. The last two move the change into the donor cell; an edit made through CD47 or ATP11C travels with the cell and leaves the host's immunity as it was. What separates the routes is less a question of yield than a question of whose defence is given up.", "refs": ["source-chimera"]}]}, {"h": {"tr": "Kliniğe olan mesafe", "en": "The distance to the clinic"}, "ps": [{"tr": "İnsan hücrelerine dair bildirilen sonuç, fare embriyosunda sağkalım. Bu bir organ değil; organ oluşumu sıçandan fareye, yani iki kemirgen arasında gösterildi. Makale 5 Haziran 2026'da çevrim içi yayımlandı ve klinik bir veri sunmuyor. Mesafeyi kapatacak adım, konak türünün büyümesi ve ölçütün sağkalımdan işleve geçmesidir.", "en": "The reported result for human cells is survival inside a mouse embryo. That is not an organ; organ formation was shown from rat to mouse, that is, between two rodents. The paper appeared online on 5 June 2026 and offers no clinical data. The step that would close this distance is a larger host species and an endpoint that moves from survival to function.", "refs": ["source-chimera"]}, {"tr": "Buradan ölçülebilir bir beklenti çıkarılabilir. Eğer ksenofagositoz asıl engelse, bu yolu izleyen bir sonraki çalışmanın insan hücreleri için sağkalım yerine yüzde olarak bildirilmiş bir kimerizm oranı vermesi gerekir; önümüzdeki bir yıl içinde böyle bir oran yayımlanmazsa engelin tek başına bu olmadığını düşünmek için sebebimiz olur. Şimdilik doğru cümle şudur: mekanizma ikna edici, sonuç kemirgende.", "en": "A measurable expectation follows. If xenophagocytosis is the principal barrier, the next study on this route should report, for human cells, a chimerism rate given as a percentage instead of survival; if no such figure appears within the coming year, there will be reason to think this is not the only barrier. For now the accurate sentence is this: the mechanism is convincing and the result is in rodents.", "refs": ["source-chimera"]}]}], "sources": [{"key": "source-chimera", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-immune-blocking-strategy-interspecies-generation.html", "title": {"tr": "Fare embriyosunda sıçan organı büyütmenin önündeki engel bir bağışıklık tepkisi çıktı", "en": "The barrier to growing a rat organ in a mouse embryo turned out to be an immune response"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-03", "title": {"tr": "Bir elmasın içindeki mikron ölçekli kapanım suyun derin yolunu gösteriyor", "en": "A micron-sized inclusion inside a diamond marks water's deep route"}, "excerpt": {"tr": "Juína'dan çıkan üç milimetrelik bir taş, su bağlayan bir demir mineralinin manto basınçlarından sağ çıkabildiğini gösteriyor. Derin su döngüsüne bir taşıyıcı ekliyor; taşınan miktarı ise hâlâ ölçmüyor.", "en": "A three-millimetre stone from Juína shows that a water-bearing iron mineral can survive mantle pressures. It adds a carrier to the deep water cycle; it still does not measure how much water is carried."}, "sections": [{"h": {"tr": "Kapanımın kimliği", "en": "What the inclusion is"}, "ps": [{"tr": "Örnek, Mato Grosso'daki Chapadão yaylasından çıkan üç milimetrelik bir elmas. İçindeki kapanım yaklaşık 35 mikrometre çapında ve tek bir mineralden ibaret değil: götit, hematit ve manyetit bir arada bulunuyor, yaklaşık yüzde 4 nikel içeriyor. Scientific Reports dergisinde 11 Mayıs 2026'da yayımlanan makale, bu topluluğun oluşum koşullarını yaklaşık 35–57 gigapaskal basınç ve 877–2470 santigrat derece aralığına, litosfer altında 300 ile 1000 km arasındaki derinliklere yerleştiriyor. Ölçümler taşı kırmadan, X-ışını tomografisi, X-ışını kırınımı ve X-ışını soğurma yöntemleri birlikte kullanılarak yapıldı.", "en": "The sample is a three-millimetre diamond from the Chapadão plateau in Mato Grosso. The inclusion inside it is about 35 micrometres across and is more than a single mineral: goethite, hematite and magnetite occur together, with roughly 4 percent nickel. The paper published in Scientific Reports on 11 May 2026 places the assemblage's formation conditions at about 35–57 gigapascals and 877–2470 degrees Celsius, at sublithospheric depths between 300 and 1000 km. The measurements were made without breaking the stone, combining X-ray tomography, X-ray diffraction and X-ray absorption methods.", "refs": ["source-diamond"]}, {"tr": "Elmasın burada oynadığı rol bir kap olmaktan ibaret değil. Yüzeye doğru yükselirken basınç ve sıcaklık düşer; kapanımdaki mineral topluluğu bu yolculuk boyunca değişmeden kalabildiyse, taş kendi oluştuğu koşulların tanığı hâline gelir. Ölçülen şey bu tanıklıktır: derinde bir yerde suyu yapısında bağlı tutan bir demir mineralinin bulunabildiği.", "en": "The diamond's role here goes beyond that of a container. Pressure and temperature fall on the way to the surface; if the mineral assemblage in the inclusion survived that journey unchanged, the stone becomes a witness to the conditions in which it formed. What was measured is that witness statement: that somewhere deep, an iron mineral holding water in its structure can exist.", "refs": ["source-diamond"]}]}, {"h": {"tr": "Su döngüsünün derin kolu", "en": "The deep arm of the water cycle"}, "ps": [{"tr": "Yerin su bütçesinin yüzeyde görünmeyen bir kolu var: dalma-batma bölgelerinde okyanus tabanı mantoya inerken taşıdığı su, mineral yapılarına bağlı olarak gider. Hangi minerallerin hangi basınçlara dayandığı, bu kolun ne kadar derine ulaştığını belirler. Demir oksihidroksitin bu koşullara dayanabildiğinin doğrudan gösterilmesi, listeye bir taşıyıcı ekliyor.", "en": "The Earth's water budget has an arm that stays invisible at the surface: as the ocean floor descends into the mantle at subduction zones, the water it carries travels bound into mineral structures. Which minerals withstand which pressures determines how deep that arm reaches. Showing directly that an iron oxyhydroxide can withstand these conditions adds one carrier to the list.", "refs": ["source-diamond"]}, {"tr": "Duyuruda araştırmacıların vurguladığı sonuç şu: bu tür minerallerden serbest kalan su çevredeki kayaların erime sıcaklığını düşürüyor ve yavaşça yükselen küçük hacimli magmalar üretebiliyor. Mekanizma makul, ama nedensellik yönünde dikkatli olmak gerekiyor. Elde bir kapanım var; belirli bir magma gövdesinin bu yolla oluştuğuna dair bir bağlantı bildirilmiyor. Bununla birlikte aynı gözlem, taşıyıcının varlığını gösterip yaygınlığı konusunda sessiz kalan tekil bir örnek olarak da okunabilir.", "en": "The conclusion the researchers stress in the announcement is this: water released from minerals of this kind lowers the melting point of surrounding rock and can produce small volumes of magma that rise slowly. The mechanism is plausible, but care is needed about the causal direction. What exists is one inclusion; no link is reported between it and any particular body of magma. However, the same observation can also be read as a single case that establishes the carrier's existence and stays silent about how common it is.", "refs": ["source-diamond"]}]}, {"h": {"tr": "Varlık değil, akış", "en": "Flux rather than existence"}, "ps": [{"tr": "Derin su döngüsünü ilgilendiren büyüklük akıştır: yılda kaç kilogram su mantoya iniyor ve ne kadarı geri dönüyor. Tek bir taştaki tek bir kapanım bu hesaba doğrudan bir sayı katmaz; katabileceği şey, hesabın hangi minerallerle kurulacağını değiştirmesidir. Bir sonraki gerçek adım da bu yüzden başka bir tekil bulgu değil: eğer demir oksihidroksit ender bir rastlantı olmayıp yaygın bir taşıyıcıysa, aynı üç mineralden oluşan bir kapanımın başka bir kratondan gelen elmasta da bildirilmesi gerekir. Önümüzdeki iki yıl içinde böyle bir ikinci kapanım yayımlanırsa taşıyıcı listeye kalıcı olarak girer; yayımlanmazsa elde tekil bir örnek kalır.", "en": "The quantity that matters for the deep water cycle is flux: how many kilograms of water descend into the mantle each year and how much comes back. One inclusion in one stone adds no number to that account directly; what it can change is which minerals the account is built from. The real next step, then, is not another single find: if iron oxyhydroxide is a common carrier rather than a rare accident, an inclusion of the same three minerals should be reported from a diamond of another craton. Publication of such a second inclusion within the coming two years puts the carrier permanently on the list; absent that, what remains in hand is a single case.", "refs": ["source-diamond"]}]}], "sources": [{"key": "source-diamond", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-08-ancient-diamond-evidence-mineral-deep.html", "title": {"tr": "Bir elmasın içinde su taşıyan bir demir minerali litosferin altındaki basınçlardan sağ çıkmış", "en": "A water-bearing iron mineral survived sublithospheric pressures inside a diamond"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-46683-8", "publishedDate": "2026-05-11", "title": {"tr": "Iron oxyhydroxide as water carrier to the Earth's mantle", "en": "Iron oxyhydroxide as water carrier to the Earth's mantle"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-04", "title": {"tr": "Kırık amforanın eksik parçası artık ölçüm de yapıyor", "en": "The missing piece of a broken amphora now takes measurements too"}, "excerpt": {"tr": "Seramik onarımı Koç Üniversitesi'nde dört adımlı bir iş akışına çevrildi: fotoğrafla belgele, eksiği sayısal olarak kur, dolguyu bas, içine algılayıcı göm. Adımların her biri tanıdık; yeni olan, onarımın kendisinin bir ölçüm aracına dönüşmesi.", "en": "A team at Koç University turned ceramic repair into a four-step workflow: document by photograph, reconstruct the gap digitally, print the fill, embed sensors inside it. Each step is familiar; what is new is that the repair itself becomes an instrument."}, "sections": [{"h": {"tr": "Dört adım", "en": "Four steps"}, "ps": [{"tr": "Fotogrametri ile nesne yüzlerce örtüşen açıdan çekiliyor ve bu fotoğraflardan üç boyutlu bir sayısal model çıkarılıyor. Eksik bölüm bu model üzerinden sayısal olarak yeniden kuruluyor, ardından ona uyan dolgu eklemeli üretimle basılıyor. Dördüncü adımda dolgunun içine algılayıcılar gömülüyor. Yöntem Bandırma Arkeoloji Müzesi'ndeki geç Bizans dönemine ait Günsenin IV amforalarında ve İtalya'daki Minori Villa Romana e Antiquarium koleksiyonundaki Amalfi kıyısı amforalarında denendi.", "en": "Photogrammetry captures the object from hundreds of overlapping angles, and those photographs yield a three-dimensional digital model. The missing section is digitally reconstructed from that model, and a fill matched to it is then produced by additive manufacturing. In the fourth step, sensors are embedded inside the fill. The method was tried on late Byzantine Günsenin IV amphorae at the Bandırma Archaeology Museum and on Amalfi-coast amphorae in the collection of the Minori Villa Romana e Antiquarium in Italy.", "refs": ["source-pottery"]}, {"tr": "Gömülü algılayıcılar sıcaklık, nem, pH ve fiziksel gerilmeyi ölçmek üzere tasarlandı. Müzede yapılan ilk denemelerde günlük sıcaklık ve nem değişimleriyle bir gerilme algılayıcısının yakaladığı kuvvet örüntüleri kaydedildi. Ölçülen büyüklüklerin seçimi keyfi değil: tuz göçü, biçim bozulması ve mikro çatlaklar tam da bu üç değişkenin bileşiminden doğuyor.", "en": "Embedded sensors are designed to measure temperature, humidity, pH and physical stress. In first tests at the museum, daily changes in temperature and humidity were logged along with patterns of force picked up by a stress sensor. The choice of measured quantities is not arbitrary: salt migration, deformation and microfractures arise from the combination of exactly these three variables.", "refs": ["source-pottery"]}]}, {"h": {"tr": "Yeni olan parça", "en": "The part that is new"}, "ps": [{"tr": "Geleneksel alçı dolgu nesneyi zaman içinde tehdit eden çevresel değişimler ve fiziksel gerilmeler hakkında bilgi veremiyor. Burada eksik hacim, doldurulacak bir boşluk olmaktan çıkıp donanımın yuvası hâline geliyor. Fotogrametri, sayısal yeniden kurma ve eklemeli üretim ayrı ayrı yerleşmiş tekniklerdir; birleşimin getirdiği asıl değişiklik, onarımın pasif bir malzeme olmaktan çıkıp sürekli ölçüm yapan bir yapıya dönüşmesidir.", "en": "Traditional plaster repairs cannot provide information about environmental changes or physical stresses that may threaten the object over time. Here the missing volume stops being a gap to be filled and becomes the housing for the hardware. Photogrammetry, digital reconstruction and additive manufacturing are each well-established techniques; what the combination changes is that the repair stops being a passive material and turns into a structure that keeps measuring.", "refs": ["source-pottery"]}, {"tr": "Bu birleşim bir ödünleşme de getiriyor. Dolgunun aynı anda iki koşulu sağlaması gerekiyor: koruma açısından kabul edilebilir bir geometri ve elektronik parçaları taşıyabilen bir iç yapı. Bir seramik onarımında dolgu genellikle mümkün olduğunca ince ve geri alınabilir tutulur; algılayıcı barındıran bir dolgu ise kalınlık ve hacim ister. Bu iki gereksinimin nerede çakıştığı, yöntemin hangi nesnelerde kullanılabileceğini belirleyen asıl kısıttır.", "en": "The combination also brings a trade-off. The fill has to satisfy two conditions at once: a geometry acceptable for conservation, and an internal structure able to carry electronic components. In ceramic repair a fill is usually kept as thin and as reversible as possible; a fill that houses sensors demands thickness and volume. Where those two requirements collide is the real constraint on which objects the method can be used for.", "refs": ["source-pottery"]}]}, {"h": {"tr": "Teslim edilmemiş olan", "en": "What has not been delivered"}, "ps": [{"tr": "Makalede algılayıcıların güç kaynağı, verinin nasıl okunup aktarıldığı, basılan dolgunun malzeme bileşimi ve ölçüm ayarı bildirilmiyor. Yazarlar da çalışmanın öncelikle yöntemi sunduğunu, sonuçların, uygulamadaki karşılığının ve maliyet etkinliğinin sonraki çalışmalara kaldığını söylüyor. Bu durumda elde olan şey belgelenmiş ve yinelenebilir bir iş akışı; sahada kendi başına çalışan bir sistem için gereken dört kalem hâlâ eksik. Eğer bu dördü yayımlanırsa, yöntemin bir müzede yıllarca çalışıp çalışamayacağı ilk kez değerlendirilebilir.", "en": "The article reports no power source for the sensors, no account of how the data is read out or transmitted, no material composition for the printed fill and no calibration. The authors themselves say the work primarily presents the method, and that results, practical application and cost-effectiveness are left to later work. What is in hand, then, is a documented and repeatable workflow; the four items a field-standing system needs are still missing. If those four are published, whether the method can run for years inside a museum becomes assessable for the first time.", "refs": ["source-pottery"]}]}], "sources": [{"key": "source-pottery", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-sensor-embedded-3d-ancient-pottery.html", "title": {"tr": "Kırık amforaların eksik parçaları, içine algılayıcı gömülü üç boyutlu baskılarla tamamlandı", "en": "Missing pieces of broken amphorae were completed with 3D prints holding embedded sensors"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-05", "title": {"tr": "Aynı malzemede iki yöntem iki farklı manyetik düzen buluyor", "en": "Two methods find two different magnetic orders in the same material"}, "excerpt": {"tr": "Rutenyum dioksitte yıllardır süren tartışmaya yeni bir ölçüm eklendi. Ölçüm ikna edici; neyi kanıtladığı ise hangi kalınlıkta ve hangi sıcaklıkta yapıldığına bağlı.", "en": "A new measurement has been added to a years-long dispute about ruthenium dioxide. The measurement is convincing; what it proves depends on the thickness and the temperature at which it was made."}, "sections": [{"h": {"tr": "Ölçülen ile çıkarılan", "en": "What was measured and what was inferred"}, "ps": [{"tr": "Ölçüm, spin ayrımlı açı çözünürlüklü fotoemisyon spektroskopisiyle, alttaşın zorladığı gerilim altında büyütülmüş 2,7 nanometre kalınlığındaki RuO₂ katmanlı yapılarında yapıldı. Gözlenen şey momentuma bağlı bir spin dokusu: aynada tek ve aynada çift bileşenlerin bir arada bulunması. Çıkarım bunun bir adım ötesinde duruyor: kapsamlı simetri çözümlemesi bu dokunun mıknatıslık dışı kökenlerden gelemeyeceğini söylüyor. Manyetik nitelik doğrudan ölçülmüyor, dışlama yoluyla elde ediliyor.", "en": "The measurement was made with spin-resolved angle-resolved photoemission spectroscopy on RuO₂ heterostructures 2.7 nanometres thick, grown under strain imposed by the substrate. What was observed is a momentum-dependent spin texture: mirror-odd and mirror-even components coexisting. The inference sits one step beyond that: a comprehensive symmetry analysis says the texture cannot come from non-magnetic origins. The magnetic character is reached by exclusion rather than measured directly.", "refs": ["source-ruo2"]}, {"tr": "Dışlama yoluyla varılan bir sonuç, dışlanan seçeneklerin listesi kadar sağlamdır. Burada liste açık: simetri çözümlemesi yayımlandı ve ilk ilkelerden yapılan hesaplarla destekleniyor. Buna karşılık dokunun hangi manyetik düzene ait olduğu, yani zayıf ferromıknatıslık mı yoksa altermıknatıslık mı olduğu belirlenmiş değil. Ölçüm bir kapıyı kapatıyor, arkasındaki iki odayı birbirinden ayırmıyor.", "en": "A conclusion reached by exclusion is only as strong as the list of options excluded. Here the list is public: the symmetry analysis was published and is supported by calculations from first principles. What remains undetermined is which magnetic order the texture belongs to, that is, weak ferromagnetism or altermagnetism. The measurement closes one door without separating the two rooms behind it.", "refs": ["source-ruo2"]}]}, {"h": {"tr": "Sonucun sınırları nerede duruyor", "en": "Where the result's limits sit"}, "ps": [{"tr": "İki sınır sonucun kapsamını belirliyor. Birincisi kalınlık: birikmiş deneysel kanıt, RuO₂'nin yığın ve kalın film hâlinde herhangi bir manyetik düzen göstermediğine işaret ediyor ve bu çalışma o tabloyu değiştirmiyor. Yeni ölçüm bu nedenle yığın malzemeye dair eski iddiaları geri getirmiyor; gerilimin ultra ince sınırda ortaya çıkardığı ayrı bir duruma işaret ediyor. İkincisi sıcaklık: ölçümler yaklaşık 15 kelvinde yapıldı ve aynı dokunun oda sıcaklığında sürüp sürmediği bilinmiyor.", "en": "Two limits set the scope of the result. The first is thickness: accumulated experimental evidence points to RuO₂ showing no magnetic ordering in bulk or thick-film form, and this work does not change that picture. The new measurement therefore does not restore the earlier claims about bulk material; it points to a separate state that strain brings out in the ultrathin limit. The second is temperature: the measurements were made at about 15 kelvin, and whether the same texture persists at room temperature is unknown.", "refs": ["source-ruo2"]}, {"tr": "Bu iki sınır birlikte okunduğunda ortaya çıkan şey bir çürütme yerine bir daraltmadır. Tartışmanın önceki turlarında sorulan soru 'RuO₂ altermıknatıs mıdır' idi; bu sonucun izin verdiği soru 'gerilim altındaki ultra ince RuO₂ neyi gösterir' hâline geliyor. Bir iddianın kapsamı küçüldükçe sınanabilirliği artar; bu da bir kayıp sayılmaz.", "en": "Read together, those two limits produce a narrowing in place of a refutation. Earlier rounds of the dispute asked whether RuO₂ is an altermagnet; the question this result licenses becomes what ultrathin, strained RuO₂ shows. As a claim's scope shrinks its testability grows, and that does not count as a loss.", "refs": ["source-ruo2"]}]}, {"h": {"tr": "Tartışmayı ne bitirir", "en": "What would end the dispute"}, "ps": [{"tr": "Ayrımı yapacak ölçüm, aynı kalınlıktaki filmlerde sıcaklığı yukarı taşıyan bir çalışmadır: dokunun 15 kelvinin üstünde nereye kadar sürdüğü, hangi düzenin söz konusu olduğu konusunda bugünkü verinin veremediği bilgiyi verir. İkinci gereken, bağımsız bir grubun aynı gerilim ve kalınlık koşullarında spin ayrımlı ölçümü yinelemesidir. Bunlar yapılana kadar doğru cümle şudur: gerilim altındaki ince RuO₂'de manyetik kökenli bir spin dokusu ölçüldü ve düzeninin adı henüz konulmadı.", "en": "The measurement that would draw the distinction is one that carries temperature upward on films of the same thickness: how far the texture persists above 15 kelvin would supply what today's data cannot say about which order is at work. The second requirement is an independent group repeating the spin-resolved measurement under the same strain and thickness conditions. Until both are done, the accurate sentence is this: a spin texture of magnetic origin was measured in thin, strained RuO₂, and its order has not yet been named.", "refs": ["source-ruo2"]}]}], "sources": [{"key": "source-ruo2", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-unusual-metal-oxide-magnetism-lattice.html", "title": {"tr": "Yığın hâlinde mıknatıslık göstermeyen rutenyum dioksit, ultra ince filmlerde bir spin dokusu verdi", "en": "Ruthenium dioxide, non-magnetic in bulk, showed a spin texture in ultrathin films"}, "publishedDate": "2026-08-01", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2509.16361", "publishedDate": "2026-03-31", "title": {"tr": "Observation of mirror-odd and mirror-even spin texture in ultra-thin epitaxially-strained RuO2 films", "en": "Observation of mirror-odd and mirror-even spin texture in ultra-thin epitaxially-strained RuO2 films"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-06", "title": {"tr": "Bir yağ damlası, hücre olmadan hücre gibi davrandı", "en": "An oil droplet behaved like a cell without being one"}, "excerpt": {"tr": "New York Üniversitesi'nde su içindeki yağ damlacıkları biçim değiştirdi, içe katlandı ve çevresindeki tanecikleri yuttu. İçlerinde hiçbir hücre düzeneği yok; olan şey yüzey, kopolimer ve sıcaklık.", "en": "At New York University, oil droplets in water changed shape, folded inward and swallowed the particles around them. There is no cellular machinery inside them; what there is, is surface, copolymer and temperature."}, "sections": [{"h": {"tr": "Görüntü", "en": "The image"}, "ps": [{"tr": "Damlacıklar suyun içinde duruyor. Yanlarına P123 adlı amfifilik üç bloklu kopolimer ekleniyor ve biçimleri değişmeye başlıyor: çiçeğe benzeyen yapılar, dallanmış biçimler, halterler, diskler, kâseler. Sonra bazıları içe katlanıyor ve çevrelerindeki sıvıyla birlikte asılı tanecikleri içeri alıyor. Nature Communications dergisinde 18 Temmuz 2026'da 'Morphogenic colloids' başlığıyla yayımlanan çalışma, bu geçişlerin tersinir olduğunu bildiriyor: kopolimer derişimi ya da sıcaklık ayarlanarak damlacıklar bir biçimden diğerine geçiriliyor ve tek dağılımlı topluluklar bunu eşzamanlı yapıyor.", "en": "The droplets sit in water. The amphiphilic triblock copolymer called P123 is added beside them and their shapes begin to change: flower-like structures, branched forms, dumbbells, discs, cups. Then some of them fold inward and take in the surrounding fluid along with the particles suspended in it. The study, published in Nature Communications on 18 July 2026 under the title \"Morphogenic colloids,\" reports that these transitions are reversible: adjusting copolymer concentration or temperature moves the droplets from one form to another, and monodisperse populations do it synchronously.", "refs": ["source-colloid"]}, {"tr": "Araştırmacıların bu yutma davranışını benzettiği süreç, hücrelerde makropinositoz adıyla bilinen ve düzenli bir moleküler düzenek gerektiren bir iş. Damlacıklarda böyle bir düzenek yok. Yerine geçen şey, kopolimerlerin arayüzde kendiliğinden dizilmesi ile damlacığın genişlemesi.", "en": "The process the researchers compare this swallowing to is known in cells as macropinocytosis, and it takes an organised molecular apparatus to perform. The droplets have no such apparatus. What stands in its place is interfacial self-assembly of the copolymers combined with expansion of the droplet.", "refs": ["source-colloid"]}]}, {"h": {"tr": "Neyi göstermiyor", "en": "What it does not show"}, "ps": [{"tr": "Burada bir hücre yapılmadı ve yaşamın nasıl başladığına dair bir iddiada bulunulmadı. Gösterilen şey daha dar ve tam da bu yüzden ilginç: bir davranışı üretmek için o davranışı yapan moleküler makineye her zaman ihtiyaç yok. Bununla birlikte alternatif bir okuma da mümkün — yüzey ve kopolimer dizilimiyle açıklanan bir kolloid deneyi, biyolojiyle yalnızca görsel bir benzerlik taşıyabilir. Bu okumaya karşı elde tek bir dayanak var: benzerlik yalnızca biçimde kalmıyor, çevredeki sulu fazın ve taneciklerin içeri alınmasında da sürüyor.", "en": "No cell was made here, and no claim was offered about how life began. What was shown is narrower, and interesting for exactly that reason: producing a behaviour does not always require the molecular machine that performs it. However, an alternative reading is possible — a colloid experiment explained by surfaces and copolymer assembly may bear only a visual resemblance to biology. There is one thing to set against that reading: the resemblance does not stop at shape and continues in the internalization of the surrounding aqueous phase and the particles in it.", "refs": ["source-colloid"]}, {"tr": "Ayrımın önemi şurada. Canlı hücrede biçim değişimi ile yutma birbirine bağlı süreçlerdir ve tek tek ayrıştırılmaları zordur; burada ikisi bir derişim ya da bir sıcaklık ayarıyla açılıp kapanabiliyor. Bir davranışı böyle bir ayara bağlayabildiğinizde onu incelemenin yolu değişir.", "en": "Here is why the distinction matters. In a living cell, shape change and engulfment are coupled processes and hard to isolate from one another; here the two can be switched on and off with a concentration or a temperature. Once you can attach a behaviour to a setting like that, the way you study it changes.", "refs": ["source-colloid"]}]}, {"h": {"tr": "İçeri alınan şeye ne oluyor", "en": "What happens to what was taken in"}, "ps": [{"tr": "Elde edilen küresel olmayan yapılar ışıkla polimerleştirme yoluyla kalıcı hâle getirilebiliyor; yani ortada geçici bir görüntüden çok, sabitlenebilir bir yapı var. Buradan bakınca sıradaki soru da netleşiyor: bir damlacık bir taneciği içeri aldıktan sonra onunla ne yapabiliyor? Yutmak yaşayan bir sistemde işin başlangıcıdır; içeri alınan şeyin işlenmesi ya da geri bırakılması gerekir.", "en": "The non-spherical structures obtained can be made permanent by photopolymerization, so what is in hand is a structure that can be fixed rather than a passing image. Seen that way, the next question comes into focus: once a droplet has taken a particle in, what can it do with it? In a living system engulfment is the beginning of the work; what is taken in has to be processed or released again.", "refs": ["source-colloid"]}, {"tr": "Bu haberi okuyan biri için elde kalan şey, taşınmış bir sınırdan çok, sınırın nereden geçtiğine dair daha net bir görüntü. Canlıya ait saydığımız davranışların bir kısmı, malzemenin kendisinde ve onu çevreleyen arayüzde zaten mevcut. Geri kalanının nerede başladığını hâlâ bilmiyoruz — ama artık aradaki farkı bir tüpte açıp kapatabilen bir sistem var; eğer içeri alınan taneciğin işlenebildiği gösterilirse sınır yeniden tartışmaya açılır.", "en": "For someone reading this, what remains is a clearer view of where a boundary runs rather than a boundary that has moved. Some of the behaviours we file under living are already present in the material itself and in the interface around it. Where the rest begins we still do not know — but a system now exists that can switch the difference on and off inside a tube, and if a demonstration shows the particle taken in can be processed, the boundary reopens for argument.", "refs": ["source-colloid"]}]}], "sources": [{"key": "source-colloid", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-oil-droplets-remodel-swallow-cells.html", "title": {"tr": "Yağ damlacıkları sabun benzeri bir polimerle biçim değiştirip çevrelerindeki taneleri içine aldı", "en": "Oil droplets changed shape with a soap-like polymer and took in surrounding particles"}, "publishedDate": "2026-08-01", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75586-5", "publishedDate": "2026-07-18", "title": {"tr": "Morphogenic colloids", "en": "Morphogenic colloids"}}}], "radarPublishedAt": "2026-08-02T00:09:06+00:00", "date": "2026-08-02"}, {"writer": "sci-01", "title": {"tr": "İki milyon X-ışını kaynağı, aynı gökyüzünün üç kez geçilmesinden çıktı", "en": "Two million X-ray sources came out of crossing the same sky three times"}, "excerpt": {"tr": "eROSITA'nın ikinci yayımı yeni bir gökyüzü sunmuyor, aynı gökyüzünün daha derinini sunuyor. Sayının iki katına çıkması keskinleşen bir araçtan çok biriken poz süresinden geliyor ve bu kez olay verisi geride kaldı.", "en": "eROSITA's second release offers no new sky, it offers a deeper look at the same one. The doubling comes from accumulated exposure rather than a sharper instrument, and this time the event data stayed behind."}, "sections": [{"h": {"tr": "Üç geçişin toplamı", "en": "The sum of three passes"}, "ps": [{"tr": "Katalogda 1,9 milyon üzerinde noktasal kaynak ve yaklaşık 64.000 yayılı kaynak var; toplam iki milyona yaklaşıyor ve ilk yayımın kabaca iki katı. Hepsi Samanyolu'nun batı yarısına düşen gökyüzünden, 0,2-2,3 keV bandında. Gözlemler 12 Aralık 2019 ile 16 Haziran 2021 arasında, 556 günlük tarama çalışmasında toplandı. Noktasal olanların çoğu yıldızlar ve etkin galaksi çekirdekleri; yayılı olanlar galaksi kümeleri, yakın galaksiler ve süpernova kalıntıları.", "en": "The catalogue holds more than 1.9 million point-like sources and about 64,000 extended ones, close to two million in all and roughly twice the first release. All of it comes from the sky that falls to the western half of our galaxy, in the 0.2-2.3 keV band. Observations were collected between 12 December 2019 and 16 June 2021 across 556 days of survey operations. Most of the point-like ones are stars and active galactic nuclei; the extended ones are galaxy clusters, nearby galaxies and supernova remnants.", "refs": ["erosita"]}, {"tr": "Aradaki fark yeni bir teleskoptan ya da daha geniş bir gökyüzünden gelmiyor. Aynı alan üç kez tarandı ve üç geçiş üst üste kondu; biriken poz süresi, ilk geçişte gürültünün içinde kalan kaynakları eşiğin üstüne taşıdı. Ölçme gücünün derinlikle nasıl arttığının doğrudan bir örneği bu: gökyüzü büyümedi, sayılabilir olan büyüdü. Artışın tamamının poz süresinden geldiğinden emin olunamaz; saptama zincirindeki ya da ayarlamadaki bir değişiklik aynı yönde çalışırdı. Yayım kazancı derinliğe bağlıyor, ikisini ayırmaksa iki yayımın aynı alanda karşılaştırılmasını gerektirir.", "en": "The difference does not come from a new telescope or a wider sky. The same field was surveyed three times and the three passes were summed; the accumulated exposure lifted above the threshold sources that had stayed inside the noise on the first pass. It is a direct illustration of how measuring power grows with depth: the sky did not get bigger, the countable part of it did. One cannot be certain that the whole increase comes from exposure, since a change in the detection chain or in calibration would push the same way. The release attributes the gain to depth; separating the two would take a comparison of both releases over the same field.", "refs": ["erosita"]}]}, {"h": {"tr": "Katalog verildi, olay verisi verilmedi", "en": "The catalogue came, the event data did not"}, "ps": [{"tr": "İlk yayım ayarlanmış olay verisini ve üst düzey ürünleri de içeriyordu. İkincisi yalnızca kataloglardan oluşuyor. Fark teknik görünür, sonucu bağlayıcıdır: katalogdaki bir kaynağı kullanabilirsiniz, katalogda olmayan bir kaynağı arayamazsınız. Neyin kaynak sayıldığına ortaklığın kendi çözümlemesi karar verdi ve bağımsız bir grup bu kararı kendi eşikleriyle yeniden veremiyor.", "en": "The first release also carried calibrated event data and higher-level products. The second consists of catalogues alone. The difference looks technical and its consequence is binding: you can use a source that is in the catalogue, but you cannot go looking for one that is not there. What counts as a source was settled by the consortium's own analysis, and an outside group cannot take that decision again at its own thresholds.", "refs": ["erosita"]}, {"tr": "Aynı sırada Bonn Üniversitesi'nden bir ekip, A3266 galaksi kümesinin çevresinde kümeden en yakın kuzeybatı grubuna uzanan bir X-ışını lifi bildirdi. Bu türden bir sonuç tam olarak eşiğin en çok önem taşıdığı yerde duruyor: küme dış bölgelerindeki sönük yayılım, saptama ölçütündeki küçük bir değişiklikle var ya da yok görünebilir. İki milyon satırın her biri böyle bir kararı taşıyor ve o kararlar bundan sonraki her çalışmaya miras kalıyor.", "en": "Alongside it, a team at the University of Bonn reported an X-ray filament in the environs of the galaxy cluster A3266, running from the cluster towards its nearest north-western group. A result of that kind sits exactly where the threshold matters most: faint emission in cluster outskirts can appear or disappear under a small change in the detection criterion. Each of the two million lines carries a decision like that, and those decisions are inherited by every study that starts here.", "refs": ["erosita"]}]}, {"h": {"tr": "Sönük uçta ne kalır", "en": "What survives at the faint end"}, "ps": [{"tr": "Bir katalog ölçümün kendisi değildir, yorumlanmış hâlidir. Bu yüzden sönük uçtaki kaynakların ne kadarının gerçek olduğu sorusu kataloğun içinden yanıtlanamaz. Yanıtı ya farklı bir yöntemle bağımsız gözlem yapan bir araç verecek, ya da olay verisi yayımlandığında bir başka grubun kendi eşikleriyle yeniden saydığı sayılar.", "en": "A catalogue is not the measurement itself, only the measurement already interpreted. That is why the question of how much of the faint end is real cannot be answered from inside the catalogue. The answer will come either from an instrument observing independently by a different method, or from the numbers another group counts at its own thresholds once the event data are released.", "refs": ["erosita"]}]}], "sources": [{"key": "erosita", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-homing-ray-sky-erosita.html", "title": {"tr": "eROSITA ortaklığı, iki milyona yakın kaynak içeren ikinci X-ışını kataloğunu yayımladı", "en": "The eROSITA consortium published a second X-ray catalogue holding close to two million sources"}, "publishedDate": "2026-07-31", "primary": {"kind": "preprint", "name": "arXiv", "url": "https://arxiv.org/abs/2607.28140", "publishedDate": "2026-07-30", "title": {"tr": "A3266 çevresinde büyük ölçekli yapı oluşumu üzerine bir çalışma: içe düşen gruplar, lifler ve birleşme öncesi soğuk cephe", "en": "A study of the large-scale formation in the environment of A3266: Infalling groups, filaments, and a premerger cold front"}}}], "date": "2026-08-01"}, {"writer": "sci-02", "title": {"tr": "Bir kılıfın yapısı çözüldü, hasta hâlâ birkaç basamak uzakta", "en": "The structure of a coat was resolved; the patient is still several steps away"}, "excerpt": {"tr": "Kromozomlar tam ayrılamadığında geriye kalan ince DNA ipliğini ESCRT-III proteinleri kaplıyor. Düzeneğin yapısı çözülmüş durumda. Yazarların kendi cümlesi ise daha önemli: bu düzenek ile kanser gelişimi arasında doğrudan bir bağ gösterilmedi.", "en": "When chromosomes fail to separate fully, ESCRT-III proteins coat the thin strand of DNA left behind. The structure of the mechanism has been resolved. The authors' own sentence matters more: no direct link was shown between this mechanism and cancer development."}, "sections": [{"h": {"tr": "Görülen düzenek", "en": "The mechanism that was seen"}, "ps": [{"tr": "Hücre bölünürken kromozomlar her zaman temiz ayrılmıyor. Geriye kalan ince DNA köprüsü kardeş hücreleri birbirine bağlıyor ve kopması genomu bozuyor. Çalışma, ESCRT-III proteinlerinin bu köprünün çevresinde bir kılıf kurduğunu, NoCut denetim noktasının da bölünmenin tamamlanmasını kılıfın kurulmasına yetecek kadar geciktirdiğini gösteriyor.", "en": "When a cell divides, the chromosomes do not always come apart cleanly. The thin DNA bridge left behind ties the daughter cells together, and breaking it damages the genome. The study shows that ESCRT-III proteins assemble a coat around this bridge, and that the NoCut checkpoint delays completion of division long enough for the coat to form.", "refs": ["escrt"]}, {"tr": "Yöntem yığını burada önemli. Protein-DNA yapısı kriyo-elektron mikroskobuyla çözüldü, floresanla işaretlenmiş proteinler canlı hücrede izlendi, kendiliğinden oluşan köprüler geniş hücre topluluklarında çözümlendi ve köprü sıklığı protein baskılamayla bilinçli olarak yükseltildi. Nadir bir olayın seyrek görüntülerine bakmak yerine olayı çoğaltıp kılıfın kurulmasını gerçek zamanlı izlemek, yapının durağan bir resimden çıkarılması ile kurulurken görülmesi arasındaki farkı yaratıyor.", "en": "The stack of methods matters here. The protein-DNA structure was resolved by cryo-electron microscopy, fluorescently labelled proteins were followed in living cells, naturally occurring bridges were analysed across large cell populations, and the frequency of bridges was deliberately raised by inhibiting proteins. Multiplying a rare event and watching the coat assemble in real time, rather than looking at sparse images of it, is the difference between inferring a structure from a static picture and seeing it built.", "refs": ["escrt"]}]}, {"h": {"tr": "Kanserle bağın kurulmadığı yer", "en": "Where the link to cancer stops"}, "ps": [{"tr": "DNA köprüleri genom kararsızlığıyla ve kansere erken eşlik eden olaylarla ilişkilendiriliyor. Bu ilişki gerçek, ama çalışma bu düzenek ile kanser gelişimi arasında doğrudan bir bağ göstermiyor. Yazarların kendi ifadesiyle söylenen budur. Kılıfı güçlendirmenin ya da bozmanın kanser riskini değiştireceği sonucu bu verilerden çıkmıyor; kılıf, yedeği bulunan birkaç korumadan biri de olabilir, o durumda yokluğu telafi edilir.", "en": "DNA bridges are associated with genome instability and with events that accompany early cancer. That association is real, yet the study does not show a direct link between this mechanism and cancer development. That is the authors' own statement. The conclusion that strengthening or disrupting the coat would change cancer risk does not follow from these data; the coat may be one of several protections with a backup, in which case its absence is compensated.", "refs": ["escrt"]}, {"tr": "Böyle bir bağın kurulması için ne gerektiği bellidir. ESCRT işlevinin geri kalanı yerinde dururken yalnızca bu kılıfın kaldırıldığı hücreler ya da hayvanlar, dönüşüm olaylarını sayacak kadar uzun süre izlenmelidir. Ardından insan genetiğinden gelen bir işaret gelmelidir. Aradaki mesafe yıllarla ölçülür. Bunu söylemek çalışmanın değerini düşürmez; yalnızca bugün hangi cümlenin kurulabileceğini belirler.", "en": "What such a link would require is clear. Cells or animals in which only this coat is removed while the rest of ESCRT function stays in place would have to be followed long enough to count transformation events. A signal from human genetics would have to follow. The distance is measured in years, and saying so does not diminish the work; it only fixes which sentence can be written today.", "refs": ["escrt"]}]}, {"h": {"tr": "Hastanın yerinde duran model", "en": "The model standing where the patient is"}, "ps": [{"tr": "Burada hasta yok. Kültürdeki insan hücreleri var, tümör yok, doku yok, sonuç ölçütü yok. Yapısal bir soru için doğru basamak da zaten budur; eleştiri değil, tanımdır. Klinik açıdan bugün alınabilecek şey, bir sonraki çalışma bu düzeneğe dayanan bir tedavi açısı öne sürdüğünde sorulacak sorunun hazır olmasıdır: kılıf kaldırıldığında hücrede ne oluyor, ve bu, sayılabilen bir hastalık sonucuna bağlanıyor mu?", "en": "There is no patient here. There are human cells in culture, no tumour, no tissue, no outcome measure. That is the right stage for a structural question; this is a description rather than a criticism. What can be taken clinically today is that the question is ready for the next paper that proposes a therapeutic angle from this mechanism: what happens in the cell when the coat is removed, and does it connect to a disease outcome anyone can count?", "refs": ["escrt"]}]}], "sources": [{"key": "escrt", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-newly-mechanism-dna-cell-division.html", "title": {"tr": "Bölünen hücreler arasında kalan DNA köprülerini bir protein kılıfının koruduğu bulundu", "en": "A protein coat was found to shield the DNA bridges left between dividing cells"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Nature Structural \u0026 Molecular Biology", "url": "https://doi.org/10.1038/s41594-026-01841-4", "publishedDate": "2026-07-15", "title": {"tr": "ESCRT-III, yanlış ayrılmış DNA'nın çevresinde toplanarak genom kararlılığını koruyor", "en": "ESCRT-III assembles around mis-segregated DNA to protect genome stability"}}}], "date": "2026-08-01"}, {"writer": "sci-03", "title": {"tr": "Yüzgeç yasakları yürürlüğe girdi, ticaret akışı yerinde kaldı", "en": "The fin bans took effect and the trade flow stayed where it was"}, "excerpt": {"tr": "Düzenlemeyi benimseyen ülkelerin dışsatımı, dışalımı, iç tüketimi ve ticaret ortağı sayısı ölçülebilir biçimde değişmedi. Bu, kuralın boşa gittiğini kanıtlamaz; ölçtüğümüz büyüklüğün kuralın hedeflediği yerden bir adım uzakta durduğunu gösterir ve köpekbalığı nüfuslarının, çevrelerindeki deniz ekosistemlerinin durumunu ölçmeden bırakır.", "en": "Exports, imports, domestic consumption and the number of trade partners did not measurably change in the countries that adopted the rules. That does not establish that the rules were wasted; it shows that the quantity we measure sits one step away from where the rules aim, and it leaves the state of shark populations and of the marine ecosystems around them unmeasured."}, "sections": [{"h": {"tr": "Kuralın hedefi ile ölçülen büyüklük", "en": "What the rule aims at and what gets measured"}, "ps": [{"tr": "Çözümleme, yüzgeç kesimi düzenlemesi getiren ülkeleri kuralı benimsemeden önce ve sonra karşılaştırdı, düzenleme getirmeyen ülkeleri de denetim grubu olarak kullandı. Dışsatım, dışalım, iç tüketim ve ticaret ortağı sayısında istatistiksel olarak anlamlı bir değişiklik bulunmadı. Veri, balıkçılık ürünlerini tedarik zinciri boyunca birbirine bağlayan ve 2024'te yayımlanan ARTIS kümesinden geliyor; avlananla ticareti yapılanı birlikte görmeyi ilk kez bu bağlantı sağlıyor.", "en": "The analysis compared countries that introduced finning regulations before and after adoption, using countries without regulations as a control group. No statistically significant change was found in exports, imports, domestic consumption or the number of trade partners. The data come from ARTIS, released in 2024, which links fishery products along the supply chain; that link is what first makes it possible to see catch and trade together.", "refs": ["shark"]}, {"tr": "Kuralın hedefi güvertede olan şeydir: yüzgecin alınıp gövdenin denize atılması. Ölçülen büyüklük ise gümrük sınırından geçen tonajdır. Bir kural iniş uygulamasını değiştirip ticaret hacmini yerinde bırakabilir. Ticaret düzenleme getirmemiş ortaklara kayabilir ve toplam talep hiç kıpırdamaz. Düzenleme gerçekten etkisiz de kalmış olabilir. Dördüncü bir olasılık daha var: ticaret istatistiği ürünü öyle kaba sınıflandırıyordur ki değişiklik zaten görünmez. Bu çözümleme dördünü birbirinden ayıramaz; yazarlar da ayırdığını söylemiyor.", "en": "What the rule aims at is what happens on deck: the fin taken and the body thrown back. What gets measured is the tonnage that crosses a customs boundary. A rule can change landing practice and leave trade volume where it was. Trade can shift to partners that adopted nothing while total demand never stirs. The regulation may also genuinely have had no effect. A fourth possibility remains: the trade statistics classify the product so coarsely that any change is invisible from the start. This analysis cannot separate the four, and the authors do not claim that it does.", "refs": ["shark"]}]}, {"h": {"tr": "Kolun tutulduğu yer", "en": "Where the lever is held"}, "ps": [{"tr": "ARTIS avlananla ticareti yapılanı bağladığı için, düzenlemenin izinin aranacağı yer toplam akış değil karaya çıkarılan ürünün bileşimidir. Toplam akış, zincirin en sonundaki toplamdır; bir kuralın ilk değiştirdiği şey ise zincirin başındaki uygulamadır. Aradaki her adım, farkı seyrelten bir işlem yapar. Bu yüzden akışa bakarak boş çıkan bir sonuç, kuralın etkisiz olduğunu değil, ölçümün yanlış halkada durduğunu da anlatabilir. Korunmak istenen stok ise zincirin daha da gerisinde duruyor: köpekbalığı nüfusları ve bağlı oldukları deniz ekosistemleri.", "en": "Because ARTIS links catch to trade, the place to look for the trace of the regulation is the composition of landed product rather than aggregate flow. Aggregate flow is the total at the far end of the chain, while the first thing a rule changes is practice at its start. Every step in between performs an operation that dilutes the difference. So an empty result read from flow can equally say that the measurement stands on the wrong link rather than that the rule has no effect. The stock the rule sets out to protect sits further back still: shark populations and the marine ecosystems they hold together.", "refs": ["shark"]}, {"tr": "ARTIS'in gösterdiği durağan ticaret akışı karşısında, kuralı benimseyen ülkedeki balıkçının üstlendiği uyum maliyeti bir üstünlüğe dönüşmüyor. Gövdeyi de taşımak yer ve yakıt demektir; düzenleme getirmemiş ortak bunu ödemez. Piyasa kıpırdamadığında bu bedel yalnızca eşitsiz dağılır. Biyoçeşitlilik açısından bakıldığında da durum aynı kapıya çıkıyor: balıkçılık ölümlülüğü ölçülmediği sürece, bir yasağın nesli tehlikedeki türler üzerindeki etkisi kâğıt üzerinde kalır. İzlenmesi gereken şey kuralın kapsamı değil, hangi tarafın hangi bedeli ödediğidir.", "en": "The compliance cost carried by the fisher in the adopting country does not turn into an advantage against the flat trade flow ARTIS shows. Carrying the body as well means space and fuel; the partner that adopted nothing does not pay for it. When the market does not move, that cost is simply distributed unevenly. Seen from biodiversity the situation comes out at the same door: as long as fishing mortality goes unmeasured, the effect of a ban on threatened species stays on paper. What needs tracking is which party pays which cost, rather than the reach of the rule on paper.", "refs": ["shark"]}]}, {"h": {"tr": "Sırada hangi sayı var", "en": "Which number comes next"}, "ps": [{"tr": "Yazarlar denetimi ve tedarik zinciri davranışını hâlâ araştırılması gereken alanlar olarak gösteriyor; doğru sıralama da budur. ARTIS'in av ile ticareti bağlayan yapısı, düzenleme getiren ve getirmeyen ülkelerde karaya çıkarılan ürünün biçiminin karşılaştırılmasına yeter. Bir fark önce orada görünmelidir. Orada da görünmezse, kuralın etkisiz kaldığı okuması belirgin biçimde güçlenir. Toplam akışa bakarak beklemek ise, hangi yanıt çıkarsa çıksın onu yorumlayamamak demektir.", "en": "The authors name enforcement and supply-chain behaviour as the areas still to be investigated, and that is the right order. The catch-to-trade structure of ARTIS is enough to compare the form of landed product in countries with and without regulations. A difference should show up there first. If it does not show up there either, the reading that the rule had no effect becomes markedly stronger. Waiting on aggregate flow instead means being unable to interpret whichever answer arrives.", "refs": ["shark"]}]}], "sources": [{"key": "shark", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-shark-finning-significantly-global-analysis.html", "title": {"tr": "Yüzgeç kesimi kuralları, küresel yüzgeç ticaretinde ölçülebilir bir etki göstermedi", "en": "Shark-finning rules showed no measurable effect on the global fin trade"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Nature Communications", "url": "https://doi.org/10.1038/s41467-026-75625-1", "publishedDate": "2026-07-31", "title": {"tr": "Yüzgeç kesimi düzenlemelerine küresel ticaretin tepkileri", "en": "Global trade responses to shark finning regulations"}}}], "date": "2026-08-01"}, {"writer": "sci-04", "title": {"tr": "Bir biti çevirmenin enerjisi, darbenin biçiminden yeniden hesaplandı", "en": "The energy of flipping a bit was recalculated from the shape of the pulse"}, "excerpt": {"tr": "Edinburgh'daki grup malzemeyi değiştirmedi, darbeyi değiştirdi. Benzetimde anahtarlama enerjisi bugünkü bellek teknolojilerinin kat kat altına iniyor. Parçalarına ayırınca tasarrufun nerede durduğu da görünüyor: darbeyi üretecek düzeneğin bedeli hesabın dışında.", "en": "The Edinburgh group did not change the material, it changed the pulse. In simulation the switching energy falls orders of magnitude below today's memory technologies. Take it apart and you can see where the saving sits: the price of the machine that would generate the pulse is outside the calculation."}, "sections": [{"h": {"tr": "Değiştirilen parça", "en": "The component that was changed"}, "ps": [{"tr": "Yapılan iş şu: en iyi denetim kuramı, van der Waals tek katmanında mıknatıslanmayı çeviren çok hızlı bir manyetik alan darbesinin biçimini hesaplıyor. Karşılaştırma tabanları DRAM, STT-MRAM ve daha yeni SOT-MRAM. Elde edilen enerjiler bu üçünün birkaç kat altında ve yazarlar bunları, tek bir bitin işlenmesi için ısıl alt sınır olan Landauer sınırına yaklaşan değerler olarak tanımlıyor. Çalışma bütünüyle hesaplamalı: aygıt üretilmedi, ölçülmedi.", "en": "Here is what was done: optimal control theory computes the shape of a very fast magnetic field pulse that reverses the magnetisation of a van der Waals monolayer. The comparison baselines are DRAM, STT-MRAM and the newer SOT-MRAM. The energies obtained sit orders of magnitude below all three, and the authors describe them as approaching the Landauer limit, the thermal floor for processing a single bit. The work is entirely computational: no device was built and none was measured.", "refs": ["pulse"]}, {"tr": "En iyi denetim kuramıyla biçimlendirilen alan, mıknatıslanmanın dönme hareketiyle çekişmek yerine ona uyduğu için kazanç malzemeden bağımsız duruyor. Kaba bir alan hedefe doğru iter ve aşmanın bedelini öder. Bu, malzemeler arasında taşınabilen türden bir düzenektir ve yazarların matematiğin elektrik akımlarına ve lazer darbelerine genişletilebileceğini söylemesinin nedeni de budur; aynı cümlede bunun denenmediğini de söylüyorlar. Kazancın büyük bölümünün darbenin biçiminden çok kısalığından gelmesi de olanaklıdır; ikisini ayırmak, aynı süreli biçimlendirilmemiş bir darbeyle karşılaştırma gerektirir.", "en": "The field shaped by optimal control theory follows the precession of the magnetisation instead of fighting it, so the gain stands independent of the material. A blunt field pushes towards the target and pays for the overshoot. This is the kind of mechanism that carries between materials, which is why the authors say the mathematics could extend to electrical currents and laser pulses, and in the same breath say it has not been tried. It is equally possible that most of the gain comes from the pulse being short rather than from its shape; separating the two would take a comparison against an unshaped pulse of the same duration.", "refs": ["pulse"]}]}, {"h": {"tr": "Faturanın kaydığı yer", "en": "Where the bill moves to"}, "ps": [{"tr": "DRAM, STT-MRAM ve SOT-MRAM için verilen sayılar, çalışan bir bellekte adreslenmiş bir hücrenin yazma enerjileridir. Benzetimdeki sayı ise ideal bir alan altında tek bir katmanın mıknatıslanmasını çevirmek için gereken enerjidir. Bunlar farklı muhasebe sınırlarıdır. Belirli bir biçime sahip, pikosaniye ölçeğinde bir alan profilini üretmek bedavaya gelmez ve o alanı komşusuna değil tek bir hücreye ulaştırmak ayrı bir sorundur. Yayımlanan duyuruda bu bedelin hesaba katılıp katılmadığı belirtilmiyor.", "en": "The figures given for DRAM, STT-MRAM and SOT-MRAM are the write energies of an addressed cell inside a working memory. The figure from the simulation is the energy needed to reverse the magnetisation of a single layer under an ideal field. Those are different accounting boundaries. Producing a picosecond-scale field profile of a particular shape does not come free, and delivering that field to one cell rather than its neighbour is a separate problem. The announcement does not state whether this cost was included.", "refs": ["pulse"]}, {"tr": "Van der Waals tek katmanından bir belleğe giden yolda dört ayrı adım duruyor. Saymak bu sonucu küçültmez, yerine oturtur. Çalışma sıcaklığında durumunu koruyan bir tek katman gerekiyor. Tasarlanan profili üreten bir alan kaynağı gerekiyor. Alanın komşu hücreleri etkilemeden adreslenmesi gerekiyor. Ve enerjinin spin dizgesine ulaşan bölümünde değil, kaynağın uçlarında ölçülmesi gerekiyor. Dördü ayrı adımdır ve hiçbiri bu makalede yoktur.", "en": "The path from a van der Waals monolayer to a memory holds four separate steps, and counting them does not shrink the result, it places it. A monolayer that holds its state at operating temperature is needed. A field source that produces the designed profile is needed. Addressing so that the field does not reach neighbouring cells is needed. And the energy has to be measured at the terminals of the source rather than in the part that reaches the spin system. Those are four separate steps and none of them is in this paper.", "refs": ["pulse"]}]}, {"h": {"tr": "Rakamı ayakta tutacak ölçüm", "en": "The measurement that would keep the number standing"}, "ps": [{"tr": "Sayıyı sınayacak şey bellidir: gerçek bir van der Waals tek katmanında yapılmış, enerjiyi spine ulaşan bölümde değil kaynakta bildiren bir laboratuvar gösterimi. O gelene kadar sonuç, olduğu şey olarak okunmalıdır; ideal bir darbenin biçimine dair bir denetim kuramı sonucudur. Gerçek bir katkıdır bu; duyurudaki sayıdan daha küçük bir savdır.", "en": "What would test the number is clear: a laboratory demonstration in a real van der Waals monolayer that reports the energy at the source rather than in the part that reaches the spin. Until that arrives, the result should be read as what it is, a control-theory result about the shape of an ideal pulse. It is a genuine contribution, and it is a smaller claim than the number in the announcement.", "refs": ["pulse"]}]}], "sources": [{"key": "pulse", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-optimized-magnetic-pulses-memory-energy.html", "title": {"tr": "Benzetimler, biçimlendirilmiş manyetik darbelerin bellek anahtarlama enerjisini keskin biçimde düşürebileceğini bildiriyor", "en": "Simulations report that shaped magnetic pulses could sharply cut memory switching energy"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "Advanced Materials", "url": "https://doi.org/10.1002/adma.202523059", "publishedDate": "2026-07-14", "title": {"tr": "En iyi denetim, van der Waals mıknatıslarında çok hızlı ve enerji açısından verimli mıknatıslanma çevrimini sağlıyor", "en": "Optimal Control Drives Ultrafast and Energy-Efficient Magnetization Switching in Van der Waals Magnets"}}}], "date": "2026-08-01"}, {"writer": "sci-05", "title": {"tr": "Bir olasılık haritasında ortalama, her zaman sıfırın üstünde çıkar", "en": "On a probability map the mean always comes out above zero"}, "excerpt": {"tr": "Courville ve arkadaşları Mars'ın buz haritasını sınırlardan olasılıklara çevirdi. Kendi yazdıkları uyarı haritadan daha öğretici: model uzayı sıfırdan yüze kadar buz içerdiği için ortalama buz oranı, veri buzu desteklemediğinde bile sıfırın üstünde kalıyor.", "en": "Courville and colleagues turned the Mars ice map from boundaries into probabilities. The caution they wrote themselves teaches more than the map: because the model space runs from zero to a hundred percent ice, the mean ice content stays above zero even where the data disfavour ice."}, "sections": [{"h": {"tr": "Neyin olasılığı", "en": "The probability of what"}, "ps": [{"tr": "Tasarım açık: dört ayrı kanıt türü Bayes çerçevesinde birleşiyor. Mars Odyssey'in nötron izge ölçeri üst yarım metredeki suya eşdeğer hidrojeni veriyor, Mars Global Surveyor ile Mars Reconnaissance Orbiter'ın ısıl verisi ısıl ataleti, SHARAD radarı dielektrik geçirgenliği, yörüngeden haritalanan sekiz buz göstergesi arazi türü de biçimi. Her biri bir olasılık yoğunluğu üretiyor, yoğunluklar çarpılıyor ve 60 güney ile 60 kuzey enlemleri arasında hava, buz ve kayaç oranlarının sonsal dağılımı çıkıyor.", "en": "The design is explicit: four kinds of evidence combine in a Bayesian framework. Mars Odyssey's neutron spectrometer gives water-equivalent hydrogen in the upper half-metre, thermal data from Mars Global Surveyor and Mars Reconnaissance Orbiter give thermal inertia, the SHARAD radar gives dielectric permittivity, and eight ice-indicative terrain types mapped from orbit give the shape. Each produces a probability density, the densities are multiplied, and between 60 south and 60 north what comes out is a posterior distribution over the fractions of air, ice and rock.", "refs": ["mars"]}, {"tr": "Sayılar da açık. Yüzeye yakın buz her iki yarıkürede yaklaşık 45 dereceden kutuplara doğru olası. Kuzey Alba Patera için fazla buz olasılığı yüzde 56,6, ortanca buz oranı yüzde 42,4; Hellas Planitia için yüzde 59,7 ve yüzde 44,3. Ekvator kuşağında, 30 güney ile 30 kuzey arasında, gözenek dolduran buz dışlanamıyor ama büyük miktarlar destek görmüyor ve en büyük olabilirlik çoğu yerde sıfıra yakın çıkıyor.", "en": "The numbers are explicit too. Near-surface ice is likely poleward of about 45 degrees in both hemispheres. For North Alba Patera the probability of excess ice is 56.6 percent with a median ice content of 42.4 percent; for Hellas Planitia, 59.7 percent and 44.3 percent. In the equatorial belt, between 30 south and 30 north, pore-filling ice cannot be excluded but large amounts find no support, and the maximum likelihood comes out near zero in most places.", "refs": ["mars"]}]}, {"h": {"tr": "Hangi istatistiğin okunduğu sonucu değiştirir", "en": "Which statistic is read changes the answer"}, "ps": [{"tr": "Yazarlar model uzayı sıfırdan yüz oranına kadar buz içerdiği için ortalama buz oranının her zaman sıfırın üstünde çıktığını, ortanca değerlerin yanıltıcı olabileceğini ve tutucu kestirim olarak en büyük olabilirlik ile bir sigmalık alt sınırın kullanılması gerektiğini yazıyor. Bu bir sunum ayrıntısı sayılamaz. Ortanca ile en büyük olabilirlik aynı sonsal dağılımı iki ayrı yerinden anlattığı için, iniş yeri seçen biri hangisini okuduğuna göre başka bir gezegen görür.", "en": "The authors write that because the model space includes ice from zero to a hundred percent the mean ice content always comes out above zero, that median values can be misleading, and that maximum likelihood and the one-sigma lower bound should be used as conservative estimates. This cannot be counted as a matter of presentation. Because the median and the maximum likelihood describe the same posterior from two different places, someone choosing a landing site sees a different planet depending on which one is read.", "refs": ["mars"]}, {"tr": "Belirsizliğin kendisi de içeriden geliyor. Araç hataları, kayaç yoğunluğu için metreküp başına 2.500-3.500 kilogramlık aralık gibi fiziksel özellik aralıkları ve kuramsal model belirsizliği yayılıyor; yazarlar bu belirsizlik kestirimi için yerinde bir ölçüm bulunmadığını açıkça yazıyor. Buna bir de derinlik ekleniyor. Araçlar ilk metre kadarına ulaşıyor, model ise üst beş metrenin türdeş olduğunu varsayıyor. Bir ile beş metre arasındaki bölgede sonsal dağılımı taşıyan şey veri değil varsayımdır. Varsayımın yeterli olduğu yerler de vardır elbette; buzun tek bir süreçle yerleştiği bir alanda türdeşlik iyi bir yaklaşımdır.", "en": "The uncertainty itself comes from inside as well. Instrument errors, ranges for physical properties such as 2,500 to 3,500 kilograms per cubic metre for rock density, and theoretical model uncertainty are all propagated; the authors write plainly that no in-place measurement exists for checking this uncertainty estimate. Depth is added on top. The instruments reach about the first metre, while the model assumes the upper five metres are homogeneous. In the band between one and five metres what carries the posterior is the assumption rather than the data. There are of course places where the assumption is fine: where ice was emplaced by a single process, homogeneity is a good approximation.", "refs": ["mars"]}]}, {"h": {"tr": "Neyi doğrulama sayarız", "en": "What would count as a check"}, "ps": [{"tr": "Doğrulamanın nasıl yapılacağı da bu makaleden çıkarılabilir. Mars'ta haritalanmış bir noktaya bir araç ulaştığında dürüst karşılaştırma, yazarların önerdiği en büyük olabilirlik ve bir sigmalık alt sınır üzerinden yapılmalıdır. Ortancaya bakılırsa çerçeve, kendi uyardığı biçimde iyimser görünür. Bir ile beş metre arasındaki boşluk ise ancak daha yüksek frekanslı bir radarla kapanır. Bunlardan biri gerçekleşene kadar harita, dört aracın birlikte neyi ima ettiğine dair iyi belgelenmiş bir açıklamadır; buzun nerede olduğuna dair bir açıklama sayılamaz.", "en": "How the check should be made can also be drawn from this paper. When a spacecraft reaches a mapped location on Mars, the honest comparison runs through the maximum likelihood and the one-sigma low bound the authors recommend. Read against the median, the framework will look optimistic in exactly the way it warned about. The gap between one and five metres closes only with a higher-frequency radar. Until one of those happens, the map is a well-documented statement of what four instruments jointly imply; it cannot count as a statement about where the ice is.", "refs": ["mars"]}]}], "sources": [{"key": "mars", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-laying-odds-potential-martian-future.html", "title": {"tr": "Mars'ın buz haritası artık sınır çizmek yerine olasılık veriyor", "en": "A Mars ice map now states the odds instead of drawing a boundary"}, "publishedDate": "2026-07-31", "primary": {"kind": "paper", "name": "The Planetary Science Journal", "url": "https://doi.org/10.3847/PSJ/ae8904", "publishedDate": "2026-07-31", "title": {"tr": "Mars'ta yüzey altı su buzunun haritalanması: olasılıkçı bir yaklaşım", "en": "Subsurface Water Ice Mapping on Mars: A Probabilistic Approach"}}}], "date": "2026-08-01"}, {"writer": "sci-06", "title": {"tr": "Ay'daki yeni çukuru kimse hedeflemedi", "en": "Nobody aimed the new crater on the Moon"}, "excerpt": {"tr": "On iki metrelik bir tüp bir buçuk yıl önce işini bitirdi ve o günden beri kimsenin olmadı. Çarşamba günü Ay'da bir çukur açması bekleniyor. Fiziksel olarak önemsiz; asıl soru, bunu bir kaza mı yoksa artık sıradan bir sonuç mu sayacağımız.", "en": "A twelve-metre tube finished its job a year and a half ago and has belonged to nobody since. On Wednesday it is expected to open a hole in the Moon. Physically it is trivial; the real question is whether we count it an accident or an ordinary consequence."}, "sections": [{"h": {"tr": "Kimsenin olmayan bir nesne", "en": "An object that belongs to nobody"}, "ps": [{"tr": "Nesnenin ölçüleri belli: yaklaşık 12 metrelik boyda, 4.500 kilogramlık ağırlıkta bir üst kademe. 15 Ocak 2025'te iki özel iniş aracını yola çıkardı; Firefly Aerospace'in Blue Ghost aracı Ay'a tümüyle başarılı iniş yapan ilk özel uzay aracı oldu, ispace'in aracı ise parçalandı. Uzay izleme uzmanı Bill Gray, kademenin Ay'ın batı kenarındaki Einstein Krateri yakınına saatte 5.400 mil hızla, yani sesin yedi katıyla çarpacağını öngörüyor. Los Alamos Ulusal Laboratuvarı'ndan Benjamin Fernando yaklaşık 27 metrelik çapta ve 5 metrelik derinlikte bir çukur bekliyor; enerji üç ton TNT'ye eşdeğer.", "en": "The object's dimensions are known: an upper stage about 12 metres long and 4,500 kilograms in weight. On 15 January 2025 it sent two private landers on their way; Firefly Aerospace's Blue Ghost became the first private spacecraft to make a fully successful lunar landing, while the ispace lander wrecked. Space tracking expert Bill Gray predicts that the stage could hit near Einstein Crater on the Moon's western limb at 5,400 mph, seven times the speed of sound. Benjamin Fernando of Los Alamos National Laboratory expects a hole about 27 metres across and 5 metres deep, with energy equivalent to three tons of TNT.", "refs": ["moon"]}, {"tr": "Ay'ın yüzeyi zaten kraterlerle kaplı olduğu için 27 metrelik bir çukur fiziksel olarak hiçbir şeyi değiştirmiyor. Bu okumayı önce vermek gerekir, çünkü doğrudur. Ay sürekli doğal nesnelerle dövülüyor, bunların çoğu bundan çok daha fazla enerjiyle geliyor. Emekli astrofizikçi Jonathan McDowell da çarpmanın kendisinin bir sorun olmayacağını söylüyor. Buradaki mesele fizik değildir.", "en": "The Moon's surface is already covered in craters, so a 27-metre hole changes nothing physically, and this reading should come first because it is correct. The Moon is struck constantly by natural objects, most of them arriving with far more energy than this. The retired astrophysicist Jonathan McDowell also says the impact itself will not be a problem. What is at stake here is not physics.", "refs": ["moon"]}]}, {"h": {"tr": "Kazayı deneye çeviren şey", "en": "What turns an accident into an experiment"}, "ps": [{"tr": "NASA'nın Lunar Reconnaissance Orbiter aracı ile Güney Kore'nin Danuri aracının bölgeyi çarpmadan önce ve sonra görüntülemesi planlanıyor. Bakabilen iki aracın orada bulunması, bir çöp parçasını kütlesi, hızı ve zamanı bilinen bir çarpma denemesine dönüştürüyor; Fernando'nun bu olayın enkaz çarpmalarının gelecekteki astronotlar için ne kadar tehlike oluşturduğunu anlamaya yarayacağını söylemesinin nedeni de bu. Değerin tamamı başka amaçlarla gönderilmiş araçlardan ödünç alınıyor.", "en": "NASA's Lunar Reconnaissance Orbiter and South Korea's Danuri are to image the region before and after the impact. Two spacecraft happening to be there and able to look turn a piece of litter into an impact experiment with a known mass, speed and time, which is why Fernando says the event will help work out how much of a hazard debris impacts pose to future astronauts. The whole of the value is borrowed from spacecraft sent for other purposes.", "refs": ["moon"]}, {"tr": "Ödünç alınmış olmanın bir bedeli var. Kütle ve hız ölçülmüş değerler sayılmaz; Gray'in izleme çalışmasının kestirimleridir ve öngörü bir kurum duyurusundan gelmiyor. Başlangıç koşulları ayarlanmak yerine çıkarılmış bir çarpma denemesi, tasarlanmış bir denemeden zayıf kalır. Yararlıdır, ama planlanmış bir sınamanın yerini tutmaz ve sonuçları bu sınırla okunmalıdır.", "en": "Being borrowed has a price. The mass and the speed cannot be counted as measured values; they are estimates from Gray's tracking work, and the prediction does not come from an agency announcement. An impact experiment whose initial conditions were inferred rather than set stays weaker than one that
