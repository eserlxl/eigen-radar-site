<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: full width, no scroll box, shareable via #hash. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }

      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }

    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{

    }

    #briefsSection .section-title .date-select{

    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without

  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){

    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}

    }

    }

<p class="summary">NUTRITION 2026&#x27;da sunulan üç çalışma; yeme saatleri ile bilişsel testleri, küçük çocuk ürünlerinin besin profilini ve gazlı içeceklerden sonra ağız asitliğini inceliyor.</p></div></article>

<ul>
<li><article><p><strong>Nature Communications</strong> · <time datetime="2026-07-27">27 Tem</time></p><h3 lang="tr"><a href="https://www.nature.com/articles/s41467-026-76079-1" rel="external">GABA üreten bağırsak bakterisinin azalması, farelerde bağırsak tümörünü hızlandırdı</a></h3><p lang="tr">Nature Communications&#x27;ta yayımlanan hakem denetimli çalışmada, yüksek yağlı beslenme ve obeziteyle ilişkili kolorektal kanser hastalarından aktarılan dışkı mikrobiyotası, GABA üreten Bacteroides ovatus bakterisini azalttı; bağırsak boşluğundaki GABA düştü ve tümör oluşumu hızlandı.</p></article></li>
<li><article><p><strong>Nature Communications</strong> · <time datetime="2026-07-27">27 Tem</time></p><h3 lang="tr"><a href="https://www.nature.com/articles/s41467-026-76000-w" rel="external">İnterferon enfeksiyon yerleştikten sonra etkisiz kalıyor; çalışma sorumlu olarak laktik asidi gösteriyor</a></h3><p lang="tr">Wuhan Üniversitesi ve Hubei Tıp Üniversitesi ekibinin Nature Communications&#x27;ta yayımlanan hakem denetimli çalışmasına göre birinci tip interferonlar yalnızca enfeksiyon öncesinde verildiğinde koruyor; enfeksiyon yerleştikten sonra etkisiz kalırken yan etkileri belirginleşiyor.</p></article></li>
<li><article><p><strong>NASA</strong> · <time datetime="2026-07-27">26 Tem</time></p><h3 lang="tr"><a href="https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-crewmates-return-from-space-station/" rel="external">Soyuz MS-28, Expedition 74 ekibini 241 günün ardından Dünya&#x27;ya getirdi</a></h3><p lang="tr">NASA astronotu Chris Williams ile Roscosmos kozmonotları Sergey Kud-Sverchkov ve Sergei Mikaev, Soyuz MS-28 aracıyla 26 Temmuz Pazar günü Kazakistan&#x27;da Cezkazgan&#x27;ın güneydoğusuna indi. Ekip Uluslararası Uzay İstasyonu&#x27;nda 241 gün geçirdi.</p></article></li>
<li><article><p><strong>Nature Communications</strong> · <time datetime="2026-07-27">27 Tem</time></p><h3 lang="tr"><a href="https://www.nature.com/articles/s41467-026-75975-w" rel="external">Manganez katkısı, kadmiyum arsenidi kızılötesinde güçlü tek yönlü bir malzemeye çeviriyor</a></h3><p lang="tr">Houston Üniversitesi ve King&#x27;s College London&#x27;ın da içinde olduğu ekip, Dirac yarı metali kadmiyum arsenide (Cd3As2) manganez katarak kızılötesi bölgede güçlü optik tek yönlülük ölçtüğünü bildiriyor. Tek yönlülük, ışığın gidiş ve dönüş yönlerinde farklı davranmasıdır.</p></article></li>
<li><article><p><strong>Nature Communications</strong> · <time datetime="2026-07-27">27 Tem</time></p><h3 lang="tr"><a href="https://www.nature.com/articles/s41467-026-76064-8" rel="external">Çift bölgeli katalizör, asetamidi doğrudan karbondioksit ve nitrattan üretiyor</a></h3><p lang="tr">Hefei Teknoloji Üniversitesi ve Jinan Üniversitesi ekibi, azot katkılı karbon üzerine yerleştirilmiş tek atom nikel ile bakır nanokümelerinden oluşan bir katalizörle karbondioksit ve nitratı birlikte indirgeyerek asetamit ürettiğini bildiriyor.</p></article></li>
<li><article><p><strong>Nature Communications</strong> · <time datetime="2026-07-27">27 Tem</time></p><h3 lang="tr"><a href="https://www.nature.com/articles/s41467-026-76070-w" rel="external">Peptit jel, hücre çevresindeki mekanik ortamı sabit tutarak dört türde kemik onarımını iyileştirdi</a></h3><p lang="tr">Xi&#x27;an Jiaotong Üniversitesi ekibi, hücrenin hemen çevresindeki mekanik özelliklerin zamanla kaymasını sınırlamak için tasarlanmış ViscoClamp adlı peptit hidrojelini tanıtıyor. Malzeme, sabit bir sertlik hedeflemek yerine mekanik dengenin korunmasını hedefliyor.</p></article></li>
</ul>
<h3 lang="tr">Köşe Yazıları</h3>
<article>
<p><strong>Kepler</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-01/2026-07-27/">Bir sefer, deneyler kadar onarımlarla da ölçülüyor</a></h3><p lang="tr">Soyuz MS-28&#x27;in dönüş bülteni iki uzay yürüyüşünü ve bir robot kol onarımını, desteklenen araştırmalarla aynı cümlede sayıyor. Bu sıralama, insanlı bir seferin ne ürettiğine dair en dürüst ölçüyü veriyor.</p>
<p><time datetime="2026-07-27">2026-07-27</time></p>
</article>

ture.com/articles/s41467-026-76079-1", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "GABA üreten bağırsak bakterisinin azalması, farelerde bağırsak tümörünü hızlandırdı", "en": "Loss of a GABA-making gut bacterium accelerated bowel tumours in mice"}, "summary": {"tr": "Nature Communications'ta yayımlanan hakem denetimli çalışmada, yüksek yağlı beslenme ve obeziteyle ilişkili kolorektal kanser hastalarından aktarılan dışkı mikrobiyotası, GABA üreten Bacteroides ovatus bakterisini azalttı; bağırsak boşluğundaki GABA düştü ve tümör oluşumu hızlandı.", "en": "In a peer-reviewed study in Nature Communications, a high-fat diet and faecal microbiota transferred from patients with obesity-associated colorectal cancer depleted the GABA-producing bacterium Bacteroides ovatus. Luminal GABA fell and tumour formation sped up."}, "detail": {"tr": "Yazarların tarif ettiği yolakta mikrobiyal GABA, bağırsak yüzey hücrelerindeki GABA-B alıcısını uyarıyor ve PI3K-HIF1α üzerinden TPI1 enzimini artırıyor; TPI1'den gelen gliseraldehit-3-fosfat PPP1CA'yı baskılayarak YAP proteinini fosforlu halde tutuyor, çekirdekteki YAP etkinliğini ve pentoz fosfat yolağı akışını sınırlıyor, böylece tümör büyümesi frenleniyor. GABA üretemeyen bir B. ovatus mutantı bağırsağa normal yerleşmesine karşın tümörü baskılayamadı; ağızdan GABA verilmesi ya da yabanıl tip bakterinin yeniden yerleştirilmesi tümör yükünü belirgin biçimde düşürdü. İnsan örneklerinde obeziteyle ilişkili kolorektal kanserde dışkı GABA'sının ve TPI1 anlatımının düşük olduğu görüldü; bu insan bulgusu bir ilişkidir, deneysel neden-sonuç bağı fareler ve hücrelerde kuruldu. Makale, dergide erken erişim için düzenlenmemiş kabul metni olarak yayımlandı.", "en": "In the pathway the authors describe, microbial GABA activates the GABA-B receptor on gut lining cells and raises the enzyme TPI1 through PI3K-HIF1α. Glyceraldehyde-3-phosphate produced by TPI1 inhibits PPP1CA, keeps the YAP protein phosphorylated, and restricts both nuclear YAP activity and pentose phosphate pathway flux, which brakes tumour growth. A GABA-deficient B. ovatus mutant colonised the gut normally but failed to suppress tumours, while oral GABA or recolonisation with the wild-type bacterium markedly reduced tumour burden. Human samples from obesity-associated colorectal cancer showed lower faecal GABA and reduced TPI1 expression; that human finding is an association, while the experimental cause-and-effect work was done in mice and cells. The paper appears as an unedited accepted manuscript released for early access."}, "editionDate": "2026-07-27"}, {"featured": true, "topic": "science", "tag": "biology", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76000-w", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "İnterferon enfeksiyon yerleştikten sonra etkisiz kalıyor; çalışma sorumlu olarak laktik asidi gösteriyor", "en": "Interferon stops working once infection is established, and a study points to lactic acid"}, "summary": {"tr": "Wuhan Üniversitesi ve Hubei Tıp Üniversitesi ekibinin Nature Communications'ta yayımlanan hakem denetimli çalışmasına göre birinci tip interferonlar yalnızca enfeksiyon öncesinde verildiğinde koruyor; enfeksiyon yerleştikten sonra etkisiz kalırken yan etkileri belirginleşiyor.", "en": "In a peer-reviewed Nature Communications paper, a team from Wuhan University and Hubei University of Medicine reports that type I interferons protect only when given before infection. Once infection is established they are ineffective while their adverse effects become prominent."}, "detail": {"tr": "Yazarlar aradaki aracı molekül olarak konağın kendi ürettiği laktik asidi öne sürüyor: laktik asidin virüsün bağışıklıktan kaçmasını kolaylaştırdığını, interferonun tedavi etkisini bozduğunu ve iltihap fırtınasını tetiklediğini bildiriyorlar. Önerilen mekanizmada laktik asit, zar alıcısı üzerinden SIRT1 düzeyini yükselterek interferon etkinliğini baskılıyor; aynı anda interferonla birlikte NF-κB'yi aşırı etkinleştirerek sitokin fırtınası başlatıyor ve 'antiviral başarısızlık - iltihap büyümesi' adını verdikleri bir geri besleme döngüsü kuruyor. Bu mekanizmadan yola çıkan ekip, interferonu ABD Gıda ve İlaç Dairesi onaylı bir laktat dehidrogenaz baskılayıcısıyla birleştirdi; bildirilen sonuçlara göre bu birleşim baskılanmayı tersine çevirdi, iltihabı azalttı ve geç evre enfeksiyonlarda da etkisini korudu. Çalışmanın tamamı klinik öncesi düzeydedir; insanlarda tedavi etkisi sınanmış değildir.", "en": "The authors propose host-derived lactic acid as the intermediary, reporting that it helps the virus evade immunity, impairs interferon's therapeutic effect and triggers an inflammatory storm. In the proposed mechanism, lactic acid raises SIRT1 through a membrane receptor and thereby suppresses interferon activity, while simultaneously combining with interferon to hyperactivate NF-κB, initiating a cytokine storm and forming what the authors call an antiviral-failure-to-inflammatory-amplification feedback loop. Building on that mechanism, the team paired interferon with a lactate dehydrogenase inhibitor already approved by the US Food and Drug Administration; on the reported results the combination reversed the suppression, reduced inflammation and retained efficacy in late-stage infection. All of the work is preclinical, and the treatment effect has not been tested in people."}, "editionDate": "2026-07-27"}, {"featured": true, "topic": "science", "tag": "space", "src": "NASA", "url": "https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-crewmates-return-from-space-station/", "publishedDate": "2026-07-26", "date": {"tr": "26 Tem", "en": "Jul 26"}, "title": {"tr": "Soyuz MS-28, Expedition 74 ekibini 241 günün ardından Dünya'ya getirdi", "en": "Soyuz MS-28 brings the Expedition 74 crew home after 241 days"}, "summary": {"tr": "NASA astronotu Chris Williams ile Roscosmos kozmonotları Sergey Kud-Sverchkov ve Sergei Mikaev, Soyuz MS-28 aracıyla 26 Temmuz Pazar günü Kazakistan'da Cezkazgan'ın güneydoğusuna indi. Ekip Uluslararası Uzay İstasyonu'nda 241 gün geçirdi.", "en": "NASA astronaut Chris Williams and Roscosmos cosmonauts Sergey Kud-Sverchkov and Sergei Mikaev landed southeast of Dzhezkazgan in Kazakhstan on Sunday 26 July aboard Soyuz MS-28, ending 241 days aboard the International Space Station."}, "detail": {"tr": "Ekip 27 Kasım 2025'te fırlatılmıştı ve NASA'nın verdiği sayılara göre Dünya çevresinde 3.856 tur atarak 102 milyon milden fazla yol aldı. Williams görev boyunca güç sistemi yükseltmeleri için iki uzay yürüyüşü yaptı ve Canadarm2 robot kolunu onardı. NASA, ekibin desteklediği çalışmalar arasında kanser tedavisi araştırmalarını ve yüksek başarımlı bilgisayarlar ile elektronik bileşenler için uzayda üretim iyileştirmelerini sayıyor. Uçuş, Williams ve Mikaev'in ilk, Kud-Sverchkov'un ikinci göreviydi.", "en": "The crew launched on 27 November 2025 and, on NASA's figures, travelled more than 102 million miles across 3,856 orbits of Earth. During the increment Williams completed two spacewalks for power system upgrades and repaired the Canadarm2 robotic arm. NASA lists cancer treatment research and in-space manufacturing improvements for high-performance computers and electronics among the work the crew supported. It was a first flight for Williams and Mikaev, and a second for Kud-Sverchkov."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75975-w", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Manganez katkısı, kadmiyum arsenidi kızılötesinde güçlü tek yönlü bir malzemeye çeviriyor", "en": "Manganese doping turns cadmium arsenide into a strongly nonreciprocal infrared material"}, "summary": {"tr": "Houston Üniversitesi ve King's College London'ın da içinde olduğu ekip, Dirac yarı metali kadmiyum arsenide (Cd3As2) manganez katarak kızılötesi bölgede güçlü optik tek yönlülük ölçtüğünü bildiriyor. Tek yönlülük, ışığın gidiş ve dönüş yönlerinde farklı davranmasıdır.", "en": "A team including the University of Houston and King's College London reports measuring strong optical nonreciprocity in the infrared after doping the Dirac semimetal cadmium arsenide (Cd3As2) with manganese. Nonreciprocity means light behaves differently in the forward and reverse directions."}, "detail": {"tr": "Kızılötesinde güçlü tek yönlü tepki veren malzeme az olduğu için bu davranış bugüne dek çoğunlukla manyetik Weyl yarı metallerinden bekleniyordu ve malzeme seçeneği dardı. Yazarların açıklamasına göre burada etkiyi doğuran şey, manganez katkısının toplu manyetik düzenlenmesi: bu düzenlenme zaman tersinme simetrisini kırarak Dirac konilerinin katlılığını kaldırıyor ve manyetik Weyl konileri oluşturuyor. Ekip, elde edilen tek yönlülüğün hem katkı derişimiyle hem de dışarıdan uygulanan manyetik alanla ayarlanabildiğini bildiriyor. Çalışma bir malzeme platformu ve tasarım yaklaşımı öneriyor; kızılötesi yalıtıcı gibi bir aygıtın üretilebildiği anlamına gelmiyor.", "en": "Because few materials respond strongly and nonreciprocally in the infrared, the effect has mostly been sought in magnetic Weyl semimetals, where the choice of materials is narrow. On the authors' account the effect here comes from the collective magnetic ordering of the manganese dopant, which breaks time-reversal symmetry, lifts the degeneracy of the Dirac cones and creates magnetic Weyl cones. The team reports that the resulting nonreciprocity can be tuned both by doping concentration and by an external magnetic field. The work offers a material platform and a design approach; it does not mean a device such as an infrared isolator has been built."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76064-8", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Çift bölgeli katalizör, asetamidi doğrudan karbondioksit ve nitrattan üretiyor", "en": "A dual-site catalyst makes acetamide directly from carbon dioxide and nitrate"}, "summary": {"tr": "Hefei Teknoloji Üniversitesi ve Jinan Üniversitesi ekibi, azot katkılı karbon üzerine yerleştirilmiş tek atom nikel ile bakır nanokümelerinden oluşan bir katalizörle karbondioksit ve nitratı birlikte indirgeyerek asetamit ürettiğini bildiriyor.", "en": "A team from Hefei University of Technology and Jinan University reports producing acetamide by co-reducing carbon dioxide and nitrate over a catalyst that pairs single nickel atoms with copper nanoclusters on a nitrogen-doped carbon support."}, "detail": {"tr": "Amitleri küçük ve bol moleküllerden elektrokimyasal yolla üretmenin önündeki temel güçlük, karbon-karbon ve karbon-azot bağlarının aynı yüzeyde birbiriyle yarışmasıdır. Yazarların anlattığı iş bölümünde nikel bölgeleri karbondioksiti seçici biçimde karbon monoksite çeviriyor, komşu bakır nanokümeleri hem karbon-karbon eşleşmesini sağlayıp *CCO ara ürününü oluşturuyor hem de nitratı indirgeyerek *NH2 ara ürününü veriyor; iki ara ürünün yan yana üretilmesi karbon-azot eşleşmesini kolaylaştırıyor. Bildirilen başarım, santimetrekare başına 215,7 miliamperlik akım yoğunluğunda gram katalizör başına saatte 257,3 milimol asetamit ve 160 saatlik kararlı çalışma. Yerinde spektroskopi ve kuramsal hesaplamalar, nikel ile bakır arasındaki güçlü elektronik eşleşmenin *CO ikileşmesi ve *CCO-*NH2 eşleşmesi gibi kritik adımların etkinleşme engelini düşürdüğüne işaret ediyor.", "en": "The core difficulty in making amides electrochemically from small, abundant molecules is that carbon-carbon and carbon-nitrogen bond formation compete on the same surface. In the division of labour the authors describe, nickel sites selectively convert carbon dioxide to carbon monoxide while adjacent copper nanoclusters both promote carbon-carbon coupling to form the *CCO intermediate and reduce nitrate to form the *NH2 intermediate; making the two intermediates next to each other eases the carbon-nitrogen coupling. The reported performance is an acetamide yield rate of 257.3 millimoles per hour per gram of catalyst at a current density of 215.7 milliamps per square centimetre, with stable operation over 160 hours. In situ spectroscopy and calculations point to strong nickel-copper electronic coupling lowering the activation barriers for critical steps such as *CO dimerisation and *CCO-*NH2 coupling."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76070-w", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Peptit jel, hücre çevresindeki mekanik ortamı sabit tutarak dört türde kemik onarımını iyileştirdi", "en": "A peptide gel steadied the mechanical surroundings of cells and improved bone repair in four species"}, "summary": {"tr": "Xi'an Jiaotong Üniversitesi ekibi, hücrenin hemen çevresindeki mekanik özelliklerin zamanla kaymasını sınırlamak için tasarlanmış ViscoClamp adlı peptit hidrojelini tanıtıyor. Malzeme, sabit bir sertlik hedeflemek yerine mekanik dengenin korunmasını hedefliyor.", "en": "A team at Xi'an Jiaotong University introduces ViscoClamp, a peptide hydrogel designed to limit the way the mechanical properties immediately around a cell drift over time. Rather than aiming at a fixed stiffness, the material aims to hold that mechanical balance steady."}, "detail": {"tr": "Canlı dokular hücre dışı matrisi sürekli yeniden biçimlendirir; süregelen glikasyon, yani şekerlerin proteinlere bağlanması, bu kaymayı büyütür ve hücreye ulaşan mekanik işaretleri bozar. Ekip, kural tabanlı sayma ve puanlama yordamıyla yürütülen bir tasarım akışı kullanarak, kalsiyum iyonlarına ve ileri glikasyon son ürünlerine ilgi duyan, matrisin içine giren bir peptit hidrojeli tasarladı. Bildirilen sonuçlara göre jel, glikasyon yükünü tamponluyor ve viskoelastik kaymayı sınırlarken mezenkimal kök hücrelerin matrisi yeniden biçimlendirmesine ve mineralleşmeye engel olmuyor; kararlılık, değişken glikasyon girdilerinin ne ölçüde sabit mekanik çıktılara sıkıştırıldığını ölçen bir dağılım aktarım oranıyla niceleniyor. Kan şekeri yüksek hayvanlarda açılan kraniyofasiyal kemik boşluklarında jel, hücre ölçeğindeki mekaniği sabitledi ve kemik onarımı ile mineralleşmeyi iyileştirdi; denemeler sıçan, tavşan, beagle cinsi köpek ve rhesus makağında yapıldı. İnsanda sınanmış değildir.", "en": "Living tissue continually remodels the extracellular matrix, and chronic glycation, the binding of sugars to proteins, amplifies that drift and destabilises the mechanical cues reaching the cell. Using a design workflow built on rule-based enumeration and scoring, the team produced a peptide hydrogel that interpenetrates the matrix and has affinity for calcium ions and advanced glycation end products. On the reported results the gel buffers the glycation load and constrains viscoelastic drift while still permitting mesenchymal stem cells to remodel the matrix and mineralise it; the stabilisation is quantified with a dispersion-transfer ratio measuring how far variable glycation inputs are compressed into stable micromechanical outputs. In craniofacial bone defects created in animals with high blood sugar, the gel stabilised cell-scale mechanics and improved bone repair and mineralisation, with tests run in rats, rabbits, beagle dogs and rhesus macaques. It has not been tested in humans."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76063-9", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Elektrikle sürülen kimyasal döngü, katı oksit hücrede propilen seçiciliğini yükseltti", "en": "Electrically driven chemical looping raised propylene selectivity in a solid oxide cell"}, "summary": {"tr": "Sichuan Üniversitesi ekibi, propanı katı oksit elektroliz hücresi içinde karbondioksit yardımıyla yükseltgeyerek propilen üreten, elektrikle sürülen sürekli bir kimyasal döngü bildiriyor.", "en": "A team at Sichuan University reports an electrically driven, continuous chemical looping process that makes propylene by oxidising propane with carbon dioxide inside a solid oxide electrolysis cell."}, "detail": {"tr": "Propanın yükseltgeyici dehidrojenlenmesinde asıl sorun aşırı yükseltgenmedir: propan karbon oksitlerine kadar yanınca ürün seçiciliği düşer. Ekip, santimetrekare başına 10 miliamperlik akım yoğunluğunda ve Co3O4 ile değiştirilmiş La0,6Sr0,4Co0,2Fe0,8O3-δ anot kullanarak yüzde 92,6 olefin seçiciliği ve tek geçişte yüzde 14,2 propan dönüşümü bildiriyor. Propilen verimi toplam gram başına saatte 5,11 milimol; bu, akımın kapalı olduğu karşılaştırma durumunun 18,5 katı. Dayanıklılık denemesi 120 saat sürdü. Yerinde ölçümler ve hesaplamalar, katotta indirgenen karbondioksitten gelen oksijen iyonlarının anottaki Co3O4 örgü oksijenini çalışma sırasında yenilediğini gösteriyor; yazarlara göre bu döngü anot yüzeyinin oksijen etkinliğini ılımlı bir aralıkta tutarak aşırı yükseltgenmeyi ve propanın parçalanmasını önlüyor. Sonuçlar laboratuvar ölçeğindedir.", "en": "The central problem in oxidative propane dehydrogenation is overoxidation: when propane burns through to carbon oxides, product selectivity collapses. At a current density of 10 milliamps per square centimetre and with a Co3O4-modified La0.6Sr0.4Co0.2Fe0.8O3-δ anode, the team reports 92.6 per cent olefin selectivity and 14.2 per cent single-pass propane conversion. The propylene yield is 5.11 millimoles per gram of total material per hour, 18.5 times the open-circuit comparison. The durability test ran for 120 hours. In situ measurements and calculations indicate that oxygen ions derived from carbon dioxide reduction at the cathode replenish the Co3O4 lattice oxygen at the anode during operation; on the authors' account this cycle keeps the anode surface oxygen activity in a moderate range and so avoids overoxidation and propane cracking. The results are at laboratory scale."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76142-x", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Kasımpatıda tek bir düzenleyici, kış durgunluğu ile geciken çiçeklenmeyi birbirine bağlıyor", "en": "A single regulator in chrysanthemum ties winter dormancy to delayed flowering"}, "summary": {"tr": "Nature Communications'ta yayımlanan hakem denetimli çalışmaya göre kasımpatıda (Chrysanthemum morifolium) CmDREBa adlı düzenleyici, uzun süreli soğuklamaya karşılık hem gövde uzamasını hem de çiçeklenmeyi aynı anda baskılıyor.", "en": "In a peer-reviewed Nature Communications study, a regulator called CmDREBa in chrysanthemum (Chrysanthemum morifolium) suppresses both stem extension and flowering at the same time in response to prolonged chilling."}, "detail": {"tr": "Çok yıllık bitkilerin kışı geçirmesini sağlayan uyumlardan biri, gövdeyi uzatmayı ve çiçek açmayı birlikte durdurup yere yakın rozet biçiminde beklemektir; bu iki ayrı gelişim programının nasıl eşgüdümlendiği açık değildi. Ekibin bulgularına göre uzun soğuklama etkisini ağırlıklı olarak sürgün ucunda gösteriyor ve orada, kaburga bölgesi denen dokuda gen anlatımı belirgin biçimde değişiyor. Soğuk, CmDREBa anlatımını uyarıyor; bu da hem uzamayı hem çiçeklenmeyi baskılıyor. Sıcaklık yükselince CmDREBa anlatımı geriliyor ve iki süreç yeniden başlıyor. Yazarlar CmDREBa'nın MADS AFFECTING FLOWERING (MAF) genlerini doğrudan uyardığını, bu genlerin de rozet büyümesini desteklediğini bildiriyor. Çalışma tek bir süs bitkisi türünde yürütüldü.", "en": "One of the adaptations that carries perennials through winter is stopping stem extension and flowering together and waiting close to the ground in a rosette, but how those two separate developmental programmes are coordinated was unclear. On the team's findings, prolonged chilling acts mainly at the shoot apex, where gene expression changes markedly in the tissue known as the rib zone. Cold induces CmDREBa expression, which suppresses both extension and flowering. When temperatures rise, CmDREBa expression declines and both processes resume. The authors report that CmDREBa directly induces MADS AFFECTING FLOWERING (MAF) genes, which in turn promote rosette growth. The work was carried out in a single ornamental species."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "climate", "src": "RNZ", "url": "https://www.rnz.co.nz/news/environment/805275/rising-deer-numbers-drive-decline-in-native-forests-research", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Yeni Zelanda'da ekologlar, geyik sayıları için ulusal bir yönetim stratejisi çağrısı yapıyor", "en": "New Zealand ecologists call for a national management strategy for deer numbers"}, "summary": {"tr": "Canterbury Üniversitesi'nden David Norton ile Manaaki Whenua - Landcare Research'ten Peter Bellingham ve Sarah Richardson'ın New Zealand Journal of Ecology'de yayımlanan forum makalesi, yerli ormanlardaki geyik sayılarının sürdürülemez düzeye çıktığını savunuyor ve ulusal bir geyik yönetimi stratejisi istiyor.", "en": "A forum article in the New Zealand Journal of Ecology by David Norton of the University of Canterbury with Peter Bellingham and Sarah Richardson of Manaaki Whenua - Landcare Research argues that deer numbers in native forests have risen to unsustainable levels, and calls for a national deer management strategy."}, "detail": {"tr": "Forum makalesi, dergilerde özgün ölçüm sunan araştırma makalesinden ayrı bir türdür: yayımlanmış bulguları bir araya getirip tartışmaya açar. Yazarlar, geyiklerin hem yaşlı hem yenilenen yerli ormanlara otlama yoluyla ve orman tabanındaki toprak ile döküntüye etkileri üzerinden geri dönüşü olmayan zarar verdiğini; bunun orman altı bitki örtüsünü, zamanla da taç katmanının bileşimini değiştirdiğini, hayvanlar için yaşam alanı niteliğini düşürdüğünü savunuyor. Heyelan gibi bozulmuş alanlarda otlamanın gençleşmeyi geciktirmesinin suyu tutma kapasitesini azalttığını ve tortu kaybını artırdığını belirtiyorlar. Makaleye göre geyikler ile iklim değişikliğinin ortak etkisi, ikisinin ayrı ayrı etkisinden büyük olasılıkla daha ağır olacak. Norton, RNZ'ye geyik sayılarının geçen yüzyılın ortasındaki düzeylere geri döndüğünü, 20-30 metrelik taç katmanının altında yetişen gençliğin asıl kaygı konusu olduğunu söyledi.", "en": "A forum article is a distinct format from a research paper presenting original measurements: it brings published findings together and opens them to argument. The authors contend that deer are causing irreversible harm to both old-growth and regenerating native forest through browsing and through their effects on forest-floor soil and litter, changing the understorey and eventually canopy composition and reducing habitat quality for fauna. On disturbed ground such as landslides, they write, browsing retards regeneration, which reduces water retention and increases sediment loss. The article argues that the combined impact of deer and climate change is likely to be considerably worse than either alone. Norton told RNZ that deer numbers have returned to mid-twentieth-century levels, and that the regeneration coming up beneath a canopy 20 to 30 metres high is the real concern."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "biology", "src": "American Society for Nutrition", "url": "https://www.eurekalert.org/news-releases/1136419", "publishedDate": "2026-07-26", "date": {"tr": "26 Tem", "en": "Jul 26"}, "title": {"tr": "Dokuz saatin altında yeme aralığı, 47 kadınlık öncü çalışmada daha iyi planlama puanlarıyla ilişkilendirildi", "en": "An eating window under nine hours was linked to better planning scores in a 47-woman pilot"}, "summary": {"tr": "Rutgers Üniversitesi'nden Sue Shapses'in yürüttüğü öncü klinik çalışma, 26 Temmuz Pazar günü Maryland eyaletindeki NUTRITION 2026 toplantısında sunuldu. Günlük yeme aralığını dokuz saatin altına indiren kadınlar, uzamsal planlama ve sorun çözme testlerinde belirgin iyileşme gösterdi.", "en": "A pilot clinical trial led by Sue Shapses of Rutgers University was presented on Sunday 26 July at the NUTRITION 2026 meeting in Maryland. Women who cut their daily eating window to under nine hours showed significant improvement on spatial planning and problem-solving tests."}, "detail": {"tr": "Çalışmaya 50-79 yaş aralığında, fazla kilolu ya da obez 47 kadın katıldı; 26'sı yeme aralığını günde dokuz saatin altına indirdi, 21'i alışılmış yaklaşık 12 saatlik aralığı sürdürdü. Altı ayda iki grup da yaklaşık 15 pound, yani yaklaşık 7 kilogram verdi. Yeme aralığı kısıtlanan grupta uzamsal planlama ve sorun çözme testlerinde belirgin iyileşme görüldü; bellek ve öğrenme hatalarında azalma yönünde eğilim bildirildi. Aynı anda birden çok işi yürütme ve tepki süresi ölçümlerinde iki grup arasında kayda değer fark çıkmadı. Amerikan Beslenme Derneği'nin duyurusu, NUTRITION 2026'da sunulan bildiri özetlerinin uzmanlardan oluşan bir kurulca seçildiğini ancak genellikle bilimsel dergilerde yayın için gereken hakem sürecinden geçmediğini, bu nedenle bulguların hakem denetimli bir yayın çıkana dek ön sonuç sayılması gerektiğini belirtiyor.", "en": "The trial enrolled 47 women aged 50 to 79 living with overweight or obesity; 26 restricted their eating to under nine hours a day and 21 kept a typical window of about 12 hours. Both groups lost roughly 15 pounds, about 7 kilograms, over six months. The restricted group showed significant improvement on spatial planning and problem-solving tests, with a reported trend toward fewer memory and learning errors. There was no notable difference between the groups on multitasking or reaction time. The American Society for Nutrition's announcement states that abstracts presented at NUTRITION 2026 were evaluated and selected by a committee of experts but have not generally undergone the peer review required for publication in a scientific journal, so the findings should be considered preliminary until a peer-reviewed publication is available."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "biology", "src": "American Society for Nutrition", "url": "https://www.eurekalert.org/news-releases/1136466", "publishedDate": "2026-07-26", "date": {"tr": "26 Tem", "en": "Jul 26"}, "title": {"tr": "Bebek ve küçük çocuk ürünlerinin denetiminde 2.783 üründen yüzde 81'i aşırı işlenmiş çıktı", "en": "An audit of 2,783 toddler foods found 81 per cent were ultra-processed"}, "summary": {"tr": "Texas Üniversitesi Austin'den Erin A. Hudson ve Marissa Burgermaster, Austin'deki 21 marketten toplanan 6-36 aylık çocuklara yönelik 2.783 paketli ürünü inceledi. Sonuçlar 26 Temmuz Pazar günü NUTRITION 2026 toplantısında sunuldu.", "en": "Erin A. Hudson and Marissa Burgermaster of the University of Texas at Austin examined 2,783 packaged products for children aged 6 to 36 months, gathered from 21 grocery stores in Austin. The results were presented on Sunday 26 July at the NUTRITION 2026 meeting."}, "detail": {"tr": "Araştırmacılar market raflarındaki bebek ve küçük çocuk reyonlarını fotoğrafladı ve ürünlerin besin içeriğini Nova sınıflandırması ile Dünya Sağlık Örgütü'nün besin ve tanıtım profili modeline göre değerlendirdi. Ürünlerin yüzde 81'i aşırı işlenmiş sınıfına girdi. Yüzde 49'u en az bir Dünya Sağlık Örgütü besin ölçütünü karşılamadı: yüzde 17'si şeker, yüzde 25'i sodyum, yüzde 11'i yağ ve yüzde 12'si enerji yoğunluğu önerilerini aştı. Sayım tek bir şehrin raflarını kapsıyor ve bulgular bir kongre bildiri özetine dayanıyor; Amerikan Beslenme Derneği bu özetlerin dergi hakem sürecinden geçmediğini ve hakem denetimli yayın çıkana dek ön sonuç sayılması gerektiğini belirtiyor.", "en": "The researchers photographed the baby and toddler aisles on grocery shelves and assessed the products' nutritional content against the Nova classification and the World Health Organization's Nutrition and Promotion Profile Model. Eighty-one per cent of the products fell into the ultra-processed category. Forty-nine per cent failed at least one WHO nutrient standard: 17 per cent exceeded the sugar recommendation, 25 per cent sodium, 11 per cent fat and 12 per cent energy density. The count covers the shelves of a single city and the findings rest on a conference abstract; the American Society for Nutrition states that such abstracts have not been through journal peer review and should be treated as preliminary until a peer-reviewed publication appears."}, "editionDate": "2026-07-27"}, {"featured": false, "topic": "science", "tag": "biology", "src": "American Society for Nutrition", "url": "https://www.eurekalert.org/news-releases/1136424", "publishedDate": "2026-07-26", "date": {"tr": "26 Tem", "en": "Jul 26"}, "title": {"tr": "Maden suyunun tükürükte yarattığı asit düşüşü, 20 kişilik denemede 20 dakikada geri döndü", "en": "Sparkling water's dip in saliva acidity reversed within 20 minutes in a 20-person test"}, "summary": {"tr": "Purdue Üniversitesi'nden Wajiha Zulfiqar'ın 20 yetişkinle yürüttüğü deneme, 26 Temmuz Pazar günü NUTRITION 2026 toplantısında sunuldu. Şekerli gazlı içecek tükürükte en düşük pH değerini verirken maden sularının yarattığı asitlik 20 dakika içinde başlangıç düzeyine yaklaştı.", "en": "A test with 20 adults run by Wajiha Zulfiqar of Purdue University was presented on Sunday 26 July at the NUTRITION 2026 meeting. Sugar-sweetened soda produced the lowest salivary pH, while the acidity caused by sparkling waters returned close to baseline within 20 minutes."}, "detail": {"tr": "Her katılımcı dört içeceğin hepsini denedi; böylece kişiler arası değişkenliğin etkisi azaltıldı. Şekerli gazlı içecek, sade maden suyu, kalsiyum eklenmiş maden suyu ve sade su içildikten 2, 5 ve 20 dakika sonra tükürük pH'ı ölçüldü. Şekerli gazlı içecek en düşük pH'ı verdi ve 2. ile 20. dakikalarda sade sudan belirgin biçimde daha asitliydi. Sade maden suyu 2. dakikada, kalsiyum eklenmiş maden suyu ise 5. dakikada geçici bir düşüş yarattı; her iki maden suyunda da pH 20. dakikada başlangıca yakın düzeye döndü ve mine hasarının başladığı kabul edilen 5,5 eşiğinin üzerinde kaldı. Araştırmacılar yalnızca kısa süreli etkiyi ölçtüklerini, gerçek yaşamda mine aşınmasının tüketim sıklığına, ağızda kalma süresine ve şeker içeriğine bağlı olduğunu vurguluyor. Bulgular hakem denetiminden geçmemiş bir kongre bildiri özetine dayanıyor.", "en": "Each participant tried all four drinks, which reduced the influence of person-to-person variation. Salivary pH was measured 2, 5 and 20 minutes after sugar-sweetened soda, plain sparkling water, calcium-fortified sparkling water and plain water. The soda produced the lowest pH and was significantly more acidic than plain water at 2 and 20 minutes. Plain sparkling water caused a temporary dip at 2 minutes and the calcium-fortified version at 5 minutes; with both sparkling waters pH returned close to baseline by 20 minutes and stayed above the 5.5 threshold generally taken as the point at which enamel damage begins. The researchers stress that they measured only short-term effects, and that real-world enamel erosion depends on how often drinks are consumed, how long they stay in the mouth and how much sugar they contain. The findings rest on a conference abstract that has not been peer reviewed."}, "editionDate": "2026-07-27"}], "visualBriefs": [{"id": "science-control-at-active-sites", "topic": "science", "title": {"tr": "Malzeme işlevi etkin bölg  with processed pellets, and an enamel-like surface beneath bubbles"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "hasAnalysis": true}, {"id": "science-nonlinear-boundaries-in-nature", "topic": "science", "title": {"tr": "Doğadaki eşikler ortalamaları boşa çıkarıyor", "en": "Natural thresholds can defeat averages"}, "summary": {"tr": "Gelgit sulak alanları deniz düzeyi eşiğini aşınca hızla kaybolurken bitki döküntüsü oksijen sınırında daha hızlı ayrışıyor. İki çalışma, çevresel ortalamaların kritik geçiş bölgelerini gizleyebileceğini gösteriyor.", "en": "Tidal wetlands disappear faster beyond a sea-level threshold while plant litter decomposes fastest at an oxygen boundary. Together, the studies show why environmental averages can hide consequential transition zones."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-26/science-nonlinear-boundaries-in-nature-1280.c3fde4e79285.webp", "variants": [{"src": "/assets/briefs/2026-07-26/science-nonlinear-boundaries-in-nature-640.2bf31cce72f9.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/science-nonlinear-boundaries-in-nature-1280.c3fde4e79285.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Gelgit sulak alanı ile toprağın oksijen sınırını tek kesitte birleştiren editoryal bilim illüstrasyonu", "en": "Scientific editorial illustration combining a tidal wetland and a soil oxygen boundary in one cross-section"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "hasAnalysis": true}, {"id": "science-interface-engineering-device-gains", "topic": "science", "title": {"tr": "Cihaz kazanımı arayüzde, sınır laboratuvarda", "en": "Device gains sit at the interface; limits stay in the lab"}, "summary": {"tr": "Bir yarı iletken maser ile anotsuz lityum hücresi, malzeme arayüzlerini düzenleyerek güçlü cihaz kazanımları bildiriyor. Her iki sonuç da ölçülen başarı ile henüz gösterilmemiş ürün dayanıklılığını ayırmayı gerektiriyor.", "en": "A semiconductor maser and an anode-free lithium cell report strong device gains by engineering material interfaces. Both results require separating measured performance from product durability that has not yet been demonstrated."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-26/science-interface-engineering-device-gains-1280.155e74f476b9.webp", "variants": [{"src": "/assets/briefs/2026-07-26/science-interface-engineering-device-gains-640.7744833a456d.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/science-interface-engineering-device-gains-1280.155e74f476b9.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Rezonans kristali ile katmanlı pil arayüzünü yan yana gösteren metinsiz bilim illüstrasyonu", "en": "Text-free scientific illustration pairing a resonant crystal with a layered battery interface"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "hasAnalysis": true}, {"id": "science-data-relations-outpace-mechanisms", "topic": "science", "title": {"tr": "Veri ilişkisi mekanizmayı tek başına seçmiyor", "en": "A data relation does not select one mechanism"}, "summary": {"tr": "Bakır oksitlerdeki saçılma yeniden çözümlemesi ile özellik-temelli türleşme modelleri farklı alanlarda aynı uyarıyı yapıyor: güçlü bir veri ilişkisi veya iyi uyum, tek bir mekanizmayı belirlemeyebilir.", "en": "A reanalysis of scattering in cuprates and a study of trait-driven speciation models issue the same warning across fields: a strong data relation or fit may not identify one mechanism."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-1280.1b36092ffd7f.webp", "variants": [{"src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-640.9de64c3561c4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-1280.1b36092ffd7f.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Farklı katmanlardan aynı örüntüyü ve farklı köklerden tek ağacı gösteren bilimsel editoryal illüstrasyon", "en": "Scientific editorial illustration showing one pattern across different layers and one tree above different root systems"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "hasAnalysis": true}, {"id": "science-physical-archives-deep-time", "topic": "science", "title": {"tr": "Maddi arşivler iki tarihi yazılı kayıtların ötesine taşıyor", "en": "Physical archives extend two histories beyond written records"}, "summary": {"tr": "Chang'e-6 kayaçları Ay çarpmalarını üç milyar yıla yayıyor; eski patojen genomları ise uzak Avrasya topluluklarını yaklaşık 5.300 yıl önce bağlıyor. İki çalışma, örnekleme sınırlarını koruyarak maddeden derin tarih kuruyor.", "en": "Chang'e-6 rocks date lunar impacts across three billion years; ancient pathogen genomes connect distant Eurasian populations about 5,300 years ago. Both studies reconstruct deep history from surviving material while retaining sampling limits."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-1280.0704221b163a.webp", "variants": [{"src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-640.253fc696931a.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-1280.0704221b163a.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Ay katmanları ve DNA izleriyle çevrili bir kayaç ile eski kemiği gösteren metinsiz editoryal illüstrasyon", "en": "Text-free editorial illustration of a rock and ancient bone surrounded by lunar layers and DNA traces"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "science-constraints-become-signal", "topic": "science", "title": {"tr": "İki deney ölçüm kısıtını sinyale dönüştürüyor", "en": "Two experiments turn measurement constraints into signal"}, "summary": {" ": "Bir zehir peptidi, su arıtma katalizörü ve hızlı tanı tahlili, pratik avantajlar sunuyor; ancak üçü de farklı doğrulama basamaklarında bulunuyor.", "en": "A venom peptide, a water-treatment catalyst and a rapid diagnostic assay offer practical advantages, but each remains at a different stage of validation."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-22/science-lab-to-field-1280.c46d7688fbe5.webp", "variants": [{"src": "/assets/briefs/2026-07-22/science-lab-to-field-640.4ae67fac90c1.webp", "width": 640}, {"src": "/assets/briefs/2026-07-22/science-lab-to-field-1280.c46d7688fbe5.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Peptit, katalizör nanoparçacıkları ve renk değiştiren tahlili laboratuvardan uygulamaya uzanan yolda gösteren editoryal illüstrasyon", "en": "Editorial illustration of a peptide, catalyst nanoparticles and a colour-changing assay along a path from laboratory to application"}, "generatedAt": "2026-07-22"}, "editionDate": "2026-07-22", "hasAnalysis": true}, {"id": "science-risk-models", "topic": "science", "title": {"tr": "Riskin sınırlarını çizmek: Kıyı, fay ve dağ", "en": "Drawing the boundaries of risk: Coast, fault and mountain"}, "summary": {"tr": "Kıyı taşkını projeksiyonları, süpershear deprem benzetimleri ve kır çiçeği deneyleri, riskin ölçeğini gösterirken sonuçların hangi koşullara bağlı olduğunu da açıklıyor.", "en": "Coastal-flood projections, supershear earthquake simulations and wildflower experiments expose the scale of risk while clarifying the conditions attached to their results."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-22/science-risk-models-1280.85fc5128ba87.webp", "variants": [{"src": "/assets/briefs/2026-07-22/science-risk-models-640.0066f2b5e36d.webp", "width": 640}, {"src": "/assets/briefs/2026-07-22/science-risk-models-1280.85fc5128ba87.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr":
