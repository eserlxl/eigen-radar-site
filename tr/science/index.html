ay.com/space-services/2026/07/29/katalyst-space-encounters-attitude-control-issues-with-link-spacecraft/", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "NASA'nın Swift teleskobunu yükseltmeye giden aracın üç tepki çarkından ikisi bozuldu", "en": "Two of three reaction wheels have failed on the spacecraft sent to reboost NASA's Swift telescope"}, "summary": {"tr": "Katalyst Space'in 2 Temmuz'da Northrop Grumman Pegasus XL ile fırlatılan LINK aracı, üç tepki çarkından ikisinin çalışmaz hale gelmesi ve tepki denetim sisteminin yalnızca kısmen işlemesi üzerine çok eksenli bir dönüşe girdi. Şirkete göre bu sırada haberleşme geçici olarak kesildi ve ana bilgisayar kendini yeniden başlattı; diğer alt sistemler çalışıyor.", "en": "Katalyst Space's LINK spacecraft, launched on 2 July aboard a Northrop Grumman Pegasus XL, went into a multi-axis spin after two of its three reaction wheels stopped working and its reaction control system was left only partly functional. The company says communications were briefly lost and the bus reset, while its other subsystems remain operational."}, "detail": {"tr": "LINK, NASA'nın Swift gözlemevine yaklaşıp atmosfere girmeden önce yörüngesini yükseltmek üzere tasarlandı; NASA bir yıldan kısa süre önce şirkete 30 milyon dolarlık bir sözleşme vermiş ve ekipten aracı 12 aydan kısa sürede tasarlayıp üretmesini, sınamasını ve bütünlemesini istemişti. Katalyst aracı elektrikli itki ateşlemeleriyle dengelemeye çalışıyor ve güdüm, seyrüsefer ve denetim yazılımını benzetimle doğrulayarak güncelliyor. Şirket \"Görev sürüyor ve bu değişikliklerle LINK'in Swift ile buluşmak için işleyen bir yolu olduğuna inanmayı sürdürüyoruz\" diyor.", "en": "LINK was designed to rendezvous with NASA's Swift observatory and raise its orbit before atmospheric reentry. NASA awarded the company a $30 million contract less than a year ago, requiring the team to design, build, test and integrate the spacecraft in under 12 months. Katalyst is stabilising the vehicle with electric propulsion burns and updating its guidance, navigation and control schemes with simulation verification. The company says: \"The mission remains active and we continue to believe that with these changes, LINK has a viable path to rendezvous with Swift.\""}, "editionDate": "2026-07-30"}, {"featured": true, "topic": "science", "tag": "biology", "src": "University of Helsinki", "url": "https://www.helsinki.fi/en/news/culture/ancient-civilization-millions-once-flourished-amazon", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Amazon'da 4.500 kilometrekarelik lidar taraması 400'den fazla anıtsal yapıyı haritaladı", "en": "A lidar survey of 4,500 square kilometres in Amazonia mapped more than 400 monumental sites"}, "summary": {"tr": "Havadan lazer taramasıyla yürütülen araştırma, yaklaşık 450 kilometre uzunluğunda düz hatlar boyunca her 10 kilometrede 1 kilometre genişliğinde şeritler tarayarak toplam 4.500 kilometrekare kadar alanı ölçtü ve iyi korunmuş 400'den fazla anıtsal tören alanı belgeledi. Nature'da yayımlanan çalışma, bu sayıdan yola çıkarak bütün bölgede 20 binden fazla tören merkezi bulunduğunu öngörüyor.", "en": "An airborne laser scanning survey flew straight transects roughly 450 kilometres long, mapping one-kilometre-wide strips every 10 kilometres for a total of about 4,500 square kilometres, and documented more than 400 well-preserved monumental ceremonial sites. From that count, the study in Nature projects more than 20,000 ceremonial centres across the wider territory."}, "detail": {"tr": "Araştırmacılara göre bu yapıları kuran topluluk MÖ 600 ile MS 850 arasında, yaklaşık 183 bin kilometrekarelik bir alanda yaşadı; bu alan Büyük Amazonya'nın yüzde üçünden azına denk geliyor. Bilinen en büyük yerleşim 50 hektar. Nüfus için verilen 1,25–3 milyon aralığını yazarlar ihtiyatlı sayıyor ve bunu Amazon'un tümü için daha önce önerilen 1–10 milyon aralığıyla karşılaştırıyor. Taranan alanın yarısından fazlası dizgesel olarak değerlendirildi. Çalışmaya Helsinki Üniversitesi'nin yanı sıra Finlandiya Ulusal Kadastro Kurumu, Turku Üniversitesi ve Aarhus Üniversitesi ile yerel ortaklar katıldı.", "en": "The researchers date the society that built these structures to between 600 BCE and 850 CE across roughly 183,000 square kilometres, an area amounting to less than three percent of Greater Amazonia. The largest known site covers 50 hectares. The authors call their population range of 1.25 to 3 million cautious, and set it against earlier proposals of 1 to 10 million for the whole Amazon. More than half of the scanned area was systematically assessed. Alongside the University of Helsinki, the work involved the National Land Survey of Finland, the University of Turku, Aarhus University and local partners."}, "editionDate": "2026-07-30"}, {"featured": true, "topic": "science", "tag": "physics", "src": "Quanta Magazine", "url": "https://www.quantamagazine.org/physicists-solve-a-muon-mystery-now-old-results-dont-add-up-20260729", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Müondaki 25 yıllık açığı kapatan hesap, kırk yıllık pion ölçümlerini birbiriyle çelişkide bıraktı", "en": "The calculation that closed a 25-year muon gap has left four decades of pion measurements in conflict"}, "summary": {"tr": "Müonun manyetik salınımı yaklaşık çeyrek yüzyıl boyunca kuramsal öngörüden milyonda bir düzeyinde saptı. Budapeşte-Marsilya-Wuppertal işbirliğinin örgü QCD hesabı 2021'de müonun bilinen fizikle tam uyumlu salındığını gösterdi ve sonuç Fermilab'ın güncellenmiş ölçümüyle aynı gün açıklandı. Elektron-pozitron çarpışmalarından çıkarım yapan veri temelli yöntem ise aynı sayıyı tutmuyor.", "en": "For roughly a quarter of a century the muon's magnetic wobble sat about one part in a million away from theoretical prediction. In 2021 a lattice QCD calculation by the Budapest-Marseille-Wuppertal collaboration showed the muon wobbling exactly as known physics requires, and the result was released the same day as Fermilab's updated measurement. The data-driven method, which infers the same quantity from electron-positron collisions, does not agree."}, "detail": {"tr": "Veri temelli yol, elektron-pozitron çarpışmalarında pion üretim oranlarının ölçümüne dayanıyor. Novosibirsk'teki VEPP-2000 çarpıştırıcısında 2023'te yeni bir algılayıcı kurulduktan sonra bu oranlar belirgin biçimde değişti. Fedor Ignatov (Liverpool Üniversitesi) durumu \"It was a surprise. No one expected it to be like that\" sözleriyle anlatıyor. BABAR çarpıştırıcısının 2023 çözümlemesi ise eski değerlerle çarpıcı bir uyum içinde. Alex Keshavarzi, VEPP-2000 sonucundan daha çok incelenmiş bir ölçüm bulunmadığını ve şimdiye dek bir sorun saptanmadığını söylüyor: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Farkın bilinmeyen bir parçacıktan mı, yoksa onlarca yıla yayılmış ölçümler arasındaki yöntem ayrımlarından mı geldiği belirsiz.", "en": "The data-driven route depends on measurements of pion production rates in electron-positron collisions. After a new detector was installed at the VEPP-2000 collider in Novosibirsk in 2023, those rates changed significantly. Fedor Ignatov of the University of Liverpool put it this way: \"It was a surprise. No one expected it to be like that.\" The BABAR collider's 2023 analysis, by contrast, sits in striking agreement with the older rate. Alex Keshavarzi says no measurement has been scrutinised more than VEPP-2000's, and that so far no problems have been found: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Whether the discrepancy points to an unknown particle or to procedural differences across decades of measurement is unresolved."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-unique-fossil-reveals-internal-million.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Çin'de bulunan 60 santimetrelik Triyas sürüngeninde mide, karaciğer ve bağırsak korunmuş", "en": "A 60-centimetre Triassic reptile from China preserves its stomach, liver and intestine"}, "summary": {"tr": "Yaklaşık 245 milyon yıl önce yaşayan Austronaga minuta'nın uzun boyunlu, 60 santimetrelik iskeletinde sindirim organları birlikte korundu. Ekip organları morötesi ışık fotoğrafçılığı ve kütle spektrometrisiyle tanımladı; kırmızı görünen karaciğerde hemoglobin izleri saptandı. Çalışma hakemli Science Advances dergisinde yayımlandı.", "en": "The long-necked, 60-centimetre skeleton of Austronaga minuta, which lived about 245 million years ago, preserves its digestive organs together. The team identified them using UV-light photography and mass spectrometry, detecting traces of haemoglobin in the strikingly red liver. The work appeared in the peer-reviewed journal Science Advances."}, "detail": {"tr": "Ön tarafta torba biçiminde büyük bir mide, arkasında karaciğer ve ardından ince ile kalın bağırsağı oluşturan uzun ve yalın bir boru yer alıyor. Institute of Vertebrate Palaeontology and Palaeoanthropology'den Wei Wang, \"This fossil is the oldest known example of a largely complete digestive system in a reptile\" diyor. National Museums Scotland'dan Nick Fraser midenin tek gözlü olmasına dikkat çekiyor: \"Austronaga had only a single stomach chamber. This shows that the stomachs of archosaurs were initially quite simple.\" Sindirim yolu, hayvanın suya özelleşmiş gövdesine karşın günümüzün balıkla beslenen sürüngenlerine benziyor.", "en": "A large, sac-like stomach sits at the front, followed by the liver and then a long, simple tube forming the small and large intestines. Wei Wang of the Institute of Vertebrate Palaeontology and Palaeoanthropology says: \"This fossil is the oldest known example of a largely complete digestive system in a reptile.\" Nick Fraser of National Museums Scotland notes the single chamber: \"Austronaga had only a single stomach chamber. This shows that the stomachs of archosaurs were initially quite simple.\" Despite the animal's water-adapted body, the digestive tract resembles that of modern fish-eating reptiles."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "space", "src": "NASA Science", "url": "https://science.nasa.gov/missions/webb/nasa-webb-explores-family-tree-of-newly-discovered-distant-objects", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Webb çalışması, küçük kırmızı noktaları çok etkin karadeliklerin geçici bir evresi sayıyor", "en": "A Webb study treats little red dots as a passing phase of highly active black holes"}, "summary": {"tr": "Ekip, kırmızıya kayması 2 olan ve Büyük Patlama'dan yaklaşık 3,3 milyar yıl sonrasına karşılık gelen WISEA J123635.56+621424.2 sarmal gökadasını inceledi; kolları nedeniyle \"Saguaro\" takma adını taşıyor. Gökada yapay olarak daha yüksek kırmızıya kaymaya taşındığında çevresindeki yapı görünmez oldu ve geriye yalnızca parlak çekirdek kaldı.", "en": "The team studied the spiral galaxy WISEA J123635.56+621424.2, nicknamed the \"Saguaro\" for its arms, at a redshift of 2, corresponding to roughly 3.3 billion years after the Big Bang. When the galaxy was synthetically shifted to higher redshift, its surrounding structure became invisible and only the bright nucleus remained."}, "detail": {"tr": "Webb'in 2022'de bulduğu küçük kırmızı noktalar, uzak ve sıkışık kırmızı kaynaklar olarak tanımlanıyordu. Binlerce kaynak arasında taranan Saguaro, daha büyük bir gökadanın içine oturmuş bu tür bir çekirdeğin örneği oldu. Steward Observatory'de çalışırken araştırmayı yürüten ve şimdi Space Telescope Science Institute'ta bulunan Pierluigi Rinaldi ile ekibi, bunların ayrı bir gökada topluluğu değil, çok etkin süperkütleli karadeliklerin geçici bir evresi olabileceği sonucuna varıyor. Bu bir yorum; hakemli sonuç The Astrophysical Journal'da yayımlandı ve yüksek kırmızıya kaymada gözlem yanlılığının çevre yapıyı gizleyebileceğini savunuyor.", "en": "The little red dots Webb found in 2022 were described as distant, compact red sources. Among thousands of surveyed sources, the Saguaro turned out to be an example of such a nucleus sitting inside a larger galaxy. Pierluigi Rinaldi, who led the work at Steward Observatory and is now at the Space Telescope Science Institute, and his colleagues conclude these may be a temporary phase of highly active supermassive black holes rather than a distinct galaxy population. That is an interpretation; the peer-reviewed result appeared in The Astrophysical Journal and argues that observational bias at high redshift can hide the surrounding structure."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Phys.org", "url": "https://phys.org/news/2026-07-electrically-perovskite-polariton-laser-diode.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Perovskit polariton lazer diyot ilk kez doğru akımla çalıştı", "en": "A perovskite polariton laser diode has run on direct current for the first time"}, "summary": {"tr": "Skoltech öncülüğünde ITMO ve HSE üniversitelerinden araştırmacılarla yürütülen çalışmada, çözeltiden üretilen perovskit bir aygıt sürekli doğru akım altında lazer ışığı verdi. Eşik akımı 60 mikroamper; aygıt iki aşamalı bir kriyosoğutma yöntemi gerektiriyor. Sonuç hakemli Nature dergisinde yayımlandı.", "en": "In work led by Skoltech with researchers from ITMO and HSE universities, a solution-processed perovskite device produced laser light under continuous direct current. The threshold current is 60 microamperes and the device requires a two-stage cryocooling protocol. The result appeared in the peer-reviewed journal Nature."}, "detail": {"tr": "Ekip, bir optik boşluk içinde fotonlarla bağlı elektron-deşik çiftleri arasındaki güçlü eşleşmeden yararlanıyor; böylece oluşan polaritonlar, alışılmış yarıiletken lazerlere göre belirgin biçimde daha düşük enerji ve yük yoğunluklarında bir Bose-Einstein yoğuşması kuruyor. Makaleye göre \"Achieving lasing under direct electrical pumping in solution-processed materials has been one of the key goals in semiconductor optoelectronics for 60 years\" ve önündeki asıl engel, yüksek akım yoğunluklarında biriken ısının malzemeyi bozması olmuştu. Baş yazar Anatoly P. Pushkarev. Kriyojenik sıcaklık gereksinimi, aygıtın şimdilik oda koşullarında kullanılamayacağı anlamına geliyor.", "en": "The team exploits strong coupling between photons and bound electron-hole pairs inside an optical microcavity, so the resulting polaritons form a Bose-Einstein condensate at significantly lower energy and charge densities than conventional semiconductor lasers require. As the paper puts it, \"Achieving lasing under direct electrical pumping in solution-processed materials has been one of the key goals in semiconductor optoelectronics for 60 years,\" and the main obstacle had been heat accumulation at high current densities degrading the material. The lead author is Anatoly P. Pushkarev. The cryogenic requirement means the device cannot yet be used at room conditions."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-gobi-fossil-reveals-inch-cretaceous.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Gobi'de bulunan neredeyse tam bir iskelet, zhelestidleri plasentalı soyundan çıkarıyor", "en": "A near-complete Gobi skeleton moves zhelestids out of the placental lineage"}, "summary": {"tr": "Moğolistan'ın doğu Gobi Çölü'ndeki Khugenetsavkhlant kırgıbayırlarında bulunan Tamirkhan balcarceli, baştan kuyruğa 15–18 santimetre uzunluğunda. Neredeyse tam iskelet, sürekli büyüyen uzun kesici dişler ve zalambdalestoidlere özgü bir dizi kafatası özelliği taşıyor; bu da onlarca yıldır dişlere dayanan sınıflandırmayla çelişiyor. Çalışma hakemli Nature dergisinde yayımlandı.", "en": "Tamirkhan balcarceli, found in the Khugenetsavkhlant badlands of Mongolia's eastern Gobi Desert, measures 15 to 18 centimetres from head to tail. The near-complete skeleton carries long, ever-growing incisors and a suite of skull features specific to zalambdalestoids, contradicting a classification that rested on teeth for decades. The work appeared in the peer-reviewed journal Nature."}, "detail": {"tr": "Daha önceki araştırmacılar, zhelestidlerin belirgin yuvarlak dişlerine dayanarak bu hayvanları plasentalıların olası akrabaları saymıştı. Yeni iskelet onları bambaşka bir memeli soyuna, zalambdalestoid grubuna yerleştiriyor. Uzamış arka bacaklar hayvana neredeyse tavşana benzer bir görünüm veriyor. Paleontolog Maureen O'Leary'nin özeti şöyle: \"teeth cannot always tell us how the whole animal looked.\" Baş yazar American Museum of Natural History'den Andres Giallombardo; ekipte Stony Brook Üniversitesi, Arizona Üniversitesi ve Arcadia Üniversitesi'nden araştırmacılar da var. Bulgu, plasentalıların Kretase'de var olduğunu öngören moleküler saat modelleriyle çelişiyor.", "en": "Earlier researchers had counted zhelestids as possible placental relatives on the strength of their distinctive rounded teeth. The new skeleton places them in an entirely different mammalian lineage, the zalambdalestoid group. Elongated hind limbs gave the animal an almost rabbit-like appearance. The palaeontologist Maureen O'Leary sums it up: \"teeth cannot always tell us how the whole animal looked.\" The lead author is Andres Giallombardo of the American Museum of Natural History, with colleagues from Stony Brook University, the University of Arizona and Arcadia University. The finding runs against molecular-clock models that place placental mammals in the Cretaceous."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Scientific American", "url": "https://www.scientificamerican.com/article/a-unique-cellular-trick-may-explain-octopus-intelligence", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Ahtapot ribozomal RNA'sındaki bir kopma, protein üretimindeki hataları azaltıyor", "en": "A break in octopus ribosomal RNA lowers errors in protein building"}, "summary": {"tr": "Harvard'daki ekip, yalnızca ahtapotlarda görülen bir ribozomal RNA kopması buldu. Bu değişiklik bakteriye aktarıldığında, hücreler protein üretirken daha az hata yaptı ve yanlış katlanmış moleküllerin zehirli yığınlar oluşturma riski düştü. Ahtapot dokusunda protein yığınları, kalamardakine göre hem daha az hem daha küçüktü. Çalışma hakemli Current Biology dergisinde yayımlandı.", "en": "A team at Harvard found a break in ribosomal RNA that occurs only in octopuses. When the change was engineered into bacteria, the cells made fewer mistakes while building proteins and the risk of misfolded molecules forming toxic aggregates fell. Protein clumps in octopus tissue were both fewer and smaller than in squid. The work appeared in the peer-reviewed journal Current Biology."}, "detail": {"tr": "Yazarlar bu değişikliğin zamanlamasının, sığ su ahtapotlarının yaklaşık 100 milyon yıl önce karmaşık ortamlara yerleşmesi ve sinir sistemlerinin hızla genişlemesiyle örtüştüğünü belirtiyor. Ortak baş yazar Rishav Mitra, değişikliğin \"might help these neurons to work well\" diyerek temkinli bir dille bağ kuruyor. Genetikçi Eli Eisenberg ise sınırı işaret ediyor: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" İnsanda sınama, ribozomal RNA'yı değiştirip öğrenme ile sorun çözmeyi ölçmeyi gerektiriyor ve çok zor sayılıyor.", "en": "The authors note that the timing of this change lines up with shallow-water octopuses colonising complex environments roughly 100 million years ago as their nervous systems expanded rapidly. Co-lead author Rishav Mitra draws the link in guarded terms, saying the change \"might help these neurons to work well.\" The geneticist Eli Eisenberg marks the limit: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" Testing this in humans would mean altering ribosomal RNA and measuring learning and problem-solving, which is described as highly challenging."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "climate", "src": "Phys.org", "url": "https://phys.org/news/2026-07-lake-ice-loss-winter-temperatures.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Göl buzu kaybı, kış hava sıcaklığı −13,7 ile −6,8 °C aralığını aşınca belirgin biçimde hızlanıyor", "en": "Lake ice loss speeds up sharply once winter air temperature passes −13.7 °C to −6.8 °C"}, "summary": {"tr": "Kuzey Yarımküre'de 724 gölün buz oluşum ve çözülme tarihleri ile hava sıcaklığı verileri 2000–2022 arasında incelendi. Ortalama kış hava sıcaklığı göle göre −13,7 ile −6,8 °C arasında değişen eşiği aştığında, buz kaybının sıcaklığa duyarlılığı 22 kata varan bir artış gösteriyor. Gözleme dayalı çalışma hakemli Proceedings of the National Academy of Sciences dergisinde yayımlandı.", "en": "Ice phenology and air temperature data for 724 Northern Hemisphere lakes were analysed for 2000 to 2022. Once average winter air temperature passes a threshold that varies between −13.7 °C and −6.8 °C by lake, the temperature sensitivity of ice loss rises by up to a factor of 22. The observational study appeared in the peer-reviewed Proceedings of the National Academy of Sciences."}, "detail": {"tr": "Yazarlar ısınmaya verilen yanıtta belirgin bir bakışımsızlık buluyor: ilkbaharda buzun çözülme tarihi, sonbaharda donma tarihinden sıcaklığa daha duyarlı. Yüksek salınım senaryosu altında Kuzey Yarımküre göllerinin yüzyıl sonuna kadar 40 güne varan buzlu gün kaybetmesi öngörülüyor. Çalışmayı Çin Bilimler Akademisi'ne bağlı Nanjing Coğrafya ve Limnoloji Enstitüsü yürüttü; Nanjing Normal Üniversitesi, Bangor Üniversitesi ve Regina Üniversitesi'nden araştırmacılar katıldı.", "en": "The authors find a pronounced asymmetry in the response to warming: spring ice-off dates are more temperature-sensitive than autumn freeze-up dates. Under a high-emissions scenario, Northern Hemisphere lakes are projected to lose up to 40 ice-covered days by the end of the century. The work was led by the Nanjing Institute of Geography and Limnology of the Chinese Academy of Sciences, with researchers from Nanjing Normal University, Bangor University and the University of Regina."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "climate", "src": "Phys.org", "url": "https://phys.org/news/2026-07-oceans-australia-fertilize-carbon-dioxide.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Model çalışması, demirle gübreleme için Güney Okyanusu'nu Ekvator Pasifiği'nin önüne koyuyor", "en": "A modelling study puts the Southern Ocean ahead of the equatorial Pacific for iron fertilisation"}, "summary": {"tr": "California Üniversitesi'nden Jun Yu, Adam Martiny ve arkadaşlarının bilgisayar modellemesi, altmış yılı aşkın gübreleme verisini kullanarak Güney Okyanusu'nun ekolojik bozulma ile karbondioksit uzaklaştırması arasında en iyi dengeyi sunduğu sonucuna varıyor. Net uzaklaştırma 5,3 ppm'e, yani yılda 0,70 gigaton karbondioksite kadar çıkıyor. Çalışma hakemli Nature dergisinde yayımlandı.", "en": "A computer modelling study by Jun Yu, Adam Martiny and colleagues at the University of California draws on more than six decades of fertilisation data and concludes that the Southern Ocean offers the best balance between ecological disturbance and carbon dioxide removal. Net removal reaches up to 5.3 parts per million, corresponding to 0.70 gigatonnes of carbon dioxide a year. The work appeared in the peer-reviewed journal Nature."}, "detail": {"tr": "Bölgesel etkiler birbirinden belirgin biçimde ayrılıyor. Ekvator Pasifiği'nde okyanus alanının yüzde 0,35'inin gübrelenmesi büyük zooplankton kütlesinde en az yüzde 10 düşüşe yol açıyor; Güney Okyanusu'nda yüzde 0,2'lik bir alanın gübrelenmesi ise aynı kütlede yüzde 10 artış getiriyor. Yazarlar demirle gübrelemenin uzak etkileri olduğunu ve yerel her girişimin doğası gereği yerel olmayan sonuçlar doğuracağını belirtiyor. Bu bir modelleme çözümlemesi; saha denemesi değil.", "en": "Regional effects diverge sharply. In the equatorial Pacific, fertilising 0.35 percent of the ocean area drives a decline of at least 10 percent in macrozooplankton biomass, while in the Southern Ocean fertilising 0.2 percent brings a 10 percent increase in the same biomass. The authors state that ocean iron fertilisation has downstream effects and that any localised intervention will inherently have nonlocal consequences. This is a modelling analysis, not a field trial."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Phys.org", "url": "https://phys.org/news/2026-07-strain-chiral-crystals-left-demand.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Mekanik zorlanma, kiral olmayan bir kristali istendiğinde sol ya da sağ elli hale getiriyor", "en": "Mechanical strain makes a non-chiral crystal left- or right-handed on demand"}, "summary": {"tr": "Max Planck Yapı ve Madde Dinamiği Enstitüsü ile Oxford Üniversitesi'nden araştırmacılar, kiral olmayan kristallere mekanik zorlanma uygulayarak atom konumlarını sol ya da sağ elli bir yapı oluşturacak kadar yeniden düzenlediklerini gösterdi. Çekme ve basma zorlanmaları birbirinin tersi ellilik üretiyor; zorlanmanın hangi kristal yönünde uygulandığı da hangi kiral durumun seçileceğini belirliyor. Sonuç hakemli Nature dergisinde yayımlandı.", "en": "Researchers at the Max Planck Institute for the Structure and Dynamics of Matter and the University of Oxford showed that mechanical strain rearranges atomic positions in non-chiral crystals just enough to create a left- or right-handed structure. Tensile and compressive strain generate opposite handedness, and the crystal direction along which strain is applied also selects which chiral state results. The result appeared in the peer-reviewed journal Nature."}, "detail": {"tr": "Ekip, kiralliğin belirgin imzası olan optik etkinliği izleyerek ölçüm yaptı ve etkiyi tersine çevrilebilir buldu: kirallik yeniden yeniden üretilebiliyor, kaldırılabiliyor ve seçilebiliyor. Araştırmayı Andrea Cavalleri yürüttü; ilk yazar Zhiyang Zeng, Oxford'dan Paolo Radaelli çalışmaya katıldı. Yazarlar olguya \"piyezokiral etki\" adını veriyor ve simetriye dayanan kuramsal bir çerçeveyle aday malzemeleri listeleyen açık erişimli bir veri tabanını piezochiral.org adresinde yayımlıyor. Kirala özgü süperiletkenlik gibi yeni özelliklerin önünü açabileceği öne sürülüyor; bu henüz gösterilmiş değil.", "en": "The team measured optical activity, the characteristic signature of chirality, and found the effect reversible: the induced chirality can be generated, removed and selected repeatedly. Andrea Cavalleri led the research, with Zhiyang Zeng as first author and Paolo Radaelli of Oxford contributing. The authors name the phenomenon the \"piezochiral effect\" and publish an open-access database of candidate materials, identified through a symmetry-based theoretical framework, at piezochiral.org. They suggest it could open the way to new chiral properties such as superconductivity; that has not been demonstrated."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Scientific American", "url": "https://www.scientificamerican.com/article/maths-acclaimed-einstein-tile-finds-a-new-home-among-physicists", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Lazer ışığı, tekrarsız \"şapka\" döşemesinden bir ellilik kazandı", "en": "Laser light picked up a handedness from the aperiodic hat tile"}, "summary": {"tr": "Tokyo Üniversitesi Endüstriyel Bilim Enstitüsü'ndeki ekip, \"şapka\" döşemesinin biçimine dayanan bir örüntüyü silisyum nitrür ince filme oydu ve üzerine lazer düşürdü. Bragg kırınımıyla elde edilen ışık, aynada bakışımsızlık anlamına gelen alışılmadık bir ellilik gösterdi. Çalışma hakemli Nature Communications dergisinde yayımlandı.", "en": "A team at the University of Tokyo's Institute of Industrial Science etched a pattern based on the shape of the hat tile into a silicon nitride thin film and shone a laser onto it. The light produced by Bragg diffraction showed an unusual handedness, meaning mirror asymmetry. The work appeared in the peer-reviewed journal Nature Communications."}, "detail": {"tr": "\"Şapka\" döşemesini 2022'de amatör matematikçi David Smith buldu; sonsuz bir yüzeyi hiçbir örüntüyü tekrarlamadan kaplıyor ve 1960'lara uzanan bir soruyu çözüyor. Adı Albert Einstein'dan değil, Almanca \"ein Stein\" yani \"tek taş\" ifadesinden geliyor. Baş yazar Yuto Moritake çıkış noktasını şöyle anlatıyor: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\" Kırınım örüntüsündeki ellilik döşemenin bakışımsızlığından kaynaklanıyor ve tekrarsız yapılarda beklenmiyordu. Araştırmacılar lazer ışığının kutuplanmasını denetlemede, haberleşme ve kuantum şifrelemede kullanım öneriyor.", "en": "The hat tile was found in 2022 by the amateur mathematician David Smith; it covers an infinite surface without repeating any pattern, settling a question that dates to the 1960s. Its name comes not from Albert Einstein but from the German \"ein Stein,\" meaning one stone. Lead author Yuto Moritake describes the starting point: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\" The handedness in the diffraction pattern stems from the tile's asymmetry and was not expected in aperiodic structures. The researchers propose uses in controlling laser light polarisation, in telecommunications and in quantum cryptography."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Scientific American", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Farelerde koku soğanı granül hücrelerinin susturulması, çocukluk koku tercihini değiştirdi", "en": "Silencing olfactory-bulb granule cells in mice changed a childhood scent preference"}, "summary": {"tr": "Araştırma iki koldan yürüdü: 600'den fazla gönüllü hoş çocukluk yaşantılarını bildirdi; fareler ise insanda erken çocukluğa karşılık gelen 3–4 haftalıkken hoş doğal kokularla tanıştırıldı. Ekip yerleştirilmiş optik liflerle koku soğanındaki granül hücrelerini susturunca hayvanların davranış yanıtı değişti. Çalışma hakemli PLOS Biology dergisinde yayımlandı.", "en": "The research ran along two tracks: more than 600 volunteers reported pleasant childhood experiences, while mice were introduced to pleasing natural scents at three to four weeks old, the rough equivalent of early childhood in humans. When the team silenced granule cells in the olfactory bulb using implanted optical fibres, the animals' behavioural response changed. The work appeared in the peer-reviewed journal PLOS Biology."}, "detail": {"tr": "Yazarlara göre granül hücreleri, haz ve ödül bölgeleriyle \"privileged connections\" kurduğu için erken kokular çocuklukta damgalanabiliyor. Çalışmanın ortak son yazarı, Lyon Sinirbilim Araştırma Merkezi'nden Nathalie Mandairon. İki uzman sınırlara dikkat çekiyor: AgroParisTech-INRAE'den Hervé This çalışmanın ağırlıkla olumlu anılara odaklandığını, olumsuz çocukluk çağrışımlarının yeterince ele alınıp alınmadığının belirsiz kaldığını söylüyor. Buckingham Üniversitesi'nden Luca Turin ise kokunun ayrıksılığının görünürde kalabileceğini savunuyor: \"The only peculiarity of smell [is] that it is like a password and needs to be exact.\" Nedensel sınama farede yapıldı; insan tarafı ankete dayanıyor.", "en": "The authors hold that granule cells make \"privileged connections\" with pleasure and reward areas, which is how early scents can be imprinted in childhood. The study's co-senior author is Nathalie Mandairon of the Lyon Neuroscience Research Center. Two specialists flag limits: Hervé This of AgroParisTech-INRAE says the work focused largely on positive memories and questions whether negative childhood associations were adequately addressed. Luca Turin of the University of Buckingham argues smell's distinctiveness may be only apparent: \"The only peculiarity of smell [is] that it is like a password and needs to be exact.\" The causal test was done in mice; the human side rests on a survey."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "climate", "src": "Phys.org", "url": "https://phys.org/news/2026-07-icelandic-fish-hot-tubs-reveal.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "İzlanda'nın jeotermal dikence balıkları sıcak suya aynı stres sinyali yolundan uyum sağlıyor", "en": "Iceland's geothermal sticklebacks adapt to warm water through the same stress-signalling route"}, "summary": {"tr": "Çalışma, İzlanda'da jeotermal olarak ısınmış ve 27,8 °C'ye kadar çıkan sularda yaşayan üç dikenli dikence (Gasterosteus aculeatus) topluluklarını, ortalama sıcaklıktaki serin sulardaki topluluklarla karşılaştırdı. Sıcak sudaki gruplarda DNA değişiklikleri birbirinden farklı olsa da hücresel düzeyde aynı mekanizmada, MAPK sinyal yolunda buluşuyor. Soğuğa uyum sağlamış balıklarda bulunmayan bir genom ters çevrimi, sıcağa uyum sağlamış olanlarda var. Çalışma hakemli Nature Communications dergisinde yayımlandı.", "en": "The study compared threespine stickleback (Gasterosteus aculeatus) populations living in Iceland's geothermally warmed waters, reaching up to 27.8 °C, with populations in cooler waters at average temperature. Although the DNA changes differ between the warm-water groups, they converge at the cellular level on the same mechanism, the MAPK signalling pathway. A genomic inversion absent in cold-adapted fish is present in the warm-adapted ones."}, "detail": {"tr": "Sıcak sudaki balıklar yazın aşırı iştah ve artmış yağ depolaması gösterdi; besinin azaldığı dönemlerde yağı daha verimli tutuyorlar. Bu, kışa hazırlanma davranışı olarak yorumlanıyor. Çalışmayı Glasgow Üniversitesi'nden Kevin Parsons ile Matthew Brachmann yürüttü ve davranış, biçim ile genetik çözümlemesini doğal sıcaklık geçişleri boyunca yerli topluluklar üzerinde birleştirdi. Habere göre örneklem büyüklükleri belirtilmiyor.", "en": "Fish in warm water showed excessive appetite and increased fat storage in summer, and retain fat more efficiently when food is scarce. This is interpreted as preparation for winter. The work was led by Kevin Parsons and Matthew Brachmann of the University of Glasgow, combining behavioural, morphological and genetic analysis of indigenous populations across natural temperature gradients. The report does not state sample sizes."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-dimensional-visualization-nanoplastic-neonatal-mouse.html", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Bütün beyin görüntülemesi, 50 nanometrelik plastik tanecikleri yeni doğmuş farelerde talamusa dek izledi", "en": "Whole-brain imaging traced 50-nanometre plastic particles to the thalamus in newborn mice"}, "summary": {"tr": "Ekip, SeeDB2G doku saydamlaştırma yöntemiyle birleştirdiği ışık tabakası floresan mikroskopisini kullanarak beyni dilimlemeden üç boyutlu görüntüledi. Yeni doğmuş farelere ağız yoluyla verilen floresan işaretli polistiren taneciklerden 50 nanometrelik olanlar, beyin kabuğu ve beyincikten çok talamus ile beyin sapında daha yüksek sinyal verdi. 500 nanometrelik daha büyük tanecikler incelenen bütün organlarda zayıf sinyal bıraktı.", "en": "The team used light-sheet fluorescence microscopy combined with the SeeDB2G tissue-clearing method to image the brain in three dimensions without sectioning. Of the fluorescently labelled polystyrene particles given orally to neonatal mice, the 50-nanometre ones produced higher signal in the thalamus and brainstem than in the cerebral cortex or cerebellum. The larger 500-nanometre particles left weak signals across all organs examined."}, "detail": {"tr": "Çalışma Journal of Hazardous Materials Advances dergisinde yayımlandı; yazarlar arasında Yang Mi ile Ulusal Çevre Araştırmaları Enstitüsü, Osaka Üniversitesi ve Waseda Üniversitesi'nden araştırmacılar var. Yazarlar sınırları kendileri yazıyor: çalışma çevrede karşılaşılan gerçek maruz kalma düzeylerini ya da olası sağlık risklerini doğrudan değerlendirmiyor, taneciklerin mutlak miktarını ölçmüyor ve beyne giriş yollarını tanımlamıyor. Habere göre örneklem büyüklüğü belirtilmiyor ve insana aktarım ele alınmıyor.", "en": "The study appeared in the Journal of Hazardous Materials Advances, with authors including Yang Mi and researchers from the National Institute for Environmental Studies, the University of Osaka and Waseda University. The authors state the limits themselves: the work does not directly assess environmentally relevant exposure levels or potential health risks, does not quantify the absolute amount of particles, and does not identify their routes into the brain. The report does not state a sample size, and extrapolation to humans is not addressed."}, "editionDate": "2026-07-30"}], "visualBriefs": [{"id": "science-observation-under-constraint", "topic": "science", "title": {"tr": "Uzay gözlemi, aracı kurtarmakla adayı doğrulamak arasında", "en": "Space observation spans saving an instrument and confirming a candidate"}, "summary": {"tr": "Swift'i yükseltecek Link aracı denetim kaybıyla uğraşırken Betelgeuse'ün aday yoldaşı tek gecelik görüntüde belirdi. İki gelişmenin ortak kısıtı, doğru gözlem penceresini kaçırmamak.", "en": "As the Link spacecraft struggles with control on its way to reboost Swift, Betelgeuse's candidate companion appears in one night's image. Both developments depend on preserving a narrow observing window."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/science-observation-under-constraint-1280.7e854b11fd5e.webp", "variants": [{"src": "/assets/briefs/2026-07-29/science-observation-under-constraint-640.4e3841c53f7a.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/science-observation-under-constraint-1280.7e854b11fd5e.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Sergi standlarında ayrı duran yörünge gözlemevi ve servis aracı modelleriyle çerçeveli yıldız gözlem penceresi", "en": "Exhibit models of an orbital observatory and separate service craft beside a framed view of two distant star points"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "hasAnalysis": true}, {"id": "science-earthquake-measurement-scales", "topic": "science", "title": {"tr": "Depremi büyüklük, şiddet ve yer değiştirme ayrı ayrı anlatıyor", "en": "Magnitude, intensity and displacement tell different parts of an earthquake"}, "summary": {"tr": "Kyushu'daki sığ 6,8 deprem Shindo 7 şiddetine ulaştı; Sentinel-1 ise Venezuela kırılmasının ardından 65 cm yükselme ölçtü. Farklı ölçekler, tehlike ile yüzey hareketini ayırıyor.", "en": "A shallow magnitude 6.8 earthquake in Kyushu reached Shindo 7 intensity, while Sentinel-1 measured 65 cm of uplift after Venezuela's rupture. Different scales separate hazard from ground motion."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/science-earthquake-measurement-scales-1280.0743935d1c1b.webp", "variants": [{"src": "/assets/briefs/2026-07-29/science-earthquake-measurement-scales-640.a3bc6858ba97.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/science-earthquake-measurement-scales-1280.0743935d1c1b.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Tek bir raylı ölçüm düzeneğinde sığ fay kırığını, yüzey oturmasını ve üstten tarama kızağını birleştiren katmanlı arazi bloğu", "en": "One rail-mounted measurement apparatus linking a shallow fault rupture, surface settlement and an overhead scanning carriage"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "hasAnalysis": true}, {"id": "science-climate-risk-proxies", "topic": "science", "title": {"tr": "İklim riski, yağışın ve sıcaklığın ötesinde iki yeni sayaç kazanıyor", "en": "Climate risk gains two counters beyond rainfall and temperature"}, "summary": {"tr": "Amazon kuraklıkları için atmosferik su talebi, kentler içinse yapı yaşı ve kompaktlık risk hesabını değiştiriyor. İki çalışma, iklim göstergesinin seçiminin kırılganlığı nasıl yeniden dağıttığını gösteriyor.", "en": "Atmospheric water demand changes the Amazon drought account, while building age and compactness reshape urban exposure. The studies show how indicator choice redistributes measured climate vulnerability."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-1280.d6be65706837.webp", "variants": [{"src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-640.9d0c2244992b.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/science-climate-risk-proxies-1280.d6be65706837.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Nem kaybeden yaprak ve kök dokusunun gözenekli bir geçişle çeşitli bina maketlerine dönüştüğü parlak kavramsal sahne", "en": "Bright conceptual scene in which moisture-stressed leaves and root texture transform through a porous transition into varied building models"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "hasAnalysis": true}, {"id": "science-observatory-lifecycles", "topic": "science", "title": {"tr": "Astronominin gözlem hattında veri, yeni görev ve fon kararı", "en": "Astronomy's observation line spans data, a new mission and a funding decision"}, "summary": {"tr": "Hubble, Andromeda'nın yavaşlayan yıldız oluşumunu ölçerken Roman fırlatma yakıtını aldı; Birleşik Krallık ise e-MERLIN desteğini 2028'de bitirecek. Üç gelişme, gözlemevlerinin farklı yaşam evrelerini gösteriyor.", "en": "Hubble measures slowing star formation in Andromeda as Roman takes on launch fuel and the UK sets a 2028 end to e-MERLIN support. The developments span three observatory life stages."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-28/science-observatory-lifecycles-1280.5e9f47ddfacf.webp", "variants": [{"src": "/assets/briefs/2026-07-28/science-observatory-lifecycles-640.5b61a40cbfad.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/science-observatory-lifecycles-1280.5e9f47ddfacf.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Yıldız mozaiğini hazırlanan uzay gözlemevine ve uzak radyo dizisine bağlayan şafak manzarası", "en": "Dawn landscape linking a stellar mosaic, a space observatory in preparation and a distant radio array"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "hasAnalysis": true}, {"id": "science-fossil-traces-body-health", "topic": "science", "title": {"tr": "Fosil izleri eski canlıların bedenini ve sağlığını yeniden çiziyor", "en": "Fossil traces redraw ancient bodies and health"}, "summary": {"tr": "Kenya'daki ayak izleri Paranthropus'un beklenenden iri olduğunu gösterirken La Brea omurları kılıç dişli kedilerde olası sinir tümörü izleri taşıyor. Ölçümler, iki eski canlıya ilişkin fiziksel tabloyu genişletiyor.", "en": "Kenyan footprints show Paranthropus was larger than expected, while La Brea vertebrae carry possible signs of nerve tumours in saber-toothed cats. The measurements broaden the physical picture of both animals."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-28/science-fossil-traces-body-health-1280.8d16a51ab0aa.webp", "variants": [{"src": "/assets/briefs/2026-07-28/science-fossil-traces-body-health-640.b1fb970cbb2d.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/science-fossil-traces-body-health-1280.8d16a51ab0aa.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Ayak izli eski yüzeyi, katmanlı tortudaki kılıç dişli kedi omurlarıyla birleştiren fosil kesiti", "en": "Fossil cutaway joining an ancient footprint surface with saber-toothed-cat vertebrae in layered sediment"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "hasAnalysis": true}, {"id": "science-active-surroundings", "topic": "science", "title": {"tr": "Çevre, aygıtı, protonu ve resifi içeriden şekillendiriyor", "en": "Surroundings shape a device, a proton and a reef from within"}, "summary": {"tr": "Bir aygıt altlığı filmle birlikte esnedi, su moleküllerinin asimetrisi protonun tayfını belirledi, komşu resifler ise farklı akıntılarla ayrı kimyalarını korudu. Üç çalışma, çevrenin etkin rolünü ölçüyor.", "en": "A device substrate flexed with its film, water asymmetry set a proton's spectrum, and neighbouring reefs kept distinct chemistry under different flows. Three studies measure surroundings as active participants."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-28/science-active-surroundings-1280.a9fdbe5d900f.webp", "variants": [{"src": "/assets/briefs/2026-07-28/science-active-surroundings-640.85cedd6898e4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/science-active-surroundings-1280.a9fdbe5d900f.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Bükülen ince filmi, asimetrik su moleküllerini ve farklı akıntılardaki resifleri birleştiren akış", "en": "Flow linking a bending thin film, asymmetric water molecules and reefs under different currents"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "hasAnalysis": true}, {"id": "science-control-at-active-sites", "topic": "science", "title": {"tr": "Malzeme işlevi etkin bölgeyi yöneterek değişiyor", "en": "Material function changes by controlling active sites"}, "summary": {"tr": "Üç laboratuvar çalışması, kızılötesi ışığın yönünü ve iki kimyasal dönüşümün seçiciliğini; manyetik katkı, komşu katalizör bölgeleri ve çevrimsel oksijen yenilemesiyle yönetiyor.", "en": "Three laboratory studies control infrared directionality and the selectivity of two chemical conversions through magnetic doping, neighbouring catalyst sites and cyclic oxygen replenishment."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/science-control-at-active-sites-1280.367e671881ca.webp", "variants": [{"src": "/assets/briefs/2026-07-27/science-control-at-active-sites-640.7893cdc1a950.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/science-control-at-active-sites-1280.367e671881ca.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Katkılı koyu kristalde tek yönlü ışık izi, komşu katalizör yüzeyleri ve seramik kafeste dönen parçacıkları birleştiren bilim illüstrasyonu", "en": "Scientific illustration combining a one-way light trail in a doped dark crystal, neighbouring catalyst surfaces and circulating particles in a ceramic lattice"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "hasAnalysis": true}, {"id": "science-preclinical-local-environments", "topic": "science", "title": {"tr": "Üç deneysel yaklaşım yerel hastalık ortamını değiştiriyor", "en": "Three experimental approaches reshape local disease environments"}, "summary": {"tr": "Bağırsak GABA'sını geri kurmak, enfeksi {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-1280.1b36092ffd7f.webp", "variants": [{"src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-640.9de64c3561c4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/science-data-relations-outpace-mechanisms-1280.1b36092ffd7f.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Farklı katmanlardan aynı örüntüyü ve farklı köklerden tek ağacı gösteren bilimsel editoryal illüstrasyon", "en": "Scientific editorial illustration showing one pattern across different layers and one tree above different root systems"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "hasAnalysis": true}, {"id": "science-physical-archives-deep-time", "topic": "science", "title": {"tr": "Maddi arşivler iki tarihi yazılı kayıtların ötesine taşıyor", "en": "Physical archives extend two histories beyond written records"}, "summary": {"tr": "Chang'e-6 kayaçları Ay çarpmalarını üç milyar yıla yayıyor; eski patojen genomları ise uzak Avrasya topluluklarını yaklaşık 5.300 yıl önce bağlıyor. İki çalışma, örnekleme sınırlarını koruyarak maddeden derin tarih kuruyor.", "en": "Chang'e-6 rocks date lunar impacts across three billion years; ancient pathogen genomes connect distant Eurasian populations about 5,300 years ago. Both studies reconstruct deep history from surviving material while retaining sampling limits."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-1280.0704221b163a.webp", "variants": [{"src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-640.253fc696931a.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/science-physical-archives-deep-time-1280.0704221b163a.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Ay katmanları ve DNA izleriyle çevrili bir kayaç ile eski kemiği gösteren metinsiz editoryal illüstrasyon", "en": "Text-free editorial illustration of a rock and ancient bone surrounded by lunar layers and DNA traces"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "science-constraints-become-signal", "topic": "science", "title": {"tr": "İki deney ölçüm kısıtını sinyale dönüştürüyor", "en": "Two experiments turn measurement constraints into signal"}, "summary": {"tr": "Yer radarı, neredeyse dik geometriyle sönük iyonosfer dalga harmoniklerini gördü; Rydberg sensörü kayıplı kanal ekleyerek bilgiyi artırdı. Her deney, ölçüm engelini yöntemin bir parçasına dönüştürdü.", "en": "Ground radar revealed faint ionospheric wave harmonics through near-perpendicular geometry; a Rydberg sensor gained information by adding a lossy channel. Each experiment made a measurement obstacle part of the method."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-25/science-constraints-become-signal-1280.2d335b035285.webp", "variants": [{"src": "/assets/briefs/2026-07-25/science-constraints-become-signal-640.919805ce501b.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/science-constraints-become-signal-1280.2d335b035285.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "İyonosfer radar dalgalarını kayıplı kanaldan geçen atom sensörüne bağlayan metinsiz editoryal illüstrasyon", "en": "Text-free editorial illustration linking ionospheric radar waves to an atomic sensor passing through a lossy channel"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "science-resolution-risk-response", "topic": "science", "title": {"tr": "Daha yüksek çözünürlük risk müdahalesinin başlangıç noktasını değiştiriyor", "en": "Higher resolution changes where risk response begins"}, "summary": {"tr": "Yabani kuş izlemesi Çin'deki birçok H5Nx saptamasını tekrarlanan yeniden girişlere bağlıyor; ünite düzeyindeki inceleme kömür cıvasını aşırı salıcılarda yoğunlaştırıyor. İnce çözünürlük, izleme ve azaltımın nereden başlayacağını değiştiriyor.", "en": "Wild-bird surveillance attributes many H5Nx detections in China to repeated reintroductions, while unit-level analysis concentrates coal mercury in super emitters. Finer resolution changes where monitoring and mitigation begin."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-25/science-resolution-risk-response-1280.fec10066a002.webp", "variants": [{"src": "/assets/briefs/2026-07-25/science-resolution-risk-response-640.c031dfa9249a.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/science-resolution-risk-response-1280.fec10066a002.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Göçmen kuş yolları ile az sayıdaki santralde yoğunlaşan salınımı saydam bir odak alanında gösteren metinsiz editoryal illüstrasyon", "en": "Text-free editorial illustration showing migratory bird paths and a few concentrated plant emissions within a transparent field of focus"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "science-control-across-scales", "topic": "science", "title": {"tr": "Tasarım, yönelim ve dengeleme üç farklı müdahale yolu açıyor", "en": "Design, orientation and balancing open three routes to control"}, "summary": {"tr": "Bir bağışıklık alıcısı yeniden tasarlandı, bir kristalin doğal yön bağımlılığı ölçüldü, bir kuantum devresinin iki kenarı dengelendi. Üç çalışma, müdahale noktasının başarı ölçüsünü nasıl değiştirdiğini gösteriyor.", "en": "An immune receptor was redesigned, a crystal's native directionality was measured, and two edges of a quantum circuit were balanced. Together, the studies show how the point of intervention changes the measure of success."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/science-control-across-scales-1280.3a92fa9fa308.webp", "variants": [{"src": "/assets/briefs/2026-07-24/science-control-across-scales-640.5410ecee07d4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/science-control-across-scales-1280.3a92fa9fa308.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Bitki hücresi, kristal içindeki ısı yolu ve dengeli kuantum devresini birleştiren soyut illüstrasyon", "en": "Abstract illustration combining a plant cell, a heat path through a crystal and a balanced quantum circuit"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}, {"id": "science-evidence-limits", "topic": "science", "title": {"tr": "Füzyonda olağandışı hız, nakledilen dokuda tek sperm, penguenlerde yüzde 69 düşüş", "en": "An unusual fusion rate, one sperm from transplanted tissue and a 69% penguin decline"}, "summary": {"tr": "Üç sayı da dikkat çekici, fakat farklı sorular açıyor: füzyon bulgusu bağımsız tekrar, doku nakli klinik sonuç, penguen düşüşü ise yeni bir saha sezonu bekliyor.", "en": "All three numbers are striking, but they open different questions: the fusion finding awaits independent replication, the tissue transplant a clinical outcome, and the penguin decline another field season."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/science-evidence-limits-1280.1b5836809c8a.webp", "variants": [{"src": "/assets/briefs/2026-07-24/science-evidence-limits-640.3cad36b5c1cd.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/science-evidence-limits-1280.1b5836809c8a.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Kristal düzeneği, hücre kültürü ve uzaktaki buzdağı ile penguenleri katmanlar halinde gösteren illüstrasyon", "en": "Layered illustration of a crystal apparatus, cell culture, and a distant iceberg with penguins"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}, {"id": "science-new-observation-windows", "topic": "science", "title": {"tr": "MAVEN bulgusu ile ALMA sonuçsuzluğu aynı şeyi ölçmüyor", "en": "MAVEN's finding and ALMA's null result do not measure the same thing"}, "summary": {"tr": "MAVEN verileri Mars'ta yerel bir yeniden bağlanma düzenini desteklerken ALMA taraması yalnızca incelenen frekanslarda aday bulamadı; biri mekanizma kanıtı, diğeri sınırlı bir sonuçsuzluk sunuyor.", "en": "MAVEN data support a local reconnection pattern at Mars, while the ALMA search found no candidate only in the frequencies examined; one bears on mechanism, the other on a bounded null result."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/science-new-observation-windows-1280.74f9a8fd5ba9.webp", "variants": [{"src": "/assets/briefs/2026-07-24/science-new-observation-windows-640.50979582d338.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/science-new-observation-windows-1280.74f9a8fd5ba9.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Mars yüzeyindeki yerel kutup ışığı yaylarını uzaydan gelen dalgaları alan bir radyo teleskobuyla birleştiren illüstrasyon", "en": "Illustration linking local auroral arcs on Mars with a radio telescope receiving waves from space"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}], "articles": [{"writer": "sci-01", "title": {"tr": "25 yıllık müon açığını kapatan hesap, faturayı ölçümlere çıkardı", "en": "The calculation that closed the 25-year muon gap sent the bill to the measurements"}, "excerpt": {"tr": "Müonun manyetik salınımındaki milyonda birlik sapma kuram tarafında kapandı. Kapanınca ortaya çıkan şey, kırk yıla yayılmış pion üretim ölçümlerinin birbirine uymadığıydı.", "en": "The one-part-in-a-million deviation in the muon's magnetic wobble closed on the theory side. What closing it revealed was that four decades of pion production measurements do not agree with one another."}, "sections": [{"h": {"tr": "Açığın kapandığı gün", "en": "The day the gap closed"}, "ps": [{"tr": "Müonun manyetik salınımı, çeyrek yüzyıl boyunca kuramsal öngörüden milyonda bir düzeyinde saptı ve bu sapma keşfedilmemiş parçacıklara işaret ediyor sayıldı. Budapeşte-Marsilya-Wuppertal işbirliğinin örgü QCD hesabı 2021'de müonun bilinen fizikle tam uyumlu salındığını gösterdi; sonuç Fermilab'ın güncellenmiş ölçümüyle aynı gün açıklandı.", "en": "For a quarter of a century the muon's magnetic wobble sat about one part in a million away from theoretical prediction, and that deviation was taken as a hint of undiscovered particles. In 2021 the Budapest-Marseille-Wuppertal collaboration's lattice QCD calculation showed the muon wobbling exactly as known physics requires, and the result was released the same day as Fermilab's updated measurement.", "refs": ["muon"]}, {"tr": "Aynı sayıya ikinci bir yoldan varılıyor. Alex Keshavarzi ve arkadaşlarının Haziran 2020'de yayımladığı veri temelli öngörü, kuarkların davranışını elektron-pozitron çarpışmalarından çıkarıyordu ve Fermilab'ın Nisan 2021 ölçümüyle o kadar keskin biçimde çelişti ki yeni parçacık keşfi için gereken katı eşiğe neredeyse dayandı. Örgü hesabı bu çelişkiyi çözmedi; yerini değiştirdi.", "en": "The same number can be reached by a second route. The data-driven prediction published by Alex Keshavarzi and colleagues in June 2020 inferred quark behaviour from electron-positron collisions, and it clashed with Fermilab's April 2021 measurement so sharply that it nearly reached the stringent threshold required to claim a new particle. The lattice calculation did not dissolve that clash; it moved where the clash sits.", "refs": ["muon"]}]}, {"h": {"tr": "Yükü taşıyan ölçüm", "en": "The measurement left carrying the weight"}, "ps": [{"tr": "Veri temelli yol, elektron-pozitron çarpışmalarındaki pion üretim oranlarının ölçümüne dayanıyor. Novosibirsk'teki VEPP-2000 çarpıştırıcısında 2023'te yeni bir algılayıcı kurulup oranlar yeniden ölçüldüğünde, değerler belirgin biçimde değişti. Liverpool Üniversitesi'nden Fedor Ignatov bunu \"It was a surprise. No one expected it to be like that\" sözleriyle anlatıyor. BABAR çarpıştırıcısının 2023 çözümlemesi ise eski oranla çarpıcı bir uyum içinde.", "en": "The data-driven route depends on measurements of pion production rates in electron-positron collisions. When a new detector was installed at the VEPP-2000 collider in Novosibirsk in 2023 and the rates were measured again, the values changed significantly. Fedor Ignatov of the University of Liverpool describes it this way: \"It was a surprise. No one expected it to be like that\". The BABAR collider's 2023 analysis, meanwhile, sits in striking agreement with the older rate.", "refs": ["muon"]}, {"tr": "Bir kuramsal hesabın deneyle buluşması, uyuşmazlığı kuram ile ölçüm arasından çıkarıp ölçümlerin kendi arasına taşıdı: şimdi ayrışan şey iki yöntem yerine aynı yöntemi besleyen girdilerdir. Bilinmeyen bir parçacık bunun tek açıklaması sayılmaz; onlarca yıla yayılmış deneyler arasındaki gözden kaçmış yöntem ayrımları da aynı ayrışmayı üretebilir ve o durumda Standart Model'e dokunmak gerekmez.", "en": "A theoretical calculation meeting the experiment carried the disagreement out from between theory and measurement and set it down among the measurements themselves: what now diverges is one method's own inputs rather than two rival methods. An unknown particle counts as only one account of this. Overlooked procedural differences between experiments spread across decades could produce the same divergence, and in that case nothing in the Standard Model needs touching.", "refs": ["muon"]}]}, {"h": {"tr": "Neye bakılacak", "en": "What to watch"}, "ps": [{"tr": "Keshavarzi, VEPP-2000 sonucundan daha çok incelenmiş bir ölçüm bulunmadığını ve şimdiye dek bir sorun saptanmadığını söylüyor; kendi özeti de bunu doğruluyor: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Bakılacak yer, bağımsız bir pion oranı ölçümünün VEPP-2000'in yeni değerine mi yoksa BABAR ile eski ölçümlerin oluşturduğu kümeye mi düşeceğidir. Müonun kendi sayısı bir süre daha aynı kalabilir; ona giden yolun iki ucu birbirine yaklaşmadan hangi tarafta yeni fizik olduğu söylenemez.", "en": "Keshavarzi says no measurement has been scrutinised more than VEPP-2000's and that so far no problems have been found; his own summary bears it out: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" What to watch is whether an independent measurement of the pion rate lands on VEPP-2000's new value or in the cluster formed by BABAR and the older results. The muon's own number may hold steady for a while yet; until the two ends of the road leading to it converge, no one can say which side holds new physics.", "refs": ["muon"]}]}], "sources": [{"key": "muon", "kind": "news", "name": "Quanta Magazine", "url": "https://www.quantamagazine.org/physicists-solve-a-muon-mystery-now-old-results-dont-add-up-20260729", "title": {"tr": "Müondaki 25 yıllık açığı kapatan hesap, kırk yıllık pion ölçümlerini birbiriyle çelişkide bıraktı", "en": "The calculation that closed a 25-year muon gap has left four decades of pion measurements in conflict"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Çocukluk kokusunun izi, koku soğanında doğum sonrası hücrelerde bulundu", "en": "The trace of a childhood scent was found in postnatal cells of the olfactory bulb"}, "excerpt": {"tr": "Ankete 647 kişi katıldı. Nedensel adım ise farede atıldı: doğumdan sonraki ilk gün oluşan granül hücreleri ışıkla susturulunca hayvanın kokuya ilgisi düştü.", "en": "647 people took part in the survey. The causal step was taken in the mouse: when granule cells formed on the first day after birth were silenced with light, the animal's interest in the odour fell."}, "sections": [{"h": {"tr": "İki ayrı kanıt, iki ayrı tür", "en": "Two kinds of evidence, two species"}, "ps": [{"tr": "Çalışma iki koldan yürüdü. Ankete 647 kişi katıldı ve çocukluğunun hoş kokularını bildirdi. Fareler ise doğum sonrası 23–33. günler arasında, insanda erken çocukluğa karşılık gelen dönemde, çekici kokularla zenginleştirilmiş bir ortamda tutuldu.", "en": "The study ran along two tracks. 647 people took part in the survey and reported the pleasant smells of their childhood. Mice, for their part, were kept in an environment enriched with attractive odorants between postnatal days 23 and 33, the period corresponding to early childhood in humans.", "refs": ["smell"]}, {"tr": "Yetişkin farede anının geri çağrılması, doğumdan sonraki ilk gün oluşan granül hücrelerine bağlı çıktı. Ekip bu hücreleri halorodopsin taşıyan bir lentivirüsle işaretleyip 561 nanometre ışıkla susturdu; kokuya ayrılan inceleme süresi düştü, alışma eğrisi dikleşti ve tercih göstergesi geriledi. Grup büyüklükleri 18 ve 12 hayvandı.", "en": "In the adult mouse, recall of the memory turned out to depend on granule cells formed on the first day after birth. The team labelled those cells with a lentivirus carrying halorhodopsin and silenced them with light at 561 nanometres; investigation time devoted to the odorant fell, the habituation slope steepened and the preference index declined. Group sizes were 18 and 12 animals.", "refs": ["smell"]}]}, {"h": {"tr": "İki açıklama yarışıyor", "en": "Two accounts in competition"}, "ps": [{"tr": "Yazarların önerdiği mekanizma, erken kokunun ödül sistemiyle artan bağlantı üzerinden koku soğanına yerleşmesidir. Scientific American'ın aktardığı biçimde granül hücreleri haz ve ödül bölgeleriyle ayrıcalıklı bağlantılar kuruyor, böylece erken koku çocuklukta damgalanıyor.", "en": "The mechanism the authors propose is that the early odorant settles into the olfactory bulb through increased connectivity with the reward system. As Scientific American puts it, granule cells make privileged connections with pleasure and reward areas, so the early scent becomes imprinted in childhood.", "refs": ["smell"]}, {"tr": "Işıkla susturmanın ardından değişen davranış, ödül üzerinden kurulan bir damgalanmanın kesilmesiyle açıklanabilir. Aynı sonuç, erken kokunun yalnızca tanıdık olmasından da doğabilir; granül hücreleri kapatıldığında aşinalığı okuyan yol da kapanır ve inceleme süresi yine düşer. İki açıklamayı ayırmak, hazzı ve aşinalığı birbirinden bağımsız sınamayı gerektirir.", "en": "The behaviour that changes after silencing with light can be explained by the interruption of an imprint established through reward. The same outcome could also arise from the early odorant being merely familiar; when granule cells are shut off, the route that reads familiarity closes too and investigation time falls just the same. Separating the two accounts requires testing pleasure and familiarity independently of one another.", "refs": ["smell"]}]}, {"h": {"tr": "Kimin için ne değişir", "en": "Whose life this changes"}, "ps": [{"tr": "Bu araştırmadan kliniğe bugün taşınabilecek bir uygulama çıkmıyor. Scientific American'ın derlediği iki uyarı da bunu destekliyor: AgroParisTech-INRAE'den Hervé This çalışmanın ağırlıkla olumlu anılara odaklandığını söylüyor, Buckingham Üniversitesi'nden Luca Turin ise kokunun ayrıksılığının görünürde kalabileceğini savunuyor. Yaşlanan farede anının sürmesi için kokunun aralıklarla yeniden verilmesi gerekiyor ve doğum sonrası hücreler devreden çekilirken limbik bağlantılar güçleniyor. İnsanda karşılığı olan soru budur: erken kokuya yeniden maruz kalmak, yaşlanmayla zayıflayan bir anıyı ayakta tutar mı?", "en": "Nothing in this research can be carried into the clinic today. The two cautions Scientific American gathered support that reading: Hervé This of AgroParisTech-INRAE says the work focused largely on positive memories, while Luca Turin of the University of Buckingham argues smell's distinctiveness may be only apparent. In the ageing mouse, the memory persists only if the odorant is presented again periodically, and as the postnatal cells disengage the limbic connections strengthen. That is the question with a human counterpart: does re-exposure to an early scent hold up a memory that ageing weakens?", "refs": ["smell"]}]}], "sources": [{"key": "smell", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories", "title": {"tr": "Farelerde koku soğanı granül hücrelerinin susturulması, çocukluk koku tercihini değiştirdi", "en": "Silencing olfactory-bulb granule cells in mice changed a childhood scent preference"}, "publishedDate": "2026-07-29", "primary": {"kind": "paper", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003845", "publishedDate": "2026-07-14", "title": {"tr": "Olumlu erken yaşam koku anısı koku soğanında kökleniyor ve koku sisteminin ötesinde geniş ölçekli değişiklikleri tetikliyor", "en": "Positive early-life olfactory memory is rooted in the olfactory bulb and triggers large-scale changes beyond the olfactory system"}}}], "date": "2026-07-30"}, {"writer": "sci-03", "title": {"tr": "Demirle gübreleme için en az zarar veren yer Güney Okyanusu çıktı", "en": "The Southern Ocean comes out as the least damaging place to add iron"}, "excerpt": {"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde plankton kütlesi düşüyor, Güney Okyanusu'nda yükseliyor; karar bu farkta.", "en": "The same intervention runs in opposite directions in two oceans. In the equatorial Pacific plankton biomass falls, in the Southern Ocean it rises, and the decision lives in that difference."}, "sections": [{"h": {"tr": "İki bölge, ters yönde iki sonuç", "en": "Two regions, two opposite outcomes"}, "ps": [{"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde okyanus alanının yüzde 0,35'i gübrelendiğinde büyük zooplankton kütlesi en az yüzde 10 düşüyor. Güney Okyanusu'nda daha küçük bir alan, yüzde 0,2, gübrelendiğinde aynı kütle yüzde 10 artıyor.", "en": "The same intervention runs in opposite directions in two oceans. When 0.35 percent of the ocean area in the equatorial Pacific is fertilised, macrozooplankton biomass falls by at least 10 percent. When a smaller area in the Southern Ocean, 0.2 percent, is fertilised, that same biomass rises by 10 percent.", "refs": ["iron"]}, {"tr": "Karbon tarafındaki sayı ise şu: net uzaklaştırma 5,3 ppm'e, yani yılda 0,70 gigaton karbondioksite kadar çıkıyor. California Üniversitesi'nden Jun Yu, Adam Martiny ve arkadaşları bu değerleri altmış yılı aşkın gübreleme verisini kullanan bir bilgisayar modellemesinden çıkarıyor ve Güney Okyanusu'nun ekolojik bozulma ile karbon uzaklaştırması arasında en iyi dengeyi sunduğu sonucuna varıyor.", "en": "On the carbon side the number is this: net removal reaches up to 5.3 parts per million, that is 0.70 gigatonnes of carbon dioxide a year. Jun Yu, Adam Martiny and colleagues at the University of California derive these values from a computer model drawing on more than six decades of fertilisation data, and conclude that the Southern Ocean offers the best balance between ecological disturbance and carbon removal.", "refs": ["iron"]}]}, {"h": {"tr": "Farkı ne yapıyor", "en": "What makes the difference"}, "ps": [{"tr": "İki bölgenin ters yönde davranması, eklenen demirin karşılaştığı besin ağının ne yaptığına bağlı görünüyor: Güney Okyanusu'nda demir eksikliği üretimi sınırlayan asıl kısıt olduğu için eklenen demir üretimi yukarı çekiyor ve üstteki halkalara besin taşıyor, Ekvator Pasifiği'nde ise büyümenin yönü zooplanktonun beslendiği topluluğun bileşimini onun aleyhine değiştiriyor.", "en": "The opposite behaviour of the two regions appears to depend on what the food web meeting the added iron does with it: in the Southern Ocean, iron scarcity is the binding constraint on production, so added iron pulls production upward and carries food to the levels above, while in the equatorial Pacific the direction of growth shifts the composition of the community zooplankton feed on against them.", "refs": ["iron"]}, {"tr": "Bu bir çıkarım ve yanında başka açıklamalar da duruyor. Bölgesel sıralama, okyanusların gerçek davranışından çok her bölgenin modelin besin ağı parametrelerinde nasıl temsil edildiğinden de doğabilir; iki bölgenin plankton toplulukları modele farklı ayrıntı düzeyinde girmişse sıralama o ayrıntının izini taşır. Yazarların kendi uyarısı da bu yönde okunmalı: demirle gübrelemenin uzak etkileri var ve yerel her girişim doğası gereği yerel olmayan sonuçlar doğuruyor.", "en": "This is an inference, and other accounts stand beside it. The regional ranking could also arise less from how the oceans actually behave than from how each region is represented in the model's food-web parameters; if the plankton communities of the two regions entered the model at different levels of detail, the ranking carries the trace of that detail. The authors' own caution should be read in the same direction: ocean iron fertilisation has downstream effects, and any localised intervention inherently produces nonlocal consequences.", "refs": ["iron"]}]}, {"h": {"tr": "Elimizde olan kollar", "en": "The levers we actually hold"}, "ps": [{"tr": "Bu çalışmanın verdiği şey iki ayar düğmesidir: nerede ve ne kadar alanda. Güney Okyanusu'nda yüzde 0,2 ile plankton kütlesi yüzde 10 artıyor, Ekvator Pasifiği'nde yüzde 0,35 ile en az yüzde 10 düşüyor; yer seçimi tek başına sonucun işaretini çeviriyor. Bunun karşılığı sahada henüz sınanmadı. Elimizde bir modelleme çözümlemesi var ve bir saha denemesinin ilk işi, modelin zooplanktona dair öngörüsünün tuttuğunu ölçmek olur.", "en": "What this study hands over is two dials: where, and over how much area. In the Southern Ocean 0.2 percent makes plankton biomass rise by 10 percent, while in the equatorial Pacific 0.35 percent makes it fall by at least 10 percent; the choice of place alone flips the sign of the outcome. None of this has been tested at sea yet. What we hold is a modelling analysis, and the first job of any field trial would be to measure whether the model's prediction about zooplankton holds.", "refs": ["iron"]}]}], "sources": [{"key": "iron", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-oceans-australia-fertilize-carbon-dioxide.html", "title": {"tr": "Model çalışması, demirle gübreleme için Güney Okyanusu'nu Ekvator Pasifiği'nin önüne koyuyor", "en": "A modelling study puts the Southern Ocean ahead of the equatorial Pacific for iron fertilisation"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-04", "title": {"tr": "Tekrarsız bir döşemeyi silisyum nitrüre kazıdılar ve ışık bir ellilik kazandı", "en": "They etched an aperiodic tiling into silicon nitride and the light acquired a handedness"}, "excerpt": {"tr": "Matematikte 2022'de bulunan \"şapka\", sonsuz bir yüzeyi hiç tekrarlamadan kaplıyor. Tokyo'daki ekip onu ince filme oyunca kırınan lazer ışığı aynada bakışımsız çıktı.", "en": "The hat, found in mathematics in 2022, covers an infinite surface without ever repeating. When a team in Tokyo etched it into a thin film, the diffracted laser light came out mirror-asymmetric."}, "sections": [{"h": {"tr": "Döşemeden aygıta", "en": "From tiling to device"}, "ps": [{"tr": "\"Şapka\" döşemesini 2022'de amatör matematikçi David Smith buldu. Tek bir taş, sonsuz bir yüzeyi hiçbir örüntüyü tekrarlamadan kaplıyor; adı da Albert Einstein'dan gelmiyor, Almanca \"ein Stein\", yani \"tek taş\" ifadesinden geliyor. Yarım yüzyıldan uzun süredir açık duran bir soru böylece kapandı ve elde bir şekil kaldı: kendini asla tekrarlamayan bir kaplama kuralı.", "en": "The hat tile was found in 2022 by the amateur mathematician David Smith. A single stone covers an infinite surface without repeating any pattern, and its name does not come from Albert Einstein but from the German \"ein Stein\", that is, one stone. A question left open for more than half a century closed, and what remained in hand was a shape: a tiling rule that never repeats itself.", "refs": ["hat"]}, {"tr": "Tokyo Üniversitesi Endüstriyel Bilim Enstitüsü'ndeki ekip o kuralı bir aygıta çevirdi. Şapkanın biçimine dayanan örüntüyü silisyum nitrür ince filme oydular, üzerine lazer düşürdüler ve Bragg kırınımıyla çıkan ışığı okudular. Işık aynada bakışımsız geldi; yani bir ellilik taşıyordu. Baş yazar Yuto Moritake çıkış noktasını sade anlatıyor: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "en": "The team at the University of Tokyo's Institute of Industrial Science turned that rule into a device. They etched a pattern based on the hat's shape into a silicon nitride thin film, shone a laser onto it and read the light coming out of Bragg diffraction. The light arrived mirror-asymmetric, that is, carrying a handedness. Lead author Yuto Moritake states the starting point plainly: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "refs": ["hat"]}]}, {"h": {"tr": "Neden beklenmiyordu", "en": "Why that was not expected"}, "ps": [{"tr": "Kırınım normalde düzenli bir örgünün işidir: tekrar eden aralıklar, ışığı belirli açılara yönlendirir. Şapka döşemesinde tekrar yok, buna karşın çıkan ışıkta bir yön tercihi var; bu tercihin kaynağı, düzenli bir örgü yerine döşemenin kendi bakışımsızlığı görünüyor. Aynı ellilik, örüntünün filmin kenarlarında nasıl kesildiğinden de doğabilir; sonlu bir parçanın kenar seçimi de bakışımı bozar ve bunu ayırmak farklı kesimlerle aynı ölçümü yinelemeyi gerektirir.", "en": "Diffraction is normally the business of a regular lattice: repeating spacings steer light into particular angles. In the hat tiling there is no repetition, yet the emerging light shows a directional preference, and the source of that preference appears to be the tile's own asymmetry rather than a regular lattice. The same handedness could also arise from how the pattern was cut at the film's edges; the choice of boundary in a finite patch also breaks symmetry, and separating the two requires repeating the measurement with different cuts.", "refs": ["hat"]}, {"tr": "Kullanım tarafında ekip lazer ışığının kutuplanmasını denetlemeyi, haberleşmeyi ve kuantum şifrelemeyi sayıyor. Ortada bir aygıt yerine bir olgu duruyor: ince filme kazınmış bir örüntünün kırınan ışığa bir el kazandırdığı gösterildi. O elin ne kadar güçlü, ne kadar kararlı ve hangi dalga boylarında seçilebilir olduğu, bir kutuplanma denetleyicisi yapmaya kalkan herkesin ilk ölçeceği şeydir; makale bu üç sayıyı vermiyor.", "en": "On the application side the team lists control of laser light polarisation, telecommunications and quantum cryptography. What is actually on the table is a phenomenon rather than a device: a pattern etched into a thin film was shown to give diffracted light a hand. How strong that hand is, how stable, and at which wavelengths it can be selected are the first things anyone building a polarisation controller would measure, and the paper does not supply those three numbers.", "refs": ["hat"]}]}], "sources": [{"key": "hat", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/maths-acclaimed-einstein-tile-finds-a-new-home-among-physicists", "title": {"tr": "Lazer ışığı, tekrarsız \"şapka\" döşemesinden bir ellilik kazandı", "en": "Laser light picked up a handedness from the aperiodic hat tile"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-05", "title": {"tr": "Yirmi bin toprak yapısı, 4.500 kilometrekareden çıkarılabilir mi?", "en": "Can twenty thousand earthworks be inferred from 4,500 square kilometres?"}, "excerpt": {"tr": "Amazon'da havadan lazerle taranan alan 4.500 km². Bulunan anıtsal yapı sayısı 400'den fazla. Yayımlanan sayı ise 20.000. Aradaki adımın adı örnekleme.", "en": "The area scanned by airborne laser in Amazonia is 4,500 km². The number of monumental sites found is more than 400. The number publ
