ollectively engaged and more supportive of policy, though that second link was weaker.", "refs": ["climate-panel"]}, {"tr": "Sonra çalışma daha zor olanı yapıyor. Kesitsel bir ilişki insanların kim olduğunu anlatır, eylemlerinin onlara ne yaptığını değil; bu yüzden yazarlar rastgele kesişimli çapraz gecikmeli panel modelleri kullanıyor. Bu modeller kişinin kendi davranışındaki artışın, yine kendi diğer davranışındaki sonraki değişimi öngörüp öngörmediğini soruyor. Orada pek bir şey bulunmadı: bireysel eylemdeki kişi içi artışlar sonraki toplu katılımı ya da politika desteğini güvenilir biçimde öngörmedi. Alışkanlıklar ve katılım birlikte yol alıyor, çünkü aynı insanlara ait; biri diğerini ürettiği için değil.", "en": "Then the study does the harder thing. A cross-sectional association tells you who people are, not what their actions do to them, so the authors ran random-intercept cross-lagged panel models, which ask whether a person's own increase in one behaviour predicts their own later change in the other. There they found little: within-person increases in individual action did not reliably predict subsequent collective action or policy support. The habits and the engagement travel together because they belong to the same people, not because one produces the other.", "refs": ["climate-panel"]}, {"tr": "Bu, manşetten daha küçük ve daha dürüst bir bulgu. Bir savı, karşıtını kurduğundan daha sağlam biçimde ortadan kaldırıyor ve yazarlar nedenselliği çözemediklerini söyleyerek bunu kendileri belirtiyor. Dışlama savı bir mekanizma öne sürüyordu. O mekanizma, onu bulmaya en uygun verinin dört yılında ortaya çıkmadı.", "en": "That is a smaller finding than the headline and a more honest one. It removes a claim more firmly than it establishes the opposite, and the authors say as much in noting that they cannot settle causation. The crowding-out argument asserted a mechanism. The mechanism did not appear in four years of the data best suited to find it.", "refs": ["climate-panel"]}]}, {"h": {"tr": "Hikâyenin kime yaradığı", "en": "Whose story it was"}, "ps": [{"tr": "Makale üzerinde durulmayı hak eden bir satır ekliyor: kurumların tüketici davranışını öne çıkarmak için kendi gerekçeleri olabilir. Bu, ruhbilim hakkında değil çıkarlar hakkında bir cümle ve dışlama savını bu kadar taşınabilir kılan şeye işaret ediyor. Sav bir tarafın bireysel çabayı sanayinin üretmiş olduğu bir oyalama sayarak reddetmesine, diğer tarafın ise geri dönüşümü ayırmayı eksiksiz bir yanıt saymasına imkân verdi. İki okuma da aynı görgül savı gerektiriyordu ve şimdi yetersiz kalan tam da o sav.", "en": "The paper adds a line worth pausing on: institutions may have their own reasons for emphasising consumer behaviour. That is a sentence about interests rather than psychology, and it points at what made the crowding-out argument so portable. It let one side dismiss individual effort as a distraction manufactured by industry, and it let another treat sorting the recycling as a complete answer. Both readings needed the same empirical claim, and that claim is what has now come up short.", "refs": ["climate-panel"]}, {"tr": "Düzenleyici değişkenler resmi keskinleştiriyor. Risk algısı, etkililik inancı ve kişisel norm bireysel eylem ile toplu katılım arasındaki bağı güçlendirdi ve politika desteğini çok az da olsa ters yönde etkiledi. İki davranışın birlikte yol aldığı insanlar, sorunun gerçek olduğuna ve eylemin bir şey değiştirebileceğine zaten inananlar. Bu, tükenen bir erdemden çok, kanaatin önüne açık olan hangi kanal varsa oradan ifade edilmesi olarak okunuyor.", "en": "The moderators sharpen the picture. Risk perception, efficacy beliefs and personal norms strengthened the link between individual action and collective engagement, and moved policy support very slightly the other way. The people for whom the two behaviours travel together are those who already believe the problem is real and that action can change something. That reads less as virtue being depleted and more as conviction expressing itself through whichever channels are open.", "refs": ["climate-panel"]}, {"tr": "Buraya bir sayı daha ait ve rahatsız edici bir yeri gösteriyor. O dört yıl boyunca kişisel davranışlar durağan kalırken genel iklim katılımı ölçülü biçimde geriledi. Aşınan taraf toplu olan taraftı, bireysel olan değil; bu da geri dönüşüm konusundaki kaygının sorunun yanlış ucuna yöneltildiğini düşündürüyor. Elimizdeki tek ülke ve tek panel; bunu genelleyecek sınama, toplu eyleme farklı kanallar açan bir siyasal düzende de aynı yayılma yokluğunun görülüp görülmeyeceği. O zamana kadar söylenebilecek olan dar, ve kanıtının taşıyabileceğinden fazla iş gören bir savı emekliye ayırmaya yine de yetiyor.", "en": "One more number belongs here, and it points somewhere uncomfortable. Across those four years personal behaviours stayed stable while overall climate engagement declined modestly. What eroded was the collective side, not the individual one, which suggests the anxiety about recycling was aimed at the wrong end of the problem. This is one country and one panel; the test that would generalise it is whether the same absence of spillover appears in a political system that gives collective action different channels. Until then what can be said is narrow, and it is still enough to retire an argument that was doing more work than its evidence supported.", "refs": ["climate-panel"]}]}], "sources": [{"key": "climate-panel", "kind": "news", "name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/07/260724061437.htm", "title": {"tr": "Dört yıllık Avustralya paneli, şişelerini ayıranların dilekçeyi de imzaladığını buluyor", "en": "A four-year Australian panel finds the people separating their bottles also sign the petitions"}, "publishedDate": "2026-07-25", "primary": {"kind": "paper", "name": "npj Climate Action", "url": "https://www.nature.com/articles/s44168-026-00405-y", "publishedDate": "2026-07-23", "title": {"tr": "Kişisel iklim eylemleri toplu eylemi ve politika desteğini dışlamıyor: boylamsal kanıt", "en": "Personal climate actions do not crowd out collective action and policy support: longitudinal evidence"}}}], "date": "2026-07-26"}, {"writer": "sci-01", "title": {"tr": "Ay'ın arka yüzünde üç milyar yıllık bir çarpma takvimi", "en": "A three-billion-year impact calendar on the Moon's far side"}, "excerpt": {"tr": "Chang'e-6'nın getirdiği çarpma eriyiği parçaları tek bir tarihe oturmuyor; 4,33 ile 1,13 milyar yıl arasına uzanan bir dağılım veriyor. Bu çalışmada tartışmayı yürüten şey o dağılımın biçimi.", "en": "The impact-melt fragments Chang'e-6 brought back do not settle on a single date; they give a spread reaching from 4.33 to 1.13 billion years. In this study it is the shape of that spread which carries the argument."}, "sections": [{"h": {"tr": "Argonun saydığı şey", "en": "What the argon counts"}, "ps": [{"tr": "40Ar/39Ar jeokronolojisi bir çarpmanın kendisini görmez; çarpma eriyiğinin son kez soğuduğu anı, kayacın içinde biriken argonun saatinden okur. Chang'e-6'nın Ay'ın arka yüzünden getirdiği eriyik kayaçlarında bu saat yaklaşık 4,33 milyar yıl öncesinden 1,13 milyar yıl öncesine kadar uzanan yaşlar veriyor. Üç milyar yılı aşan bir aralık, tek bir uzay görevinin küçük bir örnek çantasından çıkıyor.", "en": "40Ar/39Ar geochronology never sees an impact; it reads the moment the impact melt last cooled, from the clock that argon keeps inside the rock. In the melt rocks Chang'e-6 returned from the Moon's far side, that clock gives ages running from about 4.33 billion years ago to 1.13 billion years ago. An interval of more than three billion years comes out of one space mission's small bag of samples.", "refs": ["ce6"]}, {"tr": "Bu, ölçümün gücü kadar sınırını da tarif ediyor. Elimizdeki şey, tek tek parçaların yaşlarından oluşan bir küme; bombardıman şiddetinin zamana göre eğrisi değil. İkincisine geçmek için parçaların temsil gücüne dair bir varsayım gerekiyor: tek bir iniş bölgesinden toplanan eriyiklerin, o bölgeye düşen çarpmaları yansız biçimde örneklediği varsayımı. Bu varsayım makul olabilir; sınanmış değildir.", "en": "That describes the measurement's limit as much as its power. What we hold is a set of ages belonging to individual fragments, and not a curve of bombardment intensity against time. Moving to the second requires an assumption about how representative the fragments are: that melts collected at a single landing site sample the impacts that struck it without bias. The assumption may be reasonable; it has not been tested.", "refs": ["ce6"]}]}, {"h": {"tr": "Zayıflayan model, güçlenen model", "en": "One model weakens, another gains"}, "ps": [{"tr": "Yarışan iki resim var. Biri, Ay'ın erken tarihinde kısa ve yoğun bir çarpma dönemi öngörüyor; diğeri, gezegenlerin oluşumundan bu yana sürekli ve yavaş bir azalma. Yaşların üç milyar yıla yayılması ikinci resmi güçlendiriyor, birincisini zayıflatıyor. Zayıflatmak çürütmek anlamına gelmiyor: dar bir zaman aralığına sıkışmış yoğun bir dönem de, o döneme ait eriyikler sonraki çarpmalarla yeniden ısıtıldıysa ya da bu örnek kümesinin dışında kaldıysa benzer bir dağılım üretebilir.", "en": "Two pictures compete. One posits a short, intense period of impacts early in the Moon's history; the other, a steady and slow decline since the planets formed. The spread of the ages across three billion years strengthens the second picture and weakens the first. Weakening does not amount to refutation: a dense period compressed into a narrow window could also produce a similar distribution if its melts were reheated by later impacts, or if they fell outside this particular sample set.", "refs": ["ce6"]}, {"tr": "Ay'ın arka yüzüne bakmamızın nedeni de burada. Curtin Üniversitesi'nden Fred Jourdan'ın anlatımıyla Ay bir zaman kapsülü gibi: erozyonun ve levha tektoniğinin Dünya'da sildiği olayların kaydını taşıyor. Dünya'nın ilk milyar yılına dair sorduğumuz her soru, uygulamada Ay'a soruluyor. O yüzden bu tartışmayı ilerletecek şey daha güçlü bir yorum değildir; Ay'ın arka yüzünde ikinci bir iniş bölgesinden gelen ve aynı yöntemle tarihlendirilen bağımsız bir parça kümesidir. Tek Bir kez ölçülen bir dağılım, henüz bir tarih sayılmaz.", "en": "That is also why we look at the far side. As Fred Jourdan of Curtin University puts it, the moon is like a time capsule: it carries a record of events that erosion and plate tectonics erased on Earth. Every question we ask about Earth's first billion years is in practice asked of the Moon. What would move this argument forward is therefore not a stronger reading, and not a bolder one, but an independent set of fragments from a second landing site on the far side, dated by the same method. A distribution measured once does not yet count as a history.", "refs": ["ce6"]}]}], "sources": [{"key": "ce6", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-unexplored-side-moon-rewrite-lunar.html", "title": {"tr": "Chang'e-6 örnekleri Ay'ın arka yüzünde üç milyar yıllık çarpma geçmişini tarihlendirdi", "en": "Chang'e-6 samples date three billion years of impacts on the Moon's far side"}, "publishedDate": "2026-07-24", "primary": {"kind": "paper", "name": "Science Advances", "url": "https://doi.org/10.1126/sciadv.aee8718", "publishedDate": "2026-07-24", "title": {"tr": "Chang'e-6 çarpma eriyiği kayaçlarının 40Ar/39Ar jeokronolojisiyle ortaya konan Ay arka yüzü bombardıman geçmişi", "en": "The bombardment history on the lunar farside revealed by 40Ar/39Ar geochronology of Chang'e-6 impact melt rocks"}}}], "date": "2026-07-25"}, {"writer": "sci-02", "title": {"tr": "On hastanın dokusu bize ne kadarını söyleyebilir?", "en": "How much can the tissue of ten patients tell us?"}, "excerpt": {"tr": "Kalıtsal transtiretin amiloidozunda lif yapıları artık yaşayan hastanın baldırından alınan biyopsiden çözülüyor. Bu çalışma yapı biliminde gerçek bir açılım sağlıyor; hastanın takvimini henüz değiştirmiyor.", "en": "In hereditary transthyretin amyloidosis the fibril structures are now resolved from a biopsy taken from a living patient's calf. This study delivers a real opening in structural science; it does not yet move the patient's calendar."}, "sections": [{"h": {"tr": "Dokuyu nereden aldıkları önemli", "en": "Where the tissue came from matters"}, "ps": [{"tr": "Ekip, dokuz farklı heterozigot mutasyon taşıyan on yaşayan hastanın baldır kası biyopsilerinden ve göz içi sıvısından 1,9 ile 3,4 angström arasında çözünürlükte on dokuz transtiretin lif yapısı çıkardı. Amiloid yapı çalışmalarının uzun süre otopsi dokusuna bağlı kalması, incelenebilen hastalık evrelerini de kendiliğinden sınırlıyordu: en ağır, en geç, en çok ilerlemiş olan. Yaşayan hastadan alınan doku bu kısıtı gevşetiyor.", "en": "The team extracted nineteen transthyretin fibril structures at resolutions between 1.9 and 3.4 angstroms from gastrocnemius muscle biopsies and vitreous humor of ten living patients carrying nine distinct heterozygous mutations. Amyloid structural studies long depended on autopsy tissue, which by itself limited which stage of disease could be examined: the most severe, the latest, the furthest along. Tissue from living patients loosens that constraint.", "refs": ["ttr"]}, {"tr": "Yapıların yanında ikinci bir değerlendirme var: kriyo-elektron mikroskobu yoğunluklarının derin öğrenmeye dayalı çözümlenmesi, liflerde mutant ya da yabanıl tip baskınlığını yarı nicel olarak tartıyor. Yazarlar buradan, hastalığın başlangıcı ile amiloid oluşumunu öncelikle başlatan transtiretin türü arasında bir ilişki bulunduğunu bildiriyor. Bu bir ilişki ifadesidir; hangi türün baskın olmasının başlangıç yaşını belirlediğini gösteren bir deney yapılmış değildir.", "en": "Alongside the structures sits a second assessment: deep-learning-based analysis of cryo-EM densities weighs, semi-quantitatively, mutant or wild-type dominance within fibrils. From this the authors report an association between disease onset and the transthyretin species that primarily initiates amyloid formation. That is a statement of association; no experiment has shown that which species dominates determines the age at onset.", "refs": ["ttr"]}]}, {"h": {"tr": "Paydayı sormak", "en": "Asking after the denominator"}, "ps": [{"tr": "Hastalık yapıcı mutasyon sayısı TTR geninde 130'un üzerinde tanımlanmış durumda. Bu çalışma dokuz mutasyonu kapsıyor, on hastada. Yazarların iddiası da bu paydaya uygun ölçekte kalıyor: biyopsiye dayalı iş akışı, amiloid yapı çalışmaları için hasta dokusuna erişimi genişletiyor ve heterojen kalıtsal amiloidozların sistematik olarak incelenmesine imkân veriyor. Teslim edilen şeyin bir iş akışı olduğunu görmek, tek tek yapıların değerini küçültmüyor; onları doğru rafa koyuyor.", "en": "More than 130 pathogenic mutations have been identified in the TTR gene. This study covers nine mutations, in ten patients. The authors' claim stays scaled to that denominator: the biopsy-based workflow broadens access to patient tissue for amyloid structural studies and enables systematic investigation of heterogeneous hereditary amyloidoses. Seeing that what is delivered is a workflow does not diminish the value of the individual structures; it puts them on the right shelf.", "refs": ["ttr"]}, {"tr": "Hasta için bugün ne değişiyor? Doğrudan bir şey değişmiyor. Bir lifin atomik yapısı tedavi seçimini kendiliğinden değiştirmez; kalıtsal transtiretin amiloidozunda kararlar hâlâ genotipe, tutulan organa ve işlev ölçütlerine dayanıyor. Yapının hastaya ulaşması için aradaki basamakların kurulması gerekiyor: aynı mutasyonda bağımsız hastalardan tekrarlanan yapılar, yapı ile klinik seyir arasında ileriye dönük olarak sınanan bir bağ, sonra da ilaçların bu ayrımı gözetip gözetmediğinin gösterilmesi. Bu çalışma ilk basamağı somut biçimde ucuzlattı; sonrakiler önümüzde duruyor.", "en": "What changes for a patient today? Nothing directly. The atomic structure of a fibril does not by itself change a treatment choice; in hereditary transthyretin amyloidosis, decisions still rest on genotype, the organs involved and measures of function. For structure to reach the patient the intervening steps have to be built: structures repeated from independent patients carrying the same mutation, a link between structure and clinical course tested prospectively, and then evidence that the drugs respect that distinction at all. This study has concretely made the first step cheaper; the ones after it lie ahead.", "refs": ["ttr"]}]}], "sources": [{"key": "ttr", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75850-8", "title": {"tr": "Yaşayan hastalardan alınan amiloid lifleri kriyo-EM ile çözüldü", "en": "Cryo-EM resolves amyloid fibrils taken from living patients"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-03", "title": {"tr": "Kuzey Grönland'da metanın kaynağı buzun altındaki yaşam yerine altındaki kaya", "en": "In North Greenland the methane comes from the rock below the ice rather than the life in it"}, "excerpt": {"tr": "Buz altı metanını mikroplara yazan hesabın bir kalemi eksik kalmış. Kuzey Grönland'da bu çalışmanın ölçtüğü değerler düşük, izotoplar ağır ve kaynak jeolojik. Miktar küçük; iklim hesabındaki yeri küçük sayılmaz.", "en": "The account that assigns subglacial methane to microbes has been missing an entry. In North Greenland the values this study measured are low, the isotopes heavy and the source geological. The quantity is small; its place in the climate accounting is not."}, "sections": [{"h": {"tr": "Beklenenin tersi bir sayı", "en": "A number that runs the wrong way"}, "ps": [{"tr": "Kuzey Grönland buz tabakasından boşalan erime sularında metan derişimi 12 ile 20 nanomolar arasında ölçüldü. Bu, aynı buz tabakasının güneybatısında bildirilen değerlerin çok altında: Leverett Buzulu için 270, Isunnguata Sermia için 1.575 nanomolar. Şaşırtıcı olan, kuzey kenarın etkin biçimde gaz veren bir petrol sisteminin üzerinde oturması. Zengin bir kaynağın üzerinde düşük bir derişim duruyor.", "en": "Methane in meltwater draining the North Greenland Ice Sheet was measured at between 12 and 20 nanomolar. That is far below what has been reported from the southwest of the same ice sheet: 270 nanomolar for Leverett Glacier, 1,575 for Isunnguata Sermia. The surprise is that the northern margin sits over an actively degassing petroleum system. A low concentration stands above a rich source.", "refs": ["grn"]}, {"tr": "Düşük olmak sıfır olmak anlamına gelmiyor. Çözümlenen bütün sular atmosfer dengesinin -4,9 nanomolar- yirmi katına varan doygunluk taşıyor; yani bu sular atmosfere net metan veriyor. Örnekleme ise bölgede tipik olarak eylülde biten erime mevsiminin sonunda yapılmış. Yazarlar güneybatı Grönland'da geç mevsim ölçümlerinin doruk döneme göre yaklaşık on kat düşük çıktığını hatırlatıyor. Buradaki sayı bir yıllık ortalama sayılmaz; mevsimin en zayıf ucundan alınmış bir kesittir.", "en": "Being low does not mean being zero. All analysed waters are supersaturated by up to twenty times the atmospheric equilibrium value of 4.9 nanomolar, which makes these waters a net source of methane to the atmosphere. Sampling took place at the end of the melt season, which in this region typically occurs in September. The authors recall that late-season measurements in southwestern Greenland come in about tenfold below peak-season values. This figure does not count as an annual mean; it is a slice taken from the season's weakest end.", "refs": ["grn"]}]}, {"h": {"tr": "İzotop hangi hesabı değiştiriyor", "en": "Which account the isotopes change"}, "ps": [{"tr": "Asıl kanıt derişimde değil, karbonun kendisinde duruyor. Erime sularının karbon izotop değerleri eksi 41,9 ile eksi 35,1 binde arasında. Buz tabakasının başka bölgelerinde bu değer tipik olarak eksi 50 bindenin altında kalıyor ve mikrobiyal üretime işaret ediyor. Buradaki ağır bileşim ile bölgesel jeolojik bağlam birlikte okunduğunda kaynak ağırlıklı olarak termojenik çıkıyor: buz altı mikrobiyal etkinliğinden büyük ölçüde bağımsız, yerin çok daha derininde çok daha önce oluşmuş bir gaz.", "en": "The evidence sits not in the concentration but in the carbon itself. Meltwaters exhibit carbon isotope values from minus 41.9 to minus 35.1 per mil. Elsewhere across the ice sheet that value typically stays below minus 50 per mil and points to microbial production. Read together with the regional geological context, the heavier composition here makes the source predominantly thermogenic: a gas largely independent of subglacial microbial activity, formed far deeper and far earlier.", "refs": ["grn"]}, {"tr": "Bunun pratik karşılığı bir kehanet değil, bir hesap düzeltmesidir. Buz tabakalarının çekilmesiyle açığa çıkacak metanı tahmin eden modeller şimdiye kadar ağırlıklı olarak mikrobiyal üretimi taşıyordu; bu üretim buz altındaki organik madde ve sıcaklık koşullarına bağlı olduğu için belli bir tavanı var. Jeolojik bir hazne farklı davranıyor: buzun bir mühür işlevi gördüğü yerde, mührün kalkması stok tarafından sınırlanıyor, üretim hızı tarafından değil. Yazarlar da buz küresi-karbon geri beslemeleri değerlendirilirken jeolojik metan haznelerinin hesaba katılması gerektiğini vurguluyor. Kuzey kenarda hangi mekanizmanın baskın olduğunu ayırt edecek gözlem belli: aynı havzalarda erime mevsiminin doruğunda yapılacak ölçümlerde hem derişimin hem izotop bileşiminin mevsim içinde nasıl kaydığı.", "en": "The practical consequence is a correction to the account, not a prophecy. Models that estimate methane released as ice sheets retreat have mostly carried microbial production, which depends on organic matter and temperature beneath the ice and therefore has a ceiling. A geological reservoir behaves differently: where ice acts as a seal, lifting the seal is limited by the stock, and not by a production rate. The authors likewise highlight the need to account for geological methane reservoirs when assessing cryosphere-carbon feedbacks. The observation that would separate the two mechanisms at the northern margin is clear: how both concentration and isotope composition shift within the year, measured in the same catchments at the height of the melt season.", "refs": ["grn"]}]}], "sources": [{"key": "grn", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75951-4", "title": {"tr": "Kuzey Grönland buzulunun altındaki metan mikrobiyal değil, jeolojik çıktı", "en": "Methane under the North Greenland Ice Sheet turns out to be geological, not microbial"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-04", "title": {"tr": "Sensöre bilerek kayıplı bir kanal eklediler ve ölçüm keskinleşti", "en": "They added a lossy channel to the sensor on purpose, and the measurement sharpened"}, "excerpt": {"tr": "Kuantum ölçümünde saptama kayıpları uzun süre kaçınılacak bir kusur sayıldı. Bu çalışmanın düzeneğinde kayıp, kaçınılan bir kusur olmaktan çıkıp kullanılan bir bileşene dönüşüyor; Fisher bilgisi üçe katlanıyor.", "en": "In quantum measurement, detection losses have long counted as a defect to avoid. In this study's device, loss stops being a defect to avoid and becomes a component in use; the Fisher information triples."}, "sections": [{"h": {"tr": "Düzeneğin üç parçası", "en": "The three parts of the device"}, "ps": [{"tr": "Birinci parça algılayıcı. Rydberg atomları, çok yüksek uyarılma seviyelerine çıkarıldıklarında büyük dipol momentleri taşır ve zayıf elektrik alanlarını yüksek duyarlıkla hisseder. Bir topluluk halinde kullanıldıklarında 160 nanosaniyelik çok kısa bir mikrodalga darbesi için tek atışta santimetre başına 217 ± 8 mikrovolt duyarlık elde edilmiş. Buradaki iki niteleyici önemli: tek atış, yani tekrarlı ortalama alma yok; ve 160 nanosaniye, yani sinyalin var olduğu süre son derece kısa.", "en": "The first part is the sensor. Rydberg atoms, driven to very high excitation levels, carry large dipole moments and feel weak electric fields with high sensitivity. Used as an ensemble, they reached single-shot precision of 217 ± 8 microvolts per centimetre for a very short 160-ns-long microwave pulse. The two qualifiers matter: single-shot, meaning no repeated averaging, and 160 nanoseconds, meaning the signal exists for a very short time.", "refs": ["ryd"]}, {"tr": "İkinci parça bağlantı. Aynı atomlar birbirleriyle dipol etkileşimi kurar; bu etkileşim çoğu düzenekte bir gürültü kaynağı sayılır, çünkü atomları bağımsız olmaktan çıkarır. Üçüncü parça yordamın kendisi: atomlar arası dipol etkileşimleri, saptama aşamasındaki alışılmış kayıplara karşı bilgiyi koruyan bir hata önleme yordamında kullanılıyor. Böylece sensörün içinde zaten bulunan bir etkileşim, ayrı bir kuantum işlemci kurulmadan bilgi işleme görevi üstleniyor.", "en": "The second part is the coupling. Those same atoms interact through their dipoles, and in most devices that interaction counts as a noise source, because it stops the atoms from being independent. The third part is the protocol itself: inter-atomic dipolar interactions are used in an error-prevention protocol that protects information against conventional losses at the detection stage. An interaction already present inside the sensor thereby takes on information processing, with no separate quantum processor built.", "refs": ["ryd"]}]}, {"h": {"tr": "Ters görünen adım ve geriye kalan yol", "en": "The step that looks backwards, and the road left"}, "ps": [{"tr": "Doğrusal olmayan, kayıplı ek bir kuantum kanalının sisteme katılması ilk bakışta yanlış yönde duruyor. Sezgi, kayıp eklemenin bilgiyi azaltacağını söyler. Ölçülen sonuç tersini veriyor: Fisher bilgisinde üç kat artış. Fisher bilgisi, bir ölçümün bilinmeyen bir parametre hakkında ne kadar şey söyleyebileceğinin üst sınırını verir; üç kat artış, aynı darbeden çıkarılabilecek bilginin üçe katlanması demektir. Eklenen kanal, bilgiyi ayırt edilebilir bir biçime taşıyarak kaybın vurduğu yerden uzaklaştırıyor.", "en": "Introducing an additional non-linear, lossy quantum channel into the system points the wrong way at first glance. Intuition says adding loss should reduce information. The measured result gives the opposite: a threefold enhancement of Fisher information. Fisher information gives the ceiling on how much a measurement can say about an unknown parameter, and a threefold rise means three times as much can be drawn from the same pulse. The added channel carries the information into a distinguishable form and away from where the loss lands.", "refs": ["ryd"]}, {"tr": "Sonuç şu sınırla birlikte okunmalı. Yapılmış olan: laboratuvar koşullarında tek bir alan genliği için, bilinen bir darbe süresinde, sayısı verilmiş bir duyarlık. Yapılmamış olan: farklı frekans bantlarında aynı kazancın sürüp sürmediği, sıcaklık ve manyetik kararsızlık altında yordamın ne kadar dayandığı, ve bağımsız bir grubun aynı düzeneği kurup aynı üç katı ölçmesi. Bir de biçimsel bir uyarı var: makale son düzenlemesi yapılmamış hızlandırılmış ön sürüm olarak yayımlandı ve bağımsız tekrar henüz bildirilmedi. Fikir sağlam görünüyor; sağlamlığın ölçüsü ikinci bir tezgâhta çıkar.", "en": "The result should be read with this boundary. Built: a stated precision, for one field magnitude, at a known pulse length, under laboratory conditions. Not built: whether the same gain holds across other frequency bands, how far the protocol survives thermal and magnetic instability, and whether an independent group can assemble the same device and measure the same factor of three. There is also a formal caveat: the paper appeared as an accelerated preview without final editing, and independent repetition has not yet been reported. The idea looks sound; the measure of soundness comes off a second bench.", "refs": ["ryd"]}]}], "sources": [{"key": "ryd", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76016-2", "title": {"tr": "Bilerek eklenen kayıplı bir kanal, Rydberg atomlu alan sensörünün taşıdığı bilgiyi üçe katladı", "en": "A deliberately lossy channel triples the information a Rydberg-atom field sensor keeps"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-05", "title": {"tr": "Karşılaştırma grubu yoktu ve yazarlar bunu kendileri yazdı", "en": "There was no comparison group, and the authors wrote that down themselves"}, "excerpt": {"tr": "Kırk iki kişilik, tek kollu, aşı öncesi ve sonrası ölçüme dayanan bir çalışma. Böyle bir tasarımla söylenebilecekler dardır. Buradaki ilginç nokta, o darlığın manşetten önce yazarlarca ilan edilmiş olması.", "en": "A single-arm study of forty-two people resting on measurement before and after vaccination. What such a design can say is narrow. The interesting part here is that the narrowness was declared by the authors ahead of any headline."}, "sections": [{"h": {"tr": "Tasarımın taşıyabileceği yük", "en": "What the design can carry"}, "ps": [{"tr": "Çalışma CoCo araştırmasına katılan 42 sağlık çalışanını kapsıyor ve ölçümler aşı öncesi ile sonrası olarak alınmış. Rastgeleleştirme yok, aşılanmamış bir karşılaştırma grubu yok. Katılımcıların önceki aşılamalarının ortancası 4,5 ve yüzde 90'ı en az bir enfeksiyon bildirmiş. Böyle bir toplulukta aşı sonrası yükselen her değer, aşının etkisi kadar zaman içindeki doğal seyrin, mevsimsel karşılaşmanın ve önceki bağışıklığın olgunlaşmasının da toplamıdır. Tasarım bu bileşenleri ayırmıyor; ayırmayı hedeflemiyor.", "en": "The study assessed 42 healthcare workers in the CoCo Study, with measurements taken before and after vaccination. There was no randomisation and no unvaccinated comparison group. Participants had a median of 4.5 previous vaccinations and 90 per cent reported at least one infection. In such a cohort, every value that rises after vaccination is the sum of the vaccine's effect, the natural course over time, seasonal exposure and the maturation of earlier immunity. The design does not separate these components; it does not set out to.", "refs": ["jn1"]}, {"tr": "Başlangıç değerleri, sonuçların nasıl okunacağını da belirliyor. Sıfırıncı günde bağlanma değerleri keskin bir antijenik sıralama gösterdi: Wu01 için 2438, BA.1.1 için 903, XBB.1.5 için 621, JN.1 için 84,1, KP.2 için 46,7, KP.3 için 54,4, XEC için 18,7. Başlangıç değerleri ile kat değişimi arasında ters yönlü bir bağıntı bulundu; en büyük kat artışları tabanın en düşük olduğu varyantlarda çıktı. Bu, tavanla sınırlı bir güçlenmenin beklenen görüntüsüdür ve göreli artışı mutlak kazançla karıştırmamak için yeterli sebeptir. 18,7'den başlayan bir değerin üçe katlanması ile 2438'den başlayan bir değerin aynı oranda artması, bağışıklık açısından aynı şey sayılmaz.", "en": "Baseline values also set how the results should be read. At day zero, binding titres showed a pronounced antigenic gradient: 2438 for Wu01, 903 for BA.1.1, 621 for XBB.1.5, 84.1 for JN.1, 46.7 for KP.2, 54.4 for KP.3, 18.7 for XEC. Baseline values correlated inversely with fold change, and the largest fold increases appeared for the variants with the lowest floor. That is the expected signature of ceiling-limited boosting, and reason enough not to conflate relative increase with absolute gain. Tripling a value that starts at 18.7 and raising a value that starts at 2438 by the same proportion do not count as the same thing immunologically.", "refs": ["jn1"]}]}, {"h": {"tr": "Sınırlılıklar bölümünün hakkını vermek", "en": "Giving the limitations section its due"}, "ps": [{"tr": "Yazarlar sınırlılıklar bölümünde, bu türden çalışmalarda alışılmış olandan daha açık davranıyor. Gözlenen kayışın JN.1 uyarlı hatırlatma dozunun mu yoksa önceki karşılaşmaların oluşturduğu hazırlıklı olgunlaşmanın mı ürünü olduğunu kesin olarak belirleyemediklerini yazıyorlar. Katılımcıların gönüllü sağlık çalışanları olması nedeniyle topluluğun kendi kendini seçme yanlılığı taşıyabileceğini ve genel nüfusu temsil etmeyebileceğini belirtiyorlar. Kritik nokta da şu: JN.1 uyarlı aşının yetkilendirildiği tarihte, önceki karşılaşması az olan bir karşılaştırma topluluğu kurmak uygulamada olanaksızdı.", "en": "In the limitations section the authors behave more frankly than is usual in work of this kind. They write that they cannot definitively determine whether the observed shift was induced by the JN.1-adapted booster or reflects pre-existing anticipatory maturation generated by prior exposures. They state that as participants were healthcare workers who volunteered, the cohort may be subject to self-selection bias and is not necessarily representative of the general population. And the critical point: by the time the JN.1-adapted vaccine was authorised, establishing a comparator cohort with minimal prior exposure was practically impossible.", "refs": ["jn1"]}, {"tr": "Bu sonuncusu bir mazeret sayılmamalı; bir tanıdır. Bir tasarımın ideal olmaması ile o tasarımın seçilebilir olmaması ayrı şeylerdir; dördüncü pandemi yılında karşılaştırma grubu talep etmek, var olmayan bir nüfusu talep etmek anlamına gelir. Doğru soru, çalışmanın kontrolsüz olup olmadığı yerine, kontrolsüz bir çalışmadan çıkarılabilecek sonucun sınırlarına uyulup uyulmadığıdır. Burada uyulmuş: yazarlar boyunca ilişkilendirme dili kullanıyor, mekanizma iddiasını yedi bağışçıdan alınan örneklerin tek hücre dizilemesine dayandırıyor ve nedensel katkıları ayırmak için bağışıklığı olmayan kişilerde ileriye dönük çalışmalara ve tanımlı takvimli kontrollü şemalara ihtiyaç duyulduğunu kendileri söylüyor. Kaç kişide sorusunun cevabı hâlâ kırk iki; ama bu kırk ikiden ne çıkarılabileceği doğru yazılmış.", "en": "That last point should not count as an excuse; it is a diagnosis. A design being less than ideal and a design being available are separate things; demanding a comparison group in the fourth year of a pandemic amounts to demanding a population that no longer exists. The right question, instead of whether the study is uncontrolled, is whether the limits on what an uncontrolled study can conclude were respected. Here they were: the authors use associational language throughout, rest the mechanistic claim on single-cell sequencing of samples from seven donors, and themselves say that prospective studies in antigen-naive individuals and controlled schedules with defined exposure are needed to disentangle the causal contributions. The answer to how many is still forty-two; but what can be drawn from those forty-two has been written down correctly.", "refs": ["jn1"]}]}], "sources": [{"key": "jn1", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76035-z", "title": {"tr": "JN.1 uyarlı hatırlatma dozu yeni hücre çağırmak yerine var olan bellek hücrelerini inceltiyor", "en": "A JN.1-adapted booster refines existing memory B cells instead of recruiting new ones"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-06", "title": {"tr": "Beş bin üç yüz yıl önce Avrasya çoktan tek bir odaydı", "en": "Five thousand three hundred years ago Eurasia was already one room"}, "excerpt": {"tr": "Bir hastalığın soyağacı, insanların birbirine ne kadar yakın olduğunu bir haritadan daha dürüst anlatabiliyor. İskandinavya, Orta Avrupa ve kuzey Çin aynı dallanmada buluşuyor; arada 7.500 kilometreyi aşan bir mesafe ve yalnızca birkaç yüzyıl var.", "en": "The family tree of a disease can tell you how close people were more honestly than a map. Scandinavia, Central Europe and northern China meet at the same branching, with more than 7,500 kilometres between them and only a few centuries."}, "sections": [{"h": {"tr": "Kemikten çıkan mesafe", "en": "The distance that came out of bone"}, "ps": [{"tr": "Bir ekip Doğu Avrasya'dan 8.000-400 yıl öncesine ait 1.400 eski insan kalıntısını taradı ve biri Doğu Asya'dan olmak üzere üç tarih öncesi Yersinia pestis genomu elde etti. Bu üç genom, yayımlanmış 136 eski ve güncel genomla birleştirildiğinde ortaya bir dallanma çıkıyor: yaklaşık 5.300 yıl öncesinde, İskandinavya'yı, Orta Avrupa'yı ve kuzey Çin'i aynı düğüme bağlayan bir nokta. Düşük tek nükleotid uzaklıkları ve uç tarihlendirme, 7.500 kilometreyi aşan bir alanda ayrışmaların yüzyıl ölçeğinde gerçekleştiğine işaret ediyor; en düşük yayılma hızının ortancası yılda 32,9 kilometrelik bir değer veriyor.", "en": "A team screened 1,400 ancient human remains from eastern Eurasia dated 8,000-400 years ago and recovered three prehistoric Yersinia pestis genomes, including one from East Asia. Integrated with 136 published ancient and modern genomes, those three produce a branching: at about 5,300 years ago, a node tying Scandinavia, Central Europe and northern China together. Low single-nucleotide distances and tip-dating indicate splits over century-scale intervals across more than 7,500 kilometres, with a median lower-bound dispersal rate of 32.9 kilometres a year.", "refs": ["pes"]}, {"tr": "Yılda otuz üç kilometrelik bir hız, yürüyerek bir günlük yoldan azdır. Bir ömür boyunca iki bin kilometre eder; on nesilde kıtanın bir ucundan diğerine yeter. Bu sayı hızlı bir felaket resmi çizmiyor. Çizdiği şey daha rahatsız edici: sabit, sıradan, kesintisiz bir temas. Bakteri o mesafeyi tek başına kat etmedi; insanlar, hayvanlar, mallar ve yollar taşıdı.", "en": "A rate of thirty-three kilometres a year is less than a day's walk. Over a lifetime it comes to two thousand kilometres; in ten generations it reaches from one end of the continent to the other. The number does not paint a picture of swift catastrophe. What it paints is more unsettling: steady, ordinary, unbroken contact. The bacterium did not cross that distance alone; people, animals, goods and roads carried it.", "refs": ["pes"]}]}, {"h": {"tr": "Tarih öncesini yeniden çerçevelemek", "en": "Reframing what came before history"}, "ps": [{"tr": "Tarih öncesi topluluklar için kullandığımız kelimeler -izole, yerel, dağınık- büyük ölçüde kanıtın sessizliğinden doğdu. Çanak çömlek ve mezar yavaş taşınır; hastalık ise taşınırken taşıyanı da anlatır. İncelenen yedi derin evre içinde yalnızca LNBA+ soyunun taban dalı, genom genelindeki mutasyon dağılımına kıyasla bozucu genomik yeniden düzenlenmede anlamlı bir yoğunlaşma gösteriyor; buna ymt geninin kazanılması dahil. Bakteri bu ağın içinde yalnızca yolculuk etmedi; yol boyunca kendisi de değişti.", "en": "The words we use for prehistoric communities — isolated, local, scattered — grew largely out of the silence of the evidence. Pottery and graves travel slowly; a disease, while being carried, also describes its carrier. Of the seven deep phases examined, only the basal stem of the LNBA+ lineage shows significant enrichment of disruptive genomic remodeling relative to the genome-wide background distribution of mutation categories, including acquisition of the ymt gene. The bacterium did not merely journey through this network; it was altered along the way.", "refs": ["pes"]}, {"tr": "Buradaki temkin gerçek. Bulgular genomlardan kurulan bir soyağacına dayanıyor, kervan yollarının doğrudan gözlemine değil. Genomlar hangi güzergâhın hangi yönde kullanıldığını söylemiyor; söyledikleri şey, uçların birbirine bağlı olduğu. Yine de bağlantının kendisi yeterince büyük bir kanıt. Bugün bir salgının haftalar içinde kıtaları geçmesini modern dünyaya özgü bir kusur sayma alışkanlığımız var. Bu çalışma, hızın değiştiğini ama örüntünün aynı kaldığını düşündürüyor: beş bin yıldır aynı odadayız, yalnızca ses daha çabuk yayılıyor.", "en": "The caution here is real. The findings rest on a phylogeny built from genomes, and not on direct observation of caravan routes. The genomes do not say which route was used in which direction; what they say is that the ends were connected. Even so, the connection alone counts as large evidence. We are in the habit of treating an epidemic crossing continents in weeks as a defect particular to the modern world. This study suggests the speed changed while the pattern stayed the same: we have been in the same room for five thousand years, and only the sound now travels faster.", "refs": ["pes"]}]}], "sources": [{"key": "pes", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75911-y", "title": {"tr": "Eski genomlar vebayı Doğu Asya'ya taşıdı ve Avrasya yayılımını 5.300 yıl öncesine tarihledi", "en": "Ancient genomes place plague in East Asia and date its Eurasian spread to 5,300 years ago"}, "publishedDate": "2026-07-24"}], "date": "2026-07-25"}, {"writer": "sci-01", "title": {"tr": "Mars'ın küçük manyetik çevrimi ile ALMA'nın ölçtüğü sessizlik", "en": "Mars's small magnetic cycle and the silence ALMA measured"}, "excerpt": {"tr": "Üç MAVEN aygıtı Mars'ın kabuksal manyetik bölgelerinden birinde Dünya'daki Dungey çevriminin küçük bir benzerini yakaladı. Dört arşiv ALMA gözlemi ise iki dar frekans penceresinde aday bulamadı. Gökyüzü bazen işleyişini göstererek, bazen de tam olarak nerede sessiz kaldığını öğreterek büyür.", "en": "Three MAVEN instruments caught a small analogue of Earth's Dungey cycle over one of Mars's crustal magnetic regions. Four archival ALMA observations found no candidate in two narrow frequency windows. The sky expands in two ways: by revealing its machinery, and by teaching us exactly where it remained silent."}, "sections": [{"h": {"tr": "İki gezegende çalışan tek bir döngü", "en": "One cycle running on two worlds"}, "ps": [{"tr": "MAVEN'in manyetometresi, Güneş Rüzgârı Elektron Çözümleyicisi ve STATIC iyon aygıtından gelen veriler, Mars'taki bazı auroraların küçük ölçekli bir Dungey çevrimiyle oluştuğunu gösterdi. Dünya'daki çevrimi de manyetik yeniden bağlanma sürüklüyor; ancak Mars'ın küresel alanı olmadığı için burada süreç, kabuktaki yerel manyetik bölgelerin üzerinde işliyor.", "en": "Data from MAVEN's magnetometer, Solar Wind Electron Analyzer and STATIC ion instrument showed that some Martian auroras form through a small-scale Dungey cycle. Magnetic reconnection also drives the terrestrial cycle, but without a global Martian field the process operates above localized regions of crustal magnetism.", "refs": ["maven"]}, {"tr": "Baş yazar Shaosui Xu, yeniden bağlanmayı beklediklerini; Dungey çevrimine benzeyen düzenin ise sürpriz olduğunu söylüyor. Sonuç, kabuksal manyetik bir bölgenin üzerindeki tek yerel olayı açıklıyor; Mars'a Dünya benzeri küresel bir manyetosfer atfetmiyor ve öteki Mars auroralarının kökenini açık bırakıyor. Üç aygıtın aynı yerel olayı desteklemesi bu dar iddiayı güçlendiriyor.", "en": "Lead author Shaosui Xu says the team expected reconnection, while the Dungey-like pattern surprised them. The result concerns one local event above a crustal magnetic region; it leaves Mars without an inferred Earth-like global magnetosphere and leaves the origins of other Martian auroras open. Agreement among three instruments strengthens that narrow claim.", "refs": ["maven"]}]}, {"h": {"tr": "Sonuçsuz bir tarama da gökyüzünü haritalar", "en": "A null search still maps the sky"}, "ps": [{"tr": "Manchester Üniversitesi'nden Louisa Mason, yalnızca dört arşiv ALMA gözlemindeki 3. Bant verilerini, iki dar frekans penceresinde dar bantlı teknoimza adayları için taradı. Belirlenen eşiklerin üzerinde aday çıkmadı. Milimetre ve milimetre altı dalga boylarındaki bu ilk adımın hükmü yalnızca o veri ve pencerelere uzanıyor; gökyüzünün geri kalanı ile öteki sinyal biçimleri açık duruyor.", "en": "Louisa Mason of the University of Manchester searched Band 3 data from just four archival ALMA observations for narrowband technosignature candidates in two small frequency windows. None exceeded the stated thresholds. This first step at millimeter and submillimeter wavelengths reaches only those data and windows; the rest of the sky and other signal forms remain open.", "refs": ["seti"]}, {"tr": "Galaktik nüfus modellemesi de eski ALMA taramalarının Gaia kataloğundan sayılabilenden çok daha fazla yıldızı kapsayabileceğini gösterdi. Bu sayı model tahmininden geliyor; yıldızlar tek tek gözlenip doğrulanmış sayılmıyor. Sonuçsuz aramanın değeri tam burada: bir keşif ilan etmek yerine hangi veri, frekans ve eşiklerin gerçekten sınandığını kayda geçiriyor.", "en": "Galactic population modeling also suggests that earlier ALMA surveys may encompass many more stars than could be counted in the Gaia catalog, but those are model estimates rather than individually observed and verified stars. That is the value of the null result: it records which data, frequencies and thresholds were actually tested instead of announcing a discovery.", "refs": ["seti"]}]}, {"h": {"tr": "Bulguyu aygıtın sınırıyla okumak", "en": "Reading a finding with its instrument boundary"}, "ps": [{"tr": "İki çalışma farklı türde kanıt üretiyor. MAVEN'de üç aygıt, parçacıklarla manyetik alanın aynı yerel çevrimdeki davranışını birleştiriyor. ALMA'da ise arşiv verisi ve önceden belirlenmiş eşikler, sonuçsuzluğun kapsamını çiziyor. MAVEN mekanizma benzerliğini, ALMA ise açıkça sınırlandırılmış bir sonuçsuzluğu ölçüyor.", "en": "The two studies produce different kinds of evidence. At MAVEN, three instruments connect particle and magnetic-field behavior in one local cycle. At ALMA, archival data and stated thresholds define the scope of an absence. MAVEN measures mechanistic similarity, while ALMA measures a clearly bounded null result.", "refs": ["maven", "seti"]}, {"tr": "Bundan sonraki gözlemler iki aygıt dünyasında farklı yönlere açılıyor. Mars'ta aynı yerel çevrimin başka kabuksal manyetik alanların üzerinde aranması, mekanizmanın ne kadar yaygın olduğunu gösterecek. SETI tarafında daha fazla ALMA gözlemi, daha geniş frekans kapsamı ve farklı sinyal türleri taranan uzayı büyütecek. Her yeni ölçüm, bu iki dar gözlem penceresinden birinin sınırlarını biraz daha ileri taşıyacak.", "en": "The next observations open in different directions across the two instrumental settings. At Mars, searching for the same local cycle above other crustal magnetic fields will show how widely the mechanism operates. For SETI, more ALMA observations, wider frequency coverage and additional signal types will enlarge the search space. Each new measurement will extend the boundary of one of these two narrow observational windows.", "refs": ["maven", "seti"]}]}], "sources": [{"key": "maven", "kind": "news", "name": "NASA", "url": "https://science.nasa.gov/missions/maven/nasas-maven-illuminates-new-understanding-of-auroras-at-mars", "title": {"tr": "NASA'nın MAVEN'i Mars auroralarının Dünya'nınkiyle aynı mekanizmayla oluştuğunu buldu", "en": "NASA's MAVEN finds Mars makes some auroras the way Earth does"}, "publishedDate": "2026-07-23"}, {"key": "seti", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-alien-radio-channel.html", "title": {"tr": "İlk milimetre altı SETI taraması boş çıktı ama aramaya yeni bir frekans bandı açıyor", "en": "First submillimeter SETI search comes up empty but opens a new frequency band"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "sci-02", "title": {"tr": "On altı yıl saklanan doku yeniden çalıştı; klinik sonuç henüz gelmedi", "en": "Tissue stored for sixteen years worked again; the clinical outcome has not arrived"}, "excerpt": {"tr": "İlk insan ototransplantı, dondurulmuş ergenlik öncesi testis dokusunun yeniden damarlandığını ve spermatogenezi başlatabildiğini gösterdi. Tek olgu, tek sperm ve hakem görmemiş sonuç, bunun henüz bir doğurganlık tedavisi olmadığını da gösteriyor.", "en": "The first human autotransplant showed that frozen prepubertal testicular tissue can revascularize and initiate spermatogenesis. A single case, one recovered sperm and an unreviewed result also show why this is not yet a fertility treatment."}, "sections": [{"h": {"tr": "Nakil öncesi iki sperm, nakilden sonra bir sperm", "en": "Two sperm before grafting, one after"}, "ps": [{"tr": "Brüksel ekibi, orak hücre hastalığı tedavisinden önce 2008'de dondurulan ergenlik öncesi testis dokusundan 11 parçayı Aralık 2024'te aynı hastaya geri nakletti. Burada sayıların sırası önemli: nakil günü, işlemden önce hastanın kendi testis dokusunda iki hareketsiz ve biçimi bozuk sperm bulundu. Bir yıl sonra ise testis içindeki greftlerden birinin enzimatik sindiriminde tek bir sperm elde edildi.", "en": "A Brussels team returned 11 fragments of prepubertal testicular tissue frozen in 2008, before treatment for sickle cell disease, to the same patient in December 2024. The sequence of the counts matters: on the transplant day, two immotile, abnormally shaped sperm were found in the patient's native testicular tissue before grafting. One year later, enzymatic digestion recovered a single sperm from one intratesticular graft.", "refs": ["testis", "testis-preprint"]}, {"tr": "Dört testis içi greftin ikisinde aktif spermatogenez izleri görüldü; deri altına yerleştirilen dört bölgede ise germ hücresi bulunmadı. Hastanın azoospermisi sürdü ve izlem boyunca semen ya da hormon ölçümlerinde anlamlı düzelme olmadı. Bu nedenle sonuç, dondurulmuş insan dokusunun işlev kazanabileceğine dair bir varlık kanıtı; gebelik, döllenme ya da rutin klinik yarar kanıtı değil.", "en": "Two of four intratesticular grafts showed evidence of active spermatogenesis, while no germ cells were found at the four subcutaneous sites. The patient's azoospermia persisted, with no significant improvement in semen or hormone measures during follow-up. The result is therefore proof that frozen human tissue can regain function, not evidence of fertilization, pregnancy or routine clinical benefit.", "refs": ["testis-preprint"]}]}, {"h": {"tr": "Bir ilkten tedaviye uzanan boşluk", "en": "The gap between a first and a treatment"}, "ps": [{"tr": "Bu yaklaşımın olası hedef kitlesi, sperm üretemeden önce gonadotoksik tedavi gören ve doku saklayan kişiler. Ancak bu olgudaki sperm sayısı doğal yolla döllenmeye yetmedi; literatür, greftte üretilen spermin çıkış kanallarına bağlanmaması nedeniyle ileride ICSI gibi bir yöntemin gerekebileceğini öngörüyor. Güvenlik de hastalığa göre değişir: kanser öyküsünde saklanan dokuyla kötü huylu hücreleri geri taşıma riski ayrıca değerlendirilmelidir.", "en": "The intended population is people who banked tissue before receiving gonadotoxic treatment and before they could produce sperm. But this case did not yield enough sperm for unassisted fertilization; the literature anticipates that ICSI may be needed because sperm made in a graft may not connect to the normal outflow tract. Safety also depends on the original disease, because stored tissue from some cancer patients could reintroduce malignant cells.", "refs": ["testis-preprint"]}, {"tr": "Çalışma medRxiv'de yayımlanmış, tek hastaya ait bir ön baskı. On altı yıl saklanan doku aktif spermatogenez belirtileri ve tek bir sperm üretti; buna karşılık hastanın azoospermisi sürdü ve döllenme gösterilmedi. Klinik uygulamaya giden yol, başka hastalarda tekrarlanabilirlikten daha fazla olgun ve hareketli sperme, genetik bütünlüğe, döllenmeye ve sağlıklı doğuma kadar uzanıyor. Bugünkü kilometre taşı biyolojik uygulanabilirlik; yerleşik bir tedavi sonucu değil.", "en": "The study is a medRxiv preprint describing a single patient. Tissue stored for sixteen years produced signs of active spermatogenesis and one sperm, while the patient remained azoospermic and no fertilization was demonstrated. The path to clinical use runs through replication in other patients, more mature and motile sperm, genetic integrity, fertilization and healthy births. The present milestone is biological feasibility, not an established treatment outcome.", "refs": ["testis-preprint"]}]}], "sources": [{"key": "testis", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/tansplanted-testicular-tissue-grew-sperm-in-an-infertile-patient", "title": {"tr": "Naklen dokudan üretilen sperm bir ilk, ama sonuç bir ön baskı ve tek hasta", "en": "Sperm grown from transplanted tissue is a first, but the result is a preprint and one patient"}, "publishedDate": "2026-07-23"}, {"key": "testis-preprint", "kind": "news", "name": "medRxiv", "url": "https://www.medrxiv.org/content/10.64898/2026.03.04.26347483v1.full", "title": {"tr": "Çocuklukta gonadotoksik tedaviden sonra olgunlaşmamış insan testis dokusunun ilk başarılı nakli ve testis içi greftlerde tam spermatogenez", "en": "First successful transplant of human immature testicular tissue after gonadotoxic therapy during childhood: complete spermatogenesis in intra-testicular grafts"}, "publishedDate": "2026-03-12"}], "date": "2026-07-24"}, {"writer": "sci-03", "title": {"tr": "Bir üreme mevsimi ve yirmi bin su geleceği", "en": "One breeding season and twenty thousand water futures"}, "excerpt": {"tr": "Coulman Adası'nda karaya oturan buzdağı beslenme yolunu uzatırken yavru sayısı tek mevsimde yaklaşık yüzde 69 düştü. Colorado havzalarında 20 bin senaryo, erken kar erimesinin yüzyıl ortasına uzanan su açığını nasıl büyütebileceğini çiziyor. Biri yaşanmış bir şokun, diğeri olası stres aralığının yönetim saatini kuruyor.", "en": "At Coulman Island, chick numbers fell about 69% in one season as a grounded iceberg lengthened the foraging route. Across the Colorado basins, 20,000 scenarios trace how earlier snowmelt could deepen midcentury water shortfalls. One sets a management clock from an observed shock; the other from a range of possible stress."}, "sections": [{"h": {"tr": "Bir kolonide sessiz bir çöküş", "en": "A quiet collapse in one colony"}, "ps": [{"tr": "Coulman Adası'nda 2025'te 6.658 imparator penguen yavrusu sayıldı; bu sayı hem 2024'e hem de 2017–2024 ortalamasına göre yaklaşık yüzde 69 daha düşük. Uydu görüntüleri, yaklaşık 13,9 kilometre uzunluğundaki bir buzdağını koloninin 3–5 kilometre kuzeyinde karaya oturmuş halde gösterdi. Aynı dönemde tahmini beslenme uzaklığı 9,3 kilometreden 14,9 kilometreye çıktı.", "en": "At Coulman Island, 6,658 emperor-penguin chicks were counted in 2025, about 69% fewer than both 2024 and the 2017–2024 average. Satellite imagery showed an iceberg about 13.9 kilometers long grounded three to five kilometers north of the colony. Over the same period, estimated foraging distance rose from 9.3 to 14.9 kilometers.", "refs": ["penguin"]}, {"tr": "Araştırmacılar, uzayan beslenme yolunun üreme başarısını muhtemelen düşürdüğünü söylüyor. 'Muhtemelen' sözcüğü sonucun parçası: çalışma tek mevsimlik ve gözlemsel; buzdağını deneysel olarak kaldıran bir karşılaştırması yok. Ölçümler önerilen mekanizmayla uyumlu ve yüzde 69'luk düşüşte başka etkenlere de pay bırakıyor.", "en": "The researchers say the longer foraging route likely reduced breeding success. “Likely” is part of the result: the study is observational and covers one season, with no experimental comparison in which the iceberg is removed. The measurements fit the proposed mechanism and leave room for other contributors to the 69% decline.", "refs": ["penguin"]}]}, {"h": {"tr": "Yarılanabilecek bir havza", "en": "A basin that could halve"}, "ps": [{"tr": "Cornell ekibi, Lake Powell'a gelen suyun yaklaşık yüzde 70'ini sağlayan altı Colorado Batı Yamacı havzası için 20.000 senaryo ve toplam 2,1 milyon benzetilmiş yıl üretti. Bazı koşullarda Powell'a akış yaklaşık yüzde 50 düşerken büyük rezervuar depoları tarihsel medyanın yüzde 40–55 altına inebiliyor. Sistematik açıkları en çok erken kar erimesi sürüklüyor.", "en": "A Cornell team generated 20,000 scenarios totaling 2.1 million simulated years for six Colorado West Slope basins that provide about 70% of Lake Powell's inflow. Under some conditions, inflow to Powell falls by roughly 50% and major reservoir storage drops 40–55% below the historical median. Earlier snowmelt is the strongest driver of systematic shortages.", "refs": ["powell"]}, {"tr": "Çalışma yüzyıl ortası için sıcaklık, kar, talep ve yönetim varsayımları değiştikçe açılan olasılık aralıkları üretiyor. Değeri, kesin bir tarih vermekten çok hangi bileşenin sistemi en fazla zorladığını göstermesinde. Erken erime, suyun yıl içindeki zamanlamasını değiştiriyor; bu da aynı yıllık toplam içinde bile depolama ve tahsis kararlarını zorlaştırabiliyor.", "en": "For midcentury, the study produces possibility ranges by varying assumptions about temperature, snow, demand and management. Its value lies less in a single date than in identifying which component puts the most pressure on the system. Earlier melt shifts the timing of water within the year, which can strain storage and allocation even when annual totals look similar.", "refs": ["powell"]}]}, {"h": {"tr": "Gözlem, senaryo ve karar", "en": "Observation, scenario and decision"}, "ps": [{"tr": "Penguen çalışması, aynı dönemde gözlenen üç değişimi bir araya getiriyor: buzdağının konumu, beslenme uzaklığı ve yavru sayısı. Gözlemsel tasarım önerilen fiziksel mekanizmayı destekliyor, fakat düşüşte buzdağının payını diğer etkenlerden ayırmıyor. Havza çalışması ise sıcaklık, kar, talep ve yönetim varsayımlarını değiştirerek akış ile depolamanın olası aralığını haritalıyor. Biri gerçekleşmiş ortak değişimi, diğeri sistemin koşullara duyarlılığını gösteriyor.", "en": "The penguin study brings together three changes observed over the same period: iceberg position, foraging distance and chick count. Its observational design supports the proposed physical mechanism without separating the iceberg's share of the decline from other factors. The basin study instead varies assumptions about temperature, snow, demand and management to map possible ranges for inflow and storage. One shows observed co-movement; the other shows the system's sensitivity to changing conditions.", "refs": ["penguin", "powell"]}, {"tr": "Her iki çalışma da beklemek yerine izlemeyi öne çıkarıyor. Coulman'da sonraki üreme sezonu ve buzdağının konumu, önerilen mekanizmanın sürüp sürmediğini gösterecek. Colorado'da kar erimesi zamanlaması, havza bazında çekişler ve rezervuar depolaması, hangi senaryo ailesine yaklaşıldığını gösterecek. İyi bir erken uyarı, belirsizliği görünür tutar ve kararı değiştirecek göstergeyi söyler.", "en": "Both studies shift attention from passive waiting to monitoring. At Coulman, the next breeding season and the iceberg's position will test whether the proposed mechanism persists. In Colorado, snowmelt timing, basin-level withdrawals and reservoir storage will show which scenario family is becoming more relevant. A useful early warning keeps uncertainty visible and names the indicator that would change a decision.", "refs": ["penguin", "powell"]}]}], "sources": [{"key": "penguin", "kind": "news", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03764-w", "title": {"tr": "Buzdağının koloni-beslenme bağlantısını kısıtlaması Coulman Adası imparator penguen kolonisinde yavru sayısında ciddi düşüşe yol açtı", "en": "Iceberg-driven constraints on colony–foraging connectivity result in severe decline in chick counts for the Coulman Island emperor penguin colony"}, "publishedDate": "2026-07-23"}, {"key": "powell", "kind": "news", "name": "Earth's Future", "url": "https://doi.org/10.1029/2026EF008137", "title": {"tr": "Colorado'nun Batı Yamacı nehir havzalarında mekânsal ölçekler ve sektörler boyunca su açığı sürücülerini çözümlemek", "en": "Unraveling the Drivers of Water Shortage Across Spatial Scales and Sectors in Colorado's West Slope River Basins"}, "publishedDate": "2026-07-13"}], "date": "2026-07-24"}, {"writer": "sci-04", "title": {"tr": "Kuantum kenarını dengelemek ve ısıya kristalde yol vermek", "en": "Balancing a quantum edge and giving heat a path through a crystal"}, "excerpt": {"tr": "Kuantum anormal Hall düzeni 4,2 kelvinde daha dayanıklı hale geldi, fakat standart değer henüz gerekli doğrulukla ölçülemedi. Bor arsenürdeki fonon odaklanması da ısı kontrolüne yeni bir yol açıyor; aygıta değil.", "en": "Quantum anomalous Hall transport became more robust at 4.2 kelvin, but the standard value still could not be measured there at the required accuracy. Phonon focusing in boron arsenide opens a route to heat control, not yet a device."}, "sections": [{"h": {"tr": "Kenarları dengeleyen devre", "en": "The circuit that balances the edges"}, "ps": [{"tr": "Kuantum anormal Hall etkisi, dış manyetik alan olmadan bir malzemenin kenarlarında kuantalanmış akım taşıyabiliyor; ancak manyetik topolojik yalıtkanlarda bu düzen genellikle 100 milikelvinin altında ve küçük akımlarda korunuyor. Würzburg ekibi, iki kenarın elektrokimyasal potansiyelini basit bir devreyle dengeleyerek kuantalanmış kenar taşınımını 4,2 kelvinde ve daha yüksek akımlarda daha kararlı hale getirdi.", "en": "The quantum anomalous Hall effect can carry quantized current along a material's edges without an external magnetic field, but in magnetic topological insulators that regime usually survives only below about 100 millikelvin and at small currents. A Würzburg team used a simple circuit to balance the electrochemical potential of the two edges, stabilizing quantized edge transport at 4.2 kelvin and at higher currents.", "refs": ["topo"]}, {"tr": "Buradaki mühendislik içgörüsü, malzemeyi baştan yapmak yerine ölçüm düzenindeki asimetriyi azaltmak. Devre, kenarlardan birinin diğerinden daha fazla elektrik alan görmesini önlüyor; böylece kuantalanmış rejimin bozulduğu akım eşiği yükseliyor. Bu, temel etkinin yeni bir keşfi değil, onu daha az kırılgan kılan bir kontrol katmanı.", "en": "The engineering insight is to reduce asymmetry in the measurement setup rather than remake the material. The circuit prevents one edge from experiencing a larger electric field than the other, raising the current threshold at which the quantized regime breaks down. It is not a new discovery of the underlying effect, but a control layer that makes it less fragile.", "refs": ["topo"]}]}, {"h": {"tr": "4,2 kelvin başarısının ölçüm sınırı", "en": "The measurement limit at 4.2 kelvin"}, "ps": [{"tr": "Sonuç, h/e² kuantum direnç değerinin 4,2 kelvinde metroloji doğruluğuyla doğrudan ölçüldüğü anlamına gelmiyor. Araştırmacılar, ek iletkenlik nedeniyle o sıcaklıkta gereken kesinlikte doğrudan ölçüm yapamadıklarını belirtiyor. Gösterdikleri şey, dengeleme altında kuantalanmış kenar taşınımının sıcaklık ve akıma karşı daha dayanıklı hale gelmesi.", "en": "The result does not mean that the quantum resistance value h/e² was directly measured at 4.2 kelvin with metrological accuracy. The researchers state that additional conductivity still prevents a direct measurement at the required precision at that temperature. What they demonstrate is that balanced quantized edge transport becomes more robust against temperature and current.", "refs": ["topo"]}, {"tr": "Bu ayrım, gösteri ile teslimat arasındaki mesafeyi doğru kuruyor. Sıvı helyum sıcaklığında daha dayanıklı bir rejim, çok daha karmaşık milikelvin soğutmaya bağımlılığı azaltabilir. Fakat bir direnç standardı olmak için yalnızca platonun görünmesi değil; h/e² değerinin belirsizlik bütçesi içinde tekrarlanarak ölçülmesi gerekir. Sıradaki eşik, tam olarak bu metrolojik doğrulama.", "en": "That distinction locates the distance between demonstration and deliverable. A more robust regime at liquid-helium temperature could reduce dependence on much more complex millikelvin cooling. But a resistance standard requires more than a visible plateau: h/e² must be measured reproducibly within a metrological uncertainty budget. That validation is the next threshold.", "refs": ["topo"]}]}, {"h": {"tr": "Işın gibi ilerleyen ısı", "en": "Heat that travels like a ray"}, "ps": [{"tr": "UCLA ekibi, bor arsenür kristalinde oda sıcaklığında ışın benzeri sıcaklık desenleri ölçtü. İlk ilke Boltzmann taşınım benzetimleriyle uyuşan desenler, uzun yayılım mesafesine sahip denge dışı fononların kristal yönelimine bağlı olarak uzayda yeniden dağılmasından kaynaklanıyor. Ekip aynı simetriyi birden çok örnekte doğruladı; fonon odaklanması daha önce deneysel olarak kriyojenik sıcaklıklarla sınırlıydı.", "en": "A UCLA team measured ray-like temperature patterns in boron arsenide at room temperature. Matching first-principles Boltzmann-transport simulations, the patterns arise as nonequilibrium phonons with long propagation lengths redistribute according to crystal orientation. The team validated the symmetry across multiple samples; experimental phonon focusing had previously been limited to cryogenic temperatures.", "refs": ["qheat"]}, {"tr": "Deney, nanoskopik sıcaklık haritalamayla oda sıcaklığında yönelime bağlı fonon taşınımını gösteriyor; henüz tamamlanmış bir soğutma aygıtı sunmuyor. Bir yongaya entegrasyon, üretilebilir kristal geometrisi, arayüz kayıpları ve gerçek yük altında ısı uzaklaştırma henüz sınanmadı. Uygulamaya giden en güvenilir yol, önce aynı odaklanmayı aygıt ölçeğinde ve tekrarlı ısı çevrimlerinde koruyabilmek.", "en": "Nanoscale temperature mapping demonstrates orientation-dependent phonon transport at room temperature; it does not yet provide a finished cooling device. Chip integration, manufacturable crystal geometry, interface losses and heat removal under real loads remain untested. The most credible route to an application starts by preserving the same focusing at device scale and through repeated thermal cycles.", "refs": ["qheat"]}]}], "sources": [{"key": "topo", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75851-7", "title": {"tr": "Kuantum anormal Hall yalıtkanında kuantum adyabatik taşınım", "en": "Quantum adiabatic transport in a quantum anomalous Hall insulator"}, "publishedDate": "2026-07-23"}, {"key": "qheat", "kind": "news", "name": "Nature Physics", "url": "https://www.nature.com/articles/s41567-026-03335-y", "title": {"tr": "Oda sıcaklığında fonon odaklanması", "en": "Phonon focusing at room temperature"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "sci-05", "title": {"tr": "Uyuyan balinanın nefesini ses, hareket ve model birlikte görünür kıldı", "en": "Sound, movement and a model made a sleeping whale's breath visible"}, "excerpt": {"tr": "Vantuzlu etiketler kabarcık sesini ve üç boyutlu hareketi aynı anda yakaladı. Doku yoğunluğu, sürtünme ve gaz hacmini birleştiren model, bu kabarcık bırakma davranışının dinlenen ispermeçet balinalarını yüzeyin altında tutacak kadar yüzerliği azaltabildiğini gösteriyor. Ölçüm ile modelin nerede ayrıldığı, sonucun gücünü de sınırını da belirliyor.", "en": "Suction-cup tags captured bubble sounds and three-dimensional movement at the same time. A model combining tissue density, drag and gas volume shows that those releases could reduce buoyancy enough to keep resting sperm whales below the surface. Where observation ends and modeling begins defines both the result's strength and its limit."}, "sections": [{"h": {"tr": "Etiket neyi doğrudan gördü?", "en": "What did the tag observe directly?"}, "ps": [{"tr": "Noémie Freymond, Alison Burslem ve Patrick Miller, Norveç açıklarındaki ispermeçet balinalarına ses ile üç eksenli hareketi kaydeden vantuzlu etiketler taktı. Böylece aynı zaman çizelgesinde hem bırakılan kabarcıkların ses izini hem de hayvanın derinlik, yönelim ve yükselme hareketini izleyebildiler. Doğrudan gözlenen çekirdek, bir kabarcık sesinin belirli bir dinlenme hareketiyle yan yana gelmesi.", "en": "Noémie Freymond, Alison Burslem and Patrick Miller attached suction-cup tags to sperm whales off Norway that recorded sound and three-axis movement. The same timeline could therefore hold the acoustic trace of a bubble release alongside the animal's depth, orientation and upward motion. The directly observed core is the coincidence of a bubble sound with a particular resting movement.", "refs": ["whale-buoyancy"]}, {"tr": "Kabarcık bırakma örüntüsü dinlenme yoluna göre değişti. Yüzeye yakın evrelerde hayvanlar yaklaşık 11 kez kabarcık bıraktı; 200 metreden daha derindeki dalışlardan yükselirken dinlenenler ise bunu üç ya da dört kez yaptı. Bu fark, derinlik arttıkça sıkışan akciğer gazının yüzerliğe daha az katkı vermesiyle uyumlu. Sayımlar davranışı gösteriyor, fakat hayvanın o anda taşıdığı toplam gaz miktarını doğrudan ölçmüyor.", "en": "Release patterns changed with the route into rest. Animals in near-surface bouts released bubbles about 11 times, while those resting during ascents from dives deeper than 200 meters released them three or four times. That contrast is consistent with lung gas contributing less buoyancy after compression at depth. The counts establish behavior, while leaving the animal's total onboard gas volume unmeasured.", "refs": ["whale-buoyancy"]}]}, {"h": {"tr": "Model hangi boşluğu doldurdu?", "en": "Which gap did the model fill?"}, "ps": [{"tr": "Araştırmacılar gözlenen hareketi doku yoğunluğu, sudaki sürtünme ve vücuttaki gaz hacimleriyle bir yüzerlik modeline bağladı. Model, dinlenme dalışlarının derin avlanma dalışlarından daha az gazla başladığına ve salınan kabarcıkların pozitif yüzerliği azaltarak hayvanı yüzeyin altında tutabildiğine işaret etti. Bu bölüm bir sensör okuması değil; ölçülen hareketi fiziksel kuvvetlerle açıklayan hesaplanmış bir çıkarım.", "en": "The researchers linked the observed motion to a buoyancy model built from tissue density, drag in water and onboard gas volumes. The model indicates that rest dives begin with less gas than deep foraging dives and that releasing bubbles can reduce positive buoyancy enough to keep an animal submerged. This part is a calculated inference that explains measured movement through physical forces, rather than a sensor reading of gas volume.", "refs": ["whale-buoyancy"]}, {"tr": "Yöntem zincirinin gücü iki veri türünün aynı fiziksel açıklamaya yaklaşmasında. Ses izi, kabarcığın bırakıldığı anı; hareket verisi, hayvanın cevabını; model ise bu cevabı üretebilecek kuvvet dengesini veriyor. Zincirin zayıf halkası da burada görünür: doku yoğunluğu ve başlangıç gazı gibi model girdileri doğrudan her hayvanda ölçülmediğinde, farklı makul değerlerin sonucu ne kadar değiştirdiği açıkça sınanmalı.", "en": "The method is strongest where two data streams converge on one physical explanation. Audio timestamps the release, movement records the animal's response, and the model supplies the force balance capable of producing that response. Its vulnerable link is equally visible: when inputs such as tissue density and starting gas volume are not measured directly in every animal, the analysis must show how alternative plausible values change the conclusion.", "refs": ["whale-buoyancy"]}]}, {"h": {"tr": "Bir sonraki çalışma neyi ayırmalı?", "en": "What should the next study separate?"}, "ps": [{"tr": "İki biyolojik soru fiziksel açıklamanın dışında kalıyor. Kabarcık bırakmak uyku sırasında bilinçli bir ayar mı, otomatik bir refleks mi? Bu davranış yalnızca yüzerliği mi düzenliyor, yoksa dokulardan akciğere geçen karbondioksit ya da azotun atılmasına da yardım ediyor mu? Etiket verisi bu olasılıkları birbirinden seçmiyor; çalışma bunları yeni deneylerin hedefi olarak bırakıyor.", "en": "Two biological questions remain outside the physical explanation. Is bubble release a conscious adjustment during sleep or an automatic reflex? Does it regulate buoyancy alone, or also help expel carbon dioxide or nitrogen transferred from tissues to the lungs? The tag data do not distinguish among those possibilities, leaving them as targets for new experiments.", "refs": ["whale-buoyancy"]}, {"tr": "Güçlü bir tekrar, daha çok hayvanı ve farklı dinlenme derinliklerini aynı ses-hareket protokolüyle izler; model varsayımlarını önceden belirler ve sonuçların bu varsayımlara duyarlılığını yayımlar. Solunum ya da gaz bileşimine ilişkin bağımsız bir ölçüm eklenebilirse, yüzerlik ayarı ile metabolik gaz değişimi de ayrıştırılabilir. Buradaki ölçüt aynı anlatıyı yeniden kurmak değil, gözlemden modele uzanan her bağlantıyı ayrı ayrı zorlamaktır.", "en": "A strong replication would follow more animals across different resting depths with the same audio-motion protocol, prespecify model assumptions and publish how sensitive the result is to those assumptions. An independent respiratory or gas-composition measure could also separate buoyancy control from metabolic gas exchange. The standard is not to retell the same account, but to stress each link from observation to model in turn.", "refs": ["whale-buoyancy"]}]}], "sources": [{"key": "whale-buoyancy", "kind": "news", "name": "Journal of Experimental Biology", "url": "https://journals.biologists.com/jeb/article-lookup/doi/10.1242/jeb.251920", "title": {"tr": "İstirahat eden ispermeçet balinaları, dik uyumak için gaz kabarcıkları salıyor", "en": "Resting sperm whales release gas bubbles to sleep upright"}, "publishedDate": "2026-07-23"}], "date": "2026-07-24"}, {"writer": "sci-06", "title": {"tr": "Bitkinin bağışıklığına yeni hedefler yazmayı öğrendik", "en": "We have learned to write new targets into plant immunity"}, "excerpt": {"tr": "Bir pirinç bağışıklık alıcısının tanıma yuvası değiştirildi ve 391 sentetik tasarımın 71'i canlı hücrede yanıt verdi. Yüzde 18,2'lik ilk tur kusursuz makine vaadi sunmuyor; hesaplamalı tasarımın bitkinin kendi evrimiyle konuşmaya başladığı eşiği gösteriyor. Tarla hâlâ uzakta; yine de savunmayı miras alınan bir özellikten daha geniş düşünmeye başlayabiliriz.", "en": "A recognition socket in a rice immune receptor was replaced, and 71 of 391 synthetic designs responded in living cells. The 18.2% first pass is no promise of a flawless machine; it marks the threshold at which computational design begins to converse with the plant's own evolution. The field is still distant, yet defense no longer has to be imagined only as an inherited trait."}, "sections": [{"h": {"tr": "Savunmaya yeni bir hedef öğretmek", "en": "Teaching defense a new target"}, "ps": [{"tr": "Bir bitkinin savunması, geçmiş kuşaklardan kalmış alıcıların tanıyabildiği tehditlerle başlar. Gao Caixia'nın ekibi bu mirasın küçük bir parçasını değiştirilebilir bir yuvaya çevirdi. Pirincin Pikm-1 adlı hücre içi bağışıklık alıcısındaki kompakt “bütünleşik tuzak” bölgesini koruyucu devreden ayırmadan, AlphaFold 3 ve BindCraft ile tasarlanan yeni bağlayıcıları bu bölgeye yerleştirdi. Sinyal altyapısı yerinde kaldı; kapının hangi patojen proteinine açıldığı değişti.", "en": "A plant's defense begins with threats that receptors inherited from earlier generations can recognize. Gao Caixia's team turned a small part of that inheritance into a replaceable socket. They placed new binders designed with AlphaFold 3 and BindCraft into the compact “integrated decoy” domain of the rice intracellular immune receptor Pikm-1 without discarding its defensive circuitry. The signaling architecture stayed in place while the pathogen protein able to open the door changed.", "refs": ["spirs"]}, {"tr": "Platform virüs, bakteri, mantar ve oomiset proteinlerini hedefleyen 391 sentetik alıcı üretti. Bunların 71'i hedefini tanıyıp bağışıklık yanıtını başlattı. Sayı ilk bakışta bir eleme tablosu gibi görünebilir, ama açtığı ufuk daha büyük: yeni bir tehdit ortaya çıktığında doğada hazır bir alıcı aramakla yetinmek yerine, bitkinin mevcut savunma dili için yeni bir tanıma sözcüğü tasarlanabilir. Canlı sistem bu sözcüğü kabul ettiğinde geri kalan cümleyi kendi kuruyor.", "en": "The platform produced 391 synthetic receptors aimed at proteins from viruses, bacteria, fungi and oomycetes. Seventy-one recognized their targets and activated an immune response. The count may look like a screening table, yet the opening is larger: when a new threat appears, researchers may be able to design a new word of recognition for the plant's existing defensive language instead of searching only for a receptor already present in nature. Once the living system accepts that word, it writes the rest of the sentence.", "refs": ["spirs"]}]}, {"h": {"tr": "Yetmiş bir çalışan tasarımın anlattığı şey", "en": "What seventy-one working designs tell us"}, "ps": [{"tr": "İlk turda çalışan 71 alıcı, tasarımların yüzde 18,2'sine karşılık geliyor. Diğerlerinin bir bölümü hedef ortada yokken savunmayı başlattı, bir bölümü hedef geldiğinde sessiz kaldı. Yaşam, bilgisayarda uygun görünen şekle hücre içindeki eşikler, hareket ve gerilimlerle cevap verdi; tasarıma kendi koşullarını ekledi. Yine de başarısız görünen yüzlerce deneme, sistemin nereye dokunulacağını gösteren bir arama alanına dönüştü.", "en": "The 71 receptors that worked on the first pass represented 18.2% of the designs. Some of the others triggered defense with no target present; some stayed silent when the target arrived. Life answered the computer's plausible shape with thresholds, motion and tensions inside the cell, adding its own conditions to the design. Even so, hundreds of apparent failures became a search space showing where the system could be tuned.", "refs": ["spirs"]}, {"tr": "Ekip GRAPE ile zayıf tasarımları bitkinin içinde çeşitlendirip yeniden seçti; bağışıklık etkinliği yükselirken kendiliğinden etkinleşme azaldı. Hesapla yaşam arasındaki ilişkinin en ilginç yanı bu geri dönüş. Model ilk cümleyi kuruyor, canlı hücre cevap veriyor, evrim taslağı düzeltiyor. Buradaki programlama tek seferlik bir emirden çok, canlı sistemle sürdürülen yinelemeli bir konuşma.", "en": "The team used GRAPE to diversify and reselect weak designs inside the plant; immune activity rose while spontaneous activation fell. That return path is the most intriguing part of the relationship between computation and life. The model writes the opening line, the living cell answers, and evolution revises the draft. Programmability here is less a one-shot command than an iterative conversation with a living system.", "refs": ["spirs"]}]}, {"h": {"tr": "Bu yetenek tarlaya ulaştığında kimin geleceğini değiştirecek?", "en": "Whose future changes if this capability reaches the field?"}, "ps": [{"tr": "İlk köprü laboratuvarın içinde kuruldu. Optimize edilmiş sentetik alıcıları taşıyan transgenik Nicotiana benthamiana bitkileri, Tomato brown rugose fruit virus ile karşılaştırıldığında direnç gösterdi. Alıcının iskeleti pirinçten geliyor; virüse karşı bildirilen başarı ise araştırmada sık kullanılan bu model bitkide elde edildi ve pirinç tarlası sınaması ileride duruyor. Bu yüzden ufuk genişlerken mesafe de görünür kalıyor: hedef ürün, değişken hava ve evrimleşen patojen henüz sınanmadı.", "en": "The first bridge was built inside the laboratory. Transgenic Nicotiana benthamiana plants carrying optimized synthetic receptors resisted tomato brown rugose fruit virus. The receptor chassis comes from rice; the reported success came in this commonly used model plant, with a rice-field test still ahead. The horizon expands with the distance still visible: the target crop, variable weather and an evolving pathogen have yet to be tested.", "refs": ["spirs"]}, {"tr": "Durup düşün: yeni bir patojen belirdiğinde ilk alıcının haftalar içinde tasarlanabilmesi neyi değiştirir? Bugün elimizde tasarım döngüsü var; hedef üründe etkinlik, büyüme bedeli, farklı çevrelerde dayanıklılık, patojenin kaçışı ve düzenleyici değerlendirme hâlâ önümüzde. Yine de açılan olasılık somut: bitki savunması, yalnızca geçmişten devraldığımız bir özellik olmaktan çıkıp canlı sistemle birlikte yeniden yazabildiğimiz bir yeteneğe dönüşebilir. Bu geleceğin değeri hangi ürünlere, çiftçilere ve bölgelere ulaştığıyla ölçülecek.", "en": "Pause over the possibility: what changes if the first receptor for a new pathogen can be designed within weeks? For now we have a design cycle; efficacy in the target crop, growth costs, durability across environments, pathogen escape and regulatory review still lie ahead. Yet the opening is concrete: plant defense could move from being only an inherited trait to a capability we rewrite with a living system. The value of that future will be measured by which crops, farmers and regions it reaches.", "refs": ["spirs"]}]}], "sources": [{"key": "spirs", "kind": "news",
