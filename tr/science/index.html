şbirliğinin örgü QCD hesabı 2021'de müonun bilinen fizikle tam uyumlu salındığını gösterdi; sonuç Fermilab'ın güncellenmiş ölçümüyle aynı gün açıklandı.", "en": "For a quarter of a century the muon's magnetic wobble sat about one part in a million away from theoretical prediction, and that deviation was taken as a hint of undiscovered particles. In 2021 the Budapest-Marseille-Wuppertal collaboration's lattice QCD calculation showed the muon wobbling exactly as known physics requires, and the result was released the same day as Fermilab's updated measurement.", "refs": ["muon"]}, {"tr": "Aynı sayıya ikinci bir yoldan varılıyor. Alex Keshavarzi ve arkadaşlarının Haziran 2020'de yayımladığı veri temelli öngörü, kuarkların davranışını elektron-pozitron çarpışmalarından çıkarıyordu ve Fermilab'ın Nisan 2021 ölçümüyle o kadar keskin biçimde çelişti ki yeni parçacık keşfi için gereken katı eşiğe neredeyse dayandı. Örgü hesabı bu çelişkiyi çözmedi; yerini değiştirdi.", "en": "The same number can be reached by a second route. The data-driven prediction published by Alex Keshavarzi and colleagues in June 2020 inferred quark behaviour from electron-positron collisions, and it clashed with Fermilab's April 2021 measurement so sharply that it nearly reached the stringent threshold required to claim a new particle. The lattice calculation did not dissolve that clash; it moved where the clash sits.", "refs": ["muon"]}]}, {"h": {"tr": "Yükü taşıyan ölçüm", "en": "The measurement left carrying the weight"}, "ps": [{"tr": "Veri temelli yol, elektron-pozitron çarpışmalarındaki pion üretim oranlarının ölçümüne dayanıyor. Novosibirsk'teki VEPP-2000 çarpıştırıcısında 2023'te yeni bir algılayıcı kurulup oranlar yeniden ölçüldüğünde, değerler belirgin biçimde değişti. Liverpool Üniversitesi'nden Fedor Ignatov bunu \"It was a surprise. No one expected it to be like that\" sözleriyle anlatıyor. BABAR çarpıştırıcısının 2023 çözümlemesi ise eski oranla çarpıcı bir uyum içinde.", "en": "The data-driven route depends on measurements of pion production rates in electron-positron collisions. When a new detector was installed at the VEPP-2000 collider in Novosibirsk in 2023 and the rates were measured again, the values changed significantly. Fedor Ignatov of the University of Liverpool describes it this way: \"It was a surprise. No one expected it to be like that\". The BABAR collider's 2023 analysis, meanwhile, sits in striking agreement with the older rate.", "refs": ["muon"]}, {"tr": "Bir kuramsal hesabın deneyle buluşması, uyuşmazlığı kuram ile ölçüm arasından çıkarıp ölçümlerin kendi arasına taşıdı: şimdi ayrışan şey iki yöntem yerine aynı yöntemi besleyen girdilerdir. Bilinmeyen bir parçacık bunun tek açıklaması sayılmaz; onlarca yıla yayılmış deneyler arasındaki gözden kaçmış yöntem ayrımları da aynı ayrışmayı üretebilir ve o durumda Standart Model'e dokunmak gerekmez.", "en": "A theoretical calculation meeting the experiment carried the disagreement out from between theory and measurement and set it down among the measurements themselves: what now diverges is one method's own inputs rather than two rival methods. An unknown particle counts as only one account of this. Overlooked procedural differences between experiments spread across decades could produce the same divergence, and in that case nothing in the Standard Model needs touching.", "refs": ["muon"]}]}, {"h": {"tr": "Neye bakılacak", "en": "What to watch"}, "ps": [{"tr": "Keshavarzi, VEPP-2000 sonucundan daha çok incelenmiş bir ölçüm bulunmadığını ve şimdiye dek bir sorun saptanmadığını söylüyor; kendi özeti de bunu doğruluyor: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" Bakılacak yer, bağımsız bir pion oranı ölçümünün VEPP-2000'in yeni değerine mi yoksa BABAR ile eski ölçümlerin oluşturduğu kümeye mi düşeceğidir. Müonun kendi sayısı bir süre daha aynı kalabilir; ona giden yolun iki ucu birbirine yaklaşmadan hangi tarafta yeni fizik olduğu söylenemez.", "en": "Keshavarzi says no measurement has been scrutinised more than VEPP-2000's and that so far no problems have been found; his own summary bears it out: \"There are four decades of measurements...all done in different ways...that all paint a completely different picture.\" What to watch is whether an independent measurement of the pion rate lands on VEPP-2000's new value or in the cluster formed by BABAR and the older results. The muon's own number may hold steady for a while yet; until the two ends of the road leading to it converge, no one can say which side holds new physics.", "refs": ["muon"]}]}], "sources": [{"key": "muon", "kind": "news", "name": "Quanta Magazine", "url": "https://www.quantamagazine.org/physicists-solve-a-muon-mystery-now-old-results-dont-add-up-20260729", "title": {"tr": "Müondaki 25 yıllık açığı kapatan hesap, kırk yıllık pion ölçümlerini birbiriyle çelişkide bıraktı", "en": "The calculation that closed a 25-year muon gap has left four decades of pion measurements in conflict"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Çocukluk kokusunun izi, koku soğanında doğum sonrası hücrelerde bulundu", "en": "The trace of a childhood scent was found in postnatal cells of the olfactory bulb"}, "excerpt": {"tr": "Ankete 647 kişi katıldı. Nedensel adım ise farede atıldı: doğumdan sonraki ilk gün oluşan granül hücreleri ışıkla susturulunca hayvanın kokuya ilgisi düştü.", "en": "647 people took part in the survey. The causal step was taken in the mouse: when granule cells formed on the first day after birth were silenced with light, the animal's interest in the odour fell."}, "sections": [{"h": {"tr": "İki ayrı kanıt, iki ayrı tür", "en": "Two kinds of evidence, two species"}, "ps": [{"tr": "Çalışma iki koldan yürüdü. Ankete 647 kişi katıldı ve çocukluğunun hoş kokularını bildirdi. Fareler ise doğum sonrası 23–33. günler arasında, insanda erken çocukluğa karşılık gelen dönemde, çekici kokularla zenginleştirilmiş bir ortamda tutuldu.", "en": "The study ran along two tracks. 647 people took part in the survey and reported the pleasant smells of their childhood. Mice, for their part, were kept in an environment enriched with attractive odorants between postnatal days 23 and 33, the period corresponding to early childhood in humans.", "refs": ["smell"]}, {"tr": "Yetişkin farede anının geri çağrılması, doğumdan sonraki ilk gün oluşan granül hücrelerine bağlı çıktı. Ekip bu hücreleri halorodopsin taşıyan bir lentivirüsle işaretleyip 561 nanometre ışıkla susturdu; kokuya ayrılan inceleme süresi düştü, alışma eğrisi dikleşti ve tercih göstergesi geriledi. Grup büyüklükleri 18 ve 12 hayvandı.", "en": "In the adult mouse, recall of the memory turned out to depend on granule cells formed on the first day after birth. The team labelled those cells with a lentivirus carrying halorhodopsin and silenced them with light at 561 nanometres; investigation time devoted to the odorant fell, the habituation slope steepened and the preference index declined. Group sizes were 18 and 12 animals.", "refs": ["smell"]}]}, {"h": {"tr": "İki açıklama yarışıyor", "en": "Two accounts in competition"}, "ps": [{"tr": "Yazarların önerdiği mekanizma, erken kokunun ödül sistemiyle artan bağlantı üzerinden koku soğanına yerleşmesidir. Scientific American'ın aktardığı biçimde granül hücreleri haz ve ödül bölgeleriyle ayrıcalıklı bağlantılar kuruyor, böylece erken koku çocuklukta damgalanıyor.", "en": "The mechanism the authors propose is that the early odorant settles into the olfactory bulb through increased connectivity with the reward system. As Scientific American puts it, granule cells make privileged connections with pleasure and reward areas, so the early scent becomes imprinted in childhood.", "refs": ["smell"]}, {"tr": "Işıkla susturmanın ardından değişen davranış, ödül üzerinden kurulan bir damgalanmanın kesilmesiyle açıklanabilir. Aynı sonuç, erken kokunun yalnızca tanıdık olmasından da doğabilir; granül hücreleri kapatıldığında aşinalığı okuyan yol da kapanır ve inceleme süresi yine düşer. İki açıklamayı ayırmak, hazzı ve aşinalığı birbirinden bağımsız sınamayı gerektirir.", "en": "The behaviour that changes after silencing with light can be explained by the interruption of an imprint established through reward. The same outcome could also arise from the early odorant being merely familiar; when granule cells are shut off, the route that reads familiarity closes too and investigation time falls just the same. Separating the two accounts requires testing pleasure and familiarity independently of one another.", "refs": ["smell"]}]}, {"h": {"tr": "Kimin için ne değişir", "en": "Whose life this changes"}, "ps": [{"tr": "Bu araştırmadan kliniğe bugün taşınabilecek bir uygulama çıkmıyor. Scientific American'ın derlediği iki uyarı da bunu destekliyor: AgroParisTech-INRAE'den Hervé This çalışmanın ağırlıkla olumlu anılara odaklandığını söylüyor, Buckingham Üniversitesi'nden Luca Turin ise kokunun ayrıksılığının görünürde kalabileceğini savunuyor. Yaşlanan farede anının sürmesi için kokunun aralıklarla yeniden verilmesi gerekiyor ve doğum sonrası hücreler devreden çekilirken limbik bağlantılar güçleniyor. İnsanda karşılığı olan soru budur: erken kokuya yeniden maruz kalmak, yaşlanmayla zayıflayan bir anıyı ayakta tutar mı?", "en": "Nothing in this research can be carried into the clinic today. The two cautions Scientific American gathered support that reading: Hervé This of AgroParisTech-INRAE says the work focused largely on positive memories, while Luca Turin of the University of Buckingham argues smell's distinctiveness may be only apparent. In the ageing mouse, the memory persists only if the odorant is presented again periodically, and as the postnatal cells disengage the limbic connections strengthen. That is the question with a human counterpart: does re-exposure to an early scent hold up a memory that ageing weakens?", "refs": ["smell"]}]}], "sources": [{"key": "smell", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories", "title": {"tr": "Farelerde koku soğanı granül hücrelerinin susturulması, çocukluk koku tercihini değiştirdi", "en": "Silencing olfactory-bulb granule cells in mice changed a childhood scent preference"}, "publishedDate": "2026-07-29", "primary": {"kind": "paper", "name": "PLOS Biology", "url": "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3003845", "publishedDate": "2026-07-14", "title": {"tr": "Olumlu erken yaşam koku anısı koku soğanında kökleniyor ve koku sisteminin ötesinde geniş ölçekli değişiklikleri tetikliyor", "en": "Positive early-life olfactory memory is rooted in the olfactory bulb and triggers large-scale changes beyond the olfactory system"}}}], "date": "2026-07-30"}, {"writer": "sci-03", "title": {"tr": "Demirle gübreleme için en az zarar veren yer Güney Okyanusu çıktı", "en": "The Southern Ocean comes out as the least damaging place to add iron"}, "excerpt": {"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde plankton kütlesi düşüyor, Güney Okyanusu'nda yükseliyor; karar bu farkta.", "en": "The same intervention runs in opposite directions in two oceans. In the equatorial Pacific plankton biomass falls, in the Southern Ocean it rises, and the decision lives in that difference."}, "sections": [{"h": {"tr": "İki bölge, ters yönde iki sonuç", "en": "Two regions, two opposite outcomes"}, "ps": [{"tr": "Aynı müdahale iki okyanusta ters yönde çalışıyor. Ekvator Pasifiği'nde okyanus alanının yüzde 0,35'i gübrelendiğinde büyük zooplankton kütlesi en az yüzde 10 düşüyor. Güney Okyanusu'nda daha küçük bir alan, yüzde 0,2, gübrelendiğinde aynı kütle yüzde 10 artıyor.", "en": "The same intervention runs in opposite directions in two oceans. When 0.35 percent of the ocean area in the equatorial Pacific is fertilised, macrozooplankton biomass falls by at least 10 percent. When a smaller area in the Southern Ocean, 0.2 percent, is fertilised, that same biomass rises by 10 percent.", "refs": ["iron"]}, {"tr": "Karbon tarafındaki sayı ise şu: net uzaklaştırma 5,3 ppm'e, yani yılda 0,70 gigaton karbondioksite kadar çıkıyor. California Üniversitesi'nden Jun Yu, Adam Martiny ve arkadaşları bu değerleri altmış yılı aşkın gübreleme verisini kullanan bir bilgisayar modellemesinden çıkarıyor ve Güney Okyanusu'nun ekolojik bozulma ile karbon uzaklaştırması arasında en iyi dengeyi sunduğu sonucuna varıyor.", "en": "On the carbon side the number is this: net removal reaches up to 5.3 parts per million, that is 0.70 gigatonnes of carbon dioxide a year. Jun Yu, Adam Martiny and colleagues at the University of California derive these values from a computer model drawing on more than six decades of fertilisation data, and conclude that the Southern Ocean offers the best balance between ecological disturbance and carbon removal.", "refs": ["iron"]}]}, {"h": {"tr": "Farkı ne yapıyor", "en": "What makes the difference"}, "ps": [{"tr": "İki bölgenin ters yönde davranması, eklenen demirin karşılaştığı besin ağının ne yaptığına bağlı görünüyor: Güney Okyanusu'nda demir eksikliği üretimi sınırlayan asıl kısıt olduğu için eklenen demir üretimi yukarı çekiyor ve üstteki halkalara besin taşıyor, Ekvator Pasifiği'nde ise büyümenin yönü zooplanktonun beslendiği topluluğun bileşimini onun aleyhine değiştiriyor.", "en": "The opposite behaviour of the two regions appears to depend on what the food web meeting the added iron does with it: in the Southern Ocean, iron scarcity is the binding constraint on production, so added iron pulls production upward and carries food to the levels above, while in the equatorial Pacific the direction of growth shifts the composition of the community zooplankton feed on against them.", "refs": ["iron"]}, {"tr": "Bu bir çıkarım ve yanında başka açıklamalar da duruyor. Bölgesel sıralama, okyanusların gerçek davranışından çok her bölgenin modelin besin ağı parametrelerinde nasıl temsil edildiğinden de doğabilir; iki bölgenin plankton toplulukları modele farklı ayrıntı düzeyinde girmişse sıralama o ayrıntının izini taşır. Yazarların kendi uyarısı da bu yönde okunmalı: demirle gübrelemenin uzak etkileri var ve yerel her girişim doğası gereği yerel olmayan sonuçlar doğuruyor.", "en": "This is an inference, and other accounts stand beside it. The regional ranking could also arise less from how the oceans actually behave than from how each region is represented in the model's food-web parameters; if the plankton communities of the two regions entered the model at different levels of detail, the ranking carries the trace of that detail. The authors' own caution should be read in the same direction: ocean iron fertilisation has downstream effects, and any localised intervention inherently produces nonlocal consequences.", "refs": ["iron"]}]}, {"h": {"tr": "Elimizde olan kollar", "en": "The levers we actually hold"}, "ps": [{"tr": "Bu çalışmanın verdiği şey iki ayar düğmesidir: nerede ve ne kadar alanda. Güney Okyanusu'nda yüzde 0,2 ile plankton kütlesi yüzde 10 artıyor, Ekvator Pasifiği'nde yüzde 0,35 ile en az yüzde 10 düşüyor; yer seçimi tek başına sonucun işaretini çeviriyor. Bunun karşılığı sahada henüz sınanmadı. Elimizde bir modelleme çözümlemesi var ve bir saha denemesinin ilk işi, modelin zooplanktona dair öngörüsünün tuttuğunu ölçmek olur.", "en": "What this study hands over is two dials: where, and over how much area. In the Southern Ocean 0.2 percent makes plankton biomass rise by 10 percent, while in the equatorial Pacific 0.35 percent makes it fall by at least 10 percent; the choice of place alone flips the sign of the outcome. None of this has been tested at sea yet. What we hold is a modelling analysis, and the first job of any field trial would be to measure whether the model's prediction about zooplankton holds.", "refs": ["iron"]}]}], "sources": [{"key": "iron", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-oceans-australia-fertilize-carbon-dioxide.html", "title": {"tr": "Model çalışması, demirle gübreleme için Güney Okyanusu'nu Ekvator Pasifiği'nin önüne koyuyor", "en": "A modelling study puts the Southern Ocean ahead of the equatorial Pacific for iron fertilisation"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-04", "title": {"tr": "Tekrarsız bir döşemeyi silisyum nitrüre kazıdılar ve ışık bir ellilik kazandı", "en": "They etched an aperiodic tiling into silicon nitride and the light acquired a handedness"}, "excerpt": {"tr": "Matematikte 2022'de bulunan \"şapka\", sonsuz bir yüzeyi hiç tekrarlamadan kaplıyor. Tokyo'daki ekip onu ince filme oyunca kırınan lazer ışığı aynada bakışımsız çıktı.", "en": "The hat, found in mathematics in 2022, covers an infinite surface without ever repeating. When a team in Tokyo etched it into a thin film, the diffracted laser light came out mirror-asymmetric."}, "sections": [{"h": {"tr": "Döşemeden aygıta", "en": "From tiling to device"}, "ps": [{"tr": "\"Şapka\" döşemesini 2022'de amatör matematikçi David Smith buldu. Tek bir taş, sonsuz bir yüzeyi hiçbir örüntüyü tekrarlamadan kaplıyor; adı da Albert Einstein'dan gelmiyor, Almanca \"ein Stein\", yani \"tek taş\" ifadesinden geliyor. Yarım yüzyıldan uzun süredir açık duran bir soru böylece kapandı ve elde bir şekil kaldı: kendini asla tekrarlamayan bir kaplama kuralı.", "en": "The hat tile was found in 2022 by the amateur mathematician David Smith. A single stone covers an infinite surface without repeating any pattern, and its name does not come from Albert Einstein but from the German \"ein Stein\", that is, one stone. A question left open for more than half a century closed, and what remained in hand was a shape: a tiling rule that never repeats itself.", "refs": ["hat"]}, {"tr": "Tokyo Üniversitesi Endüstriyel Bilim Enstitüsü'ndeki ekip o kuralı bir aygıta çevirdi. Şapkanın biçimine dayanan örüntüyü silisyum nitrür ince filme oydular, üzerine lazer düşürdüler ve Bragg kırınımıyla çıkan ışığı okudular. Işık aynada bakışımsız geldi; yani bir ellilik taşıyordu. Baş yazar Yuto Moritake çıkış noktasını sade anlatıyor: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "en": "The team at the University of Tokyo's Institute of Industrial Science turned that rule into a device. They etched a pattern based on the hat's shape into a silicon nitride thin film, shone a laser onto it and read the light coming out of Bragg diffraction. The light arrived mirror-asymmetric, that is, carrying a handedness. Lead author Yuto Moritake states the starting point plainly: \"We wanted to see whether this unique shape could also produce any unexpected physical phenomena.\"", "refs": ["hat"]}]}, {"h": {"tr": "Neden beklenmiyordu", "en": "Why that was not expected"}, "ps": [{"tr": "Kırınım normalde düzenli bir örgünün işidir: tekrar eden aralıklar, ışığı belirli açılara yönlendirir. Şapka döşemesinde tekrar yok, buna karşın çıkan ışıkta bir yön tercihi var; bu tercihin kaynağı, düzenli bir örgü yerine döşemenin kendi bakışımsızlığı görünüyor. Aynı ellilik, örüntünün filmin kenarlarında nasıl kesildiğinden de doğabilir; sonlu bir parçanın kenar seçimi de bakışımı bozar ve bunu ayırmak farklı kesimlerle aynı ölçümü yinelemeyi gerektirir.", "en": "Diffraction is normally the business of a regular lattice: repeating spacings steer light into particular angles. In the hat tiling there is no repetition, yet the emerging light shows a directional preference, and the source of that preference appears to be the tile's own asymmetry rather than a regular lattice. The same handedness could also arise from how the pattern was cut at the film's edges; the choice of boundary in a finite patch also breaks symmetry, and separating the two requires repeating the measurement with different cuts.", "refs": ["hat"]}, {"tr": "Kullanım tarafında ekip lazer ışığının kutuplanmasını denetlemeyi, haberleşmeyi ve kuantum şifrelemeyi sayıyor. Ortada bir aygıt yerine bir olgu duruyor: ince filme kazınmış bir örüntünün kırınan ışığa bir el kazandırdığı gösterildi. O elin ne kadar güçlü, ne kadar kararlı ve hangi dalga boylarında seçilebilir olduğu, bir kutuplanma denetleyicisi yapmaya kalkan herkesin ilk ölçeceği şeydir; makale bu üç sayıyı vermiyor.", "en": "On the application side the team lists control of laser light polarisation, telecommunications and quantum cryptography. What is actually on the table is a phenomenon rather than a device: a pattern etched into a thin film was shown to give diffracted light a hand. How strong that hand is, how stable, and at which wavelengths it can be selected are the first things anyone building a polarisation controller would measure, and the paper does not supply those three numbers.", "refs": ["hat"]}]}], "sources": [{"key": "hat", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/maths-acclaimed-einstein-tile-finds-a-new-home-among-physicists", "title": {"tr": "Lazer ışığı, tekrarsız \"şapka\" döşemesinden bir ellilik kazandı", "en": "Laser light picked up a handedness from the aperiodic hat tile"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-05", "title": {"tr": "Yirmi bin toprak yapısı, 4.500 kilometrekareden çıkarılabilir mi?", "en": "Can twenty thousand earthworks be inferred from 4,500 square kilometres?"}, "excerpt": {"tr": "Amazon'da havadan lazerle taranan alan 4.500 km². Bulunan anıtsal yapı sayısı 400'den fazla. Yayımlanan sayı ise 20.000. Aradaki adımın adı örnekleme.", "en": "The area scanned by airborne laser in Amazonia is 4,500 km². The number of monumental sites found is more than 400. The number published is 20,000. The step in between is called sampling."}, "sections": [{"h": {"tr": "Gerçekten ölçülen alan", "en": "The area that was actually measured"}, "ps": [{"tr": "Araştırma havadan lazer taramasıyla, yaklaşık 450 km uzunluğunda düz hatlar boyunca her 10 km'de 1 km genişliğinde şeritler tarayarak toplam 4.500 km² kadar alanı ölçtü ve iyi korunmuş 400'den fazla anıtsal tören alanı belgeledi. Taranan alanın yarısından fazlası dizgesel olarak değerlendirildi.", "en": "The survey measured a total of about 4,500 km² by airborne laser scanning, mapping 1 km wide strips every 10 km along straight transects roughly 450 km long, and documented more than 400 well-preserved monumental ceremonial sites. More than half of the scanned area was systematically assessed.", "refs": ["amazon"]}, {"tr": "Bu sayıdan bütün bölgede 20.000'den fazla tören merkezi bulunduğu öngörülüyor. Öngörünün kapsadığı alan yaklaşık 183.000 km², yani taranan alanın kırk katından fazla; bu 183.000 km² de Büyük Amazonya'nın yüzde üçünden azına denk geliyor. Her 10 km'de 1 km genişliğinde bir şerit tarandığında koridorun onda biri görülür. Yani sayı, görülenin on katına çıkmakla kalmıyor; kırk katından fazlasına genişletiliyor.", "en": "From that count, more than 20,000 ceremonial centres are projected across the whole region. The area the projection covers is about 183,000 km², more than forty times the area scanned, and those 183,000 km² themselves amount to less than three percent of Greater Amazonia. When a 1 km wide strip is scanned every 10 km, one tenth of the corridor is seen. So the number reaches beyond ten times what was seen, out to more than forty times it.", "refs": ["amazon"]}]}, {"h": {"tr": "Sayıdan nüfusa", "en": "From count to population"}, "ps": [{"tr": "İkinci genişletme nüfus tarafında. Yazarlar birinci binyılın başı için 1,25–3 milyon aralığını veriyor ve bu aralığı ihtiyatlı sayıyor; Amazon'un tümü için daha önce önerilen 1–10 milyon aralığıyla karşılaştırdıklarında ihtiyat iddiası anlaşılır hale geliyor. Yapı sayısından kişi sayısına geçmek, her yapının kaç kişiye hizmet ettiğine dair bir kabul gerektirir ve bu kabul, taramanın kendisinden gelmez.", "en": "The second extension is on the population side. The authors give a range of 1.25 to 3 million for the start of the first millennium and call that range cautious; set against the 1 to 10 million proposed earlier for the whole Amazon, the claim to caution becomes intelligible. Moving from a count of structures to a count of people requires an assumption about how many people each structure served, and that assumption does not come from the scanning.", "refs": ["amazon"]}, {"tr": "Genişletmenin gücü, hatların yapı yoğunluğunu yansız örnekleyip örneklemediğine bağlıdır. Toprak yapıları akarsu boylarında ya da su basmayan yüksek düzlüklerde kümeleniyorsa, o özellikleri dik kesen bir hat ile onlara paralel giden bir hat bambaşka yoğunluklar okur; hatların yönü sonucun içine girer. Alternatif olarak yapılar bölgeye gerçekten düzgün dağılmış olabilir, o durumda 20.000 sayısı yerinde durur. Ama iki durumu birbirinden ayırmak için ikinci bir taramaya ihtiyaç var.", "en": "The strength of the extension depends on whether the transects sample earthwork density without bias. If earthworks cluster along watercourses or on flood-free high ground, a transect cutting across those features and one running parallel to them read entirely different densities, and the orientation of the transects enters the result. Alternatively the structures may genuinely be distributed evenly across the region, in which case the figure of 20,000 stands. But separating the two cases takes a second survey.", "refs": ["amazon"]}]}, {"h": {"tr": "Bunu ne kapatır", "en": "What would settle it"}, "ps": [{"tr": "Tartışmayı ilerletecek olan, daha büyük bir sayı yerine ikinci bir örnekleme düzenidir: aynı 183.000 km² üzerinde farklı aralıkla ya da farklı yönde uçulmuş hatlar. İki ayrı geometri birbirine yakın yoğunluk veriyorsa genişletme dayanak kazanır; ayrışıyorsa fark, yapıların kendisinden çok hatların nereden geçtiğinden gelir. Bulgunun kendisi sağlam: 400'den fazla anıtsal yapı bulundu ve bunlar var. Sınanması gereken, o dört yüzden yirmi bine giden adımın kendisi.", "en": "What would move the argument forward is a second sampling design rather than a larger number: transects flown at a different spacing or in a different orientation over the same 183,000 km². If two separate geometries give densities close to one another, the extension gains support; if they diverge, the difference comes from where the transects ran rather than from the structures. The finding itself is solid: more than 400 monumental sites were found, and they exist. What needs testing is the step that runs from those four hundred to twenty thousand.", "refs": ["amazon"]}]}], "sources": [{"key": "amazon", "kind": "news", "name": "University of Helsinki", "url": "https://www.helsinki.fi/en/news/culture/ancient-civilization-millions-once-flourished-amazon", "title": {"tr": "Amazon'da 4.500 kilometrekarelik lidar taraması 400'den fazla anıtsal yapıyı haritaladı", "en": "A lidar survey of 4,500 square kilometres in Amazonia mapped more than 400 monumental sites"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-06", "title": {"tr": "Bir zihnin temelinde proteinleri doğru katlamak olabilir", "en": "The base of a mind may be nothing grander than folding proteins correctly"}, "excerpt": {"tr": "Ahtapot zekâsını hep devrelerde aradık. Harvard'daki ekip bir basamak aşağıya, proteinleri kuran makinenin kendisine baktı ve orada yalnızca ahtapotlarda görülen bir kopma buldu.", "en": "We have always looked for octopus intelligence in circuitry. A team at Harvard looked one step lower, at the machine that builds the proteins, and found there a break seen only in octopuses."}, "sections": [{"h": {"tr": "Bir basamak aşağıda", "en": "One step lower down"}, "ps": [{"tr": "Harvard'daki ekip, yalnızca ahtapotlarda görülen bir ribozomal RNA kopması buldu. Bu değişiklik bakteriye aktarıldığında hücreler protein üretirken daha az hata yaptı ve yanlış katlanmış moleküllerin zehirli yığınlar oluşturma riski düştü. Ahtapot dokusunda protein yığınları, kalamardakine göre hem daha az hem daha küçüktü.", "en": "The team at Harvard found a break in ribosomal RNA that occurs only in octopuses. When the change was engineered into bacteria, the cells made fewer mistakes while building proteins and the risk of misfolded molecules forming toxic aggregates fell. Protein clumps in octopus tissue were both fewer and smaller than in squid.", "refs": ["octopus"]}, {"tr": "Bir zihni anlamaya çalışırken alıştığımız yer nöronların birbirine nasıl bağlandığıdır: devreler, ağlar, katmanlar. Burada bakılan yer bir basamak aşağıda. Nöron bir yapıdır ve o yapı proteinlerden kurulur; onları kuran ribozom hata yaparsa, en zarif devre şeması bile yanlış malzemeyle örülür. Bu çalışmanın gösterdiği şey, o malzeme atölyesinde ahtapotlara özgü bir ayarın bulunduğudur.", "en": "When we try to understand a mind, the place we are used to looking is how neurons connect to one another: circuits, networks, layers. What is examined here is one step lower. A neuron is a structure, and that structure is built out of proteins; if the ribosome assembling them makes mistakes, even the most elegant circuit diagram gets woven from the wrong material. What this study shows is that in that materials workshop there is a setting particular to octopuses.", "refs": ["octopus"]}]}, {"h": {"tr": "Zamanlama ve temkin", "en": "Timing and restraint"}, "ps": [{"tr": "Zamanlama dikkat çekiyor. Yazarlar bu değişikliğin, sığ su ahtapotlarının yaklaşık 100 milyon yıl önce karmaşık ortamlara yerleşmesi ve sinir sistemlerinin hızla genişlemesiyle örtüştüğünü belirtiyor. Ortak baş yazar Rishav Mitra bağı kurarken dilini özenle ölçüyor: değişiklik \"might help these neurons to work well\".", "en": "The timing is striking. The authors note that this change coincides with shallow-water octopuses settling into complex environments roughly 100 million years ago and their nervous systems expanding rapidly. Co-lead author Rishav Mitra measures his language carefully in drawing the link: the change \"might help these neurons to work well\".", "refs": ["octopus"]}, {"tr": "Neden özellikle nöronlar? Uzun ömürlü ve sürekli protein üreten hücrelerde hata birikimi diğer dokulardan daha pahalıya gelir; daha doğru bir ribozom en çok orada işe yarar. Ama aynı değişiklik nöronlarla ilgisi olmayan bir nedenle de seçilmiş olabilir; sıcak ya da değişken suya dayanmak da protein katlanmasını zorlar ve o durumda sinirsel yarar yan üründür. Zamanlamanın örtüşmesi, iki açıklamadan hangisinin doğru olduğunu söylemez.", "en": "Why neurons in particular? In long-lived cells that build protein continuously, accumulated error costs more than it does in other tissue, and a more accurate ribosome pays off most there. But the same change could have been selected for a reason unconnected with neurons; tolerating warm or variable water also strains protein folding, and in that case any neural benefit is a by-product. The coincidence of timing does not tell us which of the two accounts is right.", "refs": ["octopus"]}]}, {"h": {"tr": "Bilmek ne demek olurdu", "en": "What knowing would take"}, "ps": [{"tr": "Genetikçi Eli Eisenberg sınırı açıkça koyuyor: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" İnsanda sınama ribozomal RNA'yı değiştirip öğrenme ile sorun çözmeyi ölçmeyi gerektiriyor ve çok zor sayılıyor. Yine de burada duran şey küçük değil. Bir zihnin nasıl kurulduğunu sorarken hep bir üst kata, düşüncenin kendisine bakmaya alışmışız; bu bulgu aynı soruyu bodruma taşıyor ve orada bir molekülün nasıl doğru katlandığını soruyor. Şimdilik bir hipotez. Ama sorunun yerini değiştiren bir hipotez.", "en": "The geneticist Eli Eisenberg sets the limit plainly: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" Testing this in humans would mean altering ribosomal RNA and measuring learning and problem-solving, which is described as highly challenging. Even so, what stands here is not small. Asking how a mind is built, we are used to looking upstairs, at thought itself; this finding carries the same question down to the basement and asks there how a molecule folds correctly. For now it is a hypothesis. But it is one that moves where the question sits.", "refs": ["octopus"]}]}], "sources": [{"key": "octopus", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/a-unique-cellular-trick-may-explain-octopus-intelligence", "title": {"tr": "Ahtapot ribozomal RNA'sındaki bir kopma, protein üretimindeki hataları azaltıyor", "en": "A break in octopus ribosomal RNA lowers errors in protein building"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Sinir sistemi işareti nüfus ölçeğinde, tanı ölçeğinde değil", "en": "The nervous-system signal is population-scale, not diagnostic"}, "excerpt": {"tr": "2,56 milyon kişilik çalışma fibromiyaljinin genetik işaretlerini beyin ve sinir hücrelerinde topluyor. Bu, biyolojik çerçeveyi keskinleştiriyor; tek bir hastanın tanısını, ağrısının kaynağını ya da tedavisini belirlemiyor.", "en": "A study of 2.56 million people concentrates fibromyalgia's genetic signal in brain and neural cells. That sharpens the biological framework without determining one patient's diagnosis, source of pain or treatment."}, "sections": [{"h": {"tr": "Büyük örneklem neyi satın aldı", "en": "What the large sample bought"}, "ps": [{"tr": "Meta-analiz 11 kohorttan 54.629 fibromiyalji olgusunu 2.509.126 kontrolle birleştirdi; toplam 2.563.755 kişi. Çok kökenli genom çapında tarama 26 risk bölgesi buldu. Bu büyüklük, daha küçük çalışmaların yakalayamadığı zayıf ve dağınık ilişkileri görünür kılıyor; fakat her bölge hastalığın küçük bir nüfus düzeyi olasılık farkını taşıyor. ‘Risk bölgesi’, bir kişide hastalığı açıklayan mutasyon ya da klinik test anlamına gelmiyor.", "en": "The meta-analysis combined 54,629 fibromyalgia cases with 2,509,126 controls across 11 cohorts, a total of 2,563,755 people. The multi-ancestry genome-wide scan found 26 risk loci. That scale makes weak, distributed associations visible where smaller studies could not, but each locus carries a small population-level difference in probability. A ‘risk locus’ is not a mutation that explains the condition in one person or a clinical test.", "refs": ["fibromyalgia"]}, {"tr": "En güçlü ilişki, Huntington hastalığının nedensel geni HTT'deki kodlayan bir varyantla kuruldu; gen önceliklendirmesi HTT'yi düzenleyen GPR52 ile DCC, DRD2/NCAM1, MDGA2 ve CELF4 gibi sinir sistemi adaylarını da öne çıkardı. Kalıtılabilirlik zenginleşmesi beyin dokuları ve sinir hücrelerinde toplandı. Aynı genin iki hastalıkta görünmesi iki hastalığın aynı olduğu anlamına gelmez: ortak genetik bölge farklı hücrelerde, farklı biyolojik yollar ve etki büyüklükleriyle çalışabilir.", "en": "The strongest association involved a coding variant in HTT, the causal gene for Huntington's disease; gene prioritisation also highlighted the HTT regulator GPR52 and neural candidates including DCC, DRD2/NCAM1, MDGA2 and CELF4. Heritability enrichment concentrated in brain tissues and neural cells. The same gene appearing in two conditions does not make the conditions the same: a shared genomic region can act through different cells, pathways and effect sizes.", "refs": ["fibromyalgia"]}]}, {"h": {"tr": "Korelasyon nüfus ölçeğinde durur", "en": "Correlation stops at the population scale"}, "ps": [{"tr": "Fibromiyaljinin bel ağrısı, travma sonrası stres bozukluğu ve irritabl bağırsak sendromuyla genetik korelasyonları 0,7'nin üzerindeydi. Bu sayıların dili ortak kalıtsal yatkınlıktır; bir durumun ötekine yol açtığını ya da yakınmaların ‘yalnızca psikolojik’ olduğunu söylemez. Kohortların hastane ve birinci basamak kayıtlarındaki tanı kodlarına dayanması da önemlidir: genişlik, klinik değerlendirmedeki farklılıkları ve yanlış sınıflandırmayı otomatik olarak ortadan kaldırmaz.", "en": "Fibromyalgia's genetic correlations with low-back pain, post-traumatic stress disorder and irritable bowel syndrome exceeded 0.7. Those numbers describe shared inherited liability; they do not say that one condition causes another or that symptoms are ‘only psychological’. It also matters that cohorts used diagnosis codes from hospital or primary-care records: scale does not automatically remove differences in clinical assessment or misclassification.", "refs": ["fibromyalgia"]}, {"tr": "Fibromiyaljinin görülme sıklığında büyük cinsiyet farkları olmasına rağmen erkeklerle kadınların genetik mimarisi çalışmada neredeyse aynı çıktı. Bu bulgu, sıklık farkını genetik farkla açıklayan basit hesabı zayıflatıyor; tanıya erişim, hormonlar, çevre ve ölçüm gibi başka katmanları açık bırakıyor. Bugünkü klinik değer, kronik ağrıyı sinir sistemi biyolojisi içinde sınanabilir hedeflere ayıran daha sağlam bir araştırma haritasında yatıyor. Bu verilerden ilaç seçimi çıkmıyor.", "en": "Despite large sex differences in fibromyalgia prevalence, the study found nearly identical genetic architecture in males and females. That weakens a simple account in which prevalence follows genetic difference and leaves other layers—diagnostic access, hormones, environment and measurement—open. Its clinical value today lies in a stronger research map dividing chronic pain into testable targets within nervous-system biology. Drug choice does not follow from these data.", "refs": ["fibromyalgia"]}]}], "sources": [{"key": "fibromyalgia", "kind": "news", "name": "Nature Medicine", "url": "https://www.nature.com/articles/s41591-026-04492-6", "title": {"tr": "2,56 milyon kişilik fibromiyalji meta-analizi 26 genetik risk bölgesi buldu", "en": "A fibromyalgia meta-analysis across 2.56 million people found 26 genetic risk loci"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-03", "title": {"tr": "Kuraklığın tanısını artık yalnızca yağış koymuyor", "en": "Rainfall no longer diagnoses the drought alone"}, "excerpt": {"tr": "Amazon havzasındaki 2023–2024 kuraklığı alanın yüzde 88'ine yayıldı. Yağış kırılmanın yalnızca bir tarafı: 2005 sonrasında ısınan havanın su talebi, büyük kuraklıkları şiddetlendiren baskın bileşen hâline geliyor.", "en": "The Amazon drought of 2023–2024 spread across 88 percent of the basin. Rainfall is only one side of the break: after 2005, warming-driven atmospheric demand becomes the dominant intensifier of major droughts."}, "sections": [{"h": {"tr": "Kırk dört yıllık sıralama", "en": "A forty-four-year ranking"}, "ps": [{"tr": "Araştırmacılar 1980–2024 arasındaki Amazon kuraklıklarını aynı çerçevede sıraladığında 2023–2024 olayı havzanın yüzde 88'ini kapladı. Büyüklüğü, en büyük beş kuraklığın ortalamasının dört katına ulaştı. Bu iki sayı farklı şeyleri tutuyor: yüzde 88 mekânsal yayılımı, dört kat ise süre ile şiddeti birleştiren büyüklüğü. Tek bir yağış istasyonunun kötü yılı değil, havza ölçeğinde eşzamanlı bir su açığı söz konusu.", "en": "When the researchers ranked Amazon droughts from 1980 to 2024 in one framework, the 2023–2024 event covered 88 percent of the basin. Its magnitude reached four times the average of the five largest droughts. The two numbers capture different dimensions: 88 percent is spatial reach, while fourfold magnitude combines duration and intensity. This was not one rain gauge's bad year but a basin-scale water deficit occurring at once.", "refs": ["amazon-drought"]}, {"tr": "Daha önemli ayrım zaman içinde belirdi. 2005 öncesindeki büyük kuraklıklar başlıca yağış azlığıyla açıklanırken, 2005 sonrasında ısınmanın artırdığı atmosferik buharlaştırma talebi şiddetlendirici baskın bileşen hâline geldi. Sıcak hava toprağın ve bitkinin üzerindeki su çekişini büyütüyor; aynı yağış açığı daha yüksek sıcaklık altında daha ağır bir ekolojik bilanço üretebiliyor. Böylece meteorolojik kuraklık ile bitkinin yaşadığı su stresi arasındaki bağ değişiyor.", "en": "The more consequential division appeared over time. Before 2005 major droughts were explained chiefly by reduced rainfall; after 2005, warming-enhanced atmospheric evaporative demand became the dominant intensifier. Hotter air increases the pull of water from soil and vegetation, so the same rainfall deficit can produce a heavier ecological balance sheet at higher temperature. The link between meteorological drought and the water stress experienced by plants is changing.", "refs": ["amazon-drought"]}]}, {"h": {"tr": "Tahmin ile hazırlık arasındaki ölçü", "en": "The measure between forecast and preparation"}, "ps": [{"tr": "Çalışma kuraklık örüntüsünü tropik Hint ve Pasifik okyanuslarıyla Kuzey Atlantik'teki deniz yüzeyi sıcaklığı sapmalarına bağlıyor. Bu bağlantılar uzak okyanusların Amazon'u tek başına yönettiğini kanıtlamıyor; atmosferik dolaşım üzerinden birlikte değişen koşulları işaretliyor. Yağış, sıcaklık ve okyanus sapmaları birbirine bağlı olduğundan her bileşenin payı seçilen kuraklık göstergesine ve döneme duyarlı.", "en": "The study links the drought pattern to sea-surface temperature anomalies in the tropical Indian and Pacific oceans and the North Atlantic. Those links do not prove that distant oceans govern the Amazon alone; they identify conditions that co-vary through atmospheric circulation. Because rainfall, temperature and ocean anomalies are coupled, each component's share remains sensitive to the drought indicator and period selected.", "refs": ["amazon-drought"]}, {"tr": "Hazırlık sistemi yağışı izlemeyi sürdürüyor ve eşiğe atmosferik talebi de ekliyor. Nehir taşımacılığı, yangın yönetimi, tarım ve elektrik üretimi için aynı yağış tahmini farklı sıcaklıklarda farklı risk demek. Havza yöneticileri yağış açığı ile buharlaştırma talebini birlikte izlediğinde uyarı, gökten gelmeyen suyun yanında toprağın ve ormanın su kaybetme hızını da kapsar. Isınma, kuraklığın ikinci bir sayacı hâline gelmiş durumda.", "en": "A preparedness system continues to track rainfall and adds atmospheric demand to its thresholds. For river transport, fire management, farming and power generation, the same rainfall forecast means different risk at different temperatures. When basin managers track rainfall deficit and evaporative demand together, an alert covers water missing from the sky alongside the rate at which soil and forest lose it. Warming has become a second drought meter.", "refs": ["amazon-drought"]}]}], "sources": [{"key": "amazon-drought", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-62139-5", "title": {"tr": "Amazon'un 2023–2024 kuraklığı havzanın yüzde 88'ini etkiledi", "en": "The Amazon drought of 2023–2024 affected 88 percent of the basin"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-04", "title": {"tr": "Küresel bina haritası iki vekil üzerine kurulu", "en": "The global building map stands on two proxies"}, "excerpt": {"tr": "Model 9.000'i aşkın kent merkezindeki yapı stokunu iklimlendirme kırılganlığına çeviriyor. Haritanın gücü küresel tutarlılık; sınırı ise gerçek sayaçlar yerine yapım dönemiyle bina kompaktlığını kullanması.", "en": "A model turns building stock across more than 9,000 urban centres into a map of climatization vulnerability. Its strength is global consistency; its limit is reliance on construction epoch and compactness rather than actual meters."}, "sections": [{"h": {"tr": "Haritanın iki taşıyıcı kolonu", "en": "The map's two load-bearing columns"}, "ps": [{"tr": "Bir binanın iklimlendirme gereksinimini küresel ölçekte karşılaştırmak için ortak bir yapı dili gerekiyor. Çalışma, yapı ayak izlerini ve Dünya gözlemlerini eş büyüklükteki coğrafi karelerde birleştirip 9.000'i aşkın kent merkezini aynı hesap çerçevesine yerleştiriyor. Ayak izi ile yükseklik, yapı stokunun biçimini kuruyor; yapım dönemi de farklı teknik standartlar altında inşa edilmiş stok için zaman katmanı ekliyor. Böylece tek tek binaları denetlemek yerine tutarlı bir dünya modeli üretiliyor.", "en": "Comparing building climatization needs globally requires one common language for structures. The study combines building footprints and Earth observations in equally sized geographic tiles, placing more than 9,000 urban centres inside one computational frame. Footprint and height construct the stock's geometry; construction epoch adds a time layer for structures built under different technical standards. The result is a consistent world model rather than an audit of individual buildings.", "refs": ["building-climatization"]}, {"tr": "Modelin yük taşıyan iki vekili yapım dönemi ile kompaktlık. Yapıların yüzde 43'ünün 1980 öncesine ait olması, eski stokun haritadaki ağırlığını belirliyor. Kompaktlık ise dış yüzey ile kapalı hacim arasındaki ilişkiyi yaklaşık olarak temsil ediyor; aynı yerel ısıtma ya da soğutma gereksiniminde daha elverişsiz biçimler farklı kırılganlık puanı alıyor. Enerji sayaçları, HVAC verimi ve iç sıcaklık ölçümleri bu hesapta doğrudan gözlenmiyor. Harita bu yüzden enerji tüketimini ölçen bir sayaç ağı değil, yapı verisinden kurulan bir tarama modeli.", "en": "The model's two load-bearing proxies are construction epoch and compactness. With 43 percent of buildings predating 1980, older stock carries substantial weight in the map. Compactness approximates the relation between exterior surface and enclosed volume, so less favourable forms receive a different vulnerability score under the same local heating or cooling need. Energy meters, HVAC efficiency and indoor temperatures are not observed directly. The map is therefore a screening model assembled from building data, not a metering network measuring energy use.", "refs": ["building-climatization"]}]}, {"h": {"tr": "Senaryo çıktısı ile bina denetimi arasındaki mesafe", "en": "The distance between a scenario output and a building audit"}, "ps": [{"tr": "Bu kurulum günümüzde yaklaşık 48 milyon kişiyi, yerel ısıtma veya soğutma gereksinimine göre kırılgan yapıların yoğunlaştığı alanlarla eşleştiriyor. Bu sayı enerji yoksulluğunu, arızalı iklimlendirme sistemlerini ya da tek tek evlerde ölçülen sıcaklığı doğrudan saymıyor. Yapı stokunun vekil özelliklerini yerel iklim gereksinimiyle aynı modelde buluşturuyor. Dolayısıyla 48 milyon, bina düzeyindeki kesin bir envanterden çok karşılaştırılabilir bir maruziyet taramasıdır.", "en": "Under this construction, about 48 million people now fall within areas where buildings vulnerable relative to local heating or cooling needs are concentrated. That count does not directly enumerate energy poverty, failed climatization systems or measured temperatures in individual homes. It brings proxy features of building stock together with local climate needs in one model. The 48 million is therefore a comparable exposure screening result rather than a definitive building-level inventory.", "refs": ["building-climatization"]}, {"tr": "Basitleştirilmiş şekil katsayısı ile ayak izi ve yükseklik hataları modelin geometrik hata bütçesini oluşturuyor. Yenileme oranları, HVAC verimi, kültürel uyum ve kullanıcı davranışı ise aynı geometrinin gerçek yaşamda farklı sonuçlar vermesine yol açabilir. Bu sınırlar haritayı değersizleştirmiyor; uygun kullanım alanını daraltıyor. Kent ve ulusal ölçekte hangi bölgelerin daha ayrıntılı saha çalışmasına ihtiyaç duyduğunu sıralayabilir. Tek bir evin güvenliği, enerji faturası ya da yenileme reçetesi için yerel ölçüm ve bina denetimi yine gerekli.", "en": "A simplified shape factor plus footprint and height errors form the model's geometric error budget. Renovation rates, HVAC efficiency, cultural adaptation and occupant behaviour can then make identical geometry perform differently in practice. Those limits narrow the map's proper use. It can rank regions that need deeper field work at city or national scale. Judging one home's safety, energy bill or retrofit prescription still requires local measurements and a building audit.", "refs": ["building-climatization"]}]}], "sources": [{"key": "building-climatization", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-58888-y", "title": {"tr": "Küresel yapı stoku modeli, bugün 48 milyon kişiyi iklimlendirme açısından kırılgan alanlarda buluyor", "en": "A global building-stock model places 48 million people in climatization-vulnerable areas today"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-05", "title": {"tr": "Okyanusun üretim toplamı, saha ölçümlerine yaklaşınca küçüldü", "en": "The ocean production total shrank when it moved closer to field measurements"}, "excerpt": {"tr": "Genişletilmiş karbon izotopu veri tabanı, küresel deniz birincil üretimini yaygın uydu ürünlerinden yüzde 10–20 aşağı çekiyor. Sonuç, seyrek ölçümle model arasındaki kalibrasyonu değiştiriyor ve doğrudan küresel sayım sunmuyor.", "en": "An expanded carbon-isotope database pulls global marine primary production 10–20 percent below common satellite products. The result changes calibration between sparse measurements and a model and provides no direct global census."}, "sections": [{"h": {"tr": "Ölçüm ağı büyüdüğünde", "en": "When the measurement network grows"}, "ps": [{"tr": "Deniz net birincil üretimi küresel ölçekte doğrudan sayılamıyor. Karbon izotopu kuluçka deneyleri yerel ve seyrek, uydular ise okyanus rengini geniş alanda görüyor ama karbon akışını doğrudan tartmıyor. Çalışma, saha kuluçka veri tabanının kapsamını yaklaşık yüzde 50 genişletti ve birden çok uydu ürününü bu gözlemlerle aynı noktalarda karşılaştırdı. Yöntemin hikâyesi yeni bir sensörden çok, uydunun vekil ölçüsünü daha geniş bir saha ağına yeniden bağlamak.", "en": "Global marine net primary production cannot be counted directly: carbon-isotope incubation experiments are local and sparse, while satellites see ocean colour broadly but do not weigh carbon flow itself. The study expanded the coverage of the field-incubation database by about 50 percent and compared multiple satellite products with those observations at matched locations. The methodological story is less a new sensor than a broader field network reconnecting a satellite proxy to measured production.", "refs": ["marine-productivity"]}, {"tr": "Bu karşılaştırmayla sınırlandırılan model, küresel üretimi yaygın uydu ürünlerinden yüzde 10–20 daha düşük hesapladı. Model tek bir düzeltme katsayısı uygulamak yerine çevresel değişkenlerle saha ölçümleri arasındaki ilişkiyi yeniden öğreniyor. Uydu döneminin yeniden kurulumlarında Kuzey Yarımküre'de mekânsal farklılaşma artarken Güney Yarımküre'de üretim daha tekdüze dağılıyor. Yani hem toplam hem haritanın biçimi değişiyor.", "en": "The model constrained by that comparison estimated global production 10–20 percent below widely used satellite products. Rather than applying one correction factor, it relearns the relation between field measurements and environmental variables. Reconstructions over the satellite era show growing spatial heterogeneity in the Northern Hemisphere and a more homogeneous distribution in the Southern Hemisphere. Both the total and the shape of the map change.", "refs": ["marine-productivity"]}]}, {"h": {"tr": "Daha düşük sayının güven aralığı", "en": "The confidence interval around the lower number"}, "ps": [{"tr": "Saha ölçümleriyle sınırlanan model, doğrudan küresel gözlemden farklı bir kanıt türüdür. Saha noktaları kıyılar, mevsimler ve erişilebilir bölgeler arasında eşit dağılmıyor; model bu boşlukları sıcaklık, ışık, besin ve renk gibi çevresel değişkenlerle dolduruyor. Veri tabanının yüzde 50 büyümesi önemli, fakat okyanusun her hücresini ölçülmüş hâle getirmiyor. Sonuç, eski ürünlerin saha ölçümlerine göre taşıdığı sistematik farkı niceliyor ve onların tümünü yanlış ilan etmiyor.", "en": "A model constrained by field measurements is a different kind of evidence from direct global observation. Field sites are uneven across coasts, seasons and accessible regions, and the model fills those gaps with environmental variables such as temperature, light, nutrients and colour. A 50 percent expansion is substantial, yet every ocean cell remains short of direct measurement. The result quantifies the products' systematic difference from field measurements without declaring all older products wrong.", "refs": ["marine-productivity"]}, {"tr": "Yüzde 10–20'lik aşağı yönlü revizyon, okyanusun atmosferden aldığı karbonun aynı oranda değiştiği anlamına da gelmez; birincil üretim ile uzun süreli karbon gömülmesi aynı büyüklük değildir. Ancak karbon döngüsü modellerinin başlangıç akısını ve hangi bölgelerde değişim arayacağını etkiler. Bağımsız sınama için en değerli ek veri, bugünkü veri tabanında seyrek kalan açık okyanus ve mevsimlerde aynı kuluçka protokolleriyle alınacak ölçümlerdir.", "en": "A 10–20 percent downward revision does not mean that the ocean's uptake of atmospheric carbon changes by the same amount; primary production and long-term carbon storage are not the same quantity. It does alter the starting flux in carbon-cycle models and where they look for change. The most valuable independent test would add measurements with the same incubation protocols in open-ocean regions and seasons that remain sparse in the present database.", "refs": ["marine-productivity"]}]}], "sources": [{"key": "marine-productivity", "kind": "news", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03828-x", "title": {"tr": "Gözlemle sınırlandırılan model, küresel deniz üretkenliğini uydu ürünlerinden yüzde 10–20 daha düşük hesapladı", "en": "An observation-constrained model put global marine productivity 10–20 percent below satellite products"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-06", "title": {"tr": "Çeşitlilik yalnızca çevrede yaşamıyor, çevreyi yapanlarda da yaşıyor", "en": "Diversity lives not only in an environment but in the organisms that build it"}, "excerpt": {"tr": "Fanerozoyik fosil topluluklarında resif kurucuları ve tortu karıştırıcılar daha yüksek çeşitlilikle birlikte görülüyor. Yüz milyonlarca yıla yayılan ilişki, yaşamın yalnızca çevreye uymadığını, yaşanabilir çevreyi de kurduğunu gösteriyor.", "en": "Across Phanerozoic fossil communities, reef builders and sediment mixers accompany higher diversity. A relationship spanning hundreds of millions of years shows that life not only fits environments; it also constructs habitable ones."}, "sections": [{"h": {"tr": "Her jeolojik evrede aynı soru", "en": "The same question in every geological stage"}, "ps": [{"tr": "Çalışma Fanerozoyik'in her evresinde, resif kurucuları ya da tortuyu karıştıran biyotürbasyon canlıları bulunan fosil topluluklarını bunların bulunmadığı topluluklarla karşılaştırdı. Çeşitliliği yalnız tür sayısıyla değil, bolluk dağılımını da hesaba katan Shannon ölçüsüyle değerlendirdi ve her evre için etki büyüklüğü hesapladı. Yaklaşık 541 milyon yıllık kaydı tek toplamda eritmek yerine zaman dilimlerine ayırmak, ilişkinin ne zaman sürdüğünü ve ne zaman zayıfladığını görmeyi sağlıyor.", "en": "For every stage of the Phanerozoic, the study compared fossil communities containing reef builders or sediment-mixing bioturbators with communities lacking them. It assessed diversity not only by species count but with the Shannon measure, which includes abundance distribution, and calculated an effect size for each stage. Rather than melting roughly 541 million years into one total, the stage-by-stage design shows when the relationship persists and when it weakens.", "refs": ["ecosystem-engineers"]}, {"tr": "Fanerozoyik'in büyük bölümünde ekosistem mühendislerinin bulunduğu topluluklar anlamlı biçimde daha yüksek çeşitlilik taşıdı; etki en güçlü biçimde ılımlı sıcaklıklarda görüldü. Bu ilişki makul bir mekanizmaya sahip: resifler üç boyutlu barınak ve yüzey, tortu karıştırıcılar ise oksijen ve besin akışı yaratıyor. Fakat veri karşılaştırmalı fosil kaydı olduğu için mekanizma deneysel olarak ayrıştırılmıyor; mühendisler çeşitliliği artırabilir, çeşitlilik de mühendislerin kalabildiği istikrarlı koşulları işaretleyebilir.", "en": "Through much of the Phanerozoic, communities with ecosystem engineers carried significantly greater diversity, with the strongest effect at moderate temperatures. The association has a plausible mechanism: reefs create three-dimensional shelter and surface, while sediment mixers create flows of oxygen and nutrients. But because the evidence is a comparative fossil record, the mechanism is not experimentally separated; engineers may raise diversity, while diversity may also mark stable conditions in which engineers persist.", "refs": ["ecosystem-engineers"]}]}, {"h": {"tr": "Mühendisin türü geleceği değiştiriyor", "en": "The kind of engineer changes the future"}, "ps": [{"tr": "Yaklaşık son 250 milyon yılda modern resif kurucuları iklim baskısına biyotürbasyon yapan canlılardan daha duyarlı görünüyor. İki grup habitatı aynı yoldan kurmuyor: resif, karmaşık ama sıcaklık ve kimyaya hassas bir fiziksel yapı; tortu karıştırma ise deniz tabanında daha dağınık bir işlem. Bugünkü ısınmada ‘ekosistem mühendisi’ etiketini tek bir dayanıklılık sınıfı saymak bu nedenle yanıltıcı. Hangi mühendislik işlevinin kaybolduğu, tür sayısı kadar önem taşıyabilir.", "en": "Across roughly the past 250 million years, modern reef builders appear more sensitive to climate stress than bioturbators. The two groups do not construct habitat in the same way: a reef is a complex physical structure sensitive to temperature and chemistry, whereas sediment mixing is a more distributed process across the seabed. Treating ‘ecosystem engineer’ as one resilience class under present warming is therefore misleading. Which engineering function disappears may matter as much as the species count.", "refs": ["ecosystem-engineers"]}, {"tr": "Fosil kaydı, korunmaya uygun kabukları, erişilebilir kayaçları ve iyi örneklenmiş bölgeleri kayıran bir parça dizisidir. Buna rağmen aynı karşılaştırmanın yüz milyonlarca yıl boyunca tekrar tekrar çıkması, canlılığı fiziksel çevrenin etkin bir kurucusu olarak çerçeveliyor. Yaşam, sonraki yaşamın kullanacağı oyukları, yüzeyleri ve kimyasal yolları kuruyor. İlişki bir nedensellik hükmünden ziyade çeşitlilik tarihinin ortamı kuran canlılarla birlikte yazılması gerektiğine dair bir işaret.", "en": "The fossil record is a sequence of fragments favouring preservable shells, accessible rocks and well-sampled regions. Even so, the same comparison recurring over hundreds of millions of years frames life as an active builder of physical environments. Organisms construct cavities, surfaces and chemical pathways that later life can use. The association serves as a sign that the history of diversity must be written with environment-building organisms, rather than as a verdict of causality.", "refs": ["ecosystem-engineers"]}]}], "sources": [{"key": "ecosystem-engineers", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-73628-6", "title": {"tr": "Fosil topluluklarında ekosistem mühendislerinin varlığı daha yüksek deniz çeşitliliğiyle birlikte görüldü", "en": "Fossil communities with ecosystem engineers were associated with greater marine diversity"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-01", "title": {"tr": "Merkezden dokuz kiloparsek uzakta parçalanan bir yıldız", "en": "A star torn apart nine kiloparsecs from the centre"}, "excerpt": {"tr": "Işık eğrisinden başka hiçbir şeye bakmayan bir sınıflandırıcı, galaksisinin merkezinde durmayan bir kara delik buldu. Asıl kazanç tek bir olayda değil, artık taranabilir hale gelen bir nüfusta.", "en": "A classifier that looked at nothing but the light curve found a black hole that was not sitting at its galaxy's centre. The gain lies less in the single event than in a population that can now be searched."}, "sections": [{"h": {"tr": "Ölçülen büyüklükler", "en": "The quantities measured"}, "ps": [{"tr": "Kasım 2025'te Zwicky Transient Facility'nin yakaladığı parlama, TDE 2025abcr adıyla kataloglandı. Swift'in morötesi ve optik teleskobu sıcaklığı yaklaşık 30.000 santigrat derece ölçtü; olay aylarca morötesinde ana galaksisini bastırdı ve on milyar Güneş parlaklığına ulaştı. Kaynak, Balina takımyıldızı yönünde yaklaşık 750 milyon ışık yılı uzaktaki bir galaksinin çekirdeğinden 30.000 ışık yılından fazla uzakta duran, yaklaşık bir milyon Güneş kütlesindeki bir kara delik.", "en": "The flare that the Zwicky Transient Facility caught in November 2025 was catalogued as TDE 2025abcr. Swift's ultraviolet and optical telescope measured it at about 30,000 degrees Celsius; for months the event outshone its host galaxy in the ultraviolet, reaching some ten billion times the Sun's luminosity. The source is a black hole of roughly a million solar masses, standing more than 30,000 light-years from the nucleus of a galaxy about 750 million light-years away towards Cetus.", "refs": ["swift"]}, {"tr": "Hakemli makaledeki sayılar daha dar: kara cisim sıcaklığının doruğu 30.220 artı eksi 2.120 kelvin, bolometrik parlaklığın doruğu saniyede 4,71 çarpı 10 üzeri 43 erg, parçalayan kara deliğin kütlesi 10 üzeri 6,09 artı eksi 0,53 Güneş kütlesi, galaksinin merkezindeki kara delik ise 10 üzeri 8,82 artı eksi 0,65. Ayrılık açısı 9,5 yay saniyesi, izdüşümde 9,3 kiloparsek. Kütle hata payı yarım kertelik; bu, hangi kara deliğin ne olduğunu tartışırken elimizdeki en dürüst sayı.", "en": "The numbers in the peer-reviewed paper are tighter: a peak blackbody temperature of 30,220 plus or minus 2,120 kelvin, a peak bolometric luminosity of 4.71 times 10 to the 43 ergs a second, a disrupting black hole of 10 to the 6.09 plus or minus 0.53 solar masses against the host's central black hole at 10 to the 8.82 plus or minus 0.65. The angular separation is 9.5 arcseconds, 9.3 kiloparsecs in projection. The mass carries half an order of magnitude of uncertainty, and that is the most honest figure we have when arguing about which black hole is which.", "refs": ["swift"]}]}, {"h": {"tr": "Nasıl bulundu", "en": "How it was found"}, "ps": [{"tr": "Arama, tdescore adlı makine öğrenmesi sınıflandırıcısının çekirdek dışı sürümüyle yapıldı: her geçici kaynağı yalnızca ışık eğrisi özelliklerinden değerlendirdi, ana galaksi bilgisini hiç kullanmadı. Ayırt edici işaretler, kara cisim sıcaklığının yüksek bir alt sınırı ve sıcaklığın zamanla soğumak yerine yükselmesiydi. Gelgitsel parçalanma aramaları uzun süre çekirdeğe bakarak yapıldığı için, ana galaksiyi yok sayan bir eleme tam da o varsayımın dışarıda bıraktığını görebiliyor.", "en": "The search used an off-nuclear implementation of the machine-learning classifier tdescore: it judged every transient from light-curve properties alone, using no host-galaxy information at all. The distinguishing marks were a high lower bound on the blackbody temperature and a temperature that rose with time instead of cooling. Because tidal-disruption searches have long been pointed at galactic nuclei, a filter that ignores the host can see exactly what that assumption left outside.", "refs": ["swift"]}, {"tr": "Sıradan açıklamalar önce elenmiş. Bir Ia türü süpernova modeli kötü uyum verdi; serbestlik derecesi başına ki-kare 4,5 çıktı. Etkin galaksi çekirdeği seçeneği, ana galaksinin tayfında tanı koydurucu salma çizgilerinin bulunmamasıyla dışlandı. Çekirdekte gerçekleşen bir parçalanma ise 9,3 kiloparseklik ayrılıkla bağdaşmıyor. Bir galaksinin dış bölgesinde parlayan bir noktanın en beklenen açıklaması süpernovadır ve öldürülmesi gereken de oydu.", "en": "The prosaic explanations were eliminated first. A Type Ia supernova model fitted poorly, with a chi-squared per degree of freedom of 4.5. An active galactic nucleus was ruled out because the host spectrum lacked the diagnostic emission lines. A disruption at the nucleus is incompatible with a 9.3-kiloparsec separation. The expected explanation for a bright point in a galaxy's outskirts is a supernova, and that is the one that had to be killed.", "refs": ["swift"]}]}, {"h": {"tr": "Çözülmeden kalan", "en": "What stays unresolved"}, "ps": [{"tr": "Kara deliğin oraya nasıl geldiği belirlenmiş değil. Bir galaksi birleşmesi sırasında dışarı atılmış olabilir; gelgitle soyulmuş bir uydu galaksinin içinde de bulunabilir. İki seçenek arasında karar vermek için geç dönem gözlemleri gerekiyor. Bu iki senaryo aynı ayrılığı üretir, dolayısıyla tek başına 9,3 kiloparsek hiçbirini desteklemiyor; ayırt edici olan, o konumda başka bir yıldız topluluğunun bulunup bulunmadığı.", "en": "How the black hole got there has not been established. It may have been ejected during a galaxy merger; it may sit inside a tidally stripped satellite galaxy. Deciding between them requires late-time observations. Both scenarios produce the same separation, so 9.3 kiloparsecs on its own supports neither; what distinguishes them is whether any other stellar population is found at that position.", "refs": ["swift"]}, {"tr": "Baş yazar Robert Stein, yöntemin doğrulandığını ve benzerlerini aramakta kullanılabileceğini söylüyor; Rubin gözlemevinin geniş ve derin taramalarının bugünkü teleskopların toplayabildiğinden çok daha büyük bir örneklem vereceğini de ekliyor. Makalenin kendisi ise böyle bir keşfi yinelemenin zor olduğunu, doğrulamanın pahalı takip gözlemleri istediğini kabul ediyor. Sınanabilir beklenti şu: Rubin'in ilk tarama yılı içinde çekirdek dışı elemeden geçip bağımsız tayfla doğrulanmış en az bir gelgitsel parçalanma daha bildirilirse, kazanç tek bir şanslı kaynakta değil yöntemde demektir.", "en": "Lead author Robert Stein says the technique has been validated and can be used to hunt for more, adding that Rubin's wide, deep surveys will yield a far larger sample than current telescopes can collect. The paper itself concedes that replicating such a discovery is difficult and that confirmation demands expensive follow-up. The testable expectation is this: if within Rubin's first survey year at least one further tidal disruption passes the off-nuclear filter and is confirmed by independent spectroscopy, the gain lies in the method rather than in one lucky source.", "refs": ["swift"]}]}], "sources": [{"key": "swift", "kind": "news", "name": "NASA", "url": "https://science.nasa.gov/missions/swift/nasas-swift-sees-wandering-mega-black-hole-shredding-star", "title": {"tr": "Swift ve yer teleskopları, galaksi merkezinden 30 bin ışık yılı uzakta parçalanan bir yıldızı izledi", "en": "Swift and ground telescopes tracked a star torn apart 30,000 light-years from a galaxy's centre"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae77f3", "publishedDate": "2026-07-27", "title": {"tr": "TDE 2025abcr: Kütleli bir galaksinin dış bölgesinde bir gelgitsel parçalanma olayı", "en": "TDE 2025abcr: A Tidal Disruption Event in the Outskirts of a Massive Galaxy"}}}], "date": "2026-07-28"}, {"writer": "sci-02", "title": {"tr": "Altmış günlük yatak istirahati, hastalarınkine benzemeyen bir kas bıraktı", "en": "Sixty days of bed rest left a muscle that does not look like the patients'"}, "excerpt": {"tr": "Kondisyon kaybı açıklaması sınanabilir bir beklenti üretir: hareketsizlik tek etkense, hastanın kası yatakta tutulmuş sağlıklı bir insanınkine benzemeli. Bu karşılaştırmada benzemedi.", "en": "The deconditioning explanation makes a testable prediction: if inactivity were the whole story, a patient's muscle should resemble that of a healthy person kept in bed. In this comparison it did not."}, "sections": [{"h": {"tr": "Karşılaştırma neyi sınıyor", "en": "What the comparison tests"}, "ps": [{"tr": "Çalışma dört grubu yan yana koyuyor: 60 gün katı yatak istirahati uygulanan sağlıklı kişiler, uzun COVID hastaları, ME/kronik yorgunluk sendromu hastaları ve yaş ile cinsiyet bakımından eşleştirilmiş sağlıklı denekler. İki hasta grubunu birleştiren belirti efor sonrası halsizlik; buna eşlik eden fiziksel hareketsizlik ise tam olarak sınanmak istenen rakip açıklama. Yazarlar tüm vücut egzersiz yanıtlarını ve iskelet kası uyarlanmalarını bu dört grup arasında karşılaştırıyor.", "en": "The study sets four groups side by side: healthy people put through 60 days of strict bed rest, patients with long COVID, patients with myalgic encephalomyelitis or chronic fatigue syndrome, and healthy controls matched for age and sex. The symptom that joins the two patient groups is post-exertional malaise; the physical inactivity that accompanies it is precisely the rival explanation under test. The authors compare whole-body exercise responses and skeletal muscle adaptations across the four groups.", "refs": ["muscle"]}, {"tr": "Bu tasarımın gücü de sınırı da aynı asimetriden geliyor. Yatak istirahati kolu sağlıklı gönüllülerde uygulanan deneysel bir müdahale; hasta kolları ise gözlemsel. Yani hareketsizliğin kasta ne yaptığını deneysel olarak biliyoruz ve hastalarda gördüğümüzü bu bilinen etkiyle karşılaştırabiliyoruz. Bu, hastalığın nedenini gösteren bir kurgu değil; bir açıklamanın kapsayabileceği alanı daraltan bir kurgu.", "en": "The strength and the limit of this design come from the same asymmetry. The bed-rest arm is an experimental intervention in healthy volunteers; the patient arms are observational. So we know experimentally what inactivity does to muscle, and can hold what the patients show against that known effect. The design cannot identify the cause of an illness. What it can do is narrow the ground an explanation covers.", "refs": ["muscle"]}]}, {"h": {"tr": "Nerede ayrışıyorlar", "en": "Where they diverge"}, "ps": [{"tr": "Yatak istirahati kası küçülttü ama lif tipini değiştirmedi. Hasta gruplarında tablo başka: her ikisinde glikolitik lif oranı daha yüksek çıktı ve ME/KYS hastalarında körelme tip I liflere özgüydü. Bir ayrıntı daha var: oksidatif fosforilasyon kapasitesi ile en yüksek oksijen alımı arasındaki ilişki yalnızca yatak istirahatinin ardından beliriyor, hastalarda değil. Yani hastalarda düşük egzersiz kapasitesini açıklayan bağ, hareketsizliğin kurduğu bağ değil.", "en": "Bed rest shrank muscle without changing fibre type. In the patient groups the picture differs: both carried a higher proportion of glycolytic fibres, and in ME/CFS the atrophy was specific to type I fibres. One further detail: the association between oxidative phosphorylation capacity and maximal oxygen uptake appears only after bed rest, not in the patients. The link that explains low exercise capacity in the patients is therefore not the link inactivity builds.", "refs": ["muscle"]}, {"tr": "Bu, derece farkından çok cins farkına benziyor: hareketsizlik kası azaltıyor, hastalarda ise kasın bileşimi kayıyor. Yine de tek olası okuma bu değil. Altmış günlük katı yatak istirahati, aylar ya da yıllar süren, kesintili ve hastalıkla iç içe geçmiş bir hareketsizliği birebir taklit etmiyor; beslenme, ateşli dönemler ve tekrarlayan efor sonrası çöküşler farklı bir uyarlanma üretebilir. Glikolitik kayma, hastalığa özgü bir süreçten değil, süresi ve dokusu farklı bir hareketsizlikten de doğabilir.", "en": "That looks more like a difference in kind than in degree: inactivity subtracts muscle, while in patients the composition of the muscle shifts. Even so, it is not the only available reading. Sixty days of strict bed rest does not reproduce an inactivity that runs for months or years, comes and goes, and is entangled with illness; nutrition, febrile episodes and repeated post-exertional crashes could produce a different adaptation. The glycolytic shift could arise from inactivity of a different duration and texture rather than from a disease-specific process.", "refs": ["muscle"]}]}, {"h": {"tr": "Hasta için ne değişiyor", "en": "What changes for a patient"}, "ps": [{"tr": "Bu çalışma bir mekanizma, bir tedavi ya da bir belirteç sunmuyor. Sunduğu şey, tek bir açıklamanın tekelini kaldırmak. Efor sonrası halsizliği kondisyon kaybıyla açıklanmış hastalar için bu, kanıt tablosunda gerçek bir kayma anlamına geliyor. Klinik bir talimat yerine geçmez. Karşılaştırmanın ne kadar geniş bir topluluğa taşınabileceğini belirleyen sayı, her gruba kaç kişinin girdiğidir; yorumun ağırlığı da orada tartılır.", "en": "The study offers no mechanism, no treatment and no biomarker. What it offers is the removal of one explanation's monopoly. For patients whose post-exertional malaise has been explained as deconditioning, that marks a real shift in the evidence, though it stops short of a clinical instruction. The number that decides how far the comparison travels is how many people entered each group, and that is where the weight of the interpretation is settled.", "refs": ["muscle"]}, {"tr": "Ayırt edici sınama bellidir. Lif tipi kayması hastalığa özgüyse, başka bir nedenle uzun süre hareketsiz kalmış kişilerle eşleştirilen hastalarda kayma yine görülmelidir; hareketsizliğin süresine bağlıysa, eşleştirme kaybolmasına yol açar. Önümüzdeki bir yıl içinde böyle bir eşleştirilmiş karşılaştırma yayımlanırsa, iki açıklama arasındaki tercih ölçülebilir hale gelir.", "en": "The discriminating test is clear. If the fibre-type shift is disease-specific, it should persist in patients matched against people rendered inactive for a long time by some other cause; if it depends on the duration of inactivity, matching should make it disappear. Should such a matched comparison be published within the coming year, the choice between the two explanations becomes measurable.", "refs": ["muscle"]}]}], "sources": [{"key": "muscle", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75725-y", "title": {"tr": "Uzun COVID ve ME/KYS'deki kas değişimleri 60 günlük yatak istirahatininkine benzemiyor", "en": "Muscle changes in long COVID and ME/CFS differ from those left by 60 days of bed rest"}, "publishedDate": "2026-07-28"}], "date": "2026-07-28"}, {"writer": "sci-03", "title": {"tr": "Yangında binayı kaybettiren şeyin büyük bölümü çitte, saçakta ve menfezde", "en": "Much of what loses a building to fire sits in the fence, the eaves and the vent"}, "excerpt": {"tr": "On iki yıllık denetim raporları kaybın rastgele olmadığını söylüyor. Kuruluğun ve rüzgârın buluştuğu yamaçlarda ahşap çit ile korumasız menfez tekrar tekrar aynı sonucu veriyor; bu, haritadan çok bir iş listesi.", "en": "Twelve years of inspection records say the loss is not random. Where dryness meets wind on a slope, a wooden fence and an unprotected vent produce the same outcome again and again; that is less a map than a work list."}, "sections": [{"h": {"tr": "On iki yılın hasar defteri", "en": "Twelve years of damage"}, "ps": [{"tr": "UC Irvine ekibi, Cal Fire'ın 2013-2024 arasında tuttuğu 100.000 denetim raporunu işledi. Bu raporlar hasar gören ya da tümüyle yıkılan yaklaşık 55.000 binayı kapsıyor ve bunların yüzde 86'sı kır ile kentin iç içe geçtiği kuşakta. Uydu verisi, yangın havası çözümlemeleri ve bina düzeyinde yapısal nitelikler makine öğrenmesiyle birleştirilerek Kaliforniya'nın tamamını 100 metrelik çözünürlükte kaplayan sürekli bir olasılık yüzeyi kuruldu; üç ardışık model kurgusunda doğruluk yüzde 88'e kadar çıktı.", "en": "The UC Irvine team processed 100,000 inspection records kept by Cal Fire between 2013 and 2024. They cover nearly 55,000 buildings damaged or destroyed, 86 per cent of them in the belt where country and city interlock. Satellite data, fire-weather analyses and building-level structural attributes were combined by machine learning into a continuous probability surface covering all of California at 100-metre resolution, with accuracy reaching 88 per cent across three successive model configurations.", "refs": ["wbdri"]}, {"tr": "Öne çıkan etkenler bir zincir oluşturuyor. Düşük çiy noktası sıcaklığı havanın kuruluğunu gösteriyor; yüksek rüzgâr hem alevi hem koru taşıyor; yaklaşık 500 metrelik orta yükseltilerde yamaçlar ve boğazlar rüzgârı kanalize ederek etkiyi çoğaltıyor. Örtü tarafında otlak, çalılık ve meşe ormanı öne çıkıyor. Binanın kendi payı ise ayrı bir kalem: ahşap çit, tutuşabilen kaplama, çıkıntılı saçak ve korumasız menfezler.", "en": "The leading factors form a chain. A low dew-point temperature marks the dryness of the air; high wind carries both flame and ember; at mid elevations of around 500 metres, slopes and canyons channel that wind and multiply its effect. On the vegetation side, grassland, chaparral and oak woodland stand out. The building's own share is a separate entry: wooden fences, flammable siding, protruding eaves and unprotected vents.", "refs": ["wbdri"]}]}, {"h": {"tr": "Elde olan kaldıraç", "en": "The lever in hand"}, "ps": [{"tr": "Bu, geçmiş yangınlara uydurulmuş istatistiksel bir yüzey; belirli bir yangının tahmini değil. Etkenlerin yinelenebilir bir bileşim oluşturması, kaybın kaçınılmaz olmadığı anlamına geliyor: bileşimin bir kısmı hava ve arazi, bir kısmı ise değiştirilebilir yapı ayrıntısı. Yine de aynı doğruluk, modelin binanın nasıl tutuştuğundan çok yangının nereye vardığını öğrenmesinden de kaynaklanabilir; hasarın yüzde 86'sının tek bir kuşakta toplanması, tek başına güçlü bir maruziyet işareti.", "en": "This is a statistical surface fitted to past fires, not a forecast of any particular fire. That the factors form a reproducible combination means the loss is not fated: part of the combination is weather and terrain, part is alterable building detail. Even so, the same accuracy could come from the model learning where fire arrives rather than how a building ignites; 86 per cent of the damage falling inside a single belt is on its own a strong signal of exposure.", "refs": ["wbdri"]}, {"tr": "Kaldıraç, baş yazar Somnath Bar'ın işaret ettiği yerde: yerel yönetimler bina çevresindeki korunma şeridi denetimlerini ve yakıt azaltma yatırımlarını bu yüzeye göre önceliklendirebilir; hane düzeyinde de çit, kaplama, saçak ve menfez sırayla ele alınabilir. Haritanın kendisi hiçbir binayı kurtarmıyor; kurtaran şey uygulanan denetim ve değiştirilen malzeme. Bunun ölçülebilir karşılığı da bellidir: haritayı benimseyen bir ilçede denetimlerin yüksek riskli ızgara karelerine kayıp kaymadığı, önümüzdeki iki yangın mevsimi içinde yayımlanan denetim sayılarından okunabilir.", "en": "The lever sits where lead author Somnath Bar points: local jurisdictions can prioritise defensible-space inspections and fuel-reduction investment against this surface, and households can work through fence, siding, eaves and vents in turn. The map itself saves no building; what saves one is the inspection carried out and the material replaced. The measurable counterpart is plain: whether inspections in a county that adopts the map shift towards the high-risk grid squares can be read from published inspection counts over the next two fire seasons.", "refs": ["wbdri"]}]}], "sources": [{"key": "wbdri", "kind": "news", "name": "University of California, Irvine", "url": "https://news.uci.edu/2026/07/27/uc-irvine-researchers-create-california-wildfire-damage-risk-map/", "title": {"tr": "Kaliforniya genelinde bir model, orman yangınlarında bina kaybını 100 metrelik ızgaraya yerleştiriyor", "en": "A statewide model places California wildfire building loss on a 100-metre grid"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-04", "title": {"tr": "Filmi izlerken altlığın da kıpırdadığını gördüler", "en": "Watching the film, they saw the substrate move too"}, "excerpt": {"tr": "Yüz nanometrelik bir film, 10.000 kat kalın bir altlığı itiyor; altlık geri itiyor ve enerji paylaşılıyor. Bu, aygıtın modelinde adı konmamış bir bileşen olduğu anlamına geliyor.", "en": "A hundred-nanometre film pushes a substrate 10,000 times thicker; the substrate pu
