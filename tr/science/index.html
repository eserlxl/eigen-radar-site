rgo vehicles and carries astronauts during spacewalks. What is lost when it fails is a piece of the station's own operating capability.", "refs": ["iss"]}, {"tr": "Bakım işini bilimin rakibi saymak kolaydır: mürettebat saati sonludur ve kol onarımına giden saat deney tezgâhına gitmez. Karşısında en az onun kadar güçlü bir okuma duruyor: yörüngede bir donanımı yenileyip yeniden çalışır hale getirmek, ancak insanlı bir sefer varken yapılabilen ve sonraki bütün seferlerin üstüne kurulduğu bir kazanımdır. Hangi okumanın doğru olduğunu tek bir bültenden çıkaramayız; her ikisi de aynı iki satırla uyumludur.", "en": "It is easy to treat maintenance as science's rival: crew hours are finite, and an hour spent on an arm repair is an hour away from a bench. An equally strong reading sits opposite it. Refurbishing hardware in orbit and returning it to service is something only a crewed increment can do, and it is the foundation every later increment is built on. Which reading is right cannot be settled from a single bulletin; both fit the same two lines.", "refs": ["iss"]}]}, {"h": {"tr": "Sonuç nerede aranacak", "en": "Where the results will be found"}, "ps": [{"tr": "Bülten, ekibin desteklediği çalışmalar arasında kanser tedavisi araştırmalarını ve yüksek başarımlı bilgisayarlar ile elektronik bileşenler için uzayda üretim iyileştirmelerini sayıyor. Buradaki fiil dikkat ister: desteklemek, sonuçlandırmaktan farklıdır. Bir sefer bittiğinde örnekler yeni yere inmiştir ve ölçüm, çözümleme ve yayın süreci daha yeni başlar.", "en": "The bulletin lists cancer treatment research and in-space manufacturing improvements for high-performance computers and electronics among the work the crew supported. The verb deserves attention: to support differs from to conclude. When an increment ends, the samples have only just landed, and measurement, analysis and publication are still ahead.", "refs": ["iss"]}, {"tr": "Bu yüzden 241 günün ne getirdiğini bugün söylemek mümkün olmasa da nereye bakılacağı bellidir: bu seferde yürütülen deneylerin yayımlanmış sonuçlarına ve Canadarm2'nin sonraki görevlerde çalışmayı sürdürüp sürdürmediğine. İlki bilgiyi, ikincisi yeniden kullanılabilir yeteneği ölçer. İnsanlı bir seferin defterini bu iki kalem tutar ve kilometre sayacı o defterin yalnızca kapağıdır.", "en": "So while what the 241 days bought cannot be stated today, where to look is clear: the published results of the experiments run during this increment, and whether Canadarm2 keeps working through the missions that follow. The first measures knowledge, the second reusable capability. Those two entries are the ledger of a crewed increment, and the odometer is only its cover.", "refs": ["iss"]}]}], "sources": [{"key": "iss", "kind": "news", "name": "NASA", "url": "https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-crewmates-return-from-space-station/", "title": {"tr": "Soyuz MS-28, Expedition 74 ekibini 241 günün ardından Dünya'ya getirdi", "en": "Soyuz MS-28 brings the Expedition 74 crew home after 241 days"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "sci-02", "title": {"tr": "İnterferonun zamanlama sorununun ardında artık aday bir molekül var", "en": "The timing problem with interferon now has a candidate molecule behind it"}, "excerpt": {"tr": "Farelerde interferon yalnızca enfeksiyon öncesinde koruyor, sonrasında etkisiz kalıp yan etkilerini gösteriyor. Yeni çalışma bu bilinen davranışa bir mekanizma ve onaylı bir ilaçla kurulmuş bir çıkış yolu öneriyor. İkisi de henüz insanda sınanmadı.", "en": "In mice, interferon protects only before infection, and afterwards stops working while showing its adverse side. A new study offers a mechanism for that familiar behaviour and a way out built on an approved drug. Neither has yet been tested in people."}, "sections": [{"h": {"tr": "Tanıdık bir başarısızlık", "en": "A familiar failure"}, "ps": [{"tr": "Birinci tip interferonlar klinik öncesi çalışmalarda güçlü antiviral etki gösterir, klinikte ise dar bir tedavi aralığı, yetersiz etkinlik ve ağır yan etkilerle karşılaşır. Wuhan Üniversitesi ve Hubei Tıp Üniversitesi ekibinin çalışması bu boşluğu keskin bir ifadeye indiriyor: interferonlar yalnızca enfeksiyon öncesinde verildiğinde koruyor ve enfeksiyon yerleştikten sonra etkisiz kalırken yan etkileri belirginleşiyor.", "en": "Type I interferons show strong antiviral activity in preclinical work, then meet a narrow therapeutic window, suboptimal activity and severe adverse events in the clinic. Work from Wuhan University and Hubei University of Medicine reduces that gap to a sharp statement: interferons protect only when given before infection, and once infection is established they are ineffective while their adverse effects become prominent.", "refs": ["ifn"]}, {"tr": "Bu, bir ilacın işe yaramadığı iddiası yerine ne zaman işe yaradığına dair bir iddiadır. Klinikte önemi büyüktür, çünkü hastalar hekime enfeksiyon öncesinde değil belirtiler başladıktan sonra gelir. Bir tedavinin yararı, uygulanabildiği zaman aralığında yararlı olmasına bağlıdır.", "en": "That is a claim about when a drug works rather than a claim that it does not. It matters clinically, because patients arrive after symptoms begin, not before infection. A treatment's benefit depends on it being useful in the window when it can actually be given.", "refs": ["ifn"]}]}, {"h": {"tr": "Önerilen aracı", "en": "The proposed intermediary"}, "ps": [{"tr": "Ekip, aradaki aracı olarak konağın kendi ürettiği laktik asidi gösteriyor. Önerilen mekanizmada laktik asit bir zar alıcısı üzerinden SIRT1 düzeyini yükselterek interferon etkinliğini baskılıyor; aynı zamanda interferonla birlikte NF-κB'yi aşırı etkinleştirerek sitokin fırtınası başlatıyor. Yazarlar bunu, antiviral başarısızlığın iltihabı büyüttüğü ve büyüyen iltihabın başarısızlığı pekiştirdiği bir geri besleme döngüsü olarak tarif ediyor.", "en": "The team names host-derived lactic acid as the intermediary. In the proposed mechanism lactic acid raises SIRT1 through a membrane receptor and so suppresses interferon activity, while at the same time combining with interferon to hyperactivate NF-κB and set off a cytokine storm. The authors describe this as a feedback loop in which antiviral failure amplifies inflammation and the growing inflammation entrenches the failure.", "refs": ["ifn"]}, {"tr": "Bu mekanizmanın çekiciliği, iki ayrı klinik sorunu -etkisizlik ve yan etki- tek bir moleküle bağlamasıdır. Aynı çekicilik dikkatli olmayı gerektirir. Laktik asit yerleşmiş enfeksiyonda zaten yükselir; yüksek laktat, doku hasarının ve ağır seyreden hastalığın ortak bir belirtecidir. Bu durumda laktik asidin interferonu bozan etken mi, yoksa interferonun işe yaramadığı ağır tabloyu gösteren bir işaret mi olduğu ayırt edilmelidir. Çalışmanın laktat dehidrogenazı baskılayıp sonucu değiştirmesi bu ayrımı hayvan modelinde destekler ve insanda aynı ayrımın geçerli olduğunu göstermez.", "en": "The appeal of this mechanism is that it ties two separate clinical problems, ineffectiveness and adverse effects, to a single molecule. That same appeal calls for care. Lactic acid is already elevated in established infection; high lactate is a common marker of tissue damage and severe disease. So it must be distinguished whether lactic acid is the agent disrupting interferon or a sign of the severe picture in which interferon fails anyway. That the study suppressed lactate dehydrogenase and changed the outcome supports the first reading in the animal model, and does not show that the same distinction holds in people.", "refs": ["ifn"]}]}, {"h": {"tr": "Onaylı ilaç neyi kısaltır", "en": "What an approved drug shortens"}, "ps": [{"tr": "Ekibin önerdiği tedavi, interferonu ABD Gıda ve İlaç Dairesi onaylı bir laktat dehidrogenaz baskılayıcısıyla birleştiriyor. Bildirilen sonuçlara göre bu birleşim baskılanmayı tersine çevirdi, iltihabı azalttı ve geç evre enfeksiyonlarda da etkisini korudu. Onaylı bir molekülle çalışmak güvenlik ve üretim tarafında zaman kazandırır, çünkü doz aralığı, yan etki profili ve üretim yolu zaten bilinir.", "en": "The therapy the team proposes pairs interferon with a lactate dehydrogenase inhibitor approved by the US Food and Drug Administration. On the reported results the combination reversed the suppression, reduced inflammation and retained efficacy in late-stage infection. Working with an approved molecule saves time on the safety and manufacturing side, because dose range, adverse-effect profile and production route are already known.", "refs": ["ifn"]}, {"tr": "Kısaltmadığı basamak ise etkinliktir. Onay, molekülün onaylandığı hastalık için işe yaradığını söyler ve yeni bir endikasyonda yararlı olacağını göstermez. Bu tedavinin insanda anlamlı olması için gereken kanıt, karşılaştırma kolu bulunan ve önceden ilan edilmiş bir sonlanım noktasına -hastaneye yatış, oksijen ihtiyacı, ölüm- bakan bir çalışmadır. Ters yönlü bir risk de vardır: laktat üretimini baskılamak bağışıklık hücrelerinin enerji dengesine dokunur, bu yüzden yarar ile zararın birlikte ölçülmesi gerekir. Bugün elimizde olan, hücrelerde ve farelerde tutarlı bir mekanizma ile sınanabilir bir hipotezdir. Hasta için anlamı, o çalışma yapıldığında ortaya çıkacaktır.", "en": "What it does not shorten is efficacy. Approval says a molecule works for the disease it was approved in, and does not show it will help in a new indication. The evidence needed for this therapy to mean anything in people is a study with a comparison arm and a prespecified endpoint such as hospital admission, oxygen requirement or death. There is a risk running the other way as well: suppressing lactate production touches the energy balance of immune cells, so benefit and harm have to be measured together. What we have today is a mechanism that holds together in cells and mice, and a testable hypothesis. Its meaning for a patient will emerge when that study is done.", "refs": ["ifn"]}]}], "sources": [{"key": "ifn", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76000-w", "title": {"tr": "İnterferon enfeksiyon yerleştikten sonra etkisiz kalıyor; çalışma sorumlu olarak laktik asidi gösteriyor", "en": "Interferon stops working once infection is established, and a study points to lactic acid"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-03", "title": {"tr": "Yaşlı bir ormanın üstündeki sıcaklığı düşüremezsiniz, otlama baskısını düşürebilirsiniz", "en": "You cannot lower the temperature over an old forest, but you can lower the browsing pressure"}, "excerpt": {"tr": "New Zealand Journal of Ecology'de yayımlanan bir forum makalesi, yerli ormanlarda geyik sayısı için ulusal bir strateji istiyor. Çağrının gücü, iki baskıdan yalnızca birinin bu on yıl içinde elimizde olmasından geliyor.", "en": "A forum article in the New Zealand Journal of Ecology calls for a national strategy on deer numbers in native forest. The force of the call comes from only one of the two pressures being within reach this decade."}, "sections": [{"h": {"tr": "İki baskı, tek kol", "en": "Two pressures, one lever"}, "ps": [{"tr": "Canterbury Üniversitesi'nden David Norton ile Manaaki Whenua - Landcare Research'ten Peter Bellingham ve Sarah Richardson, New Zealand Journal of Ecology'de yayımlanan forum makalesinde yerli ormanlardaki geyik sayılarının sürdürülemez düzeye çıktığını savunuyor. Makalenin merkezindeki gözlem tek bir baskıya değil iki baskının birleşimine dair: geyikler ve iklim değişikliği birlikte, ayrı ayrı olduklarından büyük olasılıkla daha ağır bir etki yaratıyor.", "en": "In a forum article in the New Zealand Journal of Ecology, David Norton of the University of Canterbury with Peter Bellingham and Sarah Richardson of Manaaki Whenua - Landcare Research argue that deer numbers in native forest have risen to unsustainable levels. The observation at the centre of the article concerns the combination of two pressures rather than a single one: deer and climate change together are likely to hit harder than either does alone.", "refs": ["deer"]}, {"tr": "Bir sistemde iki baskı birleşiyorsa ve bunlardan yalnızca biri kısa vadede yönetilebiliyorsa, yönetilebilen kol beklenenden değerli hale gelir. Yerli ormanların üzerindeki sıcaklık ve yağış rejimini bu on yıl içinde değiştirmek mümkün değildir; ülkenin kendi sera gazı kesintileri bile o ormanların üstündeki havayı bu zaman ölçeğinde döndürmez. Otlama baskısı ise yerel bir karar konusudur. Makalenin savunduğu şey tam olarak budur: iklimin etkisi doğrudan azaltılamıyorsa, ormanın o etkiye karşı kırılganlığı azaltılabilir.", "en": "When two pressures combine in a system and only one of them can be managed in the short term, the manageable lever becomes worth more than it looks. The temperature and rainfall regime over native forest cannot be changed this decade; even the country's own emissions cuts will not turn the air above those forests on that timescale. Browsing pressure, by contrast, is a matter of local decision. That is precisely the article's argument: if the effect of climate cannot be reduced directly, the forest's vulnerability to it can.", "refs": ["deer"]}]}, {"h": {"tr": "Geleceğin ormanı nerede kayboluyor", "en": "Where the future forest disappears"}, "ps": [{"tr": "Yazarların anlattığı zincir alt katmandan başlıyor. Geyikler hem yaşlı hem yenilenen ormanlarda otluyor, orman tabanındaki toprağı ve döküntüyü etkiliyor; bu da orman altı bitki örtüsünü ve zamanla taç katmanının bileşimini değiştiriyor, hayvanlar için yaşam alanı niteliğini düşürüyor. Heyelan gibi bozulmuş alanlarda otlama gençleşmeyi geciktiriyor ve bunun karşılığı suyu tutma kapasitesinin azalması ile tortu kaybının artması oluyor. Norton'un RNZ'ye söylediği gibi asıl kaygı, 20-30 metrelik taç katmanının altında yetişen gençlikte.", "en": "The chain the authors describe starts in the understorey. Deer browse in both old-growth and regenerating forest and affect the soil and litter on the forest floor, which changes the understorey vegetation and eventually canopy composition, and lowers habitat quality for fauna. On disturbed ground such as landslides, browsing retards regeneration, and the price of that is reduced water retention and increased sediment loss. As Norton told RNZ, the real concern is the young growth coming up beneath a canopy 20 to 30 metres high.", "refs": ["deer"]}, {"tr": "Bu zincirin en zor yanı görünürlüğüdür. Taç katmanı onlarca yıl ayakta kalır, dolayısıyla yukarıdan bakıldığında orman yerinde durur; kaybolan şey bugünün ağaçları yerine yarınki taç katmanını oluşturacak fidanlardır. Aynı zamanda bu, ormanın karbon deposu ve havzanın su düzenleyicisi olma işlevine de dokunur, çünkü her iki işlev de yenilenmenin sürmesine bağlıdır. Bir ormanı seyretmek onun sağlıklı olduğunu göstermez; sağlığı, altında ne yetiştiğiyle ölçülür.", "en": "The hardest part of that chain is its visibility. A canopy stands for decades, so from above the forest looks intact; what disappears is the saplings that would become tomorrow's canopy rather than today's trees. It also touches the forest's role as a carbon store and as the water regulator of its catchment, because both functions depend on regeneration continuing. Looking at a forest does not tell you it is healthy; its health is measured by what grows underneath.", "refs": ["deer"]}]}, {"h": {"tr": "Kolun bedeli", "en": "The price of the lever"}, "ps": [{"tr": "Forum makalesi, dergilerde özgün ölçüm sunan araştırma makalesinden ayrı bir türdür: yayımlanmış bulguları bir araya getirip tartışmaya açar. Bu, çağrının ağırlığını azaltmaz ama niteliğini belirler. Yazarların istediği şey yeni bir ölçüm yerine ulusal ölçekte bir yönetim kararıdır ve böyle bir karar bedelsiz değildir: sürekli finansman, avlanma ve erişim düzenlemeleri, geyiği bir kaynak olarak gören topluluklarla anlaşma ve ormanın Māori ile Pākehā için taşıdığı değerlerin gözetilmesi gerekir.", "en": "A forum article is a distinct format from a research paper presenting original measurements: it brings published findings together and opens them to argument. That does not lessen the weight of the call, but it defines its nature. What the authors want is a management decision at national scale rather than a new measurement, and such a decision is not free: it needs sustained funding, hunting and access rules, agreement with communities that see deer as a resource, and attention to what the forest means to Māori and Pākehā alike.", "refs": ["deer"]}, {"tr": "Böyle bir stratejinin işleyip işlemediğini anlamak için bakılacak sayı, öldürülen geyik sayısı olmayacak. Bakılacak olan, ormanın altındaki gençliktir: bozulmuş alanlarda fidanların taç katmanına doğru yükselip yükselmediği ve orman altı bitki örtüsünün bileşiminin toparlanıp toparlanmadığı. Uzun süredir yürütülen orman ölçüm ağları bu soruyu yanıtlayabilecek türden verinin toplandığı yerdir. Otlama baskısı düşerse yanıt orada görünecek; düşmezse taç katmanı bir süre daha yerinde durmayı sürdürecek ve altındaki eksilme sessizce büyüyecek.", "en": "The number to watch, if such a strategy is to be judged, will not be how many deer are killed. It will be the young growth beneath the forest: whether saplings on disturbed ground are climbing toward the canopy and whether the composition of the understorey is recovering. Long-running forest measurement networks are where data capable of answering that question is gathered. If browsing pressure falls, the answer will show up there; if it does not, the canopy will stand a while longer and the loss beneath it will quietly grow.", "refs": ["deer"]}]}], "sources": [{"key": "deer", "kind": "news", "name": "RNZ", "url": "https://www.rnz.co.nz/news/environment/805275/rising-deer-numbers-drive-decline-in-native-forests-research", "title": {"tr": "Yeni Zelanda'da ekologlar, geyik sayıları için ulusal bir yönetim stratejisi çağrısı yapıyor", "en": "New Zealand ecologists call for a national management strategy for deer numbers"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "New Zealand Journal of Ecology", "url": "https://newzealandecology.org/nzje/3639", "publishedDate": "2026-07-27", "title": {"tr": "Deer in the headlights: sleepwalking our way to a native forest catastrophe", "en": "Deer in the headlights: sleepwalking our way to a native forest catastrophe"}}}], "date": "2026-07-27"}, {"writer": "sci-04", "title": {"tr": "Nikel karbon monoksiti üretiyor, bakır birleştirmeyi yapıyor", "en": "Nickel makes the carbon monoxide, copper does the joining"}, "excerpt": {"tr": "Asetamidi karbondioksit ve nitrattan üretmenin önündeki engel, iki bağın aynı yüzeyde yarışmasıydı. Hefei ekibinin çözümü katalizörü daha etkin kılmak yerine işi iki komşu bölgeye bölmek.", "en": "The obstacle to making acetamide from carbon dioxide and nitrate was two bonds competing on one surface. The Hefei team's answer splits the job between two neighbouring sites instead of making the catalyst more active."}, "sections": [{"h": {"tr": "Aynı yüzeyde iki iş", "en": "Two jobs on one surface"}, "ps": [{"tr": "Amit üretmek için iki farklı bağ kurulmalıdır: karbon-karbon ve karbon-azot. Tek tür etkin bölgeye sahip bir katalizörde bu iki iş aynı yüzey için yarışır ve yüzey hangisine daha elverişliyse ürün o yöne kayar. Yazarların bildirdiği güçlük tam olarak budur: küçük ve bol moleküllerden amit elektrosentezinin önünde duran şey, karbon-karbon ile karbon-azot bağ oluşumunun kinetik rekabetidir.", "en": "Making an amide requires forming two different bonds: carbon-carbon and carbon-nitrogen. On a catalyst with a single kind of active site those two jobs compete for the same surface, and the product drifts toward whichever the surface favours. That is exactly the difficulty the authors report: what stands in the way of electrosynthesising amides from small, abundant molecules is the kinetic competition between carbon-carbon and carbon-nitrogen bond formation.", "refs": ["ace"]}, {"tr": "Böyle bir rekabette katalizörü genel olarak daha etkin kılmak işe yaramaz, çünkü etkinlik artışı her iki yola da dağılır. İşe yarayan yaklaşım, yolların birbirinden ayrılmasıdır: her adımı ona uygun bir bölgede yaptırmak ve ara ürünleri buluşturmak. Sorun o zaman kimya sorunundan yerleşim sorununa dönüşür.", "en": "Making the catalyst generally more active does not help in that kind of competition, because the gain in activity spreads across both routes. The approach that works separates the routes: run each step on a site suited to it and then bring the intermediates together. The problem turns from a chemistry problem into a placement problem.", "refs": ["ace"]}]}, {"h": {"tr": "İş bölümünün planı", "en": "The plan of the division"}, "ps": [{"tr": "Hefei Teknoloji Üniversitesi ve Jinan Üniversitesi ekibinin kurduğu düzenek, azot katkılı karbon üzerine tek atom nikel ile bakır nanokümelerini yan yana yerleştiriyor. Nikel bölgeleri karbondioksiti seçici biçimde karbon monoksite çeviriyor. Komşu bakır nanokümeleri iki iş birden yapıyor: karbon-karbon eşleşmesiyle *CCO ara ürününü oluşturuyor ve nitratı indirgeyerek *NH2 ara ürününü veriyor. Karbon-azot bağı, bu iki ara ürünün birbirine yakın üretilmesi sayesinde kuruluyor.", "en": "The arrangement built by the team from Hefei University of Technology and Jinan University places single nickel atoms next to copper nanoclusters on nitrogen-doped carbon. The nickel sites selectively convert carbon dioxide to carbon monoxide. The neighbouring copper nanoclusters do two jobs at once: they couple carbon to carbon to form the *CCO intermediate, and they reduce nitrate to form the *NH2 intermediate. The carbon-nitrogen bond forms because those two intermediates are made close to each other.", "refs": ["ace"]}, {"tr": "Bu tasarımda taşıyıcı da bir bileşendir. Azot katkılı karbon, tek nikel atomlarını kümeleşmeden tutan yüzeydir ve yazarların bildirdiği güçlü nikel-bakır elektronik eşleşmesi de iki bölgenin bu kadar yakın durabilmesine bağlıdır. Yerinde spektroskopi ve hesaplamalar, bu eşleşmenin *CO ikileşmesi ve *CCO-*NH2 birleşmesi gibi kritik adımların etkinleşme engelini düşürdüğüne işaret ediyor. Kazanç, yeni bir metal yerine iki bilinen metalin arasındaki mesafeden geliyor.", "en": "In this design the support is a component too. The nitrogen-doped carbon is the surface that keeps single nickel atoms from clustering, and the strong nickel-copper electronic coupling the authors report depends on the two sites being able to sit that close. In situ spectroscopy and calculations indicate that this coupling lowers the activation barriers for critical steps such as *CO dimerisation and *CCO-*NH2 coupling. The gain comes from the distance between two familiar metals rather than from a new one.", "refs": ["ace"]}]}, {"h": {"tr": "Sayılar neyi kanıtlar", "en": "What the numbers establish"}, "ps": [{"tr": "Bildirilen başarım iki sayıyı birlikte veriyor: santimetrekare başına 215,7 miliamperlik akım yoğunluğunda, gram katalizör başına saatte 257,3 milimol asetamit. Bu ikisinin birlikte verilmesi önemlidir, çünkü elektrokataliz sonuçları çoğu zaman düşük akımda ölçülür ve akım yükseldiğinde seçicilik düşer. Buradaki akım yoğunluğu, endüstriyel elektrolizörlerin çalıştığı aralıktadır. Üçüncü sayı 160 saatlik kararlı çalışmadır ve tek atomlu katalizörlerde asıl yıpranma mekanizması atomların yüzeyde göç edip kümeleşmesi olduğu için bu süre anlamlıdır.", "en": "The reported performance gives two numbers together: 257,3 millimoles of acetamide per hour per gram of catalyst at a current density of 215,7 milliamps per square centimetre. Giving both matters, because electrocatalysis results are often measured at low current and selectivity falls as current rises. The current density here sits in the range industrial electrolysers work at. The third number is 160 hours of stable operation, and that duration is meaningful because the main wear mechanism in single-atom catalysts is atoms migrating across the surface and clustering.", "refs": ["ace"]}, {"tr": "Bu sayıların kanıtladığı şey, tarif edilen yerleşimin çalıştığıdır. Bir üretim yolunun kurulduğunu ise kanıtlamazlar: gram başına verim, elektrot alanı başına verime çevrildiğinde katalizör yüklemesine bağlıdır; asetamidin seyreltik elektrolitten ayrılması ayrı bir işlem basamağıdır; nitratın nereden geleceği ayrı bir sorudur. Bunlar sıradaki basamaklardır. Burada kurulan şey bir tesis yerine bir tasarım kuralıdır: karmaşık bir elektrokimyasal tepkimede ara ürünleri hangi bölgede üreteceğinizi seçebiliyorsanız, hangi ürünü alacağınızı da seçebiliyorsunuz.", "en": "What those numbers establish is that the described arrangement works. They do not establish that a production route has been built: yield per gram, converted to yield per electrode area, depends on catalyst loading; separating acetamide from a dilute electrolyte is a further process step; and where the nitrate would come from is a separate question. Those are the steps that come next. What has been built here is a design rule rather than a plant: if you can choose which site makes which intermediate in a complex electrochemical reaction, you can choose which product you get.", "refs": ["ace"]}]}], "sources": [{"key": "ace", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76064-8", "title": {"tr": "Çift bölgeli katalizör, asetamidi doğrudan karbondioksit ve nitrattan üretiyor", "en": "A dual-site catalyst makes acetamide directly from carbon dioxide and nitrate"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-05", "title": {"tr": "Mutant bakteri bağırsağa yerleşti ve tümörü baskılayamadı", "en": "The mutant bacterium colonised the gut and failed to suppress the tumour"}, "excerpt": {"tr": "Obezite, bağırsak bakterileri ve kolorektal kanseri birbirine bağlayan çalışmalarda asıl güçlük, bakterinin mi yoksa ürettiği molekülün mü iş gördüğünü ayırmaktır. Bu çalışmada o ayrımı yapan tek bir denetim var.", "en": "In studies linking obesity, gut bacteria and colorectal cancer the hard part is separating the bacterium from the molecule it makes. In this study one control does that separating."}, "sections": [{"h": {"tr": "İlişki nerede kuruluyor", "en": "Where the association is made"}, "ps": [{"tr": "Nature Communications'ta yayımlanan çalışma iki ayrı kanıt türünü bir arada sunuyor. İnsan tarafında obeziteyle ilişkili kolorektal kanserde dışkı GABA'sının ve TPI1 anlatımının düşük olduğu görülüyor. Hayvan tarafında yüksek yağlı beslenme ve hastalardan aktarılan dışkı mikrobiyotası, GABA üreten Bacteroides ovatus bakterisini azaltıyor ve tümör oluşumu hızlanıyor.", "en": "The study published in Nature Communications presents two kinds of evidence together. On the human side, obesity-associated colorectal cancer shows lower faecal GABA and reduced TPI1 expression. On the animal side, a high-fat diet and faecal microbiota transferred from patients deplete the GABA-producing bacterium Bacteroides ovatus, and tumour formation speeds up.", "refs": ["gaba"]}, {"tr": "İnsan tarafındaki bulgu bir ilişkidir ve tek başına yönü belirlemez. Obezitede bağırsak florası pek çok yönden değişir; kolorektal kanserin kendisi de bağırsak içeriğini değiştirir. Düşük GABA'nın tümörü hızlandırdığı da, tümörün ve ona eşlik eden beslenme örüntüsünün GABA'yı düşürdüğü de aynı gözlemle uyumludur. Yönü belirleyecek olan, insan örneklerinin sayısı yerine hayvan tarafındaki deney tasarımıdır.", "en": "The human finding is an association and does not by itself fix the direction. In obesity the gut flora changes in many ways, and colorectal cancer itself alters gut contents. Low GABA accelerating the tumour and the tumour with its accompanying diet lowering GABA are both consistent with the same observation. What fixes the direction is the experimental design on the animal side rather than the number of human samples.", "refs": ["gaba"]}]}, {"h": {"tr": "Farkı yaratan denetim", "en": "The control that makes the difference"}, "ps": [{"tr": "Bir bakteriyi bağırsaktan çıkarıp tümörün hızlandığını görmek, sorumluyu göstermeye yetmez: bakteri yalnızca GABA üretmez, aynı zamanda yer kaplar, başka maddeler salgılar ve komşu türlerin dengesini değiştirir. Çalışmadaki kritik denetim bu belirsizliği kaldırıyor. GABA üretemeyen bir Bacteroides ovatus mutantı bağırsağa normal yerleşiyor, yani bakteriyle gelen her şey yerinde duruyor, ancak tümörü baskılayamıyor. Değişen tek şey moleküldür.", "en": "Removing a bacterium from the gut and watching the tumour accelerate does not identify the culprit: the bacterium does more than make GABA, it also occupies space, secretes other substances and shifts the balance of neighbouring species. The critical control in this study removes that ambiguity. A Bacteroides ovatus mutant unable to make GABA colonises the gut normally, so everything the bacterium brings with it stays in place, yet it fails to suppress the tumour. The one thing that changed is the molecule.", "refs": ["gaba"]}]}, {"h": {"tr": "Zincirin kalanı ve sınırı", "en": "The rest of the chain, and its limit"}, "ps": [{"tr": "Aynı yönde ikinci bir kanıt daha var: ağızdan GABA verilmesi ya da yabanıl tip bakterinin yeniden yerleştirilmesi tümör yükünü belirgin biçimde düşürüyor. Kaldırma ve geri koyma denemelerinin birlikte sonuç vermesi, tek yönlü bir gözlemden daha güçlü bir kanıttır. Mekanizma tarafında da zincir tek tek kurulmuş: GABA-B alıcısı, PI3K-HIF1α üzerinden TPI1, oradan PPP1CA'nın baskılanması ve YAP'ın fosforlu kalması.", "en": "A second line of evidence points the same way: oral GABA or recolonisation with the wild-type bacterium markedly reduces tumour burden. Removal and replacement experiments agreeing is stronger evidence than a one-directional observation. On the mechanism side the chain is built step by step as well: the GABA-B receptor, then TPI1 through PI3K-HIF1α, then inhibition of PPP1CA and YAP staying phosphorylated.", "refs": ["gaba"]}, {"tr": "Bu tasarımın gücü, sınırının nerede olduğunu da belirler. Nedensellik farelerde ve hücrelerde kurulmuştur; insanda kurulan şey ilişkidir. GABA'nın insanda tümörü yavaşlatıp yavaşlatmadığı, farede işleyen zincirin insanda da aynı biçimde işleyip işlemediğine bağlıdır ve bu ayrı bir sorudur. Ayrıca makale, dergide erken erişim için düzenlenmemiş kabul metni olarak yayımlandı; hakem sürecinden geçmiş olsa da son biçimini almış değil. Yine de burada ölçülmesi gereken şey sonucun çarpıcılığı yerine tasarımın kendi sınırını koruyup korumadığıdır ve bu çalışma korumuştur.", "en": "The strength of that design also marks where it stops. Causation is established in mice and cells; what is established in people is association. Whether GABA slows tumours in people depends on the chain that works in mice working the same way in humans, and that is a separate question. The paper also appears as an unedited accepted manuscript released for early access, so while it has been through review it is not in final form. Even so, what should be measured here is whether the design stayed inside its own limit rather than how striking the result is, and this study stayed inside it.", "refs": ["gaba"]}]}], "sources": [{"key": "gaba", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76079-1", "title": {"tr": "GABA üreten bağırsak bakterisinin azalması, farelerde bağırsak tümörünü hızlandırdı", "en": "Loss of a GABA-making gut bacterium accelerated bowel tumours in mice"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-06", "title": {"tr": "Hücre ile çevresi arasındaki konuşmayı sabitlemeye çalışan bir jel", "en": "A gel that tries to steady the conversation between a cell and its surroundings"}, "excerpt": {"tr": "Onarım malzemeleri uzun süre tek bir soruyla tasarlandı: ne kadar sert olmalı? Xi'an ekibinin jeli başka bir şeyi hedefliyor, sertliğin zaman içinde kaymasını engellemeyi.", "en": "Repair materials were long designed around one question: how stiff should this be? The gel from the Xi'an team aims at something else, stopping stiffness from drifting over time."}, "sections": [{"h": {"tr": "Hedefin yer değiştirmesi", "en": "A target moves"}, "ps": [{"tr": "Bir hücre, çevresindeki matrisin mekanik özelliklerini okur ve buna göre davranır: bölünür, farklılaşır, mineral biriktirir. Doku mühendisliğinin uzun süredir sorduğu soru bu okumanın hedef değeriydi. Xi'an Jiaotong Üniversitesi ekibinin çalışması soruyu değiştiriyor. Canlı doku matrisi sürekli yeniden biçimlendirir; süregelen glikasyon, yani şekerlerin proteinlere bağlanması, bu kaymayı büyütür ve hücreye ulaşan işaretleri istikrarsızlaştırır. Ekibin ViscoClamp adını verdiği hidrojel, doğru sertliği kurmak yerine sertliğin kaymasını sınırlamayı hedefliyor.", "en": "A cell reads the mechanical properties of the matrix around it and behaves accordingly: it divides, differentiates, lays down mineral. The question tissue engineering has long asked was what value that reading should target. The work from Xi'an Jiaotong University changes the question. Living tissue continually remodels its matrix, and chronic glycation, the binding of sugars to proteins, amplifies the drift and destabilises the cues reaching the cell. The hydrogel the team calls ViscoClamp aims at limiting how far stiffness drifts instead of establishing the right stiffness.", "refs": ["gel"]}, {"tr": "Bu, küçük görünen ama derin bir kayma. Bir değeri tutturmak bir kez yapılan iştir; bir değerin sabit kalmasını sağlamak sürekli yapılan iştir. Ekibin bunu ölçmek için kullandığı büyüklük de bu ayrıma göre kurulmuş: değişken glikasyon girdilerinin ne ölçüde sabit mekanik çıktılara sıkıştırıldığını gösteren bir dağılım aktarım oranı. Ölçülen şey ortalama bir sertlik yerine dalgalanmanın ne kadarının içeri geçtiğidir.", "en": "It is a small-looking but deep shift. Hitting a value is work done once; keeping a value steady is work done continuously. The quantity the team uses to measure it is built on that distinction: a dispersion-transfer ratio showing how far variable glycation inputs are compressed into stable micromechanical outputs. What gets measured is how much of the fluctuation gets through rather than an average stiffness.", "refs": ["gel"]}]}, {"h": {"tr": "Tırmanılan basamaklar", "en": "The steps actually climbed"}, "ps": [{"tr": "Malzeme, matrisin içine giren ve kalsiyum iyonlarına ve ileri glikasyon son ürünlerine ilgi duyan bir peptit hidrojeli. Bildirilen sonuçlara göre glikasyon yükünü tamponluyor ve viskoelastik kaymayı sınırlarken mezenkimal kök hücrelerin matrisi yeniden biçimlendirmesine ve mineralleştirmesine izin veriyor; ortamı dondurmadan sabitliyor. Kan şekeri yüksek hayvanlarda açılan kraniyofasiyal kemik boşluklarında hücre ölçeğindeki mekaniği sabitledi ve kemik onarımı ile mineralleşmeyi iyileştirdi. Denemeler sıçan, tavşan, beagle cinsi köpek ve rhesus makağında yürütüldü.", "en": "The material is a peptide hydrogel that interpenetrates the matrix and has affinity for calcium ions and advanced glycation end products. On the reported results it buffers the glycation load and constrains viscoelastic drift while still allowing mesenchymal stem cells to remodel and mineralise the matrix, stabilising the environment without freezing it. In craniofacial bone defects created in animals with high blood sugar, it steadied cell-scale mechanics and improved bone repair and mineralisation. The tests ran in rats, rabbits, beagle dogs and rhesus macaques.", "refs": ["gel"]}, {"tr": "Dört tür, bir cümlede geçtiğinden daha uzun bir yolculuktur. Kemik iyileşmesi tür büyüdükçe yavaşlar, yükleme biçimi değişir ve küçük hayvanlarda işe yarayan malzemeler bu geçişte sık sık elenir; rhesus makağında iyileşme göstermek küçük bir eşik sayılmaz. Yine de listede olmayan bir tür var ve o türün diyabetli hastaları bu malzemenin varlık nedenidir. Basamaklar tırmanıldı, merdiven bitmedi.", "en": "Four species is a longer journey than one sentence makes it sound. Bone healing slows as animals get larger, the pattern of loading changes, and materials that work in small animals are often eliminated at that transition; showing repair in a rhesus macaque counts as no small threshold. Even so, one species is missing from the list, and the diabetic patients of that species are the reason this material exists. The steps were climbed; the ladder does not end there.", "refs": ["gel"]}]}, {"h": {"tr": "Tasarımın kendisi de bir haber", "en": "The design itself is also news"}, "ps": [{"tr": "Bu malzemenin nasıl bulunduğu, ne yaptığı kadar dikkat çekici. Ekip peptidi, kural tabanlı sayma ve puanlama yordamıyla yürütülen yönlendirilmiş bir tasarım akışıyla seçti: aday diziler sistematik olarak üretiliyor, tanımlı ölçütlere göre puanlanıyor ve laboratuvara yalnızca üst sıradakiler giriyor. Bu, sezgiyle aday seçmenin yerine geçen bir arama biçimidir ve malzemenin kendisi kadar, bundan sonraki malzemelerin nasıl aranacağına dair bir örnektir.", "en": "How this material was found is as striking as what it does. The team selected the peptide through a guided design workflow built on rule-based enumeration and scoring: candidate sequences are generated systematically, scored against defined criteria, and only the top-ranked ones reach the bench. It is a form of search standing in for intuition in choosing candidates, and it is as much an example of how the next materials will be looked for as it is a material.", "refs": ["gel"]}, {"tr": "Yine de bir arama yöntemi, aradığı şeyin doğru şey olduğunu kanıtlamaz. Bu çalışmanın ileri sürdüğü asıl fikir, hücrenin çevresindeki mekanik istikrarın kendi başına tedavi edilebilir bir büyüklük olduğudur. Bu fikir doğruysa etkisi kraniyofasiyal kemikle sınırlı kalmaz, çünkü glikasyon yaşlanan ve şeker düzeyi yüksek her dokuda işler. Yanlışsa, elimizde iyi çalışan bir jel ve fazla geniş bir açıklama kalır. İkisini ayıracak olan, diyabetli hastalarda kemik onarımını karşılaştırmalı ölçen bir çalışmadır. O gelene kadar burada olan şey bir sorudur: bir hücreye ne söylediğimiz kadar, o sözü ne kadar sabit tuttuğumuz da önemli olabilir.", "en": "A search method, though, does not prove that what it searched for was the right thing. The real idea this work advances is that mechanical stability around a cell is itself a treatable quantity. If that idea is right its reach will not stop at craniofacial bone, because glycation operates in every ageing and sugar-rich tissue. If it is wrong, what remains is a gel that works well and an explanation stretched too far. What will separate the two is a study measuring bone repair comparatively in patients with diabetes. Until then what is here is a question: how steadily we hold what we say to a cell may matter as much as what we say.", "refs": ["gel"]}]}], "sources": [{"key": "gel", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76070-w", "title": {"tr": "Peptit jel, hücre çevresindeki mekanik ortamı sabit tutarak dört türde kemik onarımını iyileştirdi", "en": "A peptide gel steadied the mechanical surroundings of cells and improved bone repair in four species"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-01", "title": {"tr": "Parlamayı iki yıl geride bırakan bir radyo ışıması", "en": "A radio glow that outlasted the flash by two years"}, "excerpt": {"tr": "AT2019ijn beş günde parladı, haftalar içinde söndü. Yaklaşık iki yıl sonra radyo ışıması, karşılaştırılabileceği her şeyin on katından fazlasına ulaştı; gözlemin bize getirdiği şey bir kimlik değil, bu sayı.", "en": "AT2019ijn brightened in five days and faded within weeks. Nearly two years later its radio emission peaked at more than ten times that of anything it can be compared with, and that number, rather than an identification, is what the observation delivers."}, "sections": [{"h": {"tr": "Beş günde yükseliş, kırk altı günde iniş", "en": "Five days up, forty-six days down"}, "ps": [{"tr": "Kaynağı, kırmızıya kayması 0,2729 olan bir cüce gökadanın çekirdeğinde Zwicky Geçici Kaynak Tesisi (ZTF) buldu; teleskop taramasının çıkardığı ışık eğrisi belirli bir açıdan alışılmadık: eksi 21,05 mutlak parlaklığa 5,26 günde ulaştı, sonra bu parlaklığın yarısına inmesi 46,3 gün sürdü. Her iki evrede de uyarlanan kara cisim sıcaklığı kabaca 14.500 ile 16.000 kelvin arasında kaldı; yani kaynak, soğuyan sıradan bir patlamanın yaptığı gibi kızıla kaymadı.", "en": "The source was found in the nucleus of a dwarf galaxy at a redshift of 0.2729 by the Zwicky Transient Facility (ZTF), and the light curve this telescope survey produced is unusual in a specific way. It reached a peak absolute magnitude of minus 21.05 in 5.26 days, then took 46.3 days to fall to half that brightness. Through both phases the fitted blackbody temperature stayed between roughly 14,500 and 16,000 kelvin, so the source did not redden the way an ordinary explosion does as it cools.", "refs": ["at2019ijn"]}, {"tr": "Hızlı yükseliş, yavaş sönüş ve soğumayan bir renk, yazarların karşılaştırma yaptığı parlak hızlı mavi geçici kaynak sınıfını tanımlayan bileşim. Buradaki sıcaklığın doğrudan bir ölçüm değil, kara cisme uyarlama sonucu olması önemli: ışıyan yüzey hakkında ancak kara cisim varsayımı geçerli kaldığı ölçüde bir sınır koyuyor. Bir renk sıcaklığı, kaynağın gerçekten bir yüzeyi olduğunu göstermez; ışığın nasıl toplandığını gösterir.", "en": "Fast rise, slow decay and a colour that will not cool is the combination defining the class of luminous fast blue optical transients against which the authors measure this object. That the temperature is a fit to a blackbody rather than a direct measurement matters: it constrains the emitting surface only as far as the blackbody assumption holds. A colour temperature does not establish that the source has a surface; it describes how the light is assembled.", "refs": ["at2019ijn"]}]}, {"h": {"tr": "Yerine oturmayan sayı", "en": "The number that does not fit"}, "ps": [{"tr": "Radyo ışıması optik keşiften 641 gün sonra, saniyede hertz başına 2,0 çarpı 10 üzeri 31 erg ile doruğa çıktı. Bu hakemli çalışmada yazarlar bunun bilinen hiçbir parlak hızlı mavi geçici kaynağın ya da süperparlak süpernovanın bir büyüklük mertebesinden fazla üzerinde olduğunu belirtiyor ve gecikme en az parlaklık kadar bilgilendirici: neredeyse iki yıl sonra gelen bir doruk, ışıyan şokun ancak o noktada yeterince yoğun bir ortama ulaştığı ya da hâlâ beslendiği anlamına geliyor.", "en": "The radio emission peaked 641 days after the optical discovery, at 2.0 times 10 to the power of 31 erg per second per hertz. In this peer-reviewed study the authors state this is more than an order of magnitude above any known luminous fast blue optical transient or superluminous supernova, and the delay is as informative as the brightness. A peak arriving nearly two years late means the emitting shock only reached dense enough surroundings at that point, or was still being fed.", "refs": ["at2019ijn"]}, {"tr": "Tercih ettikleri okuma, yaklaşık 1,3 çarpı 10 üzeri 5 Güneş kütlesindeki orta kütleli bir kara delikte bir yıldızın parçalanmasıyla fırlayan ve ekseninden yaklaşık 39 derece uzaktan görülen bir jet. Eşyönlü eşdeğer jet enerjisi olan 6,9 çarpı 10 üzeri 54 erg fiziksel bir enerjiden çok bir muhasebe büyüklüğü sayılmalı: kaynak her yöne eşit ışısaydı gerekecek olan değerdir ve eksen dışı bir jet tanımı gereği böyle ışımaz. Makale jetli manyetar modelinin tümüyle dışlanamadığını açıkça yazıyor, dolayısıyla elimizde iki açıklama var, biri değil.", "en": "Their preferred reading is a jet launched as a star came apart on an intermediate-mass black hole of roughly 1.3 times 10 to the power of 5 solar masses, seen about 39 degrees off its axis. The isotropic-equivalent jet energy of 6.9 times 10 to the power of 54 erg should be read as bookkeeping rather than a physical energy: it is what the source would need if it radiated equally in every direction, which an off-axis jet by construction does not. The paper states plainly that a jetted magnetar cannot be fully ruled out, so what we hold is two explanations rather than one.", "refs": ["at2019ijn"]}]}, {"h": {"tr": "Bir sonraki gözlemin ayırması gereken", "en": "What the next observation has to separate"}, "ps": [{"tr": "Yazarlar modellerinin geç dönem S bandı verisinden ayrıldığını belirtiyor ve farkı kendi basitleştirmelerine, düz tepeli bir jet profiline ve tekdüze bir yıldızlararası yoğunluğa bağlıyor. İki resmin üzerine gidilebilecek yer tam olarak burası, çünkü her iki basitleştirme de geometri ve ortam hakkında birer varsayım ve sürdürülen çok frekanslı radyo gözlemi bunları doğrudan sınırlıyor.", "en": "The authors note that their model departs from the later S-band data and attribute the gap to their own simplifications, a top-hat jet profile and a uniform interstellar density. That is precisely where the two pictures can be pressed, because both simplifications are assumptions about geometry and environment, and continued multi-frequency radio observation constrains them directly.", "refs": ["at2019ijn"]}, {"tr": "10 üzeri 5 Güneş kütlesindeki bir kara delik, ne yıldız çöküşünün ne de iyi incelenmiş dev kara delik nüfusunun rahatça açıkladığı kütle aralığında duruyor; belirsiz bir kimlik tespitinin yine de değerli olmasının nedeni bu. İki canlı açıklaması olan tek bir nesne, AT2019ijn'in ne olduğunu çözmüyor; bir sonraki taramanın nereye bakacağını ve bir izleme gözleminin seçim yapabilmek için neyi ölçmesi gerektiğini daraltıyor. Radyo fazlalığının jetin kendi özelliği mi yoksa jetin çarptığı ortamın özelliği mi olduğu, ışığın bize bıraktığı soru.", "en": "A black hole of 10 to the power of 5 solar masses sits in the mass range that neither stellar collapse nor the well-studied population of giant black holes accounts for comfortably, which is why an uncertain identification is still worth something. One object with two live explanations does not settle what AT2019ijn was; it narrows where the next survey should point and what a follow-up would have to measure in order to choose. Whether the radio excess belongs to the jet or to what the jet ran into is the question the light has left us.", "refs": ["at2019ijn"]}]}], "sources": [{"key": "at2019ijn", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-rare-blue-optical-transient-class.html", "title": {"tr": "Bir cüce gökadadaki mavi geçici parlama, bilinen benzerlerinin bir büyüklük mertebesi üzerinde radyo ışıması taşıyor", "en": "A blue transient in a dwarf galaxy carries radio emission an order of magnitude above known comparisons"}, "publishedDate": "2026-07-25", "primary": {"kind": "paper", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae732c", "publishedDate": "2026-07-06", "title": {"tr": "AT2019ijn: Olağanüstü parlak radyo ışıması olan, hızlı yükselen ve yavaş sönen bir mavi optik geçici kaynak", "en": "AT2019ijn: A Fast-rising, Slow-decaying Blue Optical Transient with Exceptionally Bright Radio Emission"}}}], "date": "2026-07-26"}, {"writer": "sci-02", "title": {"tr": "Kombinasyon kolundakilerin yaklaşık yarısında yanıt altıncı ayda sürüyordu", "en": "Close to half of the combination arm still had a response at six months"}, "excerpt": {"tr": "Bağışıklık kaynaklı trombositopenisi kortikosteroide ve bir sonraki tedaviye yanıt vermemiş kişilerde danazole düşük doz barisitinib eklenmesi, altı aylık kalıcı yanıtı yüzde 20,4'ten yüzde 45,4'e çıkardı. Bunun ne kadar değerli olduğu karşılaştırma koluna, kimin körlendiğine ve güvenlilik sayılarının kaç hastaya dayandığına bağlı.", "en": "In people whose immune thrombocytopenia had already failed steroids and one further treatment, adding low-dose baricitinib to danazol took six-month durable response from 20.4 per cent to 45.4 per cent. What that is worth depends on the comparator, on who was blinded, and on how many patients the safety numbers rest on."}, "sections": [{"h": {"tr": "Kimler alındı ve neyle karşılaştırıldı?", "en": "Who was enrolled, and against what"}, "ps": [{"tr": "Çalışmaya alınan hasta grubu dar ve doğru biçimde dar: bağışıklık kaynaklı trombositopenisi kortikosteroide ve önerilen en az bir sonraki tedaviye yanıt vermemiş erişkinler, birden çok merkezde merkezi bir ağ sistemiyle 108 ve 108 olarak rastgeleleştirildi. Birincil sonlanım noktası önceden altıncı ayda kalıcı yanıt olarak belirlenmişti; iyi bir günde ölçülen tek bir trombosit değeri değil. Bu ayrım, hasta için anlam taşıyan bir sayı ile yalnızca grafikte anlam taşıyan bir sayı arasındaki farkın büyük bölümünü oluşturuyor.", "en": "The enrolled group is narrow, and narrow in the right way: adults whose immune thrombocytopenia had failed corticosteroids and at least one recommended subsequent treatment, randomised 108 and 108 through a central web-based system across several centres. The primary endpoint was prespecified as durable response at six months rather than a platelet count on one good day. That distinction accounts for most of the difference between a number that means something to a patient and one that means something to a graph.", "refs": ["itp-trial"]}, {"tr": "Karşılaştırma kolu tek başına danazol. Bu, çalışmanın yanıtladığı soruyu belirli kılıyor: bu hasta grubunda danazole barisitinib eklemek yarar sağlıyor mu? Bir hematoloğun sırada başvuracağı tedavilerle kombinasyonun karşılaştırılması sorusunu yanıtlamıyor. Mutlak fark 25 puan, yani bir ek kalıcı yanıt için yaklaşık dört hastanın kombinasyonla tedavi edilmesi gerekiyor; seçenekleri zaten tükenmiş olmakla tanımlanan bir grupta bu iyi bir sayı.", "en": "The comparator is danazol alone. That makes the question the trial answers a specific one: in this group, does adding baricitinib to danazol help? It does not answer whether the combination beats the treatments a haematologist would otherwise reach for next. The absolute difference is 25 percentage points, so roughly four patients must be treated with the combination for one additional durable response, which is a good number in a group defined by having already run out of options.", "refs": ["itp-trial"]}, {"tr": "Hastalar ve bakım verenler hangi kolda olduklarını biliyordu; etkililiği değerlendiren araştırmacılar bilmiyordu. Laboratuvarda ölçülen trombosit sayısına dayanan bir sonlanım noktası için bu sıralama ölçümü makul ölçüde koruyor. Körlemenin kalkmasının dokunabileceği her şeyi korumuyor ve sonucu tutmanın dürüst yolu şu: etki, tek başına beklentiyle açıklanamayacak kadar büyük; beklenti dışlanmış değil.", "en": "Patients and caregivers knew their assignment; the investigators judging efficacy did not. For an endpoint anchored in laboratory platelet counts, that ordering protects the measurement reasonably well. It does not protect everything unblinding can touch, and the honest way to hold the result is that the effect is large enough that expectation alone is an unlikely explanation, not that expectation was excluded.", "refs": ["itp-trial"]}]}, {"h": {"tr": "Yüz sekiz hasta güvenlilik hakkında neyi söyleyebilir?", "en": "What 108 patients can say about safety"}, "ps": [{"tr": "Güvenlilik kümesi kombinasyon kolunda 108, tek ilaç kolunda 105; rastgeleleştirilenden üç kişi eksik, çünkü bu küme yalnızca en az bir doz almış hastaları sayıyor. En az bir istenmeyen etki bildirenlerin oranı yüzde 48,1 ve yüzde 44,7, aradaki fark 3,4 puan. Her iki kolda ikişer hasta istenmeyen etki nedeniyle çalışmadan ayrıldı ve birer hastada derece 3 veya daha ağır bir olay görüldü.", "en": "The safety set is 108 in the combination arm and 105 in the monotherapy arm, three fewer than were randomised, because it counts only patients who received at least one dose. At least one adverse event was reported by 48.1 per cent and 44.7 per cent, a gap of 3.4 points. Each arm had two discontinuations for adverse events and one event of grade 3 or worse.", "refs": ["itp-trial"]}, {"tr": "Dikkatle okunduğunda bu sayılar iki şey söylüyor: eklenen ilaç bu dozda ve bu sürede görünür bir zehirlilik artışı yaratmadı, ve çalışma seyrek bir zararı bulacak büyüklükte hiç tasarlanmamıştı. Kol başına yaklaşık yüz hasta ve altı aylık izlemle, yüz hastadan azında görülen bir istenmeyen etki fark edilmeden geçebilir; ortaya çıkması bir yıl alan bir zarar ise hiç görülemez. Bunların hiçbiri çalışmaya yönelik bir eleştiri değil; ikisi de paydasının sınırları.", "en": "Read carefully, those numbers say two things: the added drug did not visibly raise toxicity at this dose over this duration, and the trial was never sized to find a rare harm. With about a hundred patients per arm and six months of follow-up, an adverse event occurring in fewer than one patient in a hundred can pass unseen, and a harm that takes a year to appear cannot be seen at all. Neither of these is a criticism of the trial; both are limits of its denominator.", "refs": ["itp-trial"]}, {"tr": "Şu anda erişilebilen sürüm, derginin yayımdan önce daha fazla düzenlemeden geçeceğini belirttiği düzenlenmemiş kabul edilmiş metin. Faz 2 sonucu için bu, ondalıkları gevşek tutmak için bir neden; yönü gevşek tutmak için değil. Yön şu: hâlihazırda var olan iki ilaçtan kurulan bir kombinasyon, yardım edilmesi güç bir hasta grubunda daha büyük bir çalışmayı hak etti. Altı ayın ötesinde kalıcılık sorusu da o çalışmada yanıtlanacak.", "en": "The version currently available is the unedited accepted manuscript, which the journal flags as subject to further editing before final publication. For a phase 2 result that is a reason to hold the decimals loosely rather than the direction. The direction is that a combination assembled from two already available drugs earned a larger trial in a group of patients who are hard to help, and durability past six months is a question that trial will answer.", "refs": ["itp-trial"]}]}], "sources": [{"key": "itp-trial", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75344-7", "title": {"tr": "Randomize faz 2 çalışmada danazole düşük doz barisitinib eklenmesi altı aylık kalıcı yanıtı iki katına çıkardı", "en": "Adding low-dose baricitinib to danazol doubled six-month durable response in a randomised phase 2 trial"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "sci-03", "title": {"tr": "Gelgit sulak alanlarının kırılma noktası yılda dokuz milimetrede", "en": "The breaking point for tidal wetlands sits at nine millimetres a year"}, "excerpt": {"tr": "Yirmi yıllık uydu gözlemi, tuzcul bataklıklarla mangrovların suya yetişmeyi bıraktığı yere bir sayı koyuyor. Bağıl deniz seviyesi yükselişi yılda dokuz milimetreyi aştığında kayıp hızı sekiz kat artıyor ve bunu geciktirebilecek tampon, tortu beslemesiyle çalışıyor.", "en": "Two decades of satellite observation put a number on where salt marshes and mangroves stop keeping up with the water. Above nine millimetres of relative sea-level rise a year the loss rate rises eightfold, and the buffer that might delay it runs on sediment supply."}, "sections": [{"h": {"tr": "Ölçülen büyüklük yerel, küresel değil", "en": "The quantity measured is local, not global"}, "ps": [{"tr": "Ölçülen değişken bağıl deniz seviyesi yükselişi: suyun belirli bir kıyı parçasına göre yükselme hızı. Yerel çökmeyi de içeriyor ve küresel ortalama değil. Sonucun bütün kullanışlılığı bu ayrımda, çünkü çöken deltalar eşiği aşarken küresel ortalama çok altında kalabilir. Son yirmi yılın çok kaynaklı uzaktan algılama verisinde alan kaybı bu hızla doğrusal olmayan biçimde artıyor; yılda 9 milimetrenin üzerinde kaybın hızlanma olasılığı yüzde 92'yi geçiyor ve kayıp hızının kendisi sekiz katına çıkıyor.", "en": "The variable measured is relative sea-level rise: the rate at which water rises against a particular stretch of coast. It includes local subsidence and it is not the global mean. The whole usefulness of the result lies in that distinction, because subsiding deltas can be crossing the threshold while the global average sits well below it. Across two decades of multi-source remote sensing, area loss rises nonlinearly with that rate; above 9 millimetres a year the probability that loss is accelerating exceeds 92 per cent, and the loss rate itself rises eightfold.", "refs": ["wetland-thresholds"]}, {"tr": "Boğulmayla tanımlanan bir eşiğin gerektirdiği mekanizma düşey: bir bataklık yükselen suyla, tortu tutup kendi yüzeyini yukarı doğru inşa ederek başa çıkar ve su yüzeyin birikebileceğinden hızlı yükseldiğinde bitkiler boğulur. Çalışmanın eklediği şey, başarısızlığın kademeli yerine ani gelmesi. İki sistem benzer bir kırılma noktasına varıyor ama oraya farklı geliyor: bataklıklar yolda kademeli olarak inceliyor, mangrovlar eşik aşılana kadar neredeyse durağan kalıyor. Bu da mangrov durağanlığını iki işaretten daha az güven verici olanı yapıyor.", "en": "The mechanism a drowning threshold implies is vertical: a marsh copes with rising water by trapping sediment and building its own surface upward, and when the water rises faster than the surface can accrete, the plants drown. What the study adds is that the failure arrives abruptly rather than gradually. The two systems reach a similar breaking point, though they arrive differently: marshes thin progressively on the way, while mangroves hold almost steady until the threshold is crossed. That makes mangrove stability the less reassuring of the two signals.", "refs": ["wetland-thresholds"]}]}, {"h": {"tr": "Tamponun nerede olduğu ve ne kadar olduğu", "en": "Where the buffer is, and how much of it there is"}, "ps": [{"tr": "Doğrudan su altında kalmaya bağlı kayıp için eşik yılda yaklaşık 8 milimetrede duruyor, yanal değişimin eşiğinin biraz altında, ve çalışma bu farkı gelgit genliği ile tortu beslemesine bağlıyor. Bir kıyı yönetiminin gerçekten elinde tuttuğu kaldıraç burada: gelgit genliği coğrafyanın verdiği bir büyüklük, tortu beslemesi değil. Bir haliçe ne kadar mil ulaşacağına barajlar, kanal düzenlemeleri ve tarama işleri karar veriyor ve bunların altında imzalar var.", "en": "Direct inundation loss has a threshold of about 8 millimetres a year, marginally below the one for lateral change, and the study attributes that difference to tidal range and sediment supply. This is where a coastal authority actually holds a lever: tidal range is given by geography, sediment supply is not. Dams, channel training and dredging decide how much silt reaches an estuary, and those decisions carry signatures.", "refs": ["wetland-thresholds"]}, {"tr": "Bu kaldıracın büyüklüğü abartılmamalı. Yanal değişimin eşiğinin biraz daha yüksek olması, yanal süreçlerin hızlı kaybın başlangıcını engellemek yerine geciktirdiği anlamına geliyor; bağıl yükseliş yılda 9 milimetrenin üzerine çıktığında sekiz kat rakamı, tortu tamponu olan sistemler için de olmayanlar için de geçerli oluyor. Tortu beslemesini onarmak eşiğe yaklaşırken zaman kazandırıyor ve seçeneğin ani bir geçiş olduğu yerde asıl kaynak zamandır.", "en": "The size of that lever should not be overstated. A marginally higher threshold for lateral change means lateral processes delay the onset of rapid loss rather than prevent it; once relative rise passes 9 millimetres a year, the eightfold figure applies to systems that had a sediment buffer as well as to those that did not. Restoring sediment supply buys time on the approach to the threshold, and where the alternative is an abrupt transition, time is the resource that counts.", "refs": ["wetland-thresholds"]}]}, {"h": {"tr": "Sayının yapamadığı şey", "en": "What the number cannot do"}, "ps": [{"tr": "Bu, tek bir kıyı için çalıştırılmış bir süreç modeli değil, çok sayıda bölge üzerinden gözlenmiş bir ilişki ve bu, dile getirilmesi gereken belirli bir alternatifi beraberinde getiriyor: görünen eşik kısmen, en hızlı bağıl yükselişi yaşayan kıyıların aynı zamanda tortu beslemesi çoktan kesilmiş kıyılar olmasını yansıtıyor olabilir. O durumda 9 milimetredeki kırılma, bitkilerin fiziksel sınırından çok baskıların çakışmasını işaret ediyor olurdu. Yazarlar rakamı öngörüleri iyileştirmeye yarayacak gözlemsel bir ölçüt olarak sunuyor; verilmesi gereken ağırlık da bu.", "en": "This is a relationship observed across many sites rather than a process model run for any one coast, and that brings a specific alternative worth stating: the apparent threshold may partly reflect the fact that the coasts experiencing the fastest relative rise are also the ones whose sediment supply was cut off long ago. In that case the break at 9 millimetres would mark a coincidence of stresses rather than a physical limit of the plants. The authors present the figure as an observational benchmark for refining projections, and that is the weight it should carry.", "refs": ["wetland-thresholds"]}, {"tr": "Bu iki okumayı ayıracak işaret gözlenebilir ve yeni bir uyduya gerek duymuyor. Eşiğin üzerinde bulunan kıyılar, aralarında çöken deltalar da olmak üzere, aynı görüntüleme verisinin önümüzdeki birkaç yılında küresel ilişkinin öngördüğü sekiz kat kayıp hızını göstermeli. Göstermedikleri yerde tortu beslemesi, eşikteki küçük kaymanın düşündürdüğünden fazlasını yapıyor demektir. Her iki durumda da sayı artık yararlı bir yönde yanlış çıkacak kadar belirli.", "en": "The signal that would separate those readings is observable and needs no new satellite. Coasts already above the threshold, subsiding deltas among them, should show the eightfold loss rate the global relation predicts within the next few years of the same imagery. Where they do not, sediment supply is doing more than a marginal shift in the threshold suggests. Either way the number is now specific enough to be wrong in a useful direction.", "refs": ["wetland-thresholds"]}]}], "sources": [{"key": "wetland-thresholds", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76031-3", "title": {"tr": "Bağıl deniz seviyesi yükselişi yılda dokuz milimetreyi aşınca gelgit sulak alanlarındaki kayıp hızlanıyor", "en": "Tidal wetland loss accelerates once relative sea-level rise passes about nine millimetres a year"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "sci-04", "title": {"tr": "Bu kez maser bir yarıiletkenin içinde çalıştı", "en": "This time the maser ran inside a semiconductor"}, "excerpt": {"tr": "Bir silisyum karbür kristali, yüzde 0,4 verimle çalışan bir optik uyarma ve rezonatöre sahip olmadığı bir kalite çarpanını ödünç veren bir geri besleme döngüsü. Düzenek çalışıyor ve makale, tanıtımının hangi bölümünü henüz hak etmediği konusunda alışılmadık ölçüde açık.", "en": "A silicon carbide crystal, an optical pump running at 0.4 per cent efficiency, and a feedback loop that lends the resonator a quality factor it does not have. The device works, and the paper is unusually clear about which parts of the pitch it has not yet earned."}, "sections": [{"h": {"tr": "Yapılan şey", "en": "What was built"}, "ps": [{"tr": "Bir maser, yani mikrodalga bölgesinde çalışan bir uyarılmış ışıma yükselteci, üç parça ister ve burada bunlardan yalnızca biri yeni. Kazanç ortamı, 4H silisyum karbürdeki silisyum boşluğu; yakın kızılötesiyle uyarılıp spin yönelimli dörtlü taban durumuna getiriliyor ve yaklaşık 2,5 militeslanın üzerindeki bir dış alan, taban durumu düzeylerinin kesişme noktasını aşarak popülasyonları ters çeviriyor. Rezonatör 9,3 gigahertzde ve bu, çınlama alanını 333 militesla dolayına yerleştiriyor. Oda sıcaklığında çalışan maserler pentasende ve elmastaki azot-boşluk merkezlerinde zaten var; makalenin öne sürdüğü sav bu yüzden kesin: bu, bir yarıiletkendeki ilki.", "en": "A maser, an amplifier that runs on stimulated emission in the microwave band, needs three parts, and only one of them is new here. The gain medium is the silicon vacancy in 4H silicon carbide, optically pumped in the near infrared into a spin-polarised quartet ground state; an external field above about 2.5 millitesla carries the populations past the ground-state level anti-crossing and inverts them. The resonator sits at 9.3 gigahertz, which places the resonant field near 333 millitesla. Room-temperature masers already exist in pentacene and in diamond nitrogen-vacancy centres, so the claim the paper makes is precise: this is the first one in a semiconductor.", "refs": ["sic-maser"]}, {"tr": "Yükü taşıyan bileşen burada kristal yerine döngü. Maser eşiğinde gereken rezonatör kalite çarpanı, katkıda bulunan spin sayısıyla ve eşleşmenin karesiyle ters orantılı ölçekleniyor ve makaledeki ilk ölçüm tam bu eşikte duruyor: çıktı, ısıl arka plandan ancak kıl payı ayrılıyor. Çözüm kriyojenik yerine elektronik. Dışarı çıkan mikrodalga sinyalinin yarısı yükseltiliyor ve fazı düzeltilerek rezonatöre geri veriliyor; bu, çevrim başına etkin kaybı azaltıyor ve kalite çarpanını beş katına çıkarıyor. Sınırdaki bir sinyali sürekli dalga çalışmasına çeviren şey bu.", "en": "The load-bearing component here is the loop rather than the crystal. At the maser threshold the required resonator quality factor scales inversely with the number of participating spins and with the square of the coupling, and the paper's first measurement sits exactly at that threshold, its output barely separable from the thermal background. The fix is electronic rather than cryogenic: half the outgoing microwave signal is amplified and fed back into the resonator phase-corrected, which reduces the effective loss per cycle and raises the quality factor by a factor of five. That is what turns a marginal signal into continuous-wave operation.", "refs": ["sic-maser"]}, {"tr": "Akılda tutulması gereken sayı verim. Çıkarılan optik uyarma verimi yaklaşık yüzde 0,4 ve yazarlar bunu uyarma yolundaki kayıplara, silisyum karbür yüzeyindeki yansımaya ve örnekten geçip giden ışığa bağlıyor. Gelen fotonların neredeyse tamamı hiçbir iş yapmıyor. Ekip, seçmedikleri diğer yolu da adlandırıyor: silisyum-28'e izotopik saflaştırma eşuyum süresini uzatır ve etkin spin sayısını neredeyse ikiye katlardı, yani aynı eşiğe öbür taraftan varılırdı.", "en": "The number to keep is the efficiency. The extracted optical pump efficiency is about 0.4 per cent, which the authors attribute to losses in the excitation path, reflection at the silicon carbide surface and light passing straight through the sample. Almost every incident photon does nothing. The team also names the route they did not take: isotopic purification to silicon-28 would lengthen the coherence time and nearly double the effective spin count, which is the same threshold reached from the other side.", "refs": ["sic-maser"]}]}, {"h": {"tr": "Henüz yapılmayan şey", "en": "What has not been built"}, "ps": [{"tr": "Öne çıkan uygulama bir önyükselteç ve 10 desibeli aşan ölçülmüş kazanç 110 kelvinde, spin-örgü gevşemesinin daha yavaş ve bakır duvarların daha az kayıplı olduğu bir kriyostatın içinde alındı. 30 desibelin ötesindeki değer benzetim. Bunlar aynı düzenek hakkında üç ayrı türden ifade ve makale bunları birbirinden ayrı tutuyor; bu sonucun özetlenmiş sürümlerinin yapacağından fazlası.", "en": "The headline application is a preamplifier, and the measured gain exceeding 10 decibels was taken at 110 kelvin, inside a cryostat where spin-lattice relaxation is slower and the copper walls are less lossy. The figure beyond 30 decibels is a simulation. Those are three different kinds of statement about the same device, and the paper keeps them apart, which is more than the summarised versions of this result will.", "refs": ["sic-maser"]}, {"tr": "Makaledeki en yararlı cümle bir öz değerlendirme: maserin gürültü başarımı, kendi geri besleme döngüsünde kullanılan düşük gürültülü yükseltecinkinden belirgin biçimde daha kötü, çünkü maser manyetik alana aşırı duyarlı. Çalışmasına yardım eden ticari yükselteçten daha gürültülü bir düşük gürültülü önyükselteç henüz bir önyükselteç değildir. Manyetometri savını ilginç kılan da aynı duyarlık ve ikisi aynı yönde birden eniyilenemiyor.", "en": "The most useful sentence in the paper is a self-assessment: the maser's noise performance is significantly worse than that of the low-noise amplifier used inside its own feedback loop, because the maser is so sensitive to magnetic field. A low-noise preamplifier noisier than the commercial amplifier helping it run is not yet a preamplifier. The same sensitivity is what makes the magnetometry claim interesting, and the two cannot be optimised in the same direction at once.", "refs": ["sic-maser"]}, {"tr": "Manyetometri değeri de aynı okumayı hak ediyor. Karşıtlık-çizgi genişliği oranındaki dokuz büyüklük mertebesi iyileşme bir başarım ölçütü ve ondan türeyen kök hertz başına 20 pikotesla, uyarma lazerinin bağıl şiddet gürültüsünden çıkarılan bir kestirim; alan uygulanarak ölçülmüş bir gürültü tabanı değil. Makalenin adlandırdığı varış noktası, küçük ve elektrikle sürülen bir maser diyodu, optik uyarmanın yerine elektriksel enjeksiyonu koymayı gerektiriyor ve var olmayan bileşen tam olarak bu. Gösterilen şey, taşıyıcı malzemenin çalıştırılabildiği; geriye kalan uyarma, gürültü ve paketleme.", "en": "The magnetometry figure deserves the same reading. A nine-order-of-magnitude improvement in contrast-to-linewidth ratio is a figure of merit, and the 20 picotesla per root hertz that follows from it is an estimate derived from the excitation laser's relative intensity noise rather than a noise floor measured with a field applied. The destination the paper names, a compact electrically driven maser diode, requires replacing the optical pump with electrical injection, and that is exactly the component that does not exist. What has been demonstrated is that the host material can be made to work; what remains is the pump, the noise and the packaging.", "refs": ["sic-maser"]}]}], "sources": [{"key": "sic-maser", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75446-2", "title": {"tr": "Araştırmacılar silisyum karbürdeki silisyum boşluklarına dayanan ilk yarıiletken maseri bildirdi", "en": "Researchers report the first semiconductor maser, built on silicon vacancies in silicon carbide"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "sci-05", "title": {"tr": "Yaygın kullanılan bir evrim modeli sonsuz sayıda başka yanıta da aynı ölçüde uyuyor", "en": "A widely used evolutionary model fits infinitely many other answers equally well"}, "excerpt": {"tr": "Duruma bağlı türleşme ve tükeniş modelleri, biyologların bir özelliğin çeşitlenmeyi hızlandırıp hızlandırmadığını sorma biçimi. İki yazar, bu modellere rutin olarak eklenen gizli durumların özellikten bağımsız her senaryoyu sonsuz bir özelliğe bağlı senaryolar ailesiyle uyuşur kıldığını gösteriyor ve ardından bunun hangi bölümünün onarılabildiğini adlandırıyor.", "en": "State-dependent speciation and extinction models are how biologists ask whether a trait speeds up diversification. Two authors show that the hidden states routinely added to those models make every trait-independent scenario congruent with an infinite family of trait-dependent ones, and then name which part of that is fixable."}, "sections": [{"h": {"tr": "Burada ayırt edilemezliğin anlamı", "en": "What unidentifiability means here"}, "ps": [{"tr": "Gizli durumlar bu modellere iyi bir gerekçeyle ekleniyor: gözlenmemiş etkenleri soğuruyorlar, aksi halde bu etkenler incelenen özelliğe yazılırdı ve bunları eklemek tam da temkinli hamle olduğu için standart uygulama haline geldi. Bulgu şu: temkinli hamlenin kendisi sorunu yaratıyor. Gizli durumlar varken özellikten bağımsız her senaryo, sonsuz sayıda özelliğe bağlı senaryoyla uyuşuyor; yani olabilirlik hepsine aynı değeri veriyor ve hiçbir veri miktarı bunları ayırmıyor.", "en": "Hidden states are added to these models for a good reason: they absorb unobserved factors that would otherwise be attributed to the trait under study, and adding them became standard practice precisely because it is the cautious move. The finding is that the cautious move creates the problem. With hidden states present, every trait-independent scenario is congruent with an infinite set of trait-dependent ones, meaning the likelihood assigns them all the same value and no quantity of data separates them.", "refs": ["sse-congruence"]}, {"tr": "Tutulması gereken sözcük asimptotik. Bu, daha büyük bir filogeninin ortalamayla eriteceği bir örnekleme gürültüsü değil; modeller sınırda da ayırt edilemez kalıyor. Öncül, Louca ve Pennell'in çeşitlenme modellerindeki uyuşmaya dair 2020 sonucu; alanda uygulamayı değiştirmiş ve yazarların burada devraldığı bir soruyu açık bırakmıştı: uyuşma o kurulumun bir tuhaflığı mıydı, yoksa genel bir özellik mi? Yanıtları, bu model ailesinde evrensel olduğu ve tarif ettikleri uyuşmanın ortaya çıkabilecek tek tür olduğu yönünde.", "en": "The word to hold onto is asymptotic. This is not sampling noise that a larger phylogeny would average away; the models remain indistinguishable in the limit. The precedent is Louca and Pennell's 2020 result on congruence in diversification models, which changed practice across the field and left open a question the authors take up here: was congruence a peculiarity of that setting, or a general property? Their answer is that it is universal in this model family, and that the congruence they describe is the only type that can arise.", "refs": ["sse-congruence"]}]}, {"h": {"tr": "Onarılabilen ve onarılamayan", "en": "The part that is fixable and the part that is not"}, "ps": [{"tr": "Makale teşhiste durmuyor. Birbirinden ayırt edilemeyen modellerin kümesi olan tek bir uyuşma sınıfının içinde işleyen çözümsel bir yöntem sunuyor ve bu yöntem yerine konduğunda makroevrimsel çıkarımın ayakta kaldığını gösteriyor. Bu, genel bir uyarıdan daha dar ve daha kullanışlı bir sav; yazılımı değiştiren bir yöntem eleştirisiyle yalnızca üslubu değiştiren bir eleştiri arasındaki fark da burada.", "en": "The paper does not stop at the diagnosis. It offers an analytical solution that works within a congruence class, the set of models that cannot be told apart, and shows that once that solution is in place, macroevolutionary inference with these models holds up. That is a narrower and more useful claim than a general warning, and it is the difference between a methods critique that changes software and one that changes only tone.", "refs": ["sse-congruence"]}, {"tr": "Ayakta kalan sorun, alanın yıllardır açıklamasız biçimde yakındığı bir başarısızlık: uyuşma sınıfları arasında model seçimi yüksek oranda yanlış pozitif üretiyor. Yazarların açıklaması, bunun model yanlış belirlenmesiyle birlikte model çoğalması dedikleri olgudan, yani aralarından biri kurulum gereği iyi uyacak aday modellerin birikmesinden kaynaklandığı. Bu bir mekanizma ve bilinen bir rahatsızlığı bir hakemin denetleyebileceği bir şeye çeviren de mekanizmadır.", "en": "What survives is a failure the field has complained about for years without an explanation: model selection across congruence classes produces false positives at a high rate. The authors' account is that this follows from model misspecification together with what they call model proliferation, the accumulation of candidate models among which one will fit well by construction. That is a mechanism, and a mechanism is what turns a known nuisance into something a reviewer can check for.", "refs": ["sse-congruence"]}]}, {"h": {"tr": "Yayımlanmış bir sonuca ne yapmalı?", "en": "What to do with a published result"}, "ps": [{"tr": "Riskteki hamle belirli ve dar. Özelliğe bağlı bir modelin, farklı bir uyuşma sınıfından gelen özellikten bağımsız bir modelle karşılaştırılmasıyla elde edilen bir özellik etkisi sonucu, tam olarak burada tarif edilen yanlış pozitif riskini taşıyor. Bu hiçbir çalışmayı geri çekmiyor ve bunu bir geri çekme gibi okumak yanlış ders olurdu; değişen şey karşılaştırmanın neye izin verdiği. Yayımlanmış çözümlemelerin çoğu için bu, sonucun alternatife karşı desteklenmiş olmaktan çok veriyle bağdaşır biçiminde ifade edilmesi anlamına geliyor.", "en": "The move at risk is specific and narrow. A trait-effect result obtained by comparing a trait-dependent model against a trait-independent one drawn from a different congruence class carries exactly the false-positive risk described here. This retracts no study, and reading it as a retraction would be the wrong lesson; what changes is what the comparison licenses. For most published analyses that means stating the conclusion as compatible with the data rather than as supported against the alternative.", "refs": ["sse-congruence"]}, {"tr": "Isırığı olan reform, bir denetim listesi maddesi yerine varsayılan karşılaştırmanın değişmesi ve bunun gözlenebilir bir işareti var: bu modelleri uygulayan yazılım paketlerinin sınıf içi karşılaştırmayı benimseyip benimsemediği ve önümüzdeki bir yılın makalelerinin aday modellerinin hangi uyuşma sınıfından geldiğini bildirip bildirmediği. Alternatif okuma, çözümsel yöntemin biyologların gerçekten uyarladığı model aileleri için kullanışsız çıkması; o durumda dürüst sonuç, daha iyi özellik etkisi savları yerine daha az sayıda sav olurdu.", "en": "The reform that would bite is a change in the default comparison rather than a checklist item, and it has an observable signal: whether the software packages implementing these models adopt within-class comparison, and whether the next year of papers reports which congruence class its candidate models came from. The alternative reading is that the analytical solution proves impractical for the model families biologists actually fit, in which case the honest outcome is fewer trait-effect claims rather than better ones.", "refs": ["sse-congruence"]}]}], "sources": [{"key": "sse-congruence", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75829-5", "title": {"tr": "Özelliğe bağlı türleşme modellerinin ayırt edilemez olduğu bildirildi", "en": "Widely used models of trait-driven speciation are reported to be unidentifiable"}, "publishedDate": "2026-07-25"}], "date": "2026-07-26"}, {"writer": "sci-06", "title": {"tr": "Şişeleri ayıran eller dilekçeyi de imzalıyor", "en": "The same hands sort the bottles and sign the petition"}, "excerpt": {"tr": "Küçük çevreci alışkanlıkların siyasi iradeyi uyuşturduğu savı, hem bireysel çabanın önemini azaltmak isteyenlerin hem de onu yeterli saymak isteyenlerin işine yaradı. Avustralya'da 2.778 katılımcının dört yıl boyunca izlenmesi bunun en yalın türden bir yanıtını veriyor; bir de bir sıfır sonucun neyi taşıyıp neyi taşıyamayacağına dair bir ders.", "en": "The argument that small green habits sedate political will has been useful to people who wanted individual effort to matter less and to people who wanted it to be enough. Following 2,778 participants in Australia for four years supplies the plainest kind of answer, and also a lesson in what a null result can and cannot carry."}, "sections": [{"h": {"tr": "Dört yılın desteklemediği hikâye", "en": "The story four years did not support"}, "ps": [{"tr": "Sav yerleşik görünecek kadar tanıdık: şişeni ayır, yeniden kullanılabilir bardağı al, küçük erdemli edim yükümlülüğü kapatsın ve geriye sandık ya da dilekçe için bir şey kalmasın. 2021'den 2024'e dört yıllık dalga, 2.778 kişi ve herhangi bir yıl içinde ilişki ters yönde işliyor. Daha çok bireysel iklim eylemi yapanlar toplu olarak daha katılımcıydı ve politikayı daha çok destekliyordu, ikinci bağ daha zayıf olsa da.", "en": "The claim is familiar enough to feel established: separate your bottles, buy the reusable cup, and the small virtuous act discharges the obligation, leaving nothing for the ballot or the petition. Four annual waves from 2021 to 2024, 2,778 people, and within any given year the association runs the other way. People doing more individual climate actions were more c
