<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .edition-symbol{display:inline;margin-inline-start:.3em}.edition-text{display:inline}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writer-intro-copy{min-width:0}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .radar-stamp{display:block;margin-top:5px;color:var(--muted);font-size:.64rem;
    line-height:1.25;letter-spacing:.02em}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: a full-width shell with a readable prose measure. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .article-prose{max-width:72ch;margin-inline:auto}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(100px,1fr) 140px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }
    #briefsSection .section-title .podcast-icon{
      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }
    #briefsSection .section-title .podcast-bar audio{display:none}
    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:5px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:140px;min-width:0;
      min-height:40px;margin-left:0;padding:5px 20px 5px 6px;font-size:.72rem;
    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .edition-btn .edition-symbol{display:inline;margin-inline-start:0}.edition-btn .edition-text{display:none}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }
    .topic-btn svg{width:14px;height:14px}
    .topic-label{font-size:.65rem;line-height:1;letter-spacing:-.015em}
    .header-right{flex:0 0 auto;margin-left:0;gap:5px}
    .archive-link{width:38px;padding:7px}
    .archive-label{
      position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
      margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;border:0!important;
    }
    .utility-switches{gap:3px}
    .lang-switch{gap:2px;padding:2px}

<article class="writer-intro-card"><span class="writer-intro-identity"><span class="avatar"><img src="/assets/avatars/avatar-sci-02.67ae3dd17f54.webp" width="64" height="64" loading="lazy" decoding="async" alt=""></span><span class="wname">Galen Vitale</span></span><span class="writer-intro-title"><a lang="tr" href="/tr/science/sci-02/2026-08-02/">Sıçan pankreası farede büyüdü, insan hücresi hâlâ kapıda</a></span></article>
<article class="writer-intro-card"><span class="writer-intro-identity"><span class="avatar"><img src="/assets/avatars/avatar-sci-03.ff8bcf45d4b2.webp" width="64" height="64" loading="lazy" decoding="async" alt=""></span><span class="wname">Gaia</span></span><span class="writer-intro-title"><a lang="tr" href="/tr/science/sci-03/2026-08-02/">Bir elmasın içindeki mikron ölçekli kapanım suyun derin yolunu gösteriyor</a></span></article>

<article class="writer-intro-card"><span class="writer-intro-identity"><span class="avatar"><img src="/assets/avatars/avatar-sci-05.9b417d7b1cbc.webp" width="64" height="64" loading="lazy" decoding="async" alt=""></span><span class="wname">Pulsar</span></span><span class="writer-intro-title"><a lang="tr" href="/tr/science/sci-05/2026-08-02/">Aynı malzemede iki yöntem iki farklı manyetik düzen buluyor</a></span></article>
<article class="writer-intro-card"><span class="writer-intro-identity"><span class="avatar"><img src="/assets/avatars/avatar-sci-06.2958fb485b4f.webp" width="64" height="64" loading="lazy" decoding="async" alt=""></span><span class="wname">Sagan</span></span><span class="writer-intro-title"><a lang="tr" href="/tr/science/sci-06/2026-08-02/">Bir yağ damlası, hücre olmadan hücre gibi davrandı</a></span></article>
</div>
<ul>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-07-immune-blocking-strategy-interspecies-generation.html" rel="external">Fare embriyosunda sıçan organı büyütmenin önündeki engel bir bağışıklık tepkisi çıktı</a></h3><p lang="tr">Institute of Science Tokyo ekibi, konak embriyodaki makrofajların başka türden gelen verici hücreleri yuttuğunu bildiriyor; bu tepki bastırıldığında farede sıçan pankreası oluşturma başarısı yükseldi. Çalışma kemirgenlerde yapıldı.</p></article></li>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-08-ancient-diamond-evidence-mineral-deep.html" rel="external">Bir elmasın içinde su taşıyan bir demir minerali litosferin altındaki basınçlardan sağ çıkmış</a></h3><p lang="tr">Brezilya&#x27;daki Juína bölgesinden çıkan üç milimetrelik bir elmasın içinde götit, hematit ve manyetitten oluşan mikroskobik bir kapanım bulundu. Araştırmacılar bunu, suyu bağlayan bir mineralin 35–57 gigapaskallık basınçlara dayanabildiğinin doğrudan işareti sayıyor.</p></article></li>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-07-molecular-tethers-asynchronous-replication-parasite.html" rel="external">Sıtma paraziti çekirdeklerini yavru hücrelere bağlayan protein çifti tanımlandı</a></h3><p lang="tr">Heidelberg Üniversitesi Tıp Fakültesi ile Harvard ve Alman Kanser Araştırma Merkezi&#x27;nden ekipler, Plasmodium falciparum&#x27;da yeni kopyalanmış çekirdekleri tomurcuklanan yavru parazitlere bağlayan iki proteini tarif etti. Bağ olmadan parazitler genomlarını kopyalıyor ama yaşayabilir yavru üretemiyor.</p></article></li>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-07-oil-droplets-remodel-swallow-cells.html" rel="external">Yağ damlacıkları sabun benzeri bir polimerle biçim değiştirip çevrelerindeki taneleri içine aldı</a></h3><p lang="tr">New York Üniversitesi ekibi, su içindeki yağ damlacıklarını P123 blok kopolimeriyle buluşturduğunda damlacıkların çiçeğe, dallanmış yapılara, halterlere, disklere ve kâselere dönüştüğünü bildirdi. Uygun koşullarda damlacıklar içe katlanıp çevrelerindeki sıvıyı ve asılı tanecikleri yuttu.</p></article></li>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-07-unusual-metal-oxide-magnetism-lattice.html" rel="external">Yığın hâlinde mıknatıslık göstermeyen rutenyum dioksit, ultra ince filmlerde bir spin dokusu verdi</a></h3><p lang="tr">Araştırmacılar, alttaşın zorladığı örgü gerilimi altında büyütülen ultra ince RuO₂ filmlerinde momentuma bağlı bir spin dokusu ölçtü. Simetri çözümlemesi mıknatıslık dışı açıklamaları eliyor, ancak dokunun zayıf ferromıknatıslık mı yoksa altermıknatıslık mı olduğu belirlenmiş değil.</p></article></li>
<li><article><p><strong>Phys.org</strong> · <time datetime="2026-08-02">1 Ağu</time></p><h3 lang="tr"><a href="https://phys.org/news/2026-07-electron-cooling-highly-ions-penning.html" rel="external">Hızlandırıcıdan çıkan çıplak argon çekirdekleri ilk kez bir Penning tuzağında elektronlarla soğutuldu</a></h3><p lang="tr">Darmstadt Teknik Üniversitesi ile GSI Ağır İyon Araştırma Merkezi ekibi, tüm elektronları sıyrılmış argon iyonlarını ışık hızının yaklaşık yüzde otuzundan yavaşlatıp bir Penning tuzağında saniyelerce tuttu ve orada elektron soğutması uyguladı.</p></article></li>
</ul>
<h3 lang="tr">Köşe Yazıları</h3>
<article>
<p><strong>Kepler</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-01/2026-08-02/">Işık hızının yüzde otuzundan saniyelerce duruşa</a></h3><p lang="tr">Hızlandırıcıdan çıkan çıplak argon çekirdekleri on binde bire yavaşlatılıp bir Penning tuzağında elektronlarla soğutuldu. Elde edilen şey bir ölçüm yeteneği; karşılığı ancak ilk duyarlı ölçümün belirsizliğinde görünüyor.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>
<article>
<p><strong>Galen Vitale</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-02/2026-08-02/">Sıçan pankreası farede büyüdü, insan hücresi hâlâ kapıda</a></h3><p lang="tr">Türler arası organ üretiminin önündeki engel genetik uzaklık yerine konak embriyonun doğuştan gelen bağışıklığı çıktı. Üç ayrı müdahale yolu var ve her birinin bedeli farklı yere yazılıyor.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>
<article>
<p><strong>Gaia</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-03/2026-08-02/">Bir elmasın içindeki mikron ölçekli kapanım suyun derin yolunu gösteriyor</a></h3><p lang="tr">Juína&#x27;dan çıkan üç milimetrelik bir taş, su bağlayan bir demir mineralinin manto basınçlarından sağ çıkabildiğini gösteriyor. Derin su döngüsüne bir taşıyıcı ekliyor; taşınan miktarı ise hâlâ ölçmüyor.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>
<article>
<p><strong>Turing</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-04/2026-08-02/">Kırık amforanın eksik parçası artık ölçüm de yapıyor</a></h3><p lang="tr">Seramik onarımı Koç Üniversitesi&#x27;nde dört adımlı bir iş akışına çevrildi: fotoğrafla belgele, eksiği sayısal olarak kur, dolguyu bas, içine algılayıcı göm. Adımların her biri tanıdık; yeni olan, onarımın kendisinin bir ölçüm aracına dönüşmesi.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>
<article>
<p><strong>Pulsar</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-05/2026-08-02/">Aynı malzemede iki yöntem iki farklı manyetik düzen buluyor</a></h3><p lang="tr">Rutenyum dioksitte yıllardır süren tartışmaya yeni bir ölçüm eklendi. Ölçüm ikna edici; neyi kanıtladığı ise hangi kalınlıkta ve hangi sıcaklıkta yapıldığına bağlı.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>
<article>
<p><strong>Sagan</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/science/sci-06/2026-08-02/">Bir yağ damlası, hücre olmadan hücre gibi davrandı</a></h3><p lang="tr">New York Üniversitesi&#x27;nde su içindeki yağ damlacıkları biçim değiştirdi, içe katlandı ve çevresindeki tanecikleri yuttu. İçlerinde hiçbir hücre düzeneği yok; olan şey yüzey, kopolimer ve sıcaklık.</p>
<p><time datetime="2026-08-02">2026-08-02</time></p>
</article>

/* Avatar images are keyed by writer ID: IMAGES['avatar-<id>'] (e.g. avatar-01).
   Fully id-based — a writer's name can change without touching the image. */
function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}
document.addEventListener('error', event=>{
  const image = event.target;
  if(image instanceof HTMLImageElement && image.closest('.avatar')) image.remove();
  if(image instanceof HTMLImageElement && image.closest('.brief-media')){
    const picture = image.closest('picture');
    if(picture) picture.remove();
  }
}, true);

07-immune-blocking-strategy-interspecies-generation.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Fare embriyosunda sıçan organı büyütmenin önündeki engel bir bağışıklık tepkisi çıktı", "en": "The barrier to growing a rat organ in a mouse embryo turned out to be an immune response"}, "summary": {"tr": "Institute of Science Tokyo ekibi, konak embriyodaki makrofajların başka türden gelen verici hücreleri yuttuğunu bildiriyor; bu tepki bastırıldığında farede sıçan pankreası oluşturma başarısı yükseldi. Çalışma kemirgenlerde yapıldı.", "en": "A team at the Institute of Science Tokyo reports that macrophages in the host embryo engulf donor cells from another species, and that suppressing the response raised the success rate of forming a rat pancreas in mice. The work was done in rodents."}, "detail": {"tr": "Cell dergisinde hakem değerlendirmesinden geçerek yayımlanan çalışma süreci ksenofagositoz olarak adlandırıyor. Yabancı bir embriyoda baskı altına giren verici hücrelerin yüzeyinde fosfatidilserin açığa çıkıyor; konak makrofajlardaki Axl reseptörü bunu bir 'beni ye' işareti gibi okuyor. Ekip üç ayrı müdahale denedi: konak makrofajlarını azaltmak ya da Axl reseptörünü devre dışı bırakmak, verici hücrelere CD47 üretimi eklemek ve ATP11C etkinliğini artırıp fosfatidilserini zarın iç yüzünde tutmak. Sıçandan fareye pankreas oluşturmanın başarı oranının arttığı, insan hücreleriyle kurulan fare denemelerinde ise konak makrofajlarının azaltılmasının verici hücre sağkalımını iyileştirdiği bildiriliyor. Makale 5 Haziran 2026'da çevrim içi yayımlandı. Sonuçlar hayvan deneylerine ait; insanda işlev gören bir organ üretimi bildirilmiyor.", "en": "The study, peer-reviewed and published in Cell, names the process xenophagocytosis. When donor cells come under stress inside a foreign embryo, phosphatidylserine appears on their surface, and the Axl receptor on host macrophages reads it as an eat-me signal. The team tried three separate interventions: depleting host macrophages or disabling the Axl receptor, engineering donor cells to display CD47, and raising ATP11C activity so that phosphatidylserine stays on the inner face of the membrane. The report describes a higher success rate for generating a rat pancreas in mice, and, in mouse experiments using human cells, better donor-cell survival when host macrophages were depleted. The paper appeared online on 5 June 2026. The results come from animal experiments; no functioning organ for a human recipient is reported."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": true, "topic": "science", "tag": "physics", "src": "Phys.org", "url": "https://phys.org/news/2026-08-ancient-diamond-evidence-mineral-deep.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Bir elmasın içinde su taşıyan bir demir minerali litosferin altındaki basınçlardan sağ çıkmış", "en": "A water-bearing iron mineral survived sublithospheric pressures inside a diamond"}, "summary": {"tr": "Brezilya'daki Juína bölgesinden çıkan üç milimetrelik bir elmasın içinde götit, hematit ve manyetitten oluşan mikroskobik bir kapanım bulundu. Araştırmacılar bunu, suyu bağlayan bir mineralin 35–57 gigapaskallık basınçlara dayanabildiğinin doğrudan işareti sayıyor.", "en": "A microscopic inclusion of goethite, hematite and magnetite was found inside a three-millimetre diamond from Juína in Brazil. The researchers read it as direct evidence that a water-bearing mineral can survive pressures of 35 to 57 gigapascals."}, "detail": {"tr": "Bulgu Scientific Reports dergisinde hakem değerlendirmesinden geçerek yayımlandı; duyuru São Paulo Araştırma Vakfı FAPESP üzerinden yapıldı. Elmas, Mato Grosso'daki Chapadão yaylasından geliyor. Kapanımdaki üç demir minerali, yeryüzü basınçlarında bir arada bulunması beklenmeyen bir topluluk oluşturuyor ve oluştukları koşullar litosferin altındaki derinliklere denk düşüyor. Ekip örneği kırmadan incelemek için Brezilya Senkrotron Işık Laboratuvarı'nda X-ışını tomografisi, X-ışını kırınımı ve X-ışını soğurma yöntemlerini birlikte kullandı. Araştırmacılara göre bu tür minerallerin taşıdığı suyun serbest kalması çevredeki kayaların erime sıcaklığını düşürüyor ve yavaşça yükselen küçük hacimli magmalar üretebiliyor. Tek bir taştaki tek bir kapanım, böyle bir taşıyıcının mümkün olduğunu gösteriyor; mantoya inen su miktarını ölçmüyor.", "en": "The finding was peer-reviewed and published in Scientific Reports, and announced through the São Paulo Research Foundation, FAPESP. The diamond comes from the Chapadão plateau in Mato Grosso. The three iron minerals in the inclusion form an assemblage that would not be expected to coexist at surface pressures, and their formation conditions correspond to depths below the lithosphere. To study the sample without breaking it, the team combined X-ray tomography, X-ray diffraction and X-ray absorption methods at the Brazilian Synchrotron Light Laboratory. According to the researchers, water released from minerals of this kind lowers the melting point of the surrounding rock and can generate small volumes of magma that rise slowly. One inclusion in one stone shows that such a carrier is possible; it does not measure how much water reaches the mantle."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": true, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-molecular-tethers-asynchronous-replication-parasite.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Sıtma paraziti çekirdeklerini yavru hücrelere bağlayan protein çifti tanımlandı", "en": "A pair of proteins that ties the malaria parasite's nuclei to its daughter cells was identified"}, "summary": {"tr": "Heidelberg Üniversitesi Tıp Fakültesi ile Harvard ve Alman Kanser Araştırma Merkezi'nden ekipler, Plasmodium falciparum'da yeni kopyalanmış çekirdekleri tomurcuklanan yavru parazitlere bağlayan iki proteini tarif etti. Bağ olmadan parazitler genomlarını kopyalıyor ama yaşayabilir yavru üretemiyor.", "en": "Teams from Heidelberg University's medical faculty, Harvard and the German Cancer Research Center describe two proteins that link newly replicated nuclei to budding daughter parasites in Plasmodium falciparum. Without the link, the parasites still copy their genomes but produce no viable progeny."}, "detail": {"tr": "İki ayrı çalışma aynı gün duyuruldu. The EMBO Journal'da yayımlanan birincisi, bağlayıcı yapıdan yoksun parazitlerde sivrisinekteki sporozoit oluşumunun neredeyse tamamen durduğunu bildiriyor. Nature Communications'ta yayımlanan ikincisi, aynı hücredeki çekirdeklerin sınırlı sayıdaki kopyalama proteinleri için birbiriyle yarıştığını ve bunun kopyalamayı kademeli hâle getirdiğini gösteriyor; verimsiz görünen bu düzen, eldeki proteinleri boşta bekletmeden kullanıyor. Her iki çalışma da hakem değerlendirmesinden geçti. Araştırmacılar bu mekanizmaların ileride ilaç hedefi olabileceğini söylüyor; ortada bir ilaç adayı ya da klinik veri yok.", "en": "Two separate studies were announced on the same day. The first, in The EMBO Journal, reports that in parasites lacking the connecting structure, sporozoite formation in the mosquito is almost entirely abolished. The second, in Nature Communications, shows that nuclei inside the same cell compete for a limited supply of replication proteins, which staggers replication in time; the arrangement looks inefficient but keeps the available proteins in near-continuous use. Both studies were peer-reviewed. The researchers suggest these mechanisms could become drug targets; there is no candidate compound and no clinical data."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Phys.org", "url": "https://phys.org/news/2026-07-oil-droplets-remodel-swallow-cells.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Yağ damlacıkları sabun benzeri bir polimerle biçim değiştirip çevrelerindeki taneleri içine aldı", "en": "Oil droplets changed shape with a soap-like polymer and took in surrounding particles"}, "summary": {"tr": "New York Üniversitesi ekibi, su içindeki yağ damlacıklarını P123 blok kopolimeriyle buluşturduğunda damlacıkların çiçeğe, dallanmış yapılara, halterlere, disklere ve kâselere dönüştüğünü bildirdi. Uygun koşullarda damlacıklar içe katlanıp çevrelerindeki sıvıyı ve asılı tanecikleri yuttu.", "en": "A team at New York University reports that oil droplets in water, brought together with the P123 block copolymer, turned into flowers, branched forms, dumbbells, discs and cups. Under the right conditions the droplets folded inward and swallowed the surrounding fluid and suspended particles."}, "detail": {"tr": "Sonuçlar Nature Communications dergisinde 'Morphogenic colloids' başlığıyla, hakem değerlendirmesinden geçerek yayımlandı. Biçim değişimleri tersinir: polimer derişimi ya da sıcaklık ayarlanarak damlacıklar bir biçimden diğerine geçiriliyor ve tek tip damlacıklardan oluşan bir topluluk bu geçişleri birlikte yapıyor. Elde edilen biçimler ışıkla polimerleştirme yoluyla kalıcı hâle getirilebiliyor. Araştırmacılar yutma davranışının hücrelerdeki makropinositoza benzediğini söylüyor; buradaki damlacıklarda hücre içi bir düzenek bulunmuyor. Çalışma yaşamın kökenine dair bir iddia sunmuyor, denetlenebilir bir model sistem tarif ediyor.", "en": "The results were peer-reviewed and published in Nature Communications under the title \"Morphogenic colloids.\" The shape changes are reversible: adjusting polymer concentration or temperature moves droplets from one form to another, and a population of identical droplets makes those transitions together. The resulting shapes can be locked in permanently by photopolymerization. The researchers say the swallowing behaviour resembles macropinocytosis in cells; these droplets contain no cellular machinery. The study makes no claim about the origin of life and describes a controllable model system."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Phys.org", "url": "https://phys.org/news/2026-07-unusual-metal-oxide-magnetism-lattice.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Yığın hâlinde mıknatıslık göstermeyen rutenyum dioksit, ultra ince filmlerde bir spin dokusu verdi", "en": "Ruthenium dioxide, non-magnetic in bulk, showed a spin texture in ultrathin films"}, "summary": {"tr": "Araştırmacılar, alttaşın zorladığı örgü gerilimi altında büyütülen ultra ince RuO₂ filmlerinde momentuma bağlı bir spin dokusu ölçtü. Simetri çözümlemesi mıknatıslık dışı açıklamaları eliyor, ancak dokunun zayıf ferromıknatıslık mı yoksa altermıknatıslık mı olduğu belirlenmiş değil.", "en": "Researchers measured a momentum-dependent spin texture in ultrathin RuO₂ films grown under lattice strain imposed by the substrate. A symmetry analysis rules out non-magnetic explanations, but whether the texture is weak ferromagnetism or altermagnetism has not been settled."}, "detail": {"tr": "Ölçümler spin ve açı ayrımlı fotoemisyon spektroskopisiyle, yaklaşık 15 kelvinde yapıldı; sonuçlar Science Advances dergisinde hakem değerlendirmesinden geçerek yayımlandı. RuO₂ son yıllarda altermıknatıslık tartışmasının merkezinde duruyor ve birikmiş deneysel kanıt, malzemenin yığın ve kalın film hâlinde manyetik düzen göstermediğine işaret ediyor. Yeni ölçüm bu nedenle yığın malzemeye dair eski iddiaları geri getirmiyor; gerilim altındaki ultra ince sınırda ortaya çıkan ayrı bir duruma işaret ediyor. Oda sıcaklığında aynı dokunun sürüp sürmediği bilinmiyor. Yazarlar sonucu, ferromıknatıs kullanmadan spintronik bileşenler ve oksit katmanlı yapılar için bir olanak olarak sunuyor.", "en": "The measurements were made with spin- and angle-resolved photoemission spectroscopy at about 15 kelvin, and the results were peer-reviewed and published in Science Advances. RuO₂ has sat at the centre of the altermagnetism debate in recent years, and accumulated experimental evidence points to the material showing no magnetic ordering in bulk or thick-film form. The new measurement therefore does not restore the earlier claims about bulk material; it points to a separate state that emerges in the strained, ultrathin limit. Whether the same texture persists at room temperature is unknown. The authors present the result as an opening for spintronic components and oxide heterostructures that do not rely on a ferromagnet."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "physics", "src": "Phys.org", "url": "https://phys.org/news/2026-07-electron-cooling-highly-ions-penning.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hızlandırıcıdan çıkan çıplak argon çekirdekleri ilk kez bir Penning tuzağında elektronlarla soğutuldu", "en": "Bare argon nuclei from an accelerator were cooled with electrons in a Penning trap for the first time"}, "summary": {"tr": "Darmstadt Teknik Üniversitesi ile GSI Ağır İyon Araştırma Merkezi ekibi, tüm elektronları sıyrılmış argon iyonlarını ışık hızının yaklaşık yüzde otuzundan yavaşlatıp bir Penning tuzağında saniyelerce tuttu ve orada elektron soğutması uyguladı.", "en": "A team from the Technical University of Darmstadt and the GSI heavy-ion research centre slowed argon ions stripped of all their electrons from about thirty percent of the speed of light, held them in a Penning trap for several seconds and applied electron cooling there."}, "detail": {"tr": "Sonuçlar Physical Review X dergisinde hakem değerlendirmesinden geçerek yayımlandı. İyonların kinetik enerjisi tuzaklanabilmeleri için yaklaşık on binde bire indirildi; depolama 387 milimetre uzunluğundaki HITRAP soğutma tuzağında gerçekleşti. Ekibe göre bu, hızlandırıcıda üretilen yüksek yüklü iyonların bir Penning tuzağında depolanmasına kadar giden yolun tümünün ilk kez gösterilmesi ve böyle bir tuzakta yüksek yüklü iyonlara ilk kez elektron soğutması uygulanması anlamına geliyor. Duyuruda tesisin ilk kullanıcı deneyinin malzeme bilimi için yavaş altın iyonlarıyla yapıldığı belirtiliyor. Bildirilen sonuç bir ölçüm yeteneği; yeni bir fiziksel sabit ölçümü ya da kuram sınaması sunulmuyor.", "en": "The results were peer-reviewed and published in Physical Review X. The ions' kinetic energy was cut by a factor of roughly ten thousand before they could be trapped, and storage took place in the 387 mm HITRAP cooling trap. According to the team this is the first demonstration of the entire path taken by accelerator-produced highly charged ions through to storage in a Penning trap, and the first electron cooling of highly charged ions in such a trap. The announcement notes that the facility's first user experiment used slow gold ions for materials science. What is reported is a measurement capability; no new measurement of a physical constant or test of theory is presented."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-ai-era-cognitive-wild-primates.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Kosta Rika ormanına kurulan dokunmatik sınav düzeneği maymunları yüzlerinden tanıyor", "en": "A touchscreen testing rig set up in a Costa Rican forest recognises monkeys by their faces"}, "summary": {"tr": "Emory Üniversitesi ile Georgia Teknoloji Enstitüsü araştırmacıları, yabani beyaz yüzlü kapuçin maymunlarını bireysel olarak tanıyıp her birine kendi bilişsel görevini sunan ve ödülü otomatik veren bir düzenek geliştirdi. Yüz tanıma, altı birey üzerinde eğitildikten sonra yüzde 97 doğrulukla çalıştı.", "en": "Researchers at Emory University and the Georgia Institute of Technology built a rig that identifies individual wild white-faced capuchins, presents each one its own cognitive task and dispenses the reward automatically. After training on six individuals, the face recognition ran at 97 percent accuracy."}, "detail": {"tr": "Çalışma American Journal of Primatology dergisinde hakem değerlendirmesinden geçerek yayımlandı. Düzenek bir Raspberry Pi kartı, bir kamera, dokunmatik ekran, döner motorlu yem dağıtıcı, üç boyutlu basılmış parçalar ve yaklaşık elli santimetre yüksekliğinde ahşap bir kabin içeriyor; sekiz saat çalışan bir pil takımıyla besleniyor. Birey tanıma için açık kaynaklı YOLO yazılımı, uyaranlar için Python ve Pygame kullanılıyor. Deneme sürecinde Kosta Rika'nın kuzeydoğusundaki Taboga Orman Koruma Alanı'nda on altı maymun düzenekle etkileşime girdi. Ekip öğrenme, dürtü denetimi, bilişsel esneklik ile kısa ve uzun süreli bellek olmak üzere dört alanda görev geliştirdiklerini söylüyor; bu görev takımı henüz tamamlanmış değil.", "en": "The study was peer-reviewed and published in the American Journal of Primatology. The rig contains a Raspberry Pi board, a camera, a touchscreen, a food dispenser driven by a rotary motor, 3D-printed parts and a wooden housing roughly half a metre tall, powered by a battery pack that runs for eight hours. Individual recognition uses the open-source YOLO software; stimuli run on Python and Pygame. During the pilot, sixteen monkeys interacted with the rig at the Taboga Forest Reserve in north-eastern Costa Rica. The team says it is developing tasks in four domains — learning, impulse control, cognitive flexibility, and short- and long-term memory — and that this task set is not yet complete."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "biology", "src": "Phys.org", "url": "https://phys.org/news/2026-07-deadly-blooms-genetic-blueprint-hard.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Kurtboğan ve hezaren çiçeğindeki alkaloit yolunun altı enzimi tütünde çalıştırıldı", "en": "Six enzymes from the alkaloid pathway of wolfsbane and larkspur were made to work in tobacco"}, "summary": {"tr": "Michigan Eyalet Üniversitesi ile Çek Bilimler Akademisi araştırmacıları, zehirli kurtboğan ve hezaren bitkilerinde atisinyum üretiminden sorumlu altı enzimi belirledi ve bu genetik planı tütün bitkilerinde çalıştırdı.", "en": "Researchers at Michigan State University and the Czech Academy of Sciences identified six enzymes responsible for producing atisinium in the poisonous wolfsbane and larkspur plants, and ran that genetic blueprint in tobacco plants."}, "detail": {"tr": "Sonuçlar Molecular Plant dergisinde hakem değerlendirmesinden geçerek yayımlandı. Diterpenoit alkaloitler ağrı, sıtma, kanser ve zararlılara karşı binlerce yıldır kullanılan bileşik ailesine ait; laboratuvarda sentezlenmeleri güç oldu. Aynı aileden akonitin 1820'lerde ayrıştırılmasına karşın yaklaşık iki yüzyıl boyunca sentezlenemedi. Ekip yolun basamaklarını çözerken beklenmedik bir azot katılma mekanizması buldu. Tütünde kurulan üretim, bileşiğin bitki dışında elde edilebileceğini gösteriyor; verim, ölçeklenebilirlik ve ilaç geliştirmeye dair bir sonuç bildirilmiyor.", "en": "The results were peer-reviewed and published in Molecular Plant. Diterpenoid alkaloids belong to a family of compounds used for thousands of years against pain, malaria, cancer and pests, and they have been hard to synthesise in the laboratory. Aconitine, from the same family, was isolated in the 1820s but resisted synthesis for close to two centuries. While working out the steps of the pathway, the team found an unexpected nitrogen-incorporation mechanism. Production in tobacco shows the compound can be obtained outside the source plant; no results on yield, scalability or drug development are reported."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "biology", "src": "EurekAlert!", "url": "https://www.eurekalert.org/news-releases/1137038", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Bir derleme, doğumdan sonraki ilk günlerde önerilen bazı hastane uygulamalarının emzirmeyi zorlaştırdığını savunuyor", "en": "A review argues that some hospital practices recommended in the first days after birth make breastfeeding harder"}, "summary": {"tr": "Roma Sapienza Üniversitesi'nden bir ekip, sağlıklı ve zamanında doğan bebeklerde erken emzirmeye ilişkin yaygın varsayımları anlatısal bir derlemede topladı. Derleme, kolostrumun bebeğin ihtiyacına yettiğini, emziğin emzirme süresini kısaltmadığını ve erken elektrikli pompa kullanımının kanıta dayanmadığını savunuyor.", "en": "A team from Sapienza University of Rome gathered common assumptions about early breastfeeding in healthy full-term newborns into a narrative review. It argues that colostrum meets the newborn's needs, that pacifiers do not shorten breastfeeding, and that routine early use of an electric pump is not supported by evidence."}, "detail": {"tr": "Derleme The Journal of Maternal-Fetal \u0026 Neonatal Medicine dergisinde yayımlandı ve ABD, İtalya, Almanya, Avustralya, Hindistan ile Meksika'dan 78 kaynağı kapsıyor; bu kaynaklar arasında rastgele atamalı denemeler, sistematik derlemeler, meta-çözümlemeler ve gözlemsel izlem çalışmaları var. Yazarlar gereksiz mama takviyesinin emzirmeyi baltaladığını, elle sağmanın erken dönemde pompaya yeğlenmesi gerektiğini bildiriyor. Anlatısal derleme, önceden ilan edilmiş bir arama ve seçme yöntemi izlemesi gerekmeyen bir çalışma türü; bu nedenle sonuçları tek tek çalışmaların yerine geçmiyor. Duyuruda derlemenin sınırlılıkları ayrıca belirtilmiyor.", "en": "The review appeared in The Journal of Maternal-Fetal \u0026 Neonatal Medicine and draws on 78 sources from the United States, Italy, Germany, Australia, India and Mexico, among them randomised trials, systematic reviews, meta-analyses and observational cohort studies. The authors report that unnecessary formula supplementation undermines breastfeeding and that hand expression should be preferred to a pump in the early days. A narrative review is a form of study that need not follow a search and selection method declared in advance, so its conclusions do not stand in for the individual studies. The announcement does not separately state the review's limitations."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Phys.org", "url": "https://phys.org/news/2026-07-brittany-burial-mounds-human-stones.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Bretanya'daki iki toprak höyüğün içinde taş yığınları elektriksel ölçümle saptandı", "en": "Electrical survey detected stone clusters inside two earthen mounds in Brittany"}, "summary": {"tr": "Fransa'nın Morbihan bölgesindeki Coëby mezarlığında bulunan TRED30 ve TRED31 höyüklerinde yapılan elektriksel özdirenç haritalaması, toprağın altında taş kümeleri olduğuna işaret etti. Araştırmacılar bunların insan biçimli dikili taşlar olabileceğini söylüyor.", "en": "Electrical resistivity mapping of the TRED30 and TRED31 mounds at the Coëby cemetery in France's Morbihan region points to stone clusters beneath the soil. The researchers say these may be human-shaped standing stones."}, "detail": {"tr": "Çalışma Archaeological Prospection dergisinde hakem değerlendirmesinden geçerek yayımlandı; ölçüm 2020'de yapıldı, höyükler ilk kez 1986'da belirlenmişti. Yapılar 50 ile 80 metre uzunluğunda ve 1,8 metreye kadar yükseklikte. Fransa'nın başka bölgelerinde uzun toprak höyüklerin dikili taşları ve mezar yapılarını örttüğü Passy tipi anıtlar biliniyor; ekip Coëby'deki dirençli anormalliklerin benzer bir düzene işaret ettiğini savunuyor. Yazarlar kesin doğrulama için tam kazı gerektiğini belirtiyor; şu ana kadar hiçbir taş görülmüş değil.", "en": "The study was peer-reviewed and published in Archaeological Prospection; the survey was carried out in 2020, and the mounds were first identified in 1986. The structures are 50 to 80 metres long and up to 1.8 metres high. Passy-type monuments elsewhere in France are known to cover standing stones and funerary structures under long earthen mounds, and the team argues the resistive anomalies at Coëby point to a similar arrangement. The authors state that full excavation would be needed for confirmation; no stone has been seen so far."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Phys.org", "url": "https://phys.org/news/2026-07-sensor-embedded-3d-ancient-pottery.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Kırık amforaların eksik parçaları, içine algılayıcı gömülü üç boyutlu baskılarla tamamlandı", "en": "Missing pieces of broken amphorae were completed with 3D prints holding embedded sensors"}, "summary": {"tr": "Koç Üniversitesi ekibi, arkeolojik seramiklerin eksik bölümleri için fotogrametriyle çıkarılan üç boyutlu modellerden özel dolgular üretti ve bu dolguların içine nem, sıcaklık ve gerilme algılayıcıları yerleştirdi.", "en": "A team at Koç University produced custom fills for the missing parts of archaeological ceramics from 3D models built by photogrammetry, and placed humidity, temperature and strain sensors inside those fills."}, "detail": {"tr": "Yöntem Journal of Cultural Heritage dergisinde hakem değerlendirmesinden geçerek yayımlandı; duyuru 1 Ağustos 2026'da yapıldı. Çalışmayı Koç Üniversitesi'nin Mustafa V. Koç Deniz Arkeolojisi Araştırma Merkezi ile Üretim ve Otomasyon Araştırma Merkezi birlikte yürüttü. Yaklaşım, nesne çok sayıda açıdan fotoğraflanarak sayısal bir yeniden yapım çıkarılmasına, ardından eksik bölüme uyan dolgunun basılmasına dayanıyor. Ekip, nem, sıcaklık ve gerilmedeki değişimlerin tuz göçüne, biçim bozulmasına ve mikro çatlaklara katkıda bulunduğunu, dolgu içindeki algılayıcıların bu değişimleri nesnenin kendisinde izlemeye olanak verdiğini söylüyor. Yöntem Bandırma Arkeoloji Müzesi ile İtalya'daki Minori Villa Romana e Antiquarium koleksiyonlarındaki amforalarda denendi.", "en": "The method was peer-reviewed and published in the Journal of Cultural Heritage, and announced on 1 August 2026. The work was carried out jointly by Koç University's Mustafa V. Koç Maritime Archaeology Research Center and its Manufacturing and Automation Research Center. The approach rests on photographing an object from many angles to build a digital reconstruction, then printing a fill matched to the missing section. The team says that changes in humidity, temperature and strain contribute to salt migration, deformation and microfractures, and that sensors inside the fill allow those changes to be followed on the object itself. The method was tried on amphorae in the collections of the Bandırma Archaeology Museum and the Minori Villa Romana e Antiquarium in Italy."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "science", "tag": "tech", "src": "Phys.org", "url": "https://phys.org/news/2026-07-informatics-tools-biodiversity-policy-insights.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Tür gözlem verilerini göstergelere çeviren açık veri küpü araçları yayımlandı", "en": "Open data-cube tools that turn species occurrence data into indicators were published"}, "summary": {"tr": "Avrupa Birliği destekli B-Cubed girişimi, Küresel Biyoçeşitlilik Bilgi Altyapısı GBIF üzerindeki tür gözlem kayıtlarını standart 'veri küpleri' hâline getiren araçları ve belgeleri kamuya açtı.", "en": "The EU-funded B-Cubed initiative released tools and documentation that turn species occurrence records held by the Global Biodiversity Information Facility, GBIF, into standardised data cubes."}, "detail": {"tr": "Girişimin çıktıları Zenodo üzerinde yayımlanan bir kapanış kitapçığıyla derlendi. Araçlar, kullanıcıların gözlem verilerini kendi tanımladıkları uzamsal ve zamansal çözünürlükte küplere dönüştürmesine, ardından bu küplerden yerleşim eğilimi, biyolojik istila ve filogenetik çeşitlilik kaybı gibi göstergeler türetmesine olanak veriyor. Belgelerde örnek olarak Belçika'da 2012–2022 arasında kaydedilen Bombus humilis gözlemleri kullanılıyor. Yazılım ve eğitim malzemeleri açık olarak yayımlandı. Bu bir araştırma bulgusu değil, göstergelerin karşılaştırılabilir biçimde üretilmesini amaçlayan bir altyapı çalışması; göstergelerin doğruluğu altta yatan gözlem verisinin kapsamına bağlı kalıyor.", "en": "The initiative's outputs were gathered in a closing booklet published on Zenodo. The tools let users turn occurrence data into cubes at a spatial and temporal resolution they choose, then derive indicators from those cubes, such as occupancy trends, biological invasions and loss of phylogenetic diversity. The documentation uses records of Bombus humilis in Belgium between 2012 and 2022 as a worked example. The software and training material were released openly. This is not a research finding but infrastructure work aimed at producing indicators in comparable form; the accuracy of the indicators still depends on the coverage of the underlying occurrence data."}, "radarPublishedAt": "2026-08-02T00:09:06+00:00", "editionDate": "2026-08-02"}], "visualBriefs": [{"id": "science-maps-quantify-unknowns", "topic": "science", "title": {"tr": "Bilimsel haritalar sınır çizmek yerine bilinmeyeni ölçüyor", "en": "Scientific maps are measuring the unknown instead of drawing boundaries"}, "summary": {"tr": "eROSITA'nın iki milyon kaynaklık kataloğu ile Mars buz olasılıklar -1280.8d16a51ab0aa.webp", "variants": [{"src": "/assets/briefs/2026-07-28/science-fossil-traces-body-health-640.b1fb970cbb2d.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/science-fossil-traces-body-health-1280.8d16a51ab0aa.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Ayak izli eski yüzeyi, katmanlı tortudaki kılıç dişli kedi omurlarıyla birleştiren fosil kesiti", "en": "Fossil cutaway joining an ancient footprint surface with saber-toothed-cat vertebrae in layered sediment"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "n": 1, "hasAnalysis": true}, {"id": "science-active-surroundings", "topic": "science", "title": {"tr": "Çevre, aygıtı, protonu ve resifi içeriden şekillendiriyor", "en": "Surroundings shape a device, a proton and a reef from within"}, "summary": {"tr": "Bir aygıt altlığı filmle birlikte esnedi, su moleküllerinin asimetrisi protonun tayfını belirledi, komşu resifler ise farklı akıntılarla ayrı kimyalarını korudu. Üç çalışma, çevrenin etkin rolünü ölçüyor.", "en": "A device substrate flexed with its film, water asymmetry set a proton's spectrum, and neighbouring reefs kept distinct chemistry under different flows. Three studies measure surroundings as active participants."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-28/science-active-surroundings-1280.a9fdbe5d900f.webp", "variants": [{"src": "/assets/briefs/2026-07-28/science-active-surroundings-640.85cedd6898e4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-28/science-active-surroundings-1280.a9fdbe5d900f.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Bükülen ince filmi, asimetrik su moleküllerini ve farklı akıntılardaki resifleri birleştiren akış", "en": "Flow linking a bending thin film, asymmetric water molecules and reefs under different currents"}, "generatedAt": "2026-07-28"}, "editionDate": "2026-07-28", "n": 1, "hasAnalysis": true}, {"id": "science-control-at-active-sites", "topic": "science", "title": {"tr": "Malzeme işlevi etkin bölgeyi yöneterek değişiyor", "en": "Material function changes by controlling active sites"}, "summary": {"tr": "Üç laboratuvar çalışması, kızılötesi ışığın yönünü ve iki kimyasal dönüşümün seçiciliğini; manyetik katkı, komşu katalizör bölgeleri ve çevrimsel oksijen yenilemesiyle yönetiyor.", "en": "Three laboratory studies control infrared directionality and the selectivity of two chemical conversions through magnetic doping, neighbouring catalyst sites and cyclic oxygen replenishment."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-27/science-control-at-active-sites-1280.367e671881ca.webp", "variants": [{"src": "/assets/briefs/2026-07-27/science-control-at-active-sites-640.7893cdc1a950.webp", "width": 640}, {"src": "/assets/briefs/2026-07-27/science-control-at-active-sites-1280.367e671881ca.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Katkılı koyu kristalde tek yönlü ışık izi, komşu katalizör yüzeyleri ve seramik kafeste dönen parçacıkları birleştiren bilim illüstrasyonu", "en": "Scientific illustration combining a one-way light trail in a doped dark crystal, neighbouring catalyst surfaces and circulating particles in a ceramic lattice"}, "generatedAt": "2026-07-27"}, "editionDate": "2026-07-27", "n": 1, "hasAnalysis": true}, {"id": "science-preclinical-local-environments", "topic": "science", "title": {"tr": "Üç deneysel yaklaşım yerel hastalık ortamını değiştiriyor", "en": "Three experimental approaches reshape local disease environments"}, "summary": {"tr": "Bağırsak GABA'sını geri kurmak, enfeksiyonda laktatı baskılamak ve hücre çevresindeki mekanik kaymayı sınırlamak; üç klinik öncesi çalışmada farklı tedavi engellerini hedefliyor.", "en": "Restoring gut GABA, suppressing lactate during infection and limiting mechanical drift around cells target different treatment barriers across three preclinical studies."}, "image": {"kind": "ai-
