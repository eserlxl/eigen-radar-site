ished is 20,000. The step in between is called sampling."}, "sections": [{"h": {"tr": "Gerçekten ölçülen alan", "en": "The area that was actually measured"}, "ps": [{"tr": "Araştırma havadan lazer taramasıyla, yaklaşık 450 km uzunluğunda düz hatlar boyunca her 10 km'de 1 km genişliğinde şeritler tarayarak toplam 4.500 km² kadar alanı ölçtü ve iyi korunmuş 400'den fazla anıtsal tören alanı belgeledi. Taranan alanın yarısından fazlası dizgesel olarak değerlendirildi.", "en": "The survey measured a total of about 4,500 km² by airborne laser scanning, mapping 1 km wide strips every 10 km along straight transects roughly 450 km long, and documented more than 400 well-preserved monumental ceremonial sites. More than half of the scanned area was systematically assessed.", "refs": ["amazon"]}, {"tr": "Bu sayıdan bütün bölgede 20.000'den fazla tören merkezi bulunduğu öngörülüyor. Öngörünün kapsadığı alan yaklaşık 183.000 km², yani taranan alanın kırk katından fazla; bu 183.000 km² de Büyük Amazonya'nın yüzde üçünden azına denk geliyor. Her 10 km'de 1 km genişliğinde bir şerit tarandığında koridorun onda biri görülür. Yani sayı, görülenin on katına çıkmakla kalmıyor; kırk katından fazlasına genişletiliyor.", "en": "From that count, more than 20,000 ceremonial centres are projected across the whole region. The area the projection covers is about 183,000 km², more than forty times the area scanned, and those 183,000 km² themselves amount to less than three percent of Greater Amazonia. When a 1 km wide strip is scanned every 10 km, one tenth of the corridor is seen. So the number reaches beyond ten times what was seen, out to more than forty times it.", "refs": ["amazon"]}]}, {"h": {"tr": "Sayıdan nüfusa", "en": "From count to population"}, "ps": [{"tr": "İkinci genişletme nüfus tarafında. Yazarlar birinci binyılın başı için 1,25–3 milyon aralığını veriyor ve bu aralığı ihtiyatlı sayıyor; Amazon'un tümü için daha önce önerilen 1–10 milyon aralığıyla karşılaştırdıklarında ihtiyat iddiası anlaşılır hale geliyor. Yapı sayısından kişi sayısına geçmek, her yapının kaç kişiye hizmet ettiğine dair bir kabul gerektirir ve bu kabul, taramanın kendisinden gelmez.", "en": "The second extension is on the population side. The authors give a range of 1.25 to 3 million for the start of the first millennium and call that range cautious; set against the 1 to 10 million proposed earlier for the whole Amazon, the claim to caution becomes intelligible. Moving from a count of structures to a count of people requires an assumption about how many people each structure served, and that assumption does not come from the scanning.", "refs": ["amazon"]}, {"tr": "Genişletmenin gücü, hatların yapı yoğunluğunu yansız örnekleyip örneklemediğine bağlıdır. Toprak yapıları akarsu boylarında ya da su basmayan yüksek düzlüklerde kümeleniyorsa, o özellikleri dik kesen bir hat ile onlara paralel giden bir hat bambaşka yoğunluklar okur; hatların yönü sonucun içine girer. Alternatif olarak yapılar bölgeye gerçekten düzgün dağılmış olabilir, o durumda 20.000 sayısı yerinde durur. Ama iki durumu birbirinden ayırmak için ikinci bir taramaya ihtiyaç var.", "en": "The strength of the extension depends on whether the transects sample earthwork density without bias. If earthworks cluster along watercourses or on flood-free high ground, a transect cutting across those features and one running parallel to them read entirely different densities, and the orientation of the transects enters the result. Alternatively the structures may genuinely be distributed evenly across the region, in which case the figure of 20,000 stands. But separating the two cases takes a second survey.", "refs": ["amazon"]}]}, {"h": {"tr": "Bunu ne kapatır", "en": "What would settle it"}, "ps": [{"tr": "Tartışmayı ilerletecek olan, daha büyük bir sayı yerine ikinci bir örnekleme düzenidir: aynı 183.000 km² üzerinde farklı aralıkla ya da farklı yönde uçulmuş hatlar. İki ayrı geometri birbirine yakın yoğunluk veriyorsa genişletme dayanak kazanır; ayrışıyorsa fark, yapıların kendisinden çok hatların nereden geçtiğinden gelir. Bulgunun kendisi sağlam: 400'den fazla anıtsal yapı bulundu ve bunlar var. Sınanması gereken, o dört yüzden yirmi bine giden adımın kendisi.", "en": "What would move the argument forward is a second sampling design rather than a larger number: transects flown at a different spacing or in a different orientation over the same 183,000 km². If two separate geometries give densities close to one another, the extension gains support; if they diverge, the difference comes from where the transects ran rather than from the structures. The finding itself is solid: more than 400 monumental sites were found, and they exist. What needs testing is the step that runs from those four hundred to twenty thousand.", "refs": ["amazon"]}]}], "sources": [{"key": "amazon", "kind": "news", "name": "University of Helsinki", "url": "https://www.helsinki.fi/en/news/culture/ancient-civilization-millions-once-flourished-amazon", "title": {"tr": "Amazon'da 4.500 kilometrekarelik lidar taraması 400'den fazla anıtsal yapıyı haritaladı", "en": "A lidar survey of 4,500 square kilometres in Amazonia mapped more than 400 monumental sites"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-06", "title": {"tr": "Bir zihnin temelinde proteinleri doğru katlamak olabilir", "en": "The base of a mind may be nothing grander than folding proteins correctly"}, "excerpt": {"tr": "Ahtapot zekâsını hep devrelerde aradık. Harvard'daki ekip bir basamak aşağıya, proteinleri kuran makinenin kendisine baktı ve orada yalnızca ahtapotlarda görülen bir kopma buldu.", "en": "We have always looked for octopus intelligence in circuitry. A team at Harvard looked one step lower, at the machine that builds the proteins, and found there a break seen only in octopuses."}, "sections": [{"h": {"tr": "Bir basamak aşağıda", "en": "One step lower down"}, "ps": [{"tr": "Harvard'daki ekip, yalnızca ahtapotlarda görülen bir ribozomal RNA kopması buldu. Bu değişiklik bakteriye aktarıldığında hücreler protein üretirken daha az hata yaptı ve yanlış katlanmış moleküllerin zehirli yığınlar oluşturma riski düştü. Ahtapot dokusunda protein yığınları, kalamardakine göre hem daha az hem daha küçüktü.", "en": "The team at Harvard found a break in ribosomal RNA that occurs only in octopuses. When the change was engineered into bacteria, the cells made fewer mistakes while building proteins and the risk of misfolded molecules forming toxic aggregates fell. Protein clumps in octopus tissue were both fewer and smaller than in squid.", "refs": ["octopus"]}, {"tr": "Bir zihni anlamaya çalışırken alıştığımız yer nöronların birbirine nasıl bağlandığıdır: devreler, ağlar, katmanlar. Burada bakılan yer bir basamak aşağıda. Nöron bir yapıdır ve o yapı proteinlerden kurulur; onları kuran ribozom hata yaparsa, en zarif devre şeması bile yanlış malzemeyle örülür. Bu çalışmanın gösterdiği şey, o malzeme atölyesinde ahtapotlara özgü bir ayarın bulunduğudur.", "en": "When we try to understand a mind, the place we are used to looking is how neurons connect to one another: circuits, networks, layers. What is examined here is one step lower. A neuron is a structure, and that structure is built out of proteins; if the ribosome assembling them makes mistakes, even the most elegant circuit diagram gets woven from the wrong material. What this study shows is that in that materials workshop there is a setting particular to octopuses.", "refs": ["octopus"]}]}, {"h": {"tr": "Zamanlama ve temkin", "en": "Timing and restraint"}, "ps": [{"tr": "Zamanlama dikkat çekiyor. Yazarlar bu değişikliğin, sığ su ahtapotlarının yaklaşık 100 milyon yıl önce karmaşık ortamlara yerleşmesi ve sinir sistemlerinin hızla genişlemesiyle örtüştüğünü belirtiyor. Ortak baş yazar Rishav Mitra bağı kurarken dilini özenle ölçüyor: değişiklik \"might help these neurons to work well\".", "en": "The timing is striking. The authors note that this change coincides with shallow-water octopuses settling into complex environments roughly 100 million years ago and their nervous systems expanding rapidly. Co-lead author Rishav Mitra measures his language carefully in drawing the link: the change \"might help these neurons to work well\".", "refs": ["octopus"]}, {"tr": "Neden özellikle nöronlar? Uzun ömürlü ve sürekli protein üreten hücrelerde hata birikimi diğer dokulardan daha pahalıya gelir; daha doğru bir ribozom en çok orada işe yarar. Ama aynı değişiklik nöronlarla ilgisi olmayan bir nedenle de seçilmiş olabilir; sıcak ya da değişken suya dayanmak da protein katlanmasını zorlar ve o durumda sinirsel yarar yan üründür. Zamanlamanın örtüşmesi, iki açıklamadan hangisinin doğru olduğunu söylemez.", "en": "Why neurons in particular? In long-lived cells that build protein continuously, accumulated error costs more than it does in other tissue, and a more accurate ribosome pays off most there. But the same change could have been selected for a reason unconnected with neurons; tolerating warm or variable water also strains protein folding, and in that case any neural benefit is a by-product. The coincidence of timing does not tell us which of the two accounts is right.", "refs": ["octopus"]}]}, {"h": {"tr": "Bilmek ne demek olurdu", "en": "What knowing would take"}, "ps": [{"tr": "Genetikçi Eli Eisenberg sınırı açıkça koyuyor: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" İnsanda sınama ribozomal RNA'yı değiştirip öğrenme ile sorun çözmeyi ölçmeyi gerektiriyor ve çok zor sayılıyor. Yine de burada duran şey küçük değil. Bir zihnin nasıl kurulduğunu sorarken hep bir üst kata, düşüncenin kendisine bakmaya alışmışız; bu bulgu aynı soruyu bodruma taşıyor ve orada bir molekülün nasıl doğru katlandığını soruyor. Şimdilik bir hipotez. Ama sorunun yerini değiştiren bir hipotez.", "en": "The geneticist Eli Eisenberg sets the limit plainly: \"more proof is needed to support the hypothesis that they contributed to the evolution of neural complexity or cognitive capacity.\" Testing this in humans would mean altering ribosomal RNA and measuring learning and problem-solving, which is described as highly challenging. Even so, what stands here is not small. Asking how a mind is built, we are used to looking upstairs, at thought itself; this finding carries the same question down to the basement and asks there how a molecule folds correctly. For now it is a hypothesis. But it is one that moves where the question sits.", "refs": ["octopus"]}]}], "sources": [{"key": "octopus", "kind": "news", "name": "Scientific American", "url": "https://www.scientificamerican.com/article/a-unique-cellular-trick-may-explain-octopus-intelligence", "title": {"tr": "Ahtapot ribozomal RNA'sındaki bir kopma, protein üretimindeki hataları azaltıyor", "en": "A break in octopus ribosomal RNA lowers errors in protein building"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "sci-02", "title": {"tr": "Sinir sistemi işareti nüfus ölçeğinde, tanı ölçeğinde değil", "en": "The nervous-system signal is population-scale, not diagnostic"}, "excerpt": {"tr": "2,56 milyon kişilik çalışma fibromiyaljinin genetik işaretlerini beyin ve sinir hücrelerinde topluyor. Bu, biyolojik çerçeveyi keskinleştiriyor; tek bir hastanın tanısını, ağrısının kaynağını ya da tedavisini belirlemiyor.", "en": "A study of 2.56 million people concentrates fibromyalgia's genetic signal in brain and neural cells. That sharpens the biological framework without determining one patient's diagnosis, source of pain or treatment."}, "sections": [{"h": {"tr": "Büyük örneklem neyi satın aldı", "en": "What the large sample bought"}, "ps": [{"tr": "Meta-analiz 11 kohorttan 54.629 fibromiyalji olgusunu 2.509.126 kontrolle birleştirdi; toplam 2.563.755 kişi. Çok kökenli genom çapında tarama 26 risk bölgesi buldu. Bu büyüklük, daha küçük çalışmaların yakalayamadığı zayıf ve dağınık ilişkileri görünür kılıyor; fakat her bölge hastalığın küçük bir nüfus düzeyi olasılık farkını taşıyor. ‘Risk bölgesi’, bir kişide hastalığı açıklayan mutasyon ya da klinik test anlamına gelmiyor.", "en": "The meta-analysis combined 54,629 fibromyalgia cases with 2,509,126 controls across 11 cohorts, a total of 2,563,755 people. The multi-ancestry genome-wide scan found 26 risk loci. That scale makes weak, distributed associations visible where smaller studies could not, but each locus carries a small population-level difference in probability. A ‘risk locus’ is not a mutation that explains the condition in one person or a clinical test.", "refs": ["fibromyalgia"]}, {"tr": "En güçlü ilişki, Huntington hastalığının nedensel geni HTT'deki kodlayan bir varyantla kuruldu; gen önceliklendirmesi HTT'yi düzenleyen GPR52 ile DCC, DRD2/NCAM1, MDGA2 ve CELF4 gibi sinir sistemi adaylarını da öne çıkardı. Kalıtılabilirlik zenginleşmesi beyin dokuları ve sinir hücrelerinde toplandı. Aynı genin iki hastalıkta görünmesi iki hastalığın aynı olduğu anlamına gelmez: ortak genetik bölge farklı hücrelerde, farklı biyolojik yollar ve etki büyüklükleriyle çalışabilir.", "en": "The strongest association involved a coding variant in HTT, the causal gene for Huntington's disease; gene prioritisation also highlighted the HTT regulator GPR52 and neural candidates including DCC, DRD2/NCAM1, MDGA2 and CELF4. Heritability enrichment concentrated in brain tissues and neural cells. The same gene appearing in two conditions does not make the conditions the same: a shared genomic region can act through different cells, pathways and effect sizes.", "refs": ["fibromyalgia"]}]}, {"h": {"tr": "Korelasyon nüfus ölçeğinde durur", "en": "Correlation stops at the population scale"}, "ps": [{"tr": "Fibromiyaljinin bel ağrısı, travma sonrası stres bozukluğu ve irritabl bağırsak sendromuyla genetik korelasyonları 0,7'nin üzerindeydi. Bu sayıların dili ortak kalıtsal yatkınlıktır; bir durumun ötekine yol açtığını ya da yakınmaların ‘yalnızca psikolojik’ olduğunu söylemez. Kohortların hastane ve birinci basamak kayıtlarındaki tanı kodlarına dayanması da önemlidir: genişlik, klinik değerlendirmedeki farklılıkları ve yanlış sınıflandırmayı otomatik olarak ortadan kaldırmaz.", "en": "Fibromyalgia's genetic correlations with low-back pain, post-traumatic stress disorder and irritable bowel syndrome exceeded 0.7. Those numbers describe shared inherited liability; they do not say that one condition causes another or that symptoms are ‘only psychological’. It also matters that cohorts used diagnosis codes from hospital or primary-care records: scale does not automatically remove differences in clinical assessment or misclassification.", "refs": ["fibromyalgia"]}, {"tr": "Fibromiyaljinin görülme sıklığında büyük cinsiyet farkları olmasına rağmen erkeklerle kadınların genetik mimarisi çalışmada neredeyse aynı çıktı. Bu bulgu, sıklık farkını genetik farkla açıklayan basit hesabı zayıflatıyor; tanıya erişim, hormonlar, çevre ve ölçüm gibi başka katmanları açık bırakıyor. Bugünkü klinik değer, kronik ağrıyı sinir sistemi biyolojisi içinde sınanabilir hedeflere ayıran daha sağlam bir araştırma haritasında yatıyor. Bu verilerden ilaç seçimi çıkmıyor.", "en": "Despite large sex differences in fibromyalgia prevalence, the study found nearly identical genetic architecture in males and females. That weakens a simple account in which prevalence follows genetic difference and leaves other layers—diagnostic access, hormones, environment and measurement—open. Its clinical value today lies in a stronger research map dividing chronic pain into testable targets within nervous-system biology. Drug choice does not follow from these data.", "refs": ["fibromyalgia"]}]}], "sources": [{"key": "fibromyalgia", "kind": "news", "name": "Nature Medicine", "url": "https://www.nature.com/articles/s41591-026-04492-6", "title": {"tr": "2,56 milyon kişilik fibromiyalji meta-analizi 26 genetik risk bölgesi buldu", "en": "A fibromyalgia meta-analysis across 2.56 million people found 26 genetic risk loci"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-03", "title": {"tr": "Kuraklığın tanısını artık yalnızca yağış koymuyor", "en": "Rainfall no longer diagnoses the drought alone"}, "excerpt": {"tr": "Amazon havzasındaki 2023–2024 kuraklığı alanın yüzde 88'ine yayıldı. Yağış kırılmanın yalnızca bir tarafı: 2005 sonrasında ısınan havanın su talebi, büyük kuraklıkları şiddetlendiren baskın bileşen hâline geliyor.", "en": "The Amazon drought of 2023–2024 spread across 88 percent of the basin. Rainfall is only one side of the break: after 2005, warming-driven atmospheric demand becomes the dominant intensifier of major droughts."}, "sections": [{"h": {"tr": "Kırk dört yıllık sıralama", "en": "A forty-four-year ranking"}, "ps": [{"tr": "Araştırmacılar 1980–2024 arasındaki Amazon kuraklıklarını aynı çerçevede sıraladığında 2023–2024 olayı havzanın yüzde 88'ini kapladı. Büyüklüğü, en büyük beş kuraklığın ortalamasının dört katına ulaştı. Bu iki sayı farklı şeyleri tutuyor: yüzde 88 mekânsal yayılımı, dört kat ise süre ile şiddeti birleştiren büyüklüğü. Tek bir yağış istasyonunun kötü yılı değil, havza ölçeğinde eşzamanlı bir su açığı söz konusu.", "en": "When the researchers ranked Amazon droughts from 1980 to 2024 in one framework, the 2023–2024 event covered 88 percent of the basin. Its magnitude reached four times the average of the five largest droughts. The two numbers capture different dimensions: 88 percent is spatial reach, while fourfold magnitude combines duration and intensity. This was not one rain gauge's bad year but a basin-scale water deficit occurring at once.", "refs": ["amazon-drought"]}, {"tr": "Daha önemli ayrım zaman içinde belirdi. 2005 öncesindeki büyük kuraklıklar başlıca yağış azlığıyla açıklanırken, 2005 sonrasında ısınmanın artırdığı atmosferik buharlaştırma talebi şiddetlendirici baskın bileşen hâline geldi. Sıcak hava toprağın ve bitkinin üzerindeki su çekişini büyütüyor; aynı yağış açığı daha yüksek sıcaklık altında daha ağır bir ekolojik bilanço üretebiliyor. Böylece meteorolojik kuraklık ile bitkinin yaşadığı su stresi arasındaki bağ değişiyor.", "en": "The more consequential division appeared over time. Before 2005 major droughts were explained chiefly by reduced rainfall; after 2005, warming-enhanced atmospheric evaporative demand became the dominant intensifier. Hotter air increases the pull of water from soil and vegetation, so the same rainfall deficit can produce a heavier ecological balance sheet at higher temperature. The link between meteorological drought and the water stress experienced by plants is changing.", "refs": ["amazon-drought"]}]}, {"h": {"tr": "Tahmin ile hazırlık arasındaki ölçü", "en": "The measure between forecast and preparation"}, "ps": [{"tr": "Çalışma kuraklık örüntüsünü tropik Hint ve Pasifik okyanuslarıyla Kuzey Atlantik'teki deniz yüzeyi sıcaklığı sapmalarına bağlıyor. Bu bağlantılar uzak okyanusların Amazon'u tek başına yönettiğini kanıtlamıyor; atmosferik dolaşım üzerinden birlikte değişen koşulları işaretliyor. Yağış, sıcaklık ve okyanus sapmaları birbirine bağlı olduğundan her bileşenin payı seçilen kuraklık göstergesine ve döneme duyarlı.", "en": "The study links the drought pattern to sea-surface temperature anomalies in the tropical Indian and Pacific oceans and the North Atlantic. Those links do not prove that distant oceans govern the Amazon alone; they identify conditions that co-vary through atmospheric circulation. Because rainfall, temperature and ocean anomalies are coupled, each component's share remains sensitive to the drought indicator and period selected.", "refs": ["amazon-drought"]}, {"tr": "Hazırlık sistemi yağışı izlemeyi sürdürüyor ve eşiğe atmosferik talebi de ekliyor. Nehir taşımacılığı, yangın yönetimi, tarım ve elektrik üretimi için aynı yağış tahmini farklı sıcaklıklarda farklı risk demek. Havza yöneticileri yağış açığı ile buharlaştırma talebini birlikte izlediğinde uyarı, gökten gelmeyen suyun yanında toprağın ve ormanın su kaybetme hızını da kapsar. Isınma, kuraklığın ikinci bir sayacı hâline gelmiş durumda.", "en": "A preparedness system continues to track rainfall and adds atmospheric demand to its thresholds. For river transport, fire management, farming and power generation, the same rainfall forecast means different risk at different temperatures. When basin managers track rainfall deficit and evaporative demand together, an alert covers water missing from the sky alongside the rate at which soil and forest lose it. Warming has become a second drought meter.", "refs": ["amazon-drought"]}]}], "sources": [{"key": "amazon-drought", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-62139-5", "title": {"tr": "Amazon'un 2023–2024 kuraklığı havzanın yüzde 88'ini etkiledi", "en": "The Amazon drought of 2023–2024 affected 88 percent of the basin"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-04", "title": {"tr": "Küresel bina haritası iki vekil üzerine kurulu", "en": "The global building map stands on two proxies"}, "excerpt": {"tr": "Model 9.000'i aşkın kent merkezindeki yapı stokunu iklimlendirme kırılganlığına çeviriyor. Haritanın gücü küresel tutarlılık; sınırı ise gerçek sayaçlar yerine yapım dönemiyle bina kompaktlığını kullanması.", "en": "A model turns building stock across more than 9,000 urban centres into a map of climatization vulnerability. Its strength is global consistency; its limit is reliance on construction epoch and compactness rather than actual meters."}, "sections": [{"h": {"tr": "Haritanın iki taşıyıcı kolonu", "en": "The map's two load-bearing columns"}, "ps": [{"tr": "Bir binanın iklimlendirme gereksinimini küresel ölçekte karşılaştırmak için ortak bir yapı dili gerekiyor. Çalışma, yapı ayak izlerini ve Dünya gözlemlerini eş büyüklükteki coğrafi karelerde birleştirip 9.000'i aşkın kent merkezini aynı hesap çerçevesine yerleştiriyor. Ayak izi ile yükseklik, yapı stokunun biçimini kuruyor; yapım dönemi de farklı teknik standartlar altında inşa edilmiş stok için zaman katmanı ekliyor. Böylece tek tek binaları denetlemek yerine tutarlı bir dünya modeli üretiliyor.", "en": "Comparing building climatization needs globally requires one common language for structures. The study combines building footprints and Earth observations in equally sized geographic tiles, placing more than 9,000 urban centres inside one computational frame. Footprint and height construct the stock's geometry; construction epoch adds a time layer for structures built under different technical standards. The result is a consistent world model rather than an audit of individual buildings.", "refs": ["building-climatization"]}, {"tr": "Modelin yük taşıyan iki vekili yapım dönemi ile kompaktlık. Yapıların yüzde 43'ünün 1980 öncesine ait olması, eski stokun haritadaki ağırlığını belirliyor. Kompaktlık ise dış yüzey ile kapalı hacim arasındaki ilişkiyi yaklaşık olarak temsil ediyor; aynı yerel ısıtma ya da soğutma gereksiniminde daha elverişsiz biçimler farklı kırılganlık puanı alıyor. Enerji sayaçları, HVAC verimi ve iç sıcaklık ölçümleri bu hesapta doğrudan gözlenmiyor. Harita bu yüzden enerji tüketimini ölçen bir sayaç ağı değil, yapı verisinden kurulan bir tarama modeli.", "en": "The model's two load-bearing proxies are construction epoch and compactness. With 43 percent of buildings predating 1980, older stock carries substantial weight in the map. Compactness approximates the relation between exterior surface and enclosed volume, so less favourable forms receive a different vulnerability score under the same local heating or cooling need. Energy meters, HVAC efficiency and indoor temperatures are not observed directly. The map is therefore a screening model assembled from building data, not a metering network measuring energy use.", "refs": ["building-climatization"]}]}, {"h": {"tr": "Senaryo çıktısı ile bina denetimi arasındaki mesafe", "en": "The distance between a scenario output and a building audit"}, "ps": [{"tr": "Bu kurulum günümüzde yaklaşık 48 milyon kişiyi, yerel ısıtma veya soğutma gereksinimine göre kırılgan yapıların yoğunlaştığı alanlarla eşleştiriyor. Bu sayı enerji yoksulluğunu, arızalı iklimlendirme sistemlerini ya da tek tek evlerde ölçülen sıcaklığı doğrudan saymıyor. Yapı stokunun vekil özelliklerini yerel iklim gereksinimiyle aynı modelde buluşturuyor. Dolayısıyla 48 milyon, bina düzeyindeki kesin bir envanterden çok karşılaştırılabilir bir maruziyet taramasıdır.", "en": "Under this construction, about 48 million people now fall within areas where buildings vulnerable relative to local heating or cooling needs are concentrated. That count does not directly enumerate energy poverty, failed climatization systems or measured temperatures in individual homes. It brings proxy features of building stock together with local climate needs in one model. The 48 million is therefore a comparable exposure screening result rather than a definitive building-level inventory.", "refs": ["building-climatization"]}, {"tr": "Basitleştirilmiş şekil katsayısı ile ayak izi ve yükseklik hataları modelin geometrik hata bütçesini oluşturuyor. Yenileme oranları, HVAC verimi, kültürel uyum ve kullanıcı davranışı ise aynı geometrinin gerçek yaşamda farklı sonuçlar vermesine yol açabilir. Bu sınırlar haritayı değersizleştirmiyor; uygun kullanım alanını daraltıyor. Kent ve ulusal ölçekte hangi bölgelerin daha ayrıntılı saha çalışmasına ihtiyaç duyduğunu sıralayabilir. Tek bir evin güvenliği, enerji faturası ya da yenileme reçetesi için yerel ölçüm ve bina denetimi yine gerekli.", "en": "A simplified shape factor plus footprint and height errors form the model's geometric error budget. Renovation rates, HVAC efficiency, cultural adaptation and occupant behaviour can then make identical geometry perform differently in practice. Those limits narrow the map's proper use. It can rank regions that need deeper field work at city or national scale. Judging one home's safety, energy bill or retrofit prescription still requires local measurements and a building audit.", "refs": ["building-climatization"]}]}], "sources": [{"key": "building-climatization", "kind": "news", "name": "Scientific Reports", "url": "https://www.nature.com/articles/s41598-026-58888-y", "title": {"tr": "Küresel yapı stoku modeli, bugün 48 milyon kişiyi iklimlendirme açısından kırılgan alanlarda buluyor", "en": "A global building-stock model places 48 million people in climatization-vulnerable areas today"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-05", "title": {"tr": "Okyanusun üretim toplamı, saha ölçümlerine yaklaşınca küçüldü", "en": "The ocean production total shrank when it moved closer to field measurements"}, "excerpt": {"tr": "Genişletilmiş karbon izotopu veri tabanı, küresel deniz birincil üretimini yaygın uydu ürünlerinden yüzde 10–20 aşağı çekiyor. Sonuç, seyrek ölçümle model arasındaki kalibrasyonu değiştiriyor ve doğrudan küresel sayım sunmuyor.", "en": "An expanded carbon-isotope database pulls global marine primary production 10–20 percent below common satellite products. The result changes calibration between sparse measurements and a model and provides no direct global census."}, "sections": [{"h": {"tr": "Ölçüm ağı büyüdüğünde", "en": "When the measurement network grows"}, "ps": [{"tr": "Deniz net birincil üretimi küresel ölçekte doğrudan sayılamıyor. Karbon izotopu kuluçka deneyleri yerel ve seyrek, uydular ise okyanus rengini geniş alanda görüyor ama karbon akışını doğrudan tartmıyor. Çalışma, saha kuluçka veri tabanının kapsamını yaklaşık yüzde 50 genişletti ve birden çok uydu ürününü bu gözlemlerle aynı noktalarda karşılaştırdı. Yöntemin hikâyesi yeni bir sensörden çok, uydunun vekil ölçüsünü daha geniş bir saha ağına yeniden bağlamak.", "en": "Global marine net primary production cannot be counted directly: carbon-isotope incubation experiments are local and sparse, while satellites see ocean colour broadly but do not weigh carbon flow itself. The study expanded the coverage of the field-incubation database by about 50 percent and compared multiple satellite products with those observations at matched locations. The methodological story is less a new sensor than a broader field network reconnecting a satellite proxy to measured production.", "refs": ["marine-productivity"]}, {"tr": "Bu karşılaştırmayla sınırlandırılan model, küresel üretimi yaygın uydu ürünlerinden yüzde 10–20 daha düşük hesapladı. Model tek bir düzeltme katsayısı uygulamak yerine çevresel değişkenlerle saha ölçümleri arasındaki ilişkiyi yeniden öğreniyor. Uydu döneminin yeniden kurulumlarında Kuzey Yarımküre'de mekânsal farklılaşma artarken Güney Yarımküre'de üretim daha tekdüze dağılıyor. Yani hem toplam hem haritanın biçimi değişiyor.", "en": "The model constrained by that comparison estimated global production 10–20 percent below widely used satellite products. Rather than applying one correction factor, it relearns the relation between field measurements and environmental variables. Reconstructions over the satellite era show growing spatial heterogeneity in the Northern Hemisphere and a more homogeneous distribution in the Southern Hemisphere. Both the total and the shape of the map change.", "refs": ["marine-productivity"]}]}, {"h": {"tr": "Daha düşük sayının güven aralığı", "en": "The confidence interval around the lower number"}, "ps": [{"tr": "Saha ölçümleriyle sınırlanan model, doğrudan küresel gözlemden farklı bir kanıt türüdür. Saha noktaları kıyılar, mevsimler ve erişilebilir bölgeler arasında eşit dağılmıyor; model bu boşlukları sıcaklık, ışık, besin ve renk gibi çevresel değişkenlerle dolduruyor. Veri tabanının yüzde 50 büyümesi önemli, fakat okyanusun her hücresini ölçülmüş hâle getirmiyor. Sonuç, eski ürünlerin saha ölçümlerine göre taşıdığı sistematik farkı niceliyor ve onların tümünü yanlış ilan etmiyor.", "en": "A model constrained by field measurements is a different kind of evidence from direct global observation. Field sites are uneven across coasts, seasons and accessible regions, and the model fills those gaps with environmental variables such as temperature, light, nutrients and colour. A 50 percent expansion is substantial, yet every ocean cell remains short of direct measurement. The result quantifies the products' systematic difference from field measurements without declaring all older products wrong.", "refs": ["marine-productivity"]}, {"tr": "Yüzde 10–20'lik aşağı yönlü revizyon, okyanusun atmosferden aldığı karbonun aynı oranda değiştiği anlamına da gelmez; birincil üretim ile uzun süreli karbon gömülmesi aynı büyüklük değildir. Ancak karbon döngüsü modellerinin başlangıç akısını ve hangi bölgelerde değişim arayacağını etkiler. Bağımsız sınama için en değerli ek veri, bugünkü veri tabanında seyrek kalan açık okyanus ve mevsimlerde aynı kuluçka protokolleriyle alınacak ölçümlerdir.", "en": "A 10–20 percent downward revision does not mean that the ocean's uptake of atmospheric carbon changes by the same amount; primary production and long-term carbon storage are not the same quantity. It does alter the starting flux in carbon-cycle models and where they look for change. The most valuable independent test would add measurements with the same incubation protocols in open-ocean regions and seasons that remain sparse in the present database.", "refs": ["marine-productivity"]}]}], "sources": [{"key": "marine-productivity", "kind": "news", "name": "Communications Earth \u0026 Environment", "url": "https://www.nature.com/articles/s43247-026-03828-x", "title": {"tr": "Gözlemle sınırlandırılan model, küresel deniz üretkenliğini uydu ürünlerinden yüzde 10–20 daha düşük hesapladı", "en": "An observation-constrained model put global marine productivity 10–20 percent below satellite products"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-06", "title": {"tr": "Çeşitlilik yalnızca çevrede yaşamıyor, çevreyi yapanlarda da yaşıyor", "en": "Diversity lives not only in an environment but in the organisms that build it"}, "excerpt": {"tr": "Fanerozoyik fosil topluluklarında resif kurucuları ve tortu karıştırıcılar daha yüksek çeşitlilikle birlikte görülüyor. Yüz milyonlarca yıla yayılan ilişki, yaşamın yalnızca çevreye uymadığını, yaşanabilir çevreyi de kurduğunu gösteriyor.", "en": "Across Phanerozoic fossil communities, reef builders and sediment mixers accompany higher diversity. A relationship spanning hundreds of millions of years shows that life not only fits environments; it also constructs habitable ones."}, "sections": [{"h": {"tr": "Her jeolojik evrede aynı soru", "en": "The same question in every geological stage"}, "ps": [{"tr": "Çalışma Fanerozoyik'in her evresinde, resif kurucuları ya da tortuyu karıştıran biyotürbasyon canlıları bulunan fosil topluluklarını bunların bulunmadığı topluluklarla karşılaştırdı. Çeşitliliği yalnız tür sayısıyla değil, bolluk dağılımını da hesaba katan Shannon ölçüsüyle değerlendirdi ve her evre için etki büyüklüğü hesapladı. Yaklaşık 541 milyon yıllık kaydı tek toplamda eritmek yerine zaman dilimlerine ayırmak, ilişkinin ne zaman sürdüğünü ve ne zaman zayıfladığını görmeyi sağlıyor.", "en": "For every stage of the Phanerozoic, the study compared fossil communities containing reef builders or sediment-mixing bioturbators with communities lacking them. It assessed diversity not only by species count but with the Shannon measure, which includes abundance distribution, and calculated an effect size for each stage. Rather than melting roughly 541 million years into one total, the stage-by-stage design shows when the relationship persists and when it weakens.", "refs": ["ecosystem-engineers"]}, {"tr": "Fanerozoyik'in büyük bölümünde ekosistem mühendislerinin bulunduğu topluluklar anlamlı biçimde daha yüksek çeşitlilik taşıdı; etki en güçlü biçimde ılımlı sıcaklıklarda görüldü. Bu ilişki makul bir mekanizmaya sahip: resifler üç boyutlu barınak ve yüzey, tortu karıştırıcılar ise oksijen ve besin akışı yaratıyor. Fakat veri karşılaştırmalı fosil kaydı olduğu için mekanizma deneysel olarak ayrıştırılmıyor; mühendisler çeşitliliği artırabilir, çeşitlilik de mühendislerin kalabildiği istikrarlı koşulları işaretleyebilir.", "en": "Through much of the Phanerozoic, communities with ecosystem engineers carried significantly greater diversity, with the strongest effect at moderate temperatures. The association has a plausible mechanism: reefs create three-dimensional shelter and surface, while sediment mixers create flows of oxygen and nutrients. But because the evidence is a comparative fossil record, the mechanism is not experimentally separated; engineers may raise diversity, while diversity may also mark stable conditions in which engineers persist.", "refs": ["ecosystem-engineers"]}]}, {"h": {"tr": "Mühendisin türü geleceği değiştiriyor", "en": "The kind of engineer changes the future"}, "ps": [{"tr": "Yaklaşık son 250 milyon yılda modern resif kurucuları iklim baskısına biyotürbasyon yapan canlılardan daha duyarlı görünüyor. İki grup habitatı aynı yoldan kurmuyor: resif, karmaşık ama sıcaklık ve kimyaya hassas bir fiziksel yapı; tortu karıştırma ise deniz tabanında daha dağınık bir işlem. Bugünkü ısınmada ‘ekosistem mühendisi’ etiketini tek bir dayanıklılık sınıfı saymak bu nedenle yanıltıcı. Hangi mühendislik işlevinin kaybolduğu, tür sayısı kadar önem taşıyabilir.", "en": "Across roughly the past 250 million years, modern reef builders appear more sensitive to climate stress than bioturbators. The two groups do not construct habitat in the same way: a reef is a complex physical structure sensitive to temperature and chemistry, whereas sediment mixing is a more distributed process across the seabed. Treating ‘ecosystem engineer’ as one resilience class under present warming is therefore misleading. Which engineering function disappears may matter as much as the species count.", "refs": ["ecosystem-engineers"]}, {"tr": "Fosil kaydı, korunmaya uygun kabukları, erişilebilir kayaçları ve iyi örneklenmiş bölgeleri kayıran bir parça dizisidir. Buna rağmen aynı karşılaştırmanın yüz milyonlarca yıl boyunca tekrar tekrar çıkması, canlılığı fiziksel çevrenin etkin bir kurucusu olarak çerçeveliyor. Yaşam, sonraki yaşamın kullanacağı oyukları, yüzeyleri ve kimyasal yolları kuruyor. İlişki bir nedensellik hükmünden ziyade çeşitlilik tarihinin ortamı kuran canlılarla birlikte yazılması gerektiğine dair bir işaret.", "en": "The fossil record is a sequence of fragments favouring preservable shells, accessible rocks and well-sampled regions. Even so, the same comparison recurring over hundreds of millions of years frames life as an active builder of physical environments. Organisms construct cavities, surfaces and chemical pathways that later life can use. The association serves as a sign that the history of diversity must be written with environment-building organisms, rather than as a verdict of causality.", "refs": ["ecosystem-engineers"]}]}], "sources": [{"key": "ecosystem-engineers", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-73628-6", "title": {"tr": "Fosil topluluklarında ekosistem mühendislerinin varlığı daha yüksek deniz çeşitliliğiyle birlikte görüldü", "en": "Fossil communities with ecosystem engineers were associated with greater marine diversity"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "sci-01", "title": {"tr": "Merkezden dokuz kiloparsek uzakta parçalanan bir yıldız", "en": "A star torn apart nine kiloparsecs from the centre"}, "excerpt": {"tr": "Işık eğrisinden başka hiçbir şeye bakmayan bir sınıflandırıcı, galaksisinin merkezinde durmayan bir kara delik buldu. Asıl kazanç tek bir olayda değil, artık taranabilir hale gelen bir nüfusta.", "en": "A classifier that looked at nothing but the light curve found a black hole that was not sitting at its galaxy's centre. The gain lies less in the single event than in a population that can now be searched."}, "sections": [{"h": {"tr": "Ölçülen büyüklükler", "en": "The quantities measured"}, "ps": [{"tr": "Kasım 2025'te Zwicky Transient Facility'nin yakaladığı parlama, TDE 2025abcr adıyla kataloglandı. Swift'in morötesi ve optik teleskobu sıcaklığı yaklaşık 30.000 santigrat derece ölçtü; olay aylarca morötesinde ana galaksisini bastırdı ve on milyar Güneş parlaklığına ulaştı. Kaynak, Balina takımyıldızı yönünde yaklaşık 750 milyon ışık yılı uzaktaki bir galaksinin çekirdeğinden 30.000 ışık yılından fazla uzakta duran, yaklaşık bir milyon Güneş kütlesindeki bir kara delik.", "en": "The flare that the Zwicky Transient Facility caught in November 2025 was catalogued as TDE 2025abcr. Swift's ultraviolet and optical telescope measured it at about 30,000 degrees Celsius; for months the event outshone its host galaxy in the ultraviolet, reaching some ten billion times the Sun's luminosity. The source is a black hole of roughly a million solar masses, standing more than 30,000 light-years from the nucleus of a galaxy about 750 million light-years away towards Cetus.", "refs": ["swift"]}, {"tr": "Hakemli makaledeki sayılar daha dar: kara cisim sıcaklığının doruğu 30.220 artı eksi 2.120 kelvin, bolometrik parlaklığın doruğu saniyede 4,71 çarpı 10 üzeri 43 erg, parçalayan kara deliğin kütlesi 10 üzeri 6,09 artı eksi 0,53 Güneş kütlesi, galaksinin merkezindeki kara delik ise 10 üzeri 8,82 artı eksi 0,65. Ayrılık açısı 9,5 yay saniyesi, izdüşümde 9,3 kiloparsek. Kütle hata payı yarım kertelik; bu, hangi kara deliğin ne olduğunu tartışırken elimizdeki en dürüst sayı.", "en": "The numbers in the peer-reviewed paper are tighter: a peak blackbody temperature of 30,220 plus or minus 2,120 kelvin, a peak bolometric luminosity of 4.71 times 10 to the 43 ergs a second, a disrupting black hole of 10 to the 6.09 plus or minus 0.53 solar masses against the host's central black hole at 10 to the 8.82 plus or minus 0.65. The angular separation is 9.5 arcseconds, 9.3 kiloparsecs in projection. The mass carries half an order of magnitude of uncertainty, and that is the most honest figure we have when arguing about which black hole is which.", "refs": ["swift"]}]}, {"h": {"tr": "Nasıl bulundu", "en": "How it was found"}, "ps": [{"tr": "Arama, tdescore adlı makine öğrenmesi sınıflandırıcısının çekirdek dışı sürümüyle yapıldı: her geçici kaynağı yalnızca ışık eğrisi özelliklerinden değerlendirdi, ana galaksi bilgisini hiç kullanmadı. Ayırt edici işaretler, kara cisim sıcaklığının yüksek bir alt sınırı ve sıcaklığın zamanla soğumak yerine yükselmesiydi. Gelgitsel parçalanma aramaları uzun süre çekirdeğe bakarak yapıldığı için, ana galaksiyi yok sayan bir eleme tam da o varsayımın dışarıda bıraktığını görebiliyor.", "en": "The search used an off-nuclear implementation of the machine-learning classifier tdescore: it judged every transient from light-curve properties alone, using no host-galaxy information at all. The distinguishing marks were a high lower bound on the blackbody temperature and a temperature that rose with time instead of cooling. Because tidal-disruption searches have long been pointed at galactic nuclei, a filter that ignores the host can see exactly what that assumption left outside.", "refs": ["swift"]}, {"tr": "Sıradan açıklamalar önce elenmiş. Bir Ia türü süpernova modeli kötü uyum verdi; serbestlik derecesi başına ki-kare 4,5 çıktı. Etkin galaksi çekirdeği seçeneği, ana galaksinin tayfında tanı koydurucu salma çizgilerinin bulunmamasıyla dışlandı. Çekirdekte gerçekleşen bir parçalanma ise 9,3 kiloparseklik ayrılıkla bağdaşmıyor. Bir galaksinin dış bölgesinde parlayan bir noktanın en beklenen açıklaması süpernovadır ve öldürülmesi gereken de oydu.", "en": "The prosaic explanations were eliminated first. A Type Ia supernova model fitted poorly, with a chi-squared per degree of freedom of 4.5. An active galactic nucleus was ruled out because the host spectrum lacked the diagnostic emission lines. A disruption at the nucleus is incompatible with a 9.3-kiloparsec separation. The expected explanation for a bright point in a galaxy's outskirts is a supernova, and that is the one that had to be killed.", "refs": ["swift"]}]}, {"h": {"tr": "Çözülmeden kalan", "en": "What stays unresolved"}, "ps": [{"tr": "Kara deliğin oraya nasıl geldiği belirlenmiş değil. Bir galaksi birleşmesi sırasında dışarı atılmış olabilir; gelgitle soyulmuş bir uydu galaksinin içinde de bulunabilir. İki seçenek arasında karar vermek için geç dönem gözlemleri gerekiyor. Bu iki senaryo aynı ayrılığı üretir, dolayısıyla tek başına 9,3 kiloparsek hiçbirini desteklemiyor; ayırt edici olan, o konumda başka bir yıldız topluluğunun bulunup bulunmadığı.", "en": "How the black hole got there has not been established. It may have been ejected during a galaxy merger; it may sit inside a tidally stripped satellite galaxy. Deciding between them requires late-time observations. Both scenarios produce the same separation, so 9.3 kiloparsecs on its own supports neither; what distinguishes them is whether any other stellar population is found at that position.", "refs": ["swift"]}, {"tr": "Baş yazar Robert Stein, yöntemin doğrulandığını ve benzerlerini aramakta kullanılabileceğini söylüyor; Rubin gözlemevinin geniş ve derin taramalarının bugünkü teleskopların toplayabildiğinden çok daha büyük bir örneklem vereceğini de ekliyor. Makalenin kendisi ise böyle bir keşfi yinelemenin zor olduğunu, doğrulamanın pahalı takip gözlemleri istediğini kabul ediyor. Sınanabilir beklenti şu: Rubin'in ilk tarama yılı içinde çekirdek dışı elemeden geçip bağımsız tayfla doğrulanmış en az bir gelgitsel parçalanma daha bildirilirse, kazanç tek bir şanslı kaynakta değil yöntemde demektir.", "en": "Lead author Robert Stein says the technique has been validated and can be used to hunt for more, adding that Rubin's wide, deep surveys will yield a far larger sample than current telescopes can collect. The paper itself concedes that replicating such a discovery is difficult and that confirmation demands expensive follow-up. The testable expectation is this: if within Rubin's first survey year at least one further tidal disruption passes the off-nuclear filter and is confirmed by independent spectroscopy, the gain lies in the method rather than in one lucky source.", "refs": ["swift"]}]}], "sources": [{"key": "swift", "kind": "news", "name": "NASA", "url": "https://science.nasa.gov/missions/swift/nasas-swift-sees-wandering-mega-black-hole-shredding-star", "title": {"tr": "Swift ve yer teleskopları, galaksi merkezinden 30 bin ışık yılı uzakta parçalanan bir yıldızı izledi", "en": "Swift and ground telescopes tracked a star torn apart 30,000 light-years from a galaxy's centre"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "The Astrophysical Journal Letters", "url": "https://iopscience.iop.org/article/10.3847/2041-8213/ae77f3", "publishedDate": "2026-07-27", "title": {"tr": "TDE 2025abcr: Kütleli bir galaksinin dış bölgesinde bir gelgitsel parçalanma olayı", "en": "TDE 2025abcr: A Tidal Disruption Event in the Outskirts of a Massive Galaxy"}}}], "date": "2026-07-28"}, {"writer": "sci-02", "title": {"tr": "Altmış günlük yatak istirahati, hastalarınkine benzemeyen bir kas bıraktı", "en": "Sixty days of bed rest left a muscle that does not look like the patients'"}, "excerpt": {"tr": "Kondisyon kaybı açıklaması sınanabilir bir beklenti üretir: hareketsizlik tek etkense, hastanın kası yatakta tutulmuş sağlıklı bir insanınkine benzemeli. Bu karşılaştırmada benzemedi.", "en": "The deconditioning explanation makes a testable prediction: if inactivity were the whole story, a patient's muscle should resemble that of a healthy person kept in bed. In this comparison it did not."}, "sections": [{"h": {"tr": "Karşılaştırma neyi sınıyor", "en": "What the comparison tests"}, "ps": [{"tr": "Çalışma dört grubu yan yana koyuyor: 60 gün katı yatak istirahati uygulanan sağlıklı kişiler, uzun COVID hastaları, ME/kronik yorgunluk sendromu hastaları ve yaş ile cinsiyet bakımından eşleştirilmiş sağlıklı denekler. İki hasta grubunu birleştiren belirti efor sonrası halsizlik; buna eşlik eden fiziksel hareketsizlik ise tam olarak sınanmak istenen rakip açıklama. Yazarlar tüm vücut egzersiz yanıtlarını ve iskelet kası uyarlanmalarını bu dört grup arasında karşılaştırıyor.", "en": "The study sets four groups side by side: healthy people put through 60 days of strict bed rest, patients with long COVID, patients with myalgic encephalomyelitis or chronic fatigue syndrome, and healthy controls matched for age and sex. The symptom that joins the two patient groups is post-exertional malaise; the physical inactivity that accompanies it is precisely the rival explanation under test. The authors compare whole-body exercise responses and skeletal muscle adaptations across the four groups.", "refs": ["muscle"]}, {"tr": "Bu tasarımın gücü de sınırı da aynı asimetriden geliyor. Yatak istirahati kolu sağlıklı gönüllülerde uygulanan deneysel bir müdahale; hasta kolları ise gözlemsel. Yani hareketsizliğin kasta ne yaptığını deneysel olarak biliyoruz ve hastalarda gördüğümüzü bu bilinen etkiyle karşılaştırabiliyoruz. Bu, hastalığın nedenini gösteren bir kurgu değil; bir açıklamanın kapsayabileceği alanı daraltan bir kurgu.", "en": "The strength and the limit of this design come from the same asymmetry. The bed-rest arm is an experimental intervention in healthy volunteers; the patient arms are observational. So we know experimentally what inactivity does to muscle, and can hold what the patients show against that known effect. The design cannot identify the cause of an illness. What it can do is narrow the ground an explanation covers.", "refs": ["muscle"]}]}, {"h": {"tr": "Nerede ayrışıyorlar", "en": "Where they diverge"}, "ps": [{"tr": "Yatak istirahati kası küçülttü ama lif tipini değiştirmedi. Hasta gruplarında tablo başka: her ikisinde glikolitik lif oranı daha yüksek çıktı ve ME/KYS hastalarında körelme tip I liflere özgüydü. Bir ayrıntı daha var: oksidatif fosforilasyon kapasitesi ile en yüksek oksijen alımı arasındaki ilişki yalnızca yatak istirahatinin ardından beliriyor, hastalarda değil. Yani hastalarda düşük egzersiz kapasitesini açıklayan bağ, hareketsizliğin kurduğu bağ değil.", "en": "Bed rest shrank muscle without changing fibre type. In the patient groups the picture differs: both carried a higher proportion of glycolytic fibres, and in ME/CFS the atrophy was specific to type I fibres. One further detail: the association between oxidative phosphorylation capacity and maximal oxygen uptake appears only after bed rest, not in the patients. The link that explains low exercise capacity in the patients is therefore not the link inactivity builds.", "refs": ["muscle"]}, {"tr": "Bu, derece farkından çok cins farkına benziyor: hareketsizlik kası azaltıyor, hastalarda ise kasın bileşimi kayıyor. Yine de tek olası okuma bu değil. Altmış günlük katı yatak istirahati, aylar ya da yıllar süren, kesintili ve hastalıkla iç içe geçmiş bir hareketsizliği birebir taklit etmiyor; beslenme, ateşli dönemler ve tekrarlayan efor sonrası çöküşler farklı bir uyarlanma üretebilir. Glikolitik kayma, hastalığa özgü bir süreçten değil, süresi ve dokusu farklı bir hareketsizlikten de doğabilir.", "en": "That looks more like a difference in kind than in degree: inactivity subtracts muscle, while in patients the composition of the muscle shifts. Even so, it is not the only available reading. Sixty days of strict bed rest does not reproduce an inactivity that runs for months or years, comes and goes, and is entangled with illness; nutrition, febrile episodes and repeated post-exertional crashes could produce a different adaptation. The glycolytic shift could arise from inactivity of a different duration and texture rather than from a disease-specific process.", "refs": ["muscle"]}]}, {"h": {"tr": "Hasta için ne değişiyor", "en": "What changes for a patient"}, "ps": [{"tr": "Bu çalışma bir mekanizma, bir tedavi ya da bir belirteç sunmuyor. Sunduğu şey, tek bir açıklamanın tekelini kaldırmak. Efor sonrası halsizliği kondisyon kaybıyla açıklanmış hastalar için bu, kanıt tablosunda gerçek bir kayma anlamına geliyor. Klinik bir talimat yerine geçmez. Karşılaştırmanın ne kadar geniş bir topluluğa taşınabileceğini belirleyen sayı, her gruba kaç kişinin girdiğidir; yorumun ağırlığı da orada tartılır.", "en": "The study offers no mechanism, no treatment and no biomarker. What it offers is the removal of one explanation's monopoly. For patients whose post-exertional malaise has been explained as deconditioning, that marks a real shift in the evidence, though it stops short of a clinical instruction. The number that decides how far the comparison travels is how many people entered each group, and that is where the weight of the interpretation is settled.", "refs": ["muscle"]}, {"tr": "Ayırt edici sınama bellidir. Lif tipi kayması hastalığa özgüyse, başka bir nedenle uzun süre hareketsiz kalmış kişilerle eşleştirilen hastalarda kayma yine görülmelidir; hareketsizliğin süresine bağlıysa, eşleştirme kaybolmasına yol açar. Önümüzdeki bir yıl içinde böyle bir eşleştirilmiş karşılaştırma yayımlanırsa, iki açıklama arasındaki tercih ölçülebilir hale gelir.", "en": "The discriminating test is clear. If the fibre-type shift is disease-specific, it should persist in patients matched against people rendered inactive for a long time by some other cause; if it depends on the duration of inactivity, matching should make it disappear. Should such a matched comparison be published within the coming year, the choice between the two explanations becomes measurable.", "refs": ["muscle"]}]}], "sources": [{"key": "muscle", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-75725-y", "title": {"tr": "Uzun COVID ve ME/KYS'deki kas değişimleri 60 günlük yatak istirahatininkine benzemiyor", "en": "Muscle changes in long COVID and ME/CFS differ from those left by 60 days of bed rest"}, "publishedDate": "2026-07-28"}], "date": "2026-07-28"}, {"writer": "sci-03", "title": {"tr": "Yangında binayı kaybettiren şeyin büyük bölümü çitte, saçakta ve menfezde", "en": "Much of what loses a building to fire sits in the fence, the eaves and the vent"}, "excerpt": {"tr": "On iki yıllık denetim raporları kaybın rastgele olmadığını söylüyor. Kuruluğun ve rüzgârın buluştuğu yamaçlarda ahşap çit ile korumasız menfez tekrar tekrar aynı sonucu veriyor; bu, haritadan çok bir iş listesi.", "en": "Twelve years of inspection records say the loss is not random. Where dryness meets wind on a slope, a wooden fence and an unprotected vent produce the same outcome again and again; that is less a map than a work list."}, "sections": [{"h": {"tr": "On iki yılın hasar defteri", "en": "Twelve years of damage"}, "ps": [{"tr": "UC Irvine ekibi, Cal Fire'ın 2013-2024 arasında tuttuğu 100.000 denetim raporunu işledi. Bu raporlar hasar gören ya da tümüyle yıkılan yaklaşık 55.000 binayı kapsıyor ve bunların yüzde 86'sı kır ile kentin iç içe geçtiği kuşakta. Uydu verisi, yangın havası çözümlemeleri ve bina düzeyinde yapısal nitelikler makine öğrenmesiyle birleştirilerek Kaliforniya'nın tamamını 100 metrelik çözünürlükte kaplayan sürekli bir olasılık yüzeyi kuruldu; üç ardışık model kurgusunda doğruluk yüzde 88'e kadar çıktı.", "en": "The UC Irvine team processed 100,000 inspection records kept by Cal Fire between 2013 and 2024. They cover nearly 55,000 buildings damaged or destroyed, 86 per cent of them in the belt where country and city interlock. Satellite data, fire-weather analyses and building-level structural attributes were combined by machine learning into a continuous probability surface covering all of California at 100-metre resolution, with accuracy reaching 88 per cent across three successive model configurations.", "refs": ["wbdri"]}, {"tr": "Öne çıkan etkenler bir zincir oluşturuyor. Düşük çiy noktası sıcaklığı havanın kuruluğunu gösteriyor; yüksek rüzgâr hem alevi hem koru taşıyor; yaklaşık 500 metrelik orta yükseltilerde yamaçlar ve boğazlar rüzgârı kanalize ederek etkiyi çoğaltıyor. Örtü tarafında otlak, çalılık ve meşe ormanı öne çıkıyor. Binanın kendi payı ise ayrı bir kalem: ahşap çit, tutuşabilen kaplama, çıkıntılı saçak ve korumasız menfezler.", "en": "The leading factors form a chain. A low dew-point temperature marks the dryness of the air; high wind carries both flame and ember; at mid elevations of around 500 metres, slopes and canyons channel that wind and multiply its effect. On the vegetation side, grassland, chaparral and oak woodland stand out. The building's own share is a separate entry: wooden fences, flammable siding, protruding eaves and unprotected vents.", "refs": ["wbdri"]}]}, {"h": {"tr": "Elde olan kaldıraç", "en": "The lever in hand"}, "ps": [{"tr": "Bu, geçmiş yangınlara uydurulmuş istatistiksel bir yüzey; belirli bir yangının tahmini değil. Etkenlerin yinelenebilir bir bileşim oluşturması, kaybın kaçınılmaz olmadığı anlamına geliyor: bileşimin bir kısmı hava ve arazi, bir kısmı ise değiştirilebilir yapı ayrıntısı. Yine de aynı doğruluk, modelin binanın nasıl tutuştuğundan çok yangının nereye vardığını öğrenmesinden de kaynaklanabilir; hasarın yüzde 86'sının tek bir kuşakta toplanması, tek başına güçlü bir maruziyet işareti.", "en": "This is a statistical surface fitted to past fires, not a forecast of any particular fire. That the factors form a reproducible combination means the loss is not fated: part of the combination is weather and terrain, part is alterable building detail. Even so, the same accuracy could come from the model learning where fire arrives rather than how a building ignites; 86 per cent of the damage falling inside a single belt is on its own a strong signal of exposure.", "refs": ["wbdri"]}, {"tr": "Kaldıraç, baş yazar Somnath Bar'ın işaret ettiği yerde: yerel yönetimler bina çevresindeki korunma şeridi denetimlerini ve yakıt azaltma yatırımlarını bu yüzeye göre önceliklendirebilir; hane düzeyinde de çit, kaplama, saçak ve menfez sırayla ele alınabilir. Haritanın kendisi hiçbir binayı kurtarmıyor; kurtaran şey uygulanan denetim ve değiştirilen malzeme. Bunun ölçülebilir karşılığı da bellidir: haritayı benimseyen bir ilçede denetimlerin yüksek riskli ızgara karelerine kayıp kaymadığı, önümüzdeki iki yangın mevsimi içinde yayımlanan denetim sayılarından okunabilir.", "en": "The lever sits where lead author Somnath Bar points: local jurisdictions can prioritise defensible-space inspections and fuel-reduction investment against this surface, and households can work through fence, siding, eaves and vents in turn. The map itself saves no building; what saves one is the inspection carried out and the material replaced. The measurable counterpart is plain: whether inspections in a county that adopts the map shift towards the high-risk grid squares can be read from published inspection counts over the next two fire seasons.", "refs": ["wbdri"]}]}], "sources": [{"key": "wbdri", "kind": "news", "name": "University of California, Irvine", "url": "https://news.uci.edu/2026/07/27/uc-irvine-researchers-create-california-wildfire-damage-risk-map/", "title": {"tr": "Kaliforniya genelinde bir model, orman yangınlarında bina kaybını 100 metrelik ızgaraya yerleştiriyor", "en": "A statewide model places California wildfire building loss on a 100-metre grid"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-04", "title": {"tr": "Filmi izlerken altlığın da kıpırdadığını gördüler", "en": "Watching the film, they saw the substrate move too"}, "excerpt": {"tr": "Yüz nanometrelik bir film, 10.000 kat kalın bir altlığı itiyor; altlık geri itiyor ve enerji paylaşılıyor. Bu, aygıtın modelinde adı konmamış bir bileşen olduğu anlamına geliyor.", "en": "A hundred-nanometre film pushes a substrate 10,000 times thicker; the substrate pushes back and energy is shared. That means the device model contains an unnamed component."}, "sections": [{"h": {"tr": "Aygıtın içine bakan yöntem", "en": "The method that looks inside the device"}, "ps": [{"tr": "Yöntemi doktora öğrencisi Elliot Kisiel geliştirdi: elektron mikroskobunun görüntüleme gücüyle X-ışını kırınımının yapı duyarlılığını birleştiren karanlık alan X-ışını mikroskobu. Ölçülen aygıt, yaklaşık 100 nanometre kalınlığındaki bir vanadyum dioksit ince film ve onu taşıyan, yaklaşık 10.000 kat daha kalın bir altlık. Gerilim uygulandığında ekip ikisini aynı anda izleyebildi; alışılmış düzeneklerde yalnızca filme bakılır.", "en": "The method was developed by graduate student Elliot Kisiel: dark-field X-ray microscopy, which joins the imaging power of electron microscopy to the structural sensitivity of X-ray diffraction. The device measured is a vanadium dioxide thin film about 100 nanometres thick and the substrate carrying it, roughly 10,000 times thicker. When voltage was applied the team could watch both at once, where a conventional setup looks only at the film.", "refs": ["substrate"]}, {"tr": "Görülen şey karşılıklı bir mekanik eşleşme: film altlığı itip çekiyor, altlık da filme aynısını yapıyor ve ikisi enerji paylaşıyor. Bir sonucun ağırlığını taşıyan kısım burada tekrarlanabilirlik: ekip aynı ve değiştirilmiş örneklerle dört yıl boyunca, Argonne Ulusal Laboratuvarı'nın sinkrotronunda ve Brookhaven'ın ultrahızlı elektron mikroskobunda sonucu yeniden üretti. Farklı iki cihazda aynı davranışın çıkması, gözlenenin ölçüm düzeneğinin bir yan ürünü olmadığını söyleyen en sağlam kanıt.", "en": "What appears is a bidirectional mechanical coupling: the film pushes and pulls the substrate, the substrate does the same back, and the two share energy. The part that carries the weight of the result is reproducibility: the team reproduced it over four years with identical and modified samples, at Argonne National Laboratory's synchrotron and Brookhaven's ultrafast electron microscope. Getting the same behaviour on two different instruments is the firmest evidence that what was seen is not a by-product of the measuring rig.", "refs": ["substrate"]}]}, {"h": {"tr": "Modelde adı konmamış bileşen", "en": "The unnamed component in the model"}, "ps": [{"tr": "Altlık mekanik enerjiyi depolayıp geri veriyorsa, anahtarlama davranışını tümüyle filme yazan ölçümler paylaşılan bir büyüklüğü tek parçaya yüklemiş oluyor. Doçent Alex Frañó'nun altlıkların edilgen sayılması varsayımının yeniden düşünülmesi gerektiği yönündeki uyarısı tam olarak bunu söylüyor. Ne var ki eşleşme gerçek olup çalışma koşullarında küçük de kalabilir; açıklama altlığın ne kadar enerji aldığına dair bir sayı vermiyor ve o sayı olmadan mevcut modellerin yetersiz kaldığı sonucu çıkarılamaz.", "en": "If the substrate stores mechanical energy and gives it back, then measurements that assign switching behaviour entirely to the film have been loading a shared quantity onto one part. That is exactly what associate professor Alex Frañó's warning about rethinking the assumption of inert substrates says. Yet the coupling may be real and still small under operating conditions; the release gives no figure for how much energy the substrate takes, and without that figure no conclusion follows that existing models are inadequate.", "refs": ["substrate"]}, {"tr": "Kurulmamış olan kısım da açık. Ekibin hedefi, altlığın iki yüzüne işlevsel katmanlar kurup üç boyutlu, daha yoğun bağlantılı nöromorfik yongalara ulaşmak. Bu hedefle bugün elde olan arasında somut bir basamak var: altlığın yalnızca tepki verdiğini göstermek başka şey, altlığın iki aygıt katmanı arasında bir sinyali taşıdığını göstermek başka şey. İkincisi için, aynı koşullarda ölçülmüş bir temel düzenekle karşılaştırılan gecikme ve enerji sayıları taşıyan çalışan bir aygıt gerekiyor; o sayılar yayımlandığında bu bulgunun mühendislik değeri de ölçülebilir hale gelir.", "en": "What remains unbuilt is equally clear. The team's aim is to build functional layers on both faces of a substrate and reach three-dimensional, more densely interconnected neuromorphic chips. Between that aim and what exists today lies a concrete step: showing that the substrate merely responds is one thing, showing that it carries a signal between two device layers is another. The second needs a working device with latency and energy figures compared against a baseline measured under the same conditions; when those figures are published, the engineering value of this finding becomes measurable too.", "refs": ["substrate"]}]}], "sources": [{"key": "substrate", "kind": "news", "name": "University of California San Diego", "url": "https://today.ucsd.edu/story/thin-films-dance-with-substrates", "title": {"tr": "X-ışını mikroskobu, üstündeki filmle birlikte kıpırdayan bir aygıt altlığını görüntüledi", "en": "X-ray microscopy images a device substrate flexing along with the film above it"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-05", "title": {"tr": "Üç omurdan 100.000'de 353'e giden yol", "en": "The road from three vertebrae to 353 per 100,000"}, "excerpt": {"tr": "Pay üç, payda 849. Buradan çıkan sıklık gerçek olabilir; ama bu kadar küçük bir paydada tek bir örneğin eksik ya da fazla sayılması sonucu üçte bir oynatır.", "en": "The numerator is three, the denominator 849. The rate that comes out may be real; but with a denominator this small, one specimen counted differently moves it by a third."}, "sections": [{"h": {"tr": "Sayının kuruluşu", "en": "How the number is built"}, "ps": [{"tr": "Ekip, La Brea Tar Pits Müzesi koleksiyonunda 3.722 Smilodon fatalis omuru inceledi: 849 sakrum, 2.130 bel omuru ve 743 yedinci boyun omuru. Bunların üçünde, üç ayrı bireye ve üç ayrı çukura ait omurlarda, sinir tümörüyle bağdaşan foramen genişlemesi bildirildi. 100.000'de 353'lük sıklık, üçün 849'a bölünmesinden geliyor; sakrum, koleksiyonda en az birey sayısını belirlemek için kullanılan öğe olduğu için payda o.", "en": "The team examined 3,722 Smilodon fatalis vertebrae in the La Brea Tar Pits Museum collection: 849 sacra, 2,130 lumbar vertebrae and 743 seventh cervical vertebrae. In three of them, belonging to three separate individuals from three separate pits, foraminal widening consistent with a nerve tumour was reported. The prevalence of 353 per 100,000 comes from dividing three by 849; the sacrum is the denominator because it is the element used to establish the minimum number of individuals in the collection.", "refs": ["smilodon"]}, {"tr": "İnsanlarda karşılık gelen değer 100.000'de 0,22 ile 0,38 arasında. Oran kabaca bin kat, ama iki sayı aynı cinsten değil. İnsan değeri yaşayan ve tanı konmuş bir topluluktaki görülme sıklığı; fosil değeri ise korunmuş, kazılmış ve kataloglanmış iskelet öğeleri içindeki bir pay. Makale bunu saklamıyor: sıklık tahmininin gerçek hastalık oranından çok tafonomik yanlılığı yansıttığını kendisi yazıyor. Manşetteki bin kat, o cümleyle birlikte okunmadığında sayı olmaktan çıkıp bir izlenime dönüşüyor.", "en": "The comparison figure in humans is 0.22 to 0.38 per 100,000. The ratio is roughly a thousandfold, but the two numbers are not of the same kind. The human figure is an incidence in a living, diagnosed population; the fossil figure is a proportion among skeletal elements that were preserved, excavated and catalogued. The paper does not hide this: it states that the prevalence estimate reflects taphonomic bias rather than a true disease rate. Read without that sentence, the thousandfold stops being a number and becomes an impression.", "refs": ["smilodon"]}]}, {"h": {"tr": "Teşhisin durduğu yer", "en": "Where the diagnosis stops"}, "ps": [{"tr": "Fosillerde yumuşak doku yok, dolayısıyla doku tanısı da yok. Elde olan şey bir tümörün kendisi değil, tümörle bağdaşan bir iskelet işareti: sinirin geçtiği deliğin genişlemesi. Makalenin verdiği karşılaştırma bu işaretin türden türe farklı ağırlık taşıdığını gösteriyor; evcil köpeklerde foramen genişlemesi omurga vakalarında yaygınken kedilerde çok seyrek. Aynı işaretin farklı türlerde farklı anlam taşıması, işaretten hastalık oranına geçerken dikkat gerektiren tam olarak budur.", "en": "Fossils preserve no soft tissue, and so no histological diagnosis. What is in hand is a skeletal marker consistent with a tumour rather than a tumour itself: a widening of the opening through which a nerve passes. The comparison the paper supplies shows that this marker carries different weight from species to species; in domestic dogs foraminal extension is common among spinal cases, while in cats it is very rare. That the same marker means different things in different species is exactly what demands care in the step from marker to disease rate.", "refs": ["smilodon"]}, {"tr": "Makalenin daha az konuşulan tarafı aslında daha güçlü. Aynı koleksiyonda 32 omurda eksik ark gelişimi, 48 kaynaşmış omur ve 226 geçiş omuru sayılmış. Bunlar doğuştan gelen tipte biçim bozuklukları ve aynı paydalara karşı sayılıyorlar; sayıları da üç değil, yüzlerce. Genetik bir hikâyeyi taşıyabilecek bacak burası. Manşete çıkan üç omur ise en zayıf paydayı taşıyan bulgu.", "en": "The less discussed side of the paper is in fact the stronger one. In the same collection, 32 vertebrae with incomplete arch development, 48 fused vertebrae and 226 transitional vertebrae were counted. These are congenital-type malformations counted against the same denominators, and there are hundreds of them rather than three. This is the leg that could carry a genetic story. The three vertebrae in the headline are the finding standing on the weakest denominator.", "refs": ["smilodon"]}]}, {"h": {"tr": "İddianın ne kadarı ayakta", "en": "How much of the claim stands"}, "ps": [{"tr": "Yazarların akrabalı üreme önerisi dikkatli kurulmuş: türün son döneminde varsayılan akrabalı üreme göz önüne alındığında benzer bir mutasyonun katkıda bulunmuş olabileceğini söylüyor, akrabalı üreme düzeyinin eski DNA olmadan ölçülemeyeceğini de ekliyorlar. Buna karşı ciddi bir seçenek var. Zift çukurları rastgele örnekleme yapmaz: acı çeken ve hareketi kısıtlanmış bir hayvanın tuzağa düşme olasılığı daha yüksektir. Bu doğruysa, koleksiyondaki patoloji payı yaşayan topluluğunkinden yüksek çıkar ve genetikte hiçbir şey değişmemiş olabilir. Ekibin, ağrının ve avlanma güçlüğünün hayvanları daha riskli davranışa itmiş olabileceği yorumu, aynı mekanizmayı bu kez örneklem yanlılığı olarak okumayı gerektiriyor.", "en": "The authors' inbreeding suggestion is carefully framed: given the presumed inbreeding late in the species' existence, a similar mutation could have contributed, and they add that the level of inbreeding cannot be measured without ancient DNA. There is a serious alternative to set against it. Tar pits do not sample at random: an animal in pain and restricted in movement is more likely to be trapped. If that holds, the share of pathology in the collection comes out higher than in the living population, and nothing need have changed in the genetics. The team's own reading, that pain and difficulty hunting may have pushed the animals into riskier behaviour, requires the same mechanism to be read this time as a sampling bias.", "refs": ["smilodon"]}, {"tr": "Bunu çözecek iki ölçüm var ve ikisi de erişilebilir. Birincisi, La Brea Smilodon örneklerinden eski DNA çıkarıp homozigotluk bloklarından akrabalı üreme düzeyini tahmin etmek; akrabalı üreme iddiası ancak orada sınanır. İkincisi, aynı biçim bozukluklarının erken ve geç çukurlarda ayrı ayrı sayılması: etkilenen üç örnek kabaca 12.000 ile 28.000 yıl öncesi arasına yayıldığına göre, tükenişe doğru bir artış varsa katmanlar arasında görünmesi gerekir. İki yıl içinde bu iki karşılaştırmadan biri yayımlanırsa iddia ayakta kalır ya da düşer; o zamana kadar elimizdeki şey bir hipotez.", "en": "Two measurements would settle this, and both are reachable. The first is to recover ancient DNA from La Brea Smilodon specimens and estimate the level of inbreeding from runs of homozygosity; the inbreeding claim is testable only there. The second is to count the same malformations separately in early and late pits: since the three affected specimens span roughly 12,000 to 28,000 years, any rise towards extinction should show up between strata. If either comparison is published within two years the claim will stand or fall; until then what we hold is a hypothesis.", "refs": ["smilodon"]}]}], "sources": [{"key": "smilodon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-saber-toothed-cats-spinal-tumors.html", "title": {"tr": "La Brea'dan üç kılıç dişli kedi omuru, omurilik siniri tümörü olarak okunan izler taşıyor", "en": "Three saber-toothed cat vertebrae from La Brea carry marks read as spinal nerve tumours"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "Frontiers in Veterinary Science", "url": "https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1857385/full", "publishedDate": "2026-07-27", "title": {"tr": "Rancho La Brea'dan kılıç dişli kedi Smilodon fatalis'te omurilik siniri tümörüne işaret eden foramen genişlemesi", "en": "Foraminal widening indicating a spinal nerve tumor in the saber-tooth cat Smilodon fatalis from Rancho La Brea"}}}], "date": "2026-07-28"}, {"writer": "sci-06", "title": {"tr": "Çamurda kalan sekiz yürüyüş ve bize benzeyen bir akraba", "en": "Eight walks left in mud, and a relative who looked like us"}, "excerpt": {"tr": "Paranthropus boisei'yi uzun süre 'öteki' kutusunda tuttuk: iri çeneli, tıknaz, bizden başka. Ölçülen izler o kutunun bir kenarını siliyor ve sorulabilecek soruları değiştiriyor.", "en": "We kept Paranthropus boisei in the box marked other: heavy-jawed, stocky, unlike us. The measured prints rub out one side of that box and change the questions we can ask."}, "sections": [{"h": {"tr": "Çamurdaki ölçü", "en": "The measure in the mud"}, "ps": [{"tr": "Turkana Gölü kıyısındaki GaJi10 alanında, yaklaşık 1,43 milyon yıl öncesine tarihlenen 21 ayak izi sekiz bireye ait. Chatham Üniversitesi'nden ve Max Planck Evrimsel Antropoloji Enstitüsü'nden Kevin Hatala'nın yürüttüğü ölçümler, 1,8 metreye varan boya ve 75 kilograma yakın kütleye işaret ediyor. Bu, Homo erectus'un aralığı. İki soyu birbirinden ayırdığımızı sandığımız beden farkı, en azından bu izlerde yok.", "en": "At the GaJi10 site on the shore of Lake Turkana, 21 footprints dated to about 1.43 million years ago belong to eight individuals. The measurements, led by Kevin Hatala of Chatham University and the Max Planck Institute for Evolutionary Anthropology, point to stature up to 1.8 metres and a mass near 75 kilograms. That is the range of Homo erectus. The difference in body size we assumed separated the two lineages is not there, at least not in these prints.", "refs": ["turkana"]}, {"tr": "Bu, anlattığımız hikâyede küçük olmayan bir yer tutuyor. Bir soy bize doğru giden, diğeri iri çeneli ve tıknaz bir çıkmaz sokak diye anlatıldı; boy farkı o anlatının en kolay görselleştirilen parçasıydı. Farkın kalkması diyetteki ya da çenedeki ayrımı ortadan kaldırmıyor. Ortadan kaldırdığı şey, bakınca hemen kurulan bir kısayol. Bu bir yorum; ölçülen şey izlerin boyutları.", "en": "That occupies no small place in the story we tell. One lineage was narrated as heading towards us, the other as a heavy-jawed, stocky dead end, and the difference in height was the most easily pictured part of that account. Removing the difference does not remove the distinction in diet or jaw. What it removes is a shortcut the eye builds instantly. This is an interpretation; what was measured is the dimensions of the prints.", "refs": ["turkana"]}, {"tr": "Makalenin kendisi bu ayrımı koruyor. İzlerin ölçüsü bir ölçüm; sekiz yürüyenin çoğunlukla erişkin erkek olduğu ve dişilerle çocuklar olmadan birlikte yol aldığı okuması ise iz boyutlarından türetilmiş bir çıkarım, iskelet kalıntısına dayanmıyor. Toplumsal yapıya dair her cümle bu ikinci raftan geliyor ve öyle okunması gerekiyor.", "en": "The paper itself keeps that line. The size of the prints is a measurement; the reading that the eight walkers were mostly adult males travelling together without females or children is an inference drawn from print dimensions, not resting on skeletal remains. Every sentence about social structure comes off that second shelf and needs to be read that way.", "refs": ["turkana"]}]}, {"h": {"tr": "Neyi değiştirir, neyi değiştirmez", "en": "What it changes and what it does not"}, "ps": [{"tr": "Sekiz erişkin erkeğin birlikte yürümesi doğruysa, hoşgörü ile eş rekabetinin bir arada bulunduğu bir toplumsal düzen anlamına gelir; bu, kemikten okunamayan bir bilgi. Ama bir iz dizisi bir sabahtır. Tek cinsiyetli bir grup, bir iş için toplanmış olabilir, rastlantısal bir bir araya geliş olabilir, ya da yalnızca o izlerin korunmuş olmasının sonucu olabilir. Kanıtın tuttuğu şey bir tür portresi değil, bir sahne.", "en": "If eight adult males really walked together, it implies a social order in which tolerance and mate competition sit side by side, and that is knowledge no bone yields. But one set of tracks is one morning. A single-sex group may have gathered for a task, may be a chance aggregation, or may simply be the result of which prints survived. What the evidence holds is a scene, not a portrait of a species.", "refs": ["turkana"]}, {"tr": "İlerlemeyi sağlayacak şey de bu yüzden basit. Aynı ölçüm yöntemiyle başka alanlardan ve başka dönemlerden iz dizileri; ve Paranthropus boisei için iskeletten bağımsız olarak yapılan kütle tahminlerinin bu izlerden çıkan aralıkla örtüşüp örtüşmediği. İkisi de yayımlanabilir ve ikisi de tek bir sabahı bir örüntüye çevirebilir ya da çeviremez.", "en": "What would move things forward is therefore simple. Further trackways from other sites and other periods measured the same way; and whether independent skeletal mass estimates for Paranthropus boisei agree with the range these prints give. Both can be published, and both may or may not turn one morning into a pattern.", "refs": ["turkana"]}, {"tr": "Bugün elde olan kazanç, onların toplumunu öğrenmiş olmamız değil. Beden ölçüsüyle çizdiğimiz bir sınırın bir kenarını kaybetmesi ve o akraba hakkında sorabileceğimiz soruların biçim değiştirmesi. Bir buçuk milyon yıl önce bir gölün kıyısında sekiz kişi yürüdü; boyları bizimkine yakındı ve bunu bilmek, onları hangi kutuya koyacağımızı bir kez daha düşündürüyor.", "en": "Today's gain is narrow. A boundary we drew with body size has lost one of its sides, and the questions we can ask about that relative have changed shape. We have not learned their society. A million and a half years ago, eight walkers crossed the shore of a lake; their height was close to ours, and knowing that makes us think again about which box we put them in.", "refs": ["turkana"]}]}], "sources": [{"key": "turkana", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-fossil-footprints-reveal-body-size.html", "title": {"tr": "Kenya'daki ayak izleri Paranthropus boisei'yi Homo erectus'a yakın bir beden ölçüsüne taşıyor", "en": "Kenyan footprints put Paranthropus boisei close to Homo erectus in body size"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-01", "title": {"tr": "Bir sefer, deneyler kadar onarımlarla da ölçülüyor", "en": "An increment is measured in repairs as much as in experiments"}, "excerpt": {"tr": "Soyuz MS-28'in dönüş bülteni iki uzay yürüyüşünü ve bir robot kol onarımını, desteklenen araştırmalarla aynı cümlede sayıyor. Bu sıralama, insanlı bir seferin ne ürettiğine dair en dürüst ölçüyü veriyor.", "en": "The Soyuz MS-28 return bulletin lists two spacewalks and a robotic arm repair in the same breath as the research the crew supported. That ordering gives the honest measure of what a crewed increment produces."}, "sections": [{"h": {"tr": "Kilometre sayacı ne söyler", "en": "What the odometer says"}, "ps": [{"tr": "NASA'nın 26 Temmuz bülteni bir seferin sonunu üç sayıyla özetliyor: 241 gün, Dünya çevresinde 3.856 tur, 102 milyon milden fazla yol. Chris Williams ile Sergey Kud-Sverchkov ve Sergei Mikaev, 27 Kasım 2025'te fırlatıldıkları Soyuz MS-28 aracıyla Kazakistan'da Cezkazgan'ın güneydoğusuna indi.", "en": "NASA's 26 July bulletin sums up the end of an increment in three numbers: 241 days, 3,856 orbits of Earth, more than 102 million miles travelled. Chris Williams, Sergey Kud-Sverchkov and Sergei Mikaev landed southeast of Dzhezkazgan in Kazakhstan aboard the Soyuz MS-28 they launched in on 27 November 2025.", "refs": ["iss"]}, {"tr": "Bu üç sayı birbirinin türevidir. İstasyon yaklaşık 90 dakikada bir tur atar, dolayısıyla 241 gün kaçınılmaz olarak yaklaşık dört bin tur ve yüz milyon mil demektir. Sayaç, yörüngede geçirilen süreyi ölçer. Bir seferi değerlendirmek için sayacın yanındaki satırlara bakmak gerekir.", "en": "Those three numbers are derivatives of one another. The station circles Earth roughly every 90 minutes, so 241 days necessarily means about four thousand orbits and a hundred million miles. The odometer measures time spent in orbit. To judge an increment you have to read the lines beside the counter.", "refs": ["iss"]}]}, {"h": {"tr": "Onarım da bir çıktıdır", "en": "Repair is an output too"}, "ps": [{"tr": "Bültenin astronota ayırdığı satırlarda iki kalem var: güç sistemi yükseltmeleri için iki uzay yürüyüşü ve Canadarm2 robot kolunun onarımı. Canadarm2, istasyona gelen kargo araçlarını yakalayan ve uzay yürüyüşlerinde astronotu taşıyan koldur. Bozulduğunda kaybedilen şey, istasyonun kendi işletim yeteneğinin bir parçasıdır.", "en": "The lines the bulletin gives to the astronaut hold two entries: two spacewalks for power system upgrades, and the repair of the Canadarm2 robotic arm. Canadarm2 is the arm that captures arriving ca
