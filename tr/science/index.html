shes back and energy is shared. That means the device model contains an unnamed component."}, "sections": [{"h": {"tr": "Aygıtın içine bakan yöntem", "en": "The method that looks inside the device"}, "ps": [{"tr": "Yöntemi doktora öğrencisi Elliot Kisiel geliştirdi: elektron mikroskobunun görüntüleme gücüyle X-ışını kırınımının yapı duyarlılığını birleştiren karanlık alan X-ışını mikroskobu. Ölçülen aygıt, yaklaşık 100 nanometre kalınlığındaki bir vanadyum dioksit ince film ve onu taşıyan, yaklaşık 10.000 kat daha kalın bir altlık. Gerilim uygulandığında ekip ikisini aynı anda izleyebildi; alışılmış düzeneklerde yalnızca filme bakılır.", "en": "The method was developed by graduate student Elliot Kisiel: dark-field X-ray microscopy, which joins the imaging power of electron microscopy to the structural sensitivity of X-ray diffraction. The device measured is a vanadium dioxide thin film about 100 nanometres thick and the substrate carrying it, roughly 10,000 times thicker. When voltage was applied the team could watch both at once, where a conventional setup looks only at the film.", "refs": ["substrate"]}, {"tr": "Görülen şey karşılıklı bir mekanik eşleşme: film altlığı itip çekiyor, altlık da filme aynısını yapıyor ve ikisi enerji paylaşıyor. Bir sonucun ağırlığını taşıyan kısım burada tekrarlanabilirlik: ekip aynı ve değiştirilmiş örneklerle dört yıl boyunca, Argonne Ulusal Laboratuvarı'nın sinkrotronunda ve Brookhaven'ın ultrahızlı elektron mikroskobunda sonucu yeniden üretti. Farklı iki cihazda aynı davranışın çıkması, gözlenenin ölçüm düzeneğinin bir yan ürünü olmadığını söyleyen en sağlam kanıt.", "en": "What appears is a bidirectional mechanical coupling: the film pushes and pulls the substrate, the substrate does the same back, and the two share energy. The part that carries the weight of the result is reproducibility: the team reproduced it over four years with identical and modified samples, at Argonne National Laboratory's synchrotron and Brookhaven's ultrafast electron microscope. Getting the same behaviour on two different instruments is the firmest evidence that what was seen is not a by-product of the measuring rig.", "refs": ["substrate"]}]}, {"h": {"tr": "Modelde adı konmamış bileşen", "en": "The unnamed component in the model"}, "ps": [{"tr": "Altlık mekanik enerjiyi depolayıp geri veriyorsa, anahtarlama davranışını tümüyle filme yazan ölçümler paylaşılan bir büyüklüğü tek parçaya yüklemiş oluyor. Doçent Alex Frañó'nun altlıkların edilgen sayılması varsayımının yeniden düşünülmesi gerektiği yönündeki uyarısı tam olarak bunu söylüyor. Ne var ki eşleşme gerçek olup çalışma koşullarında küçük de kalabilir; açıklama altlığın ne kadar enerji aldığına dair bir sayı vermiyor ve o sayı olmadan mevcut modellerin yetersiz kaldığı sonucu çıkarılamaz.", "en": "If the substrate stores mechanical energy and gives it back, then measurements that assign switching behaviour entirely to the film have been loading a shared quantity onto one part. That is exactly what associate professor Alex Frañó's warning about rethinking the assumption of inert substrates says. Yet the coupling may be real and still small under operating conditions; the release gives no figure for how much energy the substrate takes, and without that figure no conclusion follows that existing models are inadequate.", "refs": ["substrate"]}, {"tr": "Kurulmamış olan kısım da açık. Ekibin hedefi, altlığın iki yüzüne işlevsel katmanlar kurup üç boyutlu, daha yoğun bağlantılı nöromorfik yongalara ulaşmak. Bu hedefle bugün elde olan arasında somut bir basamak var: altlığın yalnızca tepki verdiğini göstermek başka şey, altlığın iki aygıt katmanı arasında bir sinyali taşıdığını göstermek başka şey. İkincisi için, aynı koşullarda ölçülmüş bir temel düzenekle karşılaştırılan gecikme ve enerji sayıları taşıyan çalışan bir aygıt gerekiyor; o sayılar yayımlandığında bu bulgunun mühendislik değeri de ölçülebilir hale gelir.", "en": "What remains unbuilt is equally clear. The team's aim is to build functional layers on both faces of a substrate and reach three-dimensional, more densely interconnected neuromorphic chips. Between that aim and what exists today lies a concrete step: showing that the substrate merely responds is one thing, showing that it carries a signal between two device layers is another. The second needs a working device with latency and energy figures compared against a baseline measured under the same conditions; when those figures are published, the engineering value of this finding becomes measurable too.", "refs": ["substrate"]}]}], "sources": [{"key": "substrate", "kind": "news", "name": "University of California San Diego", "url": "https://today.ucsd.edu/story/thin-films-dance-with-substrates", "title": {"tr": "X-ışını mikroskobu, üstündeki filmle birlikte kıpırdayan bir aygıt altlığını görüntüledi", "en": "X-ray microscopy images a device substrate flexing along with the film above it"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-05", "title": {"tr": "Üç omurdan 100.000'de 353'e giden yol", "en": "The road from three vertebrae to 353 per 100,000"}, "excerpt": {"tr": "Pay üç, payda 849. Buradan çıkan sıklık gerçek olabilir; ama bu kadar küçük bir paydada tek bir örneğin eksik ya da fazla sayılması sonucu üçte bir oynatır.", "en": "The numerator is three, the denominator 849. The rate that comes out may be real; but with a denominator this small, one specimen counted differently moves it by a third."}, "sections": [{"h": {"tr": "Sayının kuruluşu", "en": "How the number is built"}, "ps": [{"tr": "Ekip, La Brea Tar Pits Müzesi koleksiyonunda 3.722 Smilodon fatalis omuru inceledi: 849 sakrum, 2.130 bel omuru ve 743 yedinci boyun omuru. Bunların üçünde, üç ayrı bireye ve üç ayrı çukura ait omurlarda, sinir tümörüyle bağdaşan foramen genişlemesi bildirildi. 100.000'de 353'lük sıklık, üçün 849'a bölünmesinden geliyor; sakrum, koleksiyonda en az birey sayısını belirlemek için kullanılan öğe olduğu için payda o.", "en": "The team examined 3,722 Smilodon fatalis vertebrae in the La Brea Tar Pits Museum collection: 849 sacra, 2,130 lumbar vertebrae and 743 seventh cervical vertebrae. In three of them, belonging to three separate individuals from three separate pits, foraminal widening consistent with a nerve tumour was reported. The prevalence of 353 per 100,000 comes from dividing three by 849; the sacrum is the denominator because it is the element used to establish the minimum number of individuals in the collection.", "refs": ["smilodon"]}, {"tr": "İnsanlarda karşılık gelen değer 100.000'de 0,22 ile 0,38 arasında. Oran kabaca bin kat, ama iki sayı aynı cinsten değil. İnsan değeri yaşayan ve tanı konmuş bir topluluktaki görülme sıklığı; fosil değeri ise korunmuş, kazılmış ve kataloglanmış iskelet öğeleri içindeki bir pay. Makale bunu saklamıyor: sıklık tahmininin gerçek hastalık oranından çok tafonomik yanlılığı yansıttığını kendisi yazıyor. Manşetteki bin kat, o cümleyle birlikte okunmadığında sayı olmaktan çıkıp bir izlenime dönüşüyor.", "en": "The comparison figure in humans is 0.22 to 0.38 per 100,000. The ratio is roughly a thousandfold, but the two numbers are not of the same kind. The human figure is an incidence in a living, diagnosed population; the fossil figure is a proportion among skeletal elements that were preserved, excavated and catalogued. The paper does not hide this: it states that the prevalence estimate reflects taphonomic bias rather than a true disease rate. Read without that sentence, the thousandfold stops being a number and becomes an impression.", "refs": ["smilodon"]}]}, {"h": {"tr": "Teşhisin durduğu yer", "en": "Where the diagnosis stops"}, "ps": [{"tr": "Fosillerde yumuşak doku yok, dolayısıyla doku tanısı da yok. Elde olan şey bir tümörün kendisi değil, tümörle bağdaşan bir iskelet işareti: sinirin geçtiği deliğin genişlemesi. Makalenin verdiği karşılaştırma bu işaretin türden türe farklı ağırlık taşıdığını gösteriyor; evcil köpeklerde foramen genişlemesi omurga vakalarında yaygınken kedilerde çok seyrek. Aynı işaretin farklı türlerde farklı anlam taşıması, işaretten hastalık oranına geçerken dikkat gerektiren tam olarak budur.", "en": "Fossils preserve no soft tissue, and so no histological diagnosis. What is in hand is a skeletal marker consistent with a tumour rather than a tumour itself: a widening of the opening through which a nerve passes. The comparison the paper supplies shows that this marker carries different weight from species to species; in domestic dogs foraminal extension is common among spinal cases, while in cats it is very rare. That the same marker means different things in different species is exactly what demands care in the step from marker to disease rate.", "refs": ["smilodon"]}, {"tr": "Makalenin daha az konuşulan tarafı aslında daha güçlü. Aynı koleksiyonda 32 omurda eksik ark gelişimi, 48 kaynaşmış omur ve 226 geçiş omuru sayılmış. Bunlar doğuştan gelen tipte biçim bozuklukları ve aynı paydalara karşı sayılıyorlar; sayıları da üç değil, yüzlerce. Genetik bir hikâyeyi taşıyabilecek bacak burası. Manşete çıkan üç omur ise en zayıf paydayı taşıyan bulgu.", "en": "The less discussed side of the paper is in fact the stronger one. In the same collection, 32 vertebrae with incomplete arch development, 48 fused vertebrae and 226 transitional vertebrae were counted. These are congenital-type malformations counted against the same denominators, and there are hundreds of them rather than three. This is the leg that could carry a genetic story. The three vertebrae in the headline are the finding standing on the weakest denominator.", "refs": ["smilodon"]}]}, {"h": {"tr": "İddianın ne kadarı ayakta", "en": "How much of the claim stands"}, "ps": [{"tr": "Yazarların akrabalı üreme önerisi dikkatli kurulmuş: türün son döneminde varsayılan akrabalı üreme göz önüne alındığında benzer bir mutasyonun katkıda bulunmuş olabileceğini söylüyor, akrabalı üreme düzeyinin eski DNA olmadan ölçülemeyeceğini de ekliyorlar. Buna karşı ciddi bir seçenek var. Zift çukurları rastgele örnekleme yapmaz: acı çeken ve hareketi kısıtlanmış bir hayvanın tuzağa düşme olasılığı daha yüksektir. Bu doğruysa, koleksiyondaki patoloji payı yaşayan topluluğunkinden yüksek çıkar ve genetikte hiçbir şey değişmemiş olabilir. Ekibin, ağrının ve avlanma güçlüğünün hayvanları daha riskli davranışa itmiş olabileceği yorumu, aynı mekanizmayı bu kez örneklem yanlılığı olarak okumayı gerektiriyor.", "en": "The authors' inbreeding suggestion is carefully framed: given the presumed inbreeding late in the species' existence, a similar mutation could have contributed, and they add that the level of inbreeding cannot be measured without ancient DNA. There is a serious alternative to set against it. Tar pits do not sample at random: an animal in pain and restricted in movement is more likely to be trapped. If that holds, the share of pathology in the collection comes out higher than in the living population, and nothing need have changed in the genetics. The team's own reading, that pain and difficulty hunting may have pushed the animals into riskier behaviour, requires the same mechanism to be read this time as a sampling bias.", "refs": ["smilodon"]}, {"tr": "Bunu çözecek iki ölçüm var ve ikisi de erişilebilir. Birincisi, La Brea Smilodon örneklerinden eski DNA çıkarıp homozigotluk bloklarından akrabalı üreme düzeyini tahmin etmek; akrabalı üreme iddiası ancak orada sınanır. İkincisi, aynı biçim bozukluklarının erken ve geç çukurlarda ayrı ayrı sayılması: etkilenen üç örnek kabaca 12.000 ile 28.000 yıl öncesi arasına yayıldığına göre, tükenişe doğru bir artış varsa katmanlar arasında görünmesi gerekir. İki yıl içinde bu iki karşılaştırmadan biri yayımlanırsa iddia ayakta kalır ya da düşer; o zamana kadar elimizdeki şey bir hipotez.", "en": "Two measurements would settle this, and both are reachable. The first is to recover ancient DNA from La Brea Smilodon specimens and estimate the level of inbreeding from runs of homozygosity; the inbreeding claim is testable only there. The second is to count the same malformations separately in early and late pits: since the three affected specimens span roughly 12,000 to 28,000 years, any rise towards extinction should show up between strata. If either comparison is published within two years the claim will stand or fall; until then what we hold is a hypothesis.", "refs": ["smilodon"]}]}], "sources": [{"key": "smilodon", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-saber-toothed-cats-spinal-tumors.html", "title": {"tr": "La Brea'dan üç kılıç dişli kedi omuru, omurilik siniri tümörü olarak okunan izler taşıyor", "en": "Three saber-toothed cat vertebrae from La Brea carry marks read as spinal nerve tumours"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "Frontiers in Veterinary Science", "url": "https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1857385/full", "publishedDate": "2026-07-27", "title": {"tr": "Rancho La Brea'dan kılıç dişli kedi Smilodon fatalis'te omurilik siniri tümörüne işaret eden foramen genişlemesi", "en": "Foraminal widening indicating a spinal nerve tumor in the saber-tooth cat Smilodon fatalis from Rancho La Brea"}}}], "date": "2026-07-28"}, {"writer": "sci-06", "title": {"tr": "Çamurda kalan sekiz yürüyüş ve bize benzeyen bir akraba", "en": "Eight walks left in mud, and a relative who looked like us"}, "excerpt": {"tr": "Paranthropus boisei'yi uzun süre 'öteki' kutusunda tuttuk: iri çeneli, tıknaz, bizden başka. Ölçülen izler o kutunun bir kenarını siliyor ve sorulabilecek soruları değiştiriyor.", "en": "We kept Paranthropus boisei in the box marked other: heavy-jawed, stocky, unlike us. The measured prints rub out one side of that box and change the questions we can ask."}, "sections": [{"h": {"tr": "Çamurdaki ölçü", "en": "The measure in the mud"}, "ps": [{"tr": "Turkana Gölü kıyısındaki GaJi10 alanında, yaklaşık 1,43 milyon yıl öncesine tarihlenen 21 ayak izi sekiz bireye ait. Chatham Üniversitesi'nden ve Max Planck Evrimsel Antropoloji Enstitüsü'nden Kevin Hatala'nın yürüttüğü ölçümler, 1,8 metreye varan boya ve 75 kilograma yakın kütleye işaret ediyor. Bu, Homo erectus'un aralığı. İki soyu birbirinden ayırdığımızı sandığımız beden farkı, en azından bu izlerde yok.", "en": "At the GaJi10 site on the shore of Lake Turkana, 21 footprints dated to about 1.43 million years ago belong to eight individuals. The measurements, led by Kevin Hatala of Chatham University and the Max Planck Institute for Evolutionary Anthropology, point to stature up to 1.8 metres and a mass near 75 kilograms. That is the range of Homo erectus. The difference in body size we assumed separated the two lineages is not there, at least not in these prints.", "refs": ["turkana"]}, {"tr": "Bu, anlattığımız hikâyede küçük olmayan bir yer tutuyor. Bir soy bize doğru giden, diğeri iri çeneli ve tıknaz bir çıkmaz sokak diye anlatıldı; boy farkı o anlatının en kolay görselleştirilen parçasıydı. Farkın kalkması diyetteki ya da çenedeki ayrımı ortadan kaldırmıyor. Ortadan kaldırdığı şey, bakınca hemen kurulan bir kısayol. Bu bir yorum; ölçülen şey izlerin boyutları.", "en": "That occupies no small place in the story we tell. One lineage was narrated as heading towards us, the other as a heavy-jawed, stocky dead end, and the difference in height was the most easily pictured part of that account. Removing the difference does not remove the distinction in diet or jaw. What it removes is a shortcut the eye builds instantly. This is an interpretation; what was measured is the dimensions of the prints.", "refs": ["turkana"]}, {"tr": "Makalenin kendisi bu ayrımı koruyor. İzlerin ölçüsü bir ölçüm; sekiz yürüyenin çoğunlukla erişkin erkek olduğu ve dişilerle çocuklar olmadan birlikte yol aldığı okuması ise iz boyutlarından türetilmiş bir çıkarım, iskelet kalıntısına dayanmıyor. Toplumsal yapıya dair her cümle bu ikinci raftan geliyor ve öyle okunması gerekiyor.", "en": "The paper itself keeps that line. The size of the prints is a measurement; the reading that the eight walkers were mostly adult males travelling together without females or children is an inference drawn from print dimensions, not resting on skeletal remains. Every sentence about social structure comes off that second shelf and needs to be read that way.", "refs": ["turkana"]}]}, {"h": {"tr": "Neyi değiştirir, neyi değiştirmez", "en": "What it changes and what it does not"}, "ps": [{"tr": "Sekiz erişkin erkeğin birlikte yürümesi doğruysa, hoşgörü ile eş rekabetinin bir arada bulunduğu bir toplumsal düzen anlamına gelir; bu, kemikten okunamayan bir bilgi. Ama bir iz dizisi bir sabahtır. Tek cinsiyetli bir grup, bir iş için toplanmış olabilir, rastlantısal bir bir araya geliş olabilir, ya da yalnızca o izlerin korunmuş olmasının sonucu olabilir. Kanıtın tuttuğu şey bir tür portresi değil, bir sahne.", "en": "If eight adult males really walked together, it implies a social order in which tolerance and mate competition sit side by side, and that is knowledge no bone yields. But one set of tracks is one morning. A single-sex group may have gathered for a task, may be a chance aggregation, or may simply be the result of which prints survived. What the evidence holds is a scene, not a portrait of a species.", "refs": ["turkana"]}, {"tr": "İlerlemeyi sağlayacak şey de bu yüzden basit. Aynı ölçüm yöntemiyle başka alanlardan ve başka dönemlerden iz dizileri; ve Paranthropus boisei için iskeletten bağımsız olarak yapılan kütle tahminlerinin bu izlerden çıkan aralıkla örtüşüp örtüşmediği. İkisi de yayımlanabilir ve ikisi de tek bir sabahı bir örüntüye çevirebilir ya da çeviremez.", "en": "What would move things forward is therefore simple. Further trackways from other sites and other periods measured the same way; and whether independent skeletal mass estimates for Paranthropus boisei agree with the range these prints give. Both can be published, and both may or may not turn one morning into a pattern.", "refs": ["turkana"]}, {"tr": "Bugün elde olan kazanç, onların toplumunu öğrenmiş olmamız değil. Beden ölçüsüyle çizdiğimiz bir sınırın bir kenarını kaybetmesi ve o akraba hakkında sorabileceğimiz soruların biçim değiştirmesi. Bir buçuk milyon yıl önce bir gölün kıyısında sekiz kişi yürüdü; boyları bizimkine yakındı ve bunu bilmek, onları hangi kutuya koyacağımızı bir kez daha düşündürüyor.", "en": "Today's gain is narrow. A boundary we drew with body size has lost one of its sides, and the questions we can ask about that relative have changed shape. We have not learned their society. A million and a half years ago, eight walkers crossed the shore of a lake; their height was close to ours, and knowing that makes us think again about which box we put them in.", "refs": ["turkana"]}]}], "sources": [{"key": "turkana", "kind": "news", "name": "Phys.org", "url": "https://phys.org/news/2026-07-fossil-footprints-reveal-body-size.html", "title": {"tr": "Kenya'daki ayak izleri Paranthropus boisei'yi Homo erectus'a yakın bir beden ölçüsüne taşıyor", "en": "Kenyan footprints put Paranthropus boisei close to Homo erectus in body size"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "sci-01", "title": {"tr": "Bir sefer, deneyler kadar onarımlarla da ölçülüyor", "en": "An increment is measured in repairs as much as in experiments"}, "excerpt": {"tr": "Soyuz MS-28'in dönüş bülteni iki uzay yürüyüşünü ve bir robot kol onarımını, desteklenen araştırmalarla aynı cümlede sayıyor. Bu sıralama, insanlı bir seferin ne ürettiğine dair en dürüst ölçüyü veriyor.", "en": "The Soyuz MS-28 return bulletin lists two spacewalks and a robotic arm repair in the same breath as the research the crew supported. That ordering gives the honest measure of what a crewed increment produces."}, "sections": [{"h": {"tr": "Kilometre sayacı ne söyler", "en": "What the odometer says"}, "ps": [{"tr": "NASA'nın 26 Temmuz bülteni bir seferin sonunu üç sayıyla özetliyor: 241 gün, Dünya çevresinde 3.856 tur, 102 milyon milden fazla yol. Chris Williams ile Sergey Kud-Sverchkov ve Sergei Mikaev, 27 Kasım 2025'te fırlatıldıkları Soyuz MS-28 aracıyla Kazakistan'da Cezkazgan'ın güneydoğusuna indi.", "en": "NASA's 26 July bulletin sums up the end of an increment in three numbers: 241 days, 3,856 orbits of Earth, more than 102 million miles travelled. Chris Williams, Sergey Kud-Sverchkov and Sergei Mikaev landed southeast of Dzhezkazgan in Kazakhstan aboard the Soyuz MS-28 they launched in on 27 November 2025.", "refs": ["iss"]}, {"tr": "Bu üç sayı birbirinin türevidir. İstasyon yaklaşık 90 dakikada bir tur atar, dolayısıyla 241 gün kaçınılmaz olarak yaklaşık dört bin tur ve yüz milyon mil demektir. Sayaç, yörüngede geçirilen süreyi ölçer. Bir seferi değerlendirmek için sayacın yanındaki satırlara bakmak gerekir.", "en": "Those three numbers are derivatives of one another. The station circles Earth roughly every 90 minutes, so 241 days necessarily means about four thousand orbits and a hundred million miles. The odometer measures time spent in orbit. To judge an increment you have to read the lines beside the counter.", "refs": ["iss"]}]}, {"h": {"tr": "Onarım da bir çıktıdır", "en": "Repair is an output too"}, "ps": [{"tr": "Bültenin astronota ayırdığı satırlarda iki kalem var: güç sistemi yükseltmeleri için iki uzay yürüyüşü ve Canadarm2 robot kolunun onarımı. Canadarm2, istasyona gelen kargo araçlarını yakalayan ve uzay yürüyüşlerinde astronotu taşıyan koldur. Bozulduğunda kaybedilen şey, istasyonun kendi işletim yeteneğinin bir parçasıdır.", "en": "The lines the bulletin gives to the astronaut hold two entries: two spacewalks for power system upgrades, and the repair of the Canadarm2 robotic arm. Canadarm2 is the arm that captures arriving cargo vehicles and carries astronauts during spacewalks. What is lost when it fails is a piece of the station's own operating capability.", "refs": ["iss"]}, {"tr": "Bakım işini bilimin rakibi saymak kolaydır: mürettebat saati sonludur ve kol onarımına giden saat deney tezgâhına gitmez. Karşısında en az onun kadar güçlü bir okuma duruyor: yörüngede bir donanımı yenileyip yeniden çalışır hale getirmek, ancak insanlı bir sefer varken yapılabilen ve sonraki bütün seferlerin üstüne kurulduğu bir kazanımdır. Hangi okumanın doğru olduğunu tek bir bültenden çıkaramayız; her ikisi de aynı iki satırla uyumludur.", "en": "It is easy to treat maintenance as science's rival: crew hours are finite, and an hour spent on an arm repair is an hour away from a bench. An equally strong reading sits opposite it. Refurbishing hardware in orbit and returning it to service is something only a crewed increment can do, and it is the foundation every later increment is built on. Which reading is right cannot be settled from a single bulletin; both fit the same two lines.", "refs": ["iss"]}]}, {"h": {"tr": "Sonuç nerede aranacak", "en": "Where the results will be found"}, "ps": [{"tr": "Bülten, ekibin desteklediği çalışmalar arasında kanser tedavisi araştırmalarını ve yüksek başarımlı bilgisayarlar ile elektronik bileşenler için uzayda üretim iyileştirmelerini sayıyor. Buradaki fiil dikkat ister: desteklemek, sonuçlandırmaktan farklıdır. Bir sefer bittiğinde örnekler yeni yere inmiştir ve ölçüm, çözümleme ve yayın süreci daha yeni başlar.", "en": "The bulletin lists cancer treatment research and in-space manufacturing improvements for high-performance computers and electronics among the work the crew supported. The verb deserves attention: to support differs from to conclude. When an increment ends, the samples have only just landed, and measurement, analysis and publication are still ahead.", "refs": ["iss"]}, {"tr": "Bu yüzden 241 günün ne getirdiğini bugün söylemek mümkün olmasa da nereye bakılacağı bellidir: bu seferde yürütülen deneylerin yayımlanmış sonuçlarına ve Canadarm2'nin sonraki görevlerde çalışmayı sürdürüp sürdürmediğine. İlki bilgiyi, ikincisi yeniden kullanılabilir yeteneği ölçer. İnsanlı bir seferin defterini bu iki kalem tutar ve kilometre sayacı o defterin yalnızca kapağıdır.", "en": "So while what the 241 days bought cannot be stated today, where to look is clear: the published results of the experiments run during this increment, and whether Canadarm2 keeps working through the missions that follow. The first measures knowledge, the second reusable capability. Those two entries are the ledger of a crewed increment, and the odometer is only its cover.", "refs": ["iss"]}]}], "sources": [{"key": "iss", "kind": "news", "name": "NASA", "url": "https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-crewmates-return-from-space-station/", "title": {"tr": "Soyuz MS-28, Expedition 74 ekibini 241 günün ardından Dünya'ya getirdi", "en": "Soyuz MS-28 brings the Expedition 74 crew home after 241 days"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "sci-02", "title": {"tr": "İnterferonun zamanlama sorununun ardında artık aday bir molekül var", "en": "The timing problem with interferon now has a candidate molecule behind it"}, "excerpt": {"tr": "Farelerde interferon yalnızca enfeksiyon öncesinde koruyor, sonrasında etkisiz kalıp yan etkilerini gösteriyor. Yeni çalışma bu bilinen davranışa bir mekanizma ve onaylı bir ilaçla kurulmuş bir çıkış yolu öneriyor. İkisi de henüz insanda sınanmadı.", "en": "In mice, interferon protects only before infection, and afterwards stops working while showing its adverse side. A new study offers a mechanism for that familiar behaviour and a way out built on an approved drug. Neither has yet been tested in people."}, "sections": [{"h": {"tr": "Tanıdık bir başarısızlık", "en": "A familiar failure"}, "ps": [{"tr": "Birinci tip interferonlar klinik öncesi çalışmalarda güçlü antiviral etki gösterir, klinikte ise dar bir tedavi aralığı, yetersiz etkinlik ve ağır yan etkilerle karşılaşır. Wuhan Üniversitesi ve Hubei Tıp Üniversitesi ekibinin çalışması bu boşluğu keskin bir ifadeye indiriyor: interferonlar yalnızca enfeksiyon öncesinde verildiğinde koruyor ve enfeksiyon yerleştikten sonra etkisiz kalırken yan etkileri belirginleşiyor.", "en": "Type I interferons show strong antiviral activity in preclinical work, then meet a narrow therapeutic window, suboptimal activity and severe adverse events in the clinic. Work from Wuhan University and Hubei University of Medicine reduces that gap to a sharp statement: interferons protect only when given before infection, and once infection is established they are ineffective while their adverse effects become prominent.", "refs": ["ifn"]}, {"tr": "Bu, bir ilacın işe yaramadığı iddiası yerine ne zaman işe yaradığına dair bir iddiadır. Klinikte önemi büyüktür, çünkü hastalar hekime enfeksiyon öncesinde değil belirtiler başladıktan sonra gelir. Bir tedavinin yararı, uygulanabildiği zaman aralığında yararlı olmasına bağlıdır.", "en": "That is a claim about when a drug works rather than a claim that it does not. It matters clinically, because patients arrive after symptoms begin, not before infection. A treatment's benefit depends on it being useful in the window when it can actually be given.", "refs": ["ifn"]}]}, {"h": {"tr": "Önerilen aracı", "en": "The proposed intermediary"}, "ps": [{"tr": "Ekip, aradaki aracı olarak konağın kendi ürettiği laktik asidi gösteriyor. Önerilen mekanizmada laktik asit bir zar alıcısı üzerinden SIRT1 düzeyini yükselterek interferon etkinliğini baskılıyor; aynı zamanda interferonla birlikte NF-κB'yi aşırı etkinleştirerek sitokin fırtınası başlatıyor. Yazarlar bunu, antiviral başarısızlığın iltihabı büyüttüğü ve büyüyen iltihabın başarısızlığı pekiştirdiği bir geri besleme döngüsü olarak tarif ediyor.", "en": "The team names host-derived lactic acid as the intermediary. In the proposed mechanism lactic acid raises SIRT1 through a membrane receptor and so suppresses interferon activity, while at the same time combining with interferon to hyperactivate NF-κB and set off a cytokine storm. The authors describe this as a feedback loop in which antiviral failure amplifies inflammation and the growing inflammation entrenches the failure.", "refs": ["ifn"]}, {"tr": "Bu mekanizmanın çekiciliği, iki ayrı klinik sorunu -etkisizlik ve yan etki- tek bir moleküle bağlamasıdır. Aynı çekicilik dikkatli olmayı gerektirir. Laktik asit yerleşmiş enfeksiyonda zaten yükselir; yüksek laktat, doku hasarının ve ağır seyreden hastalığın ortak bir belirtecidir. Bu durumda laktik asidin interferonu bozan etken mi, yoksa interferonun işe yaramadığı ağır tabloyu gösteren bir işaret mi olduğu ayırt edilmelidir. Çalışmanın laktat dehidrogenazı baskılayıp sonucu değiştirmesi bu ayrımı hayvan modelinde destekler ve insanda aynı ayrımın geçerli olduğunu göstermez.", "en": "The appeal of this mechanism is that it ties two separate clinical problems, ineffectiveness and adverse effects, to a single molecule. That same appeal calls for care. Lactic acid is already elevated in established infection; high lactate is a common marker of tissue damage and severe disease. So it must be distinguished whether lactic acid is the agent disrupting interferon or a sign of the severe picture in which interferon fails anyway. That the study suppressed lactate dehydrogenase and changed the outcome supports the first reading in the animal model, and does not show that the same distinction holds in people.", "refs": ["ifn"]}]}, {"h": {"tr": "Onaylı ilaç neyi kısaltır", "en": "What an approved drug shortens"}, "ps": [{"tr": "Ekibin önerdiği tedavi, interferonu ABD Gıda ve İlaç Dairesi onaylı bir laktat dehidrogenaz baskılayıcısıyla birleştiriyor. Bildirilen sonuçlara göre bu birleşim baskılanmayı tersine çevirdi, iltihabı azalttı ve geç evre enfeksiyonlarda da etkisini korudu. Onaylı bir molekülle çalışmak güvenlik ve üretim tarafında zaman kazandırır, çünkü doz aralığı, yan etki profili ve üretim yolu zaten bilinir.", "en": "The therapy the team proposes pairs interferon with a lactate dehydrogenase inhibitor approved by the US Food and Drug Administration. On the reported results the combination reversed the suppression, reduced inflammation and retained efficacy in late-stage infection. Working with an approved molecule saves time on the safety and manufacturing side, because dose range, adverse-effect profile and production route are already known.", "refs": ["ifn"]}, {"tr": "Kısaltmadığı basamak ise etkinliktir. Onay, molekülün onaylandığı hastalık için işe yaradığını söyler ve yeni bir endikasyonda yararlı olacağını göstermez. Bu tedavinin insanda anlamlı olması için gereken kanıt, karşılaştırma kolu bulunan ve önceden ilan edilmiş bir sonlanım noktasına -hastaneye yatış, oksijen ihtiyacı, ölüm- bakan bir çalışmadır. Ters yönlü bir risk de vardır: laktat üretimini baskılamak bağışıklık hücrelerinin enerji dengesine dokunur, bu yüzden yarar ile zararın birlikte ölçülmesi gerekir. Bugün elimizde olan, hücrelerde ve farelerde tutarlı bir mekanizma ile sınanabilir bir hipotezdir. Hasta için anlamı, o çalışma yapıldığında ortaya çıkacaktır.", "en": "What it does not shorten is efficacy. Approval says a molecule works for the disease it was approved in, and does not show it will help in a new indication. The evidence needed for this therapy to mean anything in people is a study with a comparison arm and a prespecified endpoint such as hospital admission, oxygen requirement or death. There is a risk running the other way as well: suppressing lactate production touches the energy balance of immune cells, so benefit and harm have to be measured together. What we have today is a mechanism that holds together in cells and mice, and a testable hypothesis. Its meaning for a patient will emerge when that study is done.", "refs": ["ifn"]}]}], "sources": [{"key": "ifn", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76000-w", "title": {"tr": "İnterferon enfeksiyon yerleştikten sonra etkisiz kalıyor; çalışma sorumlu olarak laktik asidi gösteriyor", "en": "Interferon stops working once infection is established, and a study points to lactic acid"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-03", "title": {"tr": "Yaşlı bir ormanın üstündeki sıcaklığı düşüremezsiniz, otlama baskısını düşürebilirsiniz", "en": "You cannot lower the temperature over an old forest, but you can lower the browsing pressure"}, "excerpt": {"tr": "New Zealand Journal of Ecology'de yayımlanan bir forum makalesi, yerli ormanlarda geyik sayısı için ulusal bir strateji istiyor. Çağrının gücü, iki baskıdan yalnızca birinin bu on yıl içinde elimizde olmasından geliyor.", "en": "A forum article in the New Zealand Journal of Ecology calls for a national strategy on deer numbers in native forest. The force of the call comes from only one of the two pressures being within reach this decade."}, "sections": [{"h": {"tr": "İki baskı, tek kol", "en": "Two pressures, one lever"}, "ps": [{"tr": "Canterbury Üniversitesi'nden David Norton ile Manaaki Whenua - Landcare Research'ten Peter Bellingham ve Sarah Richardson, New Zealand Journal of Ecology'de yayımlanan forum makalesinde yerli ormanlardaki geyik sayılarının sürdürülemez düzeye çıktığını savunuyor. Makalenin merkezindeki gözlem tek bir baskıya değil iki baskının birleşimine dair: geyikler ve iklim değişikliği birlikte, ayrı ayrı olduklarından büyük olasılıkla daha ağır bir etki yaratıyor.", "en": "In a forum article in the New Zealand Journal of Ecology, David Norton of the University of Canterbury with Peter Bellingham and Sarah Richardson of Manaaki Whenua - Landcare Research argue that deer numbers in native forest have risen to unsustainable levels. The observation at the centre of the article concerns the combination of two pressures rather than a single one: deer and climate change together are likely to hit harder than either does alone.", "refs": ["deer"]}, {"tr": "Bir sistemde iki baskı birleşiyorsa ve bunlardan yalnızca biri kısa vadede yönetilebiliyorsa, yönetilebilen kol beklenenden değerli hale gelir. Yerli ormanların üzerindeki sıcaklık ve yağış rejimini bu on yıl içinde değiştirmek mümkün değildir; ülkenin kendi sera gazı kesintileri bile o ormanların üstündeki havayı bu zaman ölçeğinde döndürmez. Otlama baskısı ise yerel bir karar konusudur. Makalenin savunduğu şey tam olarak budur: iklimin etkisi doğrudan azaltılamıyorsa, ormanın o etkiye karşı kırılganlığı azaltılabilir.", "en": "When two pressures combine in a system and only one of them can be managed in the short term, the manageable lever becomes worth more than it looks. The temperature and rainfall regime over native forest cannot be changed this decade; even the country's own emissions cuts will not turn the air above those forests on that timescale. Browsing pressure, by contrast, is a matter of local decision. That is precisely the article's argument: if the effect of climate cannot be reduced directly, the forest's vulnerability to it can.", "refs": ["deer"]}]}, {"h": {"tr": "Geleceğin ormanı nerede kayboluyor", "en": "Where the future forest disappears"}, "ps": [{"tr": "Yazarların anlattığı zincir alt katmandan başlıyor. Geyikler hem yaşlı hem yenilenen ormanlarda otluyor, orman tabanındaki toprağı ve döküntüyü etkiliyor; bu da orman altı bitki örtüsünü ve zamanla taç katmanının bileşimini değiştiriyor, hayvanlar için yaşam alanı niteliğini düşürüyor. Heyelan gibi bozulmuş alanlarda otlama gençleşmeyi geciktiriyor ve bunun karşılığı suyu tutma kapasitesinin azalması ile tortu kaybının artması oluyor. Norton'un RNZ'ye söylediği gibi asıl kaygı, 20-30 metrelik taç katmanının altında yetişen gençlikte.", "en": "The chain the authors describe starts in the understorey. Deer browse in both old-growth and regenerating forest and affect the soil and litter on the forest floor, which changes the understorey vegetation and eventually canopy composition, and lowers habitat quality for fauna. On disturbed ground such as landslides, browsing retards regeneration, and the price of that is reduced water retention and increased sediment loss. As Norton told RNZ, the real concern is the young growth coming up beneath a canopy 20 to 30 metres high.", "refs": ["deer"]}, {"tr": "Bu zincirin en zor yanı görünürlüğüdür. Taç katmanı onlarca yıl ayakta kalır, dolayısıyla yukarıdan bakıldığında orman yerinde durur; kaybolan şey bugünün ağaçları yerine yarınki taç katmanını oluşturacak fidanlardır. Aynı zamanda bu, ormanın karbon deposu ve havzanın su düzenleyicisi olma işlevine de dokunur, çünkü her iki işlev de yenilenmenin sürmesine bağlıdır. Bir ormanı seyretmek onun sağlıklı olduğunu göstermez; sağlığı, altında ne yetiştiğiyle ölçülür.", "en": "The hardest part of that chain is its visibility. A canopy stands for decades, so from above the forest looks intact; what disappears is the saplings that would become tomorrow's canopy rather than today's trees. It also touches the forest's role as a carbon store and as the water regulator of its catchment, because both functions depend on regeneration continuing. Looking at a forest does not tell you it is healthy; its health is measured by what grows underneath.", "refs": ["deer"]}]}, {"h": {"tr": "Kolun bedeli", "en": "The price of the lever"}, "ps": [{"tr": "Forum makalesi, dergilerde özgün ölçüm sunan araştırma makalesinden ayrı bir türdür: yayımlanmış bulguları bir araya getirip tartışmaya açar. Bu, çağrının ağırlığını azaltmaz ama niteliğini belirler. Yazarların istediği şey yeni bir ölçüm yerine ulusal ölçekte bir yönetim kararıdır ve böyle bir karar bedelsiz değildir: sürekli finansman, avlanma ve erişim düzenlemeleri, geyiği bir kaynak olarak gören topluluklarla anlaşma ve ormanın Māori ile Pākehā için taşıdığı değerlerin gözetilmesi gerekir.", "en": "A forum article is a distinct format from a research paper presenting original measurements: it brings published findings together and opens them to argument. That does not lessen the weight of the call, but it defines its nature. What the authors want is a management decision at national scale rather than a new measurement, and such a decision is not free: it needs sustained funding, hunting and access rules, agreement with communities that see deer as a resource, and attention to what the forest means to Māori and Pākehā alike.", "refs": ["deer"]}, {"tr": "Böyle bir stratejinin işleyip işlemediğini anlamak için bakılacak sayı, öldürülen geyik sayısı olmayacak. Bakılacak olan, ormanın altındaki gençliktir: bozulmuş alanlarda fidanların taç katmanına doğru yükselip yükselmediği ve orman altı bitki örtüsünün bileşiminin toparlanıp toparlanmadığı. Uzun süredir yürütülen orman ölçüm ağları bu soruyu yanıtlayabilecek türden verinin toplandığı yerdir. Otlama baskısı düşerse yanıt orada görünecek; düşmezse taç katmanı bir süre daha yerinde durmayı sürdürecek ve altındaki eksilme sessizce büyüyecek.", "en": "The number to watch, if such a strategy is to be judged, will not be how many deer are killed. It will be the young growth beneath the forest: whether saplings on disturbed ground are climbing toward the canopy and whether the composition of the understorey is recovering. Long-running forest measurement networks are where data capable of answering that question is gathered. If browsing pressure falls, the answer will show up there; if it does not, the canopy will stand a while longer and the loss beneath it will quietly grow.", "refs": ["deer"]}]}], "sources": [{"key": "deer", "kind": "news", "name": "RNZ", "url": "https://www.rnz.co.nz/news/environment/805275/rising-deer-numbers-drive-decline-in-native-forests-research", "title": {"tr": "Yeni Zelanda'da ekologlar, geyik sayıları için ulusal bir yönetim stratejisi çağrısı yapıyor", "en": "New Zealand ecologists call for a national management strategy for deer numbers"}, "publishedDate": "2026-07-27", "primary": {"kind": "paper", "name": "New Zealand Journal of Ecology", "url": "https://newzealandecology.org/nzje/3639", "publishedDate": "2026-07-27", "title": {"tr": "Deer in the headlights: sleepwalking our way to a native forest catastrophe", "en": "Deer in the headlights: sleepwalking our way to a native forest catastrophe"}}}], "date": "2026-07-27"}, {"writer": "sci-04", "title": {"tr": "Nikel karbon monoksiti üretiyor, bakır birleştirmeyi yapıyor", "en": "Nickel makes the carbon monoxide, copper does the joining"}, "excerpt": {"tr": "Asetamidi karbondioksit ve nitrattan üretmenin önündeki engel, iki bağın aynı yüzeyde yarışmasıydı. Hefei ekibinin çözümü katalizörü daha etkin kılmak yerine işi iki komşu bölgeye bölmek.", "en": "The obstacle to making acetamide from carbon dioxide and nitrate was two bonds competing on one surface. The Hefei team's answer splits the job between two neighbouring sites instead of making the catalyst more active."}, "sections": [{"h": {"tr": "Aynı yüzeyde iki iş", "en": "Two jobs on one surface"}, "ps": [{"tr": "Amit üretmek için iki farklı bağ kurulmalıdır: karbon-karbon ve karbon-azot. Tek tür etkin bölgeye sahip bir katalizörde bu iki iş aynı yüzey için yarışır ve yüzey hangisine daha elverişliyse ürün o yöne kayar. Yazarların bildirdiği güçlük tam olarak budur: küçük ve bol moleküllerden amit elektrosentezinin önünde duran şey, karbon-karbon ile karbon-azot bağ oluşumunun kinetik rekabetidir.", "en": "Making an amide requires forming two different bonds: carbon-carbon and carbon-nitrogen. On a catalyst with a single kind of active site those two jobs compete for the same surface, and the product drifts toward whichever the surface favours. That is exactly the difficulty the authors report: what stands in the way of electrosynthesising amides from small, abundant molecules is the kinetic competition between carbon-carbon and carbon-nitrogen bond formation.", "refs": ["ace"]}, {"tr": "Böyle bir rekabette katalizörü genel olarak daha etkin kılmak işe yaramaz, çünkü etkinlik artışı her iki yola da dağılır. İşe yarayan yaklaşım, yolların birbirinden ayrılmasıdır: her adımı ona uygun bir bölgede yaptırmak ve ara ürünleri buluşturmak. Sorun o zaman kimya sorunundan yerleşim sorununa dönüşür.", "en": "Making the catalyst generally more active does not help in that kind of competition, because the gain in activity spreads across both routes. The approach that works separates the routes: run each step on a site suited to it and then bring the intermediates together. The problem turns from a chemistry problem into a placement problem.", "refs": ["ace"]}]}, {"h": {"tr": "İş bölümünün planı", "en": "The plan of the division"}, "ps": [{"tr": "Hefei Teknoloji Üniversitesi ve Jinan Üniversitesi ekibinin kurduğu düzenek, azot katkılı karbon üzerine tek atom nikel ile bakır nanokümelerini yan yana yerleştiriyor. Nikel bölgeleri karbondioksiti seçici biçimde karbon monoksite çeviriyor. Komşu bakır nanokümeleri iki iş birden yapıyor: karbon-karbon eşleşmesiyle *CCO ara ürününü oluşturuyor ve nitratı indirgeyerek *NH2 ara ürününü veriyor. Karbon-azot bağı, bu iki ara ürünün birbirine yakın üretilmesi sayesinde kuruluyor.", "en": "The arrangement built by the team from Hefei University of Technology and Jinan University places single nickel atoms next to copper nanoclusters on nitrogen-doped carbon. The nickel sites selectively convert carbon dioxide to carbon monoxide. The neighbouring copper nanoclusters do two jobs at once: they couple carbon to carbon to form the *CCO intermediate, and they reduce nitrate to form the *NH2 intermediate. The carbon-nitrogen bond forms because those two intermediates are made close to each other.", "refs": ["ace"]}, {"tr": "Bu tasarımda taşıyıcı da bir bileşendir. Azot katkılı karbon, tek nikel atomlarını kümeleşmeden tutan yüzeydir ve yazarların bildirdiği güçlü nikel-bakır elektronik eşleşmesi de iki bölgenin bu kadar yakın durabilmesine bağlıdır. Yerinde spektroskopi ve hesaplamalar, bu eşleşmenin *CO ikileşmesi ve *CCO-*NH2 birleşmesi gibi kritik adımların etkinleşme engelini düşürdüğüne işaret ediyor. Kazanç, yeni bir metal yerine iki bilinen metalin arasındaki mesafeden geliyor.", "en": "In this design the support is a component too. The nitrogen-doped carbon is the surface that keeps single nickel atoms from clustering, and the strong nickel-copper electronic coupling the authors report depends on the two sites being able to sit that close. In situ spectroscopy and calculations indicate that this coupling lowers the activation barriers for critical steps such as *CO dimerisation and *CCO-*NH2 coupling. The gain comes from the distance between two familiar metals rather than from a new one.", "refs": ["ace"]}]}, {"h": {"tr": "Sayılar neyi kanıtlar", "en": "What the numbers establish"}, "ps": [{"tr": "Bildirilen başarım iki sayıyı birlikte veriyor: santimetrekare başına 215,7 miliamperlik akım yoğunluğunda, gram katalizör başına saatte 257,3 milimol asetamit. Bu ikisinin birlikte verilmesi önemlidir, çünkü elektrokataliz sonuçları çoğu zaman düşük akımda ölçülür ve akım yükseldiğinde seçicilik düşer. Buradaki akım yoğunluğu, endüstriyel elektrolizörlerin çalıştığı aralıktadır. Üçüncü sayı 160 saatlik kararlı çalışmadır ve tek atomlu katalizörlerde asıl yıpranma mekanizması atomların yüzeyde göç edip kümeleşmesi olduğu için bu süre anlamlıdır.", "en": "The reported performance gives two numbers together: 257,3 millimoles of acetamide per hour per gram of catalyst at a current density of 215,7 milliamps per square centimetre. Giving both matters, because electrocatalysis results are often measured at low current and selectivity falls as current rises. The current density here sits in the range industrial electrolysers work at. The third number is 160 hours of stable operation, and that duration is meaningful because the main wear mechanism in single-atom catalysts is atoms migrating across the surface and clustering.", "refs": ["ace"]}, {"tr": "Bu sayıların kanıtladığı şey, tarif edilen yerleşimin çalıştığıdır. Bir üretim yolunun kurulduğunu ise kanıtlamazlar: gram başına verim, elektrot alanı başına verime çevrildiğinde katalizör yüklemesine bağlıdır; asetamidin seyreltik elektrolitten ayrılması ayrı bir işlem basamağıdır; nitratın nereden geleceği ayrı bir sorudur. Bunlar sıradaki basamaklardır. Burada kurulan şey bir tesis yerine bir tasarım kuralıdır: karmaşık bir elektrokimyasal tepkimede ara ürünleri hangi bölgede üreteceğinizi seçebiliyorsanız, hangi ürünü alacağınızı da seçebiliyorsunuz.", "en": "What those numbers establish is that the described arrangement works. They do not establish that a production route has been built: yield per gram, converted to yield per electrode area, depends on catalyst loading; separating acetamide from a dilute electrolyte is a further process step; and where the nitrate would come from is a separate question. Those are the steps that come next. What has been built here is a design rule rather than a plant: if you can choose which site makes which intermediate in a complex electrochemical reaction, you can choose which product you get.", "refs": ["ace"]}]}], "sources": [{"key": "ace", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76064-8", "title": {"tr": "Çift bölgeli katalizör, asetamidi doğrudan karbondioksit ve nitrattan üretiyor", "en": "A dual-site catalyst makes acetamide directly from carbon dioxide and nitrate"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-05", "title": {"tr": "Mutant bakteri bağırsağa yerleşti ve tümörü baskılayamadı", "en": "The mutant bacterium colonised the gut and failed to suppress the tumour"}, "excerpt": {"tr": "Obezite, bağırsak bakterileri ve kolorektal kanseri birbirine bağlayan çalışmalarda asıl güçlük, bakterinin mi yoksa ürettiği molekülün mü iş gördüğünü ayırmaktır. Bu çalışmada o ayrımı yapan tek bir denetim var.", "en": "In studies linking obesity, gut bacteria and colorectal cancer the hard part is separating the bacterium from the molecule it makes. In this study one control does that separating."}, "sections": [{"h": {"tr": "İlişki nerede kuruluyor", "en": "Where the association is made"}, "ps": [{"tr": "Nature Communications'ta yayımlanan çalışma iki ayrı kanıt türünü bir arada sunuyor. İnsan tarafında obeziteyle ilişkili kolorektal kanserde dışkı GABA'sının ve TPI1 anlatımının düşük olduğu görülüyor. Hayvan tarafında yüksek yağlı beslenme ve hastalardan aktarılan dışkı mikrobiyotası, GABA üreten Bacteroides ovatus bakterisini azaltıyor ve tümör oluşumu hızlanıyor.", "en": "The study published in Nature Communications presents two kinds of evidence together. On the human side, obesity-associated colorectal cancer shows lower faecal GABA and reduced TPI1 expression. On the animal side, a high-fat diet and faecal microbiota transferred from patients deplete the GABA-producing bacterium Bacteroides ovatus, and tumour formation speeds up.", "refs": ["gaba"]}, {"tr": "İnsan tarafındaki bulgu bir ilişkidir ve tek başına yönü belirlemez. Obezitede bağırsak florası pek çok yönden değişir; kolorektal kanserin kendisi de bağırsak içeriğini değiştirir. Düşük GABA'nın tümörü hızlandırdığı da, tümörün ve ona eşlik eden beslenme örüntüsünün GABA'yı düşürdüğü de aynı gözlemle uyumludur. Yönü belirleyecek olan, insan örneklerinin sayısı yerine hayvan tarafındaki deney tasarımıdır.", "en": "The human finding is an association and does not by itself fix the direction. In obesity the gut flora changes in many ways, and colorectal cancer itself alters gut contents. Low GABA accelerating the tumour and the tumour with its accompanying diet lowering GABA are both consistent with the same observation. What fixes the direction is the experimental design on the animal side rather than the number of human samples.", "refs": ["gaba"]}]}, {"h": {"tr": "Farkı yaratan denetim", "en": "The control that makes the difference"}, "ps": [{"tr": "Bir bakteriyi bağırsaktan çıkarıp tümörün hızlandığını görmek, sorumluyu göstermeye yetmez: bakteri yalnızca GABA üretmez, aynı zamanda yer kaplar, başka maddeler salgılar ve komşu türlerin dengesini değiştirir. Çalışmadaki kritik denetim bu belirsizliği kaldırıyor. GABA üretemeyen bir Bacteroides ovatus mutantı bağırsağa normal yerleşiyor, yani bakteriyle gelen her şey yerinde duruyor, ancak tümörü baskılayamıyor. Değişen tek şey moleküldür.", "en": "Removing a bacterium from the gut and watching the tumour accelerate does not identify the culprit: the bacterium does more than make GABA, it also occupies space, secretes other substances and shifts the balance of neighbouring species. The critical control in this study removes that ambiguity. A Bacteroides ovatus mutant unable to make GABA colonises the gut normally, so everything the bacterium brings with it stays in place, yet it fails to suppress the tumour. The one thing that changed is the molecule.", "refs": ["gaba"]}]}, {"h": {"tr": "Zincirin kalanı ve sınırı", "en": "The rest of the chain, and its limit"}, "ps": [{"tr": "Aynı yönde ikinci bir kanıt daha var: ağızdan GABA verilmesi ya da yabanıl tip bakterinin yeniden yerleştirilmesi tümör yükünü belirgin biçimde düşürüyor. Kaldırma ve geri koyma denemelerinin birlikte sonuç vermesi, tek yönlü bir gözlemden daha güçlü bir kanıttır. Mekanizma tarafında da zincir tek tek kurulmuş: GABA-B alıcısı, PI3K-HIF1α üzerinden TPI1, oradan PPP1CA'nın baskılanması ve YAP'ın fosforlu kalması.", "en": "A second line of evidence points the same way: oral GABA or recolonisation with the wild-type bacterium markedly reduces tumour burden. Removal and replacement experiments agreeing is stronger evidence than a one-directional observation. On the mechanism side the chain is built step by step as well: the GABA-B receptor, then TPI1 through PI3K-HIF1α, then inhibition of PPP1CA and YAP staying phosphorylated.", "refs": ["gaba"]}, {"tr": "Bu tasarımın gücü, sınırının nerede olduğunu da belirler. Nedensellik farelerde ve hücrelerde kurulmuştur; insanda kurulan şey ilişkidir. GABA'nın insanda tümörü yavaşlatıp yavaşlatmadığı, farede işleyen zincirin insanda da aynı biçimde işleyip işlemediğine bağlıdır ve bu ayrı bir sorudur. Ayrıca makale, dergide erken erişim için düzenlenmemiş kabul metni olarak yayımlandı; hakem sürecinden geçmiş olsa da son biçimini almış değil. Yine de burada ölçülmesi gereken şey sonucun çarpıcılığı yerine tasarımın kendi sınırını koruyup korumadığıdır ve bu çalışma korumuştur.", "en": "The strength of that design also marks where it stops. Causation is established in mice and cells; what is established in people is association. Whether GABA slows tumours in people depends on the chain that works in mice working the same way in humans, and that is a separate question. The paper also appears as an unedited accepted manuscript released for early access, so while it has been through review it is not in final form. Even so, what should be measured here is whether the design stayed inside its own limit rather than how striking the result is, and this study stayed inside it.", "refs": ["gaba"]}]}], "sources": [{"key": "gaba", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76079-1", "title": {"tr": "GABA üreten bağırsak bakterisinin azalması, farelerde bağırsak tümörünü hızlandırdı", "en": "Loss of a GABA-making gut bacterium accelerated bowel tumours in mice"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}, {"writer": "sci-06", "title": {"tr": "Hücre ile çevresi arasındaki konuşmayı sabitlemeye çalışan bir jel", "en": "A gel that tries to steady the conversation between a cell and its surroundings"}, "excerpt": {"tr": "Onarım malzemeleri uzun süre tek bir soruyla tasarlandı: ne kadar sert olmalı? Xi'an ekibinin jeli başka bir şeyi hedefliyor, sertliğin zaman içinde kaymasını engellemeyi.", "en": "Repair materials were long designed around one question: how stiff should this be? The gel from the Xi'an team aims at something else, stopping stiffness from drifting over time."}, "sections": [{"h": {"tr": "Hedefin yer değiştirmesi", "en": "A target moves"}, "ps": [{"tr": "Bir hücre, çevresindeki matrisin mekanik özelliklerini okur ve buna göre davranır: bölünür, farklılaşır, mineral biriktirir. Doku mühendisliğinin uzun süredir sorduğu soru bu okumanın hedef değeriydi. Xi'an Jiaotong Üniversitesi ekibinin çalışması soruyu değiştiriyor. Canlı doku matrisi sürekli yeniden biçimlendirir; süregelen glikasyon, yani şekerlerin proteinlere bağlanması, bu kaymayı büyütür ve hücreye ulaşan işaretleri istikrarsızlaştırır. Ekibin ViscoClamp adını verdiği hidrojel, doğru sertliği kurmak yerine sertliğin kaymasını sınırlamayı hedefliyor.", "en": "A cell reads the mechanical properties of the matrix around it and behaves accordingly: it divides, differentiates, lays down mineral. The question tissue engineering has long asked was what value that reading should target. The work from Xi'an Jiaotong University changes the question. Living tissue continually remodels its matrix, and chronic glycation, the binding of sugars to proteins, amplifies the drift and destabilises the cues reaching the cell. The hydrogel the team calls ViscoClamp aims at limiting how far stiffness drifts instead of establishing the right stiffness.", "refs": ["gel"]}, {"tr": "Bu, küçük görünen ama derin bir kayma. Bir değeri tutturmak bir kez yapılan iştir; bir değerin sabit kalmasını sağlamak sürekli yapılan iştir. Ekibin bunu ölçmek için kullandığı büyüklük de bu ayrıma göre kurulmuş: değişken glikasyon girdilerinin ne ölçüde sabit mekanik çıktılara sıkıştırıldığını gösteren bir dağılım aktarım oranı. Ölçülen şey ortalama bir sertlik yerine dalgalanmanın ne kadarının içeri geçtiğidir.", "en": "It is a small-looking but deep shift. Hitting a value is work done once; keeping a value steady is work done continuously. The quantity the team uses to measure it is built on that distinction: a dispersion-transfer ratio showing how far variable glycation inputs are compressed into stable micromechanical outputs. What gets measured is how much of the fluctuation gets through rather than an average stiffness.", "refs": ["gel"]}]}, {"h": {"tr": "Tırmanılan basamaklar", "en": "The steps actually climbed"}, "ps": [{"tr": "Malzeme, matrisin içine giren ve kalsiyum iyonlarına ve ileri glikasyon son ürünlerine ilgi duyan bir peptit hidrojeli. Bildirilen sonuçlara göre glikasyon yükünü tamponluyor ve viskoelastik kaymayı sınırlarken mezenkimal kök hücrelerin matrisi yeniden biçimlendirmesine ve mineralleştirmesine izin veriyor; ortamı dondurmadan sabitliyor. Kan şekeri yüksek hayvanlarda açılan kraniyofasiyal kemik boşluklarında hücre ölçeğindeki mekaniği sabitledi ve kemik onarımı ile mineralleşmeyi iyileştirdi. Denemeler sıçan, tavşan, beagle cinsi köpek ve rhesus makağında yürütüldü.", "en": "The material is a peptide hydrogel that interpenetrates the matrix and has affinity for calcium ions and advanced glycation end products. On the reported results it buffers the glycation load and constrains viscoelastic drift while still allowing mesenchymal stem cells to remodel and mineralise the matrix, stabilising the environment without freezing it. In craniofacial bone defects created in animals with high blood sugar, it steadied cell-scale mechanics and improved bone repair and mineralisation. The tests ran in rats, rabbits, beagle dogs and rhesus macaques.", "refs": ["gel"]}, {"tr": "Dört tür, bir cümlede geçtiğinden daha uzun bir yolculuktur. Kemik iyileşmesi tür büyüdükçe yavaşlar, yükleme biçimi değişir ve küçük hayvanlarda işe yarayan malzemeler bu geçişte sık sık elenir; rhesus makağında iyileşme göstermek küçük bir eşik sayılmaz. Yine de listede olmayan bir tür var ve o türün diyabetli hastaları bu malzemenin varlık nedenidir. Basamaklar tırmanıldı, merdiven bitmedi.", "en": "Four species is a longer journey than one sentence makes it sound. Bone healing slows as animals get larger, the pattern of loading changes, and materials that work in small animals are often eliminated at that transition; showing repair in a rhesus macaque counts as no small threshold. Even so, one species is missing from the list, and the diabetic patients of that species are the reason this material exists. The steps were climbed; the ladder does not end there.", "refs": ["gel"]}]}, {"h": {"tr": "Tasarımın kendisi de bir haber", "en": "The design itself is also news"}, "ps": [{"tr": "Bu malzemenin nasıl bulunduğu, ne yaptığı kadar dikkat çekici. Ekip peptidi, kural tabanlı sayma ve puanlama yordamıyla yürütülen yönlendirilmiş bir tasarım akışıyla seçti: aday diziler sistematik olarak üretiliyor, tanımlı ölçütlere göre puanlanıyor ve laboratuvara yalnızca üst sıradakiler giriyor. Bu, sezgiyle aday seçmenin yerine geçen bir arama biçimidir ve malzemenin kendisi kadar, bundan sonraki malzemelerin nasıl aranacağına dair bir örnektir.", "en": "How this material was found is as striking as what it does. The team selected the peptide through a guided design workflow built on rule-based enumeration and scoring: candidate sequences are generated systematically, scored against defined criteria, and only the top-ranked ones reach the bench. It is a form of search standing in for intuition in choosing candidates, and it is as much an example of how the next materials will be looked for as it is a material.", "refs": ["gel"]}, {"tr": "Yine de bir arama yöntemi, aradığı şeyin doğru şey olduğunu kanıtlamaz. Bu çalışmanın ileri sürdüğü asıl fikir, hücrenin çevresindeki mekanik istikrarın kendi başına tedavi edilebilir bir büyüklük olduğudur. Bu fikir doğruysa etkisi kraniyofasiyal kemikle sınırlı kalmaz, çünkü glikasyon yaşlanan ve şeker düzeyi yüksek her dokuda işler. Yanlışsa, elimizde iyi çalışan bir jel ve fazla geniş bir açıklama kalır. İkisini ayıracak olan, diyabetli hastalarda kemik onarımını karşılaştırmalı ölçen bir çalışmadır. O gelene kadar burada olan şey bir sorudur: bir hücreye ne söylediğimiz kadar, o sözü ne kadar sabit tuttuğumuz da önemli olabilir.", "en": "A search method, though, does not prove that what it searched for was the right thing. The real idea this work advances is that mechanical stability around a cell is itself a treatable quantity. If that idea is right its reach will not stop at craniofacial bone, because glycation operates in every ageing and sugar-rich tissue. If it is wrong, what remains is a gel that works well and an explanation stretched too far. What will separate the two is a study measuring bone repair comparatively in patients with diabetes. Until then what is here is a question: how steadily we hold what we say to a cell may matter as much as what we say.", "refs": ["gel"]}]}], "sources": [{"key": "gel", "kind": "news", "name": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76070-w", "title": {"tr": "Peptit jel, hücre çevresindeki mekanik ortamı sabit tutarak dört türde kemik onarımını iyileştirdi", "en": "A peptide gel steadied the mechanical surroundings of cells and improved bone repair in four species"}, "publishedDate": "2026-07-27"}], "date": "2026-07-27"}], "dates": ["2026-08-02", "2026-08-01", "2026-07-31", "2026-07-30", "2026-07-29", "2026-07-28", "2026-07-27"], "dateLabels": {"2026-08-02": {"tr": "2 Ağustos 2026", "en": "August 2, 2026"}, "2026-08-01": {"tr": "1 Ağustos 2026", "en": "August 1, 2026"}, "2026-07-31": {"tr": "31 Temmuz 2026", "en": "July 31, 2026"}, "2026-07-30": {"tr": "30 Temmuz 2026", "en": "July 30, 2026"}, "2026-07-29": {"tr": "29 Temmuz 2026", "en": "July 29, 2026"}, "2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}}, "newsDates": {"science": "2026-08-02"}, "podcasts": {"science": {"2026-07-27": {"editions": {"1": {"files": {"tr": {"url": "/episodes/2026-07-27-science-tr.ca019dd22aec.mp3", "bytes": 1070855}}}}}, "2026-07-28": {"editions": {"1": /* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}
