asaya öncülük etmiş bir hissedeki ivme de nakit akışı beklentilerinde hiçbir değişiklik olmadan benzer bir gün yaratabilir. Fiyatın kendisi ve günün yönü bu ikisini ayırmaya yetmez."}, {"en": "Mark Hackett of Nationwide described Amazon as the most emblematic company in the economy right now, both a consumer story and an artificial intelligence story. That is a statement about how the market is framing the name, and the framing is doing work here: the same release that carried the cloud acceleration also carried a higher spending plan. The tape is weighing the growth now and the bill later, which is a defensible order only while the growth keeps arriving.", "refs": ["amazon"], "tr": "Nationwide'dan Mark Hackett, Amazon'u şu anda ekonominin en simgesel şirketi olarak niteledi; hem bir tüketici hem de bir yapay zekâ hikâyesi taşıdığını söyledi. Bu, piyasanın hisseyi nasıl çerçevelediğine dair bir saptama ve o çerçeve burada iş görüyor: bulut ivmesini taşıyan bilanço, aynı zamanda yükseltilmiş bir harcama planını da taşıyordu. Fiyat akışı önce büyümeyi, sonra faturayı tartıyor; bu sıralama ancak büyüme gelmeye devam ettiği sürece savunulabilir."}]}, {"h": {"en": "Two ways this resolves", "tr": "Bunun iki olası sonu"}, "ps": [{"en": "There is a clean split between the two explanations, and it does not need a forecast to state. If the repricing reflects revised expectations about the cloud business, the gain should survive ordinary trading volumes and hold through the next set of numbers. If it reflects flows around the 3 trillion dollar threshold, it should fade without any company news at all, on a session that carries no new information in either direction. The volume that accompanies the next drawdown will say more than the level itself.", "refs": ["amazon"], "tr": "İki açıklama arasında temiz bir ayrım var ve bunu söylemek için öngörüde bulunmaya gerek yok. Yeniden fiyatlama bulut işine dair güncellenmiş beklentileri yansıtıyorsa kazanç olağan işlem hacimlerinde ayakta kalmalı ve bir sonraki rakamlara kadar korunmalı. 3 trilyon dolar eşiği çevresindeki akışları yansıtıyorsa hiçbir şirket haberi olmadan, iki yönde de yeni bilgi taşımayan bir günde erimeli. Bir sonraki geri çekilmeye eşlik eden hacim, düzeyin kendisinden daha çok şey söyleyecek."}]}], "sources": [{"key": "amazon", "kind": "news", "name": "Reuters", "url": "https://finance.yahoo.com/technology/ai/articles/amazon-enters-3-trillion-club-134557825.html", "title": {"tr": "Amazon'un piyasa değeri ilk kez 3 trilyon doları aştı", "en": "Amazon's market value topped 3 trillion dollars for the first time"}, "publishedDate": "2026-08-03"}], "title": {"en": "Friday's disclosure, Monday's five per cent", "tr": "Cumanın bilançosu, pazartesinin yüzde beşi"}, "writer": "eco-01", "n": 3, "date": "2026-08-03"}, {"excerpt": {"en": "John Williams says most of the tariff effect has already reached prices. The same day's manufacturing survey shows the prices index at 71.1 per cent, still the highest of its components.", "tr": "John Williams, tarife etkisinin büyük bölümünün fiyatlara çoktan ulaştığını söylüyor. Aynı günün imalat anketinde fiyat endeksi yüzde 71,1 ile bileşenlerin en yükseği olmayı sürdürüyor."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "Two readings, one day", "tr": "Aynı gün, iki okuma"}, "ps": [{"en": "Williams told Reuters that the current stance of interest rate policy is well positioned to bring inflation back to 2 per cent, that his own forecast is for inflation to come down in the second half of this year and further next year, and that it would absolutely be appropriate to act if the economy is not on that trajectory. His supporting argument is specific: probably the vast majority or a large part of the effects of the tariffs already in place have now passed through into prices. The federal funds target range is 3.50 per cent to 3.75 per cent after last week's hold, and futures traders have priced in a decent chance of a rise by the end of the year.", "refs": ["williams"], "tr": "Williams Reuters'a, mevcut faiz duruşunun enflasyonu yüzde 2 hedefine döndürmek için doğru konumda olduğunu, kendi öngörüsünün enflasyonun bu yılın ikinci yarısında gerilemesi ve gelecek yıl daha da düşmesi yönünde bulunduğunu, ekonomi bu yörüngede değilse harekete geçmenin kesinlikle yerinde olacağını söyledi. Dayanağı somut: yürürlükteki tarifelerin etkilerinin büyük bölümü fiyatlara halihazırda yansımış durumda. Geçen haftaki sabit tutma kararının ardından federal fon faizi hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında; vadeli işlem piyasasında yıl sonuna kadar bir artışa belirgin olasılık fiyatlanıyor."}, {"en": "The manufacturing survey published the same morning gives that argument a rough edge. The headline index came in at 55.6 per cent, 2.3 percentage points above June's 53.3 per cent, with production at 58.5 per cent, employment back in expansion at 52.8 per cent and the backlog of orders at 55.0 per cent. The prices index eased to 71.1 per cent from 73.0 per cent, and it remained the highest component in the release by a wide margin.", "refs": ["ism"], "tr": "Aynı sabah yayımlanan imalat anketi bu savı pürüzlendiriyor. Ana endeks, haziran ayındaki yüzde 53,3'ün 2,3 puan üzerinde, yüzde 55,6 olarak açıklandı; üretim yüzde 58,5, istihdam yüzde 52,8 ile yeniden genişleme bölgesinde, bekleyen siparişler ise yüzde 55,0 düzeyindeydi. Fiyat endeksi yüzde 73,0'tan yüzde 71,1'e indi ve açıklamanın açık farkla en yüksek bileşeni olmayı sürdürdü."}]}, {"h": {"en": "Where the cost is sitting", "tr": "Gider nerede duruyor?"}, "ps": [{"en": "These two readings are not in contradiction, because they measure different things. A diffusion index of prices records how many firms report paying more for inputs, not how much of that increase reached a household. A figure of 71.1 per cent means the breadth of input cost increases barely narrowed. That is consistent with Williams's account, in which the tariff cost has already moved through to consumer prices and is now working out of the annual comparison. It is equally consistent with the opposite account, in which the cost has arrived at the factory gate and is being held on producer margins because demand will not carry another increase. A survey of purchasing managers cannot tell you which of those happened.", "refs": ["ism", "williams"], "tr": "Bu iki okuma çelişmiyor, çünkü farklı şeyleri ölçüyorlar. Bir yayılım endeksi, girdiler için daha fazla ödediğini bildiren firmaların oranını gösterir; bu artışın ne kadarının haneye ulaştığını değil. Yüzde 71,1'lik değer, girdi giderlerindeki artışın yaygınlığının çok az daraldığı anlamına geliyor. Bu, tarife giderinin tüketici fiyatlarına çoktan geçtiği ve şimdi yıllık karşılaştırmadan çıkmakta olduğu yönündeki Williams anlatısıyla uyumlu. Aynı ölçüde, giderin fabrika kapısına ulaştığı ama talep bir artış daha kaldıramayacağı için üretici kâr marjında tutulduğu ters anlatıyla da uyumlu. Bir satın alma yöneticileri anketi hangisinin gerçekleştiğini söyleyemez."}, {"en": "Which one it is depends on demand, not on the tariff schedule, and the rest of the survey speaks to demand. Production at 58.5 per cent and a backlog of orders that rose to 55.0 per cent from 50.5 per cent describe factories running against their order books rather than chasing work. A firm in that position has more room to pass a cost forward than one with an empty book. So the same release that leaves the pass-through question open also tells us the conditions under which it would be settled in the producer's favour, with the household paying rather than the margin absorbing.", "refs": ["ism"], "tr": "Hangisi olduğu tarife takvimine değil talebe bağlı ve anketin geri kalanı tam da talepten söz ediyor. Üretimin yüzde 58,5'te olması ve bekleyen siparişlerin yüzde 50,5'ten yüzde 55,0'a çıkması, iş kovalayan değil sipariş defterine yetişmeye çalışan fabrikaları anlatıyor. Bu konumdaki bir firmanın gideri ileriye aktarma alanı, defteri boş olandan geniştir. Yani geçiş sorusunu açık bırakan bu açıklama, sorunun hangi koşullarda üretici lehine kapanacağını da söylüyor: kâr marjının soğurmasıyla değil, hanenin ödemesiyle."}]}, {"h": {"en": "The question the interview leaves open", "tr": "Söyleşinin açık bıraktığı soru"}, "ps": [{"en": "The interesting part of the interview lies in the premise underneath the conditional promise to act, rather than in that promise itself. If the tariff cost has genuinely finished moving through to prices, then the disinflation Williams forecasts arrives by arithmetic as last year's increases drop out. If instead a portion is parked on margins in a manufacturing sector that has just posted its strongest headline since May 2022, then the same demand strength that produced 55.6 per cent is what would release it. In that case the passing of the pass-through would be a timing statement rather than a completed event, and the trajectory Williams says he would act on is the one that gets rewritten.", "refs": ["ism", "williams"], "tr": "Söyleşinin ilginç yanı, harekete geçme yönündeki koşullu taahhüdün altında yatan varsayımdır. Tarife gideri fiyatlara geçişini gerçekten tamamladıysa Williams'ın öngördüğü dezenflasyon, geçen yılın artışları karşılaştırmadan düştükçe aritmetik yoldan gelir. Buna karşılık bir bölümü, mayıs 2022'den bu yana en güçlü ana endeksini açıklamış bir imalat sektöründe kâr marjında bekliyorsa, yüzde 55,6'yı üreten talep gücünün kendisi onu serbest bırakacak olandır. O durumda geçişin tamamlanması bitmiş bir olay değil bir zamanlama saptaması olur ve Williams'ın üzerine hareket edeceğini söylediği yörünge de yeniden yazılan şey olur."}]}], "sources": [{"key": "williams", "kind": "news", "name": "Reuters", "url": "https://finance.yahoo.com/economy/policy/articles/exclusive-feds-williams-expects-inflation-100542847.html", "title": {"tr": "New York Fed Başkanı John Williams, enflasyon gerilemezse Fed'in harekete geçeceğini söyledi", "en": "New York Fed President John Williams said the Fed would act if inflation does not come down"}, "publishedDate": "2026-08-03"}, {"key": "ism", "kind": "news", "name": "Institute for Supply Management", "url": "https://www.prnewswire.com/news-releases/manufacturing-pmi-at-55-6-july-2026-ism-manufacturing-pmi-report-302840669.html", "title": {"tr": "ABD'de ISM imalat endeksi temmuzda yüzde 55,6'ya çıkarak mayıs 2022'den bu yana en yüksek düzeye ulaştı", "en": "The US ISM manufacturing index rose to 55.6 per cent in July, its highest reading since May 2022"}, "publishedDate": "2026-08-03"}], "title": {"en": "Has the tariff pass-through ended, or only changed hands?", "tr": "Tarife geçişi bitti mi, yoksa el mi değiştirdi?"}, "writer": "eco-02", "n": 3, "date": "2026-08-03"}, {"excerpt": {"en": "SpaceX reports as a listed company for the first time on Tuesday. On Thursday a lock-up expiry frees about a fifth of its shares. The gap decides how much of the quarter is priced before the supply arrives.", "tr": "SpaceX salı günü halka açık bir şirket olarak ilk bilançosunu açıklayacak. Perşembe günü dolan satış yasağı hisselerin yaklaşık beşte birini serbest bırakıyor. Aradaki boşluk, arz gelmeden önce çeyreğin ne kadarının fiyatlanacağını belirliyor."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "The calendar", "tr": "Takvim"}, "ps": [{"en": "The stock touched an all-time low on Monday morning before recovering to 111.05 dollars, up 2.47 per cent. It sits about 30 per cent below its 150 dollar debut and about 50 per cent below its all-time high of 225.64 dollars. The first results as a listed company come after the close on 4 August. The lock-up expires on 6 August, freeing roughly 20 per cent of shares, which Cory Johnson of Epistrophy Capital put at roughly triple the current tradable float.", "refs": ["spacex"], "tr": "Hisse pazartesi sabahı tüm zamanların en düşük düzeyine indikten sonra yüzde 2,47 artışla 111,05 dolar düzeyine döndü. Fiyat, 150 dolar olan ilk işlem düzeyinin yaklaşık yüzde 30, 225,64 dolar olan zirvesinin ise yaklaşık yüzde 50 altında bulunuyor. Halka açık şirket olarak açıklanacak ilk bilanço 4 ağustosta kapanışın ardından gelecek. Satış yasağı 6 ağustosta doluyor ve hisselerin yaklaşık yüzde 20'sini serbest bırakıyor; Epistrophy Capital'den Cory Johnson bunu mevcut serbest dolaşımın kabaca üç katı olarak tarif etti."}, {"en": "What the market expects to see is already public: revenue of 6.87 billion dollars, an adjusted loss of 0.25 dollars a share and adjusted EBITDA of 2.03 billion dollars. Those three figures do not sit together by accident. A positive adjusted EBITDA line next to a loss at the earnings line is the signature of a company whose depreciation and financing follow a very large asset base, and the distance between the two is where the capital programme shows up in the accounts.", "refs": ["spacex"], "tr": "Piyasanın ne göreceğine dair beklenti şimdiden ortada: 6,87 milyar dolar gelir, hisse başına 0,25 dolar düzeltilmiş zarar ve 2,03 milyar dolar düzeltilmiş FAVÖK. Bu üç rakamın yan yana gelmesi rastlantı değil. Kâr satırındaki zararın yanında artı bir düzeltilmiş FAVÖK satırı, amortismanı ve finansmanı çok büyük bir varlık tabanını izleyen bir şirketin imzasıdır; ikisi arasındaki mesafe de sermaye programının hesaplarda göründüğü yerdir."}]}, {"h": {"en": "The assumption carrying the price", "tr": "Fiyatı taşıyan varsayım"}, "ps": [{"en": "One input dominates everything else here. Melissa Otto of S\u0026P Global Visible Alpha puts capital spending at 48.7 billion dollars this year, rising to 118.4 billion dollars in the 2028 financial year. Set that against an expected quarterly revenue of 6.87 billion dollars and the arithmetic is stark: the annual spending plan is several times the revenue the company is expected to book in the quarter it is about to report. Nothing about a valuation at this level survives without a view on whether that capital earns a return above its cost, and adjusted EBITDA of 2.03 billion dollars is measured before the spending happens.", "refs": ["spacex"], "tr": "Burada tek bir girdi diğerlerinin tümüne baskın çıkıyor. S\u0026P Global Visible Alpha'dan Melissa Otto, sermaye harcamasını bu yıl için 48,7 milyar dolar, 2028 mali yılı için 118,4 milyar dolar olarak koyuyor. Bunu 6,87 milyar dolar olan çeyrek gelir beklentisinin karşısına yerleştirdiğinizde aritmetik çıplak kalıyor: yıllık harcama planı, şirketin açıklamak üzere olduğu çeyrekte kaydetmesi beklenen gelirin birkaç katı. Bu düzeydeki bir değerlemenin, söz konusu sermayenin kendi giderinin üzerinde bir getiri sağlayıp sağlamadığına dair bir görüş olmadan ayakta kalabilecek hiçbir yanı yok; 2,03 milyar dolar düzeltilmiş FAVÖK ise harcama gerçekleşmeden önce ölçülüyor."}, {"en": "The steelman for that spending is real, and it deserves stating before Tuesday rather than after. A capital programme rising from 48.7 billion dollars to 118.4 billion dollars can be defensible when it buys capacity that is already contracted, because then the spending is a receivable in disguise and the loss line is a timing artefact. The honest limit on this analysis is that all three of the quarter's figures are analyst projections rather than disclosed company numbers. The first report is precisely the event that replaces an estimate with a disclosure, which is why what it contains matters more than what it prints.", "refs": ["spacex"], "tr": "Bu harcamanın en güçlü savunusu gerçek ve salıdan sonra değil önce söylenmeyi hak ediyor. 48,7 milyar dolar düzeyinden 118,4 milyar dolar düzeyine yükselen bir sermaye programı, çoktan sözleşmeye bağlanmış kapasite satın alıyorsa savunulabilir; o zaman harcama kılık değiştirmiş bir alacaktır ve zarar satırı bir zamanlama sonucudur. Bu çözümlemenin dürüst sınırı şu: çeyreğe ait üç rakamın üçü de şirketin açıkladığı veriler değil, çözümleyici öngörüleridir. İlk bilanço tam da bir tahmini bir açıklamayla değiştiren olaydır; bu yüzden içinde ne olduğu, ne yazdığından daha önemlidir."}]}, {"h": {"en": "What Tuesday has to contain", "tr": "Salının içermesi gereken şey"}, "ps": [{"en": "This gives a testable expectation for the two days between the report and the expiry. If Tuesday's release contains a capital spending plan and a contracted backlog alongside the quarter, Thursday's supply meets a market that has had two sessions to price disclosed numbers. If it contains the quarter alone, the float roughly triples against a set of outside estimates that nothing has replaced. By 31 August the answer is checkable in one line: whether the company's first report included forward capital expenditure guidance, and whether that guidance sits near the 48.7 billion dollar figure the estimate assumes.", "refs": ["spacex"], "tr": "Bu, bilanço ile satış yasağının dolması arasındaki iki gün için sınanabilir bir beklenti veriyor. Salı günkü açıklama, çeyreğin yanında bir sermaye harcaması planı ve sözleşmeye bağlanmış sipariş birikimi içeriyorsa perşembe gelen arz, açıklanmış rakamları fiyatlamak için iki günü olmuş bir piyasayla karşılaşır. Yalnızca çeyreği içeriyorsa dolaşım, yerine hiçbir şeyin geçmediği bir dış tahmin kümesine karşı kabaca üçe katlanır. 31 ağustosa kadar yanıt tek satırda denetlenebilir: şirketin ilk bilançosu ileriye dönük sermaye harcaması öngörüsü içerdi mi ve bu öngörü, tahminin varsaydığı 48,7 milyar dolar rakamına yakın mı?"}]}], "sources": [{"key": "spacex", "kind": "news", "name": "Yahoo Finance", "url": "https://ca.finance.yahoo.com/news/spacexs-first-ever-earnings-report-comes-as-stock-faces-big-pressure-q2-preview-132323178.html", "title": {"tr": "SpaceX hisseleri, şirketin ilk çeyrek bilançosundan bir gün önce tüm zamanların en düşük düzeyini gördü", "en": "SpaceX shares hit an all-time low a day before the company's first quarterly report"}, "publishedDate": "2026-08-03"}], "title": {"en": "Two days between the first disclosure and the float that triples", "tr": "İlk bilanço ile üçe katlanan dolaşım arasında iki gün"}, "writer": "eco-03", "n": 3, "date": "2026-08-03"}, {"excerpt": {"en": "Korea's central bank wants 4 to 5 tonnes of domestic gold a year. The refiners pour it, the price is set abroad, and the settlement path that would carry it into the vault does not exist yet.", "tr": "Kore Merkez Bankası yılda 4 ila 5 ton yurt içi altın almak istiyor. Rafineriler dökümü yapıyor, fiyat yurt dışında oluşuyor; altını kasaya taşıyacak takas yolu ise henüz yok."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "The tonnage", "tr": "Tonaj"}, "ps": [{"en": "The Bank of Korea holds 104.4 tonnes of gold, 1.1 per cent of its foreign exchange reserves. Its last purchases were in 2013. It has now built a framework with the Korea Exchange and the Korea Securities Depository to buy from domestic producers at international prices, aiming for 4 to 5 tonnes a year against domestic output of 40 to 50 tonnes from LS MnM and Korea Zinc.", "refs": ["bok"], "tr": "Kore Merkez Bankası'nın 104,4 tonluk altını, döviz rezervlerinin yüzde 1,1'ini oluşturuyor. Son alımları 2013'te yapmıştı. Banka şimdi Kore Borsası ve Kore Menkul Kıymet Saklama Kuruluşu ile birlikte, yurt içi üreticilerden uluslararası fiyatlarla alım yapmak için bir düzenek kurdu; LS MnM ile Korea Zinc'in 40 ila 50 tonluk yurt içi üretimine karşılık yılda 4 ila 5 ton hedefliyor."}, {"en": "Put those three numbers next to each other and the shape of the decision is clear. A purchase of 4 to 5 tonnes against a holding of 104.4 tonnes is a slow addition; against domestic output of 40 to 50 tonnes it is a modest claim on the local pour. Neither figure is large enough to matter to a world market that prices in thousands of tonnes. The framework changes where a small quantity of metal comes to rest and in which currency it is paid for, leaving the balance of supply and demand untouched.", "refs": ["bok"], "tr": "Bu üç rakamı yan yana koyduğunuzda kararın biçimi belirginleşiyor. 104,4 tonluk bir stoka karşılık 4 ila 5 tonluk alım yavaş bir ekleme; 40 ila 50 tonluk yurt içi üretime karşılık ise yerel döküm üzerinde ölçülü bir talep. İki rakam da binlerce tonla fiyatlanan bir dünya piyasası için önem taşıyacak büyüklükte değil. Değişen şey arz ile talebin dengesi değil, küçük bir metal miktarının nerede duracağı ve hangi para biriminde ödeneceği."}]}, {"h": {"en": "The route the metal would take", "tr": "Metalin izleyeceği yol"}, "ps": [{"en": "The mechanism is worth following step by step, because it is the whole point of the announcement. Purchases would be negotiated block trades rather than exchange trading, settled in won, which removes the dollar conversion an offshore purchase would require. The Korea Securities Depository would handle settlement and storage, the Korea Exchange the trading platform. The bank has also said it wants to spread storage beyond London and New York. Metal bought from a domestic refiner and stored domestically never crosses a border, so the route is the reason for the framework, not a detail of it.", "refs": ["bok"], "tr": "Düzeneği adım adım izlemekte yarar var, çünkü açıklamanın bütün mesele ettiği şey bu. Alımlar borsa işlemi yerine pazarlıkla yapılan blok işlemler olacak ve won cinsinden takas edilecek; bu da yurt dışından yapılacak bir alımın gerektireceği dolara çevirme adımını ortadan kaldırıyor. Takas ve saklamayı Kore Menkul Kıymet Saklama Kuruluşu, işlem yerini Kore Borsası üstlenecek. Banka ayrıca saklamayı Londra ve New York'un ötesine yayma isteğini dile getirdi. Yurt içindeki bir rafineriden alınıp yurt içinde saklanan metal hiçbir sınırı geçmez; yani yol, düzeneğin bir ayrıntısı değil gerekçesidir."}, {"en": "There is a competing reading of the same design that should not be dismissed. Settling in won and buying from a domestic refiner is convenient for reserve management regardless of where anyone thinks the metal is safest, because it avoids using foreign exchange to acquire a reserve asset. Cho Sok-pang, who heads planning, described a gradual, long-term approach focused on raising the share of gold in reserves rather than buying mechanically on price moves, and that is a portfolio statement rather than a statement about vault location. The two motives point the same way here, which is exactly why neither is proved by the framework alone.", "refs": ["bok"], "tr": "Aynı tasarımın göz ardı edilmemesi gereken rakip bir okuması var. Won cinsinden takas edip yurt içi bir rafineriden alım yapmak, metalin nerede daha güvende olduğuna dair görüşten bağımsız olarak rezerv yönetimi açısından elverişlidir; çünkü bir rezerv varlığını edinmek için döviz kullanmayı gerektirmez. Planlama biriminin başındaki Cho Sok-pang, fiyat hareketlerine göre makinemsi alım yapmak yerine rezervlerde altının payını artırmaya odaklanan kademeli ve uzun vadeli bir yaklaşımı tarif etti; bu, kasanın yerine değil portföye ilişkin bir açıklamadır. İki gerekçe burada aynı yönü gösteriyor ve tam da bu yüzden hiçbiri yalnızca düzeneğin varlığıyla kanıtlanmış olmuyor."}]}, {"h": {"en": "Announced is not settled", "tr": "Duyurulmuş olan, takas edilmiş değildir"}, "ps": [{"en": "And this is where the framework stops being a purchase. The bank's own account is that the buying waits on the completion of depository infrastructure. Until that is built, there is no settled trade, no tonne in the vault and no change to the 104.4 tonnes on the books; the reserve management group's very small purchases of overseas-listed spot gold funds in the second quarter of 2026 are a different exposure, held offshore in a form the whole framework is designed to move away from. A refinery that pours 40 to 50 tonnes a year is not the constraint here. The constraint is a settlement and storage system that has not been finished, and no announcement moves metal.", "refs": ["bok"], "tr": "İşte düzeneğin bir alım olmaktan çıktığı yer burası. Bankanın kendi anlatımına göre alımlar saklama altyapısının tamamlanmasını bekliyor. O altyapı kurulana kadar takası tamamlanmış bir işlem, kasada bir ton ve defterlerdeki 104,4 tonda bir değişiklik yok; rezerv yönetimi biriminin 2026'nın ikinci çeyreğinde yurt dışında işlem gören fiziki altın fonlarından yaptığı çok küçük alımlar ise farklı bir varlık, üstelik bütün düzeneğin uzaklaşmak için tasarlandığı biçimde yurt dışında tutuluyor. Burada kısıt, yılda 40 ila 50 ton döken bir rafineri değil. Kısıt, tamamlanmamış bir takas ve saklama sistemi ve hiçbir duyuru metali yerinden oynatmaz."}]}], "sources": [{"key": "bok", "kind": "news", "name": "Korea JoongAng Daily", "url": "https://www.koreajoongangdaily.com/business/bank-of-korea-resumes-buying-gold-after-13year-pausenbsp/12806039", "title": {"tr": "Kore Merkez Bankası, 13 yıllık aranın ardından yurt içi üreticilerden altın almak için bir düzenek kurdu", "en": "The Bank of Korea set up a framework to buy gold from domestic producers, ending a 13-year pause"}, "publishedDate": "2026-08-03"}], "title": {"en": "The depository has to be finished before the metal moves", "tr": "Metal yerinden oynamadan önce saklama altyapısının tamamlanması gerekiyor"}, "writer": "eco-04", "n": 3, "date": "2026-08-03"}, {"excerpt": {"en": "The ECB's own survey work says the euro area's consumption slowdown came mostly from households postponing purchases, not from households running out of room. Those two look identical in an aggregate and are nothing alike in a budget.", "tr": "Avrupa Merkez Bankası'nın kendi anket çalışması, euro bölgesindeki tüketim yavaşlamasının büyük ölçüde alımlarını erteleyen hanelerden geldiğini, hareket alanı tükenen hanelerden gelmediğini söylüyor. Bu ikisi bir toplamda birbirinin aynı görünür, bir hane bütçesinde ise hiç benzemez."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "What the aggregate shows", "tr": "Toplam ne gösteriyor?"}, "ps": [{"en": "Between February and April 2026 the euro area consumer confidence index fell by around 12 index points, and nominal consumption growth slowed from 3 per cent to 4 per cent to about 2.5 per cent year on year by April. The authors put a number on the link: a 10-point fall in confidence is associated with a 0.4 percentage point reduction in consumption growth, against about 0.2 points in historical patterns, a response they describe as comparable in size to the one after the 2022 invasion of Ukraine.", "refs": ["ecb"], "tr": "Şubat ile nisan 2026 arasında euro bölgesi tüketici güven endeksi yaklaşık 12 puan geriledi ve nominal tüketim artışı nisana gelindiğinde yıllık yüzde 3 ile yüzde 4 bandından yüzde 2,5 civarına indi. Yazarlar bu bağa bir sayı veriyor: güvendeki 10 puanlık düşüş, tüketim artışında 0,4 puanlık bir azalmayla ilişkili; geçmiş örüntülerde bu ilişki yaklaşık 0,2 puan düzeyinde kalıyor. Tepkinin büyüklüğünü 2022'deki Ukrayna işgalinin ardından görülene benzetiyorlar."}, {"en": "An aggregate that size hides the only thing worth knowing about it. The contraction was concentrated in discretionary categories while housing and food held up, and energy spending rose because transport costs went up. So the average household in this data did not cut its spending evenly; it dropped one kind of purchase and kept paying for another kind, and the bill it could not drop went up.", "refs": ["ecb"], "tr": "Bu büyüklükte bir toplam, hakkında bilinmeye değer tek şeyi gizler. Daralma isteğe bağlı harcama gruplarında yoğunlaştı; konut ve gıda dayanıklılığını korudu, enerji harcaması ise ulaşım giderleri yükseldiği için arttı. Yani bu verideki ortalama hane harcamasını eşit biçimde kısmadı; bir tür alımdan vazgeçti, bir başkasını ödemeyi sürdürdü ve vazgeçemediği fatura da yükseldi."}]}, {"h": {"en": "Who cut, and who could not", "tr": "Kim kıstı, kim kısamadı?"}, "ps": [{"en": "The decomposition is in the box itself. Higher-income households adjusted spending more, postponing luxury purchases and non-essential services. Lower-income households cut durable goods and restaurant spending. The authors conclude that the slowdown reflects postponed discretionary spending rather than binding income constraints. Read from the top of the distribution that is a reassuring finding, because postponement is reversible. Read from the bottom it says something narrower: the households with the least room contributed the smallest share of the cut, which is what you would expect from households that had already spent their flexibility.", "refs": ["ecb"], "tr": "Ayrıştırma kutunun kendi içinde. Üst gelir grubundaki haneler harcamalarını daha fazla kıstı, lüks alımları ve zorunlu olmayan hizmetleri erteledi. Alt gelir grubundaki haneler dayanıklı tüketim malı ve lokanta harcamasını azalttı. Yazarlar, yavaşlamanın bağlayıcı bir gelir kısıtından çok ertelenen isteğe bağlı harcamayı yansıttığı sonucuna varıyor. Dağılımın üst ucundan bakıldığında bu rahatlatıcı bir bulgudur, çünkü erteleme geri alınabilir. Alt uçtan bakıldığında ise daha dar bir şey söyler: hareket alanı en az olan haneler, kesintinin en küçük payını oluşturmuştur ve esnekliğini çoktan harcamış hanelerden beklenecek olan da budur."}, {"en": "That distinction matters because a postponement and a forced cut are the same line in a consumption series and different events in a household. A family that delays a kitchen appliance still holds the money. A family that drops a durable good while its energy bill rises because transport costs rose has moved the money, not saved it. Both show up as weaker discretionary spending. One is a decision that can be reversed when confidence recovers; the other is a budget that has already been rebalanced. There is a limit on how far this can be pushed: the series is nominal, so part of what looks like resilience in housing and food is price rather than volume, and part of the fall in discretionary categories could be the same effect running the other way.", "refs": ["ecb"], "tr": "Bu ayrım önemli, çünkü erteleme ile zorunlu kesinti bir tüketim serisinde aynı satır, bir hanede ise farklı olaylardır. Mutfak aletini erteleyen aile parayı elinde tutar. Ulaşım giderleri yükseldiği için enerji faturası artarken dayanıklı bir maldan vazgeçen aile ise parayı biriktirmiş değil yer değiştirmiştir. İkisi de isteğe bağlı harcamada zayıflama olarak görünür. Biri güven toparlandığında geri alınabilecek bir karardır; diğeri çoktan yeniden dengelenmiş bir bütçedir. Bunun ne kadar ileri götürülebileceğinin bir sınırı var: seri nominaldir, dolayısıyla konut ve gıdada dayanıklılık gibi görünenin bir bölümü hacim değil fiyattır ve isteğe bağlı gruplardaki düşüşün bir bölümü de aynı etkinin ters yönde işlemesi olabilir."}]}, {"h": {"en": "The test that separates them", "tr": "İkisini ayıran sınama"}, "ps": [{"en": "Fortunately the two stories make different predictions, and the same survey can tell them apart. If the weakness really is postponement, then a recovery in the confidence index towards its February level should be followed by discretionary spending recovering without any change in income, and the recovery should be led by the higher-income households that did most of the cutting. If part of it was a constraint, discretionary spending in the lower half stays down while confidence recovers, and durable goods are the category that fails to come back. By the end of the first quarter of 2027 the survey rounds will have enough observations after the confidence trough to show which pattern held.", "refs": ["ecb"], "tr": "Neyse ki iki anlatı farklı öngörülerde bulunuyor ve aynı anket ikisini birbirinden ayırabilir. Zayıflık gerçekten ertelemeyse, güven endeksinin şubat düzeyine doğru toparlanmasının ardından gelirde hiçbir değişiklik olmadan isteğe bağlı harcamanın da toparlanması ve bu toparlanmaya kesintinin büyük bölümünü yapmış üst gelir gruplarının öncülük etmesi gerekir. Bir bölümü kısıt idiyse, güven toparlanırken alt yarıda isteğe bağlı harcama düşük kalır ve geri gelmeyen kalem dayanıklı tüketim malları olur. 2027'nin ilk çeyreği sonuna gelindiğinde anket turları, güvenin dip yaptığı dönemin ardından hangi örüntünün geçerli olduğunu gösterecek kadar gözlem biriktirmiş olacak."}]}], "sources": [{"key": "ecb", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/economic-bulletin/focus/2026/html/ecb.ebbox202605_02~0100593e6a.en.html", "title": {"tr": "Avrupa Merkez Bankası araştırması, Orta Doğu savaşının ardından euro bölgesinde tüketimin belirgin biçimde zayıfladığını buldu", "en": "ECB research found euro area consumption weakened sharply after the Middle East war began"}, "publishedDate": "2026-08-03"}], "title": {"en": "The households that cut were the ones who could afford to", "tr": "Harcamayı kısanlar, kısabilecek durumda olanlardı"}, "writer": "eco-05", "n": 3, "date": "2026-08-03"}, {"excerpt": {"en": "Dakota wants a national trust bank charter so it can issue stablecoins without the partner banks it uses today. Every intermediary removed is also a balance sheet removed, and a redemption has to land on one of them.", "tr": "Dakota, bugün kullandığı ortak bankalar olmadan sabit coin ihraç edebilmek için ulusal güven bankası ruhsatı istiyor. Aradan çıkarılan her halka aynı zamanda çıkarılan bir bilançodur ve geri alım talebinin bunlardan birine inmesi gerekir."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "The application", "tr": "Başvuru"}, "ps": [{"en": "Dakota, a neobank that launched an enterprise stablecoin product in January 2026, has asked the Office of the Comptroller of the Currency for a de novo national trust bank charter. It currently works through money transmission licences and partner banks. If approved, Dakota National Trust Bank would offer fiduciary digital asset custody, issue dollar-denominated stablecoins and provide transaction settlement. A national trust bank is a limited-purpose federal charter, not a deposit-taking bank licence.", "refs": ["dakota"], "tr": "Ocak 2026'da kurumsal sabit coin ürününü başlatan dijital banka Dakota, ABD Para Denetleme Kurumu'ndan yeni kuruluş niteliğinde ulusal güven bankası ruhsatı istedi. Şirket şu anda para transferi lisansları ve ortak bankalar üzerinden çalışıyor. Onaylanması halinde Dakota National Trust Bank, dijital varlıklarda güvene dayalı saklama hizmeti verecek, dolar cinsinden sabit coin ihraç edecek ve işlem takası sağlayacak. Ulusal güven bankası ruhsatı, mevduat toplama lisansı değil sınırlı amaçlı bir federal ruhsattır."}, {"en": "It is not an isolated filing. Morgan Stanley and Coinbase hold conditional approval for comparable charters, Payward, which operates Kraken, is pending, and the regulator granted Circle a national trust bank charter in early August once it met the conditions of its initial approval. That is a queue, and a queue tells you the licence has become the standard route rather than an experiment.", "refs": ["dakota"], "tr": "Bu tek başına bir başvuru değil. Morgan Stanley ile Coinbase benzer ruhsatlar için koşullu onay aldı, Kraken'i işleten Payward'ın başvurusu beklemede ve düzenleyici, ilk onayın koşullarını yerine getirmesinin ardından ağustos ayı başında Circle'a ulusal güven bankası ruhsatı verdi. Bu bir sıradır ve sıra, ruhsatın bir deneme değil olağan yol haline geldiğini gösterir."}]}, {"h": {"en": "The balance sheets in between", "tr": "Aradaki bilançolar"}, "ps": [{"en": "Ryan Bozarth, who runs Dakota, describes the point of the charter as fewer intermediaries meaning more control, more reliability and a cleaner experience for the people the company serves. As an operating claim about cost and speed that is straightforward. As a risk claim it needs one more step, because each intermediary in the current arrangement is also a balance sheet, and a balance sheet is what absorbs a mismatch between the moment a holder asks for dollars and the moment the reserve assets can be turned into dollars. Removing partner banks does not remove that mismatch. It concentrates it in the chartered entity.", "refs": ["dakota"], "tr": "Dakota'yı yöneten Ryan Bozarth, ruhsatın amacını aradaki halkaların azalmasının şirketin hizmet verdiği kişiler için daha fazla denetim, daha yüksek güvenilirlik ve daha yalın bir deneyim anlamına gelmesi olarak tarif ediyor. Gider ve hız üzerine bir işleyiş savı olarak bu açık. Bir risk savı olarak ise bir adım daha gerekiyor; çünkü mevcut düzenekteki her halka aynı zamanda bir bilançodur ve bir sahibin dolar istediği an ile rezerv varlıkların dolara çevrilebildiği an arasındaki uyumsuzluğu soğuran şey bilançodur. Ortak bankaları aradan çıkarmak bu uyumsuzluğu ortadan kaldırmaz. Onu ruhsatlı kuruluşta yoğunlaştırır."}, {"en": "Jasper Sneff Nanni of FS Vector supplies the timing detail that makes this worth watching now rather than later: national trust banks do not need to wait for final GENIUS Act rules to issue, redeem and hold custody of stablecoins. So issuance under the charter can begin before the rulebook that governs reserve composition and liquidity is finished. The resilience case against alarm is genuine and should be stated plainly. A limited-purpose charter is a narrower activity than deposit banking, custody obligations are supervised, and a supervisor that has already imposed conditions on Morgan Stanley, Coinbase and Circle is not absent from the process.", "refs": ["dakota"], "tr": "FS Vector'den Jasper Sneff Nanni, bu konuyu sonra değil şimdi izlemeye değer kılan zamanlama ayrıntısını veriyor: ulusal güven bankaları sabit coin ihraç etmek, geri almak ve saklamak için GENIUS Yasası'nın nihai kurallarını beklemek zorunda değil. Yani ruhsat kapsamında ihraç, rezerv bileşimini ve likiditeyi düzenleyecek kural kitabı tamamlanmadan başlayabilir. Alarma karşı dayanıklılık savı gerçektir ve açıkça söylenmelidir. Sınırlı amaçlı bir ruhsat, mevduat bankacılığından dar bir faaliyet alanıdır; saklama yükümlülükleri denetlenir ve Morgan Stanley, Coinbase ile Circle'a çoktan koşul dayatmış bir denetleyici süreçten uzak değildir."}]}, {"h": {"en": "Who takes the redemption", "tr": "Geri alımı kim üstlenir?"}, "ps": [{"en": "Which leaves one bounded question, and it is a question about people rather than about a chart. In today's arrangement, an enterprise client asking for dollars reaches a partner bank that holds a settlement account and can wait a day. Under the charter, the same request reaches an institution whose entire business is custody, issuance and settlement, and whose ability to pay depends on how quickly its reserve assets convert. The holders exposed to that difference are enterprise treasurers who treat the token as a cash equivalent, and they will find out what it is on the first day when everyone asks at once rather than on the day the charter is granted.", "refs": ["dakota"], "tr": "Geriye sınırları çizilmiş tek bir soru kalıyor ve bu, bir grafiğe değil insanlara ilişkin bir soru. Bugünkü düzenekte dolar isteyen kurumsal bir müşteri, takas hesabı tutan ve bir gün bekleyebilen bir ortak bankaya ulaşır. Ruhsat kapsamında aynı talep, tüm işi saklama, ihraç ve takas olan, ödeme gücü ise rezerv varlıklarının ne kadar hızlı çevrildiğine bağlı bir kuruluşa ulaşır. Bu farka açık olanlar, belirteci nakit benzeri sayan kurumsal hazine yöneticileridir ve bunun ne anlama geldiğini ruhsatın verildiği gün değil, herkesin aynı anda talep ettiği ilk gün öğreneceklerdir."}]}], "sources": [{"key": "dakota", "kind": "news", "name": "American Banker", "url": "https://www.americanbanker.com/news/dakota-applies-for-trust-bank-charter-to-issue-stablecoins", "title": {"tr": "Dakota, sabit coin ihraç edebilmek için sınırlı yetkili ulusal banka ruhsatına başvurdu", "en": "Dakota applied for a national trust bank charter so it can issue stablecoins"}, "publishedDate": "2026-08-03"}], "title": {"en": "The charter that lets issuance start before the rules are written", "tr": "Kurallar yazılmadan ihracın başlamasına izin veren ruhsat"}, "writer": "eco-06", "n": 3, "date": "2026-08-03"}, {"writer": "eco-01", "title": {"tr": "Doları 158,9'dan 157,6'ya indiren alıcı piyasanın kendisi değildi", "en": "The buyer that took the dollar from 158.9 to 157.6 was not the market"}, "excerpt": {"tr": "Kur, bir seansın son saatinde 1,3 yen değer kazandı. Hareketin arkasında beklentilerin değişmesi değil, mekaniği anlatılmış bir resmî alım vardı; ikisinin ömrü aynı olmuyor.", "en": "The exchange rate moved 1.3 yen in the closing hour of a session. Behind it was not a change in expectations but an official purchase whose mechanics have been described, and the two do not last equally long."}, "sections": [{"h": {"tr": "Fiyatı taşıyan emir kimin", "en": "Whose order carried the price"}, "ps": [{"tr": "Nikkei Asia'nın aktardığına göre New York Federal Rezerv Bankası, ABD Hazinesi adına Goldman Sachs ve Morgan Stanley üzerinden euro satıp yen aldı. Dolar, New York seansının sonuna doğru 158,9 yenden 157,6 yene indi; parite son haftalarda 1986'dan bu yana en yüksek düzey olan 164 yene yaklaşmıştı. Resmî bir tutar açıklanmadı, ancak Hazine Bakanı Scott Bessent'in not defterinde 5 ila 10 milyar dolar tutarında yen alımını gösteren bir satır göründü.", "en": "Nikkei Asia reports that the Federal Reserve Bank of New York sold euros for yen on behalf of the US Treasury through Goldman Sachs and Morgan Stanley. The dollar fell from about 158.9 yen to about 157.6 towards the end of the New York session, after approaching 164 yen in recent weeks, its strongest level against the Japanese currency since 1986. No official amount was published, though Treasury Secretary Scott Bessent's notepad showed a line indicating yen purchases of 5 to 10 billion dollars.", "refs": ["yen-operation"]}, {"tr": "Bu, fiyatın kendi kendine yeniden değerlenmesinden farklı bir işlem türü. Alıcı, kâr hedefi olmayan ve tutarını açıklamak zorunda bulunmayan bir kamu kurumu; satış tarafında ise euro var, yani işlem bir üçüncü para birimi üzerinden kuruluyor. Aynı hareketin daha sıradan bir açıklaması da mümkün: hafta sonuna girerken yen aleyhine kurulmuş pozisyonların kapatılması, resmî alımın yarattığı ilk kıpırdanmayı büyütmüş olabilir. Elimizdeki kamuya açık bilgi, bu iki etkinin payını ayırmaya yetmiyor.", "en": "That is a different kind of transaction from a price repricing itself. The buyer is a public institution with no profit target and no obligation to disclose its size, and the sell side is the euro, so the trade runs through a third currency. A more ordinary explanation of the same move is also available: positions built against the yen being closed into the weekend may have amplified the first ripple the official purchase created. The public information available does not let us separate the two shares.", "refs": ["yen-operation"]}]}, {"h": {"tr": "Ölçek karşılaştırması ne söylüyor", "en": "What the comparison of scale says"}, "ps": [{"tr": "Ölçekler eşit değil. Japonya perşembe günü kendi alımını yaptı ve bu işlemlerin toplamı 58,97 milyar dolar düzeyine kadar çıktı; Tokyo cuma günü New York işlem saatlerinde ikinci kez devreye girdi. Washington tarafında ise açıklanmış tek rakam, bir not defterinde görülen 5 ila 10 milyar dolar aralığı. ABD'nin yene doğrudan destek verdiği son tarih 2011, yani depremin ve tsunaminin ardından gelen dönem.", "en": "The scales are not equal. Japan bought yen on Thursday in operations that may have totalled as much as 58.97 billion dollars, and Tokyo stepped in a second time on Friday during New York hours. On the Washington side the only figure in circulation is the 5 to 10 billion dollar range seen on a notepad. The last time the United States supported the yen directly was 2011, in the period after the earthquake and tsunami.", "refs": ["yen-operation"]}, {"tr": "Buradan bir yön tahmini çıkmaz, ama izlenebilir bir eşik çıkar. Eylül sonuna kadar dolar/yen, açıklanmış yeni bir resmî işlem olmadan yeniden 164 seviyesine yaklaşırsa, cuma günkü adım eğilimi çeviren değil belirli bir bölgeyi savunan bir müdahale olarak okunacaktır. Bunun tersi de aynı ölçüde bilgi verir: parite bu aralığın altında kalır ve Tokyo yeni bir alım açıklamazsa, tek bir işlemin beklentiyi değiştirmeye yettiği savı güçlenir. Sinyal, tarafların açıkladığı bir sonraki resmî müdahale rakamı ve bu süre boyunca kurun izlediği bant.", "en": "None of this yields a direction, but it does yield a threshold that can be watched. If dollar-yen returns towards 164 before the end of September without a further disclosed official operation, Friday's step will read as a defence of a particular area rather than a turn in the trend. The reverse is just as informative: if the rate stays below that range and Tokyo announces no new purchase, the case that a single operation was enough to move expectations grows stronger. The signal is the next official intervention figure either side publishes, and the band the rate holds in the meantime.", "refs": ["yen-operation"]}]}], "sources": [{"key": "yen-operation", "kind": "news", "name": "Nikkei Asia", "url": "https://asia.nikkei.com/business/markets/currencies/us-treasury-intervenes-to-support-the-yen-after-japan-steps-in-ft-reports", "title": {"tr": "ABD Hazinesi on yılı aşkın sürenin ardından yen alarak kur piyasasına girdi", "en": "The US Treasury bought yen for the first time in more than a decade"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-02", "title": {"tr": "Tahsilatı hızlandıran vergi nerede alındı?", "en": "Where was the tax that accelerated the collection actually levied?"}, "excerpt": {"tr": "Hindistan'ın temmuz dolaylı vergi tahsilatı yüzde 15,4 arttı. Aynı tahsilatın iki kalemi ise çok farklı hızlarda büyüdü ve bu fark, harcamanın nerede yapıldığını anlatıyor.", "en": "India's indirect tax take rose 15.4 percent in July. The two components of that same collection grew at very different speeds, and the gap says something about where the spending happened."}, "sections": [{"h": {"tr": "Tek başlık, iki hız", "en": "One headline, two speeds"}, "ps": [{"tr": "Temmuzda brüt mal ve hizmet vergisi tahsilatı 2,11 trilyon rupiye çıktı; bir yıl önce 1,83 trilyon rupiydi. Manşetin altında iki ayrı seri var: yurt içinden toplanan brüt vergi yüzde 10,1 artışla 1,45 trilyon rupi olurken, ithalattan alınan brüt vergi yüzde 28,8 artışla yaklaşık 665,1 milyar rupiye ulaştı. İadeler sonrası net tahsilat yüzde 15,8 arttı ve net ithalat kalemindeki artış yüzde 30,3'e çıktı.", "en": "Gross goods and services tax collections came to 2.11 trillion rupees in July, against 1.83 trillion a year earlier. Underneath the headline sit two separate series: gross domestic collections rose 10.1 percent to 1.45 trillion rupees, while gross collections on imports rose 28.8 percent to about 665.1 billion. Net of refunds the total was up 15.8 percent, and the net import component rose 30.3 percent.", "refs": ["india-gst"]}, {"tr": "Bu iki kalem aynı ekonomik olayı ölçmüyor. İthalat vergisi sınırda, malın gümrük değeri üzerinden tahsil ediliyor; yurt içi kalem ise ülke içindeki katma değere bağlı. İkisi arasındaki 18 puanlık büyüme farkı, vergilendirilen akışın ağırlıklı olarak dışarıdan geldiğine işaret ediyor. Bunun tek açıklaması iç talebin ithal mala kayması değil: kur ya da fiyat etkisi ithalatın rupi cinsinden değerini yukarı çekebilir, gümrük tarifelerinde beklenen bir değişiklikten önce stok yapılması da aynı sonucu birkaç ay boyunca üretebilir. Aylık tahsilat verisi bu ihtimalleri birbirinden ayırmıyor.", "en": "The two lines do not measure the same economic event. Import tax is collected at the border on the customs value of goods, while the domestic line depends on value added inside the country. The 18-point gap in growth points to the taxed flow arriving largely from abroad. A shift of domestic demand towards imported goods is not the only reading: an exchange rate or price effect can lift the rupee value of imports, and stockpiling ahead of an expected tariff change can produce the same result for a few months. A monthly collection series does not separate those possibilities.", "refs": ["india-gst"]}]}, {"h": {"tr": "Manşetin altındaki kümülatif rakam", "en": "The cumulative figure beneath the headline"}, "ps": [{"tr": "Nisan-temmuz döneminin tamamına bakıldığında brüt tahsilat yüzde 10,1, net tahsilat yüzde 9,2 artmış durumda. Yani mali yılın ilk dört ayının ortalaması, temmuzun tek başına gösterdiği yüzde 15,4'ün belirgin biçimde altında. Bir aylık hızlanma henüz bir eğilim değil; dört aylık ortalama ile tek ay arasındaki bu fark, temmuz rakamını bir dönüm noktası saymadan önce beklemeyi gerektiriyor.", "en": "Across April to July as a whole, gross collections are up 10.1 percent and net collections 9.2 percent. The average for the first four months of the fiscal year therefore sits well below the 15.4 percent that July shows on its own. One month of acceleration is not yet a trend, and the distance between the four-month average and the single month argues for waiting before treating July as a turning point.", "refs": ["india-gst"]}, {"tr": "Yurt içi tarafın nasıl okunacağı da tek bir seriden çıkmıyor. Aynı ay içinde Maruti Suzuki, yurt içi binek araç satışını yüzde 43,4 artırarak 196.203 adede taşıdı ve toplam yurt içi satışta şirket rekoru kırdı. Yurt içi verginin yüzde 10,1 artarken dayanıklı tüketim malında bu ölçekte bir hacim artışının görülmesi, tahsilatın ürün bileşimine ve vergi oranlarına duyarlı olduğunu hatırlatıyor. İzlenecek işaret basit: ağustos ve eylül tahsilatlarında ithalat kaleminin yurt içi kalemin üzerinde büyümeye devam edip etmediği.", "en": "How to read the domestic side does not follow from one series either. In the same month Maruti Suzuki lifted domestic passenger vehicle sales 43.4 percent to 196,203 units and set a company record for total domestic sales. Domestic tax growing 10.1 percent while a durable good posts volume growth on that scale is a reminder that the collection is sensitive to product mix and to tax rates. The signal to watch is straightforward: whether the import line keeps outgrowing the domestic line in the August and September collections.", "refs": ["india-gst", "maruti-july-volumes"]}]}], "sources": [{"key": "india-gst", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/economy/news/gst-collections-rise-15-percent-to-rs-2-11-trillion-in-july-126080100511_1.html", "title": {"tr": "Hindistan'ın temmuz GST tahsilatı yüzde 15,4 artarak 2,11 trilyon rupiye çıktı", "en": "India's July GST receipts rose 15.4 percent to 2.11 trillion rupees"}, "publishedDate": "2026-08-01"}, {"key": "maruti-july-volumes", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/companies/news/maruti-suzuki-logs-record-july-domestic-pv-sales-jumps-34-to-241-421-unit-126080100614_1.html", "title": {"tr": "Maruti Suzuki'nin temmuz satışları 241.421 adede çıkarak yüzde 34 arttı", "en": "Maruti Suzuki's July sales rose 34 percent to 241,421 units"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-03", "title": {"tr": "Rekor hacim, 400 baz puan eriyen marj", "en": "Record volume, a margin down 400 basis points"}, "excerpt": {"tr": "Maruti Suzuki haziran çeyreğinde tarihinin en yüksek satış adedine ulaştı ve net satışını yüzde 36,4 artırdı. Aynı çeyrekte net kârı geriledi; farkı taşıyan tek bir gider satırı var.", "en": "Maruti Suzuki reached its highest ever quarterly volume in the June quarter and lifted net sales 36.4 percent. In the same quarter net profit fell, and a single cost line carries the difference."}, "sections": [{"h": {"tr": "Gelirden kâra giden yolda ne oldu", "en": "What happened between revenue and profit"}, "ps": [{"tr": "Haziranda biten çeyrekte net satışlar yüzde 36,4 artışla yaklaşık 499,6 milyar rupiye çıktı ve satış adedi yüzde 29,3 artışla 682.724'e ulaşarak çeyrek rekoru kırdı. Buna karşılık solo net kâr yüzde 10,8 gerileyerek yaklaşık 33,5 milyar rupiye, vergi öncesi kâr yüzde 11,5 düşüşle yaklaşık 43,4 milyar rupiye indi. Faaliyet FAVÖK marjı bir yıl önceki yüzde 12,6 düzeyinden yüzde 8,6'ya geriledi.", "en": "In the quarter to June net sales rose 36.4 percent to about 499.6 billion rupees, and volumes set a quarterly record at 682,724 units, up 29.3 percent. Standalone net profit nonetheless fell 10.8 percent to roughly 33.5 billion rupees and profit before tax dropped 11.5 percent to about 43.4 billion. The operating EBITDA margin narrowed to 8.6 percent from 12.6 percent a year earlier.", "refs": ["maruti-q1"]}, {"tr": "Gider kalemlerine tek tek bakıldığında marjı taşıyan satır kendini gösteriyor. Hammadde maliyeti net satışların yüzde 74,5'inden yüzde 80,5'ine çıktı; bu 600 baz puanlık bir kayma. Aynı çeyrekte personel gideri yüzde 5,6'dan yüzde 4,9'a, diğer giderler yüzde 12,7'den yüzde 11,0'e indi. Yani ölçek büyümesinin sabit giderler üzerindeki bilinen etkisi çalıştı, girdi tarafında ise ters yönde ve daha büyük bir hareket oldu. 400 baz puanlık marj kaybı, 600 baz puanlık girdi artışının diğer kalemlerdeki iyileşmeyle kısmen dengelenmiş hâli.", "en": "Going through the cost lines one by one shows which of them carries the margin. Material costs went from 74.5 percent of net sales to 80.5 percent, a shift of 600 basis points. In the same quarter employee costs fell from 5.6 percent to 4.9 percent and other expenses from 12.7 percent to 11.0 percent. The familiar effect of scale on fixed costs did its work, while the input side moved the other way and by more. The 400 basis points of margin loss are what remains once a 600 basis point rise in inputs is partly offset by the improvement elsewhere.", "refs": ["maruti-q1"]}]}, {"h": {"tr": "Yönetimin gerekçesi ve sınanamayan alternatif", "en": "Management's explanation and the alternative that cannot be tested"}, "ps": [{"tr": "Şirket, hammadde maliyetlerinin çeyrek içinde yükselmeye başladığını ve Batı Asya'daki çatışmanın ardından sert biçimde arttığını bildirdi. Bu açıklamanın tek başına yeterli sayılması güç, çünkü aynı çeyrekte ürün bileşimi de değişti: çok amaçlı araç satışı yüzde 44,6, ihracat yüzde 28,6 arttı ve pazar payı 2,3 puan yükselerek yüzde 41,2 oldu. Farklı segmentlerin araç başına malzeme içeriği aynı değildir ve 2,3 puanlık pay kazancının fiyatlamayla ilişkisi kamuya açıklanan bu tabloda görünmüyor. Girdi fiyatı, bileşim ve fiyatlama etkilerinin ağırlığını bu açıklama setiyle ayırmak mümkün değil.", "en": "The company reported that material costs started rising during the quarter and increased sharply after the outbreak of the West Asia conflict. That explanation is hard to treat as sufficient on its own, because the product mix also changed in the same quarter: utility vehicle sales rose 44.6 percent, exports 28.6 percent, and market share gained 2.3 percentage points to reach 41.2 percent. Different segments do not carry the same material content per vehicle, and how the 2.3-point share gain relates to pricing is not visible in the disclosure set published here. Separating the weight of input prices, mix and pricing is not possible from these figures.", "refs": ["maruti-q1"]}, {"tr": "Sınama, hacimden çok tek bir orana bakılarak yapılabilir. Temmuzda satış yüzde 34 artışla 241.421 adede, yurt içi binek araç satışı yüzde 43,4 artışla 196.203 adede çıktı ve yurt içi toplamda şirket rekoru kırıldı; yani çeyrek sonrasında talep tarafında bir kırılma görünmüyor. Bayi stokunun yaklaşık 13 gün olması da kanalın şişmediğini gösteriyor. Asıl gözlem, sonraki çeyrek tablosunda hammadde maliyetinin net satışlara oranının yüzde 80,5'ten geri çekilip çekilmediği olacak. Bu oran yerinde kalır ve hacim de korunursa, marj daralması kalıcı bir maliyet tabanına dönüşmüş demektir.", "en": "What has to be watched next is a ratio rather than a volume. July sales rose 34 percent to 241,421 units, domestic passenger vehicle sales rose 43.4 percent to 196,203, and the company set a record for total domestic sales, so demand shows no break after the quarter. Dealer inventory of about 13 days suggests the channel is not stuffed either. The observation that matters is whether the next quarterly statement shows material costs retreating from 80.5 percent of net sales. If that ratio holds while volumes hold too, the margin compression has settled into a lasting cost base.", "refs": ["maruti-q1", "maruti-july-volumes"]}]}], "sources": [{"key": "maruti-q1", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/amp/markets/capital-market-news/maruti-suzuki-q1-pat-slides-11-yoy-as-commodity-costs-rise-126080100206_1.html", "title": {"tr": "Maruti Suzuki'nin çeyrek net kârı yüzde 10,8 gerilerken net satışları yüzde 36,4 arttı", "en": "Maruti Suzuki's quarterly net profit fell 10.8 percent as net sales rose 36.4 percent"}, "publishedDate": "2026-08-01"}, {"key": "maruti-july-volumes", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/companies/news/maruti-suzuki-logs-record-july-domestic-pv-sales-jumps-34-to-241-421-unit-126080100614_1.html", "title": {"tr": "Maruti Suzuki'nin temmuz satışları 241.421 adede çıkarak yüzde 34 arttı", "en": "Maruti Suzuki's July sales rose 34 percent to 241,421 units"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-04", "title": {"tr": "Posco'nun 23.000 tonu, Salta'daki kapasite devreye girene kadar kâğıtta duruyor", "en": "Posco's 23,000 tonnes stay on paper until the Salta capacity runs"}, "excerpt": {"tr": "Arjantin ile Güney Kore arasındaki kritik mineral ortaklığı bir yatırım rakamı ve bir üretim hedefi ile duyuruldu. Arjantin'de aradaki mesafeyi tesisin ve taşımanın takvimi belirliyor.", "en": "The critical minerals partnership between Argentina and South Korea was announced with an investment figure and an output target. In Argentina the distance between the two is set by the timetable of the plant and the transport."}, "sections": [{"h": {"tr": "İmza ile ilk ton arasındaki mesafe", "en": "The distance between the signature and the first tonne"}, "ps": [{"tr": "Cumhurbaşkanı Javier Milei ile Güney Kore Devlet Başkanı Lee Jae Myung'un 31 Temmuz'daki görüşmesinin ardından duyurulan ortaklık, kritik minerallerin aranması, çıkarılması, işlenmesi ve rafinasyonunu kapsıyor. Somut kalem şu: Güney Koreli Posco'nun Salta'da lityum çıkarımını genişletmesine onay verildi. Yatırım 547 milyon dolar, öngörülen üretim yılda 23.000 ton lityum karbonat, beklenen yıllık ihracat 300 milyon dolar üzerinde. Arjantin dünyanın beşinci büyük lityum üreticisi.", "en": "The partnership announced after the 31 July meeting between President Javier Milei and South Korean President Lee Jae Myung covers the exploration, extraction, processing and refinement of critical minerals. The concrete item is this: South Korea's Posco was approved to expand lithium extraction in Salta. The investment is 547 million dollars, projected output 23,000 tonnes of lithium carbonate a year, and expected exports more than 300 million dollars a year. Argentina is the world's fifth-largest lithium producer.", "refs": ["korea-argentina-minerals"]}, {"tr": "Onaylanmış kapasite ile çalışan arz arasında bir zaman farkı var. Bir lityum genişletmesinde belirleyici adım, yeraltındaki tuzlu suyu yılda 23.000 tona çeviren işleme kapasitesinin devreye alınma tarihidir. Duyuruda bir devreye alma tarihi yer almıyor; dolayısıyla bu tonaj, takvimi açıklanana kadar piyasa dengesine giren bir arz olarak sayılamaz. Bunun daha iyimser bir okuması da var: mevcut bir sahanın genişletilmesi, sıfırdan kurulan bir projeye göre çok daha kısa sürede üretime geçebilir. İki okumayı ayıracak veri, açıklanacak devreye alma takvimidir.", "en": "A gap in time separates approved capacity from operating supply. The step that decides a lithium expansion is the commissioning date of the processing capacity that turns the brine underground into 23,000 tonnes a year. The announcement gives no commissioning date, so this tonnage cannot be counted as supply entering the market balance until that timetable is published. There is a more optimistic reading too: expanding an existing operation can reach production far sooner than a project built from nothing. The data that would separate the two readings is the commissioning schedule when it appears.", "refs": ["korea-argentina-minerals"]}]}, {"h": {"tr": "Aynı kısıt, ikinci havzada", "en": "The same constraint in a second basin"}, "ps": [{"tr": "Arjantin'in diğer kaynak havzasında da bağlayıcı adım aynı yerde duruyor. Neuquén eyaleti Vaca Muerta'da 15 blok için ihale açtı ve teklifler 19 Ağustos'ta açılacak; Harold Hamm'in Continental Resources'ı bu bloklar için yarışıyor. Havza hâlihazırda günde bir milyon varilin üzerinde petrol ve gaz üretiyor, ancak üretimin artırılmasını mümkün kılacak olan gelecek yıl devreye girecek VMOS ihracat boru hattı ve limanı. Her iki durumda da bağlayıcı adım, çıkarılanı işleyen ya da dışarı taşıyan kapasitede duruyor.", "en": "In Argentina's other resource basin the binding step sits in the same place. Neuquén province has opened an auction for 15 blocks in Vaca Muerta with bids opening on 19 August, and Harold Hamm's Continental Resources is competing for them. The basin already produces more than a million barrels a day of oil and gas, but what will allow output to rise is the VMOS export pipeline and port due to start next year. In both cases the binding step sits in the capacity that processes what is extracted or moves it out.", "refs": ["vaca-muerta-auction", "korea-argentina-minerals"]}, {"tr": "Alıcı tarafında da tek bir sahaya bağlılık azalıyor. Lee, 30 Temmuz'da Şili ile aynı içerikte bir kritik mineral ortaklığı duyurmuştu; Şili bakırda dünya birincisi, lityumda ikinci sırada. İki ülkeyle bir hafta içinde imzalanan iki ortaklık, Kore'nin tedarikini tek bir üreticiye bağlamadığını gösteriyor. Önümüzdeki dönemde izlenecek iki somut işaret var: Neuquén'in 19 Ağustos'ta açılacak tekliflerinden çıkacak saha tahsisleri ve VMOS'un ilan edilen takvime uyup uymadığı. Bunlardan ilki sermayenin hangi hızla bağlandığını, ikincisi ise çıkarılan hacmin ne zaman piyasaya ulaşacağını gösterecek.", "en": "On the buying side, dependence on a single field is also easing. Lee announced an identical critical minerals partnership with Chile on 30 July; Chile leads the world in copper and ranks second in lithium. Two partnerships signed with two countries inside a week show that Korea is not tying its supply to one producer. Two concrete signals are worth following from here: the block awards that come out of Neuquén's bid opening on 19 August, and whether VMOS keeps to its announced schedule. The first shows how fast capital is being committed, the second when extracted volume actually reaches the market.", "refs": ["vaca-muerta-auction", "korea-argentina-minerals"]}]}], "sources": [{"key": "korea-argentina-minerals", "kind": "news", "name": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/argentina-and-south-korea-announce-critical-minerals-partnership.phtml", "title": {"tr": "Arjantin ile Güney Kore kritik mineral ortaklığı ilan etti, Posco'ya Salta'da genişleme onayı verildi", "en": "Argentina and South Korea announced a critical minerals partnership, with Posco cleared to expand in Salta"}, "publishedDate": "2026-08-01"}, {"key": "vaca-muerta-auction", "kind": "news", "name": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/oil-billionaire-hamm-seeks-to-expand-in-argentinas-shale-patch.phtml", "title": {"tr": "Continental Resources, Neuquén'in 15 kaya sahası ihalesine talip oldu", "en": "Continental Resources is bidding for 15 shale blocks in Neuquén's auction"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-05", "title": {"tr": "34 milyar euro, 5,6 milyar euro fazlanın hemen yanında duruyor", "en": "34 billion euros stand right beside a 5.6 billion euro surplus"}, "excerpt": {"tr": "İrlanda'nın sorunlu varlık kurumu 16 yılın ardından kapandı ve devlete 5,6 milyar euro fazla devretti. Kapanış hesabı bu fazlayı gösteriyor; aynı krizin geri alınamayan 34 milyar euro kalemi başka bir sayfada duruyor.", "en": "Ireland's bad bank closed after 16 years and handed a 5.6 billion euro surplus back to the state. The closing account shows that surplus; the 34 billion euros of the same crisis that were never recovered sit on a different page."}, "sections": [{"h": {"tr": "Kapanış hesabında görünen rakam", "en": "The figure the closing account shows"}, "ps": [{"tr": "2009 sonunda kurulan Ulusal Varlık Yönetim Ajansı bu hafta sonu kapandı. Kurum, nominal değeri 74 milyar euro olan kredileri 32 milyar euroya, yani yüzde 58 iskontoyla devralmıştı ve kapanışta kurumlar vergisi dâhil 5,6 milyar euro fazlayı devlete devretti. Kalan sekiz çalışan, Ulusal Hazine Yönetim Ajansı bünyesindeki bir tasfiye biriminde görevini sürdürüyor; kurumun genel müdürü Brendan McDonagh kapanıştan sonra danışman olarak kaldı.", "en": "The National Asset Management Agency, set up in late 2009, closed this weekend. It had taken on loans with a face value of 74 billion euros for 32 billion, a discount of 58 percent, and at the close it returned a surplus of 5.6 billion euros to the state including corporation tax. Its last eight staff continue in a resolution unit inside the National Treasury Management Agency, and chief executive Brendan McDonagh stayed on as an adviser after the wind-up.", "refs": ["nama-closure"]}, {"tr": "Aynı krizin ikinci kalemi bu hesapta görünmüyor. Irish Nationwide ile Anglo Irish Bank tasfiye edildi ve vergi mükelleflerine 34 milyar euro kalıcı zarar bıraktı; AIB ile Bank of Ireland ise yeniden yapılandırılıp tahvil piyasasına döndü. İki rakam aynı kamu bütçesine ait, ama farklı kurumların defterinde ve farklı zamanlarda duyuruluyor. Kapanış manşetinde 5,6 milyar euro var; geri alınamayan 34 milyar euro ise bir kapanış duyurusu üretmiyor.", "en": "The second item from the same crisis does not appear in that account. Irish Nationwide and Anglo Irish Bank were liquidated, leaving a permanent 34 billion euro loss for taxpayers, while AIB and Bank of Ireland were restructured and returned to the bond markets. Both figures belong to the same public budget, but they sit on the books of different institutions and are announced at different times. The closing headline carries 5.6 billion euros; the 34 billion euros that were never recovered produce no closing announcement of their own.", "refs": ["nama-closure"]}]}, {"h": {"tr": "Fazlayı mümkün kılan koşul", "en": "The condition that made the surplus possible"}, "ps": [{"tr": "5,6 milyar euro, yüzde 58 iskontoyla alınmış bir varlık portföyünün getirisi. Bu iskonto, devletin başka alıcının bulunmadığı bir anda alıcı olmasıyla mümkün oldu; yani fazla, kamunun taşıdığı riskin karşılığı. Karşı argümanı da olduğu gibi söylemek gerekir: yeniden sermayelendirme yapılmasaydı zararın bir bölümünü mevduat sahipleri ve ödeme sistemi taşıyacaktı, ki bu maliyetin nerede biteceği hiç hesaplanmadı. Fazlanın varlığı bu tercihi ucuz kılmıyor, yalnızca faturanın bir bölümünün geri döndüğünü gösteriyor.", "en": "The 5.6 billion euros is the return on a portfolio bought at a 58 percent discount. That discount was available because the state became the buyer at a moment when no one else was, so the surplus is the counterpart of the risk the public carried. The counterargument deserves to be stated plainly: without recapitalisation, part of the loss would have fallen on depositors and the payments system, and where that cost would have stopped was never calculated. The existence of a surplus does not make the choice cheap; it shows that part of the bill came back.", "refs": ["nama-closure"]}, {"tr": "Kapanış hesabında bulunmayan şey, bu 16 yılın yükünü hangi hane halklarının taşıdığı. RTÉ'nin anlatımı müteahhitlerin dosyalarını ve bankaların kaderini izliyor; kredi tarafındaki isimler biliniyor, uyum döneminin gelir grupları arasındaki dağılımı ise bu duyurunun konusu değil. Bu nedenle önümüzdeki dönemde tek bir somut şey izlenebilir: NTMA bünyesindeki tasfiye biriminin, devredilen fazla ile banka tasfiyelerinden doğan zararı tek bir tabloda birleştiren nihai bir rakam yayımlayıp yayımlamayacağı. İki rakam ayrı kaldığı sürece kamuoyu, aynı krizin maliyetini yalnızca iyi biten yarısından okuyacak.", "en": "What the closing account does not contain is which households carried the weight of those 16 years. The RTÉ account follows the developers' files and the fate of the banks; the names on the credit side are known, while how the adjustment was distributed across income groups is not what this announcement is about. One concrete thing can therefore be watched from here: whether the resolution unit inside the NTMA publishes a final figure that brings the returned surplus and the losses from the bank liquidations into a single table. As long as the two numbers stay apart, the public will read the cost of one crisis from the half of it that ended well.", "refs": ["nama-closure"]}]}], "sources": [{"key": "nama-closure", "kind": "news", "name": "RTÉ", "url": "https://www.rte.ie/news/analysis-and-comment/2026/0801/1585993-nama-the-developers-the-banks-and-the-fallout/", "title": {"tr": "İrlanda'nın sorunlu varlık kurumu NAMA 16 yılın ardından kapandı", "en": "Ireland's bad bank NAMA closed after 16 years"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-06", "title": {"tr": "Bu yapı her 140 günde bir yeniden borçlanmanın sorunsuz geçmesine bağlı", "en": "This structure depends on a refinancing clearing every 140 days"}, "excerpt": {"tr": "Katılım bankalarının ilk yarıdaki kira sertifikası ihracı 119,5 milyar lira. Asıl bilgi, dolaşımdaki stokun ve ortalama vadenin birlikte anlattığı devir hızında.", "en": "Participation banks issued 119.5 billion lira of sukuk in the first half. The information sits in the turnover that the outstanding stock and the average maturity describe together."}, "sections": [{"h": {"tr": "Tutarın önünde duran vade", "en": "The maturity that stands in front of the amount"}, "ps": [{"tr": "Türkiye Katılım Bankaları Birliği verilerine göre katılım bankaları yılın ilk yarısında 119,5 milyar lira kira sertifikası ihraç etti. 2013'ten bu yana toplam ihraç 861,5 milyar lira oldu, piyasada dolaşımda olan tutar 68,3 milyar lira ve ihraçların ortalama vadesi 139,97 gün. Kuruluş bazında 2013'ten bu yana Ziraat Katılım 197,8 milyar lira, Albaraka Türk 167,3 milyar lira, Türkiye Emlak Katılım 152 milyar lira ve Vakıf Katılım 144,7 milyar lira ihraç yaptı.", "en": "Data from the Participation Banks Association of Türkiye show participation banks issued 119.5 billion lira of sukuk in the first half. Cumulative issuance since 2013 reached 861.5 billion lira, the amount outstanding in the market is 68.3 billion lira, and the average maturity of the issues is 139.97 days. By institution, since 2013 Ziraat Katılım has issued 197.8 billion lira, Albaraka Türk 167.3 billion lira, Türkiye Emlak Katılım 152 billion lira and Vakıf Katılım 144.7 billion lira.", "refs": ["tkbb-sukuk"]}, {"tr": "Bu üç sayı bir arada okunduğunda ortaya bir devir hızı çıkıyor. Altı ayda 119,5 milyar lira ihraca karşılık dolaşımdaki stok 68,3 milyar lira; yani stok yarıyılın içinde birden fazla kez yenileniyor. 139,97 günlük ortalama vade de aynı şeyi başka bir yerden söylüyor. Bu, sürekli yenilenen kısa vadeli fonlamanın aritmetiği. Daha yumuşak bir okuma da mümkün: kısa vade, likidite yönetimi aracı olarak alıcı tarafça talep edilen bir özellik olabilir. Bu veri seti ikisini ayırmıyor.", "en": "Read together, those three numbers describe a turnover rate. Against 119.5 billion lira issued in six months, the stock outstanding is 68.3 billion lira, so the stock is renewed more than once within the half-year. An average maturity of 139.97 days says the same thing from a different angle. This is the arithmetic of continuously renewed short-term funding. A softer reading is available: a short maturity may be a feature the buy side demands as a liquidity management tool. This data set does not separate the two.", "refs": ["tkbb-sukuk"]}]}, {"h": {"tr": "Yenileme durursa ne olur, tampon nerede", "en": "What happens if the renewal stops, and where the buffer is"}, "ps": [{"tr": "Böyle bir yapıda sorunun kaynağı, bir sonraki ihracın alıcısının çekilmesidir. Zincir önce fiyattan geçer: yenileme talebi zayıfladığında etki önce getiride, ancak ondan sonra hacimde görünür. Yoğunlaşma da burada anlam kazanıyor. 2013'ten bu yana yapılan 861,5 milyar lira ihracın 661,8 milyar lira kadarı, yani yaklaşık dörtte üçü dört kuruluşa ait. Bu dört kuruluşun aynı anda aynı yatırımcı tabanına yönelmesi, talebin farklı kaynaklara dağıldığı bir yapıya göre daha az esneklik bırakır.", "en": "In a structure like this the source of trouble is the buyer of the next issue stepping back. The chain runs through price first: when renewal demand weakens, the effect shows up in the yield before it shows up in volume. Concentration matters here too. Of the 861.5 billion lira issued since 2013, 661.8 billion lira, roughly three-quarters, belongs to four institutions. Those four turning to the same investor base at the same time leaves less flexibility than a structure in which demand is spread across different sources.", "refs": ["tkbb-sukuk"]}, {"tr": "Karşı tarafta duran tamponlar da dürüstçe sayılmalı. Dolaşımdaki 68,3 milyar lira, bu bankaların toplam fonlaması içinde küçük bir kalem olabilir; bu durumda başarısız bir ihraç bir fiyat olayıdır, bir çekilme değil. Ancak mevduat tabanının vadesi gelen stoku ne ölçüde karşıladığı bu veri setinde yok, dolayısıyla tamponun büyüklüğü buradan ölçülemiyor. Sınanabilir tek eşik şu: Türkiye Katılım Bankaları Birliği'nin bir sonraki yarıyıl açıklamasında ortalama vade 139,97 günün belirgin biçimde altına inerse, kısa vadeyi bir kısıt olarak okumak gerekir. Vade uzar ve dolaşımdaki tutar aynı kalırsa, tersi geçerli olur.", "en": "The buffers on the other side deserve an honest count as well. The 68.3 billion lira outstanding may be a small item within these banks' total funding, in which case a failed issue is a pricing event and not a withdrawal. But how far the deposit base covers the maturing stock is absent from this data set, so the size of that buffer cannot be measured from here. One threshold is testable: if the average maturity in the next half-year statement from the Participation Banks Association of Türkiye falls clearly below 139.97 days, the short maturity has to be read as a constraint. If the maturity lengthens while the amount outstanding holds, the opposite applies.", "refs": ["tkbb-sukuk"]}]}], "sources": [{"key": "tkbb-sukuk", "kind": "news", "name": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/katilim-bankalari-yilin-ilk-yarisinda-119-5-milyar-liralik-sukuk-ihrac-etti/4015593", "title": {"tr": "Katılım bankaları yılın ilk yarısında 119,5 milyar lira kira sertifikası ihraç etti", "en": "Türkiye's participation banks issued 119.5 billion lira of sukuk in the first half"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-01", "title": {"tr": "İkinciliği 2.563 adet belirledi", "en": "A gap of 2,563 units settled second place"}, "excerpt": {"tr": "Hindistan'ın temmuz binek araç toptan satışlarında yıllık artışlar iri görünüyor. Sıralamayı belirleyen fark 2.563 adet ve bu farkın arkasında iki ayrı haziran tabanı duruyor.", "en": "The annual gains in India's July passenger vehicle wholesales look big. The gap that settled the ranking is 2,563 units, and behind it stand two separate June bases."}, "sections": [{"h": {"tr": "Sıralamayı ne belirledi", "en": "What settled the ranking"}, "ps": [{"tr": "Temmuzda Maruti Suzuki 196.203, Tata 62.611, Mahindra 60.048 ve Hyundai 54.210 adet bildirdi. Yıllık artışlar Tata'da yüzde 58,42, Maruti'de yüzde 42,41, Hyundai'de yüzde 23,30, Mahindra'da yüzde 20,41 oldu. Aylık tarafta tablo başka bir şey gösteriyor: Tata yüzde 0,86 arttı, Mahindra yüzde 0,57 geriledi.", "en": "In July Maruti Suzuki reported 196,203 units, Tata 62,611, Mahindra 60,048 and Hyundai 54,210. Year on year the gains were 58.42 percent at Tata, 42.41 percent at Maruti, 23.30 percent at Hyundai and 20.41 percent at Mahindra. On the monthly side the table shows something else: Tata rose 0.86 percent and Mahindra fell 0.57 percent.", "refs": ["india-pv-july"]}, {"tr": "Tata ile Mahindra arasındaki 2.563 adetlik fark bu iki aylık hareketten çıkıyor. Bir başka açıklama da mümkün: Mahindra'nın haziran hacmi 60.393 adetle kendi güçlü düzeyindeydi, dolayısıyla aylık yüzde 0,57'lik gerileme yüksek bir haziran tabanının sonucu olabilir. Tek aylık seri, hangi açıklamanın geçerli olduğunu ayırt etmeye yetmiyor.", "en": "The 2,563-unit gap between Tata and Mahindra comes out of those two monthly moves. Another explanation is available: Mahindra's June volume of 60,393 units was a strong level for the company, so the 0.57 percent monthly fall could be the result of a high June base. A single month of data is not enough to tell which explanation holds.", "refs": ["india-pv-july"]}]}, {"h": {"tr": "İki haziran, iki farklı ölçüm", "en": "Two Junes, two different measurements"}, "ps": [{"tr": "Hyundai'nin haziran üretimi bir tedarikçi tesisindeki yangın nedeniyle aksadı; hacmi 39.635 adetten 54.210 adede, aylık yüzde 36,77 arttı. Maruti ise haziranın 147.187 adedinden aylık yüzde 33,30 arttı. Yakın görünen bu iki yüzde farklı olayları ölçüyor: biri kesintiye uğramış bir tabandan toparlanma, diğeri normal bir aydan yükseliş.", "en": "Hyundai's June production was disrupted by a fire at a supplier's facility; its volume rose from 39,635 units to 54,210, up 36.77 percent on the month. Maruti rose 33.30 percent on the month from June's 147,187 units. Those two similar-looking percentages measure different events: one is recovery from a disrupted base, the other a rise from an ordinary month.", "refs": ["india-pv-july"]}, {"tr": "Bileşim, sıralamadan daha uzun ömürlü bir bilgi taşıyor. Tata'nın elektrikli araç toptan satışı ilk kez ayda 15.000 adedi aştı; MG'de elektrikli araçlar hacmin yüzde 80'inden fazlasını oluşturdu. Ürün karmasındaki bir kayma, aylık hacim sıralamasından daha yavaş tersine döner. İzlenecek iki işaret buradan geliyor: Tata'nın elektrikli araç adedinin ağustos ve eylülde 15.000'in üzerinde kalması ve Mahindra'nın aylık değişiminin artıya geçmesi.", "en": "Mix carries information with a longer life than the ranking. Tata's electric vehicle wholesales crossed 15,000 in a month for the first time, and at MG electric vehicles made up more than 80 percent of volumes. A shift in product mix reverses more slowly than a monthly volume ranking. That gives two signals to watch: Tata's electric vehicle units staying above 15,000 in August and September, and Mahindra's monthly change turning positive.", "refs": ["india-pv-july"]}]}], "sources": [{"key": "india-pv-july", "kind": "news", "name": "Autocar India", "url": "https://www.autocarindia.com/industry/july-2026-car-sales-tata-holds-slim-lead-over-mahindra-440365", "title": {"tr": "Temmuzda Hindistan binek araç satışında Tata, Mahindra'yı 2.563 adet farkla geçti", "en": "Tata edged past Mahindra by 2,563 units in India's July passenger vehicle sales"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "date": "2026-08-02"}, {"writer": "eco-02", "title": {"tr": "Fiyatı yukarı taşıyan grup politika faizinin uzağında duruyor", "en": "The division pushing prices up sits well away from the policy rate"}, "excerpt": {"tr": "Peru'nun temmuz enflasyonu yıllık yüzde 4,07 ile hedef aralığının dışında kaldı. Aylık artışın ağırlığı gıdad
