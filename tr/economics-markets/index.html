<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  .podcast-label{
    display:none;flex:0 0 auto;color:var(--muted);font-size:.58rem;font-weight:800;
    letter-spacing:.06em;line-height:1;text-transform:uppercase;white-space:nowrap;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    .podcast-label{display:inline-flex}
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .edition-symbol{display:inline;margin-inline-start:.3em}.edition-text{display:inline}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writer-intro-copy{min-width:0}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .radar-stamp{display:block;margin-top:5px;color:var(--muted);font-size:.64rem;
    line-height:1.25;letter-spacing:.02em}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: a full-width shell with a readable prose measure. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .article-prose{max-width:72ch;margin-inline:auto}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(100px,1fr) 140px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }
    #briefsSection .section-title .podcast-icon{
      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }
    #briefsSection .section-title .podcast-bar audio{display:none}
    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:5px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:140px;min-width:0;
      min-height:40px;margin-left:0;padding:5px 15px 5px 4px;font-size:.72rem;
    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .edition-btn .edition-symbol{display:inline;margin-inline-start:0}.edition-btn .edition-text{display:none}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  @media(min-width:501px) and (max-width:640px){
    #briefsSection .section-title .podcast-bar{max-width:250px}
    #briefsSection .section-title .podcast-label{
      display:inline-flex;font-size:.52rem;letter-spacing:.035em;
    }
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }

<p class="summary">ABD&#x27;nin yükselen borçlanma tahmini, Güney Kore&#x27;de ayrışan manşet ve çekirdek oranlar ile İsviçre&#x27;deki düşük enflasyon, üç ekonomide farklı makro bileşimler gösteriyor.</p><small class="radar-stamp"><time datetime="2026-08-04T15:24:14+03:00">15:24 TSİ</time></small></div></article>

<ul>
<li><article><p><strong>Toyota Motor Corporation</strong> · <time datetime="2026-08-04">4 Ağu</time></p><h3 lang="tr"><a href="https://www.sec.gov/Archives/edgar/data/1094517/000119312526331392/d258414dex992.htm" rel="external">Toyota yıl geneli faaliyet kârı öngörüsünü 3,4 trilyon yene çıkardı, dolar varsayımını 160 yene çekti</a></h3><p lang="tr">Toyota, mart 2027&#x27;de biten mali yıl için faaliyet kârı öngörüsünü 400 milyar yen artırarak 3.400,0 milyar yene, satış geliri öngörüsünü ise 3.000,0 milyar yen artırarak 54.000,0 milyar yene yükseltti. Yıl geneli için varsayılan kur, önceki öngörüdeki 150 yenden 160 yene taşındı.</p></article></li>

function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}

ties"}, "crypto": {"tr": "Kripto", "en": "Crypto"}}}, "latestNews": [{"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "In the April-June quarter sales revenue rose 1,272.0 billion yen to 13,525.4 billion yen, while operating income fell 102.6 billion yen to 1,063.4 billion yen. Net income attributable to Toyota rose 635.6 billion yen to 1,477.0 billion yen. Realised rates in the quarter were 160 yen to the dollar and 185 yen to the euro, against 145 and 164 a year earlier. The full-year net income forecast was raised by 250 billion yen to 3,250.0 billion yen and the euro assumption moved to 181 yen from 180 yen. The previous forecast had put sales revenue at 51,000.0 billion yen, operating income at 3,000.0 billion yen and net income at 3,000.0 billion yen.", "tr": "Nisan-haziran çeyreğinde satış geliri 1.272,0 milyar yen artarak 13.525,4 milyar yene çıktı; buna karşılık faaliyet kârı 102,6 milyar yen gerileyerek 1.063,4 milyar yen oldu. Toyota'ya düşen net kâr 635,6 milyar yen artışla 1.477,0 milyar yene ulaştı. Çeyrekte gerçekleşen kurlar dolar başına 160 yen ve euro başına 185 yen; bir yıl önce sırasıyla 145 ve 164 yendi. Yıl geneli net kâr öngörüsü 250 milyar yen artırılarak 3.250,0 milyar yene çıkarıldı, euro varsayımı ise 180 yenden 181 yene alındı. Önceki öngörüde satış geliri 51.000,0 milyar yen, faaliyet kârı 3.000,0 milyar yen ve net kâr 3.000,0 milyar yen olarak veriliyordu."}, "featured": true, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "Toyota Motor Corporation", "summary": {"en": "Toyota lifted its operating income forecast for the year ending March 2027 by 400 billion yen to 3,400.0 billion yen and its sales revenue forecast by 3,000.0 billion yen to 54,000.0 billion yen. The assumed full-year exchange rate moved to 160 yen to the dollar from 150 yen in the previous forecast.", "tr": "Toyota, mart 2027'de biten mali yıl için faaliyet kârı öngörüsünü 400 milyar yen artırarak 3.400,0 milyar yene, satış geliri öngörüsünü ise 3.000,0 milyar yen artırarak 54.000,0 milyar yene yükseltti. Yıl geneli için varsayılan kur, önceki öngörüdeki 150 yenden 160 yene taşındı."}, "tag": "companies", "title": {"en": "Toyota raised its full-year operating income forecast to 3.4 trillion yen and moved its dollar assumption to 160 yen", "tr": "Toyota yıl geneli faaliyet kârı öngörüsünü 3,4 trilyon yene çıkardı, dolar varsayımını 160 yene çekti"}, "topic": "economics-markets", "url": "https://www.sec.gov/Archives/edgar/data/1094517/000119312526331392/d258414dex992.htm", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Reported profit attributable to shareholders was 3.9 billion dollars, against 3.8 billion dollars in the first quarter and 1.6 billion dollars a year earlier. Net debt fell to 22.3 billion dollars at the end of the quarter and the dividend was set at 8.660 cents a share. The quarter carried a net impairment charge of 888 million dollars, taking the half-year total to 1.248 billion dollars. Operating cash flow in the same quarter of last year was 6.3 billion dollars.", "tr": "Hissedarlara düşen raporlanan kâr 3,9 milyar dolar oldu; ilk çeyrekte 3,8 milyar dolar, geçen yılın aynı çeyreğinde 1,6 milyar dolar idi. Çeyrek sonunda net borç 22,3 milyar dolar seviyesine geriledi. Hisse başına temettü 8,660 sent olarak açıklandı. Çeyrekte 888 milyon dolar tutarında net değer düşüklüğü gideri yazıldı; yılın ilk yarısındaki toplam 1,248 milyar dolar oldu. Bir önceki yılın aynı çeyreğinde faaliyetlerden sağlanan nakit 6,3 milyar dolar seviyesindeydi."}, "featured": true, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "BP p.l.c.", "summary": {"en": "BP's underlying replacement cost profit for the second quarter was 5.7 billion dollars, against 3.2 billion dollars in the first quarter and 2.4 billion dollars a year earlier. Cash flow from operations was 10.9 billion dollars.", "tr": "BP'nin ikinci çeyrek yenileme maliyetine göre temel kârı 5,7 milyar dolar oldu; bu tutar ilk çeyrekte 3,2 milyar dolar, bir yıl önceki aynı çeyrekte 2,4 milyar dolar seviyesindeydi. Faaliyetlerden sağlanan nakit 10,9 milyar dolar oldu."}, "tag": "commodities", "title": {"en": "BP's underlying second-quarter profit rose to 5.7 billion dollars and net debt fell to 22.3 billion dollars", "tr": "BP'nin ikinci çeyrek temel kârı 5,7 milyar dolar oldu, net borcu 22,3 milyar dolar seviyesine indi"}, "topic": "economics-markets", "url": "https://www.sec.gov/Archives/edgar/data/313807/000031380726000016/bp-20260630.htm", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The adjusted EBIT margin fell to 3.4 per cent from 8.4 per cent and net income dropped to 123 million euros from 1.0 billion euros. Adjusted free cash flow turned to minus 365 million euros from 138 million euros a year earlier. Network Airlines' adjusted EBIT fell 490 million euros to 137 million euros, and the point-to-point airlines that include Eurowings fell 101 million euros to minus 37 million euros. Lufthansa Technik reported 157 million euros of adjusted EBIT and Lufthansa Cargo 116 million euros, up 43 million euros. The company set its full-year adjusted EBIT range at 1.7 to 2.2 billion euros to reflect volatility in the kerosene price.", "tr": "Düzeltilmiş faaliyet kârı marjı yüzde 8,4'ten yüzde 3,4'e indi, net kâr 1,0 milyar euro seviyesinden 123 milyon euro seviyesine geriledi. Düzeltilmiş serbest nakit akışı bir yıl önceki 138 milyon euro seviyesinden eksi 365 milyon euro seviyesine döndü. Ağ havayollarının düzeltilmiş faaliyet kârı 490 milyon euro azalarak 137 milyon euro, Eurowings'in dahil olduğu noktadan noktaya havayollarının sonucu ise 101 milyon euro azalarak eksi 37 milyon euro oldu. Lufthansa Technik 157 milyon euro, Lufthansa Cargo ise 43 milyon euro artışla 116 milyon euro düzeltilmiş faaliyet kârı bildirdi. Şirket yıl geneli düzeltilmiş faaliyet kârı beklentisini, jet yakıtı fiyatındaki oynaklığı yansıtacak biçimde 1,7-2,2 milyar euro aralığı olarak verdi."}, "featured": true, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "Lufthansa Group", "summary": {"en": "Lufthansa Group's second-quarter revenue rose 8 per cent to 11.1 billion euros while adjusted EBIT fell to 383 million euros from 870 million euros a year earlier. The company booked roughly 750 million euros of additional fuel costs in the quarter.", "tr": "Lufthansa Group'un ikinci çeyrek geliri yüzde 8 artarak 11,1 milyar euro seviyesine çıkarken düzeltilmiş faaliyet kârı bir yıl önceki 870 milyon euro seviyesinden 383 milyon euro seviyesine indi. Şirket, çeyrekte yaklaşık 750 milyon euro ek yakıt gideri yazdı."}, "tag": "companies", "title": {"en": "Lufthansa's quarterly operating profit fell to 383 million euros as the fuel bill climbed", "tr": "Lufthansa'nın çeyreklik faaliyet kârı yakıt faturası nedeniyle 383 milyon euro seviyesine geriledi"}, "topic": "economics-markets", "url": "https://newsroom.lufthansagroup.com/en/lufthansa-group-benefits-from-strong-demand-for-air-travel-and-achieves-an-operating-profit-of-383-million-euros-despite-significantly-higher-fuel-costs/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The operating profit margin rose to 20.9 per cent from 17.3 per cent a year earlier, and the adjusted margin to 21.9 per cent from 17.6 per cent. Profit per share rose to 7.77 dollars from 4.62 dollars, and adjusted profit per share to 8.17 dollars from 4.72 dollars. Enterprise operating cash flow was 4.4 billion dollars in the quarter and the cash position 6.7 billion dollars. The company repurchased 1.5 billion dollars of shares and paid 0.7 billion dollars in dividends.", "tr": "Faaliyet kârı marjı bir yıl önceki yüzde 17,3'ten yüzde 20,9'a çıktı; düzeltilmiş marj yüzde 17,6'dan yüzde 21,9'a yükseldi. Hisse başına kâr 4,62 dolar seviyesinden 7,77 dolar seviyesine, düzeltilmiş hisse başına kâr 4,72 dolar seviyesinden 8,17 dolar seviyesine çıktı. Çeyrekte faaliyetlerden sağlanan nakit 4,4 milyar dolar oldu, dönem sonu nakdi 6,7 milyar dolar olarak bildirildi. Şirket çeyrekte 1,5 milyar dolar tutarında hisse geri alımı yaptı ve 0,7 milyar dolar temettü dağıttı."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "Caterpillar", "summary": {"en": "Caterpillar reported second-quarter sales and revenues of 20.5 billion dollars, against 16.6 billion dollars a year earlier, and said it was the first time the company had passed 20 billion dollars in a single quarter.", "tr": "Caterpillar ikinci çeyrekte 20,5 milyar dolar satış ve gelir bildirdi; bir yıl önce bu tutar 16,6 milyar dolar idi. Şirket, tek çeyrekte 20 milyar dolar sınırını ilk kez geçtiğini açıkladı."}, "tag": "companies", "title": {"en": "Caterpillar passed 20 billion dollars of quarterly sales for the first time", "tr": "Caterpillar'ın çeyreklik satışları ilk kez 20 milyar dolar sınırını aştı"}, "topic": "economics-markets", "url": "https://www.caterpillar.com/en/news/corporate-press-releases/h/2q26-results-caterpillar-inc.html", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "Profit before tax excluding notable items was 20.4 billion dollars and revenue 38.2 billion dollars, with the bank reporting that both grew 6 per cent against the first half of 2025 on a constant-currency basis and excluding notable items. The CET1 capital ratio fell 0.8 percentage points from the end of last year to 14.1 per cent, which the bank attributed to the privatisation of Hang Seng Bank, dividends and an increase in risk-weighted assets. Annualised return on average tangible equity was 18.2 per cent, or 19.1 per cent excluding notable items. Banking net interest income rose 1.6 billion dollars to 22.9 billion dollars and the bank said it now expects at least 46 billion dollars of banking net interest income in 2026. A second interim dividend of 0.10 dollars a share was approved for the second quarter. Citing uncertainty in the outlook, the bank put expected credit loss charges for 2026 at around 45 basis points, while keeping its medium-term planning range at 30 to 40 basis points.", "tr": "Kayda değer kalemler hariç vergi öncesi kâr 20,4 milyar dolar, gelir 38,2 milyar dolar oldu; banka her iki kalemin de sabit kurla ve kayda değer kalemler hariç bir önceki yılın ilk yarısına göre yüzde 6 büyüdüğünü bildirdi. CET1 sermaye oranı 2025 yılının sonuna göre 0,8 puan azalarak yüzde 14,1 seviyesine indi; bankaya göre bu düşüşte Hang Seng Bank'ın halka açıklıktan çıkarılması, temettüler ve risk ağırlıklı varlıklardaki artış etkili oldu. Yıllıklandırılmış maddi özkaynak kârlılığı yüzde 18,2, kayda değer kalemler hariç yüzde 19,1 olarak açıklandı. Bankacılık net faiz geliri 1,6 milyar dolar artarak 22,9 milyar dolar oldu ve banka 2026 için en az 46 milyar dolar bankacılık net faiz geliri beklediğini duyurdu. İkinci çeyrek için hisse başına 0,10 dolar ara temettü onaylandı. Banka, görünümdeki belirsizliği gerekçe göstererek 2026 için beklenen kredi zararı karşılıklarını yaklaşık 45 baz puan olarak verdi; orta vadeli planlama aralığını ise 30 ila 40 baz puanda koruduğunu belirtti."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "HSBC Holdings plc", "summary": {"en": "HSBC's reported profit before tax for the first half of 2026 rose 23 per cent to 19.5 billion dollars. The bank said it planned a buyback of up to 1 billion dollars, its first since the announcement of the Hang Seng Bank privatisation.", "tr": "HSBC'nin 2026'nın ilk yarısında raporlanan vergi öncesi kârı yüzde 23 artışla 19,5 milyar dolar oldu. Banka, Hang Seng Bank'ın halka açıklıktan çıkarılmasının duyurulmasından bu yana ilk kez, 1 milyar dolar tutarına kadar hisse geri alımı planladığını açıkladı."}, "tag": "companies", "title": {"en": "HSBC is restarting a buyback of up to 1 billion dollars while its capital ratio fell 0.8 points", "tr": "HSBC 1 milyar dolar tutarına kadar hisse geri alımını yeniden başlatıyor, sermaye oranı 0,8 puan düştü"}, "topic": "economics-markets", "url": "https://www.hsbc.com/investors/results-and-announcements/all-reporting/interim-results-2026-quick-read", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 4", "tr": "4 Ağu"}, "detail": {"en": "The diluted result under generally accepted accounting principles was a loss of 0.04 dollars a share, while adjusted diluted earnings were 0.77 dollars. Among the largest products, Eliquis brought in 2.425 billion dollars, up 19 per cent operationally, the Vyndaqel family 1.762 billion dollars, up 8 per cent, and the Prevnar family 1.337 billion dollars, down 4 per cent. The company said the guidance increase reflected roughly 1.5 billion dollars of better-than-expected performance from non-Covid products, partly offset by cutting its expectation for Covid-19 products to about 4 billion dollars from about 5 billion dollars. Adjusted diluted earnings guidance was kept at 2.80 to 3.00 dollars.", "tr": "Genel kabul görmüş muhasebe ilkelerine göre seyreltilmiş hisse başına sonuç 0,04 dolar zarar, düzeltilmiş hisse başına kâr 0,77 dolar oldu. En büyük kalemlerde Eliquis geliri 2,425 milyar dolar (faaliyet bazında yüzde 19 artış), Vyndaqel ailesi 1,762 milyar dolar (yüzde 8 artış), Prevnar ailesi ise 1,337 milyar dolar (yüzde 4 azalış) olarak bildirildi. Şirket, öngörü artışının kovid dışı ürünlerde beklentiyi yaklaşık 1,5 milyar dolar aşan performanstan kaynaklandığını, buna karşılık kovid-19 ürünleri beklentisini yaklaşık 5 milyar dolar seviyesinden 4 milyar dolar seviyesine indirdiğini açıkladı. Düzeltilmiş seyreltilmiş hisse başına kâr öngörüsü 2,80-3,00 dolar aralığında korundu."}, "featured": false, "publishedDate": "2026-08-04", "radarPublishedAt": "2026-08-04T15:24:14+03:00", "src": "Pfizer Inc.", "summary": {"en": "Pfizer reported asitesine sahip üç adet al-ya-da-öde hattından oluşuyor. Kapanış Hart-Scott-Rodino onayına ve alışılmış koşullara bağlı. İkinci çeyrekte seyreltilmiş hisse başına kâr 0,68 dolarla bir yıl öncesine göre yüzde 51 arttı; düzeltilmiş faiz, vergi, amortisman ve itfa öncesi kâr yüzde 6 artışla 1,921 milyar dolar, faaliyetlerden sağlanan kullanılabilir fon yüzde 10 artışla 1,450 milyar dolar oldu. Şirket 2026 düzeltilmiş kâr öngörüsünü 8,3–8,5 milyar dolara, orta noktayı 200 milyon dolar yukarı çekerek güncelledi; işlem sonrası kaldıraç oranının orta noktası yaklaşık 3,75 olarak verildi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "Williams", "summary": {"en": "The natural gas infrastructure company Williams said it had agreed to buy Momentum Midstream, which operates in the Haynesville basin, for a total of 5.5 billion dollars. The same statement reported second-quarter net income of 827 million dollars.", "tr": "Doğal gaz altyapısı şirketi Williams, Haynesville sahasındaki Momentum Midstream'i toplam 5,5 milyar dolar bedelle satın almak için anlaştığını açıkladı. Aynı açıklamada ikinci çeyrek net kârı 827 milyon dolar olarak bildirildi."}, "tag": "companies", "title": {"en": "Williams is buying Momentum Midstream for 5.5 billion dollars", "tr": "Williams, Momentum Midstream'i 5,5 milyar dolar bedelle satın alıyor"}, "topic": "economics-markets", "url": "https://www.williams.com/2026/08/03/williams-delivers-strong-second-quarter-2026-results-announces-strategic-acquisition-of-momentum-midstream-connecting-haynesville-to-gulf-coast-lng-and-power-demand/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Arizona, California, Colorado, Connecticut, Delaware, Hawaii, Illinois, Kentucky, Maine, Maryland, Massachusetts, Michigan, Minnesota, Nevada, New Jersey, New Mexico, North Carolina, Oregon, Pennsylvania, Rhode Island, Vermont, Virginia, Washington and Wisconsin joined the filing. The states argue that the investigations were announced in March and completed in under three months, against the eight to twelve months such reviews normally take. They contend the tariffs lack a meaningful connection to the stated forced-labour objective, are applied arbitrarily across countries and products, and breach the Administrative Procedure Act because submitted testimony and comments were not adequately considered. Attorney General Letitia James said that however the administration tries to justify it, the law and the Constitution are clear that the president does not have the power to impose sweeping tariffs on whatever countries he wants. Governor Kathy Hochul said the Supreme Court has made it clear that this administration cannot ignore the law to impose sweeping tariffs.", "tr": "Başvuruya Arizona, California, Colorado, Connecticut, Delaware, Hawaii, Illinois, Kentucky, Maine, Maryland, Massachusetts, Michigan, Minnesota, Nevada, New Jersey, New Mexico, North Carolina, Oregon, Pennsylvania, Rhode Island, Vermont, Virginia, Washington ve Wisconsin katıldı. Eyaletler, soruşturmaların mart ayında duyurulduğunu ve üç aydan kısa sürede tamamlandığını, oysa benzer incelemelerin genellikle sekiz ila on iki ay sürdüğünü öne sürüyor. İddialara göre vergiler ilan edilen zorla çalıştırma gerekçesiyle anlamlı bir bağ kurmuyor, ülkeler ve ürünler arasında keyfi biçimde uygulanıyor ve sunulan görüşler yeterince değerlendirilmediği için İdari Usul Yasası ihlal ediliyor. Başsavcı Letitia James açıklamasında, yönetimin gerekçesi ne olursa olsun hukukun ve anayasanın başkana dilediği ülkelere kapsamlı vergi koyma yetkisi vermediğini söyledi. Vali Kathy Hochul ise Yüksek Mahkeme'nin bu yönetimin kapsamlı vergiler koymak için hukuku yok sayamayacağını açıkça ortaya koyduğunu belirtti."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "New York State Attorney General", "summary": {"en": "Twenty-five states led by New York asked the Court of International Trade to strike down the tariffs the administration put in place on 23 July. The suit argues that the procedural requirements of Section 301 of the Trade Act of 1974 were not met.", "tr": "New York'un öncülüğündeki 25 eyalet, yönetimin 23 Temmuz'da uygulamaya koyduğu gümrük vergilerinin iptali için Uluslararası Ticaret Mahkemesi'ne başvurdu. Dava, 1974 tarihli Ticaret Yasası'nın 301. maddesinin usul koşullarının yerine getirilmediğini savunuyor."}, "tag": "macro", "title": {"en": "Twenty-five states filed suit against the tariffs imposed on 23 July", "tr": "Yirmi beş eyalet, 23 Temmuz'da yürürlüğe konan gümrük vergilerine karşı dava açtı"}, "topic": "economics-markets", "url": "https://ag.ny.gov/press-release/2026/attorney-general-james-and-governor-hochul-announce-lawsuit-against-trump", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "UBS Financial Services admitted that it wilfully violated the law by failing to implement and maintain an anti-money-laundering programme and by failing to file suspicious activity reports. The agency said the firm did not monitor more than 50,000 foreign currency wires with an aggregate value of more than 10 billion dollars. In December 2018 the same firm was fined 14.5 million dollars for violations of the same law tied to weaknesses in its automated monitoring system, and undertook to remediate the problems quickly; it did not. The new consent order requires a third-party lookback to identify and report suspicious transactions that went undetected, and an independent review of the anti-money-laundering programme covering four priority areas: the US south-west border and cartels, Iran, Russia and Venezuela. Up to 15 million dollars of the penalty may be waived if the review is completed successfully.", "tr": "UBS Financial Services, kara para aklamayla mücadele programını kurup sürdürmemek ve şüpheli işlem bildirimlerinde bulunmamak yoluyla yasayı kasten ihlal ettiğini kabul etti. Kuruma göre şirket, toplam değeri 10 milyar doları aşan 50 binden fazla döviz havalesini izlemedi. Şirket Aralık 2018'de otomatik izleme sistemindeki zayıflıklar nedeniyle aynı yasanın ihlalinden 14,5 milyon dolar ceza almış ve sorunları kısa sürede gidereceğini taahhüt etmişti; bu taahhüt yerine getirilmedi. Yeni uzlaşma kararı, tespit edilemeyen şüpheli işlemleri geriye dönük olarak belirleyip bildirmek üzere üçüncü taraf bir incelemeyi ve kara para aklamayla mücadele programının bağımsız denetimini zorunlu kılıyor; denetimin öncelikli dört alanı ABD'nin güneybatı sınırı ve kartelleri, İran, Rusya ve Venezuela olarak belirlendi. İnceleme başarıyla tamamlanırsa cezanın 15 milyon dolara kadarlık bölümünden vazgeçilebilecek."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "FinCEN", "summary": {"en": "The US Treasury's Financial Crimes Enforcement Network fined UBS's American brokerage 125 million dollars for wilful violations of the Bank Secrecy Act. The agency said it was the largest such penalty ever imposed on a broker-dealer.", "tr": "ABD Hazine Bakanlığı'na bağlı Mali Suçları Araştırma Ağı, UBS'in ABD aracı kurumuna Banka Sırrı Yasası'nı kasten ihlal ettiği gerekçesiyle 125 milyon dolar para cezası verdi. Kurum bunun bir aracı kuruma kesilen en yüksek ceza olduğunu bildirdi."}, "tag": "companies", "title": {"en": "FinCEN assessed a 125 million dollar penalty against UBS Financial Services", "tr": "FinCEN, UBS Financial Services'a 125 milyon dolar ceza kesti"}, "topic": "economics-markets", "url": "https://www.fincen.gov/news/news-releases/fincen-assesses-historic-125-million-penalty-against-ubs-financial-services-inc", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "The loss-making luxury carmaker secured 550 million pounds (738.38 million dollars) of debt financing in July, led by funds managed by BlackRock-owned HPS Investment Partners. The package comprises a 450 million pound secured term loan and a 100 million pound delayed draw term loan, alongside a separate 100 million pounds of permitted debt incurrence capacity. That additional 100 million pounds is conditional on the transfer of a 50.1 per cent stake in the company's non-automotive intellectual property to Authentic Brands, a US brand developer. The Financial Times reported the letter first. Creditors were reported to have complained that the details of the transaction were not shared with them. Aston Martin and HPS could not be reached for comment outside regular business hours.", "tr": "Zarar eden lüks otomobil üreticisi temmuzda, BlackRock'a bağlı HPS Investment Partners'ın yönettiği fonların öncülüğünde 550 milyon sterlinlik (738,38 milyon dolar) borç finansmanı sağlamıştı. Paket 450 milyon sterlinlik teminatlı vadeli kredi ile 100 milyon sterlinlik gecikmeli kullanımlı vadeli krediden oluşuyor; ayrıca 100 milyon sterlinlik ek borçlanma kapasitesi tanınıyor. Bu ek 100 milyon sterlin, şirketin otomotiv dışı fikri mülkiyetinin yüzde 50,1'lik payının ABD merkezli marka geliştiricisi Authentic Brands'e devredilmesi şartına bağlı. Haberi ilk olarak Financial Times duyurdu. Alacaklıların, işlemin ayrıntılarının kendileriyle paylaşılmamasından yakındığı bildirildi. Aston Martin ve HPS mesai saatleri dışında yorum için ulaşılabilir durumda değildi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T10:43:01+00:00", "src": "Reuters", "summary": {"en": "A group of existing creditors owed 1.3 billion pounds sent a letter before action to the board on Sunday. The creditors said they could seek to unwind the financing agreed in July and to block the disposal of certain intellectual property assets.", "tr": "Şirkete 1,3 milyar sterlin alacağı bulunan mevcut alacaklı grubu, yönetim kuruluna pazar günü dava öncesi ihtarname gönderdi. Alacaklılar temmuzda imzalanan finansman işlemini geçersiz kılmayı ve bazı fikri mülkiyet varlıklarının devrini engellemeyi talep edebileceklerini bildirdi."}, "tag": "companies", "title": {"en": "Aston Martin's creditors threatened legal action over the sale of branding rights", "tr": "Aston Martin'in alacaklıları marka haklarının satışına karşı dava tehdidinde bulundu"}, "topic": "economics-markets", "url": "https://www.reuters.com/business/aston-martin-creditors-threaten-legal-action-over-plan-sell-branding-rights-ft-2026-08-03/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Trump repeated that the companies had made too much money, named Chevron and ExxonMobil, and said he was not happy about it, adding that they were going to give some of it back to the public and had better cut the retail price. The average gasoline price, about 3 dollars a gallon before the war, is now above 4 dollars. Brent crude fell more than 4 per cent on Monday to about 84 dollars a barrel, yet remains well above pre-war levels. The Iran war had disrupted crude flows through the Strait of Hormuz. ExxonMobil declined to comment and Chevron did not immediately respond to a request for comment. In a CBS News poll about half of Americans said high fuel costs were causing them financial difficulty.", "tr": "Trump, şirketlerin çok fazla para kazandığını yineleyerek Chevron ve ExxonMobil'i adıyla andı ve bundan memnun olmadığını söyledi; kazancın bir bölümünü halka geri vereceklerini ve perakende fiyatı indirmelerinin daha iyi olacağını belirtti. Savaş öncesinde galonu yaklaşık 3 dolar olan ortalama benzin fiyatı şu anda 4 doların üzerinde. Brent tipi ham petrol pazartesi günü yüzde 4'ten fazla gerileyerek varil başına yaklaşık 84 dolara indi; buna karşın fiyat savaş öncesi seviyelerin belirgin biçimde üzerinde. İran savaşı Hormuz Boğazı üzerinden geçen ham petrol akışını kesintiye uğratmıştı. ExxonMobil yorum yapmayı reddetti, Chevron ise yorum talebine hemen yanıt vermedi. CBS News anketine göre Amerikalıların yaklaşık yarısı yüksek akaryakıt maliyetinin bütçelerinde zorluk yarattığını söylüyor."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "CBS News", "summary": {"en": "US President Donald Trump said oil companies had made too much money and demanded that they cut prices at the pump. Crude fell more than 4 per cent on Monday, yet the average US gasoline price remains above 4 dollars a gallon.", "tr": "ABD Başkanı Donald Trump, petrol şirketlerinin çok fazla para kazandığını söyleyerek pompa fiyatlarını düşürmelerini istedi. Ham petrolde pazartesi günü yüzde 4'ü aşan düşüşe karşın ABD'de ortalama benzin fiyatı galon başına 4 doların üzerinde kalmayı sürdürüyor."}, "tag": "commodities", "title": {"en": "Trump called on Chevron and ExxonMobil to cut gasoline prices", "tr": "Trump, Chevron ve ExxonMobil'i benzin fiyatlarını indirmeye çağırdı"}, "topic": "economics-markets", "url": "https://www.cbsnews.com/news/trump-oil-companies-cut-gas-prices/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Rather than buying reserves outright in the market, the bank is selling put options through monthly auctions. Options awarded in the first tranche can be exercised between 4 and 31 August, and only when the market representative rate is below its moving average over the previous 20 business days. The bank described the programme's purpose as strengthening the country's external liquidity, ensuring it can meet its external obligations and improving its capacity to withstand shocks from international financial markets. It said the programme is preventive and compatible with the institution's monetary policy stance. The same mechanism was used in 2024, when the target of accumulating about 1.5 billion dollars of international reserves was met.", "tr": "Banka rezervleri doğrudan piyasadan almak yerine aylık ihalelerle satım opsiyonu satıyor. İlk dilimde kazanılan opsiyonlar 4–31 Ağustos arasında kullanılabilecek; kullanım, piyasa temsili kurun önceki 20 iş günündeki hareketli ortalamasının altında olması koşuluna bağlı. Banka programın amacını ülkenin dış likidite düzeyini güçlendirmek, dış yükümlülüklerini karşılayabilmesini sağlamak ve uluslararası finansal piyasalardan gelebilecek şoklara karşı direncini artırmak olarak tanımladı. Programın önleyici nitelikte olduğu ve kurumun para politikası duruşuyla uyumlu olduğu belirtildi. Aynı mekanizma 2024'te de uygulanmış ve yaklaşık 1,5 milyar dolar tutarındaki rezerv biriktirme hedefine ulaşılmıştı."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "El Universal", "summary": {"en": "Banco de la República held the first auction of a programme to accumulate up to 4 billion dollars of international reserves on 3 August, for up to 400 million dollars. The put options awarded can be exercised only if a specific exchange-rate condition is met.", "tr": "Banco de la República, 4 milyar dolara kadar uluslararası rezerv biriktirmeyi öngören programın ilk ihalesini 3 Ağustos'ta 400 milyon dolara kadar tutarla gerçekleştirdi. Kazanılan satım opsiyonları yalnızca belirli bir kur koşulu sağlandığında kullanılabilecek."}, "tag": "markets", "title": {"en": "Colombia's central bank held the first auction of its reserve accumulation programme", "tr": "Kolombiya Merkez Bankası rezerv biriktirme programının ilk ihalesini yaptı"}, "topic": "economics-markets", "url": "https://www.eluniversal.com.co/economica/2026/08/03/banco-de-la-republica-inicia-programa-de-acumulacion-de-reservas-internacionales/", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Fourth-quarter net sales fell 2 per cent to 1.95 billion dollars and organic sales fell 13 per cent. Diluted earnings dropped 50 per cent to 1.34 dollars a share and adjusted earnings fell 42 per cent to 1.66 dollars. For the full year organic sales fell 8 per cent, diluted earnings fell 26 per cent to 4.81 dollars a share and adjusted earnings fell 28 per cent to 5.53 dollars, while gross margin fell 290 basis points to 42.3 per cent. Fiscal 2027 guidance calls for net sales growth of 13 to 14 per cent, diluted earnings of 5.41 to 5.71 dollars a share and adjusted earnings of 5.70 to 6.00 dollars. The company said higher-than-normal inflationary headwinds would persist into the coming year, partly offset by cost savings. Chair and chief executive Linda Rendle said the fourth-quarter results were in line with expectations and reflected disciplined execution in a dynamic environment.", "tr": "Dördüncü çeyrekte net satışlar yüzde 2 azalarak 1,95 milyar dolara indi, organik satışlar yüzde 13 geriledi. Seyreltilmiş hisse başına kâr yüzde 50 düşüşle 1,34 dolar, düzeltilmiş hisse başına kâr yüzde 42 düşüşle 1,66 dolar oldu. Mali yılın tamamında organik satışlar yüzde 8 azaldı, seyreltilmiş hisse başına kâr yüzde 26 düşüşle 4,81 dolara, düzeltilmiş hisse başına kâr yüzde 28 düşüşle 5,53 dolara indi; brüt kâr marjı 290 baz puan gerileyerek yüzde 42,3 oldu. 2027 mali yılı için net satışlarda yüzde 13–14 büyüme, seyreltilmiş hisse başına 5,41–5,71 dolar ve düzeltilmiş hisse başına 5,70–6,00 dolar kâr bekleniyor. Şirket önümüzdeki yılda olağandan yüksek enflasyonist baskıların süreceğini, bunun bir bölümünün maliyet tasarruflarıyla dengeleneceğini belirtti. Yönetim kurulu başkanı ve genel müdürü Linda Rendle, dördüncü çeyrek sonuçlarının beklentilerle uyumlu olduğunu ve değişken bir ortamda disiplinli uygulamayı yansıttığını söyledi."}, "featured": false, "publishedDate": "2026-08-03", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "src": "The Clorox Company", "summary": {"en": "The cleaning products maker reported that net sales fell 5 per cent to 6.72 billion dollars in fiscal 2026. For fiscal 2027 it guided to organic sales growth of 3.5 to 4.5 per cent and a gross margin of about 42 per cent.", "tr": "Temizlik ürünleri üreticisi, 2026 mali yılında net satışların yüzde 5 düşüşle 6,72 milyar dolar seviyesine indiğini bildirdi. 2027 mali yılı için organik satışlarda yüzde 3,5–4,5 büyüme ve brüt kâr marjında yaklaşık yüzde 42 seviyesi öngörülüyor."}, "tag": "companies", "title": {"en": "Clorox's full-year sales fell 5 per cent and the company guided to 3.5 to 4.5 per cent organic growth", "tr": "Clorox'un mali yıl satışları yüzde 5 geriledi, yeni yıl için yüzde 3,5–4,5 organik büyüme öngörüldü"}, "topic": "economics-markets", "url": "https://investors.thecloroxcompany.com/news/news-details/2026/Clorox-Reports-Q4-and-FY26-Results-Provides-FY27-Outlook/default.aspx", "editionDate": "2026-08-04"}, {"date": {"en": "Aug 3", "tr": "3 Ağu"}, "detail": {"en": "Revenue rose 8 per cent to 67 million dollars from 62.1 million dollars in the first quarter. Output rose to 932 bitcoin from 817 in the first quarter. The company's bitcoin holdings reached 8,002 at 30 June, a 14 per cent increase on the 7,021 held at the end of March. Satoshis per share rose 11 per cent, from 9,943 to 10,989. After the stock fell more than 95 per cent from its post-listing high, the company carried out a one-for-fifteen reverse share split on 2 July to restore compliance with Nasdaq listing rules. The stock traded around 5.53 dollars before the open following the announcement, within a 52-week range of 5.04 to 217.80 dollars. Chief executive Mike Ho said the company had focused on what it could control, pushing production to a record while strengthening the underlying platform.", "tr": "Gelir ilk çeyrekteki 62,1 milyon dolardan yüzde 8 artışla 67 milyon dolara çıktı. Üretim ilk çeyrekteki 817 bitcoinden 932 bitcoine yükseldi. Şirketin elindeki bitcoin miktarı 30 Haziran itibarıyla 8.002'ye ulaştı; mart sonundaki 7.021 seviyesine göre yüzde 14 artış anlamına geliyor. Hisse başına düşen satoshi miktarı 9.943'ten 10.989'a çıkarak yüzde 11 arttı. Şirket, hissenin borsaya açıldıktan sonraki en yüksek seviyesinden yüzde 95'ten fazla değer kaybetmesin el katmanı", "en": "Two physical layers of hardware capacity"}, "summary": {"tr": "Seagate ve KLA sonuçları, bilgi işlem kapasitesinin depolama ile yarı iletken üretim ekipmanı katmanlarında gelir, marj, nakit akışı ve yakın dönem öngörülerine nasıl yansıdığını özetliyor.", "en": "Seagate and KLA results summarize how computing capacity translated into revenue, margins, cash flow and near-term guidance across storage and semiconductor manufacturing-equipment layers."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/computing-hardware-capacity-layers-1280.bb505fa9e447.webp", "variants": [{"src": "/assets/briefs/2026-07-29/computing-hardware-capacity-layers-640.0fd147585f48.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/computing-hardware-capacity-layers-1280.bb505fa9e447.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Optik bir denetim kemerinden geçerek katmanlı depolama teraslarına dönüşen seramik bileşenler", "en": "Ceramic components passing through an optical inspection arch and becoming layered storage terraces"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}, {"id": "industrial-scale-execution-costs", "topic": "economics-markets", "title": {"tr": "Ölçek büyürken operasyon maliyetleri", "en": "Operating costs alongside expanding scale"}, "summary": {"tr": "UPS ve Boeing sonuçları, artan gelir, yükseltilen öngörü veya büyüyen sipariş defterinin aynı çeyrekte dönüşüm giderleri, zararlar ve düşük segment marjlarıyla yan yana durabildiğini gösteriyor.", "en": "UPS and Boeing results show how rising revenue, higher guidance or a larger backlog can coexist in one quarter with transformation charges, losses and thin segment margins."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/industrial-scale-execution-costs-1280.2f0cd3815b7e.webp", "variants": [{"src": "/assets/briefs/2026-07-29/industrial-scale-execution-costs-640.3fc9d9f1f357.webp", "width": 640}, {"src": "/assets/briefs/2026-07-29/industrial-scale-execution-costs-1280.2f0cd3815b7e.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Yeniden kurulan lojistik kavşağından uçak üretim hollerine ve geniş bir aprona uzanan sentetik operasyon ağı", "en": "A synthetic operating network extending from a rebuilt logistics junction to aircraft production halls and a broad apron"}, "generatedAt": "2026-07-29"}, "editionDate": "2026-07-29", "n": 1, "hasAnalysis": true}], "articles": [{"writer": "eco-01", "radarPublishedAt": "2026-08-04T09:14:56+00:00", "title": {"tr": "Palantir'ın yüzde 82'lik öngörüsünün arkasındaki sözleşmeler", "en": "The contracts behind Palantir's 82 per cent outlook"}, "excerpt": {"tr": "Palantir'ın ikinci çeyrek geliri yüzde 93 büyüdü; yıl geneli gelir öngörüsü 8,150 milyar dolar ile 8,158 milyar dolar aralığına çıktı. Yeni öngörünün dayanağı, gerçekleşen çeyrek kadar bekleyen sözleşme tutarında ve üçüncü çeyrek hedefinde görülüyor.", "en": "Palantir's second-quarter revenue rose 93 per cent, and full-year guidance reached 8.150 billion dollars to 8.158 billion dollars. The support for that outlook sits in contracted value and the third-quarter target as well as the reported quarter."}, "sections": [{"h": {"tr": "Çeyreğin bileşimi", "en": "Inside the quarter"}, "ps": [{"tr": "Palantir'ın ikinci çeyrek geliri 1,935 milyar dolar oldu; bu, bir yıl öncesine göre yüzde 93, bir önceki çeyreğe göre yüzde 19 artış demek. ABD ticari geliri yüzde 149 artışla 764 milyon dolar düzeyine, ABD kamu geliri yüzde 90 artışla 809 milyon dolar düzeyine çıktı. Toplam ABD geliri 1,573 milyar dolar düzeyine ulaşırken şirketin genel kabul görmüş muhasebe ilkelerine göre net kârı 1,062 milyar dolar, seyreltilmiş hisse başına kârı 0,41 dolar oldu.", "en": "Palantir reported second-quarter revenue of 1.935 billion dollars, up 93 per cent from a year earlier and 19 per cent from the prior quarter. US commercial revenue rose 149 per cent to 764 million dollars, US government revenue rose 90 per cent to 809 million dollars, and total US revenue reached 1.573 billion dollars. Net income under generally accepted accounting principles was 1.062 billion dollars, with diluted earnings of 0.41 dollars a share.", "refs": ["palantir"]}, {"tr": "Nakit dönüşümü de aynı açıklamanın önemli parçası. Düzeltilmiş faaliyet kârı 1,194 milyar dolar ve marj yüzde 62; düzeltilmiş serbest nakit akışı 1,220 milyar dolar ve marj yüzde 63 olarak bildirildi. Nakit ile kısa vadeli ABD Hazine kâğıtlarının toplamı 9,2 milyar dolar düzeyine ulaştı. Bu rakamlar büyümenin yalnızca gelir satırında kalmadığını gösteriyor; ancak şirketin düzeltilmiş ölçüleri ile genel kabul görmüş muhasebe ilkelerine göre sonuçları birbirinin yerine kullanılamaz.", "en": "Cash conversion is another material part of the release. Adjusted income from operations was 1.194 billion dollars at a 62 per cent margin, while adjusted free cash flow was 1.220 billion dollars at a 63 per cent margin. Cash and short-term US Treasury securities reached 9.2 billion dollars. Those figures show growth extending beyond the revenue line, although the company's adjusted measures and its results under generally accepted accounting principles are not interchangeable.", "refs": ["palantir"]}]}, {"h": {"tr": "Öngörünün ileriye bakan kısmı", "en": "The forward part of the outlook"}, "ps": [{"tr": "Şirket yıl geneli gelir öngörüsünü 8,150 milyar dolar ile 8,158 milyar dolar aralığına yükseltti ve bunun yıllık yüzde 82 büyümeye karşılık geldiğini bildirdi. ABD ticari gelirinin 3,424 milyar dolar düzeyinin üzerine çıkması, bu bölümde en az yüzde 134 büyüme sağlanması bekleniyor. Düzeltilmiş serbest nakit akışı için verilen 4,5 milyar dolar ile 4,7 milyar dolar arasındaki aralık da gelir hedefinin nakde dönüşmesi gereken ölçeği ortaya koyuyor.", "en": "The company raised full-year revenue guidance to a range of 8.150 billion dollars to 8.158 billion dollars, representing 82 per cent annual growth. It expects US commercial revenue above 3.424 billion dollars, or growth of at least 134 per cent in that business. The adjusted free-cash-flow range of 4.5 billion dollars to 4.7 billion dollars also sets the scale at which the revenue target is expected to convert into cash.", "refs": ["palantir"]}, {"tr": "Üçüncü çeyrek için 2,160 milyar dolar ile 2,164 milyar dolar gelir öngörülüyor. Aralığın üst ucu, ikinci çeyrekteki 1,935 milyar dolar düzeyinin yaklaşık yüzde 12 üzerinde. Bu nedenle yıl geneli hedefi yalnızca tamamlanmış çeyreğin yıllıklaştırılması değil, bir sonraki dönemde de daha yüksek bir gelir basamağına çıkılması varsayımını içeriyor. Midas'ın bakacağı temel karşılaştırma burada: açıklanan ileri hedef ile onu taşıyacak sözleşmeli işin birlikte ilerleyip ilerlemediği.", "en": "Third-quarter revenue is guided to 2.160 billion dollars to 2.164 billion dollars. The top of that range is about 12 per cent above the 1.935 billion dollars reported for the second quarter. Full-year guidance therefore assumes not merely an annualisation of the completed quarter but another sequential step in the next period. The relevant comparison is whether the forward target and the contracted work expected to support it continue to move together.", "refs": ["palantir"]}]}, {"h": {"tr": "Sözleşme tutarı ne söylüyor?", "en": "What the contract value says"}, "ps": [{"tr": "Çeyrekte imzalanan toplam sözleşme değeri yüzde 49 artışla 3,373 milyar dolar düzeyine ulaştı. ABD ticari bölümünde imzalanan sözleşme değeri yüzde 153 artışla 2,132 milyar dolar, bekleyen sözleşme tutarı yüzde 124 artışla 6,238 milyar dolar oldu. Toplam gelirin yüzde 93 arttığı bir dönemde bekleyen tutarın bu hızla büyümesi, yükseltilen öngörünün tamamlanmış çeyrekten daha geniş bir sözleşme tabanına dayandığına işaret ediyor. Başka bir açıklama da mümkün: sözleşme süreleri uzadıysa tutarın bir bölümü daha uzun yıllara yayılabilir.", "en": "Total contract value cl
