osed in the quarter rose 49 per cent to 3.373 billion dollars. In US commercial business, total contract value rose 153 per cent to 2.132 billion dollars and remaining deal value rose 124 per cent to 6.238 billion dollars. With total revenue up 93 per cent, faster growth in remaining value indicates that the raised outlook rests on a contract base broader than the completed quarter. Another explanation remains possible: longer contract durations could spread part of that value across more years.", "refs": ["palantir"]}, {"tr": "Ayrım üçüncü çeyrek verileriyle somutlaşacak. Gelir 2,164 milyar dolar düzeyindeki aralığın üst ucuna yaklaşırken ABD ticari bekleyen sözleşme tutarı da yeniden yüzde 124'e yakın büyürse, ileri hedef ile sözleşme tabanı aynı yönde ilerlemiş olacak. Gelir verilen aralıkta kalırken bekleyen tutarın büyümesi belirgin biçimde yavaşlarsa, bugünkü yüksek sözleşme tutarının vadesi ve gelire dönüşme hızı daha önemli hale gelecek. Böylece öngörünün niteliği, fiyat hareketine başvurmadan şirketin kendi açıklayacağı iki kalemle izlenebilecek.", "en": "The distinction will become concrete in the third-quarter figures. If revenue approaches the 2.164 billion dollar top of the range while US commercial remaining deal value again grows near 124 per cent, the forward target and contract base will have moved together. If revenue stays within guidance while remaining-value growth slows materially, the tenor of today's contract value and the speed of its conversion into revenue will matter more. The quality of the outlook can therefore be followed through two figures the company itself will report, without relying on a share-price move.", "refs": ["palantir"]}]}], "sources": [{"key": "palantir", "kind": "news", "name": "Business Wire", "url": "https://www.businesswire.com/news/home/20260802523449/en/Palantir-Reports-Q2-2026-U.S.-Comm-Revenue-Growth-of-149-YY-and-Revenue-Growth-of-93-YY-Raises-FY-2026-Revenue-Guidance-to-82-YY-Growth-and-U.S.-Comm-Revenue-Guidance-to-134-YY-Crushing-Consensus-Expectations", "title": {"tr": "Palantir'ın ikinci çeyrek geliri 1,935 milyar dolar seviyesine çıktı, yıl geneli öngörüsü yükseltildi", "en": "Palantir's second-quarter revenue reached 1.935 billion dollars and the company raised its full-year outlook"}, "publishedDate": "2026-08-03"}], "date": "2026-08-04"}, {"excerpt": {"en": "Banco de la República sold options to sell dollars to it instead of buying the currency outright. The party that decides when the reserve gets created is therefore the counterparty measuring the rate against a moving average.", "tr": "Banco de la República dövizi doğrudan almak yerine satım opsiyonu sattı. Rezervin ne zaman yaratılacağına karar veren taraf böylece banka değil, kuru bir hareketli ortalamayla karşılaştıran karşı taraf oldu."}, "radarPublishedAt": "2026-08-04T09:14:56+00:00", "sections": [{"h": {"en": "The seller of the option is the buyer of the dollars", "tr": "Opsiyonu satan taraf, dövizi alacak taraf"}, "ps": [{"en": "On 3 August Banco de la República held the first auction of a programme to accumulate up to 4 billion dollars of reserves, selling put options for up to 400 million dollars. The options awarded can be exercised between 4 and 31 August, and only while the market representative rate stays below its moving average over the previous 20 business days. The same method was applied in 2024, when a target of about 1.5 billion dollars was met.", "refs": ["banrep"], "tr": "3 Ağustos günü Banco de la República, en fazla 4 milyar dolar rezerv biriktirmeyi öngören programın ilk ihalesini yaptı ve en fazla 400 milyon dolar tutarında satım opsiyonu sattı. Tahsis edilen opsiyonlar 4 ile 31 Ağustos arasında, yalnızca piyasa temsili kurun önceki 20 iş günündeki hareketli ortalamasının altında kalması koşuluyla kullanılabiliyor. Aynı yöntem 2024 yılında uygulanmış ve yaklaşık 1,5 milyar dolar tutarındaki hedefe ulaşılmıştı."}, {"en": "In balance-sheet terms this arrangement is something other than putting a purchase order on a calendar. On auction day there is no foreign exchange on the central bank's asset side; what exists is a contingent liability. The reserve arises at the moment the counterparty exercises: the pesos the bank pays out are added to commercial banks' balances at the central bank, and the currency moves into reserves. An asset purchase financed by newly created pesos thus becomes a transaction whose timing does not belong to the bank. Delegating that timing is not the only reading either; the bank may be seeking flexibility on price and preferring to spread the exchange-rate effect of one large purchase.", "refs": ["banrep"], "tr": "Bilanço açısından bu düzenleme, alım emrini takvime bağlamaktan başka bir şey. İhale günü merkez bankasının varlık tarafında henüz döviz yok; olan şey koşullu bir yükümlülük. Rezerv, karşı taraf opsiyonu kullandığı anda doğuyor: bankanın ödediği pesolar ticari bankaların merkez bankası nezdindeki bakiyelerine ekleniyor, döviz ise rezerve geçiyor. Yani karşılığında peso yaratılan bir varlık alımı, zamanlaması bankaya ait olmayan bir işleme dönüşüyor. Bunun tek açıklaması yetkiyi devretmek de değil; banka fiyat üzerinde esneklik arıyor ve tek seferlik büyük bir alımın kur üzerindeki etkisini dağıtmayı tercih ediyor olabilir."}]}, {"h": {"en": "The condition does the policy work", "tr": "Asıl politika işini koşul yapıyor"}, "ps": [{"en": "Because the exercise condition requires the rate to sit below its own 20-business-day average, purchases cluster on days when the peso is strengthening relative to its recent path. The bank does not target a level of the rate; what it targets is a quantity of reserves, and the rule steers its own buying towards moments of peso appreciation. That is the thin but important line between intervention and reserve accumulation.", "refs": ["banrep"], "tr": "Kullanım şartı kurun kendi son 20 iş günlük ortalamasının altında olmasını gerektirdiği için alımlar, pesonun yakın geçmişine göre güçlendiği günlerde yoğunlaşıyor. Banka bir kur seviyesini hedeflemiyor; hedeflediği şey rezervin miktarı ve kural, kendi alımını pesonun değerlendiği anlara yönlendiriyor. Müdahale ile rezerv biriktirmeyi ayıran ince ama önemli çizgi burada."}, {"tr": "Programın amacı da kullanım koşuluyla aynı çerçevede duruyor. Banco de la República rezervlerin ülkenin dış yükümlülüklerini karşılamasına destek olacağını, uluslararası finans piyasalarından gelebilecek şoklara karşı dayanıklılığı artıracağını ve dış finansmana erişimde güveni koruyacağını belirtiyor. Banka programı önleyici nitelikte ve para politikası duruşuyla uyumlu bir rezerv biriktirme aracı olarak tanımlıyor. Böylece kur koşulu bir fiyat hedefi ilan etmeden alım günlerini sınırlarken, açıklanan hedef rezerv miktarını ve dış likiditeyi güçlendirmek olarak kalıyor.", "en": "The programme's stated purpose belongs in the same frame as its exercise condition. Banco de la República says reserves support the country's ability to meet external obligations, improve resilience to shocks from international financial markets and preserve confidence in access to external finance. The bank describes the programme as preventive and compatible with its monetary-policy stance. The exchange-rate condition therefore limits the days on which purchases can occur without announcing a target price, while the declared objective remains a quantity of reserves and stronger external liquidity.", "refs": ["banrep"]}]}, {"h": {"en": "What would break this reading", "tr": "Hangi gözlem bu okumayı bozar"}, "ps": [{"en": "The distinction will be visible at the end of the month. If most of the 400 million dollars allocated is exercised by 31 August, the condition was not binding and the quota set the programme's pace. If exercise stays low, the binding constraint is the moving-average condition, which would mean the schedule for the full 4 billion dollars rests with the exchange rate rather than with the bank. The size of the second auction will test the same reading.", "refs": ["banrep"], "tr": "Ayrım ay sonunda görülecek. 31 Ağustos gününe kadar tahsis edilen 400 milyon dolar tutarının büyük bölümü kullanılırsa, koşul bağlayıcı olmamış ve programın hızını kota belirlemiş olur. Kullanım düşük kalırsa bağlayıcı olan hareketli ortalama koşuludur; o zaman 4 milyar dolar tutarındaki toplamın takvimi bankanın değil kurun elinde demektir. İkinci ihalenin tutarı da aynı okumayı sınayacak."}]}], "sources": [{"key": "banrep", "kind": "news", "name": "El Universal", "url": "https://www.eluniversal.com.co/economica/2026/08/03/banco-de-la-republica-inicia-programa-de-acumulacion-de-reservas-internacionales/", "title": {"tr": "Kolombiya Merkez Bankası rezerv biriktirme programının ilk ihalesini yaptı", "en": "Colombia's central bank held the first auction of its reserve accumulation programme"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who decides the day the reserves get bought", "tr": "Rezervlerin hangi gün alınacağına kim karar veriyor"}, "writer": "eco-02", "date": "2026-08-04"}, {"excerpt": {"en": "Williams describes the 5.5 billion dollars it will pay for Momentum Midstream as 8.5 times projected 2027 earnings before interest, taxes, depreciation and amortisation. The denominator of that description is a forecast; the numerator is a price committed today.", "tr": "Williams, Momentum Midstream için ödeyeceği 5,5 milyar dolar tutarındaki bedeli 2027 yılı için öngörülen faiz, vergi, amortisman ve itfa öncesi kârın 8,5 katı olarak tanımlıyor. Bu tanımın paydası bir tahmin, payı ise bugün bağlanan bir bedel."}, "radarPublishedAt": "2026-08-04T09:14:56+00:00", "sections": [{"h": {"en": "The multiple's denominator", "tr": "Çarpanın paydası"}, "ps": [{"en": "Placing the two disclosed figures side by side gives the implied magnitude: if 5.5 billion dollars equals 8.5 times, then roughly 650 million dollars of earnings before interest, taxes, depreciation and amortisation is expected from the acquired assets in 2027. The company's own guidance for this year runs from 8.3 billion dollars to 8.5 billion dollars, so the acquired contribution, once it arrives, would be a line worth about 8 per cent of the existing scale.", "refs": ["williams"], "tr": "Açıklanan iki rakamı yan yana koyunca ima edilen büyüklük ortaya çıkıyor: 5,5 milyar dolar tutarındaki bedel 8,5 katına denk geliyorsa, devralınan varlıklardan 2027 yılında yaklaşık 650 milyon dolar faiz, vergi, amortisman ve itfa öncesi kâr bekleniyor demektir. Şirketin bu yıl için kendi öngörüsü 8,3 milyar dolar ile 8,5 milyar dolar arasında; yani devralınan varlıkların katkısı, gerçekleştiğinde mevcut ölçeğin yüzde 8 kadarına denk gelen bir kalem olacak."}, {"en": "What is known about the denominator is physical: more than 4,000 miles of pipe, more than 1 million dedicated acres, gathering capacity of 6 billion cubic feet a day and three take-or-pay pipelines able to move 4.05 billion cubic feet a day. A take-or-pay structure means part of the revenue is contracted whether or not the volume shows up, which is firmer ground than an estimated demand curve. The statement, for its part, withholds contract tenors, pricing and current utilisation. Without the ratio of contracted to capacity-dependent revenue, there is no way to say how much of the 650 million dollar denominator is fixed today.", "refs": ["williams"], "tr": "Payda hakkında bilinenler fiziksel: 4.000 milden uzun boru hattı, 1 milyon dönümden fazla tahsisli saha, günde 6 milyar fitküp toplama kapasitesi ve günde 4,05 milyar fitküp taşıyabilen üç al-ya-da-öde hattı. Al-ya-da-öde yapısı, hacim gelmese de gelirin bir bölümünün sözleşmeyle güvenceye alındığı anlamına gelir; bu, tahmini bir talep eğrisinden daha sağlam bir zemindir. Açıklama ise sözleşme sürelerini, fiyatlandırmayı ve mevcut kapasite kullanımını vermiyor. Sözleşmeye bağlı gelir ile kapasiteye bağlı gelir arasındaki oran bilinmeden, 650 milyon dolar tutarındaki paydanın ne kadarının bugünden sabit olduğu söylenemez."}]}, {"h": {"en": "This year's guidance raise belongs elsewhere", "tr": "Bu yılın öngörü artışı başka bir kalem"}, "ps": [{"en": "The quarter reported on the same day should be read apart from the multiple's story. Net income rose 51 per cent to 827 million dollars and diluted earnings to 0.68 dollars a share, while adjusted earnings before interest, taxes, depreciation and amortisation rose 6 per cent to 1.921 billion dollars and available funds from operations rose 10 per cent to 1.450 billion dollars. The distance between 51 per cent and 6 per cent shows that the jump in profit did not come from the operating run-rate. The increase of 200 million dollars in the 2026 guidance midpoint likewise belongs to this year's existing business; the acquired assets have not closed.", "refs": ["williams"], "tr": "İşlemle aynı gün açıklanan çeyrek, çarpanın hikâyesinden ayrı okunmalı. Net kâr yüzde 51 artışla 827 milyon dolar seviyesine, seyreltilmiş hisse başına kâr 0,68 dolar seviyesine çıktı; buna karşılık düzeltilmiş faiz, vergi, amortisman ve itfa öncesi kâr yüzde 6 artışla 1,921 milyar dolar seviyesinde, faaliyetlerden sağlanan kullanılabilir fon yüzde 10 artışla 1,450 milyar dolar seviyesinde kaldı. Yüzde 51 ile yüzde 6 arasındaki açıklık, kârdaki sıçramanın işletme temposundan gelmediğini gösteriyor. 2026 öngörüsünün orta noktasındaki 200 milyon dolar tutarındaki artış da bu yılın mevcut işine ait; devralınan varlıklar henüz kapanmadı."}, {"en": "The composition of the price imposes a second constraint. About 3.5 billion dollars is paid in cash and debt and about 2 billion dollars in Williams equity, and the company gives a pro-forma leverage ratio midpoint of about 3.75. The equity portion limits the step-up in leverage and dilutes existing holders in exchange. The trade-off is between the leverage cost of a debt-funded purchase and the dilution cost of an equity-funded one; the statement quantifies neither, only the outcome.", "refs": ["williams"], "tr": "Bedelin bileşimi ikinci bir kısıt getiriyor. Yaklaşık 3,5 milyar dolar nakit ve borç, yaklaşık 2 milyar dolar Williams hissesi olarak ödeniyor; şirket işlem sonrası kaldıraç oranının orta noktasını yaklaşık 3,75 olarak veriyor. Hisse ile ödenen kısım kaldıraç artışını sınırlıyor, karşılığında mevcut ortakların payını seyreltiyor. Buradaki değiş tokuş, borçla finanse edilmiş bir alımın kaldıraç maliyeti ile hisseyle finanse edilmiş bir alımın seyreltme maliyeti arasında; açıklama ikisini de sayı olarak vermiyor, yalnızca sonucu veriyor."}]}, {"h": {"en": "The single assumption carrying the price", "tr": "Fiyatı taşıyan tek varsayım"}, "ps": [{"en": "The sensitivity runs one way. If 2027 earnings from the acquired assets land 10 per cent below the projection, the implied 650 million dollars falls to about 585 million dollars and the effective multiple rises from 8.5 times to roughly 9.4 times. A shortfall of 20 per cent takes it towards 10.6 times. Because the price is fixed today, the whole margin of error accumulates in the denominator.", "refs": ["williams"], "tr": "Duyarlılık burada tek yönlü. Devralınan varlıklardan 2027 yılında gelen kâr öngörülenin yüzde 10 altında kalırsa, ima edilen 650 milyon dolar yaklaşık 585 milyon dolar seviyesine iner ve fiilî çarpan 8,5 katın yaklaşık 9,4 katına çıkar. Yüzde 20 sapmada çarpan 10,6 kata yaklaşır. Bedel bugünden sabitlendiği için bütün hata payı paydada birikiyor."}, {"en": "What will test that first is the level of disclosure rather than the calendar. The transaction is subject to Hart-Scott-Rodino clearance and customary conditions; once it closes, whether Williams reports the acquired assets as a separate line or folds them into existing segments will determine whether the 8.5 times remains testable. Without separate reporting, the 2027 projection stays a number that cannot be verified from outside.", "refs": ["williams"], "tr": "Bunu ilk sınayacak olan takvim değil, açıklama düzeyi. İşlem Hart-Scott-Rodino onayına ve alışılmış koşullara bağlı; kapanış gerçekleştikten sonra Williams'ın devralınan varlıkları ayrı bir kalem olarak mı yoksa mevcut bölümlerin içinde eritilmiş olarak mı raporladığı, 8,5 katın sınanabilir kalıp kalmadığını belirleyecek. Ayrı raporlanmazsa 2027 öngörüsü dışarıdan doğrulanamayan bir sayı olarak kalır."}]}], "sources": [{"key": "williams", "kind": "news", "name": "Williams", "url": "https://www.williams.com/2026/08/03/williams-delivers-strong-second-quarter-2026-results-announces-strategic-acquisition-of-momentum-midstream-connecting-haynesville-to-gulf-coast-lng-and-power-demand/", "title": {"tr": "Williams, Momentum Midstream'i 5,5 milyar dolar bedelle satın alıyor", "en": "Williams is buying Momentum Midstream for 5.5 billion dollars"}, "publishedDate": "2026-08-03"}], "title": {"en": "8.5 times a year that has not happened yet", "tr": "Henüz yaşanmamış bir yılın 8,5 katı"}, "writer": "eco-03", "date": "2026-08-04"}, {"excerpt": {"en": "Crude slid to about 84 dollars a barrel in a single session while the average US gasoline price stayed above 4 dollars a gallon. The distance between the two sits between the refinery and the storage tank.", "tr": "Ham petrol bir seansta varil başına yaklaşık 84 dolar seviyesine geriledi; ABD'de ortalama benzin fiyatı ise galon başına 4 dolar sınırının üzerinde kaldı. Aradaki mesafe rafineri ile depo arasında duruyor."}, "radarPublishedAt": "2026-08-04T09:14:56+00:00", "sections": [{"h": {"en": "Crude and the pump are priced in two different places", "tr": "Ham petrol ile pompa iki ayrı yerde fiyatlanır"}, "ps": [{"en": "Brent crude fell more than 4 per cent on Monday to about 84 dollars a barrel. The same day, the average US gasoline price stayed above 4 dollars a gallon, against roughly 3 dollars before the war. A single day's fall in crude found no counterpart at the pump, and any reading that expected one was set up wrong to begin with.", "refs": ["gasoline"], "tr": "Brent tipi ham petrol pazartesi günü yüzde 4'ten fazla gerileyerek varil başına yaklaşık 84 dolar seviyesine indi. Aynı gün ABD'de ortalama benzin fiyatı galon başına 4 dolar sınırının üzerinde kalmayı sürdürdü; savaş öncesinde bu ortalama yaklaşık 3 dolar seviyesindeydi. Ham petroldeki tek günlük düşüş pompada karşılığını bulmadı ve bunu bekleyen bir okuma zaten yanlış kurulmuş olur."}, {"en": "The price of gasoline is the price of a product rather than of crude, and that product has already been refined, moved and stored. The gasoline a station sells was refined from crude bought weeks earlier; the refining margin, freight, taxes and the retail margin in between all move on their own. A single session in crude therefore reaches the pump only through product inventories and the refining margin, with a lag measured in weeks. Alternative explanations are also on the table: taxes may not have changed, summer driving demand may be holding product prices up, and the retail margin may be absorbing the fall for now. One day's price gap cannot say which dominates.", "refs": ["gasoline"], "tr": "Benzin fiyatı ham petrolün değil bir ürünün fiyatıdır ve o ürün çoktan üretilmiş, taşınmış ve depolanmıştır. İstasyonun sattığı benzin haftalar önce satın alınmış ham petrolden rafine edilmiştir; aradaki rafineri marjı, nakliye, vergi ve perakende marjı da kendi başlarına hareket eder. Bu yüzden ham petroldeki bir seanslık hareket, ancak ürün stokları ve rafineri marjı üzerinden ve haftalarla ölçülen bir gecikmeyle pompaya ulaşır. Alternatif açıklamalar da masada: vergiler değişmemiş olabilir, yaz sürüş sezonu talebi ürün tarafında yüksek tutuyor olabilir ve perakende marjı düşüşü geçici olarak kendinde tutuyor olabilir. Hangisinin ağır bastığını bir günlük fiyat farkı söyleyemez."}]}, {"h": {"en": "A headline CPI reading is not a pump gauge", "tr": "Manşet tüketici fiyat endeksi pompa göstergesi değildir"}, "ps": [{"en": "Switzerland's CPI fell 0.1 per cent from June to 101.1 points in July, on a December 2025 = 100 basis; annual inflation was 0.4 per cent. That is a national headline reading for a different economy, not a measurement of US gasoline or a proof of fuel-price pass-through. It belongs beside the pump-chain argument as a boundary on what this comparison can establish, rather than inside it.", "refs": ["swisscpi"], "tr": "İsviçre'de tüketici fiyat endeksi temmuzda Aralık 2025=100 temelinde hazirana göre yüzde 0,1 düşerek 101,1 puana indi; yıllık enflasyon yüzde 0,4 oldu. Bu, farklı bir ekonomi için ulusal manşet ölçümdür; ABD benzinini ölçmez ve yakıt fiyatı geçişini kanıtlamaz. Bu nedenle, pompa zinciri savının içinde değil, karşılaştırmanın neyi gösterebileceğinin sınırı olarak yanında durur."}, {"en": "A political demand aimed at the retail price adds no barrel to that chain. The president named Chevron and ExxonMobil, said they had made too much money and asked them to cut the retail price. Yet the retail price sits at the very end of the supply chain, at the point carrying the most intermediary margin. A call that changes neither the cost of crude entering the refinery nor the level of product stocks can move the price only to the extent that it compresses a margin.", "refs": ["gasoline"], "tr": "Perakende fiyata yönelen siyasi çağrının bu zincire ekleyeceği bir varil yok. Başkan Chevron ve ExxonMobil'i adıyla anarak çok fazla para kazandıklarını söyledi ve perakende fiyatı indirmelerini istedi. Oysa perakende fiyat, arz zincirinin en sonunda ve en çok aracının marjını taşıyan noktadadır. Rafineriye giren ham petrolün maliyetini ya da ürün stoklarının düzeyini değiştirmeyen bir çağrı, fiyatı ancak marjı sıkıştırdığı ölçüde hareket ettirebilir."}]}, {"h": {"en": "What to watch", "tr": "Ne izlenmeli"}, "ps": [{"en": "The distinction is measurable over the coming weeks. If Brent holds near 84 dollars a barrel for several weeks and the average US gasoline price does not fall below 4 dollars a gallon, what carries the gap is the refining and retail margin rather than crude. If the average falls below that threshold, the length of the lag will have been measured and the chain is working as expected. The answer should be visible before 30 September 2026.", "refs": ["gasoline"], "tr": "Ayrım önümüzdeki haftalarda ölçülebilir. Brent varil başına 84 dolar civarında birkaç hafta tutunur ve ABD ortalama benzin fiyatı galon başına 4 dolar sınırının altına inmezse, aradaki farkı taşıyan şey ham petrol değil rafineri ve perakende marjıdır. Ortalama fiyat bu sınırın altına inerse gecikmenin süresi ölçülmüş olur ve zincir beklendiği gibi çalışıyor demektir. Bunun cevabı 30 Eylül 2026 tarihinden önce görülür."}]}], "sources": [{"key": "gasoline", "kind": "news", "name": "CBS News", "url": "https://www.cbsnews.com/news/trump-oil-companies-cut-gas-prices/", "title": {"tr": "Trump, Chevron ve ExxonMobil'i benzin fiyatlarını indirmeye çağırdı", "en": "Trump called on Chevron and ExxonMobil to cut gasoline prices"}, "publishedDate": "2026-08-03"}, {"key": "swisscpi", "kind": "news", "name": "Federal Statistical Office (FSO)", "url": "https://www.bfs.admin.ch/news/en/2026-0056", "title": {"tr": "İsviçre'de yıllık enflasyon temmuzda yüzde 0,4'e geriledi", "en": "Swiss annual inflation eased to 0.4 per cent in July"}, "publishedDate": "2026-08-03"}], "title": {"en": "Brent fell 4 per cent on Monday and the pump did not follow", "tr": "Brent pazartesi yüzde 4 düştü, pompa onu izlemedi"}, "writer": "eco-04", "radarUpdatedAt": "2026-08-04T09:55:42+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Clorox says cost pressure will persist while guiding to a gross margin of about 42 per cent and organic sales growth of 3.5 per cent to 4.5 per cent next year. Those two figures together mean the cost is to be recovered from somewhere.", "tr": "Clorox, maliyet baskısının süreceğini söylerken önümüzdeki yıl için brüt kâr marjını yaklaşık yüzde 42 seviyesinde tutmayı ve organik satışları yüzde 3,5 ile yüzde 4,5 arasında büyütmeyi öngörüyor. Bu iki sayı bir arada, maliyetin bir yerden geri alınacağı anlamına geliyor."}, "radarPublishedAt": "2026-08-04T09:14:56+00:00", "sections": [{"h": {"en": "The arithmetic inside the outlook", "tr": "Öngörünün içindeki aritmetik"}, "ps": [{"en": "For the full fiscal year net sales fell 5 per cent to 6.72 billion dollars, organic sales fell 8 per cent and gross margin dropped 290 basis points to 42.3 per cent. For fiscal 2027 the company guides to organic sales growth of 3.5 per cent to 4.5 per cent and a gross margin of about 42 per cent. The same statement says higher-than-normal inflationary headwinds will persist, partly offset by cost savings.", "refs": ["clorox"], "tr": "Mali yılın tamamında net satışlar yüzde 5 azalarak 6,72 milyar dolar seviyesine indi, organik satışlar yüzde 8 geriledi; brüt kâr marjı 290 baz puan düşerek yüzde 42,3 oldu. Şirketin 2027 mali yılı için verdiği öngörü ise organik satışlarda yüzde 3,5 ile yüzde 4,5 arasında büyüme ve yaklaşık yüzde 42 brüt kâr marjı. Aynı açıklamada olağandan yüksek enflasyonist baskıların süreceği, bunun bir bölümünün maliyet tasarruflarıyla dengeleneceği belirtiliyor."}, {"en": "There are only a few ways to hold a margin while costs rise: reduce input cost, spread fixed cost over more units, or raise price. The company counts the first of those in part. The remainder comes from the price paid by the household buying the product. This is the internal logic of the outlook rather than an accusation: once a margin of about 42 per cent is set as a target, some portion of the inflation is necessarily passed to the shelf price.", "refs": ["clorox"], "tr": "Maliyet artarken marjı yerinde tutmanın yolu sınırlıdır: ya girdi maliyeti düşürülür, ya ürün başına düşen sabit gider seyreltilir, ya da fiyat artırılır. Şirket birincisini kısmen sayıyor. Kalanı, ürünü satın alan hanenin ödediği fiyattan gelir. Bu bir suçlama değil, öngörünün kendi iç mantığı: yüzde 42 seviyesinde bir marj hedef olarak konulduğunda, enflasyonun bir bölümü zorunlu olarak raf fiyatına aktarılmış olur."}]}, {"h": {"en": "Price or volume", "tr": "Fiyat mı, hacim mi"}, "ps": [{"en": "Organic sales growth can come from price or from volume, and the company does not split the range it gave for 2027 between the two, though that split is exactly what decides the question. If it comes from volume, households are buying more units, which points to a picture in which income is rising. If it comes from price, the same basket costs more. The same number can mean two opposite things in a household budget, and which one it is cannot be known yet.", "refs": ["clorox"], "tr": "Organik satış büyümesi fiyattan da hacimden de gelebilir ve şirket 2027 için verdiği aralığı bu ikisine bölmüyor; oysa belirleyici olan tam da bu ayrım. Hacimden gelirse hane daha çok ürün alıyor demektir ve bu, gelirin arttığı bir tabloya işaret eder. Fiyattan gelirse aynı sepet daha pahalıya alınıyor demektir. Aynı sayı, hanenin bütçesinde iki zıt anlama gelebiliyor ve hangisi olduğu bugünden bilinmiyor."}, {"en": "Another pair of figures narrows the scale of the question. Net sales growth for fiscal 2027 is guided at 13 per cent to 14 per cent against organic growth of 3.5 per cent to 4.5 per cent. The difference comes from acquired business. The part of the plan a household meets on the shelf is therefore the smaller number in the headline, not the larger one. Given that organic sales fell 8 per cent last year, a target of 3.5 per cent to 4.5 per cent looks closer to recovering through unit price than to winning back the lost volume; that reading can be confirmed or overturned once the split is published.", "refs": ["clorox"], "tr": "Bir başka rakam çifti bu ayrımın ölçeğini daraltıyor. 2027 mali yılı için net satış büyümesi yüzde 13 ile yüzde 14 arasında öngörülürken organik büyüme yüzde 3,5 ile yüzde 4,5 arasında. Aradaki fark satın alınan işten geliyor. Yani hanenin rafta karşılaşacağı planın büyüklüğü, manşetteki büyük sayı değil, küçük olanı. Geçen yıl organik satışların yüzde 8 gerilediği düşünülürse, yüzde 3,5 ile yüzde 4,5 arasındaki hedef kaybedilen hacmi geri almaktan çok birim fiyatla telafi etmeye yakın duruyor; bu okuma, ayrımın açıklanmasıyla doğrulanabilir ya da çürütülebilir."}]}, {"h": {"en": "The one table that will answer it", "tr": "Cevabı verecek tek tablo"}, "ps": [{"en": "The company reports each quarter with organic sales growth split into price and volume components. If volume comes in positive in the first quarter of fiscal 2027 and the price contribution stays small, what holds the margin is cost saving and scale; if volume stays negative and price carries almost all of the growth, the bill for a margin of about 42 per cent has been written directly into the shelf price. That table will be published before 30 November 2026.", "refs": ["clorox"], "tr": "Şirket her çeyrekte organik satış büyümesini fiyat ve hacim bileşenlerine ayırarak açıklıyor. 2027 mali yılının ilk çeyreğinde hacim pozitif gelir ve fiyat katkısı düşük kalırsa, marjı tutan şey maliyet tasarrufu ve ölçek olur; hacim negatif kalır ve büyümenin tamamına yakınını fiyat taşırsa, yüzde 42 seviyesindeki marjın faturası doğrudan raf fiyatına yazılmış demektir. Bu tablo 30 Kasım 2026 tarihinden önce yayımlanacak."}]}], "sources": [{"key": "clorox", "kind": "news", "name": "The Clorox Company", "url": "https://investors.thecloroxcompany.com/news/news-details/2026/Clorox-Reports-Q4-and-FY26-Results-Provides-FY27-Outlook/default.aspx", "title": {"tr": "Clorox'un mali yıl satışları yüzde 5 geriledi, yeni yıl için yüzde 3,5–4,5 organik büyüme öngörüldü", "en": "Clorox's full-year sales fell 5 per cent and the company guided to 3.5 to 4.5 per cent organic growth"}, "publishedDate": "2026-08-03"}], "title": {"en": "Whose basket pays for a 42 per cent gross margin", "tr": "Yüzde 42'lik brüt marjı hangi sepet ödüyor"}, "writer": "eco-05", "date": "2026-08-04"}, {"excerpt": {"en": "The final tranche of the 550 million pound package Aston Martin took in July is conditional on a majority stake in its non-automotive intellectual property leaving the company. That is exactly where the group holding 1.3 billion pounds of existing claims has objected.", "tr": "Aston Martin'in temmuzda aldığı 550 milyon sterlinlik paketin son diliminin şartı, otomotiv dışı fikri mülkiyetin çoğunluk payının şirketten çıkması. 1,3 milyar sterlinlik mevcut alacağı olan grubun itirazı da tam bu noktada."}, "radarPublishedAt": "2026-08-04T09:14:56+00:00", "sections": [{"h": {"en": "The chain", "tr": "Zincir"}, "ps": [{"en": "In July the company secured 550 million pounds of debt financing led by funds managed by BlackRock-owned HPS Investment Partners: a 450 million pound secured term loan, a 100 million pound delayed draw term loan and, separately, 100 million pounds of permitted debt incurrence capacity. On Sunday a group of existing creditors owed 1.3 billion pounds sent a letter before action to the board, saying it could seek to unwind the transaction and to block the disposal of certain intellectual property assets.", "refs": ["astonmartin"], "tr": "Şirket temmuzda, BlackRock'a bağlı HPS Investment Partners'ın yönettiği fonların öncülüğünde 550 milyon sterlinlik borç finansmanı sağladı: 450 milyon sterlinlik teminatlı vadeli kredi, 100 milyon sterlinlik gecikmeli kullanımlı vadeli kredi ve ayrıca 100 milyon sterlinlik ek borçlanma kapasitesi. Pazar günü, şirkete 1,3 milyar sterlin alacağı bulunan mevcut alacaklı grubu yönetim kuruluna dava öncesi ihtarname gönderdi ve işlemi geçersiz kılmayı ve bazı fikri mülkiyet varlıklarının devrini engellemeyi talep edebileceğini bildirdi."}, {"en": "The subject of the fight is less the size of the new money than which assets remain behind the old claims. The extra 100 million pounds is conditional on transferring a 50.1 per cent stake in the company's non-automotive intellectual property to Authentic Brands. If that condition is met, new money arrives while a majority stake leaves the asset pool the existing creditors look to. The opposite case can be argued: those rights may already sit outside the security package, and the transfer may bring cash in and enlarge the total asset base. Which applies stays unresolved while the transfer price and the security definitions remain outside public view.", "refs": ["astonmartin"], "tr": "Kavganın konusu yeni paranın miktarından çok, eski alacağın arkasında hangi varlıkların kalacağı. Ek 100 milyon sterlin, şirketin otomotiv dışı fikri mülkiyetinin yüzde 50,1 payının Authentic Brands'e devredilmesi şartına bağlı. Bu koşul yerine gelirse yeni para gelirken, mevcut alacaklıların baktığı varlık havuzundan çoğunluk payı çıkmış olur. Tersini savunmak da mümkün: söz konusu haklar zaten teminat kapsamı dışında olabilir ve devir karşılığında şirkete nakit girerek toplam varlık tabanını büyütebilir. Hangisinin geçerli olduğu, devir bedelinin ve teminat tanımlarının kamuya açık olmamasıyla belirsiz kalıyor."}]}, {"h": {"en": "What could stop it", "tr": "Bunu ne durdurabilir"}, "ps": [{"en": "The name of the letter describes the stage: before action. With no claim issued, no transfer has been stopped by a court either. The creditors' real leverage is commercial: because HPS's final 100 million pound tranche can be drawn only if the transfer completes, anything that delays the transfer also delays the last piece of the new financing. That is the kind of pressure that pushes parties towards a settlement, whether a waiver, a widening of the security package or a redirection of part of the consideration to the existing debt. Aston Martin and HPS could not be reached for comment outside regular business hours.", "refs": ["astonmartin"], "tr": "İhtarnamenin adı, aşamayı da anlatıyor: dava öncesi. Açılmış bir dava bulunmadığından mahkeme kararıyla durdurulmuş bir devir de yok. Alacaklıların asıl kaldıracı ticari niteliktedir: HPS'nin son 100 milyon sterlinlik dilimi ancak devir tamamlanırsa kullandırılabildiği için, devri geciktirebilecek her ihtimal yeni finansmanın son parçasını da geciktiriyor. Bu, tarafları bir uzlaşmaya —vazgeçme, teminat genişletme ya da bedelin bir bölümünün mevcut borca yönlendirilmesi— itebilecek türden bir baskı. Aston Martin ve HPS mesai saatleri dışında yorum için ulaşılabilir değildi."}]}, {"h": {"en": "The threshold", "tr": "Eşik"}, "ps": [{"en": "The testable threshold is narrow. If the Authentic Brands transfer completes and the additional 100 million pounds is drawn without a standstill agreement or an amendment with the existing creditors, the 1.3 billion pounds of claims will sit behind a smaller asset base. If the transfer is suspended, or completed with the security package widened, the objection will have done its work and the chain will be broken. The difference should be visible by 31 December 2026.", "refs": ["astonmartin"], "tr": "Sınanabilir eşik dar. Authentic Brands devri tamamlanır ve ek 100 milyon sterlin, mevcut alacaklılarla bir bekleme anlaşması ya da sözleşme değişikliği yapılmadan kullandırılırsa, 1,3 milyar sterlinlik alacak daha küçük bir varlık tabanının arkasına düşmüş olur. Devir askıya alınır ya da teminat kapsamı genişletilerek yapılırsa, itiraz amacına ulaşmış ve zincir kopmuş olur. Aradaki fark 31 Aralık 2026 tarihine kadar görünür hale gelecek."}]}], "sources": [{"key": "astonmartin", "kind": "news", "name": "Reuters", "url": "https://www.reuters.com/business/aston-martin-creditors-threaten-legal-action-over-plan-sell-branding-rights-ft-2026-08-03/", "title": {"tr": "Aston Martin'in alacaklıları marka haklarının satışına karşı dava tehdidinde bulundu", "en": "Aston Martin's creditors threatened legal action over the sale of branding rights"}, "publishedDate": "2026-08-03"}], "title": {"en": "The last 100 million pounds arrives only if the trademarks leave", "tr": "Son 100 milyon sterlin ancak markalar çıkarsa geliyor"}, "writer": "eco-06", "radarUpdatedAt": "2026-08-04T10:43:01+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The STOXX 600 rose 0.4 per cent; in the same morning Bayer gained 4.8 per cent and Lufthansa lost 10.6 per cent. The calm index number hides how differently the individual results were priced.", "tr": "STOXX 600 yüzde 0,4 yükseldi; aynı sabah Bayer yüzde 4,8 kazandı, Lufthansa yüzde 10,6 kaybetti. Endeksin sakin rakamı, tek tek bilançoların ne kadar farklı fiyatlandığını gizliyor."}, "sections": [{"h": {"en": "The index is calm, the dispersion is not", "tr": "Endeks sakin, dağılım değil"}, "ps": [{"en": "On the morning of 4 August the pan-European STOXX 600 rose 0.4 per cent and stayed close to the all-time peak set in the closing days of July. As of 10.05 GMT the DAX was up 0.3 per cent, the FTSE 100 0.2 per cent and the FTSE MIB 1 per cent, while the CAC 40 was flat. Anyone reading those five numbers would see an ordinary summer session.", "refs": ["europe"], "tr": "4 Ağustos sabahı pan-Avrupa STOXX 600 endeksi yüzde 0,4 yükseldi ve temmuzun son günlerinde görülen tüm zamanların zirvesine yakın kaldı. Saat 10.05 GMT itibarıyla DAX yüzde 0,3, FTSE 100 yüzde 0,2, FTSE MIB yüzde 1 artıdaydı; CAC 40 ise yatay seyretti. Bu beş rakama bakan biri, sıradan bir yaz seansı görürdü."}, {"en": "Go down to the individual names and the picture changes. Bayer rose 4.8 per cent and Synthomer 5.2 per cent, while Beiersdorf fell 1.8 per cent and Lufthansa 10.6 per cent. The distance between the best and worst reaction in a single session was more than fifteen points. The index's 0.4 per cent records what remains after the weights cancel each other out; it does not average that spread.", "refs": ["europe"], "tr": "Tek tek hisselere inince tablo değişiyor. Bayer yüzde 4,8, Synthomer yüzde 5,2 yükselirken Beiersdorf yüzde 1,8, Lufthansa yüzde 10,6 geriledi. Aynı seansta en iyi ve en kötü tepki arasındaki mesafe on beş puanı aştı. Endeksin yüzde 0,4'ü bu farkın ortalaması değil, birbirini götüren ağırlıklardan geriye kalan."}]}, {"h": {"en": "What the reaction is measured against", "tr": "Tepki neye göre ölçülüyor"}, "ps": [{"en": "HSBC is the clearest example of the morning. The bank's reported profit before tax rose 23 per cent in the first half to 19.5 billion dollars, annualised return on average tangible equity was 18.2 per cent, and a buyback of up to 1 billion dollars was announced. The shares still fell 0.4 per cent. The direction of the result is not the variable; the price is measured against what was already carried in expectations before the release.", "refs": ["europe", "hsbc"], "tr": "HSBC bu sabahın en iyi örneği. Bankanın raporlanan vergi öncesi kârı yılın ilk yarısında yüzde 23 artışla 19,5 milyar dolar oldu, yıllıklandırılmış maddi özkaynak kârlılığı yüzde 18,2 olarak açıklandı ve 1 milyar dolar tutarına kadar hisse geri alımı duyuruldu. Hisse yine de yüzde 0,4 geriledi. Sonucun yönü değişkenin kendisi değil; fiyatın ölçüldüğü yer, açıklamadan önce piyasada zaten karşılığı olan beklenti."}, {"en": "Lufthansa's 10.6 per cent fall did not come from the revenue line. Group revenue rose 8 per cent in the second quarter to 11.1 billion euros; what fell was adjusted EBIT, down to 383 million euros from 870 million euros a year earlier, and the full-year range, set at 1.7 to 2.2 billion euros. What the session penalised looks like the forward number rather than the quarter just closed. One session is not enough to settle that: the same fall could equally fit the unwinding of positioning built up before the release, or a move running through airline shares as a group.", "refs": ["europe", "lufthansa"], "tr": "Lufthansa'nın yüzde 10,6'lık düşüşü ise gelir satırından gelmedi. Grubun ikinci çeyrek geliri yüzde 8 artarak 11,1 milyar euro oldu; düşen kalem, bir yıl önceki 870 milyon euro düzeyinden 383 milyon euro düzeyine inen düzeltilmiş faaliyet kârı ve 1,7-2,2 milyar euro aralığına çekilen yıl geneli beklentisi oldu. Seansın cezalandırdığı şey geçmiş çeyrek değil, ileriye dönük rakam gibi görünüyor. Tek bir seans bunu kanıtlamaz: aynı düşüş, sonuçtan önce yoğunlaşmış bir konumlanmanın çözülmesiyle ya da havayolu hisselerinin bütününe yayılan bir hareketle de açıklanabilir."}]}, {"h": {"en": "Which line got priced", "tr": "Hangi satır fiyatlandı"}, "ps": [{"en": "Bayer's 4.8 per cent asks the same question. Sales rose 2.2 per cent adjusted for currency and portfolio effects and EBITDA before special items 1.9 per cent, while core earnings per share fell 16.7 per cent. There is nothing on the earnings line to carry that move. What changed sits on the other side of the balance sheet: the year-end net financial debt expectation was cut to 29 to 30 billion euros from 32 to 33 billion euros.", "refs": ["europe", "bayer"], "tr": "Bayer'in yüzde 4,8'i de aynı soruyu soruyor. Şirketin satışları kur ve portföy etkisinden arındırılmış olarak yüzde 2,2, özel kalemler öncesi FAVÖK'ü yüzde 1,9 arttı; çekirdek hisse başına kâr yüzde 16,7 geriledi. Kâr satırında yükselişi taşıyacak bir şey yok. Değişen kalem bilançonun öbür tarafında: yıl sonu net finansal borç beklentisi 32 ila 33 milyar euro seviyesinden 29 ila 30 milyar euro seviyesine indirildi."}, {"en": "Read alongside an index sitting near its record, a dispersion this wide leaves one question: is the level being carried by a narrow group? Answering it needs two numbers watched side by side through the rest of the results season. If the daily index change keeps coming in under a percentage point while the range of single-name reactions stays above ten points, participation behind the level is narrower than it looks; if the range narrows, the move really is broad.", "refs": ["europe"], "tr": "Bu genişlikte bir dağılım, endeksin rekora yakın durmasıyla birlikte okunduğunda tek bir soru bırakıyor: toplam seviyeyi dar bir grup mu taşıyor? Cevap için bilanço sezonunun geri kalanında iki rakamı yan yana izlemek yeterli. Günlük endeks değişimi yüzde bir puanın altında kalırken tek hisse tepkilerinin aralığı on puanın üzerinde kalmayı sürdürürse, seviyenin arkasındaki katılım göründüğünden dar demektir; aralık daralırsa hareket gerçekten geneldir."}]}], "sources": [{"key": "europe", "kind": "news", "name": "Investing.com", "url": "https://www.investing.com/news/stock-market-news/european-shares-edge-toward-record-highs-as--earnings-boost-risk-appetite-4832849", "title": {"tr": "Avrupa borsaları rekor seviyelerin yakınında tutundu, bilanço tepkileri sert ayrıştı", "en": "European shares held near record levels while reactions to results diverged sharply"}, "publishedDate": "2026-08-04"}, {"key": "hsbc", "kind": "news", "name": "HSBC Holdings plc", "url": "https://www.hsbc.com/investors/results-and-announcements/all-reporting/interim-results-2026-quick-read", "title": {"tr": "HSBC 1 milyar dolar tutarına kadar hisse geri alımını yeniden başlatıyor, sermaye oranı 0,8 puan düştü", "en": "HSBC is restarting a buyback of up to 1 billion dollars while its capital ratio fell 0.8 points"}, "publishedDate": "2026-08-04"}, {"key": "lufthansa", "kind": "news", "name": "Lufthansa Group", "url": "https://newsroom.lufthansagroup.com/en/lufthansa-group-benefits-from-strong-demand-for-air-travel-and-achieves-an-operating-profit-of-383-million-euros-despite-significantly-higher-fuel-costs/", "title": {"tr": "Lufthansa'nın çeyreklik faaliyet kârı yakıt faturası nedeniyle 383 milyon euro seviyesine geriledi", "en": "Lufthansa's quarterly operating profit fell to 383 million euros as the fuel bill climbed"}, "publishedDate": "2026-08-04"}, {"key": "bayer", "kind": "news", "name": "Bayer AG", "url": "https://www.bayer.com/media/en-us/bayer-operationally-on-track-decisive-progress-on-strategic-priorities/", "title": {"tr": "Bayer'in çeyreklik satışları yüzde 2,2 arttı, net borç beklentisi 29 ila 30 milyar euro seviyesine indirildi", "en": "Bayer's quarterly sales rose 2.2 per cent and its net debt guidance was cut to 29 to 30 billion euros"}, "publishedDate": "2026-08-04"}], "title": {"en": "Two results fifteen points apart on an index that moved 0.4 per cent", "tr": "Yüzde 0,4 oynayan bir endekste on beş puan ayrı düşen iki bilanço"}, "writer": "eco-01", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The Treasury raised its July-September borrowing estimate to 739 billion dollars. The figure carries projected cash flows and the balance the Treasury intends to be holding, in one number.", "tr": "Hazine temmuz-eylül borçlanma tahminini 739 milyar dolar seviyesine çıkardı. Rakamın içinde öngörülen nakit akışları kadar, tutulmak istenen kasa bakiyesi de var."}, "sections": [{"h": {"en": "Two numbers, two different things", "tr": "İki rakam, iki ayrı şey"}, "ps": [{"en": "On 3 August the US Treasury said it expects to borrow 739 billion dollars of privately-held net marketable debt in the July-September quarter, 68 billion dollars above the estimate it gave in May. The same announcement put expected October-December borrowing at 628 billion dollars. Both figures rest on an assumption: a cash balance of 950 billion dollars at the end of September and 850 billion dollars at the end of December.", "refs": ["treasury"], "tr": "ABD Hazinesi 3 Ağustos'ta temmuz-eylül çeyreğinde özel kesimin elinde tutulan net pazarlanabilir borçtan 739 milyar dolar borçlanmayı beklediğini açıkladı; mayısta verdiği tahmin bunun 68 milyar dolar altındaydı. Aynı açıklamada ekim-aralık için beklenen borçlanma 628 milyar dolar olarak verildi. Her iki rakam da birer varsayıma bağlı: eylül sonunda 950 milyar dolar, aralık sonunda 850 milyar dolar tutarında nakit bakiyesi."}, {"en": "The previous quarter is the comparison to hold. Actual April-June borrowing was 190 billion dollars and the quarter closed with 919 billion dollars of cash; the May estimate had been 189 billion dollars of borrowing and a 900 billion dollar balance. The miss on the borrowing side was 1 billion dollars, while the difference in the cash box was 19 billion dollars.", "refs": ["treasury"], "tr": "Karşılaştırma için geçmiş çeyreğe bakmak yeterli. Nisan-haziranda gerçekleşen borçlanma 190 milyar dolar oldu ve çeyrek 919 milyar dolar tutarında nakitle kapandı; mayıs tahmini 189 milyar dolar borçlanma ve 900 milyar dolar tutarında bakiye yönündeydi. Yani borçlanma tarafındaki sapma 1 milyar dolar seviyesinde kaldı, kasadaki fark 19 milyar dolar oldu."}]}, {"h": {"en": "Whose asset, whose liability", "tr": "Kimin varlığı, kimin borcu"}, "ps": [{"en": "Start with an accounting identity. Privately-held net marketable debt is, by construction, an asset acquired outside the government: issuing 739 billion dollars means the same quantity of bills and bonds being distributed among households, banks, funds and foreign official institutions. The orthodox objection belongs here and is fair: that much paper has a price and demand is not infinite, so issuance need be neither unlimited nor cheap. What the identity does not say is that issuance must wait for a pool of savings to form first.", "refs": ["treasury"], "tr": "Bir muhasebe eşitliğiyle başlayalım. Özel kesimin elinde tutulan net pazarlanabilir borç, tanımı gereği devlet dışındaki kesimin edindiği bir varlıktır: 739 milyar dolar tutarında ihraç, aynı büyüklükte bir tahvil ve bono stokunun hanehalkları, bankalar, fonlar ve yabancı resmî kurumlar arasında paylaşılması demek. Ortodoks itiraz burada haklı olarak devreye girer: bu kadar kâğıdın bir fiyatı vardır ve talep sonsuz olmadığı için ihraç ne sınırsızdır ne de ucuz olmak zorundadır. Yine de eşitlik, ihracın önce bir tasarruf havuzunun oluşmasını beklemesi gerektiğini söylemiyor."}, {"en": "The real information is in the reason given for the revision. The Treasury said the increase was primarily due to lower projected net cash flows, partly offset by a higher-than-assumed cash balance at the start of the quarter. That means receipts running weaker than expected or outlays running higher; the announcement does not separate the two. A shift in the timing of a one-off collection would produce the same result, in which case part of the 68 billion dollars is an item that changed quarter rather than a deteriorating revenue trend.", "refs": ["treasury"], "tr": "Asıl bilgi, revizyonun gerekçesinde. Hazine, artışın başlıca nedeninin öngörülen net nakit girişlerindeki düşüş olduğunu, çeyrek başındaki nakit bakiyesinin varsayılandan yüksek çıkmasının ise bu etkiyi kısmen dengelediğini belirtti. Bu, gelirlerin beklenenden zayıf ya da harcamaların beklenenden yüksek olduğu anlamına gelir; ikisinin ayrımı açıklamada yok. Aynı sonucu, tek seferlik bir tahsilat takviminin ileri kayması da üretebilir; o durumda 68 milyar dolar tutarındaki artışın bir bölümü çeyrek değiştirmiş bir kalemdir, bozulan bir gelir eğilimi değil."}]}, {"h": {"en": "The question to carry forward", "tr": "Sorulacak olan"}, "ps": [{"en": "Reading the US Treasury's 739 billion dollar estimate on its own as a measure of strain would therefore be wrong. Inside the figure sits a 950 billion dollar cash target that will not be spent; the Treasury borrows to hold that balance too. October makes the difference measurable: if actual July-September borrowing lands clearly below 739 billion dollars and the quarter closes with a cash balance near 950 billion dollars, the problem was the timing of collections rather than a durable weakness in receipts. Until that number arrives, the same amount can be read either as a temporary shift in timing or as a durable weakness in receipts — and while that does not change who ends up holding the debt, it does change the maturity and the price at which they hold it. The question worth carrying is the one the announcement leaves open: which item in projected net cash flows fell?", "refs": ["treasury"], "tr": "Bu yüzden ABD Hazinesi'nin 739 milyar dolar tutarındaki tahminini tek başına bir gerilim ölçüsü olarak okumak yanlış olur. Rakamın içinde, harcanmayacak olan 950 milyar dolar tutarında kasa hedefi de var; Hazine bu bakiyeyi tutmak için de borçlanır. Ayrım ekimde ölçülebilir hale gelecek: temmuz-eylülde gerçekleşen borçlanma 739 milyar dolar seviyesinin belirgin altında kalır ve çeyrek 950 milyar dolar civarında bir nakit bakiyesiyle kapanırsa, sorun kalıcı bir gelir zayıflığı değil tahsilat takvimiydi. O rakam gelene kadar aynı tutar hem geçici bir takvim kayması hem de kalıcı bir gelir zayıflığı olarak okunabilir; ve bu ikisi, borcu kimin taşıyacağı sorusunun cevabını değiştirmese de vadeyi ve fiyatı değiştirir. Asıl merak edilmesi gereken şu: öngörülen net nakit girişleri hangi kalemde düştü?"}]}], "sources": [{"key": "treasury", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0584", "title": {"tr": "ABD Hazinesi temmuz-eylül borçlanma tahminini 739 milyar dolar seviyesine yükseltti", "en": "The US Treasury raised its July-September borrowing estimate to 739 billion dollars"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who ends up holding the extra 68 billion dollars", "tr": "Fazladan 68 milyar dolar sonunda kimin elinde kalacak"}, "writer": "eco-02", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "Toyota lifted its full-year operating income forecast to 3.4 trillion yen. On the same day the dollar assumption moved to 160 yen from 150, and in the quarter just closed operating income had fallen.", "tr": "Toyota yıl geneli faaliyet kârı öngörüsünü 3,4 trilyon yene çıkardı. Aynı gün dolar varsayımı 150 yenden 160 yene taşındı ve geride bıraktığı çeyrekte faaliyet kârı düşmüştü."}, "sections": [{"h": {"en": "The quarter and the forecast did not move together", "tr": "Çeyrek ile öngörü aynı yöne gitmedi"}, "ps": [{"en": "In the April-June quarter Toyota's sales revenue rose 1,272.0 billion yen to 13,525.4 billion yen. Operating income over the same period fell 102.6 billion yen to 1,063.4 billion yen. Net income attributable to Toyota, meanwhile, rose 635.6 billion yen to 1,477.0 billion yen. Three lines, three different directions.", "refs": ["toyota"], "tr": "Nisan-haziran çeyreğinde Toyota'nın satış geliri 1.272,0 milyar yen artarak 13.525,4 milyar yene çıktı. Faaliyet kârı ise aynı dönemde 102,6 milyar yen azalarak 1.063,4 milyar yende kaldı. Buna karşılık Toyota'ya düşen net kâr 635,6 milyar yen artışla 1.477,0 milyar yene ulaştı. Üç satır, üç ayrı yön."}, {"en": "On the forecast side the movement is all one way. Full-year operating income expectations went to 3,400.0 billion yen from 3,000.0 billion, sales revenue to 54,000.0 billion yen from 51,000.0 billion, and net income to 3,250.0 billion yen from 3,000.0 billion. Raising the full-year operating income expectation by 400 billion yen after a quarter in which operating income fell says that an assumption changed somewhere in between.", "refs": ["toyota"], "tr": "Öngörü tarafında hareket tek yönlü. Yıl geneli faaliyet kârı beklentisi 3.000,0 milyar yenden 3.400,0 milyar yene, satış geliri beklentisi 51.000,0 milyar yenden 54.000,0 milyar yene, net kâr beklentisi 3.000,0 milyar yenden 3.250,0 milyar yene çıkarıldı. Faaliyet kârının gerilediği bir çeyreğin ardından yıl geneli faaliyet kârı beklentisinin 400 milyar yen artması, arada bir yerde bir varsayımın değiştiğini söylüyor."}]}, {"h": {"en": "Which assumption is carrying it", "tr": "Hangi varsayım taşıyor"}, "ps": [{"en": "The assumption that changed is currency. For the full year the dollar assumption moved to 160 yen from 150, and the euro assumption to 181 yen from 180. Rates realised in the quarter were already 160 yen to the dollar and 185 to the euro, against 145 and 164 a year earlier. For an export-weighted manufacturer, a weaker assumed yen mechanically lifts translated revenue and operating income, so part of the 400 billion yen is a change in assumption rather than an improvement in operations.", "refs": ["toyota"], "tr": "Değişen varsayım kur. Yıl geneli için dolar başına 150 yen olan varsayım 160 yene, euro başına 180 yen olan varsayım 181 yene alındı. Çeyrekte gerçekleşen kurlar zaten dolar başına 160, euro başına 185 yendi; bir yıl önce sırasıyla 145 ve 164 yendi. İhracat ağırlıklı bir üreticide daha zayıf bir yen varsayımı, çevrilen gelir ve faaliyet kârını mekanik olarak yukarı taşır; dolayısıyla 400 milyar yenin bir bölümü faaliyetteki bir iyileşme değil, varsayımdaki bir değişikliktir."}, {"en": "I cannot settle that split, because the company does not break the revision down line by line. The same increase could come from cost reduction and volume, in which case the ten yen on the currency assumption is only an accompanying update. The one measurable thing is that the quarter's realised rate already sat at the level of the new assumption. The gap between net and operating income leaves a second question: with net income up 635.6 billion yen while operating income fell 102.6 billion, the whole of the increase came from below the operating line, and the summary I read does not itemise it.", "refs": ["toyota"], "tr": "Bu ayrımı kesinleştiremem, çünkü şirket revizyonu kalem kalem ayırmıyor. Aynı artış, maliyet düşürme ve hacim kaynaklı da olabilir; bu durumda kur varsayımındaki on yen yalnızca eşlik eden bir güncellemedir. Elde ölçülebilir tek şey, çeyreğin gerçekleşen kurunun zaten yeni varsayımla aynı seviyede olması. Net kâr ile faaliyet kârı arasındaki fark ise ikinci bir soru bırakıyor: net kâr 635,6 milyar yen artarken faaliyet kârı 102,6 milyar yen gerilediğine göre artışın tamamı faaliyet satırının altından geldi; okuduğum özet ise bu kalemi ayrıştırmıyor."}]}, {"h": {"en": "The test is now measurable", "tr": "Sınama artık ölçülebilir"}, "ps": [{"en": "The revised forecast leaves four figures to put side by side when the fiscal year ends: 54,000.0 billion yen in sales revenue, 3,400.0 billion yen in operating income, 3,250.0 billion yen in net income and an assumed average of 160 yen to the dollar. The April-June quarter already delivered 13,525.4 billion yen of revenue and 1,063.4 billion yen of operating income at a realised dollar rate of 160 yen. That makes the remaining quarters the useful comparison: how much operating income arrives while the currency baseline is already embedded in the forecast?", "refs": ["toyota"], "tr": "Güncellenen öngörü, mali yıl kapandığında yan yana konacak dört sayı bırakıyor: 54.000,0 milyar yen satış geliri, 3.400,0 milyar yen faaliyet kârı, 3.250,0 milyar yen net kâr ve dolar başına 160 yenlik ortalama kur varsayımı. Nisan-haziran çeyreği, gerçekleşen dolar kuru 160 yen düzeyindeyken 13.525,4 milyar yen gelir ve 1.063,4 milyar yen faaliyet kârı üretti. Bu nedenle yararlı karşılaştırma kalan çeyreklerde: kur dayanağı öngörüye zaten yerleşmişken ne kadar faaliyet kârı gelecek?"}, {"en": "My test is straightforward. If full-year operating income finishes near 3,400.0 billion yen while the realised average dollar rate is clearly stronger than 160 yen, operating execution will have supplied more of the revision than the currency assumption suggests. If the average rate is around 160 yen and operating income merely reaches the forecast, the revision will have tracked the new currency baseline more closely. Either result still needs the missing bridge from revenue to operating income: volume, price and cost disclosures. Until Toyota provides that bridge, 3,400.0 billion yen and the realised average dollar rate are the two observables that can narrow the range; they cannot allocate the 400 billion yen on their own.", "refs": ["toyota"], "tr": "Benim sınamam basit. Yıl geneli faaliyet kârı 3.400,0 milyar yen dolayında kalırken gerçekleşen ortalama dolar kuru 160 yenden belirgin biçimde güçlü çıkarsa, revizyonda faaliyet uygulamasının payı kur varsayımının işaret ettiğinden büyük olur. Ortalama kur 160 yen dolayında kalır ve faaliyet kârı öngörüyü ancak yakalarsa, revizyon yeni kur dayanağını daha yakından izlemiş olur. Her iki sonuç için de gelirden faaliyet kârına uzanan eksik köprü gerekir: hacim, fiyat ve gider açıklamaları. Toyota bu köprüyü kurana kadar 3.400,0 milyar yen ile gerçekleşen ortalama dolar kuru, aralığı daraltabilecek iki gözlemdir; 400 milyar yenin dağılımını tek başlarına gösteremezler."}]}], "sources": [{"key": "toyota", "kind": "news", "name": "Toyota Motor Corporation", "url": "https://www.sec.gov/Archives/edgar/data/1094517/000119312526331392/d258414dex992.htm", "title": {"tr": "Toyota yıl geneli faaliyet kârı öngörüsünü 3,4 trilyon yene çıkardı, dolar varsayımını 160 yene çekti", "en": "Toyota raised its full-year operating income forecast to 3.4 trillion yen and moved its dollar assumption to 160 yen"}, "publishedDate": "2026-08-04"}], "title": {"en": "Four hundred billion yen more, ten yen weaker", "tr": "Dört yüz milyar yen fazla, on yen daha zayıf"}, "writer": "eco-03", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The same quarter shows up in two sets of books: 5.7 billion dollars of underlying profit at BP and roughly 750 million euros of additional fuel cost at Lufthansa. The reports show a transfer through the energy chain, with different ledgers at each end.", "tr": "Aynı çeyrek iki bilançoda görünüyor: BP'de 5,7 milyar dolar temel kâr, Lufthansa'da yaklaşık 750 milyon euro ek yakıt gideri. Raporlar, enerji zincirinde iki uçta farklı hesaplarla görünen bir aktarımı gösteriyor."}, "sections": [{"h": {"en": "One quarter, two sets of books", "tr": "Bir çeyrek, iki defter"}, "ps": [{"en": "BP's underlying replacement cost profit for the second quarter was 5.7 billion dollars, against 3.2 billion dollars in the first quarter and 2.4 billion dollars a year earlier. Operating cash flow went from 6.3 billion dollars to 10.9 billion dollars, and net debt fell to 22.3 billion dollars by the end of the quarter. The quarter also carried a net impairment of 888 million dollars, so the figure is not all a gift from crude.", "refs": ["bp"], "tr": "BP'nin ikinci çeyrek yenileme maliyetine göre temel kârı 5,7 milyar dolar oldu. İlk çeyrekte 3,2 milyar dolar, bir yıl önceki aynı çeyrekte 2,4 milyar dolar seviyesindeydi. Faaliyetlerden sağlanan nakit 6,3 milyar dolar düzeyinden 10,9 milyar dolar düzeyine çıktı, net borç çeyrek sonunda 22,3 milyar dolar seviyesine indi. Çeyrekte 888 milyon dolar tutarında net değer düşüklüğü de yazıldı, yani rakamın tamamı ham petrolün armağanı değil."}, {"en": "Over the same three months Lufthansa Group's revenue rose 8 per cent to 11.1 billion euros, but adjusted EBIT fell to 383 million euros from 870 million euros. The company booked roughly 750 million euros of additional fuel costs in the quarter. Net income went from 1.0 billion euros to 123 million euros, and adjusted free cash flow from 138 million euros to minus 365 million euros. What changed was not the fleet or the demand for seats but the price of what goes into the tank.", "refs": ["lufthansa"], "tr": "Aynı üç ayda Lufthansa Group'un geliri yüzde 8 artarak 11,1 milyar euro oldu, ama düzeltilmiş faaliyet kârı 870 milyon euro düzeyinden 383 milyon euro düzeyine indi. Şirket çeyrekte yaklaşık 750 milyon euro ek yakıt gideri yazdı. Net kâr 1,0 milyar euro düzeyinden 123 milyon euro düzeyine, düzeltilmiş serbest nakit akışı 138 milyon euro düzeyinden eksi 365 milyon euro düzeyine geçti. Uçak sayısı ya da yolcu talebi değil, depoya giren şeyin fiyatı değişti."}]}, {"h": {"en": "The barrel's calendar", "tr": "Varilin takvimi"}, "ps": [{"en": "A quarterly total can hide the route the money took. BP reported underlying second-quarter profit, while Lufthansa reported quarterly operating profit as its fuel bill climbed. The two reports put the same energy chain into separate company accounts: one starts with the producer's result, the other with the carrier's fuel bill.", "tr": "Çeyreklik toplam, paranın izlediği yolu gizleyebilir. BP ikinci çeyrek temel kârını açıkladı; Lufthansa ise yakıt faturası yükselirken çeyreklik faaliyet kârını açıkladı. İki rapor aynı enerji zincirini ayrı şirket hesaplarına yerleştiriyor: biri üreticinin sonucuyla, diğeri taşıyıcının yakıt faturasıyla başlıyor.", "refs": ["bp", "lufthansa"]}, {"en": "Those ledgers should not be matched one to one. BP reports underlying profit, whereas Lufthansa reports operating profit and a higher fuel bill. The shared energy chain is visible, while each reported line is made by a different business at a different end of that chain.", "tr": "Bu hesapları bire bir eşleştirmek doğru olmaz. BP temel kârı açıklarken Lufthansa faaliyet kârını ve yükselen yakıt faturasını açıklıyor. Ortak enerji zinciri görünür durumda; açıklanan her kalem zincirin farklı ucundaki ayrı bir işten doğuyor.", "refs": ["bp", "lufthansa"]}]}, {"h": {"en": "Where the company itself points", "tr": "Şirketin kendi işaret ettiği yer"}, "ps": [{"en": "This time the airline said plainly which input it is watching: it set its full-year adjusted EBIT expectation at 1.7 to 2.2 billion euros to reflect volatility in the kerosene price. A range of five hundred million euros is a measure of price uncertainty rather than a demand forecast. The segments say the same thing: Network Airlines' adjusted EBIT fell 490 million euros while the cargo side rose 43 million euros to 116 million euros.", "refs": ["lufthansa"], "tr": "Havayolu bu kez hangi girdiye baktığını açıkça söyledi: yıl geneli düzeltilmiş faaliyet kârı beklentisini, jet yakıtı fiyatındaki oynaklığı yansıtacak biçimde 1,7-2,2 milyar euro aralığında verdi. Beş yüz milyon euro genişliğindeki bir aralık, bir talep tahmininden çok bir fiyat belirsizliğinin ölçüsü. Bölümlere inildiğinde de aynı şey görünüyor: ağ havayollarının düzeltilmiş faaliyet kârı 490 milyon euro azalırken kargo tarafı 43 milyon euro artışla 116 milyon euro oldu."}, {"en": "Next quarter, the useful comparison is Lufthansa's disclosed fuel-cost change and adjusted EBIT range alongside BP's underlying profit. If Lufthansa reports a further additional fuel cost, the contrast will remain a comparison of separate operating lines: its range already reflects kerosene-price volatility, while BP discloses underlying profit separately. The reports can show whether the contrast persists without turning either line into a stand-in for the other.", "tr": "Gelecek çeyrekte yararlı karşılaştırma, Lufthansa'nın açıkladığı yakıt gideri değişimi ve düzeltilmiş faaliyet kârı aralığını BP'nin temel kârıyla yan yana koymak olacak. Lufthansa yeni bir ek yakıt gideri açıklarsa karşıtlık ayrı faaliyet kalemlerinin karşılaştırması olarak sürecek: şirketin aralığı zaten jet yakıtı fiyatındaki oynaklığı yansıtıyor, BP ise temel kârı ayrı açıklıyor. Raporlar karşıtlığın sürüp sürmediğini gösterebilir; hiçbir kalemi diğerinin yerine koymadan.", "refs": ["bp", "lufthansa"]}]}], "sources": [{"key": "bp", "kind": "news", "name": "BP p.l.c.", "url": "https://www.sec.gov/Archives/edgar/data/313807/000031380726000016/bp-20260630.htm", "title": {"tr": "BP'nin ikinci çeyrek temel kârı 5,7 milyar dolar oldu, net borcu 22,3 milyar dolar seviyesine indi", "en": "BP's underlying second-quarter profit rose to 5.7 billion dollars and net debt fell to 22.3 billion dollars"}, "publishedDate": "2026-08-04"}, {"key": "lufthansa", "kind": "news", "name": "Lufthansa Group", "url": "https://newsroom.lufthansagroup.com/en/lufthansa-group-benefits-from-strong-demand-for-air-travel-and-achieves-an-operating-profit-of-383-million-euros-despite-significantly-higher-fuel-costs/", "title": {"tr": "Lufthansa'nın çeyreklik faaliyet kârı yakıt faturası nedeniyle 383 milyon euro seviyesine geriledi", "en": "Lufthansa's quarterly operating profit fell to 383 million euros as the fuel bill climbed"}, "publishedDate": "2026-08-04"}], "title": {"en": "BP's profit and Lufthansa's fuel bill: one quarter", "tr": "BP'nin kârı ile Lufthansa'nın yakıt faturası: aynı çeyrek"}, "writer": "eco-04", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "McDonald's reported 1.3 per cent comparable sales growth, with the United States trailing both international segments as loyalty-member sales and active users expanded across 70 markets.", "tr": "McDonald's karşılaştırılabilir satışlarda yüzde 1,3 artış bildirdi. ABD her iki uluslararası bölümün gerisinde kalırken 70 pazarda sadakat üyelerine yapılan satışlar ve etkin kullanıcı sayısı arttı."}, "sections": [{"h": {"en": "One headline, three segment speeds", "tr": "Tek başlık, üç bölüm hızı"}, "ps": [{"en": "McDonald's grew global comparable sales 1.3 per cent in the second quarter. The distribution is uneven: the United States managed 0.8 per cent while International Operated Markets grew 1.5 per cent and International Developmental Licensed Markets 1.9 per cent. Total revenues rose 4 per cent to 7,099 million dollars and global systemwide sales 5 per cent to 37 billion dollars.", "refs": ["mcdonalds"], "tr": "McDonald's ikinci çeyrekte küresel karşılaştırılabilir satışlarını yüzde 1,3 artırdı. Bu artışın dağılımı düzgün değil: ABD yüzde 0,8'de kalırken şirketin işlettiği uluslararası pazarlar yüzde 1,5, geliştirme lisanslı pazarlar yüzde 1,9 büyüdü. Toplam gelir yüzde 4 artışla 7.099 milyon dolar, sistem geneli satışlar yüzde 5 artışla 37 milyar dolar oldu."}, {"en": "That 1.3 per cent is a company-wide result assembled from markedly different segment rates. The United States trails both international segments, while revenue and systemwide sales describe still broader company totals. These measures establish that McDonald's expanded during the quarter. The published figures give no customer-income groups, household budgets or visit-frequency breakdown, so the distributional question remains open.", "refs": ["mcdonalds"], "tr": "Yüzde 1,3, hızları belirgin biçimde ayrışan bölümlerin oluşturduğu şirket geneli bir sonuç. ABD her iki uluslararası bölümün gerisinde kalırken gelir ve sistem geneli satışlar daha geniş şirket toplamlarını anlatıyor. Bu ölçüler McDonald's'ın çeyrekte büyüdüğünü gösteriyor. Yayımlanan verilerde müşterilerin gelir grubu, hane bütçesi veya ziyaret sıklığı ayrımı bulunmadığı için dağılım sorusu açık kalıyor."}]}, {"h": {"en": "The channel inside the total", "tr": "Toplamın içindeki kanal"}, "ps": [{"en": "A second distribution appears in the loyalty figures. Across 70 loyalty markets, trailing-twelve-month systemwide sales to members rose more than 20 per cent to 40 billion dollars, while 90-day active users rose 13 per cent to nearly 220 million. Quarterly systemwide sales separately rose 5 per cent to 37 billion dollars. The periods differ, so those growth rates cannot be treated as a direct ratio.", "refs": ["mcdonalds"], "tr": "Sadakat verilerinde ikinci bir dağılım görülüyor. Programın bulunduğu 70 pazarda son on iki ayda üyelere yapılan sistem geneli satışlar yüzde 20'nin üzerinde artarak 40 milyar dolar oldu; 90 günlük etkin kullanıcı sayısı yüzde 13 artışla 220 milyon seviyesine yaklaştı. Çeyreklik sistem geneli satışlar ise yüzde 5 artarak 37 milyar dolar oldu. Dönemler farklı olduğu için bu artış oranları doğrudan birbirine bölünemez."}, {"en": "The simultaneous rise in loyalty-member sales and active users makes membership expansion one plausible contributor to the channel's scale. Several other mechanisms fit the same figures: purchase frequency, order size and product mix could each move. McDonald's gives no separation among them here. For households, that missing split determines whether the channel is reaching more people, drawing existing members back more often or collecting more from each order.", "refs": ["mcdonalds"], "tr": "Sadakat üyelerine yapılan satışlarla etkin kullanıcı sayısının birlikte artması, üyelik tabanındaki genişlemeyi kanalın ölçeğine katkı sağlayan olası etkenlerden biri yapıyor. Aynı verilere satın alma sıklığı, sipariş büyüklüğü ve ürün bileşimindeki değişimler de uyabilir. McDonald's burada bu etkenleri ayrıştırmıyor. Haneler açısından bu ayrım, kanalın daha çok kişiye mi ulaştığını, mevcut üyeleri daha sık mı getirdiğini, yoksa sipariş başına daha çok mu topladığını belirliyor."}]}, {"h": {"en": "Which geography, which household", "tr": "Hangi coğrafya, hangi hane"}, "ps": [{"en": "Geography adds another split. In International Operated Markets, Germany, Australia and the United Kingdom led the growth while France partly offset it. Of the three segments the weakest was the United States at 0.8 per cent. In a quarter when operating income rose 3 per cent to 3,338 million dollars, comparable sales in the best-known market stayed below a percentage point.", "refs": ["mcdonalds"], "tr": "Coğrafya bir ayrım daha ekliyor. Şirketin işlettiği uluslararası pazarlarda büyümeye Almanya, Avustralya ve Birleşik Krallık öncülük etti, Fransa ise artışı kısmen dengeledi. Üç bölüm arasında en zayıfı yüzde 0,8 ile ABD oldu. Faaliyet kârının yüzde 3 artarak 3.338 milyon dolar olduğu bir çeyrekte, en yakından tanınan pazarın karşılaştırılabilir satışları yüzde bir puanın altında kaldı."}, {"en": "Together, the segment and loyalty figures locate two places to watch: the slower US business and the expanding loyalty channel. They also sharpen the unanswered household question. Growth could come through membership, purchase frequency, order value or some combination, and each path reaches a different distribution of customers. The next useful comparison is the US comparable sales rate alongside loyalty-member sales and active-user growth; a household conclusion still needs visit, order-value or customer-income data.", "refs": ["mcdonalds"], "tr": "Bölüm ve sadakat verileri birlikte ele alındığında izlenecek iki yer beliriyor: daha yavaş büyüyen ABD işi ile genişleyen sadakat kanalı. Bu görünüm, hanelere ilişkin yanıtlanmamış soruyu da keskinleştiriyor. Büyümenin kaynağı üyelik, satın alma sıklığı, sipariş tutarı veya bunların birleşimi olabilir; her yol farklı bir müşteri dağılımına ulaşır. Bir sonraki yararlı karşılaştırma, ABD karşılaştırılabilir satış oranını sadakat üyesi satışları ve etkin kullanıcı artışıyla yan yana koyar; hanelere ilişkin sonuç için ziyaret, sipariş tutarı veya müşteri geliri verisi yine gerekir."}]}], "sources": [{"key": "mcdonalds", "kind": "news", "name": "McDonald's Corporation", "url": "https://corporate.mcdonalds.com/corpmcd/our-stories/article/Q2-2026-results.html", "title": {"tr": "McDonald's'ın küresel karşılaştırılabilir satışları yüzde 1,3 arttı, ABD yüzde 0,8'de kaldı", "en": "McDonald's global comparable sales rose 1.3 per cent while the US managed 0.8 per cent"}, "publishedDate": "2026-08-04"}], "title": {"en": "McDonald's growth map runs through loyalty and a slower US", "tr": "McDonald's'ın büyüme haritasında sadakat kanalı ve yavaşlayan ABD var"}, "writer": "eco-05", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "HSBC announced a buyback of up to 1 billion dollars. In the same statement its CET1 capital ratio fell 0.8 points to 14.1 per cent, and the credit losses it expects this year sit above its own medium-term range.", "tr": "HSBC 1 milyar dolar tutarına kadar hisse geri alımı duyurdu. Aynı açıklamada CET1 sermaye oranı 0,8 puan düşerek yüzde 14,1 seviyesine indi ve bankanın bu yıl için beklediği kredi zararı, kendi orta vadeli aralığının üzerinde."}, "sections": [{"h": {"en": "The buffer thinned from three directions at once", "tr": "Tampon üç yönden birden eridi"}, "ps": [{"en": "HSBC's CET1 capital ratio fell 0.8 percentage points from the end of last year to 14.1 per cent. By the bank's own account three items did it: the privatisation of Hang Seng Bank, dividends and an increase in risk-weighted assets. All three run the same way, and two of them are the bank's own choice.", "refs": ["hsbc"], "tr": "HSBC'nin CET1 sermaye oranı geçen yılın sonuna göre 0,8 puan düşerek yüzde 14,1 seviyesine indi. Bankanın kendi açıklamasına göre bu düşüşte üç kalem etkili: Hang Seng Bank'ın halka açıklıktan çıkarılması, temettüler ve risk ağırlıklı varlıklardaki artış. Üçü de aynı yöne çalışıyor ve ikisi bankanın kendi tercihi."}, {"en": "The same statement adds a fourth item. The bank said it planned a buyback of up to 1 billion dollars, its first since the announcement of the Hang Seng Bank privatisation, and approved a second interim dividend of 0.10 dollars a share for the second quarter. One more item is being added, deliberately, to the list of things keeping the buffer thin.", "refs": ["hsbc"], "tr": "Aynı açıklamada dördüncü bir kalem daha var. Banka 1 milyar dolar tutarına kadar hisse geri alımı planladığını, bunun Hang Seng Bank'ın halka açıklıktan çıkarılmasının duyurulmasından bu yana ilk geri alım olduğunu bildirdi. İkinci çeyrek için hisse başına 0,10 dolar ara temettü de onaylandı. Yani tamponu ince tutan kalemlerin listesine, bilerek bir tane daha ekleniyor."}]}, {"h": {"en": "What sits on the other side", "tr": "Karşı tarafta ne var"}, "ps": [{"en": "The resilience case deserves to be put properly. Reported profit before tax rose 23 per cent in the first half to 19.5 billion dollars; excluding notable items, profit before tax was 20.4 billion dollars and revenue 38.2 billion dollars, both of which the bank reported growing 6 per cent on a constant-currency basis. Return on average tangible equity was 18.2 per cent annualised, or 19.1 per cent excluding notable items. Banking net interest income rose 1.6 billion dollars to 22.9 billion dollars and the bank expects at least 46 billion dollars in 2026. Against earnings power like that, a 1 billion dollar buyback is small.", "refs": ["hsbc"], "tr": "Dayanıklılık tarafını hakkıyla kurmak gerekir. Raporlanan vergi öncesi kâr yılın ilk yarısında yüzde 23 artışla 19,5 milyar dolar oldu; kayda değer kalemler hariç vergi öncesi kâr 20,4 milyar dolar, gelir 38,2 milyar dolar olarak açıklandı ve banka her ikisinin de sabit kurla yüzde 6 büyüdüğünü bildirdi. Maddi özkaynak kârlılığı yıllıklandırılmış yüzde 18,2, kayda değer kalemler hariç yüzde 19,1. Bankacılık net faiz geliri 1,6 milyar dolar artarak 22,9 milyar dolar oldu ve banka 2026 için en az 46 milyar dolar bekliyor. Bu kazanç gücünün yanında 1 milyar dolar tutarında bir geri alım küçük kalır."}, {"en": "One item, though, is not sitting still. The bank puts expected credit loss charges for 2026 at around 45 basis points, citing uncertainty in the outlook, against its own medium-term planning range of 30 to 40 basis points. That means it expects this year's losses above its normal range, and the distribution decision is being taken right alongside that expectation. The counter-argument is strong: on a large, diversified loan book producing an 18.2 per cent return, 45 basis points is absorbable out of earnings. Which raises the question of how much of that absorption has already been promised to distribution.", "refs": ["hsbc"], "tr": "Yine de bir kalem yerinde durmuyor. Banka 2026 için beklenen kredi zararı karşılıklarını, görünümdeki belirsizliği gerekçe göstererek yaklaşık 45 baz puan olarak veriyor; kendi orta vadeli planlama aralığı ise 30-40 baz puan. Bu, bankanın bu yılki zararı kendi normal aralığının üzerinde beklediği anlamına gelir; dağıtım kararı da tam bu beklentinin yanında alınıyor. Karşı argüman güçlü: yüzde 18,2 kârlılık üreten geniş ve dağıtılmış bir kredi portföyünde 45 baz puan kazançla soğurulabilir bir seviyedir. Ama o zaman soru şu olur: bu soğurmanın ne kadarı zaten dağıtıma söz verilmiş durumda?"}]}, {"h": {"en": "What has to remain true", "tr": "Neyin doğru kalması gerekiyor"}, "ps": [{"en": "There is no crisis claim here; there is a claim about sequence. The 14.1 per cent ratio is the result of a half-year in which three items worked at once, and the fourth has not started yet. For this picture to stay untroubled, three things have to remain true together: credit losses not exceeding 45 basis points, risk-weighted assets not continuing to grow at this pace, and banking net interest income meeting the expectation of at least 46 billion dollars. In a half-year when all three do not hold, what funds the buyback is another 0.8 points off the ratio. The CET1 capital ratio at the next reporting date, set beside the realised credit loss rate, is enough on its own to show which of the three gave way.", "refs": ["hsbc"], "tr": "Burada bir kriz iddiası yok; sıralamayla ilgili bir iddia var. Yüzde 14,1'lik oran, üç kalemin aynı anda çalıştığı bir yarıyılın sonucudur ve dördüncüsü henüz başlamadı. Bu tablonun sorunsuz kalması için üç şeyin birden doğru kalması gerekiyor: kredi zararlarının 45 baz puanı aşmaması, risk ağırlıklı varlıkların bu hızda büyümeye devam etmemesi ve bankacılık net faiz gelirinin en az 46 milyar dolar beklentisini tutması. Üçünün de aynı anda tutmadığı bir yarıyılda geri alımın kaynağı, oranın 0,8 puan daha inmesi olur. Sonraki raporlama tarihindeki CET1 sermaye oranı ile gerçekleşen kredi zararı oranı, bu üç koşulun hangisinin bozulduğunu tek başına gösterir."}]}], "sources": [{"key": "hsbc", "kind": "news", "name": "HSBC Holdings plc", "url": "https://www.hsbc.com/investors/results-and-announcements/all-reporting/interim-results-2026-quick-read", "title": {"tr": "HSBC 1 milyar dolar tutarına kadar hisse geri alımını yeniden başlatıyor, sermaye oranı 0,8 puan düştü", "en": "HSBC is restarting a buyback of up to 1 billion dollars while its capital ratio fell 0.8 points"}, "publishedDate": "2026-08-04"}], "title": {"en": "The buyback restarts while the capital ratio is still falling", "tr": "Sermaye oranı düşerken geri alım yeniden başlıyor"}, "writer": "eco-06", "n": 2, "radarPublishedAt": "2026-08-04T12:30:25+00:00", "date": "2026-08-04"}, {"excerpt": {"en": "The Kospi fell 4.88 per cent, but the information is not in the index. In the same session it was individual investors who took over the stock that foreign and institutional investors pushed out.", "tr": "Kospi yüzde 4,88 düştü, ama asıl bilgi endeksin kendisinde değil. Aynı seansta yabancı ve kurumsal yatırımcının elinden çıkardığı hisseyi devralan taraf bire
