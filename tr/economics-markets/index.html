rice had right and what it left out.", "refs": ["integer-kkr"]}]}], "sources": [{"key": "integer-kkr", "kind": "news", "name": "AOL", "url": "https://www.aol.com/articles/kkr-nearing-deal-acquire-integer-192029000.html", "title": {"tr": "KKR'nin Integer Holdings için hisse başına 127 dolar tutarında teklife yaklaştığı bildirildi", "en": "KKR is reported to be nearing a $127-a-share offer for Integer Holdings"}, "publishedDate": "2026-07-31"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-04", "title": {"tr": "Hürmüz'ü atlayan hat bir yıl daha açık kalıyor", "en": "The line that bypasses Hormuz stays open for another year"}, "excerpt": {"tr": "Anlaşmanın süresi kapasitesinden daha çok şey anlatıyor. Günde 750.000 varillik bir güzergâh için taraflar yalnızca on iki ay taahhüt verebildi.", "en": "The term of the deal says more than its capacity. For a 750,000-barrel-a-day route, the parties could commit to only twelve months."}, "sections": [{"h": {"tr": "Güzergâh, süre ve imza", "en": "Route, term and signature"}, "ps": [{"tr": "Kerkük-Ceyhan hattını düzenleyen önceki anlaşma pazartesi günü sona erdi. Irak Petrol Bakanı Bessem Hudayr cumartesi günü Türkiye'ye giderek bir yıllık uzatmayı imzalıyor. Bakanlık sözcüsü Salim el-Rikabi metnin üç taraflı olduğunu, Irak tarafında devlet petrol pazarlama şirketi SOMO ile Kuzey Petrol Şirketi'nin, Türkiye tarafında BOTAŞ'ın yer aldığını söyledi. Hattın kapasitesi günde 750.000 varil ve güzergâh, Irak ham petrolüne Hürmüz Boğazı'ndan geçmeyen bir çıkış sunuyor.", "en": "The previous agreement governing the Kirkuk-Ceyhan line expired on Monday. Iraq's oil minister, Bassem Khudair, travels to Turkey on Saturday to sign a one-year extension. Ministry spokesman Salim Al Rikabi said the text is tripartite, with the state marketing company SOMO and the North Oil Company on the Iraqi side and BOTAS on the Turkish side. The line's capacity is 750,000 barrels a day, and the route gives Iraqi crude an exit that does not pass through the Strait of Hormuz.", "refs": ["kirkuk-ceyhan"]}, {"tr": "Bu rakamı doğru okumak gerekiyor. Günde 750.000 varil, hattın alabileceği miktar; taşıdığı miktar değil. Duyurulan metinde bir hacim taahhüdü yer almıyor, yalnızca hattın işler kalacağı süre var. Bir güzergâhın değeri de zaten kendi kapasitesiyle değil, taşıdığı ham petrolün başka hangi çıkışlara sahip olduğuyla ölçülür. kuzeydeki sahalardan çıkan varil için diğer seçenek güneye inip körfezden yüklenmek, yani boğazdan geçmek anlamına geliyor.", "en": "That number needs to be read correctly. The 750,000 barrels a day is what the line can take, not what it moves. The announced text carries no volume commitment, only the period for which the line stays operational. In any case a route's worth is measured not by its own capacity but by what other exits exist for the crude it carries. for a barrel from the northern fields, the other option means going south and loading in the gulf, which means passing through the strait.", "refs": ["kirkuk-ceyhan"]}]}, {"h": {"tr": "On iki ayın söylediği", "en": "What twelve months says"}, "ps": [{"tr": "Sözcünün kendi çerçevesi ipucu veriyor: bir yıllık metin, Basra-Haditha-Kerkük-Ceyhan hattı tamamlandıktan sonra ihracat kapasitesini günlük 1 milyon varilin üzerine çıkarmayı amaçlayan kapsamlı anlaşmanın hazırlığı olarak tanımlanıyor. Bu tarif, kısıtın kuzeydeki mevcut hatta değil henüz bitmemiş Basra-Haditha-Kerkük-Ceyhan bağlantısında olduğunu ima ediyor; çünkü milyon varillik hedef, inşaat tamamlanmadan sınanamaz. Başka bir açıklama da mümkün: kısa süre, Bağdat ile Ankara arasında çözülmemiş ticari ve hukuki konuların ürünü olabilir ve inşaat projesi geleceğe dönük bir gerekçe olarak öne çıkarılmış olabilir. Duyuruda bu iki ihtimali ayıracak bir madde yok.", "en": "The spokesman's own framing offers a clue: the one-year text is described as a prelude to a comprehensive agreement meant to lift export capacity above 1 million barrels a day once the Basra-Haditha-Kirkuk-Ceyhan pipeline is finished. That description implies the constraint sits not in the existing northern line but in the unfinished Basra-Haditha-Kirkuk-Ceyhan link, because the million-barrel target cannot be tested before construction is complete. Another explanation is available: the short term may be a product of unresolved commercial and legal questions between Baghdad and Ankara, with the construction project brought forward as a forward-looking justification. The announcement contains no provision that would separate the two.", "refs": ["kirkuk-ceyhan"]}, {"tr": "Sınavın takvimi anlaşmanın kendi süresinde yazılı. On iki ay içinde Basra-Haditha-Kerkük-Ceyhan bağlantısı devreye alınmazsa, kapsamlı anlaşmanın dayandırıldığı kapasite artışı sınanamaz ve taraflar aynı yenileme sorusunun başına döner. İzlenecek iki gösterge var: bu bağlantının devreye alma aşamaları ve gelecek yaz imzalanacak yenileme metninin süresi. Yenilemenin yine bir yıllık çıkması, kısıtın inşaatta değil masada olduğuna dair daha güçlü bir işaret olur.", "en": "The timetable for the test is written into the agreement's own term. If the Basra-Haditha-Kirkuk-Ceyhan link is not commissioned within twelve months, the capacity increase on which the comprehensive agreement rests cannot be tested and the parties return to the same renewal question. Two indicators are worth following: the commissioning stages of that link, and the term of whatever renewal arrives next summer. A renewal that again runs for one year would be a stronger sign that the constraint sits at the table rather than in the construction.", "refs": ["kirkuk-ceyhan"]}]}], "sources": [{"key": "kirkuk-ceyhan", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/01/iraq-to-sign-extension-of-pipeline-deal-with-turkey/", "title": {"tr": "Irak, Türkiye ile boru hattı anlaşmasını bir yıl uzatmak için imzaya gidiyor", "en": "Iraq is signing a one-year extension of its pipeline deal with Turkey"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-05", "title": {"tr": "Peşinatı olan hane ile kredi çekecek hane aynı fiyatı ödemiyor", "en": "A household with a deposit and one that must borrow are not paying the same price"}, "excerpt": {"tr": "Değerler gerilerken alıcının eli güçleniyor deniyor. Ama pazarlık gücü ile satın alma gücü aynı şey değil; ikisini ayıran şey borcun aylık maliyeti.", "en": "As values slide, buyers are said to have the upper hand. Bargaining power and purchasing power are not the same thing, and what separates them is the monthly cost of debt."}, "sections": [{"h": {"tr": "Endeksin gösterdiği", "en": "What the index shows"}, "ps": [{"tr": "Cotality'nin konut değer endeksine göre Yeni Zelanda'da medyan değer temmuzda 804.303 Yeni Zelanda doları oldu. Aylık düşüş yüzde 0,3, üç aylık düşüş yüzde 1,0, yıllık düşüş yüzde 0,7. Kuruluşun iktisatçısı Kelvin Davidson, satış hacimlerinin yıl boyunca hafifçe gerilediğini ama hâlâ görece normal düzeyde olduğunu, buna karşılık satılık konut stokunun yüksek kalmasının fiyat pazarlığında dengeyi alıcı tarafına geçirdiğini söylüyor.", "en": "Cotality's home value index put New Zealand's median value at 804,303 New Zealand dollars in July. Values were down 0.3 percent on the month, 1.0 percent over three months and 0.7 percent on the year. Kelvin Davidson, an economist at the firm, says sales volumes have edged lower through the year but remain at a relatively normal level, while an elevated stock of listings has shifted the balance of power on pricing toward buyers.", "refs": ["cotality-nz"]}, {"tr": "Aynı değerlendirmenin ikinci yarısı daha az alıntılanıyor. Davidson değerlerin genel olarak durgun seyrettiğini, 2022-2023 düşüşünden bu yana tabloda belirgin bir toparlanma işareti görünmediğini belirtiyor ve kısa vadede konut kredisi faizlerinde artış bekliyor. Tek bir kaynaktan çıkan iki cümle bunlar ve kredi kullanacak bir hane için ters yönlere çekiyor: biri satıcı karşısındaki konumu iyileştiriyor, diğeri satın alınacak şeyin taksitini ağırlaştırıyor.", "en": "The second half of the same assessment is quoted less often. Davidson describes values as generally sluggish, sees little sign of a meaningful upturn since the 2022-2023 downturn, and expects mortgage rate increases in the short term. These are two statements from a single source, and for a household that needs credit they pull in opposite directions: one improves its position opposite the seller, the other makes the instalment on what it buys heavier.", "refs": ["cotality-nz"]}]}, {"h": {"tr": "Aynı fiyat, iki farklı hane", "en": "One price, two households"}, "ps": [{"tr": "Düşen bir medyan, kısıtı satın alma fiyatı olan haneyle kısıtı aylık borç servisi olan haneye aynı şeyi vermiyor. Birikmiş peşinatı olan bir hane için 804.303 Yeni Zelanda doları düzeyindeki medyan doğrudan daha düşük bir giriş bedeli demek. Kredi çekmek zorunda olan hane içinse ödenecek toplam, fiyat kadar faize de bağlı; yıllık yüzde 0,7'lik bir değer düşüşünün sağladığı avantajı, konut kredisi faizindeki bir artış kolayca aşabilir. Bu okumaya göre endeksin tarif ettiği üstünlük gelire göre değil, peşinatın büyüklüğüne göre dağılıyor. Karşıt ihtimal de açık: faizler Davidson'ın beklediği gibi artmazsa, değerlerdeki sürekli gerileme giriş maliyetini geniş bir kesim için düşürür ve peşinat ayrımı bu kadar belirleyici olmaz.", "en": "A falling median does not give the same thing to a household whose constraint is the purchase price and one whose constraint is monthly debt service. For a household with savings already set aside, a median of 804,303 New Zealand dollars simply means a lower entry cost. For a household that has to borrow, the total paid depends on the interest rate as much as on the price, and an increase in mortgage rates can easily outweigh the advantage of a 0.7 percent annual fall in values. On this reading, the advantage the index describes is distributed by the size of the deposit rather than by income. The competing possibility is plain: if rates do not rise as Davidson expects, a continued decline in values lowers the entry cost broadly and the deposit distinction matters much less.", "refs": ["cotality-nz"]}, {"tr": "Bu iki okuma tartışmayla değil, tek bir seriyle ayrılır: aylık satışlar içinde ilk kez konut alanların payı. Alıcı üstünlüğü genel bir üstünlükse, değerler gerilemeye devam ederken bu payın yükselmesi gerekir. Faizler artarken pay yatay kalır ya da gerilerse, düşen endeksin kimin lehine çalıştığı sorusunun cevabı da netleşir. Yıl sonuna kadar bu seri, pazarlık gücünün gerçekten satın alma gücüne dönüşüp dönüşmediğini gösterecek.", "en": "These two readings are separated not by argument but by a single series: the share of first-home buyers in monthly sales. If the buyer advantage is a general one, that share should rise while values keep sliding. If it stays flat or falls while rates increase, the question of whom a falling index actually works for becomes easier to answer. By the end of the year that series should show whether bargaining power has in fact turned into purchasing power.", "refs": ["cotality-nz"]}]}], "sources": [{"key": "cotality-nz", "kind": "news", "name": "interest.co.nz", "url": "https://www.interest.co.nz/property/139613/house-buyers-hold-balance-power-when-it-comes-pricing-cotality-says", "title": {"tr": "Yeni Zelanda'da konut değerleri temmuzda yüzde 0,3 geriledi", "en": "New Zealand house values fell 0.3 percent in July"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-06", "title": {"tr": "Son yatırım basamağında kalmak koalisyon aritmetiğine bağlandı", "en": "Staying on the last investment-grade rung now turns on coalition arithmetic"}, "excerpt": {"tr": "Fitch notu teyit etti, görünümü negatif bıraktı. Gerekçede mali patikayı taşıyan değişken olarak dağılmış bir koalisyonun bütçe geçirebilme ihtimali öne çıkıyor.", "en": "Fitch affirmed the rating and left the outlook negative. In its reasoning, the variable carrying the fiscal path is whether a collapsed coalition can pass a budget."}, "sections": [{"h": {"tr": "Teyit ile şerh arasında", "en": "Between the affirmation and the caveat"}, "ps": [{"tr": "Fitch, Romanya'nın BBB- notunu teyit etti ve görünümü negatif bıraktı. Fitch'in projeksiyonlarında genel devlet açığı 2026 için gayrisafi yurt içi hasılanın yüzde 5,9'u, kamu borcu ise 2028'e kadar yüzde 64,5 düzeyinde görünüyor. Kararın gerekçesinde hükümet koalisyonunun dağılmasıyla mali programın uygulanmasındaki güçlük doğrudan ilişkilendiriliyor; değerlendirmede siyasi istikrar, kredi değerliliği bakımından mali disiplin kadar belirleyici bir unsur olarak ele alınıyor.", "en": "Fitch affirmed Romania's BBB- rating and left the outlook negative. Its projections put the general government deficit at 5.9 percent of gross domestic product for 2026 and public debt at 64.5 percent of GDP by 2028. The reasoning links the collapse of the governing coalition directly to the difficulty of implementing the fiscal strategy, and the assessment treats political stability as weighing on creditworthiness as heavily as fiscal discipline.", "refs": ["fitch-romania"]}, {"tr": "Negatif görünümlü bir teyidin ne olduğunu açıkça söylemek gerekiyor. Not, yatırım yapılabilir seviyenin en alt basamağında tutuluyor ve kuruluş yönü belirtiyor. Buradaki tampon zamandır: BBB- altında yatırım yapılabilir başka bir kademe bulunmuyor. Karar, bir mühlet tanıyor.", "en": "It is worth saying plainly what an affirmation with a negative outlook is. The rating is being held on the lowest rung of investment grade while the agency states a direction of travel. The buffer here is time: there is no further investment-grade step below BBB-. What the decision provides is a period of grace.", "refs": ["fitch-romania"]}]}, {"h": {"tr": "Zincir hangi halkadan kopar", "en": "Where the chain would break"}, "ps": [{"tr": "Fitch'in kendi gerekçesi, kırılganlığın nerede durduğunu gösteriyor. Kuruluş koalisyonun dağılmasını, mali stratejinin uygulanmasını zorlaştıran kanal olarak adlandırdığında, notu bağlayan kısıtı aritmetikten parlamentoya taşımış oluyor; çünkü yüzde 5,9'luk açık projeksiyonu, alınacağı varsayılan tedbirlerin çıktısıdır ve o tedbirler bir çoğunluk gerektirir. Çoğunluk yoksa tedbir gecikir, açık projeksiyonun üzerinde kalır ve 2028 için verilen yüzde 64,5'lik borç patikası dikleşir. Karşı okuma da ciddiye alınmalı: negatif görünüm doğrudan açığın düzeyini yansıtıyor olabilir ve siyasi yorum çevredeki bağlamı tarif ediyor olabilir. Bu durumda açığın kendi düzeyi belirleyici olur.", "en": "Fitch's own reasoning shows where the fragility sits. When the agency names the coalition's collapse as the channel making the fiscal strategy harder to implement, it moves the binding constraint on the rating from arithmetic to parliament, because the 5.9 percent deficit projection is an output of measures assumed to be taken, and those measures require a majority. Without a majority the measures slip, the deficit stays above the projection, and the 64.5 percent debt path given for 2028 steepens. The counter-reading deserves to be taken seriously: the negative outlook may reflect the level of the deficit directly, with the political commentary describing the surrounding context. On that account the deficit's own level is what decides.", "refs": ["fitch-romania"]}, {"tr": "Bu ikisini ayıracak eşik gözlemlenebilir. Yüzde 5,9'luk projeksiyonun dayandığı konsolidasyon tedbirleri, kuruluşun bir sonraki planlı gözden geçirmesinden önce yasalaşmazsa, negatif görünümün olumluya değil aşağı yöne çözülmesi daha olası hâle gelir. İzlenecek iki şey var: söz konusu tedbirleri taşıyan bir bütçenin kabul edilip edilmediği ve Fitch'in bir sonraki gözden geçirmesinde bu konuya ayırdığı ifade. Şubat sonuna kadar bu iki gösterge, notu bugün taşıyanın mali plan mı yoksa o planı geçirebilecek bir çoğunluk beklentisi mi olduğunu ortaya koyacak.", "en": "The threshold that separates the two is observable. If the consolidation measures behind the 5.9 percent projection are not legislated before the agency's next scheduled review, the negative outlook becomes more likely to resolve downward than to return to stable. Two things are worth watching: whether a budget carrying those measures is adopted, and the wording Fitch devotes to the question at its next review. By the end of February those two indicators should show whether what holds the rating today is the fiscal plan or the expectation of a majority able to pass it.", "refs": ["fitch-romania"]}]}], "sources": [{"key": "fitch-romania", "kind": "news", "name": "Independent Balkan News Agency", "url": "https://www.ibnaeu.com/en/2026/08/01/fitch-romania-bbb-political-stability-credit-rating/", "title": {"tr": "Fitch, Romanya'nın notunu yatırım yapılabilir seviyenin son basamağında tuttu", "en": "Fitch kept Romania on the lowest rung of investment grade"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-01", "title": {"tr": "Brüt marjın iki puanı gümrük vergisi iadesinden geldi", "en": "Two points of the gross margin came from a tariff refund"}, "excerpt": {"tr": "Apple'ın haziran çeyreği geliri 109,4 milyar dolar, brüt kâr marjı yüzde 50,1. Şirketin kendi açıklamasına göre bu marjın yaklaşık 2 puanı ve seyreltilmiş hisse başına kâra eklenen 0,11 dolar gümrük vergisi iadelerinden geliyor. Farkı geri alınan vergi doğuruyor; satılan ürün bu tutarı taşımıyor.", "en": "Apple's June quarter brought in $109.4 billion of revenue at a gross margin of 50.1 percent. By the company's own account, approximately 2 percentage points of that margin and $0.11 of diluted earnings per share came from tariff refunds. Customs returned that difference; the customer did not pay it."}, "sections": [{"h": {"tr": "İki farklı kâr kaynağı", "en": "Two different sources of profit"}, "ps": [{"tr": "Apple, 27 Haziran 2026'da sona eren çeyrekte gelirini yıllık yüzde 16 artışla 109,4 milyar dolar, seyreltilmiş hisse başına kârını yıllık yüzde 29 artışla 2,02 dolar olarak bildirdi. Brüt kâr marjı yüzde 50,1 oldu; şirket bu rakamın gümrük vergisi iadelerinden gelen yaklaşık 2 puanlık olumlu etkiyi içerdiğini ve aynı iadelerin hisse başına kâra 0,11 dolar eklediğini açıkladı.", "en": "Apple reported quarterly revenue of $109.4 billion in the quarter ended June 27, 2026, up 16 percent year over year, and diluted earnings per share of $2.02, up 29 percent year over year. Gross margin was 50.1 percent; the company said the figure includes a favorable impact of approximately 2 percentage points from tariff refunds, and that the same refunds added $0.11 to earnings per share.", "refs": ["apple-q3"]}, {"tr": "Bu iki kalem aynı satırda toplanıyor ama farklı şeyleri ölçüyor. Gümrük vergisi iadesi, geçmişte ödenmiş bir vergiyi geri getirir ve ürün karışımına, hizmet gelirinin payına veya girdi giderine değil gümrük kararlarına bağlıdır. Apple'ın brüt kâr marjı bir puanın onda birleri düzeyinde okunurken, o marjın 2 puanının nereden geldiğini bilmek, marjın gelecek çeyrekte tekrar edip etmeyeceğine dair en somut bilgi.", "en": "The two items land on the same line while measuring different things. A tariff refund returns duty that was already paid, and it moves with customs decisions instead of with product mix, the services share of revenue or the cost of an input. When Apple's gross margin is read to a tenth of a point, knowing where 2 percentage points of it came from is the most concrete information available about whether the margin repeats.", "refs": ["apple-q3"]}]}, {"h": {"tr": "Geriye kalan iş nasıl duruyor", "en": "What the underlying business still shows"}, "ps": [{"tr": "Gümrük vergisi iadelerini bir kenara koyduğunuzda çeyrek kendi başına ayakta duruyor. Apple'a göre iPhone, Mac ve Hizmetler geliri haziran çeyreği için yeni rekor kırdı ve her coğrafi bölümde büyüme görüldü. Yüzde 16'lık gelir artışı iade kalemiyle açıklanamaz; iade brüt kâr marjına ve hisse başına kâra giriyor, gelirin kendisi ise bu tutardan etkilenmiyor.", "en": "Set the tariff refunds aside and the quarter still stands on its own. Apple said iPhone, Mac and Services revenue set new June quarter records and there was growth in every geographic segment. The 16 percent increase in revenue cannot be explained by the refund line; a refund reaches gross margin and earnings per share, while revenue itself stays untouched.", "refs": ["apple-q3"]}, {"tr": "Ayrımın önem kazandığı yer bir sonraki çeyreğin başlangıç noktası. Apple'ın yüzde 50,1'lik brüt kâr marjı taban alınırsa, aynı iadeler tekrar gelmediği sürece karşılaştırma yanlış kurulmuş olur. Karşı okuma da elde tutulmalı: gümrük vergisi iadeleri sürerse yeni tutarlar gelebilir, ya da hizmet gelirinin payı artmayı sürdürerek 2 puanlık boşluğu kendi başına kapatabilir. O halde marjın bileşimi değişir, düzeyi yerinde kalır.", "en": "Where the distinction starts to matter is the baseline for the next quarter. Treat Apple's 50.1 percent gross margin as a floor and the comparison is built wrong unless the same refunds arrive again. The counter-reading has to stay on the table: further tariff refunds could return more money, or a rising services share of revenue could close the 2 point gap on its own. In that case the composition of the margin changes while its level holds.", "refs": ["apple-q3"]}]}], "sources": [{"key": "apple-q3", "kind": "news", "name": "Apple", "url": "https://www.apple.com/newsroom/2026/07/apple-reports-third-quarter-results/", "title": {"tr": "Apple'ın haziran çeyreği geliri 109,4 milyar dolara çıktı, brüt marj yüzde 50,1 oldu", "en": "Apple's June quarter revenue reached $109.4 billion with a 50.1 percent gross margin"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-02", "title": {"tr": "Hazineye açılan kredi kapanınca fatura tahvil piyasasına geçer", "en": "Close the treasury's credit line and the bill moves to the bond market"}, "excerpt": {"tr": "Milei'nin merkez bankası tasarısı, kurumun devlete doğrudan ve dolaylı finansman sağlamasını yasaklıyor. Yasak bir yaratma kanalını kapatıyor; harcama ile gelir arasındaki farkı yerinde bırakıyor. Arjantin'de asıl soru şu hale geliyor: bu kez hangi bilanço taşıyacak?", "en": "Milei's central bank bill bans the institution from financing the state directly and indirectly. The ban closes one channel of money creation while leaving the gap between spending and revenue where it stands. In Argentina the operative question becomes which balance sheet carries it this time."}, "sections": [{"h": {"tr": "Yasağın kapattığı kanal", "en": "The channel the ban closes"}, "ps": [{"tr": "Tasarı, kurumun devlete doğrudan ve dolaylı finansman sağlamasını yasaklıyor, geçici Hazine avanslarını kaldırıyor, birincil piyasada devlet kâğıdı alımını sınırlıyor ve devredilemez senetleri sonlandırıyor. Muhasebe kârının aktarımına tavan geliyor, kurumun amaçlarına istihdam ve kalkınmayı ekleyen 2012 düzenlemesi geri alınıyor, banka başkanının ve yönetim kurulunun görevden alınması iki mecliste üçte iki çoğunluğa bağlanıyor. Metni Luis Caputo, Santiago Bausili ve Federico Sturzenegger hazırladı.", "en": "The bill bans direct and indirect state financing by the institution, eliminates temporary Treasury advances, restricts purchases of government paper in the primary market and eliminates non-transferable notes. It caps transfers of accounting profit, reverses the 2012 reform that broadened the institution's objectives to include employment and development, and requires two-thirds votes in both chambers to remove the bank's president and board. The text was drafted by Luis Caputo, Santiago Bausili and Federico Sturzenegger.", "refs": ["milei-bcra"]}, {"tr": "Bu maddelerin her biri, devletin harcaması ile merkez bankasının bilançosu arasındaki doğrudan bağı kesiyor. Ortodoks çerçevede bu bağ enflasyonun kaynağıdır: kurum devlete kaynak yaratır, para genişler, fiyatlar yükselir. Çerçevenin en güçlü hali savunulabilir bir hal — Arjantin'de bu kanal onlarca yıl gerçekten işledi ve devlet borcu ile harcama, yaratılan parayla karşılandı.", "en": "Each of these provisions severs a direct link between government spending and the central bank's balance sheet. In the orthodox frame that link is the source of inflation: the institution creates resources for the state, money expands and prices rise. Stated at its strongest the frame is defensible — in Argentina this channel genuinely operated for decades, and government debt and spending were met with created money.", "refs": ["milei-bcra"]}]}, {"h": {"tr": "Kapanmayan taraf", "en": "The side that does not close"}, "ps": [{"tr": "Eksik halka şurada: bir finansman kanalını yasaklamak, o kanalın finanse ettiği harcama ile gelir arasındaki farkı ortadan kaldırmıyor. Fark sürdüğü sürece bir yerden karşılanmak zorunda — yurt içi tahvil piyasasından, dış alacaklılardan ya da harcamanın kesilmesinden. Tasarı, farkı taşıyacak bilançoyu değiştiriyor ve farkın kendisi yerinde kalıyor. Ticari bankalar devlet kâğıdını aldığında kredi ve mevduat yine genişliyor; yaratanın kim olduğu ve devlet borcunun fiyatı değişiyor.", "en": "The missing link is this: prohibiting a financing channel does not remove the gap between spending and revenue that the channel financed. While the gap persists it must be met somewhere — in the domestic bond market, from external creditors, or by cutting the spending. The bill changes which balance sheet carries the gap, and the gap itself stays in place. When commercial banks buy the government paper, credit and deposits still expand; who does the creating and what government debt costs both change.", "refs": ["milei-bcra"]}, {"tr": "Karşı okuma ciddiye alınmalı. Hükümetin fiili duruşu birincil fazla üretmekse kısıt hiç bağlamayabilir ve tasarı, geçmiş uygulamanın tekrarını engelleyen bir çıpa olarak kalır. Görevden alma için iki mecliste üçte iki çoğunluk aranması bu çıpanın en somut parçası; madde, para politikasını gevşetmek amacıyla yönetim değiştirme yolunu kapatmayı hedefliyor. Ama bu bir kurumsal düzenleme sorusu; enflasyon sonucunu doğrudan vermiyor ve ikisini tek cümlede birleştirmek tasarıyı olduğundan güçlü gösterir.", "en": "The counter-reading deserves weight. If the government's actual stance produces a primary surplus, the constraint may never bind, and the bill stands as an anchor against a repeat of past practice. Requiring two-thirds votes in both chambers for removals is the most concrete part of that anchor; the clause is designed to close the route of replacing the leadership in order to loosen policy. But that is a question of institutional design; it does not deliver an inflation outcome directly, and folding the two into one sentence makes the bill look stronger than it is.", "refs": ["milei-bcra"]}]}], "sources": [{"key": "milei-bcra", "kind": "news", "name": "MercoPress", "url": "https://en.mercopress.com/2026/07/30/from-closing-the-central-bank-to-reforming-it-milei-s-shift-on-monetary-authority", "title": {"tr": "Milei, merkez bankasının devlete finansman sağlamasını yasaklayan tasarıyı açıkladı", "en": "Milei unveils a bill barring the central bank from financing the state"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-03", "title": {"tr": "AWS faaliyet kârı 16,6 milyar dolar, sermaye harcaması 173,0 milyar dolar", "en": "AWS operating income of $16.6 billion, capital spending of $173.0 billion"}, "excerpt": {"tr": "Amazon net kârını 62,6 milyar dolar olarak bildirdi ve bu tutarın 53,4 milyar dolar kadarı faaliyet dışı bir kalemden geliyor. Aynı çeyrekte sermaye harcaması 54,2 milyar dolar, son on iki aylık toplam 173,0 milyar dolar. Modelde tek soru var: bu sermayeyi hangi kâr kalemi geri ödeyecek?", "en": "Amazon reported net income of $62.6 billion, of which $53.4 billion came from a non-operating line. In the same quarter capital spending was $54.2 billion, and $173.0 billion over the trailing twelve months. The model has one question: which profit line pays that capital back?"}, "sections": [{"h": {"tr": "Net kârın nereden geldiği", "en": "Where the net income came from"}, "ps": [{"tr": "Amazon ikinci çeyrekte net satışların yüzde 20 artışla 200,6 milyar dolar, faaliyet kârının 27,5 milyar dolar olduğunu bildirdi. Net kâr ise 62,6 milyar dolar, seyreltilmiş hisse başına kâr 5,75 dolar. Aradaki farkın büyük bölümü, şirketin başlıca Anthropic yatırımlarından kaynaklandığını belirttiği 53,4 milyar dolar tutarında faaliyet dışı vergi öncesi diğer gelirden geliyor.", "en": "Amazon reported second quarter net sales up 20 percent to $200.6 billion and operating income of $27.5 billion. Net income, however, was $62.6 billion, or $5.75 per diluted share. Most of the difference comes from $53.4 billion of non-operating pre-tax other income that the company said came primarily from investments in Anthropic.", "refs": ["amazon-q2"]}, {"tr": "Bu kalem bir değerleme kalemi; elden çıkarılmamış bir hissedarlığın taşınan değerindeki değişimi yansıtıyor ve nakit üretmiyor. Sermaye harcamasını finanse etmiyor, borç ödemiyor, kapasite kurmuyor. Değerleme açısından sonuç açık: Amazon için 62,6 milyar dolar üzerinden kurulan her çarpan, işletmenin ürettiği kârdan çok bir yatırımın yeniden fiyatlanmasını çarpıyor.", "en": "That line is a valuation item; it reflects a change in the carrying value of a holding that has not been sold, and it produces no cash. It does not finance capital spending, retire debt or build capacity. For valuation the consequence is plain: any multiple built on $62.6 billion for Amazon multiplies the repricing of an investment more than the profit the business generated.", "refs": ["amazon-q2"]}]}, {"h": {"tr": "Nakde giden köprü", "en": "The bridge to cash"}, "ps": [{"tr": "Nakit tarafında tablo daha açık. Amazon için çeyrek sermaye harcaması 54,2 milyar dolar, son on iki aylık toplam yüzde 64 artışla 173,0 milyar dolar. Aynı dönemde faaliyet nakit akışı yüzde 33 artışla 161,4 milyar dolar olmasına karşın serbest nakit akışı, bir yıl önceki 18,2 milyar dolar tutarındaki girişten 7,6 milyar dolar tutarında çıkışa döndü; şirket bunun başlıca nedeni olarak maddi duran varlık alımlarındaki 66,1 milyar dolar tutarında yıllık artışı gösterdi.", "en": "On the cash side the picture is clearer. For Amazon, capital spending was $54.2 billion in the quarter and $173.0 billion over the trailing twelve months, up 64 percent. Over the same period operating cash flow rose 33 percent to $161.4 billion, yet free cash flow moved from an inflow of $18.2 billion a year earlier to an outflow of $7.6 billion, which the company attributed primarily to a year-over-year increase of $66.1 billion in purchases of property and equipment.", "refs": ["amazon-q2"]}, {"tr": "Bu harcamanın karşılığını üretmesi beklenen kalem AWS ve orada büyüme gerçek: satışlar yüzde 37 artışla 42,2 milyar dolar, faaliyet kârı yüzde 64 artışla 16,6 milyar dolar oldu. Çeyreklik 16,6 milyar dolar, yıllık ölçeğe taşındığında son on iki aylık 173,0 milyar dolar tutarındaki sermaye harcamasının yaklaşık üçte birine denk gelir. Duyarlılık tek bir varsayımda toplanıyor: AWS faaliyet kârı, kurulan kapasitenin amortismanı gider tarafına girdikçe bu hızda büyümeyi sürdürebilir mi? Alternatif okuma da mümkün — kapasite doldukça AWS marjı yükselebilir ve serbest nakit akışındaki açık harcama yavaşlamadan kapanabilir.", "en": "The line expected to earn that spending back is AWS, and the growth there is real: sales rose 37 percent to $42.2 billion and operating income rose 64 percent to $16.6 billion. Scaled to a year, $16.6 billion a quarter is roughly a third of the $173.0 billion of capital spending over the trailing twelve months. The sensitivity collapses into a single assumption: can AWS operating income keep compounding at that rate as depreciation on the new capacity enters costs? The alternative reading is available too — as the capacity fills, the AWS margin could rise and the free cash flow gap could close without the spending slowing.", "refs": ["amazon-q2"]}]}], "sources": [{"key": "amazon-q2", "kind": "news", "name": "Amazon", "url": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Second-Quarter-Results/", "title": {"tr": "Amazon'un çeyrek geliri 200,6 milyar dolara çıkarken sermaye harcaması 54,2 milyar dolar oldu", "en": "Amazon's quarterly sales reached $200.6 billion as capital spending hit $54.2 billion"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-04", "title": {"tr": "Resmi alıcı yavaşladı, ons yerinde durdu", "en": "The official buyer slowed while the ounce held its ground"}, "excerpt": {"tr": "Dünya Altın Konseyi'ne göre merkez bankalarının net altın alımı yılın ilk yarısında 345,4 ton oldu; bunun 288,9 tonu tek başına ikinci çeyrekten geliyor. Aynı çeyrekte toplam talep 1.268,9 ton ile yatay seyretti, LBMA ortalama fiyatı ise bir yıl öncesinin yüzde 37 üzerindeydi.", "en": "The World Gold Council puts central bank net gold purchases at 345.4 tonnes for the first half of the year, 288.9 tonnes of it in the second quarter alone. Total demand in that quarter held flat at 1,268.9 tonnes, while the average LBMA price ran 37 percent above a year earlier."}, "sections": [{"h": {"tr": "Tonaj ile fiyatın ayrıştığı yer", "en": "Where the tonnage and the price part company"}, "ps": [{"tr": "Dünya Altın Konseyi'nin ikinci çeyrek Altın Talep Eğilimleri raporuna göre merkez bankalarının net alımı çeyrekte 288,9 ton, ilk çeyrekte 56,5 ton ve ilk yarıda 345,4 ton oldu. Üç rakam yan yana konduğunda ilk çeyreğin ne kadar zayıf geçtiği görülüyor. Toplam altın talebi ikinci çeyrekte 1.268,9 ton ile bir yıl öncesine göre yatay kaldı; ilk yarı toplamı yüzde 2 artışla 2.522 tona çıktı.", "en": "The World Gold Council's Gold Demand Trends report for the second quarter puts central bank net purchases at 288.9 tonnes for the quarter, 56.5 tonnes for the first quarter and 345.4 tonnes across the first half. Set the three figures side by side and the weakness of the first quarter shows through. Total gold demand in the second quarter held flat at 1,268.9 tonnes year over year, and first half demand reached 2,522 tonnes, a 2 percent increase.", "refs": ["wgc-q2"]}, {"tr": "Değer tarafında tablo bambaşka görünüyor. İlk yarı talebi 380 milyar dolar ile rekor kırdı ve LBMA öğleden sonra fiyatı ikinci çeyrekte ons başına ortalama 4.506,29 dolar oldu — yıllık yüzde 37 yukarıda, ilk çeyreğin rekor düzeyine göre yüzde 8 aşağıda. Değer rakamını taşıyan şey tonajın çarpıldığı fiyat; tonajın kendisi neredeyse yerinde kaldı.", "en": "By value the picture looks entirely different. First half demand reached a record $380 billion, and the LBMA (PM) gold price averaged $4,506.29 an ounce in the second quarter — 37 percent above a year earlier and 8 percent below the first quarter's record high. The value figure follows the price the tonnage was multiplied by; the tonnage itself barely moved.", "refs": ["wgc-q2"]}]}, {"h": {"tr": "Kimin sattığı, kimin aldığı", "en": "Who sold and who bought"}, "ps": [{"tr": "Fiziksel talebin bileşimi çeyrek içinde belirgin biçimde değişti. Borsa yatırım fonlarında 45 tonluk çıkış görüldü ve toplam yatırım talebi yıllık yüzde 46 düşüşle 262,2 tona indi; külçe ve sikke yatırımı 307 ton ile yatay kaldı. Geri çekilen taraf, tahsisini bir talimatla azaltabilen fon yatırımcısı; metali fiziksel olarak elinde tutan alıcı yerinde durdu. Rapor, ılımlı çıkışların zayıflayan altın fiyatlarına ve özellikle Kuzey Amerika'da enflasyon ile faiz beklentilerinin yukarı yönlü güncellenmesine ve güçlenen ABD dolarına tepki olduğunu belirtti.", "en": "The composition of physical demand shifted noticeably within the quarter. Exchange-traded funds saw outflows of 45 tonnes and total investment demand fell 46 percent year on year to 262.2 tonnes, while bar and coin investment remained steady at 307 tonnes. The side that pulled back was the fund investor who can trim an allocation with one instruction; the buyer holding the metal itself stayed put. The report said moderate outflows were in response to weaker gold prices and, particularly in North America, upward adjustments to both inflation and interest rate expectations alongside a strengthening US dollar.", "refs": ["wgc-q2"]}, {"tr": "Buradan çıkan çıkarım şu: ikinci çeyrekte tonajı merkez bankalarının net alımı ayakta tuttu, yatırım talebi ise geri çekildi. Karşı okuma da elde tutulmalı — resmi sektör verileri sonradan düzeltilebiliyor ve ilk yarı rakamı yukarı çekilirse ilk çeyreğin zayıflığı bugünkü kadar keskin görünmez. Yine de izlenecek işaret açık: borsa yatırım fonlarındaki çıkışlar sürerken merkez bankalarının alımı ilk çeyreğin hızına yakın seyrederse, üçüncü çeyrek toplam talebi 1.268,9 tonun altında kalır.", "en": "The inference is that central bank net purchases held the tonnage up in the second quarter, while investment demand retreated. The counter-reading has to stay on the table — official sector data are subject to later revision, and if the first half figure is pulled up the first quarter's weakness will look less stark than it does now. The signal to watch is still clear: if exchange-traded fund outflows continue while central bank purchases run near the first quarter's pace, third quarter total demand lands below 1,268.9 tonnes.", "refs": ["wgc-q2"]}]}], "sources": [{"key": "wgc-q2", "kind": "news", "name": "World Gold Council", "url": "https://www.gold.org/goldhub/research/gold-demand-trends/gold-demand-trends-q2-2026", "title": {"tr": "Merkez bankalarının altın alımı ilk yarıda 345,4 tonda kaldı", "en": "Central bank gold buying came to 345.4 tonnes in the first half"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-05", "title": {"tr": "Tasarruf oranı yüzde 2,7 iken harcama gelirin önüne geçti", "en": "Spending outran income with the saving rate at 2.7 percent"}, "excerpt": {"tr": "Haziranda fiyat etkisinden arındırılmış harcanabilir kişisel gelir yüzde 0,3, reel kişisel tüketim harcamaları yüzde 0,4 arttı. Aradaki fark küçük görünüyor ama aynı ay kişisel tasarruf oranı yüzde 2,7 oldu. Artan harcamayı gelir artışı tek başına açıklamıyor.", "en": "Real disposable personal income rose 0.3 percent in June and real personal consumption expenditures rose 0.4 percent. The gap looks small, but in the same month the personal saving rate was 2.7 percent. Income growth alone does not account for the extra spending."}, "sections": [{"h": {"tr": "Gelen ile giden", "en": "What came in and what went out"}, "ps": [{"tr": "Ekonomik Analiz Bürosu'nun haziran açıklamasına göre kişisel gelir 54,9 milyar dolar, harcanabilir kişisel gelir 48,3 milyar dolar arttı; her ikisi de yüzde 0,2 artışa karşılık geliyor. Fiyat etkisinden arındırılmış harcanabilir kişisel gelirdeki artış yüzde 0,3 oldu. Kişisel tüketim harcamaları 65,2 milyar dolar, yani yüzde 0,3 yükseldi ve fiyat etkisinden arındırılmış olarak yüzde 0,4 arttı. Kişisel tasarruf 646,1 milyar dolar, kişisel tasarruf oranı yüzde 2,7 oldu.", "en": "The Bureau of Economic Analysis reported that in June personal income increased $54.9 billion and disposable personal income $48.3 billion, each an increase of 0.2 percent. Real disposable personal income increased 0.3 percent. Personal consumption expenditures increased $65.2 billion, or 0.3 percent, and real personal consumption expenditures increased 0.4 percent. Personal saving was $646.1 billion and the personal saving rate was 2.7 percent.", "refs": ["bea-june"]}, {"tr": "Aynı açıklamada fiyat tarafı iyi haber gibi duruyor: kişisel tüketim harcamaları fiyat endeksi aylık yüzde 0,1 geriledi. Ama yıllık artış yüzde 3,7'de, gıda ile enerji dışı çekirdek endeks yüzde 3,3'te kaldı. Bir ayın geri gidişi, on iki ayda biriken fiyat düzeyini geri almıyor; hane halkı o düzeyle karşılaşıyor ve bir aylık geri gidiş bu düzeyi zor etkiliyor.", "en": "In the same release the price side reads like good news: the personal consumption expenditures price index decreased 0.1 percent on the month. But its increase from a year earlier held at 3.7 percent, and the core index excluding food and energy at 3.3 percent. One month of decline does not undo the price level built up over twelve; a household meets that level, and one month of decline barely touches it.", "refs": ["bea-june"]}]}, {"h": {"tr": "Yüzde 2,7'nin gizlediği", "en": "What 2.7 percent conceals"}, "ps": [{"tr": "Harcamadaki artışın nereye gittiği de dikkate değer: 65,2 milyar dolar tutarındaki artışın 58,2 milyar dolar kadarı hizmet harcamalarından, yalnızca 7,0 milyar dolar kadarı mal harcamalarından geldi. Hizmet kalemleri — barınma, sağlık, ulaşım, sigorta — çoğunlukla ertelenmesi güç olanlar. Mal alımını bir ay öteleyebilen bir bütçe, kira ödemesini öteleyemiyor. Bu bileşim, artışı tercihten çok zorunluluğun sürüklüyor olabileceğine dair bir işaret veriyor.", "en": "Where the increase in spending went is also worth noting: of the $65.2 billion, $58.2 billion came from services spending and only $7.0 billion from goods spending. Services items — housing, health care, transport, insurance — are largely the ones that are hard to postpone. A budget that can defer a purchase for a month cannot defer the rent. That composition is a signal that necessity may be driving the increase more than choice.", "refs": ["bea-june"]}, {"tr": "Kişisel tasarruf oranının en önemli özelliği ise ülke çapında tek bir sayı olması. Bu seride hangi hanelerin tasarruf ettiği, hangilerinin birikimini tükettiği görünmüyor; varlıklardan elde edilen kişisel gelir toplama giriyor ama o gelirin dağılımı aynı açıklamada yer almıyor. Verinin taşıyabildiği sonuç bu yüzden sınırlı ve yine de sağlam: ülke genelinde reel kişisel tüketim harcamaları, fiyat etkisinden arındırılmış harcanabilir kişisel gelirin önünde ve fark bir yerden karşılanıyor. Karşı okuma, bu serilerin sonraki yayınlarda düzeltilebilmesi — mayısta harcanabilir kişisel gelir cari fiyatlarla yüzde 0,7 artmıştı ve sonraki veriler farkı kapatabilir. Ayırt edecek işaret, reel harcamanın reel gelirin üzerinde seyretmeyi sürdürüp sürdürmediği.", "en": "The most important property of the personal saving rate is that it is a single national number. The series does not show which households are saving and which are drawing down what they have; personal income receipts on assets enter the total, but the distribution of that income does not appear in the same release. What the data can support is therefore limited and still solid: nationally, real personal consumption expenditures are running ahead of real disposable personal income, and the difference is being met from somewhere. The counter-reading is that these series are subject to revision in later releases — in May, current-dollar disposable personal income rose 0.7 percent, and later data could close the gap. The signal that separates the two is whether real spending keeps running above real income.", "refs": ["bea-june"]}]}], "sources": [{"key": "bea-june", "kind": "news", "name": "U.S. Bureau of Economic Analysis", "url": "https://www.bea.gov/news/2026/personal-income-and-outlays-june-2026", "title": {"tr": "ABD'de haziranda çekirdek PCE enflasyonu yıllık yüzde 3,3, tasarruf oranı yüzde 2,7 oldu", "en": "US core PCE inflation ran at 3.3 percent in June and the saving rate fell to 2.7 percent"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-06", "title": {"tr": "Dolaşımdaki USDC'nin yaklaşık üçte biri tek bir borsada duruyor", "en": "About a third of circulating USDC sits at a single venue"}, "excerpt": {"tr": "Coinbase geliri yıllık yüzde 19 daraldı ve şirket 359,5 milyon dolar net zarar açıkladı. Aynı çeyrekte ürünlerinde tutulan ortalama USDC bakiyesi 20 milyar dolar oldu — şirketin kendi ifadesiyle dolaşımdaki toplam USDC'nin yaklaşık yüzde 30'u. Kırılganlığın adresi, zarar kaleminden çok bu oran.", "en": "Coinbase's revenue shrank 19 percent year over year and the company reported a net loss of $359.5 million. In the same quarter, average USDC held in its products reached $20 billion — by the company's own account, approximately 30 percent of total USDC in circulation. The share, more than the loss line, is where the fragility sits."}, "sections": [{"h": {"tr": "Daralan gelir, büyüyen pay", "en": "Shrinking revenue, growing share"}, "ps": [{"tr": "Coinbase ikinci çeyrek toplam gelirinin yıllık yüzde 19 düşüşle 1,22 milyar dolar olduğunu ve 359,5 milyon dolar net zarar bildirdiğini açıkladı; bir yıl önceki ikinci çeyrekte 1,43 milyar dolar net kâr açıklanmıştı. İşlem geliri çeyreklik yüzde 21 düşüşle 599 milyon dolar oldu. Buna karşın küresel kripto işlem hacmindeki payı ilk çeyrekteki yüzde 9,1'den yüzde 10,3'e çıktı ve düzeltilmiş FAVÖK 208 milyon dolar oldu.", "en": "Coinbase reported second quarter total revenue of $1.22 billion, down 19 percent year over year, and a net loss of $359.5 million, compared with net income of $1.43 billion in the second quarter a year earlier. Transaction revenue fell 21 percent quarter over quarter to $599 million. Its crypto trading volume market share nonetheless rose from 9.1 percent in the first quarter to 10.3 percent, and adjusted EBITDA was $208 million.", "refs": ["coinbase-q2"]}, {"tr": "Daralan bir pazarda pay kazanmak tek başına bir hüküm taşımıyor. Anlamı, aynı işlem hacminin daha az sayıda yerde toplanması. Türev tarafında Coinbase son on iki aylık hacmin 4,2 trilyon dolar ile yatay kaldığını, aynı dönemde pazarın yüzde 12 daraldığını bildirdi. Yoğunlaşma, ancak yoğunlaşan şeye göre bir arıza sayılır.", "en": "Gaining share in a shrinking market carries no verdict on its own. It means the same trading volume is collecting in fewer places. On the derivatives side Coinbase reported trailing twelve month volume flat at $4.2 trillion while the market declined 12 percent over the same period. Concentration counts as a fault only in relation to what is concentrating.", "refs": ["coinbase-q2"]}]}, {"h": {"tr": "Yoğunlaşan şey nedir", "en": "What is actually concentrating"}, "ps": [{"tr": "Asıl rakam gelir tablosunun dışında duruyor. Coinbase, ürünlerinde tutulan ortalama USDC bakiyesinin 20 milyar dolar ile en yüksek düzeyine ulaştığını ve bunun dolaşımdaki toplam USDC'nin yaklaşık yüzde 30'una karşılık geldiğini bildirdi; ortalama USDC piyasa değeri 77 milyar dolar düzeyinde. Dolara sabitlenmiş bir kripto paranın dolaşımdaki miktarının yaklaşık üçte birinin tek bir yerde tutulması, o yerin kendi bilançosundan çok bir eşzamanlılık sorusu doğuruyor: aynı anda çıkmak isteyen bakiyelerin tamamı aynı kapıdan geçer.", "en": "The number that matters sits outside the income statement. Coinbase reported that average USDC held in its products reached an all-time high of $20 billion, representing approximately 30 percent of total USDC in circulation, against an average USDC market capitalisation of $77 billion. Holding roughly a third of a dollar-pegged token's circulating supply in one place raises a question of simultaneity, well before any question about that venue's own balance sheet. Balances that want out at the same moment all go through the same door.", "refs": ["coinbase-q2"]}, {"tr": "Bu zincirin karşı argümanı güçlü ve açıkça belirtilmeli: USDC'yi ihraç eden ve geri alan taraf Circle, rezervler Coinbase bilançosunda tutulmuyor ve sabitleme mekanizması bu yere bağlı değil. Yoğunlaşma saklama tarafında; ihraç Circle'da kalıyor. Yine de saklama tarafındaki tıkanma gerçek bir kanal: geri alım talebi tek bir arayüzden geçmek zorunda kaldığında gecikme, sabitlemenin bozulmasından bağımsız olarak fiyat farkı üretebilir. Kaldıraç ya da vade uyumsuzluğu gösteren bir açıklama yok; bilinen şey oranın kendisi ve Coinbase gelirinin işlem tarafından abonelik ve hizmet tarafına kaymakta olduğu.", "en": "The counter-argument to that chain is strong and should be stated plainly: USDC is issued and redeemed by Circle, the reserves are not held on the Coinbase balance sheet, and the peg does not depend on this venue. The concentration sits on the custody side, while issuance stays with Circle. Even so, congestion on the custody side is a real channel: when redemption requests have to pass through a single interface, delay can produce a price gap independently of any break in the peg. There is no disclosure indicating leverage or maturity mismatch; what is known is the share itself, and that Coinbase revenue is shifting from the transaction side to the subscription and services side.", "refs": ["coinbase-q2"]}]}], "sources": [{"key": "coinbase-q2", "kind": "news", "name": "Coinbase", "url": "https://www.sec.gov/Archives/edgar/data/1679788/000167978826000087/q226earningsdeck_sec.htm", "title": {"tr": "Coinbase ikinci çeyrekte 359,5 milyon dolar zarar açıkladı, geliri yüzde 19 daraldı", "en": "Coinbase reported a $359.5 million loss as revenue shrank 19 percent"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "eco-01", "title": {"tr": "Kısa uç geriledi, 30 yıllık 11 baz puan yükseldi", "en": "The short end fell, the 30-year rose 11 basis points"}, "excerpt": {"tr": "Fed hedef aralığı değiştirmedi; getiri eğrisinin kısa ve uzun ucu aynı gün ters yönlere gitti. Aradaki fark, uzun vadeli tahvili elinde tutanın üstünde kaldı.", "en": "The Fed left the target range alone; the short and long ends of the curve went opposite ways on the same day. The difference stayed with whoever holds long-dated paper."}, "sections": [{"h": {"tr": "Aynı günün iki fiyatı", "en": "Two prices from the same day"}, "ps": [{"tr": "Hazine Bakanlığı'nın resmî günlük getiri eğrisi serisi 29 Temmuz için tek bir yön göstermiyor. 30 yıllık getiri bir önceki günün yüzde 5,09 düzeyinden yüzde 5,20'ye, 10 yıllık getiri yüzde 4,61'den yüzde 4,67'ye çıktı. Aynı seansta 2 yıllık getiri yüzde 4,26'dan yüzde 4,22'ye, 3 aylık getiri yüzde 3,90'dan yüzde 3,83'e indi. Eğrinin kısa ucunda getiri düştü, uzun ucunda yükseldi.", "en": "The Treasury's official daily par yield curve series does not point one way for 29 July. The 30-year yield rose to 5.20 percent from 5.09 percent the day before and the 10-year to 4.67 percent from 4.61 percent. In the same session the 2-year fell to 4.22 percent from 4.26 percent and the 3-month to 3.83 percent from 3.90 percent. Yields fell at the short end of the curve and rose at the long end.", "refs": ["treasury"]}, {"tr": "O öğleden sonra Federal Açık Piyasa Komitesi hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında bıraktı. Karar 9'a 3 alındı; Beth M. Hammack, Neel Kashkari ve Lorie K. Logan çeyrek puanlık bir artıştan yana oy kullandı. Metin, enflasyonun yüzde 2 hedefine göre yüksek kaldığını ve bunun bir bölümünün enerji ile diğer sektörlerdeki arz şoklarını yansıttığını yazdı.", "en": "That afternoon the Federal Open Market Committee left the target range at 3.50 percent to 3.75 percent. The vote was 9 to 3, with Beth M. Hammack, Neel Kashkari and Lorie K. Logan voting for a quarter-point increase. The statement said inflation remains elevated relative to the 2 percent goal and that part of it reflects supply shocks in energy and other sectors.", "refs": ["fomc"]}]}, {"h": {"tr": "Hareketin adı", "en": "What the move is"}, "ps": [{"tr": "İki veriyi üst üste koyunca hareketin adı belli oluyor: piyasa yakın vadede daha az sıkılaştırma, uzak vadede daha fazla enflasyon telafisi fiyatladı. Üç karşı oy, kısa vadeli faiz beklentisini yukarı çekmedi — çekseydi 2 yıllık getiri düşmezdi. Tepkiyi uzun uç verdi. Tek bir seansın verisiyle bunu kanıtlamak da mümkün değil: uzun uçtaki yükseliş tahvil arz takvimiyle ya da yatırımcının başka ülkelerdeki uzun vadeli tahvillerden istediği primle de ilgili olabilir ve bir günlük seri bu iki açıklamayı ayırmaya yetmez.", "en": "Put the two series side by side and the move has a name: the market priced less tightening in the near term and more inflation compensation further out. The three dissents did not lift near-term rate expectations — had they done so, the 2-year would not have fallen. The reaction came from the long end. A single session cannot prove that reading either: the rise at the long end may owe something to the issuance calendar, or to the premium investors demand on long-dated government paper elsewhere, and one day of data cannot separate the two.", "refs": ["treasury", "fomc"]}, {"tr": "Ölçek küçük değil. 2 yıllık ile 30 yıllık arasındaki aralık bir günde 83 baz puandan 98 baz puana genişledi. Yüzde 5,20, Hazine'nin 2026 için yayımladığı 144 işlem gününün en yüksek 30 yıllık kapanışı; önceki en yüksek düzey 19 Mayıs'taki yüzde 5,18'di. ABD'de yılın en yüksek uzun vadeli getirisi, politika faizinin hiç değişmediği bir günde geldi.", "en": "The scale is not small. The gap between the 2-year and the 30-year widened from 83 basis points to 98 in one day. The 5.20 percent close is the highest 30-year reading in the 144 business days the Treasury has published for 2026; the previous high was 5.18 percent on 19 May. In the US the year's highest long-dated yield arrived on a day when the policy rate did not move at all.", "refs": ["treasury"]}]}, {"h": {"tr": "Farkın kimde kaldığı", "en": "Where the difference lands"}, "ps": [{"tr": "Ayrışmanın kalıcı olup olmadığı ölçülebilir bir eşikle izlenebilir. Hedef aralığı Fed bir sonraki toplantısında da değiştirmezse, 2 yıllık ile 30 yıllık arasındaki aralığın 31 Ekim'e kadar 98 baz puanın üzerinde kalmasını bekliyorum. Aralık bunun altına inerse okuma yanlıştı ve hareket bir günün gürültüsüydü.", "en": "Whether the split lasts can be watched against a measurable threshold. If the Fed again leaves the target range unchanged at its next meeting, I expect the gap between the 2-year and the 30-year to stay above 98 basis points through 31 October. If the gap falls below that, the reading was wrong and the move was one day's noise.", "refs": ["treasury"]}, {"tr": "28 Temmuz'da yazdığımda piyasanın bir artış olasılığını üçte bir dolayında fiyatladığını okumuştum. Karar artış getirmedi, ama üç karşı oyla geldi ve eğri bu bileşimi kısa uçtan değil, uzun uçtan yanıtladı. Faturayı da elinde uzun vadeli tahvil tutan taşıyor: getirisi 11 baz puan artan 30 yıllık bir tahvilin fiyatı o gün düşmüştür ve bu, kararın adının 'değişiklik yok' olmasını değiştirmez. ABD'de emeklilik fonu ile sigortacı gibi vadesi uzun yükümlülük taşıyanlar için gün, faiz kararının kendisinden daha hareketliydi.", "en": "When I wrote on 28 July, I read the market as pricing something like a one-in-three chance of an increase. The decision brought no increase, but it came with three dissents, and the curve answered that combination at the long end rather than the short one. The bill sits with holders of long-dated paper: a 30-year whose yield rose 11 basis points fell in price that day, and that does not change the fact that the decision was labelled no change. For US pension funds and insurers carrying long-dated liabilities, the day moved more than the rate decision did.", "refs": ["treasury", "history-hike-odds"]}]}], "sources": [{"key": "treasury", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\u0026field_tdr_date_value_month=202607", "title": {"tr": "Otuz yıllık tahvil getirisi yüzde 5,20 ile yılın en yüksek düzeyine çıktı", "en": "The thirty-year Treasury yield rose to 5.20 percent, its highest of the year"}, "publishedDate": "2026-07-29"}, {"key": "fomc", "kind": "news", "name": "Federal Reserve", "url": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm", "title": {"tr": "Fed politika faizini sabit tuttu, üç üye çeyrek puanlık artıştan yana oy verdi", "en": "The Fed held its policy rate and three officials voted for a quarter-point increase"}, "publishedDate": "2026-07-29"}, {"key": "history-hike-odds", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-07-28/", "title": {"tr": "İndirim çağrısına karşılık üçte birlik bir zam ihtimali", "en": "A one-in-three chance of a hike answers the call for cuts"}, "publishedDate": "2026-07-28"}], "date": "2026-07-30"}, {"writer": "eco-02", "title": {"tr": "Karar metni enflasyonun bir bölümünü arz şokuna bağlıyor", "en": "The statement ties part of the inflation to a supply shock"}, "excerpt": {"tr": "Fed faizi sabit tuttu ve gerekçesinde enerji kaynaklı arz şoklarını andı. Fiyat düzeyinin bir bölümü politika faizinin doğrudan ulaşamadığı yerdeyse, üç karşı oy güvenilirlikle ilgilidir, aktarım mekanizmasıyla değil.", "en": "The Fed held its rate and cited supply shocks in energy. If part of the price level sits where a policy rate cannot directly reach, the three dissents are about credibility, not about transmission."}, "sections": [{"h": {"tr": "Kendi gerekçesini okumak", "en": "Reading the statement's own reasoning"}, "ps": [{"tr": "Komite 29 Temmuz'da hedef aralığı yüzde 3,50 ile yüzde 3,75 arasında bıraktı. Metinde ekonomik etkinliğin yüksek belirsizliğe karşın sağlam bir hızda büyüdüğü, istihdam artışının işgücüne ayak uydurduğu ve işsizlik oranının pek değişmediği yazılı. Enflasyon için de yüzde 2 hedefinin üzerinde kaldığı, bunun bir bölümünün enerji ile diğer sektörlerdeki arz şoklarını yansıttığı belirtiliyor. Karar 9'a 3 alındı; Hammack, Kashkari ve Logan çeyrek puanlık artışı tercih etti.", "en": "On 29 July the Committee left the target range at 3.50 percent to 3.75 percent. The statement records that activity is expanding at a solid pace despite elevated uncertainty, that job gains have kept pace with the workforce and that the unemployment rate has changed little. On inflation it says the rate remains above the 2 percent goal and that part of it reflects supply shocks in energy and other sectors. The vote was 9 to 3, with Hammack, Kashkari and Logan preferring a quarter-point increase.", "refs": ["fomc"]}, {"tr": "Bir merkez bankası, arzdan gelen bir fiyat artışına ancak dolaylı bir yerden dokunabilir: talebi kısarak. Kanal kredinin fiyatından geçer — banka kredisinin faizi, şirket tahvilinin getirisi, hanenin taksiti — ve etkisi aylar değil çeyrekler içinde belirir. Metnin kendi gerekçesi bu yüzden bir sınır da çiziyor: çeyrek puanlık bir artış, enerji kaynaklı bileşeni doğrudan hedefleyemez. Karşı tarafın en güçlü hâlini de söylemek gerekir: bir artış, arz şokunun ikinci tur etkilerini beklentiler üzerinden kesebilir; o zaman soru fiyatın kendisinden artışın sepette yayılıp yayılmadığına kayar.", "en": "A central bank can touch a price increase that comes from supply only indirectly, by compressing demand. The channel runs through the price of credit — the rate on a bank loan, the yield on a corporate bond, the household instalment — and it shows up over quarters, not months. The statement's own reasoning therefore draws a boundary: a quarter-point increase cannot target the energy-driven component directly. The other side deserves its strongest form: an increase can cut the second-round effects of a supply shock through expectations, and then the question shifts from the price itself to whether the increase spreads across the basket.", "refs": ["fomc"]}]}, {"h": {"tr": "Uzun paranın fiyatını kim koyuyor?", "en": "Who sets the price of long money?"}, "ps": [{"tr": "Aynı gün Hazine'nin resmî serisinde 3 aylık getiri yüzde 3,90'dan yüzde 3,83'e, 2 yıllık yüzde 4,26'dan yüzde 4,22'ye indi. 30 yıllık ise yüzde 5,09'dan yüzde 5,20'ye çıktı ve 2 yıllık ile arasındaki aralık 83 baz puandan 98 baz puana genişledi. Kısa vadeli borçlanmanın fiyatı düştü, uzun vadeli borçlanmanın fiyatı yükseldi.", "en": "In the Treasury's official series the same day, the 3-month yield fell to 3.83 percent from 3.90 percent and the 2-year to 4.22 percent from 4.26 percent. The 30-year, by contrast, rose to 5.20 percent from 5.09 percent, and its gap to the 2-year widened from 83 basis points to 98. The cost of borrowing short fell; the cost of borrowing long rose.", "refs": ["treasury"]}, {"tr": "Rezervlerin fiyatını, yani eğrinin en kısa ucunu yalnızca Fed belirler. Şirketin yatırım kararını, hazinenin faiz yükünü ve uzun vadeli konut kredisini bağlayan uç ise 30 yıllık taraftır ve o uç, kararın açıklandığı gün ters yöne gitti. Aktarımın bu bölümü kararın imzasında değil, alıcının teklifinde oluşuyor: bir banka kredi açtığında mevduatı da o kredi yaratır, ama kredinin fiyatını uzun uçta ne bulacağını Fed yazmıyor.", "en": "Only the Fed sets the price of reserves, that is, the shortest end of the curve. The end that binds a company's investment decision, the Treasury's interest burden and a long-dated mortgage is the 30-year, and it went the other way on the day the decision was announced. This part of the transmission is settled in the buyer's bid rather than in the signature on the decision: when a bank extends credit the deposit is created by that loan, but what the loan's price finds at the long end is not written by the Fed.", "refs": ["treasury", "fomc"]}]}, {"h": {"tr": "Sıralama sorunu", "en": "A question of order"}, "ps": [{"tr": "Metin ileriye dönük bir yönlendirme vermiyor. Bu, bir eksiklik olarak da okunabilir, bir tercih olarak da; ama sonucu şudur: gecikmenin sınırı belirsiz kalıyor. Elimizde bilinen bir olasılık dağılımı yok; kimsenin tutmadığı bir belirsizlik var ve bu, daha dar bir iddiaya izin verir, zorlama bir tahmine değil.", "en": "The statement gives no forward guidance. That can be read as an omission or as a choice, but the consequence is the same: the bound on the lag is left open. There is no known probability distribution here; there is an uncertainty nobody holds, and that licenses a narrower claim rather than a forced forecast.", "refs": ["fomc"]}, {"tr": "Asıl soru bir yön sorusu değil, bir sıralama sorusu: enerji kaynaklı bir gider artışı ücret-fiyat sürecine dönüşür mü, dönüşmez mi, önce hangi bilançonun soğurduğuna bağlı. Şirket marjı emerse fiyata daha az yansır; hane bütçesi emerse talep zayıflar; kamu bütçesi emerse borçlanma gereği ve dolayısıyla uzun uçtaki getiri artar. 30 yıllığın kararla aynı gün yükselmesi, üçüncü ihtimali masadan kaldırmıyor.", "en": "The real question concerns order rather than direction: whether an energy-driven cost increase turns into a wage-price process depends on which balance sheet absorbs it first. If corporate margin absorbs it, less passes into prices; if the household budget absorbs it, demand weakens; if the public budget absorbs it, borrowing needs and therefore yields at the long end rise. The 30-year rising on the day of the decision does not take that third possibility off the table.", "refs": ["treasury", "fomc"]}]}], "sources": [{"key": "fomc", "kind": "news", "name": "Federal Reserve", "url": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm", "title": {"tr": "Fed politika faizini sabit tuttu, üç üye çeyrek puanlık artıştan yana oy verdi", "en": "The Fed held its policy rate and three officials voted for a quarter-point increase"}, "publishedDate": "2026-07-29"}, {"key": "treasury", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve\u0026field_tdr_date_value_month=202607", "title": {"tr": "Otuz yıllık tahvil getirisi yüzde 5,20 ile yılın en yüksek düzeyine çıktı", "en": "The thirty-year Treasury yield rose to 5.20 percent, its highest of the year"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "eco-03", "title": {"tr": "Bir çeyrekte 31 milyar dolar harcadıktan sonra kalan 784 milyon dolar", "en": "The 784 million dollars left after 31 billion dollars of spending in one quarter"}, "excerpt": {"tr": "Meta'nın ikinci çeyreği, sermaye harcaması tartışmasını muhasebeden nakde taşıyor: gelir yüzde 28, giderler yüzde 55 arttı ve serbest nakit akışı 784 milyon dolar düzeyinde kaldı. Microsoft benzer büyüklükte harcadı, dönüşümü bozulmadı.", "en": "Meta's second quarter moves the capital spending argument from accounting to cash: revenue rose 28 percent, costs 55 percent, and free cash flow came in at $784 million. Microsoft spent a comparable sum and its conversion held."}, "sections": [{"h": {"tr": "Gelirden nakde giden yol", "en": "The walk from revenue to cash"}, "ps": [{"tr": "Sırayı bozmadan okuyalım. Meta'nın geliri yıllık yüzde 28 artışla 60,80 milyar dolar düzeyine çıktı; toplam giderleri yüzde 55 artışla 42,03 milyar dolar düzeyine ulaştı. Faaliyet kârı yüzde 8 azalarak 18,78 milyar dolar düzeyine indi, faaliyet marjı yüzde 43'ten yüzde 31'e geldi. Net kâr yüzde 14 azalışla 15,85 milyar dolar, seyreltilmiş hisse başına kâr yüzde 13 azalışla 6,18 dolar. Çeyrekteki sermaye harcaması 31,08 milyar dolar, aynı çeyreğin serbest nakit akışı 784 milyon dolar.", "en": "Read it in order. Meta's revenue rose 28 percent year on year to $60.80 billion; total costs and expenses rose 55 percent to $42.03 billion. Income from operations fell 8 percent to $18.78 billion and the operating margin went from 43 percent to 31 percent. Net income fell 14 percent to $15.85 billion and diluted earnings per share 13 percent to $6.18. Capital expenditure for the quarter was $31.08 billion; free cash flow for the same quarter was $784 million.", "refs": ["meta"]}, {"tr": "On iki puanlık marj daralmasının aritmetiği açık: gider artışı gelir artışının iki katı hızda gitti. Altyapının bedeli tam burada, gelir tablosunun gider tarafında görünüyor. Bunun tümünü altyapıya yazmak da doğru olmaz — amortismanın devreye girdiği dönem, hukuki karşılıklar ya da yeniden yapılanma kalemleri gider sıçramasının bir bölümünün açıklaması olabilir ve tek çeyreğin özeti bu ayrımı yapmaya yetmiyor. Bunu ayıran şey, gelecek çeyreklerin gider kalemlerinin dağılımı olacak.", "en": "The arithmetic of a twelve-point margin compression is plain: costs grew twice as fast as revenue. That is exactly where the infrastructure is being paid for, on the cost side of the income statement. It would be wrong to book all of it to infrastructure — the period in which depreciation lands, legal provisions or restructuring items could explain part of the jump, and one quarter's summary cannot make that separation. What will separate them is how the cost lines are distributed across coming quarters.", "refs": ["meta"]}]}, {"h": {"tr": "Aynı ölçekte harcama, farklı dönüşüm", "en": "The same scale of spending, a different conversion"}, "ps": [{"tr": "Karşılaştırma için ölçek gerekiyor ve aynı çeyrekte bir tane var. Microsoft'un geliri yüzde 18 artışla 90,0 milyar dolar, faaliyet kârı yüzde 18 artışla 40,6 milyar dolar, net kârı yüzde 31 artışla 35,8 milyar dolar oldu. Nakit akış tablosunda maddi duran varlık alımları çeyrekte 35,802 milyar dolar, mali yılın tamamında 115,948 milyar dolar. Microsoft Cloud geliri yüzde 27 artışla 59,3 milyar dolar düzeyine çıktı ve Azure ile diğer bulut hizmetlerinde artış yüzde 43 oldu.", "en": "A comparison needs scale, and the same quarter supplies one. Microsoft's revenue rose 18 percent to $90.0 billion, operating income 18 percent to $40.6 billion and net income 31 percent to $35.8 billion. In the cash flow statement, additions to property and equipment were $35.802 billion for the quarter and $115.948 billion for the full fiscal year. Microsoft Cloud revenue rose 27 percent to $59.3 billion and Azure and other cloud services rose 43 percent.", "refs": ["microsoft"]}, {"tr": "İki şirket bir çeyrekte birbirine yakın büyüklükte sermaye harcaması yaptı — 31,08 milyar dolar ile 35,802 milyar dolar — ama sonuç aynı yerde durmadı. Microsoft'un faaliyet kârı gelirle aynı hızda, yüzde 18 arttı; Meta'nın faaliyet kârı yüzde 8 azaldı. Karşılaştırmanın ayırdığı şey harcamanın büyüklüğü değil, harcamanın nakde dönüşme hızı. Bu, Meta için bir değer yargısı değil bir zamanlama sorusu: aynı harcama düzeyi bir şirkette gelirle birlikte, diğerinde gelirin önünde gidiyor.", "en": "The two companies spent comparable sums in a single quarter — $31.08 billion against $35.802 billion — and did not end up in the same place. Microsoft's operating income grew at the same 18 percent pace as revenue; Meta's fell 8 percent. What the comparison isolates is the speed of conversion to cash rather than the size of the spending. That is a question of timing rather than a verdict on Meta: the same level of spending travels alongside revenue at one company and ahead of it at the other.", "refs": ["meta", "microsoft"]}]}, {"h": {"tr": "Öngörünün bağladığı tutar", "en": "What the outlook commits"}, "ps": [{"tr": "Şirketin kendi öngörüsü bu soruyu bir aralığa bağlıyor. Üçüncü çeyrek geliri 61 milyar dolar ile 64 milyar dolar, yıl sonu toplam gideri 165 milyar dolar ile 169 milyar dolar, yıl sonu sermaye harcaması 130 milyar dolar ile 145 milyar dolar bekleniyor. Sermaye harcaması bu aralıkta kalır ve gider aralığı korunursa, üçüncü ve dördüncü çeyreğin serbest nakit akışı toplamının aynı dönemin sermaye harcamasının yüzde 10'unu aşmamasını bekliyorum; aşarsa dönüşüm sorunu düşündüğümden hızlı çözülüyor demektir.", "en": "The company's own outlook ties this question to a range. It expects third-quarter revenue of $61 billion to $64 billion, full-year total expenses of $165 billion to $169 billion and full-year capital expenditure of $130 billion to $145 billion. If capital expenditure lands in that range and the expense range holds, I expect the combined free cash flow of the third and fourth quarters not to exceed 10 percent of the same period's capital expenditure; if it does, the conversion problem is resolving faster than I thought.", "refs": ["meta"]}, {"tr": "25 Temmuz'da Meta'nın veri merkezi finansmanını yazdığımda, bilanço dışı yapının sermaye giderini yok etmediğini, ertelediğini savunmuştum. İkinci çeyreğin nakit tablosu, ertelemenin nereye oturduğunu gösteriyor: 31,08 milyar dolar tutarında harcamanın ardından elde 784 milyon dolar kalıyor. Tez değişmiyor, ama artık daha somut bir şeye dayanıyor — çünkü 'yatırım yılı' bir anlatı olarak bedava, sermaye değil.", "en": "When I wrote about Meta's data-centre financing on 25 July, I argued that the off-balance-sheet structure defers the capital cost rather than removing it. The second quarter's cash statement shows where the deferral sits: after $31.08 billion of spending, $784 million is left. The thesis does not change, but it now rests on something more concrete — because an investment year is free as a narrative, and capital is not.", "refs": ["meta", "history-elpaso"]}]}], "sources": [{"key": "meta", "kind": "news", "name": "Meta", "url": "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx", "title": {"tr": "Meta'nın geliri yüzde 28 artarken giderleri yüzde 55 arttı", "en": "Meta revenue rose 28 percent while its costs rose 55 percent"}, "publishedDate": "2026-07-29"}, {"key": "microsoft", "kind": "news", "name": "Microsoft", "url": "https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast", "title": {"tr": "Microsoft, Azure gelirinin ilk kez 100 milyar dolar sınırını aştığını bildirdi", "en": "Microsoft said Azure revenue passed 100 billion dollars for the first time"}, "publishedDate": "2026-07-29"}, {"key": "history-elpaso", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-25/", "title": {"tr": "Meta borcu bilançodan çıkarıyor, karşılığında daha fazla faiz ödüyor", "en": "Meta moves the debt off its balance sheet and pays more for it"}, "publishedDate": "2026-07-25"}], "date": "2026-07-30"}, {"writer": "eco-04", "title": {"tr": "Bir haftada depolardan 7,2 milyon varil çıktı", "en": "In one week 7.2 million barrels left the tanks"}, "excerpt": {"tr": "Stratejik rezerv dışındaki ABD ham petrol stokları 404,5 milyon varile indi. Bir aydır tutunan bant kırıldı; kırılmanın nedenini bu seri tek başına söylemiyor.", "en": "US crude stocks outside the strategic reserve fell to 404.5 million barrels. The band they had held for a month broke; the series alone does not say why."}, "sections": [{"h": {"tr": "Sayım", "en": "The count"}, "ps": [{"tr": "Enerji Bilgi İdaresi'nin haftalık serisinde, Stratejik Petrol Rezervi dışındaki ABD ham petrol stokları 24 Temmuz'da sona eren haftada 404,508 milyon varile indi. Bir hafta önce 411,675 milyon varildi; azalma 7,167 milyon varil. Öncesindeki dört hafta 411,675, 409,665, 411,357 ve 408,359 milyon varil göstermişti. Yani seri bir aydır yaklaşık 408-412 milyon varil arasında gidip geliyordu ve bu hafta o bandın altına indi.", "en": "In the Energy Information Administration's weekly series, US crude stocks excluding the Strategic Petroleum Reserve fell to 404.508 million barrels in the week ended 24 July. A week earlier they stood at 411.675 million barrels, making the decline 7.167 million. The four preceding weeks had shown 411.675, 409.665, 411.357 and 408.359 million barrels. For a month the series had moved inside roughly 408 to 412 million barrels; this week it dropped below that band.", "refs": ["eia"]}, {"tr": "Bu büyüklükte bir haftalık azalma, fiyat hikâyesi değil madde dengesi değişimidir: o varil ya rafineriye girdi, ya ihraç edildi, ya ithalat azaldı. Hangisi olduğunu stok serisi söylemiyor — bir stok rakamı ne girdiyi ne çıktıyı ayrıştırır. Haftalık rakamların tahmin olduğunu ve sonradan gözden geçirilebildiğini de akılda tutmak gerekiyor; tek bir kargonun limana bir gün geç girmesi haftalık farkı milyonlarca varil oynatabilir. Kırılmanın kalıcı olup olmadığını bir hafta göstermez.", "en": "A weekly decline of that size is a change in the material balance rather than a price story: those barrels either went into refineries, were exported, or were not imported in the first place. The stock series does not say which — a stock figure separates neither inflow nor outflow. It is worth remembering too that the weekly figures are estimates and can be revised; a single cargo arriving a day late can move the weekly difference by millions of barrels. One week does not show whether the break holds.", "refs": ["eia"]}]}, {"h": {"tr": "Toplam ile yerin farkı", "en": "The difference between a total and a place"}, "ps": [{"tr": "Bir ülke toplamı, kıtlığın nerede olduğunu göstermez. Bu seri yalnızca ABD genelinin rakamını veriyor; bölge ve cins ayrımı yok. Oysa peşin fiyatı belirleyen şey ülke toplamı değil, en sıkışık fiziksel nokta: hangi depoda hangi cins ham petrol, hangi boru hattının ucunda duruyor. 404,5 milyon varil ile 411,7 milyon varil arasındaki fark bir bölgede toplanmışsa anlamı, ülkeye eşit dağılmış olmasından farklıdır ve bu seri o soruyu yanıtlamıyor.", "en": "A national total does not show where the tightness is. This series gives only the figure for the United States as a whole, with no split by region or grade. Yet what sets the prompt price is the tightest physical point rather than the national total: which grade of crude sits in which tank, at the end of which pipeline. If the difference between 404.5 million and 411.7 million barrels is concentrated in one region, it means something different from being spread evenly across the country, and this series does not answer that question.", "refs": ["eia"]}, {"tr": "28 Temmuz'da yazdığımda vadeli fiyattaki düşüşün teslim edilmiş bir varili değil, görüşmelerin olma olasılığını fiyatladığını savunmuştum. Aradığım fiziksel kanıt türü tam olarak bu: 7,167 milyon varil bir olasılığın değil, depodan gerçekten çıkmış bir hacmin ölçüsü. Bu kanıt tezimi doğrulamıyor, yalnızca sınavı mümkün kılıyor — çünkü varilin niçin çıktığını söylemiyor ve arz kesintisi ile güçlü rafineri talebi aynı rakamı üretebilir.", "en": "When I wrote on 28 July, I argued that the fall in the futures price was pricing the probability of talks rather than a delivered barrel. This is exactly the kind of physical evidence I was after: 7.167 million barrels measures a volume that has left storage rather than a probability. Yet the evidence does not confirm the thesis, it only makes it testable — because it does not say why the barrels left, and a supply interruption and strong refinery demand can produce the same number.", "refs": ["eia", "history-brent"]}]}, {"h": {"tr": "İzlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu yüzden bir rakama bakmak yeterli değil; sıradaki iki rakama bakmak gerekiyor. Tek haftalık bir azalma, ertesi hafta geri gelen bir stok artışıyla silinebilir; idarenin kendi uyarısı da haftalık tahminlerin gözden geçirilebildiğini söylüyor. Bandın altına inmek ile bandın altında kalmak farklı iki olay.", "en": "So one figure is not enough; the next two are what matter. A single week's decline can be erased by a build the following week, and the administration's own caution says the weekly estimates can be revised. Dropping below the band and staying below it are two different events.", "refs": ["eia"]}, {"tr": "Ölçülebilir eşik şu: azalma sonraki iki haftalık yayında geri alınmazsa, stokların 31 Ağustos'a kadar 405 milyon varilin altında kalmasını bekliyorum. Sinyal de aynı seride okunacak — 31 Temmuz ve 7 Ağustos haftalarının rakamları 405 milyon varilin altında basılırsa bant gerçekten kırılmıştır; biri üstüne dönerse bu hafta bir kargo takviminin gölgesiydi.", "en": "The measurable threshold is this: if the decline is not reversed in the next two weekly releases, I expect stocks to stay below 405 million barrels through 31 August. The signal will be read in the same series — if the figures for the weeks ended 31 July and 7 August print below 405 million barrels, the band has truly broken; if either returns above it, this week was the shadow of a cargo schedule.", "refs": ["eia"]}]}], "sources": [{"key": "eia", "kind": "news", "name": "U.S. Energy Information Administration", "url": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET\u0026s=WCESTUS1\u0026f=W", "title": {"tr": "ABD ticari ham petrol stokları bir haftada 7,2 milyon varil azaldı", "en": "US commercial crude oil stocks fell 7.2 million barrels in one week"}, "publishedDate": "2026-07-29"}, {"key": "history-brent", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-28/", "title": {"tr": "Brent ateşkesi fiyatladı, yük hâlâ uzun yoldan gidiyor", "en": "Brent priced the ceasefire; the cargo still takes the long way"}, "publishedDate": "2026-07-28"}], "date": "2026-07-30"}, {"writer": "eco-05", "title": {"tr": "Yüzde 28'lik bir kapsamla ölçülen istikrar", "en": "Stability measured across 28 percent of employees"}, "excerpt": {"tr": "ECB'nin ücret göstergesi 2027'nin ilk çeyreği için yüzde 2,7'yi gösteriyor. Bu rakam, katılan ülkelerdeki çalışanların yüzde 28,4'ünü kapsayan sözleşmelerden geliyor. Geri kalanı ölçmüyor.", "en": "The ECB wage tracker says 2.7 percent for the first quarter of 2027. That figure comes from agreements covering 28.4 percent of employees in the participating countries. It does not measure the rest."}, "sections": [{"h": {"tr": "Rakamın kapsadığı", "en": "What the figure covers"}, "ps": [{"tr": "Avrupa Merkez Bankası'nın (ECB) 29 Temmuz'da yayımladığı ücret göstergesi, yürürlükteki toplu iş sözleşmelerini izliyor ve dokuz euro bölgesi ülkesini kapsıyor. Toplu sözleşmeyle kararlaştırılan tek seferlik ödemeleri on iki aya yayan manşet gösterge 2026 için yüzde 2,3, 2027'nin ilk çeyreği için yüzde 2,7. Banka bunu, toplu sözleşmelerden gelen ücret baskısının yıl dönümünde genel olarak istikrarlı kaldığı biçiminde okuyor.", "en": "The wage tracker the European Central Bank (ECB) published on 29 July follows active collective bargaining agreements and covers nine euro area countries. The head
