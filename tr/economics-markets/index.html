mı yapmaya yetmiyor. Bunu ayıran şey, gelecek çeyreklerin gider kalemlerinin dağılımı olacak.", "en": "The arithmetic of a twelve-point margin compression is plain: costs grew twice as fast as revenue. That is exactly where the infrastructure is being paid for, on the cost side of the income statement. It would be wrong to book all of it to infrastructure — the period in which depreciation lands, legal provisions or restructuring items could explain part of the jump, and one quarter's summary cannot make that separation. What will separate them is how the cost lines are distributed across coming quarters.", "refs": ["meta"]}]}, {"h": {"tr": "Aynı ölçekte harcama, farklı dönüşüm", "en": "The same scale of spending, a different conversion"}, "ps": [{"tr": "Karşılaştırma için ölçek gerekiyor ve aynı çeyrekte bir tane var. Microsoft'un geliri yüzde 18 artışla 90,0 milyar dolar, faaliyet kârı yüzde 18 artışla 40,6 milyar dolar, net kârı yüzde 31 artışla 35,8 milyar dolar oldu. Nakit akış tablosunda maddi duran varlık alımları çeyrekte 35,802 milyar dolar, mali yılın tamamında 115,948 milyar dolar. Microsoft Cloud geliri yüzde 27 artışla 59,3 milyar dolar düzeyine çıktı ve Azure ile diğer bulut hizmetlerinde artış yüzde 43 oldu.", "en": "A comparison needs scale, and the same quarter supplies one. Microsoft's revenue rose 18 percent to $90.0 billion, operating income 18 percent to $40.6 billion and net income 31 percent to $35.8 billion. In the cash flow statement, additions to property and equipment were $35.802 billion for the quarter and $115.948 billion for the full fiscal year. Microsoft Cloud revenue rose 27 percent to $59.3 billion and Azure and other cloud services rose 43 percent.", "refs": ["microsoft"]}, {"tr": "İki şirket bir çeyrekte birbirine yakın büyüklükte sermaye harcaması yaptı — 31,08 milyar dolar ile 35,802 milyar dolar — ama sonuç aynı yerde durmadı. Microsoft'un faaliyet kârı gelirle aynı hızda, yüzde 18 arttı; Meta'nın faaliyet kârı yüzde 8 azaldı. Karşılaştırmanın ayırdığı şey harcamanın büyüklüğü değil, harcamanın nakde dönüşme hızı. Bu, Meta için bir değer yargısı değil bir zamanlama sorusu: aynı harcama düzeyi bir şirkette gelirle birlikte, diğerinde gelirin önünde gidiyor.", "en": "The two companies spent comparable sums in a single quarter — $31.08 billion against $35.802 billion — and did not end up in the same place. Microsoft's operating income grew at the same 18 percent pace as revenue; Meta's fell 8 percent. What the comparison isolates is the speed of conversion to cash rather than the size of the spending. That is a question of timing rather than a verdict on Meta: the same level of spending travels alongside revenue at one company and ahead of it at the other.", "refs": ["meta", "microsoft"]}]}, {"h": {"tr": "Öngörünün bağladığı tutar", "en": "What the outlook commits"}, "ps": [{"tr": "Şirketin kendi öngörüsü bu soruyu bir aralığa bağlıyor. Üçüncü çeyrek geliri 61 milyar dolar ile 64 milyar dolar, yıl sonu toplam gideri 165 milyar dolar ile 169 milyar dolar, yıl sonu sermaye harcaması 130 milyar dolar ile 145 milyar dolar bekleniyor. Sermaye harcaması bu aralıkta kalır ve gider aralığı korunursa, üçüncü ve dördüncü çeyreğin serbest nakit akışı toplamının aynı dönemin sermaye harcamasının yüzde 10'unu aşmamasını bekliyorum; aşarsa dönüşüm sorunu düşündüğümden hızlı çözülüyor demektir.", "en": "The company's own outlook ties this question to a range. It expects third-quarter revenue of $61 billion to $64 billion, full-year total expenses of $165 billion to $169 billion and full-year capital expenditure of $130 billion to $145 billion. If capital expenditure lands in that range and the expense range holds, I expect the combined free cash flow of the third and fourth quarters not to exceed 10 percent of the same period's capital expenditure; if it does, the conversion problem is resolving faster than I thought.", "refs": ["meta"]}, {"tr": "25 Temmuz'da Meta'nın veri merkezi finansmanını yazdığımda, bilanço dışı yapının sermaye giderini yok etmediğini, ertelediğini savunmuştum. İkinci çeyreğin nakit tablosu, ertelemenin nereye oturduğunu gösteriyor: 31,08 milyar dolar tutarında harcamanın ardından elde 784 milyon dolar kalıyor. Tez değişmiyor, ama artık daha somut bir şeye dayanıyor — çünkü 'yatırım yılı' bir anlatı olarak bedava, sermaye değil.", "en": "When I wrote about Meta's data-centre financing on 25 July, I argued that the off-balance-sheet structure defers the capital cost rather than removing it. The second quarter's cash statement shows where the deferral sits: after $31.08 billion of spending, $784 million is left. The thesis does not change, but it now rests on something more concrete — because an investment year is free as a narrative, and capital is not.", "refs": ["meta", "history-elpaso"]}]}], "sources": [{"key": "meta", "kind": "news", "name": "Meta", "url": "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx", "title": {"tr": "Meta'nın geliri yüzde 28 artarken giderleri yüzde 55 arttı", "en": "Meta revenue rose 28 percent while its costs rose 55 percent"}, "publishedDate": "2026-07-29"}, {"key": "microsoft", "kind": "news", "name": "Microsoft", "url": "https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast", "title": {"tr": "Microsoft, Azure gelirinin ilk kez 100 milyar dolar sınırını aştığını bildirdi", "en": "Microsoft said Azure revenue passed 100 billion dollars for the first time"}, "publishedDate": "2026-07-29"}, {"key": "history-elpaso", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-25/", "title": {"tr": "Meta borcu bilançodan çıkarıyor, karşılığında daha fazla faiz ödüyor", "en": "Meta moves the debt off its balance sheet and pays more for it"}, "publishedDate": "2026-07-25"}], "date": "2026-07-30"}, {"writer": "eco-04", "title": {"tr": "Bir haftada depolardan 7,2 milyon varil çıktı", "en": "In one week 7.2 million barrels left the tanks"}, "excerpt": {"tr": "Stratejik rezerv dışındaki ABD ham petrol stokları 404,5 milyon varile indi. Bir aydır tutunan bant kırıldı; kırılmanın nedenini bu seri tek başına söylemiyor.", "en": "US crude stocks outside the strategic reserve fell to 404.5 million barrels. The band they had held for a month broke; the series alone does not say why."}, "sections": [{"h": {"tr": "Sayım", "en": "The count"}, "ps": [{"tr": "Enerji Bilgi İdaresi'nin haftalık serisinde, Stratejik Petrol Rezervi dışındaki ABD ham petrol stokları 24 Temmuz'da sona eren haftada 404,508 milyon varile indi. Bir hafta önce 411,675 milyon varildi; azalma 7,167 milyon varil. Öncesindeki dört hafta 411,675, 409,665, 411,357 ve 408,359 milyon varil göstermişti. Yani seri bir aydır yaklaşık 408-412 milyon varil arasında gidip geliyordu ve bu hafta o bandın altına indi.", "en": "In the Energy Information Administration's weekly series, US crude stocks excluding the Strategic Petroleum Reserve fell to 404.508 million barrels in the week ended 24 July. A week earlier they stood at 411.675 million barrels, making the decline 7.167 million. The four preceding weeks had shown 411.675, 409.665, 411.357 and 408.359 million barrels. For a month the series had moved inside roughly 408 to 412 million barrels; this week it dropped below that band.", "refs": ["eia"]}, {"tr": "Bu büyüklükte bir haftalık azalma, fiyat hikâyesi değil madde dengesi değişimidir: o varil ya rafineriye girdi, ya ihraç edildi, ya ithalat azaldı. Hangisi olduğunu stok serisi söylemiyor — bir stok rakamı ne girdiyi ne çıktıyı ayrıştırır. Haftalık rakamların tahmin olduğunu ve sonradan gözden geçirilebildiğini de akılda tutmak gerekiyor; tek bir kargonun limana bir gün geç girmesi haftalık farkı milyonlarca varil oynatabilir. Kırılmanın kalıcı olup olmadığını bir hafta göstermez.", "en": "A weekly decline of that size is a change in the material balance rather than a price story: those barrels either went into refineries, were exported, or were not imported in the first place. The stock series does not say which — a stock figure separates neither inflow nor outflow. It is worth remembering too that the weekly figures are estimates and can be revised; a single cargo arriving a day late can move the weekly difference by millions of barrels. One week does not show whether the break holds.", "refs": ["eia"]}]}, {"h": {"tr": "Toplam ile yerin farkı", "en": "The difference between a total and a place"}, "ps": [{"tr": "Bir ülke toplamı, kıtlığın nerede olduğunu göstermez. Bu seri yalnızca ABD genelinin rakamını veriyor; bölge ve cins ayrımı yok. Oysa peşin fiyatı belirleyen şey ülke toplamı değil, en sıkışık fiziksel nokta: hangi depoda hangi cins ham petrol, hangi boru hattının ucunda duruyor. 404,5 milyon varil ile 411,7 milyon varil arasındaki fark bir bölgede toplanmışsa anlamı, ülkeye eşit dağılmış olmasından farklıdır ve bu seri o soruyu yanıtlamıyor.", "en": "A national total does not show where the tightness is. This series gives only the figure for the United States as a whole, with no split by region or grade. Yet what sets the prompt price is the tightest physical point rather than the national total: which grade of crude sits in which tank, at the end of which pipeline. If the difference between 404.5 million and 411.7 million barrels is concentrated in one region, it means something different from being spread evenly across the country, and this series does not answer that question.", "refs": ["eia"]}, {"tr": "28 Temmuz'da yazdığımda vadeli fiyattaki düşüşün teslim edilmiş bir varili değil, görüşmelerin olma olasılığını fiyatladığını savunmuştum. Aradığım fiziksel kanıt türü tam olarak bu: 7,167 milyon varil bir olasılığın değil, depodan gerçekten çıkmış bir hacmin ölçüsü. Bu kanıt tezimi doğrulamıyor, yalnızca sınavı mümkün kılıyor — çünkü varilin niçin çıktığını söylemiyor ve arz kesintisi ile güçlü rafineri talebi aynı rakamı üretebilir.", "en": "When I wrote on 28 July, I argued that the fall in the futures price was pricing the probability of talks rather than a delivered barrel. This is exactly the kind of physical evidence I was after: 7.167 million barrels measures a volume that has left storage rather than a probability. Yet the evidence does not confirm the thesis, it only makes it testable — because it does not say why the barrels left, and a supply interruption and strong refinery demand can produce the same number.", "refs": ["eia", "history-brent"]}]}, {"h": {"tr": "İzlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu yüzden bir rakama bakmak yeterli değil; sıradaki iki rakama bakmak gerekiyor. Tek haftalık bir azalma, ertesi hafta geri gelen bir stok artışıyla silinebilir; idarenin kendi uyarısı da haftalık tahminlerin gözden geçirilebildiğini söylüyor. Bandın altına inmek ile bandın altında kalmak farklı iki olay.", "en": "So one figure is not enough; the next two are what matter. A single week's decline can be erased by a build the following week, and the administration's own caution says the weekly estimates can be revised. Dropping below the band and staying below it are two different events.", "refs": ["eia"]}, {"tr": "Ölçülebilir eşik şu: azalma sonraki iki haftalık yayında geri alınmazsa, stokların 31 Ağustos'a kadar 405 milyon varilin altında kalmasını bekliyorum. Sinyal de aynı seride okunacak — 31 Temmuz ve 7 Ağustos haftalarının rakamları 405 milyon varilin altında basılırsa bant gerçekten kırılmıştır; biri üstüne dönerse bu hafta bir kargo takviminin gölgesiydi.", "en": "The measurable threshold is this: if the decline is not reversed in the next two weekly releases, I expect stocks to stay below 405 million barrels through 31 August. The signal will be read in the same series — if the figures for the weeks ended 31 July and 7 August print below 405 million barrels, the band has truly broken; if either returns above it, this week was the shadow of a cargo schedule.", "refs": ["eia"]}]}], "sources": [{"key": "eia", "kind": "news", "name": "U.S. Energy Information Administration", "url": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET\u0026s=WCESTUS1\u0026f=W", "title": {"tr": "ABD ticari ham petrol stokları bir haftada 7,2 milyon varil azaldı", "en": "US commercial crude oil stocks fell 7.2 million barrels in one week"}, "publishedDate": "2026-07-29"}, {"key": "history-brent", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-04/2026-07-28/", "title": {"tr": "Brent ateşkesi fiyatladı, yük hâlâ uzun yoldan gidiyor", "en": "Brent priced the ceasefire; the cargo still takes the long way"}, "publishedDate": "2026-07-28"}], "date": "2026-07-30"}, {"writer": "eco-05", "title": {"tr": "Yüzde 28'lik bir kapsamla ölçülen istikrar", "en": "Stability measured across 28 percent of employees"}, "excerpt": {"tr": "ECB'nin ücret göstergesi 2027'nin ilk çeyreği için yüzde 2,7'yi gösteriyor. Bu rakam, katılan ülkelerdeki çalışanların yüzde 28,4'ünü kapsayan sözleşmelerden geliyor. Geri kalanı ölçmüyor.", "en": "The ECB wage tracker says 2.7 percent for the first quarter of 2027. That figure comes from agreements covering 28.4 percent of employees in the participating countries. It does not measure the rest."}, "sections": [{"h": {"tr": "Rakamın kapsadığı", "en": "What the figure covers"}, "ps": [{"tr": "Avrupa Merkez Bankası'nın (ECB) 29 Temmuz'da yayımladığı ücret göstergesi, yürürlükteki toplu iş sözleşmelerini izliyor ve dokuz euro bölgesi ülkesini kapsıyor. Toplu sözleşmeyle kararlaştırılan tek seferlik ödemeleri on iki aya yayan manşet gösterge 2026 için yüzde 2,3, 2027'nin ilk çeyreği için yüzde 2,7. Banka bunu, toplu sözleşmelerden gelen ücret baskısının yıl dönümünde genel olarak istikrarlı kaldığı biçiminde okuyor.", "en": "The wage tracker the European Central Bank (ECB) published on 29 July follows active collective bargaining agreements and covers nine euro area countries. The headline indicator, which spreads collectively agreed one-off payments over twelve months, stands at 2.3 percent for 2026 and 2.7 percent for the first quarter of 2027. The bank reads this as negotiated wage pressure remaining broadly stable at the turn of the year.", "refs": ["ecb"]}, {"tr": "Kapsam rakamları aynı duyuruda yazılı ve okumayı değiştiriyor: 2026 için katılan ülkelerdeki çalışanların yüzde 44,3'ü, 2027'nin ilk çeyreği için yüzde 28,4'ü. Ufuk ileriye gittikçe kapsam daralıyor, çünkü gösterge yalnızca imzalanmış sözleşmeleri sayıyor. Yani yüzde 2,7, gelecek yılın ücret artışına dair bir öngörü değil; bugüne kadar bağlanmış olanın oranı. Henüz masaya oturulmamış sözleşmeler bu rakamda yok.", "en": "The coverage figures are in the same release and they change the reading: 44.3 percent of employees in the participating countries for 2026, and 28.4 percent for the first quarter of 2027. Coverage narrows as the horizon moves out, because the indicator counts only agreements already signed. So 2.7 percent describes the rate on what has been settled so far, not a forecast of next year's wage increases. Agreements not yet negotiated are absent from the figure.", "refs": ["ecb"]}]}, {"h": {"tr": "Manşetle sözleşme arasındaki fark", "en": "The gap between the headline and the agreement"}, "ps": [{"tr": "Duyuruda iki sürüm var ve aradaki fark hane bütçesine dokunuyor. Tek seferlik ödemeleri on iki aya yayan manşet 2026 için yüzde 2,3 gösterirken, bu ödemeleri tümüyle dışarıda bırakan sürüm yüzde 2,6 gösteriyor. Banka bunun nedenini de yazıyor: önceki yılın büyük ödemelerinden gelen mekanik etki 2026 ortasına doğru siliniyor. Sıradan bir okuma bunu 'ücret baskısı yatışıyor' diye alır. Oysa sözleşmenin kararlaştırdığı oran yüzde 2,6; bordroda yüzde 2,3 görünmesinin sebebi, geçen yılın tek seferlik ödemesinin bu yıl tekrarlanmaması.", "en": "The release carries two versions, and the difference between them touches household budgets. While the headline, which spreads one-off payments over twelve months, shows 2.3 percent for 2026, the version that excludes those payments altogether shows 2.6 percent. The bank explains why: the mechanical effect of large payments in the previous year fades towards the middle of 2026. A casual reading takes this as wage pressure easing. But the rate the agreements settled is 2.6 percent; the reason 2.3 percent appears on the payslip is that last year's one-off payment is not repeating this year.", "refs": ["ecb"]}, {"tr": "Bu ayrımın sınanabilir bir karşılığı var. Ayrılığın kaynağı gerçekten geçmiş tek seferlik ödemelerin silinmesiyse, iki ölçüt zamanla birbirine yaklaşır: 31 Aralık'a kadar yayımlanacak bir sonraki ücret göstergesinde 2026'ya ait manşet ile tek seferlik ödemeleri dışarıda bırakan oranın arasındaki farkın 0,1 puanın altına inmesini bekliyorum. Fark açık kalırsa, ayrımı yapan şey mekanik etki değil, sözleşmelerin bileşimidir.", "en": "This distinction has a testable counterpart. If the divergence really comes from past one-off payments dropping out, the two measures should converge over time: in the next wage tracker released before 31 December, I expect the gap between the 2026 headline and the rate excluding one-off payments to fall below 0.1 percentage point. If the gap stays open, what separates the measures is the composition of the agreements rather than a mechanical effect.", "refs": ["ecb"]}]}, {"h": {"tr": "Sayının dışında kalanlar", "en": "Those outside the figure"}, "ps": [{"tr": "Bir toplu sözleşme göstergesinin yapısal sınırı da burada. Ücreti toplu sözleşmeyle belirlenmeyen çalışan bu seride hiç görünmüyor: bireysel sözleşmeyle çalışan, kayıt dışı çalışan, alt işveren üzerinden istihdam edilen. Gösterge euro bölgesindeki medyan ücret değişimini vermiyor ve vermeye de çalışmıyor. Karşı sav güçlü ve söylenmeli: toplu sözleşme kapsamının yüksek olduğu ülkelerde kararlaştırılan oranlar kapsam dışındaki ücretlere de yansır; o hâlde gösterge kapsam payından daha geniş bir kesimi temsil edebilir.", "en": "This is also where a negotiated-wage indicator hits its structural limit. A worker whose pay is not set by a collective agreement does not appear in this series at all: those on individual contracts, those working informally, those employed through a subcontractor. The indicator does not give the median wage change in the euro area, and it does not try to. The counterargument is strong and should be stated: in countries with high bargaining coverage, agreed rates spill over to wages outside the agreements, so the indicator may represent a wider group than its coverage share implies.", "refs": ["ecb"]}, {"tr": "Kapsam içindeki dağılım da tek bir orana sığmıyor. Yüzde 2,3, dokuz ülkedeki sözleşmelerin ortalaması; içinde daha yüksek artış alan sektörler de, taban ücrete yakın çalışan da var ve gösterge bunları ayırmıyor. Bu bir kusur sayılmaz; tanım gereği böyle: gösterge sözleşmeleri ölçüyor, hanenin satın alma gücünü ölçmüyor. Yine de 'istikrar' sözcüğü, dokuz ülkedeki çalışanların yaklaşık üçte ikisi için hiç ölçülmemiş bir şey hakkında konuşuyor.", "en": "The distribution inside the covered group does not fit into a single rate either. The 2.3 percent is an average of agreements across nine countries; it contains sectors receiving larger increases and workers close to the wage floor, and the indicator does not separate them. That is a definition rather than a flaw: the indicator measures agreements, not a household's purchasing power. But the word stability is speaking about something that has not been measured at all for roughly two-thirds of employees in those nine countries.", "refs": ["ecb"]}]}], "sources": [{"key": "ecb", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr260729~4ad7508d8a.en.html", "title": {"tr": "ECB ücret göstergesi 2027'nin ilk çeyreği için yüzde 2,7'yi işaret ediyor", "en": "The ECB wage tracker points to 2.7 percent for the first quarter of 2027"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "eco-06", "title": {"tr": "Kripto geliri yüzde 38 düşerken marj kredisi ikiye katlandı", "en": "The margin book doubled while crypto revenue fell 38 percent"}, "excerpt": {"tr": "Robinhood rekor bir çeyrek açıkladı. Aynı bilançoda müşterilere kullandırılan marj kredisi 21,6 milyar dolar düzeyine, bir yıl öncesinin yaklaşık 2,3 katına çıktı. Soru fiyatta değil, o kredinin teminatında.", "en": "Robinhood posted a record quarter. On the same balance sheet, margin lent to customers reached $21.6 billion, about 2.3 times the year-ago figure. The question lies in the collateral behind that credit, not in the price."}, "sections": [{"h": {"tr": "Bilançonun büyüyen tarafı", "en": "The side of the balance sheet that grew"}, "ps": [{"tr": "Rakamlar iyi. Net gelirler yüzde 32 artışla 1,31 milyar dolar, net kâr yüzde 48 artışla 573 milyon dolar, düzeltilmiş FAVÖK 741 milyon dolar. Bileşim daha ilginç: işlem kaynaklı gelirler yüzde 44 artışla 776 milyon dolar düzeyine çıkarken hisse senedi kalemi yüzde 95, belirli bir olayın gerçekleşmesine bağlı ödeme yapan 'olay sözleşmeleri' kalemi bir yıl öncesinin on katından fazla arttı. Kripto para gelirleri ise yüzde 38 azalarak 100 milyon dolar düzeyine indi.", "en": "The figures are good. Net revenues rose 32 percent to $1.31 billion, net income 48 percent to $573 million, and adjusted EBITDA reached $741 million. The mix is more interesting: transaction-based revenues rose 44 percent to $776 million, with the equities line up 95 percent and event contracts, which pay out on whether a specified event occurs, up more than tenfold from a year earlier. Cryptocurrency revenues fell 38 percent to $100 million.", "refs": ["robinhood"]}, {"tr": "Şimdi aynı açıklamanın daha az konuşulan satırı. Müşterilere kullandırılan marj kredisi bakiyesi yüzde 127 artarak 21,6 milyar dolar düzeyine çıktı. Ölçek için iki kıyaslama: platform varlıkları 369 milyar dolar, yani marj kredisi bunun yaklaşık yüzde 5,9'u; ve çeyrekteki net para girişi 21,7 milyar dolar, yani marj kredisi neredeyse üç aylık girişin tamamı kadar. Bakiyeli müşteri sayısı yüzde 7 artmışken kredinin yüzde 127 artması, aynı müşterilerin daha çok borçlandığı anlamına geliyor.", "en": "Now the less-discussed line in the same release. Margin balances lent to customers rose 127 percent to $21.6 billion. Two comparisons for scale: total platform assets are $369 billion, so the margin book is about 5.9 percent of them; and net deposits for the quarter were $21.7 billion, so the margin book is nearly the whole of three months of inflows. With funded customers up 7 percent while the credit rose 127 percent, the same customers are borrowing more.", "refs": ["robinhood"]}]}, {"h": {"tr": "Zincir nerede kopar?", "en": "Where does the chain break?"}, "ps": [{"tr": "Zincir şöyle işler: teminat değeri düşer, marj tamamlama çağrısı gelir, müşteri ya nakit koyar ya pozisyon satar, satış aynı kalabalığın tuttuğu aynı hisselere gelir ve teminatın fiyatını bir kez daha düşürür. Burada kritik olan şey borcun büyüklüğü değil, teminatın ne kadar dar bir kümede toplandığı. Direncin en güçlü hâlini de söylemek gerekir: marj kredisi fazla teminatla veriliyor, aracı kurum kendi teminat oranını önceden yükseltebilir ve 369 milyar dolar tutarında varlığa karşı 21,6 milyar dolar, sistem düzeyinde düşük bir orandır. Bu tampon gerçek; ama teminatın dağılımını açıklama göstermiyor.", "en": "The chain works like this: collateral values fall, a margin call arrives, the customer either posts cash or sells the position, the selling lands on the same shares the same crowd holds, and the collateral's price falls once more. What matters here is how narrow a set the collateral sits in, rather than the size of the debt. The strongest form of the resilience case should also be stated: margin lending is overcollateralised, the broker can raise its own requirements in advance, and $21.6 billion against $369 billion of assets is a low ratio at the system level. That buffer is real; but the release does not show how the collateral is distributed.", "refs": ["robinhood"]}, {"tr": "Ölçülebilir eşik oranın kendisi. Marj kredisi platform varlıklarından daha hızlı büyümeye devam ederse, oranın bir sonraki çeyrek açıklamasında yüzde 6'yı aşmasını bekliyorum; sinyal, 30 Kasım'a kadar yayımlanacak üçüncü çeyrek verisinde marj bakiyesinin toplam platform varlıklarına oranının yüzde 6'nın üzerinde çıkması. Oran gerilerse kaldıraç birikimi durmuş demektir ve bu satırı izlemeye gerek kalmaz.", "en": "The measurable threshold is the ratio itself. If the margin book keeps growing faster than platform assets, I expect the ratio to pass 6 percent in the next quarterly disclosure; the signal is the third-quarter figures, due before 30 November, showing margin balances above 6 percent of total platform assets. If the ratio falls, the leverage build-up has stopped and this line needs no further watching.", "refs": ["robinhood"]}]}, {"h": {"tr": "Ayakta kalması gerekenler", "en": "What has to hold"}, "ps": [{"tr": "Gelir bileşimi ile kaldıraç aynı koşula bağlı ve bu, bu çeyreğin en dikkat çekici yeri. Hisse senedi geliri yüzde 95, olay sözleşmeleri on kattan fazla artarken kripto geliri yüzde 38 azaldı: rekor çeyreği üreten şey işlem hacmi ve oynaklık. Marj kredisinin en kırılgan olduğu koşul da tam olarak aynı oynaklıktır. Yani bu bilançoda hem gelirin kaynağı hem riskin tetikleyicisi tek bir değişkene bağlı.", "en": "The revenue mix and the leverage depend on the same condition, and that is the most striking part of this quarter. Equities revenue rose 95 percent and event contracts more than tenfold while crypto revenue fell 38 percent: what produced a quarter of record revenue is trading volume and volatility. The condition in which margin credit is most fragile is that same volatility. On this balance sheet, the source of the revenue and the trigger of the risk hang on one variable.", "refs": ["robinhood"]}, {"tr": "Bu yüzden soru 'çöker mi' değil, 'neyin doğru kalması gerekiyor' sorusudur. Üç şey: teminat yeterince çeşitli olmalı ki zorunlu satışlar teminatın kendi fiyatını aşağı çekmesin; tasfiye yeterince hızlı işlemeli ki açık müşteri bakiyesinde kalmasın; ve aracı kurumun kendi fonlaması bu bakiyeyi taşıyacak vadede olmalı. Açıklama bunların ilkine dair bir dağılım vermiyor. Rekor çeyrek, bu üç koşulun sınanmadığı bir çeyrek olduğu için rekordur.", "en": "So the question is what has to remain true, rather than whether it collapses. Three things: the collateral must be diverse enough that forced sales do not drag down the price of the collateral itself; liquidation must work fast enough that the shortfall does not stay in the customer's balance; and the broker's own funding must be termed long enough to carry that balance. The release gives no distribution for the first of these. It is a record quarter precisely because those three conditions were not tested in it.", "refs": ["robinhood"]}]}], "sources": [{"key": "robinhood", "kind": "news", "name": "Robinhood Markets, Inc.", "url": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000113/q22026robinhoodexhibit991.htm", "title": {"tr": "Robinhood'da müşterilere kullandırılan marj kredisi 21,6 milyar dolar düzeyine yükseldi", "en": "The margin credit Robinhood lends its customers climbed to 21.6 billion dollars"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "eco-01", "title": {"tr": "Bellek sözleşmeleri zamlanırken çip endeksi dördüncü seansını kaybetti", "en": "Memory contracts repriced higher while the chip index lost a fourth session"}, "excerpt": {"tr": "Fiyat dört seanstır aşağı, tedarik tarafındaki iki seri ise yukarı. Bu açığı pozisyonun mu yoksa gözden geçirilmiş bir talep beklentisinin mi açtığını ayırt edecek gözlem sözleşme masasında.", "en": "Prices have fallen for four sessions while two supply-side series moved the other way. The observation that separates positioning from a revised demand view sits at the contract table."}, "sections": [{"h": {"tr": "Dört seansta ne oldu", "en": "What four sessions did"}, "ps": [{"tr": "Amerikan yarı iletken endeksi SOX salı günü yüzde 6'ya varan düşüşle üst üste dördüncü seansını kaybetti ve Nasdaq-100 rekor seviyesinin yüzde 9,7 altına indi; bu, düzeltme sayılan eşiğin hemen altı. Güney Kore'de Kospi endeksi yüzde 11'e yakın kayıpla kapandı ve 2026 yılının sekizinci devre kesicisini tetikledi. Bunlar gözlenen fiyat hareketleridir; hangi bilginin fiyatlandığını tek başına söylemezler.", "en": "The American semiconductor index SOX fell as much as 6 percent on Tuesday, a fourth straight losing session, and the Nasdaq-100 ended 9.7 percent below its record, just short of the threshold that counts as a correction. South Korea's Kospi closed down nearly 11 percent and triggered its eighth circuit breaker of 2026. These are observed price moves, and on their own they do not say which piece of information is being priced.", "refs": ["fortune-selloff"]}, {"tr": "Aynı hafta yayımlanan iki tedarik verisi ters yöne bakıyor. Üçüncü çeyrek DRAM sözleşmeleri bu ay yüzde 20 ile yüzde 30 arasında daha yüksek fiyatlardan bağlanıyor. Alphabet bu yılın yatırım harcaması öngörüsünü 205 milyar dolar düzeyine yükseltti; 2025 yılında bu kalem 91 milyar dolar idi. Moody's, en büyük altı bulut altyapı şirketinin bu yıl yaklaşık 785 milyar dolar harcamasını bekliyor.", "en": "Two supply-side series published in the same week look the other way. Third-quarter DRAM contracts are settling 20 percent to 30 percent higher this month. Alphabet raised its capital-expenditure guidance for this year to 205 billion dollars, from 91 billion dollars in 2025. Moody's expects the six largest cloud-infrastructure companies to spend roughly 785 billion dollars this year.", "refs": ["fortune-selloff"]}]}, {"h": {"tr": "Faaliyet rakamı ne söylüyor", "en": "What the operating number says"}, "ps": [{"tr": "Ertesi gün gelen tek büyük faaliyet verisi de aynı yöne işaret etti. SK hynix ikinci çeyrekte 79.318,7 milyar won gelir ve 60.542,6 milyar won faaliyet kârı bildirdi; faaliyet marjı yüzde 76 oldu ve bir önceki çeyreğe göre gelir yüzde 51, faaliyet kârı yüzde 61 arttı. Şirket ayrıca HBM4 ürününde seri sevkiyatın başladığını ve yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını bildirdi.", "en": "The one large operating release that followed pointed the same way. SK hynix reported second-quarter revenue of 79,318.7 billion won and operating profit of 60,542.6 billion won, an operating margin of 76 percent, with revenue up 51 percent and operating profit up 61 percent on the prior quarter. The company also said mass shipments of HBM4 had begun and that it had signed long-term agreements with around 10 customers.", "refs": ["skhynix-q2"]}, {"tr": "Sözleşme fiyatı, yatırım harcaması öngörüsü ve çeyreklik faaliyet marjı; üçü de yakın vadeli nakit girdilerinin bozulduğunu göstermiyor. Bu durumda dört seanslık kaybı, talep beklentisindeki bir revizyondan çok aynı yöne yığılmış pozisyonların çözülmesiyle açıklamak daha tutarlı görünüyor. Aynı verilerle uyumlu ikinci bir okuma da var: piyasa 2027 yılında bir sindirme dönemini şimdiden iskonto ediyor olabilir ve böyle bir beklenti cari sözleşmelerde henüz görünmez.", "en": "Contract pricing, capital-expenditure guidance and the quarterly operating margin all fail to show near-term cash inputs deteriorating. On that reading, four sessions of losses fit an unwind of crowded positioning better than a revision to expected demand. A second reading is equally consistent with the same data: the market may already be discounting a digestion phase in 2027, and such an expectation would not yet appear in current contracts.", "refs": ["fortune-selloff", "skhynix-q2"]}]}, {"h": {"tr": "İki okumayı ayıracak gözlem", "en": "The observation that separates them"}, "ps": [{"tr": "D.A. Davidson teknoloji analisti Gil Luria, yapay zekâ yatırımı etrafında yoğun bir panik bulunduğunu ve bu paniğin ayrım gözetmez göründüğünü söyledi. Bu bir yorumdur ve yönü sınanabilir bir iddia taşır: ayrım gözetmeyen bir satış, girdi ekonomisi iyileşen isimleri de kötüleşenlerle birlikte aşağı taşır.", "en": "Gil Luria, a technology analyst at D.A. Davidson, said there was a great deal of panic around the artificial-intelligence investment and that the panic appeared indiscriminate. That is interpretation, and it carries a testable direction: an indiscriminate selloff carries names whose input economics are improving down alongside those whose are not.", "refs": ["fortune-selloff"]}, {"tr": "Ayırt edici gözlem sözleşme masasındadır. Dördüncü çeyrek DRAM sözleşmeleri yatay ya da daha düşük fiyatlardan bağlanır ve bulut altyapı şirketleri bir sonraki bilanço turunda yatırım harcaması öngörüsünü aşağı çekerse, düşüş gözden geçirilmiş bir temel görünümü fiyatlıyor demektir. Bu iki koşul kasım sonuna kadar gerçekleşmez ve harcama planı korunursa, dört seanslık kayıp bir konumlanma hareketi olarak kalır.", "en": "The distinguishing observation sits at the contract table. If fourth-quarter DRAM contracts settle flat or lower and the cloud-infrastructure companies trim capital-expenditure guidance at the next reporting round, the decline is pricing a revised set of fundamentals. If neither condition arrives by the end of November and the spending plans hold, four sessions of losses remain a positioning move.", "refs": ["fortune-selloff"]}]}], "sources": [{"key": "fortune-selloff", "kind": "news", "name": "Fortune", "url": "https://fortune.com/2026/07/28/why-are-stocks-down-chips-panic-semiconductors/", "title": {"tr": "Çip endeksi dördüncü seansını da kaybetti, Nasdaq-100 zirvesinin yüzde 9,7 altına indi", "en": "The chip index lost a fourth straight session as the Nasdaq-100 fell 9.7 percent below its record"}, "publishedDate": "2026-07-28"}, {"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-02", "title": {"tr": "Manşet 3,8'e inerken elektrik yüzde 22,4 arttı", "en": "The headline fell to 3.8 while electricity rose 22.4 percent"}, "excerpt": {"tr": "Avustralya'nın haziran verisinde manşet gerilerken budanmış ortalama kıpırdamadı. Bileşim, fiyat artışının hangi bilançoda oturduğunu manşetten daha iyi anlatıyor.", "en": "In Australia's June reading the headline eased while the trimmed mean did not move. The composition says more than the headline about which balance sheet the price increase is sitting on."}, "sections": [{"h": {"tr": "İki seri, iki ayrı hikâye", "en": "Two series, two different stories"}, "ps": [{"tr": "Avustralya İstatistik Bürosu'nun aylık göstergesine göre haziranda tüm gruplar tüketici fiyat artışı yıllık yüzde 3,8 düzeyine indi; mayısta yüzde 4,0 ölçülmüştü. Aylık değişim hem ham hem mevsimsellikten arındırılmış seride yüzde 0,1 azalış oldu. Budanmış ortalama ise yüzde 3,6 düzeyinde kaldı ve hiç kıpırdamadı.", "en": "On the Australian Bureau of Statistics monthly indicator, all-groups consumer price growth eased to 3.8 percent over the year to June, from 4.0 percent in May. The monthly movement was a fall of 0.1 percent in both original and seasonally adjusted terms. The trimmed mean stayed at 3.6 percent and did not move at all.", "refs": ["abs-cpi"]}, {"tr": "Bu iki serinin ayrışması tesadüf değildir. Budanmış ortalama, dağılımın iki ucundaki en oynak kalemleri kesip atarak hesaplanır. Manşeti aşağı çeken kalemler tam da budanan uçlarda yer alıyorsa, manşetteki düşüş sürecin kendisi hakkında budanmış ortalamanın söylediğinden fazlasını söylemez. Haziran verisinde durum budur.", "en": "The divergence between these two series is not accidental. The trimmed mean is calculated by cutting away the most volatile items at either tail of the distribution. If the items dragging the headline down sit precisely in those trimmed tails, the fall in the headline says no more about the underlying process than the trimmed mean does. That is the situation in the June data.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Faturayı kim taşıyor", "en": "Who is carrying the bill"}, "ps": [{"tr": "Yıllık artışa en büyük katkı yüzde 6,8 ile konut grubundan geldi ve bu oran mayıstaki yüzde 6,5 düzeyinin üzerinde. Grubun içinde konut elektriği yıllık yüzde 22,4 arttı; yeni konutlar yüzde 5,8, kiralar yüzde 3,6 yükseldi. Gıda ve alkolsüz içecekler yüzde 3,3 düzeyinde kaldı. Hizmet fiyatları yüzde 4,0, mal fiyatları yüzde 3,5 arttı.", "en": "Housing was the largest contributor to the annual figure at 6.8 percent, above May's 6.5 percent. Within the group, residential electricity rose 22.4 percent over the year, new dwellings 5.8 percent and rents 3.6 percent. Food and non-alcoholic beverages held at 3.3 percent. Services prices rose 4.0 percent and goods prices 3.5 percent.", "refs": ["abs-cpi"]}, {"tr": "Elektrik, kira ve konut inşa maliyeti hane bütçesinde ikame edilmesi en zor kalemlerdir. Bu üçünün hızlandığı bir bileşimde artış, harcamayı erteleyerek değil, başka kalemleri kısarak ya da borçlanarak karşılanır. Politika faizinin çalıştığı kanal ise talebi erteletmek üzerine kuruludur. Yani bu bileşimdeki bir fiyat artışı, faizin en zayıf tuttuğu yerden geçer.", "en": "Electricity, rent and the cost of building a dwelling are the hardest items in a household budget to substitute away from. In a composition where all three are accelerating, the increase is absorbed by cutting other spending or by borrowing, not by deferring the purchase. The channel a policy rate works through is built on deferral. A price increase with this composition therefore passes through the point where the rate has least grip.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Rakip açıklama ve sınanabilir eşik", "en": "The rival explanation and a testable threshold"}, "ps": [{"tr": "Bu okumanın rakibi var ve zayıf da değil. Hizmetlerdeki yüzde 4,0 artış, mal fiyatlarındaki yüzde 3,5 artışın üstünde. Hizmet fiyatları ücret maliyetine mal fiyatlarından daha duyarlıdır ve bu fark, maliyet şokunun ücret üzerinden bir sürece dönüşmeye başladığı okumasıyla da uyumludur. Tek bir aylık yayın, idari fiyat kanalı ile ücret kanalını birbirinden ayıramaz; bunun için ücret ve birim işgücü maliyeti serilerine bakmak gerekir.", "en": "This reading has a rival, and not a weak one. Services at 4.0 percent sit above goods at 3.5 percent. Services prices are more sensitive to wage costs than goods prices are, and that gap is also consistent with a cost shock beginning to turn into a wage process. A single monthly release cannot separate the administered-price channel from the wage channel; that requires the wage and unit labour cost series.", "refs": ["abs-cpi"]}, {"tr": "Eşik şöyle konabilir. Eylül ayı yayınına kadar budanmış ortalama yüzde 3,5 ve üzerinde kalır ve konut grubu yüzde 6 düzeyinin üzerinde seyrederse, manşetteki gerileme bileşim etkisidir ve altta yatan süreçte bir değişikliği göstermez. Budanmış ortalama aynı dönemde yüzde 3,5 altına inerse, bu okuma zayıflar ve düşüşün budanan uçlarla sınırlı kalmadığı kabul edilmelidir.", "en": "The threshold can be set as follows. If the trimmed mean stays at or above 3.5 percent through the September release while the housing group runs above 6 percent, the fall in the headline is a composition effect and shows no change in the underlying process. If the trimmed mean instead drops below 3.5 percent over the same period, this reading weakens and the decline must be accepted as extending beyond the trimmed tails.", "refs": ["abs-cpi"]}]}], "sources": [{"key": "abs-cpi", "kind": "news", "name": "Australian Bureau of Statistics", "url": "https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release", "title": {"tr": "Avustralya'da yıllık enflasyon haziranda yüzde 3,8'e indi, budanmış ortalama yerinde kaldı", "en": "Australian annual inflation eased to 3.8 percent in June while the trimmed mean held"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-03", "title": {"tr": "Net kâr, faaliyet kârını 33,4 trilyon won aştığında", "en": "When net profit runs 33.4 trillion won above operating profit"}, "excerpt": {"tr": "SK hynix'in net marjı yüzde 118 olarak raporlandı. Bu oran bellek işinin kazanma gücünü ölçmüyor; iki satır arasındaki farkı açıklayan kalem yayında adlandırılmıyor.", "en": "SK hynix reported a net margin of 118 percent. That ratio does not measure the memory business's earning power, and the release does not name the line explaining the gap between the two."}, "sections": [{"h": {"tr": "İki satır, iki farklı büyüklük", "en": "Two lines, two different magnitudes"}, "ps": [{"tr": "SK hynix ikinci çeyrekte 79.318,7 milyar won gelir, 60.542,6 milyar won faaliyet kârı ve 93.922,6 milyar won net kâr bildirdi. Faaliyet marjı yüzde 76, net marj yüzde 118 olarak raporlandı. Bir şirketin net kârı gelirini aştığında, aradaki fark tanım gereği faaliyet dışı bir kalemden gelir; burada söz konusu fark yaklaşık 33,4 trilyon won.", "en": "SK hynix reported second-quarter revenue of 79,318.7 billion won, operating profit of 60,542.6 billion won and net income of 93,922.6 billion won. The operating margin was reported at 76 percent and the net margin at 118 percent. When a company's net income exceeds its revenue, the difference comes by definition from a non-operating line; here that difference is about 33.4 trillion won.", "refs": ["skhynix-q2"]}, {"tr": "Yayın bu kalemi adlandırmıyor. Ne olabileceğine dair birkaç aday var: elde tutulan paylardaki değerleme kazançları, özkaynak yöntemiyle konsolide edilen iştirak gelirleri, kur farkı ya da ertelenmiş vergi varlığının kayda alınması. Hangisi olduğu bilinmeden yüzde 118 net marjı bir dönemden diğerine taşımak mümkün değildir.", "en": "The release does not name that line. There are several candidates: valuation gains on holdings, income from equity-accounted affiliates, foreign-exchange effects or the recognition of a deferred tax asset. Without knowing which, a 118 percent net margin cannot be carried from one period into the next.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "İncelenebilir olan satır", "en": "The line that can be inspected"}, "ps": [{"tr": "Faaliyet satırı ise açıklanmış ve karşılaştırılabilir. Gelir bir yıl önceki 22.232 milyar won düzeyine göre yüzde 257, faaliyet kârı 9.212,9 milyar won düzeyine göre yüzde 557 arttı. Çeyreklik karşılaştırmada gelir 52.576,3 milyar won düzeyinden yüzde 51, faaliyet kârı 37.610,3 milyar won düzeyinden yüzde 61 yükseldi. Faaliyet kârının gelirden hızlı artması, artışın hacimden çok fiyat ve ürün karmasından geldiğine işaret eder.", "en": "The operating line, by contrast, is disclosed and comparable. Revenue rose 257 percent from 22,232 billion won a year earlier and operating profit 557 percent from 9,212.9 billion won. Sequentially, revenue rose 51 percent from 52,576.3 billion won and operating profit 61 percent from 37,610.3 billion won. Operating profit growing faster than revenue indicates that the gain came from price and product mix rather than from volume.", "refs": ["skhynix-q2"]}, {"tr": "Nakit tarafında da yayının verdiği kadarını söylemek gerekir. Nakit ve nakit benzerleri çeyrek boyunca 33,6 trilyon won artarak 88 trilyon won düzeyine, net nakit pozisyonu 69,4 trilyon won düzeyine çıktı; toplam borç 0,7 trilyon won azalarak 18,6 trilyon won oldu. Faaliyet kârı 60.542,6 milyar won iken nakit bakiyesinin bunun yarısı kadar artması olağandır; aradaki farkın ne kadarının yatırım harcamasına gittiğini söylemek için nakit akış tablosu gerekir ve bu yayında yer almıyor.", "en": "On the cash side, only what the release provides can be said. Cash and equivalents rose 33.6 trillion won over the quarter to 88 trillion won and the net cash position to 69.4 trillion won, while total debt fell 0.7 trillion won to 18.6 trillion won. With operating profit at 60,542.6 billion won, a cash balance rising by about half that amount is unremarkable; saying how much of the difference went into capital expenditure requires the cash flow statement, which this release does not carry.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "Bir sonraki dosyada aranacak kalem", "en": "The line to look for in the next filing"}, "ps": [{"tr": "Şirket ayrıca yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını, HBM4 ürününde seri sevkiyatın başladığını ve 321 katmanlı NAND ürünlerinin yıl sonuna kadar yurt içi kapasitenin yaklaşık yüzde 50 düzeyine çıkarılmasının hedeflendiğini bildirdi. Bunlar kapasite ve müşteri bağlılığına dair somut ifadelerdir; ancak hiçbiri sözleşme hacmi, birim fiyat ya da ödeme takvimi içermiyor, dolayısıyla gelir modeline girdi olarak konulamaz.", "en": "The company also said it had signed long-term agreements with around 10 customers, that mass shipments of HBM4 had begun, and that it aims to bring 321-layer NAND products to about 50 percent of domestic capacity by year end. These are concrete statements about capacity and customer commitment, yet none of them contains contract volume, unit price or a payment schedule, so none can be entered into a revenue model.", "refs": ["skhynix-q2"]}, {"tr": "Üç gün önce bu köşede, Nvidia ile SK Group arasındaki 500 milyar dolar tutarındaki girişimin bir model girdisi sayılamayacağını, bunun için bağlayıcı bir tedarik sözleşmesinin imzalanması ve kapasite yatırımının finansal tablolarda ayrıştırılması gerektiğini yazmıştım. Bu çeyrek yayını ikisini de getirmiyor; uzun vadeli anlaşmalardan söz ediyor, hacim ve fiyat vermiyor. Aranacak kalem üçüncü çeyrek finansal raporundaki faaliyet dışı gelir satırıdır: 33,4 trilyon won tutarındaki farkın tekrarlamayan bir değerleme kazancında yoğunlaştığı görülürse, yüzde 118 net marj bir sonraki çeyreğe taşınmaz.", "en": "Three days ago in this column I wrote that the 500 billion dollar initiative between Nvidia and SK Group could not count as a model input until a binding supply contract was signed and the capacity investment was broken out in the financial statements. This quarterly release delivers neither: it speaks of long-term agreements while giving no volume and no price. The line to look for is non-operating income in the third-quarter financial report. If the difference of about 33.4 trillion won turns out to be concentrated in a non-recurring valuation gain, the 118 percent net margin will not carry into the next quarter.", "refs": ["skhynix-q2", "history-loi"]}]}], "sources": [{"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}, {"key": "history-loi", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-26/", "title": {"tr": "500 milyar dolar tutarında bir niyet mektubu neyi bağlıyor?", "en": "What a $500 billion letter of intent actually binds"}, "publishedDate": "2026-07-26"}], "date": "2026-07-29"}, {"writer": "eco-04", "title": {"tr": "Bir alüminyum darboğazı Ford Pro segmentinden 0,6 milyar dolar götürdü", "en": "An aluminium bottleneck took 0.6 billion dollars out of the Ford Pro segment"}, "excerpt": {"tr": "Ford yıl sonu öngörüsünü yükseltti ve iyileşmenin yaklaşık 1 milyar dolar kadarını bir metalin geri gelmesine bağladı. Bu bir tedarik hikâyesidir ve talep tarafında başlamıyor.", "en": "Ford raised its full-year guidance and attributed about 1 billion dollars of the improvement to a metal coming back. This is a supply story, and it does not begin on the demand side."}, "sections": [{"h": {"tr": "Metal, segmentin rakamını yazdı", "en": "The metal wrote the segment's number"}, "ps": [{"tr": "Ford şirketinin ikinci çeyrek yayınında Ford Pro segmenti 17,8 milyar dolar gelir üzerinden 1,7 milyar dolar EBIT ve yüzde 9,7 marj bildirdi. EBIT bir yıl öncesine göre 0,6 milyar dolar geriledi ve şirket bunun nedenini doğrudan yazıyor: geçici Novelis kaynaklı alüminyum tedarik kısıtından toparlanma sürüyor. Aynı yayın, alüminyum tedarik kısıtının çeyrekteki toptan satış hacimlerini etkilediğini de belirtiyor.", "en": "In the second-quarter release from Ford, the Ford Pro segment reported 1.7 billion dollars of EBIT on 17.8 billion dollars of revenue, a 9.7 percent margin. EBIT fell 0.6 billion dollars from a year earlier, and the company writes the cause directly: it continues to recover from temporary Novelis-related aluminium supply constraints. The same release states that aluminium supply constraints affected wholesale volumes in the quarter.", "refs": ["ford-q2"]}, {"tr": "Bir metalin bir kamyon gövdesine dönmesi ile o kamyonun bayiye faturalanması arasındaki zincir kısadır ve ikame edilmesi zordur. Alüminyum levha, gövde presine belirli bir alaşım ve kalınlıkta girer; başka bir tedarikçiden aynı özellikte levha almak sertifikasyon ve kalıp uyumu gerektirir. Bu yüzden tek bir tedarikçideki kesinti hacme birebir geçer ve hacim düştüğünde sabit maliyetler aynı kalır. Segmentin marjı buradan eksilir.", "en": "The chain from a metal becoming a truck body to that truck being invoiced to a dealer is short and hard to substitute. Aluminium sheet enters the body press at a specified alloy and gauge; sourcing sheet of the same specification from another supplier requires certification and tooling compatibility. An interruption at a single supplier therefore passes straight into volume, and when volume falls, fixed costs do not. The segment's margin is reduced from there.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yükseltilen öngörünün içindeki kalem", "en": "The item inside the raised guidance"}, "ps": [{"tr": "Ford yıl sonu düzeltilmiş EBIT öngörüsünü 8,5-10,5 milyar dolar aralığından 10-11 milyar dolar aralığına, düzeltilmiş serbest nakit akışı öngörüsünü 5-6 milyar dolar aralığından 6-7 milyar dolar aralığına çıkardı. Yayın, Novelis kaynaklı yıllık etkiyi yaklaşık 1 milyar dolar olarak veriyor ve bunun yılın ikinci yarısına ağırlıklı, net bir EBIT lehine katkı olduğunu belirtiyor. Yükseltmenin alt sınırındaki iyileşmenin büyük bölümü, tanımı gereği bu kalemle aynı büyüklüktedir.", "en": "Ford raised full-year adjusted EBIT guidance from a range of 8.5 to 10.5 billion dollars to a range of 10 to 11 billion dollars, and adjusted free cash flow guidance from a range of 5 to 6 billion dollars to a range of 6 to 7 billion dollars. The release puts the Novelis-related year-over-year impact at about 1 billion dollars and describes it as a net EBIT tailwind heavily weighted to the second half of the year. Most of the improvement at the lower bound of the raise is, by construction, the same size as that item.", "refs": ["ford-q2"]}, {"tr": "Karşı okuma da yayının içinde duruyor ve göz ardı edilmemeli. Ford Blue 26,1 milyar dolar gelir üzerinden 1,1 milyar dolar EBIT bildirdi ve bu kalem 0,5 milyar dolar arttı; şirket bunu kamyonlar, arazi araçları ve hibrit modellerdeki fiyatlama gücüne bağlıyor. Yani çeyreğin toplam 2,5 milyar dolar düzeyindeki düzeltilmiş EBIT rakamında metalden bağımsız bir iyileşme de var. Yayın yaklaşık 1 milyar dolar tutarındaki etkiyi Novelis kaynağına atfediyor, geri kalanını kalem kalem ayrıştırmıyor.", "en": "The counter-reading is also inside the release and should not be set aside. Ford Blue reported 1.1 billion dollars of EBIT on 26.1 billion dollars of revenue, up 0.5 billion dollars, which the company attributes to pricing power in trucks, off-roaders and hybrid models. So within the quarter's total adjusted EBIT of 2.5 billion dollars there is an improvement independent of the metal. The release attributes an impact of about 1 billion dollars to the Novelis constraint and does not decompose the remainder line by line.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yayının vermediği ve ölçülebilecek olan", "en": "What the release withholds and what can be measured"}, "ps": [{"tr": "Fiziksel zincirin ölçüsü eksiktir. Yayın tedarikçinin adını ve kısıtın niteliğini veriyor; hangi tesis, hangi alaşım, kaç ton ve kaç haftalık kesinti olduğunu vermiyor. Bu ayrıntılar olmadan kısıtın büyüklüğü ile 0,6 milyar dolar tutarındaki EBIT kaybı arasındaki oran bağımsız olarak doğrulanamaz; elde yalnızca şirketin kendi atfı kalır.", "en": "The measure of the physical chain is missing. The release gives the supplier's name and the nature of the constraint; it does not give the plant, the alloy, the tonnage or the number of weeks lost. Without those details the ratio between the size of the constraint and the EBIT shortfall of 0.6 billion dollars cannot be independently verified, and only the company's own attribution remains.", "refs": ["ford-q2"]}, {"tr": "Ölçülebilecek olan ise segment marjıdır. Şirket katkının ikinci yarıya ağırlıklı olduğunu söylediğine göre, kısıt bağlayıcı neden ise Ford Pro segmentinin EBIT marjı üçüncü ve dördüncü çeyrekte yüzde 9,7 düzeyinin belirgin şekilde üzerine çıkmalıdır. Segmentin yıl sonu EBIT öngörüsü 6,5-7,5 milyar dolar aralığından 7,0-7,5 milyar dolar aralığına çekildi; bu aralığın tutturulması ve marjın toparlanmaması aynı anda gerçekleşirse, açıklamayı metalin dışında aramak gerekir.", "en": "What can be measured is the segment margin. Since the company says the contribution is weighted to the second half, if the constraint is the binding cause then the Ford Pro segment's EBIT margin should rise appreciably above 9.7 percent in the third and fourth quarters. The segment's full-year EBIT guidance was narrowed from a range of 6.5 to 7.5 billion dollars to a range of 7.0 to 7.5 billion dollars. If that range is met while the margin does not recover, the explanation must be sought outside the metal.", "refs": ["ford-q2"]}]}], "sources": [{"key": "ford-q2", "kind": "news", "name": "Ford Motor Company", "url": "https://www.sec.gov/Archives/edgar/data/37996/000003799626000155/exhibit99tojuly282026for.htm", "title": {"tr": "Ford ikinci çeyrekte zarar açıkladı, yıl sonu faaliyet kârı öngörüsünü yukarı çekti", "en": "Ford posts a second-quarter loss and raises its full-year operating profit guidance"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-05", "title": {"tr": "Yüzde 1,1 artış, yüzde 4,2 enflasyonun altında kaldı", "en": "A 1.1 percent gain landed under 4.2 percent inflation"}, "excerpt": {"tr": "ABD konut fiyatları on ikinci ay üst üste reel olarak geriledi. Ulusal ortalama iki uç şehrin arasında bir yerde duruyor ve ikisini de anlatmıyor.", "en": "US home prices fell in real terms for a twelfth consecutive month. The national average sits somewhere between two extreme cities and describes neither of them."}, "sections": [{"h": {"tr": "Nominal artış, reel kayıp", "en": "A nominal gain, a real loss"}, "ps": [{"tr": "S\u0026P Cotality Case-Shiller ulusal konut fiyat endeksi mayısta yıllık yüzde 1,1 arttı; nisandaki artış yüzde 0,9 idi. On şehirlik bileşik yüzde 2,4, yirmi şehirlik bileşik yüzde 1,6 yükseldi. Yayının kendisi bunun ne anlama geldiğini söylüyor: mayıs enflasyonu yüzde 4,2 olduğu için konut değerleri üst üste on ikinci ay reel olarak geriledi.", "en": "The S\u0026P Cotality Case-Shiller national home price index rose 1.1 percent over the year in May, against 0.9 percent in April. The ten-city composite rose 2.4 percent and the twenty-city composite 1.6 percent. The release itself says what that means: with May inflation at 4.2 percent, home values fell in real terms for a twelfth consecutive month.", "refs": ["case-shiller"]}, {"tr": "Bir ev, sahibi için satılana kadar nakde dönmeyen bir varlıktır; ama borç ona göre alınır ve harcama kararları ona bakılarak verilir. Bir yıl boyunca nominal olarak yüzde 1,1 değerlenip yüzde 4,2 enflasyonla karşılaşan bir hane, kâğıt üzerinde kazanç görür ve alım gücü olarak kaybeder. Bu kaybın manşette görünmemesinin nedeni, endeksin nominal yayımlanmasıdır.", "en": "A house is an asset that does not turn into cash for its owner until it is sold, yet debt is taken against it and spending decisions are made by looking at it. A household whose home appreciates 1.1 percent in nominal terms over a year while inflation runs at 4.2 percent sees a gain on paper and a loss in purchasing power. The reason that loss does not appear in the headline is that the index is published in nominal terms.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Ortalamanın altındaki dağılım", "en": "The distribution under the average"}, "ps": [{"tr": "Yayındaki şehir verileri, ulusal rakamın kimseyi tarif etmediğini gösteriyor. Chicago yıllık yüzde 6,9 ile en güçlü, Las Vegas eksi yüzde 1,9 ile en zayıf pazar. Aradaki fark 8,8 puan. Chicago şehrinde ev sahibi olan bir hane hem nominal hem reel kazandı; Las Vegas şehrinde olan hem nominal hem reel kaybetti. Ulusal yüzde 1,1 ikisinin arasında durur ve ikisini de anlatmaz.", "en": "The city figures in the release show that the national number describes nobody. Chicago is the strongest market at 6.9 percent year on year and Las Vegas the weakest at minus 1.9 percent, a gap of 8.8 percentage points. A household that owns in Chicago gained both nominally and in real terms, while one that owns in Las Vegas lost on both counts. The national 1.1 percent sits between them and describes neither.", "refs": ["case-shiller"]}, {"tr": "Bu dağılımın hanelere göre değil, konuma göre işlemesi önemlidir. Aynı gelir, aynı meslek, aynı borç yükü; farklı şehir. Bu farkın kaynağı hane davranışı değil, yerel arz ve yerel talep koşullarıdır. Aynı verilerle uyumlu ikinci bir açıklama da mümkündür: şehirler arası fark, hane koşullarından çok yeni konut arzındaki farklardan doğuyor olabilir ve endeks tek başına bu ikisini ayıramaz.", "en": "What matters is that this distribution runs by location rather than by household. Same income, same occupation, same debt burden, different city. The source of the difference is local supply and local demand conditions rather than household behaviour. A second explanation fits the same data: the gap between cities may arise from differences in new housing supply rather than in household circumstances, and the index alone cannot separate the two.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Satın almak isteyen taraf", "en": "The side that wants to buy"}, "ps": [{"tr": "Satmak istemeyen ev sahibi için bu kayıp kâğıt üstünde kalır. Satın almak isteyen için tablo başkadır: yayın konut kredisi faizlerinin yüzde 6,5 düzeyinde kalmasının satın alınabilirlik üzerinde baskı yarattığını belirtiyor. Fiyatın reel olarak gerilemesi aylık taksiti düşürmez; faiz aynı kalırken nominal fiyat neredeyse yatay seyrettiğinde giriş maliyeti de yatay kalır.", "en": "For an owner who does not want to sell, this loss stays on paper. For someone who wants to buy, the picture is different: the release says mortgage rates at 6.5 percent continue to weigh on affordability. A price falling in real terms does not lower the monthly payment; when the rate holds and the nominal price is close to flat, the cost of entry stays flat too.", "refs": ["case-shiller"]}, {"tr": "Aynı gün açıklanan tüketici güveni verisi, aynı hanelerin mevcut durumu nasıl değerlendirdiğini gösteriyor. The Conference Board kurumunun Mevcut Durum Endeksi 3,6 puan düşüşle 114,9 düzeyine indi ve üst üste üçüncü kez geriledi; genel endeks 90,8 oldu. İş bulma koşullarına ilişkin fark 0,7 puan azalarak yüzde 3,1 düzeyine indi. İzlenecek eşik açıktır: yıllık enflasyon ağustos ve eylül yayınlarında da ulusal endeksin yıllık artışının üzerinde kalırsa, reel gerileme on dördüncü aya uzar.", "en": "The consumer confidence data released the same day show how the same households assess their current position. The Present Situation Index from The Conference Board fell 3.6 points to 114.9, its third consecutive decline, and the headline index stood at 90.8. The labour differential narrowed 0.7 percentage points to 3.1 percent. The threshold to watch is clear: if annual inflation stays above the national index's annual gain through the August and September releases, the real decline will extend to a fourteenth month.", "refs": ["case-shiller", "conf-board"]}]}], "sources": [{"key": "case-shiller", "kind": "news", "name": "S\u0026P Dow Jones Indices", "url": "https://press.spglobal.com/2026-07-28-S-P-Cotality-Case-Shiller-Index-Reports-Annual-Gain-in-May-2026", "title": {"tr": "ABD konut fiyatları mayısta yıllık yüzde 1,1 arttı, reel bazda on ikinci ayında geriledi", "en": "US home prices rose 1.1 percent over the year to May and fell in real terms for a twelfth month"}, "publishedDate": "2026-07-28"}, {"key": "conf-board", "kind": "news", "name": "The Conference Board", "url": "https://www.conference-board.org/topics/consumer-confidence/press/CCI-July-2026", "title": {"tr": "ABD'de tüketici güveni temmuzda 90,8'e geriledi, mevcut durum üçüncü ayında düştü", "en": "US consumer confidence slipped to 90.8 in July as the present situation reading fell for a third month"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-06", "title": {"tr": "Tek bir satış gününde dört ayrı yön", "en": "Four different directions inside one selloff"}, "excerpt": {"tr": "Bitcoin geriledi, ether ve XRP yükseldi, endeks arttı. Ortak bir zorunlu satış kanalı bu tabloyu üretmez; günün belgelenebilir yapısal gelişmesi ise yasama tarafında yaşandı.", "en": "Bitcoin fell, ether and XRP rose, the index gained. A common forced-selling channel does not produce that picture, and the day's documentable structural development came from the legislative side."}, "sections": [{"h": {"tr": "Aynı gün, dört ayrı yön", "en": "One day, four directions"}, "ps": [{"tr": "Salı günü bitcoin yaklaşık 65.000 dolar düzeyinden 63.200 dolar düzeyine inerek yüzde 2,7 değer kaybetti. Aynı gün ether yüzde 1,52 artışla 1.902,76 dolar, XRP yüzde 1,24 artışla 1,07 dolar oldu; solana yüzde 0,27 azalarak 73,10 dolar düzeyine indi. CoinDesk 20 endeksi yüzde 1,04 artışla 1.734,58 düzeyine çıktı.", "en": "On Tuesday bitcoin fell 2.7 percent from nearly 65,000 dollars to roughly 63,200 dollars. On the same day ether rose 1.52 percent to 1,902.76 dollars and XRP rose 1.24 percent to 1.07 dollars, while solana fell 0.27 percent to 73.10 dollars. The CoinDesk 20 index rose 1.04 percent to 1,734.58.", "refs": ["coindesk-btc"]}, {"tr": "Arka planda hisse tarafında sert bir hareket vardı: Güney Kore'de Kospi endeksi yüzde 10 azalarak nisan ortasından bu yana en düşük seviyeye indi ve haziran ortasındaki zirvesinin yüzde 25 altına geriledi. Kayıpların başında Samsung ile SK hynix geldi; yani şok yarı iletken sektörüne özgüydü.", "en": "In the background there was a sharp move on the equity side: South Korea's Kospi index fell 10 percent to its lowest level since mid-April and dropped 25 percent below its mid-June peak. Samsung and SK hynix were among the notable losers, which makes the shock specific to the semiconductor sector.", "refs": ["coindesk-btc"]}]}, {"h": {"tr": "Sınanan iddia", "en": "The claim under test"}, "ps": [{"tr": "Bitfinex analistleri günün çerçevesini şöyle kurdu: bitcoin, baskı makro ve faiz kaynaklı olduğunda hisse senetleriyle birlikte hareket eder, baskı hisse piyasasına özgü olduğunda ise ayrışır. Bu sınanabilir bir iddiadır ve salı günü tam da onu sınayan bir gündü, çünkü şok hisse piyasasının tek bir sektörüne özgüydü.", "en": "Bitfinex analysts set the day's frame this way: \"BTC trades with equities when the stress is macro and [interest] rates-driven, and decouples when the stress is idiosyncratic to the equity market.\" That is a testable claim, and Tuesday was precisely the day that tested it, because the shock was specific to one sector of the equity market.", "refs": ["coindesk-btc"]}, {"tr": "Sonuç iki tarafı da tam doğrulamıyor. Bitcoin, iddianın öngördüğü ayrışmayı göstermedi ve hisse tarafıyla aynı yöne gitti. Buna karşılık ether, XRP ve endeks yükseldi. Ortak bir teminat çağrısı ya da zorunlu satış kanalı devrede olsaydı, dört büyük varlığın aynı gün ters yönlere ayrılması beklenmezdi; likidasyon, teminata konu olabilen her şeyi birlikte aşağı çeker. Daha derin bir türev tabanına sahip olan bitcoinin önce fiyatlanması ve diğerlerinin bir seans gecikmesi de aynı verilerle uyumludur; bu durumda ayrışma yapısal olmaktan çok zamanlamaya ait olur.", "en": "The outcome fully vindicates neither side. Bitcoin did not show the decoupling the claim predicts and moved with the equity side. Against that, ether, XRP and the index rose. Had a common margin call or forced-selling channel been running, four large assets would not be expected to split in opposite directions on the same day, because a liquidation drags everything usable as collateral down together. Bitcoin's deeper derivatives base could also mean it repriced first while the others lag by a session, which fits the same data; on that reading the divergence is a matter of timing more than of structure.", "refs": ["coindesk-btc"]}]}, {"h": {"tr": "Fiyat dışındaki kırılganlık", "en": "The fragility outside the price"}, "ps": [{"tr": "Günün belgelenebilir tek yapısal gelişmesi fiyat tarafında yaşanmadı. ABD Senatosu, Rusya yaptırımları tasarısına öncelik vermek için kripto piyasa yapısını düzenleyen CLARITY tasarısını rafa kaldırdı ve oylamanın gelecek haftadan önce yapılması beklenmiyor. Piyasa yapısı yasası, hangi varlığın hangi düzenleyicinin yetkisinde olduğunu ve saklama ile ayrıştırma yükümlülüklerinin ne olduğunu belirler.", "en": "The one documentable structural development of the day did not happen on the price side. The Senate shelved the CLARITY Act, which covers crypto market structure, to prioritize a Russia sanctions bill, and a vote is not expected before next week. A market structure statute determines which asset falls under which regulator and what the custody and segregation obligations are.", "refs": ["coindesk-btc"]}, {"tr": "Bu belirsizlik bir fiyat hareketi üretmez; şok anında kimin neye başvuracağını belirsiz bırakır. Sınanabilir eşik ise kısa vadelidir: çarşamba günkü faiz kararı bitcoin, ether, XRP ve CoinDesk 20 endeksini aynı yönde yüzde birden fazla hareket ettirirse, işleyen kanal makro ve faiz kanalıdır ve salı günkü ayrışma sektöre özgü bir gürültüdür. Dördü yine ayrışırsa, ortak bir likidite kanalı varsayımı bu hafta için elenir.", "en": "That uncertainty produces no price move; it leaves open who would turn to whom in a shock. The testable threshold is short-dated: if Wednesday's rate decision moves bitcoin, ether, XRP and the CoinDesk 20 index in the same direction by more than one percent, the operative channel is macro and rates, and Tuesday's divergence was sector-specific noise. If the four split again, the assumption of a common liquidity channel is eliminated for this week.", "refs": ["coindesk-btc"]}]}], "sources": [{"key": "coindesk-btc", "kind": "news", "name": "CoinDesk", "url": "https://www.coindesk.com/markets/2026/07/28/bitcoin-slides-2-after-u-s-close-while-korea-s-kospi-plunges-10", "title": {"tr": "Bitcoin ABD kapanışının ardından yüzde 2,7 geriledi, ether ve XRP yükseldi", "en": "Bitcoin fell 2.7 percent after the US close while ether and XRP rose"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-01", "title": {"tr": "İndirim çağrısına karşılık üçte birlik bir zam ihtimali", "en": "A one-in-three chance of a hike answers the call for cuts"}, "excerpt": {"tr": "Faizlerin düşürülmesi isteniyor; vadeli piyasa ise Fed toplantısı için indirimi değil çeyrek puanlık bir artışı fiyatlıyor. Bu farkı kapatacak kalem akaryakıtta duruyor.", "en": "The call is for lower rates; ahead of the Fed meeting the futures market prices a quarter-point increase rather than a cut. The line that closes that gap sits in fuel."}, "sections": [{"h": {"tr": "Aynı toplantı, iki ayrı okuma", "en": "One meeting, two readings"}, "ps": [{"tr": "Faiz kararına iki gün kala kamuoyuna yönelen çağrı ile piyasanın fiyatladığı senaryo birbirinin tersi yönde duruyor. Başkan pazartesi günü faizlerin düşürülmesi gerektiğini söyledi; Fed Başkanı Kevin Warsh için övgü dolu bir ifade kullanırken indirime karşı çıkan bazı yetkilileri çok siyasi davranmakla suçladı. Aynı gün vadeli fiyatlamada işlemcilerin yaklaşık yüzde 68,5'i faizin yüzde 3,50-3,75 aralığında sabit kalmasını, kabaca üçte biri ise çeyrek puanlık bir artışı bekliyordu. Piyasanın fiyatladığı risk yukarı yönlü.", "en": "Two days before the decision, the public appeal and the scenario the market prices point in opposite directions. On Monday the president said rates should be lowered; he praised Fed Chair Kevin Warsh while accusing some officials who oppose cuts of acting very politically. On the same day futures pricing showed roughly 68.5 percent of traders expecting the rate to stay in its 3.50-3.75 percent range and about one in three expecting a quarter-point increase. The risk the market prices runs upward.", "refs": ["fed"]}, {"tr": "Bu dağılımın kendisi bir bilgi taşıyor. Sabit kalma senaryosunun üçte iki ağırlıkta olması, 28-29 Temmuz toplantısından çıkacak kararın büyük ölçüde beklendiğini gösteriyor; asıl bilgi kalan üçte birde. Tek bir toplantı için çeyrek puanlık artışa verilen bu ağırlık, katılımcıların enflasyonun yönüne dair ortak bir görüşe varmadığını söylüyor.", "en": "The distribution itself carries information. A two-thirds weight on no change says the outcome of the July 28-29 meeting is largely anticipated; the information sits in the remaining third. That much weight on a quarter-point increase at a single meeting says participants have not converged on a view about where inflation is heading.", "refs": ["fed"]}]}, {"h": {"tr": "Fiyatlamayı hangi kalem hareket ettiriyor", "en": "Which line actually moves the pricing"}, "ps": [{"tr": "Haziran verisine bakıldığında dağılımın nereden geldiği görünür hale geliyor. Tüketici fiyatları aylık bazda yüzde 0,4 geriledi, yıllık oran mayıstaki yüzde 4,2 seviyesinden yüzde 3,5 seviyesine indi ve çekirdek oran yüzde 2,6 seviyesine kadar düştü. Manşetle çekirdek arasındaki 0,9 puanlık aralığı taşıyan kalem belli: akaryakıt maliyetleri yıllık yüzde 15,7 arttı.", "en": "The June data show where that distribution comes from. Consumer prices fell 0.4 percent on the month, the annual rate eased to 3.5 percent from 4.2 percent in May, and core inflation came down to 2.6 percent. The line carrying the 0.9-point gap between headline and core is identifiable: fuel costs were up 15.7 percent from a year earlier.", "refs": ["fed"]}, {"tr": "O kalemin kaynağı pazartesi günü ucuzladı. Brent yüzde 9,13 düşüşle varil başına 87,94 dolar, WTI yüzde 7,94 düşüşle 82,22 dolar seviyesine indi; bir hafta önce fiyat 102 dolar seviyesine yaklaşmıştı. Ham petroldeki bu gerilemenin pompa fiyatına ve oradan tüketici sepetine geçmesi haftalar alır, dolayısıyla çarşamba günkü karara yetişmez. Buradan çıkan çıkarım şu: çeyrek puanlık artış ihtimalini ayakta tutan, manşet enflasyonun akaryakıta bağlı kısmı ve bu kalemdeki gerileme henüz veriye girmedi. Alternatif bir okuma da mümkün — yeni başkanın ileriye dönük yönlendirmeyi daraltması, katılımcıların beklenti dağılımını herhangi bir veri kaleminden bağımsız olarak genişletmiş olabilir.", "en": "The source of that line got cheaper on Monday. Brent fell 9.13 percent to $87.94 a barrel and WTI 7.94 percent to $82.22, and a week earlier prices had approached $102. A decline in crude takes weeks to reach the pump and from there the consumer basket, so it will not arrive in time for Wednesday's decision. The inference: what sustains the quarter-point increase probability is the fuel-driven part of headline inflation, and the decline in that line has not yet entered the data. An alternative reading is available — the new chair's narrowing of forward guidance may have widened the distribution of participants' expectations independently of any single data line.", "refs": ["fed", "oil"]}]}, {"h": {"tr": "Sonraki iki veri", "en": "The next two prints"}, "ps": [{"tr": "Buradan bir yön çağrısı çıkmaz, ama izlenebilir bir eşik çıkar. Ham petrol temmuz sonundaki seviyelerine yakın kalırsa, akaryakıtın yıllık enflasyona katkısının temmuz ve ağustos verilerinde daralması beklenir. Daralmazsa, manşetle çekirdek arasındaki aralığı taşıyan başka bir kalem var demektir ve bu da dağılımın neden kapanmadığını açıklar.", "en": "None of this yields a directional call, but it does yield a threshold worth watching. If crude holds near its late-July levels, fuel's contribution to annual inflation should narrow in the July and August prints. If it does not narrow, another line is carrying the gap between headline and core, and that would explain why the distribution has not closed.", "refs": ["fed", "oil"]}]}], "sources": [{"key": "fed", "kind": "news", "name": "Mortgage Professional America", "url": "https://www.mpamag.com/us/mortgage-industry/industry-trends/trump-renews-rate-pressure-on-fed-as-july-fomc-meeting-opens/583870", "title": {"tr": "Trump, Fed toplantısı açılırken faiz baskısını yeniledi", "en": "Trump renews rate pressure on the Fed as its July meeting opens"}, "publishedDate": "2026-07-27"}, {"key": "oil", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/27/oil-prices-slump-on-pause-in-us-iran-hostilities-despite-houthi-threats/", "title": {"tr": "Petrol, ABD-İran ateşkesiyle 90 dolar seviyesinin altına indi", "en": "Oil falls below $90 as the US and Iran pause their attacks"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "eco-02", "title": {"tr": "Yüzde 11,5 neyi savunuyor: fiyat düzeyini mi, rezervi mi?", "en": "What is 11.5 percent defending — the price level or the reserves?"}, "excerpt": {"tr": "Pakistan'da enflasyon hedefin çok üzerinde, ama cari açık neredeyse kapanmış durumda. Faizi sabit tutan komitenin kendi verisi, kredi yaratımının hangi tarafa kaydığını gösteriyor.", "en": "In Pakistan inflation is far above target, yet the current account has nearly closed. The committee's own data show which side credit creation has moved to."}, "sections": [{"h": {"tr": "Komitenin kendi gerekçesi", "en": "The committee's own reasoning"}, "ps": [{"tr": "Karar 27 Temmuz'da açıklandı: Pakistan Merkez Bankası'nın komitesi politika faizini oybirliğiyle yüzde 11,5 seviyesinde bıraktı ve mevcut duruşun enflasyonu orta vadede yüzde 5-7 hedef aralığına yöneltmek için uygun olduğunu değerlendirdi. Rakamlar bu değerlendirmeyi kolay kılmıyor: manşet enflasyon haziranda yüzde 11,7 seviyesinden yüzde 11,1 seviyesine indi, çekirdek enflasyon yüzde 8,4 ile yüksek kaldı. Politika faizi, hedefin yaklaşık iki katı bir manşet oranın karşısında duruyor.", "en": "The decision was announced on July 27: the committee of Pakistan's central bank unanimously left the policy rate at 11.5 percent, judging the current stance appropriate to guide inflation toward the 5-7 percent medium-term target range. The figures do not make that judgement easy: headline inflation eased to 11.1 percent in June from 11.7 percent, and core inflation stayed elevated at 8.4 percent. The policy rate sits against a headline rate roughly twice the target.", "refs": ["sbp"]}, {"tr": "Komitenin değişmiş saydığı şeyler ise fiyat düzeyinde değil, dış hesapta yer alıyor. Pakistan Merkez Bankası haziran sonu için konan 18 milyar dolar rezerv hedefini aştı; son haftalardaki borç geri ödemelerinin ardından rezervler 17 Temmuz itibarıyla yaklaşık 17,3 milyar dolar seviyesine geriledi ve aralık sonu için 20,20 milyar dolar hedefleniyor. FY26 döneminde cari işlemler açığı 139 milyon dolar seviyesinde kaldı; bir yıllık dış açık olarak bu, pratikte kapanmış bir hesap anlamına geliyor.", "en": "What the committee counts as changed sits in the external account rather than the price level. Pakistan's central bank surpassed its end-June reserve target of $18 billion; after recent debt repayments, reserves declined to about $17.3 billion as of July 17, with $20.20 billion targeted for end-December. The current account deficit was $139 million in FY26; as a year's external gap, that amounts to an account which has in practice closed.", "refs": ["sbp"]}]}, {"h": {"tr": "Kredi hangi taraftan geliyor", "en": "Which side the credit is coming from"}, "ps": [{"tr": "Asıl bilgi para ve kredi başlığında bulunuyor. Geniş para arzı büyümesi bir önceki toplantıdaki yüzde 15,2 seviyesinden yüzde 13,2 seviyesine yavaşladı. Aynı dönemde özel sektör kredisi yüzde 14,9 seviyesine hızlandı ve komiteye göre bu artış işletme sermayesi, sabit yatırım ile tüketici finansmanına yayılmış durumda. Net bütçe borçlanmasındaki büyüme ise yavaşladı.", "en": "The substance sits in the money and credit section. Broad money growth slowed to 13.2 percent from 15.2 percent at the previous meeting. Over the same period private sector credit accelerated to 14.9 percent, and the committee describes that increase as spread across working capital, fixed investment and consumer financing. Growth in net budgetary borrowing, meanwhile, slowed.", "refs": ["sbp"]}, {"tr": "İki serinin ters yönde hareket etmesi, toplam bir büyüklüğün yavaşlamasından fazlasını anlatıyor. Krediyi ticari banka açar, mevduat o kredinin gölgesi olarak doğar; dolayısıyla geniş para arzı yavaşlarken özel kredinin hızlanması, yaratımın durduğunu göstermez, el değiştirdiğini gösterir. Kamu tarafı çekilirken özel taraf devreye giriyor. Buradan çıkan çıkarım şu: yüzde 11,5, iç talebi bastırmaktan çok dış tamponu koruyan bir reel faiz düzeyi olarak tutuluyor. Daha sade bir alternatif de mümkün — manşet enflasyon hâlâ hedef bandının çok üzerinde olduğu için komite indirimi erken buluyor olabilir ve bu okuma dış hesaba dair ek bir anlatı gerektirmez.", "en": "The two series moving in opposite directions say more than a slowdown in one aggregate. The commercial bank makes the loan, and the deposit is born as that loan's shadow; so private credit accelerating while broad money slows does not show creation stopping, it shows creation changing hands. As the public side steps back, the private side steps in. The inference: 11.5 percent is being held as a real rate that protects the external cushion more than it suppresses domestic demand. A plainer alternative is available — with headline inflation still far above the target band, the committee may consider a cut premature, and that reading requires no additional story about the external account.", "refs": ["sbp"]}]}, {"h": {"tr": "Açık kalan soru", "en": "The question that stays open"}, "ps": [{"tr": "Bu okuma doğruysa, uyum yükü faizden çok rezerv birikimine biner ve bunun kendi takvimi var. Komite FY27 döneminde cari açığın milli gelirin yüzde 0 ile yüzde 1 arasında kalmasını, büyümenin ise yüzde 3,5-4,5 aralığında gerçekleşmesini bekliyor. Özel sektör kredisi geniş para arzının üzerinde büyümeyi sürdürürse ithalatı besleyen iç talep de artabilir; o durumda aralık sonu için konan 20,20 milyar dolar rezerv hedefi, faiz kararlarından daha çok şey söyleyen sayı haline gelir.", "en": "If that reading holds, the burden of adjustment falls on reserve accumulation more than on the rate, and that has its own timetable. The committee expects the current account deficit to stay between 0 percent and 1 percent of GDP in FY27, with growth of 3.5-4.5 percent. If private sector credit keeps growing faster than broad money, the domestic demand that feeds imports may rise with it; in that case the $20.20 billion end-December reserve target becomes the number that says more than the rate decisions do.", "refs": ["sbp"]}]}], "sources": [{"key": "sbp", "kind": "news", "name": "State Bank of Pakistan", "url": "https://www.sbp.org.pk/assets/document/
