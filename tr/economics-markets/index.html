line indicator, which spreads collectively agreed one-off payments over twelve months, stands at 2.3 percent for 2026 and 2.7 percent for the first quarter of 2027. The bank reads this as negotiated wage pressure remaining broadly stable at the turn of the year.", "refs": ["ecb"]}, {"tr": "Kapsam rakamları aynı duyuruda yazılı ve okumayı değiştiriyor: 2026 için katılan ülkelerdeki çalışanların yüzde 44,3'ü, 2027'nin ilk çeyreği için yüzde 28,4'ü. Ufuk ileriye gittikçe kapsam daralıyor, çünkü gösterge yalnızca imzalanmış sözleşmeleri sayıyor. Yani yüzde 2,7, gelecek yılın ücret artışına dair bir öngörü değil; bugüne kadar bağlanmış olanın oranı. Henüz masaya oturulmamış sözleşmeler bu rakamda yok.", "en": "The coverage figures are in the same release and they change the reading: 44.3 percent of employees in the participating countries for 2026, and 28.4 percent for the first quarter of 2027. Coverage narrows as the horizon moves out, because the indicator counts only agreements already signed. So 2.7 percent describes the rate on what has been settled so far, not a forecast of next year's wage increases. Agreements not yet negotiated are absent from the figure.", "refs": ["ecb"]}]}, {"h": {"tr": "Manşetle sözleşme arasındaki fark", "en": "The gap between the headline and the agreement"}, "ps": [{"tr": "Duyuruda iki sürüm var ve aradaki fark hane bütçesine dokunuyor. Tek seferlik ödemeleri on iki aya yayan manşet 2026 için yüzde 2,3 gösterirken, bu ödemeleri tümüyle dışarıda bırakan sürüm yüzde 2,6 gösteriyor. Banka bunun nedenini de yazıyor: önceki yılın büyük ödemelerinden gelen mekanik etki 2026 ortasına doğru siliniyor. Sıradan bir okuma bunu 'ücret baskısı yatışıyor' diye alır. Oysa sözleşmenin kararlaştırdığı oran yüzde 2,6; bordroda yüzde 2,3 görünmesinin sebebi, geçen yılın tek seferlik ödemesinin bu yıl tekrarlanmaması.", "en": "The release carries two versions, and the difference between them touches household budgets. While the headline, which spreads one-off payments over twelve months, shows 2.3 percent for 2026, the version that excludes those payments altogether shows 2.6 percent. The bank explains why: the mechanical effect of large payments in the previous year fades towards the middle of 2026. A casual reading takes this as wage pressure easing. But the rate the agreements settled is 2.6 percent; the reason 2.3 percent appears on the payslip is that last year's one-off payment is not repeating this year.", "refs": ["ecb"]}, {"tr": "Bu ayrımın sınanabilir bir karşılığı var. Ayrılığın kaynağı gerçekten geçmiş tek seferlik ödemelerin silinmesiyse, iki ölçüt zamanla birbirine yaklaşır: 31 Aralık'a kadar yayımlanacak bir sonraki ücret göstergesinde 2026'ya ait manşet ile tek seferlik ödemeleri dışarıda bırakan oranın arasındaki farkın 0,1 puanın altına inmesini bekliyorum. Fark açık kalırsa, ayrımı yapan şey mekanik etki değil, sözleşmelerin bileşimidir.", "en": "This distinction has a testable counterpart. If the divergence really comes from past one-off payments dropping out, the two measures should converge over time: in the next wage tracker released before 31 December, I expect the gap between the 2026 headline and the rate excluding one-off payments to fall below 0.1 percentage point. If the gap stays open, what separates the measures is the composition of the agreements rather than a mechanical effect.", "refs": ["ecb"]}]}, {"h": {"tr": "Sayının dışında kalanlar", "en": "Those outside the figure"}, "ps": [{"tr": "Bir toplu sözleşme göstergesinin yapısal sınırı da burada. Ücreti toplu sözleşmeyle belirlenmeyen çalışan bu seride hiç görünmüyor: bireysel sözleşmeyle çalışan, kayıt dışı çalışan, alt işveren üzerinden istihdam edilen. Gösterge euro bölgesindeki medyan ücret değişimini vermiyor ve vermeye de çalışmıyor. Karşı sav güçlü ve söylenmeli: toplu sözleşme kapsamının yüksek olduğu ülkelerde kararlaştırılan oranlar kapsam dışındaki ücretlere de yansır; o hâlde gösterge kapsam payından daha geniş bir kesimi temsil edebilir.", "en": "This is also where a negotiated-wage indicator hits its structural limit. A worker whose pay is not set by a collective agreement does not appear in this series at all: those on individual contracts, those working informally, those employed through a subcontractor. The indicator does not give the median wage change in the euro area, and it does not try to. The counterargument is strong and should be stated: in countries with high bargaining coverage, agreed rates spill over to wages outside the agreements, so the indicator may represent a wider group than its coverage share implies.", "refs": ["ecb"]}, {"tr": "Kapsam içindeki dağılım da tek bir orana sığmıyor. Yüzde 2,3, dokuz ülkedeki sözleşmelerin ortalaması; içinde daha yüksek artış alan sektörler de, taban ücrete yakın çalışan da var ve gösterge bunları ayırmıyor. Bu bir kusur sayılmaz; tanım gereği böyle: gösterge sözleşmeleri ölçüyor, hanenin satın alma gücünü ölçmüyor. Yine de 'istikrar' sözcüğü, dokuz ülkedeki çalışanların yaklaşık üçte ikisi için hiç ölçülmemiş bir şey hakkında konuşuyor.", "en": "The distribution inside the covered group does not fit into a single rate either. The 2.3 percent is an average of agreements across nine countries; it contains sectors receiving larger increases and workers close to the wage floor, and the indicator does not separate them. That is a definition rather than a flaw: the indicator measures agreements, not a household's purchasing power. But the word stability is speaking about something that has not been measured at all for roughly two-thirds of employees in those nine countries.", "refs": ["ecb"]}]}], "sources": [{"key": "ecb", "kind": "news", "name": "European Central Bank", "url": "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr260729~4ad7508d8a.en.html", "title": {"tr": "ECB ücret göstergesi 2027'nin ilk çeyreği için yüzde 2,7'yi işaret ediyor", "en": "The ECB wage tracker points to 2.7 percent for the first quarter of 2027"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "eco-06", "title": {"tr": "Kripto geliri yüzde 38 düşerken marj kredisi ikiye katlandı", "en": "The margin book doubled while crypto revenue fell 38 percent"}, "excerpt": {"tr": "Robinhood rekor bir çeyrek açıkladı. Aynı bilançoda müşterilere kullandırılan marj kredisi 21,6 milyar dolar düzeyine, bir yıl öncesinin yaklaşık 2,3 katına çıktı. Soru fiyatta değil, o kredinin teminatında.", "en": "Robinhood posted a record quarter. On the same balance sheet, margin lent to customers reached $21.6 billion, about 2.3 times the year-ago figure. The question lies in the collateral behind that credit, not in the price."}, "sections": [{"h": {"tr": "Bilançonun büyüyen tarafı", "en": "The side of the balance sheet that grew"}, "ps": [{"tr": "Rakamlar iyi. Net gelirler yüzde 32 artışla 1,31 milyar dolar, net kâr yüzde 48 artışla 573 milyon dolar, düzeltilmiş FAVÖK 741 milyon dolar. Bileşim daha ilginç: işlem kaynaklı gelirler yüzde 44 artışla 776 milyon dolar düzeyine çıkarken hisse senedi kalemi yüzde 95, belirli bir olayın gerçekleşmesine bağlı ödeme yapan 'olay sözleşmeleri' kalemi bir yıl öncesinin on katından fazla arttı. Kripto para gelirleri ise yüzde 38 azalarak 100 milyon dolar düzeyine indi.", "en": "The figures are good. Net revenues rose 32 percent to $1.31 billion, net income 48 percent to $573 million, and adjusted EBITDA reached $741 million. The mix is more interesting: transaction-based revenues rose 44 percent to $776 million, with the equities line up 95 percent and event contracts, which pay out on whether a specified event occurs, up more than tenfold from a year earlier. Cryptocurrency revenues fell 38 percent to $100 million.", "refs": ["robinhood"]}, {"tr": "Şimdi aynı açıklamanın daha az konuşulan satırı. Müşterilere kullandırılan marj kredisi bakiyesi yüzde 127 artarak 21,6 milyar dolar düzeyine çıktı. Ölçek için iki kıyaslama: platform varlıkları 369 milyar dolar, yani marj kredisi bunun yaklaşık yüzde 5,9'u; ve çeyrekteki net para girişi 21,7 milyar dolar, yani marj kredisi neredeyse üç aylık girişin tamamı kadar. Bakiyeli müşteri sayısı yüzde 7 artmışken kredinin yüzde 127 artması, aynı müşterilerin daha çok borçlandığı anlamına geliyor.", "en": "Now the less-discussed line in the same release. Margin balances lent to customers rose 127 percent to $21.6 billion. Two comparisons for scale: total platform assets are $369 billion, so the margin book is about 5.9 percent of them; and net deposits for the quarter were $21.7 billion, so the margin book is nearly the whole of three months of inflows. With funded customers up 7 percent while the credit rose 127 percent, the same customers are borrowing more.", "refs": ["robinhood"]}]}, {"h": {"tr": "Zincir nerede kopar?", "en": "Where does the chain break?"}, "ps": [{"tr": "Zincir şöyle işler: teminat değeri düşer, marj tamamlama çağrısı gelir, müşteri ya nakit koyar ya pozisyon satar, satış aynı kalabalığın tuttuğu aynı hisselere gelir ve teminatın fiyatını bir kez daha düşürür. Burada kritik olan şey borcun büyüklüğü değil, teminatın ne kadar dar bir kümede toplandığı. Direncin en güçlü hâlini de söylemek gerekir: marj kredisi fazla teminatla veriliyor, aracı kurum kendi teminat oranını önceden yükseltebilir ve 369 milyar dolar tutarında varlığa karşı 21,6 milyar dolar, sistem düzeyinde düşük bir orandır. Bu tampon gerçek; ama teminatın dağılımını açıklama göstermiyor.", "en": "The chain works like this: collateral values fall, a margin call arrives, the customer either posts cash or sells the position, the selling lands on the same shares the same crowd holds, and the collateral's price falls once more. What matters here is how narrow a set the collateral sits in, rather than the size of the debt. The strongest form of the resilience case should also be stated: margin lending is overcollateralised, the broker can raise its own requirements in advance, and $21.6 billion against $369 billion of assets is a low ratio at the system level. That buffer is real; but the release does not show how the collateral is distributed.", "refs": ["robinhood"]}, {"tr": "Ölçülebilir eşik oranın kendisi. Marj kredisi platform varlıklarından daha hızlı büyümeye devam ederse, oranın bir sonraki çeyrek açıklamasında yüzde 6'yı aşmasını bekliyorum; sinyal, 30 Kasım'a kadar yayımlanacak üçüncü çeyrek verisinde marj bakiyesinin toplam platform varlıklarına oranının yüzde 6'nın üzerinde çıkması. Oran gerilerse kaldıraç birikimi durmuş demektir ve bu satırı izlemeye gerek kalmaz.", "en": "The measurable threshold is the ratio itself. If the margin book keeps growing faster than platform assets, I expect the ratio to pass 6 percent in the next quarterly disclosure; the signal is the third-quarter figures, due before 30 November, showing margin balances above 6 percent of total platform assets. If the ratio falls, the leverage build-up has stopped and this line needs no further watching.", "refs": ["robinhood"]}]}, {"h": {"tr": "Ayakta kalması gerekenler", "en": "What has to hold"}, "ps": [{"tr": "Gelir bileşimi ile kaldıraç aynı koşula bağlı ve bu, bu çeyreğin en dikkat çekici yeri. Hisse senedi geliri yüzde 95, olay sözleşmeleri on kattan fazla artarken kripto geliri yüzde 38 azaldı: rekor çeyreği üreten şey işlem hacmi ve oynaklık. Marj kredisinin en kırılgan olduğu koşul da tam olarak aynı oynaklıktır. Yani bu bilançoda hem gelirin kaynağı hem riskin tetikleyicisi tek bir değişkene bağlı.", "en": "The revenue mix and the leverage depend on the same condition, and that is the most striking part of this quarter. Equities revenue rose 95 percent and event contracts more than tenfold while crypto revenue fell 38 percent: what produced a quarter of record revenue is trading volume and volatility. The condition in which margin credit is most fragile is that same volatility. On this balance sheet, the source of the revenue and the trigger of the risk hang on one variable.", "refs": ["robinhood"]}, {"tr": "Bu yüzden soru 'çöker mi' değil, 'neyin doğru kalması gerekiyor' sorusudur. Üç şey: teminat yeterince çeşitli olmalı ki zorunlu satışlar teminatın kendi fiyatını aşağı çekmesin; tasfiye yeterince hızlı işlemeli ki açık müşteri bakiyesinde kalmasın; ve aracı kurumun kendi fonlaması bu bakiyeyi taşıyacak vadede olmalı. Açıklama bunların ilkine dair bir dağılım vermiyor. Rekor çeyrek, bu üç koşulun sınanmadığı bir çeyrek olduğu için rekordur.", "en": "So the question is what has to remain true, rather than whether it collapses. Three things: the collateral must be diverse enough that forced sales do not drag down the price of the collateral itself; liquidation must work fast enough that the shortfall does not stay in the customer's balance; and the broker's own funding must be termed long enough to carry that balance. The release gives no distribution for the first of these. It is a record quarter precisely because those three conditions were not tested in it.", "refs": ["robinhood"]}]}], "sources": [{"key": "robinhood", "kind": "news", "name": "Robinhood Markets, Inc.", "url": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000113/q22026robinhoodexhibit991.htm", "title": {"tr": "Robinhood'da müşterilere kullandırılan marj kredisi 21,6 milyar dolar düzeyine yükseldi", "en": "The margin credit Robinhood lends its customers climbed to 21.6 billion dollars"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "eco-01", "title": {"tr": "Bellek sözleşmeleri zamlanırken çip endeksi dördüncü seansını kaybetti", "en": "Memory contracts repriced higher while the chip index lost a fourth session"}, "excerpt": {"tr": "Fiyat dört seanstır aşağı, tedarik tarafındaki iki seri ise yukarı. Bu açığı pozisyonun mu yoksa gözden geçirilmiş bir talep beklentisinin mi açtığını ayırt edecek gözlem sözleşme masasında.", "en": "Prices have fallen for four sessions while two supply-side series moved the other way. The observation that separates positioning from a revised demand view sits at the contract table."}, "sections": [{"h": {"tr": "Dört seansta ne oldu", "en": "What four sessions did"}, "ps": [{"tr": "Amerikan yarı iletken endeksi SOX salı günü yüzde 6'ya varan düşüşle üst üste dördüncü seansını kaybetti ve Nasdaq-100 rekor seviyesinin yüzde 9,7 altına indi; bu, düzeltme sayılan eşiğin hemen altı. Güney Kore'de Kospi endeksi yüzde 11'e yakın kayıpla kapandı ve 2026 yılının sekizinci devre kesicisini tetikledi. Bunlar gözlenen fiyat hareketleridir; hangi bilginin fiyatlandığını tek başına söylemezler.", "en": "The American semiconductor index SOX fell as much as 6 percent on Tuesday, a fourth straight losing session, and the Nasdaq-100 ended 9.7 percent below its record, just short of the threshold that counts as a correction. South Korea's Kospi closed down nearly 11 percent and triggered its eighth circuit breaker of 2026. These are observed price moves, and on their own they do not say which piece of information is being priced.", "refs": ["fortune-selloff"]}, {"tr": "Aynı hafta yayımlanan iki tedarik verisi ters yöne bakıyor. Üçüncü çeyrek DRAM sözleşmeleri bu ay yüzde 20 ile yüzde 30 arasında daha yüksek fiyatlardan bağlanıyor. Alphabet bu yılın yatırım harcaması öngörüsünü 205 milyar dolar düzeyine yükseltti; 2025 yılında bu kalem 91 milyar dolar idi. Moody's, en büyük altı bulut altyapı şirketinin bu yıl yaklaşık 785 milyar dolar harcamasını bekliyor.", "en": "Two supply-side series published in the same week look the other way. Third-quarter DRAM contracts are settling 20 percent to 30 percent higher this month. Alphabet raised its capital-expenditure guidance for this year to 205 billion dollars, from 91 billion dollars in 2025. Moody's expects the six largest cloud-infrastructure companies to spend roughly 785 billion dollars this year.", "refs": ["fortune-selloff"]}]}, {"h": {"tr": "Faaliyet rakamı ne söylüyor", "en": "What the operating number says"}, "ps": [{"tr": "Ertesi gün gelen tek büyük faaliyet verisi de aynı yöne işaret etti. SK hynix ikinci çeyrekte 79.318,7 milyar won gelir ve 60.542,6 milyar won faaliyet kârı bildirdi; faaliyet marjı yüzde 76 oldu ve bir önceki çeyreğe göre gelir yüzde 51, faaliyet kârı yüzde 61 arttı. Şirket ayrıca HBM4 ürününde seri sevkiyatın başladığını ve yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını bildirdi.", "en": "The one large operating release that followed pointed the same way. SK hynix reported second-quarter revenue of 79,318.7 billion won and operating profit of 60,542.6 billion won, an operating margin of 76 percent, with revenue up 51 percent and operating profit up 61 percent on the prior quarter. The company also said mass shipments of HBM4 had begun and that it had signed long-term agreements with around 10 customers.", "refs": ["skhynix-q2"]}, {"tr": "Sözleşme fiyatı, yatırım harcaması öngörüsü ve çeyreklik faaliyet marjı; üçü de yakın vadeli nakit girdilerinin bozulduğunu göstermiyor. Bu durumda dört seanslık kaybı, talep beklentisindeki bir revizyondan çok aynı yöne yığılmış pozisyonların çözülmesiyle açıklamak daha tutarlı görünüyor. Aynı verilerle uyumlu ikinci bir okuma da var: piyasa 2027 yılında bir sindirme dönemini şimdiden iskonto ediyor olabilir ve böyle bir beklenti cari sözleşmelerde henüz görünmez.", "en": "Contract pricing, capital-expenditure guidance and the quarterly operating margin all fail to show near-term cash inputs deteriorating. On that reading, four sessions of losses fit an unwind of crowded positioning better than a revision to expected demand. A second reading is equally consistent with the same data: the market may already be discounting a digestion phase in 2027, and such an expectation would not yet appear in current contracts.", "refs": ["fortune-selloff", "skhynix-q2"]}]}, {"h": {"tr": "İki okumayı ayıracak gözlem", "en": "The observation that separates them"}, "ps": [{"tr": "D.A. Davidson teknoloji analisti Gil Luria, yapay zekâ yatırımı etrafında yoğun bir panik bulunduğunu ve bu paniğin ayrım gözetmez göründüğünü söyledi. Bu bir yorumdur ve yönü sınanabilir bir iddia taşır: ayrım gözetmeyen bir satış, girdi ekonomisi iyileşen isimleri de kötüleşenlerle birlikte aşağı taşır.", "en": "Gil Luria, a technology analyst at D.A. Davidson, said there was a great deal of panic around the artificial-intelligence investment and that the panic appeared indiscriminate. That is interpretation, and it carries a testable direction: an indiscriminate selloff carries names whose input economics are improving down alongside those whose are not.", "refs": ["fortune-selloff"]}, {"tr": "Ayırt edici gözlem sözleşme masasındadır. Dördüncü çeyrek DRAM sözleşmeleri yatay ya da daha düşük fiyatlardan bağlanır ve bulut altyapı şirketleri bir sonraki bilanço turunda yatırım harcaması öngörüsünü aşağı çekerse, düşüş gözden geçirilmiş bir temel görünümü fiyatlıyor demektir. Bu iki koşul kasım sonuna kadar gerçekleşmez ve harcama planı korunursa, dört seanslık kayıp bir konumlanma hareketi olarak kalır.", "en": "The distinguishing observation sits at the contract table. If fourth-quarter DRAM contracts settle flat or lower and the cloud-infrastructure companies trim capital-expenditure guidance at the next reporting round, the decline is pricing a revised set of fundamentals. If neither condition arrives by the end of November and the spending plans hold, four sessions of losses remain a positioning move.", "refs": ["fortune-selloff"]}]}], "sources": [{"key": "fortune-selloff", "kind": "news", "name": "Fortune", "url": "https://fortune.com/2026/07/28/why-are-stocks-down-chips-panic-semiconductors/", "title": {"tr": "Çip endeksi dördüncü seansını da kaybetti, Nasdaq-100 zirvesinin yüzde 9,7 altına indi", "en": "The chip index lost a fourth straight session as the Nasdaq-100 fell 9.7 percent below its record"}, "publishedDate": "2026-07-28"}, {"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-02", "title": {"tr": "Manşet 3,8'e inerken elektrik yüzde 22,4 arttı", "en": "The headline fell to 3.8 while electricity rose 22.4 percent"}, "excerpt": {"tr": "Avustralya'nın haziran verisinde manşet gerilerken budanmış ortalama kıpırdamadı. Bileşim, fiyat artışının hangi bilançoda oturduğunu manşetten daha iyi anlatıyor.", "en": "In Australia's June reading the headline eased while the trimmed mean did not move. The composition says more than the headline about which balance sheet the price increase is sitting on."}, "sections": [{"h": {"tr": "İki seri, iki ayrı hikâye", "en": "Two series, two different stories"}, "ps": [{"tr": "Avustralya İstatistik Bürosu'nun aylık göstergesine göre haziranda tüm gruplar tüketici fiyat artışı yıllık yüzde 3,8 düzeyine indi; mayısta yüzde 4,0 ölçülmüştü. Aylık değişim hem ham hem mevsimsellikten arındırılmış seride yüzde 0,1 azalış oldu. Budanmış ortalama ise yüzde 3,6 düzeyinde kaldı ve hiç kıpırdamadı.", "en": "On the Australian Bureau of Statistics monthly indicator, all-groups consumer price growth eased to 3.8 percent over the year to June, from 4.0 percent in May. The monthly movement was a fall of 0.1 percent in both original and seasonally adjusted terms. The trimmed mean stayed at 3.6 percent and did not move at all.", "refs": ["abs-cpi"]}, {"tr": "Bu iki serinin ayrışması tesadüf değildir. Budanmış ortalama, dağılımın iki ucundaki en oynak kalemleri kesip atarak hesaplanır. Manşeti aşağı çeken kalemler tam da budanan uçlarda yer alıyorsa, manşetteki düşüş sürecin kendisi hakkında budanmış ortalamanın söylediğinden fazlasını söylemez. Haziran verisinde durum budur.", "en": "The divergence between these two series is not accidental. The trimmed mean is calculated by cutting away the most volatile items at either tail of the distribution. If the items dragging the headline down sit precisely in those trimmed tails, the fall in the headline says no more about the underlying process than the trimmed mean does. That is the situation in the June data.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Faturayı kim taşıyor", "en": "Who is carrying the bill"}, "ps": [{"tr": "Yıllık artışa en büyük katkı yüzde 6,8 ile konut grubundan geldi ve bu oran mayıstaki yüzde 6,5 düzeyinin üzerinde. Grubun içinde konut elektriği yıllık yüzde 22,4 arttı; yeni konutlar yüzde 5,8, kiralar yüzde 3,6 yükseldi. Gıda ve alkolsüz içecekler yüzde 3,3 düzeyinde kaldı. Hizmet fiyatları yüzde 4,0, mal fiyatları yüzde 3,5 arttı.", "en": "Housing was the largest contributor to the annual figure at 6.8 percent, above May's 6.5 percent. Within the group, residential electricity rose 22.4 percent over the year, new dwellings 5.8 percent and rents 3.6 percent. Food and non-alcoholic beverages held at 3.3 percent. Services prices rose 4.0 percent and goods prices 3.5 percent.", "refs": ["abs-cpi"]}, {"tr": "Elektrik, kira ve konut inşa maliyeti hane bütçesinde ikame edilmesi en zor kalemlerdir. Bu üçünün hızlandığı bir bileşimde artış, harcamayı erteleyerek değil, başka kalemleri kısarak ya da borçlanarak karşılanır. Politika faizinin çalıştığı kanal ise talebi erteletmek üzerine kuruludur. Yani bu bileşimdeki bir fiyat artışı, faizin en zayıf tuttuğu yerden geçer.", "en": "Electricity, rent and the cost of building a dwelling are the hardest items in a household budget to substitute away from. In a composition where all three are accelerating, the increase is absorbed by cutting other spending or by borrowing, not by deferring the purchase. The channel a policy rate works through is built on deferral. A price increase with this composition therefore passes through the point where the rate has least grip.", "refs": ["abs-cpi"]}]}, {"h": {"tr": "Rakip açıklama ve sınanabilir eşik", "en": "The rival explanation and a testable threshold"}, "ps": [{"tr": "Bu okumanın rakibi var ve zayıf da değil. Hizmetlerdeki yüzde 4,0 artış, mal fiyatlarındaki yüzde 3,5 artışın üstünde. Hizmet fiyatları ücret maliyetine mal fiyatlarından daha duyarlıdır ve bu fark, maliyet şokunun ücret üzerinden bir sürece dönüşmeye başladığı okumasıyla da uyumludur. Tek bir aylık yayın, idari fiyat kanalı ile ücret kanalını birbirinden ayıramaz; bunun için ücret ve birim işgücü maliyeti serilerine bakmak gerekir.", "en": "This reading has a rival, and not a weak one. Services at 4.0 percent sit above goods at 3.5 percent. Services prices are more sensitive to wage costs than goods prices are, and that gap is also consistent with a cost shock beginning to turn into a wage process. A single monthly release cannot separate the administered-price channel from the wage channel; that requires the wage and unit labour cost series.", "refs": ["abs-cpi"]}, {"tr": "Eşik şöyle konabilir. Eylül ayı yayınına kadar budanmış ortalama yüzde 3,5 ve üzerinde kalır ve konut grubu yüzde 6 düzeyinin üzerinde seyrederse, manşetteki gerileme bileşim etkisidir ve altta yatan süreçte bir değişikliği göstermez. Budanmış ortalama aynı dönemde yüzde 3,5 altına inerse, bu okuma zayıflar ve düşüşün budanan uçlarla sınırlı kalmadığı kabul edilmelidir.", "en": "The threshold can be set as follows. If the trimmed mean stays at or above 3.5 percent through the September release while the housing group runs above 6 percent, the fall in the headline is a composition effect and shows no change in the underlying process. If the trimmed mean instead drops below 3.5 percent over the same period, this reading weakens and the decline must be accepted as extending beyond the trimmed tails.", "refs": ["abs-cpi"]}]}], "sources": [{"key": "abs-cpi", "kind": "news", "name": "Australian Bureau of Statistics", "url": "https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release", "title": {"tr": "Avustralya'da yıllık enflasyon haziranda yüzde 3,8'e indi, budanmış ortalama yerinde kaldı", "en": "Australian annual inflation eased to 3.8 percent in June while the trimmed mean held"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "eco-03", "title": {"tr": "Net kâr, faaliyet kârını 33,4 trilyon won aştığında", "en": "When net profit runs 33.4 trillion won above operating profit"}, "excerpt": {"tr": "SK hynix'in net marjı yüzde 118 olarak raporlandı. Bu oran bellek işinin kazanma gücünü ölçmüyor; iki satır arasındaki farkı açıklayan kalem yayında adlandırılmıyor.", "en": "SK hynix reported a net margin of 118 percent. That ratio does not measure the memory business's earning power, and the release does not name the line explaining the gap between the two."}, "sections": [{"h": {"tr": "İki satır, iki farklı büyüklük", "en": "Two lines, two different magnitudes"}, "ps": [{"tr": "SK hynix ikinci çeyrekte 79.318,7 milyar won gelir, 60.542,6 milyar won faaliyet kârı ve 93.922,6 milyar won net kâr bildirdi. Faaliyet marjı yüzde 76, net marj yüzde 118 olarak raporlandı. Bir şirketin net kârı gelirini aştığında, aradaki fark tanım gereği faaliyet dışı bir kalemden gelir; burada söz konusu fark yaklaşık 33,4 trilyon won.", "en": "SK hynix reported second-quarter revenue of 79,318.7 billion won, operating profit of 60,542.6 billion won and net income of 93,922.6 billion won. The operating margin was reported at 76 percent and the net margin at 118 percent. When a company's net income exceeds its revenue, the difference comes by definition from a non-operating line; here that difference is about 33.4 trillion won.", "refs": ["skhynix-q2"]}, {"tr": "Yayın bu kalemi adlandırmıyor. Ne olabileceğine dair birkaç aday var: elde tutulan paylardaki değerleme kazançları, özkaynak yöntemiyle konsolide edilen iştirak gelirleri, kur farkı ya da ertelenmiş vergi varlığının kayda alınması. Hangisi olduğu bilinmeden yüzde 118 net marjı bir dönemden diğerine taşımak mümkün değildir.", "en": "The release does not name that line. There are several candidates: valuation gains on holdings, income from equity-accounted affiliates, foreign-exchange effects or the recognition of a deferred tax asset. Without knowing which, a 118 percent net margin cannot be carried from one period into the next.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "İncelenebilir olan satır", "en": "The line that can be inspected"}, "ps": [{"tr": "Faaliyet satırı ise açıklanmış ve karşılaştırılabilir. Gelir bir yıl önceki 22.232 milyar won düzeyine göre yüzde 257, faaliyet kârı 9.212,9 milyar won düzeyine göre yüzde 557 arttı. Çeyreklik karşılaştırmada gelir 52.576,3 milyar won düzeyinden yüzde 51, faaliyet kârı 37.610,3 milyar won düzeyinden yüzde 61 yükseldi. Faaliyet kârının gelirden hızlı artması, artışın hacimden çok fiyat ve ürün karmasından geldiğine işaret eder.", "en": "The operating line, by contrast, is disclosed and comparable. Revenue rose 257 percent from 22,232 billion won a year earlier and operating profit 557 percent from 9,212.9 billion won. Sequentially, revenue rose 51 percent from 52,576.3 billion won and operating profit 61 percent from 37,610.3 billion won. Operating profit growing faster than revenue indicates that the gain came from price and product mix rather than from volume.", "refs": ["skhynix-q2"]}, {"tr": "Nakit tarafında da yayının verdiği kadarını söylemek gerekir. Nakit ve nakit benzerleri çeyrek boyunca 33,6 trilyon won artarak 88 trilyon won düzeyine, net nakit pozisyonu 69,4 trilyon won düzeyine çıktı; toplam borç 0,7 trilyon won azalarak 18,6 trilyon won oldu. Faaliyet kârı 60.542,6 milyar won iken nakit bakiyesinin bunun yarısı kadar artması olağandır; aradaki farkın ne kadarının yatırım harcamasına gittiğini söylemek için nakit akış tablosu gerekir ve bu yayında yer almıyor.", "en": "On the cash side, only what the release provides can be said. Cash and equivalents rose 33.6 trillion won over the quarter to 88 trillion won and the net cash position to 69.4 trillion won, while total debt fell 0.7 trillion won to 18.6 trillion won. With operating profit at 60,542.6 billion won, a cash balance rising by about half that amount is unremarkable; saying how much of the difference went into capital expenditure requires the cash flow statement, which this release does not carry.", "refs": ["skhynix-q2"]}]}, {"h": {"tr": "Bir sonraki dosyada aranacak kalem", "en": "The line to look for in the next filing"}, "ps": [{"tr": "Şirket ayrıca yaklaşık 10 müşteriyle uzun vadeli anlaşma imzalandığını, HBM4 ürününde seri sevkiyatın başladığını ve 321 katmanlı NAND ürünlerinin yıl sonuna kadar yurt içi kapasitenin yaklaşık yüzde 50 düzeyine çıkarılmasının hedeflendiğini bildirdi. Bunlar kapasite ve müşteri bağlılığına dair somut ifadelerdir; ancak hiçbiri sözleşme hacmi, birim fiyat ya da ödeme takvimi içermiyor, dolayısıyla gelir modeline girdi olarak konulamaz.", "en": "The company also said it had signed long-term agreements with around 10 customers, that mass shipments of HBM4 had begun, and that it aims to bring 321-layer NAND products to about 50 percent of domestic capacity by year end. These are concrete statements about capacity and customer commitment, yet none of them contains contract volume, unit price or a payment schedule, so none can be entered into a revenue model.", "refs": ["skhynix-q2"]}, {"tr": "Üç gün önce bu köşede, Nvidia ile SK Group arasındaki 500 milyar dolar tutarındaki girişimin bir model girdisi sayılamayacağını, bunun için bağlayıcı bir tedarik sözleşmesinin imzalanması ve kapasite yatırımının finansal tablolarda ayrıştırılması gerektiğini yazmıştım. Bu çeyrek yayını ikisini de getirmiyor; uzun vadeli anlaşmalardan söz ediyor, hacim ve fiyat vermiyor. Aranacak kalem üçüncü çeyrek finansal raporundaki faaliyet dışı gelir satırıdır: 33,4 trilyon won tutarındaki farkın tekrarlamayan bir değerleme kazancında yoğunlaştığı görülürse, yüzde 118 net marj bir sonraki çeyreğe taşınmaz.", "en": "Three days ago in this column I wrote that the 500 billion dollar initiative between Nvidia and SK Group could not count as a model input until a binding supply contract was signed and the capacity investment was broken out in the financial statements. This quarterly release delivers neither: it speaks of long-term agreements while giving no volume and no price. The line to look for is non-operating income in the third-quarter financial report. If the difference of about 33.4 trillion won turns out to be concentrated in a non-recurring valuation gain, the 118 percent net margin will not carry into the next quarter.", "refs": ["skhynix-q2", "history-loi"]}]}], "sources": [{"key": "skhynix-q2", "kind": "news", "name": "SK hynix Newsroom", "url": "https://news.skhynix.com/en/q2-2026-business-results/", "title": {"tr": "SK hynix ikinci çeyrekte 60.542,6 milyar won faaliyet kârı açıkladı", "en": "SK hynix reports 60,542.6 billion won of second-quarter operating profit"}, "publishedDate": "2026-07-29"}, {"key": "history-loi", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-03/2026-07-26/", "title": {"tr": "500 milyar dolar tutarında bir niyet mektubu neyi bağlıyor?", "en": "What a $500 billion letter of intent actually binds"}, "publishedDate": "2026-07-26"}], "date": "2026-07-29"}, {"writer": "eco-04", "title": {"tr": "Bir alüminyum darboğazı Ford Pro segmentinden 0,6 milyar dolar götürdü", "en": "An aluminium bottleneck took 0.6 billion dollars out of the Ford Pro segment"}, "excerpt": {"tr": "Ford yıl sonu öngörüsünü yükseltti ve iyileşmenin yaklaşık 1 milyar dolar kadarını bir metalin geri gelmesine bağladı. Bu bir tedarik hikâyesidir ve talep tarafında başlamıyor.", "en": "Ford raised its full-year guidance and attributed about 1 billion dollars of the improvement to a metal coming back. This is a supply story, and it does not begin on the demand side."}, "sections": [{"h": {"tr": "Metal, segmentin rakamını yazdı", "en": "The metal wrote the segment's number"}, "ps": [{"tr": "Ford şirketinin ikinci çeyrek yayınında Ford Pro segmenti 17,8 milyar dolar gelir üzerinden 1,7 milyar dolar EBIT ve yüzde 9,7 marj bildirdi. EBIT bir yıl öncesine göre 0,6 milyar dolar geriledi ve şirket bunun nedenini doğrudan yazıyor: geçici Novelis kaynaklı alüminyum tedarik kısıtından toparlanma sürüyor. Aynı yayın, alüminyum tedarik kısıtının çeyrekteki toptan satış hacimlerini etkilediğini de belirtiyor.", "en": "In the second-quarter release from Ford, the Ford Pro segment reported 1.7 billion dollars of EBIT on 17.8 billion dollars of revenue, a 9.7 percent margin. EBIT fell 0.6 billion dollars from a year earlier, and the company writes the cause directly: it continues to recover from temporary Novelis-related aluminium supply constraints. The same release states that aluminium supply constraints affected wholesale volumes in the quarter.", "refs": ["ford-q2"]}, {"tr": "Bir metalin bir kamyon gövdesine dönmesi ile o kamyonun bayiye faturalanması arasındaki zincir kısadır ve ikame edilmesi zordur. Alüminyum levha, gövde presine belirli bir alaşım ve kalınlıkta girer; başka bir tedarikçiden aynı özellikte levha almak sertifikasyon ve kalıp uyumu gerektirir. Bu yüzden tek bir tedarikçideki kesinti hacme birebir geçer ve hacim düştüğünde sabit maliyetler aynı kalır. Segmentin marjı buradan eksilir.", "en": "The chain from a metal becoming a truck body to that truck being invoiced to a dealer is short and hard to substitute. Aluminium sheet enters the body press at a specified alloy and gauge; sourcing sheet of the same specification from another supplier requires certification and tooling compatibility. An interruption at a single supplier therefore passes straight into volume, and when volume falls, fixed costs do not. The segment's margin is reduced from there.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yükseltilen öngörünün içindeki kalem", "en": "The item inside the raised guidance"}, "ps": [{"tr": "Ford yıl sonu düzeltilmiş EBIT öngörüsünü 8,5-10,5 milyar dolar aralığından 10-11 milyar dolar aralığına, düzeltilmiş serbest nakit akışı öngörüsünü 5-6 milyar dolar aralığından 6-7 milyar dolar aralığına çıkardı. Yayın, Novelis kaynaklı yıllık etkiyi yaklaşık 1 milyar dolar olarak veriyor ve bunun yılın ikinci yarısına ağırlıklı, net bir EBIT lehine katkı olduğunu belirtiyor. Yükseltmenin alt sınırındaki iyileşmenin büyük bölümü, tanımı gereği bu kalemle aynı büyüklüktedir.", "en": "Ford raised full-year adjusted EBIT guidance from a range of 8.5 to 10.5 billion dollars to a range of 10 to 11 billion dollars, and adjusted free cash flow guidance from a range of 5 to 6 billion dollars to a range of 6 to 7 billion dollars. The release puts the Novelis-related year-over-year impact at about 1 billion dollars and describes it as a net EBIT tailwind heavily weighted to the second half of the year. Most of the improvement at the lower bound of the raise is, by construction, the same size as that item.", "refs": ["ford-q2"]}, {"tr": "Karşı okuma da yayının içinde duruyor ve göz ardı edilmemeli. Ford Blue 26,1 milyar dolar gelir üzerinden 1,1 milyar dolar EBIT bildirdi ve bu kalem 0,5 milyar dolar arttı; şirket bunu kamyonlar, arazi araçları ve hibrit modellerdeki fiyatlama gücüne bağlıyor. Yani çeyreğin toplam 2,5 milyar dolar düzeyindeki düzeltilmiş EBIT rakamında metalden bağımsız bir iyileşme de var. Yayın yaklaşık 1 milyar dolar tutarındaki etkiyi Novelis kaynağına atfediyor, geri kalanını kalem kalem ayrıştırmıyor.", "en": "The counter-reading is also inside the release and should not be set aside. Ford Blue reported 1.1 billion dollars of EBIT on 26.1 billion dollars of revenue, up 0.5 billion dollars, which the company attributes to pricing power in trucks, off-roaders and hybrid models. So within the quarter's total adjusted EBIT of 2.5 billion dollars there is an improvement independent of the metal. The release attributes an impact of about 1 billion dollars to the Novelis constraint and does not decompose the remainder line by line.", "refs": ["ford-q2"]}]}, {"h": {"tr": "Yayının vermediği ve ölçülebilecek olan", "en": "What the release withholds and what can be measured"}, "ps": [{"tr": "Fiziksel zincirin ölçüsü eksiktir. Yayın tedarikçinin adını ve kısıtın niteliğini veriyor; hangi tesis, hangi alaşım, kaç ton ve kaç haftalık kesinti olduğunu vermiyor. Bu ayrıntılar olmadan kısıtın büyüklüğü ile 0,6 milyar dolar tutarındaki EBIT kaybı arasındaki oran bağımsız olarak doğrulanamaz; elde yalnızca şirketin kendi atfı kalır.", "en": "The measure of the physical chain is missing. The release gives the supplier's name and the nature of the constraint; it does not give the plant, the alloy, the tonnage or the number of weeks lost. Without those details the ratio between the size of the constraint and the EBIT shortfall of 0.6 billion dollars cannot be independently verified, and only the company's own attribution remains.", "refs": ["ford-q2"]}, {"tr": "Ölçülebilecek olan ise segment marjıdır. Şirket katkının ikinci yarıya ağırlıklı olduğunu söylediğine göre, kısıt bağlayıcı neden ise Ford Pro segmentinin EBIT marjı üçüncü ve dördüncü çeyrekte yüzde 9,7 düzeyinin belirgin şekilde üzerine çıkmalıdır. Segmentin yıl sonu EBIT öngörüsü 6,5-7,5 milyar dolar aralığından 7,0-7,5 milyar dolar aralığına çekildi; bu aralığın tutturulması ve marjın toparlanmaması aynı anda gerçekleşirse, açıklamayı metalin dışında aramak gerekir.", "en": "What can be measured is the segment margin. Since the company says the contribution is weighted to the second half, if the constraint is the binding cause then the Ford Pro segment's EBIT margin should rise appreciably above 9.7 percent in the third and fourth quarters. The segment's full-year EBIT guidance was narrowed from a range of 6.5 to 7.5 billion dollars to a range of 7.0 to 7.5 billion dollars. If that range is met while the margin does not recover, the explanation must be sought outside the metal.", "refs": ["ford-q2"]}]}], "sources": [{"key": "ford-q2", "kind": "news", "name": "Ford Motor Company", "url": "https://www.sec.gov/Archives/edgar/data/37996/000003799626000155/exhibit99tojuly282026for.htm", "title": {"tr": "Ford ikinci çeyrekte zarar açıkladı, yıl sonu faaliyet kârı öngörüsünü yukarı çekti", "en": "Ford posts a second-quarter loss and raises its full-year operating profit guidance"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-05", "title": {"tr": "Yüzde 1,1 artış, yüzde 4,2 enflasyonun altında kaldı", "en": "A 1.1 percent gain landed under 4.2 percent inflation"}, "excerpt": {"tr": "ABD konut fiyatları on ikinci ay üst üste reel olarak geriledi. Ulusal ortalama iki uç şehrin arasında bir yerde duruyor ve ikisini de anlatmıyor.", "en": "US home prices fell in real terms for a twelfth consecutive month. The national average sits somewhere between two extreme cities and describes neither of them."}, "sections": [{"h": {"tr": "Nominal artış, reel kayıp", "en": "A nominal gain, a real loss"}, "ps": [{"tr": "S\u0026P Cotality Case-Shiller ulusal konut fiyat endeksi mayısta yıllık yüzde 1,1 arttı; nisandaki artış yüzde 0,9 idi. On şehirlik bileşik yüzde 2,4, yirmi şehirlik bileşik yüzde 1,6 yükseldi. Yayının kendisi bunun ne anlama geldiğini söylüyor: mayıs enflasyonu yüzde 4,2 olduğu için konut değerleri üst üste on ikinci ay reel olarak geriledi.", "en": "The S\u0026P Cotality Case-Shiller national home price index rose 1.1 percent over the year in May, against 0.9 percent in April. The ten-city composite rose 2.4 percent and the twenty-city composite 1.6 percent. The release itself says what that means: with May inflation at 4.2 percent, home values fell in real terms for a twelfth consecutive month.", "refs": ["case-shiller"]}, {"tr": "Bir ev, sahibi için satılana kadar nakde dönmeyen bir varlıktır; ama borç ona göre alınır ve harcama kararları ona bakılarak verilir. Bir yıl boyunca nominal olarak yüzde 1,1 değerlenip yüzde 4,2 enflasyonla karşılaşan bir hane, kâğıt üzerinde kazanç görür ve alım gücü olarak kaybeder. Bu kaybın manşette görünmemesinin nedeni, endeksin nominal yayımlanmasıdır.", "en": "A house is an asset that does not turn into cash for its owner until it is sold, yet debt is taken against it and spending decisions are made by looking at it. A household whose home appreciates 1.1 percent in nominal terms over a year while inflation runs at 4.2 percent sees a gain on paper and a loss in purchasing power. The reason that loss does not appear in the headline is that the index is published in nominal terms.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Ortalamanın altındaki dağılım", "en": "The distribution under the average"}, "ps": [{"tr": "Yayındaki şehir verileri, ulusal rakamın kimseyi tarif etmediğini gösteriyor. Chicago yıllık yüzde 6,9 ile en güçlü, Las Vegas eksi yüzde 1,9 ile en zayıf pazar. Aradaki fark 8,8 puan. Chicago şehrinde ev sahibi olan bir hane hem nominal hem reel kazandı; Las Vegas şehrinde olan hem nominal hem reel kaybetti. Ulusal yüzde 1,1 ikisinin arasında durur ve ikisini de anlatmaz.", "en": "The city figures in the release show that the national number describes nobody. Chicago is the strongest market at 6.9 percent year on year and Las Vegas the weakest at minus 1.9 percent, a gap of 8.8 percentage points. A household that owns in Chicago gained both nominally and in real terms, while one that owns in Las Vegas lost on both counts. The national 1.1 percent sits between them and describes neither.", "refs": ["case-shiller"]}, {"tr": "Bu dağılımın hanelere göre değil, konuma göre işlemesi önemlidir. Aynı gelir, aynı meslek, aynı borç yükü; farklı şehir. Bu farkın kaynağı hane davranışı değil, yerel arz ve yerel talep koşullarıdır. Aynı verilerle uyumlu ikinci bir açıklama da mümkündür: şehirler arası fark, hane koşullarından çok yeni konut arzındaki farklardan doğuyor olabilir ve endeks tek başına bu ikisini ayıramaz.", "en": "What matters is that this distribution runs by location rather than by household. Same income, same occupation, same debt burden, different city. The source of the difference is local supply and local demand conditions rather than household behaviour. A second explanation fits the same data: the gap between cities may arise from differences in new housing supply rather than in household circumstances, and the index alone cannot separate the two.", "refs": ["case-shiller"]}]}, {"h": {"tr": "Satın almak isteyen taraf", "en": "The side that wants to buy"}, "ps": [{"tr": "Satmak istemeyen ev sahibi için bu kayıp kâğıt üstünde kalır. Satın almak isteyen için tablo başkadır: yayın konut kredisi faizlerinin yüzde 6,5 düzeyinde kalmasının satın alınabilirlik üzerinde baskı yarattığını belirtiyor. Fiyatın reel olarak gerilemesi aylık taksiti düşürmez; faiz aynı kalırken nominal fiyat neredeyse yatay seyrettiğinde giriş maliyeti de yatay kalır.", "en": "For an owner who does not want to sell, this loss stays on paper. For someone who wants to buy, the picture is different: the release says mortgage rates at 6.5 percent continue to weigh on affordability. A price falling in real terms does not lower the monthly payment; when the rate holds and the nominal price is close to flat, the cost of entry stays flat too.", "refs": ["case-shiller"]}, {"tr": "Aynı gün açıklanan tüketici güveni verisi, aynı hanelerin mevcut durumu nasıl değerlendirdiğini gösteriyor. The Conference Board kurumunun Mevcut Durum Endeksi 3,6 puan düşüşle 114,9 düzeyine indi ve üst üste üçüncü kez geriledi; genel endeks 90,8 oldu. İş bulma koşullarına ilişkin fark 0,7 puan azalarak yüzde 3,1 düzeyine indi. İzlenecek eşik açıktır: yıllık enflasyon ağustos ve eylül yayınlarında da ulusal endeksin yıllık artışının üzerinde kalırsa, reel gerileme on dördüncü aya uzar.", "en": "The consumer confidence data released the same day show how the same households assess their current position. The Present Situation Index from The Conference Board fell 3.6 points to 114.9, its third consecutive decline, and the headline index stood at 90.8. The labour differential narrowed 0.7 percentage points to 3.1 percent. The threshold to watch is clear: if annual inflation stays above the national index's annual gain through the August and September releases, the real decline will extend to a fourteenth month.", "refs": ["case-shiller", "conf-board"]}]}], "sources": [{"key": "case-shiller", "kind": "news", "name": "S\u0026P Dow Jones Indices", "url": "https://press.spglobal.com/2026-07-28-S-P-Cotality-Case-Shiller-Index-Reports-Annual-Gain-in-May-2026", "title": {"tr": "ABD konut fiyatları mayısta yıllık yüzde 1,1 arttı, reel bazda on ikinci ayında geriledi", "en": "US home prices rose 1.1 percent over the year to May and fell in real terms for a twelfth month"}, "publishedDate": "2026-07-28"}, {"key": "conf-board", "kind": "news", "name": "The Conference Board", "url": "https://www.conference-board.org/topics/consumer-confidence/press/CCI-July-2026", "title": {"tr": "ABD'de tüketici güveni temmuzda 90,8'e geriledi, mevcut durum üçüncü ayında düştü", "en": "US consumer confidence slipped to 90.8 in July as the present situation reading fell for a third month"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "eco-06", "title": {"tr": "Tek bir satış gününde dört ayrı yön", "en": "Four different directions inside one selloff"}, "excerpt": {"tr": "Bitcoin geriledi, ether ve XRP yükseldi, endeks arttı. Ortak bir zorunlu satış kanalı bu tabloyu üretmez; günün belgelenebilir yapısal gelişmesi ise yasama tarafında yaşandı.", "en": "Bitcoin fell, ether and XRP rose, the index gained. A common forced-selling channel does not produce that picture, and the day's documentable structural development came from the legislative side."}, "sections": [{"h": {"tr": "Aynı gün, dört ayrı yön", "en": "One day, four directions"}, "ps": [{"tr": "Salı günü bitcoin yakla ity market.", "refs": ["coindesk-btc"]}, {"tr": "Sonuç iki tarafı da tam doğrulamıyor. Bitcoin, iddianın öngördüğü ayrışmayı göstermedi ve hisse tarafıyla aynı yöne gitti. Buna karşılık ether, XRP ve endeks yükseldi. Ortak bir teminat çağrısı ya da zorunlu satış kanalı devrede olsaydı, dört büyük varlığın aynı gün ters yönlere ayrılması beklenmezdi; likidasyon, teminata konu olabilen her şeyi birlikte aşağı çeker. Daha derin bir türev tabanına sahip olan bitcoinin önce fiyatlanması ve diğerlerinin bir seans gecikmesi de aynı verilerle uyumludur; bu durumda ayrışma yapısal olmaktan çok zamanlamaya ait olur.", "en": "The outcome fully vindicates neither side. Bitcoin did not show the decoupling the claim predicts and moved with the equity side. Against that, ether, XRP and the index rose. Had a common margin call or forced-selling channel been running, four large assets would not be expected to split in opposite directions on the same day, because a liquidation drags everything usable as collateral down together. Bitcoin's deeper derivatives base could also mean it repriced first while the others lag by a session, which fits the same data; on that reading the divergence is a matter of timing more than of structure.", "refs": ["coindesk-btc"]}]}, {"h": {"tr": "Fiyat dışındaki kırılganlık", "en": "The fragility outside the price"}, "ps": [{"tr": "Günün belgelenebilir tek yapısal gelişmesi fiyat tarafında yaşanmadı. ABD Senatosu, Rusya yaptırımları tasarısına öncelik vermek için kripto piyasa yapısını düzenleyen CLARITY tasarısını rafa kaldırdı ve oylamanın gelecek haftadan önce yapılması beklenmiyor. Piyasa yapısı yasası, hangi varlığın hangi düzenleyicinin yetkisinde olduğunu ve saklama ile ayrıştırma yükümlülüklerinin ne olduğunu belirler.", "en": "The one documentable structural development of the day did not happen on the price side. The Senate shelved the CLARITY Act, which covers crypto market structure, to prioritize a Russia sanctions bill, and a vote is not expected before next week. A market structure statute determines which asset falls under which regulator and what the custody and segregation obligations are.", "refs": ["coindesk-btc"]}, {"tr": "Bu belirsizlik bir fiyat hareketi üretmez; şok anında kimin neye başvuracağını belirsiz bırakır. Sınanabilir eşik ise kısa vadelidir: çarşamba günkü faiz kararı bitcoin, ether, XRP ve CoinDesk 20 endeksini aynı yönde yüzde birden fazla hareket ettirirse, işleyen kanal makro ve faiz kanalıdır ve salı günkü ayrışma sektöre özgü bir gürültüdür. Dördü yine ayrışırsa, ortak bir likidite kanalı varsayımı bu hafta için elenir.", "en": "That uncertainty produces no price move; it leaves open who would turn to whom in a shock. The testable threshold is short-dated: if Wednesday's rate decision moves bitcoin, ether, XRP and the CoinDesk 20 index in the same direction by more than one percent, the operative channel is macro and rates, and Tuesday's divergence was sector-specific noise. If the four split again, the assumption of a common liquidity channel is eliminated for this week.", "refs": ["coindesk-btc"]}]}], "sources": [{"key": "coindesk-btc", "kind": "news", "name": "CoinDesk", "url": "https://www.coindesk.com/markets/2026/07/28/bitcoin-slides-2-after-u-s-close-while-korea-s-kospi-plunges-10", "title": {"tr": "Bitcoin ABD kapanışının ardından yüzde 2,7 geriledi, ether ve XRP yükseldi", "en": "Bitcoin fell 2.7 percent after the US close while ether and XRP rose"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}], "dates": ["2026-08-04", "2026-08-03", "2026-08-02", "2026-08-01", "2026-07-31", "2026-07-30", "2026-07-29"], "dateLabels": {"2026-08-04": {"tr": "4 Ağustos 2026", "en": "August 4, 2026"}, "2026-08-03": {"tr": "3 Ağustos 2026", "en": "August 3, 2026"}, "2026-08-02": {"tr": "2 Ağustos 2026", "en": "August 2, 2026"}, "2026-08-01": {"tr": "1 Ağustos 2026", "en": "August 1, 2026"}, "2026-07-31": {"tr": "31 Temmuz 2026", "en": "July 31, 2026"}, "2026-07-30": {"tr": "30 Te /* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

  const image = brief.image && typeof brief.image==='object' ? brief.image : {};
  const variants = Array.isArray(image.variants) ? image.variants
    .map(row => ({src:safeBriefAsset(row?.src), width:Number(row?.width)}))
    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)
    .sort((a,b)=>a.width-b.width) : [];
  const src = safeBriefAsset(image.src);
  const srcset = variants.map(row => `${row.src} ${row.width}w`).join(', ');
  const width = Number.isInteger(image.width) && image.width > 0 ? image.width : 1280;
  const height = Number.isInteger(image.height) && image.height > 0 ? image.height : 720;
  const loading = index===0 ? 'eager' : 'lazy';

    (BRIEF_SLOGAN_OFFSET + index) % u.briefSlogans.length

    : '(min-width:2560px) 30rem,(min-width:1920px) 28rem,(min-width:1440px) 25rem,(min-width:1200px) 23rem,(min-width:641px) 33vw,calc(100vw - 2rem)';
  const mediaOpen = detailHref
    ? `<a class="brief-media-link" href="${escapeHTML(detailHref)}" aria-labelledby="${escapeHTML(headingId)}">`
    : '';
  const mediaClose = detailHref ? '</a>' : '';
  const media = src ? `<figure class="brief-media">

    : escapeHTML(localized(brief.title));
  el.innerHTML = `${media}<div class="brief-content">
    <h3 id="${escapeHTML(headingId)}">${heading}</h3>
    <p class="summary">${escapeHTML(localized(brief.summary))}</p>

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

function dailyPodcastSource(podcasts,topic,date,lang){
  const dateEntry = ((podcasts || {})[topic] || {})[date];

  const file = entry && entry.files && entry.files[lang];
  return file && file.url;
}

   uses edition 1; an unapproved/unsynthesized script never borrows another date.

    if (previousAudio) savePodcastProgress(previousAudio,bar.dataset.src);

  const u = UI[LANG];

          <span aria-hidden="true" data-podcast-play-icon>▶</span>

        <button class="podcast-control-button" type="button" data-podcast-volume

    const audio = bar.querySelector('audio');

  bar.hidden = false;

  return {items:items.slice(start, start + pageSize), page, pages};

function articleHTML(a){
  const proseParts = [];
  const parts = [];
  const u = UI[LANG];
  const seenKeys = new Set();
  const seenUrls = new Set();
  const sources = [];
  (Array.isArray(a.sources) ? a.sources : []).forEach(source=>{
    if(!source || typeof source!=='object' || Array.isArray(source)) return;
    const key = typeof source.key==='string' ? source.key : '';
    // Old archives omitted `kind`; those records were external reporting.
    const kind = source.kind ?? 'news';
    if(kind!=='news' && kind!=='article') return;
    const rawHref = typeof source.url==='string' ? source.url : '';
    let href = safeHref(rawHref);
    const name = typeof source.name==='string' ? source.name.trim() : '';
    const title = localized(source.title);
    const publishedDate = typeof source.publishedDate==='string' ? source.publishedDate : '';
    const citationDate = referenceDate(publishedDate);
    if(publishedDate && !citationDate) return;
    if(kind==='article'){
      if(!citationDate) return;
      try{
        const parsed = new URL(rawHref);
        const canonical = `https://eigenradar.com${parsed.pathname}`;
        if(rawHref!==canonical || parsed.protocol!=='https:'
            || parsed.host!=='eigenradar.com' || parsed.search || parsed.hash
            || !/^\/tr\/(?:ai|geopolitics|economics-markets|science)\/(?:ai|geo|eco|sci)-\d{2}\/\d{4}-\d{2}-\d{2}\/(?:[2-9]\d*\/)?$/.test(parsed.pathname)
            || name!=='Eigen Radar'
            || !parsed.pathname.includes(`/${publishedDate}/`)) return;
        parsed.pathname = parsed.pathname.replace(/^\/tr\//,`/${LANG}/`);
        href = parsed.href;
      }catch{return;}
    }
    if(!/^[a-z][a-z0-9-]{0,63}$/.test(key) || seenKeys.has(key)
        || !href || seenUrls.has(href) || !name || !title) return;
    seenKeys.add(key); seenUrls.add(href);
    sources.push({
      ...source,
      _citationHref:href,
      _citationInternal:kind==='article',
      _citationDate:citationDate
    });
  });
  const sourceNumbers = new Map(sources.map((source,index)=>[source.key,index+1]));
  const sourceOccurrences = new Map();
  let occurrence = 0;
  const sections = Array.isArray(a.sections) ? a.sections : [];
  sections.forEach(s=>{
    if (!s || typeof s !== 'object' || Array.isArray(s)) return;
    const heading = localized(s.h);
    if (heading) proseParts.push(`<h2>${escapeHTML(heading)}</h2>`);
    const paragraphs = Array.isArray(s.ps) ? s.ps : [];
    paragraphs.forEach(p=>{
      occurrence += 1;
      const refs = Array.isArray(p?.refs) ? [...new Set(p.refs)] : [];
      const markers = refs.map(key=>sourceNumbers.get(key)).filter(Boolean).map(number=>{
        const ids = sourceOccurrences.get(number) || [];
        const citationId = `reader-citation-${number}-${ids.length+1}`;
        ids.push(citationId);
        sourceOccurrences.set(number,ids);
        return `<a id="${citationId}" href="${escapeHTML(articleRoute(a,LANG))}#reference-${number}" data-reader-target="reader-reference-${number}" aria-label="${escapeHTML(`${u.reference} ${number}`)}" data-citation-occurrence="${occurrence}">[${number}]</a>`;
      }).join(', ');
      proseParts.push(`<p>${escapeHTML(localized(p))}${markers ? `<sup class="citation">${markers}</sup>` : ''}</p>`);
    });
  });
  if(proseParts.length) parts.push(`<div class="article-prose">${proseParts.join('')}</div>`);
  if(sources.length){
    const hasRetrospective = sources.some(source=>source.retrospective===true);
    const items = sources.map((source,index)=>{
      const marker = source.retrospective===true
        ? `<sup class="retrospective-marker" aria-hidden="true">†</sup><span class="visually-hidden"> — ${escapeHTML(u.retrospectiveLabel)}</span>` : '';
      const attrs = source._citationInternal ? '' : ' class="external" target="_blank" rel="noopener noreferrer external"';
      const number = index+1;
      const ids = sourceOccurrences.get(number) || [];
      const backlinks = ids.map((citationId,occurrence)=>{
        const suffix = ids.length>1 ? String(occurrence+1) : '';
        const label = `${u.returnToCitation} ${number}${ids.length>1 ? ` ${occurrence+1}` : ''}`;
        const permanentCitationId = citationId.replace(/^reader-/,'');
        return `<a href="${escapeHTML(articleRoute(a,LANG))}#${permanentCitationId}" data-reader-target="${citationId}" aria-label="${escapeHTML(label)}">↩${suffix}</a>`;
      }).join('');
      const kindLabel = source._citationInternal ? u.previousArticle : u.newsSource;
      const dateHTML = source._citationDate
        ? `<time datetime="${escapeHTML(source.publishedDate)}">${escapeHTML(source._citationDate)}</time>`
        : `<span class="reference-date-unavailable">${escapeHTML(u.dateUnavailable)}</span>`;
      return `<li id="reader-reference-${number}" tabindex="-1"><span class="reference-kind${source._citationInternal?' internal':''}">${escapeHTML(kindLabel)}</span><a href="${escapeHTML(source._citationHref)}"${attrs}><span class="reference-heading"><strong>${escapeHTML(source.name)}</strong><span aria-hidden="true">·</span>${dateHTML}</span><cite>${escapeHTML(localized(source.title))}${marker}</cite></a>${backlinks?`<span class="reference-backlinks">${backlinks}</span>`:''}</li>`;
    }).join('');
    const note = hasRetrospective ? `<p class="references-note">${escapeHTML(u.retrospectiveNote)}</p>` : '';
    parts.push(`<section class="references" id="reader-references" aria-labelledby="reader-references-title"><h2 id="reader-references-title">${escapeHTML(u.references)}</h2><ol class="reference-list">${items}</ol>${note}</section>`);
  }
  return parts.join('');
}

/* Articles reference a writer by ID; fall back to name for legacy data.
   Never returns undefined: an unknown ref yields a placeholder, so one retired or
   mistyped id cannot throw in renderAll() and blank the date menu + writers section. */
function personaOf(ref){
  return WRITERS.find(w=>w.id===ref) || WRITERS.find(w=>w.name===ref)
      || {id:ref, name:ref, role:{tr:'Konuk yazar', en:'Guest columnist'}};
}

/* An article is identified by writer + date, plus its edition index n when a writer files
   more than once that day — stable enough to share as a #hash. Edition 1 is encoded bare
   (no /n suffix) so every already-published permalink keeps resolving. topic is derivable
   from the article, so it isn't in the key. Mirrors build.py's article_key(). */
let currentArticle = null;
let savedScroll = 0;  // where the reader left the edition before opening a column
/* The article's edition index as build.py's int() would read it: decimal digits only
   (so "0x10"/"1e1" are garbage, not 16/10), truncated toward zero, anything unreadable
   is edition 1. Mirrors build.py's article_key() coercion. */
function editionN(a){
  const raw = typeof a.n === 'string' && !/^\s*[+-]?\d+\s*$/.test(a.n) ? NaN : a.n;
  return Math.trunc(Number(raw) || 1);
}
function articleId(a){
  const n = editionN(a);
  return n > 1 ? `${a.writer}/${a.date}/${n}` : `${a.writer}/${a.date}`;
}
/* One article per writer: their latest same-day edition (highest n). A writer who files
   twice over a day's news pool shows only their newest column in every roster; the earlier
   edition stays reachable by its permalink and from the reader's edition selector. */
function latestPerWriter(list){
  const best = new Map();
  list.forEach(a=>{
    const id = personaOf(a.writer).id;
    const cur = best.get(id);
    if (!cur || editionN(a) > editionN(cur)) best.set(id, a);
  });
  const seen = new Set(), out = [];
  list.forEach(a=>{ const id = personaOf(a.writer).id;
    if (!seen.has(id)){ seen.add(id); out.push(best.get(id)); } });
  return out;
}
function hashId(){
  const raw = location.hash.replace(/^#/, '');
  try { return decodeURIComponent(raw); }
  catch { return raw; }
}

/* Sidebar list of every writer publishing on this article's desk + day. */
function renderReaderNav(a){
  const nav = $('readerNav');
  const siblings = latestPerWriter(
    ARTICLES.filter(x => x.date===a.date && topicOf(x)===topicOf(a)));
  nav.innerHTML = `<div class="nav-head">${UI[LANG].writersBtn}</div>`;
  siblings.forEach(x => {
    const b = document.createElement('button');
    // Name + what they wrote about: a bare roster of names gives the reader no reason
    // to click. textContent, not innerHTML — titles are data.
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = personaOf(x.writer).name;
    const tl = document.createElement('span'); tl.className = 'tl';
    tl.textContent = localized(x.title);
    b.append(nm, tl);
    b.title = localized(x.title);
    if (articleId(x) === articleId(a)) b.setAttribute('aria-current','true');
    else b.addEventListener('click', () => openArticle(x));
    nav.appendChild(b);
  });

  // Keep one option per loaded date and show the current article's date as selected.
  // Repeat editions stay in the article's dedicated edition controls.
  const u = UI[LANG];
  const byDate = new Map();
  ARTICLES
    .filter(x => personaOf(x.writer).id===personaOf(a.writer).id)
    .forEach(x => {
      const current = byDate.get(x.date);
      if (x.date===a.date) byDate.set(x.date, a);
      else if (!current || editionN(x)>editionN(current)) byDate.set(x.date, x);
    });
  const writerDates = [...byDate.values()].sort((x,y) => y.date.localeCompare(x.date));
  if (writerDates.length > 1){
    const field = document.createElement('label');
    field.className = 'reader-history';
    const head = document.createElement('span');
    head.className = 'nav-head';
    head.textContent = u.moreFrom;
    const select = document.createElement('select');
    select.className = 'reader-history-select';
    select.dataset.writerHistorySelect = '1';
    writerDates.forEach(x => {
      const option = document.createElement('option');
      option.value = articleId(x);
      option.textContent = localized(DATE_LABELS[x.date]) || x.date;
      option.selected = x.date===a.date;
      select.appendChild(option);
    });
    select.addEventListener('change', () => {
      const next = writerDates.find(x => articleId(x)===select.value);
      if (next) openArticle(next);
    });
    field.append(head, select);
    nav.appendChild(field);
  }
}

/* Free on-device read-aloud (Web Speech API). Zero synthesis cost, so every column has
   audio even though only the weekly desk briefs get ElevenLabs episodes. */
function articleText(a){
  const parts = [localized(a.title)];
  (Array.isArray(a.sections) ? a.sections : []).forEach(s=>{
    if (!s || typeof s!=='object') return;
    parts.push(localized(s.h));
    (Array.isArray(s.ps) ? s.ps : []).forEach(p=>parts.push(localized(p)));
  });
  return parts.filter(Boolean).join('. ');
}
function stopReadAloud(){
  const u = UI[LANG];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.listen-btn.speaking').forEach(b=>{
    b.classList.remove('speaking');
    b.textContent = u.listenBtn;
  });
}

function renderReader(a){
  const u = UI[LANG];
  const w = personaOf(a.writer);
  stopReadAloud();  // a re-render (language switch, next column) invalidates the utterance
  // Every path into the reader (open, language switch, next column) lands here, so the
  // tab/share title tracks the article from one place.
  const shareTitle = localized(a.title);
  if (shareTitle) document.title = `${shareTitle} — Eigen Radar`;
  $('btnTr').href = articleRoute(a, 'tr');
  $('btnEn').href = articleRoute(a, 'en');
  $('readerBack').textContent = u.back;
  $('readerShare').textContent = u.shareBtn;
  renderReaderNav(a);
  $('readerContent').innerHTML = `
    <div class="wtop">
      <div class="avatar">${avatarOf(w)}</div>
      <div>
        <div class="wname">${escapeHTML(w.name)}<span class="ai-badge">${escapeHTML(badgeOf(w))}</span></div>
        <div class="wrole">${escapeHTML(localized(w.role))} · ${u.aiPersona} · ${escapeHTML(localized(DATE_LABELS[a.date]))} · ${escapeHTML(editionLabel(a))}</div>
      </div>
    </div>
    <h1>${escapeHTML(localized(a.title))}</h1>
    ${radarStampHTML(a)}
    <div class="body">${articleHTML(a)}</div>
    ${disclaimerHTML(topicOf(a)) ? `<div class="disclaimer" role="note">${disclaimerHTML(topicOf(a))}</div>` : ''}
  `;
  // Same-day editions of THIS writer: a rerun files a second column beside the first.
  // Rosters show only the latest; here in the open column, offer the reader the others.
  const editions = ARTICLES
    .filter(x => personaOf(x.writer).id===w.id && x.date===a.date)
    .sort((x,y)=>editionN(x)-editionN(y));
  if (editions.length > 1){
    const erow = document.createElement('div');
    erow.className = 'editions-row';
    const lab = document.createElement('span');
    lab.className = 'editions-label';
    lab.textContent = u.editionsToday;
    erow.appendChild(lab);
    editions.forEach(x=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'edition-btn';
      b.innerHTML = `<span class="edition-text">${escapeHTML(editionLabel(x))}</span><span class="edition-symbol" aria-hidden="true">${escapeHTML(editionSymbol(x))}</span>`;
      b.setAttribute('aria-label', `${u.editionWord} ${editionLabel(x)}`);
      if (articleId(x)===articleId(a)) b.setAttribute('aria-current','true');
      else b.addEventListener('click', ()=>openArticle(x));
      erow.appendChild(b);
    });
    $('readerContent').querySelector('.wtop').after(erow);
  }
  if ('speechSynthesis' in window){
    const row = document.createElement('div');
    row.className = 'listen-row';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'listen-btn';
    b.textContent = u.listenBtn;
    // ponytail: rate only — pitch/volume are the same API, add sliders if anyone asks
    const rate = document.createElement('input');
    rate.type = 'range'; rate.min = '0.5'; rate.max = '2'; rate.step = '0.1';
    const defaultRate = 1.2;
    const normalizeRate = value => {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) && parsed >= 0.5 && parsed <= 2
        ? Math.round(parsed * 10) / 10
        : defaultRate;
    };
    try { rate.value = String(normalizeRate(localStorage.getItem('ttsRate'))); }
    catch { rate.value = String(defaultRate); }
    rate.className = 'listen-rate';
    rate.setAttribute('aria-label', u.listenRate);
    const out = document.createElement('span');
    out.className = 'listen-rate-val';
    const showRate = ()=>{ out.textContent = rate.value + '×'; };
    showRate();
    // speechSynthesis ignores rate changes mid-utterance; restart so the slider actually does something
    rate.addEventListener('input', ()=>{
      rate.value = String(normalizeRate(rate.value));
      showRate();
      try { localStorage.setItem('ttsRate', rate.value); } catch {}
      if (b.classList.contains('speaking')){ stopReadAloud(); speak(); }
    });
    function speak(){
      const msg = new SpeechSynthesisUtterance(articleText(a));
      msg.lang = LANG==='tr' ? 'tr-TR' : 'en-US';
      msg.rate = normalizeRate(rate.value);
      msg.onend = msg.onerror = stopReadAloud;
      b.classList.add('speaking');
      b.textContent = u.listenStop;
      speechSynthesis.speak(msg);
    }
    b.addEventListener('click', ()=>{
      if (b.classList.contains('speaking')) stopReadAloud(); else speak();
    });
    row.append(b, rate, out);
    $('readerContent').querySelector('h1').after(row);
  }
}

/* Show an article in the reading pane. fromNav=true when we're reacting to a hash change
   (deep link / back-forward) — the hash is already correct, so we don't rewrite it. */
function showArticle(a, fromNav){
  currentArticle = a;
  // A deep link may land on a different desk/day than what's rendered behind the reader.
  const t = topicOf(a);
  if (t !== TOPIC || selectedDate !== a.date){
    if (t !== TOPIC){
      TOPIC = t;
      newsPage = 0;
      try { localStorage.setItem('topic', t); } catch {}
      selectedBriefDate = topicBriefEditions()[0]?.[0] || null;
    }
    selectedDate = a.date;
    activeFilter = 'all';
    renderAll();
  }
  renderReader(a);
  if (!fromNav && hashId() !== articleId(a)) location.hash = articleId(a);
  if (!document.body.classList.contains('reading')) savedScroll = window.scrollY;
  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  $('readerBack').focus();
}
function openArticle(a){ showArticle(a, false); }

function closeArticle(){
  if (!currentArticle) return;
  stopReadAloud();
  currentArticle = null;
  document.title = topicMeta(TOPIC).pageMeta[LANG].page;
  document.body.classList.remove('reading');
  $('btnTr').href = homeLanguageRoute('tr');
  $('btnEn').href = homeLanguageRoute('en');
  window.scrollTo(0, savedScroll);  // back to where the reader left the edition
  if (hashId()) history.pushState(null, '', location.pathname + location.search);
}

/* Citation fragments live inside the hash-routed reader. Keep the article's shareable
   hash intact while scrolling in either direction; otherwise `hashchange` would treat
   the citation/reference fragment as an unknown article and close the reader. */
$('readerContent').addEventListener('click', event=>{
  const link = event.target.closest('a[data-reader-target]');
  if(!link || !currentArticle || !isPlainClick(event)) return;
  const target = document.getElementById(link.dataset.readerTarget);
  if(!target) return;
  event.preventDefault();
  target.scrollIntoView({block:'start'});
  target.focus({preventScroll:true});
});

/* Single source of truth for the reader: the URL hash. Handles deep links on load and
   the browser back/forward buttons. openArticle sets the hash, which lands back here. */
function syncFromHash(){
  const id = hashId();
  const a = id && ARTICLES.find(x => articleId(x) === id);
  if (!a){
    currentArticle = null;
    if (document.body.classList.contains('reading')){
      document.body.classList.remove('reading');
      document.title = topicMeta(TOPIC).pageMeta[LANG].page;
      window.scrollTo(0, savedScroll);  // browser Back out of a column
    }
    return;
  }
  if (currentArticle && articleId(currentArticle) === id) return;
  showArticle(a, true);
}

/* Logo goes home: close any open column in place rather than reloading. The href stays

/* The hash id was designed to be shared; this is its one-tap affordance. Native share
   sheet where the platform has one, clipboard with a brief confirmation elsewhere. */
$('readerShare').addEventListener('click', async ()=>{
