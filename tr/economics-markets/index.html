ysel yatırımcı oldu."}, "sections": [{"h": {"en": "One session gives it, the next takes it back", "tr": "Bir seansın verdiğini ertesi seans geri alıyor"}, "ps": [{"en": "The Kospi had closed the previous session at 6,595.45, up 1,001.89 points or 17.91 per cent. On Monday morning the index lost 321.79 points, or 4.88 per cent, to 6,273.66 — roughly a third of the previous session's point gain. Samsung Electronics fell 21,500 won to 241,000 won and SK hynix 136,000 won to 1,582,000 won.", "refs": ["kospi"], "tr": "Kospi bir önceki seansı 1.001,89 puanlık, yüzde 17,91'lik yükselişle 6.595,45'te kapatmıştı. Pazartesi sabahı endeks 321,79 puan, yani yüzde 4,88 kaybederek 6.273,66'ya indi; bu, önceki seansın puan kazancının yaklaşık üçte biri. Samsung Electronics 21.500 won gerileyerek 241.000 wona, SK hynix 136.000 won gerileyerek 1.582.000 wona indi."}, {"en": "A 17.91 per cent move in one session cannot be explained by expectations for memory demand shifting that far in a day. A move of that size is usually a repricing of who is carrying the stock rather than of the stock itself. Lee Jong-wook of Samsung Securities attributes the sharp correction less to concern that the cycle has peaked than to an excessive concentration of investment.", "refs": ["kospi"], "tr": "Tek bir seanstaki yüzde 17,91'lik hareket, bellek talebine ilişkin beklentinin bir günde bu kadar değişmesiyle açıklanamaz. Bu ölçekteki bir hareket çoğunlukla fiyatın değil, hisseyi kimin taşıdığının yeniden belirlenmesi anlamına gelir. Samsung Menkul Değerler'den Lee Jong-wook da sert düzeltmeyi çevrimin tepe yapması endişesinden çok yatırımın aşırı yoğunlaşmasına bağlıyor."}, {"en": "The flow supports that reading. Foreign investors net sold 1.1104 trillion won and institutions 247.1 billion won, a combined 1.3575 trillion won. On the other side stands 1.3185 trillion won of net buying by individual investors. The marginal buyer in the session was the household.", "refs": ["kospi"], "tr": "Akış bu okumayı destekliyor. Yabancı yatırımcılar 1,1104 trilyon won, kurumsal yatırımcılar 247,1 milyar won net satış yaptı; toplam 1,3575 trilyon won. Karşı tarafta bireysel yatırımcıların 1,3185 trilyon wonluk net alımı duruyor. Seansın marjinal alıcısı haneler oldu."}]}, {"h": {"en": "The brokerages changed their own numbers that same morning", "tr": "Aynı sabah aracı kurumlar da rakamlarını değiştirdi"}, "ps": [{"en": "Shinhan Investment \u0026 Securities cut its Samsung Electronics target from 590,000 to 450,000 won and its SK hynix target from 4.2 million to 2.7 million won, the latter a reduction of about 36 per cent. Samsung Securities moved the same two from 500,000 to 400,000 won and from 3.5 million to 3 million won. That is information separate from the change in positioning: while the crowd rotated, the sell side also lowered its own baseline.", "refs": ["kospi"], "tr": "Shinhan Yatırım, Samsung Electronics hedefini 590.000 wondan 450.000 wona, SK hynix hedefini 4,2 milyon wondan 2,7 milyon wona indirdi; ikinci indirim yaklaşık yüzde 36. Samsung Menkul Değerler ise aynı hisselerde hedefini 500.000'den 400.000 wona, 3,5 milyon wondan 3 milyon wona indirdi. Bu, pozisyon değişiminden ayrı bir bilgi: analist tarafı, kalabalık el değiştirirken kendi tahmin tabanını da aşağı çekti."}, {"en": "The two sessions priced two different things. The earlier one repriced who would carry the stock; Monday repriced the estimates attached to it. Where they separate is whether the recovery Han Ji-young of Kiwoom Securities expects actually arrives. In a positioning-driven correction the index steadies without further target cuts and the flow reverses; if the estimate base has genuinely moved, the cuts continue into the next round and the stock the households took on was not cheap but early.", "refs": ["kospi"], "tr": "İki seans iki farklı şeyi fiyatladı. Önceki seans hisseyi kimin taşıyacağını yeniden belirledi; pazartesi ise o hisseye biçilen tahmini. Bunların birbirinden ayrıldığı yer, Kiwoom Menkul Değerler'den Han Ji-young'un beklediği toparlanmanın gelip gelmeyeceği. Pozisyon kaynaklı bir düzeltmede endeks yeni hedef indirimleri olmadan dengelenir ve akış tersine döner; tahmin tabanı gerçekten değiştiyse indirimler bir sonraki turda da sürer ve bireysel yatırımcının devraldığı hisse ucuz değil, erken alınmış olur."}]}], "sources": [{"key": "kospi", "kind": "news", "name": "Seoul Economic Daily", "url": "https://en.sedaily.com/news/2026/08/03/samsung-sk-hynix-tumble-8-percent-as-kospi-drops-below-6200", "title": {"tr": "Kospi rekor seansın ertesinde yüzde 4,88 düştü", "en": "The Kospi fell 4.88 per cent the morning after its record session"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who bought what was sold the morning after the 17.91 per cent session?", "tr": "Yüzde 17,91'lik seansın ertesinde satılanı kim aldı?"}, "writer": "eco-01", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Four of the bill's five points concern institutional form. The one that changes which balance sheet creates money is the ban on financing government spending — and even that does nothing to the constraint on the foreign-currency side.", "tr": "Beş maddelik tasarının dördü kurumsal biçimle ilgili. Parayı hangi bilançonun yarattığını değiştiren tek madde, kamu harcamasının finansmanını yasaklayan madde — ve o madde bile döviz tarafındaki kısıtı gevşetmiyor."}, "sections": [{"h": {"en": "Five points, one mechanism", "tr": "Beş madde, tek mekanizma"}, "ps": [{"en": "The bill replaces the competing objectives of Argentina's central bank (BCRA) — monetary and financial stability, full employment, social equity and economic development — with a single task built on preserving the value of the currency. The remaining points strictly prohibit the financing of government spending, protect the bank's leadership from arbitrary dismissal, restrict the distribution of dividends from earnings and abolish non-transferable bills.", "refs": ["arg"], "tr": "Tasarı, Arjantin Merkez Bankası'nın (BCRA) parasal ve finansal istikrar, tam istihdam, sosyal adalet ve ekonomik kalkınmayı kapsayan yarışan hedeflerinin yerine paranın değerini korumaya dayalı tek bir görev koyuyor. Diğer maddeler kamu harcamalarının finansmanını kesin biçimde yasaklıyor, banka yönetimini keyfî görevden almaya karşı koruyor, kârdan temettü dağıtımını sınırlıyor ve devredilemez bonoları kaldırıyor."}, {"en": "Four of those five points regulate governance and accounting; the only one that changes a flow is the financing prohibition. The magnitude Carlos Pérez of Fundación Capital points to locates the mechanism: in December 2023 the quasi-fiscal deficit arising from interest on the bank's own securities was about 10 per cent of GDP. Money creation therefore ran as much through interest paid on the bank's own liability as through any direct loan to the treasury.", "refs": ["arg"], "tr": "Bu beş maddenin dördü yönetişimi ve muhasebeyi düzenliyor; akışı değiştiren tek madde finansman yasağı. Fundación Capital'den Carlos Pérez'in işaret ettiği büyüklük mekanizmanın yerini gösteriyor: Aralık 2023'te bankanın kendi menkul kıymetlerine ödediği faizden doğan yarı malî açık GSYİH'nin yaklaşık yüzde 10'uydu. Yani para yaratımı hazineye açılan doğrudan bir kredi kadar, bankanın kendi yükümlülüğüne ödediği faizden de geçiyordu."}]}, {"h": {"en": "A charter does not create reserves", "tr": "Yasa rezerv yaratmıyor"}, "ps": [{"en": "Net reserves stood at $5 billion as of 21 July, according to Portfolio Personal Inversores. A financing prohibition closes the creation channel on the domestic-currency side; it does not change whose balance sheet falls short against obligations that must be settled in foreign currency. That is why the reading offered by Claudio Caprarulo, director of Analytica, matters: he takes the government to be signalling mainly to external and multilateral creditors. If he is right, the bill's operative variable is credit access rather than the money-creation channel.", "refs": ["arg"], "tr": "Portfolio Personal Inversores'in hesabına göre net rezervler 21 Temmuz itibarıyla 5 milyar dolar düzeyindeydi. Finansman yasağı yerel para tarafındaki yaratım kanalını kapatır; dövizle ödenmesi gereken yükümlülükler karşısında kimin bilançosunun yetersiz kaldığını değiştirmez. Analytica direktörü Claudio Caprarulo'nun okuması bu yüzden dikkate değer: ona göre hükümet esas olarak dış alacaklılara ve çok taraflı kuruluşlara işaret veriyor. Bu doğruysa tasarının işleyen değişkeni para yaratım kanalı değil, kredi erişimi olur."}, {"en": "The strongest form of the narrow mandate is that the rule itself produces credibility: with financing closed, expectations anchor and inflation persistence falls. Jorge Carrera, a former director of the bank, sets an institutional objection against that case; in his account single-objective central banks disappeared after 2008 because leaving financial stability outside the bank came to be seen as a weak choice. Caprarulo likewise argues that monetary policy should not be constrained to the point where it cannot answer a crisis or an external shock. The reporting establishes these positions, not which of them will hold.", "refs": ["arg"], "tr": "Dar mandanın en güçlü hâli, kuralın kendisinin güvenilirlik ürettiğidir: finansman kapalıysa beklentiler çıpalanır ve enflasyon inatçılığı azalır. Eski banka yöneticisi Jorge Carrera bu savın karşısına kurumsal bir itiraz koyuyor; ona göre 2008'den sonra tek amaçlı merkez bankaları ortadan kalktı, çünkü finansal istikrarı bankanın dışında bırakmak zayıf bir tercih olarak görüldü. Caprarulo da para politikasının bir krize ya da dış şoka tepki veremeyecek kadar kısıtlanmaması gerektiğini söylüyor. Kaynak bu görüşleri ortaya koyuyor, hangisinin gerçekleşeceğini değil."}]}, {"h": {"en": "Whose balance sheet it lands on", "tr": "Kimin bilançosuna yazılıyor"}, "ps": [{"en": "What a clause does is change who carries a deficit. If the financing prohibition takes effect, whatever the treasury does not cover is closed either by cutting spending or by borrowing in the market, and the fiscal anchor Milei includes in the same programme — which shuts down government operations if Congress fails to balance the accounts — institutionalises the first of those two. Under such an arrangement the burden of adjustment moves off the central bank's balance sheet and onto households that use public services and on to those the state owes. That is the bill's real distributional question, and the reporting carries no provision on how that burden would be shared.", "refs": ["arg"], "tr": "Bir yasa maddesinin yaptığı şey açığı taşıyacak tarafı değiştirmektir. Finansman yasağı yürürlüğe girerse hazinenin karşılamadığı kısım ya harcama kısıntısıyla ya da piyasa borçlanmasıyla kapanır; Milei'nin aynı programda yer verdiği ve Kongre dengeyi sağlayamazsa devlet faaliyetlerini durduran malî çıpa, bu iki seçenekten birincisini kurumsallaştırıyor. Böyle bir düzenlemede uyum yükü, merkez bankasının bilançosundan çıkıp kamu hizmetinden yararlanan hanelere ve kamuya alacaklı olan kesime geçer. Tasarının asıl dağılım sorusu da burada duruyor; elimizdeki haber ise bu yükün nasıl paylaşılacağına dair bir hüküm içermiyor."}]}], "sources": [{"key": "arg", "kind": "news", "name": "Buenos Aires Herald", "url": "https://buenosairesherald.com/economics/central-bank-reform-is-heading-to-congress-is-the-peruvian-model-the-goal", "title": {"tr": "Arjantin'de merkez bankası yasasını değiştiren tasarı Kongre'ye gidiyor", "en": "Argentina's central bank charter bill is heading to Congress"}, "publishedDate": "2026-08-02"}], "title": {"en": "The prohibition clause binds harder than the mandate itself", "tr": "Yasak maddesi, mandanın kendisinden daha bağlayıcı"}, "writer": "eco-02", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The transaction brings no new customers, no new licence and no new market. What it brings is that 30.95 per cent of MAHB's earnings stops leaving the group; the price of that is 4.83 billion ringgit.", "tr": "İşlem yeni müşteri, yeni lisans ya da yeni pazar getirmiyor. Getirdiği tek şey, MAHB kazancının yüzde 30,95'inin artık dışarı çıkmaması; bunun bedeli 4,83 milyar ringgit."}, "sections": [{"h": {"en": "What is being bought and what is not", "tr": "Ne alınıyor, ne alınmıyor"}, "ps": [{"en": "Maybank has signed an implementation agreement to buy 30.95 per cent of Maybank Ageas Holdings from Ageas Insurance International NV for 4.83 billion ringgit; the bank already held 69.05 per cent of that vehicle. An application has gone to Bank Negara Malaysia for approval, and Maybank Investment Bank and Morgan Stanley Asia (Singapore) are advising.", "refs": ["may"], "tr": "Maybank, Maybank Ageas Holdings'in yüzde 30,95'lik payını Ageas Insurance International NV'den 4,83 milyar ringgite almak üzere uygulama sözleşmesi imzaladı; banka bu yapının yüzde 69,05'ine zaten sahipti. Onay için Bank Negara Malaysia'ya başvuru yapıldı, işlemde Maybank Investment Bank ile Morgan Stanley Asia (Singapore) danışmanlık veriyor."}, {"en": "The consolidated business does not change. The policies, the distribution network and the licences are what they were before the transaction. What changes is the claim on those earnings: the share that has been going to the minority partner now stays inside the group. That places the decision in one category: capital allocation. The measure of its return is the share of earnings retained in the group, set against the price paid and the cost of funding it.", "refs": ["may"], "tr": "Konsolide iş kolu değişmiyor. Poliçe sayısı, dağıtım ağı ve lisanslar işlem öncesindeki gibi. Değişen tek şey o kazanç üzerindeki hak: bugüne kadar azınlık ortağına giden pay bundan sonra grupta kalıyor. Kararın türü budur: sermaye tahsisi. Getirisinin ölçüsü de ödenen bedel karşısında grupta kalan kazanç payı ile o bedelin finansman maliyetidir."}]}, {"h": {"en": "The assumption carrying the multiple", "tr": "Çarpanı taşıyan varsayım"}, "ps": [{"en": "Adjusted for a dividend of 800 million ringgit, of which Ageas' entitlement is 248 million ringgit, the announced price implies 1.98 times book value and 15.3 times earnings. The direction of the adjustment matters: the distribution pulls the net amount payable below the headline figure, so the stated multiples already embed it.", "refs": ["may"], "tr": "Açıklanan bedel, 800 milyon ringgitlik temettü dağıtımına göre düzeltildiğinde 1,98 kat defter değerine ve 15,3 kat kazanca denk geliyor; bu temettüden Ageas'ın payına 248 milyon ringgit düşüyor. Düzeltmenin yönü önemli: dağıtım, ödenecek net tutarı manşet rakamın altına çekiyor, dolayısıyla açıklanan çarpanlar bu dağıtımı zaten içeriyor."}, {"en": "Assuming both multiples are struck on the same adjusted price, the arithmetic opens up. The figure of 4.83 billion ringgit divided by 15.3 implies the acquired stake carries roughly 316 million ringgit of annual earnings, which puts MAHB's total earnings at about 1.02 billion ringgit. The same price divided by 1.98 puts the stake's book value at about 2.44 billion ringgit and the vehicle's total equity at about 7.88 billion ringgit. The ratio of those two figures places the implied return on equity at around 13 per cent.", "refs": ["may"], "tr": "İki çarpanın aynı düzeltilmiş bedel üzerinden hesaplandığını varsayarsak aritmetik açılabilir. 4,83 milyar ringgitin 15,3'e bölünmesi, satın alınan payın yaklaşık 316 milyon ringgitlik yıllık kazanca karşılık geldiğini gösterir; bu da MAHB'nin toplam kazancını yaklaşık 1,02 milyar ringgit yapar. Aynı bedelin 1,98'e bölünmesi, payın defter değerini yaklaşık 2,44 milyar ringgite, yapının toplam özkaynağını yaklaşık 7,88 milyar ringgite getirir. Bu iki sayının oranı, örtük özkaynak kârlılığını yaklaşık yüzde 13 düzeyine yerleştirir."}, {"en": "The whole chain hangs on one assumption; if the multiples were struck on different bases, both the implied earnings and the implied equity move with it. The company's own case is not built on the multiple in any event: Datuk Sri Khairussaleh Ramli, president and group chief executive, sets out a rationale running through productivity, operating cost and customer experience. None of those three appears in the two disclosed multiples, so the value management defends and the value the price measures are not being read off the same statement. Where capital is directed is a choice in its own right, and the choice made here was to buy back the share leaking out of a business already being run rather than to enter a new one.", "refs": ["may"], "tr": "Tüm bu zincir tek bir varsayıma asılı; çarpanlar farklı tabanlarda hesaplanmışsa örtük kazanç da örtük özkaynak da kayar. Şirketin kendi gerekçesi zaten çarpan üzerinden kurulmuyor: Başkan ve Grup İcra Kurulu Başkanı Datuk Sri Khairussaleh Ramli, verimlilik, işletme maliyeti ve müşteri deneyimi üzerinden ilerleyen bir anlatı sunuyor. Bu üç başlığın hiçbiri açıklanan iki çarpanda görünmüyor; yani yönetimin savunduğu değer ile fiyatın ölçtüğü değer aynı tabloda okunmuyor. Sermayenin nereye ayrıldığı başlı başına bir tercihtir ve buradaki tercih, yeni bir işe girmek yerine hâlihazırda işletilen bir işin dışarı sızan payını geri satın almak olmuş."}]}], "sources": [{"key": "may", "kind": "news", "name": "The Star", "url": "https://www.thestar.com.my/business/business-news/2026/08/03/maybank-to-acquire-ageas039-stake-in-etiqa-for-rm483bil", "title": {"tr": "Maybank, Etiqa'daki Ageas payını 4,83 milyar ringgite alıyor", "en": "Maybank is buying Ageas' Etiqa stake for 4.83 billion ringgit"}, "publishedDate": "2026-08-03"}], "title": {"en": "1.98 times book, the price of buying out a minority from the inside", "tr": "1,98 kat defter değeri, azınlığı içeriden almanın fiyatı"}, "writer": "eco-03", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The price fell 6 per cent at the open. What moved it was not a cargo, an inventory release or a loading schedule; it was a sentence, and that sentence has not yet been confirmed.", "tr": "Fiyat açılışta yüzde 6 düştü. Düşüren şey bir kargo, bir stok verisi ya da bir yükleme programı değildi; bir cümleydi; o cümle de henüz doğrulanmadı."}, "sections": [{"h": {"en": "What moved the price was not physical", "tr": "Fiyatı düşüren şey fiziki değil"}, "ps": [{"en": "Oil opened Monday's Asian session down as much as 6 per cent, holding a decline of close to 5 per cent through the day. The trigger was US President Donald Trump saying he had called off planned strikes on Iran's infrastructure. Trump also said a deal had been reached to reopen the Strait of Hormuz and that nuclear talks would begin the following afternoon; neither claim has been independently confirmed.", "refs": ["oil"], "tr": "Pazartesi Asya seansında petrol açılışta yüzde 6'ya varan kayıpla başladı, gün içinde geri çekilme yüzde 5'e yakın seyretti. Tetikleyici, ABD Başkanı Donald Trump'ın İran'ın altyapısına yönelik planlanan saldırıları iptal ettiğini söylemesiydi. Trump ayrıca Hürmüz Boğazı'nın yeniden açılmasına ilişkin bir anlaşmaya varıldığını ve nükleer görüşmelerin ertesi gün öğleden sonra başlayacağını söyledi; bu iki ifade bağımsız kaynaklarca doğrulanmadı."}, {"en": "What carries the premium in this market is the strait staying shut. Nothing in the available reporting establishes a change in transit volume, loading schedules or inventories. Until one of those moves, the price has repriced a statement rather than a barrel. The difference is not academic: a statement can be withdrawn, a loaded cargo cannot.", "refs": ["oil"], "tr": "Bu piyasada primi taşıyan şey boğazın kapalı kalması. Elimizdeki kaynakta ne geçiş hacminde, ne yükleme programında, ne de stoklarda doğrulanmış bir değişiklik var. Bunlardan biri kımıldayana kadar fiyat bir varili değil, bir açıklamayı yeniden fiyatlamış oluyor. Aradaki fark akademik değil: açıklama geri alınabilir, yüklenmiş kargo geri alınamaz."}]}, {"h": {"en": "The cuts are still in place", "tr": "Kesintiler yerinde duruyor"}, "ps": [{"en": "The documented supply side runs as follows: seven OPEC+ countries raised their September production target by 188,000 barrels a day, while roughly 2 million barrels a day of cuts dating from 2023 remain in place. Over that same July, Brent rose 24 per cent and WTI 21 per cent. The group was adding barrels while the price climbed; the source of July's move was not a supply cut.", "refs": ["oil", "opec"], "tr": "Belgelenmiş olan arz tarafı şu: yedi OPEC+ ülkesi eylül için günlük üretim hedefini 188.000 varil yükseltti, buna karşılık 2023'ten kalan yaklaşık 2 milyon varillik günlük kesinti yerinde duruyor. Aynı temmuz ayında Brent yüzde 24, WTI yüzde 21 yükselmişti. Yani grup varil eklerken fiyat tırmandı; temmuzdaki hareketin kaynağı bir arz kesintisi değildi."}, {"en": "Taken together the two observations show where the premium sits: not in the quota but in the strait. If the strait genuinely opens, the flow released is the volume already moving plus the September increment, and the premium unwinds against a supply base that has been growing. That is why a single sentence can move the price this far. An alternative explanation deserves to stay on the table: in the same session the dollar fell below 156 yen and S\u0026P 500 and Nasdaq futures rose about 0.5 per cent, so part of the move may be a cross-asset shift in risk appetite rather than anything specific to oil.", "refs": ["oil"], "tr": "İki gözlem birlikte primin nerede oturduğunu gösteriyor: kotada değil, boğazda. Boğaz gerçekten açılırsa serbest kalan akış, hâlihazırda yürüyen hacim ile eylül artışının toplamı olur ve prim, büyümekte olan bir arz tabanına karşı çözülür. Tek bir cümlenin fiyatı bu kadar hareket ettirebilmesinin nedeni de bu. Alternatif bir açıklamayı da yerinde tutmak gerekir: aynı seansta dolar 156 yenin altına indi ve ABD vadelilerinde S\u0026P 500 ile Nasdaq sözleşmeleri yaklaşık yüzde 0,5 yükseldi; hareketin bir bölümü petrole özgü olmayan, varlıklar arası bir risk iştahı değişimi olabilir."}]}, {"h": {"en": "The number that would confirm it", "tr": "Doğrulayacak sayı"}, "ps": [{"en": "What confirms an agreement is transit, not price. The things to watch are the number of tankers moving through Hormuz, any change in loading schedules, and whether the agreement is published rather than described. Until one of those arrives, the only firm number available is the ratio between the 188,000 barrels a day added for September and the roughly 2 million still withheld; while the strait stays shut, that ratio is not what carries the price.", "refs": ["oil", "opec"], "tr": "Bir anlaşmanın varlığını fiyat değil, geçiş doğrular. İzlenecek olan, Hürmüz'den geçen tanker sayısı ile yükleme programlarındaki değişiklik ve anlaşmanın anlatılmak yerine yayımlanması. Bu üçünden biri gelene kadar elimizdeki tek sağlam sayı, eylülde eklenen 188.000 varil ile hâlâ kesik duran yaklaşık 2 milyon varil arasındaki oran; boğaz kapalı kaldığı sürece bu oran fiyatı taşımaya yetmiyor."}]}], "sources": [{"key": "oil", "kind": "news", "name": "investingLive", "url": "https://investinglive.com/news/market-moving-news-for-asian-trading-on-3-august-oil-slumps-on-trump-s-iran-claims/", "title": {"tr": "Trump saldırıları durdurduğunu söyleyince petrol açılışta yüzde 6 geriledi", "en": "Oil fell as much as 6 per cent at the open after Trump said he had halted strikes"}, "publishedDate": "2026-08-03"}, {"key": "opec", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/02/opec-agrees-output-rise-in-september-but-pauses-increase-from-fourth-quarter/", "title": {"tr": "Yedi OPEC+ ülkesi eylül kotasını günde 188.000 varil yükseltti", "en": "Seven OPEC+ countries lifted the September quota by 188,000 barrels a day"}, "publishedDate": "2026-08-02"}], "title": {"en": "How much of the premium comes back if the strait opens", "tr": "Boğaz açılırsa primin ne kadarı geri gelir"}, "writer": "eco-04", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "The same release carries two numbers: minus 0.14 against the month, plus 2.88 against the year. Because the comparison at the checkout is with last year rather than last month, the one a household feels is the second.", "tr": "Aynı açıklamada iki sayı var: aya göre eksi 0,14, yıla göre artı 2,88. Mutfakta karşılaştırma geçen ayla değil geçen yılla yapıldığı için hanenin hissettiği ikincisi."}, "sections": [{"h": {"en": "The rate and the level are not the same thing", "tr": "Oran ile düzey aynı şey değil"}, "ps": [{"en": "Indonesia's statistics agency BPS put annual consumer inflation at 2.88 per cent in July. In the same month prices fell 0.14 per cent from June, and the cumulative rise from January to July was 1.65 per cent. Ateng Hartono, the agency's deputy for distribution and services statistics, said the consumer price index had risen from 108.60 in July 2025 to 111.73 in July 2026.", "refs": ["idn"], "tr": "Endonezya İstatistik Kurumu BPS, temmuzda yıllık tüketici enflasyonunu yüzde 2,88 olarak açıkladı. Aynı ayda fiyatlar bir önceki aya göre yüzde 0,14 geriledi, yılbaşından temmuza kümülatif artış yüzde 1,65 oldu. Kurum Dağıtım ve Hizmet İstatistikleri Başkan Yardımcısı Ateng Hartono, tüketici fiyat endeksinin Temmuz 2025'te 108,60 iken Temmuz 2026'da 111,73'e çıktığını belirtti."}, {"en": "What a household measures is the index itself. Going from 108.60 to 111.73 means 3.13 points accumulated over a year. July's decline removes 0.14 of a point from that accumulation, not the 3.13. The easing of the annual rate is largely arithmetic about the base a year earlier; it does not bring back the amount met at the till. That distinction is why the sentence 'inflation has slowed' finds no answer in the kitchen.", "refs": ["idn"], "tr": "Hanenin ölçtüğü şey endeksin kendisi. 108,60'tan 111,73'e çıkış, bir yılda 3,13 puanlık bir birikim demek. Temmuzdaki düşüş bu birikimden 0,14 puan siliyor, 3,13 puanı değil. Yıllık oranın gerilemesi büyük ölçüde bir yıl öncesinin tabanına ilişkin bir aritmetik; alışverişte karşılaşılan tutarı geri getirmiyor. Bu ayrım, 'enflasyon yavaşladı' cümlesinin neden mutfakta karşılık bulmadığını da açıklıyor."}]}, {"h": {"en": "Three headings, one basket", "tr": "Üç başlık, tek sepet"}, "ps": [{"en": "The three headings the agency singled out as contributing to annual inflation are food, beverages and tobacco; transport; and gold and jewellery. The first two are non-discretionary spending, the third is not. Those three items do not sit at the same weight in every budget, and how much of a household's income goes to food and transport determines what the same 2.88 per cent means for it.", "refs": ["idn"], "tr": "Kurumun yıllık enflasyona katkıda öne çıkardığı üç başlık gıda, içecek ve tütün; ulaştırma; bir de altın ve mücevherat. İlk ikisi zorunlu harcama, üçüncüsü değil. Bu üç kalem her bütçede aynı ağırlıkta durmuyor ve bir hanenin gelirinin ne kadarını gıdaya ve ulaşıma ayırdığı, aynı yüzde 2,88'in onun için ne anlama geldiğini belirliyor."}, {"en": "The objection here is not that the average is wrong. A national index is built to represent spending across the country and is the right instrument for that job; monetary policy could not work off any other measure. The objection is that an average is only an average. The release gives a single national index; it offers no breakdown by income band, region or household type. The question of which household the 2.88 per cent describes therefore has no answer in this data — and saying so is more useful than inventing one.", "refs": ["idn"], "tr": "Buradaki itiraz ortalamanın yanlış olduğu değil. Ulusal endeks, ülke genelindeki harcamayı temsil etmek üzere kurulur ve o işi yapmak için doğru araçtır; para politikası da başka bir ölçütle çalışamaz. İtiraz, ortalamanın yalnızca bir ortalama olduğudur. Açıklama tek bir ulusal endeks veriyor; gelir dilimlerine, bölgelere ya da hane tiplerine göre bir dağılım sunmuyor. Dolayısıyla yüzde 2,88'in hangi haneyi anlattığı sorusunun cevabı bu veri setinde yok — ve olmadığını söylemek, olmayan bir cevabı uydurmaktan daha yararlı."}, {"en": "A number is most useful where we know what it does not measure. The index tells us prices fell in July and that the level remains 3.13 points above where it stood a year ago; both hold. It does not tell us whether a household spending most of its budget on food experiences that accumulation differently because transport or jewellery carries little weight for it. Until that gap is closed, the relief the headline carries may be real for one group and merely a fact about the base for another.", "refs": ["idn"], "tr": "Bir sayının en çok işe yaradığı yer, neyi ölçmediğini bildiğimiz yerdir. Endeks bize temmuzda fiyatların gerilediğini ve düzeyin bir yıl öncesine göre 3,13 puan yukarıda kaldığını söylüyor; bunlar sağlam. Gıdaya bütçesinin büyük bölümünü ayıran bir hanenin bu birikimi ulaştırma ya da mücevherat ağırlığı düşük olduğu için farklı yaşayıp yaşamadığını ise söylemiyor. Bu boşluk kapanana kadar, manşetin taşıdığı rahatlama bir grup için gerçek, bir başkası için yalnızca tabanla ilgili olabilir."}]}], "sources": [{"key": "idn", "kind": "news", "name": "ANTARA", "url": "https://www.antaranews.com/berita/5677207/ekonomi-ri-alami-inflasi-tahunan-sebesar-288-persen-pada-juli-2026", "title": {"tr": "Endonezya'da yıllık enflasyon temmuzda yüzde 2,88 oldu", "en": "Indonesia's annual inflation was 2.88 per cent in July"}, "publishedDate": "2026-08-03"}], "title": {"en": "Prices fell in July and the level is still 2.88 per cent higher", "tr": "Fiyatlar temmuzda düştü, seviye yine de yüzde 2,88 yukarıda"}, "writer": "eco-05", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "Two treasuries said they would not hesitate. The question left unasked: if a single session is estimated at 58.97 billion dollars, how many sessions does that pledge carry?", "tr": "İki hazine çekinmeyeceklerini söyledi. Sorulmayan soru şu: bir seansın maliyeti 58,97 milyar dolar olarak tahmin ediliyorsa, o söz kaç seans taşır?"}, "sections": [{"h": {"en": "An operation confirmed, a repetition pledged", "tr": "Doğrulanan bir işlem, taahhüt edilen bir tekrar"}, "ps": [{"en": "Japan's Finance Ministry confirmed that it had bought yen in coordination with the US Treasury on Friday, the first time the two countries have acted together in the currency market since 2011. US Treasury Secretary Scott Bessent confirmed the operation and said Washington would not hesitate to take part in further joint intervention. After the announcement the yen gained 1.4 per cent to 155.20, taking its two-session advance to 3.8 per cent; before that the currency had been at 40-year lows.", "refs": ["yen"], "tr": "Japonya Maliye Bakanlığı cuma günü ABD Hazinesi ile eşgüdümlü yen alımı yaptığını doğruladı; iki ülkenin döviz piyasasında birlikte hareket etmesi 2011'den bu yana ilk kez gerçekleşti. ABD Hazine Bakanı Scott Bessent işlemi teyit etti ve yeni ortak müdahalelere katılmaktan çekinmeyeceklerini söyledi. Duyurunun ardından yen yüzde 1,4 değerlenerek 155,20'ye çıktı, iki seanslık kazanç yüzde 3,8 oldu; para birimi öncesinde 40 yılın en düşük düzeylerindeydi."}, {"en": "The price effect is documented. On capacity the only size figure available is the roughly 58.97 billion dollars attributed to Thursday's solo operation run by Tokyo during New York hours; that figure was never disclosed officially, it was estimated. The size of Friday's operation, each side's share of it and the total resource behind it do not appear in the announcement. The sentence 'we will not hesitate' is therefore a commitment to reuse a buffer whose size has not been stated.", "refs": ["yen"], "tr": "Fiyat etkisi belgelenmiş durumda. Kapasite konusunda elimizdeki tek büyüklük ise perşembe günü New York seansında Tokyo'nun tek başına yürüttüğü işlem için verilen ve yaklaşık 58,97 milyar dolar tutan rakam; bu büyüklük resmî olarak açıklanmadı, tahmin edildi. Cuma işleminin büyüklüğü, iki tarafın payı ve arkasındaki toplam kaynak duyuruda yer almıyor. Yani 'çekinmeyeceğiz' cümlesi, boyutu açıklanmamış bir tamponun tekrar kullanılacağına dair bir taahhüt."}]}, {"h": {"en": "What has to stay true", "tr": "Neyin doğru kalması gerekiyor"}, "ps": [{"en": "The chain is simple. Intervention buys yen against a flow that is selling it. It works while the official bid stays larger than the private offer, or while the pledge itself changes the private seller's behaviour. If neither holds, the level defended becomes a target and the next operation has to be larger to achieve the same move. The measurable threshold sits here: if the yen slides back through its pre-announcement level without a further operation, the buffer has been tested.", "refs": ["yen"], "tr": "Zincir basit. Müdahale, yen satan bir akışa karşı yen alır. Resmî alım özel satıştan büyük kaldığı sürece ya da taahhüdün kendisi özel satıcının davranışını değiştirdiği sürece işler. İkisi de olmazsa savunulan düzey bir hedefe dönüşür ve aynı hareketi elde etmek için bir sonraki işlemin daha büyük olması gerekir. Ölçülebilir eşik burada: yen, yeni bir işlem olmadan duyuru öncesindeki düzeyine geri kayarsa, tampon test edilmiş demektir."}, {"en": "The buffer that could stop this deserves to be named honestly. Bessent's statement mentions Japan's market and monetary steps together, which implies the operation is not expected to work on its own. If a change in policy carries the level, the binding constraint ceases to be the size of the resource and the chain set out here does not form. But the reporting establishes the statement; it does not document a step actually taken. Treating the two as equivalent would be precisely the error to avoid.", "refs": ["yen"], "tr": "Bunu durdurabilecek tamponu da dürüstçe adlandırmak gerekir. Bessent açıklamasında Japonya'nın piyasa ve para politikası adımlarını birlikte anıyor; bu, işlemin tek başına çalışması beklenmediğini ima ediyor. Düzeyi bir politika değişikliği taşıyorsa bağlayıcı kısıt kaynağın büyüklüğü olmaktan çıkar ve buradaki zincir kurulmaz. Ancak elimizdeki haber ifadeyi ortaya koyuyor; atılmış bir adımı belgelemiyor. İkisini eşitlemek, tam da kaçınılması gereken hata olur."}]}, {"h": {"en": "What to watch", "tr": "İzlenecek olan"}, "ps": [{"en": "The measure here is a threshold. Two observations are enough: whether a further joint operation is announced, and whether 155.20 holds without one. Together they separate whether the pledge's effect on price has changed the private seller's behaviour or rests only on the size of the official bid. In the first case the pledge finances itself; in the second, every repetition costs more than the last.", "refs": ["yen"], "tr": "Buradaki ölçü bir eşiktir. İki gözlem yeter: yeni bir ortak işlemin duyurulup duyurulmadığı ve 155,20'nin böyle bir işlem olmadan korunup korunmadığı. İkisi birlikte, taahhüdün fiyat üzerindeki etkisinin özel satıcının davranışını mı değiştirdiğini yoksa yalnızca resmî alımın büyüklüğüne mi dayandığını ayırır. İlkinde söz kendi kendini finanse eder; ikincisinde her tekrar bir öncekinden pahalıya gelir."}]}], "sources": [{"key": "yen", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/8/3/japan-and-us-confirm-rare-joint-intervention-to-prop-up-yen", "title": {"tr": "Japonya ve ABD ortak yen alımını resmen doğruladı", "en": "Japan and the US formally confirmed the joint yen purchase"}, "publishedDate": "2026-08-03"}], "title": {"en": "The size behind the pledge is an estimate of 58.97 billion dollars", "tr": "Sözün arkasındaki tahmin 58,97 milyar dolar"}, "writer": "eco-06", "radarPublishedAt": "2026-08-02T21:38:43+00:00", "radarUpdatedAt": "2026-08-03T07:38:06+00:00", "date": "2026-08-03"}, {"excerpt": {"en": "On Friday the market had one executed order to price. Since Monday morning it has had to price a pledge with a named instrument behind it. Those are not the same question.", "tr": "Cuma günü piyasanın fiyatlaması gereken tek şey gerçekleşmiş bir emirdi. Pazartesi sabahından beri arkasında adı konmuş bir araç bulunan bir taahhüdü fiyatlaması gerekiyor. Bu ikisi aynı soru değil."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "What changed between Friday and Monday", "tr": "Cuma ile pazartesi arasında değişen ne"}, "ps": [{"en": "The Japanese Ministry of Finance, in a statement issued under Minister Satsuki Katayama's name, said it had bought yen in coordination with the US Treasury on Friday 31 July, US Eastern time. The action was tied to the US-Japan finance ministers' joint statement of September 2025, and the stated reason was excessive volatility and disorderly movements in the yen in recent months. The ministry added that it remained in close communication with its counterparts at the US Treasury and would not hesitate to conduct further joint intervention.", "refs": ["yen-mof"], "tr": "Japonya Maliye Bakanlığı, Bakan Satsuki Katayama imzasıyla yayımladığı açıklamada 31 Temmuz Cuma günü ABD Doğu saatiyle ABD Hazinesi ile eşgüdüm içinde yen satın aldığını bildirdi. İşlem, Eylül 2025 tarihli ABD-Japonya maliye bakanları ortak bildirisine dayandırıldı ve gerekçe olarak son aylarda yende görülen aşırı oynaklık ile düzensiz hareketler gösterildi. Bakanlık ayrıca ABD Hazinesi'ndeki muhataplarıyla yakın iletişimi sürdürdüğünü ve yeni bir ortak müdahaleden çekinmeyeceğini yazdı."}, {"en": "On Saturday I argued in this column that what carried Friday's move was an official purchase order with known mechanics rather than a repricing of expectations. That observation still holds, but today's statement contains more than a single order: the ministry attached a named instrument to the pledge, saying it plans to use the Federal Reserve's FIMA repo facility for foreign monetary authorities in the future. An order belongs to the past. A named instrument raises the prospect of repetition.", "refs": ["midas-prior", "yen-mof"], "tr": "Cumartesi günü bu köşede, cuma günkü hareketi taşıyan şeyin beklentilerin yeniden fiyatlanması değil, mekaniği bilinen resmî bir alım emri olduğunu yazmıştım. O gözlem yerinde duruyor, ancak bugünkü açıklama tek başına bir emirden fazlasını içeriyor: bakanlık taahhüdün yanına belirli bir araç adı koydu ve ilerleyen dönemde Federal Rezerv'in yabancı para otoriteleri için açtığı FIMA repo imkânını kullanmayı planladığını bildirdi. Bir emir geçmişte kalır; adı konmuş bir araç ise tekrarlanabilirlik ihtimali yaratır."}]}, {"h": {"en": "The condition sits inside the instrument", "tr": "Koşul, aracın kendisinde duruyor"}, "ps": [{"en": "US Treasury Secretary Scott Bessent said on X on Sunday that he would not hesitate to repeat the coordinated action, and said the FIMA facility should be encouraged to grow in the coming months. The facility's current limits are narrow: countries holding Treasury securities at the New York Fed can borrow at most 60 billion dollars for up to seven days, at a rate typically above the open-market repo rate. Any change in those terms requires approval from the Federal Open Market Committee, which is not expected to meet again before mid-September.", "refs": ["yen-fima"], "tr": "ABD Hazine Bakanı Scott Bessent pazar günü X'te eşgüdümlü işlemi yinelemekten çekinmeyeceğini söyledi ve FIMA imkânının önümüzdeki aylarda büyütülmesinin teşvik edilmesi gerektiğini belirtti. İmkânın bugünkü sınırları dar: New York Fed'de ABD tahvili tutan ülkeler yedi güne kadar en fazla 60 milyar dolar borçlanabiliyor ve faiz genellikle açık piyasa repo oranının üzerinde. Koşullardaki her değişiklik Açık Piyasa Komitesi'nin onayını gerektiriyor; komitenin eylül ortasından önce toplanması beklenmiyor."}, {"en": "Why the repo route matters shows up in Japan's portfolio. At the end of May, Japan held 1.14 trillion dollars of Treasuries, the largest holding of any foreign nation. Borrowing through the facility means yen purchases need not be funded by selling those securities outright. The market's question has therefore moved: not whether Tokyo can sell dollars once, but how many times it can fund itself without selling Treasuries. The opposite reading is defensible too. The level the yen sits at may reflect rate expectations and easing oil rather than the pledge, and the direction of a single session cannot separate those two explanations.", "refs": ["yen-fima", "yen-mof"], "tr": "Repo yolunun neden önemli olduğu Japonya'nın portföyünde görülüyor. Mayıs sonu itibarıyla Japonya 1,14 trilyon dolar tutarında ABD tahvili tutuyordu ve bu, yabancı ülkeler arasındaki en büyük tutar. Repo imkânı, yen alımını finanse etmek için bu tahvillerin doğrudan satılmasını gerektirmiyor. Piyasanın sorusu bu yüzden yer değiştirdi: Tokyo'nun bir kez dolar satabilip satamayacağı değil, tahvil satmadan kaç kez fonlanabileceği. Bunun tersi de savunulabilir; yenin bulunduğu düzey taahhüt yüzünden değil, faiz beklentileri ve petrol fiyatındaki gevşeme yüzünden de oluşmuş olabilir. Tek bir seansın yönü bu iki açıklamayı birbirinden ayırmaya yetmez."}]}, {"h": {"en": "What would show capacity behind the pledge", "tr": "Taahhüdün arkasında kapasite olduğunu ne gösterir"}, "ps": [{"en": "There is an observable threshold here. If the Federal Open Market Committee changes the size or the terms of the FIMA facility at or before its mid-September meeting, the pledge will be shown to have capacity behind it and not only intent. If the ceiling stays at 60 billion dollars and the maturity at seven days, each repetition of a joint intervention has to pass through the same narrow window. That says nothing about which way the currency goes. It says only which piece of news carries information about it.", "refs": ["yen-fima"], "tr": "Burada izlenebilir bir eşik var. Açık Piyasa Komitesi eylül ortasındaki toplantısında ya da öncesinde FIMA imkânının büyüklüğünü veya koşullarını değiştirirse, taahhüdün arkasında yalnızca niyet değil kapasite de bulunduğu görülür. Sınır 60 milyar dolar düzeyinde ve vade yedi günde kalırsa, ortak müdahale her tekrarında aynı dar pencereden geçmek zorunda kalır. Bu, yönün ne olacağını söylemez; yalnızca hangi haberin bu konuda bilgi taşıdığını söyler."}]}], "sources": [{"key": "yen-mof", "kind": "news", "name": "Ministry of Finance, Japan", "url": "https://www.mof.go.jp/english/public_relations/statement/others/20260803073000.html", "title": {"tr": "Japonya yeni ortak müdahaleden çekinmeyeceğini açıkladı ve Fed'in FIMA imkânını kullanmayı planlıyor", "en": "Japan said it would not hesitate to intervene jointly again and plans to use the Fed's FIMA facility"}, "publishedDate": "2026-08-03"}, {"key": "yen-fima", "kind": "news", "name": "CNA", "url": "https://www.channelnewsasia.com/business/bessent-ready-repeat-joint-yen-intervention-urges-bigger-fed-backstop-6294241", "title": {"tr": "Bessent, Fed'in FIMA repo imkânının büyütülmesi çağrısı yaptı", "en": "Bessent called for the Fed's FIMA repo facility to be made larger"}, "publishedDate": "2026-08-03"}, {"key": "midas-prior", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/economics-markets/eco-01/2026-08-02/", "title": {"tr": "Doları 158,9'dan 157,6'ya indiren alıcı piyasanın kendisi değildi", "en": "The buyer that took the dollar from 158.9 to 157.6 was not the market"}, "publishedDate": "2026-08-02"}], "title": {"en": "A standing bid changes what the tape has to price", "tr": "Sürekli bir alım taahhüdü, piyasanın fiyatlaması gerekeni değiştirir"}, "writer": "eco-01", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "A 48 per cent jump in quarterly profit reads like a markets story. The bank's own disclosure points somewhere quieter: the gap between what it charges on domestic loans and what it pays on deposits has widened.", "tr": "Çeyrek kârındaki yüzde 48'lik sıçrama piyasa haberi gibi okunuyor. Bankanın kendi açıklaması ise daha sessiz bir yere işaret ediyor: yurt içi kredilerden alınan faiz ile mevduata ödenen faiz arasındaki fark genişledi."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "Where the increase comes from", "tr": "Artışın geldiği yer"}, "ps": [{"en": "Mitsubishi UFJ Financial Group reported net profit of 809.4 billion yen for April to June, against 546 billion yen in the same period a year earlier. The bank said loan demand had stayed strong despite volatile global markets. The same disclosure shows the loan and deposit spread on domestic lending rising to 1.15 per cent from 0.95 per cent a year earlier.", "refs": ["mufg"], "tr": "Mitsubishi UFJ Financial Group nisan-haziran döneminde 809,4 milyar yen net kâr açıkladı; bir yıl önce aynı dönemde bu rakam 546 milyar yendi. Banka, küresel piyasalardaki oynaklığa rağmen kredi talebinin güçlü kaldığını bildirdi. Aynı açıklamada yurt içi kredilerde kredi-mevduat marjının bir yıl önceki yüzde 0,95'ten yüzde 1,15'e çıktığı yer alıyor."}, {"en": "An orthodox money-supply account would make the amount of lendable funds the leading variable. MUFG's disclosed ratios trace a pricing sequence instead: the loan side reset faster than the deposit side, so the gap opened as the two prices moved at different speeds. A shift in the lending mix or one-off items could also have contributed to the increase. That alternative would still have to explain why the bank's disclosed spread itself moved by twenty basis points.", "refs": ["mufg"], "tr": "Ortodoks para arzı anlatımı, ödünç verilebilir kaynak miktarını başlıca değişken sayar. MUFG'nin açıkladığı oranlar ise bir fiyatlama sırası gösteriyor: kredi tarafı mevduat tarafından daha hızlı yenilendi ve iki fiyat farklı hızlarda hareket edince aradaki fark açıldı. Kredi bileşimindeki kayma veya tek seferlik kalemler de artışa katkıda bulunmuş olabilir. Bu alternatif açıklamanın, bankanın açıkladığı marjın neden yirmi baz puan yükseldiğini de açıklaması gerekir."}]}, {"h": {"en": "Who stands on the other side of the spread", "tr": "Marjın karşı tarafında kim var"}, "ps": [{"en": "Banking has been among the largest beneficiaries of the end of deflation in Japan. Companies turned to borrowing to fund investment at home and abroad, capital spending and acquisitions. The two sides of the spread are receiving different rate adjustments: borrowers accept a higher price while depositors still receive the earlier one. Each additional basis point therefore widens the channel through which income moves from households and depositors towards the lending institution.", "refs": ["mufg"], "tr": "Bankacılık, Japonya'da deflasyonun sona ermesinden en çok yararlanan sektörlerden biri oldu. Şirketler yurt içinde ve yurt dışında yatırım, sermaye harcaması ve şirket satın almaları için borçlanmaya yöneldi. Marjın iki ucu farklı faiz ayarlamaları alıyor: borçlanan taraf daha yüksek bir fiyatı kabul ederken mevduat sahibi önceki getiriyi almaya devam ediyor. Eklenen her baz puan, gelirin hanelerden ve mevduat sahiplerinden borç veren kuruma aktığı kanalı genişletiyor."}, {"en": "Japan's three largest banks, MUFG, Sumitomo Mitsui Financial Group and Mizuho Financial Group, all posted record annual income last year and have forecast new records for the year ending March 2027. Through this balance-sheet channel, those forecasts rely on the spread remaining durable. Competition for deposits is the counterforce: if savers move towards higher-yielding products, deposit costs reset and the interval narrows. The order and timing of that adjustment remain fundamentally uncertain; today's data capture the loan side moving first.", "refs": ["mufg"], "tr": "Üç büyük Japon bankası, MUFG, Sumitomo Mitsui Financial Group ve Mizuho Financial Group, geçen yıl rekor yıllık gelir açıkladı ve mart 2027'de biten yıl için yeni rekorlar öngördü. Bu bilanço kanalı üzerinden bakıldığında öngörüler marjın kalıcılığına dayanıyor. Mevduat rekabeti bunun karşı kuvveti: tasarruf sahipleri getirisi daha yüksek ürünlere kayarsa mevduat maliyetleri yenilenir ve aralık daralır. Bu ayarlamanın sırası ile zamanlaması temel bir belirsizlik taşıyor; bugünkü veriler kredi tarafının önce hareket ettiğini gösteriyor."}]}, {"h": {"en": "What would show the channel working", "tr": "Kanalın çalıştığını ne gösterir"}, "ps": [{"en": "The two components of the spread carry more information about this channel than the headline profit figure. If the next quarterly disclosure keeps the loan and deposit gap above 1.15 per cent while deposit costs stay put, the income shift is continuing. Once deposit costs begin to rise, the spread narrows and the forecast of new records comes under pressure regardless of demand strength. The next disclosure therefore offers a direct test of which balance-sheet line is carrying the result.", "refs": ["mufg"], "tr": "Bu kanal hakkında başlıktaki kâr rakamından daha fazla bilgiyi marjın iki bileşeni taşıyor. Bir sonraki çeyrek açıklamasında kredi-mevduat farkı yüzde 1,15'in üzerinde kalıp mevduat maliyeti yerinde durursa gelir kayması sürüyor demektir. Mevduat maliyeti yükselmeye başladığında marj daralır ve rekor öngörüsü, talebin gücünden bağımsız olarak baskı altına girer. Böylece bir sonraki açıklama, sonucu hangi bilanço satırının taşıdığına doğrudan bir sınama sunacak."}]}], "sources": [{"key": "mufg", "kind": "news", "name": "CNA", "url": "https://www.channelnewsasia.com/business/mufgs-first-quarter-profit-soars-48-higher-loan-margins-6294866", "title": {"tr": "MUFG'nin çeyrek kârı yurt içi kredi marjının genişlemesiyle yüzde 48 arttı", "en": "MUFG's quarterly profit rose 48 per cent as its domestic loan margin widened"}, "publishedDate": "2026-08-03"}], "title": {"en": "Twenty basis points on the spread carried the profit line", "tr": "Kâr satırını taşıyan şey, faiz marjındaki yirmi baz puan"}, "writer": "eco-02", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "The chief financial officer states the reason plainly: the results are becoming evident in cash flow. Two numbers rise in the same announcement, and only one of them still has to earn its return.", "tr": "Finans direktörü gerekçeyi açıkça söylüyor: sonuçlar özellikle nakit akışında görülüyor. Aynı duyuruda iki rakam yükseliyor ve bunlardan yalnızca birinin getirisini kazanması gerekiyor."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "The two numbers in one announcement", "tr": "Aynı duyurudaki iki rakam"}, "ps": [{"en": "Marubeni raised planned investment by 250 billion yen to 1.35 trillion yen and lifted its shareholder-return target by 200 billion yen to 900 billion yen under its three-year plan to March 2028. Chief Financial Officer Chijo Tajima told reporters that the growth strategy was gaining momentum and that the results were becoming particularly evident in cash flow, adding that a robust investment pipeline had led the company to weight allocation towards investments offering relatively high returns.", "refs": ["marubeni"], "tr": "Marubeni, mart 2028'de biten üç yıllık iş planı kapsamında planlanan yatırımı 250 milyar yen artırarak 1,35 trilyon yene, ortaklara dönüş hedefini ise 200 milyar yen artırarak 900 milyar yene çıkardı. Finans direktörü Chijo Tajima gazetecilere büyüme stratejisinin ivme kazandığını ve sonuçların özellikle nakit akışında görüldüğünü söyledi; güçlü yatırım hattı nedeniyle görece yüksek getirili yatırımlara ağırlık verildiğini belirtti."}, {"en": "It is worth looking at where the cash funding both items comes from. Net profit for April to June rose 21 per cent to 186.4 billion yen, and the reason the company gave was higher prices for copper, aluminium and coking coal along with better performance in chemicals and aerospace. The engine of the quarter, in other words, was largely price. A cash flow driven by price is funding, at the same time, an irreversible commitment to shareholders and a three-year investment plan.", "refs": ["marubeni"], "tr": "Bu iki kalemi finanse eden nakdin nereden geldiğine bakmak gerekiyor. Nisan-haziran döneminde net kâr yüzde 21 artışla 186,4 milyar yene çıktı ve şirketin verdiği gerekçe bakır, alüminyum ve koklaşabilir kömür fiyatlarındaki yükseliş ile kimya ve havacılık işlerindeki iyileşme oldu. Yani çeyreğin motoru büyük ölçüde fiyat. Fiyat kaynaklı bir nakit akışı, ortaklara dönüş gibi geri alınamaz bir taahhüdü de üç yıllık bir yatırım planını da aynı anda finanse ediyor."}]}, {"h": {"en": "The assumption carrying the allocation", "tr": "Tahsisi taşıyan varsayım"}, "ps": [{"en": "Tajima's own price view shows which assumption the plan leans on. He expects copper to stay firm over the medium to long term on demand from artificial intelligence and semiconductors. For aluminium the picture differs: prices have retreated to pre-Middle East war levels and are expected to stay around there in the second half of fiscal 2026. The plan therefore rests on one leg firming and the other not falling further. That stands as a sensitivity point: if aluminium drops below current levels, the price-driven portion of cash flow narrows and the question arises of which of the two commitments gives way.", "refs": ["marubeni"], "tr": "Tajima'nın kendi fiyat görüşü, planın hangi varsayıma yaslandığını gösteriyor. Bakır fiyatlarının yapay zekâ ve yarı iletken talebiyle orta ve uzun vadede güçlü kalmasını bekliyor. Alüminyum için tablo farklı: fiyatlar Orta Doğu savaşı öncesi düzeylere geri çekildi ve 2026 mali yılının ikinci yarısında bu civarda seyretmesi bekleniyor. Plan böylece iki bacaktan birinin sertleşmesine, diğerinin ise daha fazla düşmemesine dayanıyor. Bu bir duyarlılık noktası olarak duruyor: alüminyum bugünkü düzeyin altına inerse, nakit akışının fiyat kaynaklı bölümü daralır ve iki taahhütten hangisinin esneyeceği sorusu doğar."}, {"en": "The second assumption is geographic. Tajima said a substantial share of new investment would concentrate in the United States, where geopolitical risks are lower and the company has a strong presence. A risk label is a qualitative input; the return on invested capital depends on entry price and on the cash the asset produces. Many buyers moving into the same region for the same reason can push asset prices up precisely because of that low-risk label. The case in the company's favour is equally clear: the contribution from chemicals and aerospace is independent of price, which means part of the cash flow is decoupled from the commodity cycle.", "refs": ["marubeni"], "tr": "İkinci varsayım coğrafi. Tajima'ya göre yeni yatırımın önemli bölümü, jeopolitik risklerin daha düşük olduğu ve şirketin güçlü bulunduğu ABD'de yoğunlaşacak. Risk tanımı nitel bir girdi; yatırılan sermayenin getirisi ise giriş fiyatına ve varlığın nakit üretimine bağlı. Aynı gerekçeyle aynı bölgeye yönelen çok sayıda alıcı, tam da o düşük risk etiketi yüzünden varlık fiyatlarını yukarı taşıyabilir. Şirketin lehine olan sav da açık: kimya ve havacılık katkısı fiyattan bağımsız ve bu, nakit akışının bir bölümünün emtia çevriminden ayrıştığı anlamına gelir."}]}, {"h": {"en": "The data that would close the question", "tr": "Soruyu kapatacak veri"}, "ps": [{"en": "The company said it would consider a possible upward revision to its full-year profit forecast alongside second-quarter results. The stated reason given for the revision will carry the information. If the upgrade is again attributed to commodity prices, the extra 250 billion yen of investment remains capital allocated at the top of a price cycle. If the reason shifts towards items independent of price, such as chemicals and aerospace, the tension between the higher investment target and the higher shareholder return genuinely eases. The open question is which line will show that distinction first.", "refs": ["marubeni"], "tr": "Şirket, ikinci çeyrek sonuçlarıyla birlikte yıl sonu kâr tahmininin yukarı çekilmesi ihtimalini değerlendireceğini söyledi. Asıl bilgiyi revizyonun gerekçesi taşıyacak. Yükseltme yine emtia fiyatlarına dayandırılırsa, 250 milyar yenlik ek yatırım fiyat çevriminin tepesinde tahsis edilmiş sermaye olarak kalır. Gerekçe kimya ve havacılık gibi fiyattan bağımsız kalemlere kayarsa, artırılan yatırım ile artırılan ortak getirisi arasındaki gerilim gerçekten azalır. Açık soru şu: bu ayrımı ilk gösterecek olan hangi satır?"}]}], "sources": [{"key": "marubeni", "kind": "news", "name": "CNA", "url": "https://www.channelnewsasia.com/business/marubeni-boosts-investment-shareholder-returns-after-strong-earnings-6294621", "title": {"tr": "Marubeni kârın yüzde 21 artmasının ardından yatırım ve ortak getirisi hedeflerini yükseltti", "en": "Marubeni raised its investment and shareholder-return targets after a 21 per cent rise in profit"}, "publishedDate": "2026-08-03"}], "title": {"en": "Who earns the extra 250 billion yen of investment?", "tr": "250 milyar yenlik ek yatırımın getirisini kim kazanacak?"}, "writer": "eco-03", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "Quota arithmetic assumes a barrel can be added next month. A damaged facility does not run on that calendar, and the monitoring committee has now written so in its own communiqué.", "tr": "Kota aritmetiği bir varilin gelecek ay eklenebileceğini varsayar. Hasar görmüş bir tesis o takvimle çalışmaz ve izleme komitesi bunu ilk kez kendi bildirisine yazdı."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "What the communiqué actually says", "tr": "Bildirinin gerçekte söylediği"}, "ps": [{"en": "The Joint Ministerial Monitoring Committee held its 67th meeting by videoconference. The committee, made up of Saudi Arabia, Russia, Iraq, Kuwait, Kazakhstan, Nigeria, Algeria and Venezuela, highlighted the critical importance of safeguarding international maritime routes so that energy keeps flowing without interruption, voiced concern about attacks on energy infrastructure, and noted that restoring damaged assets to full capacity is both costly and slow, which affects overall supply availability.", "refs": ["opec-jmmc"], "tr": "Ortak Bakanlar İzleme Komitesi altmış yedinci toplantısını video konferansla yaptı. Suudi Arabistan, Rusya, Irak, Kuveyt, Kazakistan, Nijerya, Cezayir ve Venezuela'dan oluşan komite, uluslararası deniz yollarının güvenliğinin enerji akışının kesintisiz sürmesi bakımından kritik olduğunu vurguladı, enerji altyapısına yönelik saldırılardan duyduğu endişeyi belirtti ve hasarlı tesislerin tam kapasiteye döndürülmesinin hem maliyetli olduğunu hem de uzun sürdüğünü, bunun arz bulunabilirliğini etkilediğini kaydetti."}, {"en": "These sentences need to be placed next to the production decision taken the same weekend. Seven OPEC+ countries raised their September output target by 188,000 barrels a day, and the group will pause further increases in the fourth quarter. A quota is a permission; production comes from a well, a processing plant and a loading terminal all working. The committee's own reference to repair time amounts to an acknowledgement that these two items do not move on the same calendar.", "refs": ["opec-quota", "opec-jmmc"], "tr": "Bu cümleleri, aynı hafta sonu alınan üretim kararının yanına koymak gerekiyor. Yedi OPEC+ ülkesi eylül ayı için üretim hedefini günde 188.000 varil artırdı ve grup dördüncü çeyrekte artışlara ara verecek. Kota bir izindir; üretim ise kuyunun, işleme tesisinin ve yükleme terminalinin çalışmasıyla oluşur. Komitenin kendi bildirisinde onarım süresinden söz etmesi, bu iki kalemin aynı takvimde hareket etmediğinin kabulü anlamına geliyor."}]}, {"h": {"en": "Why repair time is a supply variable", "tr": "Onarım süresi neden bir arz değişkenidir"}, "ps": [{"en": "Spare capacity is usable capacity only if the chain from well to port is intact. A field being able to lift so many barrels a day does not mean those barrels can be separated, stored and loaded onto a tanker. If any link in the chain is damaged, the quota moves the balance on paper while the physical balance waits as long as the repair takes. That is why the committee naming cost and time together matters: unlike a quota, rebuilding time is set by engineering and procurement.", "refs": ["opec-jmmc"], "tr": "Atıl kapasite, ancak kuyudan limana giden zincir sağlamsa kullanılabilir bir kapasitedir. Bir sahanın günde şu kadar varil çıkarabilecek durumda olması, o varilin ayrıştırılabilmesi, depolanabilmesi ve bir tankere yüklenebilmesi anlamına gelmez. Zincirin herhangi bir halkası hasar görürse, kota kâğıt üzerindeki dengeyi hareket ettirir, fiziksel denge ise onarım süresi kadar bekler. Komitenin maliyet ve süreyi birlikte anması bu yüzden önemli: yeniden inşa süresi, kotanın aksine, yeniden inşa süresini mühendislik ve tedarik belirler."}, {"en": "The opposite is possible too. A producer group placing infrastructure attacks in its communiqué may equally be read as political positioning; the committee names no facility, gives no measure of damage and no figure for barrels a day lost. The text can measure only one thing: that the monitoring committee has written a second constraint alongside its conformity tables. The committee reviewed crude production data for May and June and noted overall conformity among participating countries, and conformity does not show that the chain is intact.", "refs": ["opec-jmmc"], "tr": "Bunun tersi de mümkün. Bir üretici grubunun bildirisinde altyapı saldırılarına yer vermesi, siyasi bir konumlanma olarak da okunabilir; komite bildirisinde herhangi bir tesisin adını, hasarın büyüklüğünü ya da kaybedilen günlük varil miktarını vermiyor. Metnin ölçebildiği tek şey, izleme komitesinin uyum tablolarının yanına ikinci bir kısıt yazmış olmasıdır. Komite mayıs ve haziran ham petrol üretim verilerini gözden geçirerek katılımcı ülkelerin genel uyumunu kaydetmişti; uyum, zincirin sağlam olduğunu göstermez."}]}, {"h": {"en": "Where to look before 4 October", "tr": "4 Ekim'e kadar bakılacak yer"}, "ps": [{"en": "The committee's next meeting is set for 4 October 2026. Until then the information sits in whether two series diverge: the production a quota permits on one side, realised production on the other. If conformity data show the two nearly equal while loading schedules slip, the constraint sits in the chain. If the difference closes, the sentence in the communiqué remains a statement of intent.", "refs": ["opec-jmmc"], "tr": "Komitenin bir sonraki toplantısı 4 Ekim 2026'da yapılacak. O tarihe kadar bilgiyi taşıyacak olan, iki serinin birbirinden ayrışıp ayrışmadığıdır: bir yanda kotanın izin verdiği üretim, öbür yanda gerçekleşen üretim. Uyum verileri iki tarafı yüzde yüze yakın gösterirken yükleme programları gerilerse, kısıt zincirde bulunuyor. Aradaki fark kapanırsa, bildirideki cümle bir niyet beyanı olarak kalır."}]}], "sources": [{"key": "opec-jmmc", "kind": "news", "name": "OPEC", "url": "https://www.opec.org/pr-detail/1870612-2-august-2026.html", "title": {"tr": "OPEC+ izleme komitesi hasar gören enerji tesislerinin onarımının pahalı ve uzun olduğunu vurguladı", "en": "The OPEC+ monitoring committee stressed that repairing damaged energy assets is costly and slow"}, "publishedDate": "2026-08-02"}, {"key": "opec-quota", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/02/opec-agrees-output-rise-in-september-but-pauses-increase-from-fourth-quarter/", "title": {"tr": "Yedi OPEC+ ülkesi eylül kotasını günde 188.000 varil yükseltti", "en": "Seven OPEC+ countries lifted the September quota by 188,000 barrels a day"}, "publishedDate": "2026-08-02"}], "title": {"en": "The committee added a repair time to the oil balance", "tr": "Komite, petrol dengesine bir onarım süresi ekledi"}, "writer": "eco-04", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "The annual rate came down from 32.11 per cent to 31.75 per cent. Inside the same release, the two spending groups a low-income household cannot postpone rose 40.32 per cent and 37.53 per cent.", "tr": "Yıllık oran yüzde 32,11'den yüzde 31,75'e indi. Aynı açıklamanın içinde, düşük gelirli bir hanenin erteleyemediği iki harcama grubu yüzde 40,32 ve yüzde 37,53 arttı."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "One index, unequal baskets", "tr": "Tek bir endeks, eşit olmayan sepetler"}, "ps": [{"en": "TurkStat data put consumer prices 1.78 per cent above June and 31.75 per cent above a year earlier in July, with the annual rate at 32.11 per cent in June. Among the three heaviest spending groups, annual prices rose 40.32 per cent for housing, water, electricity, gas and other fuels, 37.53 per cent for food and non-alcoholic beverages and 30.83 per cent for transport. Transport is the only one of the three below the headline.", "refs": ["turkey-cpi"], "tr": "TÜİK verilerine göre tüketici fiyatları temmuzda aylık yüzde 1,78, yıllık yüzde 31,75 arttı. Yıllık oran haziranda yüzde 32,11 idi. Ağırlığı en yüksek üç harcama grubunda yıllık artış konut, su, elektrik, gaz ve diğer yakıtlarda yüzde 40,32; gıda ve alkolsüz içeceklerde yüzde 37,53; ulaştırmada yüzde 30,83 oldu. Manşetin altında kalan tek grup ulaştırma."}, {"en": "The headline rate is a number weighted to an average basket. For a household that spends a larger share of its income on food and housing, the increase that applies sits closer to those two group rates; for a household with smaller shares it can fall below the headline. The same release describes more than one price increase for the same month. The counterargument carries weight: the index is not designed to measure a particular income band, and its weights come from a national expenditure survey. The inference here is about direction, and a measured household rate is not published separately.", "refs": ["turkey-cpi"], "tr": "Manşet oran, ortalama bir sepete göre ağırlıklandırılmış bir sayıdır. Gelirinin daha büyük bölümünü gıdaya ve konuta ayıran bir hane için geçerli olan artış, bu iki grubun oranlarına daha yakın olur; bu payları daha düşük olan bir hane içinse manşetin altında kalabilir. Aynı açıklama, aynı ay için birden çok fiyat artışını tarif ediyor. Karşı sav da kayda değer: endeks belirli bir gelir dilimini ölçmek üzere tasarlanmadı ve ağırlıklar ulusal bir harcama araştırmasından geliyor. Bu yüzden buradaki çıkarım yön hakkındadır ve ölçülmüş bir hane oranı ayrıca yayımlanmıyor."}]}, {"h": {"en": "What the breadth figure says", "tr": "Yaygınlık sayısının söylediği"}, "ps": [{"en": "Of the 174 subclasses covered by the index, prices rose in 117, fell in 50 and were unchanged in seven. That shows the increase running across the whole basket. A broad increase weighs more heavily on a household without room to substitute: dropping one product for another offers no escape when two-thirds of prices are going up.", "refs": ["turkey-cpi"], "tr": "Endeksin kapsadığı 174 alt gruptan 117'sinde fiyatlar yükseldi, 50'sinde düştü, yedisinde değişmedi. Bu, artışın sepetin geneline yayıldığını gösteriyor. Yaygın bir artış, ikame imkânı olmayan hane için daha ağırdır: bir üründen vazgeçip diğerine geçmek, fiyatların üçte ikisi yükselirken bir kaçış yolu sunmaz."}, {"en": "The contribution arithmetic takes this a step further. Food and non-alcoholic beverages added 8.94 percentage points to annual inflation, transport 5.22 and housing 5.21. More than a quarter of the 31.75 per cent rate therefore comes from a single group, food. That contribution is computed with national weights; in a household whose food share is above the average, the same price movement produces a larger contribution. The release does not publish that household as a separate line, and this gap is where the argument is left to estimation.", "refs": ["turkey-cpi"], "tr": "Katkı aritmetiği bunu bir adım ileri taşıyor. Gıda ve alkolsüz içecekler yıllık enflasyona 8,94 puan, ulaştırma 5,22 puan, konut 5,21 puan katkı verdi. Yani yüzde 31,75'lik oranın dörtte birinden fazlası tek bir gruptan, gıdadan geliyor. Bu katkı, ulusal ağırlıklarla hesaplanmış bir sayıdır; gıda payı ortalamanın üzerinde olan bir hanede aynı fiyat hareketi daha büyük bir katkı üretir. Açıklama o haneyi ayrı bir satır olarak yayımlamıyor ve bu eksiklik, tartışmayı tahmine bırakan yer."}]}, {"h": {"en": "What would change the picture", "tr": "Tabloyu değiştirecek olan"}, "ps": [{"en": "What to watch in the coming releases is where the group rates sit relative to the headline. If the annual rates for housing and food start to fall below 31.75 per cent, the slowdown has reached spending that cannot be postponed. For as long as those two stay above the headline, a falling annual rate does not tell every household the same thing. On the monthly side, transport's 2.59 per cent rise is worth watching separately: that is the door through which energy costs enter the basket, and it is moving alongside the housing group's 2.25 per cent monthly increase.", "refs": ["turkey-cpi"], "tr": "Bir sonraki açıklamalarda izlenecek olan, grup oranlarının manşete göre konumu. Konut ve gıdanın yıllık oranları yüzde 31,75'in altına inmeye başlarsa, yavaşlama zorunlu harcamalara da ulaşmış olur. Bu iki grup manşetin üzerinde kaldığı sürece, düşen bir yıllık oran her hane için aynı şeyi anlatmaz. Aylık tarafta ulaştırmanın yüzde 2,59'luk artışı ayrıca izlenmeye değer; enerji maliyetinin sepete giriş kapısı orası ve konut grubunun yüzde 2,25'lik aylık artışıyla birlikte hareket ediyor."}]}], "sources": [{"key": "turkey-cpi", "kind": "news", "name": "Anadolu Agency", "url": "https://www.aa.com.tr/en/economy/turkiyes-annual-inflation-eases-to-3175-in-july-below-expectations/4016702", "title": {"tr": "Türkiye'de yıllık enflasyon temmuzda yüzde 31,75'e geriledi", "en": "Turkey's annual inflation eased to 31.75 per cent in July"}, "publishedDate": "2026-08-03"}], "title": {"en": "Housing rose 40.32 per cent while the headline slowed", "tr": "Manşet yavaşlarken konut yüzde 40,32 arttı"}, "writer": "eco-05", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "Seven months in, Vietnam's trade deficit stands at 20.5 billion dollars, already past the full-year record of 2008. The visible inflow of foreign direct investment over the same period was 15.2 billion dollars.", "tr": "Yedi ayda Vietnam'ın dış ticaret açığı 20,5 milyar dolar; bu, 2008'in tüm yıl rekorunu şimdiden geçti. Aynı dönemde görünen doğrudan yabancı yatırım girişi 15,2 milyar dolar."}, "radarPublishedAt": "2026-08-03T10:54:21+00:00", "sections": [{"h": {"en": "The size of the gap and what it is made of", "tr": "Açığın büyüklüğü ve bileşimi"}, "ps": [{"en": "National Statistics Office data show the July deficit widening from 2.64 billion dollars in June to 3.587 billion dollars. Exports rose 25 per cent from a year earlier to 53 billion dollars and imports 41 per cent to 56.67 billion dollars. Over January to July, exports grew 21.7 per cent to 320 billion dollars and imports 34.8 per cent to 340 billion dollars, leaving a seven-month deficit of 20.5 billion dollars, already beyond the full-year record of about 18 billion dollars set in 2008.", "refs": ["vietnam"], "tr": "Ulusal İstatistik Ofisi verilerine göre temmuzda açık haziranın 2,64 milyar dolar düzeyinden 3,587 milyar dolar düzeyine çıktı. İhracat yıllık yüzde 25 artışla 53 milyar dolar, ithalat yüzde 41 artışla 56,67 milyar dolar oldu. Ocak-temmuz döneminde ihracat yüzde 21,7 artarak 320 milyar dolar, ithalat yüzde 34,8 artarak 340 milyar dolar olarak gerçekleşti ve yedi aylık açık 20,5 milyar dolar düzeyine ulaştı; 2008'de görülen yaklaşık 18 milyar dolar olan tüm yıl rekoru şimdiden aşıldı."}, {"en": "The same data show which item is inflating the bill. In the first seven months crude oil imports fell 11.9 per cent by volume but rose 18 per cent by value, while refined fuel imports rose 6 per cent by volume and 67.6 per cent by value. The country bought less crude and paid more for it. This is a price-driven cost increase, and because it is an industrial input it is hard to cut.", "refs": ["vietnam"], "tr": "Faturayı büyüten kalemin ne olduğu aynı veride yazıyor. İlk yedi ayda ham petrol ithalatı miktar olarak yüzde 11,9 azalırken değer olarak yüzde 18 arttı; akaryakıt ithalatı miktar olarak yüzde 6, değer olarak yüzde 67,6 yükseldi. Yani ülke daha az ham petrol alıp daha çok ödedi. Bu, fiyat kaynaklı bir maliyet artışıdır ve sanayinin girdisi olduğu için kısılması kolay bir kalem sayılmaz."}]}, {"h": {"en": "Which account takes on the difference", "tr": "Farkı hangi hesap üstleniyor"}, "ps": [{"en": "The only large inflow visible in the same release is foreign direct investment, up 11.8 per cent over seven months to 15.2 billion dollars. The two are not the same account, and direct investment does not serve as a financing instrument for a trade gap, yet it is the only offsetting flow the release makes visible. The 5.3 billion dollar difference may have been met from worker remittances, the services balance, portfolio inflows or reserves. None of those items appears in this data set. A claim about fragility has to stop exactly here: what is missing is visibility.", "refs": ["vietnam"], "tr": "Aynı açıklamada görünen tek büyük giriş kalemi, yedi ayda yüzde 11,8 artışla 15,2 milyar dolar düzeyine ulaşan doğrudan yabancı yatırım. Bu ikisi aynı hesap değil ve doğrudan yatırım bir ticaret açığının finansman aracı sayılmaz; yine de açıklamada görünür olan tek karşı akım budur. Aradaki 5,3 milyar dolar tutarındaki fark, işçi gelirleri, hizmet dengesi, portföy girişleri ya da rezervlerden karşılanmış olabilir. Bu kalemlerin hiçbiri bu veri setinde yok. Kırılganlık iddiası tam da burada durmak zorunda: burada eksik olan görünürlüktür."}, {"en": "The resilience case deserves its full strength too. Exports grew 21.7 per cent over seven months, industrial production and retail sales each rose 14.5 per cent year on year in July, and much of the import bill consists of inputs to be processed and re-exported. In such a structure a widening deficit can be a leading indicator of future exports. Where that case is tested is the new 12.5 per cent US tariff imposed on 24 July under a forced-labour investigation, a finding Hanoi rejects. If the tariff slows the export leg, the deficit widens first, because the input imports have already been ordered.", "refs": ["vietnam"], "tr": "Dayanıklılık savını da tam gücüyle kurmak gerekir. İhracat yedi ayda yüzde 21,7 arttı, sanayi üretimi ve perakende satışlar temmuzda yıllık yüzde 14,5 büyüdü ve ithalatın büyük bölümü işlenip yeniden ihraç edilecek girdilerden oluşuyor. Böyle bir yapıda genişleyen açık, gelecek ihracatın öncü göstergesi olabilir. Bu savın sınandığı yer 24 Temmuz'da ABD tarafından zorla çalıştırma soruşturması kapsamında konulan yüzde 12,5'lik yeni gümrük vergisidir; Hanoi tespiti reddediyor. Vergi ihracat bacağını yavaşlatırsa, girdi ithalatı zaten sipariş edilmiş olduğu için açık önce genişler."}]}, {"h": {"en": "The falsifiable threshold", "tr": "Yanlışlanabilir eşik"}, "ps": [{"en": "One combination would turn this from arithmetic into pressure: the value of fuel imports continuing to rise while export growth slows. If both happen together, the monthly deficit moves above July's 3.587 billion dollars, and the narrow space between the government's 4.5 per cent inflation target and July's 4.45 per cent rate closes along with the fuel-driven cost. The monthly statistical releases publish both series together; what will locate the problem is whether those two lines move in the same direction.", "refs": ["vietnam"], "tr": "Bunu aritmetikten baskıya çevirecek olan tek bir birleşimdir: akaryakıt ithalatının değer artışı sürerken ihracat büyümesinin yavaşlaması. İkisi bir arada gerçekleşirse, aylık açık temmuzun 3,587 milyar dolar düzeyinin üzerine çıkar ve hükümetin yüzde 4,5'lik enflasyon hedefiyle temmuzdaki yüzde 4,45'lik oran arasındaki dar aralık da yakıt kaynaklı maliyetle birlikte kapanır. Aylık istatistik açıklamaları bu iki seriyi birlikte veriyor; sorunun yerini o iki satırın aynı yönde hareket edip etmediği gösterecek."}]}], "sources": [{"key": "vietnam", "kind": "news", "name": "CNA", "url": "https://www.channelnewsasia.com/business/vietnam-july-trade-deficit-widens-driven-higher-fuel-costs-6294366", "title": {"tr": "Vietnam'ın temmuz dış ticaret açığı 3,587 milyar dolar düzeyine çıktı", "en": "Vietnam's July trade deficit widened to 3.587 billion dollars"}, "publishedDate": "2026-08-03"}], "title": {"en": "What closes the gap when the fuel bill grows faster than the cargo?", "tr": "Yakıt faturası yükten hızlı büyürken açığı ne kapatıyor?"}, "writer": "eco-06", "n": 2, "date": "2026-08-03"}, {"excerpt": {"en": "Amazon crossed 3 trillion dollars in a session that carried no new company information. On a day like that, the useful question is which expectation the price was updating.", "tr": "Amazon, şirkete dair yeni bir bilginin açıklanmadığı bir işlem gününde 3 trilyon dolar sınırını aştı. Böyle bir günde asıl soru, fiyatın hangi beklentiyi güncellediğidir."}, "radarPublishedAt": "2026-08-03T17:30:17+00:00", "sections": [{"h": {"en": "Where the number came from", "tr": "Rakam nereden geldi?"}, "ps": [{"en": "The shares reached a record 285.01 dollars on Monday, up about 5 per cent, and Amazon's market value passed 3 trillion dollars for the first time. That put it alongside Apple, Microsoft, Alphabet and Nvidia, the only other companies to have reached that size, with Nvidia still the largest at about 5 trillion dollars. The stock is up 23 per cent this year.", "refs": ["amazon"], "tr": "Hisse pazartesi yüzde 5 civarında yükselerek 285,01 dolar ile rekor düzeye çıktı ve şirketin piyasa değeri ilk kez 3 trilyon dolar sınırını aştı. Bu, şirketi aynı büyüklüğe ulaşmış tek şirketler olan Apple, Microsoft, Alphabet ve Nvidia'nın yanına taşıdı; yaklaşık 5 trilyon dolar ile Nvidia en büyük olmayı sürdürüyor. Hisse bu yıl yüzde 23 kazandırdı."}, {"en": "The milestone did not arrive on its own. Last week's results produced the biggest one-day jump in the shares since April 2012, and that release is where the new information sat: the strongest cloud growth in more than four years, and a raised annual capital spending forecast. Monday added a second large move on top of a reaction that had already happened.", "refs": ["amazon"], "tr": "Bu eşik kendi başına gelmedi. Geçen haftaki bilanço, hissede nisan 2012'den bu yana görülen en sert günlük sıçramayı yarattı ve yeni bilgi de o açıklamanın içindeydi: bulut işinde dört yılı aşkın süredir görülen en hızlı büyüme ve yükseltilen yıllık sermaye harcaması öngörüsü. Pazartesi ise çoktan yaşanmış bir tepkinin üzerine ikinci bir büyük hareket ekledi."}]}, {"h": {"en": "What Monday actually repriced", "tr": "Pazartesi aslında ne fiyatlandı?"}, "ps": [{"en": "No fresh company disclosure landed between the two moves, so Monday's gain is best read as the market continuing to work through the same release rather than pricing anything new about the business. That reading is not the only one available: index and fund flows around a widely watched round-number threshold, and momentum in a stock that has led the market this year, would produce a similar session without any change in expectations about cash flow. Price and the day's direction cannot separate those two on their own.", "refs": ["amazon"], "tr": "İki hareket arasında şirkete ilişkin yeni bir açıklama gelmedi; dolayısıyla pazartesi kazancını, piyasanın işle ilgili yeni bir şeyi fiyatlamasından çok aynı bilançoyu sindirmeyi sürdürmesi olarak okumak daha doğru. Bu tek olası okuma değil: yakından izlenen yuvarlak bir eşik çevresindeki endeks ve fon akışları ile bu yıl piy
