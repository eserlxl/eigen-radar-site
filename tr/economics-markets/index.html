 and that tension in the Strait of Hormuz, which is pressing on global oil supply, needed watching: \"So we hope for the best in 2H2026, but we must be prepared for any possibility.\" He also pointed to the tourism contribution of the Formula One race at Sepang on 2-4 October."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": true, "topic": "economics-markets", "tag": "macro", "src": "Business Standard", "url": "https://www.business-standard.com/economy/news/india-china-border-trade-via-shipki-la-resumes-after-six-year-hiatus-126080100990_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Shipki La geçidinde Hindistan-Çin sınır ticareti altı yıl sonra yeniden başladı", "en": "India-China border trade restarted at the Shipki La pass after six years"}, "summary": {"tr": "Himaçal Pradeş'in Kinnaur ilçesindeki Namgya köyü üzerinden Tibet'e uzanan Shipki La geçidinde ticaret altı yıllık aranın ardından açıldı. İlk gün 16 tüccar yola çıktı.", "en": "Trade has reopened at the Shipki La pass, which runs from the village of Namgya in Himachal Pradesh's Kinnaur district into Tibet, after a six-year gap. Sixteen traders set off on the first day."}, "detail": {"tr": "Alışveriş takas yöntemiyle yapılıyor ve tüccarların işlemlerini 72 saat içinde tamamlayıp dönmesi gerekiyor. Hindistan tarafından 72, Tibet tarafından 30 ürün grubunun ticaretine izin veriliyor. Chhuppan'da 17 milyon rupi maliyetle bir ticaret merkezi kuruldu. Eyaletin Gelir ve Bahçe Bitkileri Bakanı Jagat Singh Negi, tüccarların Birlik Ticaret Bakanlığı'nın ithalat ve ihracat kurallarına uymak zorunda olduğunu söyledi.", "en": "Exchange is by barter and traders must complete their transactions and return within 72 hours. Seventy-two categories of goods are permitted from the Indian side and 30 from the Tibetan side. A trade mart has been built at Chhuppan at a cost of 17 million rupees. Jagat Singh Negi, the state's revenue and horticulture minister, said traders must comply with the import and export rules set by the Union commerce ministry."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": true, "topic": "economics-markets", "tag": "companies", "src": "Autocar India", "url": "https://www.autocarindia.com/industry/july-2026-car-sales-tata-holds-slim-lead-over-mahindra-440365", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Temmuzda Hindistan binek araç satışında Tata, Mahindra'yı 2.563 adet farkla geçti", "en": "Tata edged past Mahindra by 2,563 units in India's July passenger vehicle sales"}, "summary": {"tr": "Temmuz toptan satışlarında Maruti Suzuki 196.203 adetle ilk sırada yer aldı; Tata 62.611, Mahindra 60.048, Hyundai 54.210 adet bildirdi. Tata'nın elektrikli araç toptan satışı ilk kez ayda 15.000 adedi aştı.", "en": "Maruti Suzuki led July wholesales with 196,203 units, ahead of Tata on 62,611, Mahindra on 60,048 and Hyundai on 54,210. Tata's electric vehicle wholesales passed 15,000 in a month for the first time."}, "detail": {"tr": "Aylık değişimlerde Maruti haziranın 147.187 adedinden yüzde 33,30, Hyundai 39.635 adedinden yüzde 36,77 arttı; Hyundai'nin haziran üretimi bir tedarikçi tesisindeki yangın nedeniyle aksamıştı. Tata aylık yüzde 0,86 artarken Mahindra yüzde 0,57 geriledi. Yıllık artışlar Tata'da yüzde 58,42, Maruti'de yüzde 42,41, Hyundai'de yüzde 23,30, Mahindra'da yüzde 20,41 oldu. Toyota 30.516, Kia 28.200, MG 8.158, Nissan 4.518, Renault 3.293 adet sattı. MG'nin hacminin yüzde 80'inden fazlasını elektrikli araçlar oluşturdu; Nissan'ın yıllık yüzde 218 artışı 20 Temmuz'da başlayan Tekton teslimatlarına bağlandı.", "en": "Month on month, Maruti rose 33.30 percent from 147,187 units in June and Hyundai 36.77 percent from 39,635, after a fire at a supplier's plant disrupted Hyundai's June production. Tata gained 0.86 percent on the month while Mahindra fell 0.57 percent. Year on year the gains were 58.42 percent at Tata, 42.41 percent at Maruti, 23.30 percent at Hyundai and 20.41 percent at Mahindra. Toyota sold 30,516 units, Kia 28,200, MG 8,158, Nissan 4,518 and Renault 3,293. Electric vehicles made up more than 80 percent of MG's volumes, and Nissan's 218 percent annual gain was attributed to Tekton deliveries that began on 20 July."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": true, "topic": "economics-markets", "tag": "commodities", "src": "The Star", "url": "https://www.thestar.com.my/news/nation/2026/08/01/sabah-to-sign-agreement-with-petronas-for-40-stake-in-floating-liquefied-natural-gas-facility", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Sabah, Petronas'ın yüzen LNG projesinde yüzde 40 pay alacak", "en": "Sabah is to take a 40 percent stake in Petronas's floating LNG project"}, "summary": {"tr": "Sabah Başbakanı Hajiji Noor, Petronas ile anlaşmaya varıldığını ve eyaletin yüzen sıvılaştırılmış doğal gaz projesinde yüzde 40 pay alacağını açıkladı. İmzanın önümüzdeki aylarda atılması bekleniyor.", "en": "Sabah Chief Minister Hajiji Noor said terms have been agreed with Petronas under which the state will take a 40 percent stake in a floating liquefied natural gas project. The signing is expected within the next few months."}, "detail": {"tr": "Hajiji, eyaletin ayrıca Sandakan açıklarında yeni bulunan petrol ve gaz sahalarında yüzde 20 pay alacağını söyledi ve bunu eyalet ile federal hükümet arasındaki iş birliğinin sonucu olarak tanımladı. Başbakan, Petronas ile anlaşmaya varıldığını ve yakın gelecekte, belki önümüzdeki aylarda, Sabah'a yüzen gaz projesinde yüzde 40 pay verecek bir anlaşmanın imzalanacağını söyledi. Açıklamada proje değeri, kapasitesi veya devreye alma tarihi verilmedi.", "en": "Hajiji said the state would also take a 20 percent stake in newly discovered oil and gas fields off Sandakan, and described this as the result of cooperation between the state and federal governments: \"We have successfully reached an agreement with PETRONAS and in the near future, perhaps within the next few months, we will sign an agreement under which Sabah will receive a 40% stake in the floating gas project.\" No project value, capacity or start-up date was given."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Gestión", "url": "https://gestion.pe/economia/inei-precios-siguen-al-alza-inflacion-anual-aumento-407-en-julio-el-detalle-noticia/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Peru'da temmuz enflasyonu yıllık yüzde 4,07 ile hedef aralığının üzerinde kaldı", "en": "Peru's July inflation stayed above the target range at 4.07 percent"}, "summary": {"tr": "Ulusal istatistik kurumu INEI'ye göre Lima Metropolitana tüketici fiyatları temmuzda aylık yüzde 0,29, yıllık yüzde 4,07 arttı. Ülke genelinde aylık artış yüzde 0,30, yıllık artış yüzde 3,70 oldu.", "en": "According to the national statistics institute INEI, consumer prices in Lima Metropolitana rose 0.29 percent in July and 4.07 percent year on year. Nationally the monthly increase was 0.30 percent and the annual rate 3.70 percent."}, "detail": {"tr": "Lima'da ocak-temmuz birikimli artış yüzde 4,09, ülke genelinde yüzde 3,71 olarak verildi. Aylık artışa en çok katkı yapan gruplar gıda ve alkolsüz içecekler (yüzde 0,67), mobilya ve ev eşyaları (yüzde 0,44), iletişim (yüzde 0,25), çeşitli mal ve hizmetler (yüzde 0,24) ile eğlence ve kültür (yüzde 0,22) oldu. INEI Başkanı Gaspar Morán Flores, artışta kanatlı eti ve parçaları, tavuk yumurtası ile bazı meyve ve sebze fiyatlarının öne çıktığını, bazı gıda fiyatlarının ise gerilediğini belirtti. Haber, yıllık oranın hedef aralığının dışında kaldığını aktarıyor.", "en": "Cumulative inflation from January to July was given as 4.09 percent in Lima and 3.71 percent nationally. The divisions contributing most to the monthly rise were food and non-alcoholic beverages at 0.67 percent, furniture and household goods at 0.44 percent, communications at 0.25 percent, miscellaneous goods and services at 0.24 percent, and recreation and culture at 0.22 percent. INEI's head, Gaspar Morán Flores, pointed to poultry meat and cuts, chicken eggs and some fruit and vegetables, while noting that some food prices fell. The report says the annual rate remains outside the target range."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Business Standard", "url": "https://www.business-standard.com/finance/news/upi-transactions-hit-record-23-66-billion-in-july-value-rs-29-88-trillion-126080100548_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hindistan'da UPI işlem adedi temmuzda 23,66 milyara çıkarak en yüksek aylık düzeyi gördü", "en": "UPI transactions reached an all-time monthly high of 23.66 billion in India in July"}, "summary": {"tr": "NPCI verilerine göre temmuzda UPI üzerinden 29,88 trilyon rupi değerinde 23,66 milyar işlem gerçekleşti. Adet bir önceki aya göre yüzde 4,1, değer yüzde 3,3 arttı; yıllık artışlar sırasıyla yüzde 22 ve yüzde 19 oldu.", "en": "NPCI data show 23.66 billion UPI transactions worth 29.88 trillion rupees in July. Volume rose 4.1 percent and value 3.3 percent from the previous month, with annual increases of 22 percent and 19 percent respectively."}, "detail": {"tr": "IMPS sisteminde 7,12 trilyon rupi değerinde 364 milyon işlem yapıldı; aylık artış adette yüzde 3, değerde yüzde 5 oldu. Aynı sistemde yıllık adet yüzde 24 azalırken değer yüzde 13 arttı. IMPS'de günlük ortalama 11,75 milyon işlem ve 229,58 milyar rupi olarak verildi. FASTag işlemleri aylık yüzde 4 azalışla 347 milyona indi, değeri 71,43 milyar rupi oldu; günlük ortalama 11,21 milyon işlem ve 2,30 milyar rupi. Aadhaar tabanlı AePS sisteminde işlem adedi aylık yüzde 3 artışla 100 milyona, değer 275,39 milyar rupiye çıktı.", "en": "IMPS handled 364 million transactions worth 7.12 trillion rupees, up 3 percent in volume and 5 percent in value on the month. On the same system, annual volume fell 24 percent while value rose 13 percent. IMPS daily averages were given as 11.75 million transactions and 229.58 billion rupees. FASTag transactions fell 4 percent on the month to 347 million, worth 71.43 billion rupees, with daily averages of 11.21 million transactions and 2.30 billion rupees. On the Aadhaar-based AePS system, volume rose 3 percent on the month to 100 million and value to 275.39 billion rupees."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/turkiyenin-ham-celik-uretimi-yilin-ilk-yarisinda-yuzde-8-1-artisla-19-8-milyon-tona-cikti/4015581", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Türkiye'nin ham çelik üretimi ilk yarıda yüzde 8,1 artışla 19,8 milyon tona çıktı", "en": "Türkiye's crude steel output rose 8.1 percent to 19.8 million tonnes in the first half"}, "summary": {"tr": "Türkiye Çelik Üreticileri Derneği verilerine göre ocak-haziran döneminde ham çelik üretimi yüzde 8,1 artışla 19,8 milyon ton, nihai mamul tüketimi yüzde 6,6 artışla 19,9 milyon ton oldu.", "en": "Data from the Turkish Steel Producers Association show crude steel output of 19.8 million tonnes in January to June, up 8.1 percent, with final product consumption up 6.6 percent at 19.9 million tonnes."}, "detail": {"tr": "Haziranda üretim yüzde 14,7 artışla 3,3 milyon tona, tüketim yüzde 0,4 artışla 3,1 milyon tona geldi. İlk yarıda ihracat miktarda yüzde 2,5 artışla 7,8 milyon ton, değerde yüzde 1,3 artışla 5,3 milyar dolar; ithalat miktarda yüzde 0,3 artışla 9,3 milyon ton, değerde yüzde 2,4 azalışla 6,3 milyar dolar oldu. Haziranda ihracat miktarda yüzde 28,4, değerde yüzde 29,7 arttı; ithalat miktarda yüzde 0,8 azalırken değerde yüzde 3,7 arttı. İhracatın ithalatı karşılama oranı geçen yılın aynı döneminde yüzde 80 iken bu yıl yüzde 83'e çıktı. Derneğin genel sekreteri Veysel Yayan, sektörün uzun vadeli ve düşük maliyetli finansmana ihtiyaç duyduğunu, Eximbank desteğinin güçlendirilmesi ve yatırım kredisine erişimin kolaylaştırılması gerektiğini söyledi.", "en": "In June, output rose 14.7 percent to 3.3 million tonnes and consumption 0.4 percent to 3.1 million tonnes. First-half exports rose 2.5 percent by volume to 7.8 million tonnes and 1.3 percent by value to 5.3 billion dollars, while imports rose 0.3 percent by volume to 9.3 million tonnes and fell 2.4 percent by value to 6.3 billion dollars. June exports rose 28.4 percent by volume and 29.7 percent by value; imports fell 0.8 percent by volume but rose 3.7 percent by value. The ratio of exports to imports rose from 80 percent in the same period last year to 83 percent. The association's general secretary, Veysel Yayan, said the sector needs long-term, low-cost financing and called for stronger Eximbank support and easier access to investment credit."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/altinin-onsunda-ibre-5-ay-sonra-ilk-kez-yukari-dondu/4015572", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Ons altın temmuzu yüzde 1 artışla kapatarak beş ayın ardından ilk aylık yükselişini gördü", "en": "Gold ended July 1 percent higher, its first monthly gain in five months"}, "summary": {"tr": "Anadolu Ajansı'nın derlediği verilere göre ons altın temmuzu yüzde 1 artışla 4.046 dolardan kapattı. Gümüş ise yüzde 1,7 azalışla 57,70 dolardan kapandı.", "en": "Data compiled by Anadolu Ajansı show gold ended July 1 percent higher at 4,046 dollars an ounce. Silver closed 1.7 percent lower at 57.70 dollars."}, "detail": {"tr": "Habere göre önceki aylarda ons altın martta yüzde 11,3, nisanda yüzde 1, mayısta yüzde 1,8 ve haziranda yüzde 11,7 değer kaybetmişti; şubatta ise yüzde 8,5'lik bir hareket kaydedilmişti. Intesa Sanpaolo'nun kıdemli emtia ekonomisti Daniela Corsini, üçüncü çeyrek için ons başına 4.200 dolar, dördüncü çeyrek için 4.000 dolar ve 2027 ortalaması için 4.200 dolar öngördü. Corsini, önümüzdeki aylarda fiyatın yatay bir bantta sınırlı hareket etmesini beklediğini, destek bölgesinin 3.600-3.800 dolar aralığında olduğunu belirtti.", "en": "The report says gold lost 11.3 percent in March, 1 percent in April, 1.8 percent in May and 11.7 percent in June, with a move of 8.5 percent recorded in February. Daniela Corsini, senior commodity economist at Intesa Sanpaolo, forecast 4,200 dollars an ounce for the third quarter, 4,000 dollars for the fourth and an average of 4,200 dollars for 2027. Corsini said she expects limited movement within a horizontal band in the coming months, with support in the 3,600 to 3,800 dollar range."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Business Standard", "url": "https://www.business-standard.com/economy/news/more-than-59-million-itrs-filed-for-ay27-by-july-31-i-t-department-126080100491_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hindistan'da 31 Temmuz son tarihine kadar 59 milyondan fazla gelir vergisi beyannamesi verildi", "en": "More than 59 million income tax returns were filed in India by the 31 July deadline"}, "summary": {"tr": "Gelir Vergisi Dairesi cumartesi günü, 2026-27 değerlendirme yılı için 31 Temmuz'a kadar 59 milyondan fazla beyanname verildiğini duyurdu. Bu tarih, hesaplarını denetletmesi gerekmeyen mükellefler için geçerli olan son gündü.", "en": "The Income Tax Department said on Saturday that more than 59 million returns had been filed for assessment year 2026-27 by 31 July, the deadline for taxpayers who do not need their accounts audited."}, "detail": {"tr": "Daire rakamı sosyal medya hesabından duyurdu. Habere göre ITR-1 (Sahaj) formu yıllık geliri 50 lakh rupiye kadar olan yerleşik mükellefler için, ITR-2 formu ise ticari veya mesleki geliri bulunmayan ancak sermaye kazancı olan bireyler ve Hindu Birleşik Aileleri için kullanılıyor. Bir önceki yıl, 2025-26 değerlendirme yılı için uzatılan 16 Eylül 2025 tarihine kadar 73 milyondan fazla beyanname verilmişti.", "en": "The department published the figure on its social media account. The report notes that form ITR-1 (Sahaj) applies to resident taxpayers with annual income up to 50 lakh rupees, while ITR-2 covers individuals and Hindu Undivided Families with no business or professional income but with capital gains. A year earlier, more than 73 million returns were filed for assessment year 2025-26 by the extended deadline of 16 September 2025."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Nairametrics", "url": "https://nairametrics.com/2026/08/01/cardinal-torch-pivots-to-agro-processing-after-n10-billion-fundraising/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Cardinal Torch 10 milyar nairalık finansman bonosunu tamamen satıp tarımsal işlemeye yöneliyor", "en": "Cardinal Torch sold its entire 10 billion naira commercial paper and is moving into agro-processing"}, "summary": {"tr": "Nijeryalı emtia tüccarı Cardinal Torch, 10 milyar naira büyüklüğündeki birinci seri finansman bonosunun tamamına talep geldiğini açıkladı ve tarımsal değer zincirinde daha yüksek marj için işleme geçeceğini bildirdi.", "en": "The Nigerian commodity trader Cardinal Torch said its 10 billion naira Series 1 commercial paper was fully subscribed, and that it will move into processing to capture higher margins along the agricultural value chain."}, "detail": {"tr": "Şirketin genel müdürü David Oladunjoye Olurin, piyasaya 10 milyar naira için gittiklerini ve 10 milyar naira ile döndüklerini söyledi; şirketin bir sonraki aşamasının işleme olduğunu belirtti. Cardinal Torch kaju, soya ve kakao zincirlerinde işleme kapasitesi kuruyor; Ogun eyaletindeki Ishagamu'da günde 10 ton kapasiteli, ham kajuyu yarı işlenmiş ve tüketime hazır ürüne dönüştürecek bir tesisin yapımı tamamlanma aşamasında. Şirket uzun vadede halka açılmayı hedeflediğini bildirdi. Habere göre düzenleyici onaylar ve ortaklar kurulu kararlarına ilişkin ayrıntı verilmedi.", "en": "Managing director and chief executive David Oladunjoye Olurin said the company went to the market for 10 billion naira and came out with 10 billion naira, and that the next phase of the company is processing. Cardinal Torch is building processing capacity across the cashew, soybean and cocoa chains, and a 10-tonne-per-day plant at Ishagamu in Ogun State, designed to turn raw cashew nuts into semi-processed and ready-to-eat products, is nearing completion. The company said it aims to list publicly in the longer run. The report gives no detail on regulatory approvals or shareholder decisions."}, "radarPublishedAt": "2026-08-02T07:24:33.268660+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "Nikkei Asia", "url": "https://asia.nikkei.com/business/markets/currencies/us-treasury-intervenes-to-support-the-yen-after-japan-steps-in-ft-reports", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "ABD Hazinesi on yılı aşkın sürenin ardından yen alarak kur piyasasına girdi", "en": "The US Treasury bought yen for the first time in more than a decade"}, "summary": {"tr": "Financial Times'a dayandırılan habere göre New York Federal Rezerv Bankası, Hazine adına Goldman Sachs ve Morgan Stanley üzerinden euro satıp yen aldı; dolar 158,9 yenden 157,6 yene geriledi.", "en": "Citing the Financial Times, the report says the Federal Reserve Bank of New York sold euros for yen on the Treasury's behalf through Goldman Sachs and Morgan Stanley, and the dollar fell from about 158.9 yen to about 157.6."}, "detail": {"tr": "Nikkei Asia'nın Reuters ve Financial Times kaynaklı haberine göre işlem cuma günü yapıldı ve Washington'ın Tokyo ile birlikte yen alması on yılı aşkın sürede ilk oldu; ABD en son 2011'de, depremin ve tsunaminin ardından yene doğrudan destek vermişti. Yetkililer resmî bir tutar açıklamadı; Hazine Bakanı Scott Bessent'in not defterinde \"Buy Japanese Yen (JPY) $5-10 bil\" satırı görüldü. Dolar, New York seansının son saatlerinde (yaklaşık 21.00 GMT) 158,9 yenden 157,6 yene indi. Parite son haftalarda 1986'dan bu yana en yüksek düzey olan 164 yene yaklaşmıştı. Japonya perşembe günü kendi alımını yapmış, bu işlemlerin toplamı 58,97 milyar dolara kadar çıkmıştı; Tokyo cuma günü New York işlem saatlerinde yeniden devreye girdi.", "en": "Nikkei Asia, drawing on Reuters and Financial Times reporting, says the operation took place on Friday and was the first time Washington had bought yen alongside Tokyo in more than a decade; the last direct US support for the currency came in 2011, after the earthquake and tsunami. No official amount was disclosed, though Treasury Secretary Scott Bessent's notepad carried the line \"Buy Japanese Yen (JPY) $5-10 bil\". The dollar dropped from about 158.9 yen to about 157.6 in the late New York session, around 2100 GMT. It had recently climbed towards 164 yen, its strongest level against the Japanese currency since 1986. Japan bought yen on Thursday in operations that may have totalled as much as $58.97 billion, and Tokyo stepped in again on Friday during New York hours."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "The Korea Herald", "url": "https://www.koreaherald.com/article/10827727", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Güney Kore'nin temmuz ihracatı 98,89 milyar dolarla ikinci en yüksek aylık düzeye çıktı", "en": "South Korea's July exports hit $98.89 billion, its second highest monthly total"}, "summary": {"tr": "Ticaret bakanlığının cumartesi yayımladığı verilere göre ihracat yıllık yüzde 63 arttı; yarı iletken satışları yüzde 179 yükselerek 41 milyar dolara ulaştı, dış ticaret fazlası 30,32 milyar dolar oldu.", "en": "Trade ministry data published on Saturday showed exports up 63 percent from a year earlier, semiconductor shipments up 179 percent to $41 billion, and a trade surplus of $30.32 billion."}, "detail": {"tr": "Temmuz rakamı yalnızca haziranda kaydedilen 102,2 milyar dolarlık zirvenin gerisinde kaldı. İthalat yüzde 26,5 artışla 68,56 milyar dolara çıktı. Ülke bazında Çin'e ihracat neredeyse ikiye katlanarak 21,68 milyar dolara, ABD'ye ihracat yüzde 68,7 artışla 17,4 milyar dolara, Güneydoğu Asya'ya ihracat yüzde 73,7 artışla 18,8 milyar dolara ve Avrupa Birliği'ne ihracat yüzde 55,7 artışla 9,38 milyar dolara ulaştı. Sanayi Bakanı Kim Jung-kwan, 20 ana ihracat kaleminden 19'unun arttığını söylerken büyük ekonomilerde artan korumacılığa ve Orta Doğu'daki jeopolitik belirsizliğin sürmesine dikkat çekti.", "en": "The July figure trailed only the $102.2 billion record set in June. Imports rose 26.5 percent to $68.56 billion. By destination, shipments to China nearly doubled to $21.68 billion, exports to the United States rose 68.7 percent to $17.4 billion, sales to Southeast Asia climbed 73.7 percent to $18.8 billion and exports to the European Union increased 55.7 percent to $9.38 billion. Industry Minister Kim Jung-kwan said 19 of the country's 20 major export categories posted gains, while pointing to growing protectionism in major economies and continuing geopolitical uncertainty in the Middle East."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "crypto", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/merkez-bankasi-kripto-varlik-merkezi-kayit-sistemini-onayladi/4015685", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Merkez Bankası, Kripto Varlık Merkezi Kayıt Sistemi'nin işletilmesini MKK'ya bıraktı", "en": "Türkiye's central bank cleared the Central Registry Agency to operate a crypto asset registry"}, "summary": {"tr": "1 Ağustos'ta Resmî Gazete'de yayımlanan karar, Merkezi Kayıt Kuruluşu AŞ'nin menkul kıymet mutabakat sistemi işleticiliğinin yanı sıra Kripto Varlık Merkezi Kayıt Sistemi'ni de yürütmesine izin verdi.", "en": "A decision published in the Official Gazette on 1 August allows Merkezi Kayıt Kuruluşu to run a Crypto Asset Central Registry System in addition to operating the securities settlement system."}, "detail": {"tr": "Kararın adı \"Merkezi Kayıt Kuruluşu AŞ'nin Menkul Kıymet Mutabakat Sistemi İşleticiliği Faaliyetlerine İlave Olarak Yürütebileceği Diğer Faaliyetlere İlişkin Karar\" olarak geçiyor ve 6493 sayılı Kanun ile ilgili yönetmeliklere dayanıyor. Böylece kripto varlıkların merkezî kaydını tutma işi, MKK'nın hâlihazırda sahip olduğu mutabakat sistemi işleticiliği izninin kapsamına eklenmiş oldu. Karar, Resmî Gazete'de yayımlandığı 1 Ağustos 2026 tarihinde yürürlüğe girdi. Anadolu Ajansı'nın Gökhan Yıldız imzalı haberinde, düzenlemeye ilişkin ayrıca bir yetkili açıklamasına yer verilmedi.", "en": "The decision is titled \"Karar on other activities that Merkezi Kayıt Kuruluşu may carry out in addition to operating the securities settlement system\" and rests on Law No. 6493 and its related regulations. Keeping the central registry of crypto assets is therefore folded into the settlement-system operator authorisation the agency already holds. The decision took effect on 1 August 2026, the day it appeared in the Official Gazette. The Anadolu Agency report, bylined Gökhan Yıldız, carries no separate official comment on the measure."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Business Standard", "url": "https://www.business-standard.com/economy/news/gst-collections-rise-15-percent-to-rs-2-11-trillion-in-july-126080100511_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hindistan'ın temmuz GST tahsilatı yüzde 15,4 artarak 2,11 trilyon rupiye çıktı", "en": "India's July GST receipts rose 15.4 percent to 2.11 trillion rupees"}, "summary": {"tr": "Cumartesi açıklanan resmî verilere göre brüt tahsilat bir yıl öncesinin 1,83 trilyon rupisinden 2,11 trilyon rupiye yükseldi; artışın büyük bölümü ithalattan alınan vergiden geldi.", "en": "Official data released on Saturday put gross receipts at 2.11 trillion rupees, up from 1.83 trillion a year earlier, with most of the increase coming from tax collected on imports."}, "detail": {"tr": "Yurt içinden toplanan brüt vergi yüzde 10,1 artışla 1,45 trilyon rupi olurken, ithalattan alınan brüt vergi yüzde 28,8 artışla yaklaşık 665,1 milyar rupiye (66.511 crore) çıktı. İadeler sonrası net tahsilat yüzde 15,8 artışla 1,81 trilyon rupi oldu; net yurt içi kalem yüzde 10,5, net ithalat kalemi yüzde 30,3 yükseldi. Toplam iadeler yüzde 13,1 artarak yaklaşık 299,7 milyar rupiye ulaştı. Nisan-temmuz döneminde brüt tahsilat yüzde 10,1 artışla 8,43 trilyon rupi, net tahsilat yüzde 9,2 artışla 7,21 trilyon rupi oldu. 36 eyalet ve birlik bölgesinin 28'i artış kaydetti; Maharashtra, Gujarat, Karnataka ve Telangana çift haneli büyüdü.", "en": "Gross domestic collections rose 10.1 percent to 1.45 trillion rupees, while gross import collections increased 28.8 percent to about 665.1 billion rupees (66,511 crore). Net receipts after refunds were up 15.8 percent at 1.81 trillion rupees, with the net domestic component rising 10.5 percent and the net import component 30.3 percent. Total refunds rose 13.1 percent to roughly 299.7 billion rupees. For April to July, gross collections were up 10.1 percent at 8.43 trillion rupees and net collections up 9.2 percent at 7.21 trillion. Twenty-eight of 36 states and union territories recorded growth, with Maharashtra, Gujarat, Karnataka and Telangana in double digits."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Business Standard", "url": "https://www.business-standard.com/companies/news/maruti-suzuki-logs-record-july-domestic-pv-sales-jumps-34-to-241-421-unit-126080100614_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Maruti Suzuki'nin temmuz satışları 241.421 adede çıkarak yüzde 34 arttı", "en": "Maruti Suzuki's July sales rose 34 percent to 241,421 units"}, "summary": {"tr": "Hindistan'ın en büyük otomobil üreticisi, temmuzda yurt içi binek araç satışını yüzde 43,4 artırarak 196.203 adede taşıdı ve yurt içi toplam satışta tüm zamanların rekorunu kırdı.", "en": "India's largest carmaker lifted domestic passenger vehicle sales 43.4 percent to 196,203 units in July and set an all-time high for total domestic sales."}, "detail": {"tr": "Toplam satış bir yıl önceki 180.526 adetten 241.421 adede çıktı. Hafif ticari araçlar dâhil yurt içi toplam satış 200.123 adetle şirket tarihinin en yüksek düzeyine ulaştı. Segment kırılımında mini araçlar (Alto, S-Presso) 6.822'den 12.634 adede, kompakt araçlar (Baleno, Celerio, Dzire, Ignis, Swift, WagonR) 65.840'tan 90.822 adede, çok amaçlı araçlar (Brezza, Ertiga, e Vitara, Fronx, Grand Vitara, Invicto, Jimny, Victoris, XL6) 52.773'ten 78.851 adede, panelvanlar (Eeco) 12.341'den 13.896 adede ve hafif ticari araçlar (Super Carry) 2.794'ten 3.920 adede yükseldi.", "en": "Total sales rose from 180,526 units a year earlier to 241,421. Including light commercial vehicles, domestic sales of 200,123 units were the highest in the company's history. By segment, mini cars (Alto, S-Presso) went from 6,822 to 12,634 units, compact cars (Baleno, Celerio, Dzire, Ignis, Swift, WagonR) from 65,840 to 90,822, utility vehicles (Brezza, Ertiga, e Vitara, Fronx, Grand Vitara, Invicto, Jimny, Victoris, XL6) from 52,773 to 78,851, vans (Eeco) from 12,341 to 13,896 and light commercial vehicles (Super Carry) from 2,794 to 3,920."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "RTÉ", "url": "https://www.rte.ie/news/analysis-and-comment/2026/0801/1585993-nama-the-developers-the-banks-and-the-fallout/", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "İrlanda'nın sorunlu varlık kurumu NAMA 16 yılın ardından kapandı", "en": "Ireland's bad bank NAMA closed after 16 years"}, "summary": {"tr": "2009 sonunda kurulan Ulusal Varlık Yönetim Ajansı bu hafta sonu faaliyetini sonlandırdı; kurumun devlete devrettiği fazla, kurumlar vergisi dâhil 5,6 milyar euro olarak açıklandı.", "en": "The National Asset Management Agency, set up in late 2009, wound up this weekend, returning a surplus of 5.6 billion euros to the state including corporation tax."}, "detail": {"tr": "RTÉ'nin ekonomi editörü David Murphy'nin haberine göre NAMA, nominal değeri 74 milyar euro olan kredileri 32 milyar euroya, yani yüzde 58 iskontoyla satın almıştı. Kalan sekiz çalışan, Ulusal Hazine Yönetim Ajansı (NTMA) bünyesindeki bir tasfiye biriminde görevini sürdürecek. Aynı krizde Irish Nationwide ve Anglo Irish Bank tasfiye edildi ve vergi mükelleflerine 34 milyar euroluk kalıcı zarar bıraktı; AIB ile Bank of Ireland ise yeniden yapılandırılarak tahvil piyasasına döndü. Haberde Liam Carroll, Bernard McNamara ve Sean Dunne gibi müteahhitlerin dosyaları anlatılıyor; dönemin Maliye Bakanı Brian Lenihan'ın 2009'da bankalara yönelttiği \"vatandaşların sürdürdüğü desteğe ve sabra son derece minnettar olmalılar\" sözü aktarılıyor. Kurumun genel müdürü Brendan McDonagh, kapanışın ardından danışmanlık görevini sürdürüyor.", "en": "In an account by RTÉ economics editor David Murphy, NAMA bought loans with a face value of 74 billion euros for 32 billion, a discount of 58 percent. Its last eight staff move to a resolution operation inside the National Treasury Management Agency. In the same crisis Irish Nationwide and Anglo Irish Bank were liquidated, leaving a permanent 34 billion euro loss for taxpayers, while AIB and Bank of Ireland were restructured and returned to the bond markets. The piece traces the files of developers including Liam Carroll, Bernard McNamara and Sean Dunne, and recalls the then finance minister Brian Lenihan telling banks in 2009 that they \"should be extremely grateful for the continued support and forbearance extended by the citizens\". Chief executive Brendan McDonagh continued in an advisory role after the wind-up."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "companies", "src": "Business Standard", "url": "https://www.business-standard.com/amp/markets/capital-market-news/maruti-suzuki-q1-pat-slides-11-yoy-as-commodity-costs-rise-126080100206_1.html", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Maruti Suzuki'nin çeyrek net kârı yüzde 10,8 gerilerken net satışları yüzde 36,4 arttı", "en": "Maruti Suzuki's quarterly net profit fell 10.8 percent as net sales rose 36.4 percent"}, "summary": {"tr": "Haziranda biten çeyrekte şirketin solo net kârı yaklaşık 33,5 milyar rupiye indi; yönetim, hammadde maliyetlerinin Batı Asya'daki çatışmanın ardından sert biçimde yükseldiğini bildirdi.", "en": "In the quarter to June the company's standalone net profit fell to about 33.5 billion rupees, with management reporting that material costs rose sharply after the outbreak of the West Asia conflict."}, "detail": {"tr": "Net satışlar yüzde 36,4 artışla yaklaşık 499,6 milyar rupiye (49.959,10 crore) çıktı; vergi öncesi kâr yüzde 11,5 düşüşle yaklaşık 43,4 milyar rupi, faaliyet FAVÖK'ü yaklaşık 43,1 milyar rupi oldu. FAVÖK marjı bir yıl önceki yüzde 12,6 düzeyinden yüzde 8,6'ya indi. Hammadde maliyeti net satışların yüzde 74,5'inden yüzde 80,5'ine, yani 600 baz puan yukarı çıktı; buna karşılık personel gideri yüzde 5,6'dan yüzde 4,9'a, diğer giderler yüzde 12,7'den yüzde 11'e geriledi. Satış hacmi çeyrek bazında rekor kırarak yüzde 29,3 artışla 682.724 adede ulaştı; yurt içi küçük otomobil satışı yüzde 34,1, çok amaçlı araç satışı yüzde 44,6, ihracat yüzde 28,6 arttı ve pazar payı 2,3 puan yükselerek yüzde 41,2 oldu. Bayi stoku yaklaşık 13 gün. Yönetim kurulu ayrıca dört sıkıştırılmış biyogaz projesi için yaklaşık 5,61 milyar rupilik yatırımı onayladı.", "en": "Net sales rose 36.4 percent to about 499.6 billion rupees (49,959.10 crore), profit before tax fell 11.5 percent to roughly 43.4 billion rupees and operating EBITDA was about 43.1 billion. The EBITDA margin narrowed to 8.6 percent from 12.6 percent a year earlier. Material costs climbed to 80.5 percent of net sales from 74.5 percent, a move of 600 basis points, while employee costs eased to 4.9 percent from 5.6 percent and other expenses to 11.0 percent from 12.7 percent. Volumes set a quarterly record, up 29.3 percent at 682,724 units, with domestic small cars up 34.1 percent, utility vehicles up 44.6 percent and exports up 28.6 percent; market share rose 2.3 percentage points to 41.2 percent. Dealer inventory stood at about 13 days. The board also approved roughly 5.61 billion rupees of investment in four compressed biogas projects."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/argentina-and-south-korea-announce-critical-minerals-partnership.phtml", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Arjantin ile Güney Kore kritik mineral ortaklığı ilan etti, Posco'ya Salta'da genişleme onayı verildi", "en": "Argentina and South Korea announced a critical minerals partnership, with Posco cleared to expand in Salta"}, "summary": {"tr": "Cumhurbaşkanı Javier Milei ile Güney Kore Devlet Başkanı Lee Jae Myung'un Casa Rosada'daki görüşmesinin ardından açıklanan ortaklık, arama, çıkarma, işleme ve rafinasyonu kapsıyor.", "en": "Announced after a meeting between President Javier Milei and South Korean President Lee Jae Myung at the Casa Rosada, the partnership covers exploration, extraction, processing and refinement."}, "detail": {"tr": "Görüşme 31 Temmuz'da yapıldı; ortaklık, kritik minerallerin yanı sıra enerji, ticaret ve gıda alanlarındaki iş birliğini de içeriyor. Güney Koreli Posco'nun Salta'da lityum çıkarımını genişletmesine onay verildi: yatırım tutarı 547 milyon dolar, öngörülen üretim yılda 23 bin ton lityum karbonat ve beklenen yıllık ihracat 300 milyon doların üzerinde. Arjantin dünyanın beşinci büyük lityum üreticisi. Lee, 30 Temmuz'da Şili ile de aynı içerikte bir kritik mineral ortaklığı duyurmuştu; Şili bakırda dünya birincisi, lityumda ikinci sırada. Ziyaret, bir Güney Kore devlet başkanının 22 yıl sonra Arjantin'e yaptığı ilk ziyaret oldu. Arjantin tarafında görüşmeye Dışişleri Bakanı Pablo Quirno da katıldı.", "en": "The meeting took place on 31 July, and the partnership also covers energy, trade and food cooperation. South Korea's Posco was approved to expand lithium extraction in Salta, an investment of US$547 million projected to yield 23,000 tonnes of lithium carbonate a year and more than US$300 million in annual exports. Argentina is the world's fifth-largest lithium producer. Lee had announced an identical critical minerals partnership with Chile on 30 July; Chile leads the world in copper output and ranks second in lithium. The trip was the first visit to Argentina by a South Korean leader in 22 years. Foreign Minister Pablo Quirno attended on the Argentine side."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "South China Morning Post", "url": "https://www.scmp.com/business/banking-finance/article/3362358/china-cuts-durian-settlement-30-minutes-first-outbound-e-cny-payment-malaysia", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Çin'in Malezya'ya ilk yurt dışı e-CNY ödemesi durian sevkiyatının mutabakatını 30 dakikaya indirdi", "en": "China's first outbound e-CNY payment to Malaysia cut durian settlement to 30 minutes"}, "summary": {"tr": "China Construction Bank'ın Xiamen şubesi, taze durian sevkiyatı için 43 bin yuanlık (6.360 dolar) ödemeyi bankanın Labuan şubesine dijital yuanla gönderdi.", "en": "China Construction Bank's Xiamen branch sent a 43,000-yuan (US$6,360) payment for a fresh durian shipment to the bank's Labuan branch in digital yuan."}, "detail": {"tr": "İşlem, ocak 2026'daki gelen yönlü denemeyle başlayan ikili dijital para döngüsünü tamamladı. Swift muhabir ağı üzerinden yapılan geleneksel transferlerde mutabakat 1-3 iş günü sürerken, e-CNY düzeneğinde süre 30 dakikaya indi. Habere göre geleneksel sınır ötesi transferlerde işlem başına 25-35 dolar ücret ve yüzde 6'yı bulan takas masrafı doğuyordu; yeni yöntem aracı takas bankalarını devreden çıkarıp doğrudan Malezya ringgitine çevirmeye olanak tanıyor. Adım, Pekin'in Swift dışında, özellikle Güneydoğu Asya'ya uzanan sınır ötesi takas altyapısı kurma çabasının bir parçası.", "en": "The payment completed a bilateral digital-currency loop that began with an inbound trial in January 2026. Settlement through the traditional Swift correspondent network took one to three business days; the e-CNY arrangement brought that down to 30 minutes. According to the report, conventional cross-border transfers carried charges of US$25 to US$35 per transaction and clearing costs of 6 percent or more, while the new route removes intermediary clearing banks and converts directly into Malaysian ringgit. The step is part of Beijing's effort to build cross-border clearing infrastructure outside Swift, particularly across Southeast Asia."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/katilim-bankalari-yilin-ilk-yarisinda-119-5-milyar-liralik-sukuk-ihrac-etti/4015593", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Katılım bankaları yılın ilk yarısında 119,5 milyar lira kira sertifikası ihraç etti", "en": "Türkiye's participation banks issued 119.5 billion lira of sukuk in the first half"}, "summary": {"tr": "Türkiye Katılım Bankaları Birliği verilerine göre 2013'ten bu yana toplam ihraç 861,5 milyar liraya ulaştı; piyasada dolaşımdaki tutar 68,3 milyar lira, ortalama vade 139,97 gün.", "en": "Data from the Participation Banks Association of Türkiye put cumulative issuance since 2013 at 861.5 billion lira, with 68.3 billion outstanding and an average maturity of 139.97 days."}, "detail": {"tr": "Kuruluş bazında 2013'ten bu yana yapılan ihraçlarda Ziraat Katılım 197,8 milyar lira, Albaraka Türk 167,3 milyar lira, Türkiye Emlak Katılım 152 milyar lira, Vakıf Katılım 144,7 milyar lira, Kuveyt Türk 98,4 milyar lira ve Türkiye Finans 84,8 milyar lira ihraç gerçekleştirdi. Dünya Katılım'ın toplamı yaklaşık 11 milyar lira, Hayat Finans'ınki yaklaşık 5 milyar lira düzeyinde. Birliğin genel sekreteri İsmail Vural, ilk yarıdaki 119,5 milyar liralık ihracın sektörün finansal esnekliğine ve sürdürülebilir büyüme hedefine işaret ettiğini belirtti.", "en": "By institution, cumulative issuance since 2013 stands at 197.8 billion lira for Ziraat Katılım, 167.3 billion for Albaraka Türk, 152 billion for Türkiye Emlak Katılım, 144.7 billion for Vakıf Katılım, 98.4 billion for Kuveyt Türk and 84.8 billion for Türkiye Finans. Dünya Katılım accounts for about 11 billion lira and Hayat Finans for about 5 billion. The association's secretary general, İsmail Vural, said the 119.5 billion lira issued in the first half pointed to the sector's financial flexibility and its commitment to sustainable growth."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/turkiye-ile-maldivler-arasindaki-tercihli-ticaret-anlasmasi-yururluge-girdi/4015627", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Türkiye ile Maldivler arasındaki Tercihli Ticaret Anlaşması yürürlüğe girdi", "en": "The preferential trade agreement between Türkiye and the Maldives entered into force"}, "summary": {"tr": "Kasım 2024'te İstanbul'da imzalanan anlaşma 1 Ağustos itibarıyla uygulanmaya başladı; Türk ihracatçılar 404 üründe gümrük avantajı elde etti.", "en": "The agreement signed in Istanbul in November 2024 took effect on 1 August, giving Turkish exporters tariff advantages on 404 products."}, "detail": {"tr": "Anlaşmayı 4 Kasım 2024'te Ticaret Bakanı Ömer Bolat ile Maldivler Ekonomik Kalkınma ve Ticaret Bakanı Mohamed Saeed imzalamıştı; TBMM 9 Ekim 2025'te onayladı ve metin 19 Aralık 2025'te Resmî Gazete'de yayımlandı. Türkiye lehine avantaj sağlanan kalemler arasında çelik, alüminyum levha, elektrikli aksam, buzdolabı, klima, mobilya, plastik ve gıda ürünleri bulunuyor. Maldivler ise 154 tarife satırında, ağırlıklı olarak balıkçılık ürünlerinde indirim veya muafiyet elde etti. İki ülke arasındaki ticaret hacmi 2025'te 69 milyon dolar düzeyindeydi. Bolat, 293 tarife satırında Türkiye menşeli ürünlere uygulanan ortalama yüzde 16'lık gümrük vergisinin tümüyle kaldırıldığını, 111 satırdaki mevcut vergisiz girişin ise korunduğunu açıkladı.", "en": "The agreement was signed on 4 November 2024 by Trade Minister Ömer Bolat and Maldivian Economic Development and Trade Minister Mohamed Saeed; the Turkish parliament approved it on 9 October 2025 and the text appeared in the Official Gazette on 19 December 2025. Products gaining an advantage for Türkiye include steel, aluminium sheet, electrical components, refrigerators, air conditioners, furniture, plastics and food items. The Maldives obtained reductions or exemptions on 154 tariff lines, mainly for fish products. Bilateral trade was worth $69 million in 2025. Bolat said average customs duties of 16 percent on Turkish-origin goods were removed entirely across 293 tariff lines, while duty-free access already in place on 111 lines was preserved."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "macro", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/turkiyenin-kritik-teknoloji-ihracati-6-ayda-56-milyar-dolari-asti/4015600", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Türkiye'nin kritik teknoloji ihracatı yılın ilk yarısında 56,2 milyar dolara ulaştı", "en": "Türkiye's critical technology exports reached $56.2 billion in the first half"}, "summary": {"tr": "Türkiye İstatistik Kurumu verilerinden derlenen hesaba göre ileri ve orta-ileri teknoloji ürünlerinin ihracatı ocak-haziranda yıllık yüzde 8,4 arttı.", "en": "Figures compiled from Turkish Statistical Institute data show exports of high and medium-high technology products up 8.4 percent year on year in January to June."}, "detail": {"tr": "İleri teknoloji ürünlerinin ihracatı yüzde 3,3 artışla 4,5 milyar dolarda kalırken, orta-ileri teknoloji grubu yüzde 8,8 artışla 51,7 milyar dolara çıktı. Sektör kırılımında motorlu kara taşıtları 19,6 milyar dolar, kimyasal madde ve ürünler 9,8 milyar dolar, elektrikli teçhizat 9,6 milyar dolar, makine ve ekipman 9,3 milyar dolar, silah ve mühimmat 2,5 milyar dolar, bilgisayar ile elektronik ve optik ürünler 1,7 milyar dolar, hava taşıtı ve uzay aracı imalatı 1,6 milyar dolar, temel eczacılık ürünleri 1,3 milyar dolar ihracat gerçekleştirdi.", "en": "Exports of high-technology products rose 3.3 percent to $4.5 billion, while the medium-high technology group increased 8.8 percent to $51.7 billion. By sector, motor vehicles accounted for $19.6 billion, chemicals and chemical products $9.8 billion, electrical equipment $9.6 billion, machinery and equipment $9.3 billion, weapons and ammunition $2.5 billion, computers, electronic and optical products $1.7 billion, aircraft and spacecraft manufacturing $1.6 billion and basic pharmaceutical products $1.3 billion."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "commodities", "src": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/oil-billionaire-hamm-seeks-to-expand-in-argentinas-shale-patch.phtml", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Continental Resources, Neuquén'in 15 kaya sahası ihalesine talip oldu", "en": "Continental Resources is bidding for 15 shale blocks in Neuquén's auction"}, "summary": {"tr": "Harold Hamm'in şirketi, Neuquén eyaletinin düzenlediği ve teklifleri 19 Ağustos'ta açılacak ihalede Vaca Muerta'daki 15 blok için yarışıyor.", "en": "Harold Hamm's company is competing for 15 blocks in Vaca Muerta in an auction run by Neuquén province, with bids opening on 19 August."}, "detail": {"tr": "Continental, geçen yıl yerel üretici Pluspetrol'den varlık satın almış, ocak 2026'da da yarısı BP'ye ait olan Pan American Energy Group'un işlettiği bloklarda pay almıştı. Vaca Muerta havzası hâlihazırda günde bir milyon varilin üzerinde petrol ve gaz üretiyor; gelecek yıl devreye girecek VMOS ihracat boru hattı ve limanı üretimin artırılmasına imkân tanıyacak, ayrıca sıvılaştırılmış doğal gaz sevkiyatı planları sürüyor. Chevron da Milei yönetiminin vergi indirimi ve teşvik içeren programı kapsamında ek Vaca Muerta sahalarını geliştirmeye karar verdi; karar Arjantin tarafının onayını bekliyor. Continental yorum yapmayı reddetti, Neuquén eyalet yönetimi ise soruları yanıtlamadı.", "en": "Continental bought assets from the local driller Pluspetrol last year and in January 2026 took stakes in blocks operated by Pan American Energy Group, which is half-owned by BP. The Vaca Muerta basin already produces more than a million barrels a day of oil and gas; the VMOS export pipeline and port due to start next year will allow output to rise, and plans for liquefied natural gas shipments are also under way. Chevron has decided to develop additional Vaca Muerta acreage under a Milei administration scheme offering tax cuts and other benefits, a decision still awaiting Argentine approval. Continental declined to comment and the Neuquén provincial administration did not respond to questions."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}, {"featured": false, "topic": "economics-markets", "tag": "markets", "src": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/spkden-yatirim-fonlari-rehber-taslagi-aciklamasi/4015696", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "SPK, Yatırım Fonları Rehber Taslağı'nın tamamlandığı iddialarını yalanladı", "en": "Türkiye's Capital Markets Board denied reports that its investment funds guide draft was finalised"}, "summary": {"tr": "Kurul, bazı yayın organlarında ve sosyal medyada taslağın bitirildiği ve uygulama tarihinin belirlendiği yönünde çıkan haberlerin gerçeği yansıtmadığını bildirdi.", "en": "The board said reports in some outlets and on social media claiming the draft had been completed and given an implementation date did not reflect the facts."}, "detail": {"tr": "Açıklamaya göre rehber taslağı üzerindeki çalışma sürüyor; tamamlanma ya da yürürlük tarihi belirlenmiş değil. Kurul, metni yatırımcının korunması ile sermaye piyasasının güvenilir, şeffaf ve etkin işleyişi ilkeleri doğrultusunda hazırladığını, süreçte Borsa İstanbul, Türkiye Sermaye Piyasaları Birliği, ilgili kamu kurumları, özel sektör temsilcileri ile yurt içi ve yurt dışı yatırımcıların görüşlerini aldığını belirtti. Açıklamada, tüm yatırımcılara bilgi akışının eş anlı ve şeffaf olması gerektiği vurgulandı ve çalışma tamamlandığında duyuruların kurulun kendi kanallarından yapılacağı bildirildi.", "en": "According to the statement, work on the draft guide is continuing and no completion or entry-into-force date has been set. The board said it was preparing the text in line with the principles of investor protection and the reliable, transparent and effective functioning of the capital market, and that it was taking views from Borsa İstanbul, the Turkish Capital Markets Association, relevant public institutions, private sector representatives and both domestic and foreign investors. The statement stressed that information must reach all investors simultaneously and transparently, and said announcements would be made through the board's own channels once the work is complete."}, "radarPublishedAt": "2026-08-01T23:18:53.115315+00:00", "editionDate": "2026-08-02"}], "visualBriefs": [{"id": "eco-energy-capital-reallocation", "topic": "economics-markets", "title": {"tr": "Enerji sermayesi satış, dağıtım ve halka arz arasında yer değiştiriyor", "en": "Energy capital is moving among sales, distributions and a listing"}, "summary": {"tr": "BP'nin Kuzey Denizi satışı, ExxonMobil'in yüksek kârı ve Westinghouse'un gizli halka arz başvurusu; olgun enerji varlıklarının farklı sahiplik ve nakit kanallarına taşındığını gösteriyor.", "en": "BP's North Sea sale, ExxonMobil's high earnings and Westinghouse's confidential IPO filing show mature energy assets moving through different ownership and cash channels."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-1280.b549709fba18.webp", "variants": [{"src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-640.84ef6ca4bce5.webp", "width": 640}, {"src": "/assets/briefs/2026-08-01/eco-energy-capital-reallocation-1280.b549709fba18.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Enerji varlığını satış, borç azaltımı ve halka açılma yönlerine dağıtan döner platform", "en": "Turntable reallocating an energy asset toward sale, debt reduction and a public listing"}, "generatedAt": "2026-08-01"}, "editionDate": "2026-08-01", "n": 1, "hasAnalysis": true}, {"id": "eco-market-rulebook-rewrites", "topic": "economics-markets", "title": {"tr": "Piyasa kural kitabı fiyat, referans ve erişim katmanlarında değişiyor", "en": "Market rulebooks are changing across price, benchmark and access layers"}, "summary": {"tr": "FCA'nın konsolide hisse şeridi, ADNOC'un yeni petrol referansı ve Fed'in içeriden kredi kuralı; piyasa sonucundan önce çalışan üç altyapı katmanını yeniden tanımlıyor.", "en": "The FCA's consolidated equity tape, ADNOC's new oil benchmark and the Fed's insider-lending rule redefine three infrastructure layers that operate before a market outcome."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-08-01/eco-market-rulebook-rewrites-1280.82cb8563d201.webp", "variants": [{"src": "/assets/briefs/2026-08-01/eco-market-rulebook-rewrites-640.2e5391ba180f.webp", "width": 640}, {"src": "/assets/briefs/2026-08-01/eco-market-rulebook-rewrites-1280.82cb8563d201.webp", "width": 1280}], "w ": [{"writer": "eco-01", "title": {"tr": "Doları 158,9'dan 157,6'ya indiren alıcı piyasanın kendisi değildi", "en": "The buyer that took the dollar from 158.9 to 157.6 was not the market"}, "excerpt": {"tr": "Kur, bir seansın son saatinde 1,3 yen değer kazandı. Hareketin arkasında beklentilerin değişmesi değil, mekaniği anlatılmış bir resmî alım vardı; ikisinin ömrü aynı olmuyor.", "en": "The exchange rate moved 1.3 yen in the closing hour of a session. Behind it was not a change in expectations but an official purchase whose mechanics have been described, and the two do not last equally long."}, "sections": [{"h": {"tr": "Fiyatı taşıyan emir kimin", "en": "Whose order carried the price"}, "ps": [{"tr": "Nikkei Asia'nın aktardığına göre New York Federal Rezerv Bankası, ABD Hazinesi adına Goldman Sachs ve Morgan Stanley üzerinden euro satıp yen aldı. Dolar, New York seansının sonuna doğru 158,9 yenden 157,6 yene indi; parite son haftalarda 1986'dan bu yana en yüksek düzey olan 164 yene yaklaşmıştı. Resmî bir tutar açıklanmadı, ancak Hazine Bakanı Scott Bessent'in not defterinde 5 ila 10 milyar dolar tutarında yen alımını gösteren bir satır göründü.", "en": "Nikkei Asia reports that the Federal Reserve Bank of New York sold euros for yen on behalf of the US Treasury through Goldman Sachs and Morgan Stanley. The dollar fell from about 158.9 yen to about 157.6 towards the end of the New York session, after approaching 164 yen in recent weeks, its strongest level against the Japanese currency since 1986. No official amount was published, though Treasury Secretary Scott Bessent's notepad showed a line indicating yen purchases of 5 to 10 billion dollars.", "refs": ["yen-operation"]}, {"tr": "Bu, fiyatın kendi kendine yeniden değerlenmesinden farklı bir işlem türü. Alıcı, kâr hedefi olmayan ve tutarını açıklamak zorunda bulunmayan bir kamu kurumu; satış tarafında ise euro var, yani işlem bir üçüncü para birimi üzerinden kuruluyor. Aynı hareketin daha sıradan bir açıklaması da mümkün: hafta sonuna girerken yen aleyhine kurulmuş pozisyonların kapatılması, resmî alımın yarattığı ilk kıpırdanmayı büyütmüş olabilir. Elimizdeki kamuya açık bilgi, bu iki etkinin payını ayırmaya yetmiyor.", "en": "That is a different kind of transaction from a price repricing itself. The buyer is a public institution with no profit target and no obligation to disclose its size, and the sell side is the euro, so the trade runs through a third currency. A more ordinary explanation of the same move is also available: positions built against the yen being closed into the weekend may have amplified the first ripple the official purchase created. The public information available does not let us separate the two shares.", "refs": ["yen-operation"]}]}, {"h": {"tr": "Ölçek karşılaştırması ne söylüyor", "en": "What the comparison of scale says"}, "ps": [{"tr": "Ölçekler eşit değil. Japonya perşembe günü kendi alımını yaptı ve bu işlemlerin toplamı 58,97 milyar dolar düzeyine kadar çıktı; Tokyo cuma günü New York işlem saatlerinde ikinci kez devreye girdi. Washington tarafında ise açıklanmış tek rakam, bir not defterinde görülen 5 ila 10 milyar dolar aralığı. ABD'nin yene doğrudan destek verdiği son tarih 2011, yani depremin ve tsunaminin ardından gelen dönem.", "en": "The scales are not equal. Japan bought yen on Thursday in operations that may have totalled as much as 58.97 billion dollars, and Tokyo stepped in a second time on Friday during New York hours. On the Washington side the only figure in circulation is the 5 to 10 billion dollar range seen on a notepad. The last time the United States supported the yen directly was 2011, in the period after the earthquake and tsunami.", "refs": ["yen-operation"]}, {"tr": "Buradan bir yön tahmini çıkmaz, ama izlenebilir bir eşik çıkar. Eylül sonuna kadar dolar/yen, açıklanmış yeni bir resmî işlem olmadan yeniden 164 seviyesine yaklaşırsa, cuma günkü adım eğilimi çeviren değil belirli bir bölgeyi savunan bir müdahale olarak okunacaktır. Bunun tersi de aynı ölçüde bilgi verir: parite bu aralığın altında kalır ve Tokyo yeni bir alım açıklamazsa, tek bir işlemin beklentiyi değiştirmeye yettiği savı güçlenir. Sinyal, tarafların açıkladığı bir sonraki resmî müdahale rakamı ve bu süre boyunca kurun izlediği bant.", "en": "None of this yields a direction, but it does yield a threshold that can be watched. If dollar-yen returns towards 164 before the end of September without a further disclosed official operation, Friday's step will read as a defence of a particular area rather than a turn in the trend. The reverse is just as informative: if the rate stays below that range and Tokyo announces no new purchase, the case that a single operation was enough to move expectations grows stronger. The signal is the next official intervention figure either side publishes, and the band the rate holds in the meantime.", "refs": ["yen-operation"]}]}], "sources": [{"key": "yen-operation", "kind": "news", "name": "Nikkei Asia", "url": "https://asia.nikkei.com/business/markets/currencies/us-treasury-intervenes-to-support-the-yen-after-japan-steps-in-ft-reports", "title": {"tr": "ABD Hazinesi on yılı aşkın sürenin ardından yen alarak kur piyasasına girdi", "en": "The US Treasury bought yen for the first time in more than a decade"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-02", "title": {"tr": "Tahsilatı hızlandıran vergi nerede alındı?", "en": "Where was the tax that accelerated the collection actually levied?"}, "excerpt": {"tr": "Hindistan'ın temmuz dolaylı vergi tahsilatı yüzde 15,4 arttı. Aynı tahsilatın iki kalemi ise çok farklı hızlarda büyüdü ve bu fark, harcamanın nerede yapıldığını anlatıyor.", "en": "India's indirect tax take rose 15.4 percent in July. The two components of that same collection grew at very different speeds, and the gap says something about where the spending happened."}, "sections": [{"h": {"tr": "Tek başlık, iki hız", "en": "One headline, two speeds"}, "ps": [{"tr": "Temmuzda brüt mal ve hizmet vergisi tahsilatı 2,11 trilyon rupiye çıktı; bir yıl önce 1,83 trilyon rupiydi. Manşetin altında iki ayrı seri var: yurt içinden toplanan brüt vergi yüzde 10,1 artışla 1,45 trilyon rupi olurken, ithalattan alınan brüt vergi yüzde 28,8 artışla yaklaşık 665,1 milyar rupiye ulaştı. İadeler sonrası net tahsilat yüzde 15,8 arttı ve net ithalat kalemindeki artış yüzde 30,3'e çıktı.", "en": "Gross goods and services tax collections came to 2.11 trillion rupees in July, against 1.83 trillion a year earlier. Underneath the headline sit two separate series: gross domestic collections rose 10.1 percent to 1.45 trillion rupees, while gross collections on imports rose 28.8 percent to about 665.1 billion. Net of refunds the total was up 15.8 percent, and the net import component rose 30.3 percent.", "refs": ["india-gst"]}, {"tr": "Bu iki kalem aynı ekonomik olayı ölçmüyor. İthalat vergisi sınırda, malın gümrük değeri üzerinden tahsil ediliyor; yurt içi kalem ise ülke içindeki katma değere bağlı. İkisi arasındaki 18 puanlık büyüme farkı, vergilendirilen akışın ağırlıklı olarak dışarıdan geldiğine işaret ediyor. Bunun tek açıklaması iç talebin ithal mala kayması değil: kur ya da fiyat etkisi ithalatın rupi cinsinden değerini yukarı çekebilir, gümrük tarifelerinde beklenen bir değişiklikten önce stok yapılması da aynı sonucu birkaç ay boyunca üretebilir. Aylık tahsilat verisi bu ihtimalleri birbirinden ayırmıyor.", "en": "The two lines do not measure the same economic event. Import tax is collected at the border on the customs value of goods, while the domestic line depends on value added inside the country. The 18-point gap in growth points to the taxed flow arriving largely from abroad. A shift of domestic demand towards imported goods is not the only reading: an exchange rate or price effect can lift the rupee value of imports, and stockpiling ahead of an expected tariff change can produce the same result for a few months. A monthly collection series does not separate those possibilities.", "refs": ["india-gst"]}]}, {"h": {"tr": "Manşetin altındaki kümülatif rakam", "en": "The cumulative figure beneath the headline"}, "ps": [{"tr": "Nisan-temmuz döneminin tamamına bakıldığında brüt tahsilat yüzde 10,1, net tahsilat yüzde 9,2 artmış durumda. Yani mali yılın ilk dört ayının ortalaması, temmuzun tek başına gösterdiği yüzde 15,4'ün belirgin biçimde altında. Bir aylık hızlanma henüz bir eğilim değil; dört aylık ortalama ile tek ay arasındaki bu fark, temmuz rakamını bir dönüm noktası saymadan önce beklemeyi gerektiriyor.", "en": "Across April to July as a whole, gross collections are up 10.1 percent and net collections 9.2 percent. The average for the first four months of the fiscal year therefore sits well below the 15.4 percent that July shows on its own. One month of acceleration is not yet a trend, and the distance between the four-month average and the single month argues for waiting before treating July as a turning point.", "refs": ["india-gst"]}, {"tr": "Yurt içi tarafın nasıl okunacağı da tek bir seriden çıkmıyor. Aynı ay içinde Maruti Suzuki, yurt içi binek araç satışını yüzde 43,4 artırarak 196.203 adede taşıdı ve toplam yurt içi satışta şirket rekoru kırdı. Yurt içi verginin yüzde 10,1 artarken dayanıklı tüketim malında bu ölçekte bir hacim artışının görülmesi, tahsilatın ürün bileşimine ve vergi oranlarına duyarlı olduğunu hatırlatıyor. İzlenecek işaret basit: ağustos ve eylül tahsilatlarında ithalat kaleminin yurt içi kalemin üzerinde büyümeye devam edip etmediği.", "en": "How to read the domestic side does not follow from one series either. In the same month Maruti Suzuki lifted domestic passenger vehicle sales 43.4 percent to 196,203 units and set a company record for total domestic sales. Domestic tax growing 10.1 percent while a durable good posts volume growth on that scale is a reminder that the collection is sensitive to product mix and to tax rates. The signal to watch is straightforward: whether the import line keeps outgrowing the domestic line in the August and September collections.", "refs": ["india-gst", "maruti-july-volumes"]}]}], "sources": [{"key": "india-gst", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/economy/news/gst-collections-rise-15-percent-to-rs-2-11-trillion-in-july-126080100511_1.html", "title": {"tr": "Hindistan'ın temmuz GST tahsilatı yüzde 15,4 artarak 2,11 trilyon rupiye çıktı", "en": "India's July GST receipts rose 15.4 percent to 2.11 trillion rupees"}, "publishedDate": "2026-08-01"}, {"key": "maruti-july-volumes", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/companies/news/maruti-suzuki-logs-record-july-domestic-pv-sales-jumps-34-to-241-421-unit-126080100614_1.html", "title": {"tr": "Maruti Suzuki'nin temmuz satışları 241.421 adede çıkarak yüzde 34 arttı", "en": "Maruti Suzuki's July sales rose 34 percent to 241,421 units"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-03", "title": {"tr": "Rekor hacim, 400 baz puan eriyen marj", "en": "Record volume, a margin down 400 basis points"}, "excerpt": {"tr": "Maruti Suzuki haziran çeyreğinde tarihinin en yüksek satış adedine ulaştı ve net satışını yüzde 36,4 artırdı. Aynı çeyrekte net kârı geriledi; farkı taşıyan tek bir gider satırı var.", "en": "Maruti Suzuki reached its highest ever quarterly volume in the June quarter and lifted net sales 36.4 percent. In the same quarter net profit fell, and a single cost line carries the difference."}, "sections": [{"h": {"tr": "Gelirden kâra giden yolda ne oldu", "en": "What happened between revenue and profit"}, "ps": [{"tr": "Haziranda biten çeyrekte net satışlar yüzde 36,4 artışla yaklaşık 499,6 milyar rupiye çıktı ve satış adedi yüzde 29,3 artışla 682.724'e ulaşarak çeyrek rekoru kırdı. Buna karşılık solo net kâr yüzde 10,8 gerileyerek yaklaşık 33,5 milyar rupiye, vergi öncesi kâr yüzde 11,5 düşüşle yaklaşık 43,4 milyar rupiye indi. Faaliyet FAVÖK marjı bir yıl önceki yüzde 12,6 düzeyinden yüzde 8,6'ya geriledi.", "en": "In the quarter to June net sales rose 36.4 percent to about 499.6 billion rupees, and volumes set a quarterly record at 682,724 units, up 29.3 percent. Standalone net profit nonetheless fell 10.8 percent to roughly 33.5 billion rupees and profit before tax dropped 11.5 percent to about 43.4 billion. The operating EBITDA margin narrowed to 8.6 percent from 12.6 percent a year earlier.", "refs": ["maruti-q1"]}, {"tr": "Gider kalemlerine tek tek bakıldığında marjı taşıyan satır kendini gösteriyor. Hammadde maliyeti net satışların yüzde 74,5'inden yüzde 80,5'ine çıktı; bu 600 baz puanlık bir kayma. Aynı çeyrekte personel gideri yüzde 5,6'dan yüzde 4,9'a, diğer giderler yüzde 12,7'den yüzde 11,0'e indi. Yani ölçek büyümesinin sabit giderler üzerindeki bilinen etkisi çalıştı, girdi tarafında ise ters yönde ve daha büyük bir hareket oldu. 400 baz puanlık marj kaybı, 600 baz puanlık girdi artışının diğer kalemlerdeki iyileşmeyle kısmen dengelenmiş hâli.", "en": "Going through the cost lines one by one shows which of them carries the margin. Material costs went from 74.5 percent of net sales to 80.5 percent, a shift of 600 basis points. In the same quarter employee costs fell from 5.6 percent to 4.9 percent and other expenses from 12.7 percent to 11.0 percent. The familiar effect of scale on fixed costs did its work, while the input side moved the other way and by more. The 400 basis points of margin loss are what remains once a 600 basis point rise in inputs is partly offset by the improvement elsewhere.", "refs": ["maruti-q1"]}]}, {"h": {"tr": "Yönetimin gerekçesi ve sınanamayan alternatif", "en": "Management's explanation and the alternative that cannot be tested"}, "ps": [{"tr": "Şirket, hammadde maliyetlerinin çeyrek içinde yükselmeye başladığını ve Batı Asya'daki çatışmanın ardından sert biçimde arttığını bildirdi. Bu açıklamanın tek başına yeterli sayılması güç, çünkü aynı çeyrekte ürün bileşimi de değişti: çok amaçlı araç satışı yüzde 44,6, ihracat yüzde 28,6 arttı ve pazar payı 2,3 puan yükselerek yüzde 41,2 oldu. Farklı segmentlerin araç başına malzeme içeriği aynı değildir ve 2,3 puanlık pay kazancının fiyatlamayla ilişkisi kamuya açıklanan bu tabloda görünmüyor. Girdi fiyatı, bileşim ve fiyatlama etkilerinin ağırlığını bu açıklama setiyle ayırmak mümkün değil.", "en": "The company reported that material costs started rising during the quarter and increased sharply after the outbreak of the West Asia conflict. That explanation is hard to treat as sufficient on its own, because the product mix also changed in the same quarter: utility vehicle sales rose 44.6 percent, exports 28.6 percent, and market share gained 2.3 percentage points to reach 41.2 percent. Different segments do not carry the same material content per vehicle, and how the 2.3-point share gain relates to pricing is not visible in the disclosure set published here. Separating the weight of input prices, mix and pricing is not possible from these figures.", "refs": ["maruti-q1"]}, {"tr": "Sınama, hacimden çok tek bir orana bakılarak yapılabilir. Temmuzda satış yüzde 34 artışla 241.421 adede, yurt içi binek araç satışı yüzde 43,4 artışla 196.203 adede çıktı ve yurt içi toplamda şirket rekoru kırıldı; yani çeyrek sonrasında talep tarafında bir kırılma görünmüyor. Bayi stokunun yaklaşık 13 gün olması da kanalın şişmediğini gösteriyor. Asıl gözlem, sonraki çeyrek tablosunda hammadde maliyetinin net satışlara oranının yüzde 80,5'ten geri çekilip çekilmediği olacak. Bu oran yerinde kalır ve hacim de korunursa, marj daralması kalıcı bir maliyet tabanına dönüşmüş demektir.", "en": "What has to be watched next is a ratio rather than a volume. July sales rose 34 percent to 241,421 units, domestic passenger vehicle sales rose 43.4 percent to 196,203, and the company set a record for total domestic sales, so demand shows no break after the quarter. Dealer inventory of about 13 days suggests the channel is not stuffed either. The observation that matters is whether the next quarterly statement shows material costs retreating from 80.5 percent of net sales. If that ratio holds while volumes hold too, the margin compression has settled into a lasting cost base.", "refs": ["maruti-q1", "maruti-july-volumes"]}]}], "sources": [{"key": "maruti-q1", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/amp/markets/capital-market-news/maruti-suzuki-q1-pat-slides-11-yoy-as-commodity-costs-rise-126080100206_1.html", "title": {"tr": "Maruti Suzuki'nin çeyrek net kârı yüzde 10,8 gerilerken net satışları yüzde 36,4 arttı", "en": "Maruti Suzuki's quarterly net profit fell 10.8 percent as net sales rose 36.4 percent"}, "publishedDate": "2026-08-01"}, {"key": "maruti-july-volumes", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/companies/news/maruti-suzuki-logs-record-july-domestic-pv-sales-jumps-34-to-241-421-unit-126080100614_1.html", "title": {"tr": "Maruti Suzuki'nin temmuz satışları 241.421 adede çıkarak yüzde 34 arttı", "en": "Maruti Suzuki's July sales rose 34 percent to 241,421 units"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-04", "title": {"tr": "Posco'nun 23.000 tonu, Salta'daki kapasite devreye girene kadar kâğıtta duruyor", "en": "Posco's 23,000 tonnes stay on paper until the Salta capacity runs"}, "excerpt": {"tr": "Arjantin ile Güney Kore arasındaki kritik mineral ortaklığı bir yatırım rakamı ve bir üretim hedefi ile duyuruldu. Arjantin'de aradaki mesafeyi tesisin ve taşımanın takvimi belirliyor.", "en": "The critical minerals partnership between Argentina and South Korea was announced with an investment figure and an output target. In Argentina the distance between the two is set by the timetable of the plant and the transport."}, "sections": [{"h": {"tr": "İmza ile ilk ton arasındaki mesafe", "en": "The distance between the signature and the first tonne"}, "ps": [{"tr": "Cumhurbaşkanı Javier Milei ile Güney Kore Devlet Başkanı Lee Jae Myung'un 31 Temmuz'daki görüşmesinin ardından duyurulan ortaklık, kritik minerallerin aranması, çıkarılması, işlenmesi ve rafinasyonunu kapsıyor. Somut kalem şu: Güney Koreli Posco'nun Salta'da lityum çıkarımını genişletmesine onay verildi. Yatırım 547 milyon dolar, öngörülen üretim yılda 23.000 ton lityum karbonat, beklenen yıllık ihracat 300 milyon dolar üzerinde. Arjantin dünyanın beşinci büyük lityum üreticisi.", "en": "The partnership announced after the 31 July meeting between President Javier Milei and South Korean President Lee Jae Myung covers the exploration, extraction, processing and refinement of critical minerals. The concrete item is this: South Korea's Posco was approved to expand lithium extraction in Salta. The investment is 547 million dollars, projected output 23,000 tonnes of lithium carbonate a year, and expected exports more than 300 million dollars a year. Argentina is the world's fifth-largest lithium producer.", "refs": ["korea-argentina-minerals"]}, {"tr": "Onaylanmış kapasite ile çalışan arz arasında bir zaman farkı var. Bir lityum genişletmesinde belirleyici adım, yeraltındaki tuzlu suyu yılda 23.000 tona çeviren işleme kapasitesinin devreye alınma tarihidir. Duyuruda bir devreye alma tarihi yer almıyor; dolayısıyla bu tonaj, takvimi açıklanana kadar piyasa dengesine giren bir arz olarak sayılamaz. Bunun daha iyimser bir okuması da var: mevcut bir sahanın genişletilmesi, sıfırdan kurulan bir projeye göre çok daha kısa sürede üretime geçebilir. İki okumayı ayıracak veri, açıklanacak devreye alma takvimidir.", "en": "A gap in time separates approved capacity from operating supply. The step that decides a lithium expansion is the commissioning date of the processing capacity that turns the brine underground into 23,000 tonnes a year. The announcement gives no commissioning date, so this tonnage cannot be counted as supply entering the market balance until that timetable is published. There is a more optimistic reading too: expanding an existing operation can reach production far sooner than a project built from nothing. The data that would separate the two readings is the commissioning schedule when it appears.", "refs": ["korea-argentina-minerals"]}]}, {"h": {"tr": "Aynı kısıt, ikinci havzada", "en": "The same constraint in a second basin"}, "ps": [{"tr": "Arjantin'in diğer kaynak havzasında da bağlayıcı adım aynı yerde duruyor. Neuquén eyaleti Vaca Muerta'da 15 blok için ihale açtı ve teklifler 19 Ağustos'ta açılacak; Harold Hamm'in Continental Resources'ı bu bloklar için yarışıyor. Havza hâlihazırda günde bir milyon varilin üzerinde petrol ve gaz üretiyor, ancak üretimin artırılmasını mümkün kılacak olan gelecek yıl devreye girecek VMOS ihracat boru hattı ve limanı. Her iki durumda da bağlayıcı adım, çıkarılanı işleyen ya da dışarı taşıyan kapasitede duruyor.", "en": "In Argentina's other resource basin the binding step sits in the same place. Neuquén province has opened an auction for 15 blocks in Vaca Muerta with bids opening on 19 August, and Harold Hamm's Continental Resources is competing for them. The basin already produces more than a million barrels a day of oil and gas, but what will allow output to rise is the VMOS export pipeline and port due to start next year. In both cases the binding step sits in the capacity that processes what is extracted or moves it out.", "refs": ["vaca-muerta-auction", "korea-argentina-minerals"]}, {"tr": "Alıcı tarafında da tek bir sahaya bağlılık azalıyor. Lee, 30 Temmuz'da Şili ile aynı içerikte bir kritik mineral ortaklığı duyurmuştu; Şili bakırda dünya birincisi, lityumda ikinci sırada. İki ülkeyle bir hafta içinde imzalanan iki ortaklık, Kore'nin tedarikini tek bir üreticiye bağlamadığını gösteriyor. Önümüzdeki dönemde izlenecek iki somut işaret var: Neuquén'in 19 Ağustos'ta açılacak tekliflerinden çıkacak saha tahsisleri ve VMOS'un ilan edilen takvime uyup uymadığı. Bunlardan ilki sermayenin hangi hızla bağlandığını, ikincisi ise çıkarılan hacmin ne zaman piyasaya ulaşacağını gösterecek.", "en": "On the buying side, dependence on a single field is also easing. Lee announced an identical critical minerals partnership with Chile on 30 July; Chile leads the world in copper and ranks second in lithium. Two partnerships signed with two countries inside a week show that Korea is not tying its supply to one producer. Two concrete signals are worth following from here: the block awards that come out of Neuquén's bid opening on 19 August, and whether VMOS keeps to its announced schedule. The first shows how fast capital is being committed, the second when extracted volume actually reaches the market.", "refs": ["vaca-muerta-auction", "korea-argentina-minerals"]}]}], "sources": [{"key": "korea-argentina-minerals", "kind": "news", "name": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/argentina-and-south-korea-announce-critical-minerals-partnership.phtml", "title": {"tr": "Arjantin ile Güney Kore kritik mineral ortaklığı ilan etti, Posco'ya Salta'da genişleme onayı verildi", "en": "Argentina and South Korea announced a critical minerals partnership, with Posco cleared to expand in Salta"}, "publishedDate": "2026-08-01"}, {"key": "vaca-muerta-auction", "kind": "news", "name": "Buenos Aires Times", "url": "https://www.batimes.com.ar/news/economy/oil-billionaire-hamm-seeks-to-expand-in-argentinas-shale-patch.phtml", "title": {"tr": "Continental Resources, Neuquén'in 15 kaya sahası ihalesine talip oldu", "en": "Continental Resources is bidding for 15 shale blocks in Neuquén's auction"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-01T23:02:17+00:00", "date": "2026-08-02"}, {"writer": "eco-05", "title": {"tr": "34 milyar euro, 5,6 milyar euro fazlanın hemen yanında duruyor", "en": "34 billion euros stand right beside a 5.6 billion euro surplus"}, "excerpt": {"tr": "İrlanda'nın sorunlu varlık kurumu 16 yılın ardından kapandı ve devlete 5,6 milyar euro fazla devretti. Kapanış hesabı bu fazlayı gösteriyor; aynı krizin geri alınamayan 34 milyar euro kalemi başka bir sayfada duruyor.", "en": "Ireland's bad bank closed after 16 years and handed a 5.6 billion euro surplus back to the state. The closing account shows that surplus; the 34 billion euros of the same crisis that were never recovered sit on a different page."}, "sections": [{"h": {"tr": "Kapanış hesabında görünen rakam", "en": "The figure the closing account shows"}, "ps": [{"tr": "2009 sonunda kurulan Ulusal Varlık Yönetim Ajansı bu hafta sonu kapandı. Kurum, nominal değeri 74 milyar euro olan kredileri 32 milyar euroya, yani yüzde 58 iskontoyla devralmıştı ve kapanışta kurumlar vergisi dâhil 5,6 milyar euro fazlayı devlete devretti. Kalan sekiz çalışan, Ulusal Hazine Yönetim Ajansı bünyesindeki bir tasfiye biriminde görevini sürdürüyor; kurumun genel müdürü Brendan McDonagh kapanıştan sonra danışman olarak kaldı.", "en": "The National Asset Management Agency, set up in late 2009, closed this weekend. It had taken on loans with a face value of 74 billion euros for 32 billion, a discount of 58 percent, and at the close it returned a surplus of 5.6 billion euros to the state including corporation tax. Its last eight staff continue in a resolution unit inside the National Treasury Management Agency, and chief executive Brendan McDonagh stayed on as an adviser after the wind-up.", "refs": ["nama-closure"]}, {"tr": "Aynı krizin ikinci kalemi bu hesapta görünmüyor. Irish Nationwide ile Anglo Irish Bank tasfiye edildi ve vergi mükelleflerine 34 milyar euro kalıcı zarar bıraktı; AIB ile Bank of Ireland ise yeniden yapılandırılıp tahvil piyasasına döndü. İki rakam aynı kamu bütçesine ait, ama farklı kurumların defterinde ve farklı zamanlarda duyuruluyor.
