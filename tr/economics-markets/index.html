a ve kanatlı etinde; bir politika faizinin bu gruba ulaşma yolu dolambaçlı.", "en": "Peru's July inflation stayed outside the target range at 4.07 percent. The weight of the monthly rise is in food and poultry, and a policy rate reaches that division only by a roundabout route."}, "sections": [{"h": {"tr": "Aylık artışın bileşimi", "en": "The composition of the monthly rise"}, "ps": [{"tr": "INEI verilerine göre Lima Metropolitana'da temmuz aylık artışı yüzde 0,29 ve yıllık artış yüzde 4,07 oldu. Ocak-temmuz birikimli artış Lima'da yüzde 4,09 olarak verildi. Ülke genelinde aynı ayda aylık artış yüzde 0,30, yıllık artış yüzde 3,70 ve birikimli artış yüzde 3,71 oldu.", "en": "INEI data show Lima Metropolitana's July monthly increase at 0.29 percent and its annual increase at 4.07 percent, with the cumulative January to July increase given as 4.09 percent in Lima. Nationally, the same month showed a monthly increase of 0.30 percent, an annual increase of 3.70 percent and a cumulative increase of 3.71 percent.", "refs": ["peru-cpi-july"]}, {"tr": "Aylık artışa en çok katkı yapan grup gıda ve alkolsüz içecekler oldu ve bu grup yüzde 0,67 arttı. Onu mobilya ve ev eşyaları yüzde 0,44, iletişim yüzde 0,25, çeşitli mal ve hizmetler yüzde 0,24, eğlence ve kültür yüzde 0,22 ile izledi. INEI Başkanı Gaspar Morán Flores artışta kanatlı eti ve parçaları, tavuk yumurtası ile bazı meyve ve sebze fiyatlarını öne çıkardı. Bu bileşim, belirli bir arz kaleminde göreli fiyat hareketine işaret ediyor. Karşı okuma da mümkün: hane gelirleri artmışsa ek harcama ilk olarak gıdada yoğunlaşır ve aylık endeks iki olasılığı aynı satırda gösterir. Ayrımı ancak aynı aylara ait ücret ve gelir serileri yapabilir.", "en": "The division contributing most to the monthly increase was food and non-alcoholic beverages, which rose 0.67 percent. Furniture and household goods followed at 0.44 percent, communications at 0.25 percent, miscellaneous goods and services at 0.24 percent and recreation and culture at 0.22 percent. INEI's head Gaspar Moran Flores highlighted increases in poultry meat and cuts, chicken eggs and some fruit and vegetables. That composition points to a relative price move in a specific supply line. A counter-reading is available: if household incomes have risen, the extra spending lands in food first, and a monthly index shows both possibilities on the same line. Only wage and income series for the same months can tell them apart.", "refs": ["peru-cpi-july"]}]}, {"h": {"tr": "Hedef aralığı ile aktarım arasındaki mesafe", "en": "The distance between the target range and transmission"}, "ps": [{"tr": "Yıllık oran hedef aralığının dışında kaldığı için bankanın seçim alanı daralıyor. Bir merkez bankasının belirlediği faiz kredi ve harcama üzerinden gecikmeli çalışır; kanatlı eti ile yumurta fiyatındaki bir hareket kredi ile finanse edilen bir harcama kalemi olmadığından faizin bu gruba etkisi hanenin geri kalan harcamasını kısarak dolaylı biçimde ortaya çıkar. Aynı ayda ülke genelindeki yüzde 3,70 ile Lima'daki yüzde 4,07 arasındaki açıklık da tek bir ulusal talep hikâyesiyle uyuşmuyor.", "en": "Because the annual rate remained outside the target range, the bank's room for choice narrows. The rate a central bank sets works through credit and spending with a lag; a move in the price of poultry meat and eggs is not an expenditure financed by credit, so the rate reaches that division indirectly, by squeezing the rest of a household's spending. In the same month, the distance between the national 3.70 percent and Lima's 4.07 percent does not fit a single national demand story either.", "refs": ["peru-cpi-july"]}, {"tr": "Bu okumayı sınayacak gözlem basit. Ağustos açıklamasında gıda ve alkolsüz içecekler grubunun aylık katkısı yüzde 0,67'nin belirgin altına inerken yıllık oran da gerilerse, temmuz hareketinin arz kaynaklı olduğu yorumu güç kazanır. Grup katkısı düşerken yıllık oran yerinde kalırsa, fiyat artışının gıdanın dışına yayıldığı okuması öne çıkar. İki durumu aynı tablonun bir sonraki satırı ayıracak.", "en": "The observation that would test this reading is simple. If the monthly contribution of food and non-alcoholic beverages falls clearly below 0.67 percent in the August release while the annual rate also eases, the reading that July's move came from supply gains strength. If the division's contribution falls while the annual rate holds, the reading that price increases have spread beyond food comes forward. The next line of the same table will separate the two.", "refs": ["peru-cpi-july"]}]}], "sources": [{"key": "peru-cpi-july", "kind": "news", "name": "Gestión", "url": "https://gestion.pe/economia/inei-precios-siguen-al-alza-inflacion-anual-aumento-407-en-julio-el-detalle-noticia/", "title": {"tr": "Peru'da temmuz enflasyonu yıllık yüzde 4,07 ile hedef aralığının üzerinde kaldı", "en": "Peru's July inflation stayed above the target range at 4.07 percent"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "date": "2026-08-02"}, {"writer": "eco-03", "title": {"tr": "Ciro yüzde 9 arttı, ekipman işletme gideri yüzde 203", "en": "Revenue rose 9 percent, equipment running costs 203 percent"}, "excerpt": {"tr": "SAHCO'nun ilk yarı geliri büyüdü. Maliyet satırları birkaç kat daha hızlı büyüdü ve marj aritmetiği sonucu hangi kalemin taşıdığını açıkça gösteriyor.", "en": "SAHCO's first-half revenue grew. Its cost lines grew several times faster, and the margin arithmetic shows plainly which line is carrying the result."}, "sections": [{"h": {"tr": "Gelir tarafı ile maliyet tarafı", "en": "The revenue side and the cost side"}, "ps": [{"tr": "Gelir yüzde 9,25 artarak 21,064 milyar nairadan 23,013 milyar nairaya çıktı. Aynı dönemde vergi öncesi kâr yüzde 41,49 azalarak 9,958 milyar nairadan 5,827 milyar nairaya indi, vergi sonrası kâr yüzde 52,73 azalarak 8,136 milyar nairadan 3,846 milyar nairaya indi. Hisse başına kazanç 601 kuruştan 284 kuruşa indi.", "en": "Revenue rose 9.25 percent from 21.064 billion naira to 23.013 billion naira. Over the same period pre-tax profit fell 41.49 percent from 9.958 billion naira to 5.827 billion naira and profit after tax fell 52.73 percent from 8.136 billion naira to 3.846 billion naira. Earnings per share fell from 601 kobo to 284 kobo.", "refs": ["sahco-h1"]}, {"tr": "Doğrudan maliyetler yüzde 63,07 artarak 10,754 milyar nairaya ve yönetim giderleri yüzde 41,25 artarak 6,584 milyar nairaya çıktı. Kalem kalem bakıldığında ekipman işletme gideri yüzde 202,94 artarak 1,104 milyar naira, ekipman onarımı yüzde 117,81 artarak 2,374 milyar naira ve doğrudan işçilik yüzde 53,90 artarak 2,584 milyar naira oldu. Doğrudan maliyetin gelire oranı yüzde 31,31'den yüzde 46,73'e çıktı, brüt marj yüzde 68,69'dan yüzde 53,27'ye indi ve faaliyet marjı yüzde 47,60'tan yüzde 26,18'e indi.", "en": "Direct costs rose 63.07 percent to 10.754 billion naira and administrative expenses rose 41.25 percent to 6.584 billion naira. Line by line, equipment running costs rose 202.94 percent to 1.104 billion naira, equipment repairs rose 117.81 percent to 2.374 billion naira and direct labour rose 53.90 percent to 2.584 billion naira. The ratio of direct cost to revenue rose from 31.31 percent to 46.73 percent, the gross margin fell from 68.69 percent to 53.27 percent and the operating margin fell from 47.60 percent to 26.18 percent.", "refs": ["sahco-h1"]}]}, {"h": {"tr": "Hangi varsayım sonucu taşıyor", "en": "Which assumption carries the result"}, "ps": [{"tr": "Onarım ve işletme kalemleri gelirden daha hızlı arttı ve bu, bakımı ertelenmiş, yaşlanan bir ekipman parkıyla tutarlı. Girdi fiyatı ile kur geçişi de aynı satırları yukarı taşır: ithal yedek parça ile akaryakıt maliyeti arttığında ekipmanın fiziksel durumu aynı kalsa bile onarım ve işletme gideri yükselir. Tablo 30 Haziran 2026'da kapanan altı aylık dönem için bağımsız denetimden geçmemiş olarak yayımlandı ve bu kalemlerde miktar ile fiyat ayrı verilmedi; iki açıklama arasında seçim yapmaya yetecek bilgi henüz yayımlanmış durumda değil.", "en": "Repair and running lines rose faster than revenue, which is consistent with an ageing equipment fleet whose maintenance has been deferred. Input prices and currency pass-through lift the same lines too: when imported spare parts and fuel cost more, repair and running costs rise even if the physical condition of the equipment stays the same. The statement was published unaudited for the six months to 30 June 2026 and gives no separate volume and price for those lines, so the information needed to choose between the two explanations has not yet been published.", "refs": ["sahco-h1"]}, {"tr": "Duyarlılığı açıklanan oranlarla sınırlamak mümkün. Gelir aynı düzeyde kalsa ve doğrudan maliyetin gelire oranı yüzde 31,31'e dönse, brüt kâr yaklaşık 3,5 milyar naira artardı; bu, vergi öncesi kârda kaybedilen 4,131 milyar nairanın büyük bölümünü karşılıyor. Sonucu taşıyan varsayım tek bir orandır: doğrudan maliyetin gelire oranı. İzlenecek işaret de buradan geliyor, dokuz aylık tabloda bu oranın yüzde 46,73'ün altına inip inmediği.", "en": "The sensitivity can be bounded with the disclosed ratios. If revenue stayed at the same level and the ratio of direct cost to revenue returned to 31.31 percent, gross profit would rise by roughly 3.5 billion naira, covering most of the 4.131 billion naira lost at the pre-tax line. The assumption carrying the result is a single ratio: direct cost as a share of revenue. That is where the signal comes from, namely whether the ratio falls below 46.73 percent in the nine-month statement.", "refs": ["sahco-h1"]}]}], "sources": [{"key": "sahco-h1", "kind": "news", "name": "Nairametrics", "url": "https://nairametrics.com/2026/08/02/sahcos-h1-2026-pre-tax-profit-falls-41-as-cost-pressures-weaken-margins/", "title": {"tr": "SAHCO'nun ilk yarı vergi öncesi kârı yüzde 41,5 geriledi", "en": "SAHCO's first-half pre-tax profit fell 41.5 percent"}, "publishedDate": "2026-08-02"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "date": "2026-08-02"}, {"writer": "eco-04", "title": {"tr": "Üretim yüzde 8 arttı, ithalat tonajı neden değişmedi?", "en": "Output rose 8 percent, so why did import tonnage not change?"}, "excerpt": {"tr": "Türkiye'nin ilk yarı ham çelik üretimi 19,8 milyon tona çıktı, nihai mamul tüketimi 19,9 milyon tonda kaldı. İthalat tonajı neredeyse hiç değişmedi ve fark talebin nerede karşılandığını söylüyor.", "en": "Türkiye's first-half crude steel output reached 19.8 million tonnes while final product consumption stood at 19.9 million. Import tonnage barely changed, and the difference says where the demand was met."}, "sections": [{"h": {"tr": "Yarım yılın tonajı", "en": "The half-year tonnage"}, "ps": [{"tr": "Türkiye Çelik Üreticileri Derneği (TÇÜD) verilerine göre ocak-haziran ham çelik üretimi yüzde 8,1 artarak 19,8 milyon tona çıktı ve haziran üretimi yüzde 14,7 artarak 3,3 milyon tona çıktı. Nihai mamul tüketimi ilk yarıda yüzde 6,6 artarak 19,9 milyon tona, haziranda yüzde 0,4 artarak 3,1 milyon tona çıktı.", "en": "According to the Turkish Steel Producers Association (TÇÜD), January to June crude steel output rose 8.1 percent to 19.8 million tonnes and June output rose 14.7 percent to 3.3 million tonnes. Final product consumption rose 6.6 percent to 19.9 million tonnes in the first half and 0.4 percent to 3.1 million tonnes in June.", "refs": ["turkiye-steel-h1"]}, {"tr": "İhracat ilk yarıda miktarda yüzde 2,5 artarak 7,8 milyon tona, değerde yüzde 1,3 artarak 5,3 milyar dolar oldu. İthalat ise miktarda yüzde 0,3 artarak 9,3 milyon tona çıktı, değeri yüzde 2,4 azalarak 6,3 milyar dolar oldu. Açıklanan rakamlardan hesaplanan ortalama birim değerler birbirine çok yakın: ihracatta ton başına yaklaşık 679 dolar, ithalatta ton başına yaklaşık 677 dolar. Bu yakınlık iki sepetin aynı ürünlerden oluştuğu anlamına gelmiyor; kalite, kalınlık ve mamul grubu farkları aynı ortalamayı verebilir. İhracatın ithalatı karşılama oranı yüzde 80'den yüzde 83'e çıktı.", "en": "Exports rose 2.5 percent by volume to 7.8 million tonnes and 1.3 percent by value to 5.3 billion dollars in the first half. Imports rose 0.3 percent by volume to 9.3 million tonnes and fell 2.4 percent by value to 6.3 billion dollars. Average unit values calculated from the published figures sit very close together: about 679 dollars a tonne for exports and about 677 dollars a tonne for imports. That closeness does not mean the two baskets hold the same products; differences in grade, thickness and product group can produce the same average. The ratio of exports to imports rose from 80 percent to 83 percent.", "refs": ["turkiye-steel-h1"]}]}, {"h": {"tr": "Haziran ayrı bir şey anlatıyor", "en": "June says something different"}, "ps": [{"tr": "Haziranda ihracat miktarda yüzde 28,4 ve değerde yüzde 29,7 arttı, ithalat ise miktarda yüzde 0,8 azaldı ve değerde yüzde 3,7 arttı. Yurt içi tüketim aynı ayda yüzde 0,4 artışta kalırken ihracat tonajının bu ölçüde artması, artan üretimin yurt dışına yönlendirildiğine işaret ediyor. Yükleme takvimi de aynı tonajı üretebilir: bir geminin yüklemesi öne ya da arkaya kaydığında tek bir ayın rakamı şişer ve aylık gümrük verisi sipariş tarihini göstermiyor.", "en": "In June exports rose 28.4 percent by volume and 29.7 percent by value, while imports fell 0.8 percent by volume and rose 3.7 percent by value. With domestic consumption up only 0.4 percent in the same month, export tonnage rising on that scale points to the extra output being directed abroad. A loading schedule can produce the same tonnage: when a vessel's loading slips forward or back, a single month's figure swells, and monthly customs data do not show the order date.", "refs": ["turkiye-steel-h1"]}, {"tr": "Bağlayıcı kısıt olarak derneğin genel sekreteri Veysel Yayan uzun vadeli ve düşük maliyetli finansmanı, güçlendirilmiş Eximbank desteğini ve yatırım kredisine erişimin kolaylaştırılmasını istedi. Kısıt bu haliyle cevher ya da hurda tarafında aranmıyor, finansman maliyetinde tarif ediliyor; bu da kapasitenin kullanılmasının işletme sermayesine bağlı olduğu anlamına geliyor. İzlenecek işaret net: temmuz, ağustos ve eylül verilerinde ithalat tonajının azalmaya geçip geçmediği ve karşılama oranının yüzde 83'ün üzerinde tutunup tutunmadığı.", "en": "On the binding constraint, the association's general secretary Veysel Yayan called for long-term, low-cost financing, stronger Eximbank support and easier access to investment credit. The constraint as described is sought in the cost of finance and not on the ore or scrap side, which means that using capacity depends on working capital. The signal to watch is clear: whether import tonnage starts falling in the July, August and September data and whether the coverage ratio holds above 83 percent.", "refs": ["turkiye-steel-h1"]}]}], "sources": [{"key": "turkiye-steel-h1", "kind": "news", "name": "Anadolu Ajansı", "url": "https://www.aa.com.tr/tr/ekonomi/turkiyenin-ham-celik-uretimi-yilin-ilk-yarisinda-yuzde-8-1-artisla-19-8-milyon-tona-cikti/4015581", "title": {"tr": "Türkiye'nin ham çelik üretimi ilk yarıda yüzde 8,1 artışla 19,8 milyon tona çıktı", "en": "Türkiye's crude steel output rose 8.1 percent to 19.8 million tonnes in the first half"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "radarUpdatedAt": "2026-08-02T07:02:01+00:00", "date": "2026-08-02"}, {"writer": "eco-05", "title": {"tr": "Altı yıl sonra açılan geçitten ilk gün 16 tüccar geçti", "en": "16 traders crossed on the first day of a pass reopened after six years"}, "excerpt": {"tr": "Kinnaur'daki Shipki La geçidi ticarete yeniden açıldı. Kazanç gerçek ve dar: ilk gün 16 tüccar yola çıktı, geçidi kimin kullanabileceğine ürün listesinden çok ödeme kuralı karar veriyor.", "en": "The Shipki La pass in Kinnaur is open to trade again. The gain is real and narrow: 16 traders set off on the first day, and who can use the crossing is decided by the payment rule more than by the list of goods."}, "sections": [{"h": {"tr": "Kim geçebiliyor", "en": "Who can actually cross"}, "ps": [{"tr": "Ticaret Shipki La geçidinde altı yıllık aranın ardından yeniden başladı ve ilk gün 16 tüccar yola çıktı. Güzergâh Himaçal Pradeş'in Kinnaur ilçesindeki Namgya sınır köyünden Tibet'e uzanıyor. Hindistan tarafından 72 ve Tibet tarafından 30 ürün grubuna izin veriliyor; alışveriş takas yöntemiyle yapılıyor ve tüccarların işlemlerini 72 saat içinde tamamlayıp dönmesi gerekiyor.", "en": "Trade restarted at the Shipki La pass after a six-year gap and 16 traders were flagged off on the first day. The route runs from the border village of Namgya in Himachal Pradesh's Kinnaur district into Tibet. 72 categories of goods are permitted from the Indian side and 30 from the Tibetan side; exchange takes place by barter and traders must complete transactions within 72 hours before returning.", "refs": ["shipki-la"]}, {"tr": "Takas düzeni karşılığında verilecek malı gerektirdiği için elinde stok tutan tüccarı ödüllendiriyor; nakit ile alıp sonra satmayı planlayan küçük esnafın önüne bir stok şartı koyuyor. 72 saatlik süre gidiş dönüşü kapsadığı için de bu masrafı finanse edebilen ve satılamayan yükü geri taşıyabilen tüccarı ödüllendiriyor. Geçitten yararlanmayı sınırlayan asıl unsur böylece ödeme ve süre kuralı oluyor. Karşı ihtimal de duruyor: ilk günün düşük sayısı kademeli bir açılışı yansıtabilir ve izin belgesi olan tüccar sayısı açıklanmadı.", "en": "Barter requires goods to give in exchange, which rewards the trader who already holds stock and puts a stock requirement in front of the small shopkeeper who would buy with cash and sell later. Because the 72-hour limit covers the round trip, it rewards whoever can finance that cost and carry an unsold load home. The main factor limiting use of the pass is therefore the rule on payment and time. A rival possibility stands alongside it: the low first-day number may reflect a phased opening, and the number of traders holding permits was not published.", "refs": ["shipki-la"]}]}, {"h": {"tr": "Kamu harcaması ile faydanın ölçeği", "en": "The scale of the public spend against the benefit"}, "ps": [{"tr": "Chhuppan'da 17 milyon rupi maliyetle bir ticaret merkezi kuruldu. Eyalet Gelir ve Bahçe Bitkileri Bakanı Jagat Singh Negi, tüccarların Birlik Ticaret Bakanlığı'nın belirlediği ithalat ve ihracat kurallarına titizlikle uymasını istedi. Kurulan kamu kapasitesi ile bu kapasiteyi kullanacak tüccar sayısı arasındaki oran, açılışın bir geçim önlemi mi yoksa sınırda varlık göstermenin bir aracı mı olduğunu belirleyecek.", "en": "A trade mart at Chhuppan was built at a cost of 17 million rupees. Revenue and Horticulture Minister Jagat Singh Negi said traders must strictly adhere to the import and export regulations prescribed by the Union Ministry of Commerce. The ratio between the public capacity built and the number of traders who will use it will decide whether the reopening is a livelihood measure or a way of showing presence at the border.", "refs": ["shipki-la"]}, {"tr": "Bu soruyu kapatacak veriler zor değil: izin belgesi olan tüccar sayısı, geçitten bu sezon geçen ticaretin değeri ve tüccarların hangi köylerden geldiği. Bunlar yayımlanmadığı sürece 16 kişilik bir ilk gün, geniş bir bölgesel kazanç olarak sunulmaya elverişli kalıyor. İzlenecek işaret de aynı yerden geliyor: eyaletin izin belgesi olan tüccar sayısını açıklaması ve bu sayının 16'nın belirgin üzerine çıkması.", "en": "The data that would close this question are not hard to gather: the number of traders holding permits, the value of the trade crossing the pass this season and which villages the traders come from. Until those are published, a first day of 16 people remains easy to present as a broad regional gain. The signal to watch comes from the same place: the state publishing the number of traders holding permits, and that number rising clearly above 16.", "refs": ["shipki-la"]}]}], "sources": [{"key": "shipki-la", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/economy/news/india-china-border-trade-via-shipki-la-resumes-after-six-year-hiatus-126080100990_1.html", "title": {"tr": "Shipki La geçidinde Hindistan-Çin sınır ticareti altı yıl sonra yeniden başladı", "en": "India-China border trade restarted at the Shipki La pass after six years"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "date": "2026-08-02"}, {"writer": "eco-06", "title": {"tr": "Günlük 763 milyon işlem tek bir ödeme rayının üstünde", "en": "763 million transactions a day ride on a single payment rail"}, "excerpt": {"tr": "Hindistan'ın perakende ödemeleri temmuzda en yüksek aylık düzeyini gördü. Aynı veri seti trafiğin eski raydan ayrıldığını da gösteriyor ve ölçülmesi gereken risk burada.", "en": "India's retail payments hit their highest monthly level in July. The same data set also shows traffic leaving the older rail, and that is where the exposure worth measuring sits."}, "sections": [{"h": {"tr": "Aynı ayda iki farklı yön", "en": "Two directions in the same month"}, "ps": [{"tr": "Temmuzda UPI üzerinden 29,88 trilyon rupi değerinde 23,66 milyar işlem yapıldı; adet aylık yüzde 4,1 ve değer yüzde 3,3 arttı, yıllık artışlar yüzde 22 ve yüzde 19 oldu. IMPS'de 7,12 trilyon rupi değerinde 364 milyon işlem yapıldı; aylık adet yüzde 3 ve değer yüzde 5 arttı, buna karşılık yıllık adet yüzde 24 azaldı ve yıllık değer yüzde 13 arttı.", "en": "In July UPI carried 23.66 billion transactions worth 29.88 trillion rupees; volume rose 4.1 percent and value 3.3 percent on the month, with annual gains of 22 percent and 19 percent. IMPS handled 364 million transactions worth 7.12 trillion rupees; volume rose 3 percent and value 5 percent on the month, while annual volume fell 24 percent and annual value rose 13 percent.", "refs": ["upi-july"]}, {"tr": "İki serinin yıllık adette ters yöne gitmesi, değerin ikisinde de artmasıyla birlikte okunduğunda küçük tutarlı trafiğin IMPS'den UPI'ye kaydığı ile tutarlı. Açıklanan rakamlardan çıkan ortalama işlem büyüklükleri bunu ölçülebilir kılıyor: UPI'de işlem başına yaklaşık 1.263 rupi, IMPS'de yaklaşık 19.560 rupi. Kaymanın dışında bir mekanizma da aynı düşüşü verir: bankaların akışları farklı sınıflandırması ya da büyük bir toplayıcının toplu işlemlerini başka bir sisteme taşıması, hiçbir hane ray değiştirmeden IMPS adedini aşağı çeker. Aylık toplamlar iki olasılığı ayırmaya yetmiyor.", "en": "The two series moving in opposite directions on annual volume, read together with value rising on both, is consistent with small-value traffic shifting from IMPS to UPI. Average transaction sizes derived from the published figures make that measurable: about 1,263 rupees per UPI transaction against about 19,560 rupees on IMPS. A mechanism other than migration delivers the same fall: banks reclassifying flows, or a large aggregator moving batch processing to another system, would pull IMPS volume down without any household changing rail. Monthly totals are not enough to separate the two possibilities.", "refs": ["upi-july"]}]}, {"h": {"tr": "Ne kadarının çalışmaya devam etmesi gerekiyor", "en": "How much has to keep working"}, "ps": [{"tr": "UPI günlük ortalaması 763 milyon işlem ve 963,83 milyar rupi oldu. Aynı ay FASTag işlem adedi aylık yüzde 4 azalarak 347 milyon oldu ve AePS işlem adedi aylık yüzde 3 artarak 100 milyon oldu; sistemin içindeki diğer raylar, yer değiştiren perakende trafiğini üstlenebilecek büyüklüğün bir ila iki mertebe altında kalıyor. Kesinti hâlinde aynı çatı altında karşılaştırılabilir bir yedek bulunmuyor. Karşı okuma da kayda değer: NPCI verisinin dışında kalan nakit ve kart ağları bir kesintinin bir bölümünü emebilir, ayrıca erişilebilirlik ve kesinti süresi bu aylık toplamların yanında verilmiyor.", "en": "UPI daily averages were 763 million transactions and 963.83 billion rupees. In the same month FASTag volume fell 4 percent to 347 million and AePS volume rose 3 percent to 100 million; the other rails inside the system stay one to two orders of magnitude below the size needed to take displaced retail traffic. There is no comparable backup under the same roof if there is an outage. The counter-reading matters too: cash and card networks outside NPCI's data could absorb part of a disruption, and availability and downtime are not given alongside these monthly totals.", "refs": ["upi-july"]}, {"tr": "Bunu sınayacak eşik açık. Ağustos verilerinde UPI'nin işlem değeri 29,88 trilyon rupiyi aşarken IMPS'nin yıllık adet düşüşü sürerse, kayma süregelen bir yer değiştirme olarak doğrulanır. Kritik olan veri ise yayımlanmıyor: NPCI aylık toplamların yanına erişilebilirlik ve kesinti sürelerini eklemedikçe, bu ölçekteki bir rayın dayanıklılığı hakkında kamuoyunun elinde ölçülebilir bir şey yok.", "en": "The threshold that would test this is clear. If UPI's transaction value exceeds 29.88 trillion rupees in the August data while IMPS's annual volume keeps falling, the shift is confirmed as continuing displacement. The critical data are not published: unless NPCI adds availability and downtime alongside the monthly totals, the public has nothing measurable on the resilience of a rail at this scale.", "refs": ["upi-july"]}]}], "sources": [{"key": "upi-july", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/finance/news/upi-transactions-hit-record-23-66-billion-in-july-value-rs-29-88-trillion-126080100548_1.html", "title": {"tr": "Hindistan'da UPI işlem adedi temmuzda 23,66 milyara çıkarak en yüksek aylık düzeyi gördü", "en": "UPI transactions reached an all-time monthly high of 23.66 billion in India in July"}, "publishedDate": "2026-08-01"}], "radarPublishedAt": "2026-08-02T07:02:01+00:00", "n": 2, "date": "2026-08-02"}, {"writer": "eco-01", "title": {"tr": "Rekor seansı bireysel yatırımcı 8,26 trilyon won satarak karşıladı", "en": "Retail investors sold 8.26 trillion won into the largest one-day gain"}, "excerpt": {"tr": "Kospi 31 Temmuz'da yüzde 17,91 yükselerek 6.595,45'e çıktı; bu, endeksin hem oran hem puan olarak en büyük günlük kazancı. Aynı seansta yabancılar 7,22 trilyon won, kurumlar 1,15 trilyon won net alım yaparken bireysel yatırımcılar 8,26 trilyon won net satış yaptı. Yükselişin içinde fiyat kadar el değiştiren pay da var.", "en": "The Kospi rose 17.91 percent on July 31 to 6,595.45, the index's largest daily gain in both percentage and point terms. In the same session foreigners bought a net 7.22 trillion won and institutions 1.15 trillion won, while retail investors sold a net 8.26 trillion won. The move carried a change of ownership as well as a change of price."}, "sections": [{"h": {"tr": "Rekorun içindeki akış", "en": "The flow inside the number"}, "ps": [{"tr": "Kospi 31 Temmuz seansını 1.001,89 puan artışla 6.595,45'te kapattı. Yüzde 17,91'lik kazanç endeksin tarihindeki en büyük günlük artış oldu; önceki oran rekoru 30 Ekim 2008'de görülen yüzde 11,95'ti. İşlem hacmi 430,2 milyon paya ve 48,9 trilyon wona ulaştı.", "en": "The Kospi closed the July 31 session at 6,595.45, up 1,001.89 points. The 17.91 percent gain was the largest single-day advance in the index's history; the largest previous percentage gain was 11.95 percent, on Oct. 30, 2008. Volume reached 430.2 million shares worth 48.9 trillion won.", "refs": ["kospi"]}, {"tr": "Rakamın altındaki akış tek yönlü değil. Yabancı yatırımcılar 7,22 trilyon won, kurumlar 1,15 trilyon won net alım yaptı; bireysel yatırımcılar aynı gün 8,26 trilyon won net sattı. Yani endeksi yukarı taşıyan alım, büyük ölçüde yurt içindeki bireysel portföylerden çıkan payla karşılandı. Wonun dolar karşısında 13,4 won değer kazanarak 1.424'e gelmesi bu yönle uyumlu, ama tek başına yabancı girişinin kanıtı değil: kur aynı gün başka etkenlerle de hareket edebilir.", "en": "The flow underneath the number was not one-sided. Foreign investors bought a net 7.22 trillion won and institutions 1.15 trillion won, while retail investors sold a net 8.26 trillion won the same day. The buying that carried the index up was largely met by stock leaving domestic retail portfolios. The won firming 13.4 won to 1,424 against the dollar is consistent with that direction, but on its own it does not prove foreign inflow: the exchange rate can move on other things the same day.", "refs": ["kospi"]}]}, {"h": {"tr": "Fiyat neyi öğrendi?", "en": "What did the price learn?"}, "ps": [{"tr": "Tetikleyici yurt dışından geldi. Korea Herald'ın aktardığı analist değerlendirmesine göre yükselişi başlatan, Microsoft'un beklentinin üzerinde gelen ikinci çeyrek sonuçlarının yapay zekâ harcamasına ilişkin kaygıyı hafifletmesiydi. Endeks önceki üç seansta aynı kaygıyla yüzde 17'den fazla gerilemişti. Samsung Electronics yüzde 26,81, SK Hynix günlük tavan olan yüzde 29,95, Hanmi Semiconductor yüzde 27,98 kazandı. Bu haliyle seans, üç günde kurulan bir pozisyonun geri alınmasına benziyor; Kore şirketlerinin kendi kazançlarına dair yeni bir veri devreye girmiş değil. Karşı okuma da mümkün: bellek talebine ilişkin beklenti gerçekten yukarı güncellendiyse, hareketin bir bölümü kalıcı bir yeniden fiyatlama olur.", "en": "The trigger came from outside Korea. In the analyst assessment carried by The Korea Herald, what started the advance was Microsoft's better-than-expected second-quarter results easing concern about artificial-intelligence spending. The index had lost more than 17 percent over the previous three sessions on that same concern. Samsung Electronics gained 26.81 percent, SK Hynix the daily limit of 29.95 percent and Hanmi Semiconductor 27.98 percent. Read that way, the session looks like the unwinding of a position built over three days, with no new data about Korean earnings entering the picture. The opposite reading is available: if expectations for memory demand were genuinely revised upward, part of the move is a durable repricing.", "refs": ["kospi"]}, {"tr": "İki okumayı ayıracak gözlem, fiyatın kendisinde değil akışın devamında. Yabancı ve kurumsal net alım önümüzdeki haftalarda sürer ve endeks ağustos sonuna kadar 6.500'ün üzerinde kapanmayı korursa, beklentinin yukarı güncellendiği yorumu güçlenir. Net alım tersine döner ve endeks aynı dönemde 6.500'ün altına geri dönerse, geriye üç günlük düşüşün bir günde kapatılması kalır. Hacim de burada bir ölçüt: 48,9 trilyon wonluk işlem tutarı olağanüstü ve olağan günlere dönüşte hangi seviyenin tutunduğu, tek seansın kendisinden daha çok şey söyler.", "en": "What separates the two readings is whether the flow persists, rather than the price itself. If foreign and institutional net buying continues over the coming weeks and the index holds closes above 6,500 through the end of August, the case for a revised expectation strengthens. If net buying reverses and the index falls back below 6,500 in the same period, what remains is a three-day decline closed in a single day. Volume is a second gauge: 48.9 trillion won of turnover is exceptional, and which level holds once activity returns to normal says more than the one session does.", "refs": ["kospi"]}]}], "sources": [{"key": "kospi", "kind": "news", "name": "The Korea Herald", "url": "https://www.koreaherald.com/article/10827325", "title": {"tr": "Kospi tek seansta yüzde 17,91 yükselerek endeks tarihinin rekorunu kırdı", "en": "The Kospi rose 17.91 percent in a single session, the largest gain in its history"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-02", "title": {"tr": "İki farklı bilanço, tek bir kur sorunu", "en": "Two different balance sheets, one currency problem"}, "excerpt": {"tr": "Japonya Merkez Bankası politika faizini yüzde 1'de bıraktı ve metnin tonu iki yıllık devlet tahvili getirisini yukarı taşıdı. Yen ise hükümetin son müdahalesine karşın dolar başına 160,760 dolayında kaldı. Kararın fiyatladığı yer ile döviz işleminin tuttuğu yer aynı bilanço değil.", "en": "The Bank of Japan left its policy rate at 1 percent and the tone of the statement pushed the two-year government bond yield higher. The yen, despite the government's recent intervention, stayed around 160.760 to the dollar. What the decision prices and what the currency operation absorbs do not sit on the same balance sheet."}, "sections": [{"h": {"tr": "Karar, karşı oy ve eğrinin kısa ucu", "en": "The decision, the dissent and the short end"}, "ps": [{"tr": "31 Temmuz'da sona eren toplantıda kısa vadeli politika faizi yüzde 1'de bırakıldı. Kurul üyesi Hajime Takata, dış talep kaynaklı enflasyon riskine karşı faizin yüzde 1,25'e çıkarılmasını önererek tek başına karşı oy kullandı. Başkan Kazuo Ueda, ücret ve fiyatlama davranışı sertleştikçe temel enflasyonun yüzde 2 hedefinin üzerine sapma riski taşıdığını söyledi ve kurulun bir sonraki toplantıdan itibaren politikayı tartışacağını belirtti.", "en": "The meeting that ended on July 31 left the short-term policy rate at 1 percent. Board member Hajime Takata dissented alone, proposing a rise to 1.25 percent against inflation risk arising from external demand. Governor Kazuo Ueda said underlying inflation risked deviating above the 2 percent target as wage and price-setting behaviour turned more assertive, and said the board would debate policy from its next meeting onward.", "refs": ["boj"]}, {"tr": "Bu ifadeyi ilk fiyatlayan yer eğrinin kısa ucu oldu: metnin şahin tonu iki yıllık devlet tahvili getirisini yükseltti. Bunda şaşırtıcı bir yan yok, çünkü merkez bankasının elindeki araç rezervlerin fiyatıdır ve yönlendirme önce o fiyatın beklenen patikasını değiştirir. Kurun aynı ölçüde tepki vermemesi de aynı mekanizmanın diğer yüzü: döviz piyasası, tartışma niyetini değil gerçekleşen faiz farkını taşır.", "en": "The first place that priced the language was the short end of the curve: the hawkish tone of the statement lifted the two-year government bond yield. That is not surprising, because the instrument the central bank holds is the price of reserves, and guidance changes the expected path of that price first. The currency's smaller response is the other side of the same mechanism: the foreign exchange market carries the differential that is actually realised, not a stated willingness to debate.", "refs": ["boj"]}]}, {"h": {"tr": "Müdahale hangi kalemi değiştirir?", "en": "Which item does the intervention change?"}, "ps": [{"tr": "Döviz müdahalesi devletin bilançosunda bir takastır: dış varlık satılır, yen alınır. Belirli bir anda gelen akışı emer, ama o akışı üreten fonlama maliyeti farkını yerinde bırakır. Kanıt fiyatın kendisinde: son müdahaleye karşın yen dolar başına 160,760 dolayında tutundu. Yani şu an kurun istikrarı ile enflasyonun seyri devletin iki ayrı koluna dağılmış durumda ve farka dokunan araç yalnızca birinde. Karşı okumayı da elde tutmak gerekir: yenin düzeyini faiz farkından çok maliye politikasına ilişkin beklentiler belirliyorsa, ne yönlendirme ne de bir faiz artışı kuru kalıcı biçimde taşır.", "en": "A currency intervention is a swap on the state's balance sheet: foreign assets are sold and yen bought. It absorbs the flow arriving at a given moment while leaving in place the funding-cost differential that produces that flow. The evidence is in the price itself: despite the recent intervention the yen held around 160.760 to the dollar. Currency stability and the path of inflation therefore sit with two separate arms of the state, and only one of them holds the instrument that touches the differential. The counter-reading has to stay on the table: if the yen's level is set by expectations about fiscal policy rather than by the rate gap, neither the guidance nor a rate rise moves it durably.", "refs": ["boj"]}, {"tr": "Ueda'nın kendi çerçevesi kuru maliye bakanlığının konusu olmaktan çıkarıp yetki alanına geri getiriyor: hedefin üzerine sapma riskini ücret ve fiyatlama davranışına bağlıyor, ve bu davranışın yakıtı ithal maliyetten geçer. Buradan çıkan gözlem şu: eğer temel enflasyon tahminleri yüzde 2'nin üzerinde kalır ve ücret pazarlığı bu tonu sürdürürse, ekimin sonuna kadar ya politika faizi yüzde 1'in üzerine çıkar ya da karşı oy tek kişiden fazlasına yayılır. Tersi olursa, yani faiz de yenin seviyesi de yerinde kalırsa, kur sorununun faiz farkından bağımsız bir kaynağı olduğu görüşü güçlenir. Metin bir tarih vermiyor; belirsizlik burada hesaplanabilir bir risk değil.", "en": "Ueda's own framing pulls the currency back from being a finance ministry matter into the mandate: he ties the risk of an overshoot to wage and price-setting behaviour, and the fuel for that behaviour runs through imported costs. The observation that follows is this: if underlying inflation forecasts stay above 2 percent and wage bargaining keeps its current tone, then by the end of October either the policy rate moves above 1 percent or the dissent spreads beyond a single member. If neither happens — the rate unchanged and the yen still near its present level — the case strengthens that the currency problem has a source independent of the rate gap. The statement gave no date; the uncertainty here is not a calculable risk.", "refs": ["boj"]}]}], "sources": [{"key": "boj", "kind": "news", "name": "Taipei Times", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861730", "title": {"tr": "Japonya Merkez Bankası politika faizini yüzde 1'de tuttu, bir üye karşı oy kullandı", "en": "The Bank of Japan held its policy rate at 1 percent, with one dissent"}, "publishedDate": "2026-08-01"}], "date": "2026-08-01"}, {"writer": "eco-03", "title": {"tr": "Chevron borcunu kapattı, ExxonMobil hissedarına ödedi", "en": "Chevron paid down debt, ExxonMobil paid its shareholders"}, "excerpt": {"tr": "Aynı çeyrekte iki büyük petrol şirketi neredeyse aynı serbest nakit akışını açıkladı: Chevron 18,1 milyar dolar, ExxonMobil 17,2 milyar dolar. Chevron bu nakdin rekor düzeydeki bölümünü, 8,4 milyar dolar tutarında borç kapatmaya ayırdı; ExxonMobil 9,4 milyar dolar tutarında temettü ve pay geri alımı dağıttı. Fiyat ortamı ortak, sermaye tercihi değil.", "en": "In the same quarter two oil majors reported almost the same free cash flow: $18.1 billion at Chevron and $17.2 billion at ExxonMobil. Chevron put a record $8.4 billion of it into paying down debt; ExxonMobil distributed $9.4 billion as dividends and buybacks. The price environment was shared; the capital choice was not."}, "sections": [{"h": {"tr": "Çeyreğin rakamları", "en": "The quarter's figures"}, "ps": [{"tr": "Chevron ikinci çeyrekte 12,1 milyar dolar, seyreltilmiş hisse başına 6,11 dolar kâr; düzeltilmiş tarafta 12,0 milyar dolar ve 6,06 dolar bildirdi. Gelir 70,1 milyar dolar, kullanılan sermayenin getirisi yüzde 21 oldu. Faaliyetlerden nakit akışı 22,6 milyar dolar, sermaye harcaması 4,5 milyar dolar; aradaki 18,1 milyar dolar serbest nakit akışı olarak kaldı. Üretim yıllık yüzde 20 artışla günde 4.070 bin varil eşdeğerine çıktı ve ABD rafinerileri yüzde 97 kapasite kullanımıyla günde 1,07 milyon varillik rekor işleme yaptı.", "en": "Chevron reported second-quarter earnings of $12.1 billion, or $6.11 a diluted share, and $12.0 billion or $6.06 on the adjusted line. Revenue was $70.1 billion and return on capital employed 21 percent. Cash flow from operations was $22.6 billion against capital spending of $4.5 billion, leaving $18.1 billion of free cash flow. Production rose 20 percent from a year earlier to 4,070 thousand barrels of oil equivalent a day, and U.S. refineries set a throughput record of 1.07 million barrels a day at 97 percent utilisation.", "refs": ["chevron"]}, {"tr": "ExxonMobil aynı çeyrekte 14,5 milyar dolar, hisse başına 3,48 dolar kâr; düzeltilmiş tarafta 14,7 milyar dolar ve 3,52 dolar açıkladı. Faaliyetlerden nakit akışı 23,6 milyar dolar, serbest nakit akışı 17,2 milyar dolar oldu. Üretim yirmi yılı aşkın sürenin en yüksek düzeyine çıktı; Permiyen havzasında günlük 1,8 milyon varil eşdeğeriyle rekor kırıldı. İki şirketin serbest nakit akışı arasındaki fark 0,9 milyar dolar; yani üretilen nakit bakımından çeyrek ikisi için de aynı yere yakın çıktı.", "en": "ExxonMobil reported $14.5 billion, or $3.48 a share, and $14.7 billion or $3.52 adjusted for the same quarter. Cash flow from operating activities was $23.6 billion and free cash flow $17.2 billion. Production reached its highest level in more than two decades, with a record 1.8 million barrels of oil equivalent a day in the Permian. The gap between the two companies' free cash flow is $0.9 billion; in terms of cash generated, the quarter landed in nearly the same place for both.", "refs": ["exxon"]}]}, {"h": {"tr": "Nakit nereye gitti?", "en": "Where did the cash go?"}, "ps": [{"tr": "Chevron'da çeyreğin en büyük tek kalemi borç oldu: şirket rekor düzeyde 8,4 milyar dolar borç kapattı, 3,1 milyar dolar tutarında pay geri alımı yaptı ve hisse başına 1,78 dolar temettü ödedi. Yani 18,1 milyar dolar serbest nakdin yaklaşık yarısı bilançoya, geri kalanı hissedara gitti.", "en": "At Chevron the largest single use of the quarter was debt: the company paid down a record $8.4 billion, repurchased $3.1 billion of shares and paid a dividend of $1.78 a share. Close to half of the $18.1 billion of free cash flow went to the balance sheet and the rest to shareholders.", "refs": ["chevron"]}, {"tr": "ExxonMobil'de dağıtım 9,4 milyar dolar oldu: 4,3 milyar dolar temettü, 5,1 milyar dolar pay geri alımı; üçüncü çeyrek için hisse başına 1,03 dolar temettü ilan edildi. Neredeyse aynı nakit iki farklı adrese gidiyor ve bu, en azından bu çeyrekte, sermaye tercihinin fiyat ortamından bağımsız olduğunu gösteriyor. Alternatif açıklamayı da elde tutmak gerekir: Chevron'un borç kapatması Hess satın alımından kalan bir vade takviminin sonucu olabilir ve ExxonMobil'in dağıtım düzeyi bu çeyreğe verilmiş bir yanıttan çok yerleşik bir politika olabilir. İki durumda da rakamlar aynı, ama tercih olarak okunacak bir yan kalmaz.", "en": "At ExxonMobil distributions came to $9.4 billion: $4.3 billion of dividends and $5.1 billion of buybacks, with a third-quarter dividend of $1.03 a share declared. Nearly identical cash went to two different addresses, which suggests that in this quarter at least the capital choice was independent of the price environment. The alternative has to stay on the table: Chevron's debt reduction may follow a maturity schedule left by the Hess acquisition, and ExxonMobil's distribution level may be standing policy rather than an answer to this quarter. Either way the figures are the same, but nothing remains to read as a choice.", "refs": ["chevron", "exxon"]}]}, {"h": {"tr": "Fiyattan bağımsız olan satırlar", "en": "The lines that do not depend on price"}, "ps": [{"tr": "Çeyreğin tamamı, iki şirketin de belirlemediği bir fiyat düzeyine yaslanıyor; bu yüzden asıl soru, o düzey değiştiğinde hangi kalemin ayakta kaldığı. Chevron tarafında bu soruya en açık yanıt Batı Teksas'taki bir veri merkezi için Microsoft ile imzalanan 20 yıllık ve 2,67 gigavatlık elektrik anlaşması; gideri düşüren kalemler ise Hess satın alımından bir yılda sağlanan 1,5 milyar dolar sinerji ve 3 milyar dolar yapısal gider azalması. ExxonMobil'de karşılığı hacim ve gider: birikimli yapısal tasarruf 16,3 milyar dolar olurken Guyana'daki beşinci yüzer üretim biriminin dördüncü çeyrekte günde 250 bin varillik kapasiteyle devreye girmesi bekleniyor. İzlenecek gözlem, Chevron'un borç azaltmayı pay geri alımının üzerinde tutup tutmadığı: fiyat ortamı zayıfladığında bu sıralama korunursa bilanço tercihi gerçekten tercihtir, bozulursa bu çeyreğin dağılımı yalnızca vade takvimiydi.", "en": "The whole quarter leans on a price level neither company set, so the real question is which line survives when that level changes. On Chevron's side the clearest answer is the 20-year, 2.67-gigawatt power agreement signed with Microsoft for a West Texas data centre; the cost-side answers are $1.5 billion of Hess synergies achieved within a year and $3 billion of structural cost reductions. At ExxonMobil the equivalents are volume and cost: cumulative structural savings reached $16.3 billion, and a fifth floating production unit in Guyana is expected to start up in the fourth quarter with capacity of 250 thousand barrels a day. The observation to watch is whether Chevron keeps debt reduction above the buyback line: if the ordering holds as the price environment weakens, the balance-sheet preference is a real choice; if it breaks, this quarter's split was only a maturity schedule.", "refs": ["chevron", "exxon"]}]}], "sources": [{"key": "chevron", "kind": "news", "name": "Chevron", "url": "https://chevroncorp.gcs-web.com/news-releases/news-release-details/chevron-reports-second-quarter-2026-results", "title": {"tr": "Chevron 12,1 milyar dolar kâr ve 8,4 milyar dolar borç kapatması bildirdi", "en": "Chevron reported $12.1 billion of earnings and an $8.4 billion debt paydown"}, "publishedDate": "2026-07-31"}, {"key": "exxon", "kind": "news", "name": "ExxonMobil", "url": "https://investor.exxonmobil.com/company-information/press-releases/detail/1208/exxonmobil-announces-second-quarter-2026-results", "title": {"tr": "ExxonMobil ikinci çeyrekte 14,5 milyar dolar net kâr açıkladı", "en": "ExxonMobil reported second-quarter earnings of $14.5 billion"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-04", "title": {"tr": "Varilin fiyatı artık yükleme ayına bir ay kala belirlenecek", "en": "The barrel's price will now be set one month before loading"}, "excerpt": {"tr": "ADNOC, 1 Kasım'dan itibaren Murban, Das, Umm Lulu ve Upper Zakum türlerinin resmi satış fiyatını Platts Dubai değerlemesine bağlayacak. Fark, hedef teslim ayından iki ay değil bir ay önce açıklanacak. Değişen şey gösterge kadar, fiyat riskinin kimde ve ne kadar süre kaldığı.", "en": "From Nov. 1 ADNOC will set the official selling price of its Murban, Das, Umm Lulu and Upper Zakum grades off the Platts Dubai assessment. The differential will be announced one month, not two, before the target delivery month. What changes is the benchmark — and with it, who carries the price risk and for how long."}, "sections": [{"h": {"tr": "Değişen mekanizma", "en": "The mechanism that changed"}, "ps": [{"tr": "ADNOC dört Abu Dabi ham petrol türünün resmi satış fiyatı yöntemini değiştirdiğini duyurdu. Murban, Das, Umm Lulu ve Upper Zakum, 1 Kasım 2026'dan itibaren Platts Dubai değerlemesine (PCAAT00) ve buna eklenecek bir ADNOC farkına göre fiyatlanacak. Fark, hedef teslim ayından bir önceki ay açıklanacak.", "en": "ADNOC announced a change to the official selling price methodology for four Abu Dhabi crude grades. From Nov. 1, 2026, Murban, Das, Umm Lulu and Upper Zakum will be priced off the Platts Dubai assessment (PCAAT00) plus a differential set by ADNOC. That differential will be announced in the month preceding the target delivery month.", "refs": ["adnoc"]}, {"tr": "Bunun yerini aldığı yöntem, fiyatı yükleme tarihinden iki ay önce ICE Futures Abu Dhabi üzerinden belirliyordu. Şirket adımı rutin bir ticari gözden geçirmenin sonucu olarak tanımlıyor ve müşteri ile yatırımcı tabanına yönelik fiyat şeffaflığını güçlendirdiğini söylüyor. Bu çerçeve önemli, çünkü değişikliği bir strateji dönüşü olarak değil, fiyatın fiziksel piyasada zaten oluştuğu yere yaklaştırılması olarak sunuyor.", "en": "The method it replaces set the price two months ahead of loading, off ICE Futures Abu Dhabi. The company describes the step as the outcome of a routine commercial review and says it reinforces price transparency for its customer and investor base. That framing matters, because it presents the change not as a turn in strategy but as moving the price closer to where the physical market already forms it.", "refs": ["adnoc"]}]}, {"h": {"tr": "Bir ay kısalan pencere kime ne yapar?", "en": "What does a window shortened by a month do, and to whom?"}, "ps": [{"tr": "Fiyatın sabitlendiği an ile varilin yüklendiği an arasındaki boşluk, birinin taşımak zorunda olduğu bir risk penceresidir. İki ay önceden fiyatlanan bir kargoda alıcı, sabitleme ile teslim arasındaki iki aylık hareketi ya korumaya alır ya da üstlenir. Pencerenin bir aya inmesi bu süreyi yarıya indirir. Referansın Platts Dubai'ye taşınması ise ayrı bir etki yaratır: aynı rafineri programı için yarışan Körfez kargolarının çoğu zaten bu değerlemeye göre fiyatlandığından, ADNOC'un ilan edeceği fark doğrudan karşılaştırılabilir bir sayıya dönüşür. Karşı okuma da mümkün: şirketin kendi tanımıyla bu rutin bir ticari gözden geçirme ise, yöntem değişikliği riski yeniden dağıtmaktan çok mevcut fiyatlama alışkanlığını kayda geçiriyor olabilir.", "en": "The gap between the moment a price is fixed and the moment the barrel loads is a risk window somebody has to carry. On a cargo priced two months ahead, the buyer either hedges or absorbs two months of movement between the fixing and delivery. Cutting the window to one month halves that. Moving the reference to Platts Dubai does something separate: since most Gulf cargoes competing for the same refinery slot already price off that assessment, the differential ADNOC announces becomes a directly comparable number. The counter-reading is available: if this is a routine commercial review as the company describes it, the change may be recording existing pricing practice rather than redistributing risk.", "refs": ["adnoc"]}, {"tr": "Duyurunun en somut ayrıntısı finansman tarafında: ADNOC, değişikliğin ADNOC Murban'ın küresel orta vadeli tahvil ve sukuk programları dâhil borsada işlem gören araçlarında önemli bir etki yaratmasının beklenmediğini belirtiyor. Yani Murban adı borçlanma yapısında yerinde kalırken, onu taşıyan vadeli işlem sözleşmesi ham petrolün fiyatını belirleme işinden çekiliyor. İzlenecek gözlem burada net: kasım yüklemeleri için ekimde açıklanacak ilk fark, ve izleyen aylarda ilan edilen farkların aydan aya değişim aralığı. Pencere kısaldığı için bu aralığın daralması beklenir; daralmazsa, fiyatlama riskinin yerinde durduğu sonucuna varılır.", "en": "The most concrete detail in the announcement is on the financing side: ADNOC says the change is not expected to have a material impact on its listed instruments, including issuances under ADNOC Murban's global medium-term note and sukuk programmes. The Murban name stays in the borrowing structure while the futures contract that carried it steps back from setting the price of the crude. The observation to watch is clear enough: the first differential, announced in October for November loadings, and the month-to-month range of the differentials announced after it. A shorter window should narrow that range; if it does not, the pricing risk has not moved.", "refs": ["adnoc"]}]}], "sources": [{"key": "adnoc", "kind": "news", "name": "ADNOC", "url": "https://www.adnoc.ae/en/news-and-media/press-releases/2026/adnoc-announces-update-to-its-crude-pricing-methodology", "title": {"tr": "ADNOC ham petrol fiyatlamasını 1 Kasım'dan itibaren Platts Dubai'ye bağlıyor", "en": "ADNOC will price its crude off Platts Dubai from Nov. 1"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-05", "title": {"tr": "Yüzde 2,9'luk oran hangi hanenin faturası?", "en": "Whose bill is the 2.9 percent rate?"}, "excerpt": {"tr": "Euro Bölgesi'nde temmuz enflasyonu yüzde 2,8'den yüzde 2,9'a çıktı. Manşetteki 0,1 puanlık artışın altında iki karşıt hareket var: enerji yüzde 8,5'ten yüzde 10,0'a yükselirken gıda, alkol ve tütün yüzde 1,5'ten yüzde 1,2'ye indi. Ülkeler arasındaki fark ise 3,6 puan.", "en": "Euro area inflation went from 2.8 percent to 2.9 percent in July. Under that 0.1 point lie two opposite moves: energy climbed from 8.5 percent to 10.0 percent while food, alcohol and tobacco fell from 1.5 percent to 1.2 percent. Across countries, the spread is 3.6 points."}, "sections": [{"h": {"tr": "Manşetin altındaki iki yön", "en": "Two directions under the headline"}, "ps": [{"tr": "Eurostat'ın hızlı tahminine göre temmuzda yıllık enflasyon yüzde 2,9 oldu; haziranda yüzde 2,8'di. Bileşenler ise aynı yöne gitmedi. Enerjide yıllık oran yüzde 8,5'ten yüzde 10,0'a çıktı; hizmetler yüzde 3,2'den yüzde 3,3'e, enerji dışı sanayi malları yüzde 0,7'den yüzde 0,9'a yükseldi. Gıda, alkol ve tütün ise yüzde 1,5'ten yüzde 1,2'ye indi.", "en": "Eurostat's flash estimate put annual inflation at 2.9 percent in July, against 2.8 percent in June. The components did not move together. Energy rose from 8.5 percent to 10.0 percent a year; services went from 3.2 percent to 3.3 percent and non-energy industrial goods from 0.7 percent to 0.9 percent. Food, alcohol and tobacco fell from 1.5 percent to 1.2 percent.", "refs": ["eurostat"]}, {"tr": "Yüzde 2,9, tek bir sepetin ağırlıklı ortalamasıdır. Enerjideki yüzde 10,0 ile gıdadaki yüzde 1,2 zıt yönlere gittiğine göre, bir hanenin gerçekte karşılaştığı oran, bu iki kalemin kendi bütçesindeki payına bağlıdır: ısınma ve ulaşım faturası bütçesinde ağır basan bir hane yüzde 10,0'a yakın bir dünyada yaşar, gıdanın payı daha yüksek olan bir hane bu ay lehine çalışan bir kalemle karşılaşır. Hızlı tahmin bu dağılımı vermiyor; verdiği tek şey ortalama. Bu yüzden yüzde 2,9, kimsenin faturası olmayan bir sayı olarak okunmalı.", "en": "The 2.9 percent is the weighted average of one basket. Since the 10.0 percent on energy and the 1.2 percent on food moved in opposite directions, the rate a household actually meets depends on the share those two items hold in its own budget: a household whose heating and transport bill dominates lives closer to 10.0 percent, while one where food weighs more meets an item that worked in its favour this month. The flash estimate does not give that distribution; all it gives is the average. So 2.9 percent should be read as a number that is nobody's bill.", "refs": ["eurostat"]}]}, {"h": {"tr": "Aynı para birimi, farklı oranlar", "en": "One currency, different rates"}, "ps": [{"tr": "Ülke düzeyinde aralık daha da açılıyor. Litvanya yüzde 5,6 ile en yüksek oranı kaydetti; Kıbrıs yüzde 4,0, Hırvatistan yüzde 3,6, Belçika yüzde 3,5 ile onu izledi. Diğer uçta Estonya yüzde 2,0, Fransa yüzde 2,4, Finlandiya yüzde 2,6 ve Almanya yüzde 2,8 yer aldı. Uçlar arasındaki fark 3,6 puan ve bu, tek bir para biriminin içinde ölçülüyor.", "en": "At country level the range widens further. Lithuania recorded the highest rate at 5.6 percent, followed by Cyprus at 4.0 percent, Croatia at 3.6 percent and Belgium at 3.5 percent. At the other end were Estonia at 2.0 percent, France at 2.4 percent, Finland at 2.6 percent and Germany at 2.8 percent. The distance between the ends is 3.6 points, and it is measured inside a single currency.", "refs": ["eurostat"]}, {"tr": "Bu farkın kaynağı doğrudan okunamaz. Enerjinin ülke sepetlerindeki ağırlığı, ısınma kaynakları, vergi bileşimi ve ulusal fiyat düzenlemeleri hep aynı sayıya karışır; hızlı tahmin bunların hiçbirini ayırmıyor. Bir de ölçmenin sınırı var: ulusal bir tavan fiyat ya da fatura desteği haneyi korurken uyumlaştırılmış endekse ucuzlama olarak yansımayabilir, yani korunan bir hane yüksek görünen bir oranın içinde de bulunabilir. Ayrımı yapacak veri 19 Ağustos'ta geliyor: temmuzun tam verisi bileşenleri ve ülkeleri ayrıntılandıracak. O tarihe kadar elimizdeki tek doğru cümle şu — enerji yüzde 10,0'a çıktı, gıda yüzde 1,2'ye indi ve hangi hanenin hangisini taşıdığını bu tahmin söylemiyor.", "en": "The source of that gap cannot be read off directly. The weight of energy in national baskets, heating sources, the tax mix and national price regulation all feed into the same figure, and the flash estimate separates none of them. There is also a limit to what is being measured: a national price cap or bill support can shield a household without showing up in the harmonised index as a fall in price, so a protected household can sit inside a rate that looks high. The data that would separate these arrives on Aug. 19, when the full July figures break out components and countries. Until then the one accurate sentence available is this — energy rose to 10.0 percent, food fell to 1.2 percent, and this estimate does not say which household carries which.", "refs": ["eurostat"]}]}], "sources": [{"key": "eurostat", "kind": "news", "name": "Eurostat", "url": "https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-31072026-ap", "title": {"tr": "Euro Bölgesi'nde yıllık enflasyon temmuzda yüzde 2,9'a çıktı", "en": "Euro area annual inflation rose to 2.9 percent in July"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-06", "title": {"tr": "1979'dan beri durmuş bir kural ile 1993'ten kalma bir başkası", "en": "One rule untouched since 1979 and another left over from 1993"}, "excerpt": {"tr": "Federal Rezerv Kurulu aynı gün iki öneriyi görüşe açtı: banka yöneticilerine kredi açılmasını düzenleyen ve 1979'dan bu yana büyük ölçüde değişmeyen O Düzenlemesi ile karşılıklı bankalara ilişkin 1993 tarihli kurallar. İkisi de zararın nerede karşılanacağını belirleyen kenarlara dokunuyor ve ikisi de küçük kuruluşlarda.", "en": "The Federal Reserve Board put two proposals out for comment on the same day: Regulation O, which governs credit to bank insiders and has been largely unchanged since 1979, and the 1993 rules for mutual banking organisations. Both touch the edges that decide where a loss is absorbed, and both sit at small institutions."}, "sections": [{"h": {"tr": "Aynı gün, iki eski kural", "en": "One day, two old rules"}, "ps": [{"tr": "İlk öneri O Düzenlemesi'ni yeniliyor. Bu kural bankaların üst yöneticilerine, yönetim kurulu üyelerine ve büyük ortaklarına kredi açılmasını düzenliyor ve 1979'dan bu yana büyük ölçüde değişmeden kaldı. Öneri, dolar cinsinden eşikleri güncelleyip ekonomik büyümeye endeksliyor, yatırım fonlarındaki edilgen paylara gereksiz uygulamayı gideriyor, yasal gereklilikleri ve yerleşik yorumları metne yazıyor. Kurul kayırmalı kredilendirmeye karşı korumaların yerinde kaldığını belirtiyor; başkan yardımcısı Michelle W. Bowman ise küçük bölge bankalarının yönetim kuruluna deneyimli iş insanlarını kazandırmakta zorlandığını söylüyor.", "en": "The first proposal modernises Regulation O. The rule governs loans to a bank's senior executives, directors and principal shareholders, and has been largely unchanged since 1979. The proposal updates dollar thresholds and indexes them to economic growth, removes unnecessary application to passive interests in investment funds, and writes statutory requirements and long-standing interpretations into the text. The Board says safeguards against preferential lending remain in place; Vice Chair Michelle W. Bowman says community banks often struggle to recruit experienced business leaders to their boards.", "refs": ["fed-rego"]}, {"tr": "İkinci öneri karşılıklı bankaları ele alıyor: hissedar yerine mevduat sahiplerinin mülkiyetindeki kuruluşlar. Kurul bunların denetimini 2011'de üstlendi, ama yürürlükteki kurallar 1993'ten kalma. Öneri hangi araçların yasal sermaye sayılacağını açıklığa kavuşturuyor, usul yükünü azaltıyor ve bazı karşılıklı bankalar için sermaye artırımında esneklik sağlıyor. Kurulun aktardığına göre bu kuruluşların yüzde 90'ından fazlasının aktif büyüklüğü 3 milyar dolar ve altında ve düzenleme yaklaşık otuz yıldır ilk kapsamlı güncellemesini görüyor.", "en": "The second proposal covers mutual banking organisations: institutions owned by their depositors rather than by shareholders. The Board took supervisory authority over them in 2011, but the governing rules date from 1993. The proposal clarifies which instruments qualify as regulatory capital, reduces procedural burdens and gives some mutual banks more flexibility in raising capital. The Board says more than 90 percent of these institutions hold assets below $3 billion, and describes the update as the first comprehensive one in about thirty years.", "refs": ["fed-mutual"]}]}, {"h": {"tr": "Hangi tampon inceliyor?", "en": "Which buffer thins?"}, "ps": [{"tr": "İki öneri farklı konuları düzenliyor gibi görünse de aynı sorunun iki ucunda duruyor: zararı kim, hangi koşulla karşılar? O Düzenlemesi, kuruluşu yöneten kişinin aynı kuruluştan hangi koşulla borçlanabileceğini sınırlar; karşılıklı banka kuralları ise zararı emecek sermayenin tanımını yapar. İkisi de küçük kuruluşlarda uygulanıyor ve karşılıklı bankaların özelliği burada belirleyici: hissedarı olmayan bir banka, sıkışınca piyasaya adi pay ihraç edemez. Yani aynı gün, zarar emme kapasitesinin tanımı ile o kapasiteyi tüketebilecek kredinin sınırı birlikte açılıyor.", "en": "The two proposals look like separate subjects but stand at two ends of the same question: who absorbs a loss, and on what terms? Regulation O bounds the terms on which the people running an institution may borrow from it; the mutual bank rules define the capital that absorbs a loss. Both apply at small institutions, and the nature of a mutual matters here: a bank with no shareholders cannot issue common equity to a market when it is squeezed. So on one day the definition of loss-absorbing capacity and the limit on the lending that could consume it are opened together.", "refs": ["fed-rego", "fed-mutual"]}, {"tr": "Dayanıklılık savı da ciddiye alınmalı, çünkü güçlü. 1979 tarihli bir dolar eşiğini ekonomik büyümeye endekslemek, gerçek anlamda bir gevşetmeden çok aradan geçen kırk yedi yılın aritmetiğini tamamlar; yatırım fonlarındaki edilgen paylara uygulamayı kaldırmak bir sınırı değil evrak yükünü azaltır; ve kurul, kayırmalı kredilendirmeye karşı korumaların yerinde kaldığını açıkça söylüyor. Karşılıklı banka tarafında da hangi aracın sermaye sayılacağını netleştirmek, tanımı belirsiz bırakmaktan daha güvenli olabilir. Bu yüzden asıl sınav önerilerin kendisi değil, nihai metin. İki öneride de görüş süresi Federal Register'da yayımdan sonra 60 gün; izlenecek şey, endekslenmiş eşiğin hangi rakamda karara bağlandığı ve kayırmalı koşul yasağının nihai kuralda aynen kalıp kalmadığı.", "en": "The resilience case deserves a serious hearing, because it is strong. Indexing to economic growth a dollar threshold that has stood since 1979 completes the arithmetic of forty-seven intervening years rather than loosening anything in real terms; removing application to passive interests in investment funds cuts paperwork rather than a limit; and the Board states plainly that the safeguards against preferential lending remain. On the mutual side, clarifying which instruments count as capital may be safer than leaving the definition unsettled. The real test is therefore not the proposals but the final text. Comments on both are due 60 days after publication in the Federal Register; what to watch is the figure the indexed threshold settles at, and whether the prohibition on preferential terms survives unchanged into the final rule.", "refs": ["fed-rego", "fed-mutual"]}]}], "sources": [{"key": "fed-rego", "kind": "news", "name": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731b.htm", "title": {"tr": "Fed, banka yöneticilerine kredi açılmasını düzenleyen kuralı yenilemeyi önerdi", "en": "The Fed proposed to modernise its rule on lending to bank insiders"}, "publishedDate": "2026-07-31"}, {"key": "fed-mutual", "kind": "news", "name": "Federal Reserve Board", "url": "https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260731a.htm", "title": {"tr": "Fed, karşılıklı bankalara ilişkin 1993 tarihli kuralları güncellemeyi önerdi", "en": "The Fed proposed updating its 1993 rules for mutual banking organisations"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "eco-01", "title": {"tr": "Temmuzda yüzde 67 eriyen portföyü tek bir alıcı devraldı", "en": "A single buyer took over a portfolio that lost 67 percent in July"}, "excerpt": {"tr": "Aynı mektupta iki rakam duruyor: aylık yüzde 67 kayıp ve yılbaşından bu yana yüzde 80 kazanç. İkisi arasındaki mesafe, temmuzda fiyatı kimin belirlediğini anlatıyor.", "en": "One letter carries two numbers: a 67 percent monthly loss and an 80 percent gain since January. The distance between them says who was setting the price in July."}, "sections": [{"h": {"tr": "Aynı mektuptaki iki rakam", "en": "Two numbers in one letter"}, "ps": [{"tr": "Leopold Aschenbrenner'in fonu Situational Awareness, yatırımcılarına gönderdiği mektupta portföyünün temmuzda yüzde 67 gerilediğini bildirdi. Aynı mektupta fonun 2026 başından bu yana hâlâ yüzde 80 kazançta olduğu yazıyor. Fon, hisse portföyünün büyük bölümünü bu hafta Citadel'e sattı ve kaldıracı tamamen kaldırdı. Tek bir ay, bir yılın kazancının büyük kısmını götürmüş; kalan pozisyon ise ödünç parayla değil, yalnızca öz sermayeyle taşınıyor.", "en": "Leopold Aschenbrenner's fund, Situational Awareness, told investors in a letter that its portfolio fell 67 percent in July. The same letter says the fund is still up 80 percent since the start of 2026. It sold the bulk of its stock portfolio to Citadel this week and removed leverage entirely. One month took most of a year's gain, and what remains is carried on equity rather than on borrowed money.", "refs": ["sa-letter"]}, {"tr": "Mektubun ikinci yarısı daha ayırt edici. Aschenbrenner \"Bu ay sizi hayal kırıklığına uğrattık\" diye yazdı ve fonun sermayesinin zarar görmesine tehlikeli ölçüde yaklaştığını belirtti. Reuters'ın aktardığı anlatımda kayıp, yapay zekâ hisselerindeki sert düşüş ile piyasa likiditesinin kurumasının aynı anda gelmesine bağlanıyor. 2024'te kurulan fon için bu cümle, fiyatın nereye gittiğinden çok çıkışın ne kadar dar olduğunu anlatıyor.", "en": "The second half of the letter is the more distinctive part. Aschenbrenner wrote that \"we let you down this month\" and that the fund came dangerously close to impairing its capital. In the account reported by Reuters, the loss is attributed to a steep decline in AI stocks arriving at the same time as market liquidity dried up. For a fund founded in 2024, that is less a statement about where prices went than about how narrow the exit was.", "refs": ["sa-letter"]}]}, {"h": {"tr": "Satan taraf fiyatı belirlediğinde", "en": "When the seller sets the price"}, "ps": [{"tr": "Bir aylık yüzde 67'lik düşüşün yanında yılbaşından beri korunan yüzde 80'lik kazanç, iki farklı hikâyeye işaret ediyor ve aralarındaki fark önemli. Kaldıracın tamamen kaldırılması ve portföyün büyük bölümünün tek seferde tek bir kuruma geçmesi, görüş değiştiren bir yatırımcının kademeli satışına değil, finansmanın dayattığı bir çözülmeye benziyor. Karşıt açıklama da elde: elindeki hisseler gerçekten yeniden fiyatlanmış olabilir ve satış, fazla yoğunlaşmış bir portföyü küçültmek için verilmiş bilinçli bir karar olabilir. Mektup bu ikisini kesin biçimde ayırmıyor; ayıracak olan, aynı hisselere kimin ne zaman alıcı geldiği.", "en": "A 67 percent monthly fall sitting next to a preserved 80 percent gain for the year points to two different stories, and the difference matters. Removing leverage entirely and moving the bulk of the portfolio to a single institution at once looks less like an investor changing their mind and selling down in stages than like an unwind imposed by financing. The competing explanation is available too: the holdings may genuinely have been repriced, and the sale may have been a deliberate decision to shrink a concentrated book. The letter does not settle the question; what will settle it is who comes in to buy the same shares, and when.", "refs": ["sa-letter"]}, {"tr": "Ayrımı gözlemlenebilir kılan bir ölçüt var. Eğer temmuz kaybı ağırlıkla bir finansman olayıysa, kaldıraçsız kalan portföyün getirisi bundan sonra aynı hisselerin seyriyle birlikte hareket eder ve aradaki uçurum kapanır; eğer varlıkların kendisi yeniden fiyatlandıysa kapanmaz. Bunu izlemenin yolu fonun sonraki aylık mektuplarındaki getiri rakamı ile Citadel'e devredilen portföyün açıklanacak büyüklüğü. Ekim sonuna kadar bu iki veri, temmuzdaki hareketin bir kaldıraç kazası mı yoksa bir değer kararı mı olduğunu gösterecek.", "en": "There is a way to make the distinction observable. If July's loss was mainly a financing event, the return on the now-unlevered portfolio should track the same shares from here and the gap should close; if the assets themselves were repriced, it will not. The way to watch that is the return figure in the fund's subsequent monthly letters together with the disclosed size of the portfolio transferred to Citadel. By the end of October those two pieces of data should show whether July was a leverage accident or a judgment about value.", "refs": ["sa-letter"]}]}], "sources": [{"key": "sa-letter", "kind": "news", "name": "KFGO", "url": "https://kfgo.com/2026/07/31/situational-awareness-portfolio-sinks-67-in-july-on-ai-stock-rout-letter-shows/", "title": {"tr": "Situational Awareness'ın portföyü temmuzda yüzde 67 eridi", "en": "Situational Awareness' portfolio sank 67 percent in July"}, "publishedDate": "2026-07-31"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-02", "title": {"tr": "Bu paranın kur riski kimin bilançosunda duruyor?", "en": "Whose balance sheet is carrying the currency risk on this money?"}, "excerpt": {"tr": "Toplanan tutarın yaklaşık yüzde 90'ı tek bir kalemden geliyor: bankaların yurt dışından topladığı döviz mevduatı. O mevduatın kur riski bankada kalmıyor.", "en": "About 90 percent of the total comes from a single line: foreign-currency deposits banks raised abroad. The currency risk on those deposits does not stay with the banks."}, "sections": [{"h": {"tr": "Kalemler ve oranlar", "en": "The lines and the proportions"}, "ps": [{"tr": "Hindistan Merkez Bankası, 5 Haziran'da duyurup 8 Haziran'da işleme açtığı takas imkânı kapsamında 31 Temmuz itibarıyla 40.816 milyon dolar toplandığını bildirdi. Bu tutarın 36.725 milyon dolar tutarındaki bölümü yurt dışında yerleşiklerin açtığı FCNR(B) döviz mevduatlarından geldi. Yurt dışı döviz borçlanmaları 2.575 milyon dolar, dış ticari borçlanmalar 1.516 milyon dolar düzeyinde kaldı. Üç bacaklı bir düzenekte ağırlığın neredeyse tamamı tek bacakta toplanmış durumda.", "en": "The Reserve Bank of India reported $40,816 million mobilised through 31 July under the swap facility it announced on 5 June and opened on 8 June. Of that, $36,725 million came through FCNR(B) foreign-currency deposits opened by non-residents. Overseas foreign currency borrowings reached $2,575 million and external commercial borrowings $1,516 million. In a three-legged arrangement, almost all of the weight has landed on one leg.", "refs": ["rbi-swap"]}, {"tr": "Devrenin nasıl kapandığına bakmak gerekiyor. Yetkili satıcı banka yurt dışında yerleşik birinden döviz mevduatı alıyor; mevduat bankanın yükümlülüğü olarak duruyor. Banka bu dövizi merkez bankasıyla takas ettiğinde kur pozisyonu kendi bilançosundan çıkıp merkez bankasının bilançosuna geçiyor, karşılığında yurt içinde rupi likiditesi doğuyor. İmkân FCNR(B) mevduatları için 30 Eylül'e, diğer iki bacak için 31 Aralık'a kadar açık. Yani rakam bir sermaye girişini ölçtüğü kadar, kamu kesiminin üstlendiği bir döviz taahhüdünü de ölçüyor.", "en": "It is worth following how the circuit closes. An authorised dealer bank takes a foreign-currency deposit from a non-resident, and the deposit sits as the bank's liability. When the bank swaps that currency with the central bank, the exchange-rate position leaves its own balance sheet for the central bank's, and rupee liquidity appears domestically in return. The facility stays open until 30 September for FCNR(B) deposits and until 31 December for the other two legs. The figure therefore measures a public-sector currency commitment as much as it measures a capital inflow.", "refs": ["rbi-swap"]}]}, {"h": {"tr": "Hangi bacak doldu", "en": "Which leg filled"}, "ps": [{"tr": "Bacaklar arasındaki oran tesadüf değil. Mevduat bacağı 36.725 milyon dolar taşırken iki borçlanma bacağı 2.575 milyon dolar ve 1.516 milyon dolar düzeyinde kaldı. Bunun bir okuması şu: merkez bankasının koruma maliyetini üstlendiği yerde hacim oluşuyor, üstlenmediği yerde oluşmuyor. Fiyat sinyaline verilen bir yanıt bu, tasarruf sahibinin Hindistan'a bakışında kalıcı bir değişiklik değil. Karşıt açıklamayı da hesaba katmak gerekiyor: dış ticari borçlanma talebi, takas koşullarıyla hiç ilgisi olmayan nedenlerle — yatırım programlarının seyri, küresel borçlanma maliyetleri — zayıf olabilir. Bu durumda oran, imkânın tasarımından çok reel yatırımın durgunluğunu gösterir.", "en": "The proportion between the legs is not an accident. The deposit leg carries $36,725 million while the two borrowing legs stop at $2,575 million and $1,516 million. One reading is that volume appears where the central bank absorbs the hedging cost and does not appear where it does not. That is a response to a price signal, not a durable change in how savers view India. The competing account deserves weight too: demand for external commercial borrowing may be weak for reasons unrelated to the swap terms — the state of investment programmes, global borrowing costs. On that reading the ratio reflects sluggish real investment rather than the design of the facility.", "refs": ["rbi-swap"]}, {"tr": "İki okumayı ayıracak bir tarih var: 30 Eylül. Mevduat bacağının açık kaldığı süre o gün doluyor. Eğer bu para düşük maliyetli korumaya verilmiş bir yanıtsa, tarih geçtikten sonra FCNR(B) girişinin belirgin biçimde yavaşlaması, eğer yurt dışında yerleşiklerin tercihinde gerçek bir değişimse yavaşlamaması beklenir. Gözlenecek veri merkez bankasının aynı başlıkta yayımlayacağı sonraki raporlar; ölçüt de eylül sonrası aylık artışın haziran-temmuz temposuna oranı.", "en": "One date separates the two readings: 30 September, when the window on the deposit leg closes. If this money is a response to cheap hedging, the FCNR(B) inflow should slow markedly once the date passes; if it reflects a real shift in non-resident preference, it should not. The data to watch are the central bank's subsequent reports under the same heading, and the test is the monthly increase after September measured against the June-July pace.", "refs": ["rbi-swap"]}]}], "sources": [{"key": "rbi-swap", "kind": "news", "name": "Reserve Bank of India", "url": "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63274", "title": {"tr": "Hindistan'ın takas imkânı haziran ayından bu yana 40,8 milyar dolar topladı", "en": "India's swap facility has drawn $40.8 billion since June"}, "publishedDate": "2026-08-01"}], "n": 3, "radarPublishedAt": "2026-08-01T15:01:39+00:00", "date": "2026-08-01"}, {"writer": "eco-03", "title": {"tr": "Teklif imzalanmadan hisse yüzde 20 primlendi", "en": "The shares gained more than 20 percent before any offer was signed"}, "excerpt": {"tr": "Integer'ın satılık olduğu nisandan beri biliniyordu. Cuma günü fiyatlanan yeni bilgi şirketin el değiştireceği değil, hangi rakamdan el değiştirebileceğiydi.", "en": "That Integer was for sale had been known since April. What the market priced on Friday was not that the company would change hands but at what number it might."}, "sections": [{"h": {"tr": "Bilinen satış, yeni rakam", "en": "A known sale, a new number"}, "ps": [{"tr": "Wall Street Journal, konuya vâkıf kaynaklara dayanarak KKR'nin Integer Holdings için hisse başına 127 dolar tutarında bir teklife yaklaştığını, teklifin önümüzdeki hafta gelebileceğini bildirdi. Bu rakam şirkete yaklaşık 4,3 milyar dolar değer biçiyor. Hisse cuma günü yüzde 20'nin üzerinde primle kapandı. Oysa şirketin satış süreci yeni değil: Integer, alıcı ilgisi gelmesinin ardından nisan ayında stratejik bir inceleme başlatmıştı. Piyasanın cuma günü öğrendiği şey şirketin elden çıkabileceği değil, seviyeydi.", "en": "The Wall Street Journal, citing people familiar with the matter, reported that KKR is nearing an offer of $127 a share for Integer Holdings and that it could come next week. That number values the company at about $4.3 billion. The shares closed more than 20 percent higher on Friday. The sale process, however, is not new: Integer opened a strategic review in April after receiving buyer interest. What the market learned on Friday was the level, not that the company might change hands.", "refs": ["integer-kkr"]}, {"tr": "Rakamın yanında ne olmadığına bakmak da öğretici. Haberde hisse başına bir fiyat var; finansmanın nasıl kurulacağı, işlemin hangi koşullara bağlanacağı, cayma bedelinin bulunup bulunmayacağı yok. Bunlar teklifin ekonomik içeriğini belirleyen kalemler ve hiçbiri henüz kamuya açık değil. Karşılaştırma kümesi de tek bir çarpanı desteklemiyor: aynı haberde anılan işlemlerden American Industrial Partners'ın Avanos Medical alımı 1,27 milyar dolar, Blackstone ile TPG'nin Hologic anlaşması 18 milyar dolar seviyesini aşıyor. Sağlık üretiminde el değiştiren varlıklar iki büyüklük mertebesi arasına yayılıyor.", "en": "It is just as instructive to look at what does not sit beside the number. The report gives a price per share; it does not give the financing structure, the conditions the transaction would carry, or whether there is a break fee. Those are the items that determine an offer's economic content, and none of them is public yet. The comparison set does not support a single multiple either: of the deals cited in the same report, American Industrial Partners' purchase of Avanos Medical was $1.27 billion while Blackstone and TPG's Hologic agreement was over $18 billion. Healthcare manufacturing assets are changing hands across two orders of magnitude.", "refs": ["integer-kkr"]}]}, {"h": {"tr": "Rakamın taşımadığı bilgi", "en": "What the number does not carry"}, "ps": [{"tr": "Satış süreci nisanda kamuya açıldığına göre, cuma günkü hareketin ölçtüğü şey niyetin keşfi olamaz; ölçtüğü şey beklenen bedelin ve işlemin sonuçlanma ihtimalinin yukarı revize edilmesi. Bu ayrım önemli, çünkü ilkinde hisse yeni bir olasılığı, ikincisinde ise zaten bilinen bir olasılığın fiyatını içeriyor. Alternatif bir okuma da savunulabilir: nisandaki inceleme duyurusu, somut bir teklif üretme ihtimali düşük görülerek karşılanmış olabilir; o hâlde cuma günkü primin bir bölümü, rakamın revizyonundan değil inandırıcı bir alıcının ortaya çıkmasından gelir. İkisini ayırmak için nisan ile temmuz sonu arasındaki fiyat seyri gerekir ve o veri bu haberde yok.", "en": "Because the sale process became public in April, what Friday's move measured cannot be the discovery of intent; it is an upward revision to the expected consideration and to the odds of completion. The distinction matters, because in the first case the share price contains a new possibility and in the second it contains the price of a possibility already known. An alternative reading is defensible: April's review announcement may have been received as unlikely to produce a concrete bid, in which case part of Friday's premium comes from a credible buyer appearing rather than from a revision to the number. Separating the two would require the price path between April and the end of July, and that data is not in this report.", "refs": ["integer-kkr"]}, {"tr": "Bu yüzden ilk bağlayıcı sınav, teklifin gelip gelmediği değil geldiğinde neyi açıkladığı olacak. Bir anlaşma duyurulursa metin hisse başına ödenecek bedeli, bedelin nakit mi hisse mi olduğunu, finansman taahhütlerini ve kapanış koşullarını yazar. Hisse başına 127 dolar rakamının gerçekte ne anlama geldiğini belirleyecek girdiler bunlar; eylül sonuna kadar açıklanacak bir anlaşma metni, cuma günkü fiyatın neyi doğru neyi eksik fiyatladığını gösterecek.", "en": "The first binding test will therefore not be whether the offer arrives but what it discloses when it does. If an agreement is announced, the document will state the consideration per share, whether it is cash or stock, the financing commitments and the closing conditions. Those are the inputs that decide what $127 actually means; an agreement published by the end of September would show what Friday's p
