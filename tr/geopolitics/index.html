<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .edition-symbol{display:inline;margin-inline-start:.3em}.edition-text{display:inline}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writer-intro-copy{min-width:0}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .radar-stamp{display:block;margin-top:5px;color:var(--muted);font-size:.64rem;
    line-height:1.25;letter-spacing:.02em}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: a full-width shell with a readable prose measure. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .article-prose{max-width:72ch;margin-inline:auto}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }
    #briefsSection .section-title .podcast-icon{
      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }
    #briefsSection .section-title .podcast-bar audio{display:none}
    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:127px;min-width:0;
      min-height:40px;margin-left:0;padding:5px 24px 5px 8px;font-size:.72rem;
    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .edition-btn .edition-symbol{display:inline;margin-inline-start:0}.edition-btn .edition-text{display:none}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }
    .topic-btn svg{width:14px;height:14px}
    .topic-label{font-size:.65rem;line-height:1;letter-spacing:-.015em}
    .header-right{flex:0 0 auto;margin-left:0;gap:5px}
    .archive-link{width:38px;padding:7px}
    .archive-label{
      position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
      margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;border:0!important;
    }

nd the Middle East. According to Al Jazeera's report based on Reuters, Saudi Arabia announced a 14-country maritime coalition that same week to protect freedom of navigation."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/1/israel-launches-attacks-across-gaza-one-day-after-hamas-agrees-to-disarm", "publishedDate": "2026-08-01", "date": {"tr": "1 Ağu", "en": "Aug 1"}, "title": {"tr": "Hamas'ın silahsızlanmayı kabul etmesinin ardından Gazze'de İsrail saldırıları sürdü", "en": "Israeli attacks resumed across Gaza after Hamas accepted disarmament"}, "summary": {"tr": "Al Jazeera, Hamas'ın taslak anlaşmayı kabul etmesinden saatler sonra Gazze genelinde İsrail hava saldırıları düzenlendiğini bildirdi. Kanalın aktardığına göre saldırılarda en az iki Filistinli öldü, en az on kişi yaralandı.", "en": "Al Jazeera reported Israeli air attacks across Gaza hours after Hamas accepted the draft agreement. According to the broadcaster, at least two Palestinians were killed and at least ten wounded."}, "detail": {"tr": "Saldırılar, Hamas'ın ABD Başkanı Donald Trump'ın Barış Kurulu tarafından hazırlanan taslak barış anlaşmasını kabul ettiğini açıklamasının ardından geldi. Taslak, Hamas'ın silahlarını aşamalı olarak bırakmasını ve buna karşılık İsrail'in Gazze'den çekilmesini öngörüyor. Ölü ve yaralı sayıları Al Jazeera'nın kendi aktarımına dayanıyor; bağımsız bir doğrulama bu haberde yer almıyor.", "en": "The attacks followed Hamas's announcement that it had accepted the draft peace agreement drawn up by US President Donald Trump's Board of Peace. The draft provides for Hamas to give up its weapons in phases, matched by an Israeli withdrawal from Gaza. The casualty figures come from Al Jazeera's own reporting; the item carries no independent confirmation."}, "editionDate": "2026-08-01"}, {"featured": true, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/trump-says-us-has-understanding-with-israel-on-hamas-disarmament-deal", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Trump, silahsızlanma anlaşmasında İsrail'le \"mutabakat\" olduğunu söyledi", "en": "Trump says there is an \"understanding\" with Israel on the disarmament deal"}, "summary": {"tr": "Trump, 31 Temmuz'da Camp David'deki kabine toplantısında İsrail'le bir mutabakat bulunduğunu söyledi. Hamas birkaç saat önce anlaşmanın ilk adımını kabul ettiğini açıklamıştı; İsrail hükümeti metnin şartlarını resmen kabul etmiş değil.", "en": "Trump said at a Cabinet meeting at Camp David on 31 July that there is an understanding with Israel. Hours earlier Hamas had said it accepted the deal's first step; the Israeli government has not formally accepted the terms."}, "detail": {"tr": "Trump'ın aktarımına göre İsrail durumdan memnun ve Hamas'ın silahsızlandırılması bir atılım. Hamas'ın kabul ettiği ilk adım, silahların Filistinli bir komiteye teslim edilmesi karşılığında İsrail'in Gazze'den tam olarak çekilmesini öngörüyor. İsrail'den gelen tepkiler ayrışıyor: Bakan Itamar Ben-Gvir planı \"İsrail için kabul edilemez\" diye niteledi; BM Daimi Temsilcisi Danny Danon CNN'e konuşurken Hamas'ın silahlara yeniden ulaşıp ulaşamayacağını sorguladı. Trump'ın cümlesi tek taraflı bir aktarımdır; İsrail hükümetinin yazılı bir kabulü bu haberde yer almıyor.", "en": "By Trump's account Israel is content with the arrangement and the disarmament of Hamas is a breakthrough. The first step Hamas accepted provides for weapons to be handed to a Palestinian committee in exchange for a full Israeli withdrawal from Gaza. Israeli responses diverge: Minister Itamar Ben-Gvir called the plan \"unacceptable to Israel\", while UN ambassador Danny Danon, speaking to CNN, questioned whether Hamas would be able to reach those weapons again. Trump's statement is one party's account; no written Israeli acceptance appears in the report."}, "editionDate": "2026-08-01"}, {"featured": true, "topic": "geopolitics", "tag": "conflict", "src": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog-july-31-2026/", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Trump İran'la karşılıklı vuruşmanın sürebileceğini söyledi, Bessent el konulan varlıkları anlattı", "en": "Trump said the exchange with Iran may continue as Bessent set out the seized assets"}, "summary": {"tr": "Trump 31 Temmuz'da gazetecilere İran'la karşılıklı saldırıların bir süre daha sürebileceğini söyledi. Aynı gün Hazine Bakanı Scott Bessent, ABD'nin dünya genelinde İran varlıklarını aradığını ve bu paranın İran halkına gideceğini belirtti.", "en": "Trump told reporters on 31 July that the exchange of strikes with Iran might continue for a while. The same day Treasury Secretary Scott Bessent said the US is looking for Iranian assets worldwide and that the money would go to the Iranian people."}, "detail": {"tr": "Trump, Amerikalıların karşılıklı vuruşmanın devamını beklemesi gerekip gerekmediği sorusuna \"Biraz… Tetikte olmak zorundasınız\" karşılığını verdi; İran'ın durumunun çok kötü olduğunu, buna rağmen direnenlerin hakkını teslim ettiğini söyledi. Bessent, el konulan varlıklar için arayışın dünya genelinde sürdüğünü aktardı. Al Jazeera'nın canlı sayfası aynı gün, Tasnim ajansına konuşan bir İran yetkilisinin ABD saldırılarına karşı hazırlanmış kapsamlı bir yanıt planından söz ettiğini bildirdi; yetkilinin adı verilmedi ve plan bağımsız olarak doğrulanmadı.", "en": "Asked whether Americans should expect the back-and-forth to continue, Trump answered \"A little bit… You always have to keep your guard up\", saying Iran was doing very poorly while crediting those who kept going. Bessent said the search for seized assets is running worldwide. Al Jazeera's live page reported the same day that an Iranian official quoted by the Tasnim agency described a comprehensive prepared response to any US attacks; the official was not named and the plan has not been independently verified."}, "editionDate": "2026-08-01"}, {"featured": true, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/spain-pm-to-visit-ceuta-after-19-migrants-die-breaching-border-from-morocco", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Sánchez, sınırı aşma sırasında ölümlerin yaşandığı Ceuta'ya gitti", "en": "Sánchez travelled to Ceuta after deaths during the border crossing"}, "summary": {"tr": "Al Jazeera, Fas'tan İspanya'nın Ceuta kentine geçmeye çalışırken en az 57 kişinin öldüğünü bildirdi. Başbakan Pedro Sánchez cuma günü kente giderek geçişleri İspanya'nın egemenliğine yönelik bir ihlal olarak niteledi.", "en": "Al Jazeera reported that at least 57 people died trying to cross from Morocco into the Spanish city of Ceuta. Prime Minister Pedro Sánchez travelled there on Friday and called the crossings a violation of Spanish sovereignty."}, "detail": {"tr": "Habere göre yaklaşık 60.000 kişi 24 saat içinde karadan ve denizden Ceuta'ya geçti; bölge başkanı Juan Jesús Vivas daha önce 34 ölü bildirmişti. İspanya İçişleri Bakanlığı cuma gününe kadar yaklaşık 25.000 kişinin Fas'a geri gönderildiğini açıkladı; Euronews aynı gün öğleden sonra bu sayıyı 48.000'in üzerinde verdi ve ölü sayısını en az 34 olarak aktardı. Sánchez artışı, bir Yüksek Mahkeme kararını yanlış yorumlayan insan kaçakçılığı şebekelerine bağladı. Avrupa Komisyonu Başkanı Ursula von der Leyen görüntüleri \"kabul edilemez\" diye niteledi, Fransa İspanya sınırında denetimleri artırdı, İtalya Başbakanı Giorgia Meloni Schengen'in askıya alınmasını gündeme getirdi. Fas makamları geçişleri durdurmak için tazyikli su kullandı.", "en": "The report says about 60,000 people crossed into Ceuta by land and sea within 24 hours; the regional president, Juan Jesús Vivas, had earlier given a toll of 34 dead. Spain's interior ministry said roughly 25,000 people had been returned to Morocco by Friday; Euronews put the figure above 48,000 by Friday afternoon and gave a toll of at least 34. Sánchez attributed the surge to trafficking networks misreading a Supreme Court ruling. European Commission President Ursula von der Leyen called the images \"unacceptable\", France stepped up checks on its border with Spain, and Italy's Prime Minister Giorgia Meloni raised suspending Schengen. Moroccan authorities used water cannon to stop crossings."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/poland-protests-to-russian-ambassador-over-missile-incursion", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Polonya, toprağına düşen Rus füzesi için Moskova büyükelçisini bakanlığa çağırdı", "en": "Poland summoned Russia's ambassador over a missile that landed on its territory"}, "summary": {"tr": "Polonya Dışişleri Bakanlığı, perşembe günü Lublin bölgesindeki Tarnawa Kolonia köyüne düşen Rus yapımı Kh-101 füzesi nedeniyle Rusya'nın büyükelçisini cuma günü bakanlığa çağırdı. Olayda can kaybı bildirilmedi.", "en": "Poland's foreign ministry summoned Russia's ambassador on Friday over a Russian-made Kh-101 missile that landed on Thursday in the village of Tarnawa Kolonia in the Lublin region. No casualties were reported."}, "detail": {"tr": "Bakanlık sözcüsü Maciej Wewior'a göre büyükelçiye, egemen bir devletin güvenliğine yönelik düşmanca eylemlerin koşulsuz kınandığı iletildi ve Avrupa Birliği ile NATO sınırındaki her tırmanışın kabul edilemez olduğu vurgulandı. Başbakan Donald Tusk cismin kaynağını doğruladı; Savunma Bakanı Władysław Kosiniak-Kamysz füzenin 2026'nın ikinci çeyreğinde Moskova yakınlarında üretildiğini söyledi. Al Jazeera'ya göre füze, Ukrayna'da en az sekiz sivilin ölümüne ve 50'den fazla kişinin yaralanmasına yol açan bir saldırının parçasıydı. Aynı olay Kyiv Post ve Polonya kamu yayıncısı TVP World tarafından da bildirildi.", "en": "According to ministry spokesman Maciej Wewior, the ambassador was told of Poland's unequivocal condemnation of hostile acts against the security of a sovereign state, and that any escalation on the border of the European Union and NATO is unacceptable. Prime Minister Donald Tusk confirmed the object's origin, and Defence Minister Władysław Kosiniak-Kamysz said the missile was manufactured near Moscow in the second quarter of 2026. Al Jazeera reports the missile was part of an attack that killed at least eight civilians in Ukraine and wounded more than 50. The same incident was reported by Kyiv Post and by Poland's public broadcaster TVP World."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Novinite", "url": "https://www.novinite.com/view_news.php?id=239909", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "İlk ABD tanker uçağı Bulgaristan'daki Bezmer üssüne indi", "en": "The first US tanker aircraft landed at Bulgaria's Bezmer base"}, "summary": {"tr": "Bulgaristan'ın güneydoğusundaki Bezmer hava üssüne 31 Temmuz'da ilk ABD tanker uçağı indi. Meclis 22 Temmuz'da sekize kadar tanker uçağı ve 250'ye kadar ABD askerî personelinin konuşlandırılmasına izin vermişti.", "en": "The first US tanker aircraft landed on 31 July at Bezmer air base in south-eastern Bulgaria. Parliament had authorised the deployment of up to eight tanker aircraft and up to 250 US service members on 22 July."}, "detail": {"tr": "Savunma Bakanı Dimitar Stoyanov konuşlanmanın geçici olduğunu, Başbakan Rumen Radev ise uçakların muharip görevler için düşünülmediğini söyledi; Savunma Bakanlığı ülkeye yönelik doğrudan bir tehdit görmediğini değerlendirdi. İran Dışişleri Bakanı Abbas Arakçi, Bulgaristan'ı kararını yeniden değerlendirmeye çağırdı. Bezmer ve Yambol bölgesinde yaşayanlar konuşlanmaya karşı gösteriler düzenledi ve dilekçede yaklaşık 475 imza topladı. Bulgar haber ajansı BTA, meclis kararının KC-135 tipi tanker uçaklarını kapsadığını bildirdi.", "en": "Defence Minister Dimitar Stoyanov said the deployment is temporary and Prime Minister Rumen Radev said the aircraft are not intended for combat missions; the defence ministry assessed that there is no direct threat to the country. Iran's Foreign Minister Abbas Araghchi called on Bulgaria to reconsider the decision. Residents of Bezmer and the wider Yambol region protested against the deployment and gathered nearly 475 signatures on a petition. The Bulgarian news agency BTA reported that the parliamentary decision covers KC-135 tanker aircraft."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/venezuela-govt-and-opposition-to-hold-talks-aimed-at-path-to-elections", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Venezuela'da hükümet ile muhalefet seçim yolu için görüşme masasına oturuyor", "en": "Venezuela's government and opposition are sitting down over a path to elections"}, "summary": {"tr": "Caracas'ta cumartesi günü başlayacak görüşmelerde hükümet heyetine Ulusal Meclis Başkanı Jorge Rodríguez, muhalefet heyetine ise haziranda İspanya'daki sürgünden dönen eski milletvekili Dinorah Figuera başkanlık edecek. Görüşmeler ABD'nin desteğiyle yürütülüyor.", "en": "At talks opening in Caracas on Saturday the government delegation will be led by National Assembly president Jorge Rodríguez and the opposition delegation by Dinorah Figuera, a former lawmaker who returned from exile in Spain in June. The talks are backed by the United States."}, "detail": {"tr": "Al Jazeera'ya göre gündem, seçime giden yolun açılması ve seçim sisteminde yapılacak değişiklikler. Nobel Barış Ödülü sahibi muhalefet lideri María Corina Machado görüşmelere davet edilmedi; eski siyasi tutuklu Williams Dávila, Machado'nun dışarıda bırakılamayacağını söyledi. Ülkeyi hâlihazırda geçici devlet başkanı sıfatıyla Delcy Rodríguez yönetiyor. Görüşmeler, ABD askerî güçlerinin Venezuela Devlet Başkanı Nicolás Maduro'yu gözaltına almasından yaklaşık yedi ay sonra başlıyor.", "en": "According to Al Jazeera the agenda is opening a path to elections and changing the electoral system. The Nobel Peace Prize-winning opposition leader María Corina Machado was not invited; Williams Dávila, a former political prisoner, said she could not be left out. The country is currently led by Delcy Rodríguez as interim president. The talks begin roughly seven months after US military forces took Venezuelan President Nicolás Maduro into custody."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/strategic-partner-perus-fujimori-plans-to-intensify-ties-with-the-us", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Peru'nun yeni hükümeti ABD ile ilişkileri derinleştirmeyi planlıyor", "en": "Peru's new government plans to deepen ties with the United States"}, "summary": {"tr": "28 Temmuz'da göreve başlayan Devlet Başkanı Keiko Fujimori'nin hükümeti, ABD'yi \"stratejik ortak\" olarak tanımlıyor ve organize suçla mücadele için kurulan Shield of the Americas koalisyonuna katılmayı planlıyor. Dışişleri Bakanı Carlos Espá bu hafta atandı.", "en": "The government of President Keiko Fujimori, who took office on 28 July, describes the United States as a \"strategic partner\" and plans to join the Shield of the Americas coalition against organised crime. Foreign Minister Carlos Espá was appointed this week."}, "detail": {"tr": "Fujimori haziran ayındaki ikinci turu, solcu rakibi Roberto Sánchez karşısında 50.000'den az oy farkıyla kazandı. Espá daha önce Lima'daki ABD Büyükelçiliği'nde iletişim direktörü olarak çalışmıştı. Hükümet aynı zamanda Meksika ve Kolombiya ile diplomatik ilişkileri onarmayı, Venezuela ile ilişkileri yeniden kurmayı planlıyor. ABD Dışişleri Bakan Yardımcısı Christopher Landau göreve başlama törenine katıldı. Al Jazeera, Peru'nun büyük bir bakır üreticisi olduğunu ve son yıllarda Çin'e yakınlaştığını aktarıyor.", "en": "Fujimori won June's runoff by fewer than 50,000 votes over her left-wing rival Roberto Sánchez. Espá previously worked as communications director at the US embassy in Lima. The government also plans to repair diplomatic relations with Mexico and Colombia and to rebuild ties with Venezuela. US Deputy Secretary of State Christopher Landau attended the inauguration. Al Jazeera notes that Peru is a major copper producer that has moved closer to China in recent years."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/07/oil-spill-shadow-fleet-tanker-spreading-oman-satellite-images-show", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Yaptırım listesindeki gölge filo tankerinden Umman açıklarına petrol sızıyor", "en": "Oil is leaking from a sanctioned shadow-fleet tanker off Oman"}, "summary": {"tr": "Uydu görüntüleri, Avrupa Birliği ve Birleşik Krallık yaptırımları altındaki Caroline Bezengi adlı tankerin çevresinde Umman açıklarında petrol lekeleri olduğunu gösteriyor. Gemi, Rusya'nın yaptırımları aşmak için kullandığı gölge filonun parçası olarak tanımlanıyor.", "en": "Satellite imagery shows oil slicks around the tanker Caroline Bezengi off Oman; the vessel is under European Union and United Kingdom sanctions. It is described as part of the shadow fleet Russia uses to work around sanctions."}, "detail": {"tr": "28 Temmuz tarihli görüntülerde geminin yakınında koyu petrol lekeleri, al-Qibliyyah adasının kuzeyinde ise daha açık renkli izler görülüyor; bölge Zufar valiliğinde korunan bir deniz alanı. Uzaktan algılama uzmanı Wim Zwijnenburg, ham petrol depolayan geminin gövdelerinden en az birinin delinmiş göründüğünü ve gemiden petrol sızdığını söyledi. Gemi takip verilerine göre tanker Rus petrolünü Karadeniz'deki Novorossiysk limanından yüklemişti. İki deniz güvenliği kaynağı, 8 Haziran'da Yemen'in Mukalla limanı açıklarında sorunların başladığını ve değerlendirmelerin gemide bir patlamaya işaret ettiğini aktardı. Uluslararası Denizcilik Örgütü durumu izlediğini doğruladı.", "en": "Images dated 28 July show dark slicks close to the vessel and lighter traces north of al-Qibliyyah island, inside a protected marine area in Dhofar governorate. Remote-sensing specialist Wim Zwijnenburg said at least one of the hulls of the crude storage vessel appears to have been breached and that oil is escaping. Ship tracking data indicate the tanker loaded Russian oil at the Black Sea port of Novorossiysk. Two maritime security sources said trouble began on 8 June off Yemen's port of Mukalla, with assessments pointing to an onboard blast. The International Maritime Organization confirmed it is monitoring the situation."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/western-allies-warn-north-korean-it-workers-funding-nuclear-arsenal", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Dokuz ülkeden Kuzey Koreli bilişim çalışanları için ortak uyarı", "en": "Nine countries issued a joint warning over North Korean IT workers"}, "summary": {"tr": "Dokuz ülkeden 19 kamu kurumu, Kuzey Koreli bilişim çalışanlarının sahte kimliklerle uzaktan iş bularak maaşlarını devlet kurumlarına aktardığını bildiren ortak bir uyarı yayımladı. Metinde yeni bir yaptırım açıklanmadı.", "en": "Nineteen government agencies from nine countries published a joint warning saying North Korean IT workers obtain remote jobs under false identities and pass their pay to state agencies. No new sanctions were announced in the text."}, "detail": {"tr": "Uyarıya imza atan ülkeler ABD, Güney Kore, Japonya, Birleşik Krallık, Fransa, Almanya, İtalya, Hollanda ve Yeni Zelanda. Metne göre bu çalışanlar serbest çalışma platformlarında çalınmış kimlikler kullanıyor, şirket verilerini ve kripto varlıklarını çalıyor, casusluk yapıyor. Kuzey Kore, Çin, Rusya ve Güneydoğu Asya'da kurulan \"dizüstü çiftlikleri\" üzerinden şirket cihazlarına sanal özel ağlarla uzaktan erişiliyor. Uyarı, kimliklerini gizlemek için yapay zekânın da kullanıldığını belirtiyor ve platformlar ile işverenlerden kimlik doğrulama ile donanım denetimini sıkılaştırmasını istiyor. Metinde ayrı bir yetkilinin adı ya da doğrudan alıntısı yer almıyor.", "en": "The signatory countries are the United States, South Korea, Japan, the United Kingdom, France, Germany, Italy, the Netherlands and New Zealand. The text says these workers use stolen identities on freelancing platforms, take company data and cryptocurrency, and conduct espionage. Company devices are reached remotely over virtual private networks through \"laptop farms\" set up in North Korea, China, Russia and South-East Asia. The warning says artificial intelligence is also being used to obscure identities, and asks platforms and employers to tighten identity verification and hardware vetting. No individual official is named or quoted directly in the text."}, "editionDate": "2026-08-01"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "ITV News", "url": "https://www.itv.com/news/granada/2026-07-31/labour-retain-greater-manchester-mayor-as-votes-finally-counted-after-15-hours", "publishedDate": "2026-07-31", "date": {"tr": "31 Tem", "en": "Jul 31"}, "title": {"tr": "Büyük Manchester belediye başkanlığını İşçi Partisi'nden Bev Craig kazandı", "en": "Labour's Bev Craig won the Greater Manchester mayoralty"}, "summary": {"tr": "Andy Burnham'ın başbakanlığa geçmesi 7-26/hormuz-diplomacy-mandate-1280.7592a92f532c.webp", "variants": [{"src": "/assets/briefs/2026-07-26/hormuz-diplomacy-mandate-640.af8ac8c66d0e.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/hormuz-diplomacy-mandate-1280.7592a92f532c.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Eksik taş meclis, uyuşmayan bağlantılar ve tek sinyali farklı dalgalara bölen rezonans odasını gösteren editoryal illüstrasyon", "en": "Editorial illustration of an incomplete stone assembly, mismatched couplings and a resonance chamber splitting one signal into several waves"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "n": 1, "hasAnalysis": true}, {"id": "palestinian-local-control-pressure", "topic": "geopolitics", "title": {"tr": "İki sahada yerel kontrol baskısı", "en": "Pressure on local control in two arenas"}, "summary": {"tr": "Batı Şeria’daki geniş gözaltılar ve Gazze’de bir polis yöneticisinin öldürülmesi, iki ayrı sahada yerel kontrol yapılarının baskı altında olduğunu gösteriyor; olay sıralaması, aidiyet ve kayıplara ilişkin temel iddialar tartışmalı.", "en": "Mass detentions in the West Bank and the killing of a Gaza police chief show pressure on local control structures in two arenas, while core claims about sequence, affiliation and casualties remain disputed."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-26/palestinian-local-control-pressure-1280.d2c809b8bde6.webp", "variants": [{"src": "/assets/briefs/2026-07-26/palestinian-local-control-pressure-640.b7f131d0a082.webp", "width": 640}, {"src": "/assets/briefs/2026-07-26/palestinian-local-control-pressure-1280.d2c809b8bde6.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Ağır taş plakalar altında daralan dokuma yollar ile eksik bir düğümün çevresinde geçici bağlantılar kuran seramik ağı gösteren editoryal illüstrasyon", "en": "Editorial illustration of woven paths compressed beneath stone slabs and a ceramic network making temporary connections around a missing node"}, "generatedAt": "2026-07-26"}, "editionDate": "2026-07-26", "n": 1, "hasAnalysis": true}], "articles": [{"writer": "geo-01", "title": {"tr": "Ücret yoksa geçiş kuralını kim koyuyor?", "en": "If there is no fee, who sets the rule of passage?"}, "excerpt": {"tr": "Husilerin gemi trafiğini yöneten merkezi ücret planını reddetti ve güvenli geçiş hizmetini gönüllü ilan etti. Tarif yok; fakat kimin yetkili sayıldığına ilişkin bir standart var.", "en": "The Houthi-run centre overseeing vessel traffic denied a fee plan and called its safe-transit service voluntary. There is no tariff, but there is a standard for who counts as authorized."}, "sections": [{"h": {"tr": "Reddedilen ücret, korunan yetki", "en": "A denied fee, an asserted authority"}, "ps": [{"tr": "Husilerin yönettiği İnsani Operasyonlar Koordinasyon Merkezi 1 Ağustos'ta Babülmendep'ten geçen gemiler için ücret planlamadığını açıkladı. Merkez, güvenli geçiş hizmetinin gönüllü ve ücretsiz olduğunu, ödeme isteyenlerin Yemen'i ya da merkezi temsil etmediğini söyledi. Denizcilik şirketlerinden yetkisiz kişilere ödeme yapmamalarını ve bilgi vermemelerini istedi. Açıklama bir tarifeyi reddediyor; aynı cümlede geçerli muhatabın kim olduğunu da tanımlıyor.", "en": "The Houthi-run Humanitarian Operations Coordination Center said on 1 August that it was not planning fees for ships passing Bab al-Mandeb. It called its safe-transit service voluntary and free, and said anyone seeking payment represented neither Yemen nor the centre. Shipping companies were told not to pay or share information with unauthorized parties. The statement rejects a tariff while defining who counts as the valid interlocutor in the same sentence.", "refs": ["houthi-transit"]}, {"tr": "Bu ayrım önemlidir. Bir geçiş ücretinin fiyatı ölçülebilir; gönüllü hizmet ise kabul edilecek iletişim kanalını ve bilgi paylaşımını düzenler. Merkez gemiye ödeme yapma demiyor, kime ödeme yapılmaması gerektiğini söylüyor. Dolayısıyla reddedilen şey denetim değil, denetimin para biçimi. Geçiş kuralı faturadan yetkilendirmeye taşınıyor.", "en": "The distinction matters. A toll has a measurable price; a voluntary service governs the communication channel and the information a ship shares. The centre does not merely say not to pay, but specifies whom not to pay. What is rejected is therefore not control but its monetary form. The rule of passage moves from invoicing to authorization.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Bir haftada kurulan iki çerçeve", "en": "Two frameworks built in one week"}, "ps": [{"tr": "Açıklama, Reuters'ın Husilerin ücret fikrini İranlı yetkililerle görüştüğüne ilişkin haberinden sonra geldi. Aynı hafta grup Suudi Arabistan'a deniz ablukası ilan etmiş, Suudi Arabistan da seyrüsefer serbestisini korumak amacıyla 14 ülkeli bir deniz koalisyonu duyurmuştu. Bir tarafta ücretsiz fakat merkezden geçen güvenli geçiş hizmeti, diğer tarafta devletlerin kurduğu koruma koalisyonu var. İkisi de aynı rotada kimin güvenlik sağlayıcısı sayılacağını belirlemeye çalışıyor.", "en": "The statement followed a Reuters report that the Houthis had discussed a fee idea with Iranian officials. In the same week the group declared a maritime blockade on Saudi Arabia, while Saudi Arabia announced a 14-country maritime coalition to protect freedom of navigation. One side offers a free but centre-mediated safe-transit service; the other assembles a state-led protection coalition. Both seek to define who counts as the security provider on the same route.", "refs": ["houthi-transit"]}, {"tr": "İki çerçevenin aynı şey olduğu söylenemez. Koalisyon askerî kapasite ve devlet taahhüdü taşır; merkezin duyurusu ise gemilerle kurulacak ilişkiye dair tek taraflı bir kuraldır. Fakat pazar erişimi açısından ikisi de sigortacıya, armatöre ve kaptana aynı soruyu yöneltir: geçiş riskini azaltmak için kimin talimatı izlenecek? Kuralın etkisi, açıklamanın dilinden çok gemilerin davranışında ortaya çıkacak.", "en": "The two frameworks are not equivalent. The coalition carries military capability and state commitments; the centre's announcement is a unilateral rule for relations with vessels. Yet for market access both put the same question to insurers, owners and captains: whose instruction will be followed to reduce transit risk? The rule's effect will appear less in the statement's wording than in vessel behaviour.", "refs": ["houthi-transit"]}]}, {"h": {"tr": "Standardın ölçülebileceği yer", "en": "Where the standard can be measured"}, "ps": [{"tr": "Önümüzdeki ölçüt ücret tahsil edilip edilmemesinden daha geniştir. Denizcilik şirketleri merkezle temas kurmaya, rota bilgisi paylaşmaya ya da bu kanalın dışında kalan talepleri reddetmeye başlarsa, ücretsiz hizmet fiilî bir geçiş standardına dönüşür. Gemiler aynı rotayı bu kanala başvurmadan kullanır ve güvenlik koşulları değişmezse duyuru yetki iddiası olarak kalır. Babülmendep'te standardı belirleyecek şey fiyat listesi değil, tekrarlanan uyum davranışıdır.", "en": "The relevant test is broader than whether a fee is collected. If shipping companies begin contacting the centre, sharing route information or rejecting demands outside that channel, the free service becomes a de facto transit standard. If vessels use the same route without engaging the channel and security conditions do not change, the statement remains an assertion of authority. At Bab al-Mandeb the standard will be set not by a price list but by repeated compliance behaviour.", "refs": ["houthi-transit"]}]}], "sources": [{"key": "houthi-transit", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/yemens-houthis-deny-plan-to-charge-ships-transiting-red-sea", "title": {"tr": "Husiler Kızıldeniz geçişinden ücret alma planını reddetti", "en": "Yemen's Houthis denied a plan to charge ships transiting the Red Sea"}, "publishedDate": "2026-08-01"}], "date": "2026-08-01"}, {"writer": "geo-02", "title": {"tr": "On dört günlük takvim ilk sınavını verdi", "en": "The fourteen-day clock has taken its first test"}, "excerpt": {"tr": "Hamas ilk adımı kabul ettiğini açıkladı, Trump İsrail'le mutabakat bulunduğunu söyledi. İki beyan arasındaki fark, birinin yükümlülüğü üstlenen taraftan, diğerinin üçüncü bir başkentten gelmesi.", "en": "Hamas announced it accepted the first step and Trump said there is an understanding with Israel. The difference between the two statements is that one comes from the party taking on the obligation and the other from a third capital."}, "sections": [{"h": {"tr": "Kim neyi kabul etti", "en": "Who accepted what"}, "ps": [{"tr": "Hamas 31 Temmuz'da anlaşmanın ilk adımını kabul ettiğini açıkladı: silahlar Filistinli bir komiteye teslim edilecek, karşılığında İsrail Gazze'den tam olarak çekilecek. Saatler sonra Trump, Camp David'deki kabine toplantısında İsrail'le bir mutabakat bulunduğunu ve İsrail'in memnun olduğunu söyledi. İsrail hükümeti metnin şartlarını resmen kabul etmedi. Bakan Itamar Ben-Gvir planı İsrail için kabul edilemez buldu; BM Daimi Temsilcisi Danny Danon CNN'de Hamas'ın bu silahlara yeniden ulaşıp ulaşamayacağını sordu.", "en": "On 31 July Hamas announced it accepted the first step of the agreement: weapons would be handed to a Palestinian committee and, in exchange, Israel would withdraw fully from Gaza. Hours later, at the Cabinet meeting at Camp David, Trump said there is an understanding with Israel and that Israel is content. The Israeli government has not formally accepted the terms. Minister Itamar Ben-Gvir called the plan unacceptable for Israel, while UN ambassador Danny Danon asked on CNN whether Hamas would reach those weapons again.", "refs": ["deal-understanding"]}, {"tr": "Bu köşe 31 Temmuz'da, metindeki yükümlülüklerin silah tarafında toplandığını ve İsrail'in çekilmesinin koşullu bir sonuç olarak bırakıldığını yazmıştı. Bir gün sonraki tablo o dizilimi somutlaştırıyor: kabul beyanı silah tarafından geldi, çekilme tarafına ilişkin elimizdeki şey üçüncü bir başkentin aktarımı.", "en": "This column wrote on 31 July that the obligations in the text are gathered on the weapons side, while an Israeli withdrawal is left as a conditional outcome. The picture a day later makes that ordering concrete: the declaration of acceptance came from the weapons side, and what we have on the withdrawal side is a third capital's account.", "refs": ["prior-vezir", "deal-understanding"]}]}, {"h": {"tr": "Mutabakatı kim taşıyor", "en": "Who carries the understanding"}, "ps": [{"tr": "Trump'ın sözleri tek taraflı bir aktarımdır ve İsrail'in hangi yükümlülüğü hangi tarihte üstlendiğini içermiyor; yazılı bir kabul de açıklanmadı. En güçlü karşı okuma şu: İsrail hükümeti kabul etmiş olabilir ve açıklamayı koalisyon içi dengeler nedeniyle geciktiriyordur. Bu okumayı doğrulayacak gözlemlenebilir tek şey, yayımlanmış bir İsrail kabine kararı ya da İsrailli yetkililerin kendi ağzından teyididir.", "en": "Trump's words are one party's account and do not state which obligation Israel took on, or when; no written acceptance was announced either. The strongest counter-reading is that the Israeli government has accepted and is delaying the announcement because of coalition arithmetic. The only observable that would confirm it is a published Israeli cabinet decision or confirmation from Israeli officials themselves.", "refs": ["deal-understanding"]}, {"tr": "Sahadan gelen ilk işaret ise ters yönde. 1 Ağustos'ta, Hamas'ın taslak anlaşmayı kabul ettiğini açıklamasından saatler sonra Gazze genelinde İsrail hava saldırıları düzenlendi; Al Jazeera en az iki Filistinlinin öldüğünü, en az on kişinin yaralandığını bildirdi. Ateşkes metinlerinin çevresinde silahlı eylemin sürmesi olağandışı sayılmaz; buradaki bilgi, çekilme tarafının henüz gözlemlenebilir bir davranış değişikliğine bağlanmamış olmasıdır.", "en": "The first signal from the ground points the other way. On 1 August, hours after Hamas announced it accepted the draft agreement, Israeli air attacks were carried out across Gaza; Al Jazeera reported at least two Palestinians killed and at least ten wounded. Continued armed action around ceasefire texts is not unusual; the information here is that the withdrawal side has yet to be tied to any observable change in behaviour.", "refs": ["gaza-strikes"]}]}, {"h": {"tr": "Takvimin bir sonraki adımı", "en": "The next step on the clock"}, "ps": [{"tr": "Denge kuruldu demek için erken. Sıradaki gözlemlenebilir adım basit: silahların teslim edileceği Filistinli komitenin adının açıklanması ve ilk teslimin gerçekleşmesi. Komite kurulur ve ilk teslim kamuya doğrulanırsa, anlaşma bir aktarım olmaktan çıkıp bir yükümlülüğe dönüşür. Kurulmadığı sürece elimizde iki tarafın birbirini bekleyerek durduğu bir metin kalır.", "en": "It is early to say a balance has been struck. The next observable step is simple: naming the Palestinian committee that is to receive the weapons, and the first handover taking place. If the committee is constituted and a first handover is publicly confirmed, the agreement moves from an account to an obligation. As long as it is not, what remains is a text with each side standing still and waiting on the other.", "refs": ["deal-understanding"]}]}], "sources": [{"key": "deal-understanding", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/trump-says-us-has-understanding-with-israel-on-hamas-disarmament-deal", "title": {"tr": "Trump, silahsızlanma anlaşmasında İsrail'le \"mutabakat\" olduğunu söyledi", "en": "Trump says there is an \"understanding\" with Israel on the disarmament deal"}, "publishedDate": "2026-07-31"}, {"key": "gaza-strikes", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/1/israel-launches-attacks-across-gaza-one-day-after-hamas-agrees-to-disarm", "title": {"tr": "Hamas'ın silahsızlanmayı kabul etmesinin ardından Gazze'de İsrail saldırıları sürdü", "en": "Israeli attacks resumed across Gaza after Hamas accepted disarmament"}, "publishedDate": "2026-08-01"}, {"key": "prior-vezir", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-31/", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-03", "title": {"tr": "Bezmer'e inen uçak menzil taşıyor", "en": "The aircraft that landed at Bezmer carries range"}, "excerpt": {"tr": "Bir tanker uçağı görev süresini ve menzili uzatır. Bulgaristan meclisinin verdiği yetki de bu kabiliyetin tavanını çiziyor: sekiz uçak, 250 kişi.", "en": "A tanker aircraft lengthens sortie time and range. The authorisation Bulgaria's parliament granted draws the ceiling of that capability: eight aircraft, 250 people."}, "sections": [{"h": {"tr": "İnen kabiliyet", "en": "The capability that landed"}, "ps": [{"tr": "31 Temmuz'da ilk ABD tanker uçağı Bulgaristan'ın güneydoğusundaki Bezmer hava üssüne indi. Bulgaristan meclisi 22 Temmuz'da sekiz tanker uçağı ve 250 ABD askerî personeline kadar yetki vermişti. Savunma Bakanı Dimitar Stoyanov konuşlanmanın geçici olduğunu, Başbakan Rumen Radev uçakların muharip görev için düşünülmediğini söyledi. Savunma Bakanlığı ülkeye doğrudan bir tehdit görmediğini değerlendirdi.", "en": "On 31 July the first US tanker aircraft landed at Bezmer air base in south-eastern Bulgaria. Bulgaria's parliament had authorised up to eight tanker aircraft and up to 250 US service members on 22 July. Defence Minister Dimitar Stoyanov said the deployment is temporary and Prime Minister Rumen Radev said the aircraft are not meant for combat missions. The defence ministry assessed that there is no direct threat to the country.", "refs": ["bezmer"]}, {"tr": "Havada yakıt ikmali bir süre ve mesafe çarpanıdır. Tanker desteğiyle aynı sayıdaki savaş uçağı hedef bölgede daha uzun kalır ve daha uzaktaki üslerden kalkabilir. Radev'in cümlesi bu yüzden hem doğru hem eksik: uçaklar ateş gücü taşımaz, ateş edenlerin görev süresini uzatır.", "en": "Air-to-air refuelling is a multiplier of time and distance. With tanker support the same number of combat aircraft stay longer over a target area and can launch from bases further away. Radev's sentence is therefore both accurate and incomplete: the aircraft carry no firepower and they lengthen the sorties of those that do.", "refs": ["bezmer"]}]}, {"h": {"tr": "Karşı tarafın görebildiği", "en": "What the other side can see"}, "ps": [{"tr": "İran Dışişleri Bakanı Abbas Arakçi, Bulgaristan'ı kararını yeniden değerlendirmeye çağırdı. Bir muhatabın gözlemleyebildiği şey üslenmedir: kalkış saatleri gizlenebilir, bir üsse yerleşen filo gizlenemez. Karşı okuma da açık — bu çağrı, bir tehdit değerlendirmesinden çok alışıldık bir diplomatik itiraz olabilir; ikisini ayıracak olan, İran'ın tutumunun sözden başka bir biçime dönüşüp dönüşmediğidir.", "en": "Iran's Foreign Minister Abbas Araghchi called on Bulgaria to reconsider its decision. What a counterpart can observe is the basing: departure times can be concealed, a squadron settling into a base cannot. The counter-reading is plain — the call may be a routine diplomatic objection rather than a threat assessment, and what separates the two is whether Iran's position takes any form beyond words.", "refs": ["bezmer"]}, {"tr": "Yetkinin sayıları da bir mesaj taşıyor. Sekiz uçak ve 250 kişilik tavan, sürdürülebilir bir ikmal temposunun sınırını belirler: bakım, yedek mürettebat ve yakıt ikmali bu kadroyla yapılabilecek görev sayısını çizer. Bir konuşlanmanın ne kadar dayanabileceğini uçak sayısından çok bu destek kadrosu söyler; Bezmer ve Yambol bölgesinde toplanan yaklaşık 475 imzalı dilekçe ise aynı tavanın yerel siyasi maliyetini gösteriyor.", "en": "The numbers in the authorisation carry a message of their own. A ceiling of eight aircraft and 250 people sets the limit of a sustainable refuelling tempo: maintenance, spare crews and fuel handling draw how many sorties that establishment can support. How long a deployment can hold is told less by the aircraft count than by that support staffing; the petition of nearly 475 signatures gathered in Bezmer and the Yambol region shows the local political cost of the same ceiling.", "refs": ["bezmer"]}]}, {"h": {"tr": "İzlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu konuşlanmanın lojistik bir destekten bir harekât üssüne dönüşüp dönüşmediğini anlamanın dürüst yolu tavanı izlemektir. Bulgaristan meclisi sekiz uçak veya 250 kişilik sınırı yukarı çekerse, görev tanımı da fiilen değişmiş olur. Tavan sabit kaldığı sürece elimizdeki şey, açıklandığı biçimiyle bir ikmal düzeneğidir.", "en": "The honest way to tell whether this deployment turns from logistical support into an operating base is to watch the ceiling. If Bulgaria's parliament raises the limit of eight aircraft or 250 personnel, the mission's definition will have changed in practice. As long as the ceiling holds, what is there is the refuelling arrangement it was described as.", "refs": ["bezmer"]}]}], "sources": [{"key": "bezmer", "kind": "news", "name": "Novinite", "url": "https://www.novinite.com/view_news.php?id=239909", "title": {"tr": "İlk ABD tanker uçağı Bulgaristan'daki Bezmer üssüne indi", "en": "The first US tanker aircraft landed at Bulgaria's Bezmer base"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-04", "title": {"tr": "Yaptırımlı gemi sızdırmaya başlayınca faturayı kim ödüyor?", "en": "Who pays when a sanctioned ship starts to leak?"}, "excerpt": {"tr": "Yaptırım tasarımı finansmanı ve sigortayı hedef alır. Umman açıklarındaki gövde, bu tasarımın dışarıda bıraktığı kalemi gösteriyor: geminin bakımını ve bir kaza hâlinde temizliği kimin üstleneceğini.", "en": "Sanctions design targets financing and insurance. The hull off Oman shows the line item that design leaves outside: who maintains the ship, and who cleans up if somet
