<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: full width, no scroll box, shareable via #hash. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }
    #briefsSection .section-title .podcast-icon{
      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }
    #briefsSection .section-title .podcast-bar audio{display:none}
    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:127px;min-width:0;
      min-height:40px;margin-left:0;padding:5px 24px 5px 8px;font-size:.72rem;
    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }
    .topic-btn svg{width:14px;height:14px}
    .topic-label{font-size:.65rem;line-height:1;letter-spacing:-.015em}
    .header-right{flex:0 0 auto;margin-left:0;gap:5px}
    .archive-link{width:38px;padding:7px}
    .archive-label{
      position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
      margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;border:0!important;
    }
    .utility-switches{gap:3px}
    .lang-switch{gap:2px;padding:2px}
    .lang-btn{min-width:28px;min-height:34px;padding:3px 4px}
    .theme-switch{width:38px}
    :root[data-theme="light"] .theme-switch-thumb{transform:translateX(14px)}

    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:calc((100% - 12px)/2);scrollbar-width:none;
    }

function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}
document.addEventListener('error', event=>{

    const picture = image.closest('picture');
    if(picture) picture.remove();
  }
}, true);

Secretary-General Antonio Guterres said settlements have \"no legal validity\" and constitute a \"flagrant violation\" of international law. Netanyahu announced on Friday that his government would accelerate the legalisation of farm outposts."}, "detail": {"tr": "Guterres, \"Yerleşimler iki devletli çözümün ve adil, kalıcı, kapsamlı bir barışın önünde büyük bir engel olmayı sürdürüyor\" dedi. Netanyahu'nun açıklamasına göre hükümet mevcut çiftlik karakollarının yasallaştırılmasını hızlandıracak ve yenilerini kuracak. Al Jazeera'nın aktardığı OCHA verilerine göre ocak-temmuz 2026 döneminde İsrail güçleri veya yerleşimcilerce 77 Filistinli öldürüldü; bunların 18'i çocuk. Aynı dönemde Filistinlilerce üç İsrailli öldürüldü. Haberin yayımlandığı haftanın perşembe gününden bu yana sekiz Filistinli ve iki İsrailli hayatını kaybetti, en az on Filistinli aile yerinden edildi. OCHA ocaktan bu yana yerleşimcilerle ilişkili 1.330'dan fazla olay saydı. Ayrıca Uluslararası Adalet Divanı, 2024'te verdiği istişari görüşte işgalin sürdürülmesini hukuka aykırı bulmuştu.", "en": "Guterres said, \"Settlements remain a major obstacle to a two-state solution and to a just, lasting and comprehensive peace.\" Netanyahu said his government would accelerate the legalisation of existing farm outposts and establish new ones. OCHA figures cited by Al Jazeera record 77 Palestinians killed by Israeli forces or settlers between January and July 2026, including 18 children, and three Israelis killed by Palestinians over the same period. Since the Thursday of the week the report was published, eight Palestinians and two Israelis have been killed and at least ten Palestinian families displaced. OCHA has counted more than 1,330 settler-related incidents since January. A 2024 advisory opinion of the International Court of Justice found the continued occupation unlawful."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/houthis-want-to-copy-irans-hormuz-control-in-the-red-sea-yemeni-fm", "publishedDate": "2026-07-28", "date": {"tr": "28 Tem", "en": "Jul 28"}, "title": {"tr": "Yemen'in dışişleri bakanı adayı: Husiler Kızıldeniz'de Hürmüz modelini kopyalamak istiyor", "en": "Yemen's foreign minister-designate says the Houthis want to copy Iran's Hormuz model"}, "summary": {"tr": "Afrah el-Zouba, pazartesi günü Riyad'daki Yemen büyükelçiliğinde konuştu ve Husilerin Bab-ül Mendep Boğazı'nı denetim altına almayı hedeflediğini söyledi. Al Jazeera, pazar günü boğazdan yalnızca 11 emtia gemisinin geçtiğini aktarıyor.", "en": "Afrah al-Zouba, speaking on Monday at Yemen's embassy in Riyadh, said the Houthis aim to control the Bab al-Mandeb Strait. Al Jazeera reports that only 11 commodity vessels passed through the strait on Sunday."}, "detail": {"tr": "El-Zouba, \"Husiler İran modelini kopyalamak istiyor ve bu iki ana boğazı kapatacak\" dedi; grubun \"yetersiz uluslararası tepki nedeniyle cesaretlendiğini\" savundu. Al Jazeera'nın verdiği rakamlara göre küresel konteyner trafiğinin yaklaşık yüzde 30'u Kızıldeniz'den geçiyor ve küresel ticaretin yüzde 12 ile yüzde 15'i bu rotaya bağlı. Gerilim, Husilerin temmuzda Suudi Arabistan'a giden gemilere yönelik deniz ablukası ilan etmesi ve ardından Suudi Arabistan'ın Husilerin elindeki Hudeyde limanını vurmasıyla arttı. Haberde bu tırmanmanın 2022'deki ateşkesten bu yana yaşanan en ciddi gerilim olduğu belirtiliyor.", "en": "Al-Zouba said, \"The Houthis want to copy the Iranian model, and this will shut down two main straits,\" and argued the group had been emboldened by an insufficient international response. Al Jazeera reports that roughly 30 percent of global container traffic transits the Red Sea and that 12 percent to 15 percent of overall global trade depends on the route. Tensions rose after the Houthis declared a maritime siege in July on shipping bound for Saudi Arabia, followed by Saudi air strikes on the Houthi-held port of Hodeidah. The report describes this as the most serious escalation since the 2022 truce."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/saudi-arabia-defends-against-drone-strikes-from-iran-backed-groups", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Suudi Arabistan petrol tesislerine yönelik insansız hava aracı saldırılarını önlediğini bildirdi", "en": "Saudi Arabia says it intercepted drones aimed at oil facilities"}, "summary": {"tr": "Suudi Dışişleri Bakanlığı, doğu eyaleti ve Riyad'daki petrol tesislerini hedef alan saldırıyı \"Irak'taki İran destekli silahlı gruplara\" atfetti ve \"yanıt verme hakkını saklı tuttuğunu\" açıkladı. Zarar ve kayıplara ilişkin bağımsız doğrulama bulunmuyor.", "en": "Saudi Arabia's foreign ministry attributed an attack on oil facilities in the Eastern Province and Riyadh to \"Iran-backed armed groups in Iraq\" and said it \"reserves the right to respond.\" There is no independent verification of damage or casualties."}, "detail": {"tr": "Al Jazeera'ya göre aynı gün Ürdün iki insansız hava aracını düşürdüğünü, Irak ise kuzeyde İranlı Kürt muhalif grupların bulunduğu kampların vurulduğunu bildirdi. Husiler \"Suudi ham petrol taşıma altyapısını\" hedef aldıklarını açıkladı; olaylar arasında eşgüdüm bulunup bulunmadığı belirsiz. Irak Başbakanı Ali el-Zaidi, ülkesinin \"topraklarının komşu ülkelere saldırı düzenlemek için kullanılmasına izin vermeyeceğini\" söyledi. Haberde İran'ın daha önce Körfez ülkelerine yönelik saldırılara ara verdiğini duyurduğu hatırlatılıyor. Husiler, Suudi destekli Yemenli güçlerle ayrı çatışmalarda dokuz mensuplarının öldüğünü bildirdi.", "en": "Al Jazeera reports that Jordan said it shot down two drones the same day and that Iraq reported strikes on camps in the north housing Iranian-Kurdish opposition fighters. The Houthis said they had targeted \"Saudi crude oil transport infrastructure\"; whether the incidents were coordinated is unclear. Iraq's Prime Minister Ali al-Zaidi said his country \"will not allow its territory to be used to launch attacks against neighbouring countries.\" The report recalls that Iran had earlier announced a pause in attacks on Gulf states. The Houthis said nine of their fighters were killed in separate clashes with Saudi-backed Yemeni forces."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "conflict", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/un-eyeing-potential-israeli-war-crimes-in-lebanon", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "BM insan hakları yüksek komiseri Lübnan'da olası savaş suçlarına işaret etti", "en": "UN human rights chief points to possible war crimes in Lebanon"}, "summary": {"tr": "Lübnan'ı ziyaret eden Volker Türk, İsrail ordusunun eylemlerini \"savaş suçu düzeyine ulaşması muhtemel\" olarak niteledi ve nisandaki ateşkese rağmen güneyde bombardıman ile yıkımların sürdüğünü söyledi.", "en": "Visiting Lebanon, Volker Turk described Israeli military actions as \"possibly amounting to war crimes\" and said shelling and demolitions continue in the south despite an April ceasefire."}, "detail": {"tr": "Türk, \"yaygın hasar ve katmerlenmiş acı\" gözlemlediğini, geniş çaplı insan hakları ihlallerine tanık olduğunu belirtti. Yaklaşık bin yerinden edilmiş kişinin barındığı bir okulu ziyaret etti. \"Travma, öfke ve umutsuzluk elle tutulur durumda; ama adalet talebi de öyle\" dedi. Yerinden edilme döngülerine ilişkin olarak \"Birçok kişi için bu ikinci ya da üçüncü yerinden edilme. Bazıları geçen hafta evlerine dönmeye çalıştıklarını, ancak köylerinin yıkılmış olduğunu gördüklerini anlattı\" ifadesini kullandı. Al Jazeera haberinde İsrail tarafının yanıtına ve doğrulanmış kayıp sayılarına yer verilmiyor.", "en": "Turk said he had seen \"wide yapanların itirazı, meclisteki 12 sandalyenin Keşmirli mültecilere ayrılmasına yönelik. Bağımsız aday Malik Alauddin, \"İnternet kesintisi hem siyasi adaylar hem de seçim süreci için ciddi zorluklar yarattı\" dedi. Mirpur bölgesinde ilk aşamada katılımın düşük göründüğü aktarıldı.", "en": "The split into three phases was attributed to a shortage of security personnel. Polling stations were heavily guarded and an unofficial state of emergency was in force. The Jammu Kashmir Joint Awami Action Committee (JAAC), banned in June under anti-terrorism laws, has seen its leadership arrested, driven underground or left organising from protest camps. Those calling for a boycott object to the 12 assembly seats reserved for Kashmiri refugees. Independent candidate Malik Alauddin said, \"The internet shutdown has created serious difficulties ... for political candidates and the electoral process itself.\" Turnout appeared low in Mirpur district during the first phase."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/us-diplomats-walk-out-as-france-addresses-un-security-council", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Fransa söz alınca ABD diplomatları Güvenlik Konseyi salonundan çıktı", "en": "US diplomats walk out as France takes the floor at the Security Council"}, "summary": {"tr": "ABD heyeti, pazartesi günü Fransa'nın Rusya'nın Ukrayna'daki savaşına ilişkin konuşmasına başladığı sırada salonu terk etti. Gerginliğin kaynağı, Washington'ın BM insan hakları yüksek komiseri Volker Türk'ün görev süresinin uzatılmasına karşı oy vermesi.", "en": "The US delegation left the chamber on Monday as France began speaking about Russia's war in Ukraine. The dispute stems from Washington's vote against renewing the term of UN human rights chief Volker Turk."}, "detail": {"tr": "Fransa'nın BM Daimî Temsilciliği, ABD'nin artık bir \"insan hakları feneri\" olmadığını ve bu oyla Kuzey Kore, Nikaragua, Mali ve Rusya ile aynı safta kaldığını bildirdi. ABD'nin BM Daimî Temsilcisi Mike Waltz, Türk'ün \"ABD, Birleşik Krallık ve İsrail gibi özgür, egemen demokrasilere ders verdiğini\" söyledi. Çıkışın ardından ABD'nin dönüşümlü temsilcisi Dan Negrea, Fransa \"küçümseyici ve saygısız söyleminden\" vazgeçene kadar heyetin salonu terk etmeyi sürdüreceğini belirtti. Fransa'nın BM Büyükelçisi Jerome Bonnafont ise çıkışa değinmeden BM'nin bağımsızlığını korumaya çalıştıklarını söyledi. Al Jazeera, Trump yönetiminin 2025'ten bu yana BM'ye ayrılan kaynakları kıstığını ve birden fazla BM kuruluşundan çekildiğini hatırlatıyor.", "en": "France's UN Mission said the US was no longer a \"beacon of human rights\" and that the vote left it aligned with North Korea, Nicaragua, Mali and Russia. US Ambassador to the UN Mike Waltz said Turk \"has been lecturing free, sovereign democracies like the United States, the UK, and Israel.\" After the walkout, alternate US representative Dan Negrea told the council his delegation would keep leaving the chamber until France renounced its \"condescending and disrespectful rhetoric.\" France's UN Ambassador Jerome Bonnafont said France was working to preserve the UN's independence and did not address the walkout. Al Jazeera notes the Trump administration has cut UN funding and withdrawn from several UN bodies since 2025."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "trade", "src": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0578", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "ABD Hazinesi yaptırım listesinden 84 kişi ve kuruluşu çıkardı", "en": "US Treasury removes 84 people and entities from its sanctions list"}, "summary": {"tr": "Hazine, 27 Temmuz'da duyurduğu modernizasyon girişiminin ikinci turunda OFAC'ın Özel Olarak Belirlenmiş Kişiler ve Engellenen Kişiler listesinden 84 kişi ve kuruluşu çıkardı. Ayrıca 22 liste girişine ayırt edici bilgi eklendi ve 18 mükerrer giriş kümesi giderildi.", "en": "In the second round of its modernization initiative, announced on 27 July, Treasury removed 84 individuals and entities from OFAC's Specially Designated Nationals and Blocked Persons List. It also added identifying information to 22 list entries and resolved 18 sets of duplicates."}, "detail": {"tr": "Açıklamaya göre çıkarılanlar arasında vefat etmiş kişiler, faaliyeti sona ermiş kuruluşlar ve 20 yıldan uzun süre önce belirlenmiş, tarama için yeterli bilgi taşımayan hedefler yer alıyor. Eklenen ayırt edici bilgiler doğum tarihi, kimlik numarası, uyruk ve cinsiyet gibi alanları kapsıyor. Hazine, girişimin amacını yaptırımların \"hedefli, etkili ve ABD'nin ekonomik, dış politika ve ulusal güvenlik önceliklerine uygun\" kalmasını sağlamak olarak tanımlıyor. Metinde Bakan Scott Bessent'in tutumu, yönetimin yaptırım başarısını \"yalnızca Hazine'nin listeye eklediği isim sayısıyla değil, etki, sonuç ve fayda üzerinden\" ölçtüğü şeklinde aktarılıyor. Açıklamada ayrıca 29 Haziran 2026'da listeden çıkarma başvurularının yapılabildiği bir Yeniden Değerlendirme Portalı'nın açıldığı belirtiliyor.", "en": "According to the release, those removed include deceased individuals, defunct entities and targets designated more than 20 years ago that lack sufficient information for effective compliance screening. The identifiers added cover fields such as dates of birth, identification numbers, nationality and gender. Treasury describes the initiative's aim as keeping sanctions \"targeted, effective, and aligned with U.S. economic, foreign policy, and national security priorities.\" The release attributes to Secretary Scott Bessent the position that the administration measures sanctions success \"in terms of effect, impact, and benefit-not just based on the number of names Treasury places on a list.\" It also notes that a Reconsideration Portal for delisting petitions opened on 29 June 2026."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/trump-asks-us-supreme-court-to-allow-mail-in-voting-restrictions", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Trump yönetimi posta oyu kısıtlamaları için Yüksek Mahkeme'ye acil başvuru yaptı", "en": "Trump administration asks the Supreme Court to allow mail-in voting restrictions"}, "summary": {"tr": "Adalet Bakanlığı pazartesi günü, martta imzalanan başkanlık kararnamesinin bazı bölümlerini durduran alt mahkeme kararının askıya alınmasını istedi. Birinci Bölge Temyiz Mahkemesi hafta sonu bu talebi reddetmişti.", "en": "The Justice Department filed an emergency request on Monday to pause a lower-court ruling blocking parts of a March executive order. The First Circuit Court of Appeals had declined to pause the ruling over the weekend."}, "detail": {"tr": "Mart tarihli kararname federal kurumlara eyalet bazında seçmen uygunluk listeleri hazırlama görevi veriyor, ABD Posta İdaresi'nin posta oy pusulalarını yalnızca bu listelerdeki kişilere ulaştırmasını öngörüyor ve Adalet Bakanlığı'na uygun olmayan seçmenlere pusula verdiği ileri sürülen seçim görevlilerine yönelik soruşturmalara öncelik verilmesini emrediyor. Bölge Yargıcı Indira Talwani haziranda kararnameyi durdururken Trump'ın eyaletlerin federal seçimleri nasıl yürüttüğünü tek taraflı değiştirme yetkisi bulunmadığını belirtti. Başsavcı Yardımcısı John Sauer başvurusunda kararnameyi bağlayıcı bir talimat değil \"genel politika yönlendirmesi\" olarak nitelendirdi ve kurumların \"kararnameyi nasıl -eğer uygulanacaksa- uygulayacakları üzerinde hâlâ değerlendirme yaptığını\" savundu. Dava 23 Demokrat yönetimindeki eyalet ile Washington DC'yi ilgilendiriyor. Yönetim, düzenlemenin kasım ara seçimlerinden önce yürürlüğe girmesi için ağustosta uygulanması gerektiğini belirterek hızlı karar istedi.", "en": "The March order directs federal agencies to build state voter-eligibility lists, requires the US Postal Service to deliver mail ballots only to people on those lists, and instructs the Justice Department to prioritise investigations into election officials accused of issuing ballots to ineligible voters. District Judge Indira Talwani blocked the order in June, finding that Trump lacked the authority to unilaterally change how states administer federal elections. In the filing, Solicitor General John Sauer characterised the order as \"general policy guidance\" rather than a binding directive and said agencies were \"still deliberating over how (if at all) to implement the Order.\" The case affects 23 Democratic-led states and Washington, DC. The administration urged swift action, saying the policy must be implemented by August to take effect before November's midterm elections."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/british-court-dismisses-bahrains-bid-to-block-activists-spyware-lawsuit", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Britanya Yüksek Mahkemesi, Bahreyn'in casus yazılım davasında dokunulmazlık talebini reddetti", "en": "UK Supreme Court rejects Bahrain's immunity bid in a spyware case"}, "summary": {"tr": "Mahkeme üçe karşı iki oyla, yabancı devletlerin Britanya'daki kişilere yönelik uzaktan gözetim nedeniyle Britanya mahkemelerinde dava edilebileceğine hükmetti. Karar, davanın esastan görülmesinin önünü açıyor.", "en": "The court ruled 3-2 that foreign states can be sued in UK courts over remote surveillance of people in Britain. The ruling clears the way for the case to proceed to trial on the merits."}, "detail": {"tr": "Davacılar, gazeteci ve bir Bahreyn muhalefet partisinin kurucusu Saeed Shehabi ile Bahreynli mülteci Moosa Mohammed. Dava, 2011'de bilgisayarlarına FinSpy casus yazılımının yerleştirildiği iddiasına dayanıyor. Bahreyn hükümeti hacklemeyi reddediyor ve iddia edilen eylemlerin Britanya yargı yetkisi dışında gerçekleştiğini, bu nedenle dokunulmazlıktan yararlandığını savunuyordu. Mahkeme, davacıların ve bilgisayarlarının casus yazılım etkisini gösterdiği sırada Britanya'da bulunduğu gerekçesiyle gözetimin Britanya'da gerçekleşmiş bir eylem sayıldığına karar verdi. Dava 2020'de Londra'daki Yüksek Mahkeme'de \"psikiyatrik zarar\" tazminatı talebiyle açılmıştı; 2023'te ilk derece, 2024'te İstinaf Mahkemesi dokunulmazlık savunmasını reddetmişti.", "en": "The claimants are Saeed Shehabi, a journalist and founder of a Bahraini opposition party, and Moosa Mohammed, a Bahraini refugee. The case rests on allegations that FinSpy spyware was deployed against their computers in 2011. Bahrain denies the hacking and argued the alleged acts took place outside UK jurisdiction, entitling it to immunity. The court found the surveillance counted as an act carried out in the UK because the claimants and their computers were in Britain when the spyware took effect. The lawsuit was filed in London's High Court in 2020 seeking damages for \"psychiatric harm\"; the High Court rejected the immunity argument in 2023 and the Court of Appeal upheld that in 2024."}, "editionDate": "2026-07-28"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/shot-fired-outside-us-consulate-in-canada-for-second-time-this-year", "publishedDate": "2026-07-27", "date": {"tr": "27 Tem", "en": "Jul 27"}, "title": {"tr": "Toronto'daki ABD başkonsolosluğuna bu yıl ikinci kez ateş açıldı", "en": "Shots fired at the US consulate in Toronto for the second time this year"}, "summary": {"tr": "Pazar sabahı yerel saatle 05.00 sularında binanın dışında ateş açıldı; bir kovan bulundu ve cephede hasar oluştu. Yaralanan olmadı, gözaltına alınan bulunmuyor.", "en": "Shots were fired outside the building at around 5 a.m. local time on Sunday; a shell casing was found and the facade was damaged. No one was injured and no arrests have been made."}, "detail": {"tr": "Polis olay yerinden uzaklaşan beyaz bir sedan otomobili kısa süre takip etti, ancak güvenlik gerekçesiyle takibi bıraktı. Yetkililer \"Hiçbir şüpheli gözaltına alınmadı, soruşturma sürüyor\" açıklamasını yaptı ve saldırganın saikine ilişkin yorum yapmaktan kaçındı. Aynı binaya dört ay önce, 10 Mart 2026'da da çok sayıda el ateş edilmiş, şüphelilerin yakalanmasına yönelik operasyonda bir polis memuru hayatını kaybetmişti. Haziranda Toronto polisi, gençlerin şifreli mesajlaşma yoluyla sinagoglar, Yahudi okulları ve ABD başkonsolosluğu gibi hedeflere para karşılığı ateş açmak üzere devşirildiğini bildirmişti. ABD Dışişleri Bakanlığı sözcüsü, Washington'ın \"olayın ardından Kanadalı yetkililerle yakın iş birliği içinde çalıştığını\" söyledi. Ontario Eyalet Başbakanı Doug Ford ise \"sorumluların tümünün bulunmasını, yargılanmasını ve yasaların izin verdiği en ağır şekilde cezalandırılmasını\" beklediğini belirtti.", "en": "Police briefly pursued a white sedan seen leaving the scene but abandoned the chase for safety reasons. Authorities said, \"No suspects have been arrested, and the investigation is ongoing,\" and declined to speculate about the motive. The same building was hit by multiple shots four months earlier, on 10 March 2026, and a police officer was killed during an operation to arrest suspects. In June, Toronto police said young people were being recruited through encrypted messaging to shoot at targets including synagogues, Jewish schools and the US consulate in exchange for payment. A US State Department spokesperson said Washington was \"working closely with Canadian authorities following the incident.\" Ontario Premier Doug Ford said he expected \"all those responsible to be found, prosecuted and punished to the fullest extent of the law.\""} evant'ta eşitsiz yumuşama: güvenlik pilotları ve süren sivil risk", "en": "Uneven de-escalation in the Levant: security pilots and continuing civilian risk"}, "summary": {"tr": "Lübnan'daki kontrollü güvenlik ve ulaşım adımları, Gazze'de ateşkese rağmen bildirilen ölümcül saldırıyla aynı bölgesel tabloda fakat ayrı siyasi süreçlerde ilerliyor.", "en": "Controlled security and transport steps in Lebanon are unfolding in the same regional picture—but on separate political tracks—as a deadly strike is reported in Gaza despite the ceasefire."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-22/geo-levant-uneven-deescalation-1280.0602249de379.webp", "variants": [{"src": "/assets/briefs/2026-07-22/geo-levant-uneven-deescalation-640.6f85d0c029ca.webp", "width": 640}, {"src": "/assets/briefs/2026-07-22/geo-levant-uneven-deescalation-1280.0602249de379.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Kontrollü geçit ve ışıkları açılan pistten, çatlamış bir gölgelik altındaki boş konut eşiğine uzanan koyu editoryal illüstrasyon.", "en": "Dark editorial illustration of a controlled checkpoint and newly lit runway leading toward an empty residential threshold beneath a fractured canopy."}, "generatedAt": "2026-07-22"}, "editionDate": "2026-07-22", "hasAnalysis": true}, {"id": "geo-state-authority-tests", "topic": "geopolitics", "title": {"tr": "Devlet otoritesinin üç sınavı: komuta, siyasi yetki ve güvenlik", "en": "Three tests of state authority: command, political mandate and security"}, "summary": {"tr": "Ukrayna'da komuta değişimi, Moldova'da parlamento seçimi ve Nijerya'da rehine kurtarma operasyonları, kamu otoritesinin üç farklı işleyişini gösteriyor.", "en": "A command change in Ukraine, a parliamentary vote in Moldova and hostage-rescue operations in Nigeria show three different ways public authority is being exercised."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-22/geo-state-authority-tests-1280.58d5d04e9f28.webp", "variants": [{"src": "/assets/briefs/2026-07-22/geo-state-authority-tests-640.0932559d1ca8.webp", "width": 640}, {"src": "/assets/briefs/2026-07-22/geo-state-authority-tests-1280.58d5d04e9f28.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Boş komuta koltuğu, aydınlık parlamento eşiği ve korunan alana açılan yol bariyerini birleştiren editoryal illüstrasyon.", "en": "Editorial illustration linking an empty command chair, a lit parliamentary threshold and a road barrier opening toward protected space."}, "generatedAt": "2026-07-22"}, "editionDate": "2026-07-22", "hasAnalysis": true}], "articles": [{"writer": "geo-01", "title": {"tr": "Yaptırım listesi kısaldıkça tarama eşiği yükseliyor", "en": "As the sanctions list shortens, the screening bar rises"}, "excerpt": {"tr": "Hazine'nin ikinci çıkarma turu yaptırımları gevşetmiyor, aracın kendisini yeniden tanımlıyor. Görünen taraf 84 adın silinmesi; asıl değişiklik 22 girişe eklenen ayırt edici bilgide.", "en": "Treasury's second removal round does not loosen sanctions; it redefines the instrument. The 84 deletions are the visible part; the change that matters sits in the identifiers added to 22 entries."}, "sections": [{"h": {"tr": "Silinen ad ile taranabilir hedef arasındaki fark", "en": "The difference between a deleted name and a screenable target"}, "ps": [{"tr": "Hazine Bakanlığı 27 Temmuz'da modernizasyon girişiminin ikinci turunu duyurdu: OFAC'ın Özel Olarak Belirlenmiş Kişiler ve Engellenen Kişiler listesinden 84 kişi ve kuruluş çıkarıldı, 22 liste girişine ayırt edici bilgi eklendi, 18 mükerrer giriş kümesi giderildi. Üç işlemin de aynı duyuruda yer alması tesadüf değil.", "en": "On 27 July the Treasury Department announced the second round of its modernization initiative: 84 individuals and entities came off OFAC's Specially Designated Nationals and Blocked Persons List, 22 list entries gained identifying information, and 18 sets of duplicates were resolved. That the three operations share one announcement is not incidental.", "refs": ["ofac"]}, {"tr": "Listeden çıkarma genellikle siyasi bir taviz olarak okunur. Hazine'nin bildirdiği ölçütler başka bir mekanizmaya işaret ediyor: vefat etmiş kişiler, faaliyeti sona ermiş kuruluşlar ve 20 yıldan uzun süre önce belirlenmiş, tarama için yeterli bilgi taşımayan hedefler. Bir bankanın süzgecinde eşleşmeyen bir ad, yaptırım uygulanmasını sağlamaz; yalnızca yanlış eşleşme üretir. Yine de tersi de mümkün: duyuru tek tek dosyaları yayımlamadığı için, çıkarmaların bir bölümünün sessiz bir siyasi gevşeme olması ihtimali dışlanamaz.", "en": "A delisting is usually read as a political concession. The criteria Treasury states point to a different mechanism: deceased individuals, defunct entities, and targets designated more than 20 years ago that lack the information needed for screening. A name that will not match inside a bank's filter enforces nothing; it produces false hits. The opposite reading remains available, though: because the announcement publishes no individual case files, some of the removals could still be a quiet political relaxation.", "refs": ["ofac"]}]}, {"h": {"tr": "Uyum yükü nereye kayıyor?", "en": "Where does the compliance burden move?"}, "ps": [{"tr": "Eklenen alanlar bu okumanın sınamasıdır: doğum tarihi, kimlik numarası, uyruk, cinsiyet. Bunlar bir adı makinenin eşleştirebileceği bir hedefe çeviren alanlardır. 22 girişe eklenmeleri, bir finans kuruluşunun süzgecinin ulaşabileceği kesinliği yükseltir; eşleşmeyen girişlerin silinmesi ise yanlış alarmı düşürür. Hangi adın okunabilir kılınacağına karar veren makam, uygulamanın dikkatinin nereye yoğunlaşacağına da karar vermiş olur.", "en": "The added fields are the test of that reading: date of birth, identification number, nationality, gender. These are what turn a name into something a machine can match. Adding them to 22 entries raises the precision a financial institution's filter can reach; deleting unmatchable entries lowers the false-positive load. Whoever decides which name becomes legible has also decided where enforcement attention will concentrate.", "refs": ["ofac"]}, {"tr": "İkinci bir değişiklik gündemin kimin elinde olduğuna dokunuyor. Hazine, 29 Haziran 2026'da listeden çıkarma başvurularının yapılabildiği bir Yeniden Değerlendirme Portalı açtığını bildiriyor. Bu, sıranın bir bölümünü kurumun iç önceliklerinden başvuru yapanlara taşır. Gözlenebilir işaret şu: sonraki turların bileşimi idari temizlikten mi, yoksa başvuruya dayalı çıkarmalardan mı ağırlık alacak.", "en": "A second change touches who holds the agenda. Treasury says it opened a Reconsideration Portal on 29 June 2026 through which delisting petitions can be filed. That moves part of the queue away from the agency's internal priorities and toward whoever files. The observable signal: whether the composition of later rounds tilts from administrative housekeeping toward petition-driven removals.", "refs": ["ofac"]}]}, {"h": {"tr": "Hangi ölçüyle değerlendirilecek?", "en": "By what measure will it be judged?"}, "ps": [{"tr": "Duyuruda Bakan Scott Bessent'in tutumu, yönetimin yaptırım başarısını \"yalnızca Hazine'nin listeye eklediği isim sayısıyla değil, etki, sonuç ve fayda üzerinden\" ölçtüğü biçiminde aktarılıyor. Bir duyuruda ilan edilen ölçüt bir konum belirler, uygulamayı belgelemez. Bu ölçütün ciddiye alınıp alınmadığı, sonraki turların her girişin hangi gerekçeyle çıkarıldığını ayrı ayrı yayımlayıp yayımlamamasından anlaşılacak.", "en": "The release attributes to Secretary Scott Bessent the position that the administration measures sanctions success \"in terms of effect, impact, and benefit-not just based on the number of names Treasury places on a list.\" A yardstick declared in a press release establishes a position; it does not document implementation. Whether it is meant seriously will show in whether later rounds publish, entry by entry, the ground on which each name was removed.", "refs": ["ofac"]}]}], "sources": [{"key": "ofac", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0578", "title": {"tr": "ABD Hazinesi yaptırım listesinden 84 kişi ve kuruluşu çıkardı", "en": "US Treasury removes 84 people and entities from its sanctions list"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-02", "title": {"tr": "Salonu terk etmek hangi yetkiyi geri alır?", "en": "What authority does walking out reclaim?"}, "excerpt": {"tr": "Bu köşenin önceki yazısında 144'e karşı 10'luk oyun meşruiyet verdiği, ama uygulamayı zorlayacak bir güç vermediği savunulmuştu. Pazartesi günkü çıkış, aynı hesabın öbür yarısını görünür kılıyor.", "en": "An earlier column here argued that the 144-10 vote conferred legitimacy but not the leverage to compel practice. Monday's walkout makes the other half of that sum visible."}, "sections": [{"h": {"tr": "Oyun ardından gelen çıkış", "en": "The walkout that followed the vote"}, "ps": [{"tr": "ABD heyeti pazartesi günü, Fransa'nın Rusya'nın Ukrayna'daki savaşına ilişkin konuşmasına başladığı sırada Güvenlik Konseyi salonunu terk etti. Anlaşmazlığın kaynağı Konsey'in gündemindeki savaş değil, Washington'ın BM insan hakları yüksek komiseri Volker Türk'ün görev süresinin uzatılmasına karşı oy vermesiydi.", "en": "The US delegation left the Security Council chamber on Monday as France's delegation began speaking about Russia's war in Ukraine. The dispute did not originate in the war on the Council's agenda but in Washington's vote against renewing the term of UN human rights chief Volker Turk.", "refs": ["unsc"]}, {"tr": "Bu köşenin önceki yazısında, Türk'ün 144'e karşı 10 oyla yeniden seçilmesinin kuruma meşruiyet kazandırdığı ama karşı oy veren devletlerin uygulamasını değiştirmediği ileri sürülmüştü. Pazartesi günkü çıkış o savın sınanabilir hale gelen tarafıdır: karşı oy veren devlet uyum göstermek yerine salondan çekildi. Karar aritmetiği tuttu; kararın muhatabı üzerindeki etkisi tutmadı.", "en": "An earlier column here argued that Turk's re-election by 144 votes to 10 gave the office legitimacy without changing the practice of the states that opposed it. Monday's walkout is the testable side of that argument: the opposing state's response was not compliance but withdrawal from the room. The coalition arithmetic held; its purchase on the state it was aimed at did not.", "refs": ["unsc", "history-turk"]}]}, {"h": {"tr": "İki delegasyonun farklı hesabı", "en": "Two delegations, two different sums"}, "ps": [{"tr": "Fransa'nın BM Daimî Temsilciliği ABD'nin artık bir \"insan hakları feneri\" olmadığını bildirdi ve oyla Kuzey Kore, Nikaragua, Mali ve Rusya ile aynı safta kaldığını söyledi. ABD Daimî Temsilcisi Mike Waltz ise Türk'ün \"ABD, Birleşik Krallık ve İsrail gibi özgür, egemen demokrasilere ders verdiğini\" savundu. Dönüşümlü temsilci Dan Negrea, Fransa \"küçümseyici ve saygısız söyleminden\" vazgeçene kadar çıkışların süreceğini duyurdu. Fransa'nın büyükelçisi Jerome Bonnafont çıkışa hiç değinmedi, BM'nin bağımsızlığını korumaktan söz etti.", "en": "France's UN Mission said the US was no longer a \"beacon of human rights\" and that the vote had left it standing with North Korea, Nicaragua, Mali and Russia. US Ambassador Mike Waltz replied that Turk \"has been lecturing free, sovereign democracies like the United States, the UK, and Israel.\" Alternate representative Dan Negrea announced the walkouts would continue until France renounced its \"condescending and disrespectful rhetoric.\" France's ambassador Jerome Bonnafont did not mention the walkout at all and spoke of preserving the UN's independence.", "refs": ["unsc"]}, {"tr": "Negrea'nın koyduğu koşul, çıkışı bir pazarlık aracına dönüştürüyor. Bu aracın bedeli düşük: Konsey, eksik bir heyetle de çalışmayı sürdürür, dolayısıyla masraf salonu terk edenin kendi gündem belirleme gücüne yazılır. Bu yüzden çıkışın hedefi Fransa'nın söylemi olmayabilir; muhatabı iç kamuoyu olan bir jest de aynı biçimi alır. İki yorumu ayıran şey, ABD'nin kendi metin taslağını savunması gereken bir oturumda aynı davranışı sürdürüp sürdürmeyeceğidir.", "en": "Negrea's condition turns the walkout into a bargaining instrument. It is a cheap one: the Council keeps working with a delegation missing, so the cost falls on the absentee's own agenda-setting. That is why France's rhetoric may not be the real target; a gesture aimed at a domestic audience takes exactly the same shape. What separates the two readings is whether the US repeats the behaviour in a session where it must defend a draft of its own.", "refs": ["unsc"]}]}, {"h": {"tr": "Ne gözlemlenebilir?", "en": "What can be observed"}, "ps": [{"tr": "Buradan bir denge çıkarmak için henüz erken. Ama sınanabilir bir eşik var: ABD, kendi sunduğu bir karar tasarısının görüşüldüğü bir oturumda da salonu terk ederse, çıkış bir müzakere aracı değil, kurumdan uzaklaşmanın alışkanlığa dönüşmüş biçimi olarak okunmalıdır. Tersine, taslak sahibi olduğu oturumlarda kalırsa, koşulun gerçekten Fransa'nın söylemine bağlandığı görülür.", "en": "It is too early to call this a balance. But there is a testable threshold: if the US also leaves a session in which a draft resolution it sponsored is under discussion, the walkout should be read not as a negotiating instrument but as distancing from the institution turned into habit. If, on the other hand, it stays in sessions where it owns the text, the condition really is tied to France's rhetoric.", "refs": ["unsc"]}]}], "sources": [{"key": "unsc", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/us-diplomats-walk-out-as-france-addresses-un-security-council", "title": {"tr": "Fransa söz alınca ABD diplomatları Güvenlik Konseyi salonundan çıktı", "en": "US diplomats walk out as France takes the floor at the Security Council"}, "publishedDate": "2026-07-27"}, {"key": "history-turk", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-25/", "title": {"tr": "144'e karşı 10 ve bir kurumun dayanıklılığı", "en": "144 against 10, and the durability of an institution"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "geo-03", "title": {"tr": "Bir uçağın satışını iki ayrı yetki belirliyor", "en": "Two separate authorities decide one aircraft's sale"}, "excerpt": {"tr": "\"Kimse bana ne satmamız gerektiğini söyleyemez\" bir niyet beyanıdır. Uygunluk kararını veren makam ise bir hafta önce Kongre'ye Ankara'nın hâlâ nitelikleri karşılamadığını bildirdi.", "en": "\"Nobody tells me what we should be selling\" is a statement of intent. The office that decides eligibility told Congress a week ago that Ankara still does not qualify."}, "sections": [{"h": {"tr": "Niyet ile uygunluk arasındaki mesafe", "en": "The distance between intent and eligibility"}, "ps": [{"tr": "Trump, uçakta gazetecilerin Netanyahu'nun itirazına ilişkin sorusuna \"Kimse bana ne satmamız gerektiğini söyleyemez\" diye yanıt verdi ve ekledi: \"Türkiye İsrail'in büyük hayranı değil, Bibi'nin de pek hayranı değil. Ama bana karşı harika davrandılar\". TRT Haber'in aktardığı sözlerinde Erdoğan'ı dostu olarak andı, Türkiye'yi de büyük bir müttefik diye tanımladı.", "en": "Asked aboard his plane about Netanyahu's objection, Trump answered, \"Nobody tells me what we should be selling.\" He added: \"Turkey's not a big fan of Israel, not a great fan of Bibi. But they've been great for me.\" In remarks carried by TRT Haber he called Erdogan a friend and Turkey a major ally.", "refs": ["f35"]}, {"tr": "Aynı haberde ikinci bir bilgi var ve satışın hangi aşamada olduğuna dair asıl veri odur: Dışişleri Bakanlığı bir hafta önce Kongre'ye Ankara'nın alım için hâlâ uygun olmadığını bildirdi. Bu, iki ayrı yetkinin aynı dosyada farklı yönde çalıştığını gösterir. Biri satışı istiyor, öbürü uygunluk ölçütünü tutuyor.", "en": "The same report carries a second fact, and it is the one that actually locates the sale: the State Department told Congress a week ago that Ankara still does not qualify for the purchase. Two separate authorities are working the same file in opposite directions. One wants the sale; the other holds the eligibility standard.", "refs": ["f35"]}]}, {"h": {"tr": "Kabiliyet ne zaman devreye girer?", "en": "When does the capability actually arrive?"}, "ps": [{"tr": "Bir beşinci nesil uçak, bölgesel hava resmini açıklandığı gün değiştirmez. Sıra bellidir: uygunluk, sözleşme, üretim sırası, teslimat, ardından mürettebat ve idame. Başkanın sözü bu dizinin ilk basamağının bile öncesindedir. Buna karşılık dizi bir veto değildir; uygunluk ölçütünü uygulayan makam yürütmenin içindedir ve yürütme kendi ölçütünü gözden geçirebilir. Bu yüzden bugünkü tablo bir engel değil, bir gecikme ölçüsüdür.", "en": "A fifth-generation aircraft does not change the regional air picture on the day it is announced. The sequence is fixed: eligibility, contract, production slot, delivery, then aircrew and sustainment. A president's remark sits before even the first of those steps. The sequence is not a veto, though: the office applying the eligibility standard sits inside the executive branch, and the executive can revise its own standard. What today's picture measures is delay, not obstruction.", "refs": ["f35"]}, {"tr": "Netanyahu'nun itirazı da uçak sayısıyla ilgili değil. Bir ülkenin o kabiliyet katmanında iş görebilmesi, komşularının hava planlamasında hangi varsayımı kuracağını belirler. Trump'ın yanıtı bu düzlemde verilmedi; ilişkinin kendisini öne çıkardı ve dengeyi hiç fiyatlamadı. İki taraf aynı dosyada iki ayrı ölçütle konuşuyor.", "en": "Netanyahu's objection is not about airframe counts either. Whether a state can operate at that capability tier sets the assumption its neighbours build into their own air planning. Trump's answer was not given on that plane; it foregrounded the relationship itself and priced the balance not at all. The two sides are arguing the same file with two different yardsticks.", "refs": ["f35"]}]}, {"h": {"tr": "Gözlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu dosyada söz ile sonuç arasındaki farkı ölçen tek bir belge var. Dışişleri Bakanlığı Kongre'ye ilettiği değerlendirmeyi değiştirir ve Türkiye'ye F-35 satışına ilişkin resmî bir bildirim yapılırsa, niyet beyanı kabiliyet hattına geçmiş olur. Böyle bir bildirim olmadıkça, uçakta söylenen sözün hava resmi üzerinde ölçülebilir bir karşılığı yoktur.", "en": "Only one document measures the gap between the remark and the outcome in this file. If the State Department revises its assessment to Congress and a formal notification of a proposed F-35 sale to Türkiye follows, the statement of intent will have crossed into the capability line. Absent such a notification, what was said aboard the plane has no measurable effect on the air picture.", "refs": ["f35"]}]}], "sources": [{"key": "f35", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog_entry/trump-on-netanyahu-opposing-f-35-sale-to-turkey-nobody-tells-me-what-we-should-be-selling/", "title": {"tr": "Trump, Türkiye'ye F-35 satışına yönelik Netanyahu itirazını reddetti", "en": "Trump brushes aside Netanyahu's objection to an F-35 sale to Türkiye"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-04", "title": {"tr": "Bab-ül Mendep'ten pazar günü geçen on bir gemi", "en": "Eleven ships through Bab al-Mandeb on Sunday"}, "excerpt": {"tr": "Yemen'in dışişleri bakanı adayı, Husilerin Hürmüz modelini kopyalamak istediğini söylüyor. Geçiş sayıları, kopyalamaya gerek kalmadan rotanın çoktan boşaldığını gösteriyor.", "en": "Yemen's foreign minister-designate says the Houthis want to copy the Hormuz model. The transit counts show the route has already emptied without any copying."}, "sections": [{"h": {"tr": "Sayılar ne diyor?", "en": "What the numbers say"}, "ps": [{"tr": "Afrah
