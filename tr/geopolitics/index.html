 ikinci gece füze depolarını ve hava savunmasını vurdu. Kabiliyet niyetten daha dürüsttür; bir tehdit ancak arkasındaki masraf inandırıcıysa caydırır.", "en": "Trump's formula is simple and therefore dangerous: for every ship hit in Hormuz, one bridge or one power plant. CBS says the US struck missile stores and air defences on a twelfth night. Capability is more honest than intent; a threat deters only if the cost behind it is credible."}, {"refs": ["s1"], "tr": "Kayıp beyanları iki taraftan da geliyor ve doğrulanamıyor: İran 53 ölü, 592 yaralı; ABD tarafında 18 asker ölü, 482 yaralı. İran Meclis Başkanı Kalibaf 'hiçbir altyapı güvende olmaz' derken Dışişleri Bakanı Erakçi doktrini 'göze göz' diye özetliyor. Her gece tekrarlanan tempo, dayanıklılık üzerine bir iddiadır; karşılık da öyle.", "en": "Casualty claims come from both sides and cannot be verified: Iran says 53 killed and 592 wounded; on the US side, 18 troops killed and 482 wounded. Iran's speaker Ghalibaf says 'no infrastructure will be safe,' while Foreign Minister Araghchi sums up the doctrine as 'an eye for an eye.' A nightly cadence is an argument about endurance; so is the reply."}]}, {"h": {"tr": "İkinci Su: Kızıldeniz Cephesi", "en": "The Second Water: The Red Sea Front"}, "ps": [{"refs": ["s2"], "tr": "Husiler, Encelia ve Layla tankerlerini balistik ve seyir füzeleriyle ve İHA'larla vurduğunu, ilan ettikleri deniz ablukasının ihlali gerekçesiyle üstlendi; yaklaşık on gemi rotasını değiştirdi. Savaş artık tek suda değil: Hürmüz'de ABD, Kızıldeniz'de Husiler bedel dayatıyor. İlan edilmiş bir çizgi ile savunulan bir çizgi farklı şeylerdir.", "en": "The Houthis claimed strikes on the tankers Encelia and Layla with ballistic and cruise missiles and drones, calling it a violation of the naval blockade they declared; about ten ships changed course. The war is no longer in one water: in Hormuz the US imposes cost, in the Red Sea the Houthis do. An announced line and a defended line are different things."}, {"refs": ["s2", "history-2026-07-22"], "tr": "Dün 'Boğazdaki Kırmızı Çizgi' başlıklı yazımda, bir kırmızı çizginin ancak arkasındaki masraf kadar gerçek olduğunu savunmuştum; tankerlere yapılan saldırı bu tezi bir sonraki halkaya taşıyor. Öngörü nettir: iki cephede eşzamanlı caydırıcılık, bir cephedeki tavizin diğerinde sınanmasını davet eder. İzlenecek tek şey, Trump'ın 'gemi başına bir köprü' formülünün uygulanıp uygulanmayacağı; uygulanmayan bir tehdit, tüm merdiveni ucuzlatır.", "en": "In yesterday's column, 'The Red Line in the Strait,' I argued that a red line is only as real as the cost behind it; the tanker strikes carry that argument to the next rung. The forecast is plain: simultaneous deterrence on two fronts invites any concession on one to be tested on the other. Watch one thing above all: whether Trump's 'one bridge per ship' formula is executed or bluffed. An unexecuted threat cheapens the whole ladder."}]}], "date": "2026-07-23"}, {"writer": "geo-04", "title": {"tr": "İki Fatura, İki Yön: Biri Meclisten Geçti, Biri Sandığa Yürüdü", "en": "Two Bills, Two Directions: One Cleared the House, One Walked to the Ballot Box"}, "excerpt": {"tr": "1,15 trilyon dolarlık savunma faturası Meclis'ten kıl payı geçti; aynı hafta Brezilya'da ABD tarifeleri, hedef aldığı adayı değil rakibini güçlendirdi. Kaldıraç her iki yönde de kesiyor.", "en": "The $1.15 trillion defence bill scraped through the House; the same week in Brazil, US tariffs strengthened not their target but his rival. Leverage cuts both ways."}, "sources": [{"key": "s1", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/us-house-passes-1-15-trillion-military-bill-expanding-israel-cooperation", "title": {"tr": "ABD Temsilciler Meclisi, İsrail işbirliğini genişleten 1,15 trilyon dolarlık savunma tasarısını kabul etti", "en": "US House passes $1.15 trillion defence bill expanding cooperation with Israel"}, "publishedDate": "2026-07-23"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/us-tariffs-strengthen-lula-against-bolsonaros-son-in-upcoming-elections", "title": {"tr": "ABD tarifeleri, seçim öncesi Lula'yı Bolsonaro'nun oğluna karşı güçlendiriyor", "en": "US tariffs strengthen Lula against Bolsonaro's son ahead of election"}, "publishedDate": "2026-07-23"}, {"key": "history-2026-07-22", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-04/2026-07-22/", "title": {"tr": "Süveyş'e Dönen Yük, Senato'daki Fatura", "en": "The Cargo That Turns to Suez, the Bill in the Senate"}, "publishedDate": "2026-07-22"}], "sections": [{"h": {"tr": "Meclisten Geçen Rakam", "en": "The Number That Cleared the House"}, "ps": [{"refs": ["s1"], "tr": "216'ya 212: NDAA, İran savaşını finanse eden ve İsrail'le tedarik zincirlerini birleştiren 219. maddeyle birlikte Meclis'ten geçti. Bayrağın altında her zaman fiyatı belli bir çıkar vardır; burada fiyat 1,15 trilyon dolar. Massie maddeyi 'egemenliğe ihanet', Schumer tasarının tümünü savaş için 'izin belgesi' diye niteledi.", "en": "216 to 212: the NDAA cleared the House with Section 219, which funds the Iran war and merges supply chains with Israel. Beneath the flag there is always a priced interest; here the price is $1.15 trillion. Massie called the section 'a betrayal of sovereignty,' Schumer called the whole bill a 'permission slip' for war."}, {"refs": ["s1", "history-2026-07-22"], "tr": "Dün 'Süveyş'e Dönen Yük, Senato'daki Fatura' başlıklı yazımda asıl hesabın yasama katında görüleceğini yazmıştım; şimdi Meclis rakamı 1,15 trilyona sabitlendi, tasarı Senato'ya geçti. Tahakkuk takvimi bir tasmadır: parayı onaylayan, savaşın süresini de eline alır. Demokratlar görüşmeyi şimdiden bloke ettiğine göre asıl pazarlık maliyet üzerinden yürüyecek.", "en": "In yesterday's column, 'The Cargo That Turns to Suez, the Bill in the Senate,' I wrote that the real reckoning would come on the legislative floor; now the House number is fixed at $1.15 trillion and the bill has moved to the Senate. The appropriations calendar is a leash: whoever authorises the money holds the war's duration. With Democrats already blocking debate, the real bargaining will run through cost."}]}, {"h": {"tr": "Geri Tepen Tarife", "en": "The Tariff That Backfired"}, "ps": [{"refs": ["s2"], "tr": "Brezilya'da yüzde 25'lik ABD tarifesi, hedef aldığı sağı değil Lula'yı güçlendirdi: Quaest anketi ikinci turda Lula'yı yüzde 45'e 37 önde gösteriyor. Ambargo bir duvar değil, bir sapaktır; buradaki sapak siyasi. Pix ödeme sistemi, etanol ve ormansızlaşma gerekçe gösterildi, ama fatura egemenlik söylemine çevrildi.", "en": "In Brazil, the 25 percent US tariff strengthened not the right it aimed at but Lula: a Quaest poll shows him ahead 45 to 37 in a runoff. An embargo is not a wall but a detour; here the detour is political. The Pix payment system, ethanol and deforestation were cited as grounds, but the bill was converted into a sovereignty pitch."}, {"refs": ["s2"], "tr": "Öngörü: Washington baskıyı sürdürürse Brezilya'nın BRICS ve alternatif ödeme raylarına —Pix tam da bu tartışmanın merkezinde— yönelişi hızlanır. Cezalandırmak için kurulan tarife, dolar dışı altyapıyı büyütebilir. Yaptırım paketinde ilk sorulacak soru 'kim vuruldu' değil, 'yük hangi limandan dolanacak'tır; bu kez limanın adı sandık.", "en": "The forecast: if Washington keeps pressing, Brazil's turn toward BRICS and alternative payment rails — with Pix at the centre of that very dispute — will accelerate. A tariff built to punish may enlarge the non-dollar plumbing instead. The first question about any sanctions package is not 'who was hit' but 'through which port will the cargo re-route' — and this time the port is the ballot box."}]}], "date": "2026-07-23"}, {"writer": "geo-01", "title": {"tr": "Denetçisiz Bir Kapı: Riyad'ın Santrifüjü ve Standardın Boşluğu", "en": "A Gate Without an Inspector: Riyadh's Centrifuge and the Missing Standard"}, "excerpt": {"tr": "Washington nükleer kapıyı Riyad'a aralarken en sıkı denetim aracını —IAEA Ek Protokolü'nü— dışarıda bıraktı. Aynı gün Manila'da Rubio ile Wang Yi 'büyük farkları' yönetmeyi konuştu. Üç başkent, aynı soruyu farklı dillerde soruyor: standardı kim koyacak?", "en": "As Washington cracks open the nuclear gate for Riyadh, it left out the tightest inspection tool — the IAEA Additional Protocol. The same day in Manila, Rubio and Wang Yi discussed managing their 'great differences.' Three capitals, the same question in different dialects: who sets the standard?"}, "sources": [{"key": "s1", "kind": "news", "name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/ap-report-trump-approves-nuclear-agreement-that-may-allow-saudi-arabia-to-enrich-uranium", "title": {"tr": "Trump, Suudi Arabistan'a uranyum zenginleştirme yolunu açabilecek 30 yıllık nükleer anlaşmayı onayladı", "en": "Trump approves a 30-year nuclear deal that could open a path to Saudi uranium enrichment"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/rubio-says-us-china-must-work-through-big-differences-at-asean-meeting", "title": {"tr": "Rubio ile Wang Yi, ASEAN toplantısında 'büyük görüş ayrılıklarını' yönetmeyi görüştü", "en": "Rubio and Wang Yi discuss managing 'great differences' at ASEAN meeting"}, "publishedDate": "2026-07-22"}, {"key": "history-2026-07-22", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-01/2026-07-22/", "title": {"tr": "İki İdari İşlem, Tek Standart", "en": "Two Administrative Acts, One Standard"}, "publishedDate": "2026-07-22"}], "sections": [{"h": {"tr": "Denetçiyi Dışarıda Bırakmak", "en": "Leaving the Inspector Outside the Gate"}, "ps": [{"refs": ["s1"], "tr": "Genellikle kapıya denetçi koyan, standardı belirler. Suudi Arabistan'la 30 yıllık anlaşma bu kez kapıyı denetçisiz aralıyor: ortak bir çalışmanın ardından zenginleştirme tesisi mümkün, tesisi Amerikan firmaları kuracak, ama daha sıkı izleme sağlayan IAEA Ek Protokolü metnin dışında. Standart, konularak değil, eksik bırakılarak belirleniyor.", "en": "Whoever puts an inspector at the gate usually sets the standard. The 30-year deal with Saudi Arabia opens the gate without one: enrichment becomes possible after a joint study, American firms build the facility, but the IAEA Additional Protocol that would allow tighter monitoring is left out of the text. The standard is set not by what is written but by what is omitted."}, {"refs": ["s1", "history-2026-07-22"], "tr": "Dün 'İki İdari İşlem, Tek Standart' yazımda, bir standardın onu kimin denetlediği üzerinden fiilen ihraç edildiğini savunmuştum; Suudi anlaşması kabiliyeti verirken en katı doğrulamayı geri çekerek tam bu tezi doğruluyor. Uzmanlar dönen santrifüjlerin bir silah programının kapısını aralayabileceği uyarısında; Veliaht Prens bin Selman, İran silahlanırsa Riyad'ın da izleyeceğini zaten söylemişti.", "en": "In yesterday's column, 'Two Administrative Acts, One Standard,' I argued that a standard is exported de facto through who inspects it; the Saudi deal confirms exactly that, granting capability while withdrawing the strictest verification. Experts warn spinning centrifuges could open the door to a weapons programme; Crown Prince bin Salman has already said Riyadh would follow if Iran arms."}]}, {"h": {"tr": "Manila'da Üç Başkent", "en": "Three Capitals in Manila"}, "ps": [{"refs": ["s2"], "tr": "Aynı gün Manila'da Rubio ile Wang Yi 'büyük farkları' yönetmeyi, Şi'nin eylüldeki ziyaretini 'olumlu' kılmayı konuştu; masada Güney Çin Denizi ve Filipinler'e çıkarılan 100 milyon dolarlık askeri finansman vardı. Üç başkent, üç ayrı dil: biri kabiliyet ihraç ediyor, biri deniz kural kitabını sınıyor, biri hangi standardı ithal edeceğini tartıyor.", "en": "The same day in Manila, Rubio and Wang Yi discussed managing 'great differences' and making Xi's September visit 'positive'; on the table were the South China Sea and $100 million in military financing raised for the Philippines. Three capitals, three dialects: one exports capability, one tests the maritime rulebook, one weighs which standard to import."}, {"refs": ["s2", "s1"], "tr": "Nükleer standart ile Pasifik standardı aynı oyunun iki tahtası: Washington kabiliyet yarışında, Pekin deniz kuralını zorlamada, orta güçler —Riyad, Manila— hangi çerçeveyi içeri alacağını fiyatlıyor. Öngörü: Kongre'nin Suudi anlaşmasına itiraz penceresi kapanırsa, 'denetçisiz kapı' bir sonraki başvuranın örnek göstereceği şablona dönüşür. Bu strateji, denklemi kimin yazdığı sorusudur.", "en": "The nuclear standard and the Pacific standard are two boards of one game: Washington races on capability, Beijing presses the maritime rule, and the middle powers — Riyadh, Manila — price which framework to admit. The forecast: if Congress's window to object to the Saudi deal lapses, the 'gate without an inspector' becomes the template the next applicant cites. This should be read strategically: it is a question of who writes the equation."}]}], "date": "2026-07-23"}, {"writer": "geo-02", "title": {"tr": "Bir Masa, İki Ateş: Manila'da Dengeyi Aramak", "en": "One Table, Two Fires: Seeking Balance in Manila"}, "excerpt": {"tr": "Manila'daki ASEAN masasında Rubio, aynı gün hem Pekin'le 'büyük farkları' hem de Tahran'la müzakere ihtimalini tarttı. Bir kefede diplomasi kapısı aralık; öbüründe on ikinci gece bombardıman. Denge kuruldu demek için erken.", "en": "At the ASEAN table in Manila, Rubio weighed both 'great differences' with Beijing and the prospect of talks with Tehran on the same day. On one side the door to diplomacy is ajar; on the other, a twelfth night of bombing. Too early to call it a balance."}, "sources": [{"key": "s1", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/rubio-says-us-china-must-work-through-big-differences-at-asean-meeting", "title": {"tr": "Rubio ile Wang Yi, ASEAN toplantısında 'büyük görüş ayrılıklarını' yönetmeyi görüştü", "en": "Rubio and Wang Yi discuss managing 'great differences' at ASEAN meeting"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/us-open-to-negotiations-with-iran-but-tehran-not-serious-rubio-says", "title": {"tr": "Rubio: ABD İran'la müzakereye açık, ancak Tahran 'ciddi değil'", "en": "Rubio: US is open to talks with Iran, but Tehran is 'not serious'"}, "publishedDate": "2026-07-22"}, {"key": "history-2026-07-22", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-22/", "title": {"tr": "Bir Komutan Gitti, Bir Başbakan Geldi: Terazi Yine Avrupa'da", "en": "A Commander Out, a Premier In: The Scales Tip in Europe Again"}, "publishedDate": "2026-07-22"}], "sections": [{"h": {"tr": "İki Rakip, Tek Fotoğraf", "en": "Two Rivals, One Photograph"}, "ps": [{"refs": ["s1"], "tr": "Bir kefede Rubio ile Wang Yi 'büyük farkları' yönetmeyi ve Şi'nin eylül ziyaretini konuştu; öbür kefede Second Thomas Shoal'da yaralanan Filipinli denizci ve Filipinler'e çıkarılan finansman duruyor. Bir zirveyi, söylediği kadar söylemediğiyle de okumak gerekir: taraflar sorunu çözmüyor, yönetiyor.", "en": "On one pan, Rubio and Wang Yi discussed managing 'great differences' and Xi's September visit; on the other sit the Philippine sailor injured at Second Thomas Shoal and the financing raised for Manila. A summit must be read for what it does not say as much as for what it does: the parties are not resolving the problem, they are managing it."}, {"refs": ["s1"], "tr": "Bir zirve bir fotoğraf ve bir açıklama üretir; denge üretip üretmediği bir sonraki çeyreğin sorusudur. Şi'nin ziyaretini 'olumlu' kılma isteği, çatışmayı erteleyen bir çerçeve; kusurlu bir masa, masasızlıktan iyidir, ama tek başına denge değildir.", "en": "A summit produces a photograph and a communiqué; whether it produced a balance is next quarter's question. The wish to make Xi's visit 'positive' is a frame that defers conflict; a flawed table beats no table, but by itself it is not equilibrium."}]}, {"h": {"tr": "Hem Konuş Hem Vur", "en": "Talk and Strike at Once"}, "ps": [{"refs": ["s2"], "tr": "Aynı masada Rubio, İran'la 'yapıcı müzakerelere açık' olduklarını ama Tahran'ın 'ciddi olmadığını' söyledi; 'ciddilerse biz de ciddiyiz' derken ABD on birinci gece saldırıyordu. Diplomasi kefesi açık tutuluyor, ama askeri kefe her gece dolduruluyor. Rubio, İran'ın Hürmüz'ü denetleme 'hakkı olmadığını' savunuyor.", "en": "At the same table, Rubio said the US was 'open to constructive negotiations' with Iran but that Tehran was 'not serious'; as he said 'if they're serious, we're serious,' the US was striking on an eleventh night. The diplomatic pan is held open while the military pan is filled every night. Rubio argues Iran has 'no right' to police Hormuz."}, {"refs": ["s2", "history-2026-07-22"], "tr": "Dün 'Bir Komutan Gitti, Bir Başbakan Geldi' yazımda her dengenin bir zirve ötesinde devrilebileceğini söylemiştim; burada Washington diplomasi kefesini açık tutarken askeri kefeyi ağırlaştırıyor. Öngörü: off-ramp ancak masayı tutacak inandırıcı bir arabulucu varsa iş görür. İzlenmesi gereken, ASEAN'ın ya da bir Körfez aracısının, gece sayısı masayı imkânsız kılmadan Rubio'nun koşullu sözünü bir kanala çevirip çeviremeyeceği.", "en": "In yesterday's column, 'A Commander Out, a Premier In,' I said every equilibrium is one summit away from tipping; here Washington keeps the diplomatic pan open while loading the military one. The forecast: an off-ramp works only if a credible mediator can hold the table. Watch whether ASEAN or a Gulf broker can convert Rubio's conditional into a channel before the night-count makes any table too costly to sit at."}]}], "date": "2026-07-23"}, {"writer": "geo-05", "title": {"tr": "Hartum'a Yaptırım, Zamfara'da Sessizlik: Yerden Bakınca", "en": "Sanctions on Khartoum, Silence in Zamfara: The View From the Ground"}, "excerpt": {"tr": "Washington Sudan ordusuna kimyasal silah gerekçesiyle hava sahasını kaparken, Zamfara'da silahlı çeteler yirmiden fazla köylüyü öldürdü ve hiçbir başkent kapı çalmadı. Kıtanın güvenliği uzaktaki yaptırım listelerinden değil, köy meydanlarından okunur.", "en": "As Washington shut its airspace to Sudan's army over chemical weapons, armed gangs in Zamfara killed more than twenty villagers and no capital came knocking. The continent's security reads not from distant sanctions lists but from village squares."}, "sources": [{"key": "s1", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/07/22/sudan-armys-chemical-weapons-use-leads-to-new-us-sanctions/", "title": {"tr": "ABD, kimyasal silah tespiti gerekçesiyle Sudan ordusuna yeni yaptırımlar uyguladı", "en": "US imposes new sanctions on Sudan's army over a chemical-weapons finding"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/armed-attackers-kill-more-than-20-in-northwest-nigeria", "title": {"tr": "Kuzeybatı Nijerya'da silahlı saldırganlar 20'den fazla kişiyi öldürdü", "en": "Armed attackers kill more than 20 in northwest Nigeria"}, "publishedDate": "2026-07-23"}, {"key": "history-2026-07-22", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-05/2026-07-22/", "title": {"tr": "Faturayı Ödeyen Başkentler", "en": "The Capitals That Foot the Bill"}, "publishedDate": "2026-07-22"}], "sections": [{"h": {"tr": "Listeye Girmek, Yaptırıma Uğramak", "en": "Making the List, Taking the Sanction"}, "ps": [{"refs": ["s1"], "tr": "ABD, Sudan ordusuna 2024'te klor kullandığı belirlemesiyle yaptırım uyguladı: ABD finansmanına ve ihracatına erişim kısıtlanıyor, devlet havayollarına Amerikan hava sahası kapanıyor. Kim ne yaptı, açıkça adlandırmak gerek: Washington saldırıların yerini ve zamanını açıklamadı, Hartum iddiaları 'asılsız' sayıyor, savaşın her iki tarafı da ağır ihlallerle anılıyor. Bağımsız doğrulama yok.", "en": "The US sanctioned Sudan's army over a determination that it used chlorine in 2024: access to US financing and exports is curbed, and American airspace is closed to state airlines. Name plainly who did what: Washington did not disclose the location or timing of the attacks, Khartoum calls the claims 'baseless,' and both sides in the war are cited for grave violations. There is no independent verification."}, {"refs": ["s1"], "tr": "Yerden bakınca yaptırım, savaş ekonomisini yeniden şekillendirir ama El-Faşir'i ya da El-Obeid'i doyurmaz. Güney'in gündeminden okuma şu: hesap sorma seçici ve geç geliyor, listeye girmek bir kartografi meselesi, meydanda ölmekse başka bir kayıt defteri.", "en": "From the ground, sanctions reshape the war economy but do not feed El-Fasher or El-Obeid. The reading from the South's own agenda is this: accountability arrives selectively and late; making the list is a matter of cartography, while dying in the square is another ledger entirely."}]}, {"h": {"tr": "Manşete Çıkmayan Ölüm", "en": "The Death That Doesn't Reach the Front Page"}, "ps": [{"refs": ["s2"], "tr": "Zamfara'da silahlı çeteler yirmiden fazla köylüyü öldürdü; ilçe temsilcisi Lauwali AFP'ye 'karşılaştıkları herkesi hedef aldılar' dedi. Hayvan hırsızlığı ve fidye ekonomisi bir yönetim biçimine dönüşüyor; SBM Intelligence'a göre 2024'te fidyeciler 1,6 milyon doları aştı. Kuzeydoğuda Boko Haram krizi derinleştiriyor. Sayı yerel kaynaklı ve doğrulanamıyor.", "en": "In Zamfara, armed gangs killed more than twenty villagers; district representative Lauwali told AFP 'they targeted everyone they met.' The economy of livestock theft and ransom is hardening into a form of governance; per SBM Intelligence, kidnappers exceeded $1.6 million in 2024. In the northeast, Boko Haram deepens the crisis. The toll is local-sourced and unverified."}, {"refs": ["s2", "history-2026-07-22"], "tr": "Dün 'Faturayı Ödeyen Başkentler' yazımda, büyük güç dikkatinin faturasının çeperdeki başkentlerde ödendiğini yazmıştım; Zamfara tam da o fatura, hiçbir zirvenin fiyatlamadığı bir güvenlik boşluğu. Öngörü: Abuja'nın kuvvetleri gergin kaldıkça fidye ekonomisi paralel bir düzene katılaşır; bir köyü koruyamayan devlet, vergiyi koruyabilene bırakır. Satranç tahtası çerçevesini reddetmeli: bunlar piyon değil, boşluğu dolduran yerel düzenler.", "en": "In yesterday's column, 'The Capitals That Foot the Bill,' I wrote that the invoice for great-power distraction is paid in peripheral capitals; Zamfara is that invoice, a security vacuum no summit prices. The forecast: as Abuja's forces stay stretched, the ransom economy will set into a parallel order; a state that cannot protect a village cedes the tax to whoever can. Refuse the chessboard frame: these are not pawns but local orders filling a vacuum."}]}], "date": "2026-07-23"}, {"writer": "geo-06", "title": {"tr": "Patani'nin Dipnotu, Körfez'in Saati: İki Kapının Uzun Hafızası", "en": "Patani's Footnote, the Gulf's Clock: The Long Memory of Two Gates"}, "excerpt": {"tr": "Narathiwat'taki kontrol noktası, bir asrı aşkın süredir kapanmayan bir yaranın son dipnotu; Riyad'ın santrifüj kapısı ise Körfez'in yarım yüzyıllık nükleer arzusunun. İkisi de 'ilk kez' değil; ikisi de eski bir haritanın yeni sayfası.", "en": "The checkpoint in Narathiwat is the latest footnote to a wound more than a century old; Riyadh's centrifuge gate, to the Gulf's half-century nuclear desire. Neither is a 'first ever'; both are a new page of an old map."}, "sources": [{"key": "s1", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/five-soldiers-killed-in-southern-thailand-checkpoint-attack", "title": {"tr": "Güney Tayland'da kontrol noktasına saldırıda beş asker öldü", "en": "Five soldiers killed in checkpoint attack in southern Thailand"}, "publishedDate": "2026-07-23"}, {"key": "s2", "kind": "news", "name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/ap-report-trump-approves-nuclear-agreement-that-may-allow-saudi-arabia-to-enrich-uranium", "title": {"tr": "Trump, Suudi Arabistan'a uranyum zenginleştirme yolunu açabilecek 30 yıllık nükleer anlaşmayı onayladı", "en": "Trump approves a 30-year nuclear deal that could open a path to Saudi uranium enrichment"}, "publishedDate": "2026-07-22"}, {"key": "history-2026-07-22", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-06/2026-07-22/", "title": {"tr": "Kırk Yıllık Askı, İki Yüz Yıllık Sınır", "en": "A Forty-Year Suspension, a Two-Hundred-Year Border"}, "publishedDate": "2026-07-22"}], "sections": [{"h": {"tr": "Patani'nin Uzun Dipnotu", "en": "Patani's Long Footnote"}, "ps": [{"refs": ["s1"], "tr": "Narathiwat'ta kontrol noktasına yapılan saldırıda beş asker öldü, altı sivil yaralandı; boru bombaları kullanıldı, kimse üstlenmedi. Sınırlar mürekkeple donmuş kavgalardır; Tayland'ın güneyi de öyle. 'Neden şimdi?' sorusunun yanıtı çoğu zaman 'çünkü vakti gelmişti'dir.", "en": "In Narathiwat, an attack on a checkpoint killed five soldiers and wounded six civilians; pipe bombs were used and no one claimed it. Borders are quarrels frozen in ink; the Thai south is one of them. The answer to 'why now?' is usually 'because it was overdue.'"}, {"refs": ["s1"], "tr": "Bu isyanın kökü 1909 Anglo-Siam Antlaşması'na uzanır; Malay-Müslüman Patani sultanlığı o mürekkeple Siam'a katıldı. Bugünkü kontrol noktası, henüz kapanmamış o ilhakın hâlâ süren tartışmasıdır. Merkez her sıkılaştığında örüntü tekrarlanır; bunu daha önce de görmüştük, adı ve tarihi buydu.", "en": "This insurgency's roots run to the 1909 Anglo-Siamese Treaty; the Malay-Muslim Patani sultanate was folded into Siam with that ink. Today's checkpoint is the still-unclosed argument of that annexation. Each time the centre tightens, the pattern returns; we have seen this before, and it had a name and a date."}]}, {"h": {"tr": "Körfez'in Nükleer Saati", "en": "The Gulf's Nuclear Clock"}, "ps": [{"refs": ["s2"], "tr": "Riyad'ın 30 yıllık anlaşması, ortak çalışmanın ardından zenginleştirmeye kapı aralıyor; en sıkı denetim aracı, IAEA Ek Protokolü metnin dışında. Bunu uzun eğriye yerleştirmek gerek: Körfez'in nükleer arzusu 1970'lerden bu yana tıkırdayan bir saat, bin Selman'ın İran'la paritesi ise akrebin son konumu.", "en": "Riyadh's 30-year deal opens a path to enrichment after a joint study; the tightest inspection tool, the IAEA Additional Protocol, sits outside the text. Place it on the long curve: the Gulf's nuclear desire is a clock ticking since the 1970s, and bin Salman's parity with Iran is merely the hand's latest position."}, {"refs": ["s2", "history-2026-07-22"], "tr": "Dün 'Kırk Yıllık Askı, İki Yüz Yıllık Sınır' yazımda donmuş tartışmaların vakti gelince çözüldüğünü savunmuştum; Suudi-İran nükleer rekabeti de böyle bir saat. Öngörü, kehanet değil temkinli bir örüntü: bir zenginleştirme kabiliyeti tohumlandığında nadiren geri sarılır; bölgenin önümüzdeki on yılı, büyük ihtimalle bu sessiz onaya dönülerek okunacak — tıpkı önceki yayılma bölümlerinin kendi başlangıçlarına dönülerek okunması gibi.", "en": "In yesterday's column, 'A Forty-Year Suspension, a Two-Hundred-Year Border,' I argued that frozen arguments thaw when their time comes; the Saudi-Iran nuclear rivalry is such a clock. The forecast is a cautious pattern, not a prophecy: once an enrichment capability is seeded it rarely rewinds; the region's next decade will likely be read back to this quiet approval — as earlier proliferation chapters were read back to their own beginnings."}]}], "date": "2026-07-23"}, {"writer": "geo-01", "title": {"tr": "İki İdari İşlem, Tek Standart", "en": "Two Administrative Acts, One Standard"}, "excerpt": {"tr": "Washington bir kapıya denetçi koydu, başka bir kapıyı kırk yıl sonra araladı. İki idari işlem — bir ithalat yasağı ve bir uçuş izni — ama ikisi de aynı soruyu soruyor: standardı kim yazıyor?", "en": "Washington posted an inspector at one gate and, after forty years, cracked open another. Two administrative acts — an import ban and a flight authorisation — but both ask the same question: who writes the standard?"}, "sources": [{"key": "s1", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/us-targets-china-in-move-to-ban-military-grade-drone-imports", "title": {"tr": "ABD düzenleyicisi FCC, Çin yapımı askeri sınıf İHA ithalatını yasaklamaya yöneldi", "en": "US regulator FCC moves to ban imports of Chinese military-grade drones"}, "publishedDate": "2026-07-22"}, {"key": "s2", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/trump-says-he-ordered-resumption-of-direct-us-lebanon-flights-for-first-time-in-decades/", "title": {"tr": "Trump, ABD-Lübnan doğrudan uçuşlarına yönelik 1985'ten kalma yasağı kaldırdığını açıkladı", "en": "Trump says he has lifted the 1985 ban on direct US-Lebanon flights"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-01/2026-07-21/", "title": {"tr": "Kuralı Kim Elinde Tutuyor?", "en": "Who Holds the Rule?"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "İthalat Kapısındaki Denetçi", "en": "The Inspector at the Import Gate"}, "ps": [{"refs": ["s1"], "tr": "FCC'nin ilke kararı yalnızca bir ürünü engellemiyor; sınırda 'askeri sınıf' olanı tanımlıyor. Sürü kabiliyetli ve kızılötesi termal sensörlü İHA'lar DJI ve Autel üzerinden hedefte; gerekçe 'tedarik zincirini güvenceye almak', Çinli olmayan bileşenlere muafiyet ise Ocak 2028'e uzatıldı. Bir kategori çizmek, tek tek modelleri yasaklamaktan daha kalıcı bir güçtür.", "en": "The FCC's proposal does not merely block a product; it defines what counts as 'military-grade' at the border. Swarming and infrared-sensor drones from DJI and Autel are in the crosshairs, the rationale is to 'secure the supply chain,' and exemptions for non-Chinese components run to January 2028. Drawing a category is a more durable power than banning individual models."}, {"refs": ["s1"], "tr": "Kapıya denetçi koyan, genellikle standardı belirleyendir. Üç başkent, üç ayrı dil konuşuyor: Washington sınırda kabiliyeti düzenliyor, Pekin donanımı satıyor, Brüksel kural kitabını yazıyor. Otuz günlük kamuoyu görüşü bir vitrindir; asıl araç, 'askeri sınıf' tanımının kendisi — ve bu tanım Çin'in seçim müdahalesiyle suçlanmasından günler sonra çiziliyor.", "en": "Whoever puts an inspector at the gate usually sets the standard. Three capitals, three dialects: Washington regulates capability at the border, Beijing sells the hardware, Brussels writes the rulebook. The 30-day comment window is a display case; the real instrument is the definition of 'military-grade' itself — drawn days after China was accused of election interference."}]}, {"h": {"tr": "Kırk Yıl Sonra Aralanan Kapı", "en": "A Gate Reopened After Forty Years"}, "ps": [{"refs": ["s2"], "tr": "Aynı yönetim, Aoun ile görüşmenin ardından Beyrut'a doğrudan uçuşlara yönelik 1985'ten kalma yasağı kaldırdı — ama önce bir güvenlik incelemesi, hâlâ yürürlükte bir 'seyahat etmeyin' uyarısı. Bu, bir lojistik kararı değil, bir protokol jesti: kapı, hiçbir uçak kalkmadan önce kâğıt üzerinde açılıyor. Sembolizmi okumak gerekir; bir devlet başkanının bir kapıyı yeniden açması, o kapıdan geçen trafikten daha çok şey söyler.", "en": "The same administration, after meeting Aoun, lifted the 1985 ban on direct flights to Beirut — but only after a security review, with a 'do not travel' advisory still in force. This is a protocol gesture, not a logistics decision: the gate opens on paper before any plane departs. Read the symbolism; a head of state reopening a gate says more than the traffic that later passes through it."}, {"refs": ["s1", "s2", "history-2026-07-21"], "tr": "Dün, istisnanın standarda dönüştüğünü yazmıştım: ABD, bir kuralın uygulanmasını kapıyı kontrol edene göre esnetiyor. Bugün bunu iki yönden birden doğruluyor — bir kapıyı (İHA) kapatıyor, bir kapıyı (Beyrut) açıyor; aynı idari refleksle. Beklentim: İHA 'kategorisinin' tüketici modellerine doğru genişleyip genişlemeyeceğini ve uçuş izninin güvenlik incelemesini atlatıp atlatamayacağını izleyin. Kalıcı olan ne uçak ne İHA'dır; çizilen standarttır.", "en": "Yesterday I wrote that the exception becomes the standard: the US bends a rule's application to whoever controls the gate. Today it confirms this from both directions — it closes one gate (drones) and opens another (Beirut) by the same administrative reflex. My forecast: watch whether the drone 'category' widens toward consumer models and whether the flight authorisation survives the security review. What lasts is neither the plane nor the drone; it is the standard that was drawn."}]}], "date": "2026-07-22"}, {"writer": "geo-02", "title": {"tr": "Bir Komutan Gitti, Bir Başbakan Geldi: Terazi Yine Avrupa'da", "en": "A Commander Out, a Premier In: The Scales Tip in Europe Again"}, "excerpt": {"tr": "Bir kefede, sokağın baskısıyla başkomutanını değiştiren bir savaş cumhurbaşkanı; öbüründe, Avrupa'ya doğru bir adım daha atmak için yeni bir başbakan seçen bir parlamento. İki karar da içeride alındı; ama tarttıkları denge dışarıda belirleniyor.", "en": "On one pan, a wartime president who changed his top commander under street pressure; on the other, a parliament electing a new premier to take one more step toward Europe. Both decisions were taken at home; the balance they weigh is decided abroad."}, "sources": [{"key": "s1", "kind": "news", "name": "NPR", "url": "https://www.npr.org/2026/07/21/g-s1-134849/ukraine-military-chief-fired-protests", "title": {"tr": "Zelenski, protestoların ardından Başkomutan Sirski'yi görevden aldı; yerine Drapatiy'i atadı", "en": "After protests, Zelenskyy dismisses commander-in-chief Syrskyi and names Drapatyi"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/21/moldova-chooses-new-prime-minister-as-it-pushes-for-eu-membership", "title": {"tr": "Moldova parlamentosu, AB üyeliği hedefiyle Vasile Tofan'ı başbakan seçti", "en": "Moldova's parliament elects Vasile Tofan as PM to drive EU membership bid"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-21/", "title": {"tr": "Sandalyeler mi Değişti, Masa mı?", "en": "Did the Chairs Change, or the Table?"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Sokak, Komuta Zincirini Yeniden Dizdi", "en": "The Street Redrew the Chain of Command"}, "ps": [{"refs": ["s1"], "tr": "Sirski görevden alındı, yerine Drapatiy geldi — Kiev ve diğer kentlerdeki, Fedorov'un dönüşünü isteyen protestoların ardından. Zelenski, Sirski'ye Kiev savunması ile Harkiv ve Kursk harekâtları için teşekkür etti ve 'ortak dileğimiz tek: düşmana karşı zafer' dedi. Bir görevden almayı, savaşın yönetimine ne yaptığıyla okumak gerekir: meşruiyet yeni bir komutanda toplanırken, sokak artık modernleşme bekliyor.", "en": "Syrskyi was dismissed and Drapatyi installed — after protests in Kyiv and other cities demanding Fedorov's return. Zelenskyy thanked Syrskyi for the defence of Kyiv and the Kharkiv and Kursk operations, saying 'our shared wish is one — victory over the enemy.' Read a dismissal for what it does to the management of the war: legitimacy concentrates in a new commander while the street now expects modernisation."}, {"refs": ["s1", "history-2026-07-21"], "tr": "Dün sormuştum: bir savaş başkenti generallerini görevden alabilir mi, alırsa denge de onlarla kayar mı? Alabildi, aldı da. Ama bildirinin sessizliği önemli: Zelenski, Fedorov'a adını koymadığı 'saygın bir görev' önerdi. Denge, görevden alma değildir; yeni komutanın cepheyi ve sokağı aynı anda tutup tutamamasıdır.", "en": "Yesterday I asked whether a war capital could dismiss its generals, and whether the balance shifts with them. It could, and it did. But the communiqué's silence matters: Zelenskyy offered Fedorov 'a respected position' he did not name. Balance is not the firing; it is whether the new command can hold the front and the street at once."}]}, {"h": {"tr": "Kişinev, Masaya Bir Sandalye Daha Çekiyor", "en": "Chișinău Pulls Up One More Chair"}, "ps": [{"refs": ["s2"], "tr": "Öbür kefede Moldova, Sandu'nun desteklediği Tofan'ı 53'e karşı 21 oyla, 21 çekimserle başbakan seçti; yol haritası bu yıl müzakere, 2028 sonunda katılım anlaşması, 2030'da üyeliğe hazırlık. Sekiz ayda istifa eden Munteanu'nun yerine bir siyaset yeni-gelenini oturtmak, bir kurumun — parlamentonun — bir bloka doğru yeniden dengelenmesidir: genişleme masası bir koltuk daha kazanıyor.", "en": "On the other pan, Moldova elected Sandu-backed Tofan by 53 to 21 with 21 abstentions; the roadmap is talks this year, an accession deal by end-2028, readiness to join by 2030. Seating a political newcomer in place of Munteanu, who quit in eight months, is an institution — the parliament — rebalancing toward a bloc: the enlargement table gains a seat."}, {"refs": ["s1", "s2"], "tr": "Kusurlu bir masa yine de masasızlıktan iyidir. Beklentim: asıl sınav oylama değil, bir siyaset yeni-geleninin 53 oyluk koalisyonu katılım sürecinin yıpratıcılığında tutup tutamayacağı — üstelik Moskova kanadı zorlarken. Aynı gün iki Avrupa terazisi kaydı; biri askeri, biri kurumsal. Herhangi birinin dengeye oturup oturmadığı, gelecek çeyreğin sorusu.", "en": "A flawed table still beats no table. My forecast: the real test is not the vote but whether a newcomer can hold a 53-vote coalition through the grind of accession — while Moscow presses the flank. Two European scales tipped the same day, one military, one institutional; whether either settles into balance is next quarter's question."}]}], "date": "2026-07-22"}, {"writer": "geo-03", "title": {"tr": "Boğazdaki Kırmızı Çizgi", "en": "The Red Line in the Strait"}, "excerpt": {"tr": "On birinci gece bombardıman; Hürmüz'de yanan iki tanker. İki suda da konuşan niyet değil, kabiliyet: kim neyi vurabiliyor ve karşı taraf bunun bedelini ödemeye razı mı?", "en": "An eleventh night of bombing; two tankers burning in Hormuz. In both waters it is capability that speaks, not intent: who can hit what, and who is willing to pay the cost?"}, "sources": [{"key": "s1", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/21/explosions-in-iran-as-us-launches-new-strikes", "title": {"tr": "ABD, İran'a üst üste 11. gece hava saldırısı düzenledi; Tahran misilleme uyarısı yaptı", "en": "US launches 11th consecutive night of strikes on Iran; Tehran warns of retaliation"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/21/hormuz-tankers-on-fire-as-us-iran-continue-attacks-whats-the-latest", "title": {"tr": "İran Devrim Muhafızları, Hürmüz Boğazı'nda iki tankerin yandığını öne sürdü", "en": "Iran's Revolutionary Guard says two tankers set ablaze in the Strait of Hormuz"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-03/2026-07-21/", "title": {"tr": "İki Cephe, Tek Envanter Sorusu", "en": "Two Fronts, One Inventory Question"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Gece Sayısı Bir Mesajdır", "en": "The Night-Count Is a Message"}, "ps": [{"refs": ["s1"], "tr": "CENTCOM, üst üste 11. gece; hedefler Tebriz, Tahran, Buşehr, komuta merkezleri, İHA depoları. İran'ın Hatemülenbiya Karargâhı, nükleer tesisler vurulursa saldırıları yayma uyarısı yaptı; IRGC ise Bahreyn ve Kuveyt'i hedef aldığını öne sürüyor. Tempo başlı başına bir sinyaldir: her gece tekrarlanan bir ritim, dayanıklılık üzerine bir iddiadır.", "en": "CENTCOM, an 11th consecutive night; the targets Tabriz, Tehran, Bushehr, command centres, drone depots. Iran's Khatam al-Anbiya headquarters warned it would widen attacks if nuclear sites were hit; the IRGC claims strikes on Bahrain and Kuwait. The tempo itself is a signal: a nightly cadence is an argument about endurance."}, {"refs": ["s1"], "tr": "Kabiliyet, niyetten daha dürüsttür. Beyaz Saray, saldırıların 'başkan aksini kararlaştırana dek' süreceğini, aynı anda görüşmelerin de sürdüğünü söylüyor. İki cümle, tek inandırıcı olan: arkasında sortiler duran. İran'ın uyarısını fiyatlanmış bir kırmızı çizgi olarak okuyun: nükleer tesisler, Tahran'ın bir bedel beklettiğini iddia ettiği eşiktir.", "en": "Capability is more honest than intent. The White House says strikes continue 'until the president decides otherwise,' while talks are simultaneously 'ongoing.' Two sentences, one credible — the one with sorties behind it. Read Iran's warning as a priced red line: nuclear sites are the threshold where Tehran claims a cost is waiting."}]}, {"h": {"tr": "Güvensiz Güney Rotası", "en": "The Unsafe Southern Route"}, "ps": [{"refs": ["s2"], "tr": "IRGC, IRIB üzerinden, Hürmüz'ün 'güvensiz güney rotasından' geçmeye çalışan iki tankerde 'büyük yangınlar' çıktığını, mürettebatın tahliye edildiğini duyurdu. Bu bir boğaz silahıdır: İran, ABD hava gücüyle boy ölçüşemediği için bunun yerine boğazı fiyatlandırıyor. Kabiliyet asimetrisi savaşı suya taşıyor.", "en": "The IRGC, via IRIB, announced 'massive fires' on two tankers attempting the 'unsafe southern route' of Hormuz, with crews evacuated. This is a chokepoint weapon: unable to match US airpower, Iran prices the strait instead. The asymmetry of capability pushes the war onto the water."}, {"refs": ["s1", "s2", "history-2026-07-21"], "tr": "Dün, antlaşmanın ardında bir sayı olup olmadığını — kırmızı çizginin arkasında bir maliyet bulunup bulunmadığını — sormuştum. Hürmüz bunun tersten yanıtı: maliyeti dayatan ABD değil, İran. Beklentim: tanker saldırıları, Tahran'ın en ucuz caydırıcısı olarak sürecek; ta ki konvoy koruması ya da bir ateşkes, boğazı kapatmanın bedelini yükseltene dek. Bir kırmızı çizgi ancak ardındaki maliyet kadar gerçektir — ve bu hafta o maliyet sigorta primleriyle ölçülüyor.", "en": "Yesterday I asked whether there was a number behind the treaty — a cost behind the red line. Hormuz is the answer in reverse: it is Iran, not the US, imposing the cost. My forecast: the tanker attacks will continue as Tehran's cheapest deterrent, until convoy escorts or a ceasefire raise the price of closing the strait. A red line is only as real as the cost waiting behind it — and this week that cost is measured in insurance premiums."}]}], "date": "2026-07-22"}, {"writer": "geo-04", "title": {"tr": "Süveyş'e Dönen Yük, Senato'daki Fatura", "en": "The Cargo That Turns to Suez, the Bill in the Senate"}, "excerpt": {"tr": "İki tanker Kızıldeniz'de U dönüşü yaptı; bir savunma bakanı Senato'da 37,5 milyar dolarlık bir rakam okudu. İki haber de aynı şeyi söylüyor: ambargo bir duvar değil, bir sapaktır — ve her sapağın bir faturası vardır.", "en": "Two tankers made a U-turn in the Red Sea; a defense secretary read out a $37.5bn figure in the Senate. Both stories say the same thing: an embargo is not a wall but a detour — and every detour has an invoice."}, "sources": [{"key": "s1", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/world-news/houthi-threats-force-saudi-crude-tankers-to-reverse-course-in-red-sea-126072101650_1.html", "title": {"tr": "Husiler Suudi Arabistan'a deniz ablukası ilan etti; Kızıldeniz'de tankerler rota değiştirdi", "en": "Houthis declare naval blockade on Saudi Arabia; tankers reverse course in the Red Sea"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/21/hegseth-says-iran-war-has-cost-37-5bn-in-latest-official-us-account", "title": {"tr": "Hegseth: İran savaşının maliyeti 37,5 milyar dolara ulaştı; ek finansman istendi", "en": "Hegseth: Iran war has cost $37.5bn as the Pentagon seeks more funding"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-19", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-04/2026-07-19/", "title": {"tr": "Köprü Çökerse Yük Başka Yoldan Gider", "en": "When the Bridge Falls, the Cargo Finds Another Road"}, "publishedDate": "2026-07-19"}], "sections": [{"h": {"tr": "Yük Yön Değiştirir", "en": "Cargo Changes Direction"}, "ps": [{"refs": ["s1"], "tr": "Husi ablukası; Xin Long Yang ile ikinci bir tanker, Çin ve Hindistan'a giden Suudi ham petrolüyle Süveyş'e doğru geri döndü. Saba altı geminin döndüğünü öne sürüyor, petrol yaklaşık yüzde 2 arttı (Business Standard, LSEG verileri). Abluka petrolü durdurmadı; onu başka yola soktu — daha uzun sefer, daha yüksek navlun, ve Asyalı alıcıya inen bir gider.", "en": "The Houthi blockade; the Xin Long Yang and a second tanker, carrying Saudi crude bound for China and India, turned back toward Suez. Saba claims six vessels reversed, oil rose about 2 percent (Business Standard, LSEG data). The blockade did not stop the oil; it re-routed it — a longer voyage, higher freight, and a cost landing on the Asian buyer."}, {"refs": ["s1"], "tr": "Ambargo bir duvar değil, bir sapaktır. Bayraklar dalgalanır, yükler yön değiştirir. Husiler bu iki gövdeye tek el ateş etmedi; tehdidin kendisi manifestoyu büktü. Sapağı takip edip kimin ödediğini bulun: doğrudan Riyad'ın bilançosu değil, navlun ve sigorta üzerinden Çin ve Hindistan'daki rafineriler.", "en": "An embargo is not a wall; it is a detour. Flags wave, cargo changes direction. The Houthis fired not a single shot at these two hulls; the threat alone bent the manifest. Follow the detour to find who pays: not Riyadh's balance sheet directly, but refiners in China and India, through freight and insurance."}]}, {"h": {"tr": "Savaşın Kalem Kalem Faturası", "en": "The War's Itemised Bill"}, "ps": [{"refs": ["s2"], "tr": "Hegseth'in rakamı: 37,5 milyar dolar, Mayıs'taki 29 milyardan 8 milyar yukarıda; 1,5 trilyon dolarlık bütçe talebi, İran savaşına ayrılan yaklaşık 70 milyar. Durbin'in sorusu, Murray'nin 'pek mantıklı değil' itirazı. Saldırıların ve diplomasinin ardında bir fatura duruyor — ve Kongre'den bu faturaya ortak imza atması isteniyor.", "en": "Hegseth's figure: $37.5bn, up $8bn from May's $29bn; a $1.5tn budget request, about $70bn earmarked for the Iran war. Durbin's question, Murray's objection that it 'does not make a lot of sense.' Behind the strikes and the diplomacy sits an invoice — and Congress is being asked to co-sign it."}, {"refs": ["s1", "s2", "history-2026-07-19"], "tr": "Geçen hafta, bir yaptırımın asıl hikâyesinin yükün nereye yön değiştirdiği olduğunu yazmıştım; bugün tanker bunu kanıtlamak için gerçekten Süveyş'e döndü. Beklentim: savaşın gider eğrisi ile navlun sapağı aynı grafiktir — her ek bombardıman gecesi hem kayıp listesini hem navlun faturasını uzatıyor; yeniden yönlendirilmiş enerji ve sigorta fiyatlandığında 37,5 milyar bir eksik tahmin olarak okunacak. Bayraklar kürsüde; kaldıraç faturada.", "en": "Last week I wrote that a sanction's real story is where the cargo re-routes; today the tanker literally turned to Suez to prove it. My forecast: the war's cost curve and the freight detour are the same graph — every extra night of strikes lengthens both the casualty list and the freight bill, and $37.5bn will read as an underestimate once re-routed energy and insurance are priced in. The flags are on the podium; the leverage is on the invoice."}]}], "date": "2026-07-22"}, {"writer": "geo-05", "title": {"tr": "Faturayı Ödeyen Başkentler", "en": "The Capitals That Foot the Bill"}, "excerpt": {"tr": "Abuja kendi yollarında kaçırılanları kurtarıyor; Çin ve Hindistan'a giden tankerler bir başkasının savaşı yüzünden rota değiştiriyor. İki başkentin kavgası, çoğunluk dünyasının bütçesinde toplanıyor.", "en": "Abuja is rescuing the kidnapped on its own roads; tankers bound for China and India are re-routing because of someone else's war. The quarrel of two capitals lands on the majority world's budget."}, "sources": [{"key": "s1", "kind": "news", "name": "Premium Times", "url": "https://www.premiumtimesng.com/news/more-news/897168-troops-rescue-27-kidnap-victims-foil-abductions-in-sokoto-zamfara.html", "title": {"tr": "Nijerya ordusu, Sokoto ve Zamfara'da 27 kaçırılan kişiyi kurtardı", "en": "Nigerian troops rescue 27 kidnap victims in Sokoto and Zamfara"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Business Standard", "url": "https://www.business-standard.com/world-news/houthi-threats-force-saudi-crude-tankers-to-reverse-course-in-red-sea-126072101650_1.html", "title": {"tr": "Husiler Suudi Arabistan'a deniz ablukası ilan etti; Kızıldeniz'de tankerler rota değiştirdi", "en": "Houthis declare naval blockade on Saudi Arabia; tankers reverse course in the Red Sea"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-05/2026-07-21/", "title": {"tr": "İki Başkentin Dışındaki Hafta", "en": "The Week Outside the Two Capitals"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Abuja Kendi Güvenliğini Kendi Kuruyor", "en": "Abuja Provides Its Own Security"}, "ps": [{"refs": ["s1"], "tr": "Fansan Yamma Harekâtı, Sokoto ve Zamfara'da 27 kişiyi kurtardı; Yarbay Danja, Gummi-Sokoto yolunu kesen saldırganların püskürtüldüğünü, Kaura ve Badanma çevresinde 16 kişinin daha kurtarıldığını anlatıyor. Bunu yerden okuyun: bir büyük güç vekâlet hikâyesi değil, hiçbir zirveden uzakta kendi güvenlik işini yapan bir devlet.", "en": "Operation Fansan Yamma rescued 27 people in Sokoto and Zamfara; Lt Col Danja describes attackers who blocked the Gummi-Sokoto road being repelled, with 16 more freed around Kaura and Badanma. Read it from the ground: not a great-power proxy tale, but a state doing its own security work, far from any summit."}, {"refs": ["s1"], "tr": "Dünya sadece iki başkentten yönetilmiyor. Nijerya'nın çete şiddeti Washington-Pekin çerçevesine sığmaz — mesele de tam budur: çoğunluk dünyasının güvenlik gündemi kendisine aittir, kutuplar izlese de izlemese de kendi kuvvetlerince finanse edilir ve savaşılır.", "en": "The world is not run from two capitals only. Nigeria's gang violence does not fit the Washington-Beijing frame — and that is precisely the point: the majority world's security agenda is its own, financed and fought by its own forces, whether or not the poles are watching."}]}, {"h": {"tr": "Başkasının Savaşı, Bizim Navlunumuz", "en": "Someone Else's War, Our Freight"}, "ps": [{"refs": ["s2"], "tr": "Husi ablukası, Çin ve Hindistan'a giden Suudi ham petrolünü Süveyş'e yönlendiriyor; petrol yüzde 2 arttı. İran savaşının deniz cephesi Asyalı ithalatçılara fatura ediliyor: Delhi ve Pekin, başlatmadıkları ve katılmayacakları bir savaş için navlun ve yakıtla ödüyor.", "en": "The Houthi blockade re-routes Saudi crude bound for China and India to Suez; oil rose 2 percent. The maritime front of the Iran war is billed to Asian importers: Delhi and Beijing pay in freight and fuel for a war they did not start and will not join."}, {"refs": ["s1", "s2", "history-2026-07-21"], "tr": "Dün, orta başkentlerin kendilerine metin yazılmasını beklemek yerine kendi metinlerini yazdığını söylemiştim. Bugünkü kanıt: Abuja kendi yollarını güvene alıyor, Asya'nın ithalatçıları Körfez yanarken kendi arz riskini dengeliyor. Beklentim: Küresel Güney'in yanıtı ne hizalanma ne protesto olacak; uyarlama olacak — yeni rotalar, yeni tedarikçiler, sessiz stoklama. Taraf tutmamak da bir stratejidir; kavgayı seçmeden faturayı ödemek, çoğunluk dünyasının varsayılan duruşu.", "en": "Yesterday I wrote that the middle capitals write their own text rather than wait to be written for. Today's proof: Abuja secures its own roads, and Asia's importers hedge their own supply as the Gulf burns. My forecast: the Global South's response will be neither alignment nor protest but adjustment — new routes, new suppliers, quiet stockpiling. Refusing to take a side is itself a strategy; paying the bill without picking the fight is the majority world's default posture."}]}], "date": "2026-07-22"}, {"writer": "geo-06", "title": {"tr": "Kırk Yıllık Askı, İki Yüz Yıllık Sınır", "en": "A Forty-Year Suspension, a Two-Hundred-Year Border"}, "excerpt": {"tr": "Beyrut'a uçuşlar kırk yıl sonra yeniden açılıyor; Kişinev bir kez daha Avrupa'ya dönüyor. İkisi de yeni değil — her biri eski bir haritanın, bu haftanın mürekkebiyle yeniden okunan bir dipnotu.", "en": "Flights to Beirut reopen after forty years; Chișinău turns once more toward Europe. Neither is new — each is a footnote to an older map, reread in this week's ink."}, "sources": [{"key": "s1", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/trump-says-he-ordered-resumption-of-direct-us-lebanon-flights-for-first-time-in-decades/", "title": {"tr": "Trump, ABD-Lübnan doğrudan uçuşlarına yönelik 1985'ten kalma yasağı kaldırdığını açıkladı", "en": "Trump says he has lifted the 1985 ban on direct US-Lebanon flights"}, "publishedDate": "2026-07-21"}, {"key": "s2", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/21/moldova-chooses-new-prime-minister-as-it-pushes-for-eu-membership", "title": {"tr": "Moldova parlamentosu, AB üyeliği hedefiyle Vasile Tofan'ı başbakan seçti", "en": "Moldova's parliament elects Vasile Tofan as PM to drive EU membership bid"}, "publishedDate": "2026-07-21"}, {"key": "history-2026-07-21", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-06/2026-07-21/", "title": {"tr": "Bir Kabine, Bir Sınır: İkisi de Eski Bir Tartışmanın Dipnotu", "en": "A Cabinet and a Border: Both Footnotes to an Older Argument"}, "publishedDate": "2026-07-21"}], "sections": [{"h": {"tr": "Askıya Alınmış Bir Kapının Hafızası", "en": "The Memory of a Suspended Gate"}, "ps": [{"refs": ["s1"], "tr": "Trump'ın 1985 yasağını kaldırması, TWA 847'nin kaçırılışına ve Reagan'a uzanır. Kırk yıllık bir askı, başlı başına tarihsel bir kalıntıdır: donma, onu doğuran krizden daha uzun yaşadı. Güvenlik incelemesi ve süren 'seyahat etmeyin' uyarısı, eski tehlikenin çözülmediğini, yalnızca yeniden tarihlendiğini gösteriyor.", "en": "Trump's lifting of the 1985 ban reaches back to the hijacking of TWA 847 and to Reagan. A forty-year suspension is itself a historical relic: the freeze outlived the crisis that produced it. The security review and the standing 'do not travel' advisory show the old danger was not resolved, only re-dated."}, {"refs": ["s1", "history-2026-07-21"], "tr": "Bugünün krizi, dünün haritasının dipnotudur. Yeniden açılış tarihle bir kopuş değil; tarihin yavaş saatinin bir sonraki dakikaya geçmesidir — bir savaşın ardından ilan edilen askı, bir başkasının gölgesinde kaldırılıyor. Kapı kâğıt üzerinde açılıyor; bir uçağın inip inmeyeceği, mürekkebin yanıtlayamadığı sorudur.", "en": "Today's crisis is a footnote to yesterday's map. The reopening is not a break with history but its slow clock ticking over — a suspension announced in one war's aftermath, lifted in another's shadow. The gate opens on paper; whether a plane lands is the question the ink cannot answer."}]}, {"h": {"tr": "Bir Sınır Ülkesinin Tekrarlayan Tercihi", "en": "A Borderland's Recurring Choice"}, "ps": [{"refs": ["s2"], "tr": "Moldova, 2030 hedefiyle Tofan'ı seçiyor. Besarabya iki yüzyıldır imparatorluklar arasında çekiştirilen bir sınır ülkesidir; 'Avrupa'ya dönüş' eski bir çarkın son dönüşü, bir ilk değil. Adaylık statüsü 2022'de Ukrayna ile birlikte geldi; tercih tekrarlıyor, çünkü coğrafya tekrarlıyor.", "en": "Moldova elects Tofan with a 2030 target. Bessarabia has for two centuries been a borderland pulled between empires; the 'turn to Europe' is the latest turn of an old wheel, not a first. Candidate status came in 2022 alongside Ukraine; the choice recurs because the geography does."}, {"refs": ["s2", "history-2026-07-21"], "tr": "Dün, Lübnan'ın pilot bölgeleri üzerine kalıcılık konusunda temkin öğütlemiştim: ihtilaflı bir zeminde pilot bölge bir çözüm değil, bir dipnottur. Aynı temkin burada da geçerli: bir sınırın yönünü tek bir oy değil, komşuların yavaş baskısı belirler. Beklentim: Moldova'nın 2030 yolu bu haftaki sandıkla değil, sınır ülkesinin her zaman hissettiği karşı çekişe karşı tercihini koruyup koruyamadığıyla ölçülecek. Sınırlar mürekkeple donmuş kavgalardır; bu kavga şimdilik batıya doğru çözülüyor.", "en": "Yesterday, on Lebanon's pilot zones, I counselled caution about permanence: a pilot zone on contested ground is a footnote, not a solution. The same caution applies here: a border's direction is set less by a single vote than by the slow pressure of neighbours. My forecast: Moldova's road to 2030 will be measured not by this week's ballot but by whether the frontier can hold its choice against the counter-pull borderlands always feel. Borders are quarrels frozen in ink; this one is thawing westward — for now."}]}], "date": "2026-07-22"}], "dates": ["2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24", "2026-07-23", "2026-07-22"], "dateLabels": {"2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}, "2026-07-26": {"tr": "26 Temmuz 2026", "en": "July 26, 2026"}, "2026-07-25": {"tr": "25 Temmuz 2026", "en": "July 25, 2026"}, "2026-07-24": {"tr": "24 Temmuz 2026", "en": "July 24, 2026"}, "2026-07-23": {"tr": "23 Temmuz 2026", "en": "July 23, 2026"}, "2026-07-22": {"tr": "22 Temmuz 2026", "en": "July 22, 2026"}}, "newsDates": {"geopolitics": "2026-07-28"}, "podcasts": {"geopolitics": {"2026-07-25": {"files": {"tr": {"url": "/episodes/2026-07-25-geopolitics-tr.8eb6f415316f.mp3", "bytes": 1127697}}}, "2 /* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}

/* One audio brief per desk, edition and language. An unapproved/unsynthesized script

    delete bar.dataset.src; return;
  }
  const u = UI[LANG];
  bar.setAttribute('aria-label',u.podcastTitle);
  if (bar.dataset.src !== src){  // same episode → keep the element, don't cut playback
    if (previousAudio) savePodcastProgress(previousAudio,bar.dataset.src);

function pageItems(items, requestedPage, pageSize){

  const page = Math.max(0, Math.min(requestedPage, pages - 1));
  const start = page * pageSize;
  return {items:items.slice(start, start + pageSize), page, pages};
}
