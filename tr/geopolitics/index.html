nts reading the two texts as one continuous tendency: the first serves to keep hold of the office, the second to tie the other side's candidacy to a legal category. A weaker reading is also available: if an exclusion already applied in practice through the stripping of citizenship is being put in writing, the clause may register existing practice.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Zamanlamayı açıklayan şey, cumhurbaşkanının muhalefetin hükümeti ele geçirmesini önlemek için ülkede seçim yapılmayacağı yönündeki sözleridir. Bir yönetim seçimin gereksiz olduğunu söyledikten sonra seçimi tümüyle kaldırmak yerine kimin aday olabileceğini yazıyorsa, seçimin biçimini korumayı sürdürmeyi tercih etmiş demektir. Nikaragua'da bir sonraki genel seçim 2027'nin sonunda yapılacak; kural bu tarihten önce onaylanacak biçimde takvime yerleştirilmiş.", "en": "What explains the timing is the president's statements that there would be no elections in the country, in order to stop the opposition from seizing the government. If a government, having said elections are dispensable, then writes down who may stand rather than abolishing the vote outright, it has chosen to keep the form of the election. Nicaragua's next general election is due in late 2027, and the rule has been placed on the calendar to be approved before that date.", "refs": ["nicaragua-reform"]}, {"tr": "Buradaki benzemezlik önemli. 2024 değişikliği yürütmenin içindeki yetkiyi tek bir hanede topluyordu; bu taslak ise yarışmanın giriş koşulunu yazıyor. Aynı yönde ilerleyen iki adım gibi görünseler de birincisi iktidarın kullanımını, ikincisi iktidara aday olma hakkını düzenliyor. Aralarındaki devamlılığı kuran şey, ikisini de geçiren aynı çoğunluk; metinlerin içeriği bu devamlılığı kurmuyor.", "en": "The disanalogy here matters. The 2024 amendment gathered authority inside the executive into a single household; this draft writes the entry condition for the contest. They may look like two steps in one direction, yet the first regulates the exercise of power and the second the right to stand for it. Continuity between them is established by the same majority that passes both; the content of the texts does not establish it.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Onaylanan metnin kendisi", "en": "The approved text itself"}, "ps": [{"tr": "Bu hükmün ne kadar geniş çalışacağı, eylülde onaylanan metnin dilinden okunacak. Kabul edilen madde belirli bir suçu ve yargısal bir tespiti değil bir kişi kategorisini adlandırıyorsa, uygunluk kararı mahkemeden idareye geçmiş olur. Tanımlanmış bir suç ve yargısal tespit şartı korunursa, dışlama hiç değilse bir usule bağlı kalır. İzlenecek yer, resmî gazetede yayımlanan nihai metnin bu iki seçenekten hangisini yazdığıdır.", "en": "How widely this clause will work is to be read from the language of the text approved in September. If the adopted article names a category of persons instead of a defined offence and a judicial finding, the eligibility decision will have moved from the courts to the administration. If a defined offence and a judicial finding are kept as requirements, the exclusion at least remains tied to a procedure. The place to watch is which of the two the final text published in the official gazette writes.", "refs": ["nicaragua-reform"]}]}], "sources": [{"key": "nicaragua-reform", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/nicaraguas-daniel-ortega-aims-to-bar-traitors-from-future-elections", "title": {"tr": "Ortega'nın anayasa taslağı \"hainleri\" seçimlerden çıkarıp görev süresini yediye taşıyor", "en": "Ortega's draft constitutional reform would bar \"traitors\" and lengthen the presidential term"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-01", "title": {"tr": "Malezya'da mülteci kartını hangi imza veriyor?", "en": "Who signs the refugee card in Malaysia?"}, "excerpt": {"tr": "Dışişleri Bakanı'nın talebi bir kurumu ülkeden çıkarmayı hedeflemiyor. Hedefi daha dar ve daha keskin: belge verme yetkisini tek imzadan çift imzaya taşımak.", "en": "The foreign minister's demand does not aim to expel an agency. Its aim is narrower and sharper: to move the power to issue a document from one signature to two."}, "sections": [{"h": {"tr": "Ortada imzalanmış bir metin yok", "en": "There is no signed text in the middle of this"}, "ps": [{"tr": "Malezya BM mülteci sözleşmesine taraf değil. Buna karşın Şubat 2026 sonu itibarıyla ülkede BM Mülteciler Yüksek Komiserliği'ne kayıtlı yaklaşık 126.000 Arakanlı bulunuyor. Yani kurumu ülkede tutan şey bir antlaşma yükümlülüğü değil, sürdürülen bir hoşgörü; Dışişleri Bakanı Mohamad Hasan bu haftaki açıklamasıyla o hoşgörünün koşullarını yüksek sesle telaffuz etti: \"İş birliği yapmak istemiyorlarsa, bence BMMYK'nın varlığını yeniden değerlendirmemizin zamanı geldi\".", "en": "Malaysia is not a party to the UN refugee convention. Even so, about 126,000 Rohingya were registered with the UN refugee agency in the country as of late February 2026. What keeps the agency in place, then, is a tolerance extended year after year rather than any treaty obligation — and this week the foreign minister, Mohamad Hasan, said out loud what that tolerance is conditional on: \"If they do not want to cooperate, in my opinion, it is time for us to reconsider the presence of UNHCR\".", "refs": ["malaysia-unhcr"]}, {"tr": "Açıklamanın zamanlaması bir olaya bağlı. Penang eyaletindeki evlerinden tahliye edilen 100'den fazla Arakanlı sığınmacı, Kuala Lumpur'daki BMMYK ofisinin önünde toplandıktan sonra yetkililerce gözaltına alındı. Kurum, gözaltındakileri korumak ve belgelerini doğrulamak için yetkililerle çalıştığını, bu çabaların onların başka bir barınma yerine nakledilmesine katkıda bulunduğunu bildirdi. Kurumun elindeki araç burada görünür hale geliyor: doğrulama ve ikna, tahliyeyi durdurma yetkisi değil.", "en": "The timing is tied to a specific episode. More than 100 Rohingya asylum seekers, evicted from their homes in Penang state, were detained by the authorities after gathering outside the UNHCR office in Kuala Lumpur. The agency said it was working with officials to protect those held and to verify their documentation, and that this had helped move them to alternative accommodation. What the agency actually holds becomes visible there: verification and persuasion, not the power to stop a detention.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Talep, belgeyi çift imzaya bağlamak", "en": "The demand is to put a second signature on the document"}, "ps": [{"tr": "Hasan'ın somut önerisi şu: belge verilmeden önce BMMYK ile yerel makamlar ortak tarama yapsın. Bakan ayrıca kurumun kişilerin kendi ülkelerinden çevrim içi başvuru yapmasına izin vermesini eleştirdi ve bunun daha fazla mülteciyi ülkeye çektiğini savundu. Bu iki cümle birlikte okunduğunda talebin konusu belli oluyor: statü belirleme kararının kimde kalacağı. Bugün karar tek bir kurumun; önerilen düzenlemede karar, ikinci bir makamın onayı olmadan sonuç doğurmuyor.", "en": "Hasan's concrete proposal is this: UNHCR and local authorities should screen jointly before any document is issued. He also criticised the agency for letting people apply online from their home countries, arguing that this draws more refugees in. Read together, the two statements make the subject of the demand clear — it is about where the status determination sits. Today that decision belongs to a single agency; under the proposed arrangement it would produce no effect without a second authority's approval.", "refs": ["malaysia-unhcr"]}, {"tr": "Bir hoşgörünün koşullu izne dönüşmesi, kâğıt üzerinde küçük bir değişiklik gibi görünür; pratikte belirleyicidir, çünkü koşulu yazan taraf o koşulu ne zaman sıkacağına da karar verir. Yine de daha sade bir okuma mümkün: görünür bir gözaltı olayının ardından iç kamuoyuna verilmiş bir yanıt, kalıcı bir yetki değişikliğinden çok. İki okuma arasındaki farkı bakanın cümleleri değil, ortaya çıkacak prosedür metni belirleyecek.", "en": "Turning a tolerance into a conditional permission looks like a small change on paper; in practice it is decisive, because whoever writes the condition also decides when to tighten it. A plainer reading is available, though: this may be an answer to a domestic audience after a visible detention episode rather than a durable shift in authority. What separates the two readings is the procedural text that does or does not appear, not the minister's sentences.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Ölçülebilir olan ne", "en": "What can actually be measured"}, "ps": [{"tr": "Bakılacak tek şey var: ortak taramanın belge verme aşamasında gerçekten bir kapı olup olmadığı. Ekim sonuna kadar iç işleri bakanlığı ortak tarama usulünü kamuya açık biçimde tanımlar ve bundan sonra verilen belgeler yerel makamın onayını taşırsa, yetki fiilen el değiştirmiş olur. Böyle bir usul tanımlanmazsa, bu çağrı bir pozisyonu ucuza kaydetmiş ama statüyü kimin belirlediğini değiştirmemiş olacak.", "en": "There is one thing to watch: whether joint screening becomes an actual gate at the point of issuance. If the home ministry publicly describes a joint screening procedure before the end of October and documents issued afterwards carry a local authority's approval, then the power will have changed hands in practice. If no such procedure is described, the call will have registered a position cheaply without altering who determines status.", "refs": ["malaysia-unhcr"]}]}], "sources": [{"key": "malaysia-unhcr", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/malaysian-foreign-minister-calls-for-review-of-unhcrs-presence", "title": {"tr": "Malezya Dışişleri Bakanı, BMMYK'nın ülkedeki varlığının gözden geçirilmesini istedi", "en": "Malaysia's foreign minister calls for a review of UNHCR's presence"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-02", "title": {"tr": "İki metin, tek boğaz", "en": "Two texts, one strait"}, "excerpt": {"tr": "Maskat ortak bir mekanizma önerdi, Tahran kendi şeridini istedi. Masada bugüne kadar üzerinde anlaşılan tek şey, teklif alışverişinin sürdüğü.", "en": "Muscat proposed a joint mechanism; Tehran asked for its own lane. So far the only thing agreed at the table is that proposals are still being exchanged."}, "sections": [{"h": {"tr": "Kefelerde iki farklı mekanizma", "en": "Two different mechanisms in the pans"}, "ps": [{"tr": "Umman'ın önerisi Malakka Boğazı düzenlemesini örnek alıyor: boğazı kullanan gemiler seyir güvenliği, çevre koruma ile arama ve kurtarma harcamalarını finanse eden bir \"gönüllü ücret\" ödüyor. Önerinin taşıdığı asıl hüküm ücret değil, ücretin gerektirdiği ortaklık; düzenleme İran'ın boğaz üzerinde tek başına denetim kurmasını engelliyor.", "en": "Oman's proposal is modelled on the Strait of Malacca arrangement: ships using the waterway pay a \"voluntary fee\" that funds navigation safety, environmental protection and search and rescue. The provision that matters is the partnership the fee requires rather than the fee itself; the arrangement would stop Iran from exercising sole control over the strait.", "refs": ["hormuz-proposals"]}, {"tr": "Tahran'ın karşı önerisi başka bir yerden başlıyor. Dışişleri Bakan Yardımcısı Kazım Garibabadi, eşit bölüşüm planının İran'ın güvenlik kaygılarını karşılamadığını söyledi ve İran'ın \"boğazın kendi tarafındaki gemi trafiğini yöneteceğini\", Umman'ın ise karşı şeridin tamamını değil bir bölümünü yöneteceğini belirtti. Garibabadi'ye göre Umman deniz trafiği için üç hat öneriyor: İran karasularından geçen bir hat, uluslararası bir hat ve Umman karasularından geçen bir hat.", "en": "Tehran's counter-proposal starts somewhere else. Iran's deputy foreign minister, Kazem Gharibabadi, said the equal-division plan did not meet Iran's security concerns, and that Iran would \"manage shipping through its side of the strait\" while Oman would manage part but not all of the opposite lane. As Gharibabadi described it, the Omanis are proposing three lines for maritime traffic: one through Iran's territorial waters, an international one, and one through Omani waters.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Mekanizmanın eksik ayağı", "en": "The missing leg of the mechanism"}, "ps": [{"tr": "Malakka örneğinin çalışmasını sağlayan şey hattın çizimi değil, ücreti toplayan ve harcayan bir gövdenin varlığıdır. Ortada dolaşan iki metinden hiçbiri böyle bir gövdeyi kamuya açık biçimde adlandırmıyor. Bu eksiklik iki türlü okunabilir: ya taraflar idari sorunu bilinçli olarak sonraya bıraktı ya da anlaşamadıkları asıl konu zaten burası. İkinci ihtimalin lehine bir işaret yok; sıralama tercihi de en az kilitlenme kadar olağan bir müzakere pratiği.", "en": "What makes the Malacca precedent work has less to do with where the lines are drawn than with the existence of a body that collects the fee and spends it. Neither of the two texts in circulation names such a body publicly. The gap admits two readings: either the parties deliberately deferred the administrative question, or that is precisely where they cannot agree. Nothing yet favours the second; sequencing is as ordinary a negotiating practice as deadlock.", "refs": ["hormuz-proposals"]}, {"tr": "Kefelere ne konduğuna bakmak gerekir. Umman'ın kazandığı, boğazın tek bir devletin tasarrufunda olmadığı bir düzen ve bu düzende kendisine düşen rol. İran'ın istediği, bir şerit üzerindeki denetiminin tanınması. Ancak Garibabadi aynı konuşmada Tahran'ın denetimi sürdürmek için çatışmaya dönmek de dahil \"her türlü eylemi\" değerlendireceğini söyledi. Masaya oturmuş bir taraf, masa dışındaki seçeneğini bu kadar açık tutuyorsa, teklifin fiyatı henüz belirlenmemiş demektir.", "en": "It is worth looking at what goes into each pan. What Oman gains is an order in which the strait is not at one state's disposal, and a role for itself within it. What Iran wants is recognition of its control over one lane. Yet in the same remarks Gharibabadi said Tehran would consider \"any action\" to maintain control, including resuming warfare. When a party that has taken its seat keeps its outside option that visible, the price of the offer has not yet been set.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Denge demek için erken", "en": "Too early to call it a balance"}, "ps": [{"tr": "Çatışmanın 28 Şubat'ta başlamasından önce boğazdan dünya enerji arzının beşte biri geçiyordu; kapanma küresel ticareti aksattı. Bu ölçekte bir aksama, teklif alışverişini kendiliğinden bir ilerleme saymayı cazip kılar. Oysa şimdiye kadar değişen şey temas kanalı; taraflardan hiçbirinin üstlendiği yeni bir taahhüt yok. Bir sonraki turda bakılacak somut şey açık: metinlerden biri ücreti toplayacak gövdeyi ve başlangıç tarihini adlandırıyor mu?", "en": "Before the conflict began on 28 February, one-fifth of the world's energy supplies passed through the strait, and its closure has disrupted global trade. A disruption that large makes it tempting to count an exchange of proposals as progress in itself. What has changed so far, though, is the channel of contact; neither side has taken on a new commitment. The concrete thing to look for in the next round is plain: does either text name the body that would collect the fee, and a date on which it starts?", "refs": ["hormuz-proposals"]}]}], "sources": [{"key": "hormuz-proposals", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/iran-and-oman-exchange-proposals-to-manage-strait-of-hormuz", "title": {"tr": "İran ve Umman, Hürmüz Boğazı'nın yönetimi için karşılıklı öneri sundu", "en": "Iran and Oman exchange proposals for managing the Strait of Hormuz"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-03", "title": {"tr": "Saat 17.45'te başlayan cevap dizisi", "en": "The reply that began at 17.45"}, "excerpt": {"tr": "Önlenen bir salvo ile aynı gün yapılan hava harekâtı arasında ölçülebilir tek büyüklük var: tempo.", "en": "Between an intercepted salvo and the same day's air operation, one quantity is measurable: tempo."}, "sections": [{"h": {"tr": "Önlenen salvo", "en": "The salvo that was stopped"}, "ps": [{"tr": "CENTCOM'un açıklamasına göre Devrim Muhafızları, ABD Doğu saatiyle 17.45'te Ortadoğu'daki ABD güçlerine yönelik sürpriz bir saldırı girişimi kapsamında birden fazla balistik füze fırlattı; füzelerin tamamı önlendi ve birlikler yüksek hazırlık düzeyinde kaldı. Fırlatma, Başkan Donald Trump'ın cuma günü diplomasiye alan açmak için verdiği arayı bozdu.", "en": "According to CENTCOM, Revolutionary Guard forces launched multiple ballistic missiles at 17.45 Eastern time in an attempted surprise attack on US forces based in the Middle East; all of them were intercepted and the troops stayed at a high state of readiness. The launch broke the pause President Donald Trump had ordered on Friday to make room for diplomacy.", "refs": ["centcom-intercept"]}, {"tr": "Tam önleme bir kabiliyet ölçüsüdür, ama neyin ölçüsü olduğuna dikkat etmek gerekir. Bu sonuç, o eksende savunma kapsamının salvonun boyuna yettiğini gösterir; fırlatıcı envanteri, yeniden yükleme süresi veya bir sonraki salvonun büyüklüğü hakkında bir şey söylemez. Komutanlık hedefin yerini de açıklamadı. Elde kalan doğrulanmış büyüklük tektir: bir kez denendi, tutmadı.", "en": "A complete interception measures a capability, but it is worth being careful about which one. The result shows that defensive coverage on that axis was sufficient for a salvo of that size; it says nothing about launcher inventory, reload time, or how large the next salvo could be. The command did not identify the location of the target either. One verified quantity remains: it was tried once, and it did not work.", "refs": ["centcom-intercept"]}]}, {"h": {"tr": "Aynı gün, ikinci hareket", "en": "Same day, second move"}, "ps": [{"tr": "Aynı gün ABD ve Suudi savaş uçakları Doğu Irak'ta çok sayıda hedefi vurdu. CENTCOM vurulan yerleri \"doğrudan Devrim Muhafızları yönlendirmesiyle işletilen terörist lojistik ve silah tesisleri\" olarak tanımladı ve harekâtın 72 saat içinde ABD güçleri ile Suudi enerji altyapısına yöneltilen 30'dan fazla insansız hava aracı saldırısına yanıt olduğunu bildirdi. Hedefler İran sınırındaki Diyala ve Vasıt vilayetlerinde yoğunlaştı; bu vilayetler toplanma alanı, lojistik koridoru ve fırlatma mevzii işlevi görüyor.", "en": "The same day, US and Saudi fighter aircraft struck multiple targets across eastern Iraq. CENTCOM described the sites as \"terrorist logistics and weapons sites operated under direct IRGC direction\" and said the operation answered more than 30 drone attacks against US forces and Saudi energy infrastructure over 72 hours. The targets were concentrated in Diyala and Wasit governorates along the Iranian border, which serve as staging areas, logistics corridors and launch positions.", "refs": ["iraq-strikes"]}, {"tr": "İki hareketi yan yana koyduğunuzda ortaya çıkan tercih şu: cevap, füze kuvvetine değil, fırlatma ağına yazıldı. Depoyu ve koridoru vurmak, salvoyu vurmaktan farklı bir maliyet dayatmasıdır; hedefi tekrar üretmenin süresini uzatmayı amaçlar. Daha sade bir açıklama da mümkün: Irak'taki harekât zaten süregelen insansız hava aracı kampanyasına karşı planlanmış olabilir ve aynı güne denk gelmesi sıralamadan çok tesadüf olabilir. Kamuya açık malzeme iki okumayı da ayırt etmeye yetmiyor.", "en": "Set the two moves side by side and the choice becomes visible: the reply was addressed to the launch network, not to the missile force. Hitting a depot and a corridor imposes a different cost from hitting a salvo; it aims to lengthen the time needed to reconstitute. A plainer explanation is also available: the Iraq operation may already have been planned against the running drone campaign, and falling on the same day may be coincidence rather than sequence. The public material does not separate the two readings.", "refs": ["centcom-intercept", "iraq-strikes"]}]}, {"h": {"tr": "Sınırın nerede olduğu sayılabilir", "en": "Where the limit sits can be counted"}, "ps": [{"tr": "CENTCOM, Devrim Muhafızları ile vekillerinin daha fazla askerî yanıttan kaçınmak için saldırıları durdurması gerektiği uyarısında bulundu. Bu uyarının tutup tutmadığı söylemle değil oranla anlaşılır. Ağustos sonuna kadar Irak toprağından yöneltilen insansız hava aracı saldırılarının hızı, bildirilen 72 saatte otuz düzeyinin belirgin biçimde altına inerse maliyet dayatması işlemiş olur. Aynı tempo sürerse, vurulan depolar yerine konmuş demektir ve uyarı yalnızca duyurulmuş bir sınır olarak kalır.", "en": "CENTCOM warned that the Revolutionary Guard and its proxies must stop the attacks to avoid further military response. Whether that warning holds is settled by a rate, not by rhetoric. If, by the end of August, the tempo of drone attacks launched from Iraqi territory falls clearly below the reported level of thirty in 72 hours, the cost imposition will have worked. If the same tempo continues, the depots that were struck have been replaced, and the warning remains a line that was announced rather than defended.", "refs": ["iraq-strikes"]}]}], "sources": [{"key": "centcom-intercept", "kind": "news", "name": "News4JAX", "url": "https://www.news4jax.com/news/world/2026/07/28/saudi-arabia-says-it-shot-down-more-drones-as-houthis-claim-to-have-turned-back-tanker/", "title": {"tr": "CENTCOM: İran'ın ABD güçlerine balistik füze saldırısı önlendi", "en": "CENTCOM says it intercepted an Iranian ballistic missile attack on US forces"}, "publishedDate": "2026-07-28"}, {"key": "iraq-strikes", "kind": "news", "name": "Kurdistan24", "url": "https://www.kurdistan24.net/en/story/928895/us-and-saudi-arabia-conduct-joint-strikes-on-iran-aligned-militia-targets-across-eastern-iraq", "title": {"tr": "ABD ve Suudi Arabistan, Doğu Irak'ta İran'a yakın milis hedeflerini ortak vurdu", "en": "US and Saudi Arabia strike Iran-aligned militia targets across eastern Iraq"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "geo-04", "title": {"tr": "Tarifenin sınırı beş alıcıda çiziliyor", "en": "The tariff stops at five buyers"}, "excerpt": {"tr": "Yetki geniş görünüyor, kapsamı ise sayılı. İlk beş alıcı ve ilk beş aracı: ambargonun duvar mı sapak mı olduğu tam burada belli olur.", "en": "The authority looks broad; its coverage is counted. Five buyers and five intermediaries — that is exactly where you learn whether this is a wall or a detour."}, "sections": [{"h": {"tr": "Yetkinin kapsamı bir sayıyla sınırlı", "en": "The authority is bounded by a number"}, "ps": [{"tr": "Senato Dış İlişkiler Komitesi'nin açıklamasına göre başkana tanınan tarife yetkisi, Rus ham petrolü veya doğal gazının en büyük beş ithalatçısı ile Rusya'nın yaptırımlardan kaçmasına yardım eden ilk beş ülkeyle sınırlı. Tasarı ayrıca Rus yetkililerine ve enerji sektörüne yaptırım öngörüyor ve İran'ın enerji ile silah sektörlerine dönük mevcut kısıtlamaları uzatıyor. Reuters, tarife hedefleri arasında Çin ve Hindistan'ı sayıyor.", "en": "According to the Senate Foreign Relations Committee, the tariff authority granted to the president is limited to the five largest importers of Russian crude oil or gas and the top five countries helping Russia evade sanctions. The bill also imposes sanctions on Russian officials and the energy sector and extends existing restrictions on Iran's energy and weapons sectors. Reuters names China and India among the tariff targets.", "refs": ["senate-sanctions"]}, {"tr": "Takvim de kapsamın parçası. Reuters usul oylamasını, oylama sürerken 75'e karşı 11 olarak aktardı; tasarının Temsilciler Meclisi'ne eylülden önce gelmesi beklenmiyor. Yani bugün ortada yürürlükte bir tarife değil, yürürlüğe girme ihtimali olan bir yetki var ve o yetkinin kullanılıp kullanılmayacağına başkan karar verecek.", "en": "The calendar is part of the coverage too. Reuters reported the procedural vote as 75-11 while voting was still open, and the House is not expected to take the bill up before September. What exists today is therefore not a tariff in force but an authority that may come into force, and whether it is used will be the president's decision.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Beşinci sıradan sonrası açık kalıyor", "en": "Everything past fifth place stays open"}, "ps": [{"tr": "Sayıyla sınırlanmış bir liste, listeye girmemeyi bir hedef hâline getirir. Rus ham petrolünü satın alan tarafların hacimlerini daha fazla alıcıya dağıtması ya da ilk beşin dışındaki aracılar üzerinden yönlendirmesi hâlinde aynı yük aynı yere ulaşır, yalnızca daha uzun ve daha pahalı bir yoldan gider. Bu okumaya karşı sağlam bir itiraz var: Rus ham petrolü alımı birkaç büyük alıcıda yoğunlaşmışsa beş sıra akışın çoğunu kapsayabilir ve dağıtmanın maliyeti tarifenin maliyetini aşabilir. Hangisinin geçerli olduğu, ancak ilan edilmiş bir liste ve sonrasındaki hacim serisiyle sınanabilir.", "en": "A list bounded by a number turns staying off the list into an objective. If buyers of Russian crude spread their volumes across more purchasers, or route them through intermediaries outside the top five, the same cargo reaches the same place — only by a longer and dearer road. There is a solid objection to that reading: if purchases of Russian crude are concentrated among a few large buyers, five slots may cover most of the flow and the cost of dispersing it may exceed the cost of the tariff. Which of the two applies can only be tested against a published list and the volume series that follows it.", "refs": ["senate-sanctions"]}, {"tr": "Yükün kime bindiği de tartışmanın konusu. Temsilci Gregory Meeks metni bir yaptırım tasarısından çok başkana açılan geniş bir tarife yetkisi olarak niteledi; Senatör Jeanne Shaheen ise tasarıyı Ukrayna'ya destek için eldeki en iyi imkân saydı. Aradaki fark teknik sayılmaz. Bir gümrük vergisi ithalatçı tarafta tahsil edilir; ilk muhatabı satıcı değil alıcıdır. Bu, ölçünün etkisiz olduğu anlamına gelmez. Gecikme, kalite kaybı ve artan finansman maliyeti de amaçlanmış sonuçlar olabilir.", "en": "Who carries the burden is also under argument. Representative Gregory Meeks characterised the text less as a sanctions bill than as a broad tariff authority opened up for the president; Senator Jeanne Shaheen treated it as the best available means of supporting Ukraine. The difference hardly counts as technical. A customs duty is collected on the importing side; its first counterpart is the buyer rather than the seller. That does not make the measure ineffective. Delay, quality loss and higher financing costs may themselves be intended effects.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Ölçülecek olan hacim", "en": "Volume is what will be measured"}, "ps": [{"tr": "Bu tasarının bir duvar mı yoksa bir sapak mı olduğu, oylama sayısıyla değil iki gözlemle anlaşılacak: başkan yetkiyi kullanıp bir liste ilan ediyor mu ve ilandan sonra Rus ham petrolü alımları beş büyük alıcıda yoğunlaşmayı sürdürüyor mu, yoksa daha fazla tarafa mı dağılıyor? İkinci gözlem olmadan yetkinin genişliği hakkında söylenen her şey metin okumasıdır, akış okuması değil.", "en": "Whether this bill is a wall or a detour will be settled not by the vote count but by two observations: does the president use the authority and publish a list, and after any such publication do purchases of Russian crude stay concentrated among five large buyers, or spread across more of them? Without the second observation, everything said about the breadth of the authority is a reading of the text, not a reading of the flow.", "refs": ["senate-sanctions"]}]}], "sources": [{"key": "senate-sanctions", "kind": "news", "name": "The Globe and Mail", "url": "https://www.theglobeandmail.com/world/article-us-senate-russia-sanctions-bill-lindsey-graham/", "title": {"tr": "ABD Senatosu Rusya ve İran yaptırım tasarısını ilerletti", "en": "US Senate advances the Russia and Iran sanctions bill"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-05", "title": {"tr": "Kaçırılanlar neden suçlu sayılıyor?", "en": "Why are the trafficked treated as offenders?"}, "excerpt": {"tr": "IOM'un yeni bölgesel stratejisi tek bir ayrımı zorluyor: bilgisayar başındaki kişi failin kendisi mi, yoksa oraya borçla ve şiddetle oturtulmuş biri mi?", "en": "IOM's new regional strategy presses on a single distinction: is the person at the keyboard the offender, or someone put in that chair by debt and violence?"}, "sections": [{"h": {"tr": "Kaynak ülkeler listesi tesadüf değil", "en": "The list of source countries is no accident"}, "ps": [{"tr": "IOM Genel Direktörü Amy Pope, \"80'den fazla ülkeden gelen kişilerin dolandırıcılık merkezlerine kaçırıldığını görüyoruz\" dedi. Örgüt 2022 ile 2025 arasında zorla suça sürüklenen 3.500'den fazla insan ticareti mağduruna 39 ülkeden yardım etti; en çok mağdur Endonezya, Hindistan, Sri Lanka, Etiyopya, Kenya ve Bangladeş'ten geldi. Bu liste bir coğrafya değil, bir işgücü havzası tarif ediyor.", "en": "IOM Director General Amy Pope said, \"We're seeing victims from over 80 different countries being trafficked into the scam centres.\" Between 2022 and 2025 the organisation assisted more than 3,500 victims of trafficking for forced criminality from 39 countries, with the largest numbers from Indonesia, India, Sri Lanka, Ethiopia, Kenya and Bangladesh. That list describes not a geography but a labour catchment.", "refs": ["iom-scam-centres"]}, {"tr": "Seçim ölçütü de bunu doğruluyor. Aracılar sosyal medyadaki iş ilanlarıyla İngilizce bilen ve üniversite mezunu kişileri hedefliyor. Yani aranan, çaresiz bir kişi değil, yurt dışında nitelikli iş bulabileceğine inanacak kadar nitelikli bir kişi. Pope, çalışma izni yerine turist vizesiyle seyahat edilmesinin başvuru sahiplerinin araştırması gereken kritik bir uyarı işareti olduğunu belirtti.", "en": "The selection criteria confirm it. Recruiters use social media job advertisements to target English-speaking university graduates. What is sought, in other words, is someone qualified enough to believe a skilled job abroad is plausible, rather than someone visibly desperate. Pope said travelling on a tourist visa rather than a work permit was a critical warning sign that applicants should investigate.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "Statü, korumayı belirliyor", "en": "Status decides protection"}, "ps": [{"tr": "IOM'un vurgusu tek bir noktada toplanıyor: dolandırıcılığı yürütmeye zorlanan kişiler kovuşturulacak suçlular değil, korunması gereken insan ticareti mağdurlarıdır. Mağdurlar kapalı alanlarda tutuluyor, belgelerine el konuluyor ve şiddet ile borç esaretiyle çalıştırılıyor. Bu tabloda kişinin hangi sıfatla sınırdan geçtiği, sonrasında ona ne yapılabileceğini belirliyor.", "en": "IOM's emphasis converges on one point: people forced to run scams are trafficking victims who need protection, not criminals to be prosecuted. Victims are confined in compounds, stripped of their documents and made to work through violence and debt bondage. In that picture, the label a person carries when they cross a border determines what can be done with them afterwards.", "refs": ["iom-scam-centres"]}, {"tr": "Buradaki asıl değişken sınıflandırmadır. Bir kişi merkezden çıktığında mağdur olarak taranırsa ifade verebilir, tanıklığı soruşturmaya girer ve dönüş süreci bir koruma prosedürüne bağlanır; suçlu olarak işleme alınırsa aynı bilgi kaybolur. Yine de sınıflandırmanın kendiliğinden yerleşmesini beklemek fazla iyimser olur: mağdur statüsü, koruma ve barındırma maliyetini kişinin bulunduğu ülkeye yükler ve bu maliyeti taşıyacak idari kapasite her yerde aynı değildir.", "en": "The operative variable here is classification. If someone leaving a compound is screened as a victim, they can give evidence, that testimony enters an investigation, and their return runs through a protection procedure; if they are processed as an offender, the same information is lost. It would be too hopeful, though, to expect the classification to settle on its own: victim status places the cost of protection and shelter on the country where the person is found, and the administrative capacity to carry that cost is not the same everywhere.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "2025 sayıları neyi gösterdi", "en": "What the 2025 figures showed"}, "ps": [{"tr": "Doğu ve Güneydoğu Asya ile Avustralya ve Yeni Zelanda'da 2025'te dolandırıcılık suçlarından kaynaklanan kayıplar 88,3 milyar dolar ile 114,1 milyar dolar arasında hesaplandı. Bu büyüklük, sektörü ayakta tutanın tek tek merkezler değil bir tedarik zinciri olduğunu düşündürüyor. IOM'un 2026-2030 bölgesel stratejisinin sınanacağı yer de burası: kaynak ülkeler ile mağdurun bulunduğu devletler, ortak tarama ve dönüş sayılarını birlikte yayımlıyor mu?", "en": "Losses from scam offences in East and Southeast Asia, Australia and New Zealand in 2025 were put at between $88.3 billion and $114.1 billion. A figure of that size suggests what sustains the industry is a supply chain rather than individual compounds. That is where IOM's 2026-2030 regional strategy will be tested: do source countries and the states where victims are found publish joint screening and return figures together?", "refs": ["iom-scam-centres"]}]}], "sources": [{"key": "iom-scam-centres", "kind": "news", "name": "UN News", "url": "https://news.un.org/en/story/2026/07/1168038", "title": {"tr": "IOM: Çevrim içi dolandırıcılık merkezlerine insan ticareti hızla büyüyor", "en": "IOM says trafficking into online scam centres is growing fast"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-06", "title": {"tr": "On yılda dokuzuncu başkan", "en": "The ninth president in ten years"}, "excerpt": {"tr": "Peru'nun tekrarlayan sorunu sandıkta belirmiyor. Başkanı görevden alabilen bir kongre ile onu koruyabilen bir bloğun aritmetiğinde beliriyor.", "en": "Peru's recurring problem does not appear at the ballot box. It appears in the arithmetic between a congress that can remove a president and a bloc that can shield one."}, "sections": [{"h": {"tr": "Sayının kendisi bir kurum tarifi", "en": "The number is itself a description of an institution"}, "ps": [{"tr": "Keiko Fujimori salı günü Lima'da Kongre önünde, cumhuriyet başkanlığı görevlerini sadakatle yerine getireceğine dair yemin etti. Haziran ayındaki ikinci turda solcu rakibi Roberto Sanchez'i 50.000'den az oyla geçmişti ve bu, üç yenilginin ardından girdiği dördüncü başkanlık yarışıydı. Aynı törenle birlikte on yılda Peru'nun dokuzuncu başkanı oldu.", "en": "Keiko Fujimori took the oath before Congress in Lima on Tuesday, swearing to carry out the duties of the presidency faithfully. She had beaten her left-wing rival Roberto Sanchez by fewer than 50,000 votes in June's runoff, in her fourth presidential bid after three defeats. With that ceremony she became Peru's ninth president in a decade.", "refs": ["peru-fujimori"]}, {"tr": "O dokuz rakamı bir seçmen kararsızlığını değil, bir kurumsal düzenlemeyi anlatır. Peru başkanlarının çoğu sandıkta yenilerek değil, kongre tarafından görevden alınarak gitti. Bu yüzden yeni başkanın kaderini belirleyecek sayı 50.000'lik oy farkı değil, meclisteki blokudur: Fuerza Popular Kongre'nin en büyük grubuna sahip ve sağdaki müttefikleriyle birlikte Senato sandalyelerinin yarısını elinde tutuyor.", "en": "That nine describes an institutional arrangement rather than an indecisive electorate. Most Peruvian presidents have left not by losing an election but by being removed by congress. The number that will decide this president's fate is therefore not the margin of fewer than 50,000 votes but her bloc in the legislature: Fuerza Popular holds the largest group in Congress and, with its right-wing allies, half the Senate seats.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Babasının dönemiyle uyuşmayan koşul", "en": "The condition that does not match her father's term"}, "ps": [{"tr": "Eleştirmenlerin uzandığı benzetme hazır: yönetiminin babası Alberto Fujimori'nin otoriter dönemine benzeyebileceği ve sivil özgürlüklerin aşınabileceği kaygısı. Benzetmenin tuttuğu yer var, tutmadığı yer de var. Peru'yu son on yılda dokuz başkana taşıyan mekanizma, güçlü bir başkanlıktan çok başkanı indirebilecek kadar güçlü bir kongredir. Bu, tam tersi yönde bir sorundur. Elindeki yarım Senato tam da bu ikinci soruna karşı işliyor: görevden alınmaya karşı koruyor, ama yasama gündemini rahatça ilerletmeye yetmiyor.", "en": "The analogy critics reach for is ready to hand: the fear that her government will resemble the authoritarian rule of her father, Alberto Fujimori, and erode civil liberties. The analogy holds in places and fails in others. The mechanism that carried Peru through nine presidents in ten years has less to do with a strong presidency than with a congress strong enough to bring one down — the opposite problem. Her half of the Senate works precisely against that second problem: it protects against removal, but it is not enough to advance a legislative agenda comfortably.", "refs": ["peru-fujimori"]}, {"tr": "Getirdiği program da ödünç alınmış bir şablon. Kampanyası El Salvador'un Cecot cezaevini örnek alan bir mega hapishane, kimliği gizli tutulan yargıçlar, göçmen sınır dışı işlemleri ve mahkûmların yiyecek karşılığında çalıştırılması üzerine kuruluydu. Şablonlar, onları taşıyan kurumlardan hızlı yolculuk eder; bir cezaevi modeli ithal edilebilir, o modeli ayakta tutan yargı ve infaz kapasitesi ithal edilemez. Bunun bir kampanya çerçevesi olarak kalması da mümkün: yarım Senato, bu adımların çoğunun gerektireceği yasal değişikliği tek başına çıkarmaya yetmiyor.", "en": "The programme she brings is a borrowed template too. Her campaign was built on a megaprison modelled on El Salvador's Cecot facility, judges whose identities are concealed, migrant deportations, and prisoners required to work for food. Templates travel faster than the institutions that carry them; a prison model can be imported, but the judicial and custodial capacity that holds it up cannot. It may also remain a campaign frame: half a Senate is not enough on its own to pass the legal changes most of those steps would require.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Bu döngü nerede bükülebilir", "en": "Where this cycle can still be bent"}, "ps": [{"tr": "Döngünün bu turda kırılıp kırılmadığını iki gözlem gösterecek. Birincisi, ilk görevden alma girişimi geldiğinde yarım Senato bir arada duruyor mu; çünkü bu bloğun dağılması, önceki sekiz başkanın gidişini açıklayan mekanizmanın yeniden işlediği anlamına gelir. İkincisi, muhalefetin adalet aradığı 2022-2023 protestolarındaki ölümlere ilişkin dosyalar ilerliyor mu. Kurumların çekişmeyi soğurup soğuramadığı, sınırların nereden çizildiğinden çok bu iki soruda görünür.", "en": "Two observations will show whether the cycle breaks on this turn. The first is whether the half Senate holds together when the first removal attempt arrives; the dispersal of that bloc would mean the mechanism explaining the departure of the previous eight presidents is running again. The second is whether the cases over the deaths in the 2022-2023 protests, for which the opposition is seeking justice, move forward. Whether institutions can absorb contestation shows up in those two questions far more than in where any line is drawn.", "refs": ["peru-fujimori"]}]}], "sources": [{"key": "peru-fujimori", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/keiko-fujimori-sworn-in-as-peru-president-after-narrow-election-win", "title": {"tr": "Keiko Fujimori, kıl payı seçim zaferinin ardından Peru başkanlığına yemin etti", "en": "Keiko Fujimori sworn in as Peru's president after a narrow election win"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-01", "title": {"tr": "Yaptırım listesi kısaldıkça tarama eşiği yükseliyor", "en": "As the sanctions list shortens, the screening bar rises"}, "excerpt": {"tr": "Hazine'nin ikinci çıkarma turu yaptırımları gevşetmiyor, aracın kendisini yeniden tanımlıyor. Görünen taraf 84 adın silinmesi; asıl değişiklik 22 girişe eklenen ayırt edici bilgide.", "en": "Treasury's second removal round does not loosen sanctions; it redefines the instrument. The 84 deletions are the visible part; the change that matters sits in the identifiers added to 22 entries."}, "sections": [{"h": {"tr": "Silinen ad ile taranabilir hedef arasındaki fark", "en": "The difference between a deleted name and a screenable target"}, "ps": [{"tr": "Hazine Bakanlığı 27 Temmuz'da modernizasyon girişiminin ikinci turunu duyurdu: OFAC'ın Özel Olarak Belirlenmiş Kişiler ve Engellenen Kişiler listesinden 84 kişi ve kuruluş çıkarıldı, 22 liste girişine ayırt edici bilgi eklendi, 18 mükerrer giriş kümesi giderildi. Üç işlemin de aynı duyuruda yer alması tesadüf değil.", "en": "On 27 July the Treasury Department announced the second round of its modernization initiative: 84 individuals and entities came off OFAC's Specially Designated Nationals and Blocked Persons List, 22 list entries gained identifying information, and 18 sets of duplicates were resolved. That the three operations share one announcement is not incidental.", "refs": ["ofac"]}, {"tr": "Listeden çıkarma genellikle siyasi bir taviz olarak okunur. Hazine'nin bildirdiği ölçütler başka bir mekanizmaya işaret ediyor: vefat etmiş kişiler, faaliyeti sona ermiş kuruluşlar ve 20 yıldan uzun süre önce belirlenmiş, tarama için yeterli bilgi taşımayan hedefler. Bir bankanın süzgecinde eşleşmeyen bir ad, yaptırım uygulanmasını sağlamaz; yalnızca yanlış eşleşme üretir. Yine de tersi de mümkün: duyuru tek tek dosyaları yayımlamadığı için, çıkarmaların bir bölümünün sessiz bir siyasi gevşeme olması ihtimali dışlanamaz.", "en": "A delisting is usually read as a political concession. The criteria Treasury states point to a different mechanism: deceased individuals, defunct entities, and targets designated more than 20 years ago that lack the information needed for screening. A name that will not match inside a bank's filter enforces nothing; it produces false hits. The opposite reading remains available, though: because the announcement publishes no individual case files, some of the removals could still be a quiet political relaxation.", "refs": ["ofac"]}]}, {"h": {"tr": "Uyum yükü nereye kayıyor?", "en": "Where does the compliance burden move?"}, "ps": [{"tr": "Eklenen alanlar bu okumanın sınamasıdır: doğum tarihi, kimlik numarası, uyruk, cinsiyet. Bunlar bir adı makinenin eşleştirebileceği bir hedefe çeviren alanlardır. 22 girişe eklenmeleri, bir finans kuruluşunun süzgecinin ulaşabileceği kesinliği yükseltir; eşleşmeyen girişlerin silinmesi ise yanlış alarmı düşürür. Hangi adın okunabilir kılınacağına karar veren makam, uygulamanın dikkatinin nereye yoğunlaşacağına da karar vermiş olur.", "en": "The added fields are the test of that reading: date of birth, identification number, nationality, gender. These are what turn a name into something a machine can match. Adding them to 22 entries raises the precision a financial institution's filter can reach; deleting unmatchable entries lowers the false-positive load. Whoever decides which name becomes legible has also decided where enforcement attention will concentrate.", "refs": ["ofac"]}, {"tr": "İkinci bir değişiklik gündemin kimin elinde olduğuna dokunuyor. Hazine, 29 Haziran 2026'da listeden çıkarma başvurularının yapılabildiği bir Yeniden Değerlendirme Portalı açtığını bildiriyor. Bu, sıranın bir bölümünü kurumun iç önceliklerinden başvuru yapanlara taşır. Gözlenebilir işaret şu: sonraki turların bileşimi idari temizlikten mi, yoksa başvuruya dayalı çıkarmalardan mı ağırlık alacak.", "en": "A second change touches who holds the agenda. Treasury says it opened a Reconsideration Portal on 29 June 2026 through which delisting petitions can be filed. That moves part of the queue away from the agency's internal priorities and toward whoever files. The observable signal: whether the composition of later rounds tilts from administrative housekeeping toward petition-driven removals.", "refs": ["ofac"]}]}, {"h": {"tr": "Hangi ölçüyle değerlendirilecek?", "en": "By what measure will it be judged?"}, "ps": [{"tr": "Duyuruda Bakan Scott Bessent'in tutumu, yönetimin yaptırım başarısını \"yalnızca Hazine'nin listeye eklediği isim sayısıyla değil, etki, sonuç ve fayda üzerinden\" ölçtüğü biçiminde aktarılıyor. Bir duyuruda ilan edilen ölçüt bir konum belirler, uygulamayı belgelemez. Bu ölçütün ciddiye alınıp alınmadığı, sonraki turların her girişin hangi gerekçeyle çıkarıldığını ayrı ayrı yayımlayıp yayımlamamasından anlaşılacak.", "en": "The release attributes to Secretary Scott Bessent the position that the administration measures sanctions success \"in terms of effect, impact, and benefit-not just based on the number of names Treasury places on a list.\" A yardstick declared in a press release establishes a position; it does not document implementation. Whether it is meant seriously will show in whether later rounds publish, entry by entry, the ground on which each name was removed.", "refs": ["ofac"]}]}], "sources": [{"key": "ofac", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0578", "title": {"tr": "ABD Hazinesi yaptırım listesinden 84 kişi ve kuruluşu çıkardı", "en": "US Treasury removes 84 people and entities from its sanctions list"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-02", "title": {"tr": "Salonu terk etmek hangi yetkiyi geri alır?", "en": "What authority does walking out reclaim?"}, "excerpt": {"tr": "Bu köşenin önceki yazısında 144'e karşı 10'luk oyun meşruiyet verdiği, ama uygulamayı zorlayacak bir güç vermediği savunulmuştu. Pazartesi günkü çıkış, aynı hesabın öbür yarısını görünür kılıyor.", "en": "An earlier column here argued that the 144-10 vote conferred legitimacy but not the leverage to compel practice. Monday's walkout makes the other half of that sum visible."}, "sections": [{"h": {"tr": "Oyun ardından gelen çıkış", "en": "The walkout that followed the vote"}, "ps": [{"tr": "ABD heyeti pazartesi günü, Fransa'nın Rusya'nın Ukrayna'daki savaşına ilişkin konuşmasına başladığı sırada Güvenlik Konseyi salonunu terk etti. Anlaşmazlığın kaynağı Konsey'in gündemindeki savaş değil, Washington'ın BM insan hakları yüksek komiseri Volker Türk'ün görev süresinin uzatılmasına karşı oy vermesiydi.", "en": "The US delegation left the Security Council chamber on Monday as France's delegation began speaking about Russia's war in Ukraine. The dispute did not originate in the war on the Council's agenda but in Washington's vote against renewing the term of UN human rights chief Volker Turk.", "refs": ["unsc"]}, {"tr": "Bu köşenin önceki yazısında, Türk'ün 144'e karşı 10 oyla yeniden seçilmesinin kuruma meşruiyet kazandırdığı ama karşı oy veren devletlerin uygulamasını değiştirmediği ileri sürülmüştü. Pazartesi günkü çıkış o savın sınanabilir hale gelen tarafıdır: karşı oy veren devlet uyum göstermek yerine salondan çekildi. Karar aritmetiği tuttu; kararın muhatabı üzerindeki etkisi tutmadı.", "en": "An earlier column here argued that Turk's re-election by 144 votes to 10 gave the office legitimacy without changing the practice of the states that opposed it. Monday's walkout is the testable side of that argument: the opposing state's response was not compliance but withdrawal from the room. The coalition arithmetic held; its purchase on the state it was aimed at did not.", "refs": ["unsc", "history-turk"]}]}, {"h": {"tr": "İki delegasyonun farklı hesabı", "en": "Two delegations, two different sums"}, "ps": [{"tr": "Fransa'nın BM Daimî Temsilciliği ABD'nin artık bir \"insan hakları feneri\" olmadığını bildirdi ve oyla Kuzey Kore, Nikaragua, Mali ve Rusya ile aynı safta kaldığını söyledi. ABD Daimî Temsilcisi Mike Waltz ise Türk'ün \"ABD, Birleşik Krallık ve İsrail gibi özgür, egemen demokrasilere ders verdiğini\" savundu. Dönüşümlü temsilci Dan Negrea, Fransa \"küçümseyici ve saygısız söyleminden\" vazgeçene kadar çıkışların süreceğini duyurdu. Fransa'nın büyükelçisi Jerome Bonnafont çıkışa hiç değinmedi, BM'nin bağımsızlığını korumaktan söz etti.", "en": "France's UN Mission said the US was no longer a \"beacon of human rights\" and that the vote had left it standing with North Korea, Nicaragua, Mali and Russia. US Ambassador Mike Waltz replied that Turk \"has been lecturing free, sovereign democracies like the United States, the UK, and Israel.\" Alternate representative Dan Negrea announced the walkouts would continue until France renounced its \"condescending and disrespectful rhetoric.\" France's ambassador Jerome Bonnafont did not mention the walkout at all and spoke of preserving the UN's independence.", "refs": ["unsc"]}, {"tr": "Negrea'nın koyduğu koşul, çıkışı bir pazarlık aracına dönüştürüyor. Bu aracın bedeli düşük: Konsey, eksik bir heyetle de çalışmayı sürdürür, dolayısıyla masraf salonu terk edenin kendi gündem belirleme gücüne yazılır. Bu yüzden çıkışın hedefi Fransa'nın söylemi olmayabilir; muhatabı iç kamuoyu olan bir jest de aynı biçimi alır. İki yorumu ayıran şey, ABD'nin kendi metin taslağını savunması gereken bir oturumda aynı davranışı sürdürüp sürdürmeyeceğidir.", "en": "Negrea's condition turns the walkout into a bargaining instrument. It is a cheap one: the Council keeps working with a delegation missing, so the cost falls on the absentee's own agenda-setting. That is why France's rhetoric may not be the real target; a gesture aimed at a domestic audience takes exactly the same shape. What separates the two readings is whether the US repeats the behaviour in a session where it must defend a draft of its own.", "refs": ["unsc"]}]}, {"h": {"tr": "Ne gözlemlenebilir?", "en": "What can be observed"}, "ps": [{"tr": "Buradan bir denge çıkarmak için henüz erken. Ama sınanabilir bir eşik var: ABD, kendi sunduğu bir karar tasarısının görüşüldüğü bir oturumda da salonu terk ederse, çıkış bir müzakere aracı değil, kurumdan uzaklaşmanın alışkanlığa dönüşmüş biçimi olarak okunmalıdır. Tersine, taslak sahibi olduğu oturumlarda kalırsa, koşulun gerçekten Fransa'nın söylemine bağlandığı görülür.", "en": "It is too early to call this a balance. But there is a testable threshold: if the US also leaves a session in which a draft resolution it sponsored is under discussion, the walkout should be read not as a negotiating instrument but as distancing from the institution turned into habit. If, on the other hand, it stays in sessions where it owns the text, the condition really is tied to France's rhetoric.", "refs": ["unsc"]}]}], "sources": [{"key": "unsc", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/us-diplomats-walk-out-as-france-addresses-un-security-council", "title": {"tr": "Fransa söz alınca ABD diplomatları Güvenlik Konseyi salonundan çıktı", "en": "US diplomats walk out as France takes the floor at the Security Council"}, "publishedDate": "2026-07-27"}, {"key": "history-turk", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-25/", "title": {"tr": "144'e karşı 10 ve bir kurumun dayanıklılığı", "en": "144 against 10, and the durability of an institution"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "geo-03", "title": {"tr": "Bir uçağın satışını iki ayrı yetki belirliyor", "en": "Two separate authorities decide one aircraft's sale"}, "excerpt": {"tr": "\"Kimse bana ne satmamız gerektiğini söyleyemez\" bir niyet beyanıdır. Uygunluk kararını veren makam ise bir hafta önce Kongre'ye Ankara'nın hâlâ nitelikleri karşılamadığını bildirdi.", "en": "\"Nobody tells me what we should be selling\" is a statement of intent. The office that decides eligibility told Congress a week ago that Ankara still does not qualify."}, "sections": [{"h": {"tr": "Niyet ile uygunluk arasındaki mesafe", "en": "The distance between intent and eligibility"}, "ps": [{"tr": "Trump, uçakta gazetecilerin Netanyahu'nun itirazına ilişkin sorusuna \"Kimse bana ne satmamız gerektiğini söyleyemez\" diye yanıt verdi ve ekledi: \"Türkiye İsrail'in büyük hayranı değil, Bibi'nin de pek hayranı değil. Ama bana karşı harika davrandılar\". TRT Haber'in aktardığı sözlerinde Erdoğan'ı dostu olarak andı, Türkiye'yi de büyük bir müttefik diye tanımladı.", "en": "Asked aboard his plane about Netanyahu's objection, Trump answered, \"Nobody tells me what we should be selling.\" He added: \"Turkey's not a big fan of Israel, not a great fan of Bibi. But they've been great for me.\" In remarks carried by TRT Haber he called Erdogan a friend and Turkey a major ally.", "refs": ["f35"]}, {"tr": "Aynı haberde ikinci bir bilgi var ve satışın hangi aşamada olduğuna dair asıl veri odur: Dışişleri Bakanlığı bir hafta önce Kongre'ye Ankara'nın alım için hâlâ uygun olmadığını bildirdi. Bu, iki ayrı yetkinin aynı dosyada farklı yönde çalıştığını gösterir. Biri satışı istiyor, öbürü uygunluk ölçütünü tutuyor.", "en": "The same report carries a second fact, and it is the one that actually locates the sale: the State Department told Congress a week ago that Ankara still does not qualify for the purchase. Two separate authorities are working the same file in opposite directions. One wants the sale; the other holds the eligibility standard.", "refs": ["f35"]}]}, {"h": {"tr": "Kabiliyet ne zaman devreye girer?", "en": "When does the capability actually arrive?"}, "ps": [{"tr": "Bir beşinci nesil uçak, bölgesel hava resmini açıklandığı gün değiştirmez. Sıra bellidir: uygunluk, sözleşme, üretim sırası, teslimat, ardından mürettebat ve idame. Başkanın sözü bu dizinin ilk basamağının bile öncesindedir. Buna karşılık dizi bir veto değildir; uygunluk ölçütünü uygulayan makam yürütmenin içindedir ve yürütme kendi ölçütünü gözden geçirebilir. Bu yüzden bugünkü tablo bir engel değil, bir gecikme ölçüsüdür.", "en": "A fifth-generation aircraft does not change the regional air picture on the day it is announced. The sequence is fixed: eligibility, contract, production slot, delivery, then aircrew and sustainment. A president's remark sits before even the first of those steps. The sequence is not a veto, though: the office applying the eligibility standard sits inside the executive branch, and the executive can revise its own standard. What today's picture measures is delay, not obstruction.", "refs": ["f35"]}, {"tr": "Netanyahu'nun itirazı da uçak sayısıyla ilgili değil. Bir ülkenin o kabiliyet katmanında iş görebilmesi, komşularının hava planlamasında hangi varsayımı kuracağını belirler. Trump'ın yanıtı bu düzlemde verilmedi; ilişkinin kendisini öne çıkardı ve dengeyi hiç fiyatlamadı. İki taraf aynı dosyada iki ayrı ölçütle konuşuyor.", "en": "Netanyahu's objection is not about airframe counts either. Whether a state can operate at that capability tier sets the assumption its neighbours build into their own air planning. Trump's answer was not given on that plane; it foregrounded the relationship itself and priced the balance not at all. The two sides are arguing the same file with two different yardsticks.", "refs": ["f35"]}]}, {"h": {"tr": "Gözlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu dosyada söz ile sonuç arasındaki farkı ölçen tek bir belge var. Dışişleri Bakanlığı Kongre'ye ilettiği değerlendirmeyi değiştirir ve Türkiye'ye F-35 satışına ilişkin resmî bir bildirim yapılırsa, niyet beyanı kabiliyet hattına geçmiş olur. Böyle bir bildirim olmadıkça, uçakta söylenen sözün hava resmi üzerinde ölçülebilir bir karşılığı yoktur.", "en": "Only one document measures the gap between the remark and the outcome in this file. If the State Department revises its assessment to Congress and a formal notification of a proposed F-35 sale to Türkiye follows, the statement of intent will have crossed into the capability line. Absent such a notification, what was said aboard the plane has no measurable effect on the air picture.", "refs": ["f35"]}]}], "sources": [{"key": "f35", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog_entry/trump-on-netanyahu-opposing-f-35-sale-to-turkey-nobody-tells-me-what-we-should-be-selling/", "title": {"tr": "Trump, Türkiye'ye F-35 satışına yönelik Netanyahu itirazını reddetti", "en": "Trump brushes aside Netanyahu's objection to an F-35 sale to Türkiye"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-04", "title": {"tr": "Bab-ül Mendep'ten pazar günü geçen on bir gemi", "en": "Eleven ships through Bab al-Mandeb on Sunday"}, "excerpt": {"tr": "Yemen'in dışişleri bakanı adayı, Husilerin Hürmüz modelini kopyalamak istediğini söylüyor. Geçiş sayıları, kopyalamaya gerek kalmadan rotanın çoktan boşaldığını gösteriyor.", "en": "Yemen's foreign minister-designate says the Houthis want to copy the Hormuz model. The transit counts show the route has already emptied without any copying."}, "sections": [{"h": {"tr": "Sayılar ne diyor?", "en": "What the numbers say"}, "ps": [{"tr": "Afrah el-Zouba pazartesi günü Riyad'daki Yemen büyükelçiliğinde konuştu: \"Husiler İran modelini kopyalamak istiyor ve bu iki ana boğazı kapatacak\". Grubun yetersiz uluslararası tepki nedeniyle cesaretlendiğini savundu. Bu bir taraf değerlendirmesi ve bağımsız doğrulaması yok.", "en": "Afrah al-Zouba spoke on Monday at Yemen's embassy in Riyadh: \"The Houthis want to copy the Iranian model, and this will shut down two main straits\". She argued the group had been emboldened by an insufficient international response. This is one party's assessment, and it carries no independent verification.", "refs": ["redsea"]}, {"tr": "Aynı haberdeki üç sayı daha somut. Küresel konteyner trafiğinin yaklaşık yüzde 30'u Kızıldeniz'den geçiyor, küresel ticaretin yüzde 12 ile yüzde 15'i bu rotaya bağlı ve pazar günü boğazdan yalnızca 11 emtia gemisi geçti. Üçüncü sayı ilk ikisinin yanında durunca ortaya çıkan tablo şu: rotanın taşıdığı yükün payı hâlâ büyük, fiilen taşıdığı gemi sayısı ise değil.", "en": "Three other figures in the same report are more concrete. Roughly 30 percent of global container traffic transits the Red Sea, 12 percent to 15 percent of overall global trade depends on the route, and on Sunday only 11 commodity vessels passed through the strait. Set the third figure beside the first two and the picture is this: the route's share of the cargo that matters is still large; the number of ships actually using it is not.", "refs": ["redsea"]}]}, {"h": {"tr": "Sapak nereye çıkıyor?", "en": "Where does the detour lead?"}, "ps": [{"tr": "Hürmüz benzetmesi, kaldıracın nasıl işlediğini yanlış anlatıyor. Hürmüz'ün alternatifi yok; Bab-ül Mendep'in var, ama pahalı. Bir boğazın kapanması gerekmez, geçiş hacminin çökmesi yeter: masraf o anda sigorta primine ve daha uzun alternatif rotanın eklediği sefer günlerine geçmiş olur. İki boğazın kapatılacağı uyarısı bu yüzden bir tehdit değil, çoktan ödenmiş bir faturanın adıdır.", "en": "The Hormuz comparison misdescribes the instrument. Hormuz has no alternative; Bab al-Mandeb has one, and it is expensive. A strait does not have to close for the leverage to work; transit volume collapsing is enough, and at that moment the cost has already moved into insurance premiums and the sea-days a longer alternative route adds. The warning that two straits will be shut is therefore not a threat but the name of a bill already paid.", "refs": ["redsea"]}, {"tr": "Tek günlük bir sayımdan kalıcı bir yön değişikliği çıkarmak yanlış olur. Pazar günkü 11 gemi, Husilerin temmuzda Suudi Arabistan'a giden gemilere yönelik abluka ilanı ile Suudi Arabistan'ın Hudeyde limanına düzenlediği hava saldırılarının hemen ardından gelen kısa bir duraklamayı da yansıtabilir. Rotanın gerçekten terk edilip edilmediğini tek bir gün değil, art arda gelen haftalar gösterecek.", "en": "It would be wrong to read a durable reroute out of a single day's count. Sunday's 11 vessels may reflect a short pause immediately after the Houthis' July siege declaration on shipping bound for Saudi Arabia and the Saudi air strikes on the port of Hodeidah. What will show whether the route has actually been abandoned is consecutive weeks, not one day.", "refs": ["redsea"]}]}, {"h": {"tr": "Ölçülebilir eşik", "en": "A measurable threshold"}, "ps": [{"tr": "Bu yüzden izlenecek değişken bir açıklama değil, bir sayımdır. Husiler Suudi Arabistan'a yönelik abluka ilanını geri almadıkça boğazdan günlük geçen ticari gemi sayısının düşük kalmasını beklemek gerekir. Ablukanın kaldırıldığı duyurulur ve haftalık geçiş sayıları buna rağmen toparlanmazsa, maliyeti üreten şey ilan değil, sigortanın rotayı fiyatlama biçimidir; bu da ayrı bir sorundur.", "en": "So the variable to watch is a count rather than a statement. Unless the Houthis withdraw the siege declaration on shipping bound for Saudi Arabia, daily commercial transits through the strait should be expected to stay low. If the siege is announced as lifted and weekly transit counts still fail to recover, the cost is being generated by the way insurance prices the route rather than by the declaration, and that is a separate problem.", "refs": ["redsea"]}]}], "sources": [{"key": "redsea", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/houthis-want-to-copy-irans-hormuz-control-in-the-red-sea-yemeni-fm", "title": {"tr": "Yemen'in dışişleri bakanı adayı: Husiler Kızıldeniz'de Hürmüz modelini kopyalamak istiyor", "en": "Yemen's foreign minister-designate says the Houthis want to copy Iran's Hormuz model"}, "publishedDate": "2026-07-28"}], "date": "2026-07-28"}, {"writer": "geo-05", "title": {"tr": "Boykot çağrısı ile sandık arasındaki on iki sandalye", "en": "Twelve seats between the boycott call and the ballot box"}, "excerpt": {"tr": "Pakistan yönetimindeki Keşmir'de oylama üç aşamaya bölündü, internet kapatıldı ve haziranda yasaklanan hareket sandığın dışından konuşuyor. İtirazın merkezinde mültecilere ayrılan on iki meclis sandalyesi var.", "en": "In Pakistan-administered Kashmir the vote was split into three phases, the internet was cut, and the movement banned in June is speaking from outside the ballot. At the centre of the objection are twelve assembly seats reserved for refugees."}, "sections": [{"h": {"tr": "Kimin seçimi, hangi koşullarda?", "en": "Whose election, under what conditions?"}, "ps": [{"tr": "Yerel yasama seçiminin üç aşamasından ilki 27 Temmuz'da yapıldı. Yaklaşık 3,8 milyon seçmen kayıtlı; oylamanın bölünme gerekçesi güvenlik personelinin yetersizliği olarak açıklandı. Bölgenin büyük bölümünde mobil ve internet hizmetleri kesildi, sandık başında fiilî bir olağanüstü hâl uygulandı. Mirpur'da ilk aşamada katılımın düşük göründüğü aktarıldı.", "en": "The first of three phases of the local legislative election was held on 27 July. About 3.8 million voters are registered, and the split was attributed to a shortage of security personnel. Mobile and internet services were suspended across most of the territory and an unofficial state of emergency was in force at the polls. Turnout appeared low in Mirpur during the first phase.", "refs": ["kashmir"]}, {"tr": "Sandığın dışında kalan taraf da örgütlü. Cammu Keşmir Ortak Avami Eylem Komitesi haziranda terörle mücadele yasaları kapsamında yasaklandı; yöneticileri tutuklandı, bir bölümü gizlendi, bir bölümü protesto kamplarından örgütlenmeyi sürdürüyor. Haziran başından bu yana yaklaşık 40 kişi öldü. Boykot çağrısının gerekçesi tek bir maddede toplanıyor: mecliste 12 sandalyenin Keşmirli mültecilere ayrılması.", "en": "The side outside the ballot box is organised too. The Jammu Kashmir Joint Awami Action Committee was banned in June under anti-terrorism laws; its leaders were arrested, some went underground and some continue organising from protest camps. Nearly 40 people have been killed since early June. The boycott call rests on a single provision: the 12 assembly seats reserved for Kashmiri refugees.", "refs": ["kashmir"]}]}, {"h": {"tr": "Hangi seçenekler açık kaldı?", "en": "Which options stayed open?"}, "ps": [{"tr": "On iki sandalyeye yönelik itiraz, oy verip vermemekten önce meclisin kimi temsil ettiğine dair bir iddiadır. Sandığa giremeyen bir hareketin elinde kalan tek ölçülebilir kaldıraç katılım oranıdır; bu yüzden boykot bir çekilme değil, kalan tek aracın kullanılmasıdır. Ancak Mirpur'daki düşük katılımı doğrudan boykotun başarısı saymak erken olur: internet kesintisinin yarattığı pratik sürtünme de aynı sonucu üretebilir.", "en": "The objection to the twelve seats is a claim about whom the assembly represents, prior to any question of whether to vote. For a movement shut out of the ballot the only measurable leverage left is the turnout figure, so the boycott uses the one instrument still available rather than abandoning the contest. Reading Mirpur's low turnout directly as the boycott's success would be premature, though: the practical friction of the internet shutdown produces the same result.", "refs": ["kashmir"]}, {"tr": "Kesintinin yalnızca boykotçuları değil yarışan adayları da kısıtladığını, bağımsız aday Malik Alauddin'in sözleri gösteriyor: \"İnternet kesintisi hem siyasi adaylar hem de seçim süreci için ciddi zorluklar yarattı\". Üç aşamalı takvim ise yönetimin kendi kapasitesine dair bir beyandır: tek bir oy gününü güvence altına alamayan idare üç gün güvence altına alıyor. Seçmenin karşısındaki soru, bu koşullarda kimi seçeceğinden çok hangi koşulda seçtiğidir.", "en": "That the shutdown constrains contesting candidates and not only boycotters is shown by independent candidate Malik Alauddin: \"The internet shutdown has created serious difficulties ... for political candidates and the electoral process itself.\" The three-phase calendar is itself a statement about the administration's capacity: an authority that cannot secure one polling day secures three. The question in front of voters is less whom to choose than under what conditions they are choosing.", "refs": ["kashmir"]}]}, {"h": {"tr": "Kalan aşamalarda görülecek olan", "en": "What the remaining phases will show"}, "ps": [{"tr": "Kalan iki aşama, iki ayrı okumayı ayırt edebilecek tek malzemeyi üretecek. İnternet hizmetleri açıldığı hâlde katılım düşük kalırsa, engel, iletişim kesintisi değil temsil itirazıdır. Kesinti sürer ve katılım düşük kalırsa, hangi etkenin ağır bastığı bu seçimin verileriyle ayrılamayacak; bu durumda meclisin oluşumu, kendi meşruiyetine dair soruyu açık bırakarak tamamlanmış olur.", "en": "The remaining two phases will produce the only material capable of separating two readings. If services are restored and turnout stays low, the obstacle is the objection over representation rather than the communications cut. If the shutdown continues and turnout stays low, this election's own data will not separate the two factors, and the assembly will be constituted with the question of its legitimacy left open.", "refs": ["kashmir"]}]}], "sources": [{"key": "kashmir", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/pakistan-administered-kashmir-opens-polls-in-violence-wracked-vote", "title": {"tr": "Pakistan yönetimindeki Keşmir'de oylamanın ilk aşaması şiddet gölgesinde yapıldı", "en": "First phase of voting held in Pakistan-administered Kashmir amid violence"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-06", "title": {"tr": "Bir hukuki görüş neden haritayı değiştirmiyor?", "en": "Why does a legal opinion not change the map?"}, "excerpt": {"tr": "Uluslararası Adalet Divanı 2024'te işgalin sürdürülmesini hukuka aykırı buldu. İki yıl sonra hızlanan şey hukuki metin değil, çiftlik karakollarının idari statüsü.", "en": "In 2024 the International Court of Justice found the continued occupation unlawful. Two years on, what is accelerating is the administrative status of farm outposts rather than the legal text."}, "sections": [{"h": {"tr": "İki ayrı saat", "en": "Two clocks"}, "ps": [{"tr": "BM Genel Sekreteri Antonio Guterres, yerleşimlerin \"hiçbir hukuki geçerliliği bulunmadığını\" ve uluslararası hukukun \"açık bir çiğnenmesi\" olduğunu yineledi. \"Yerleşimler iki devletli çözümün ve adil, kalıcı, kapsamlı bir barışın önünde büyük bir engel olmayı sürdürüyor\" dedi. Bu değerlendirmenin dayanağı yeni değil: Uluslararası Adalet Divanı 2024'te verdiği istişari görüşte işgalin sürdürülmesini hukuka aykırı bulmuştu.", "en": "UN Secretary-General Antonio Guterres repeated that settlements have \"no legal validity\" and constitute a \"flagrant violation\" of international law. He said: \"Settlements remain a major obstacle to a two-state solution and to a just, lasting and comprehensive peace.\" The basis for that assessment is not new: in 2024 the International Court of Justice found in an advisory opinion that the continued occupation was unlawful.", "refs": ["westbank"]}, {"tr": "Aynı hafta başka bir saat işledi. Netanyahu cuma günü hükümetinin mevcut çiftlik karakollarının yasallaştırılmasını hızlandıracağını ve yenilerini kuracağını duyurdu. İki açıklama arasındaki fark yalnızca yön değil, tür farkı: biri uluslararası hukuk düzleminde bir tespit, öbürü iç planlama düzleminde bir işlem.", "en": "Another clock was running the same week. On Friday Netanyahu announced his government would accelerate the legalisation of existing farm outposts and establish new ones. The two statements differ in kind as well as in direction: one is a finding on the plane of international law, the other an act on the plane of domestic planning.", "refs": ["westbank"]}]}, {"h": {"tr": "Neden şimdi?", "en": "Why now?"}, "ps": [{"tr": "Mekanizma yasama değil idaredir. Bir karakolun yasallaştırılması, iç planlama mevzuatı içinde yürüyen bir işlemdir: izinsiz kurulmuş bir yerleşimi izinli hale getirir ve uluslararası düzlemdeki soruya hiç dokunmaz. İki saatin farkı burada belirginleşir. İdari işlemin arkasında dosyayı yürüten bir birim, bir takvim ve sahada bir müfettiş vardır; istişari görüşün arkasında bunların hiçbiri yoktur. Buna karşılık duyurunun zamanlaması yapısal değil konjonktürel olabilir: İsrail'de seçim takviminin yaklaştığı bir dönemde açıklama, planlama hattında kalıcı bir hızlanmadan çok koalisyon yönetimine dönük olabilir.", "en": "The mechanism is administrative, not legislative. Legalising an outpost is a procedure inside domestic planning law: it turns an unauthorised settlement into an authorised one and touches the international question not at all. This is where the difference between the two clocks becomes concrete. Behind the administrative act stand a unit that processes the file, a timetable and an inspector on the ground; behind the advisory opinion stands none of these. The timing may still be conjunctural rather than structural, though: with Israel's election calendar approaching, the announcement may serve coalition management more than any durable acceleration in the planning pipeline.", "refs": ["westbank"]}, {"tr": "Ölçülebilir taraf, planlama dosyalarının dışında sayılıyor. Al Jazeera'nın aktardığı OCHA verilerine göre ocak-temmuz 2026 döneminde İsrail güçleri veya yerleşimcilerce 77 Filistinli öldürüldü; bunların 18'i çocuk. Aynı dönemde Filistinlilerce üç İsrailli öldürüldü. Haberin yayımlandığı haftanın perşembesinden bu yana sekiz Filistinli ve iki İsrailli hayatını kaybetti, en az on Filistinli aile yerinden edildi. OCHA ocaktan bu yana yerleşimcilerle ilişkili 1.330'dan fazla olay saydı.", "en": "The measurable side is counted outside the planning files. OCHA figures cited by Al Jazeera record 77 Palestinians killed by Israeli forces or settlers between January and July 2026, 18 of them children, and three Israelis killed by Palestinians over the same period. Since the Thursday of the week the report was published, eight Palestinians and two Israelis have been killed and at least ten Palestinian families displaced. OCHA has counted more than 1,330 settler-related incidents since January.", "refs": ["westbank"]}]}, {"h": {"tr": "Ayrışan nokta", "en": "The disanalogy"}, "ps": [{"tr": "Sınır anlaşmazlıklarının tarihinde bir uluslararası tespitin sahadaki düzeni değiştirdiği örnekler vardır; ama bunların hemen hepsinde hattı yöneten bir makam bulunur: bir gözlem misyonu, bir tahkim komisyonu, bir mübadele takvimi. Burada ayrışan nokta budur. İstişari görüş bir hüküm değildir ve hattı yöneten bir idaresi yoktur; yerleşim dosyasını yürüten idare ise yalnızca taraflardan birine aittir. Bu yüzden önümüzdeki aylarda izlenmesi gereken şey yeni bir uluslararası metin değil, yayımlanan planlama onaylarıdır: duyurulan hızlanmanın karşılığı orada görünürse tespit ile harita arasındaki mesafe bir kez daha açılmış olacak.", "en": "The history of boundary disputes does contain cases where an international finding changed the order on the ground, but in almost all of them an authority administers the line: an observation mission, an arbitration commission, a timetable for exchange. That is the disanalogy here. An advisory opinion is not a judgment, and no administration governs the line; the administration that does process the settlement files belongs to one party only. So what should be watched in the coming months is the published planning approvals rather than any new international text: if the announced acceleration shows up there, the distance between the finding and the map will have widened once again.", "refs": ["westbank"]}]}], "sources": [{"key": "westbank", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/un-slams-israels-expansion-of-illegal-settlements-in-occupied-west-bank", "title": {"tr": "Guterres, Batı Şeria'daki yerleşim genişlemesini hukuka aykırı buldu", "en": "Guterres condemns settlement expansion in the occupied West Bank"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-01", "title": {"tr": "Gazze'ye girişi onaylayan makam değişmedi", "en": "The authority that admits the force did not change"}, "excerpt": {"tr": "Güvenlik kabinesi Uluslararası İstikrar Gücü'nün girişini onayladı. İlk kadro 200 kişi; çalışma alanı İsrail'in askerî denetimi dışında kalan bölgeler; hangi ülkenin asker göndereceğine karar verme yetkisi ise İsrail'de. Bu üç koşul bir araya geldiğinde onay, sahadaki denetimi değil sahaya kabulü düzenleyen bir kural hâline geliyor.", "en": "The security cabinet approved the entry of the International Stabilization Force. The first contingent is 200 strong; its area of work is whatever lies outside Israeli military control; and the power to decide which countries may send troops stays with Israel. Put together, those three conditions make the approval a rule about admission rather than about control on the ground."}, "sections": [{"h": {"tr": "Onaylanan metnin işlediği yer", "en": "Where the approved text operates"}, "ps": [{"tr": "İsrail güvenlik kabinesi pazar günü, Trump'ın 20 maddelik planında tanımlanan Uluslararası İstikrar Gücü'nün Gazze'ye girişini onayladı. Al Jazeera'nın aktardığı düzenlemeye göre güç, Uganda ve Fas gibi dost ülkelerden gelecek 200 personelle kurulacak, İsrail ordusuyla tam eşgüdüm içinde çalışacak ve yalnızca İsrail'in askerî denetimi dışında kalan alanlarda görev yapacak. Hangi ülkelerin asker göndereceğine İsrail karar verecek; konuşlanma tarihi açıklanmadı.", "en": "Israel's security cabinet approved on Sunday the entry into Gaza of the International Stabilization Force defined in Trump's 20-point plan. Under the arrangement reported by Al Jazeera, the force is to be built from 200 personnel drawn from friendly countries such as Uganda and Morocco, to work in full coordination with the Israeli military, and to operate only in areas outside Israeli military control. Israel will decide which countries may contribute troops, and no deployment date was given.", "refs": ["isf"]}, {"tr": "Bir kararın neyi bağladığını anlamak için hangi eylemin izne tabi olduğuna bakmak gerekir. Burada izne tabi olan şey, gücün görevi değil ülke ülke kabulüdür: katkı veren her devlet, birliğini gönderebilmek için ayrı bir onay almak zorunda. Bu yapıda güç, mandası aracılığıyla değil kendisini kabul eden makamın takdiri aracılığıyla var olur. Alternatif bir okuma da mümkün: çok uluslu konuşlandırmalarda ev sahibi devletin katkı veren ülkeleri onaylaması olağan bir kuvvet oluşturma usulüdür ve burada da yalnızca bu usul işliyor olabilir.", "en": "To see what a decision binds, look at which act requires permission. Here the permission attaches not to the force's task but to its admission, country by country: each contributing state must obtain a separate approval before it can send its unit. In that structure the force exists through the discretion of the authority that admits it rather than through its mandate. An alternative reading is available: in multinational deployments it is ordinary force-generation practice for a host state to approve contributing countries, and nothing more than that practice may be at work here.", "refs": ["isf"]}]}, {"h": {"tr": "Sayı ile harita birbirini sınırlıyor", "en": "The number and the map limit each other"}, "ps": [{"tr": "İki rakam yan yana konduğunda düzenlemenin ölçeği görünür oluyor. Al Jazeera, İsrail'in Gazze'nin yaklaşık yüzde 70'ini denetlediğini aktarıyor; gücün ilk kadrosu ise 200 kişi. Yani 200 kişilik bir birlik, toprağın geri kalanında ve yalnızca kabul edildiği ölçüde çalışacak. Bu, denetim değişikliğinden çok bir varlık göstergesidir; sahadaki fiilî yetki dağılımını değiştirmesi için kadronun da coğrafi kapsamın da büyümesi gerekir.", "en": "Two figures side by side show the scale of the arrangement. Al Jazeera reports that Israel controls about 70 percent of Gaza; the force's first contingent is 200 people. A 200-strong unit will therefore work in what remains, and only so far as it is admitted. That is closer to a presence than to a change of control; for the effective distribution of authority on the ground to shift, both the headcount and the geographic scope would have to grow.", "refs": ["isf"]}, {"tr": "Gazze Barış Kurulu genel direktörü Nickolay Mladenov onayı, istikrar ve silahsızlandırma için üzerinde anlaşılan çerçevenin kritik bir parçası olarak nitelendirdi. Bir açıklama bir pozisyonu kurar, uygulamayı değil. Bu düzenlemenin bağlayıcılık kazandığını gösterecek gözlenebilir işaret bellidir: adı açıklanmış bir katkı ülkesinin biriminin fiilen onaylanıp Gazze'de konuşlanması. Eylül sonuna kadar böyle bir birim kamuya duyurulmazsa, kararın sahadaki yetki dağılımını değil yalnızca çerçevenin sözlü kapsamını genişlettiği sonucuna varılabilir.", "en": "Nickolay Mladenov, director-general of the Gaza Board of Peace, called the approval a critical part of the agreed framework for stabilisation and demilitarisation. A statement establishes a position, not implementation. The observable sign that the arrangement has acquired binding force is specific: a named contributing country's unit actually approved and deployed inside Gaza. If no such unit is announced publicly by the end of September, the decision will have widened the framework's stated scope rather than the distribution of authority on the ground.", "refs": ["isf"]}]}], "sources": [{"key": "isf", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/israeli-government-nods-to-international-stabilisation-force-in-gaza", "title": {"tr": "İsrail güvenlik kabinesi uluslararası gücün Gazze'ye girişini onayladı", "en": "Israel's security cabinet approves the international force's entry into Gaza"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-02", "title": {"tr": "Üç aracı, iki taraf, tek ön koşul", "en": "Three mediators, two parties, one precondition"}, "excerpt": {"tr": "Umman he
