yeti Tahran'da, Katar ve Pakistan mesaj taşıyor, iki taraf ikinci gecedir ateş açmıyor. Aynı gün İran dinî lideri Mücteba Hamaney, herhangi bir anlaşmanın birincil koşulu olarak İsrail'in Lübnan'a saldırılarının mutlak ve koşulsuz biçimde sona ermesini gösterdi. Ateşin durması taraflar arasındaki seçenek kümesini henüz değiştirmiş değil.", "en": "An Omani delegation is in Tehran, Qatar and Pakistan are carrying messages, and neither side has fired for a second night. On the same day Iran's supreme leader, Mojtaba Khamenei, named an absolute and unconditional end to Israeli attacks on Lebanon as the primary condition for any agreement. The halt in fire has not yet changed the option set between the parties."}, "sections": [{"h": {"tr": "Ara verilen şeyin ölçüsü", "en": "The measure of what has paused"}, "ps": [{"tr": "İki hafta süren karşılıklı saldırıların ardından ikinci gece de vuruşma olmadı. İran ordu sözcüsü Muhammed Ekraminia misilleme operasyonlarının durdurulduğunu açıkladı; ABD'nin BM Daimi Temsilcisi Mike Waltz, Başkan Trump'ın görüşmelere biraz alan tanıdığını söyledi. Umman heyeti Tahran'da; İran Dışişleri sözcüsü İsmail Bakai'ye göre Katar ve Pakistan da mesaj taşıyor. Hürmüz'deki geçiş trafiğine ilişkin teknik ve siyasi istişarelerde ilerleme kaydedildiği bildirildi.", "en": "After two weeks of exchanges, a second night passed without strikes. Iran's army spokesman, Mohammad Akraminia, announced that retaliatory operations had been halted; Mike Waltz, the US ambassador to the United Nations, said President Trump was giving talks a little room. An Omani delegation is in Tehran, and Iran's foreign ministry spokesman, Esmaeil Baghaei, said Qatar and Pakistan were carrying messages too. Progress was reported in technical and political consultations on traffic through Hormuz.", "refs": ["pause"]}, {"tr": "Bir aranın müzakere değeri, geri alınmasının maliyetiyle ölçülür. Burada imzalanmış bir metin, ilan edilmiş bir takvim ya da adı konmuş bir izleme düzeneği yok; dolayısıyla saldırıların yeniden başlaması hiçbir tarafa hukuki bir bedel yüklemiyor. Değişen, tarafların elindeki seçenekler değil temasın kanalı. Bunun tek açıklaması diplomasi de olmayabilir: New York Times, Trump'ın tırmandırma planlarını füze önleyici stoklarına ilişkin kaygı nedeniyle beklettiğini bildirdi; doğrulanırsa ara, masanın değil ikmalin ürünü sayılır.", "en": "The bargaining value of a pause is measured by the cost of undoing it. Here there is no signed text, no announced timetable and no named monitoring arrangement, so a resumption of strikes imposes no legal cost on either side. What has changed is the channel of contact, not the options available to the parties. Diplomacy need not be the only explanation: the New York Times reported that Trump held back escalation plans over concern about interceptor stocks, and if that account holds, the pause is a product of resupply rather than of the table.", "refs": ["pause"]}]}, {"h": {"tr": "Koşulu koyan taraf odada değil", "en": "The party setting the condition is not in the room"}, "ps": [{"tr": "Aynı gün Tahran, pazarlığın kapsamını genişletti. İran dinî lideri Mücteba Hamaney X'te yayımladığı mesajda, Lübnan'ın toprak bütünlüğünün korunmasını ve saldırıların mutlak, koşulsuz biçimde sona ermesini herhangi bir anlaşmanın birincil koşulu olarak tanımladı; Hizbullah'ın savunulmasını İran'ın stratejik görevi saydı. Aynı koşul haziranda imzalanan ve Hürmüz anlaşmazlığı yüzünden geçerliliğini yitiren mutabakatta da vardı. 26 Haziran'da ABD arabuluculuğuyla varılan Lübnan çerçevesi aşamalı çekilme öngörüyor, takvim içermiyor ve Hizbullah bu çerçeveyi reddetti.", "en": "On the same day Tehran widened the scope of the bargain. In a post on X, Iran's supreme leader, Mojtaba Khamenei, described preserving Lebanon's territorial integrity and an absolute, unconditional end to the attacks as the primary condition for any agreement, and called the defence of Hezbollah Iran's strategic mandate. The same condition appeared in the June memorandum that has since lapsed over the Hormuz dispute. The US-mediated Lebanon framework of 26 June provides for a phased withdrawal, sets no timetable, and was rejected by Hezbollah.", "refs": ["khamenei"]}, {"tr": "Bu ön koşul, ABD-İran hattındaki uzlaşmayı üçüncü bir cephedeki davranışa bağlıyor. Sonuç, kimin bozabileceğine dair haritayı değiştiriyor: masadaki iki taraf anlaşsa bile, çerçeveyi reddetmiş bir aktörün Lübnan'daki hareketi anlaşmayı geçersiz kılabilir. Karşı okuma da ciddiye alınmalı; ön koşul, aynı zamanda Tahran'ın masadan kalkmadan zaman kazanmasını sağlayan bir dış seçenek işlevi görebilir ve bu durumda işlevi bağlamak değil erteleme hakkını saklı tutmaktır.", "en": "That precondition ties agreement on the US-Iran track to conduct in a third theatre. The effect is to redraw the map of who can spoil: even if the two parties at the table agree, movement in Lebanon by an actor that has rejected the framework could void the bargain. The counter-reading deserves weight too; the precondition can also serve as an outside option that lets Tehran buy time without leaving the table, in which case its function is to reserve the right to defer rather than to bind.", "refs": ["khamenei", "pause"]}]}, {"h": {"tr": "Dengenin ölçüleceği yer", "en": "Where a balance would become measurable"}, "ps": [{"tr": "Bu süreçte gözlenebilir eşik, sözlerin değil belgenin düzeyinde. Hürmüz geçiş trafiğine ilişkin görüşmeler eylül sonuna kadar tarafların kabul ettiği, yayımlanmış ve bir izleme merciini adıyla anan bir düzenleme üretirse, temas bir taahhüde dönüşmüş olur. Böyle bir metin çıkmazsa, aracıların sayısı arttıkça sürecin ilerlediği izlenimi güçlense de taraflar arasındaki seçenek kümesi aynı kalmış olacaktır.", "en": "The observable threshold in this process sits at the level of a document rather than of statements. If the talks on Hormuz traffic produce, by the end of September, a published arrangement accepted by the parties and naming a monitoring body, contact will have become a commitment. If no such text emerges, then however strongly a growing number of mediators suggests movement, the option set between the parties will have stayed where it was.", "refs": ["pause"]}]}], "sources": [{"key": "pause", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/us-and-iran-hit-pause-on-strikes-for-second-day", "title": {"tr": "ABD ile İran karşılıklı saldırılara ikinci gün de ara verdi", "en": "US and Iran hold off on strikes for a second day"}, "publishedDate": "2026-07-26"}, {"key": "khamenei", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/us-iran-peace-deal-depends-on-israel-leaving-lebanon-says-khamenei", "title": {"tr": "Hamaney, ABD'yle anlaşmanın ön koşulu olarak İsrail'in Lübnan saldırılarının bitmesini gösterdi", "en": "Khamenei makes an end to Israeli attacks on Lebanon the precondition for a deal with Washington"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-03", "title": {"tr": "Savunulan hattın maliyeti kime yazılıyor?", "en": "Who pays for the line that was defended?"}, "excerpt": {"tr": "Romanya üç günde üç insansız hava aracını düşürdü. Bu, ilan edilmiş değil savunulan bir hattır. Ancak maliyet, sarf malzemesi sayılabilecek bir gövdeye yükleniyor; onu gönderen tarafa değil. Caydırıcılığın ölçüsü, düşürme sayısı değil gönderme sıklığının değişip değişmediğidir.", "en": "Romania has downed three drones in three days. That is a line defended, not merely announced. The cost, however, falls on an airframe that can be treated as expendable, not on the party that launched it. The measure of deterrence is whether the rate of launches changes, rather than how many interceptions succeed."}, "sections": [{"h": {"tr": "Üç gün, üç müdahale", "en": "Three days, three interceptions"}, "ps": [{"tr": "Romanya Savunma Bakanlığı, pazar sabahı hava sahasına giren bir aracın düşürüldüğünü bildirdi; müdahaleyi Karadeniz üzerinde bir F-16 yaptı. Cuma ve cumartesi günü de birer araç engellenmişti. Cumhurbaşkanı Nicusor Dan, cuma günü düşürülen aracın Rusya Federasyonu'nun Ukrayna'ya yönelik savaşında kullandığı Şahid tipi olduğunu doğruladı. Rusya Savunma Bakanlığı ise gece boyunca 133 Ukrayna insansız hava aracını vurduğunu açıkladı.", "en": "Romania's defence ministry said an aircraft that entered its airspace on Sunday morning had been shot down, with an F-16 making the interception over the Black Sea. One aircraft had been stopped on Friday and another on Saturday. President Nicusor Dan confirmed that the one downed on Friday was a Shahed model used by the Russian Federation in its war against Ukraine. Russia's defence ministry said it had struck 133 Ukrainian drones overnight.", "refs": ["romania"]}, {"tr": "Üç gün üst üste düşürme, tatbikat düzeyinde bir sonuçtur: uyarı, tanımlama ve angajman zinciri işliyor. Ancak zincirin ucundaki hedef ucuz ve yenilenebilir. Bu yüzden düşürme, karşı tarafa bir bedel yüklemekten çok bir kabiliyeti gösterir. Bir başka açıklama da dışlanamaz; ihlaller, Ukrayna hedeflerine yönelik saldırıların taşmasından ya da rota hatasından kaynaklanıyor olabilir ve Moskova'nın gece boyunca Ukrayna insansız hava araçlarını vurduğu yönündeki açıklaması bu okumayı destekler.", "en": "Three interceptions on three consecutive days is a result at the drill level: the chain of warning, identification and engagement is working. But the target at the end of that chain is cheap and replaceable. An interception therefore demonstrates a capability more than it imposes a cost on the other side. Another explanation cannot be ruled out: the violations may come from spillover of strikes against Ukrainian targets or from navigation error, and Moscow's account of hitting Ukrainian drones through the night supports that reading.", "refs": ["romania"]}]}, {"h": {"tr": "Maliyet nereye yükleniyor", "en": "Where the cost lands"}, "ps": [{"tr": "Bükreş'in yanıtı iki katmanlı. Askerî katmanda hat savunuluyor. Siyasi katmanda ise Dışişleri Bakanı Oana Toiu tekrarlanan ihlaller nedeniyle Rusya büyükelçisini bakanlığa çağırdı; ABD Kara Kuvvetleri Albayı Martin O'Donnell ihlallerin sürmesini kabul edilemez ve tahammül edilemez buldu; NATO Genel Sekreteri Mark Rutte Moskova'nın davranışını hepimiz için tehlike olarak niteledi. Bunların hiçbiri gönderen tarafa ölçülebilir bir masraf çıkarmıyor.", "en": "Bucharest's answer has two layers. On the military layer the line is defended. On the political layer Foreign Minister Oana Toiu summoned Russia's ambassador over the repeated violations; US Army Colonel Martin O'Donnell called the continued violations unacceptable and intolerable; NATO Secretary-General Mark Rutte described Moscow's conduct as a danger to us all. None of that produces a measurable expense for the party doing the launching.", "refs": ["romania"]}, {"tr": "Bu yüzden sınırlı ve tekrarlanan müdahalenin bir sınır mı öğrettiği yoksa ihlali olağanlaştırdığı mı sorusu açık kalıyor ve yanıtı gönderme sıklığı verecek. Gözlenecek işaret, düşürme haberlerinin sayısı değil: Romanya'nın angajman kurallarını kalıcı biçimde değiştirdiğini duyurması ya da müttefiklerin ülkeye ek hava savunma unsuru konuşlandırması, savunmanın maliyetinin taşındığı anlamına gelir. Ekim sonuna kadar bu iki adımdan biri atılmaz ve ihlaller sürerse, üç günlük başarı bir caydırıcılık değişikliği olarak sayılamaz.", "en": "The question of whether limited, repeated interception teaches a limit or normalises the violation therefore stays open, and the rate of launches will answer it. The sign to watch is not the count of interception reports: a Romanian announcement of a durable change to its rules of engagement, or the deployment of additional allied air-defence assets to the country, would mean the cost of defending has been shifted. If neither step is taken by the end of October and the violations continue, the three-day success cannot be counted as a change in deterrence.", "refs": ["romania"]}]}], "sources": [{"key": "romania", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/romania-summons-russian-envoy-as-it-shoots-down-third-intruding-drone", "title": {"tr": "Romanya üç günde üçüncü insansız hava aracını düşürdü, Rus büyükelçiyi bakanlığa çağırdı", "en": "Romania downs a third drone in three days and summons Russia's ambassador"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-04", "title": {"tr": "Yakıt, ödeme ve uçuş aynı anda kesilince", "en": "When fuel, payment and flights are cut at once"}, "excerpt": {"tr": "Küba'ya uygulanan petrol ambargosu 29 Ocak'tan bu yana yürürlükte. Aynı dönemde Visa ve Mastercard ödeme hattını, Air Canada ile Air France uçuşları, Meliá otel kapasitesini geri çekti. Bir ambargonun ısırıp ısırmadığını belirleyen şey ilanı değil, yakıt, ödeme ve ulaşımın aynı anda kapanıp kapanmadığıdır.", "en": "The oil embargo on Cuba has been in force since 29 January. Over the same period Visa and Mastercard withdrew the payment channel, Air Canada and Air France withdrew flights, and Meliá withdrew hotel capacity. What decides whether an embargo bites is the simultaneous closing of fuel, payment and transport, rather than the announcement itself."}, "sections": [{"h": {"tr": "Üç kanal, tek ada", "en": "Three channels, one island"}, "ps": [{"tr": "Washington 29 Ocak 2026'da Küba'ya petrol ambargosu uyguladı. Al Jazeera'nın aktardığına göre o tarihten bu yana günde 20 saati aşan elektrik kesintileri yaşanıyor; çalışma günleri kısaldı, sanayi üretimi durdu, su ve ilaç sıkıntısı derinleşti. Aynı haberde Visa, Mastercard, Meliá otelleri, Air Canada ve Air France'ın ülkeden çekildiği bildiriliyor.", "en": "Washington imposed an oil embargo on Cuba on 29 January 2026. Al Jazeera reports that since then blackouts have exceeded 20 hours a day, working days have been shortened, industrial production has stopped, and shortages of water and medicine have deepened. The same report records the withdrawal of Visa, Mastercard, the Meliá hotel group, Air Canada and Air France.", "refs": ["cuba"]}, {"tr": "Bu liste tek bir yaptırım kalemi değil, üç ayrı halkadır. Petrol, üretimin girdisidir. Kart ağları, turizmden ve havalelerden gelen dövizin geçiş noktasıdır. Havayolları ve otel kapasitesi ise o dövizi getiren yolcuyu taşır. Üçü aynı anda kapandığında ada, birini ikame etmek için gereken parayı diğerinden elde edemez hâle gelir.", "en": "That list covers three separate links rather than a single sanctions line item. Oil is the input to production. The card networks are the crossing point for the hard currency that comes from tourism and remittances. Airlines and hotel capacity carry the passengers who bring that currency in. When all three close at once, the island can no longer earn from one what it needs to substitute for another.", "refs": ["cuba"]}]}, {"h": {"tr": "İkamenin çalışmadığı yer", "en": "Where substitution fails"}, "ps": [{"tr": "Kara sınırı olan bir ülkede kısıtlanan mal komşudan dolanır; maliyet artar, akış sürer. Adada bu dolanma yolu deniz ve hava taşımacılığından geçer ve her ikisi de sigortacı, kart ağı ve tarifeli sefer gerektirir. Yani ambargoyu etkili kılan, malın yasaklanmış olması değil finansman, sigorta ve fiziki hattın aynı anda denetlenmesidir. Karşı okuma yabana atılamaz: Küba'nın elektrik altyapısı ambargodan önce de arızalıydı ve mevcut kaynaklar, kesintilerin ne kadarının eskimiş santrallerden ne kadarının yakıt yokluğundan geldiğini ayıracak veriyi vermiyor.", "en": "In a country with a land border, a restricted good detours through a neighbour; cost rises and the flow continues. On an island that detour runs through sea and air transport, and both require an insurer, a card network and a scheduled service. What makes the embargo effective, then, is the joint control of finance, insurance and the physical route, rather than the prohibition of a good. The counter-reading cannot be waved away: Cuba's electricity infrastructure was already failing before the embargo, and the available sources do not separate how much of the outage time comes from ageing plants and how much from the absence of fuel.", "refs": ["cuba"]}, {"tr": "Ölçülebilir tek büyüklük şimdilik günlük kesinti süresi. Küba yeni bir yakıt tedarik anlaşması duyurur ya da bir kart ağı hizmetini yeniden açarsa, bu sürenin aralık bitmeden günde 20 saatin altına inmesi beklenir; üç halkadan hiçbiri açılmadığı hâlde süre kalıcı olarak gerilerse, kesintilerin ana nedeninin yakıt olmadığı sonucu çıkar. Devlet Başkanı Miguel Diaz-Canel'in Pinar del Rio'da ABD'yi soykırım politikasıyla suçlaması ise bu mekanizmayı değiştirmez; siyasi bir konumu kaydeder.", "en": "The one measurable quantity for now is daily outage time. If Cuba announces a new fuel supply agreement or a card network restores service, that time should fall below 20 hours a day before the end of December; if it declines durably while none of the three links reopens, the main driver of the outages is not fuel. President Miguel Díaz-Canel's accusation in Pinar del Río that the United States is pursuing a policy of genocide does not change this mechanism; it registers a political position.", "refs": ["cuba"]}]}], "sources": [{"key": "cuba", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/cuban-president-accuses-us-of-genocide-seeking-takeover", "title": {"tr": "Küba Devlet Başkanı, ABD'yi soykırım politikası izlemekle suçladı", "en": "Cuba's president accuses the US of pursuing a policy of genocide"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-05", "title": {"tr": "Af ABD'de geçerli, dava Tegucigalpa'da", "en": "The pardon holds in Washington; the case sits in Tegucigalpa"}, "excerpt": {"tr": "Juan Orlando Hernandez pazar günü Honduras'a döndü ve gözaltına alınmadı. Bunu belirleyen, Trump'ın aralık ayındaki affı değil; haziranda Honduras'ta yakalama kararının askıya alınmasıydı. Kararı veren merci ile 3 Ağustos'ta yargılamayı yürütecek merci aynı ülkenin kurumları.", "en": "Juan Orlando Hernández returned to Honduras on Sunday and was not detained. What decided that was not Trump's pardon in December but the suspension of an arrest warrant in Honduras in June. The body that took that decision and the body that will run the trial on 3 August belong to the same country's institutions."}, "sections": [{"h": {"tr": "Havalimanındaki kararın sahibi", "en": "Who owns the decision at the airport"}, "ps": [{"tr": "Hernandez, ABD'ye iade edilmesinin üzerinden dört yıl geçtikten sonra ülkesine döndü. ABD'de uyuşturucu kaçakçılığından 45 yıl hapis cezası almıştı; Trump Aralık 2025'te af çıkarırken adil yargılanmadığını ve Joe Biden yönetimince tuzağa düşürüldüğünü savundu. Al Jazeera'ya göre haziran 2026'da yakalama kararı askıya alındığı için Hernandez ülkeye girişte gözaltına alınmadı.", "en": "Hernández returned four years after his extradition to the United States. He had been sentenced there to 45 years for drug trafficking; in pardoning him in December 2025 Trump argued that he did not receive a fair trial and had been set up by Joe Biden's administration. Al Jazeera reports that because an arrest warrant was suspended in June 2026, Hernández was not detained on arrival.", "refs": ["honduras"]}, {"tr": "Af, ABD'deki mahkûmiyeti ortadan kaldırır ve orada biter. Honduras'ta ne olacağını belirleyen ise ulusal bir yargı kararıydı. Bu ayrımı vurgulamak gerekiyor; çünkü olay çoğunlukla Washington'ın bir hamlesi olarak okunuyor. Oysa uçaktan inen kişinin serbest yürüyebilmesini sağlayan işlem, dört ay önce Tegucigalpa'da alınmıştı. Elbette bu, dış etkinin yokluğu anlamına gelmez; affın yarattığı siyasi ortam yerel kararın hazırlayıcısı olabilir. Ancak yetkiyi kullanan merci yerel kaldı.", "en": "A pardon extinguishes the conviction in the United States and stops there. What happens in Honduras was settled by a national judicial decision. The distinction is worth pressing, because the episode is mostly read as a move by Washington. The act that let the man walk out of the airport was taken four months earlier in Tegucigalpa. That does not mean external influence was absent; the political climate created by the pardon may have prepared the local decision. But the authority exercised remained local.", "refs": ["honduras"]}]}, {"h": {"tr": "3 Ağustos'un ölçtüğü şey", "en": "What 3 August will measure"}, "ps": [{"tr": "Hernandez'in 3 Ağustos'ta dolandırıcılık ve kara para aklama suçlamalarıyla yargılanması bekleniyor. İnsan hakları avukatı Joaquin Mejia, kendisine hapis dışı tedbirler uygulanıp ardından sorunsuz biçimde serbest kalmasının beklendiğini söyleyerek yargılamanın göstermelik kalmasından kaygı duyduğunu belirtti. Bu bir değerlendirmedir, bir tespit değil. Hernandez 2014-2022 arasında ülkeyi yönetti; Pandora Belgeleri incelemesinde yaklaşık 11 milyon dolar tutarında kamu kaynağını siyasi kampanyalara aktardığı isnat edildi ve bu isnat mahkeme kararıyla sabit değil.", "en": "Hernández is due to stand trial on 3 August on fraud and money-laundering charges. The human rights lawyer Joaquín Mejía said he feared the proceedings would be cosmetic, expecting alternative measures to imprisonment to be applied and the matter then to end without difficulty for the defendant. That is an assessment, not a finding. Hernández governed the country from 2014 to 2022; a Pandora Papers investigation accused him of diverting nearly 11 million dollars in state funds to political campaigns, and that accusation has not been established by a court.", "refs": ["honduras"]}, {"tr": "Buradaki asıl soru, bir devletin dışarıdan gelen bir af karşısında kendi hesap sorma kapasitesini koruyup koruyamadığıdır ve yanıtı bir söylem değil bir takvim verecek. Ağustos sonuna kadar duruşmanın açılıp açılmadığı, tutukluluk yerine hangi tedbirlere hükmedildiği ve bir sonraki celse tarihinin belirlenip belirlenmediği kamuya açık bilgiler. Yargılama ertelenir ya da dosya düşerse, dönüşü mümkün kılan yerel kararın hesap sorma değil koruma işlevi gördüğü sonucuna varılabilir.", "en": "The real question is whether a state preserves its own capacity to hold a former leader to account in the face of a pardon granted abroad, and a calendar rather than rhetoric will answer it. Whether a hearing opens by the end of August, which measures are ordered in place of detention, and whether a date for the next session is fixed are all matters of public information. If the trial is postponed or the file is dropped, the local decision that made the return possible will have served protection rather than accountability.", "refs": ["honduras"]}]}], "sources": [{"key": "honduras", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/former-president-hernandez-returns-to-honduras-after-trump-pardon", "title": {"tr": "Eski Devlet Başkanı Hernandez, Trump'ın affının ardından Honduras'a döndü", "en": "Former president Hernández returns to Honduras after Trump's pardon"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-06", "title": {"tr": "1974 metnini kim uyguluyor?", "en": "Who enforces the 1974 text?"}, "excerpt": {"tr": "Suriye devlet ajansı SANA'ya göre İsrail birlikleri pazar günü güneybatıdaki köylere ilerleyip El-Arda'da bir kontrol noktası kurdu. Aynı gün Şam'daki BM Genel Sekreteri, 1974 Kuvvetleri Ayırma Anlaşması'na aykırı davranışların sona ermesini istedi ve ay bitmeden Güvenlik Konseyi'ne rapor sunulacağını duyurdu. Bir hattın geleceğini belirleyen şey, metnin yaşı değil onu kimin yürüttüğüdür.", "en": "Syria's state news agency SANA said Israeli troops advanced towards villages in the south-west on Sunday and set up a checkpoint at Al-Ardah. On the same day the UN secretary-general, in Damascus, demanded an end to conduct contrary to the 1974 Disengagement of Forces Agreement and announced that a report would go to the Security Council before the month was out. What decides a line's future is who administers it, rather than the age of the text."}, "sections": [{"h": {"tr": "Uçuş değil, kontrol noktası", "en": "Not an overflight but a checkpoint"}, "ps": [{"tr": "Suriye devlet ajansı SANA, İsrail güçlerinin pazar günü güneybatıdaki köylere doğru ilerlediğini, El-Arda'da bir kontrol noktası kurduğunu ve yakınlarda topçu atışı yapıldığını bildirdi. Suriye Dışişleri Bakanı Esad Hasan eş-Şeybani çekilme çağrısı yaparak operasyonları bölgenin güvenliğine doğrudan tehdit olarak niteledi. Al Jazeera'nın haberinde can kaybı bildirilmedi.", "en": "Syria's state news agency SANA said Israeli forces advanced towards villages in the south-west on Sunday and set up a checkpoint at Al-Ardah, with shelling heard nearby. Syria's foreign minister, Asaad Hassan al-Shaibani, called for a withdrawal and described the operations as a direct threat to the region's security. Al Jazeera's report gave no casualty figures.", "refs": ["syria"]}, {"tr": "Bu savın önceki bölümü dün bu köşede kurulmuştu: 1974 düzenlemesi elli iki yıl, metnin bağlayıcılığından çok her iki yakadaki otoritelerin öngörülebilirliği tercih etmesi sayesinde ayakta kaldı. Bugünkü gelişme o savı bir adım ileri taşıyor. Hava sahasından geçen bir uçuş geri alınabilir bir eylemdir; toprak üzerinde kurulan bir kontrol noktası ise fiilî bir idare işlemidir. Aradaki fark, ihlalin süresine ilişkindir ve bir sınır düzenlemesinin aşınması tam da bu noktada başlar.", "en": "The previous chapter of this argument was set out in this column yesterday: the 1974 arrangement stood for fifty-two years less through the binding force of its text than because the authorities on both sides preferred predictability. Today's development pushes that argument one step further. A flight through airspace is a reversible act; a checkpoint established on the ground is an act of de facto administration. The difference concerns how long a breach lasts, and it is precisely there that a boundary arrangement begins to erode.", "refs": ["syria", "haldun-golan"]}]}, {"h": {"tr": "Yürütmesi olmayan bir düzenleme", "en": "An arrangement without an executor"}, "ps": [{"tr": "Şam'daki Antonio Guterres, Suriye'nin egemenliğine, bağımsızlığına, birliğine ve toprak bütünlüğüne tam olarak saygı gösterilmesi gerektiğini söyledi; İsrail'in 1974 anlaşmasına aykırı davranışlarını kabul edilemez bularak sona ermesini istedi ve BM'nin ay bitmeden Güvenlik Konseyi'ne kapsamlı bir rapor sunacağını duyurdu. Ayrıca Suriye'ye yönelik tüm yaptırımların derhal kaldırılmasını istedi.", "en": "In Damascus, Antonio Guterres said Syria's sovereignty, independence, unity and territorial integrity must be fully respected, called Israel's conduct contrary to the 1974 agreement unacceptable and demanded that it stop, and announced that the UN would submit a comprehensive report to the Security Council before the end of the month. He also called for the immediate removal of all sanctions on Syria.", "refs": ["syria"]}, {"tr": "Bir ihlali adlandırmak ile onu durdurmak farklı yetkilerdir. Güvenlik Konseyi'ne sunulacak rapor belgeleme aracıdır; bir düzenlemeyi ancak Konsey'in üzerinde uzlaşabildiği ölçüde yürütmeye dönüşür. 1974 metninin bugün karşılaştığı sorun eskimesi değil, aykırılığı tespit edenle onu giderebilecek olanın aynı merci olmamasıdır. Buradaki benzemezlik de önemli: 1974'te hat, iki tarafın da korumak istediği bir statükoyu çiziyordu; bugün Cumhurbaşkanı Ahmed eş-Şara, işgal altındaki Golan'a ilişkin talebinden vazgeçmeden İsrail'le bir güvenlik anlaşması aradığını söylüyor. Yani hat yalnızca ihlal edilmiyor, aynı zamanda yeniden pazarlığa açılıyor. Ay sonuna kadar sunulacağı duyurulan raporun ardından Güvenlik Konseyi'nin bir metin üzerinde uzlaşıp uzlaşmadığı, düzenlemenin hangi yönde çözüleceğini gösterecek ilk somut işaret olacak.", "en": "Naming a breach and stopping it are different powers. A report to the Security Council is an instrument of documentation; it becomes an instrument of execution only so far as the Council can agree on it. The problem the 1974 text faces today lies less in its age than in the gap between the body identifying the breach and the body able to end it. The disanalogy matters as well: in 1974 the line drew a status quo both sides wished to preserve, whereas President Ahmed al-Sharaa now says Damascus is seeking a security agreement with Israel without giving up its claim to the occupied Golan Heights. The line is being reopened for negotiation as well as breached. Whether the Council agrees on a text after the report announced for the end of the month will be the first concrete sign of which way the arrangement comes apart.", "refs": ["syria"]}]}], "sources": [{"key": "syria", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/israel-launches-military-incursion-into-syria-amid-un-condemnation", "title": {"tr": "İsrail güçleri Suriye'nin güneybatısında ilerledi, Guterres Şam'dan tepki gösterdi", "en": "Israeli forces push into south-western Syria as Guterres objects from Damascus"}, "publishedDate": "2026-07-26"}, {"key": "haldun-golan", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-06/2026-07-26/", "title": {"tr": "Elli iki yıl dayanan hattın yeni komşusu", "en": "The new neighbour of a line that held for fifty-two years"}, "publishedDate": "2026-07-26"}], "date": "2026-07-27"}, {"writer": "geo-01", "title": {"tr": "Brasilia vizeyi reddetti, ziyaret takvimde kaldı", "en": "Brasilia refused the visas; the visit stayed on the calendar"}, "excerpt": {"tr": "Vize verme, gerekçe yayımlama zorunluluğu olmayan ve başvuran devletin itiraz edemeyeceği takdire bağlı bir idari yetkidir. Brezilya bu yetkiyi iki ABD'li yetkiliye karşı kullandı; Washington aynı ziyareti “rutin” diye tanımlamayı sürdürdü. Aracın gerçekte neyi bağladığı, 27-30 Temmuz penceresinde görülecek.", "en": "Issuing a visa is a discretionary administrative power that requires no published reasons and that the applicant state cannot appeal. Brazil used that power against two US officials; Washington went on describing the same trip as “routine”. What the instrument actually binds will be visible in the 27-30 July window."}, "sources": [{"key": "brazil-visa", "kind": "news", "name": "Arab News", "url": "https://www.arabnews.com/node/2652314/world", "title": {"tr": "Brezilya, seçim görüşmeleri için gelmek isteyen ABD'li yetkililere vize vermedi", "en": "Brazil denies visas for US officials seeking election talks"}, "publishedDate": "2026-07-26"}], "sections": [{"h": {"tr": "Hangi yetki, neyi kapatıyor?", "en": "Which power closes what"}, "ps": [{"refs": ["brazil-visa"], "tr": "Brezilya, iki ABD'li yetkilinin 20 Temmuz'da yaptığı vize başvurusunu reddetti; bir diplomatik kaynak gerekçe olarak “siyasi istismar riskini” gösterdi. Reddedilen program belirsiz değildi: 27-30 Temmuz'da Brasilia'da seçim bütünlüğü, din özgürlüğü ve ifade özgürlüğü başlıklarında görüşmeler yapılacaktı. Kullanılan aracın türü burada belirleyicidir. Vize verme, ev sahibi devletin takdirine bırakılmış bir idari işlemdir; bir bulgu, bir duruşma ya da yayımlanmış bir gerekçe gerektirmez ve başvuran devlet açısından itiraz edilebilir bir karar değildir. Yani Brasilia, kanıt üretmek zorunda olmadığı tek kaldıraca başvurdu.", "en": "Brazil refused the visa applications the two US officials filed on 20 July, with a diplomatic source citing a “risk of political exploitation”. The programme refused was not vague: from 27 to 30 July there were to be meetings in Brasilia on election integrity, religious freedom and freedom of expression. The type of instrument used is what matters here. Issuing a visa is an administrative act left to the host state's discretion; it requires no finding, no hearing and no published reasons, and it is not a decision the applicant state can appeal. Brasilia reached for the one lever on which it owes no evidence."}, {"refs": ["brazil-visa"], "tr": "Bu yetkinin menzili de kendi türü kadar dardır. Ret, adı geçen iki yetkilinin o pencerede ülkeye girişini kapatır; görüşülecek başlıkları gündemden düşürmez. Büyükelçilik kanalı, video bağlantısı, başka düzeyde bir heyet ya da ertelenmiş bir takvim aynı konuları aynı muhataplara taşımaya devam edebilir. Bunun bir karşı okuması var: ret, esas olarak görüşmeleri engellemek için değil, iç kamuoyuna bir sınır çizmek için seçilmiş olabilir; o durumda aracın dar menzili bir kusur değil, tercih edilen özelliktir.", "en": "The reach of that power is as narrow as its type. The refusal closes entry for those two named officials in that window; it does not remove the subjects from the agenda. An embassy channel, a video link, a delegation at another level or a postponed calendar can carry the same topics to the same counterparts. There is a rival reading: the refusal may have been chosen less to block the meetings than to draw a line for a domestic audience, in which case the instrument's narrow reach counts as the preferred feature rather than a defect."}]}, {"h": {"tr": "İki açıklama, tek pencere", "en": "Two statements, one window"}, "ps": [{"refs": ["brazil-visa"], "tr": "Aynı seyahat hakkında iki resmî anlatım dolaşıma girdi. Brezilya tarafı girişi kapattığını bildiriyor; ABD Dışişleri Bakanlığı sözcüsü ise ziyaretin “rutin” olduğunu söylüyor ve bir seçimi baltalama “oyunu” imasını “temelsiz bir yalan” olarak nitelendiriyor. Bu iki cümle birbiriyle doğrudan çelişmiyor, çünkü farklı şeylerden söz ediyorlar: biri bir idari işlemi, diğeri bir niyeti anlatıyor. Bir yetkinin gücü de tam bu aralıkta ölçülür; ilan edildiği anda değil, karşı tarafın davranışını değiştirip değiştirmediğinde.", "en": "Two official accounts of the same trip are in circulation. The Brazilian side reports that it has closed entry; a US State Department spokesperson says the visit was “routine” and calls any insinuation of a “ploy” to undermine an election “a baseless lie”. The two sentences do not directly contradict each other, because they describe different things: one an administrative act, the other an intention. The force of a power is measured in exactly that gap — not when it is announced, but in whether it changes the other side's behaviour."}, {"refs": ["brazil-visa"], "tr": "Bu nedenle ölçülebilir bir sınama var. 27-30 Temmuz penceresinde Brasilia'daki program yapılmazsa ve yerine başka bir biçim duyurulmazsa, ret uygulamada bağlamış olur. Görüşmeler büyükelçilik üzerinden ya da başka bir düzeyde gerçekleşirse, işlem bir pozisyonu tescil etmiş ama erişimi değiştirmemiş olur. Seçim üç aydan kısa süre içinde yapılacağı için ikinci ihtimalde asıl soru vize değil, hangi kanalın kurumsal ağırlık taşıdığıdır.", "en": "That yields a measurable test. If the Brasilia programme does not take place in the 27-30 July window and no replacement format is announced, the refusal will have bound in practice. If the meetings happen through the embassy or at another level, the act will have registered a position without changing access. Since the election is less than three months away, in the second case the real question concerns which channel carries institutional weight rather than the visa."}]}], "date": "2026-07-26"}, {"writer": "geo-02", "title": {"tr": "Bir dondurma önerisinde garantör kim?", "en": "Who is the guarantor in a proposal to freeze?"}, "excerpt": {"tr": "Tokayev, Omsk'ta Putin'in yanında savaşın dondurulmasını ve “İstanbul formülü 2.0”a dönülmesini önerdi; garantörler arasında Rusya'yı da saydı. Öneri bir biçim adı ve bir garantör listesi getiriyor. Ama tarafın aynı zamanda garantör olduğu bir mimaride güvenceyi ayakta tutacak şey, bağımsız bir gözlem mekanizmasıdır.", "en": "In Omsk, standing beside Putin, Tokayev proposed freezing the war and returning to the “Istanbul formula 2.0”, counting Russia among the guarantors. The proposal supplies the name of a format and a list of guarantors. But in an architecture where a party is also a guarantor, what holds the assurance up is an independent monitoring mechanism."}, "sources": [{"key": "tokayev", "kind": "news", "name": "Asharq Al-Awsat", "url": "https://english.aawsat.com/world/5299983-speaking-alongside-putin-kazakh-president-calls-freeze-ukraine-war", "title": {"tr": "Kazakistan Cumhurbaşkanı, Putin'in yanında Ukrayna savaşının dondurulmasını istedi", "en": "Speaking alongside Putin, Kazakhstan's president calls for a freeze in the Ukraine war"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "Kürsüde söylenen", "en": "What was said from the platform"}, "ps": [{"refs": ["tokayev"], "tr": "Tokayev, 25 Temmuz'da Omsk'ta toplanan Rusya-Kazakistan Bölgeler Arası İşbirliği Forumu'nda, “belki de bu çatışmayı dondurup İstanbul formülü 2.0'a dönmenin zamanı geldi” dedi ve güvenceleri “Rusya dahil büyük güçlerin güvenlik garantileri” olarak tarif etti. Aynı konuşmada Putin'in “azami diplomatik esneklik” gösterdiğini belirtti ve “buna bir son verilmeli” diye ekledi. Bir kefede: Moskova'nın en yakın ortaklarından birinin, ev sahibinin yanında ve alenen bir bitiş biçimi adlandırması. Öbür kefede: bu sözlerin bir taahhüde değil, bir öneriye ait olması.", "en": "At the Russia-Kazakhstan Interregional Cooperation Forum in Omsk on 25 July, Tokayev said “perhaps it is time to freeze this conflict and return to the Istanbul formula 2.0”, describing the assurances as “security guarantees from the great powers, including Russia”. In the same remarks he said Putin had shown “utmost diplomatic flexibility” and added that “this must be brought to an end”. On one side of the scale: one of Moscow's closest partners naming a form of ending, publicly, beside the host. On the other: those words belong to a proposal, not to a commitment."}, {"refs": ["tokayev"], "tr": "Bu çerçeveyi yeniden çağıran Tokayev, onun geçmişini de devralıyor. Habere göre Moskova ile Kiev, 2022 işgalinin ardından İstanbul'da görüşmüş, 2025'te yeniden bir araya gelmiş ve iki tur da bir dönüm noktası üretmemişti. “2.0” eki bunu kabul eder: yeniden çağrılan şey, sonuç vermiş bir süreç yerine tanınmış bir usuldür. Bu bir kusur olmak zorunda değildir. Tanınmış bir usul, tarafların yeniden masaya oturmak için gerekçe icat etmesini gerektirmez; hangi konuların hangi sırayla ele alınacağı zaten bilinir.", "en": "In recalling this framework Tokayev also inherits its history. According to the report, Moscow and Kyiv met in Istanbul after the 2022 invasion and again in 2025, and neither round produced a breakthrough. The “2.0” suffix concedes as much: what is being recalled is a recognised procedure rather than a process that worked. That need not be a flaw. A recognised procedure spares the parties the need to invent a pretext for sitting down again; which subjects come in which order is already known."}]}, {"h": {"tr": "Taraf ve garantör aynı koltukta", "en": "Party and guarantor in the same chair"}, "ps": [{"refs": ["tokayev"], "tr": "Önerinin asıl yapısal sorunu güvence bölümünde. Tokayev güvenceleri büyük güçlere bağlarken Rusya'yı da bu kümeye koyuyor. Bir dondurma anlaşmasında hattı aşma gücü en yüksek ülke ile hat aşıldığında güvenceyi işletecek ülke aynıysa güvence, bağlayıcı bir yükümlülük olmaktan çıkar ve o ülkenin seçimine kalır. Bu tür yapılarda genellikle üçüncü bir öge eksiktir: hattı ölçen, aşılmasını belgeleyen ve bulgusunu çatışan ülkelerden bağımsız yayımlayan bir gözlem düzeni. Öneride böyle bir ögenin adı geçmiyor.", "en": "The proposal's real architectural problem sits in its assurance clause. Tokayev ties the guarantees to the great powers and places Russia inside that set. In a freeze agreement, when the actor with the greatest capacity to breach the line is also the actor who would enforce the guarantee against a breach, the guarantee shifts from a legal obligation towards a declaration of preference. In architectures of this kind the missing piece is usually a third element: a monitoring arrangement that measures the line, registers a violation and publishes its findings independently of the parties. No such element is named in the proposal."}, {"refs": ["tokayev"], "tr": "Karşı okumayı da tartmak gerekir. Dondurma, ölümleri azaltıp yanlış hesap riskini düşürebilir; kusurlu bir düzenlemenin hiç düzenleme olmamasından iyi olduğu durumlar vardır. Aynı öneri, mevcut hattı eşitsiz biçimde sabitleyip zaman kazandırmaya da yarayabilir. Bu iki okuma arasında bugün seçim yapmayı sağlayacak bir veri yok, çünkü haberde Putin'in yanıtı ile Kremlin'in ve Ukrayna'nın tepkisi bulunmuyor. İzlenecek şey, sözün tekrarı değil: adlandırılmış katılımcıları ve bir gözlem yöntemi olan bir izleyen biçimin duyurulup duyurulmadığı.", "en": "The counter-reading deserves weighing too. A freeze could reduce deaths and lower the risk of miscalculation; there are cases where a flawed arrangement beats no arrangement. The same proposal could equally fix the present line on unequal terms and buy time. Nothing available today allows a choice between those readings, since the report carries neither Putin's reply nor the Kremlin's and Ukraine's reactions. What is worth watching is the announcement of a follow-up format with named participants and a method of monitoring, rather than a repetition of the words."}]}], "date": "2026-07-26"}, {"writer": "geo-03", "title": {"tr": "Misilleme rafineriye ulaştı", "en": "The retaliation reached the refinery"}, "excerpt": {"tr": "Cuma günü bir liman vuruldu. Cumartesi günü gelen yanıt, iki sabit enerji tesisini ve ilan edilmiş bir deniz ablukasını içeriyor. Hedef kümesi gemilerden taşınamaz tesislere geçtiğinde ölçülen şey artık sinyal değil, ihracat kapasitesine bindirilen maliyettir. Suudi Arabistan saldırıyı doğrulamadı; iddia ile doğrulama arasındaki fark burada belirleyici.", "en": "On Friday a port was struck. Saturday's answer names two fixed energy sites and a declared naval blockade. Once the target set moves from ships to installations that cannot be moved, what is being measured is no longer a signal but a cost imposed on export capacity. Saudi Arabia has not confirmed the attack; the difference between a claim and a confirmation is decisive here."}, "sources": [{"key": "houthi-aramco", "kind": "news", "name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/07/25/houthis-attack-saudi-aramco-sites-with-yemen-at-risk-of-renewed-war/", "title": {"tr": "Husiler, Cizan ve Yanbu'daki Aramco tesislerine saldırdıklarını açıkladı", "en": "Houthis say they attacked Aramco sites in Jizan and Yanbu"}, "publishedDate": "2026-07-25"}, {"key": "atlas-hodeidah", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-03/2026-07-25/", "title": {"tr": "Dört yıllık ateşkes bir gecede bozuldu", "en": "A four-year truce broke in a single night"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "Hedef kümesi genişledi", "en": "The target set widened"}, "ps": [{"refs": ["houthi-aramco"], "tr": "Husiler cumartesi günü Cizan ve Yanbu'daki Aramco tesislerine saldırdıklarını açıkladı ve Suudi Arabistan'a deniz ablukası ilan etti. Saldırıyı, krallığın cuma günü Hudeyde limanına yaptığı hava saldırısının karşılığı olarak sundular. Habere göre Cizan rafinerisinden duman yükseldi ve iki kentte acil durum uyarısı verildi. Suudi Arabistan Aramco tesislerine yönelik saldırıyı doğrulamadı. Karşılaştırma önemli: cuma günü vurulan bir limandı, cumartesi adı verilen ise iki kıyı enerji tesisi.", "en": "On Saturday the Houthis said they had struck Aramco facilities in Jizan and Yanbu and declared a naval blockade of Saudi Arabia. They presented the attack as the answer to the kingdom's Friday air strike on the port of Hodeidah. The report says smoke rose from the Jizan refinery and emergency alerts were issued in both cities. Saudi Arabia did not confirm the attack on the Aramco sites. The comparison matters: what was struck on Friday was a port; what was named on Saturday is two coastal energy installations."}, {"refs": ["houthi-aramco"], "tr": "Kabiliyet açısından fark burada yatıyor. Bir liman ile bir rafineri arasındaki asıl ayrım hasarın büyüklüğü değil, taşınabilirlik. Rafineri ve terminaller dağıtılamaz, gizlenemez ve yeri değiştirilemez; bu yüzden tekrarlanabilir bir hedeftir. Yahya Seri'nin “tırmanmaya tırmanmayla” yanıt verme sözü de ilan edilmiş bir kural, sınırlandırılmış bir kural değil: bir üst sınır değil, bir eşleme taahhüdü tarif ediyor. İlan edilen abluka aynı mantığın deniz tarafı; sabit tesise yönelen tehdit, hareketli yüke yönelen tehditle birleştiriliyor.", "en": "In capability terms the difference lies here. What separates a port from a refinery is portability rather than the scale of damage. Refineries and terminals cannot be dispersed, concealed or relocated; that makes them a repeatable target. Yahya Saree's vow to answer “escalation with escalation” is a declared rule rather than a bounded one: it describes a commitment to match, not a ceiling. The declared blockade is the maritime side of the same logic, joining a threat against fixed installations to a threat against moving cargo."}]}, {"h": {"tr": "Doğrulanan ile iddia edilen", "en": "The confirmed and the claimed"}, "ps": [{"refs": ["houthi-aramco"], "tr": "Bu noktada disiplin gerekiyor. Tesislerin vurulduğu bilgisi grubun kendi iddiasıdır; Suudi Arabistan bunu doğrulamadı. Habere yansıyan bağımsız göstergeler dolaylı: Cizan rafinerisinden yükselen duman ve iki kentteki acil durum uyarısı. Duman bir isabeti gösterebilir, ama hangi ünitenin etkilendiğini ya da üretimin kesildiğini göstermez. Haberde ölü ya da yaralı sayısı da verilmiyor. Doğrulanmamış bir saldırı iddiasının başka açıklamaları vardır: etkiyi büyütmek için abartılmış bir bildirim ya da kısmi bir önleme.", "en": "Discipline is required at this point. That the installations were hit is the group's own claim; Saudi Arabia did not confirm it. The independent indicators in the report are indirect: smoke rising from the Jizan refinery and emergency alerts in the two cities. Smoke can show an impact, but it does not show which unit was affected or that output stopped. The report gives no figures for dead or wounded either. An unconfirmed attack claim has other explanations: a bulletin inflated for effect, or partial interception."}, {"refs": ["houthi-aramco", "atlas-hodeidah"], "tr": "Bu köşe dün Hudeyde saldırısını yazarken açık bıraktığı soruyu şöyle kurmuştu: sınırlandırılmış misilleme bir sınır mı öğretir, yoksa tırmanmayı mı olağanlaştırır (Dört yıllık ateşkes bir gecede bozuldu, 25 Temmuz). Bir günlük kanıt bir yanıt sayılmaz; yön ise belli: karşı taraf eşlemeyi kural olarak ilan etti ve hedef kümesini sabit tesise taşıdı. Ölçülebilir sınama şu: Aramco ya da Suudi enerji bakanlığı Cizan veya Yanbu'da hasar ya da işleme kapasitesinde kesinti doğrularsa, karşılıklı eylemler sinyal aşamasından kapasite maliyeti aşamasına geçmiş olur. Böyle bir doğrulama gelmez ve sevkiyat sürerse, abluka ilanı arkasında uygulama kabiliyeti bulunmayan bir beyan olarak kalır.", "en": "Writing on the Hodeidah strike yesterday, this column left its question in this form: does bounded retaliation teach a limit, or normalise escalation (A four-year truce broke in a single night, 25 July). A single day of evidence falls short of an answer; the direction, though, is legible: the other side declared matching as a rule and moved its target set to fixed installations. The measurable test is this. If Aramco or the Saudi energy ministry confirms damage or an interruption to throughput at Jizan or Yanbu, the exchange will have moved from signalling to a cost on capacity. If no such confirmation appears and shipments continue, the blockade declaration remains a statement with no enforcement capability behind it."}]}], "date": "2026-07-26"}, {"writer": "geo-04", "title": {"tr": "Hazar'da vurulan yük hattı", "en": "The cargo line struck in the Caspian"}, "excerpt": {"tr": "Zelenski'nin tarif ettiği hedef kümesi, savaşı Hazar'daki yük hattına taşıyor. Bu hattın deniz yoluyla bir seçeneği yok: Hazar kapalı bir havza olduğu için ikame başka bir denize değil, kara yoluna doğrudur. Haber tonaj vermiyor; ölçülebilir olan ikamenin büyüklüğü değil, yönü.", "en": "The target set Zelenskyy described moves the war onto the cargo line in the Caspian. That line has no maritime alternative: because the Caspian is an enclosed basin, substitution runs towards land rather than towards another sea. The report gives no tonnage; what can be assessed is the direction of substitution, not its size."}, "sources": [{"key": "caspian", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/iran-accuses-ukraine-of-deadly-attack-on-caspian-commercial-vessel", "title": {"tr": "İran, Hazar'da bir ticari gemiye yapılan saldırıdan Ukrayna'yı sorumlu tuttu", "en": "Iran accuses Ukraine of a deadly attack on a Caspian commercial vessel"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "Kapalı bir havzada yük", "en": "Cargo in an enclosed basin"}, "ps": [{"refs": ["caspian"], "tr": "İran Dışişleri Bakanlığı, Hazar'da bir ticari gemiye yapılan saldırıyı “düşmanca ve suç niteliğinde” olarak nitelendirdi ve Ukrayna'nın maslahatgüzarını çağırdı; bakanlık bir denizcinin öldüğünü, birinin yaralandığını bildirdi. Zelenski aynı gün, kuvvetlerinin “İran'la bağlantılı askerî yük taşımacılığında kullanılan gemileri ve bir savaş gemisini” vurduğunu açıkladı. Bu tanım, hedefi bir cepheden çok bir güzergâh olarak kuruyor: vurulan şey bir mevzi değil, taşıma zincirinin bir halkası.", "en": "Iran's foreign ministry called the attack on a commercial vessel in the Caspian “hostile and criminal” and summoned Ukraine's charge d'affaires; the ministry reported one sailor killed and one wounded. Zelenskyy said the same day that his forces had struck “vessels used in military cargo shipments involving Iran, as well as a warship”. That description frames the target as a route rather than a front: what was hit is a link in a transport chain, not a position."}, {"refs": ["caspian"], "tr": "Bir güzergâhın kırılganlığı, alternatifinin nerede olduğuna bağlıdır. Hazar bu açıdan alışılmadık bir yer: kapalı bir havza olduğu için bu hat üzerindeki bir gemi başka bir denize sapamaz. Açık denizlerde riski büyüyen bir yük daha uzun bir rota seçebilir; kapalı bir havzada böyle bir seçenek bulunmuyor. İkame ancak karaya, yani demiryolu ve karayoluna geçmekle mümkündür ve üçüncü ülkelerden geçer. Ton başına maliyet ile teslim süresi, denizden karaya geçen her yükte artar. Haber tonaj ya da sefer sayısı vermediği için buradaki artışın büyüklüğü hesaplanamaz; hesaplanabilen, ikamenin yalnızca tek bir yönü olduğudur.", "en": "A route's fragility depends on where its alternative lies. The Caspian is unusual in this respect: because it is an enclosed basin, a vessel on this line cannot divert to another sea. A cargo facing rising risk on open water can choose a longer route; in an enclosed basin no such option exists. Substitution is possible only by moving onto land, that is onto rail and road, and it passes through third countries. Cost per tonne and delivery time both rise for any cargo shifted from sea to land. Since the report gives no tonnage or number of voyages, the size of that increase cannot be calculated; what can be established is that substitution has only one direction."}]}, {"h": {"tr": "Yükün tanımı kimin elinde?", "en": "Who holds the definition of the cargo"}, "ps": [{"refs": ["caspian"], "tr": "İki yan aynı gemiyi farklı adlandırıyor. Tahran gemiyi ticari sayıyor; Ukrayna hedeflerini askerî yük taşıyan gemiler olarak tanımlıyor. Bu iki niteleme aynı tekneye birlikte yapışabilir, çünkü bir gemi seferden sefere yük değiştirir. Anlaşmazlığın konusu bu yüzden hasar değil, sınıflandırma: bir sefer “askerî yük” sayıldığında saldırı askerî bir hedefe yönelmiş gibi sunulabilir; “ticari” sayıldığında ise kurallara aykırı bir eylem olarak gösterilebilir. Zelenski, İran'ın adını verdiği gemiyi vurduğunu doğrulamadı; dolayısıyla iki anlatının aynı gövdeden söz ettiği de kesin değil.", "en": "The two sides name the same hull differently. Tehran treats the vessel as commercial; Ukraine describes its targets as ships carrying military cargo. Both labels can attach to one boat, because a ship changes cargo from voyage to voyage. The dispute is therefore not about damage but about classification: when a voyage is defined as “military cargo” the strike can be presented as legitimate targeting, and when it is defined as “commercial” as a violation. Zelenskyy did not confirm hitting the vessel Iran named, so it is not even settled that the two accounts describe the same hull."}, {"refs": ["caspian"], "tr": "Bir saldırının bir güzergâhı fiyatlayıp fiyatlamadığı, açıklamalardan değil seferin nasıl düzenlendiğinden okunur. İzlenecek gösterge şu: liman, denizcilik ve sigorta düzenleyicileri Hazar hatlarında konvoy düzeni, refakat, sigorta koşulları ya da liman uğrak takvimlerinde bir değişiklik duyurursa, saldırı taşımanın maliyetine geçmiş olur. Böyle bir değişiklik duyurulmazsa, olay güzergâhın işleyişini değiştirmemiş bir diplomatik anlaşmazlık olarak kalır.", "en": "Whether an attack has priced a route is read not from statements but from how the voyage is organised. The indicator to watch is this: if port, maritime and insurance authorities announce a change in convoying, escorting, insurance terms or port-call schedules on Caspian lines, the attack will have passed into the cost of carriage. If no such change is announced, the incident remains a diplomatic dispute that did not alter how the route runs."}]}], "date": "2026-07-26"}, {"writer": "geo-05", "title": {"tr": "Bir hiciv partisi dört taviz kopardı", "en": "A satirical party extracted four concessions"}, "excerpt": {"tr": "Hamamböceği Halk Partisi eylemleri bitirirken elinde dört somut madde vardı: bir istifa, bir tazminat tutarı, göstericilere yaptırım uygulanmaması ve iki güvenlik biriminin kamuoyu önünde özrü. Dördü de farklı bir kuruma yazılmış olduğu için sonuç denetlenebilir. Sorun şu ki bu kurumların üçü, eylemin muhatabıydı.", "en": "As the Cockroach Janta Party ended its protests it held four concrete items: a resignation, a compensation figure, an assurance of no punitive action against protesters, and a public apology from two security forces. Because each is addressed to a different institution, the outcome is auditable. The difficulty is that three of those institutions were the object of the protest."}, "sources": [{"key": "india-neet", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/indias-education-minister-resigns-after-weeks-of-cockroach-protests", "title": {"tr": "Hindistan'da eğitim bakanı istifa etti, “Hamamböceği” hareketi eylemleri bitirdi", "en": "India's “Cockroach” youth call off protests after the education minister quits"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "Kopartılan dört madde", "en": "The four items obtained"}, "ps": [{"refs": ["india-neet"], "tr": "Eğitim Bakanı Dharmendra Pradhan, tıp fakültesi giriş sınavı NEET'te yaşanan sızıntı dizisine karşı haftalardır süren gösterilerin ardından istifa etti; gösterileri yürüten Hamamböceği Halk Partisi eylemleri bitirdiğini açıkladı. Kazanılan yalnızca istifa değil. Al Jazeera'ye göre hükümetin kabul ettiği adımlar arasında intihar sonucu ölen öğrencilerin ailelerine 10 milyon rupi tazminat, göstericilere yaptırım uygulanmaması ve Delhi Polisi ile Hızlı Müdahale Gücü'nün kamuoyu önünde özür dilemesi de var.", "en": "Education Minister Dharmendra Pradhan resigned after weeks of protests over a series of leaks in the NEET medical college entrance examination, and the Cockroach Janta Party that led them said it was ending its protests. What was won is not only the resignation. According to Al Jazeera, the steps the government accepted include 10 million rupees in compensation for the families of students who died by suicide, no punitive action against protesters, and a public apology from the Delhi Police and the Rapid Action Force."}, {"refs": ["india-neet"], "tr": "Bu listenin biçimi, içeriği kadar önemli. Dört madde dört ayrı muhataba yazılmış: bir bakanlık koltuğu, bir ödeme kalemi, kovuşturma takdiri ve iki güvenlik birimi. Talepleri tek bir sloganda toplamak yerine ayrı adreslere bölmek, sonucu sembolik bir jestten denetlenebilir bir taahhüt dizisine çeviriyor; her maddenin ayrı bir uygulayıcısı olduğu için her biri ayrı ayrı takip edilebilir. Eylemlerin geçtiği yer de bu talepleri açıklıyor: Yeni Delhi'deki Jantar Mantar alanında en az 1.000 polis görev yaptı ve habere göre cop, göz yaşartıcı gaz ve iddiaya göre saçma tabancası kullanımıyla çok sayıda öğrenci yaralandı. Özür talebi, bu nedenle bir nezaket isteği değil, olayın kendisine dair bir madde.", "en": "The shape of that list matters as much as its content. Four items are addressed to four separate counterparts: a ministerial post, a payment line, prosecutorial discretion and two security forces. Splitting demands across separate addresses rather than gathering them into a single slogan turns the outcome from a symbolic gesture into a sequence of auditable commitments, each with its own implementer and therefore each separately traceable. Where the protests took place also explains the demands: at least 1,000 police were deployed at Jantar Mantar in New Delhi, and the report says baton charges, tear gas and allegedly pellet guns injured many students. The demand for an apology is thus not a request for courtesy but an item about the events themselves."}]}, {"h": {"tr": "Teslimatın adresi", "en": "Where delivery has to happen"}, "ps": [{"refs": ["india-neet"], "tr": "Kazanımın kırılganlığı da aynı listeden çıkıyor. Dört maddenin üçü, eylemin muhatabı olan kurumların kendi eliyle yerine getirilecek: özrü, göstericilere müdahale eden birimler dile getirecek; yaptırım uygulanmaması güvencesi, gösterileri kolluk gücüyle karşılayan makamlar tarafından işletilecek; tazminat ise eğitim yönetimi üzerinden ödenecek. Yalnızca istifa, açıklandığı anda tamamlanmış sayılabilecek tek madde. Bunun bir karşı okuması var: bu maddeler uzayan bir huzursuzluğun siyasi maliyetine kıyasla ucuz olduğu için hızla uygulanabilir de.", "en": "The win's fragility comes out of the same list. Three of the four items are to be carried out by the institutions that were the object of the protest: the apology is to be voiced by the forces that policed the demonstrators; the assurance of no punitive action is to be operated by the authorities that policed the protest; the compensation is to be paid through the education administration. Only the resignation can be treated as complete the moment it is announced. There is a counter-reading: these items may also be implemented quickly precisely because they are cheap next to the political cost of prolonged unrest."}, {"refs": ["india-neet"], "tr": "Bu yüzden sınama, açıklamaların dilinde değil ödeme ve dosya kayıtlarında. Ailelere yapılan tazminat ödemeleri ile göstericilere yaptırım uygulanmadığı belgelenirse, hareket sokak baskısını teslimata çevirmiş olur. Yalnızca istifa ayakta kalırsa, sonuç bir personel değişikliği olarak kalır. Açık soru, hareketin adres defteriyle ilgili: tek adı verilmiş muhatabı görevden ayrıldığında, kalan üç maddeyi kime karşı savunacak?", "en": "The test therefore lies not in the language of announcements but in payment and case files. If compensation payments to families and the absence of punitive action against protesters are documented, the movement will have converted street pressure into delivery. If only the resignation holds, the outcome remains a change of personnel. The open question concerns the movement's address book: once its single named counterpart has left office, against whom does it press the remaining three items?"}]}], "date": "2026-07-26"}, {"writer": "geo-06", "title": {"tr": "Elli iki yıl dayanan hattın yeni komşusu", "en": "The new neighbour of a line that held for fifty-two years"}, "excerpt": {"tr": "Golan'daki tampon bölge 1974'ten bu yana bir gözlemci kuvvetin izlediği bir düzendi. Bu düzen elli iki yıl boyunca mürekkebi güçlü olduğu için değil, hattın öbür yakasını öngörülebilir tek bir yönetim tuttuğu için ayakta kaldı. 2024'te değişen şey metin değil, komşuydu.", "en": "The buffer zone in the Golan has been an arrangement monitored by an observer force since 1974. It stood for fifty-two years not because its ink was strong but because a single predictable authority held the far side of the line. What changed in 2024 was not the text but the neighbour."}, "sources": [{"key": "guterres-syria", "kind": "news", "name": "Hurriyet Daily News", "url": "https://www.hurriyetdailynews.com/un-chief-says-situation-in-syrias-golan-area-unacceptable-224785", "title": {"tr": "BM Genel Sekreteri, Golan çevresindeki durumu “kabul edilemez” olarak nitelendirdi", "en": "UN chief says the situation in Syria's Golan area is “unacceptable”"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "1974'te kurulan düzen", "en": "The arrangement built in 1974"}, "ps": [{"refs": ["guterres-syria"], "tr": "Antonio Guterres 25 Temmuz'da Şam'a geldi; bir BM Genel Sekreteri'nin Suriye'ye 2009'dan bu yana ilk ziyareti. Golan Tepeleri çevresinde yaşananları “tümüyle kabul edilemez” diye niteledi. Suriye Dışişleri Bakanı Esad eş-Şeybani ise İsrail güçlerinin 2024'te konuşlandığı tampon bölgeden “derhal ve koşulsuz” çekilmesini istedi. Tartışmanın konusu olan bölge yeni değil: BM'nin devriye gezdiği bu şerit, 1974'ten bu yana BM Gözlemci Kuvveti UNDOF tarafından Suriye ile İsrail güçleri arasındaki ateşkesi gözetmek üzere izleniyor.", "en": "Antonio Guterres arrived in Damascus on 25 July, the first visit by a UN secretary-general to Syria since 2009. He called what is happening around the Golan Heights “totally unacceptable”. Syria's Foreign Minister Asaad al-Shaibani called for an “immediate and unconditional” Israeli withdrawal from the buffer zone where Israeli forces deployed in 2024. The area in dispute is not new: this UN-patrolled strip has been monitored since 1974 by the UN observer force UNDOF, to oversee the ceasefire between Syrian and Israeli forces."}, {"refs": ["guterres-syria"], "tr": "Bu düzenin dayanıklılığı, ne olduğuna dikkatle bakılınca daha az gizemli görünür. Bir gözlemci kuvvet hattı savunmak yerine izlemek üzere kurulur. Sahayı tutmaz. Hattın aşıldığını belgeler ve bildirir. Böyle bir mimari yalnızca bir koşulda çalışır: hattın iki yakasındaki yönetimlerin de öngörülebilirliği tercih etmesi. Elli iki yıl boyunca sağlanan şey buydu. Yani 1974 düzenlemesinin gücü metnin bağlayıcılığından değil, iki yakadaki idarelerin aynı statükoyu istemesinden geliyordu.", "en": "The durability of that arrangement looks less mysterious once one attends to what it is. An observer force is created to monitor a line rather than to defend it. It holds no ground; it registers a violation and reports it. An architecture of that kind works under one condition: that the authorities on both sides of the line prefer predictability. That is what held for fifty-two years. The strength of the 1974 arrangement came not from the binding force of its text but from both administrations wanting the same status quo."}]}, {"h": {"tr": "Neden şimdi?", "en": "Why now"}, "ps": [{"refs": ["guterres-syria"], "tr": "Bugünkü gerilimin en yakın açıklaması güncel ve siyasi: İsrailli yetkililer güney Suriye'de bir güvenlik bölgesini koruma niyetlerini açıkladı ve daha geniş bir bölgesel silahsızlanma çağrısı yaptı; ABD arabuluculuğundaki görüşmelere ve kurulmuş iletişim mekanizmalarına karşın İsrail'in Suriye'deki askerî operasyonları sürdü. Bu, bir döngünün dönmesi değil, bir hükümetin tercih ettiği eşik. Tarihin buradaki katkısı nedeni açıklamak değil, neden şimdi olduğunu açıklamak: 1974 metni değişmedi, hiçbir taraf onu resmen tadil etmedi; değişen, o metnin tarif ettiği zeminin bir yakasını kimin yönettiğiydi. Güçler 2024'te tampon bölgeye girdi.", "en": "The nearest explanation of today's tension is current and political: Israeli officials have stated their intention to retain a security zone in southern Syria and called for wider regional demilitarisation, and Israeli military operations in Syria have continued despite US-mediated talks and established communication mechanisms. That is a threshold a government chose, not a cycle turning. History's contribution here concerns the timing rather than the cause: the 1974 text did not change, no party formally amended it; what changed was who administers one side of the ground it describes. Forces entered the buffer zone in 2024."}, {"refs": ["guterres-syria"], "tr": "Alışıldık benzetme buraya tam oturmuyor; farkı açıkça söylemek gerekir. Donmuş bir hattın, taraflardan biri zayıfladığında güçlü komşunun ilerlemesiyle çözüldüğü örnekler vardır; oradaki mekanizma fetihtir ve genellikle metnin reddiyle birlikte gelir. Golan'da olan bu değil: 1974 düzenlemesine itiraz eden bir ardıl devlet ortaya çıkmadı; tersine Şam, bugün aynı düzenlemenin uygulanmasını talep ediyor. Yani metin tarafların ikisi için de geçerli sayılıyor, sahadaki konum ise değişmiş durumda. Bundan çıkan soru şu: bir sınır düzeni, metni yeniden yazılmadan yeni bir muhataba bağlanabilir mi? İzlenecek gösterge, sonraki açıklamalarda bir çekilme takvimi ya da yenilenmiş bir izleme düzeni adlandırılıp adlandırılmadığıdır.", "en": "The familiar analogy does not quite fit here, and the difference should be stated. There are cases where a frozen line dissolves when one party weakens and the stronger neighbour advances; the mechanism there is conquest, and it usually arrives together with a rejection of the text. The Golan case runs differently: no successor state has emerged to contest the 1974 arrangement; on the contrary, Damascus is today demanding that the same arrangement be applied. The text is thus treated as const PODCAST_PROGRESS_PREFIX = 'eigen-radar:podcast-progress:';
function podcastProgressKey(src){
  return `${PODCAST_PROGRESS_PREFIX}${src}`;
}
function forgetPodcastProgress(src){
  try { localStorage.removeItem(podcastProgressKey(src)); } catch {}
}
function savePodcastProgress(audio,src){
  const seconds = Math.floor(Number(audio?.currentTime));
  const duration = Number(audio?.duration);
  try {
    if (!Number.isFinite(seconds) || seconds < 1
        || (Number.isFinite(duration) && duration > 0 && duration-seconds <= 5)){
      localStorage.removeItem(podcastProgressKey(src));
      return;
    }
    localStorage.setItem(podcastProgressKey(src), String(seconds));
  } catch {}
}
function restorePodcastProgress(audio,src){
  let seconds;
  try { seconds = Number(localStorage.getItem(podcastProgressKey(src))); }
  catch { return false; }
  const duration = Number(audio?.duration);
  if (!Number.isFinite(seconds) || seconds < 1
      || !Number.isFinite(duration) || duration <= 0 || seconds >= duration-5){
    if (Number.isFinite(duration) && duration > 0) forgetPodcastProgress(src);
    return false;
  }
  try { audio.currentTime = seconds; return true; }
  catch { return false; }
}
function connectPodcastProgress(audio,src){
  let lastSavedSecond = -1;
  const store = ()=>{
    savePodcastProgress(audio,src);
    lastSavedSecond = Math.floor(Number(audio.currentTime));
  };
  audio.addEventListener('loadedmetadata', ()=>restorePodcastProgress(audio,src));
  audio.addEventListener('timeupdate', ()=>{
    const second = Math.floor(Number(audio.currentTime));
    if (Number.isFinite(second) && Math.abs(second-lastSavedSecond) >= 5) store();
  });
  audio.addEventListener('seeked', store);
  audio.addEventListener('pause', store);
  audio.addEventListener('ended', ()=>forgetPodcastProgress(src));
}

function formatPodcastTime(value){
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2,'0')}`;
}
function connectPodcastDesktopControls(bar,audio){
  const controls = bar.querySelector('[data-podcast-desktop-controls]');
  if (!controls) return;
  const u = UI[LANG];
  const play = controls.querySelector('[data-podcast-play]');
  const playIcon = controls.querySelector('[data-podcast-play-icon]');
  const time = controls.querySelector('[data-podcast-time]');
  const seek = controls.querySelector('[data-podcast-seek]');
  const volume = controls.querySelector('[data-podcast-volume]');
  const volumeIcon = controls.querySelector('[data-podcast-volume-icon]');
  const sync = ()=>{
    const duration = Number(audio.duration);
    const current = Number(audio.currentTime);
    const playable = Number.isFinite(duration) && duration > 0;
    seek.disabled = !playable;
    seek.max = playable ? String(duration) : '0';
    seek.value = Number.isFinite(current) ? String(Math.min(current, duration || current)) : '0';
    time.textContent = formatPodcastTime(current);
    const playing = !audio.paused && !audio.ended;
    playIcon.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-pressed',String(playing));
    play.setAttribute('aria-label',playing ? u.podcastPause : u.podcastPlay);
    play.title = playing ? u.podcastPause : u.podcastPlay;
    const muted = audio.muted || audio.volume===0;
    volumeIcon.textContent = muted ? '🔇' : '🔊';
    volume.setAttribute('aria-pressed',String(muted));
    volume.setAttribute('aria-label',muted ? u.podcastUnmute : u.podcastMute);
    volume.title = muted ? u.podcastUnmute : u.podcastMute;
  };
  play.addEventListener('click',()=>{
    if (audio.paused || audio.ended) {
      const pending = audio.play();
      if (pending && typeof pending.catch==='function') pending.catch(()=>{});
    } else audio.pause();
  });
  seek.addEventListener('input',()=>{
    const next = Number(seek.value);
    if (Number.isFinite(next)) {
      try { audio.currentTime = next; } catch {}
      time.textContent = formatPodcastTime(next);
    }
  });
  volume.addEventListener('click',()=>{ audio.muted = !audio.muted; sync(); });
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange']
    .forEach(event=>audio.addEventListener(event,sync));
  sync();
}
