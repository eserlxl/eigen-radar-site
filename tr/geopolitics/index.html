 be implemented quickly precisely because they are cheap next to the political cost of prolonged unrest."}, {"refs": ["india-neet"], "tr": "Bu yüzden sınama, açıklamaların dilinde değil ödeme ve dosya kayıtlarında. Ailelere yapılan tazminat ödemeleri ile göstericilere yaptırım uygulanmadığı belgelenirse, hareket sokak baskısını teslimata çevirmiş olur. Yalnızca istifa ayakta kalırsa, sonuç bir personel değişikliği olarak kalır. Açık soru, hareketin adres defteriyle ilgili: tek adı verilmiş muhatabı görevden ayrıldığında, kalan üç maddeyi kime karşı savunacak?", "en": "The test therefore lies not in the language of announcements but in payment and case files. If compensation payments to families and the absence of punitive action against protesters are documented, the movement will have converted street pressure into delivery. If only the resignation holds, the outcome remains a change of personnel. The open question concerns the movement's address book: once its single named counterpart has left office, against whom does it press the remaining three items?"}]}], "date": "2026-07-26"}, {"writer": "geo-06", "title": {"tr": "Elli iki yıl dayanan hattın yeni komşusu", "en": "The new neighbour of a line that held for fifty-two years"}, "excerpt": {"tr": "Golan'daki tampon bölge 1974'ten bu yana bir gözlemci kuvvetin izlediği bir düzendi. Bu düzen elli iki yıl boyunca mürekkebi güçlü olduğu için değil, hattın öbür yakasını öngörülebilir tek bir yönetim tuttuğu için ayakta kaldı. 2024'te değişen şey metin değil, komşuydu.", "en": "The buffer zone in the Golan has been an arrangement monitored by an observer force since 1974. It stood for fifty-two years not because its ink was strong but because a single predictable authority held the far side of the line. What changed in 2024 was not the text but the neighbour."}, "sources": [{"key": "guterres-syria", "kind": "news", "name": "Hurriyet Daily News", "url": "https://www.hurriyetdailynews.com/un-chief-says-situation-in-syrias-golan-area-unacceptable-224785", "title": {"tr": "BM Genel Sekreteri, Golan çevresindeki durumu “kabul edilemez” olarak nitelendirdi", "en": "UN chief says the situation in Syria's Golan area is “unacceptable”"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "1974'te kurulan düzen", "en": "The arrangement built in 1974"}, "ps": [{"refs": ["guterres-syria"], "tr": "Antonio Guterres 25 Temmuz'da Şam'a geldi; bir BM Genel Sekreteri'nin Suriye'ye 2009'dan bu yana ilk ziyareti. Golan Tepeleri çevresinde yaşananları “tümüyle kabul edilemez” diye niteledi. Suriye Dışişleri Bakanı Esad eş-Şeybani ise İsrail güçlerinin 2024'te konuşlandığı tampon bölgeden “derhal ve koşulsuz” çekilmesini istedi. Tartışmanın konusu olan bölge yeni değil: BM'nin devriye gezdiği bu şerit, 1974'ten bu yana BM Gözlemci Kuvveti UNDOF tarafından Suriye ile İsrail güçleri arasındaki ateşkesi gözetmek üzere izleniyor.", "en": "Antonio Guterres arrived in Damascus on 25 July, the first visit by a UN secretary-general to Syria since 2009. He called what is happening around the Golan Heights “totally unacceptable”. Syria's Foreign Minister Asaad al-Shaibani called for an “immediate and unconditional” Israeli withdrawal from the buffer zone where Israeli forces deployed in 2024. The area in dispute is not new: this UN-patrolled strip has been monitored since 1974 by the UN observer force UNDOF, to oversee the ceasefire between Syrian and Israeli forces."}, {"refs": ["guterres-syria"], "tr": "Bu düzenin dayanıklılığı, ne olduğuna dikkatle bakılınca daha az gizemli görünür. Bir gözlemci kuvvet hattı savunmak yerine izlemek üzere kurulur. Sahayı tutmaz. Hattın aşıldığını belgeler ve bildirir. Böyle bir mimari yalnızca bir koşulda çalışır: hattın iki yakasındaki yönetimlerin de öngörülebilirliği tercih etmesi. Elli iki yıl boyunca sağlanan şey buydu. Yani 1974 düzenlemesinin gücü metnin bağlayıcılığından değil, iki yakadaki idarelerin aynı statükoyu istemesinden geliyordu.", "en": "The durability of that arrangement looks less mysterious once one attends to what it is. An observer force is created to monitor a line rather than to defend it. It holds no ground; it registers a violation and reports it. An architecture of that kind works under one condition: that the authorities on both sides of the line prefer predictability. That is what held for fifty-two years. The strength of the 1974 arrangement came not from the binding force of its text but from both administrations wanting the same status quo."}]}, {"h": {"tr": "Neden şimdi?", "en": "Why now"}, "ps": [{"refs": ["guterres-syria"], "tr": "Bugünkü gerilimin en yakın açıklaması güncel ve siyasi: İsrailli yetkililer güney Suriye'de bir güvenlik bölgesini koruma niyetlerini açıkladı ve daha geniş bir bölgesel silahsızlanma çağrısı yaptı; ABD arabuluculuğundaki görüşmelere ve kurulmuş iletişim mekanizmalarına karşın İsrail'in Suriye'deki askerî operasyonları sürdü. Bu, bir döngünün dönmesi değil, bir hükümetin tercih ettiği eşik. Tarihin buradaki katkısı nedeni açıklamak değil, neden şimdi olduğunu açıklamak: 1974 metni değişmedi, hiçbir taraf onu resmen tadil etmedi; değişen, o metnin tarif ettiği zeminin bir yakasını kimin yönettiğiydi. Güçler 2024'te tampon bölgeye girdi.", "en": "The nearest explanation of today's tension is current and political: Israeli officials have stated their intention to retain a security zone in southern Syria and called for wider regional demilitarisation, and Israeli military operations in Syria have continued despite US-mediated talks and established communication mechanisms. That is a threshold a government chose, not a cycle turning. History's contribution here concerns the timing rather than the cause: the 1974 text did not change, no party formally amended it; what changed was who administers one side of the ground it describes. Forces entered the buffer zone in 2024."}, {"refs": ["guterres-syria"], "tr": "Alışıldık benzetme buraya tam oturmuyor; farkı açıkça söylemek gerekir. Donmuş bir hattın, taraflardan biri zayıfladığında güçlü komşunun ilerlemesiyle çözüldüğü örnekler vardır; oradaki mekanizma fetihtir ve genellikle metnin reddiyle birlikte gelir. Golan'da olan bu değil: 1974 düzenlemesine itiraz eden bir ardıl devlet ortaya çıkmadı; tersine Şam, bugün aynı düzenlemenin uygulanmasını talep ediyor. Yani metin tarafların ikisi için de geçerli sayılıyor, sahadaki konum ise değişmiş durumda. Bundan çıkan soru şu: bir sınır düzeni, metni yeniden yazılmadan yeni bir muhataba bağlanabilir mi? İzlenecek gösterge, sonraki açıklamalarda bir çekilme takvimi ya da yenilenmiş bir izleme düzeni adlandırılıp adlandırılmadığıdır.", "en": "The familiar analogy does not quite fit here, and the difference should be stated. There are cases where a frozen line dissolves when one party weakens and the stronger neighbour advances; the mechanism there is conquest, and it usually arrives together with a rejection of the text. The Golan case runs differently: no successor state has emerged to contest the 1974 arrangement; on the contrary, Damascus is today demanding that the same arrangement be applied. The text is thus treated as valid by both parties while the position on the ground has changed. The question that follows is this: can a boundary arrangement be re-anchored to a new counterpart without its text being rewritten? The indicator to watch is whether subsequent statements name a withdrawal timetable or a renewed monitoring arrangement."}]}], "date": "2026-07-26"}, {"writer": "geo-03", "title": {"tr": "Dört yıllık ateşkes bir gecede bozuldu", "en": "A four-year truce broke in a single night"}, "excerpt": {"tr": "Suudi Arabistan'ın Hudeyde'ye yönelik gece grevi, koalisyonun 'orantılı' ve 'sona erdi' diliyle sınırlandırdığı bir cezalandırma; ama dört yıllık gayrıresmî ateşkesi bozan bu adım, sınırlı misillemenin bir sınır mı öğrettiği yoksa tırmanmayı mı olağanlaştırdığı sorusunu açıyor.", "en": "Saudi Arabia's overnight strike on Hodeidah is a punishment the coalition bounded with the language of 'proportionate' and 'ended'; yet by breaking a four-year informal truce it opens the question of whether limited retaliation teaches a limit or normalises escalation."}, "sources": [{"key": "hodeidah", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/saudis-strike-yemens-houthi-held-hodeida-rebel-media", "title": {"tr": "Suudi Arabistan Husi kontrolündeki Hudeyde'yi vurdu; koalisyon 'orantılı yanıt' dedi", "en": "Saudi Arabia strikes Houthi-held Hodeidah; coalition calls it a 'proportionate response'"}, "publishedDate": "2026-07-24"}], "sections": [{"h": {"tr": "Sınırlandırılmış bir operasyon", "en": "A bounded operation"}, "ps": [{"refs": ["hodeidah"], "tr": "Koalisyon sözcüsü Türki el-Maliki, Hudeyde'deki grevi 'orantılı bir askerî yanıt operasyonu' olarak tanımladı ve operasyonun sona erdiğini söyledi. Bu dil, kabiliyetin gösterildiği ama açık uçlu bir kampanyaya bağlanmadığı bir cezalandırmayı tarif ediyor. Hedeflere ve tek yaralıya dair bilgiler Husi yönetimindeki Al Masirah'a dayandığı için, fiziksel etkinin çapı bağımsız olarak doğrulanamıyor; yine de sözcünün operasyonun bittiği yönündeki ifadesi, niyetin bir mesaj vermek olduğunu, toprak ele geçirmek olmadığını gösteriyor.", "en": "The coalition spokesman, Turki al-Maliki, described the Hodeidah strike as a 'proportionate military response operation' and said the operation had ended. That language describes a punishment in which capability was shown but not tied to an open-ended campaign. Because the reported targets and the single injury rest on the Houthi-run Al Masirah, the scale of the physical effect cannot be independently verified; still, the spokesman's statement that the operation had ended signals that the intent was to send a message, not to seize ground."}]}, {"h": {"tr": "Tırmanma testi", "en": "The escalation test"}, "ps": [{"refs": ["hodeidah"], "tr": "Grev, Husilerin 20 Temmuz'da Suudi gemiciliğine yönelik Kızıldeniz ablukasını duyurmasına verilen bir yanıt; yani caydırıcılık, düşmanın ödemesi gereken bir maliyet olarak kuruluyor. Ancak dört yıllık gayrıresmî ateşkesin bozulması bu maliyeti iki yönlü kılıyor: kıyıdaki siviller ve gemiciler de risk altında. Buradaki mekanizma, tekrarlanan sınırlı misillemenin bir sınır öğretip öğretmediği; nedeniyle önemli olan, sözün değil karşı tarafın gözlemleyebileceği maliyetin inandırıcılığıdır.", "en": "The strike is a response to the Houthis' 20 July announcement of a Red Sea blockade on Saudi shipping; deterrence is thus built as a cost the adversary must pay. But breaking a four-year informal truce makes that cost cut both ways: coastal civilians and shippers are also at risk. The mechanism here is whether repeated limited retaliation teaches a limit; what matters, because of that, is the credibility of the cost the other side can observe, not the wording."}, {"refs": ["hodeidah"], "tr": "Alternatif bir okuma, grevin caydırıcılıktan çok iç siyasete veya Kızıldeniz'deki tanker kayıplarına dönük bir gösteri olabileceğidir; kanıt henüz bunu ayırmaya yetmiyor. İzlenecek gözlemlenebilir sinyal açık: koalisyonun operasyonun bittiği yönündeki çerçevesi ilerleyen günlerde tutar mı, yoksa grevler tekrarlanır mı; ve Husiler Suudi gemilerine saldırıları sürdürür mü? Bu iki gösterge birlikte, sınırlı bir cezalandırmanın mı yoksa yeni bir tırmanma sarmalının mı başladığını doğrular.", "en": "An alternative reading is that the strike may be less about deterrence than about domestic politics or a display over tanker losses in the Red Sea; the evidence does not yet separate these. The observable signal to watch is clear: whether the coalition's frame that the operation had ended holds in the coming days or strikes resume, and whether the Houthis continue attacks on Saudi vessels. Together those two indicators confirm whether a bounded punishment or a new escalation spiral has begun."}]}], "date": "2026-07-25"}, {"writer": "geo-02", "title": {"tr": "144'e karşı 10 ve bir kurumun dayanıklılığı", "en": "144 against 10, and the durability of an institution"}, "excerpt": {"tr": "BM üye devletleri, İnsan Hakları Yüksek Komiseri Volker Türk'ü 144'e karşı 10 oyla ikinci döneme seçti. Oylama, bir çok taraflı kurumun büyük güçlerin muhalefetini koalisyon aritmetiğiyle soğurabildiğini gösteriyor; ama meşruiyet ile yaptırım gücü aynı şey değil.", "en": "UN member states re-elected Human Rights High Commissioner Volker Türk to a second term by 144 to 10. The vote shows a multilateral institution can absorb great-power opposition through coalition arithmetic; but legitimacy and leverage are not the same thing."}, "sources": [{"key": "turk", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/un-rights-chief-turk-wins-second-term-despite-us-and-israeli-opposition", "title": {"tr": "BM İnsan Hakları Yüksek Komiseri Türk, ABD ve İsrail'in itirazına rağmen ikinci döneme seçildi", "en": "UN rights chief Türk wins a second term despite US and Israeli opposition"}, "publishedDate": "2026-07-25"}], "sections": [{"h": {"tr": "Oyların aritmetiği", "en": "The arithmetic of the vote"}, "ps": [{"refs": ["turk"], "tr": "Üye devletler 144'e karşı 10 oyla, 13 çekimserle Türk'ü yeniden seçti; ABD, İsrail, Rusya, Kuzey Kore ve altı ülke aleyhte oy kullandı. Bu tablo bir veto değil, bir koalisyon fotoğrafıdır: karşı çıkanlar sayıca güçlü başkentleri içeriyor, ancak çoğunluğu oluşturamıyor. Türk, makamın 1993'te kurulmasından bu yana iki tam dönemi tamamlayacak ilk komiser; yani sonuç, kurumsal sürekliliğin tekil bir örneğini de kayda geçiriyor.", "en": "Member states re-elected Türk 144-10, with 13 abstentions; the US, Israel, Russia, North Korea and six others voted against. That picture is not a veto but a coalition photograph: the opponents include heavyweight capitals, yet cannot form a majority. Türk becomes the first commissioner to complete two full terms since the post was created in 1993, so the outcome also marks a singular instance of institutional continuity."}, {"refs": ["turk"], "tr": "Karşı oyların gerekçeleri açıkça taraflara ait: İsrail Dışişleri Bakanlığı ofisi tarafsızlığı çiğnemekle suçladı, ABD Dışişleri Bakanlığı yeniden seçimi 'yozlaşmışlığın örneği' olarak niteledi. Bu itirazlar bir pozisyonu kurar, uygulamayı değiştirmez; çünkü komiserlik, hükümetleri zorlayacak bir yaptırım aygıtına değil, rapor etme ve görünür kılma yetkisine dayanır.", "en": "The reasons for the opposing votes are clearly the parties' own: Israel's foreign ministry accused the office of betraying neutrality, and the US State Department called the re-election 'an example of corruption.' These objections establish a position, not a change in practice; because the commissioner's office rests on the authority to report and make visible, not on an enforcement apparatus to compel governments."}]}, {"h": {"tr": "Meşruiyet mi, yaptırım gücü mü?", "en": "Legitimacy or leverage?"}, "ps": [{"refs": ["turk"], "tr": "Yeniden seçimin asıl kazanımı yaptırım değil, mandatın tazelenmesidir: çoğunluk, İsrail'in Gazze ve Lübnan'daki eylemlerini eleştiren bir komiseri açıkça korudu. Bununla birlikte bu meşruiyetin sahada bir maliyet yaratıp yaratmayacağı belirsiz. İzlenecek gözlemlenebilir sinyal, karşı oy veren devletlerin insan hakları ofisiyle iş birliğini ya da katkı paylarını kısıp kısmayacağıdır; bu kısıtlama gelirse, oylama bir meşruiyet gösterisi olmanın ötesine geçemez demektir.", "en": "The real gain from the re-election is not enforcement but a renewed mandate: a majority explicitly protected a commissioner who criticises Israel's actions in Gaza and Lebanon. Whether that legitimacy produces any cost on the ground, however, is uncertain. The observable signal to watch is whether the states that voted against cut cooperation with the rights office or their funding contributions; if that constraint arrives, it means the vote cannot move beyond a display of legitimacy."}]}], "date": "2026-07-25"}, {"writer": "geo-01", "title": {"tr": "Washington'ın yeni tarife dayanağı: 301. Madde", "en": "Washington's new tariff authority: Section 301"}, "excerpt": {"tr": "Trump'ın AB'ye tarife tehdidi, hangi hukuki aracın gerçekten bağladığına dair bir mücadele. Yüksek Mahkeme geniş tarifeleri iptal edince başkan 1974 tarihli yasanın 301. Maddesine dönüyor; AB ise standardını Dijital Piyasalar Yasası'nın cezalarıyla koyuyor.", "en": "Trump's tariff threat to the EU is a contest over which legal instrument actually binds. When the Supreme Court struck down broad tariffs, the president turned to Section 301 of the 1974 act; the EU, meanwhile, sets its standard through the fines of its Digital Markets Act."}, "sources": [{"key": "eu-tariff", "kind": "news", "name": "The Journal", "url": "https://www.thejournal.ie/trump-threatens-eu-substantial-tariffs-fines-us-tech-firms-7112851-Jul2026/", "title": {"tr": "Trump, ABD'li teknoloji şirketlerine kesilen cezalara karşı AB'ye tarife tehdidi ve 301. Madde soruşturması açtı", "en": "Trump threatens EU tariffs and a Section 301 probe over fines on US tech firms"}, "publishedDate": "2026-07-24"}], "sections": [{"h": {"tr": "Hangi araç bağlar?", "en": "Which instrument binds?"}, "ps": [{"refs": ["eu-tariff"], "tr": "Önemli olan hangi metnin yürürlüğe girdiğidir, retorik değil. Trump, AB'nin ABD'li teknoloji şirketlerine kestiği cezalara misilleme olarak 1974 tarihli Ticaret Yasası'nın 301. Maddesi kapsamında bir soruşturma açacağını duyurdu. Bu tesadüf değil: Yüksek Mahkeme bu yıl başkanın en geniş tarifelerini iptal ettikten sonra 301. Madde, tarifeyi yeniden mümkün kılan hukuki kanal haline geldi. Tehdit, AB'nin Google'a 890 milyon avro; daha önce Meta'ya 200 milyon avro ve Apple'a 500 milyon avro ceza kesmesinin ardından geldi.", "en": "What matters is which text takes effect, not the rhetoric. Trump announced he would open an investigation under Section 301 of the 1974 Trade Act in retaliation for the EU's fines on US technology firms. This is no coincidence: after the Supreme Court struck down the president's widest tariffs this year, Section 301 became the legal channel that makes a tariff possible again. The threat followed the EU's fine of 890 million euros on Google, and its earlier fines of 200 million euros on Meta and 500 million euros on Apple."}]}, {"h": {"tr": "Standart koyan ile misilleme yapan", "en": "The standard-setter and the retaliator"}, "ps": [{"refs": ["eu-tariff"], "tr": "İki taraf iki farklı araçla konuşuyor: Brüksel, kapıya bir denetim standardı — Dijital Piyasalar Yasası — koyarak pazara erişimin kuralını belirliyor; Washington ise buna bir soruşturma yetkisiyle yanıt veriyor. Kritik kısıt şudur: 301. Madde bir tarifeyi doğrudan doğurmaz; ülkeye özgü bulgular ve bir süreç gerektirir. Bu nedenle asıl mesele, soruşturmanın somut bulgulara mı ulaşacağı yoksa tıkanıp bir siyasi sinyal olarak mı kalacağıdır. Yükü nihai olarak taşıyanlar, fiyat artışıyla karşılaşabilecek tüketiciler ve uygulama geliştiricileri olur.", "en": "The two sides speak through two different instruments: Brussels sets the rule of market access by placing an inspection standard — the Digital Markets Act — at the gate, while Washington answers with an authority to investigate. The critical constraint is this: Section 301 does not by itself produce a tariff; it requires country-specific findings and a process. So the real question is whether the investigation reaches concrete findings or stalls and remains a political signal. Those who ultimately bear the cost are consumers facing higher prices and app developers."}, {"refs": ["eu-tariff"], "tr": "Bir alternatif yorum, tehdidin bir müzakere açılışı olduğu ve AB'nin cezaları geri çekmesi halinde tarifenin hiç gelmeyeceğidir; AB yetkilileri kurallarının belirli bir ülkeyi değil rekabete aykırı davranışı hedeflediğini vurgulayarak bu zemini koruyor. İzlenecek gözlemlenebilir sinyal, 301 soruşturmasının ilerleyen dönemde ülkeye özgü resmî bulgular üretip üretmediği ve bir tarife oranının ilan edilip edilmediğidir.", "en": "One alternative reading is that the threat is a negotiating opener, and that if the EU withdraws the fines the tariff never arrives; EU officials protect that ground by stressing that their rules target anti-competitive conduct, not a specific country. The observable signal to watch is whether the Section 301 investigation produces formal country-specific findings in the period ahead and whether a tariff rate is announced."}]}], "date": "2026-07-25"}, {"writer": "geo-04", "title": {"tr": "Bir köprü açıldı, gümrük hattı gerginleşti", "en": "A bridge opened as the customs line tightened"}, "excerpt": {"tr": "Kanada, 4,7 milyar dolar değerindeki Gordie Howe Köprüsü'nü tek başına finanse edip ABD yetkilileri olmadan açtı. Sabit bir sınır geçişi, geçiş gelirinin rantı üzerinde bir kaldıraca dönüşüyor; Trump kârın yüzde 50'sini istiyor ve yüzde 50 tarife tehdidi ediyor.", "en": "Canada financed the 4.7 billion dollars Gordie Howe bridge alone and opened it without US officials. A fixed border crossing turns into leverage over the rent of its toll revenue; Trump wants 50 percent of the profit and threatens a 50 percent tariff."}, "sources": [{"key": "canada-bridge", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/7/24/canada-marks-gordie-howe-bridge-opening-without-us-after-trade-war-deepens", "title": {"tr": "Kanada, ticaret savaşı derinleşirken Gordie Howe Köprüsü'nü ABD olmadan açtı", "en": "Canada opens the Gordie Howe bridge without the US as the trade war deepens"}, "publishedDate": "2026-07-24"}], "sections": [{"h": {"tr": "Tek finansör, ortak trafik", "en": "One financier, shared traffic"}, "ps": [{"refs": ["canada-bridge"], "tr": "Podyumlara değil, yüke bakmak gerekir. Tamamı Kanada tarafından finanse edilen 4,7 milyar dolar değerindeki köprü, hiçbir ABD yetkilisinin katılmadığı bir törenle açıldı ve geçiş geliri paylaşımı anlaşmazlığı çözülmeden duruyor. Trump, Truth Social'da ABD'nin artık kârın yüzde 50'sini aldığını yazdı ve Kanada mallarına yüzde 50 tarife tehdidinde bulundu. Sayılar, bir altyapı projesinin nasıl bir pazarlık aracına dönüştüğünü gösteriyor: finansmanı bir taraf üstlenmiş, geliri iki taraf paylaşmaya çalışıyor.", "en": "Watch the cargo, not the podiums. The bridge, funded entirely by Canada for 4.7 billion dollars, opened in a ceremony no US official attended, and the toll-revenue-sharing dispute remains unresolved. On Truth Social, Trump wrote that the US now gets 50 percent of the profit and threatened a 50 percent tariff on Canadian goods. The figures show how an infrastructure project becomes a bargaining instrument: one side carried the financing, and both try to split the revenue."}]}, {"h": {"tr": "Sabit bir darboğazın rantı", "en": "The rent on a fixed chokepoint"}, "ps": [{"refs": ["canada-bridge"], "tr": "Bir köprünün asıl özelliği, kolayca yeniden yönlendirilememesidir; yük bu darboğazdan geçmek zorundaysa, geçiş geliri kimin cebine akacak sorusu doğrudan siyasi kaldıraç olur. Kanada mallarının yaklaşık yüzde 70'i ABD'ye gittiği için bağımlılık asimetriktir ve bu, ABD'ye pazarlıkta zaman avantajı verir. Buradaki mekanizma bir gümrük hattının rantı üzerindeki mücadeledir; bedeli, iki yakadaki taşıyıcılar ve nihayetinde daha yüksek geçiş maliyetiyle karşılaşabilecek tüketiciler öder.", "en": "A bridge's defining feature is that it cannot easily be rerouted; if cargo must pass through this chokepoint, the question of whose pocket the toll revenue flows into becomes direct political leverage. Because about 70 percent of Canadian goods go to the US, the dependency is asymmetric, and that gives the US a time advantage in bargaining. The mechanism here is a struggle over the rent of a customs line; the cost is borne by shippers on both banks and, ultimately, by consumers who may face higher crossing costs."}, {"refs": ["canada-bridge"], "tr": "Bir alternatif okuma, yüzde 50 tarife tehdidinin bir müzakere pozisyonu olduğu ve geçiş geliri paylaşımı yeniden düzenlenirse tarifenin gelmeyeceğidir. İzlenecek gözlemlenebilir sinyal nettir: ilerleyen dönemde taraflar geçiş geliri paylaşımını yeniden müzakere ederek bir formüle mi varır, yoksa yüzde 50 tarife fiilen uygulanıp maliyeti sınır ticaretine mi yansır?", "en": "One alternative reading is that the 50 percent tariff threat is a negotiating position, and that if toll-revenue sharing is renegotiated the tariff never arrives. The observable signal to watch is clear: in the period ahead, do the parties renegotiate the toll-revenue split into a formula, or is the 50 percent tariff actually imposed and its cost passed on to cross-border trade?"}]}], "date": "2026-07-25"}, {"writer": "geo-05", "title": {"tr": "Caracas mahkemeyi terk ederken kimin sesiyle konuşuyor?", "en": "Whose voice does Caracas claim as it leaves the court?"}, "excerpt": {"tr": "Venezuela, Uluslararası Ceza Mahkemesi'nden çekilirken kararını Afrika ve Latin Amerika'ya taraflılık diliyle sunuyor. Ama bu seçim, aynı zamanda 2017 müdahalesine ilişkin 2021 soruşturması ve Maduro sonrası bir iç geçişle şekilleniyor; failin sesi ile çıkarı iç içe.", "en": "As Venezuela withdraws from the International Criminal Court, it frames the decision in the language of bias against Africa and Latin America. But the choice is also shaped by the 2021 investigation into the 2017 crackdown and a domestic transition after Maduro; the actor's voice and its interest are intertwined."}, "sources": [{"key": "venezuela-icc", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/venezuela-to-exit-international-criminal-court-accusing-it-of-bias", "title": {"tr": "Venezuela, 'taraflılık' suçlamasıyla Uluslararası Ceza Mahkemesi'nden çekiliyor", "en": "Venezuela to leave the International Criminal Court, accusing it of 'bias'"}, "publishedDate": "2026-07-24"}], "sections": [{"h": {"tr": "Bölgenin dilinde bir çekilme", "en": "A withdrawal in the region's language"}, "ps": [{"refs": ["venezuela-icc"], "tr": "Caracas'ın anlatısı kendi diliyle başlıyor: Dışişleri Bakanı Felix Plasencia, mahkemenin çalışmalarını 'orantısız biçimde Afrika ve Latin Amerika ülkelerinde yoğunlaştıran coğrafi bir taraflılık' sergilediğini söyledi ve geçici Devlet Başkanı Delcy Rodriguez'in 'geri dönülemez' çekilme talimatı verdiğini açıkladı. Çekilme, Ulusal Meclis'in Aralık ayında Roma Statüsü taahhütlerini iptal etme oyuyla başlamış, BM'ye resmî bildirimle sürmüştü. Bu, dünyanın yalnızca iki başkentten yönetilmediği iddiasının bir örneği olarak sunuluyor.", "en": "Caracas frames its account in its own language: Foreign Minister Felix Plasencia said the court showed 'geographical bias, which has disproportionately concentrated its work on African and Latin American countries,' and announced that interim President Delcy Rodriguez had ordered an 'irrevocable' withdrawal. The withdrawal had begun with the National Assembly's December vote to cancel Rome Statute commitments and continued with the formal UN notification. It is presented as an instance of the claim that the world is not run from only two capitals."}]}, {"h": {"tr": "Failin çıkarları", "en": "The actor's interests"}, "ps": [{"refs": ["venezuela-icc"], "tr": "Ne var ki failin sesi çıkarından ayrı okunamaz. Mahkeme, Venezuela hükümetinin 2017'deki hükümet karşıtı gösterilere yönelik müdahalesinde işlenmiş olası insanlığa karşı suçlara ilişkin 2021'de bir soruşturma açmıştı; çekilme bu soruşturmayı doğrudan ilgilendiriyor. Karar ayrıca, ABD'nin eski Devlet Başkanı Nicolas Maduro'yu görevden uzaklaştırmasının ardından yönetimi devralan bir geçiş hükümetince alınıyor. Buradaki mekanizma, bölgesel dayanışma söyleminin aynı anda iç hesap verebilirlikten kaçınma işlevi görebilmesidir; bu iki okuma birbirini dışlamıyor.", "en": "Yet the actor's voice cannot be read apart from its interest. The court had opened a 2021 investigation into possible crimes against humanity by Venezuela's government during the 2017 anti-government protests; the withdrawal bears directly on that inquiry. The decision is also taken by a transitional government that assumed power after the US removed former President Nicolas Maduro. The mechanism here is that a discourse of regional solidarity can at the same time serve to avoid domestic accountability; the two readings do not exclude each other."}, {"refs": ["venezuela-icc"], "tr": "Bir alternatif yorum, çekilmenin öncelikle ilkeleri değil, hukuki riski yönetmeye dönük bir hamle olduğu ve taraflılık çerçevesinin bunu meşrulaştırdığıdır. İzlenecek gözlemlenebilir sinyal, kararın yalnız kalıp kalmadığıdır: başka Latin Amerika veya Afrika devletleri benzer bir çekilmeyi izlerse, Caracas'ın bölge adına konuşma iddiası güç kazanır; izole kalırsa, iddia ulusal bir çıkarı bölgesel dile sarmış görünür.", "en": "One alternative reading is that the withdrawal is above all a move to manage legal risk rather than principle, and that the bias frame legitimises it. The observable signal to watch is whether the decision stays isolated: if other Latin American or African states follow a similar withdrawal, Caracas's claim to speak for the region gains force; if it stays isolated, the claim looks like a national interest wrapped in regional language."}]}], "date": "2026-07-25"}, {"writer": "geo-06", "title": {"tr": "Afgan sınırının çözülmemiş hattında bir karakol", "en": "A checkpost on the Afghan border's unsettled line"}, "excerpt": {"tr": "Tank'taki karakol saldırısı, Afgan sınırına yakın bir noktada, sınır ötesi sığınmanın uzun bir örüntüsü üzerinde duruyor. 'Neden yine, neden şimdi' sorusunun yanıtı, sömürge döneminden kalma sınırda ve Taliban'ın Afganistan'da iktidara dönüşüyle değişen sığınma coğrafyasında yatıyor.", "en": "The checkpost attack in Tank sits near the Afghan border, on a long pattern of cross-border sanctuary. The answer to 'why again, why now' lies in a border inherited from the colonial era and in the geography of sanctuary that shifted with the Taliban's return to power in Afghanistan."}, "sources": [{"key": "pakistan-bomb", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/car-bomb-attack-kills-27-in-northwest-pakistan", "title": {"tr": "Pakistan'ın kuzeybatısında güvenlik karakoluna saldırı: 15 güvenlik görevlisi öldü", "en": "Attack on a security post in northwest Pakistan kills 15 security personnel"}, "publishedDate": "2026-07-24"}], "sections": [{"h": {"tr": "Sınırın uzun hafızası", "en": "The border's long memory"}, "ps": [{"refs": ["pakistan-bomb"], "tr": "Bugünün krizi çoğu zaman dünün haritasının bir dipnotudur. Tank ilçesindeki güvenlik karakoluna düzenlenen gece saldırısında, orduya göre 12 asker, 2 polis ve 1 orman görevlisi olmak üzere 15 güvenlik görevlisi öldü; Al Jazeera 12 saldırganla toplamı 27 olarak verdi ve Pakistan Talibanı saldırıyı üstlendi. Saldırının coğrafyası tesadüf değil: Tank, Afgan sınırının hemen gerisinde, sömürge döneminde çizilmiş ve iki yakadaki toplulukları bölen bir hattın üzerinde yer alıyor. Bu hat, bir asrı aşkın süredir sınır ötesi sığınma sorununu çözmeden dondurdu.", "en": "Today's crisis is often a footnote to yesterday's map. In the overnight attack on the security post in Tank district, the military said 15 security personnel were killed — 12 soldiers, 2 police officers and 1 forestry official — while Al Jazeera put the total at 27 with 12 attackers, and the Pakistani Taliban claimed the assault. The geography of the attack is no accident: Tank lies just behind the Afghan border, on a line drawn in the colonial era that split the communities on either side. For more than a century that line has frozen the problem of cross-border sanctuary without resolving it."}]}, {"h": {"tr": "Neden yine, neden şimdi", "en": "Why again, why now"}, "ps": [{"refs": ["pakistan-bomb"], "tr": "Eski bir hat tek başına bir açıklama değildir; mekanizmayı bugünkü koşul tamamlar. Al Jazeera, bölgedeki güvenlik gücü kayıplarının 2024'te 1.620'den ertesi yıl 2.331'e yükseldiğini, ülke genelinde saldırıların yüzde 34 arttığını ve şiddetin Afganistan'da Taliban'ın iktidara dönüşünden bu yana hızlandığını, silahlı grupların orada sığınak bulduğunu aktarıyor. Kritik ayrım budur: sınır bir asırdır oradaydı; değişen, hattın öbür yakasındaki yönetimdir. Bu nedenle bugünkü tırmanma yeni bir sığınma coğrafyasının sonucudur, kaçınılmaz bir kader değil.", "en": "An old line is not by itself an explanation; the present condition completes the mechanism. Al Jazeera reports that regional security-force fatalities rose from 1,620 in 2024 to 2,331 the following year, that attacks nationwide rose 34 percent, and that the violence has accelerated since the Taliban's return to power in Afghanistan, where armed groups find shelter. That is the decisive distinction: the border has been there for a century; what changed is the authority on the far side of it. So today's escalation is the result of a new geography of sanctuary, not an inevitable fate."}, {"refs": ["pakistan-bomb"], "tr": "Bir alternatif yorum, tırmanmanın öncelikle sınır ötesi sığınmadan değil, yerel yönetim boşlukları ve ekonomik kırılganlıktan kaynaklandığıdır; kanıt henüz iki etkeni kesin biçimde ayırmıyor. İzlenecek gözlemlenebilir sinyal, Pakistan'ın sınır ötesi operasyonlarını ya da Afganistan'la ilişkilerini ilerleyen dönemde değiştirip değiştirmediğidir; bu değişim gelirse, sığınma mekanizmasının merkeziliği doğrulanır.", "en": "One alternative reading is that the escalation stems primarily not from cross-border sanctuary but from local governance gaps and economic fragility; the evidence does not yet cleanly separate the two factors. The observable signal to watch is whether Pakistan changes its cross-border operations or its relations with Afghanistan in the period ahead; if that change arrives, it confirms the centrality of the sanctuary mechanism."}]}], "date": "2026-07-25"}, {"writer": "geo-01", "title": {"tr": "İmzalı Metin, Sonradan Gelen Koşul: Suudi Nükleer Anlaşmasını Hangi Belge Yönetecek?", "en": "A Signed Text, a Later Condition: Which Instrument Will Govern the Saudi Nuclear Deal?"}, "excerpt": {"tr": "ABD–Suudi 123 anlaşması imzalandı, ancak henüz Kongre incelemesinden geçmedi. Trump'ın ertesi gün açıkladığı İsrail'le normalleşme koşulu imzalı metinle birlikte duyurulmadı; Riyad'dan da bu koşulu kabul ettiğini gösteren kamuya açık bir açıklama gelmedi. Belirleyici soru, hangi koşulun hangi hukuki araçla bağlayıcı hâle geleceği.", "en": "The US-Saudi 123 agreement has been signed but has not yet completed congressional review. Trump's Israel-normalisation condition was announced the following day, not with the signed text, and Riyadh made no public statement accepting it. The decisive question is which condition becomes binding through which legal instrument."}, "sources": [{"key": "saudi-report", "kind": "news", "name": "NPR via KPBS", "url": "https://www.kpbs.org/news/environment/2026/07/23/trump-says-saudi-arabias-nuclear-deal-hinges-on-the-kingdom-normalizing-israel-ties", "title": {"tr": "Trump: İmzalanan Suudi nükleer anlaşması İsrail'le ilişkilerin normalleşmesine bağlı", "en": "Trump says the signed Saudi nuclear deal is conditional on normalizing ties with Israel"}, "publishedDate": "2026-07-23"}, {"key": "doe", "kind": "news", "name": "US Department of Energy", "url": "https://www.energy.gov/articles/united-states-and-saudi-arabia-reach-historic-nuclear-cooperation-agreement", "title": {"tr": "ABD ve Suudi Arabistan nükleer işbirliği anlaşmasına ulaştı", "en": "United States and Saudi Arabia reach nuclear cooperation agreement"}, "publishedDate": "2026-07-23"}, {"key": "crs", "kind": "news", "name": "Congressional Research Service", "url": "https://www.congress.gov/crs-product/R48162", "title": {"tr": "Nükleer enerjinin barışçıl kullanımı için ABD işbirliği anlaşmaları", "en": "US agreements for cooperation in the peaceful uses of nuclear energy"}, "publishedDate": "2024-08-20"}], "sections": [{"h": {"tr": "İmza, inceleme, yürürlük", "en": "Signature, review, entry into force"}, "ps": [{"refs": ["doe", "crs"], "tr": "Enerji Bakanlığı, 123 anlaşmasının imzalandığını ve Kongre'ye iletileceğini açıkladı. Bu sıra önemlidir: imza iki hükümetin metin üzerinde anlaştığını gösterir; Kongre incelemesi tamamlanmadan anlaşmanın bütün siyasi ve hukuki eşikleri geçildiği söylenemez. Kongre Araştırma Servisi'nin 123 anlaşmaları çerçevesi de inceleme aşamasını yürürlüğe eşitlememek gerektiğini gösteriyor.", "en": "The Department of Energy says the 123 agreement has been signed and will be transmitted to Congress. The sequence matters: signature shows that the two governments agreed a text, but it does not mean every political and legal threshold has been cleared before congressional review is complete. The Congressional Research Service framework for 123 agreements likewise distinguishes review from entry into force."}, {"refs": ["saudi-report"], "tr": "Trump ertesi gün onayı Riyad'ın İsrail'le ilişkileri normalleştirmesine 'tümüyle bağlı' ilan etti. Beyaz Saray Sözcüsü Karoline Leavitt, paylaşım öncesinde Suudi yönetimine danışılmadığını söyledi; haber yayımlandığında Riyad'dan kamuya açık bir kabul de yoktu. Bu nedenle koşul, ortaklaşa kabul edilmiş bir anlaşma maddesi değil, ABD Başkanı'nın açıkladığı bir siyasi pozisyondur.", "en": "The following day Trump declared approval 'totally subject to' Riyadh normalising relations with Israel. White House press secretary Karoline Leavitt said the Saudi government had not been consulted before the post, and there was no public Saudi acceptance when the report was published. The condition is therefore a political position announced by the US president, not a jointly accepted clause of the agreement."}]}, {"h": {"tr": "“Zenginleştirme yok” cümlesinin sınırı", "en": "The limit of the “no enrichment” line"}, "ps": [{"refs": ["saudi-report"], "tr": "NPR'ın erişilebilir ortak yayınındaki hukuki ayrım daha dardır: anlaşma ve eşlik eden protokol, üçüncü ülkede üretilmiş yakıtın ABD teknolojisiyle zenginleştirilmesini açıkça yasaklamıyor. Bu, faaliyete verilmiş olumlu bir izinle aynı şey değildir. Metindeki yasağın yokluğu, gelecekteki lisansların, uygulama düzenlemelerinin ve denetim koşullarının neye izin vereceği sorusunu açık bırakır.", "en": "The legal distinction in NPR's accessible syndicated report is narrower: the agreement and accompanying protocol do not expressly prohibit enrichment with US technology of fuel produced in a third country. That is not the same as an affirmative authorisation. The absence of a prohibition leaves open what future licences, implementing arrangements and safeguards would permit."}, {"refs": ["saudi-report", "doe"], "tr": "Haberde ayrıca anlaşmanın BAE ile yapılan düzenlemedeki 'altın standart' niteliğinde zenginleştirme yasağını ve IAEA Ek Protokolü şartını taşımadığı belirtiliyor. Bu eksikler tek başına kötüye kullanım kanıtı değildir; ancak Trump'ın kamuya açık 'zenginleştirme olmayacak' güvencesinin hangi bağlayıcı metinde, hangi doğrulama mekanizmasıyla uygulanacağını sormayı zorunlu kılar.", "en": "The report also says the agreement lacks the UAE arrangement's 'gold-standard' enrichment ban and a requirement for the IAEA Additional Protocol. Those omissions are not evidence of misuse by themselves, but they make it necessary to ask which binding instrument and verification mechanism would implement Trump's public assurance that there will be no enrichment."}]}, {"h": {"tr": "Dört gözlenebilir eşik", "en": "Four observable thresholds"}, "ps": [{"refs": ["doe", "saudi-report", "crs"], "tr": "Kurumsal sürecin sonraki aşaması dört gözlenebilir gelişmede somutlaşacak: anlaşmanın Kongre'ye hangi eklerle iletildiği, inceleme sırasında hangi koşulların bağlayıcı metne girdiği, Suudi Arabistan'ın normalleşme şartına nasıl yanıt verdiği ve zenginleştirme ile denetimi düzenleyen uygulama belgelerinin ne söylediği. Bu dört gelişme netleşmeden normalleşmenin anlaşmayı kesin olarak açacağı ya da kapatacağı söylenemez. Şimdilik imzalı metin ile sonradan açıklanan siyasi koşul arasında kurumsal bir boşluk bulunuyor.", "en": "The next institutional stage will take shape through four observable developments: which annexes accompany transmission to Congress, which conditions enter binding text during review, how Saudi Arabia responds to the normalisation demand, and what implementing documents say about enrichment and safeguards. Until those four developments become clear, it is not possible to say that normalisation will definitively make or break the agreement. For now, an institutional gap remains between the signed text and the political condition announced later."}]}], "date": "2026-07-24"}, {"writer": "geo-02", "title": {"tr": "İki Ayrı Kanal, Ortak Takvim Yok", "en": "Two Separate Channels, No Shared Calendar"}, "excerpt": {"tr": "Rubio ile Lavrov Perşembe günü Manila'da görüştü; Zelenskiy ise ABD temsilcileriyle Çarşamba günü konuştuğunu açıkladı. İki temas aynı savaş dosyasına uzanıyor, fakat farklı günlerde ve farklı kanallarda gerçekleşti. Kamuya açıklanan bilgiler onları ortak bir yol haritasında buluşturmuyor. İletişim sürüyor; uzlaşmaya giden kurumsal köprü henüz kurulmadı.", "en": "Rubio and Lavrov met in Manila on Thursday; Zelenskyy said he had spoken with US envoys on Wednesday. The contacts concern the same war, but they occurred on different days and through different channels. The public accounts provide no common roadmap between them. Communication continues; an institutional bridge to a settlement has yet to emerge."}, "sources": [{"key": "rubio", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/top-us-and-russian-diplomats-discuss-ukraine-war-in-manila", "title": {"tr": "Rubio ve Lavrov Manila'da yarım saat görüştü: Eylül'den bu yana ilk temas", "en": "Rubio and Lavrov meet in Manila for half an hour, their first talks since September"}, "publishedDate": "2026-07-23"}, {"key": "zel", "kind": "news", "name": "The Defense Post", "url": "https://thedefensepost.com/2026/07/23/ukraine-zelensky-us-envoys-talks/", "title": {"tr": "Zelenskiy, 'diplomasiyi canlandırmak' için Trump'ın temsilcileri Witkoff ve Kushner'la görüştüğünü açıkladı", "en": "Zelenskyy says he spoke with Trump envoys Witkoff and Kushner to 'reinvigorate diplomacy'"}, "publishedDate": "2026-07-23"}], "sections": [{"h": {"tr": "Manila görüşmesinden iki anlatı", "en": "Two accounts of the Manila meeting"}, "ps": [{"refs": ["rubio"], "tr": "Rubio ile Lavrov, ASEAN toplantısının kulisinde yarım saati biraz aşan bir görüşme yaptı; bu, Eylül 2025'ten beri ilk yüz yüze temaslarıydı. Rubio görüşmeyi 'iyi ve samimi' diye niteledi ve Washington'ın yapıcı rol oynamaya hazır olduğunu söyledi. Rusya Dışişleri Bakanlığı da Lavrov'un diplomatik çözüme hazır olduklarını yinelediğini açıkladı. Görüşmenin gerçekleştiği doğrulandı; kamuya açıklanan bilgiler ortaklaşa benimsenmiş bir sonuç sunmuyor.", "en": "Rubio and Lavrov met for just over half an hour on the sidelines of the ASEAN gathering, their first face-to-face contact since September 2025. Rubio called it a 'good, frank conversation' and said Washington was prepared to play a constructive role. Russia's foreign ministry separately said Lavrov reiterated readiness for a diplomatic settlement. The meeting is verified; the public accounts offer no mutually accepted outcome."}, {"refs": ["rubio"], "tr": "Taraflar ortak açıklama yayımlamadı. Rubio gazetecilere konuştu, ancak Rusya'nın tutumunu ayrıntılı biçimde tanımlamaktan kaçındı. Lavrov'un bakanlığı Ağustos 2025 Alaska görüşmesindeki fikirlere atıf yaptı ve Kiev'e silah sevkiyatına itirazını yineledi. Her iki başkentin kendi açıklamalarındaki 'hazırız' dili, ortak gündem, takvim ve karşılıklı taviz sorularını açık bırakıyor.", "en": "The parties issued no joint readout. Rubio spoke to reporters but declined to characterise Russia's position in detail. Lavrov's ministry referred to ideas from the August 2025 Alaska meeting and repeated its objection to arms supplies for Kyiv. Readiness, voiced by each capital in its own account, leaves the agenda, timetable and any reciprocal concession unresolved."}]}, {"h": {"tr": "Kiev hattının farklı tarihi", "en": "The Kyiv channel's different date"}, "ps": [{"refs": ["zel", "rubio"], "tr": "Zelenskiy, Witkoff ve Kushner'la Çarşamba günü konuştu; Rubio ile Lavrov ise Perşembe günü Manila'da buluştu. Kiev hattında açıklanan amaç “diplomasiyi canlandırmak”tı, Manila görüşmesinde ise Washington ile Moskova kendi pozisyonlarını ayrı ayrı kayda geçirdi. Bir gün arayla yürüyen bu temaslar, ABD'nin iki tarafla da konuşabildiğini gösteriyor; ancak açıklanan bilgiler bu görüşmeleri ortak bir gündeme, takvime veya takip mekanizmasına bağlamıyor.", "en": "Zelenskyy spoke with Witkoff and Kushner on Wednesday; Rubio and Lavrov met in Manila on Thursday. The declared aim on the Kyiv channel was “to reinvigorate diplomacy,” while Washington and Moscow set out their positions separately in Manila. These contacts, one day apart, show that the United States can speak with both sides, but nothing disclosed publicly links the meetings through a shared agenda, timetable or follow-up mechanism."}, {"refs": ["zel"], "tr": "ABD öncülüğündeki görüşmeler, Washington'ın dikkatinin başka krizlere kayması ve Moskova'nın Ukrayna'dan toprak talebini sürdürmesiyle tıkanmış durumda. Zelenskiy'nin “onurlu barış” vurgusu, Kiev'in bu koşulu kabul etmeden iletişimi sürdürdüğünü gösteriyor. Kanal açık, fakat tarafların barışın şartlarına ilişkin mesafesi korunuyor; siyasi yakınsama henüz ortaya çıkmadı.", "en": "US-led talks remain stalled as Washington's attention has shifted to other crises and Moscow has maintained its demand that Ukraine cede territory. Zelenskyy's emphasis on “peace with dignity” shows Kyiv continuing contact without accepting that condition. The channel remains open, while the parties retain their distance over the terms of peace; diplomatic movement has yet to yield political convergence."}]}, {"h": {"tr": "İlerlemeyi ne kanıtlar?", "en": "What would demonstrate progress?"}, "ps": [{"refs": ["rubio", "zel"], "tr": "İlerleme dört somut gelişmeyle görünür hâle gelecek: tarafların birlikte duyurduğu bir görüşme formatı, üzerinde uzlaşılan gündem, karşılıklı bir taviz veya tarihli takip mekanizması. İki kamu kaynağında da bu gelişmeler yer almıyor. Açık kalan iletişim yanlış hesap riskini azaltabilir; pozisyonların sabit kalması halinde aynı temaslar statükoyu uzatabilir. Kanallar çalışıyor, aralarındaki bağlantı mekanizması ise henüz oluşmadı.", "en": "Progress will become visible through four concrete developments: a meeting format announced jointly by the parties, an agreed agenda, a reciprocal concession or a dated follow-up mechanism. Both public sources lack all four. Open communication may reduce miscalculation; with positions unchanged, the same contacts may prolong the status quo. The channels remain active, while a mechanism connecting them has yet to emerge."}]}], "date": "2026-07-24"}, {"writer": "geo-03", "title": {"tr": "On Üçüncü Gece: Bildirilen Hedefler, Doğrulanmayan Etkiler", "en": "Night Thirteen: Declared Targets, Unverified Effects"}, "excerpt": {"tr": "CENTCOM on üçüncü gece için hedef kategorileri açıkladı; İran ise Körfez'deki ABD tesislerine füze ve İHA gönderdiğini söyledi. Trump'ın “büyük çaplı saldırı” değerlendirmesi bir karar değil, siyasi sinyal. Bu tabloda hedef beyanları ve saldırı iddiaları tarafların açıklamalarını, teyitli hasar ile tanker rotaları ve piyasa tepkisi ise gözlenebilir sonuçları oluşturuyor.", "en": "CENTCOM listed target categories for a thirteenth night; Iran said it launched missiles and drones at US facilities in the Gulf. Trump's consideration of a “massive attack” is a political signal, not an order. In this picture, target statements and attack claims represent the parties' accounts, while confirmed damage, tanker routing and market response constitute observable outcomes."}, "sources": [{"key": "iran", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/trump-warns-of-biggest-strikes-yet-on-iran-as-tehran-lashes-out-across-gulf", "title": {"tr": "ABD 13. gece İran'ı vurdu; Trump 'büyük çaplı saldırı' değerlendirdiğini söyledi", "en": "US strikes Iran for a 13th night as Trump says he is weighing a 'massive attack'"}, "publishedDate": "2026-07-23"}, {"key": "yemen", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/un-envoy-for-yemen-alarmed-by-houthis-red-sea-attacks-calls-for-talks", "title": {"tr": "BM temsilcisi, Husilerin Kızıldeniz saldırılarından 'endişeli'; görüşmelere dönüş çağrısı yaptı", "en": "UN envoy 'alarmed' by renewed Houthi Red Sea attacks, urges a return to talks"}, "publishedDate": "2026-07-24"}, {"key": "tanker-corroboration", "kind": "news", "name": "Associated Press", "url": "https://apnews.com/article/6ee98d611669dc84953d2f2e15958bf9", "title": {"tr": "Husi saldırısı Suudi tankerinde yangına yol açtı; can kaybı bildirilmedi", "en": "Houthi attack causes fire on Saudi tanker; no casualties reported"}, "publishedDate": "2026-07-23"}], "sections": [{"h": {"tr": "Beyan edilen hedefler", "en": "Declared targets"}, "ps": [{"refs": ["iran"], "tr": "CENTCOM, on üçüncü gece saldırılarında askerî komuta merkezleri, İHA depolama alanları, haberleşme ağları, kıyı gözetleme noktaları ve deniz kabiliyetlerini hedeflediğini açıkladı. Bu hedef seti komuta-kontrol ile İHA ve kıyı/deniz altyapısına dönük baskıyı tarif ediyor; İran'ın cephaneliklerinin bütünü veya kalan saldırı kapasitesi hakkında bir bilanço sunmuyor. Trump'ın Axios'a daha büyük bir saldırıyı değerlendirdiğini ve karara yakın olduğunu söylemesi ise siyasi bir eşik sinyali; operasyon emri ya da buna eşlik eden yeni kuvvet hareketi açıklanmış değil.", "en": "CENTCOM said its strikes on the thirteenth night targeted military command centres, drone-storage sites, communications networks, coastal-surveillance sites and maritime capabilities. This target set describes pressure on command-and-control, drone and coastal-maritime infrastructure; it does not provide an inventory of Iran's arsenals or remaining strike capacity. Trump's statement to Axios that he was considering a larger attack and was close to a decision is a political threshold signal; no operational order or accompanying new force movement has been announced."}, {"refs": ["iran"], "tr": "İran ordusu Bahreyn, Kuveyt ve Ürdün'deki ABD üs ve tesislerine füze ve İHA gönderdiğini açıkladı. Kuveyt ordusu hava savunmasının bazı hedefleri önlediğini söyledi; haber bir telekom kulesinin vurulduğunu da aktarıyor. İran ve Kuveyt'in açıklamaları operasyonun iki taraflı anlatısını kuruyor; telekom kulesindeki hasarın çapı ise bağımsız bir saha incelemesi olmadığı için belirsiz. Bu belirsizlik sürerken saldırıların gerçek isabet ve önleme oranlarından kesin bir kabiliyet hükmü çıkarmak erken.", "en": "Iran's military said it launched missiles and drones at US bases and facilities in Bahrain, Kuwait and Jordan. Kuwait's military said its air defences intercepted some targets, and the report also described a telecommunications tower being hit. The Iranian and Kuwaiti statements provide the two sides' accounts of the operation, while the extent of damage to the telecommunications tower remains unclear without an independent field assessment. Until that picture sharpens, it is too early to draw firm conclusions about actual strike and interception rates."}]}, {"h": {"tr": "Kızıldeniz'de farklı teyit düzeyleri", "en": "Different levels of confirmation in the Red Sea"}, "ps": [{"refs": ["yemen", "tanker-corroboration"], "tr": "Husiler iki Suudi tankerini vurduklarını söyledi; BM Yemen Özel Temsilcisi Hans Grundberg saldırıların yenilenmesinden endişe duyduğunu belirterek müzakerelere dönüş çağrısı yaptı. Associated Press, Suudi kaynakları ve UKMTO kayıtlarına dayanarak gemilerden biriyle bağlantılı yangını teyit etti ve can kaybı bildirilmediğini aktardı. Böylece doğrulanabilen fiziksel etki bir tankerdeki yangınla sınırlı kalırken, ikinci gemiye ilişkin iddia Husi beyanına dayanıyor. En az beş tankerin rota değiştirmesi ise güvenlik riskine verilen ölçülebilir ticari tepkidir.", "en": "The Houthis said they struck two Saudi tankers; UN Special Envoy for Yemen Hans Grundberg expressed alarm at the renewed attacks and called for a return to negotiations. The Associated Press, drawing on Saudi reporting and UKMTO records, corroborated a fire involving one vessel and reported no casualties. The confirmed physical effect is therefore limited to a fire on one tanker, while the account of a second vessel rests on the Houthi statement. The diversion of at least five tankers is a measurable commercial response to the security risk."}]}, {"h": {"tr": "Tırmanma testi", "en": "The escalation test"}, "ps": [{"refs": ["iran", "yemen", "tanker-corroboration"], "tr": "İran dosyası ile Kızıldeniz dosyası aynı anda taşımacılık ve enerji maliyetlerini etkileyebilir; kaynaklar aralarında ortak komuta veya doğrudan neden-sonuç bağı kurmuyor. Operasyonel birleşme dört gözlenebilir işaretle görünür hâle gelir: resmî yeni bir saldırı emri, buna uygun kuvvet konuşlandırması, bağımsız teyitli hasar ve tanker rotalarıyla sigorta fiyatlarında kalıcı değişim. Bu göstergeler henüz bir araya gelmediği için iki cephe, ortak harekâttan çok birbirinin maliyetini büyütebilen ayrı risk hatları olarak duruyor.", "en": "The Iran and Red Sea files may simultaneously affect shipping and energy costs; the sources do not establish common command or direct causation between them. Operational convergence would become visible through four observable indicators: a formal new strike order, matching force deployments, independently confirmed damage, and sustained changes in tanker routing and insurance prices. Those indicators have not yet come together, leaving the two fronts as separate risk channels that can compound each other's costs rather than a joint campaign."}]}], "date": "2026-07-24"}, {"writer": "geo-04", "title": {"tr": "Yürürlük Saati ile Kabul Prosedürü Arasında: İki Ekonomik Baskı Aracı", "en": "Between an Effective Time and an Adoption Procedure: Two Economic Coercion Tools"}, "excerpt": {"tr": "ABD'nin zorla çalıştırma tarifeleri 24 Temmuz 00.01'de yürürlüğe giriyor; AB büyükelçilerinin Rusya paketindeki anlaşması ise yazılı kabul aşamasındaydı. Biri ürün istisnaları ve MFN tavanlarıyla, diğeri petrol, finans ve LNG için ayrı kurallarla çalışıyor. Etkiyi ölçmek için araçları ve ticaret akışlarını ayırmak gerekir.", "en": "The US forced-labour tariffs take effect at 12:01 a.m. on July 24; the EU ambassadors' agreement on a Russia package was still entering written adoption. One operates with product exemptions and MFN caps, the other with separate rules for oil, finance and LNG. Measuring effects requires keeping instruments and trade flows distinct."}, "sources": [{"key": "tariff", "kind": "news", "name": "Office of the US Trade Representative", "url": "https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ustr-takes-action-forced-labor-section-301-investigations", "title": {"tr": "ABD, zorla çalıştırma gerekçesiyle 60 ticaret ortağına yüzde 10–12,5 tarife koydu", "en": "US sets 10%–12.5% tariffs on 60 trading partners, citing forced labor"}, "publishedDate": "2026-07-23"}, {"key": "eusanc", "kind": "news", "name": "RTÉ", "url": "https://www.rte.ie/news/2026/0723/1584733-eu-agrees-new-round-of-sanctions-on-russia-diplomats/", "title": {"tr": "AB temsilcileri Rusya'ya 21. yaptırım paketinde anlaştı; petrol tavan fiyatı donduruldu", "en": "EU envoys agree a 21st sanctions package on Russia, freezing the oil price cap"}, "publishedDate": "2026-07-23"}, {"key": "tariff-notice", "kind": "news", "name": "Office of the US Trade Representative", "url": "https://ustr.gov/sites/default/files/files/Press/Releases/2026/FLIP%20301%20Investigation%20Final%20Action%20FRN%207-23-26%20FINAL.pdf", "title": {"tr": "Zorla çalıştırma soruşturmalarında nihai 301. madde eylemi", "en": "Final Section 301 action in the forced-labour investigations"}, "publishedDate": "2026-07-23"}], "sections": [{"h": {"tr": "Tarifenin gerçek kapsamı", "en": "The tariff's actual scope"}, "ps": [{"refs": ["tariff", "tariff-notice"], "tr": "USTR'nin nihai eylemi 60 ekonomi için 301. madde vergileri getiriyor. Belirli ekonomiler yüzde 10, diğerlerinin çoğu yüzde 12,5 oranına tabi; AB ve Tayvan için mevcut MFN vergisiyle toplam oran yüzde 10'u, Japonya, Kore ve İsviçre için yüzde 12,5'i aşmayacak biçimde hesaplanıyor. USTR'nin nihai karar metni ayrıca ham maddeler ile arz açığı veya ekonomi çapında aksama riski taşıyan ürünler için çeşitli istisnalar öngörüyor. Bu nedenle gümrükteki fiilî yükü manşet oranı tek başına değil, ekonominin mevcut MFN oranı ile ürünün istisna kapsamı birlikte belirleyecek.", "en": "USTR's final action imposes Section 301 duties on 60 economies. Specified economies face 10%, most others 12.5%; for the EU and Taiwan, the combined MFN and Section 301 rate is capped at 10%, while Japan, Korea and Switzerland are capped at 12.5%. USTR's final notice also provides exemptions for raw materials and products associated with supply shortages or economy-wide disruption risks. The actual burden at customs will therefore be determined not by the headline rate alone but by the interaction between an economy's existing MFN rate and a product's eligibility for exemption."}, {"refs": ["tariff", "tariff-notice"], "tr": "Vergiler 24 Temmuz ABD Doğu saatiyle 00.01'de yürürlüğe giriyor; 28 Temmuz'a kadar transit hâlindeki bazı mallar için geçiş süresi var. Menşe belgeleri, istisna kullanımı ve üçüncü ülke montajı üzerindeki etkiler, uygulama başladıktan sonra gümrük verilerinde görünür hâle gelecek. Hangi ürünlerin istisna kullandığı, hangi oranların fiilen tahsil edildiği ve ithalatın ürün ve ülke bazında nasıl yön değiştirdiği, düzenlemenin tedarik zincirini nerede yeniden şekillendirdiğini gösterecek.", "en": "The duties take effect at 12:01 a.m. Eastern time on July 24, with a transit grace period for certain goods through July 28. Effects on origin documentation, exemption use and third-country assembly will become visible in customs data after implementation begins. Which products use exemptions, which rates customs actually collects, and how imports shift by product and country will show where the measure reshapes the supply chain."}]}, {"h": {"tr": "AB paketinin ayrı hatları", "en": "The EU package's separate tracks"}, "ps": [{"refs": ["eusanc"], "tr": "AB büyükelçileri 21. pakette anlaştı; haber yayımlandığında teknik çalışma sürüyor ve yazılı kabul prosedürü henüz başlayacaktı. Paket 94 finans kuruluşunu, Moskova borsasını, gölge filo gemilerini, kripto ve petrol ticareti şirketlerini hedefliyor; Rus petrolü için tavan fiyatı 12 ay boyunca varil başına 44,10 dolarda tutuyor. 'Anlaşma' ile 'resmen kabul edilmiş ve uygulanıyor' aşamaları aynı değildir.", "en": "EU ambassadors agreed the 21st package; when the report was published, technical work continued and the written adoption procedure was still to begin. The package targets 94 financial institutions, Moscow's stock exchange, shadow-fleet vessels and crypto and oil-trading companies, while holding the Russian oil cap at $44.10 a barrel for 12 months. Agreement is not the same stage as formal adoption and implementation."}, {"refs": ["eusanc"], "tr": "Yunanistan'ın talebiyle getirilen bir yıllık ve kendiliğinden yenilenen istisna, AB şirketlerinin Rus LNG'sini üçüncü ülkelere aktarmasına izin veriyor; AB'nin kendi Rus LNG ithalat yasağı ise sürüyor. Bu istisna ham petrol tavanının veya gölge filo önlemlerinin bir rotası değildir. Ham petrol akışı, LNG aktarımı ve finansal hedefleme ayrı mallar, sözleşmeler ve uygulama düğümleri üzerinden izlenmelidir.", "en": "A one-year, auto-renewing exception requested by Greece allows EU companies to transfer Russian LNG to third countries, while the EU's own ban on Russian LNG imports remains. The exception is not a route for crude oil subject to the price cap or for shadow-fleet measures. Crude flows, LNG transfers and financial targeting must be tracked through separate commodities, contracts and enforcement nodes."}]}, {"h": {"tr": "Etkiyi ayrı sayaçlarla ölçmek", "en": "Measuring impact with separate counters"}, "ps": [{"refs": ["tariff", "eusanc"], "tr": "İki aracın başarısı farklı veri akışlarında görünür olacak. ABD tarifesinde fiilî vergi tahsilatı, ürün istisnaları, ithalat payları ve ortak ülkelerin zorla çalıştırma yasaklarını uygulama düzeyi belirleyici; AB paketinde ise Rus ham petrolünün gerçekleşen satış fiyatı, fiyat tavanı hizmetlerine erişim ve gölge filo hacmi öne çıkıyor. LNG'nin üçüncü ülkelere transferi ayrı bir akış oluşturuyor. Bu göstergelerdeki kalıcı değişimler, düzenleme metninin ötesinde ticaretin gerçekten nereye yöneldiğini gösterecek.", "en": "The success of the two instruments will become visible in different data streams. For the US tariffs, duties actually collected, product exemptions, import shares and partners' enforcement of forced-labour bans will be decisive; for the EU package, realised Russian crude prices, access to price-cap services and shadow-fleet volumes come to the fore. Third-country transfers of LNG form a separate flow. Sustained changes in these indicators will show where trade is actually moving beyond the rule text."}]}], "date": "2026-07-24"}, {"writer": "geo-05", "title": {"tr": "Manila denizdeki iddiasını korudu, sekiz hükümet Kudüs için ortak bildiri yayımladı", "en": "Manila held its claim at sea while eight governments issued a joint statement on Jerusalem"}, "excerpt": {"tr": "Filipin tekneleri Çin'in yakın manevrası ve tazyikli su kullanımına rağmen ikmal görevini tamamladı; sekiz Arap ve Müslüman devlet Mescid-i Aksa konusunda ortak bildiri yayımladı. Scarborough'da Manila kendi deniz iddiasını sahada sürdürürken, Kudüs dosyasında sekiz hükümet ortak diplomatik dil kurdu. Her iki eylem de kendi aktörlerinin siyasi iradesini görünür kılıyor; araçları, muhatapları ve maliyetleri ise birbirinden farklı.", "en": "Philippine boats completed their resupply mission despite a close Chinese manoeuvre and water-cannon use; eight Arab and Muslim states issued a joint statement on Al-Aqsa. At Scarborough, Manila sustained its maritime claim in practice; in the Jerusalem file, eight governments built shared diplomatic language. Both actions make their actors' political agency visible, while their instruments, counterparts and costs remain distinct."}, "sources": [{"key": "phil", "kind": "news", "name": "Hong Kong Free Press", "url": "https://hongkongfp.com/2026/07/23/philippines-says-china-harassed-its-vessels-in-disputed-waters/", "title": {"tr": "Çin sahil güvenliği, Scarborough Sığlığı yakınında bir Filipin teknesine tazyikli su sıktı", "en": "Chinese coast guard fires a water cannon at a Philippine boat near Scarborough Shoal"}, "publishedDate": "2026-07-23"}, {"key": "aqsa", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/arab-and-muslim-countries-condemn-israeli-escalation-at-al-aqsa-mosque", "title": {"tr": "Sekiz Arap ve Müslüman ülke, İsrailli yerleşimcilerin Mescid-i Aksa'ya girişini ortak kınadı", "en": "Eight Arab and Muslim states jointly condemn an Israeli-settler entry into Al-Aqsa"}, "publishedDate": "2026-07-23"}], "sections": [{"h": {"tr": "Görevin sonucu ile baskının biçimi", "en": "The mission's outcome and the form of pressure"}, "ps": [{"refs": ["phil"], "tr": "Filipin Sahil Güvenliği'ne göre bir Çin gemisi BRP Datu Dumangsil'e 50 metreye kadar yaklaşıp iki dakika tazyikli su kullandı; ikinci Çin gemisi kardeş teknenin önünü 500 metre mesafeden kesti. Hong Kong Free Press, iki Filipin teknesinin de isabet almadığını ve balıkçılara ikmal görevini sürdürdüğünü aktardı. Çin'in manevrası sahada baskı yarattı, ancak Filipin tekneleri rotayı ve görevi koruyarak ikmali tamamladı.", "en": "According to the Philippine Coast Guard, a Chinese ship came within 50 metres of BRP Datu Dumangsil and used a water cannon for two minutes; a second Chinese vessel crossed 500 metres ahead of its sister boat. Hong Kong Free Press reported that neither Philippine vessel was struck and both continued their resupply mission to fishers. The Chinese manoeuvre created immediate operational pressure, but the Philippine boats held their course and completed the resupply mission."}, {"refs": ["phil"], "tr": "Çin Sahil Güvenliği “gerekli önlemler” aldığını ve gemileri uzaklaştırdığını söyledi; Manila ise görevin sürdüğünü belirtti. Karşılaşmanın ABD ve Çin dışişleri bakanlarının katıldığı Manila forumundan saatler önce yaşanması, olayın diplomatik ağırlığını artırdı; kaynaklar forum ile denizdeki manevra arasında bir emir zinciri kurmuyor. Filipinler'in ABD ile ittifakı daha geniş stratejik zemini oluştururken, Scarborough'daki gözlenebilir karar Çin baskısına rağmen kendi deniz iddiasını ve ikmal hattını sürdürmekti.", "en": "China's coast guard said it took “necessary measures” and expelled the vessels; Manila said the mission continued. Coming hours before a Manila forum attended by the US and Chinese foreign ministers raised the encounter's diplomatic salience, but the sources establish no chain of command between the forum and the manoeuvre at sea. The Philippines' alliance with the United States forms the broader strategic setting; the observable decision at Scarborough was to maintain its maritime claim and resupply line despite Chinese pressure."}]}, {"h": {"tr": "Sekiz devletin ortak metni", "en": "A joint text by eight states"}, "ps": [{"refs": ["aqsa"], "tr": "Mısır, Endonezya, Ürdün, Pakistan, Katar, Suudi Arabistan, Türkiye ve BAE; 4.200'den fazla İsrailli yerleşimcinin ve Bakan Itamar Ben-Gvir'in Mescid-i Aksa yerleşkesine girişini ortak bildiriyle kınadı. Metin, eylemlerin nefreti ve aşırılığı körüklediğini ve iki devletli çözümü engellediğini söyledi. Doğrulanabilir siyasi eylem, bu sekiz hükümetin belirli bir olay ve belirli bir metin üzerinde ortak imza üretmesidir.", "en": "Egypt, Indonesia, Jordan, Pakistan, Qatar, Saudi Arabia, Turkey and the UAE jointly condemned the entry of more than 4,200 Israeli settlers and Minister Itamar Ben-Gvir into the Al-Aqsa compound. The statement said the actions fuel hatred and extremism and obstruct a two-state solution. The verifiable political act is that these eight governments produced common language on a specific event."}, {"refs": ["aqsa"], "tr": "Filistinli yetkililer kapı kısıtlamaları, ibadetin engellenmesi ve saldırılar yaşandığını anlattı; kaynak bu beyanlar için bağımsız doğrulama sunmuyor. Sekiz hükümetin ortak bildirisi ise kamuya açık ve ortaklaşa üstlenilmiş diplomatik tutumu gösteriyor. Bildiri, bu hükümetlerin belirli bir olaya yaklaşımını ortaya koyuyor. Toplumların görüşlerini veya daha geniş bir bölgesel uzlaşmayı değerlendirmek için kamuoyu verileri ile başka hükümetlerin tutumları gerekir.", "en": "Palestinian officials described gate restrictions, obstruction of worship and assaults; the source supplies no independent corroboration for those claims. The joint statement, issued publicly by eight governments, establishes their shared diplomatic position on this specific event. Views within those societies and the breadth of any regional consensus require public-opinion evidence and positions from other governments."}]}, {"h": {"tr": "İki ayrı ajans biçimi", "en": "Two distinct forms of agency"}, "ps": [{"refs": ["phil", "aqsa"], "tr": "Scarborough'da siyasi irade, bir devlet kurumunun baskı altında görevi sürdürme kararında; Kudüs dosyasında ise sekiz hükümetin ortak diplomatik dil üretmesinde somutlaşıyor. Aktörlerin muhatapları ve üstlendikleri maliyetler farklı, kaynaklarda iki karar arasında koordinasyon yok. İzlenecek göstergeler de bu yüzden iki ayrı hat oluşturuyor: Manila'nın ikmal görevlerini sürdürüp sürdürmediği ve Çin'in karşı önlemleri; sekiz imzanın ortak girişim, oylama veya uygulama adımına dönüşüp dönüşmediği. İki dosyanın ortak noktası, kurumların kendi koşulları altında karar alması ve bu kararların sonuçlarının izlenebilmesidir.", "en": "At Scarborough, political agency takes concrete form in a state institution's decision to continue a mission under pressure; in Jerusalem, in eight governments producing shared diplomatic language. Their counterparts and costs differ, and the sources show no coordination between the decisions. Follow-up indicators therefore run on two separate tracks: whether Manila continues resupply missions and how China responds; whether the eight signatures lead to a joint initiative, vote or implementation step. Their common feature is that institutions act on their own terms and leave consequences that can be tracked."}]}], "date": "2026-07-24"}, {"writer": "geo-06", "title": {"tr": "Mescid-i Aksa'daki bugünkü gerilim 1967'nin uzun gölgesinde", "en": "Today's tension at Al-Aqsa lies in the long shadow of 1967"}, "excerpt": {"tr": "4.200'den fazla İsraillinin ve Bakan Itamar Ben-Gvir'in Tişa Beav'da Mescid-i Aksa yerleşkesine girişi, sekiz devletin ortak kınamasına yol açtı. Yerleşkenin bugünkü egemenlik tartışması, İsrail'in 1967'de ele geçirip 1980'de ilhak ettiği ve çoğu devletin ilhakını tanımadığı Doğu Kudüs'ün daha geniş hukuki ve tarihsel bağlamı içinde duruyor. Gerilimi üreten yakın mekanizma ise erişim ve idareye ilişkin statükonun kitlesel girişler ve siyasi ziyaretlerle sınanması.", "en": "The entry of more than 4,200 Israelis and Minister Itamar Ben-Gvir into the Al-Aqsa compound on Tisha B'Av prompted a joint condemnation by eight states. Today's sovereignty dispute over the compound sits within the broader legal and historical context of East Jerusalem, which Israel captured in 1967 and annexed in 1980, an annexation unrecognised by most states. The immediate mechanism generating tension is the testing of access and administrative arrangements through mass entries and political visits."}, "sources": [{"key": "aqsa", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/arab-and-muslim-countries-condemn-israeli-escalation-at-al-aqsa-mosque", "title": {"tr": "Sekiz Arap ve Müslüman ülke, İsrailli yerleşimcilerin Mescid-i Aksa'ya girişini ortak kınadı", "en": "Eight Arab and Muslim states jointly condemn an Israeli-settler entry into Al-Aqsa"}, "publishedDate": "2026-07-23"}, {"key": "icj", "kind": "news", "name": "International Court of Justice", "url": "https://www.icj-cij.org/index.php/node/204160", "title": {"tr": "İşgal Altındaki Filistin Topraklarına ilişkin danışma görüşü", "en": "Advisory opinion concerning the Occupied Palestinian Territory"}, "publishedDate": "2024-07-19"}], "sections": [{"h": {"tr": "Bugünkü gerilim sahnesi", "en": "The scene of today's confrontation"}, "ps": [{"refs": ["aqsa"], "tr": "Al Jazeera, 4.200'den fazla İsrailli yerleşimci ve aşırı sağcı grubun Tişa Beav dolayısıyla yerleşkeye girdiğini, Ulusal Güvenlik Bakanı Itamar Ben-Gvir'in de polis korumasında ziyarete katıldığını aktarıyor. Mısır, Endonezya, Ürdün, Pakistan, Katar, Suudi Arabistan, Türkiye ve BAE ortak bildiriyle olayı kınadı. Bugünkü olayla ilgili kesinleşenler, açıklanan katılımcı sayısı, Ben-Gvir'in ziyareti ve sekiz hükümetin ortak bildirisidir.", "en": "Al Jazeera reports that more than 4,200 Israeli settlers and far-right activists entered the compound for Tisha B'Av and that National Security Minister Itamar Ben-Gvir joined under police protection. Egypt, Indonesia, Jordan, Pakistan, Qatar, Saudi Arabia, Turkey and the UAE condemned the event in a joint statement. What is established about the day is the reported number of participants, Ben-Gvir's visit and the eight governments' joint statement."}, {"refs": ["aqsa"], "tr": "Filistinli yetkililer İsrail güçlerinin kapı erişimini kısıtladığını, ibadet edenleri engellediğini ve saldırılar yaşandığını söyledi; kaynak bu anlatım için bağımsız doğrulama sunmuyor. Kapılardaki uygulamaların ayrıntıları bu aşamada taraf beyanlarına dayanıyor. Sekiz hükümetin ortak bildirisi ise yayımlanmış diplomatik tepkiyi belgeliyor. Olayın saha boyutu ihtilaflı anlatımlarla, hükümetlerarası boyutu ise kamuya açık ortak bildiriyle tarihe geçiyor.", "en": "Palestinian officials said Israeli forces restricted gate access, obstructed worshippers and that assaults occurred; the source supplies no independent verification for that account. Details of gate practices therefore rest on party statements at this stage. The joint statement by eight governments documents the published diplomatic response. The field dimension enters the chronology through contested accounts, while the interstate dimension is anchored in a public joint statement."}]}, {"h": {"tr": "Yerleşkeden şehre uzanan egemenlik katmanları", "en": "Layers of sovereignty from compound to city"}, "ps": [{"refs": ["aqsa", "icj"], "tr": "İsrail 1967'de Doğu Kudüs'ü ele geçirdi ve 1980'de ilhak etti; çoğu devlet ilhakı tanımıyor. Uluslararası Adalet Divanı'nın 2024 danışma görüşü, İşgal Altındaki Filistin Toprakları'ndaki İsrail varlığının hukuki sonuçlarını ele alıyor. Mescid-i Aksa bu şehir ölçeğindeki egemenlik ihtilafının içinde yer alıyor; yerleşkenin özel gerilimi ise kentin statüsüyle günlük idare ve erişim düzeninin aynı mekânda kesişmesinden doğuyor.", "en": "Israel captured East Jerusalem in 1967 and annexed it in 1980; most states withhold recognition of the annexation. The International Court of Justice's 2024 advisory opinion addresses the legal consequences of Israel's presence in the Occupied Palestinian Territory. Al-Aqsa lies within this city-wide sovereignty dispute; the compound's particular tension arises where the city's status intersects with its daily administration and access arrangements."}, {"refs": ["aqsa"], "tr": "Yerleşkenin günlük idaresi ve erişim kuralları, Ürdün bağlantılı İslami Vakıf ile İsrail güvenlik makamlarının rollerini içeren statüko düzeni üzerinden tartışılıyor. 'Kadim statüko' tek ve değişmez bir belgeye dayanmıyor; uygulaması dönemler boyunca polislik, giriş kısıtlamaları ve siyasi ziyaretlerle sınandı. Bugünkü gerilimi, Tişa Beav'daki kitlesel giriş ve görevdeki bir bakanın katılımı tetikledi; uzak tarih ise hassas kurumsal zemini oluşturuyor.", "en": "The compound's daily administration and access rules are contested through status-quo arrangements involving the Jordan-linked Islamic Waqf and Israeli security authorities. The 'historic status quo' rests on evolving practice rather than a single immutable text; policing, entry restrictions and political visits have repeatedly tested its operation. Today's tension was triggered by the mass entry on Tisha B'Av and the participation of a serving minister, with distant history supplying the sensitive institutional setting."}]}, {"h": {"tr": "Tarihsel mekanizmanın sınavı", "en": "Testing the historical mechanism"}, "ps": [{"refs": ["aqsa", "icj"], "tr": "Tarihsel bağlam, kaçınılmaz tekrar fikrinden ziyade kurumsal hassasiyetin kaynağını açıklıyor: egemenlik ihtilafı, farklı ibadet ve idare iddialarını aynı mekânda topluyor; güncel siyasi aktörlerin erişim pratiğini değiştirmesi bu yüzden diplomatik tepki üretiyor. Mekanizmanın sınavı gözlenebilir: giriş ve ibadet kuralları değişecek mi, Vakıf'ın idari rolü daralacak mı, polis uygulaması kalıcılaşacak mı ve sekiz devlet ortak bir takip adımı atacak mı? Bu göstergeler, Tişa Beav'daki tek günlük girişin kalıcı bir statüko değişimine mi dönüşeceğini, yoksa dönemsel bir siyasi eylem olarak mı kalacağını ayırt edecek.", "en": "Historical context explains the source of institutional sensitivity more than it predicts inevitable recurrence: a sovereignty dispute concentrates competing worship and administrative claims in one place, so changes in access practice by current political actors generate diplomatic reaction. The mechanism has observable tests: will entry and worship rules change, will the Waqf's administrative role narrow, will policing practices persist, and will the eight states take a joint follow-up step? These indicators will distinguish whether the one-day Tisha B'Av entry develops into a durable change in the status quo or remains an episodic political act."}]}], "date": "2026-07-24"}], "dates": ["2026-07-30", "2026-07-29", "2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24"], "dateLabels": {"2026-07-30": {"tr": "30 Temmuz 2026", "en": "July 30, 2026"}, "2026-07-29": {"tr": "29 Temmuz 2026", "en": "July 29, 2026"}, "2026-07-28": {"tr": "28 Temmuz 2026", "en": "July 28, 2026"}, "2026-07-27": {"tr": "27 Temmuz 2026", "en": "July 27, 2026"}, "2026-07-26": {"tr": "26 Temmuz 2026", "en": "July 26, 2026"}, "2026-07-25": {"tr": "25 Temmuz 2026", "en": "July 25, 2026"}, "2026-07-24": {"tr": "24 Temmuz 2026", "en": "July 24, 2026"}}, "newsDates": {"geopolitics": "2026-07-30"}, "podcasts": {"geopolitics": {"2026-07-25": {"files": {"tr": {"url": "/episodes/2026-07-25-geopolitics-tr.8eb6f415316f.mp3", "bytes": 1127697}}}, "2026-07-26": {"files": {"tr": {"url": "/episodes/2026-07-26-geopolitics-tr.b28691f2e949.mp3", "bytes": 1173673}}}, "2026-07-27": {"files": {"tr": {"url": "/episodes/2026-07-27-geopolitics-tr.de69b8c485e5.mp3", "bytes": 1082140}}}, "2026-07-28": {"files": {"tr": {"url": "/episodes/2026-07-28-geopolitics-tr.81e56a7bf11b.mp3", "bytes": 1609604}}}, "2026-07-29": {"files": {"tr": {"url": "/episodes/2026-07-29-geopolitics-tr.bcb9172a0f78.mp3", "bytes": 1966124}}}}}, "updated": "2026-07-30T01:55:10+00:00"};

const TURKIC_TZ = new Set([

  'Asia/Bishkek',                                      // Kyrgyzstan

  try {

    if (saved === 'tr' || saved === 'en') return saved;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return TURKIC_TZ.has(tz) ? 'tr' : 'en';

/* Generated cards may carry malformed or non-web schemes. Only absolute HTTP(S) links
   become navigable; everything else stays visible as inert text. */
function safeHref(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname &&
      !parsed.username && !parsed.password
      ? parsed.href : '';
  } catch { return ''; }
}
const BRIEF_ASSET_PATH = /^\/assets\/briefs\/\d{4}-\d{2}-\d{2}\/[a-z0-9][a-z0-9/_-]{0,159}\.[0-9a-f]{12}\.webp$/;
function safeBriefAsset(src){
  return typeof src==='string' && BRIEF_ASSET_PATH.test(src) ? assetURL(src) : '';
}
function briefPath(brief){
  const id = typeof brief?.id==='string' ? brief.id : '';
  const topic = typeof brief?.topic==='string' ? brief.topic : '';
  const date = typeof brief?.editionDate==='string' ? brief.editionDate : '';
  if(brief?.hasAnalysis!==true || !TOPIC_IDS.has(topic)
      || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(id)
      || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const parsed = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0,10)!==date) return '';
  return `/${LANG}/${topic}/briefs/${date}/${id}/`;
}
function hostOf(url){
  try {
    const parsed = new URL(url);
    return (parsed.protocol==='http:' || parsed.protocol==='https:') && parsed.hostname
      ? parsed.hostname.replace(/^www\./,'') : (url || '');
  } catch { return url || ''; }
}

    .filter(row => row.src && Number.isInteger(row.width) && row.width > 0)

  const src = safeBriefAsset(image.src);
  const srcset = variants.map(row => `${row.src} ${row.width}w`).join(', ');
