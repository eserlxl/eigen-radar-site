hing goes wrong."}, "sections": [{"h": {"tr": "28 Temmuz'un görüntüsü", "en": "The image of 28 July"}, "ps": [{"tr": "28 Temmuz tarihli uydu görüntülerinde Caroline Bezengi adlı tankerin yakınında koyu petrol lekeleri, al-Qibliyyah adasının kuzeyinde ise daha açık renkli izler görülüyor. Alan, Umman'ın Zufar valiliğinde korunan bir deniz bölgesi. Uzaktan algılama uzmanı Wim Zwijnenburg, ham petrol depolayan geminin gövdelerinden en az birinin delinmiş göründüğünü söyledi. Gemi Avrupa Birliği ve Birleşik Krallık yaptırımları altında; takip verilerine göre Rus petrolünü Novorossiysk limanından yüklemişti.", "en": "Satellite images dated 28 July show dark oil slicks near the tanker Caroline Bezengi and lighter traces north of al-Qibliyyah island. The area is a protected marine zone in Oman's Dhofar governorate. Remote-sensing specialist Wim Zwijnenburg said at least one of the hulls of the crude storage vessel appears to have been breached. The vessel is under European Union and United Kingdom sanctions; tracking data indicate it loaded Russian oil at the port of Novorossiysk.", "refs": ["oman-spill"]}, {"tr": "Bu gemi, yaptırımın kestiği yolun nereye kıvrıldığının örneği. Kısıtlama, Rus ham petrolünün sigorta ve finans ağı üzerinden taşınmasını pahalılaştırdı; taşımanın kendisini durdurmadı. Ortaya çıkan filo aynı yükü taşıyor ve denetim ağının dışında yaşlanıyor.", "en": "This vessel is an example of where the route cut by sanctions bends to. The restriction made carrying Russian crude through the insurance and finance network more expensive; it did not stop the carrying. The fleet that emerged moves the same cargo and ages outside the inspection network.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Delinen gövdenin iki açıklaması", "en": "Two explanations for a breached hull"}, "ps": [{"tr": "Delinmenin en açık alternatif açıklaması savaş riskidir. İki deniz güvenliği kaynağına göre gemideki sorunlar 8 Haziran'da Yemen'in Mukalla limanı açıklarında başladı ve değerlendirmeler gemide bir patlamaya işaret ediyor. Bu doğruysa gövdeyi delen şey bir olaydır; yaptırımın payı da hasarlı bir geminin yedi hafta boyunca hangi tersaneye ulaşabileceği sorusunda aranmalıdır.", "en": "The clearest alternative explanation for the breach is war risk. According to two maritime security sources the vessel's trouble began on 8 June off Yemen's port of Mukalla, with assessments pointing to an onboard blast. If that holds, what breached the hull was an incident, and the part sanctions play is to be sought in the question of which yard a damaged ship could reach over seven weeks.", "refs": ["oman-spill"]}, {"tr": "Fatura tarafında hesap daha kolay. Sızıntı korunan bir deniz alanında; temizlik yükü Umman'ın kıyı ve çevre birimlerine düşüyor. Yaptırımı koyan Avrupa Birliği ve Birleşik Krallık, geminin ticaretini pahalılaştırma yetkisine sahip; sahildeki masrafı üstlenecek bir mekanizmaları yok. Uluslararası Denizcilik Örgütü durumu izlediğini doğruladı.", "en": "On the invoice side the arithmetic is easier. The leak sits in a protected marine area, and the burden of cleaning it falls on Oman's coastal and environmental bodies. The European Union and the United Kingdom, which imposed the sanctions, have the authority to make the vessel's trade more expensive; they have no mechanism for carrying the cost on the shore. The International Maritime Organization confirmed it is monitoring the situation.", "refs": ["oman-spill"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What is measurable"}, "ps": [{"tr": "Bu vakada sınanacak olan, sorumluluğun bir adrese bağlanıp bağlanamayacağı. Geminin sigortacısı ya da işletmecisi kamuya açık biçimde tespit edilir ve Umman ile Uluslararası Denizcilik Örgütü bir hasar değerlendirmesi yayımlarsa, gölge filonun maliyeti ilk kez ölçülebilir bir kalem hâline gelir. Tespit yapılmadığı sürece masraf kıyıda kalır.", "en": "What will be tested here is whether responsibility can be attached to an address. If the vessel's registered insurer or operator is publicly identified and Oman and the International Maritime Organization publish a damage assessment, the cost of the shadow fleet becomes a measurable line item for the first time. As long as no such identification is made, the expense stays on the shore.", "refs": ["oman-spill"]}]}], "sources": [{"key": "oman-spill", "kind": "news", "name": "Al-Monitor", "url": "https://www.al-monitor.com/originals/2026/07/oil-spill-shadow-fleet-tanker-spreading-oman-satellite-images-show", "title": {"tr": "Yaptırım listesindeki gölge filo tankerinden Umman açıklarına petrol sızıyor", "en": "Oil is leaking from a sanctioned shadow-fleet tanker off Oman"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-05", "title": {"tr": "50.000'den az oyla kurulan bir dış politika", "en": "A foreign policy built on fewer than 50,000 votes"}, "excerpt": {"tr": "Lima'daki yeni hükümet Washington'u stratejik ortak olarak tanımlıyor ve aynı hafta Meksika, Kolombiya ve Venezuela ile kapıları da açık tutuyor. Bu bir seçenek genişletmesi; arkasındaki seçim farkı ise hangi tarafın ne kadar zorlayabileceğini belirliyor.", "en": "The new government in Lima calls Washington a strategic partner and in the same week keeps doors open to Mexico, Colombia and Venezuela. That is a widening of options; the electoral margin behind it sets how hard any side can push."}, "sections": [{"h": {"tr": "Farkın büyüklüğü", "en": "The size of the margin"}, "ps": [{"tr": "Keiko Fujimori 28 Temmuz'da göreve başladı. Haziran ayındaki ikinci turu, solcu rakibi Roberto Sánchez karşısında 50.000'den az oy farkıyla kazanmıştı. Dışişleri Bakanı Carlos Espá bu hafta atandı; Espá daha önce Lima'daki ABD Büyükelçiliği'nde iletişim direktörü olarak çalışmıştı. Göreve başlama törenine ABD Dışişleri Bakan Yardımcısı Christopher Landau katıldı.", "en": "Keiko Fujimori took office on 28 July. She had won June's runoff by fewer than 50,000 votes over her left-wing rival Roberto Sánchez. Foreign Minister Carlos Espá was appointed this week; he had previously worked as communications director at the US embassy in Lima. US Deputy Secretary of State Christopher Landau attended the inauguration.", "refs": ["peru-alignment"]}, {"tr": "Hükümetin dış politika dili tereddütsüz: ABD stratejik ortak olarak tanımlanıyor ve organize suçla mücadele için kurulan Shield of the Americas koalisyonuna katılım planlanıyor. Bu tercihin dayandığı seçmen tabanı ise ülkeyi ikiye bölen bir farkla kazanılmış durumda. Dışarıya kesin görünen bir hizalanma, içeride ince bir çoğunluğa yaslanıyor.", "en": "The government's foreign-policy language is unhesitating: the United States is named a strategic partner and the plan is to join the Shield of the Americas coalition against organised crime. The electorate that choice rests on, though, was won by a margin that split the country in two. An alignment that looks firm from outside leans on a thin majority at home.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Aynı hafta açılan üç kapı", "en": "Three doors opened in the same week"}, "ps": [{"tr": "Aynı hükümet, Meksika ve Kolombiya ile diplomatik ilişkileri onarmayı ve Venezuela ile ilişkileri yeniden kurmayı da planlıyor. Bir başkent aynı hafta hem Washington'la bir güvenlik koalisyonu hem bölge komşularıyla normalleşme konuşuyorsa, seçenek kümesini genişletiyor demektir. Bunun en güçlü karşı okuması, bu genişliğin strateji yerine koalisyon içi denge ihtiyacından doğduğudur: dar farkla kazanmış bir hükümet, birbirine zıt seçmen bloklarına aynı anda bir şey söylemek zorundadır.", "en": "The same government also plans to repair diplomatic relations with Mexico and Colombia and to rebuild ties with Venezuela. When a capital talks in one week about a security coalition with Washington and about normalising with its regional neighbours, it is widening its option set. The strongest counter-reading is that this breadth comes from the arithmetic of coalition management rather than from strategy: a government that won narrowly has to say something to opposing blocs of voters at once.", "refs": ["peru-alignment"]}, {"tr": "Kısıtın nerede olduğu bakırla ilgili. Peru büyük bir bakır üreticisi ve son yıllarda Çin'e yakınlaşmış durumda. Bir güvenlik koalisyonuna katılmak imza gerektirir; ihracatın alıcısını değiştirmek sözleşme, liman ve fiyat gerektirir. Madencilik bölgelerinde çalışan ve geliri bu ihracata bağlı olan kesim, dış politika tercihini sandıktan çok bu ikinci kanaldan hissedecek.", "en": "Where the constraint sits has to do with copper. Peru is a major copper producer that has moved closer to China in recent years. Joining a security coalition takes a signature; changing who buys your exports takes contracts, ports and prices. The people working in the mining regions, whose income depends on those exports, will feel the foreign-policy choice through that second channel more than at the ballot box.", "refs": ["peru-alignment"]}]}, {"h": {"tr": "Sözden uygulamaya geçişin işareti", "en": "The sign that words became practice"}, "ps": [{"tr": "Sözün ne kadarının uygulamaya geçtiğini ölçmenin yolu var. Peru, Shield of the Americas koalisyonuna resmen katılır ve aynı dönemde Venezuela ile büyükelçi düzeyinde temsil yeniden kurulursa, çok yönlü hizalanma yürütülen bir politika olur. İkisinden yalnızca biri gerçekleşirse, hükümetin hangi kapıyı gerçekten açtığı da belli olur.", "en": "There is a way to measure how much of the talk becomes practice. If Peru formally joins the Shield of the Americas coalition and ambassadorial representation with Venezuela is restored in the same period, the multi-alignment becomes a policy being carried out. If only one of the two happens, it will also be clear which door the government actually opened.", "refs": ["peru-alignment"]}]}], "sources": [{"key": "peru-alignment", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/strategic-partner-perus-fujimori-plans-to-intensify-ties-with-the-us", "title": {"tr": "Peru'nun yeni hükümeti ABD ile ilişkileri derinleştirmeyi planlıyor", "en": "Peru's new government plans to deepen ties with the United States"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-06", "title": {"tr": "Bir makam basamak hâline geldiğinde seçmen de ona göre davranıyor", "en": "When an office becomes a stepping stone, voters treat it as one"}, "excerpt": {"tr": "Büyük Manchester belediye başkanlığının bu hafta boşalma sebebi, sahibinin başbakanlığa geçmesiydi. Aynı sandıkta katılım yedi puan düştü ve kazananı ikinci tercihler belirledi.", "en": "The reason the Greater Manchester mayoralty fell vacant this week was that its holder moved to the premiership. At the same ballot turnout fell by seven points and second preferences decided the winner."}, "sections": [{"h": {"tr": "Boşalan koltuğun sebebi", "en": "Why the seat fell vacant"}, "ps": [{"tr": "İşçi Partisi adayı Bev Craig, 31 Temmuz'da açıklanan sonuçla Büyük Manchester belediye başkanı seçildi. Ara seçim, Andy Burnham'ın haziranda Makerfield milletvekilliğini kazanması ve ardından parti liderliğine ve başbakanlığa geçmesiyle boşalan koltuk için yapıldı. İlk turda Craig 251.449 oyla yüzde 47,15, Reform UK adayı Sian Astley 111.928 oyla yüzde 20,99 aldı; hiçbir aday çoğunluğu sağlayamadığı için ikinci tercihler sayıldı ve Craig 309.525, Astley 157.178 oya ulaştı.", "en": "Labour's Bev Craig was elected mayor of Greater Manchester in a result declared on 31 July. The by-election was held for the seat vacated when Andy Burnham won the Makerfield parliamentary seat in June and then moved to the party leadership and the premiership. In the first round Craig took 251,449 votes, or 47.15 per cent, and Reform UK's Sian Astley 111,928 votes, or 20.99 per cent; because no candidate reached a majority, second preferences were counted and Craig reached 309,525 against Astley's 157,178.", "refs": ["manchester-mayor"]}, {"tr": "Bu haftaki boşalmanın sebebi, makamın ulusal liderliğe giden bir basamak olarak işleyebilmesiydi. Bir kurumun niteliği çoğu zaman sahiplerinin onu nasıl kullandığında görünür; bölgesel yürütmenin bu kez oynadığı rol, kendi bölgesindeki yetkilerinden çok Westminster'a açılan kapı oldu.", "en": "The reason for this week's vacancy was that the office can work as a step towards national leadership. The character of an institution usually shows in how its holders use it; the part the regional executive played this time was the door it opened to Westminster rather than the powers it holds in its own region.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "İki seçim arasındaki fark", "en": "The gap between two elections"}, "ps": [{"tr": "Karşılaştırma için elimizde bir önceki veri noktası var. Katılım bu seçimde yüzde 25 oldu; Mayıs 2024 seçiminde yüzde 32'ydi. Aynı dönemde Reform UK'in oyu 2024'teki 50.000 düzeyinden 157.000'in üzerine çıktı. İşçi Partisi koltuğu korudu; korunan zeminin bileşimi ise değişti.", "en": "There is a prior data point for comparison. Turnout at this election was 25 per cent; at the May 2024 election it was 32 per cent. Over the same span Reform UK's vote rose from 50,000 in 2024 to more than 157,000. Labour held the seat; the composition of the ground it held changed.", "refs": ["manchester-mayor"]}, {"tr": "Buradaki en açık benzemezliği kaydetmek gerekir. Temmuz sonunda yapılan tek koltuklu bir ara seçim ile mayıs ayında planlı biçimde yapılan bir seçim aynı sandık sayılmaz; mevsim, tek yarışın olması ve kampanya süresi katılımı kendi başına aşağı çeker. Yedi puanlık farkın ne kadarının siyasi ilgisizlikten, ne kadarının takvimden geldiğini bu iki oran söylemiyor.", "en": "The clearest disanalogy has to be set down. A single-seat by-election at the end of July does not count as the same ballot as a scheduled election in May; the season, the absence of other contests and the length of the campaign pull turnout down on their own. These two rates do not say how much of the seven-point gap comes from political disengagement and how much from the calendar.", "refs": ["manchester-mayor"]}]}, {"h": {"tr": "Bir sonraki dönüş", "en": "The next turn"}, "ps": [{"tr": "Asıl soru, ikinci tercihlere kalan bir yarışın istisna mı yoksa yeni normal mi olduğu. Craig'in ilk turda yüzde 47,15'te kalması, bölgesel yürütmenin tek bir partiye rahatça yazılmadığı anlamına geliyor. Aynı bölgede yapılacak bir sonraki planlı seçim de ikinci tercihlere kalırsa, makamın koalisyonla kazanıldığı bir döneme girilmiş olur.", "en": "The real question is whether a contest that goes to second preferences is the exception or the new normal. Craig stopping at 47.15 per cent in the first round means the regional executive is not comfortably assigned to a single party. If the next scheduled election in the same region also goes to second preferences, the office will have entered a period of being won by coalition.", "refs": ["manchester-mayor"]}]}], "sources": [{"key": "manchester-mayor", "kind": "news", "name": "ITV News", "url": "https://www.itv.com/news/granada/2026-07-31/labour-retain-greater-manchester-mayor-as-votes-finally-counted-after-15-hours", "title": {"tr": "Büyük Manchester belediye başkanlığını İşçi Partisi'nden Bev Craig kazandı", "en": "Labour's Bev Craig won the Greater Manchester mayoralty"}, "publishedDate": "2026-07-31"}], "date": "2026-08-01"}, {"writer": "geo-01", "title": {"tr": "Yasak temyiz boyunca yürürlükte kalıyor", "en": "The ban stays in force while the appeal runs"}, "excerpt": {"tr": "Yüksek Mahkeme, Palestine Action davasında temyize tek bir gerekçeyle izin verdi ve ifade özgürlüğüne dayanan gerekçeleri kabul etmedi. Böylece dosya bir hak tartışmasından, bir bakanın kendi ölçütünü nasıl uyguladığı sorusuna daraldı; yasaklama kararı bu süre boyunca işlemeye devam ediyor.", "en": "The Supreme Court allowed the Palestine Action appeal on one ground and refused the free-expression grounds. The case has narrowed from a question about rights to a question about how a minister applied her own test, and the proscription keeps operating throughout."}, "sections": [{"h": {"tr": "Hangi gerekçeye izin verildi", "en": "Which ground was allowed through"}, "ps": [{"tr": "Birleşik Krallık Yüksek Mahkemesi 30 Temmuz'da Palestine Action'ın kurucularından Huda Ammori'nin başvurusunu tek bir gerekçeyle temyize açtı: dönemin İçişleri Bakanı Yvette Cooper'ın kendi politikasını yanlış uygulamış olması. İfade ve örgütlenme özgürlüğüne dayanan gerekçelere izin verilmedi. Bu ayrım dosyanın niteliğini değiştiriyor. Sonbaharda cevaplanacak soru şu: bakan, takdir yetkisini kendi ilan ettiği ölçüte uygun kullandı mı?", "en": "The UK Supreme Court opened Huda Ammori's challenge to appeal on 30 July on a single ground: that the then home secretary, Yvette Cooper, misapplied her own policy. Permission was refused on freedom of expression and association. The distinction changes what the case is about. The question to be answered in the autumn is this: did the minister exercise her discretion in line with the test she had herself announced?", "refs": ["proscription"]}, {"tr": "Dosyanın seyri de bu daralmayı gösteriyor. Şubat ayında High Court yasaklama kararının iptal edilmesi gerektiğine hükmetti, İstinaf Mahkemesi haziranda bu kararı bozdu, Yüksek Mahkeme ise geriye tek gerekçe bıraktı. Duruşma hızlandırıldı ve 1 Ekim ile 21 Aralık arasına alındı; kararı Lord Sales, Lord Leggatt ve Lady Simler verdi.", "en": "The path of the case shows the same narrowing. In February the High Court held that the proscription should be quashed; in June the Court of Appeal overturned that; the Supreme Court has now left one ground standing. The hearing has been expedited to a date between 1 October and 21 December, and the permission decision was taken by Lord Sales, Lord Leggatt and Lady Simler.", "refs": ["proscription"]}]}, {"h": {"tr": "Dar kapıdan çıkacak sonuç", "en": "What can come out of a narrow gate"}, "ps": [{"tr": "Ayakta kalan gerekçe yetkinin kullanılış biçimine ilişkin. Bu tür bir kusur çoğu zaman kararın usulüne uygun biçimde yeniden alınmasıyla giderilir; dolayısıyla başvurunun kabulü tek başına yasağın sona ermesi anlamına gelebilir de gelmeyebilir de. Alternatif okuma da mümkün: mahkeme bakanın politikasını öyle bir okuyabilir ki aynı sonuca yeniden ulaşmak pratikte mümkün olmaz. İki ihtimal arasındaki fark, kararın gerekçesinin ne kadar dar yazıldığına bağlı.", "en": "The surviving ground concerns how the power was used. A defect of that kind is usually cured by retaking the decision properly, so success on appeal may or may not end the ban. The other reading is open too: the court could construe the policy so tightly that reaching the same outcome again becomes impractical. The difference between the two turns on how narrowly the judgment is written.", "refs": ["proscription"]}, {"tr": "Bu ayrımı ayırt etmenin gözlenebilir bir yolu var. Temyiz bu tek gerekçeden kabul edilirse, 31 Mart 2027'ye kadar ya İçişleri Bakanlığı, yani Home Office, yeni bir yasaklama kararı alıp yayımlar ya da grup bakanlığın yasaklı örgütler listesinden çıkar. Hangisinin gerçekleştiği, kararın kapsamını gerekçe metnini okumadan da gösterir.", "en": "There is an observable way to tell them apart. If the appeal succeeds on that single ground, then by 31 March 2027 either the Home Office takes and publishes a fresh proscription decision, or the group comes off the Home Office list of proscribed organisations. Which of the two happens will show the judgment's reach without anyone having to parse its reasoning.", "refs": ["proscription"]}]}, {"h": {"tr": "Bu arada yürürlükte kalan yetki", "en": "The power that stays in force meanwhile"}, "ps": [{"tr": "Yasak temyiz boyunca yürürlükte. Yani ekimden aralığa uzanan duruşma penceresi boyunca, gruba destek ifade etmenin hukuki sonucu değişmiyor. Yargısal denetim başlamış olsa da idari işlem kesintisiz çalışmayı sürdürüyor.", "en": "The ban remains in force during the appeal. Through the hearing window that runs from October to December, the legal consequence of expressing support for the group is unchanged. Judicial scrutiny has begun, but the administrative measure keeps running without interruption.", "refs": ["proscription"]}, {"tr": "Bu sürenin bedelini ödeyenler dosyanın tarafı değil. Yasaklama kararından bu yana 3.500'den fazla kişi gözaltına alındı ve temyiz izninin verildiği gün Westminster Sulh Mahkemesi önünde 77 kişi daha gözaltına alındı. Mahkemenin takvimi ile sokaktaki takvim aynı hızda ilerlemiyor.", "en": "The people who pay for that interval are not parties to it. More than 3,500 have been arrested since the proscription, and on the day permission was granted another 77 were arrested outside Westminster Magistrates' Court. The court's calendar and the calendar on the street do not run at the same speed.", "refs": ["proscription"]}]}], "sources": [{"key": "proscription", "kind": "news", "name": "The Jewish Chronicle", "url": "https://www.thejc.com/news/uk/palestine-action-appeal-supreme-court-v7uetpjk", "title": {"tr": "Birleşik Krallık Yüksek Mahkemesi, Palestine Action yasağına karşı temyize tek gerekçeyle izin verdi", "en": "The UK Supreme Court allows an appeal against the Palestine Action ban on a single ground"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-02", "title": {"tr": "Metinde İsrail'in imzası yok", "en": "Israel's signature is not on the text"}, "excerpt": {"tr": "Barış Kurulu'nun Gazze metni bir sıra ve bir takvim içeriyor: 14 gün, önce polis silahları, sonra ağır silahlar, en sonda çekilme. Ancak takvimin son adımını atacak taraf, yani İsrail, metin hakkında henüz konuşmadı.", "en": "The Board of Peace's text on Gaza contains a sequence and a clock: 14 days, police weapons first, heavy weapons next, withdrawal last. But the party that would take the final step, Israel, has not yet spoken about the text."}, "sections": [{"h": {"tr": "Takvim ve sıra", "en": "The clock and the sequence"}, "ps": [{"tr": "Al Jazeera'nın bir kopyasını edindiğini bildirdiği metin, ayrıntılı bir silahsızlanma yol haritasının 14 gün içinde hazırlanmasını öngörüyor ve bu sürenin uluslararası bir doğrulama organının onayıyla uzatılabileceğini yazıyor. Silahlar Gazze'yi yönetecek bir Ulusal Komite'ye devredilecek; önce polis silahları aktarılacak, ardından ağır silahlar etkisiz hale getirilecek ve Gazze'deki tüm askeri faaliyet duracak.", "en": "The text, a copy of which Al Jazeera says it obtained, requires a detailed disarmament roadmap within 14 days and provides that the period can be extended with the approval of an international verification body. Weapons pass to a National Committee that would administer Gaza: police weapons first, then heavy weapons decommissioned, with all military activity in Gaza to cease.", "refs": ["board-of-peace"]}, {"tr": "Sıranın sonunda ise bir devir var. Silahsızlanma tamamlandığında İsrail güçleri çekilecek ve yerlerini bir Uluslararası İstikrar Gücü ile yeni bir Filistin polis gücü alacak. Yani metnin bütün ara adımları, en sondaki adımın atılacağı varsayımıyla anlam kazanıyor.", "en": "At the end of the sequence sits a handover. Once disarmament is complete, Israeli forces withdraw and are replaced by an International Stabilisation Force working with a new Palestinian police force. Every intermediate step in the text therefore acquires its meaning from the assumption that the final step will be taken.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "Kim neyi üstlendi", "en": "Who took on what"}, "ps": [{"tr": "Duyuruyu Trump yaptı. Hamas müzakere heyetinden Gazi Hamad görüşmelerin zor geçtiğini ve ulaşılabilecek en iyi formülün arandığını söyledi; ancak Hamas, İsrail yükümlülüklerini yerine getirmezse metni uygulamayacağını belirtti. Filistin İslami Cihadı anlaşmaya varıldığı yönündeki aktarımlara itiraz ederek mevcut ifadelere çekince koydu. İsrail'den ise açıklama gelmedi.", "en": "Trump made the announcement. Ghazi Hamad of the Hamas negotiating delegation said the talks had been difficult and that the best achievable formula had been sought; Hamas nonetheless said it would not implement the text if Israel failed to meet its obligations. Palestinian Islamic Jihad disputed accounts that an agreement had been reached and entered reservations about the current wording. Israel had made no comment.", "refs": ["board-of-peace"]}, {"tr": "Bir metnin ağırlığı, hangi tarafın hangi yükümlülüğü üstlendiğiyle ölçülür. Burada üstlenilen yükümlülüklerin tamamı silah tarafında toplanıyor; çekilme tarafında ise koşullu bir sonuç duruyor. Kabul edenler koşullu kabul etti, sıranın sonundaki adımı atacak taraf henüz konuşmadı.", "en": "A text's weight is measured by which party takes on which obligation. Here every obligation assumed gathers on the weapons side, while the withdrawal side holds a conditional outcome. Those who accepted did so conditionally, and the party that would take the last step in the sequence has yet to speak.", "refs": ["board-of-peace"]}]}, {"h": {"tr": "En erken tarih 14. gün", "en": "The earliest date is day 14"}, "ps": [{"tr": "Koşullar birbirine bağlandığında ilk kırılma noktası genellikle en erken tarihli maddede ortaya çıkar. Bu metinde en erken tarih 14. gün, ve o gün sınanacak şey yol haritasının hazırlanmış olmasıdır. Alternatif bir okuma da mümkün: 14 günlük süre metne kamuya açık bir tarih iliştirmek için konmuş, uzatma yetkisi ise gecikmeyi soğurmak üzere aynı maddeye yerleştirilmiş olabilir.", "en": "The chaining of conditions usually puts the first break at the earliest-dated clause rather than the most visible one. In this text the earliest date is day 14, and what falls due that day is the preparation of the roadmap. Another reading is available: the 14-day period may exist to attach a public date to the text, with the extension power placed in the same clause to absorb delay.", "refs": ["board-of-peace"]}, {"tr": "Bu yüzden takip edilecek tarih 13 Ağustos. O güne kadar ya ayrıntılı yol haritası duyurulur ya da doğrulama organının uzatma onayı verdiği bildirilir. Hiçbiri olmazsa, metnin bağlayıcılığı hakkındaki soru artık yorum meselesi olmaktan çıkar.", "en": "The date to watch is therefore 13 August. By then either the detailed roadmap is announced or the verification body is reported to have approved an extension. If neither happens, the question about how much the text binds stops being a matter of interpretation.", "refs": ["board-of-peace"]}]}], "sources": [{"key": "board-of-peace", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-says-board-of-peace-reaches-agreement-on-disarmament-of-hamas-in-gaza", "title": {"tr": "Trump, Barış Kurulu'nun Gazze'de aşamalı silahsızlanma üzerinde anlaştığını açıkladı", "en": "Trump says the Board of Peace has agreed a phased disarmament plan for Gaza"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-03", "title": {"tr": "NATO havalanan uçaklarla neyi caydırıyor?", "en": "What is NATO deterring with jets that were already airborne?"}, "excerpt": {"tr": "Bir seyir füzesi ittifak toprağına 80 kilometre girdi ve bir tarlada patladı. Uçaklar havalandı, ateş açılmadı; caydırıcılığı bu kez taşıyan şey gösterilmiş bir önleme değil, verilmiş bir söz.", "en": "A cruise missile travelled 80km into alliance territory and detonated in a field. Jets went up, nothing was fired; what carried deterrence this time was a promise, not a demonstrated intercept."}, "sections": [{"h": {"tr": "Olayın ölçüleri", "en": "The measurements of the event"}, "ps": [{"tr": "Füze yerel saatle 04.00 sularında, Lublin yakınlarındaki Tarnawa-Kolonia köyünün civarında bir tarlaya düştü ve 10 metrelik bir çukur açtı. Nokta, Ukrayna sınırının yaklaşık 80 kilometre içinde. Başbakan Donald Tusk mühimmatın büyük olasılıkla Rus olduğunu, incelemenin bir Kh-101 seyir füzesine işaret ettiğini söyledi.", "en": "The missile came down at about 04.00 local time in a field near the village of Tarnawa-Kolonia, close to Lublin, leaving a crater 10 metres wide. The point of impact lies about 80km inside the Ukrainian border. Prime Minister Donald Tusk said the munition was most likely Russian and that analysis pointed to a Kh-101 cruise missile.", "refs": ["poland-missile"]}, {"tr": "Saldırı sırasında Polonya savaş uçaklarını havalandırdı. Tusk, Polonya'nın hedef alındığını düşündürecek bir neden bulunmadığını, füzenin yerleşim yerlerini tehdit etmesi halinde ordunun müdahaleye hazır olduğunu belirtti. Mühimmat ateşle karşılanmadı; olay yerinde yaralanan olmadı.", "en": "Poland scrambled fighter jets during the attack. Tusk said there was no reason to believe Poland had been targeted and that the military stood ready to intercept had the missile threatened populated areas. The munition was not engaged, and no one was hurt at the site.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Angajmanın eşiği", "en": "The threshold of engagement"}, "ps": [{"tr": "Tusk'ın cümlesi aslında bir kural bildiriyor. Müdahale, mühimmatın ittifak toprağına girmiş olmasına değil, yerleşim yerlerini tehdit etmesine bağlanmış. Bu eşik seçildiğinde, sınırdan 80 kilometre içeri giren bir seyir füzesinin ateş açılmadan yere inmesi bir aksaklık olmaktan çıkar; sistemin öngördüğü sonuç haline gelir.", "en": "Tusk's sentence in fact states a rule. Engagement is tied not to a munition entering alliance territory but to its threatening populated areas. Once that threshold is chosen, a cruise missile coming down unengaged 80km inside the border stops being a malfunction and becomes the outcome the system is designed to produce.", "refs": ["poland-missile"]}, {"tr": "Bu eşiğin sınanması uzun sürmeyecek. NATO üyesi Polonya'nın hava sahasına 31 Ekim'e kadar yeni bir mühimmat girerse, cevabı verilecek soru mühimmatın havada ateşle karşılanıp karşılanmadığı olacak; bir kez daha tarlada bulunursa, kuralın istisna değil uygulama olduğu görülür.", "en": "That threshold will not wait long to be tested. If another munition enters the airspace of NATO member Poland before 31 October, the question to answer is whether it is engaged in the air; if it is again found in a field, the rule will have shown itself to be the practice rather than the exception.", "refs": ["poland-missile"]}]}, {"h": {"tr": "Beyanın taşıdığı yük", "en": "The load the declaration carries"}, "ps": [{"tr": "NATO'da Avrupa Müttefik Kuvvetleri Komutanı Orgeneral Alexus Grynkewich, ittifakın kendi toprağını savunmak için gereken her önlemi almayı sürdüreceğini bildirdi. Bu bir taahhüt beyanıdır ve beyanın işe yaraması için karşı tarafın onu inandırıcı bulması gerekir. Kabiliyetin aksine beyan sayılamaz; yalnızca sınanır.", "en": "NATO's Supreme Allied Commander Europe, Gen Alexus Grynkewich, said the alliance would continue to take all necessary measures to defend NATO territory. That is a declaration of commitment, and a declaration works only if the other side finds it credible. Unlike capability, a declaration cannot be counted; it can only be tested.", "refs": ["poland-missile"]}, {"tr": "Kısıtlamanın bir mühendislik gerekçesi de olabilir: seyrek yerleşimli arazi üzerinde önleme, düşen parçalarla kendi zararını yaratır ve bu tercih bir kabiliyet boşluğuna işaret etmeyebilir. Karşı tarafın gördüğü şey ise şudur: havalanan uçaklar, ateş açılmamış bir hat ve bir tarladaki krater.", "en": "There may be an engineering reason for the restraint: an intercept over sparsely populated ground creates its own harm through falling debris, and the choice need not indicate a gap in capability. What the other side observes is this: aircraft in the air, a line along which nothing was fired, and a crater in a field.", "refs": ["poland-missile"]}]}], "sources": [{"key": "poland-missile", "kind": "news", "name": "The Irish Times", "url": "https://www.irishtimes.com/world/2026/07/30/russia-accused-of-violating-polish-airspace-after-missile-explodes-near-village/", "title": {"tr": "Doğu Polonya'da bir füze patladı, NATO ittifak toprağını savunacağını bildirdi", "en": "A missile explodes in eastern Poland and NATO says it will defend alliance territory"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-04", "title": {"tr": "İki gemi, bir terminal ve iki gün önceki uyarı", "en": "Two vessels, one terminal and a warning two days earlier"}, "excerpt": {"tr": "Dimyat'ta vurulan şey bir boru hattı ya da bir sözleşme değil, bir gövdeydi. Tek bir insansız hava aracı iki gemiyi rıhtımdan uzaklaştırdı ve gazı karaya indiren donanımın ne kadar dar bir yerde toplandığını gösterdi.", "en": "What was hit at Damietta was neither a pipeline nor a contract but a hull. A single drone moved two vessels off the berth and showed how narrow the equipment base that lands gas ashore really is."}, "sections": [{"h": {"tr": "Vurulan donanım", "en": "The equipment that was hit"}, "ps": [{"tr": "Marshall Adaları bayraklı Energos Winter, New Fortress Energy tarafından işletilen yüzer bir depolama ve gazlaştırma ünitesi; işi sıvılaştırılmış doğal gazı yeniden gaza çevirmek. Gemi çarşamba günü Orta Avrupa saatiyle 15.20 sularında sancak tarafından vuruldu ve çıkan yangın Bermuda bayraklı LNG tankeri Gaslog Salem'e sıçradı.", "en": "The Marshall Islands-flagged Energos Winter is a floating storage and regasification unit operated by New Fortress Energy; its job is to turn liquefied natural gas back into gas. It was struck on the starboard side at about 15.20 CET on Wednesday, and the fire spread to the Bermuda-flagged LNG tanker Gaslog Salem.", "refs": ["damietta"]}, {"tr": "Mürettebat tahliye edildi ve can kaybı bildirilmedi. Buna karşılık iki gemi de hasar tespiti için açığa çekildi ve terminaldeki işleyiş aksadı. Zarar, işleyişin bağlı olduğu iki gövdenin rıhtımdan ayrılmasında toplandı.", "en": "The crews were evacuated and no casualties were reported. Both vessels, however, were moved offshore for damage assessment, and operations at the terminal were disrupted. The damage gathered in the removal from the berth of the two hulls on which the operation depends.", "refs": ["damietta"]}]}, {"h": {"tr": "Yerine hızlıca koyulamayan şey", "en": "The thing you cannot quickly replace"}, "ps": [{"tr": "Bir gövdeye isabet eden tek bir insansız hava aracının iki gemiyi rıhtımdan uzaklaştırıp bir terminali aksatabilmesi, kırılganlığın nerede toplandığını gösteriyor: sayısı sınırlı ve yerine birkaç gün içinde bir başkası çekilemeyen özel donanımlı yüzer ünitelerde. Alternatif okuma da elde: gemilerin açığa çekilmesi hasardan değil ihtiyattan kaynaklanmış olabilir; bu durumda aksama kısa sürer ve yoğunlaşma göründüğü kadar derin çıkmaz.", "en": "That one drone hitting one hull could push two vessels off a berth and disrupt a terminal shows where the fragility gathers: in a small number of specialised floating units for which no substitute can be brought in within days. The other reading is available: the vessels may have been moved out of caution rather than damage, in which case the disruption is brief and the concentration is shallower than it looks.", "refs": ["damietta"]}, {"tr": "Fiyatlanabilir ikinci bir bilgi daha var. İran devlet televizyonu Dimyat'ı iki gün önce olası bir misilleme hedefi olarak anmıştı; bu, Ukrayna'nın bir İran gemisine düzenlediği saldırıların ardından gelmişti. Hedef, vurulmadan önce açıkça adlandırılmıştı. Saldırıyı üstlenen çıkmadı; İran Dışişleri Bakanı Abbas Erakçi ülkesinin tırmanma peşinde olmadığını söyledi ve Kiev'den tazminat istedi.", "en": "A second piece of information can also be priced. Iranian state television had named Damietta as a possible retaliation target two days earlier, following Ukrainian strikes on an Iranian vessel. The target was named in public before it was hit. No one claimed the attack; Iran's Foreign Minister Abbas Araghchi said his country was not seeking escalation and demanded compensation from Kyiv.", "refs": ["damietta"]}]}, {"h": {"tr": "Ölçülebilir olan", "en": "What can actually be measured"}, "ps": [{"tr": "Sorumluluk belirlenmemişken bu olayın ağırlığını siyasi açıklamalardan okumak mümkün değil. Ölçülebilir olan tek şey donanımın kendisi: hangi gemi hangi rıhtıma ne zaman dönüyor ve terminal hangi tarihte olağan işleyişine geçiyor.", "en": "With responsibility unestablished, the weight of this event cannot be read off political statements. The only measurable thing is the equipment itself: which vessel returns to which berth and when, and on what date the terminal resumes normal operation.", "refs": ["damietta"]}, {"tr": "İzlenecek tarih 31 Ağustos. Energos Winter o güne kadar Dimyat'taki rıhtımına döner ve terminal işleyişi normale geçerse, olay bir kesinti olarak kalır. Dönmezse, tek bir gövdenin kaybının ne kadar süreyle bir ithalat kapısını meşgul edebildiği ölçülmüş olur.", "en": "The date to watch is 31 August. If the Energos Winter is back at its Damietta berth by then and the terminal's operation has returned to normal, the event stays an interruption. If it is not, we will have a measurement of how long the loss of a single hull can occupy an import gateway.", "refs": ["damietta"]}]}], "sources": [{"key": "damietta", "kind": "news", "name": "Euronews", "url": "https://www.euronews.com/2026/07/30/drone-hits-us-lng-vessel-at-damietta-in-first-attack-on-egyptian-soil", "title": {"tr": "Mısır, Dimyat Limanı'ndaki iki gemide çıkan yangının bir insansız hava aracından kaynaklandığını açıkladı", "en": "Egypt says a drone caused the fire on two gas vessels at Damietta port"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-05", "title": {"tr": "On dört imza, iki eksik komşu", "en": "Fourteen signatures, two absent neighbours"}, "excerpt": {"tr": "Riyad'da duyurulan deniz savunma ittifakında asıl bilgi, bildirinin altındaki isimlerde duruyor. İmzacıların çoğu koridorun kıyısında yaşayan ülkeler; aynı sularda aynı çıkarı taşıyan Birleşik Arap Emirlikleri ile Umman ise listede yok.", "en": "The real information in the maritime alliance announced in Riyadh sits in the names beneath the statement. Most signatories are states that live on the corridor; the United Arab Emirates and Oman, with the same interest in the same waters, are absent from the list."}, "sections": [{"h": {"tr": "İmzayı atanlar", "en": "Those who signed"}, "ps": [{"tr": "Suudi Savunma Bakanlığı'nın duyurusuna göre ittifakın merkezi Riyad'da olacak ve Suudi Arabistan'ın yanı sıra Türkiye, Kuveyt, Bahreyn, Katar, Ürdün, Mısır, Pakistan, Cibuti, Somali, Bangladeş, Yemen, Sudan ve Komorlar imzacılar arasında yer alıyor. Toplantıya bir Avrupa Birliği heyeti de katıldı. Bildiri ittifakın işini istihbarat paylaşımı, ortak tatbikatlar ve ortak deniz harekatları olarak tanımlıyor.", "en": "According to the Saudi defence ministry, the alliance will be headquartered in Riyadh, and alongside Saudi Arabia the signatories include Türkiye, Kuwait, Bahrain, Qatar, Jordan, Egypt, Pakistan, Djibouti, Somalia, Bangladesh, Yemen, Sudan and the Comoros. A European Union delegation also attended the meeting. The statement defines the alliance's work as intelligence sharing, joint exercises and joint maritime operations.", "refs": ["red-sea-alliance"]}, {"tr": "Listeyi coğrafyayla birlikte okumak gerekiyor. Bildirinin kendisi korunacak alanı Bab-ül Mendeb Boğazı, Kızıldeniz ve Aden Körfezi olarak tanımlıyor; Cibuti, Somali, Yemen, Sudan ve Mısır bu hattın kıyısında duruyor. İmza listesi bir maruziyet haritası gibi okunabiliyor: o sudan çıkamayanlar imza atıyor.", "en": "The list has to be read together with the geography. The statement itself defines the area to be protected as the Bab al-Mandeb Strait, the Red Sea and the Gulf of Aden; Djibouti, Somalia, Yemen, Sudan and Egypt sit along that line. The signature list reads like a map of exposure: the states that cannot sail away from those waters are the ones signing.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "İmzalamayanlar", "en": "Those who did not sign"}, "ps": [{"tr": "Birleşik Arap Emirlikleri ile Umman, aynı sulardaki aynı tehdide rağmen imzacılar arasında yok. Bildiri ulusal süreçlerini tamamlayan başka ülkelerin kurucu belgeye katılmasına kapıyı açık bırakıyor; yani liste kapanmış bir liste olarak duyurulmadı.", "en": "The United Arab Emirates and Oman are not among the signatories, despite facing the same threat in the same waters. The statement leaves the door open for other countries to accede to the charter once they complete their national procedures, so the list was not announced as a closed one.", "refs": ["red-sea-alliance"]}, {"tr": "Bu maddenin işleyip işlemediği yakında görülecek. 30 Eylül'e kadar en az bir ülkenin katılımı duyurulursa, açık kapı gerçekten bir katılım mekanizması olarak çalışıyor demektir; kimse eklenmezse, kurucu 14 ülkenin oluşturduğu çekirdek ittifakın tamamı olarak kalır.", "en": "Whether that clause works will be visible soon. If at least one country's accession is announced by 30 September, the open door is functioning as a real mechanism for joining; if nobody is added, the core of 14 founders remains the whole of the alliance.", "refs": ["red-sea-alliance"]}]}, {"h": {"tr": "Listenin söylediği", "en": "What the list says"}, "ps": [{"tr": "Katılıma açık, istihbarat paylaşımı ve tatbikat üzerine kurulu bir yapı, sonradan girilebilir olacak biçimde tasarlanmıştır. Bu tasarım, korumayı isteyip adının bugün anılmasını istemeyen devletlere bir bekleme odası bırakır. Alternatif bir açıklama da var: iki ülkenin yokluğu, yapının tasarımına ya da merkezinin nerede olacağına ilişkin farklı bir değerlendirmeden kaynaklanıyor olabilir.", "en": "A structure that is open to accession and built on intelligence sharing and exercises is designed to be joined later. That design leaves a waiting room for states that want the protection without having their names read out today. Another explanation is available: the two absences may reflect a different judgement about the structure's design, or about where it is headquartered.", "refs": ["red-sea-alliance"]}, {"tr": "İlk günün bilançosu bu yüzden gemi sayısıyla tutulamaz. Bugün elde olan şey, bir bildirinin altında adının yazılmasını kabul edenlerin listesi. Bir ittifakın kabiliyeti sonradan ölçülür; kimin adını verdiği ilk gün belli olur ve o bilgi kendi başına bir şey söyler.", "en": "The balance of the first day therefore cannot be kept in ships. What exists today is a list of those who accepted having their names written under a statement. An alliance's capability is measured later; who gave their name is settled on day one, and that fact says something on its own.", "refs": ["red-sea-alliance"]}]}], "sources": [{"key": "red-sea-alliance", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/saudi-arabia-announces-maritime-defence-alliance-to-secure-vital-waterways", "title": {"tr": "Suudi Arabistan ve 13 ülke Kızıldeniz için deniz savunma ittifakı kurdu", "en": "Saudi Arabia and 13 other states form a maritime defence alliance for the Red Sea"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-06", "title": {"tr": "Çiti aşan geri gönderiliyor, yüzen gönderilmiyor", "en": "Those who climb the fence go back, those who swim do not"}, "excerpt": {"tr": "Ceuta'nın sınırı yerinden oynamadı; bir mahkeme kararı oynadı. Aynı hattı geçmenin iki ayrı hukuki sonuca bağlanması, olağanüstü durumun neden tam bu hafta ilan edildiğini açıklıyor.", "en": "Ceuta's border did not move; a court ruling did. Tying two different legal consequences to the same line explains why the emergency was declared in precisely this week."}, "sections": [{"h": {"tr": "Perşembe günü olan", "en": "What happened on Thursday"}, "ps": [{"tr": "Ceuta yönetiminin başkanı Jesus Vivas mutlak insani ve toplumsal bir olağanüstü durum ilan etti ve Madrid'den sınır denetimini yeniden kurmak üzere asker istedi. Son 10 gün içinde 1.500 ila 2.000 kişi kente girdi; perşembe günü yüzlerce kişi daha geldi. İçişleri Bakanlığı göç kaynaklı bir krizin ulusal olağanüstü hal tanımına girmediğini belirterek talebi reddetti, ancak sınıra 60 askerin gönderilmesine onay verdi.", "en": "Ceuta's regional president, Jesus Vivas, declared an absolute humanitarian and social emergency and asked Madrid for troops to restore control of the border. Between 1,500 and 2,000 people entered the city over the past 10 days, with hundreds more arriving on Thursday. The interior ministry refused the request, saying a migration crisis does not meet the definition of a national emergency, but authorised 60 troops for the border.", "refs": ["ceuta"]}, {"tr": "Aynı haberde kentin kapasitesinden çok daha az konuşulan bir tarih var. Temmuz başında İspanya Yüksek Mahkemesi, Ceuta ve Melilla'ya ulaşmaya çalışırken denizde yakalanan kişilerin Fas'a doğrudan iade edilemeyeceğine hükmetti. Yetkililer kaçakçılık ağlarının bu kararı kullandığını söylüyor.", "en": "The same report carries a date that is discussed far less than the city's capacity. Earlier in July, Spain's Supreme Court ruled that people intercepted at sea while trying to reach Ceuta or Melilla cannot be returned directly to Morocco. Officials say smuggling networks have made use of the decision.", "refs": ["ceuta"]}]}, {"h": {"tr": "Yerinde duran hat, değişen kural", "en": "The line stayed, the rule changed"}, "ps": [{"tr": "Sınır hattı yerinde duruyor. Değişen şey, aynı hattı geçmenin artık iki ayrı hukuki sonuç doğurması: çiti tırmanan kişi hâlâ anında geri gönderilebiliyor, denizden gelen gönderilemiyor. Geçiş yönteminin sudan yana kayması bu dikişi izliyor; kararın ayırdığı yerden geçiliyor.", "en": "The line is where it was. What changed is that crossing the same line now produces two different legal consequences: someone who climbs the fence can still be sent straight back, someone who arrives by sea cannot. The shift of method towards the water follows that seam; people cross where the ruling drew its distinction.", "refs": ["ceuta"]}, {"tr": "Guardia Civil sözcüsünün anlatımı bu kaymayı tarihlendiriyor: karardan sonra gelişler yavaş bir sızıntı halinde sürmüş, perşembe günü ise bir patlama yaşanmış. Yani değişim kararla birlikte başladı, ama görünür hale gelmesi için kentin kapasitesinin dolmasını bekledi.", "en": "A Guardia Civil spokesperson's account dates that shift: arrivals had been a slow trickle since the ruling, and Thursday brought an explosion. The change began with the decision, then waited for the city's capacity to fill before it became visible.", "refs": ["ceuta"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Uzun süredir yerinde duran bir sınırda ani bir hareketlenmenin sebebini hattın kendisinde aramak yanıltıcıdır; hat yıllardır aynı geçme isteğini üretiyordu. Burada değişen değişken, geçişin hukuken ne anlama geldiğini belirleyen kuraldır. Alternatif okuma da göz ardı edilemez: İçişleri Bakanlığı sorumluluğu insan kaçakçılığı ağlarına yükledi ve deniz koşulları, ağların fiyatlandırması ya da Fas'ın denetim tercihleri de aynı zamanlamayı üretebilirdi.", "en": "When a long-settled border suddenly stirs, looking for the cause in the line itself misleads; the line had been producing the same wish to cross it for years. The variable that changed here is the rule that decides what a crossing means. Nor can another reading be set aside: the interior ministry blamed people-smuggling networks, and sea conditions, the networks' pricing or Morocco's policing choices could have produced the same timing.", "refs": ["ceuta"]}, {"tr": "Bu ayrım kentin kendisi için de sonuç doğuruyor. Ceuta'nın sınırı bir çizgi olarak sabit kaldığı sürece kapasitesi de sabit kalır; değişen kural ise o kapasiteye kaç kişinin ve hangi yoldan ulaşacağını belirler. Bunun ölçüsü basit: deniz yoluyla gelenlerin sayısı ile çitten geçiş girişimlerinin sayısı arasındaki dağılım. Bugün bir sınırı yöneten şey, hangi geçişin hangi sonucu doğurduğuna karar veren cümledir.", "en": "The distinction has consequences for the city too. As long as Ceuta's border stays fixed as a line, so does its capacity; the rule that changed decides how many reach that capacity, and by which route. The measure of that is straightforward: the split between arrivals by sea and attempts on the fence. What governs a border today is the sentence that decides which crossing produces which outcome.", "refs": ["ceuta"]}]}], "sources": [{"key": "ceuta", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/spanish-enclave-of-ceuta-raises-alarm-as-thousands-cross-morocco-border", "title": {"tr": "Ceuta olağanüstü durum ilan etti, Madrid sınıra 60 asker gönderiyor", "en": "Ceuta declares an emergency and Madrid sends 60 troops to the border"}, "publishedDate": "2026-07-30"}], "date": "2026-07-31"}, {"writer": "geo-01", "title": {"tr": "Parayı serbest bırakan cümle Dünya Sağlık Örgütü'nü dışarıda tutuyor", "en": "The sentence that releases the money keeps the World Health Organization outside"}, "excerpt": {"tr": "Washington iki yıl bekletilen 600 milyon dolar tutarındaki ödeneği Gavi'ye açtı. Aynı duyuru, bu paranın Dünya Sağlık Örgütü'ne ulaşmasını engelliyor. Etkiyi üreten şey, ödeneğe eklenen uygunluk koşulu.", "en": "Washington opened up the $600m appropriation it had held back for two years to Gavi. The same announcement keeps that money from reaching the World Health Organization. What produces the effect is the eligibility condition attached to the appropriation."}, "sections": [{"h": {"tr": "Ödeneğe eklenen koşul", "en": "The condition attached to the appropriation"}, "ps": [{"tr": "Dışişleri Bakanlığı ile Sağlık ve İnsani Hizmetler Bakanlığı, Kongre'nin aşı için ayırdığı 600 milyon dolar tutarındaki ödeneği Gavi'ye açarken Dünya Sağlık Örgütü'nün bu ittifak üzerinden Amerikan kaynağı almasını engelledi. Duyuruyu Dışişleri Bakanı Marco Rubio ile Sağlık Bakanı Robert Kennedy Jr. birlikte yaptı ve desteğin sürmesi için Gavi'nin cıva içeren aşıların yerine cıvasız alternatifler koyma yönünde çalışması koşulu getirildi.", "en": "The State Department and the Department of Health and Human Services opened up to Gavi the $600m appropriation Congress had set aside for vaccines, while barring the World Health Organization from receiving American money through the alliance. Secretary of State Marco Rubio and Health Secretary Robert Kennedy Jr. announced it together, and continued support was made conditional on Gavi working towards replacing mercury-containing vaccines with mercury-free alternatives.", "refs": ["gavi-who"]}, {"tr": "Burada bağlayıcı olan, tutara eklenen uygunluk şartı. Bir ödenek serbest bırakıldığında iş biter; uygunluk şartı ise para her aktarıldığında yeniden uygulanır ve alıcı kurumun kimi finanse edebileceğini belirler. Daha sade bir açıklama da mümkün: karar, iki yıl süren bir bütçe tıkanıklığının teknik çözümü ve aşı içeriğine dair yerel siyasetin gereği olabilir.", "en": "What binds here is the eligibility test attached to the sum. Releasing an appropriation is a one-off act; an eligibility test applies again every time money moves, and it determines whom the receiving institution may fund. A plainer explanation is also available: the decision may be the technical resolution of a two-year budget blockage and a requirement of local politics over vaccine content.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Davranışını değiştirmek zorunda olan taraf", "en": "The party that has to change its conduct"}, "ps": [{"tr": "Koşulu karşılamak zorunda olan taraf Gavi. Dünya Sağlık Örgütü ise dolaylı bir kaynak kanalını, kendi aldığı bir karar olmadan, bir aracı kurumun uygunluk kuralları değiştiği için yitiriyor. Ölçek farkı bu kaybı somutlaştırıyor: Amerikan katkısı 2019'da 400 milyon dolar üzerindeydi, bu örgüt bütçesinin yaklaşık yüzde 15'iydi ve yıllık bütçe yaklaşık 3,4 milyar dolar.", "en": "The party obliged to satisfy the condition is Gavi. The World Health Organization loses an indirect funding channel without any decision of its own, because an intermediary institution's eligibility rules changed. The difference in scale makes the loss concrete: American funding reached more than $400m in 2019, about 15 percent of the organization's budget, and that budget runs to some $3.4bn a year.", "refs": ["gavi-who"]}, {"tr": "Koşulun gerçekten bağlayıcı olup olmadığı, gözlenebilir bir yerde belli olacak: Gavi'nin satın alma kararları. Gavi yıl sonuna kadar cıva içeren aşıların tedarikine ilişkin yayımlanmış bir değişiklik açıklarsa koşul davranış değiştirmiş olur. Böyle bir değişiklik yayımlanmazsa ödenek serbest bırakılmış, kural ise uygulanmamış olur.", "en": "Whether the condition truly binds will show up somewhere observable: Gavi's procurement decisions. If Gavi announces a published change to its sourcing of mercury-containing vaccines by the end of the year, the condition will have altered conduct. If no such change is published, the money will have been released and the rule left unapplied.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Aracı kurum üzerinden kurulan emsal", "en": "A precedent built through the intermediary"}, "ps": [{"tr": "Bir bağışçının, çekildiği kurumu hâlâ finanse ettiği bir ittifakın uygunluk kuralları üzerinden dışarıda tutması, doğrudan kesintiden farklı bir yetki kullanımıdır: karar bağışçıda kalır, uygulama yükü aracı kurumun üzerine geçer. Trump 2020'de katkıyı durdurdu, Biden Ocak 2021'de kararı geri aldı, Trump ise 20 Ocak 2025'te çekilmeyi duyurdu; bu kez kural, çekilmenin ulaşamadığı yere uzanıyor.", "en": "A donor keeping the body it has left outside the reach of an alliance it still funds, by way of that alliance's eligibility rules, exercises authority differently from a direct cut: the decision stays with the donor while the burden of applying it passes to the intermediary. Trump halted funding in 2020, Biden reversed it in January 2021, and Trump announced the withdrawal on 20 January 2025; this time the rule reaches where the withdrawal could not.", "refs": ["gavi-who"]}]}], "sources": [{"key": "gavi-who", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-cuts-who-off-from-gavi-vaccine-alliance", "title": {"tr": "ABD, Gavi'ye 600 milyon doları serbest bıraktı ama paranın DSÖ'ye gitmesini engelledi", "en": "US releases $600m for Gavi while barring the money from reaching the WHO"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-02", "title": {"tr": "Kızıldeniz'de kimin gemisi korunacak?", "en": "Whose ships will be protected in the Red Sea?"}, "excerpt": {"tr": "Riyad, Kızıldeniz'deki gemiler için ortak arıyor; koalisyonun bileşimi henüz kesinleşmedi. Bir davet listesi taahhüt üretmez ve Katar, Kuveyt ile Bahreyn'den gelen telefonlar koalisyona katılmayı değil gerilimin düşürülmesini istedi.", "en": "Riyadh is looking for partners to guard Red Sea shipping, and the coalition's composition has not yet been finalised. An invitation list produces no commitment, and the calls from Qatar, Kuwait and Bahrain asked for de-escalation rather than enlistment."}, "sections": [{"h": {"tr": "Bileşim belirlenmeden yetki alanı belirlenemez", "en": "The mandate cannot be set before the membership"}, "ps": [{"tr": "Suudi Arabistan, Kızıldeniz'deki gemileri Husilerin saldırılarından korumak için uluslararası bir koalisyon kurmaya çalışıyor. Al Jazeera'nin haberine göre onlarca ülkeyle görüşmeler sürüyor ve koalisyonun bileşimi henüz kesinleşmedi. Sıra burada önemli: bir korumanın kime, hangi sularda ve hangi kuvvet kullanma yetkisiyle sağlanacağı, o korumayı kimlerin üstlendiği belirlenmeden yazılamaz.", "en": "Saudi Arabia is trying to build an international coalition to protect shipping in the Red Sea from Houthi attacks. Al Jazeera reported that deliberations with dozens of countries continue and that the composition of the coalition has not yet been finalised. The order matters here: who is to be protected, in which waters, and with what authority to use force cannot be written down before it is settled who carries that protection.", "refs": ["red-sea-coalition"]}, {"tr": "Bileşimin açık kalması bir ihmal olmayabilir; pazarlığın kendisi olabilir. Katılacak devletlerin listesi, koalisyonun neyi yapmaya yetkili olacağını da belirler; geniş bir liste dar bir yetki alanı, dar bir liste geniş bir yetki alanı üretmeye eğilimlidir. Daha yüzeysel bir açıklama da mümkün: bu, duyuru öncesinde her ittifak girişiminde görülen olağan hazırlık sırası olabilir.", "en": "Leaving the membership open may not be an oversight; it may be the bargain itself. The list of participating states also fixes what the coalition is authorised to do; a broad list tends to produce a narrow mandate and a narrow list a broad one. A more superficial explanation is also available: this may be the ordinary sequence of preparation seen before any alliance announcement.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Aynı telefonlarda iki ayrı talep", "en": "Two different requests on the same calls"}, "ps": [{"tr": "Suudi Dışişleri Bakanı Prens Faysal bin Ferhan; Katar, Kuveyt ve Bahreyn'deki mevkidaşlarından telefon aldı ve bildirilene göre bu görüşmelerde gerilimi düşürme çabalarının sürdürülmesinin önemine vurgu yapıldı. Husiler 20 Temmuz'da Suudi Arabistan'a deniz ablukası ilan etmiş, gerekçe olarak Yemen'e yaklaşık 12 yıldır uygulandığını söyledikleri kuşatmayı göstermişti; Riyad da Hudeyde limanındaki tesisleri vurdu.", "en": "Saudi Foreign Minister Prince Faisal bin Farhan received calls from his counterparts in Qatar, Kuwait and Bahrain and, as reported, those calls stressed the importance of continuing efforts to de-escalate tensions. The Houthis announced a maritime blockade of Saudi Arabia on 20 July, citing what they called a nearly 12-year siege of Yemen; Riyadh struck facilities at Hodeidah port.", "refs": ["red-sea-coalition"]}, {"tr": "Bir kefede Riyad'ın kurmak istediği askerî düzenek, öbür kefede komşularının kamuya açık tercihi duruyor; ikisi birbirini dışlamaz, ancak biri diğerinin yerine geçemez. Gerilimi düşürme dili ile koruma gücüne katılma kararı aynı taahhüt sayılamaz. Bir devletin gerilimin düşürülmesini istemesi, o devletin bir devriye görevine kuvvet ayırdığı anlamına gelmez.", "en": "On one side of the scale sits the military arrangement Riyadh wants to build; on the other, its neighbours' publicly stated preference. The two do not exclude each other, and neither substitutes for the other. The language of de-escalation and a decision to join a protection force do not amount to the same commitment. A state asking for de-escalation has not thereby committed forces to a patrol.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Davetin taahhüde dönüştüğü an", "en": "The moment an invitation becomes a commitment"}, "ps": [{"tr": "Bu girişimin bir koalisyona dönüşüp dönüşmediği, ortak bir metnin yayımlanmasıyla anlaşılacak. İki ay içinde katılan devletleri adlarıyla sayan ve görev tanımını yazan bir kuruluş bildirisi çıkarsa davet aşaması kapanmış olur. Böyle bir metin çıkmazsa ortada sürmekte olan bir davet listesi vardır ve Kızıldeniz'deki gemilerin korunması tek tek devletlerin kendi kararlarına kalır.", "en": "Whether this effort becomes a coalition will be settled by the publication of a joint text. If within two months a founding statement appears that names the participating states and sets out the task, the invitation stage will have closed. If no such text appears, what exists is a running invitation list, and the protection of shipping in the Red Sea stays with the separate decisions of individual states.", "refs": ["red-sea-coalition"]}]}], "sources": [{"key": "red-sea-coalition", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/saudi-arabia-seeks-international-coalition-against-houthis-in-red-sea", "title": {"tr": "Suudi Arabistan, Kızıldeniz'deki gemiler için uluslararası bir koalisyon arıyor", "en": "Saudi Arabia is trying to assemble an international coalition to guard Red Sea shipping"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-03", "title": {"tr": "Balistiği durduran füze tükeniyor", "en": "The missile that stops a ballistic one is running out"}, "excerpt": {"tr": "Kiev perşembe sabaha karşı balistik füzelerle vuruldu. Ukrayna'nın elinde Patriot bataryası var; eksik olan, o bataryaların balistik hedeflere karşı kullandığı PAC-3 mühimmatı. Kısıt fırlatıcı sayısında değil ikmalde.", "en": "Kyiv was hit by ballistic missiles early on Thursday. Ukraine has Patriot batteries; what it lacks is the PAC-3 round those batteries use against ballistic targets. The constraint lies in resupply rather than in launcher count."}, "sections": [{"h": {"tr": "01.18'de olan şey", "en": "What happened at 01.18"}, "ps": [{"tr": "Kiev'de yerel saatle 01.18'de patlamalar duyuldu. Belediye Başkanı Vitali Klitschko konut dışı bazı alanlarda yangın çıktığını bildirdi ve halkı sığınaklara yönlendirdi. Saldırı, Zelenskiy'in bir gün önce hava kuvvetlerinden aldığı bilgiye dayanarak geniş çaplı bir Rus saldırısının muhtemel olduğunu söylemesinden sonra geldi. Uyarının kendisi işe yaradı; uyarının sonucunda kullanılabilecek mühimmat ise ayrı bir sorun.", "en": "Explosions were heard in Kyiv at 01.18 local time. Mayor Vitali Klitschko said fires broke out at some non-residential sites and told people to seek shelter. The attack came after Zelenskyy said a day earlier, on the basis of an air force report, that a large-scale Russian attack was likely. The warning itself worked; the munition available to act on the warning is a separate problem.", "refs": ["kyiv-ballistic"]}, {"tr": "Habere göre Ukrayna, Patriot bataryalarının ihtiyaç duyduğu PAC-3 önleyici füzelerinden yoksun ve Rus balistik füzelerini düşürebilen tek mühimmat bu. Trump ise Ukrayna'ya Patriot füzelerini kendi topraklarında üretme lisansı verilmesini kabul etti. Bu iki cümle aynı yöne bakmıyor: biri bu geceye, öbürü yıllar sonrasına ait.", "en": "According to the report, Ukraine lacks the PAC-3 interceptor missiles its Patriot batteries need, and that round is the only munition capable of downing Russian ballistic missiles. Trump, meanwhile, agreed to give Ukraine licences to manufacture Patriot missiles domestically. The two sentences do not point the same way: one belongs to tonight, the other to years from now.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Envanterin değil ikmalin sorunu", "en": "A problem of resupply rather than inventory"}, "ps": [{"tr": "Bir hava savunmasının kabiliyeti fırlatıcı sayısıyla değil atabileceği mühimmatla ölçülür. Batarya duruyorsa ve doğru mühimmat yoksa sistem hedefi görür, vuramaz. Üretim lisansı bu kısıtı bugün gevşetmez: tesis, sertifikasyon ve tedarik zinciri gerektirir; savunma ihtiyacı ise saldırı gecesinde doğar. Başka bir okuma da mümkün: Ukrayna açıklamadığı stoklar tutuyor olabilir ya da müttefikler kendi envanterlerinden hızlı bir devir yapabilir.", "en": "An air defence is measured by the rounds it can fire, not by the launchers it owns. If the battery stands and the right round is missing, the system sees the target and cannot engage it. A production licence does not ease that constraint today: it requires a plant, certification and a supply chain, while the need for defence arises on the night of the attack. Another reading is possible: Ukraine may hold stocks it has not disclosed, or allies may transfer quickly from their own inventories.", "refs": ["kyiv-ballistic"]}, {"tr": "Mühimmatını saymak zorunda olan bir savunma, hangi hedefi koruyacağını seçmek zorunda kalır. Bu seçim saldıran tarafa bilgi verir: hangi hedeflerin ucuza vurulabileceğini savunmanın kıtlığı belirler. Klitschko'nun bildirdiği hasarın konut dışı alanlarda kalması bu gecenin sonucudur; savunmanın kapasitesini kanıtlamaz.", "en": "A defence forced to count its rounds is forced to choose what it protects. That choice tells the attacker something: the defender's scarcity decides which targets can be struck cheaply. That the damage Klitschko reported stayed at non-residential sites is the outcome of this one night; it does not establish the defence's capacity.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Gözlenebilir eşik", "en": "The observable threshold"}, "ps": [{"tr": "Kıtlığın kapanıp kapanmadığı üretim haberinden değil devir haberinden anlaşılır. Üç ay içinde bir müttefik hükümet ya da Ukrayna Savunma Bakanlığı, üretim lisansından ayrı olarak teslim edilmiş PAC-3 mühimmatını açıkça duyurursa kısıt gevşemiş olur. Yalnızca üretim ve lisans duyuruları gelirse, balistik tehdide karşı bu kış da aynı mühimmat sayılmaya devam edecek.", "en": "Whether the shortage closes will be shown by a transfer, not by a production announcement. If within three months an allied government or Ukraine's defence ministry explicitly announces delivered PAC-3 rounds, separately from the manufacturing licence, the constraint will have eased. If only production and licensing announcements arrive, the same rounds will still be counted against the ballistic threat this winter.", "refs": ["kyiv-ballistic"]}]}], "sources": [{"key": "kyiv-ballistic", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/russia-ballistic-missile-strikes-on-kyiv-come-after-zelenskyys-warning", "title": {"tr": "Zelenskiy'in uyarısından saatler sonra Kiev balistik füzelerle vuruldu", "en": "Russian ballistic missiles hit Kyiv hours after Zelenskyy warned of a mass attack"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-04", "title": {"tr": "Bir yanda yüzde yüz, öbür yanda on beş yıl", "en": "One hundred percent on one side, fifteen years on the other"}, "excerpt": {"tr": "Mercosur-Singapur anlaşması Brezilya için ağustos başında yürürlüğe giriyor. Singapur ilk günden bütün Brezilya mallarına sıfır tarife uygularken Mercosur'un karşılığı on beş yıla yayılıyor. Asıl bilgi bu takvim farkında.", "en": "The Mercosur-Singapore agreement enters into force for Brazil at the start of August. Singapore applies zero tariffs to every Brazilian good from day one while Mercosur's side of the bargain stretches over fifteen years. The information sits in that gap between schedules."}, "sections": [{"h": {"tr": "İki takvim, tek anlaşma", "en": "Two schedules, one agreement"}, "ps": [{"tr": "The Rio Times'ın haberine göre anlaşma Brezilya bakımından 1 Ağustos 2026'da yürürlüğe giriyor. Singapur o günden itibaren Brezilya ihracatının yüzde 100'üne sıfır tarife uyguluyor. Mercosur ise Singapur kaynaklı kalemlerin yaklaşık yüzde 95,8-96'sındaki vergileri 15 yıla varan bir takvimle kaldırıyor ve bu kalemlerin yaklaşık yüzde 20-25,6'sı ilk günden vergisiz hale geliyor.", "en": "According to The Rio Times, the agreement enters into force for Brazil on 1 August 2026. From that day Singapore applies zero tariffs to 100 percent of Brazilian exports. Mercosur removes duties on roughly 95.8–96 percent of Singaporean lines on a schedule running up to 15 years, and about 20–25.6 percent of those lines become duty-free from the first day.", "refs": ["mercosur-singapore"]}, {"tr": "Bu iki takvim aynı anlaşmanın iki farklı fiyatı. Bir tarafın açılışı tek seferde tamamlanıyor, öbür tarafın açılışı taksitle ödeniyor. İlk yılın ölçülebilir etkisi de buna göre tek yönlü olabilir: Brezilya'nın Singapur'a satışında hemen görülebilir bir değişiklik beklenirken, Singapur mallarının Mercosur'a girişinde kalemlerin büyük bölümü hâlâ eski vergiyle karşılaşıyor. Başka bir mekanizma da bu tabloyu bozabilir: Singapur bir yeniden ihracat merkezi olduğundan, tarife değişmeden de yükün güzergâhı değişebilir.", "en": "The two schedules are two different prices for the same agreement. One side's opening completes at a stroke; the other side pays in instalments. The first year's measurable effect may accordingly run in one direction: a visible change can be expected in Brazil's sales to Singapore, while most lines still meet the old duty when Singaporean goods enter Mercosur. Another mechanism could disturb that picture: because Singapore is a re-export hub, cargo may change route without any tariff changing.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Hangi kalem ne zaman serbest kalıyor", "en": "Which line is freed, and when"}, "ps": [{"tr": "İlk günden serbest kalan yüzde 20-25,6 ile nihai yüzde 95,8-96 arasındaki aralık, Mercosur'un pazarlıkta koruduğu şeyin ölçüsü. Bir anlaşmanın hangi sektörü kolladığı, kapsam oranından çok bu aradan okunur; 15 yıllık kuyruğun içinde kalan kalemler, bloğun uyum yükünü kime ve ne zamana ertelediğini gösterir. Kapsam oranı yüksek göründüğünde bile taksit takvimi asıl hükümdür.", "en": "The band between the 20–25.6 percent freed on day one and the eventual 95.8–96 percent is the measure of what Mercosur protected in the bargain. Which sector an agreement shields is read less from its coverage ratio than from that gap; the lines left inside the 15-year tail show to whom and to when the bloc has deferred the burden of adjustment. Even when the coverage ratio looks high, the instalment schedule is the operative provision.", "refs": ["mercosur-singapore"]}, {"tr": "Yükün kimde kaldığı da buradan çıkıyor. Brezilyalı ihracatçı erişimi ilk gün alıyor; Mercosur'daki ithalatçı ve alıcı, ucuzlamayı yıllara bölünmüş biçimde alıyor. Korunan üretici için bu bir nefes payı, aynı kalemi girdi olarak kullanan imalatçı için gecikmiş bir maliyet avantajı. Tek bir oran iki farklı taraf için iki farklı anlam taşıyor.", "en": "Where the burden falls follows from the same place. The Brazilian exporter gets access on day one; the importer and the buyer inside Mercosur get the price relief split across years. For the protected producer that is breathing room; for the manufacturer using the same line as an input it is a delayed cost advantage. A single percentage carries two different meanings for two different parties.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Sınanabilir yer", "en": "Where this can be tested"}, "ps": [{"tr": "Takvim farkının gerçekten iş görüp görmediği gümrük serisinde sınanabilir. Yılın son çeyreğinde Brezilya'nın Singapur'a ihracatı geçen yılın aynı aylarına göre belirgin biçimde artarken Singapur'dan Mercosur'a ithalat aynı ölçüde artmazsa, asimetri beklendiği gibi çalışıyor demektir. İki yön birlikte hareket ederse açıklamayı tarifede değil talepte aramak gerekir.", "en": "Whether the gap between schedules actually does work can be tested in the customs series. If, in the final quarter of the year, Brazil's exports to Singapore rise markedly against the same months of last year while imports from Singapore into Mercosur do not rise as much, the asymmetry is working as expected. If both directions move together, the explanation has to be sought in demand rather than in the tariff.", "refs": ["mercosur-singapore"]}]}], "sources": [{"key": "mercosur-singapore", "kind": "news", "name": "The Rio Times", "url": "https://www.riotimesonline.com/brazil-ratifies-mercosur-singapore-free-trade-agreement/", "title": {"tr": "Mercosur-Singapur ticaret anlaşması Brezilya için 1 Ağustos'ta yürürlüğe giriyor", "en": "The Mercosur-Singapore trade agreement takes effect for Brazil on 1 August"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-05", "title": {"tr": "Riyad'a gitmeyen ziyaret", "en": "The visit that did not go to Riyadh"}, "excerpt": {"tr": "Irak Ulusal Güvenlik Konseyi saldırıları egemenlik ihlali saydı ve Başbakan Ali el-Zeydi, göreve geldiğinden bu yana Riyad'a yapacağı ilk ziyareti iptal etti. İptal edilen ziyaret Irak'ın kendi girişimiydi; bedeli de bu yüzden Irak'ta kalıyor.", "en": "Iraq's National Security Council called the strikes a violation of sovereignty, and Prime Minister Ali al-Zaidi cancelled the first visit to Riyadh he was to make since taking office. The cancelled visit was Iraq's own initiative, which is why the cost of cancelling it stays in Iraq."}, "sections": [{"h": {"tr": "İptal edilen şey kimin girişimiydi", "en": "Whose initiative was cancelled"}, "ps": [{"tr": "Başbakan Ali el-Zeydi'nin başkanlık ettiği Irak Ulusal Güvenlik Konseyi, Haşdi Şabi üslerine çarşamba günü yapılan saldırıları \"Irak'ın egemenliğinin açık bir ihlali\" olarak nitelendirdi ve saldırıların uluslararası hukuk ilkelerine ve BM Şartı'na aykırı olduğunu bildirdi. El-Zeydi, perşembe günü Riyad'da yapması beklenen ilk resmî Suudi Arabistan ziyaretini protesto amacıyla iptal etti.", "en": "Iraq's National Security Council, chaired by Prime Minister Ali al-Zaidi, called Wednesday's strikes on Popular Mobilisation Forces bases \"a flagrant violation of Iraq's sovereignty\" and said they contravened the principles of international law and the UN Charter. Al-Zaidi cancelled in protest the first official visit to Saudi Arabia he had been due to make in Riyadh on Thursday.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın elindeki karşılık seçenekleri arasında bu, kendisine en pahalı geleni. Ziyaret Riyad'ın Irak'a verdiği bir imtiyaz değildi; Irak'ın Riyad'a doğru attığı bir adımdı. İptal, karşı tarafın kaybını değil kendi programının kaybını üretiyor ve bir devletin kendi girişiminden vazgeçmesi, ilan edilen bir kınamadan daha somut bir maliyet taşıyor. Daha içe dönük bir açıklama da geçerli olabilir: iptal, vurulan silahlı grubun ve onun siyasi temsilinin beklentisini karşılamayı hedefliyor olabilir.", "en": "Among the responses available to Iraq, this is the one that costs Iraq most. The visit was no favour Riyadh granted Iraq; it was a step Iraq was taking towards Riyadh. Cancelling it produces a loss in Iraq's own programme rather than in the other party's, and a state giving up its own initiative carries a more concrete cost than a declared condemnation. A more inward-facing explanation may also hold: the cancellation may be aimed at meeting the expectations of the armed group that was struck and of its political representation.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Tek metin, iki muhatap", "en": "One text, two audiences"}, "ps": [{"tr": "Haşdi Şabi, Kerkük'ten Basra'ya uzanan yedi ilde en az 20 mensubunun öldüğünü ve 32 kişinin yaralandığını açıkladı; Irak ve İran medyası en az dört Devrim Muhafızları danışmanının öldüğünü bildirdi. Suudi Savunma Bakanlığı ise saldırıların Irak topraklarından petrol tesislerine yönelik insansız hava aracı saldırılarına yanıt olduğunu ve tırmanma istemediklerini söyledi. İki anlatı aynı olayı iki farklı sorumluluk zincirine bağlıyor.", "en": "The Popular Mobilisation Forces said at least 20 of its members were killed and 32 wounded across seven provinces from Kirkuk to Basra; Iraqi and Iranian media reported at least four Revolutionary Guard advisers killed. Saudi Arabia's defence ministry said the strikes answered drone attacks on petroleum facilities launched from Iraqi territory and that it does not seek escalation. The two accounts attach the same event to two different chains of responsibility.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın açıklaması iki muhataba birden konuşmak zorunda: vurulan silahlı gücün siyasi çevresine ve yatırım ile enerji bağı kurmak istediği komşusuna. Egemenlik dili bu ikisini aynı cümlede taşıyabiliyor, çünkü hukuki bir ihlal saptıyor ve karşılık verilecek bir düşman adı koymuyor. Suudi bakanlığın tırmanma istemediği yönündeki ifadesi de aynı işlevi ters yönden görüyor; iki taraf da olayı kapatılabilir bir çerçevede tutuyor.", "en": "Iraq's statement has to speak to two audiences at once: the political circle of the armed force that was struck, and the neighbour with which it wants investment and energy ties. The language of sovereignty can carry both in one sentence, because it establishes a legal violation while naming no enemy to be answered. The Saudi ministry's statement that it does not seek escalation serves the same function from the other direction; both sides keep the event inside a frame that can be closed.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Ziyaretin yeni tarihi ne söyleyecek", "en": "What the visit's new date will say"}, "ps": [{"tr": "Kınamanın sınırlı bir işaret mi yoksa yön değişikliği mi olduğu, ziyaretin akıbetinden anlaşılacak. Üç ay içinde ziyaret yeni bir tarihte gerçekleşir ve Irak kamuya açık bir tazminat talebi ile üslerin statüsünde bir değişiklik istemezse, egemenlik dili kapatılabilir bir çerçeve olarak kullanılmış olur. Ziyaret bu süre içinde yapılmazsa, Riyad'a dönük açılımın maliyeti Irak'ın hesapladığından yüksek çıkmış demektir.", "en": "Whether the condemnation was a bounded signal or a change of direction will be shown by what happens to the visit. If within three months it takes place on a new date and Iraq makes no public demand for compensation or change in the status of the bases, the language of sovereignty will have been used as a frame that can be closed. If the visit does not happen in that time, the cost of the opening towards Riyadh will have proved higher than Iraq reckoned.", "refs": ["iraq-sovereignty"]}]}], "sources": [{"key": "iraq-sovereignty", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/iraq-calls-saudi-us-attacks-flagrant-violation-of-sovereignty", "title": {"tr": "Irak, ABD-Suudi saldırılarını egemenlik ihlali sayıp başbakanın Riyad ziyaretini iptal etti", "en": "Iraq calls the US-Saudi strikes a sovereignty violation and cancels the PM's Riyadh trip"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-06", "title": {"tr": "Altıdan yediye, ikinci kez", "en": "From six to seven, for the second time"}, "excerpt": {"tr": "Nikaragua'da aynı anayasa maddesi iki yıl içinde ikinci kez yazılıyor. 2024'te görev süresi beşten altıya çıktı, şimdi yediye taşınıyor. Bu kez eklenen hüküm ise süreyi bırakıp kimin aday olabileceğini düzenliyor.", "en": "In Nicaragua the same constitutional clause is being written for the second time in two years. In 2024 the presidential term went from five to six years; now it moves to seven. The clause added this time leaves the term aside and regulates who may stand."}, "sections": [{"h": {"tr": "Aynı maddenin ikinci yazımı", "en": "The second writing of the same clause"}, "ps": [{"tr": "Kongre'ye gönderilen taslak, cumhurbaşkanlığı görev süresini altı yıldan yenilenebilir yedi yıla çıkarıyor ve \"hain\" ile \"darbeci\" olarak tanımlanan muhalifleri seçimlerin dışında bırakıyor. Kongre Başkanı Gustavo Porras taslağı salı günü okurken yönetim sisteminin \"fiilen yedi yıllık, yenilenebilir bir görev süresiyle örgütlenmeyi önerdiğini\" söyledi; onay eylülde bekleniyor. 2024'te kabul edilen değişiklik ise süreyi beş yıldan altı yıla çıkarmış ve Rosario Murillo'nun konumunu yükseltmişti.", "en": "The draft sent to Congress raises the presidential term from six to seven renewable years and excludes opposition figures described as traitors and coup-plotters from elections. Reading the draft on Tuesday, Congress President Gustavo Porras said the system of government \"proposes to be organised with an effective term of seven renewable years\"; approval is expected in September. The amendment adopted in 2024 had raised the term from five to six years and elevated the position of Rosario Murillo.", "refs": ["nicaragua-reform"]}, {"tr": "İki değişiklik aynı meclisten geliyor ama aynı araç sayılamaz. Süre uzatması bir yarışmayı erteler; uygunluk kuralı o yarışmayı ortadan kaldırır. Bu ayrım, iki metni tek bir eğilimin devamı saymayı engelleyen asıl farktır: birincisi makamı elde tutmaya, ikincisi karşı tarafın adaylığını hukuki bir kategoriye bağlamaya yarar. Daha zayıf bir okuma da mümkün: vatandaşlıktan çıkarmalarla fiilen uygulanan bir dışlama yazıya geçiriliyorsa, hüküm mevcut uygulamanın tescili olabilir.", "en": "The two amendments come from the same assembly and cannot be treated as the same instrument. Extending a term postpones a contest; an eligibility rule removes it. That distinction is what preve
