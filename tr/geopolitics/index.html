 girişimin bir koalisyona dönüşüp dönüşmediği, ortak bir metnin yayımlanmasıyla anlaşılacak. İki ay içinde katılan devletleri adlarıyla sayan ve görev tanımını yazan bir kuruluş bildirisi çıkarsa davet aşaması kapanmış olur. Böyle bir metin çıkmazsa ortada sürmekte olan bir davet listesi vardır ve Kızıldeniz'deki gemilerin korunması tek tek devletlerin kendi kararlarına kalır.", "en": "Whether this effort becomes a coalition will be settled by the publication of a joint text. If within two months a founding statement appears that names the participating states and sets out the task, the invitation stage will have closed. If no such text appears, what exists is a running invitation list, and the protection of shipping in the Red Sea stays with the separate decisions of individual states.", "refs": ["red-sea-coalition"]}]}], "sources": [{"key": "red-sea-coalition", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/saudi-arabia-seeks-international-coalition-against-houthis-in-red-sea", "title": {"tr": "Suudi Arabistan, Kızıldeniz'deki gemiler için uluslararası bir koalisyon arıyor", "en": "Saudi Arabia is trying to assemble an international coalition to guard Red Sea shipping"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-03", "title": {"tr": "Balistiği durduran füze tükeniyor", "en": "The missile that stops a ballistic one is running out"}, "excerpt": {"tr": "Kiev perşembe sabaha karşı balistik füzelerle vuruldu. Ukrayna'nın elinde Patriot bataryası var; eksik olan, o bataryaların balistik hedeflere karşı kullandığı PAC-3 mühimmatı. Kısıt fırlatıcı sayısında değil ikmalde.", "en": "Kyiv was hit by ballistic missiles early on Thursday. Ukraine has Patriot batteries; what it lacks is the PAC-3 round those batteries use against ballistic targets. The constraint lies in resupply rather than in launcher count."}, "sections": [{"h": {"tr": "01.18'de olan şey", "en": "What happened at 01.18"}, "ps": [{"tr": "Kiev'de yerel saatle 01.18'de patlamalar duyuldu. Belediye Başkanı Vitali Klitschko konut dışı bazı alanlarda yangın çıktığını bildirdi ve halkı sığınaklara yönlendirdi. Saldırı, Zelenskiy'in bir gün önce hava kuvvetlerinden aldığı bilgiye dayanarak geniş çaplı bir Rus saldırısının muhtemel olduğunu söylemesinden sonra geldi. Uyarının kendisi işe yaradı; uyarının sonucunda kullanılabilecek mühimmat ise ayrı bir sorun.", "en": "Explosions were heard in Kyiv at 01.18 local time. Mayor Vitali Klitschko said fires broke out at some non-residential sites and told people to seek shelter. The attack came after Zelenskyy said a day earlier, on the basis of an air force report, that a large-scale Russian attack was likely. The warning itself worked; the munition available to act on the warning is a separate problem.", "refs": ["kyiv-ballistic"]}, {"tr": "Habere göre Ukrayna, Patriot bataryalarının ihtiyaç duyduğu PAC-3 önleyici füzelerinden yoksun ve Rus balistik füzelerini düşürebilen tek mühimmat bu. Trump ise Ukrayna'ya Patriot füzelerini kendi topraklarında üretme lisansı verilmesini kabul etti. Bu iki cümle aynı yöne bakmıyor: biri bu geceye, öbürü yıllar sonrasına ait.", "en": "According to the report, Ukraine lacks the PAC-3 interceptor missiles its Patriot batteries need, and that round is the only munition capable of downing Russian ballistic missiles. Trump, meanwhile, agreed to give Ukraine licences to manufacture Patriot missiles domestically. The two sentences do not point the same way: one belongs to tonight, the other to years from now.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Envanterin değil ikmalin sorunu", "en": "A problem of resupply rather than inventory"}, "ps": [{"tr": "Bir hava savunmasının kabiliyeti fırlatıcı sayısıyla değil atabileceği mühimmatla ölçülür. Batarya duruyorsa ve doğru mühimmat yoksa sistem hedefi görür, vuramaz. Üretim lisansı bu kısıtı bugün gevşetmez: tesis, sertifikasyon ve tedarik zinciri gerektirir; savunma ihtiyacı ise saldırı gecesinde doğar. Başka bir okuma da mümkün: Ukrayna açıklamadığı stoklar tutuyor olabilir ya da müttefikler kendi envanterlerinden hızlı bir devir yapabilir.", "en": "An air defence is measured by the rounds it can fire, not by the launchers it owns. If the battery stands and the right round is missing, the system sees the target and cannot engage it. A production licence does not ease that constraint today: it requires a plant, certification and a supply chain, while the need for defence arises on the night of the attack. Another reading is possible: Ukraine may hold stocks it has not disclosed, or allies may transfer quickly from their own inventories.", "refs": ["kyiv-ballistic"]}, {"tr": "Mühimmatını saymak zorunda olan bir savunma, hangi hedefi koruyacağını seçmek zorunda kalır. Bu seçim saldıran tarafa bilgi verir: hangi hedeflerin ucuza vurulabileceğini savunmanın kıtlığı belirler. Klitschko'nun bildirdiği hasarın konut dışı alanlarda kalması bu gecenin sonucudur; savunmanın kapasitesini kanıtlamaz.", "en": "A defence forced to count its rounds is forced to choose what it protects. That choice tells the attacker something: the defender's scarcity decides which targets can be struck cheaply. That the damage Klitschko reported stayed at non-residential sites is the outcome of this one night; it does not establish the defence's capacity.", "refs": ["kyiv-ballistic"]}]}, {"h": {"tr": "Gözlenebilir eşik", "en": "The observable threshold"}, "ps": [{"tr": "Kıtlığın kapanıp kapanmadığı üretim haberinden değil devir haberinden anlaşılır. Üç ay içinde bir müttefik hükümet ya da Ukrayna Savunma Bakanlığı, üretim lisansından ayrı olarak teslim edilmiş PAC-3 mühimmatını açıkça duyurursa kısıt gevşemiş olur. Yalnızca üretim ve lisans duyuruları gelirse, balistik tehdide karşı bu kış da aynı mühimmat sayılmaya devam edecek.", "en": "Whether the shortage closes will be shown by a transfer, not by a production announcement. If within three months an allied government or Ukraine's defence ministry explicitly announces delivered PAC-3 rounds, separately from the manufacturing licence, the constraint will have eased. If only production and licensing announcements arrive, the same rounds will still be counted against the ballistic threat this winter.", "refs": ["kyiv-ballistic"]}]}], "sources": [{"key": "kyiv-ballistic", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/russia-ballistic-missile-strikes-on-kyiv-come-after-zelenskyys-warning", "title": {"tr": "Zelenskiy'in uyarısından saatler sonra Kiev balistik füzelerle vuruldu", "en": "Russian ballistic missiles hit Kyiv hours after Zelenskyy warned of a mass attack"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-04", "title": {"tr": "Bir yanda yüzde yüz, öbür yanda on beş yıl", "en": "One hundred percent on one side, fifteen years on the other"}, "excerpt": {"tr": "Mercosur-Singapur anlaşması Brezilya için ağustos başında yürürlüğe giriyor. Singapur ilk günden bütün Brezilya mallarına sıfır tarife uygularken Mercosur'un karşılığı on beş yıla yayılıyor. Asıl bilgi bu takvim farkında.", "en": "The Mercosur-Singapore agreement enters into force for Brazil at the start of August. Singapore applies zero tariffs to every Brazilian good from day one while Mercosur's side of the bargain stretches over fifteen years. The information sits in that gap between schedules."}, "sections": [{"h": {"tr": "İki takvim, tek anlaşma", "en": "Two schedules, one agreement"}, "ps": [{"tr": "The Rio Times'ın haberine göre anlaşma Brezilya bakımından 1 Ağustos 2026'da yürürlüğe giriyor. Singapur o günden itibaren Brezilya ihracatının yüzde 100'üne sıfır tarife uyguluyor. Mercosur ise Singapur kaynaklı kalemlerin yaklaşık yüzde 95,8-96'sındaki vergileri 15 yıla varan bir takvimle kaldırıyor ve bu kalemlerin yaklaşık yüzde 20-25,6'sı ilk günden vergisiz hale geliyor.", "en": "According to The Rio Times, the agreement enters into force for Brazil on 1 August 2026. From that day Singapore applies zero tariffs to 100 percent of Brazilian exports. Mercosur removes duties on roughly 95.8–96 percent of Singaporean lines on a schedule running up to 15 years, and about 20–25.6 percent of those lines become duty-free from the first day.", "refs": ["mercosur-singapore"]}, {"tr": "Bu iki takvim aynı anlaşmanın iki farklı fiyatı. Bir tarafın açılışı tek seferde tamamlanıyor, öbür tarafın açılışı taksitle ödeniyor. İlk yılın ölçülebilir etkisi de buna göre tek yönlü olabilir: Brezilya'nın Singapur'a satışında hemen görülebilir bir değişiklik beklenirken, Singapur mallarının Mercosur'a girişinde kalemlerin büyük bölümü hâlâ eski vergiyle karşılaşıyor. Başka bir mekanizma da bu tabloyu bozabilir: Singapur bir yeniden ihracat merkezi olduğundan, tarife değişmeden de yükün güzergâhı değişebilir.", "en": "The two schedules are two different prices for the same agreement. One side's opening completes at a stroke; the other side pays in instalments. The first year's measurable effect may accordingly run in one direction: a visible change can be expected in Brazil's sales to Singapore, while most lines still meet the old duty when Singaporean goods enter Mercosur. Another mechanism could disturb that picture: because Singapore is a re-export hub, cargo may change route without any tariff changing.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Hangi kalem ne zaman serbest kalıyor", "en": "Which line is freed, and when"}, "ps": [{"tr": "İlk günden serbest kalan yüzde 20-25,6 ile nihai yüzde 95,8-96 arasındaki aralık, Mercosur'un pazarlıkta koruduğu şeyin ölçüsü. Bir anlaşmanın hangi sektörü kolladığı, kapsam oranından çok bu aradan okunur; 15 yıllık kuyruğun içinde kalan kalemler, bloğun uyum yükünü kime ve ne zamana ertelediğini gösterir. Kapsam oranı yüksek göründüğünde bile taksit takvimi asıl hükümdür.", "en": "The band between the 20–25.6 percent freed on day one and the eventual 95.8–96 percent is the measure of what Mercosur protected in the bargain. Which sector an agreement shields is read less from its coverage ratio than from that gap; the lines left inside the 15-year tail show to whom and to when the bloc has deferred the burden of adjustment. Even when the coverage ratio looks high, the instalment schedule is the operative provision.", "refs": ["mercosur-singapore"]}, {"tr": "Yükün kimde kaldığı da buradan çıkıyor. Brezilyalı ihracatçı erişimi ilk gün alıyor; Mercosur'daki ithalatçı ve alıcı, ucuzlamayı yıllara bölünmüş biçimde alıyor. Korunan üretici için bu bir nefes payı, aynı kalemi girdi olarak kullanan imalatçı için gecikmiş bir maliyet avantajı. Tek bir oran iki farklı taraf için iki farklı anlam taşıyor.", "en": "Where the burden falls follows from the same place. The Brazilian exporter gets access on day one; the importer and the buyer inside Mercosur get the price relief split across years. For the protected producer that is breathing room; for the manufacturer using the same line as an input it is a delayed cost advantage. A single percentage carries two different meanings for two different parties.", "refs": ["mercosur-singapore"]}]}, {"h": {"tr": "Sınanabilir yer", "en": "Where this can be tested"}, "ps": [{"tr": "Takvim farkının gerçekten iş görüp görmediği gümrük serisinde sınanabilir. Yılın son çeyreğinde Brezilya'nın Singapur'a ihracatı geçen yılın aynı aylarına göre belirgin biçimde artarken Singapur'dan Mercosur'a ithalat aynı ölçüde artmazsa, asimetri beklendiği gibi çalışıyor demektir. İki yön birlikte hareket ederse açıklamayı tarifede değil talepte aramak gerekir.", "en": "Whether the gap between schedules actually does work can be tested in the customs series. If, in the final quarter of the year, Brazil's exports to Singapore rise markedly against the same months of last year while imports from Singapore into Mercosur do not rise as much, the asymmetry is working as expected. If both directions move together, the explanation has to be sought in demand rather than in the tariff.", "refs": ["mercosur-singapore"]}]}], "sources": [{"key": "mercosur-singapore", "kind": "news", "name": "The Rio Times", "url": "https://www.riotimesonline.com/brazil-ratifies-mercosur-singapore-free-trade-agreement/", "title": {"tr": "Mercosur-Singapur ticaret anlaşması Brezilya için 1 Ağustos'ta yürürlüğe giriyor", "en": "The Mercosur-Singapore trade agreement takes effect for Brazil on 1 August"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-05", "title": {"tr": "Riyad'a gitmeyen ziyaret", "en": "The visit that did not go to Riyadh"}, "excerpt": {"tr": "Irak Ulusal Güvenlik Konseyi saldırıları egemenlik ihlali saydı ve Başbakan Ali el-Zeydi, göreve geldiğinden bu yana Riyad'a yapacağı ilk ziyareti iptal etti. İptal edilen ziyaret Irak'ın kendi girişimiydi; bedeli de bu yüzden Irak'ta kalıyor.", "en": "Iraq's National Security Council called the strikes a violation of sovereignty, and Prime Minister Ali al-Zaidi cancelled the first visit to Riyadh he was to make since taking office. The cancelled visit was Iraq's own initiative, which is why the cost of cancelling it stays in Iraq."}, "sections": [{"h": {"tr": "İptal edilen şey kimin girişimiydi", "en": "Whose initiative was cancelled"}, "ps": [{"tr": "Başbakan Ali el-Zeydi'nin başkanlık ettiği Irak Ulusal Güvenlik Konseyi, Haşdi Şabi üslerine çarşamba günü yapılan saldırıları \"Irak'ın egemenliğinin açık bir ihlali\" olarak nitelendirdi ve saldırıların uluslararası hukuk ilkelerine ve BM Şartı'na aykırı olduğunu bildirdi. El-Zeydi, perşembe günü Riyad'da yapması beklenen ilk resmî Suudi Arabistan ziyaretini protesto amacıyla iptal etti.", "en": "Iraq's National Security Council, chaired by Prime Minister Ali al-Zaidi, called Wednesday's strikes on Popular Mobilisation Forces bases \"a flagrant violation of Iraq's sovereignty\" and said they contravened the principles of international law and the UN Charter. Al-Zaidi cancelled in protest the first official visit to Saudi Arabia he had been due to make in Riyadh on Thursday.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın elindeki karşılık seçenekleri arasında bu, kendisine en pahalı geleni. Ziyaret Riyad'ın Irak'a verdiği bir imtiyaz değildi; Irak'ın Riyad'a doğru attığı bir adımdı. İptal, karşı tarafın kaybını değil kendi programının kaybını üretiyor ve bir devletin kendi girişiminden vazgeçmesi, ilan edilen bir kınamadan daha somut bir maliyet taşıyor. Daha içe dönük bir açıklama da geçerli olabilir: iptal, vurulan silahlı grubun ve onun siyasi temsilinin beklentisini karşılamayı hedefliyor olabilir.", "en": "Among the responses available to Iraq, this is the one that costs Iraq most. The visit was no favour Riyadh granted Iraq; it was a step Iraq was taking towards Riyadh. Cancelling it produces a loss in Iraq's own programme rather than in the other party's, and a state giving up its own initiative carries a more concrete cost than a declared condemnation. A more inward-facing explanation may also hold: the cancellation may be aimed at meeting the expectations of the armed group that was struck and of its political representation.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Tek metin, iki muhatap", "en": "One text, two audiences"}, "ps": [{"tr": "Haşdi Şabi, Kerkük'ten Basra'ya uzanan yedi ilde en az 20 mensubunun öldüğünü ve 32 kişinin yaralandığını açıkladı; Irak ve İran medyası en az dört Devrim Muhafızları danışmanının öldüğünü bildirdi. Suudi Savunma Bakanlığı ise saldırıların Irak topraklarından petrol tesislerine yönelik insansız hava aracı saldırılarına yanıt olduğunu ve tırmanma istemediklerini söyledi. İki anlatı aynı olayı iki farklı sorumluluk zincirine bağlıyor.", "en": "The Popular Mobilisation Forces said at least 20 of its members were killed and 32 wounded across seven provinces from Kirkuk to Basra; Iraqi and Iranian media reported at least four Revolutionary Guard advisers killed. Saudi Arabia's defence ministry said the strikes answered drone attacks on petroleum facilities launched from Iraqi territory and that it does not seek escalation. The two accounts attach the same event to two different chains of responsibility.", "refs": ["iraq-sovereignty"]}, {"tr": "Irak'ın açıklaması iki muhataba birden konuşmak zorunda: vurulan silahlı gücün siyasi çevresine ve yatırım ile enerji bağı kurmak istediği komşusuna. Egemenlik dili bu ikisini aynı cümlede taşıyabiliyor, çünkü hukuki bir ihlal saptıyor ve karşılık verilecek bir düşman adı koymuyor. Suudi bakanlığın tırmanma istemediği yönündeki ifadesi de aynı işlevi ters yönden görüyor; iki taraf da olayı kapatılabilir bir çerçevede tutuyor.", "en": "Iraq's statement has to speak to two audiences at once: the political circle of the armed force that was struck, and the neighbour with which it wants investment and energy ties. The language of sovereignty can carry both in one sentence, because it establishes a legal violation while naming no enemy to be answered. The Saudi ministry's statement that it does not seek escalation serves the same function from the other direction; both sides keep the event inside a frame that can be closed.", "refs": ["iraq-sovereignty"]}]}, {"h": {"tr": "Ziyaretin yeni tarihi ne söyleyecek", "en": "What the visit's new date will say"}, "ps": [{"tr": "Kınamanın sınırlı bir işaret mi yoksa yön değişikliği mi olduğu, ziyaretin akıbetinden anlaşılacak. Üç ay içinde ziyaret yeni bir tarihte gerçekleşir ve Irak kamuya açık bir tazminat talebi ile üslerin statüsünde bir değişiklik istemezse, egemenlik dili kapatılabilir bir çerçeve olarak kullanılmış olur. Ziyaret bu süre içinde yapılmazsa, Riyad'a dönük açılımın maliyeti Irak'ın hesapladığından yüksek çıkmış demektir.", "en": "Whether the condemnation was a bounded signal or a change of direction will be shown by what happens to the visit. If within three months it takes place on a new date and Iraq makes no public demand for compensation or change in the status of the bases, the language of sovereignty will have been used as a frame that can be closed. If the visit does not happen in that time, the cost of the opening towards Riyadh will have proved higher than Iraq reckoned.", "refs": ["iraq-sovereignty"]}]}], "sources": [{"key": "iraq-sovereignty", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/iraq-calls-saudi-us-attacks-flagrant-violation-of-sovereignty", "title": {"tr": "Irak, ABD-Suudi saldırılarını egemenlik ihlali sayıp başbakanın Riyad ziyaretini iptal etti", "en": "Iraq calls the US-Saudi strikes a sovereignty violation and cancels the PM's Riyadh trip"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-06", "title": {"tr": "Altıdan yediye, ikinci kez", "en": "From six to seven, for the second time"}, "excerpt": {"tr": "Nikaragua'da aynı anayasa maddesi iki yıl içinde ikinci kez yazılıyor. 2024'te görev süresi beşten altıya çıktı, şimdi yediye taşınıyor. Bu kez eklenen hüküm ise süreyi bırakıp kimin aday olabileceğini düzenliyor.", "en": "In Nicaragua the same constitutional clause is being written for the second time in two years. In 2024 the presidential term went from five to six years; now it moves to seven. The clause added this time leaves the term aside and regulates who may stand."}, "sections": [{"h": {"tr": "Aynı maddenin ikinci yazımı", "en": "The second writing of the same clause"}, "ps": [{"tr": "Kongre'ye gönderilen taslak, cumhurbaşkanlığı görev süresini altı yıldan yenilenebilir yedi yıla çıkarıyor ve \"hain\" ile \"darbeci\" olarak tanımlanan muhalifleri seçimlerin dışında bırakıyor. Kongre Başkanı Gustavo Porras taslağı salı günü okurken yönetim sisteminin \"fiilen yedi yıllık, yenilenebilir bir görev süresiyle örgütlenmeyi önerdiğini\" söyledi; onay eylülde bekleniyor. 2024'te kabul edilen değişiklik ise süreyi beş yıldan altı yıla çıkarmış ve Rosario Murillo'nun konumunu yükseltmişti.", "en": "The draft sent to Congress raises the presidential term from six to seven renewable years and excludes opposition figures described as traitors and coup-plotters from elections. Reading the draft on Tuesday, Congress President Gustavo Porras said the system of government \"proposes to be organised with an effective term of seven renewable years\"; approval is expected in September. The amendment adopted in 2024 had raised the term from five to six years and elevated the position of Rosario Murillo.", "refs": ["nicaragua-reform"]}, {"tr": "İki değişiklik aynı meclisten geliyor ama aynı araç sayılamaz. Süre uzatması bir yarışmayı erteler; uygunluk kuralı o yarışmayı ortadan kaldırır. Bu ayrım, iki metni tek bir eğilimin devamı saymayı engelleyen asıl farktır: birincisi makamı elde tutmaya, ikincisi karşı tarafın adaylığını hukuki bir kategoriye bağlamaya yarar. Daha zayıf bir okuma da mümkün: vatandaşlıktan çıkarmalarla fiilen uygulanan bir dışlama yazıya geçiriliyorsa, hüküm mevcut uygulamanın tescili olabilir.", "en": "The two amendments come from the same assembly and cannot be treated as the same instrument. Extending a term postpones a contest; an eligibility rule removes it. That distinction is what prevents reading the two texts as one continuous tendency: the first serves to keep hold of the office, the second to tie the other side's candidacy to a legal category. A weaker reading is also available: if an exclusion already applied in practice through the stripping of citizenship is being put in writing, the clause may register existing practice.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Neden şimdi", "en": "Why now"}, "ps": [{"tr": "Zamanlamayı açıklayan şey, cumhurbaşkanının muhalefetin hükümeti ele geçirmesini önlemek için ülkede seçim yapılmayacağı yönündeki sözleridir. Bir yönetim seçimin gereksiz olduğunu söyledikten sonra seçimi tümüyle kaldırmak yerine kimin aday olabileceğini yazıyorsa, seçimin biçimini korumayı sürdürmeyi tercih etmiş demektir. Nikaragua'da bir sonraki genel seçim 2027'nin sonunda yapılacak; kural bu tarihten önce onaylanacak biçimde takvime yerleştirilmiş.", "en": "What explains the timing is the president's statements that there would be no elections in the country, in order to stop the opposition from seizing the government. If a government, having said elections are dispensable, then writes down who may stand rather than abolishing the vote outright, it has chosen to keep the form of the election. Nicaragua's next general election is due in late 2027, and the rule has been placed on the calendar to be approved before that date.", "refs": ["nicaragua-reform"]}, {"tr": "Buradaki benzemezlik önemli. 2024 değişikliği yürütmenin içindeki yetkiyi tek bir hanede topluyordu; bu taslak ise yarışmanın giriş koşulunu yazıyor. Aynı yönde ilerleyen iki adım gibi görünseler de birincisi iktidarın kullanımını, ikincisi iktidara aday olma hakkını düzenliyor. Aralarındaki devamlılığı kuran şey, ikisini de geçiren aynı çoğunluk; metinlerin içeriği bu devamlılığı kurmuyor.", "en": "The disanalogy here matters. The 2024 amendment gathered authority inside the executive into a single household; this draft writes the entry condition for the contest. They may look like two steps in one direction, yet the first regulates the exercise of power and the second the right to stand for it. Continuity between them is established by the same majority that passes both; the content of the texts does not establish it.", "refs": ["nicaragua-reform"]}]}, {"h": {"tr": "Onaylanan metnin kendisi", "en": "The approved text itself"}, "ps": [{"tr": "Bu hükmün ne kadar geniş çalışacağı, eylülde onaylanan metnin dilinden okunacak. Kabul edilen madde belirli bir suçu ve yargısal bir tespiti değil bir kişi kategorisini adlandırıyorsa, uygunluk kararı mahkemeden idareye geçmiş olur. Tanımlanmış bir suç ve yargısal tespit şartı korunursa, dışlama hiç değilse bir usule bağlı kalır. İzlenecek yer, resmî gazetede yayımlanan nihai metnin bu iki seçenekten hangisini yazdığıdır.", "en": "How widely this clause will work is to be read from the language of the text approved in September. If the adopted article names a category of persons instead of a defined offence and a judicial finding, the eligibility decision will have moved from the courts to the administration. If a defined offence and a judicial finding are kept as requirements, the exclusion at least remains tied to a procedure. The place to watch is which of the two the final text published in the official gazette writes.", "refs": ["nicaragua-reform"]}]}], "sources": [{"key": "nicaragua-reform", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/nicaraguas-daniel-ortega-aims-to-bar-traitors-from-future-elections", "title": {"tr": "Ortega'nın anayasa taslağı \"hainleri\" seçimlerden çıkarıp görev süresini yediye taşıyor", "en": "Ortega's draft constitutional reform would bar \"traitors\" and lengthen the presidential term"}, "publishedDate": "2026-07-29"}], "date": "2026-07-30"}, {"writer": "geo-01", "title": {"tr": "Malezya'da mülteci kartını hangi imza veriyor?", "en": "Who signs the refugee card in Malaysia?"}, "excerpt": {"tr": "Dışişleri Bakanı'nın talebi bir kurumu ülkeden çıkarmayı hedeflemiyor. Hedefi daha dar ve daha keskin: belge verme yetkisini tek imzadan çift imzaya taşımak.", "en": "The foreign minister's demand does not aim to expel an agency. Its aim is narrower and sharper: to move the power to issue a document from one signature to two."}, "sections": [{"h": {"tr": "Ortada imzalanmış bir metin yok", "en": "There is no signed text in the middle of this"}, "ps": [{"tr": "Malezya BM mülteci sözleşmesine taraf değil. Buna karşın Şubat 2026 sonu itibarıyla ülkede BM Mülteciler Yüksek Komiserliği'ne kayıtlı yaklaşık 126.000 Arakanlı bulunuyor. Yani kurumu ülkede tutan şey bir antlaşma yükümlülüğü değil, sürdürülen bir hoşgörü; Dışişleri Bakanı Mohamad Hasan bu haftaki açıklamasıyla o hoşgörünün koşullarını yüksek sesle telaffuz etti: \"İş birliği yapmak istemiyorlarsa, bence BMMYK'nın varlığını yeniden değerlendirmemizin zamanı geldi\".", "en": "Malaysia is not a party to the UN refugee convention. Even so, about 126,000 Rohingya were registered with the UN refugee agency in the country as of late February 2026. What keeps the agency in place, then, is a tolerance extended year after year rather than any treaty obligation — and this week the foreign minister, Mohamad Hasan, said out loud what that tolerance is conditional on: \"If they do not want to cooperate, in my opinion, it is time for us to reconsider the presence of UNHCR\".", "refs": ["malaysia-unhcr"]}, {"tr": "Açıklamanın zamanlaması bir olaya bağlı. Penang eyaletindeki evlerinden tahliye edilen 100'den fazla Arakanlı sığınmacı, Kuala Lumpur'daki BMMYK ofisinin önünde toplandıktan sonra yetkililerce gözaltına alındı. Kurum, gözaltındakileri korumak ve belgelerini doğrulamak için yetkililerle çalıştığını, bu çabaların onların başka bir barınma yerine nakledilmesine katkıda bulunduğunu bildirdi. Kurumun elindeki araç burada görünür hale geliyor: doğrulama ve ikna, tahliyeyi durdurma yetkisi değil.", "en": "The timing is tied to a specific episode. More than 100 Rohingya asylum seekers, evicted from their homes in Penang state, were detained by the authorities after gathering outside the UNHCR office in Kuala Lumpur. The agency said it was working with officials to protect those held and to verify their documentation, and that this had helped move them to alternative accommodation. What the agency actually holds becomes visible there: verification and persuasion, not the power to stop a detention.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Talep, belgeyi çift imzaya bağlamak", "en": "The demand is to put a second signature on the document"}, "ps": [{"tr": "Hasan'ın somut önerisi şu: belge verilmeden önce BMMYK ile yerel makamlar ortak tarama yapsın. Bakan ayrıca kurumun kişilerin kendi ülkelerinden çevrim içi başvuru yapmasına izin vermesini eleştirdi ve bunun daha fazla mülteciyi ülkeye çektiğini savundu. Bu iki cümle birlikte okunduğunda talebin konusu belli oluyor: statü belirleme kararının kimde kalacağı. Bugün karar tek bir kurumun; önerilen düzenlemede karar, ikinci bir makamın onayı olmadan sonuç doğurmuyor.", "en": "Hasan's concrete proposal is this: UNHCR and local authorities should screen jointly before any document is issued. He also criticised the agency for letting people apply online from their home countries, arguing that this draws more refugees in. Read together, the two statements make the subject of the demand clear — it is about where the status determination sits. Today that decision belongs to a single agency; under the proposed arrangement it would produce no effect without a second authority's approval.", "refs": ["malaysia-unhcr"]}, {"tr": "Bir hoşgörünün koşullu izne dönüşmesi, kâğıt üzerinde küçük bir değişiklik gibi görünür; pratikte belirleyicidir, çünkü koşulu yazan taraf o koşulu ne zaman sıkacağına da karar verir. Yine de daha sade bir okuma mümkün: görünür bir gözaltı olayının ardından iç kamuoyuna verilmiş bir yanıt, kalıcı bir yetki değişikliğinden çok. İki okuma arasındaki farkı bakanın cümleleri değil, ortaya çıkacak prosedür metni belirleyecek.", "en": "Turning a tolerance into a conditional permission looks like a small change on paper; in practice it is decisive, because whoever writes the condition also decides when to tighten it. A plainer reading is available, though: this may be an answer to a domestic audience after a visible detention episode rather than a durable shift in authority. What separates the two readings is the procedural text that does or does not appear, not the minister's sentences.", "refs": ["malaysia-unhcr"]}]}, {"h": {"tr": "Ölçülebilir olan ne", "en": "What can actually be measured"}, "ps": [{"tr": "Bakılacak tek şey var: ortak taramanın belge verme aşamasında gerçekten bir kapı olup olmadığı. Ekim sonuna kadar iç işleri bakanlığı ortak tarama usulünü kamuya açık biçimde tanımlar ve bundan sonra verilen belgeler yerel makamın onayını taşırsa, yetki fiilen el değiştirmiş olur. Böyle bir usul tanımlanmazsa, bu çağrı bir pozisyonu ucuza kaydetmiş ama statüyü kimin belirlediğini değiştirmemiş olacak.", "en": "There is one thing to watch: whether joint screening becomes an actual gate at the point of issuance. If the home ministry publicly describes a joint screening procedure before the end of October and documents issued afterwards carry a local authority's approval, then the power will have changed hands in practice. If no such procedure is described, the call will have registered a position cheaply without altering who determines status.", "refs": ["malaysia-unhcr"]}]}], "sources": [{"key": "malaysia-unhcr", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/malaysian-foreign-minister-calls-for-review-of-unhcrs-presence", "title": {"tr": "Malezya Dışişleri Bakanı, BMMYK'nın ülkedeki varlığının gözden geçirilmesini istedi", "en": "Malaysia's foreign minister calls for a review of UNHCR's presence"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-02", "title": {"tr": "İki metin, tek boğaz", "en": "Two texts, one strait"}, "excerpt": {"tr": "Maskat ortak bir mekanizma önerdi, Tahran kendi şeridini istedi. Masada bugüne kadar üzerinde anlaşılan tek şey, teklif alışverişinin sürdüğü.", "en": "Muscat proposed a joint mechanism; Tehran asked for its own lane. So far the only thing agreed at the table is that proposals are still being exchanged."}, "sections": [{"h": {"tr": "Kefelerde iki farklı mekanizma", "en": "Two different mechanisms in the pans"}, "ps": [{"tr": "Umman'ın önerisi Malakka Boğazı düzenlemesini örnek alıyor: boğazı kullanan gemiler seyir güvenliği, çevre koruma ile arama ve kurtarma harcamalarını finanse eden bir \"gönüllü ücret\" ödüyor. Önerinin taşıdığı asıl hüküm ücret değil, ücretin gerektirdiği ortaklık; düzenleme İran'ın boğaz üzerinde tek başına denetim kurmasını engelliyor.", "en": "Oman's proposal is modelled on the Strait of Malacca arrangement: ships using the waterway pay a \"voluntary fee\" that funds navigation safety, environmental protection and search and rescue. The provision that matters is the partnership the fee requires rather than the fee itself; the arrangement would stop Iran from exercising sole control over the strait.", "refs": ["hormuz-proposals"]}, {"tr": "Tahran'ın karşı önerisi başka bir yerden başlıyor. Dışişleri Bakan Yardımcısı Kazım Garibabadi, eşit bölüşüm planının İran'ın güvenlik kaygılarını karşılamadığını söyledi ve İran'ın \"boğazın kendi tarafındaki gemi trafiğini yöneteceğini\", Umman'ın ise karşı şeridin tamamını değil bir bölümünü yöneteceğini belirtti. Garibabadi'ye göre Umman deniz trafiği için üç hat öneriyor: İran karasularından geçen bir hat, uluslararası bir hat ve Umman karasularından geçen bir hat.", "en": "Tehran's counter-proposal starts somewhere else. Iran's deputy foreign minister, Kazem Gharibabadi, said the equal-division plan did not meet Iran's security concerns, and that Iran would \"manage shipping through its side of the strait\" while Oman would manage part but not all of the opposite lane. As Gharibabadi described it, the Omanis are proposing three lines for maritime traffic: one through Iran's territorial waters, an international one, and one through Omani waters.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Mekanizmanın eksik ayağı", "en": "The missing leg of the mechanism"}, "ps": [{"tr": "Malakka örneğinin çalışmasını sağlayan şey hattın çizimi değil, ücreti toplayan ve harcayan bir gövdenin varlığıdır. Ortada dolaşan iki metinden hiçbiri böyle bir gövdeyi kamuya açık biçimde adlandırmıyor. Bu eksiklik iki türlü okunabilir: ya taraflar idari sorunu bilinçli olarak sonraya bıraktı ya da anlaşamadıkları asıl konu zaten burası. İkinci ihtimalin lehine bir işaret yok; sıralama tercihi de en az kilitlenme kadar olağan bir müzakere pratiği.", "en": "What makes the Malacca precedent work has less to do with where the lines are drawn than with the existence of a body that collects the fee and spends it. Neither of the two texts in circulation names such a body publicly. The gap admits two readings: either the parties deliberately deferred the administrative question, or that is precisely where they cannot agree. Nothing yet favours the second; sequencing is as ordinary a negotiating practice as deadlock.", "refs": ["hormuz-proposals"]}, {"tr": "Kefelere ne konduğuna bakmak gerekir. Umman'ın kazandığı, boğazın tek bir devletin tasarrufunda olmadığı bir düzen ve bu düzende kendisine düşen rol. İran'ın istediği, bir şerit üzerindeki denetiminin tanınması. Ancak Garibabadi aynı konuşmada Tahran'ın denetimi sürdürmek için çatışmaya dönmek de dahil \"her türlü eylemi\" değerlendireceğini söyledi. Masaya oturmuş bir taraf, masa dışındaki seçeneğini bu kadar açık tutuyorsa, teklifin fiyatı henüz belirlenmemiş demektir.", "en": "It is worth looking at what goes into each pan. What Oman gains is an order in which the strait is not at one state's disposal, and a role for itself within it. What Iran wants is recognition of its control over one lane. Yet in the same remarks Gharibabadi said Tehran would consider \"any action\" to maintain control, including resuming warfare. When a party that has taken its seat keeps its outside option that visible, the price of the offer has not yet been set.", "refs": ["hormuz-proposals"]}]}, {"h": {"tr": "Denge demek için erken", "en": "Too early to call it a balance"}, "ps": [{"tr": "Çatışmanın 28 Şubat'ta başlamasından önce boğazdan dünya enerji arzının beşte biri geçiyordu; kapanma küresel ticareti aksattı. Bu ölçekte bir aksama, teklif alışverişini kendiliğinden bir ilerleme saymayı cazip kılar. Oysa şimdiye kadar değişen şey temas kanalı; taraflardan hiçbirinin üstlendiği yeni bir taahhüt yok. Bir sonraki turda bakılacak somut şey açık: metinlerden biri ücreti toplayacak gövdeyi ve başlangıç tarihini adlandırıyor mu?", "en": "Before the conflict began on 28 February, one-fifth of the world's energy supplies passed through the strait, and its closure has disrupted global trade. A disruption that large makes it tempting to count an exchange of proposals as progress in itself. What has changed so far, though, is the channel of contact; neither side has taken on a new commitment. The concrete thing to look for in the next round is plain: does either text name the body that would collect the fee, and a date on which it starts?", "refs": ["hormuz-proposals"]}]}], "sources": [{"key": "hormuz-proposals", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/iran-and-oman-exchange-proposals-to-manage-strait-of-hormuz", "title": {"tr": "İran ve Umman, Hürmüz Boğazı'nın yönetimi için karşılıklı öneri sundu", "en": "Iran and Oman exchange proposals for managing the Strait of Hormuz"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-03", "title": {"tr": "Saat 17.45'te başlayan cevap dizisi", "en": "The reply that began at 17.45"}, "excerpt": {"tr": "Önlenen bir salvo ile aynı gün yapılan hava harekâtı arasında ölçülebilir tek büyüklük var: tempo.", "en": "Between an intercepted salvo and the same day's air operation, one quantity is measurable: tempo."}, "sections": [{"h": {"tr": "Önlenen salvo", "en": "The salvo that was stopped"}, "ps": [{"tr": "CENTCOM'un açıklamasına göre Devrim Muhafızları, ABD Doğu saatiyle 17.45'te Ortadoğu'daki ABD güçlerine yönelik sürpriz bir saldırı girişimi kapsamında birden fazla balistik füze fırlattı; füzelerin tamamı önlendi ve birlikler yüksek hazırlık düzeyinde kaldı. Fırlatma, Başkan Donald Trump'ın cuma günü diplomasiye alan açmak için verdiği arayı bozdu.", "en": "According to CENTCOM, Revolutionary Guard forces launched multiple ballistic missiles at 17.45 Eastern time in an attempted surprise attack on US forces based in the Middle East; all of them were intercepted and the troops stayed at a high state of readiness. The launch broke the pause President Donald Trump had ordered on Friday to make room for diplomacy.", "refs": ["centcom-intercept"]}, {"tr": "Tam önleme bir kabiliyet ölçüsüdür, ama neyin ölçüsü olduğuna dikkat etmek gerekir. Bu sonuç, o eksende savunma kapsamının salvonun boyuna yettiğini gösterir; fırlatıcı envanteri, yeniden yükleme süresi veya bir sonraki salvonun büyüklüğü hakkında bir şey söylemez. Komutanlık hedefin yerini de açıklamadı. Elde kalan doğrulanmış büyüklük tektir: bir kez denendi, tutmadı.", "en": "A complete interception measures a capability, but it is worth being careful about which one. The result shows that defensive coverage on that axis was sufficient for a salvo of that size; it says nothing about launcher inventory, reload time, or how large the next salvo could be. The command did not identify the location of the target either. One verified quantity remains: it was tried once, and it did not work.", "refs": ["centcom-intercept"]}]}, {"h": {"tr": "Aynı gün, ikinci hareket", "en": "Same day, second move"}, "ps": [{"tr": "Aynı gün ABD ve Suudi savaş uçakları Doğu Irak'ta çok sayıda hedefi vurdu. CENTCOM vurulan yerleri \"doğrudan Devrim Muhafızları yönlendirmesiyle işletilen terörist lojistik ve silah tesisleri\" olarak tanımladı ve harekâtın 72 saat içinde ABD güçleri ile Suudi enerji altyapısına yöneltilen 30'dan fazla insansız hava aracı saldırısına yanıt olduğunu bildirdi. Hedefler İran sınırındaki Diyala ve Vasıt vilayetlerinde yoğunlaştı; bu vilayetler toplanma alanı, lojistik koridoru ve fırlatma mevzii işlevi görüyor.", "en": "The same day, US and Saudi fighter aircraft struck multiple targets across eastern Iraq. CENTCOM described the sites as \"terrorist logistics and weapons sites operated under direct IRGC direction\" and said the operation answered more than 30 drone attacks against US forces and Saudi energy infrastructure over 72 hours. The targets were concentrated in Diyala and Wasit governorates along the Iranian border, which serve as staging areas, logistics corridors and launch positions.", "refs": ["iraq-strikes"]}, {"tr": "İki hareketi yan yana koyduğunuzda ortaya çıkan tercih şu: cevap, füze kuvvetine değil, fırlatma ağına yazıldı. Depoyu ve koridoru vurmak, salvoyu vurmaktan farklı bir maliyet dayatmasıdır; hedefi tekrar üretmenin süresini uzatmayı amaçlar. Daha sade bir açıklama da mümkün: Irak'taki harekât zaten süregelen insansız hava aracı kampanyasına karşı planlanmış olabilir ve aynı güne denk gelmesi sıralamadan çok tesadüf olabilir. Kamuya açık malzeme iki okumayı da ayırt etmeye yetmiyor.", "en": "Set the two moves side by side and the choice becomes visible: the reply was addressed to the launch network, not to the missile force. Hitting a depot and a corridor imposes a different cost from hitting a salvo; it aims to lengthen the time needed to reconstitute. A plainer explanation is also available: the Iraq operation may already have been planned against the running drone campaign, and falling on the same day may be coincidence rather than sequence. The public material does not separate the two readings.", "refs": ["centcom-intercept", "iraq-strikes"]}]}, {"h": {"tr": "Sınırın nerede olduğu sayılabilir", "en": "Where the limit sits can be counted"}, "ps": [{"tr": "CENTCOM, Devrim Muhafızları ile vekillerinin daha fazla askerî yanıttan kaçınmak için saldırıları durdurması gerektiği uyarısında bulundu. Bu uyarının tutup tutmadığı söylemle değil oranla anlaşılır. Ağustos sonuna kadar Irak toprağından yöneltilen insansız hava aracı saldırılarının hızı, bildirilen 72 saatte otuz düzeyinin belirgin biçimde altına inerse maliyet dayatması işlemiş olur. Aynı tempo sürerse, vurulan depolar yerine konmuş demektir ve uyarı yalnızca duyurulmuş bir sınır olarak kalır.", "en": "CENTCOM warned that the Revolutionary Guard and its proxies must stop the attacks to avoid further military response. Whether that warning holds is settled by a rate, not by rhetoric. If, by the end of August, the tempo of drone attacks launched from Iraqi territory falls clearly below the reported level of thirty in 72 hours, the cost imposition will have worked. If the same tempo continues, the depots that were struck have been replaced, and the warning remains a line that was announced rather than defended.", "refs": ["iraq-strikes"]}]}], "sources": [{"key": "centcom-intercept", "kind": "news", "name": "News4JAX", "url": "https://www.news4jax.com/news/world/2026/07/28/saudi-arabia-says-it-shot-down-more-drones-as-houthis-claim-to-have-turned-back-tanker/", "title": {"tr": "CENTCOM: İran'ın ABD güçlerine balistik füze saldırısı önlendi", "en": "CENTCOM says it intercepted an Iranian ballistic missile attack on US forces"}, "publishedDate": "2026-07-28"}, {"key": "iraq-strikes", "kind": "news", "name": "Kurdistan24", "url": "https://www.kurdistan24.net/en/story/928895/us-and-saudi-arabia-conduct-joint-strikes-on-iran-aligned-militia-targets-across-eastern-iraq", "title": {"tr": "ABD ve Suudi Arabistan, Doğu Irak'ta İran'a yakın milis hedeflerini ortak vurdu", "en": "US and Saudi Arabia strike Iran-aligned militia targets across eastern Iraq"}, "publishedDate": "2026-07-29"}], "date": "2026-07-29"}, {"writer": "geo-04", "title": {"tr": "Tarifenin sınırı beş alıcıda çiziliyor", "en": "The tariff stops at five buyers"}, "excerpt": {"tr": "Yetki geniş görünüyor, kapsamı ise sayılı. İlk beş alıcı ve ilk beş aracı: ambargonun duvar mı sapak mı olduğu tam burada belli olur.", "en": "The authority looks broad; its coverage is counted. Five buyers and five intermediaries — that is exactly where you learn whether this is a wall or a detour."}, "sections": [{"h": {"tr": "Yetkinin kapsamı bir sayıyla sınırlı", "en": "The authority is bounded by a number"}, "ps": [{"tr": "Senato Dış İlişkiler Komitesi'nin açıklamasına göre başkana tanınan tarife yetkisi, Rus ham petrolü veya doğal gazının en büyük beş ithalatçısı ile Rusya'nın yaptırımlardan kaçmasına yardım eden ilk beş ülkeyle sınırlı. Tasarı ayrıca Rus yetkililerine ve enerji sektörüne yaptırım öngörüyor ve İran'ın enerji ile silah sektörlerine dönük mevcut kısıtlamaları uzatıyor. Reuters, tarife hedefleri arasında Çin ve Hindistan'ı sayıyor.", "en": "According to the Senate Foreign Relations Committee, the tariff authority granted to the president is limited to the five largest importers of Russian crude oil or gas and the top five countries helping Russia evade sanctions. The bill also imposes sanctions on Russian officials and the energy sector and extends existing restrictions on Iran's energy and weapons sectors. Reuters names China and India among the tariff targets.", "refs": ["senate-sanctions"]}, {"tr": "Takvim de kapsamın parçası. Reuters usul oylamasını, oylama sürerken 75'e karşı 11 olarak aktardı; tasarının Temsilciler Meclisi'ne eylülden önce gelmesi beklenmiyor. Yani bugün ortada yürürlükte bir tarife değil, yürürlüğe girme ihtimali olan bir yetki var ve o yetkinin kullanılıp kullanılmayacağına başkan karar verecek.", "en": "The calendar is part of the coverage too. Reuters reported the procedural vote as 75-11 while voting was still open, and the House is not expected to take the bill up before September. What exists today is therefore not a tariff in force but an authority that may come into force, and whether it is used will be the president's decision.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Beşinci sıradan sonrası açık kalıyor", "en": "Everything past fifth place stays open"}, "ps": [{"tr": "Sayıyla sınırlanmış bir liste, listeye girmemeyi bir hedef hâline getirir. Rus ham petrolünü satın alan tarafların hacimlerini daha fazla alıcıya dağıtması ya da ilk beşin dışındaki aracılar üzerinden yönlendirmesi hâlinde aynı yük aynı yere ulaşır, yalnızca daha uzun ve daha pahalı bir yoldan gider. Bu okumaya karşı sağlam bir itiraz var: Rus ham petrolü alımı birkaç büyük alıcıda yoğunlaşmışsa beş sıra akışın çoğunu kapsayabilir ve dağıtmanın maliyeti tarifenin maliyetini aşabilir. Hangisinin geçerli olduğu, ancak ilan edilmiş bir liste ve sonrasındaki hacim serisiyle sınanabilir.", "en": "A list bounded by a number turns staying off the list into an objective. If buyers of Russian crude spread their volumes across more purchasers, or route them through intermediaries outside the top five, the same cargo reaches the same place — only by a longer and dearer road. There is a solid objection to that reading: if purchases of Russian crude are concentrated among a few large buyers, five slots may cover most of the flow and the cost of dispersing it may exceed the cost of the tariff. Which of the two applies can only be tested against a published list and the volume series that follows it.", "refs": ["senate-sanctions"]}, {"tr": "Yükün kime bindiği de tartışmanın konusu. Temsilci Gregory Meeks metni bir yaptırım tasarısından çok başkana açılan geniş bir tarife yetkisi olarak niteledi; Senatör Jeanne Shaheen ise tasarıyı Ukrayna'ya destek için eldeki en iyi imkân saydı. Aradaki fark teknik sayılmaz. Bir gümrük vergisi ithalatçı tarafta tahsil edilir; ilk muhatabı satıcı değil alıcıdır. Bu, ölçünün etkisiz olduğu anlamına gelmez. Gecikme, kalite kaybı ve artan finansman maliyeti de amaçlanmış sonuçlar olabilir.", "en": "Who carries the burden is also under argument. Representative Gregory Meeks characterised the text less as a sanctions bill than as a broad tariff authority opened up for the president; Senator Jeanne Shaheen treated it as the best available means of supporting Ukraine. The difference hardly counts as technical. A customs duty is collected on the importing side; its first counterpart is the buyer rather than the seller. That does not make the measure ineffective. Delay, quality loss and higher financing costs may themselves be intended effects.", "refs": ["senate-sanctions"]}]}, {"h": {"tr": "Ölçülecek olan hacim", "en": "Volume is what will be measured"}, "ps": [{"tr": "Bu tasarının bir duvar mı yoksa bir sapak mı olduğu, oylama sayısıyla değil iki gözlemle anlaşılacak: başkan yetkiyi kullanıp bir liste ilan ediyor mu ve ilandan sonra Rus ham petrolü alımları beş büyük alıcıda yoğunlaşmayı sürdürüyor mu, yoksa daha fazla tarafa mı dağılıyor? İkinci gözlem olmadan yetkinin genişliği hakkında söylenen her şey metin okumasıdır, akış okuması değil.", "en": "Whether this bill is a wall or a detour will be settled not by the vote count but by two observations: does the president use the authority and publish a list, and after any such publication do purchases of Russian crude stay concentrated among five large buyers, or spread across more of them? Without the second observation, everything said about the breadth of the authority is a reading of the text, not a reading of the flow.", "refs": ["senate-sanctions"]}]}], "sources": [{"key": "senate-sanctions", "kind": "news", "name": "The Globe and Mail", "url": "https://www.theglobeandmail.com/world/article-us-senate-russia-sanctions-bill-lindsey-graham/", "title": {"tr": "ABD Senatosu Rusya ve İran yaptırım tasarısını ilerletti", "en": "US Senate advances the Russia and Iran sanctions bill"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-05", "title": {"tr": "Kaçırılanlar neden suçlu sayılıyor?", "en": "Why are the trafficked treated as offenders?"}, "excerpt": {"tr": "IOM'un yeni bölgesel stratejisi tek bir ayrımı zorluyor: bilgisayar başındaki kişi failin kendisi mi, yoksa oraya borçla ve şiddetle oturtulmuş biri mi?", "en": "IOM's new regional strategy presses on a single distinction: is the person at the keyboard the offender, or someone put in that chair by debt and violence?"}, "sections": [{"h": {"tr": "Kaynak ülkeler listesi tesadüf değil", "en": "The list of source countries is no accident"}, "ps": [{"tr": "IOM Genel Direktörü Amy Pope, \"80'den fazla ülkeden gelen kişilerin dolandırıcılık merkezlerine kaçırıldığını görüyoruz\" dedi. Örgüt 2022 ile 2025 arasında zorla suça sürüklenen 3.500'den fazla insan ticareti mağduruna 39 ülkeden yardım etti; en çok mağdur Endonezya, Hindistan, Sri Lanka, Etiyopya, Kenya ve Bangladeş'ten geldi. Bu liste bir coğrafya değil, bir işgücü havzası tarif ediyor.", "en": "IOM Director General Amy Pope said, \"We're seeing victims from over 80 different countries being trafficked into the scam centres.\" Between 2022 and 2025 the organisation assisted more than 3,500 victims of trafficking for forced criminality from 39 countries, with the largest numbers from Indonesia, India, Sri Lanka, Ethiopia, Kenya and Bangladesh. That list describes not a geography but a labour catchment.", "refs": ["iom-scam-centres"]}, {"tr": "Seçim ölçütü de bunu doğruluyor. Aracılar sosyal medyadaki iş ilanlarıyla İngilizce bilen ve üniversite mezunu kişileri hedefliyor. Yani aranan, çaresiz bir kişi değil, yurt dışında nitelikli iş bulabileceğine inanacak kadar nitelikli bir kişi. Pope, çalışma izni yerine turist vizesiyle seyahat edilmesinin başvuru sahiplerinin araştırması gereken kritik bir uyarı işareti olduğunu belirtti.", "en": "The selection criteria confirm it. Recruiters use social media job advertisements to target English-speaking university graduates. What is sought, in other words, is someone qualified enough to believe a skilled job abroad is plausible, rather than someone visibly desperate. Pope said travelling on a tourist visa rather than a work permit was a critical warning sign that applicants should investigate.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "Statü, korumayı belirliyor", "en": "Status decides protection"}, "ps": [{"tr": "IOM'un vurgusu tek bir noktada toplanıyor: dolandırıcılığı yürütmeye zorlanan kişiler kovuşturulacak suçlular değil, korunması gereken insan ticareti mağdurlarıdır. Mağdurlar kapalı alanlarda tutuluyor, belgelerine el konuluyor ve şiddet ile borç esaretiyle çalıştırılıyor. Bu tabloda kişinin hangi sıfatla sınırdan geçtiği, sonrasında ona ne yapılabileceğini belirliyor.", "en": "IOM's emphasis converges on one point: people forced to run scams are trafficking victims who need protection, not criminals to be prosecuted. Victims are confined in compounds, stripped of their documents and made to work through violence and debt bondage. In that picture, the label a person carries when they cross a border determines what can be done with them afterwards.", "refs": ["iom-scam-centres"]}, {"tr": "Buradaki asıl değişken sınıflandırmadır. Bir kişi merkezden çıktığında mağdur olarak taranırsa ifade verebilir, tanıklığı soruşturmaya girer ve dönüş süreci bir koruma prosedürüne bağlanır; suçlu olarak işleme alınırsa aynı bilgi kaybolur. Yine de sınıflandırmanın kendiliğinden yerleşmesini beklemek fazla iyimser olur: mağdur statüsü, koruma ve barındırma maliyetini kişinin bulunduğu ülkeye yükler ve bu maliyeti taşıyacak idari kapasite her yerde aynı değildir.", "en": "The operative variable here is classification. If someone leaving a compound is screened as a victim, they can give evidence, that testimony enters an investigation, and their return runs through a protection procedure; if they are processed as an offender, the same information is lost. It would be too hopeful, though, to expect the classification to settle on its own: victim status places the cost of protection and shelter on the country where the person is found, and the administrative capacity to carry that cost is not the same everywhere.", "refs": ["iom-scam-centres"]}]}, {"h": {"tr": "2025 sayıları neyi gösterdi", "en": "What the 2025 figures showed"}, "ps": [{"tr": "Doğu ve Güneydoğu Asya ile Avustralya ve Yeni Zelanda'da 2025'te dolandırıcılık suçlarından kaynaklanan kayıplar 88,3 milyar dolar ile 114,1 milyar dolar arasında hesaplandı. Bu büyüklük, sektörü ayakta tutanın tek tek merkezler değil bir tedarik zinciri olduğunu düşündürüyor. IOM'un 2026-2030 bölgesel stratejisinin sınanacağı yer de burası: kaynak ülkeler ile mağdurun bulunduğu devletler, ortak tarama ve dönüş sayılarını birlikte yayımlıyor mu?", "en": "Losses from scam offences in East and Southeast Asia, Australia and New Zealand in 2025 were put at between $88.3 billion and $114.1 billion. A figure of that size suggests what sustains the industry is a supply chain rather than individual compounds. That is where IOM's 2026-2030 regional strategy will be tested: do source countries and the states where victims are found publish joint screening and return figures together?", "refs": ["iom-scam-centres"]}]}], "sources": [{"key": "iom-scam-centres", "kind": "news", "name": "UN News", "url": "https://news.un.org/en/story/2026/07/1168038", "title": {"tr": "IOM: Çevrim içi dolandırıcılık merkezlerine insan ticareti hızla büyüyor", "en": "IOM says trafficking into online scam centres is growing fast"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-06", "title": {"tr": "On yılda dokuzuncu başkan", "en": "The ninth president in ten years"}, "excerpt": {"tr": "Peru'nun tekrarlayan sorunu sandıkta belirmiyor. Başkanı görevden alabilen bir kongre ile onu koruyabilen bir bloğun aritmetiğinde beliriyor.", "en": "Peru's recurring problem does not appear at the ballot box. It appears in the arithmetic between a congress that can remove a president and a bloc that can shield one."}, "sections": [{"h": {"tr": "Sayının kendisi bir kurum tarifi", "en": "The number is itself a description of an institution"}, "ps": [{"tr": "Keiko Fujimori salı günü Lima'da Kongre önünde, cumhuriyet başkanlığı görevlerini sadakatle yerine getireceğine dair yemin etti. Haziran ayındaki ikinci turda solcu rakibi Roberto Sanchez'i 50.000'den az oyla geçmişti ve bu, üç yenilginin ardından girdiği dördüncü başkanlık yarışıydı. Aynı törenle birlikte on yılda Peru'nun dokuzuncu başkanı oldu.", "en": "Keiko Fujimori took the oath before Congress in Lima on Tuesday, swearing to carry out the duties of the presidency faithfully. She had beaten her left-wing rival Roberto Sanchez by fewer than 50,000 votes in June's runoff, in her fourth presidential bid after three defeats. With that ceremony she became Peru's ninth president in a decade.", "refs": ["peru-fujimori"]}, {"tr": "O dokuz rakamı bir seçmen kararsızlığını değil, bir kurumsal düzenlemeyi anlatır. Peru başkanlarının çoğu sandıkta yenilerek değil, kongre tarafından görevden alınarak gitti. Bu yüzden yeni başkanın kaderini belirleyecek sayı 50.000'lik oy farkı değil, meclisteki blokudur: Fuerza Popular Kongre'nin en büyük grubuna sahip ve sağdaki müttefikleriyle birlikte Senato sandalyelerinin yarısını elinde tutuyor.", "en": "That nine describes an institutional arrangement rather than an indecisive electorate. Most Peruvian presidents have left not by losing an election but by being removed by congress. The number that will decide this president's fate is therefore not the margin of fewer than 50,000 votes but her bloc in the legislature: Fuerza Popular holds the largest group in Congress and, with its right-wing allies, half the Senate seats.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Babasının dönemiyle uyuşmayan koşul", "en": "The condition that does not match her father's term"}, "ps": [{"tr": "Eleştirmenlerin uzandığı benzetme hazır: yönetiminin babası Alberto Fujimori'nin otoriter dönemine benzeyebileceği ve sivil özgürlüklerin aşınabileceği kaygısı. Benzetmenin tuttuğu yer var, tutmadığı yer de var. Peru'yu son on yılda dokuz başkana taşıyan mekanizma, güçlü bir başkanlıktan çok başkanı indirebilecek kadar güçlü bir kongredir. Bu, tam tersi yönde bir sorundur. Elindeki yarım Senato tam da bu ikinci soruna karşı işliyor: görevden alınmaya karşı koruyor, ama yasama gündemini rahatça ilerletmeye yetmiyor.", "en": "The analogy critics reach for is ready to hand: the fear that her government will resemble the authoritarian rule of her father, Alberto Fujimori, and erode civil liberties. The analogy holds in places and fails in others. The mechanism that carried Peru through nine presidents in ten years has less to do with a strong presidency than with a congress strong enough to bring one down — the opposite problem. Her half of the Senate works precisely against that second problem: it protects against removal, but it is not enough to advance a legislative agenda comfortably.", "refs": ["peru-fujimori"]}, {"tr": "Getirdiği program da ödünç alınmış bir şablon. Kampanyası El Salvador'un Cecot cezaevini örnek alan bir mega hapishane, kimliği gizli tutulan yargıçlar, göçmen sınır dışı işlemleri ve mahkûmların yiyecek karşılığında çalıştırılması üzerine kuruluydu. Şablonlar, onları taşıyan kurumlardan hızlı yolculuk eder; bir cezaevi modeli ithal edilebilir, o modeli ayakta tutan yargı ve infaz kapasitesi ithal edilemez. Bunun bir kampanya çerçevesi olarak kalması da mümkün: yarım Senato, bu adımların çoğunun gerektireceği yasal değişikliği tek başına çıkarmaya yetmiyor.", "en": "The programme she brings is a borrowed template too. Her campaign was built on a megaprison modelled on El Salvador's Cecot facility, judges whose identities are concealed, migrant deportations, and prisoners required to work for food. Templates travel faster than the institutions that carry them; a prison model can be imported, but the judicial and custodial capacity that holds it up cannot. It may also remain a campaign frame: half a Senate is not enough on its own to pass the legal changes most of those steps would require.", "refs": ["peru-fujimori"]}]}, {"h": {"tr": "Bu döngü nerede bükülebilir", "en": "Where this cycle can still be bent"}, "ps": [{"tr": "Döngünün bu turda kırılıp kırılmadığını iki gözlem gösterecek. Birincisi, ilk görevden alma girişimi geldiğinde yarım Senato bir arada duruyor mu; çünkü bu bloğun dağılması, önceki sekiz başkanın gidişini açıklayan mekanizmanın yeniden işlediği anlamına gelir. İkincisi, muhalefetin adalet aradığı 2022-2023 protestolarındaki ölümlere ilişkin dosyalar ilerliyor mu. Kurumların çekişmeyi soğurup soğuramadığı, sınırların nereden çizildiğinden çok bu iki soruda görünür.", "en": "Two observations will show whether the cycle breaks on this turn. The first is whether the half Senate holds together when the first removal attempt arrives; the dispersal of that bloc would mean the mechanism explaining the departure of the previous eight presidents is running again. The second is whether the cases over the deaths in the 2022-2023 protests, for which the opposition is seeking justice, move forward. Whether institutions can absorb contestation shows up in those two questions far more than in where any line is drawn.", "refs": ["peru-fujimori"]}]}], "sources": [{"key": "peru-fujimori", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/keiko-fujimori-sworn-in-as-peru-president-after-narrow-election-win", "title": {"tr": "Keiko Fujimori, kıl payı seçim zaferinin ardından Peru başkanlığına yemin etti", "en": "Keiko Fujimori sworn in as Peru's president after a narrow election win"}, "publishedDate": "2026-07-28"}], "date": "2026-07-29"}, {"writer": "geo-01", "title": {"tr": "Yaptırım listesi kısaldıkça tarama eşiği yükseliyor", "en": "As the sanctions list shortens, the screening bar rises"}, "excerpt": {"tr": "Hazine'nin ikinci çıkarma turu yaptırımları gevşetmiyor, aracın kendisini yeniden tanımlıyor. Görünen taraf 84 adın silinmesi; asıl değişiklik 22 girişe eklenen ayırt edici bilgide.", "en": "Treasury's second removal round does not loosen sanctions; it redefines the instrument. The 84 deletions are the visible part; the change that matters sits in the identifiers added to 22 entries."}, "sections": [{"h": {"tr": "Silinen ad ile taranabilir hedef arasındaki fark", "en": "The difference between a deleted name and a screenable target"}, "ps": [{"tr": "Hazine Bakanlığı 27 Temmuz'da modernizasyon girişiminin ikinci turunu duyurdu: OFAC'ın Özel Olarak Belirlenmiş Kişiler ve Engellenen Kişiler listesinden 84 kişi ve kuruluş çıkarıldı, 22 liste girişine ayırt edici bilgi eklendi, 18 mükerrer giriş kümesi giderildi. Üç işlemin de aynı duyuruda yer alması tesadüf değil.", "en": "On 27 July the Treasury Department announced the second round of its modernization initiative: 84 individuals and entities came off OFAC's Specially Designated Nationals and Blocked Persons List, 22 list entries gained identifying information, and 18 sets of duplicates were resolved. That the three operations share one announcement is not incidental.", "refs": ["ofac"]}, {"tr": "Listeden çıkarma genellikle siyasi bir taviz olarak okunur. Hazine'nin bildirdiği ölçütler başka bir mekanizmaya işaret ediyor: vefat etmiş kişiler, faaliyeti sona ermiş kuruluşlar ve 20 yıldan uzun süre önce belirlenmiş, tarama için yeterli bilgi taşımayan hedefler. Bir bankanın süzgecinde eşleşmeyen bir ad, yaptırım uygulanmasını sağlamaz; yalnızca yanlış eşleşme üretir. Yine de tersi de mümkün: duyuru tek tek dosyaları yayımlamadığı için, çıkarmaların bir bölümünün sessiz bir siyasi gevşeme olması ihtimali dışlanamaz.", "en": "A delisting is usually read as a political concession. The criteria Treasury states point to a different mechanism: deceased individuals, defunct entities, and targets designated more than 20 years ago that lack the information needed for screening. A name that will not match inside a bank's filter enforces nothing; it produces false hits. The opposite reading remains available, though: because the announcement publishes no individual case files, some of the removals could still be a quiet political relaxation.", "refs": ["ofac"]}]}, {"h": {"tr": "Uyum yükü nereye kayıyor?", "en": "Where does the compliance burden move?"}, "ps": [{"tr": "Eklenen alanlar bu okumanın sınamasıdır: doğum tarihi, kimlik numarası, uyruk, cinsiyet. Bunlar bir adı makinenin eşleştirebileceği bir hedefe çeviren alanlardır. 22 girişe eklenmeleri, bir finans kuruluşunun süzgecinin ulaşabileceği kesinliği yükseltir; eşleşmeyen girişlerin silinmesi ise yanlış alarmı düşürür. Hangi adın okunabilir kılınacağına karar veren makam, uygulamanın dikkatinin nereye yoğunlaşacağına da karar vermiş olur.", "en": "The added fields are the test of that reading: date of birth, identification number, nationality, gender. These are what turn a name into something a machine can match. Adding them to 22 entries raises the precision a financial institution's filter can reach; deleting unmatchable entries lowers the false-positive load. Whoever decides which name becomes legible has also decided where enforcement attention will concentrate.", "refs": ["ofac"]}, {"tr": "İkinci bir değişiklik gündemin kimin elinde olduğuna dokunuyor. Hazine, 29 Haziran 2026'da listeden çıkarma başvurularının yapılabildiği bir Yeniden Değerlendirme Portalı açtığını bildiriyor. Bu, sıranın bir bölümünü kurumun iç önceliklerinden başvuru yapanlara taşır. Gözlenebilir işaret şu: sonraki turların bileşimi idari temizlikten mi, yoksa başvuruya dayalı çıkarmalardan mı ağırlık alacak.", "en": "A second change touches who holds the agenda. Treasury says it opened a Reconsideration Portal on 29 June 2026 through which delisting petitions can be filed. That moves part of the queue away from the agency's internal priorities and toward whoever files. The observable signal: whether the composition of later rounds tilts from administrative housekeeping toward petition-driven removals.", "refs": ["ofac"]}]}, {"h": {"tr": "Hangi ölçüyle değerlendirilecek?", "en": "By what measure will it be judged?"}, "ps": [{"tr": "Duyuruda Bakan Scott Bessent'in tutumu, yönetimin yaptırım başarısını \"yalnızca Hazine'nin listeye eklediği isim sayısıyla değil, etki, sonuç ve fayda üzerinden\" ölçtüğü biçiminde aktarılıyor. Bir duyuruda ilan edilen ölçüt bir konum belirler, uygulamayı belgelemez. Bu ölçütün ciddiye alınıp alınmadığı, sonraki turların her girişin hangi gerekçeyle çıkarıldığını ayrı ayrı yayımlayıp yayımlamamasından anlaşılacak.", "en": "The release attributes to Secretary Scott Bessent the position that the administration measures sanctions success \"in terms of effect, impact, and benefit-not just based on the number of names Treasury places on a list.\" A yardstick declared in a press release establishes a position; it does not document implementation. Whether it is meant seriously will show in whether later rounds publish, entry by entry, the ground on which each name was removed.", "refs": ["ofac"]}]}], "sources": [{"key": "ofac", "kind": "news", "name": "U.S. Department of the Treasury", "url": "https://home.treasury.gov/news/press-releases/sb0578", "title": {"tr": "ABD Hazinesi yaptırım listesinden 84 kişi ve kuruluşu çıkardı", "en": "US Treasury removes 84 people and entities from its sanctions list"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-02", "title": {"tr": "Salonu terk etmek hangi yetkiyi geri alır?", "en": "What authority does walking out reclaim?"}, "excerpt": {"tr": "Bu köşenin önceki yazısında 144'e karşı 10'luk oyun meşruiyet verdiği, ama uygulamayı zorlayacak bir güç vermediği savunulmuştu. Pazartesi günkü çıkış, aynı hesabın öbür yarısını görünür kılıyor.", "en": "An earlier column here argued that the 144-10 vote conferred legitimacy but not the leverage to compel practice. Monday's walkout makes the other half of that sum visible."}, "sections": [{"h": {"tr": "Oyun ardından gelen çıkış", "en": "The walkout that followed the vote"}, "ps": [{"tr": "ABD heyeti pazartesi günü, Fransa'nın Rusya'nın Ukrayna'daki savaşına ilişkin konuşmasına başladığı sırada Güvenlik Konseyi salonunu terk etti. Anlaşmazlığın kaynağı Konsey'in gündemindeki savaş değil, Washington'ın BM insan hakları yüksek komiseri Volker Türk'ün görev süresinin uzatılmasına karşı oy vermesiydi.", "en": "The US delegation left the Security Council chamber on Monday as France's delegation began speaking about Russia's war in Ukraine. The dispute did not originate in the war on the Council's agenda but in Washington's vote against renewing the term of UN human rights chief Volker Turk.", "refs": ["unsc"]}, {"tr": "Bu köşenin önceki yazısında, Türk'ün 144'e karşı 10 oyla yeniden seçilmesinin kuruma meşruiyet kazandırdığı ama karşı oy veren devletlerin uygulamasını değiştirmediği ileri sürülmüştü. Pazartesi günkü çıkış o savın sınanabilir hale gelen tarafıdır: karşı oy veren devlet uyum göstermek yerine salondan çekildi. Karar aritmetiği tuttu; kararın muhatabı üzerindeki etkisi tutmadı.", "en": "An earlier column here argued that Turk's re-election by 144 votes to 10 gave the office legitimacy without changing the practice of the states that opposed it. Monday's walkout is the testable side of that argument: the opposing state's response was not compliance but withdrawal from the room. The coalition arithmetic held; its purchase on the state it was aimed at did not.", "refs": ["unsc", "history-turk"]}]}, {"h": {"tr": "İki delegasyonun farklı hesabı", "en": "Two delegations, two different sums"}, "ps": [{"tr": "Fransa'nın BM Daimî Temsilciliği ABD'nin artık bir \"insan hakları feneri\" olmadığını bildirdi ve oyla Kuzey Kore, Nikaragua, Mali ve Rusya ile aynı safta kaldığını söyledi. ABD Daimî Temsilcisi Mike Waltz ise Türk'ün \"ABD, Birleşik Krallık ve İsrail gibi özgür, egemen demokrasilere ders verdiğini\" savundu. Dönüşümlü temsilci Dan Negrea, Fransa \"küçümseyici ve saygısız söyleminden\" vazgeçene kadar çıkışların süreceğini duyurdu. Fransa'nın büyükelçisi Jerome Bonnafont çıkışa hiç değinmedi, BM'nin bağımsızlığını korumaktan söz etti.", "en": "France's UN Mission said the US was no longer a \"beacon of human rights\" and that the vote had left it standing with North Korea, Nicaragua, Mali and Russia. US Ambassador Mike Waltz replied that Turk \"has been lecturing free, sovereign democracies like the United States, the UK, and Israel.\" Alternate representative Dan Negrea announced the walkouts would continue until France renounced its \"condescending and disrespectful rhetoric.\" France's ambassador Jerome Bonnafont did not mention the walkout at all and spoke of preserving the UN's independence.", "refs": ["unsc"]}, {"tr": "Negrea'nın koyduğu koşul, çıkışı bir pazarlık aracına dönüştürüyor. Bu aracın bedeli düşük: Konsey, eksik bir heyetle de çalışmayı sürdürür, dolayısıyla masraf salonu terk edenin kendi gündem belirleme gücüne yazılır. Bu yüzden çıkışın hedefi Fransa'nın söylemi olmayabilir; muhatabı iç kamuoyu olan bir jest de aynı biçimi alır. İki yorumu ayıran şey, ABD'nin kendi metin taslağını savunması gereken bir oturumda aynı davranışı sürdürüp sürdürmeyeceğidir.", "en": "Negrea's condition turns the walkout into a bargaining instrument. It is a cheap one: the Council keeps working with a delegation missing, so the cost falls on the absentee's own agenda-setting. That is why France's rhetoric may not be the real target; a gesture aimed at a domestic audience takes exactly the same shape. What separates the two readings is whether the US repeats the behaviour in a session where it must defend a draft of its own.", "refs": ["unsc"]}]}, {"h": {"tr": "Ne gözlemlenebilir?", "en": "What can be observed"}, "ps": [{"tr": "Buradan bir denge çıkarmak için henüz erken. Ama sınanabilir bir eşik var: ABD, kendi sunduğu bir karar tasarısının görüşüldüğü bir oturumda da salonu terk ederse, çıkış bir müzakere aracı değil, kurumdan uzaklaşmanın alışkanlığa dönüşmüş biçimi olarak okunmalıdır. Tersine, taslak sahibi olduğu oturumlarda kalırsa, koşulun gerçekten Fransa'nın söylemine bağlandığı görülür.", "en": "It is too early to call this a balance. But there is a testable threshold: if the US also leaves a session in which a draft resolution it sponsored is under discussion, the walkout should be read not as a negotiating instrument but as distancing from the institution turned into habit. If, on the other hand, it stays in sessions where it owns the text, the condition really is tied to France's rhetoric.", "refs": ["unsc"]}]}], "sources": [{"key": "unsc", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/us-diplomats-walk-out-as-france-addresses-un-security-council", "title": {"tr": "Fransa söz alınca ABD diplomatları Güvenlik Konseyi salonundan çıktı", "en": "US diplomats walk out as France takes the floor at the Security Council"}, "publishedDate": "2026-07-27"}, {"key": "history-turk", "kind": "article", "name": "Eigen Radar", "url": "https://eigenradar.com/tr/geopolitics/geo-02/2026-07-25/", "title": {"tr": "144'e karşı 10 ve bir kurumun dayanıklılığı", "en": "144 against 10, and the durability of an institution"}, "publishedDate": "2026-07-25"}], "date": "2026-07-28"}, {"writer": "geo-03", "title": {"tr": "Bir uçağın satışını iki ayrı yetki belirliyor", "en": "Two separate authorities decide one aircraft's sale"}, "excerpt": {"tr": "\"Kimse bana ne satmamız gerektiğini söyleyemez\" bir niyet beyanıdır. Uygunluk kararını veren makam ise bir hafta önce Kongre'ye Ankara'nın hâlâ nitelikleri karşılamadığını bildirdi.", "en": "\"Nobody tells me what we should be selling\" is a statement of intent. The office that decides eligibility told Congress a week ago that Ankara still does not qualify."}, "sections": [{"h": {"tr": "Niyet ile uygunluk arasındaki mesafe", "en": "The distance between intent and eligibility"}, "ps": [{"tr": "Trump, uçakta gazetecilerin Netanyahu'nun itirazına ilişkin sorusuna \"Kimse bana ne satmamız gerektiğini söyleyemez\" diye yanıt verdi ve ekledi: \"Türkiye İsrail'in büyük hayranı değil, Bibi'nin de pek hayranı değil. Ama bana karşı harika davrandılar\". TRT Haber'in aktardığı sözlerinde Erdoğan'ı dostu olarak andı, Türkiye'yi de büyük bir müttefik diye tanımladı.", "en": "Asked aboard his plane about Netanyahu's objection, Trump answered, \"Nobody tells me what we should be selling.\" He added: \"Turkey's not a big fan of Israel, not a great fan of Bibi. But they've been great for me.\" In remarks carried by TRT Haber he called Erdogan a friend and Turkey a major ally.", "refs": ["f35"]}, {"tr": "Aynı haberde ikinci bir bilgi var ve satışın hangi aşamada olduğuna dair asıl veri odur: Dışişleri Bakanlığı bir hafta önce Kongre'ye Ankara'nın alım için hâlâ uygun olmadığını bildirdi. Bu, iki ayrı yetkinin aynı dosyada farklı yönde çalıştığını gösterir. Biri satışı istiyor, öbürü uygunluk ölçütünü tutuyor.", "en": "The same report carries a second fact, and it is the one that actually locates the sale: the State Department told Congress a week ago that Ankara still does not qualify for the purchase. Two separate authorities are working the same file in opposite directions. One wants the sale; the other holds the eligibility standard.", "refs": ["f35"]}]}, {"h": {"tr": "Kabiliyet ne zaman devreye girer?", "en": "When does the capability actually arrive?"}, "ps": [{"tr": "Bir beşinci nesil uçak, bölgesel hava resmini açıklandığı gün değiştirmez. Sıra bellidir: uygunluk, sözleşme, üretim sırası, teslimat, ardından mürettebat ve idame. Başkanın sözü bu dizinin ilk basamağının bile öncesindedir. Buna karşılık dizi bir veto değildir; uygunluk ölçütünü uygulayan makam yürütmenin içindedir ve yürütme kendi ölçütünü gözden geçirebilir. Bu yüzden bugünkü tablo bir engel değil, bir gecikme ölçüsüdür.", "en": "A fifth-generation aircraft does not change the regional air picture on the day it is announced. The sequence is fixed: eligibility, contract, production slot, delivery, then aircrew and sustainment. A president's remark sits before even the first of those steps. The sequence is not a veto, though: the office applying the eligibility standard sits inside the executive branch, and the executive can revise its own standard. What today's picture measures is delay, not obstruction.", "refs": ["f35"]}, {"tr": "Netanyahu'nun itirazı da uçak sayısıyla ilgili değil. Bir ülkenin o kabiliyet katmanında iş görebilmesi, komşularının hava planlamasında hangi varsayımı kuracağını belirler. Trump'ın yanıtı bu düzlemde verilmedi; ilişkinin kendisini öne çıkardı ve dengeyi hiç fiyatlamadı. İki taraf aynı dosyada iki ayrı ölçütle konuşuyor.", "en": "Netanyahu's objection is not about airframe counts either. Whether a state can operate at that capability tier sets the assumption its neighbours build into their own air planning. Trump's answer was not given on that plane; it foregrounded the relationship itself and priced the balance not at all. The two sides are arguing the same file with two different yardsticks.", "refs": ["f35"]}]}, {"h": {"tr": "Gözlenecek eşik", "en": "The threshold to watch"}, "ps": [{"tr": "Bu dosyada söz ile sonuç arasındaki farkı ölçen tek bir belge var. Dışişleri Bakanlığı Kongre'ye ilettiği değerlendirmeyi değiştirir ve Türkiye'ye F-35 satışına ilişkin resmî bir bildirim yapılırsa, niyet beyanı kabiliyet hattına geçmiş olur. Böyle bir bildirim olmadıkça, uçakta söylenen sözün hava resmi üzerinde ölçülebilir bir karşılığı yoktur.", "en": "Only one document measures the gap between the remark and the outcome in this file. If the State Department revises its assessment to Congress and a formal notification of a proposed F-35 sale to Türkiye follows, the statement of intent will have crossed into the capability line. Absent such a notification, what was said aboard the plane has no measurable effect on the air picture.", "refs": ["f35"]}]}], "sources": [{"key": "f35", "kind": "news", "name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog_entry/trump-on-netanyahu-opposing-f-35-sale-to-turkey-nobody-tells-me-what-we-should-be-selling/", "title": {"tr": "Trump, Türkiye'ye F-35 satışına yönelik Netanyahu itirazını reddetti", "en": "Trump brushes aside Netanyahu's objection to an F-35 sale to Türkiye"}, "publishedDate": "2026-07-27"}], "date": "2026-07-28"}, {"writer": "geo-04", "title": {"tr": "Bab-ül Mendep'ten pazar günü geçen on bir gemi", "en": "Eleven ships through Bab al-Mandeb on Sunday"}, "excerpt": {"tr": "Yemen'in dışişleri bakanı adayı, Husilerin Hürmüz modelini kopyalamak istediğini söylüyor. Geçiş sayıları, kopyalamaya gerek kalmadan rotanın çoktan boşaldığını gösteriyor.", "en": "Yemen's foreign minister-designate says the Houthis want to copy the Hormuz model. The transit counts show the route has already emptied without any copying."}, "sections": [{"h": {"tr": "Sayılar ne diyor?", "en": "What the numbers say"}, "ps": [{"tr": "Afrah el-Zouba pazartesi günü Riyad'daki Yemen büyükelçiliğinde konuştu: \"Husiler İran modelini kopyalamak istiyor ve bu iki ana boğazı kapatacak\". Grubun yetersiz uluslararası tepki nedeniyle cesaretlendiğini savundu. Bu bir taraf değerlendirmesi ve bağımsız doğrulaması yok.", "en": "Afrah al-Zouba spoke on Monday at Yemen's embassy in Riyadh: \"The Houthis want to copy the Iranian model, and this will shut down two main straits\". She argued the group had been emboldened by an insufficient international response. This is one party's assessment, and it carries no independent verification.", "refs": ["redsea"]}, {"tr": "Aynı haberdeki üç sayı daha somut. Küresel konteyner trafiğinin yaklaşık yüzde 30'u Kızıldeniz'den geçiyor, küresel ticaretin yüzde 12 ile yüzde 15'i bu rotaya bağlı ve pazar günü boğazdan yalnızca 11 emtia gemisi geçti. Üçüncü sayı ilk ikisinin yanında durunca ortaya çıkan tablo şu: rotanın taşıdığı yükün payı hâlâ büyük, fiilen taşıdığı gemi sayısı ise değil.", "en": "Three other figures in the same report are more concrete. Roughly 30 percent of global container traffic transits the Red Sea, 12 percent to 15 percent of overall global trade depends on the route, and on Sunday only 11 commodity vessels passed through the strait. Set the third figure beside the first two and the picture is this: the route's share of the cargo that matters is still large; the number of ships actually using it is not.", "refs": ["redsea"]}]}, {"h": {"tr": "Sapak nereye çıkıyor?", "en": "Where does the detour lead?"}, "ps": [{"tr": "Hürmüz benzetmesi, kaldıracın nasıl işl
