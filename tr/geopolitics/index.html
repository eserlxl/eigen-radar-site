<style>
  :root{
    --bg:#0b0f1a;
    --bg-soft:#111827;
    --card:#151c2c;
    --card-hover:#1a2338;
    --line:#232e47;
    --text:#e8ecf5;
    --muted:#8b96ad;
    --accent:#4fd1c5;
    --accent-soft:rgba(79,209,197,.12);
    --amber:#f6ad55;
    --scheme:dark;
    --focus:#fff;
    --on-accent:#071019;
    --mast-bg:rgba(11,15,26,.85);
    --amber-line:rgba(246,173,85,.4);
    --warning-soft:rgba(246,173,85,.08);
    --card-gradient-end:#131a2b;
    --accent-2:#7f9cf5;
    --media-bg:#0d1320;
    --hover-line:#31405f;
    --date-text:#aab4c8;
    --detail-text:#c3cbdc;
    --overlay:rgba(5,8,15,.6);
    --drawer-shadow:rgba(0,0,0,.35);
    --body-copy:#d4dae6;
    --accent-line:rgba(79,209,197,.45);
    --radius:14px;
    --page-max:70rem;
  }
  :root[data-theme="light"]{
    --bg:#d1d9e5;
    --bg-soft:#cfdae9;
    --card:#d8dfe9;
    --card-hover:#d6dde8;
    --line:#a9b5c5;
    --text:#111827;
    --muted:#46566d;
    --accent:#066b66;
    --accent-soft:rgba(6,107,102,.12);
    --amber:#934800;
    --scheme:light;
    --focus:#0f172a;
    --on-accent:#fff;
    --mast-bg:rgba(209,217,229,.92);
    --amber-line:rgba(147,72,0,.35);
    --warning-soft:rgba(147,72,0,.07);
    --card-gradient-end:#d6dde8;
    --accent-2:#536fd3;
    --media-bg:#cfdae9;
    --hover-line:#8796aa;
    --date-text:#4e5d72;
    --detail-text:#2d3b50;
    --overlay:rgba(15,23,42,.46);
    --drawer-shadow:rgba(15,23,42,.22);
    --body-copy:#27364a;
    --accent-line:rgba(6,107,102,.42);
    --control-tint:#d2deeb;
    --range-track:#b1c1d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:var(--scheme);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .skip-link{
    position:fixed;left:12px;top:-80px;z-index:200;padding:10px 14px;
    border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;
  }
  .skip-link:focus{top:12px}
  .visually-hidden{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--mast-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--page-max);margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;
    display:block;object-fit:contain;flex:0 0 auto;
  }
  .proto-badge{
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;
  }
  .header-right{display:flex;align-items:center;gap:14px}
  .archive-link{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);
    font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap;transition:.15s;
  }
  .archive-link svg{width:18px;height:18px;flex:0 0 auto}
  .archive-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .header-meta{font-size:.8rem;color:var(--muted)}
  .header-meta strong{color:var(--text);font-weight:600}
  .lang-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;
    color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;
    padding:4px 7px;border-radius:99px;opacity:.7;transition:.15s;font-family:inherit;
  }
  .lang-btn:hover{opacity:.8}
  .lang-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .utility-switches{display:flex;align-items:center;gap:6px}
  .theme-switch{
    appearance:none;position:relative;display:block;width:44px;height:24px;
    padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .theme-switch-thumb{
    position:absolute;display:grid;place-items:center;inset:2px auto 2px 2px;width:18px;
    border:1.5px solid var(--accent);border-radius:99px;
    background:var(--accent-soft);box-shadow:0 1px 4px var(--drawer-shadow);
    transition:transform .18s ease;
  }
  :root[data-theme="light"] .theme-switch-thumb{
    transform:translateX(20px);
  }
  .theme-switch-icon{
    grid-area:1/1;display:grid;place-items:center;pointer-events:none;
    opacity:0;transform:scale(.72);transition:opacity .12s ease,transform .18s ease;
  }
  .theme-switch-icon svg{display:block;width:11px;height:11px}
  .theme-switch-icon.moon{color:var(--text);opacity:1;transform:scale(1)}
  .theme-switch-icon.sun{color:var(--text)}
  :root[data-theme="light"] .theme-switch-icon.moon{opacity:0;transform:scale(.72)}
  :root[data-theme="light"] .theme-switch-icon.sun{opacity:1;transform:scale(1)}

  /* ---------- topic switch (one desk at a time, mirrors the language toggle) ---------- */
  /* Auto margins on both sides centre the switch between the logo badge and the
     updated stamp; header-right deliberately has no margin-left:auto. */
  .topic-switch{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 auto}
  .topic-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--muted);
    padding:8px 12px;border-radius:99px;opacity:.72;transition:.15s;font-family:inherit;
  }
  .topic-btn svg{width:20px;height:20px;display:block;flex:0 0 auto}
  .topic-label{font-size:.76rem;font-weight:700;white-space:nowrap}
  .topic-btn:hover{opacity:.8}
  .topic-btn.active{opacity:1;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  /* Regulatory notice — must read as a warning, not as decoration. */
  .disclaimer{
    max-width:var(--page-max);margin:0 auto 18px;padding:12px 16px;
    background:var(--warning-soft);border:1px solid var(--amber-line);
    border-left-width:3px;border-radius:8px;
    font-size:.8rem;line-height:1.6;color:var(--muted);
  }
  .disclaimer strong{display:block;color:var(--amber);font-weight:700;margin-bottom:3px;
    font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  .reader .disclaimer{margin:28px 0 0}
  .empty-note{color:var(--muted);text-align:center;padding:36px 12px;font-size:.95rem;grid-column:1/-1}
  .podcast-bar{
    padding:3px 5px;display:flex;align-items:center;gap:5px;min-width:0;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    color-scheme:var(--scheme);
  }
  .podcast-bar[hidden]{display:none}  /* display:flex would otherwise defeat `hidden` */
  #briefsSection .section-title{align-items:center}
  #briefsSection .section-title .podcast-bar{margin-left:auto}
  #briefsSection .section-title .podcast-bar:not([hidden])+.date-select{margin-left:0}
  .podcast-icon{
    display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;
    font-size:.85rem;line-height:1;
  }
  /* Keep the native control compact and match it to the selected site palette. */
  .podcast-bar audio{
    display:block;width:clamp(144px,40vw,190px);min-width:0;height:26px;
    color-scheme:var(--scheme);background:var(--bg-soft);border-radius:999px;
  }
  .podcast-bar audio::-webkit-media-controls-enclosure{
    background-color:var(--bg-soft);border-radius:999px;
  }
  :root[data-theme="light"] .podcast-bar{
    background:transparent;
    border-color:var(--line);
    color-scheme:light;
  }
  :root[data-theme="light"] .podcast-bar audio,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-enclosure,
  :root[data-theme="light"] .podcast-bar audio::-webkit-media-controls-panel{
    background:var(--bg) !important;
    background-color:var(--bg) !important;
    background-image:none !important;
    box-shadow:none !important;
    color-scheme:light !important;
  }
  /* Shared compact surface: all mobile themes and light desktop. */
  .podcast-desktop-controls{
    display:none;align-items:center;gap:5px;width:190px;height:26px;min-width:0;
  }
  .podcast-control-button{
    display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--text);
    font:700 .78rem/1 inherit;cursor:pointer;
  }
  .podcast-control-button:hover{background:var(--accent-soft);color:var(--accent)}
  .podcast-time{
    flex:0 0 34px;color:var(--text);font-size:.72rem;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .podcast-seek{
    appearance:none;flex:1 1 auto;width:70px;min-width:48px;height:16px;
    margin:0;background:transparent;cursor:pointer;
  }
  .podcast-seek::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-webkit-slider-thumb{
    appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:50%;
    background:var(--accent);
  }
  .podcast-seek::-moz-range-track{
    height:3px;border:0;border-radius:99px;background:var(--range-track,var(--line));
  }
  .podcast-seek::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
  }
  .podcast-seek:disabled{cursor:default;opacity:.55}
  @media(min-width:641px){
    :root[data-theme="light"] .podcast-bar audio{display:none}
    :root[data-theme="light"] .podcast-bar .podcast-desktop-controls{display:flex}
  }
  .listen-btn{margin:6px 0 2px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
    min-height:44px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;cursor:pointer}
  .listen-btn.speaking{background:var(--accent);color:var(--card)}
  .listen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .editions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .editions-label{font-size:.82rem;color:var(--muted)}
  .edition-btn{padding:3px 12px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.82rem;min-width:44px;min-height:44px}
  .edition-btn[aria-current="true"]{background:var(--accent);color:var(--card);cursor:default}
  .listen-rate{width:110px;background:transparent;accent-color:var(--accent)}
  .listen-rate-val{font-size:.75rem;color:var(--muted);min-width:2.2em}

  /* ---------- filters ---------- */
  .filters{max-width:var(--page-max);margin:22px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .news-section>.filters{max-width:none;margin:0 0 16px;padding:0}
  .chip{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:8px 14px;min-height:44px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* ---------- sections ---------- */
  section{max-width:var(--page-max);margin:0 auto;padding:26px 20px}
  .section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:1.15rem;letter-spacing:-.01em}
  .section-title .hint{font-size:.78rem;color:var(--muted)}

  /* ---------- featured ---------- */
  .featured-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:16px}
  .fcard{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-gradient-end) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .fcard::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard h3{font-size:1.05rem;line-height:1.4;letter-spacing:-.01em;margin:10px 0 8px}
  .fcard .summary{color:var(--muted);font-size:.88rem}
  .featured-grid .fcard:first-child{grid-row:span 2;align-self:start;padding:clamp(24px,4vw,36px)}
  .featured-grid .fcard:first-child h3{font-size:clamp(1.3rem,2.8vw,1.8rem);line-height:1.25}
  .fcard.brief-card{padding:0}
  .featured-grid .fcard.brief-card:first-child{padding:0}
  .brief-media{margin:0;background:var(--media-bg)}
  .brief-media picture{display:block;aspect-ratio:16/9;overflow:hidden}
  @media(min-width:641px){.featured-grid .brief-card:not(:first-child) .brief-media picture{aspect-ratio:5/2}}
  .brief-media img{display:block;width:100%;height:100%;object-fit:cover}
  .brief-media-link{display:block}
  .brief-media-link:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .brief-content{position:relative;padding:18px 22px 22px}
  .featured-grid .brief-card:first-child .brief-content{padding:clamp(22px,3vw,32px)}
  .featured-grid .brief-card:not(:first-child) .summary{display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .brief-detail-link{color:inherit;text-decoration:none}
  .brief-detail-link::after{content:"";position:absolute;inset:0}
  .brief-detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px;border-radius:var(--radius)}

  /* ---------- news cards ---------- */
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:.15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--hover-line)}
  .card h3{font-size:.98rem;line-height:1.45;letter-spacing:-.01em;margin:8px 0 6px}
  .card .summary{color:var(--muted);font-size:.86rem}
  .news-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .news-pager[hidden]{display:none}
  .news-pager button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:700 1.1rem/1 inherit;cursor:pointer;
  }
  .news-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .news-pager button:disabled{opacity:.35;cursor:not-allowed}
  .news-page-status{min-width:72px;text-align:center;color:var(--muted);font-size:.8rem}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{
    font-size:.76rem;font-weight:700;letter-spacing:.035em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;
  }
  .tag{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .date{font-size:.78rem;color:var(--date-text);margin-left:auto}

  /* detail (2nd level) */
  /* visibility (not just max-height) keeps the collapsed source link out of the tab order */
  .detail{max-height:0;overflow:hidden;visibility:hidden;
          transition:max-height .3s ease,visibility 0s .3s}
  .card.open .detail,.fcard.open .detail{max-height:400px;visibility:visible;
          transition:max-height .3s ease,visibility 0s}
  .detail-inner{
    border-top:1px dashed var(--line);margin:12px 0 0;padding-top:12px;
    font-size:.87rem;color:var(--detail-text);
  }
  .detail-source-link{display:block;color:inherit;text-decoration:none}
  .detail-source-link:hover{text-decoration:underline}
  .detail-toggle{
    margin-top:8px;background:none;border:0;min-height:44px;padding:8px 0;color:var(--accent);
    font:600 .8rem/1.4 inherit;cursor:pointer;
  }
  .detail-toggle:hover{text-decoration:underline}
  .source-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:.78rem;text-decoration:none}
  .source-link:hover .src{text-decoration:underline}

  /* ---------- writers ---------- */
  .writers-strip{display:flex;gap:12px;flex-wrap:wrap}
  #writersIntroSection{padding-top:18px;padding-bottom:8px}
  #briefsSection{padding-top:10px}
  .writers-intro-shell{
    position:relative;display:block;
  }
  .writers-intro-grid{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;
    min-width:0;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-padding-inline:1px;overscroll-behavior-inline:contain;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;padding:2px;cursor:grab;
  }
  .writers-intro-grid.is-dragging{scroll-snap-type:none;cursor:grabbing}
  .writers-intro-grid>.writer-intro-card{cursor:grab}
  .writers-intro-grid.is-dragging>.writer-intro-card{cursor:grabbing}
  .writers-intro-grid:focus-visible{outline-offset:2px}
  .writer-carousel-arrow{
    position:absolute;z-index:3;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:44px;height:44px;padding:0;
    border:0;border-radius:99px;background:transparent;color:var(--accent);
    font-size:1.2rem;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s,color .15s;
    text-shadow:0 0 7px var(--card),0 0 3px var(--card);
  }
  #writersIntroPrev{left:-18px}
  #writersIntroNext{right:-18px}
  .writer-carousel-arrow>span{display:block}
  #writersIntroPrev>span{transform:translateX(-6px)}
  #writersIntroNext>span{transform:translateX(6px)}
  .writer-carousel-arrow:hover:not(:disabled){color:var(--text)}
  .writer-carousel-arrow:disabled{opacity:0;pointer-events:none;cursor:default}
  .writer-intro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;
    min-width:0;padding:9px 11px;
    scroll-snap-align:start;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);text-align:left;text-decoration:none;
  }
  .writer-intro-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .writer-intro-card:focus-visible{border-color:var(--accent)}
  .writer-intro-identity{
    display:grid;justify-items:center;align-content:center;gap:3px;min-width:0;
  }
  .writer-intro-card .avatar{width:32px;height:32px}
  .writer-intro-card .wname{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:center;font-size:.68rem;line-height:1.15}
  .writer-intro-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    min-width:0;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:400;
    line-height:1.3;letter-spacing:-.01em}
  .writers-intro-fallback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .writers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
  .wcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    display:block;padding:22px;cursor:pointer;transition:.15s;font-family:inherit;
    color:var(--text);text-align:left;text-decoration:none;
  }
  .wcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .wtitle{font-size:1rem;line-height:1.4;margin-bottom:6px;letter-spacing:-.01em}
  .wexcerpt{font-size:.85rem;color:var(--muted)}
  .read-more{font-size:.8rem;font-weight:600;color:var(--accent);margin-top:12px;display:inline-block}
  .date-select{
    margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;min-height:44px;font-family:inherit;font-size:.8rem;cursor:pointer;
  }
  .date-select:hover{border-color:var(--accent)}
  .wchip{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 20px 7px 8px;cursor:pointer;transition:.15s;
    font-family:inherit;color:var(--text);
  }
  .wchip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .wchip .avatar{width:40px;height:40px}
  .wchip .wname{font-size:.86rem;line-height:1.3}
  .wchip .wpiece{font-size:.78rem;color:var(--muted);line-height:1.3;max-width:280px}
  .wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
    position:relative;background:var(--accent-soft);
  }
  .avatar::before{
    content:'λ';position:absolute;inset:0;display:grid;place-items:center;
    color:var(--accent);font-weight:800;font-size:.9rem;
  }
  .avatar svg,.avatar img{
    width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;
  }
  .wname{font-weight:700}
  .wrole{font-size:.75rem;color:var(--muted)}
  .ai-badge{
    font-size:.6rem;font-weight:800;letter-spacing:.08em;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  @media(max-width:959px){
    .writers-intro-grid{grid-auto-columns:calc((100% - 12px)/2)}
    .writers-intro-fallback{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:599px){
    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:100%;scrollbar-width:none;
    }
    .writers-intro-grid::-webkit-scrollbar{display:none}
    .writer-intro-card{grid-template-columns:max-content minmax(0,1fr)}
    .writer-intro-card .wname{
      width:auto;overflow:visible;text-overflow:clip;
    }
    .writer-intro-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;white-space:normal;text-overflow:clip;
    }
    .writers-intro-fallback{grid-template-columns:minmax(0,1fr)}
  }

  /* ---------- writers drawer trigger ---------- */
  .chip.chip-writers{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  }
  .chip.chip-writers:hover{filter:brightness(1.1)}
  @media(max-width:560px){.chip.chip-writers{margin-left:0}}

  /* ---------- writers drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:.25s;z-index:110;
  }
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;left:0;height:100%;width:370px;max-width:88vw;
    background:var(--bg-soft);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:120;display:flex;flex-direction:column;box-shadow:8px 0 40px var(--drawer-shadow);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:20px 20px 14px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.05rem;letter-spacing:-.01em}
  .drawer-head .hint{font-size:.74rem;color:var(--muted);flex-basis:100%}
  .drawer-close{
    margin-left:auto;background:var(--card);border:1px solid var(--line);
    color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;
    font-size:.95rem;font-family:inherit;
  }
  .drawer-close:hover{color:var(--text)}
  .drawer-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .drawer-list .wchip{width:100%;padding:9px 14px 9px 9px}
  .drawer-list .wchip:hover{transform:none;background:var(--card);border-color:var(--accent)}
  .drawer-list .wpiece{max-width:none}

  /* ---------- reading pane ---------- */
  /* Articles open in the page, not a modal: full width, no scroll box, shareable via #hash. */
  .reader{display:none;max-width:var(--page-max);margin:0 auto;padding:28px 20px 64px}
  body.reading #deskDisclaimer,
  body.reading #mainContent > section{display:none}
  body.reading .reader{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px 34px;align-items:start}
  .reader-back{grid-column:1/-1;justify-self:start}
  /* Sidebar: the other columnists on this desk/day, so you can hop between pieces
     without going back to the edition. */
  .reader-nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px}
  .reader-nav .nav-head{
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .reader-nav button{
    background:none;border:0;border-left:2px solid transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;text-align:left;cursor:pointer;
    min-height:44px;padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.35;
  }
  .reader-nav .nm{display:block;color:var(--text);font-weight:600}
  /* The subject line is the hook; two lines is enough to sell the piece. */
  .reader-nav .tl{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:.76rem;line-height:1.3;margin-top:2px;
  }
  .reader-nav button:hover{color:var(--text);background:var(--card)}
  .reader-nav button[aria-current="true"]{color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .reader-history{display:grid;gap:6px;min-width:0;margin-top:12px}
  .reader-history .nav-head{margin:0}
  .reader-history-select{
    width:100%;min-height:44px;padding:7px 32px 7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;
  }
  .reader-history-select:hover{border-color:var(--accent)}
  .reader-history-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:820px){
    body.reading .reader{grid-template-columns:1fr;gap:18px}
    .reader-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
    .reader-nav .nav-head{display:none}
    .reader-nav button{border-left:0;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
    .reader-nav .tl{display:none}  /* chips stay chips on mobile */
    .reader-nav button[aria-current="true"]{border-color:var(--accent)}
    .reader-history{flex:1 0 100%;margin-top:6px}
    .reader-history .nav-head{display:block}
  }
  .reader-back{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    min-height:44px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;
  }
  /* Share sits on the same grid row as Back, pushed to the far edge. */
  .reader-share{justify-self:end}
  body.reading .reader .reader-back,
  body.reading .reader .reader-share{grid-row:1}
  .reader-back:hover{color:var(--text);border-color:var(--accent)}
  #readerContent{min-width:0}
  .reader h1{max-width:none;font-size:clamp(1.65rem,5vw,2.35rem);letter-spacing:-.03em;line-height:1.2;margin:16px 0 10px}
  .reader .wrole{margin-bottom:18px}
  .reader .body{font-size:1rem;line-height:1.75;color:var(--body-copy);max-width:none}
  .reader .body p{margin-bottom:17px}
  .reader .body h2{margin:30px 0 10px;font-size:1.15rem;font-weight:750;letter-spacing:-.01em;color:var(--text)}
  .citation{margin-inline-start:4px;font-size:.72em;line-height:0;white-space:nowrap;vertical-align:super}
  .citation a{padding:2px;color:var(--accent);font-weight:800;text-decoration:none}
  .citation a[id]{scroll-margin-top:88px}
  .references{border-top:1px solid var(--line);margin-top:38px;padding-top:24px;scroll-margin-top:88px}
  .reader .body .references h2{margin-top:0}
  .reference-list{margin:12px 0 0;padding-left:24px}
  .reference-list li{padding-left:4px;scroll-margin-top:88px}
  .reference-list li+li{margin-top:12px}
  .reference-list>li>a{display:block;color:var(--accent);text-decoration:none}
  .reference-kind{
    display:inline-block;margin-bottom:3px;padding:1px 6px;border:1px solid var(--line);
    border-radius:99px;color:var(--muted);font-size:.67rem;font-weight:750;letter-spacing:.02em
  }
  .reference-kind.internal{border-color:var(--accent-line);color:var(--accent)}
  .reference-heading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .reference-list strong{display:block;color:var(--text)}
  .reference-list time,.reference-date-unavailable{color:var(--muted);font-size:.8rem}
  .reference-list cite{display:block;color:var(--muted);font-size:.86rem;font-style:normal}
  .reference-list a.external cite::after{content:" ↗"}
  .reference-backlinks{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .reference-backlinks a{
    display:inline-flex;min-width:32px;min-height:32px;align-items:center;justify-content:center;
    padding:1px 4px;border:1px solid var(--line);border-radius:5px;color:var(--muted);
    font-size:.68rem;text-decoration:none
  }
  .reference-backlinks a:hover{border-color:var(--accent);color:var(--accent)}
  .retrospective-marker{margin-inline-start:.25rem;color:var(--accent);font-weight:800}
  .references-note{color:var(--muted);font-size:.78rem;line-height:1.5}
  :root[data-theme="light"] .writer-intro-card,
  :root[data-theme="light"] .wcard{
    background:var(--card);
  }
  :root[data-theme="light"] #readerContent{
    background:var(--card);border-radius:2px;
    box-shadow:0 0 0 14px var(--card),0 0 0 15px var(--line);
  }
  :root[data-theme="light"] .news-pager button,
  :root[data-theme="light"] .reader-back,
  :root[data-theme="light"] .reader-history-select,
  :root[data-theme="light"] .reader-history-fallback summary{
    background:var(--control-tint);
  }
  :root[data-theme="light"] select,
  :root[data-theme="light"] select option{
    background-color:var(--control-tint) !important;
  }
  :root[data-theme="light"] .listen-rate::-webkit-slider-runnable-track,
  :root[data-theme="light"] .brief-listen-rate::-webkit-slider-runnable-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  :root[data-theme="light"] .listen-rate::-moz-range-track,
  :root[data-theme="light"] .brief-listen-rate::-moz-range-track{
    background-color:var(--range-track);
    border-radius:999px;
  }
  .reader .body .sep{
    text-align:center;color:var(--muted);letter-spacing:.6em;
    margin:24px 0;font-size:.8rem;user-select:none;
  }
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:40px}
  .footer-inner{max-width:var(--page-max);margin:0 auto;padding:30px 20px;font-size:.8rem;color:var(--muted)}
  .footer-inner p{margin-bottom:8px}

  .hidden{display:none!important}
  .chip-search{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    width:150px;font:inherit;opacity:1;cursor:text;
  }
  .chip-search::placeholder{color:var(--muted)}
  h1,h2,h3,p,a{overflow-wrap:anywhere}
  /* Wide CSS viewports need a larger reading scale, not merely wider empty margins.
     Percent-based root sizing still respects the reader's browser font preference. */
  @media(min-width:1440px){
    html{font-size:106.25%}
    :root{--page-max:76rem}
  }
  @media(min-width:1920px){
    html{font-size:112.5%}
    :root{--page-max:84rem}
  }
  @media(min-width:2560px){
    html{font-size:125%}
    :root{--page-max:90rem}
  }
  @media(max-width:900px){
    .header-meta{display:none}
  }
  @media(max-width:640px){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:10px 12px;gap:8px}
    .logo{font-size:1.05rem}.logo-mark{width:32px;height:32px}.proto-badge{display:none}
    .header-right{margin-left:auto;gap:7px}
    .topic-switch{
      order:3;width:100%;margin:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:2px;padding:2px;border-radius:99px;
    }
    .topic-btn{
      min-width:0;min-height:40px;justify-content:center;
      gap:clamp(2px,.75vw,3px);padding:6px 2px;
    }
    .topic-btn svg{
      width:clamp(12px,3.6vw,15px);height:clamp(12px,3.6vw,15px);
    }
    .topic-label{
      font-size:clamp(.6rem,2.65vw,.68rem);line-height:1;letter-spacing:-.015em;
    }
    section{padding-left:16px;padding-right:16px}
    .featured-grid{grid-template-columns:1fr}.featured-grid .fcard:first-child{grid-row:auto}
    #briefsSection .section-title{
      display:grid;grid-template-columns:max-content minmax(112px,1fr) 127px;
      align-items:center;justify-content:stretch;column-gap:3px;row-gap:0;
    }
    #briefsSection .section-title h2{grid-column:1;grid-row:1}
    #briefsSection .section-title .podcast-bar{
      grid-column:2;grid-row:1;width:100%;max-width:142px;
      justify-self:end;gap:2px;margin:0;padding-inline:8px;
    }
    #briefsSection .section-title .podcast-icon{
      flex-basis:12px;width:12px;height:12px;font-size:.68rem;
    }
    #briefsSection .section-title .podcast-bar audio{display:none}
    #briefsSection .section-title .podcast-desktop-controls{
      display:flex;flex:1 1 auto;width:auto;min-width:0;gap:0;
    }
    #briefsSection .section-title .podcast-control-button{
      flex-basis:20px;width:20px;order:1;
    }
    #briefsSection .section-title .podcast-seek{
      order:2;flex:1 1 auto;width:auto;min-width:28px;max-width:58px;margin-inline:6px;
    }
    #briefsSection .section-title .podcast-time{
      order:3;flex-basis:20px;font-size:.58rem;
    }
    #briefsSection .section-title .podcast-bar [data-podcast-volume]{
      display:none;
    }
    #briefsSection .section-title .date-select{
      grid-column:3;grid-row:1;justify-self:end;width:127px;min-width:0;
      min-height:40px;margin-left:0;padding:5px 24px 5px 8px;font-size:.72rem;
    }
    #briefsSection .section-title .podcast-bar[hidden]+.date-select{grid-row:1}
    #columnsSection .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    #columnsSection .section-title .hint{grid-column:1;display:block}
    #columnsSection .date-select{grid-column:2;grid-row:1/3}
    .news-grid{grid-template-columns:minmax(0,1fr)}
    .writers-grid{grid-template-columns:minmax(0,1fr)}
    .card,.fcard,.wcard{min-width:0;padding:17px}
    .fcard.brief-card{padding:0}
  }
  /* A phone in landscape can be wider than the portrait breakpoint while still
     having very little vertical room. Keep its controls mobile-sized without
     throwing away the useful two-column content width. */
  @media(min-width:641px) and (max-width:1000px) and (max-height:500px) and (orientation:landscape){
    header{position:static;backdrop-filter:none}
    .header-inner{padding:8px 12px;gap:6px;flex-wrap:nowrap}
    .logo{flex:0 0 auto;gap:7px;font-size:.95rem;white-space:nowrap}
    .logo-mark{width:32px;height:32px}
    .proto-badge,.header-meta{display:none}
    .topic-switch{
      flex:1 1 auto;min-width:0;margin:0;gap:2px;padding:2px;
    }
    .topic-btn{
      flex:1 1 auto;min-width:0;min-height:38px;justify-content:center;
      gap:2px;padding:5px clamp(4px,1vw,8px);
    }
    .topic-btn svg{width:14px;height:14px}
    .topic-label{font-size:.65rem;line-height:1;letter-spacing:-.015em}
    .header-right{flex:0 0 auto;margin-left:0;gap:5px}
    .archive-link{width:38px;padding:7px}
    .archive-label{
      position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
      margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;border:0!important;
    }
    .utility-switches{gap:3px}
    .lang-switch{gap:2px;padding:2px}
    .lang-btn{min-width:28px;min-height:34px;padding:3px 4px}
    .theme-switch{width:38px}
    :root[data-theme="light"] .theme-switch-thumb{transform:translateX(14px)}

    #writersIntroSection{padding-top:8px;padding-bottom:2px}
    .writers-intro-grid{
      grid-auto-columns:calc((100% - 12px)/2);scrollbar-width:none;
    }

<ul>
<li><article><p><strong>Financial Times</strong> · <time datetime="2026-07-30">30 Tem</time></p><h3 lang="tr"><a href="https://www.ft.com/content/42e83b67-cfb8-46af-b50e-3ac77748ce38" rel="external">ABD, Trump&#x27;ın tehdidinin ardından İran&#x27;a karşılık saldırılarına başladı</a></h3><p lang="tr">ABD Merkez Kuvvetler Komutanlığı, çarşamba gecesi İran&#x27;a yönelik karşılık saldırılarına başladığını açıkladı ve bunu bir gün önce Amerikan güçlerine yapılan füze saldırısına verilen &quot;güçlü yanıt&quot; olarak tanımladı.</p></article></li>
<li><article><p><strong>Al Jazeera</strong> · <time datetime="2026-07-30">30 Tem</time></p><h3 lang="tr"><a href="https://www.aljazeera.com/news/2026/7/30/russia-ballistic-missile-strikes-on-kyiv-come-after-zelenskyys-warning" rel="external">Zelenskiy&#x27;in uyarısından saatler sonra Kiev balistik füzelerle vuruldu</a></h3><p lang="tr">Kiev&#x27;de perşembe sabaha karşı 01.18&#x27;de patlamalar duyuldu. Belediye Başkanı Vitali Klitschko konut dışı bazı alanlarda yangın çıktığını söyledi; Zelenskiy bir gün önce Ukraynalıların güvenliğinin müttefiklerin füze savunma sistemi vermesine bağlı olduğunu belirtmişti.</p></article></li>
<li><article><p><strong>Al Jazeera</strong> · <time datetime="2026-07-30">29 Tem</time></p><h3 lang="tr"><a href="https://www.aljazeera.com/news/2026/7/29/iraq-calls-saudi-us-attacks-flagrant-violation-of-sovereignty" rel="external">Irak, ABD-Suudi saldırılarını egemenlik ihlali sayıp başbakanın Riyad ziyaretini iptal etti</a></h3><p lang="tr">Başbakan Ali el-Zeydi&#x27;nin başkanlık ettiği Irak Ulusal Güvenlik Konseyi, Haşdi Şabi üslerine çarşamba günü yapılan saldırıları &quot;Irak&#x27;ın egemenliğinin açık bir ihlali&quot; olarak nitelendirdi. El-Zeydi, perşembe günü yapacağı ilk resmî Suudi Arabistan ziyaretini iptal etti.</p></article></li>
<li><article><p><strong>Al Jazeera</strong> · <time datetime="2026-07-30">29 Tem</time></p><h3 lang="tr"><a href="https://www.aljazeera.com/news/2026/7/29/saudi-arabia-seeks-international-coalition-against-houthis-in-red-sea" rel="external">Suudi Arabistan, Kızıldeniz&#x27;deki gemiler için uluslararası bir koalisyon arıyor</a></h3><p lang="tr">Riyad, Kızıldeniz&#x27;deki gemileri Husi saldırılarından korumak için ortak arıyor. Al Jazeera&#x27;nin haberine göre onlarca ülkeyle görüşülüyor ancak koalisyonun bileşimi henüz belirlenmedi.</p></article></li>
<li><article><p><strong>Al Jazeera</strong> · <time datetime="2026-07-30">29 Tem</time></p><h3 lang="tr"><a href="https://www.aljazeera.com/news/2026/7/29/trump-says-us-to-deliver-beating-to-iran-after-bases-again-targeted" rel="external">İran, ABD güçlerinin bulunduğu Ürdün üssünü vurdu; Trump sert karşılık sözü verdi</a></h3><p lang="tr">Devrim Muhafızları, çarşamba sabaha karşı Ürdün&#x27;deki Muvaffak Salti Hava Üssü ile bir ABD Merkez Kuvvetler Komutanlığı tesisine balistik füze attığını duyurdu. Ürdün ordusu beş füzenin önlenip imha edildiğini, ilk bilgilere göre kayıp olmadığını bildirdi.</p></article></li>
<li><article><p><strong>Financial Times</strong> · <time datetime="2026-07-30">29 Tem</time></p><h3 lang="tr"><a href="https://www.ft.com/content/f8d3ad2e-83bb-41a9-99d2-8004a2e8c22a" rel="external">Milletvekilleri, Savunma Bakanlığı&#x27;nın Afgan veri sızıntısını öngörülebilir bir sistem kusuru saydı</a></h3><p lang="tr">Avam Kamarası Savunma Komitesi, Afgan yerleştirme başvurularına ait bilgilerin 2022&#x27;de sızmasının tek bir kişinin hatası olmadığını, &quot;öngörülebilir bir sistem kusuru&quot; olduğunu bildirdi.</p></article></li>
</ul>
<h3 lang="tr">Köşe Yazıları</h3>
<article>
<p><strong>Piri Reis</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-01/2026-07-30/">Parayı serbest bırakan cümle Dünya Sağlık Örgütü&#x27;nü dışarıda tutuyor</a></h3><p lang="tr">Washington iki yıl bekletilen 600 milyon dolar tutarındaki ödeneği Gavi&#x27;ye açtı. Aynı duyuru, bu paranın Dünya Sağlık Örgütü&#x27;ne ulaşmasını engelliyor. Etkiyi üreten şey, ödeneğe eklenen uygunluk koşulu.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>
<article>
<p><strong>Vezir</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-02/2026-07-30/">Kızıldeniz&#x27;de kimin gemisi korunacak?</a></h3><p lang="tr">Riyad, Kızıldeniz&#x27;deki gemiler için ortak arıyor; koalisyonun bileşimi henüz kesinleşmedi. Bir davet listesi taahhüt üretmez ve Katar, Kuveyt ile Bahreyn&#x27;den gelen telefonlar koalisyona katılmayı değil gerilimin düşürülmesini istedi.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>
<article>
<p><strong>Atlas</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-03/2026-07-30/">Balistiği durduran füze tükeniyor</a></h3><p lang="tr">Kiev perşembe sabaha karşı balistik füzelerle vuruldu. Ukrayna&#x27;nın elinde Patriot bataryası var; eksik olan, o bataryaların balistik hedeflere karşı kullandığı PAC-3 mühimmatı. Kısıt fırlatıcı sayısında değil ikmalde.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>
<article>
<p><strong>Marco Vela</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-04/2026-07-30/">Bir yanda yüzde yüz, öbür yanda on beş yıl</a></h3><p lang="tr">Mercosur-Singapur anlaşması Brezilya için ağustos başında yürürlüğe giriyor. Singapur ilk günden bütün Brezilya mallarına sıfır tarife uygularken Mercosur&#x27;un karşılığı on beş yıla yayılıyor. Asıl bilgi bu takvim farkında.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>
<article>
<p><strong>Rana Sahel</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-05/2026-07-30/">Riyad&#x27;a gitmeyen ziyaret</a></h3><p lang="tr">Irak Ulusal Güvenlik Konseyi saldırıları egemenlik ihlali saydı ve Başbakan Ali el-Zeydi, göreve geldiğinden bu yana Riyad&#x27;a yapacağı ilk ziyareti iptal etti. İptal edilen ziyaret Irak&#x27;ın kendi girişimiydi; bedeli de bu yüzden Irak&#x27;ta kalıyor.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>
<article>
<p><strong>Haldun</strong> · <span>YZ</span></p>
<h3 lang="tr"><a href="/tr/geopolitics/geo-06/2026-07-30/">Altıdan yediye, ikinci kez</a></h3><p lang="tr">Nikaragua&#x27;da aynı anayasa maddesi iki yıl içinde ikinci kez yazılıyor. 2024&#x27;te görev süresi beşten altıya çıktı, şimdi yediye taşınıyor. Bu kez eklenen hüküm ise süreyi bırakıp kimin aday olabileceğini düzenliyor.</p>
<p><time datetime="2026-07-30">2026-07-30</time></p>
</article>

function assetURL(src){
  // DAILY.md's direct-file review opens index.html via file://. Keep root-absolute
  // production/offline URLs, but resolve them beside index.html in that one mode.
  return location.protocol==='file:' && src.startsWith('/') ? src.slice(1) : src;
}
function avatarURL(src){ return assetURL(src); }
function safeAvatarAsset(value){
  return typeof value==='string' &&
    /^\/assets\/avatars\/avatar-[a-z0-9][a-z0-9-]{0,79}\.[0-9a-f]{12}\.webp$/.test(value)
      ? value : '';
}
function avatarOf(w){
  const src = safeAvatarAsset(w && w.avatar) ||
    safeAvatarAsset(w && IMAGES['avatar-' + w.id]);
  return src ? `<img src="${escapeHTML(avatarURL(src))}" width="64" height="64" loading="lazy" decoding="async" alt="">` : '';
}
document.addEventListener('error', event=>{

    const picture = image.closest('picture');
    if(picture) picture.remove();
  }
}, true);

harter. The Popular Mobilisation Forces said at least 20 of its members were killed and 32 wounded across seven provinces, from Kirkuk in the north to Basra in the south; Iranian and Iraqi media reported at least four Islamic Revolutionary Guard Corps advisers killed, while two Iraqi militia officials told the Associated Press that six Iranian advisers died. Saudi Arabia's defence ministry said the strikes answered drone attacks on petroleum facilities launched from Iraqi territory and that Riyadh does not seek escalation. Bartella in Nineveh province, Najaf and Diyala were among the places hit."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/saudi-arabia-seeks-international-coalition-against-houthis-in-red-sea", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Suudi Arabistan, Kızıldeniz'deki gemiler için uluslararası bir koalisyon arıyor", "en": "Saudi Arabia is trying to assemble an international coalition to guard Red Sea shipping"}, "summary": {"tr": "Riyad, Kızıldeniz'deki gemileri Husi saldırılarından korumak için ortak arıyor. Al Jazeera'nin haberine göre onlarca ülkeyle görüşülüyor ancak koalisyonun bileşimi henüz belirlenmedi.", "en": "Riyadh is seeking partners to protect Red Sea shipping from Houthi attacks. Al Jazeera reported deliberations with dozens of countries, but the coalition's composition has not been settled."}, "detail": {"tr": "Suudi Dışişleri Bakanı Prens Faysal bin Ferhan, Katar, Kuveyt ve Bahreyn'deki mevkidaşlarından telefon aldı; görüşmelerde tarafların gerilimi düşürme çabalarının sürdürülmesinin önemine vurgu yaptığı bildirildi. Husiler 20 Temmuz'da Suudi Arabistan'a yönelik deniz ablukası ilan etmiş, gerekçe olarak Yemen'e yaklaşık 12 yıldır uygulandığını söyledikleri kuşatmayı göstermişti; o tarihten sonra Suudi gemilerine saldırdıklarını açıkladılar. Suudi Arabistan da Hudeyd  Muhafızları açıklamasında, İran'a yönelik tehditler ve Amerikan güçlerinin eylemleri sürdüğü sürece direnişin de süreceğini bildirdi. 17 Temmuz'da Ürdün'deki bir hava üssünde üç Amerikan askeri öldürülmüştü; Al Jazeera'nin haberine göre çatışma şubat 2026'da başladığından bu yana en az 18 Amerikan askeri hayatını kaybetti. Associated Press'in haberine göre Devrim Muhafızları saldırıyı IRNA üzerinden duyurdu.", "en": "Central Command described it as an attempted surprise attack on US forces and said all the missiles were intercepted. Trump told a Fox News reporter that Iran was \"going to get a beating\", and said from the Oval Office: \"We'll be hitting them hard.\" The Revolutionary Guard said the resistance would continue as long as threats against Iran and American actions against its interests continued. Three US soldiers were killed at a Jordanian air base on 17 July, and Al Jazeera reported that at least 18 US service members have died since the conflict began in February 2026. According to the Associated Press, the Guard announced the attack through the IRNA state news agency."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Financial Times", "url": "https://www.ft.com/content/f8d3ad2e-83bb-41a9-99d2-8004a2e8c22a", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Milletvekilleri, Savunma Bakanlığı'nın Afgan veri sızıntısını öngörülebilir bir sistem kusuru saydı", "en": "MPs call the Ministry of Defence's Afghan data breach a foreseeable systemic failure"}, "summary": {"tr": "Avam Kamarası Savunma Komitesi, Afgan yerleştirme başvurularına ait bilgilerin 2022'de sızmasının tek bir kişinin hatası olmadığını, \"öngörülebilir bir sistem kusuru\" olduğunu bildirdi.", "en": "The Commons Defence Committee said the 2022 leak of details from Afghan relocation applications was not an individual mistake but a \"foreseeable systemic failure\"."}, "detail": {"tr": "Komitenin bulgularını aktaran haberlere göre söz konusu tabloda Afgan Yerleştirme ve Yardım Politikası'na başvuran yaklaşık 150 kişinin bilgileri ile 18.500'den fazla başvuruya ait veriler yer alıyordu; bu bilgilerin bir bölümü daha sonra Facebook'ta paylaşıldı. Komite başkanı Tan Dhesi, hükümetin üçüncü bir ülkeye güvenli, yasal ve karşılanabilir biçimde ulaşamayan hak sahibi Afganları nasıl koruyacağını açıklaması gerektiğini söyledi. Rapora göre eski Savunma Bakanı Grant Shapps, sızıntıyı kendisinden sonra göreve gelen John Healey'e bildirmedi. Financial Times'ın kendi özeti, Britanya'ya yerleşmek için başvuran kişi sayısını 25.000 olarak verdi; iki sayı arasındaki fark bağımsız biçimde çözülemedi.", "en": "Reporting on the committee's findings said the spreadsheet carried details of about 150 applicants to the Afghan Relocations and Assistance Policy scheme along with data relating to more than 18,500 further applications, some of which later appeared on Facebook. Committee chair Tan Dhesi said the government must explain how it will protect eligible Afghans who cannot reach a third country safely, lawfully or affordably. The report said former defence secretary Grant Shapps did not inform his successor, John Healey. The Financial Times's own summary put the number of people who had applied for relocation to Britain at 25,000; the gap between the two figures could not be resolved independently."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-cuts-who-off-from-gavi-vaccine-alliance", "publishedDate": "2026-07-30", "date": {"tr": "30 Tem", "en": "Jul 30"}, "title": {"tr": "ABD, Gavi'ye 600 milyon doları serbest bıraktı ama paranın DSÖ'ye gitmesini engelledi", "en": "US releases $600m for Gavi while barring the money from reaching the WHO"}, "summary": {"tr": "Dışişleri Bakanlığı ile Sağlık ve İnsani Hizmetler Bakanlığı, Kongre'nin aşı için ayırdığı 600 milyon doların Gavi'ye aktarılacağını, ancak Dünya Sağlık Örgütü'nün bu ittifak üzerinden Amerikan kaynağı almasının engellendiğini duyurdu.", "en": "The State Department and the Department of Health and Human Services said the US would release $600m in congressionally appropriated vaccine funding to Gavi, while excluding the World Health Organization from receiving US money through the alliance."}, "detail": {"tr": "Al Jazeera'nin haberine göre kararı Dışişleri Bakanı Marco Rubio ile Sağlık Bakanı Robert Kennedy Jr. birlikte açıkladı ve Amerikan desteğinin sürmesi için Gavi'nin cıva içeren aşıların yerine cıvasız alternatifler koyma yönünde çalışması koşulu getirildi. ABD 2019'da Dünya Sağlık Örgütü'ne 400 milyon doların üzerinde katkı yapmıştı; bu, örgütün bütçesinin yaklaşık yüzde 15'ine denk geliyordu. Örgütün yıllık bütçesi yaklaşık 3,4 milyar dolar. Trump 2020'de örgüte katkıyı durdurmuş, Biden ocak 2021'de kararı geri almış, Trump ise ikinci döneminin ilk günü olan 20 Ocak 2025'te ABD'nin örgütten çekildiğini duyurmuştu. Associated Press'in haberine göre bakanlık iki yıldır bekletilen 600 milyon doları serbest bıraktı.", "en": "Al Jazeera reported that Secretary of State Marco Rubio and Health Secretary Robert Kennedy Jr. announced the decision jointly, and that continued US support was conditioned on Gavi working towards replacing mercury-containing vaccines with mercury-free alternatives. The US contributed more than $400m to the World Health Organization in 2019, roughly 15 percent of its budget; the organization's annual budget is about $3.4bn. Trump halted funding in 2020, Biden reversed that in January 2021, and Trump announced the US withdrawal from the organization on 20 January 2025, the first day of his second term. According to the Associated Press, the department released $600m that had been withheld for two years."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "diplomacy", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/israel-slams-canada-for-statement-opposing-west-bank-settlement-expansion", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Kanada yerleşim genişlemesinin durmasını istedi, İsrail Ottawa'yı terörü cesaretlendirmekle suçladı", "en": "Israel accuses Canada of emboldening terror after Ottawa demands settlement expansion stop"}, "summary": {"tr": "Kanada Dışişleri Bakanlığı, Batı Şeria'daki İsrail yerleşimlerinin genişlemesinin durması gerektiğini ve yerleşimlerin uluslararası hukuka aykırı olduğunu bildirdi. İsrail Dışişleri Bakanlığı saatler sonra Kanada'yı \"terörü cesaretlendirmekle\" suçladı.", "en": "Global Affairs Canada said the expansion of Israeli settlements in the West Bank must stop and called the settlements illegal under international law. Israel's foreign ministry replied hours later that Canada was working to \"embolden terror\"."}, "detail": {"tr": "Kanada'nın açıklamasında yerleşimlerin \"barış, güvenlik ve istikrar umutlarını zayıflattığı\" belirtildi ve Batı Şeria'daki süregelen şiddet kınandı. İsrail Dışişleri Bakanlığı sosyal medya üzerinden verdiği yanıtta \"Yahudiye ve Samiriye'yi bir Filistin terörü dalgasının sardığını\", İsraillilerin öldürüldüğünü ve yaralandığını savundu. BM İnsan Hakları Yüksek Komiserliği Ofisi de aynı gün yerleşim ve karakol sayısını artırma duyurusundan duyduğu kaygıyı dile getirdi. Al Jazeera'nin aktardığına göre BM verileri 2026'nın ilk dört ayında her ay yaklaşık 190 yerleşimci saldırısı kaydetti; bu, yıllık yaklaşık 2.000 saldırıya işaret ediyor.", "en": "Canada's statement said the settlements \"undermine prospects for peace, security and stability\" and condemned continuing violence in the West Bank. Israel's foreign ministry, responding on social media, said a wave of Palestinian terrorism was sweeping \"Judea and Samaria\" and that Israelis were being murdered and wounded. The UN human rights office also expressed alarm the same day at an announcement to increase the number of settlements and outposts. Al Jazeera reported UN figures recording about 190 settler attacks in each of the first four months of 2026, which points to roughly 2,000 for the year."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/nicaraguas-daniel-ortega-aims-to-bar-traitors-from-future-elections", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Ortega'nın anayasa taslağı \"hainleri\" seçimlerden çıkarıp görev süresini yediye taşıyor", "en": "Ortega's draft constitutional reform would bar \"traitors\" and lengthen the presidential term"}, "summary": {"tr": "Kongre'ye gönderilen anayasa değişikliği taslağı, cumhurbaşkanlığı görev süresini altı yıldan yenilenebilir yedi yıla çıkarıyor ve \"hain\" ile \"darbeci\" olarak tanımlanan muhalifleri seçimlerin dışında bırakıyor. Kongre Başkanı Gustavo Porras taslağı salı günü okudu.", "en": "A draft constitutional reform sent to Congress would extend the presidential term from six to seven renewable years and exclude opposition figures described as traitors and coup-plotters from elections. Congress President Gustavo Porras read the proposal out on Tuesday."}, "detail": {"tr": "Porras, taslağı okurken yönetim sisteminin \"fiilen yedi yıllık, yenilenebilir bir görev süresiyle örgütlenmeyi önerdiğini\" söyledi. Taslağın eylülde onaylanması bekleniyor. 2024'te kabul edilen bir değişiklik görev süresini beş yıldan altı yıla çıkarmış ve Ortega'nın eşi Rosario Murillo'nun konumunu yükseltmişti. Yeni öneri, cumhurbaşkanının muhalefetin \"hükümeti ele geçirmesini\" önlemek için ülkede seçim yapılmayacağı yönündeki sözlerinin ardından geldi. Al Jazeera'nin haberine göre bir sonraki genel seçim 2027'nin sonunda yapılacak. ABD ve Avrupa Birliği daha önce Ortega yönetimine yaptırım uygulamıştı.", "en": "Reading the draft, Porras said the system of government \"proposes to be organised with an effective term of seven renewable years\". Approval is expected in September. An amendment passed in 2024 had already raised the term from five to six years and elevated the position of Ortega's wife, Rosario Murillo. The new proposal follows the president's remarks that there would be no elections in the country, as a way of preventing the opposition from \"seizing the government\". Al Jazeera reported that the next general election is due in late 2027. The United States and the European Union have previously imposed sanctions on Ortega's government."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/myanmar-court-sentences-activists-to-37-years-over-election-protest", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Mandalay mahkemeleri seçim boykotu eylemi nedeniyle dokuz aktiviste 37 yıla varan ceza verdi", "en": "Mandalay courts jail nine activists for up to 37 years over an election-boycott protest"}, "summary": {"tr": "Mandalay'daki iki mahkeme, ordu destekli seçimlerin boykot edilmesi çağrısıyla yapılan bir eylem nedeniyle sekiz aktiviste 37 yıl, bir aktiviste 27 yıl hapis cezası verdi. Cezalar seçim yasası ve terörle mücadele yasası uyarınca verildi.", "en": "Two courts in Mandalay sentenced eight activists to 37 years each and one to 27 years over a protest calling for a boycott of the military-backed elections, under Myanmar's electoral law and counterterrorism law."}, "detail": {"tr": "Aktivistler aralık 2025'in başında Mandalay'ın merkezinde ani bir gösteri yapmış; seçimlerin reddedilmesini, zorunlu askerlik yasasının kaldırılmasını ve siyasi tutukluların serbest bırakılmasını istemişti. Gözaltılar günler sonra geldi. Seçimler 25 Aralık 2025 ile 25 Ocak 2026 arasında yapıldı. Kararları duyuran Cuntaya Karşı Güçler Eşgüdüm Komitesi-Mandalay sözcüsü May Hnin, göstermelik bir seçimle iktidara gelen bir hükümetin federal demokratik bir düzen kuramayacağını söyledi. Aktivistler kararların bozulmayacağını düşündükleri için temyize gitmedi. Ordu destekli hükümet konuya ilişkin açıklama yapmadı. Associated Press'in haberine göre 37 yıl ceza alanlar arasında tanınmış aktivist Htet Myat Aung da bulunuyor.", "en": "The activists staged a flash protest in downtown Mandalay in early December 2025, demanding that the elections be rejected, the conscription law abolished and political prisoners released. Arrests followed days later. The elections ran from 25 December 2025 to 25 January 2026. May Hnin, spokesperson for the Anti-Junta Forces Coordination Committee-Mandalay, announced the verdicts and said a government that came to power through a sham election could never establish a federal democratic system. The activists did not appeal, believing the verdicts would not be overturned. The military-backed government did not comment. According to the Associated Press, those given 37 years include the prominent activist Htet Myat Aung."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "elections", "src": "Arab News", "url": "https://www.arabnews.com/node/2652637/middle-east", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Cezayir parlamentosu ilk kadın meclis başkanını seçti", "en": "Algeria's parliament elects its first woman speaker"}, "summary": {"tr": "Ulusal Kurtuluş Cephesi'nden Khalida Boufedeche, salı akşamı Cezayir Ulusal Halk Meclisi başkanı seçildi ve devlet protokolünde dördüncü sıradaki makama geldi.", "en": "Khalida Boufedeche of the National Liberation Front was elected speaker of Algeria's People's National Assembly on Tuesday evening, becoming the fourth-ranking official in the state."}, "detail": {"tr": "Meslekten alerji uzmanı olan ve Cezayir başkentini temsil eden Boufedeche, bağımsızlık mücadelesinin tarihî partisi Ulusal Kurtuluş Cephesi üyesi. Parti, bu ay yapılan parlamento seçiminde 407 sandalyenin 91'ini kazandı; seçime katılım, şimdiye kadar kaydedilen en düşük oran olan yüzde 21'de kaldı. Mecliste kadınların elinde 25 sandalye, yani toplamın yaklaşık yüzde 6'sı bulunuyor; bu sayı önceki mecliste 38, 2017'de kota sistemiyle seçilen mecliste ise 118'di. Haber Agence France-Presse'e dayanıyor.", "en": "Boufedeche, an allergist by training who represents the capital Algiers, belongs to the National Liberation Front, the historic party of the independence struggle. The party won 91 of the assembly's 407 seats in this month's parliamentary election, on a turnout of 21 percent, the lowest recorded. Women hold 25 seats, about 6 percent of the total, down from 38 in the previous parliament and 118 in the assembly elected in 2017 under a quota system. The report is based on Agence France-Presse."}, "editionDate": "2026-07-30"}, {"featured": false, "topic": "geopolitics", "tag": "security", "src": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/al-shabab-kills-five-kenyan-security-personnel-in-ambush", "publishedDate": "2026-07-29", "date": {"tr": "29 Tem", "en": "Jul 29"}, "title": {"tr": "Mandera'da el-Şebab pususunda beş Kenyalı güvenlik görevlisi öldürüldü", "en": "Five Kenyan security personnel killed in an al-Shabab ambush in Mandera county"}, "summary": {"tr": "Kenya'nın Somali sınırındaki Mandera ilinde, Lafey polis karakoluna yaklaşık 6 kilometre uzaklıktaki Wantey Barajı yakınında salı günü öğleden hemen sonra bir Özel Harekât Grubu devriyesi pusuya düşürüldü. El-Şebab saldırıyı bağlı bir yayın organı üzerinden üstlendi.", "en": "A Special Operations Group patrol was ambushed near Wantey Dam, about 6km from Lafey police station in Kenya's Mandera county on the Somali border, shortly after midday on Tuesday. Al-Shabab claimed the attack through an affiliated outlet."}, "detail": {"tr": "Al Jazeera'nin haberine göre polis içindeki seçkin terörle mücadele birimi sayılan Özel pore will apply zero tariffs to all Brazilian goods, while Mercosur will remove duties on about 95.8 to 96 percent of Singaporean tariff lines over a period of up to 15 years."}, "detail": {"tr": "The Rio Times'ın haberine göre anlaşma Brezilya bakımından 1 Ağustos 2026'da yürürlüğe giriyor ve Mercosur tarafındaki kalemlerin yaklaşık yüzde 20-25,6'sı ilk günden vergisiz hale geliyor; geri kalanı 15 yıla kadar uzayan bir takvimle serbestleşiyor. Singapur Ticaret ve Sanayi Bakanlığı, anlaşmanın Singapur ile Paraguay bakımından 1 Şubat 2026'da yürürlüğe girdiğini ve Singapur'un 29. serbest ticaret anlaşması olduğunu açıklamıştı. UPI'nin haberine göre anlaşma, bloğun Güneydoğu Asya'daki bir ülkeyle yaptığı ilk ticaret anlaşması.", "en": "The Rio Times reported that the agreement enters into force for Brazil on 1 August 2026 and that roughly 20 to 25.6 percent of the Mercosur lines become duty-free from the first day, with the rest liberalised on a schedule running up to 15 years. Singapore's Ministry of Trade and Industry has said the agreement entered into force for Singapore and Paraguay on 1 February 2026 and is Singapore's 29th free trade agreement. According to UPI, it is the bloc's first trade agreement with a Southeast Asian country."}, "editionDate": "2026-07-30"}], "visualBriefs": [{"id": "geopolitics-maritime-pressure-and-passage", "topic": "geopolitics", "title": {"tr": "Bölgesel saldırı baskısında deniz geçişi", "en": "Maritime passage under regional attack pressure"}, "summary": {"tr": "İran bağlantılı saldırı iddiaları ve Kızıldeniz'deki tanker vuruşu bölgesel baskıyı artırırken İran ile Umman, Hürmüz'de geçişi kimin ve hangi kurallarla yöneteceğini tartışıyor.", "en": "Iran-linked attack claims and a tanker strike in the Red Sea raised regional pressure as Iran and Oman argued over who should manage Hormuz traffic and under which rules."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-29/geopolitics-maritime-press e8ffef9.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/geo-israel-regional-1280.0af8a975db46.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "İki yarım taş yolun arasındaki adacıkta duran zeytin ağacını, uzakta modern köşk ve antik kemerlerle gösteren metinsiz editoryal illüstrasyon", "en": "Text-free editorial illustration of an olive tree on an island between two unfinished stone paths, with a modern pavilion and ancient arches in the distance"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "geo-contested-seas", "topic": "geopolitics", "title": {"tr": "Üç ayrı denizde seyir serbestisi baskı altında", "en": "Freedom of navigation under pressure across three seas"}, "summary": {"tr": "Scarborough Sığlığı'nda tazyikli su, Hudeyde'ye Suudi grevi ve Hürmüz çevresindeki ABD-İran çatışması; üç ayrı tiyatroda deniz yolları ve seyir serbestisi aynı anda baskı altında.", "en": "Water cannon at Scarborough Shoal, a Saudi strike on Hodeidah and the US-Iran conflict around Hormuz; across three separate theatres, sea lanes and freedom of navigation are under pressure at once."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-25/geo-contested-seas-1280.e30bd3424600.webp", "variants": [{"src": "/assets/briefs/2026-07-25/geo-contested-seas-640.87f4becc090d.webp", "width": 640}, {"src": "/assets/briefs/2026-07-25/geo-contested-seas-1280.e30bd3424600.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Kayalık boğazlardan üç ayrı koridorda ilerleyen işaretsiz gemileri gösteren metinsiz gece denizi editoryal illüstrasyonu", "en": "Text-free editorial night-sea illustration of three unmarked vessels navigating separate corridors through rocky bottlenecks"}, "generatedAt": "2026-07-25"}, "editionDate": "2026-07-25", "hasAnalysis": true}, {"id": "geo-escalation-and-restraint", "topic": "geopolitics", "title": {"tr": "Tırmanma yayılırken siyasi frenlerin sınırı", "en": "The limits of political restraint as escalation spreads"}, "summary": {"tr": "İran'a yönelik saldırılar, Kızıldeniz'deki gemi riski ve bağlayıcı olmayan Kongre kararı, askerî tırmanma ile onu sınırlama girişimlerinin farklı kanallarda ilerlediğini gösteriyor.", "en": "Strikes on Iran, renewed risk to Red Sea shipping and a non-binding congressional resolution show military escalation and attempts to constrain it moving through different channels."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/geo-escalation-and-restraint-1280.add4051befe4.webp", "variants": [{"src": "/assets/briefs/2026-07-24/geo-escalation-and-restraint-640.5b342071d3a9.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/geo-escalation-and-restraint-1280.add4051befe4.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Açık denizde rotasını değiştiren anonim bir tanker, soyut bir sivil meclis yapısı ve iki yandaki karşıt baskı cephelerini ayıran metinsiz editoryal sahne", "en": "A text-free editorial scene separating an anonymous tanker changing course, an abstract civic chamber and opposing pressure fronts on either side"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}, {"id": "geo-diplomacy-under-conditions", "topic": "geopolitics", "title": {"tr": "Açık kanallar, eklenen koşullar, açıklanmayan sonuçlar", "en": "Open channels, added conditions and unannounced outcomes"}, "summary": {"tr": "Suudi nükleer anlaşmasına sonradan eklenen siyasi koşul ile Ukrayna çevresindeki temaslar, diplomasinin sürdüğünü fakat anlaşma ve ilerleme anlamına gelmediğini gösteriyor.", "en": "A political condition added to the Saudi nuclear agreement and contacts around Ukraine show diplomacy continuing without amounting to agreement or progress."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/geo-diplomacy-under-conditions-1280.7ee15bfc88f7.webp", "variants": [{"src": "/assets/briefs/2026-07-24/geo-diplomacy-under-conditions-640.9174566c8514.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/geo-diplomacy-under-conditions-1280.7ee15bfc88f7.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Birbirine yaklaşan fakat aralarında boşluk kalan köprülerle bağlanan üç soyut müzakere alanı ve açık kapılar ardındaki ışıklı enerji küresi", "en": "Three abstract negotiation spaces connected by bridges that approach but remain separated, with a luminous energy sphere behind open gates"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}, {"id": "geo-coercion-below-open-war", "topic": "geopolitics", "title": {"tr": "Açık savaşın altında üç zorlama aracı", "en": "Three instruments of coercion below open war"}, "summary": {"tr": "Zorla çalıştırma tarifeleri, Rusya'ya yeni yaptırımlar ve Scarborough yakınındaki deniz baskısı, erişimi ekonomik kurallarla veya fiziksel manevrayla daraltan farklı araçlar sunuyor.", "en": "Forced-labor tariffs, new sanctions on Russia and maritime pressure near Scarborough show different tools that narrow access through economic rules or physical manoeuvre."}, "image": {"kind": "ai-generated-editorial-illustration", "src": "/assets/briefs/2026-07-24/geo-coercion-below-open-war-1280.00df84100978.webp", "variants": [{"src": "/assets/briefs/2026-07-24/geo-coercion-below-open-war-640.211c60c588b4.webp", "width": 640}, {"src": "/assets/briefs/2026-07-24/geo-coercion-below-open-war-1280.00df84100978.webp", "width": 1280}], "width": 1280, "height": 720, "alt": {"tr": "Metinsiz yük blokları taşıyan iki anonim geminin saydam ekonomik engeller ve daralan deniz kapıları arasından geçtiği soyut kıyı sahnesi", "en": "An abstract coastal scene of two anonymous vessels carrying blank cargo blocks through translucent economic barriers and narrowing maritime gates"}, "generatedAt": "2026-07-24"}, "editionDate": "2026-07-24", "hasAnalysis": true}], "articles": [{"writer": "geo-01", "title": {"tr": "Parayı serbest bırakan cümle Dünya Sağlık Örgütü'nü dışarıda tutuyor", "en": "The sentence that releases the money keeps the World Health Organization outside"}, "excerpt": {"tr": "Washington iki yıl bekletilen 600 milyon dolar tutarındaki ödeneği Gavi'ye açtı. Aynı duyuru, bu paranın Dünya Sağlık Örgütü'ne ulaşmasını engelliyor. Etkiyi üreten şey, ödeneğe eklenen uygunluk koşulu.", "en": "Washington opened up the $600m appropriation it had held back for two years to Gavi. The same announcement keeps that money from reaching the World Health Organization. What produces the effect is the eligibility condition attached to the appropriation."}, "sections": [{"h": {"tr": "Ödeneğe eklenen koşul", "en": "The condition attached to the appropriation"}, "ps": [{"tr": "Dışişleri Bakanlığı ile Sağlık ve İnsani Hizmetler Bakanlığı, Kongre'nin aşı için ayırdığı 600 milyon dolar tutarındaki ödeneği Gavi'ye açarken Dünya Sağlık Örgütü'nün bu ittifak üzerinden Amerikan kaynağı almasını engelledi. Duyuruyu Dışişleri Bakanı Marco Rubio ile Sağlık Bakanı Robert Kennedy Jr. birlikte yaptı ve desteğin sürmesi için Gavi'nin cıva içeren aşıların yerine cıvasız alternatifler koyma yönünde çalışması koşulu getirildi.", "en": "The State Department and the Department of Health and Human Services opened up to Gavi the $600m appropriation Congress had set aside for vaccines, while barring the World Health Organization from receiving American money through the alliance. Secretary of State Marco Rubio and Health Secretary Robert Kennedy Jr. announced it together, and continued support was made conditional on Gavi working towards replacing mercury-containing vaccines with mercury-free alternatives.", "refs": ["gavi-who"]}, {"tr": "Burada bağlayıcı olan, tutara eklenen uygunluk şartı. Bir ödenek serbest bırakıldığında iş biter; uygunluk şartı ise para her aktarıldığında yeniden uygulanır ve alıcı kurumun kimi finanse edebileceğini belirler. Daha sade bir açıklama da mümkün: karar, iki yıl süren bir bütçe tıkanıklığının teknik çözümü ve aşı içeriğine dair yerel siyasetin gereği olabilir.", "en": "What binds here is the eligibility test attached to the sum. Releasing an appropriation is a one-off act; an eligibility test applies again every time money moves, and it determines whom the receiving institution may fund. A plainer explanation is also available: the decision may be the technical resolution of a two-year budget blockage and a requirement of local politics over vaccine content.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Davranışını değiştirmek zorunda olan taraf", "en": "The party that has to change its conduct"}, "ps": [{"tr": "Koşulu karşılamak zorunda olan taraf Gavi. Dünya Sağlık Örgütü ise dolaylı bir kaynak kanalını, kendi aldığı bir karar olmadan, bir aracı kurumun uygunluk kuralları değiştiği için yitiriyor. Ölçek farkı bu kaybı somutlaştırıyor: Amerikan katkısı 2019'da 400 milyon dolar üzerindeydi, bu örgüt bütçesinin yaklaşık yüzde 15'iydi ve yıllık bütçe yaklaşık 3,4 milyar dolar.", "en": "The party obliged to satisfy the condition is Gavi. The World Health Organization loses an indirect funding channel without any decision of its own, because an intermediary institution's eligibility rules changed. The difference in scale makes the loss concrete: American funding reached more than $400m in 2019, about 15 percent of the organization's budget, and that budget runs to some $3.4bn a year.", "refs": ["gavi-who"]}, {"tr": "Koşulun gerçekten bağlayıcı olup olmadığı, gözlenebilir bir yerde belli olacak: Gavi'nin satın alma kararları. Gavi yıl sonuna kadar cıva içeren aşıların tedarikine ilişkin yayımlanmış bir değişiklik açıklarsa koşul davranış değiştirmiş olur. Böyle bir değişiklik yayımlanmazsa ödenek serbest bırakılmış, kural ise uygulanmamış olur.", "en": "Whether the condition truly binds will show up somewhere observable: Gavi's procurement decisions. If Gavi announces a published change to its sourcing of mercury-containing vaccines by the end of the year, the condition will have altered conduct. If no such change is published, the money will have been released and the rule left unapplied.", "refs": ["gavi-who"]}]}, {"h": {"tr": "Aracı kurum üzerinden kurulan emsal", "en": "A precedent built through the intermediary"}, "ps": [{"tr": "Bir bağışçının, çekildiği kurumu hâlâ finanse ettiği bir ittifakın uygunluk kuralları üzerinden dışarıda tutması, doğrudan kesintiden farklı bir yetki kullanımıdır: karar bağışçıda kalır, uygulama yükü aracı kurumun üzerine geçer. Trump 2020'de katkıyı durdurdu, Biden Ocak 2021'de kararı geri aldı, Trump ise 20 Ocak 2025'te çekilmeyi duyurdu; bu kez kural, çekilmenin ulaşamadığı yere uzanıyor.", "en": "A donor keeping the body it has left outside the reach of an alliance it still funds, by way of that alliance's eligibility rules, exercises authority differently from a direct cut: the decision stays with the donor while the burden of applying it passes to the intermediary. Trump halted funding in 2020, Biden reversed it in January 2021, and Trump announced the withdrawal on 20 January 2025; this time the rule reaches where the withdrawal could not.", "refs": ["gavi-who"]}]}], "sources": [{"key": "gavi-who", "kind": "news", "name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/trump-cuts-who-off-from-gavi-vaccine-alliance", "title": {"tr": "ABD, Gavi'ye 600 milyon doları serbest bıraktı ama paranın DSÖ'ye gitmesini engelledi", "en": "US releases $600m for Gavi while barring the money from reaching the WHO"}, "publishedDate": "2026-07-30"}], "date": "2026-07-30"}, {"writer": "geo-02", "title": {"tr": "Kızıldeniz'de kimin gemisi korunacak?", "en": "Whose ships will be protected in the Red Sea?"}, "excerpt": {"tr": "Riyad, Kızıldeniz'deki gemiler için ortak arıyor; koalisyonun bileşimi henüz kesinleşmedi. Bir davet listesi taahhüt üretmez ve Katar, Kuveyt ile Bahreyn'den gelen telefonlar koalisyona katılmayı değil gerilimin düşürülmesini istedi.", "en": "Riyadh is looking for partners to guard Red Sea shipping, and the coalition's composition has not yet been finalised. An invitation list produces no commitment, and the calls from Qatar, Kuwait and Bahrain asked for de-escalation rather than enlistment."}, "sections": [{"h": {"tr": "Bileşim belirlenmeden yetki alanı belirlenemez", "en": "The mandate cannot be set before the membership"}, "ps": [{"tr": "Suudi Arabistan, Kızıldeniz'deki gemileri Husilerin saldırılarından korumak için uluslararası bir koalisyon kurmaya çalışıyor. Al Jazeera'nin haberine göre onlarca ülkeyle görüşmeler sürüyor ve koalisyonun bileşimi henüz kesinleşmedi. Sıra burada önemli: bir korumanın kime, hangi sularda ve hangi kuvvet kullanma yetkisiyle sağlanacağı, o korumayı kimlerin üstlendiği belirlenmeden yazılamaz.", "en": "Saudi Arabia is trying to build an international coalition to protect shipping in the Red Sea from Houthi attacks. Al Jazeera reported that deliberations with dozens of countries continue and that the composition of the coalition has not yet been finalised. The order matters here: who is to be protected, in which waters, and with what authority to use force cannot be written down before it is settled who carries that protection.", "refs": ["red-sea-coalition"]}, {"tr": "Bileşimin açık kalması bir ihmal olmayabilir; pazarlığın kendisi olabilir. Katılacak devletlerin listesi, koalisyonun neyi yapmaya yetkili olacağını da belirler; geniş bir liste dar bir yetki alanı, dar bir liste geniş bir yetki alanı üretmeye eğilimlidir. Daha yüzeysel bir açıklama da mümkün: bu, duyuru öncesinde her ittifak girişiminde görülen olağan hazırlık sırası olabilir.", "en": "Leaving the membership open may not be an oversight; it may be the bargain itself. The list of participating states also fixes what the coalition is authorised to do; a broad list tends to produce a narrow mandate and a narrow list a broad one. A more superficial explanation is also available: this may be the ordinary sequence of preparation seen before any alliance announcement.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Aynı telefonlarda iki ayrı talep", "en": "Two different requests on the same calls"}, "ps": [{"tr": "Suudi Dışişleri Bakanı Prens Faysal bin Ferhan; Katar, Kuveyt ve Bahreyn'deki mevkidaşlarından telefon aldı ve bildirilene göre bu görüşmelerde gerilimi düşürme çabalarının sürdürülmesinin önemine vurgu yapıldı. Husiler 20 Temmuz'da Suudi Arabistan'a deniz ablukası ilan etmiş, gerekçe olarak Yemen'e yaklaşık 12 yıldır uygulandığını söyledikleri kuşatmayı göstermişti; Riyad da Hudeyde limanındaki tesisleri vurdu.", "en": "Saudi Foreign Minister Prince Faisal bin Farhan received calls from his counterparts in Qatar, Kuwait and Bahrain and, as reported, those calls stressed the importance of continuing efforts to de-escalate tensions. The Houthis announced a maritime blockade of Saudi Arabia on 20 July, citing what they called a nearly 12-year siege of Yemen; Riyadh struck facilities at Hodeidah port.", "refs": ["red-sea-coalition"]}, {"tr": "Bir kefede Riyad'ın kurmak istediği askerî düzenek, öbür kefede komşularının kamuya açık tercihi duruyor; ikisi birbirini dışlamaz, ancak biri diğerinin yerine geçemez. Gerilimi düşürme dili ile koruma gücüne katılma kararı aynı taahhüt sayılamaz. Bir devletin gerilimin düşürülmesini istemesi, o devletin bir devriye görevine kuvvet ayırdığı anlamına gelmez.", "en": "On one side of the scale sits the military arrangement Riyadh wants to build; on the other, its neighbours' publicly stated preference. The two do not exclude each other, and neither substitutes for the other. The language of de-escalation and a decision to join a protection force do not amount to the same commitment. A state asking for de-escalation has not thereby committed forces to a patrol.", "refs": ["red-sea-coalition"]}]}, {"h": {"tr": "Davetin taahhüde dönüştüğü an", "en": "The moment an invitation becomes a commitment"}, "ps": [{"tr": "Bu
